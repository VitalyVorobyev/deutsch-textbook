name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   — scoped to "Cloudflare Pages: Edit" on this account
#   CLOUDFLARE_ACCOUNT_ID
# The R2 credentials in the local setenv.sh are a different, narrower token and
# are not used here.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://atlas.vitavision.dev
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate content
        run: bun run validate

      - name: Build
        run: bun run build
        env:
          # No BASE_PATH: Pages serves at the root of atlas.vitavision.dev.
          SITE_URL: https://atlas.vitavision.dev
          # The reviewed recordings ship here too. 41 MP3s at 64 kbps mono is 14.2 MB against a
          # 69 MB site, and a learner fetches one only when they open the item. Withholding them
          # would have left the public site speaking browser TTS over scripts that were recorded,
          # reviewed and approved. `src/lib/audio.ts` explains what the flag now means.
          PUBLIC_ATLAS_AUDIO_BUNDLE: '1'

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=deutsch-atlas --branch=main
