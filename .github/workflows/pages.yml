name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate content
        run: bun run validate

      - name: Build for Pages
        run: bun run build
        env:
          SITE_URL: https://vitalyvorobyev.github.io
          BASE_PATH: /deutsch-textbook
          # The reviewed recordings ship here too. 41 MP3s at 64 kbps mono is 14.2 MB against a
          # 69 MB site and a 1 GB Pages limit, and a learner fetches one only when they open the
          # item. Withholding them would have left the public demo speaking browser TTS over
          # scripts that were recorded, reviewed and approved — a worse demo for no saving worth
          # having. `src/lib/audio.ts` explains what the flag now means.
          PUBLIC_ATLAS_AUDIO_BUNDLE: '1'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
