<svg xmlns="http://www.w3.org/2000/svg" width="360" height="446" viewBox="0 0 360 446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Wie ein Gesetz entsteht</title>
  <desc>1 Bundesregierung, Bundestag oder Bundesrat bringt einen Gesetzentwurf ein. 2 Der Bundestag berät und beschließt das Gesetz. 3 Der Bundesrat stimmt zu oder kann Einspruch einlegen. 4 Der Bundespräsident prüft und unterschreibt das Gesetz. 5 Bundesgesetzblatt: Das Gesetz wird veröffentlicht und gilt.</desc>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1c1917"/>
    </marker>
  </defs>
  <rect width="360" height="446" fill="#ffffff"/>

  <!-- Wer? -->
  <g fill="#ffffff" stroke="#44403c" stroke-width="1.5">
    <rect x="6" y="6" width="348" height="58" rx="7"/>
    <rect x="6" y="112" width="348" height="42" rx="7"/>
    <rect x="6" y="202" width="348" height="42" rx="7"/>
    <rect x="6" y="292" width="348" height="42" rx="7"/>
    <rect x="6" y="382" width="348" height="58" rx="7"/>
  </g>
  <g fill="#1c1917" font-size="15.5" font-weight="600">
    <text x="48" y="30">Bundesregierung, Bundestag</text>
    <text x="48" y="50">oder Bundesrat</text>
    <text x="48" y="138.5">Bundestag</text>
    <text x="48" y="228.5">Bundesrat</text>
    <text x="48" y="318.5">Bundespräsident</text>
    <text x="48" y="406">Bundesgesetzblatt</text>
  </g>
  <text x="48" y="428" fill="#1c1917" font-size="14.5">Das Gesetz wird veröffentlicht und gilt.</text>

  <!-- Schritte -->
  <g fill="#92400e">
    <circle cx="28" cy="35" r="10"/>
    <circle cx="28" cy="133" r="10"/>
    <circle cx="28" cy="223" r="10"/>
    <circle cx="28" cy="313" r="10"/>
    <circle cx="28" cy="411" r="10"/>
  </g>
  <g fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">
    <text x="28" y="40">1</text>
    <text x="28" y="138">2</text>
    <text x="28" y="228">3</text>
    <text x="28" y="318">4</text>
    <text x="28" y="416">5</text>
  </g>

  <!-- Was passiert? -->
  <g stroke="#1c1917" stroke-width="2" marker-end="url(#pfeil)">
    <line x1="28" y1="64" x2="28" y2="112"/>
    <line x1="28" y1="154" x2="28" y2="202"/>
    <line x1="28" y1="244" x2="28" y2="292"/>
    <line x1="28" y1="334" x2="28" y2="382"/>
  </g>
  <g fill="#1c1917" font-size="14.5">
    <text x="44" y="93">bringt einen Gesetzentwurf ein</text>
    <text x="44" y="183">berät und beschließt das Gesetz</text>
    <text x="44" y="273">stimmt zu oder kann Einspruch einlegen</text>
    <text x="44" y="363">prüft und unterschreibt das Gesetz</text>
  </g>
</svg>
