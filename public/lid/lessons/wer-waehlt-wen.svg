<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Wer wählt wen?</title>
  <desc>1 Das Volk wählt den Bundestag. 2 Der Bundespräsident schlägt einen Kanzler vor. 3 Der Bundestag wählt den Kanzler. 4 Der Bundespräsident ernennt den Kanzler. 5 Der Kanzler schlägt die Minister vor. 6 Der Bundespräsident ernennt die Minister. Den Bundespräsidenten wählt die Bundesversammlung.</desc>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1c1917"/>
    </marker>
  </defs>
  <rect width="360" height="420" fill="#ffffff"/>

  <!-- Organe -->
  <g fill="#ffffff" stroke="#44403c" stroke-width="1.5">
    <rect x="6" y="8" width="136" height="42" rx="21"/>
    <rect x="6" y="110" width="136" height="42" rx="7"/>
    <rect x="182" y="110" width="172" height="42" rx="7"/>
    <rect x="6" y="222" width="136" height="68" rx="7"/>
    <rect x="262" y="222" width="92" height="190" rx="7"/>
    <rect x="6" y="370" width="136" height="42" rx="7"/>
  </g>
  <g fill="#1c1917" font-size="15.5" font-weight="600" text-anchor="middle">
    <text x="74" y="34.5">Volk</text>
    <text x="74" y="136.5">Bundestag</text>
    <text x="268" y="136.5">Bundesversammlung</text>
    <text x="74" y="261.5">Bundeskanzler</text>
    <text x="308" y="311">Bundes-</text>
    <text x="308" y="331">präsident</text>
    <text x="74" y="396.5">Bundesminister</text>
  </g>

  <!-- Pfeile -->
  <g stroke="#1c1917" stroke-width="2" marker-end="url(#pfeil)">
    <line x1="34" y1="50" x2="34" y2="110"/>
    <line x1="262" y1="240" x2="142" y2="240"/>
    <line x1="34" y1="152" x2="34" y2="222"/>
    <line x1="262" y1="272" x2="142" y2="272"/>
    <line x1="34" y1="290" x2="34" y2="370"/>
    <line x1="262" y1="391" x2="142" y2="391"/>
    <line x1="308" y1="152" x2="308" y2="222"/>
  </g>

  <!-- Schritte: Nummer und Verb -->
  <g fill="#92400e">
    <circle cx="56" cy="80" r="10"/>
    <circle cx="160" cy="227" r="10"/>
    <circle cx="56" cy="187" r="10"/>
    <circle cx="160" cy="286" r="10"/>
    <circle cx="56" cy="330" r="10"/>
    <circle cx="160" cy="378" r="10"/>
  </g>
  <g fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">
    <text x="56" y="85">1</text>
    <text x="160" y="232">2</text>
    <text x="56" y="192">3</text>
    <text x="160" y="291">4</text>
    <text x="56" y="335">5</text>
    <text x="160" y="383">6</text>
  </g>
  <g fill="#1c1917" font-size="14.5">
    <text x="72" y="85">wählt</text>
    <text x="176" y="232">schlägt vor</text>
    <text x="72" y="192">wählt</text>
    <text x="176" y="291">ernennt</text>
    <text x="72" y="335">schlägt vor</text>
    <text x="176" y="383">ernennt</text>
    <text x="300" y="192" text-anchor="end">wählt</text>
  </g>
</svg>
