<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc">
  <title id="title">Stellenanzeige für eine Teilzeitstelle im Verkauf</title>
  <desc id="desc">Simulierte Stellenanzeige der Nordlicht Markt GmbH mit Aufgaben, Voraussetzungen, Angebot und Kontaktdaten.</desc>
  <rect width="760" height="1040" fill="#f5f5f4"/>
  <rect x="42" y="36" width="676" height="968" rx="10" fill="#fff" stroke="#78716c" stroke-width="2"/>

  <rect x="42" y="36" width="676" height="170" rx="10" fill="#1c4f63"/>
  <path d="M42 196h676v10H42z" fill="#d97706"/>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 82h68v68H92z"/>
    <path d="M108 82V66h36v16M109 116h34M126 99v34"/>
  </g>
  <text x="190" y="84" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="2">NORDLICHT MARKT GMBH</text>
  <text x="190" y="126" fill="#fff" font-family="system-ui, sans-serif" font-size="31" font-weight="850">Kollegen (m/w/d)</text>
  <text x="190" y="161" fill="#fff" font-family="system-ui, sans-serif" font-size="25" font-weight="650">für den Verkauf gesucht</text>

  <g font-family="system-ui, sans-serif" fill="#292524">
    <rect x="76" y="238" width="608" height="82" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="100" y="269" fill="#075985" font-size="15" font-weight="800" letter-spacing="1.2">AUF EINEN BLICK</text>
    <text x="100" y="299" font-size="18" font-weight="650">ab September · Teilzeit, 25 Stunden · Hamburg-Altona</text>

    <text x="76" y="375" fill="#075985" font-size="21" font-weight="850">Ihre Aufgaben</text>
    <line x1="76" y1="388" x2="684" y2="388" stroke="#bae6fd" stroke-width="3"/>
    <g font-size="18">
      <circle cx="91" cy="425" r="5" fill="#075985"/><text x="110" y="432">Kunden freundlich beraten</text>
      <circle cx="91" cy="465" r="5" fill="#075985"/><text x="110" y="472">Waren präsentieren</text>
      <circle cx="91" cy="505" r="5" fill="#075985"/><text x="110" y="512">an der Kasse arbeiten</text>
    </g>

    <rect x="66" y="548" width="628" height="184" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="88" y="583" fill="#9a3412" font-size="21" font-weight="850">Voraussetzungen</text>
    <text x="88" y="610" fill="#57534e" font-size="14" font-weight="700">DAS BRINGEN SIE MIT</text>
    <g font-size="18">
      <path d="M91 647l7 7 14-17" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="127" y="655">Erfahrung im Verkauf</text>
      <path d="M91 686l7 7 14-17" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="127" y="694">gute Deutschkenntnisse</text>
      <path d="M91 725l7 7 14-17" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="127" y="733">zuverlässige und selbstständige Arbeitsweise</text>
    </g>

    <rect x="66" y="756" width="628" height="150" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="88" y="791" fill="#166534" font-size="21" font-weight="850">Wir bieten</text>
    <text x="88" y="818" fill="#57534e" font-size="14" font-weight="700">DAS ERWARTET SIE BEI UNS</text>
    <g font-size="18">
      <text x="90" y="854" fill="#166534" font-weight="850">+</text><text x="118" y="854">eine Stelle in Teilzeit</text>
      <text x="90" y="886" fill="#166534" font-weight="850">+</text><text x="118" y="886">jedes Jahr eine Weiterbildung · ein freundliches Team</text>
    </g>

    <line x1="76" y1="942" x2="684" y2="942" stroke="#d6d3d1" stroke-width="2"/>
    <text x="76" y="972" fill="#57534e" font-size="14" font-weight="750">Bewerbung bis 15. August · Frau Laura Berger</text>
    <text x="76" y="994" fill="#075985" font-size="15" font-weight="700">bewerbung@nordlicht-markt.example</text>
  </g>
</svg>
