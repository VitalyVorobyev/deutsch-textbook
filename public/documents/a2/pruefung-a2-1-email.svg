<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 804" role="img" aria-labelledby="title description">
  <title id="title">E-Mail: Endlich in der neuen Wohnung!</title>
  <desc id="description">E-Mail von Jana Krüger an Tom Becker. Betreff: Endlich in der neuen Wohnung!</desc>
  <rect x="1" y="1" width="478" height="802" rx="14" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <path d="M1 15 a14 14 0 0 1 14 -14 H465 a14 14 0 0 1 14 14 V46 H1 Z" fill="#e2e8f0"/>
  <circle cx="24" cy="24" r="7" fill="#ef4444"/>
  <circle cx="46" cy="24" r="7" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="7" fill="#22c55e"/>
  <text x="240" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#334155">E-Mail</text>
  <text x="24" y="80" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">Von:</text>
  <text x="110" y="80" font-family="system-ui, sans-serif" font-size="17" fill="#172033">Jana Krüger</text>
  <text x="24" y="110" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">An:</text>
  <text x="110" y="110" font-family="system-ui, sans-serif" font-size="17" fill="#172033">Tom Becker</text>
  <text x="24" y="140" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">Betreff:</text>
  <text x="110" y="140" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#172033">Endlich in der neuen Wohnung!</text>
  <path d="M24 162 H456" stroke="#cbd5e1" stroke-width="2"/>
  <text x="24" y="192" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Hallo Tom,</text>
  <text x="24" y="228" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">seit zwei Wochen wohne ich jetzt in Freiburg.</text>
  <text x="24" y="254" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Die Wohnung ist kleiner als meine alte in Köln,</text>
  <text x="24" y="280" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">aber sie hat einen großen Balkon. Von dort</text>
  <text x="24" y="306" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">sieht man die Berge – wunderschön!</text>
  <text x="24" y="342" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Der Umzug war anstrengend. Mein Bruder wollte</text>
  <text x="24" y="368" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">mir helfen, aber dann war er krank. Zum Glück</text>
  <text x="24" y="394" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">hatte meine neue Nachbarin Zeit. Sie hat mit</text>
  <text x="24" y="420" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">mir die Kisten getragen, und am Abend haben wir</text>
  <text x="24" y="446" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">zusammen Pizza gegessen.</text>
  <text x="24" y="482" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Meine neue Arbeit gefällt mir sehr gut. Ich</text>
  <text x="24" y="508" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">fange jeden Tag um halb neun an, also kann ich</text>
  <text x="24" y="534" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">morgens in Ruhe frühstücken. In Köln musste ich</text>
  <text x="24" y="560" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">schon um sieben im Büro sein.</text>
  <text x="24" y="596" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Hast du im Mai Zeit? Dann kannst du mich</text>
  <text x="24" y="622" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">besuchen. Ein Gästezimmer habe ich nicht, aber</text>
  <text x="24" y="648" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">im Wohnzimmer steht ein Sofa für Gäste. Im Juni</text>
  <text x="24" y="674" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">geht es leider nicht, da mache ich einen Kurs</text>
  <text x="24" y="700" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">in Berlin.</text>
  <text x="24" y="736" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Viele Grüße</text>
  <text x="24" y="762" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Jana</text>
</svg>
