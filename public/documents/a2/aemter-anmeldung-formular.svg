<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Formular zur Wohnsitzanmeldung</title>
  <desc id="desc">Ein simuliertes, teilweise ausgefülltes Behördenformular mit persönlichen Angaben, Einzugsdatum, Adresse und einer Liste mitzubringender Unterlagen.</desc>
  <rect width="1000" height="720" fill="#e7edf1"/>
  <rect x="55" y="30" width="890" height="660" rx="8" fill="#fff" stroke="#475569" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" fill="#1e293b">
    <text x="90" y="78" font-size="18" font-weight="800" fill="#1d4ed8">BÜRGERAMT NORD</text>
    <text x="90" y="119" font-size="32" font-weight="800">Anmeldung einer Wohnung</text>
    <text x="90" y="148" font-size="16" fill="#475569">Bitte deutlich in Druckbuchstaben ausfüllen.</text>
    <rect x="720" y="65" width="180" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="740" y="94" font-size="14" font-weight="700">Termin</text>
    <text x="740" y="122" font-size="17">12.08. · 09:40</text>

    <text x="90" y="196" font-size="15" font-weight="800">1 · PERSON</text>
    <text x="90" y="230" font-size="13" fill="#475569">Familienname</text>
    <line x1="90" y1="265" x2="450" y2="265" stroke="#64748b" stroke-width="2"/>
    <text x="105" y="257" font-size="19">Kowalenko</text>
    <text x="490" y="230" font-size="13" fill="#475569">Vorname</text>
    <line x1="490" y1="265" x2="900" y2="265" stroke="#64748b" stroke-width="2"/>
    <text x="505" y="257" font-size="19">Olena</text>
    <text x="90" y="302" font-size="13" fill="#475569">Geburtsdatum</text>
    <line x1="90" y1="337" x2="360" y2="337" stroke="#64748b" stroke-width="2"/>
    <text x="105" y="329" font-size="19">04.11.1992</text>
    <text x="400" y="302" font-size="13" fill="#475569">Staatsangehörigkeit</text>
    <line x1="400" y1="337" x2="900" y2="337" stroke="#64748b" stroke-width="2"/>

    <text x="90" y="386" font-size="15" font-weight="800">2 · NEUE WOHNUNG</text>
    <text x="90" y="420" font-size="13" fill="#475569">Straße und Hausnummer</text>
    <line x1="90" y1="455" x2="600" y2="455" stroke="#64748b" stroke-width="2"/>
    <text x="105" y="447" font-size="19">Gartenstraße 18</text>
    <text x="640" y="420" font-size="13" fill="#475569">PLZ / Ort</text>
    <line x1="640" y1="455" x2="900" y2="455" stroke="#64748b" stroke-width="2"/>
    <text x="655" y="447" font-size="19">04177 Leipzig</text>
    <text x="90" y="492" font-size="13" fill="#475569">Einzugsdatum</text>
    <line x1="90" y1="527" x2="360" y2="527" stroke="#64748b" stroke-width="2"/>
    <text x="105" y="519" font-size="19">01.08.2026</text>
    <text x="400" y="492" font-size="13" fill="#475569">Bisherige Anschrift</text>
    <line x1="400" y1="527" x2="900" y2="527" stroke="#64748b" stroke-width="2"/>

    <rect x="90" y="558" width="810" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="110" y="584" font-size="14" font-weight="800">ZUM TERMIN MITBRINGEN</text>
    <text x="110" y="611" font-size="15">☑ Personalausweis oder Reisepass</text>
    <text x="450" y="611" font-size="15">☐ Wohnungsgeberbestätigung</text>
    <text x="110" y="637" font-size="15">☐ Formular unterschreiben</text>
    <text x="910" y="680" text-anchor="end" fill="#64748b" font-size="12">Simuliertes Lernmaterial · kein amtliches Formular</text>
  </g>
</svg>
