<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Wohnungsanzeige mit Grundriss</title>
  <desc id="desc">Eine simulierte Anzeige für eine Zweizimmerwohnung in Leipzig mit Preisangaben, Ausstattung, Kontakt und beschriftetem Grundriss.</desc>
  <rect width="1000" height="700" fill="#f5f1e8"/>
  <rect x="40" y="38" width="920" height="624" rx="20" fill="#fff" stroke="#57534e" stroke-width="3"/>
  <rect x="40" y="38" width="920" height="92" rx="20" fill="#294b45"/>
  <rect x="40" y="108" width="920" height="22" fill="#294b45"/>
  <text x="76" y="82" fill="#fff" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Helle 2-Zimmer-Wohnung in Leipzig-Plagwitz</text>
  <text x="76" y="111" fill="#d8e5df" font-family="system-ui,sans-serif" font-size="18">frei ab 1. September · 3. Etage · mit Aufzug</text>

  <g font-family="system-ui,sans-serif" fill="#292524">
    <text x="76" y="178" font-size="19" font-weight="800" fill="#9a3412">DIE WICHTIGSTEN DATEN</text>
    <text x="76" y="218" font-size="24" font-weight="750">58 m² · 2 Zimmer · Balkon</text>
    <text x="76" y="258" font-size="19">Kaltmiete</text><text x="310" y="258" font-size="19" font-weight="750">720 €</text>
    <text x="76" y="292" font-size="19">Nebenkosten</text><text x="310" y="292" font-size="19" font-weight="750">160 €</text>
    <line x1="76" y1="310" x2="382" y2="310" stroke="#a8a29e" stroke-width="2"/>
    <text x="76" y="340" font-size="19">Warmmiete</text><text x="310" y="340" font-size="19" font-weight="800">880 €</text>
    <text x="76" y="392" font-size="18" font-weight="750">Ausstattung</text>
    <text x="76" y="424" font-size="17">• Einbauküche</text>
    <text x="76" y="452" font-size="17">• Bad mit Dusche</text>
    <text x="76" y="480" font-size="17">• Keller, Fahrradraum</text>
    <text x="76" y="508" font-size="17">• Haustiere nach Absprache</text>
    <rect x="76" y="544" width="310" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="94" y="574" font-size="16" font-weight="750">Besichtigung: Do., 6. August, 18:00</text>
    <text x="94" y="603" font-size="16">Kontakt: wohnung@example.de</text>
  </g>

  <g transform="translate(445 174)" font-family="system-ui,sans-serif">
    <text x="0" y="0" fill="#9a3412" font-size="19" font-weight="800">GRUNDRISS</text>
    <rect x="0" y="24" width="450" height="400" fill="#fafaf9" stroke="#292524" stroke-width="5"/>
    <rect x="4" y="28" width="250" height="210" fill="#e6efe9" stroke="#57534e" stroke-width="3"/>
    <text x="78" y="126" fill="#294b45" font-size="22" font-weight="750">Wohnzimmer</text>
    <text x="109" y="154" fill="#57534e" font-size="17">24 m²</text>
    <rect x="257" y="28" width="189" height="210" fill="#f7e8d2" stroke="#57534e" stroke-width="3"/>
    <text x="303" y="126" fill="#7c2d12" font-size="22" font-weight="750">Schlafzimmer</text>
    <text x="333" y="154" fill="#57534e" font-size="17">14 m²</text>
    <rect x="4" y="241" width="175" height="179" fill="#e0f2fe" stroke="#57534e" stroke-width="3"/>
    <text x="50" y="325" fill="#075985" font-size="21" font-weight="750">Bad</text>
    <text x="56" y="352" fill="#57534e" font-size="17">6 m²</text>
    <rect x="182" y="241" width="135" height="179" fill="#fef3c7" stroke="#57534e" stroke-width="3"/>
    <text x="215" y="325" fill="#92400e" font-size="20" font-weight="750">Küche</text>
    <text x="226" y="352" fill="#57534e" font-size="17">8 m²</text>
    <rect x="320" y="241" width="126" height="179" fill="#ede9fe" stroke="#57534e" stroke-width="3"/>
    <text x="352" y="325" fill="#5b21b6" font-size="18" font-weight="750">Flur</text>
    <text x="358" y="352" fill="#57534e" font-size="17">6 m²</text>
    <rect x="30" y="424" width="205" height="46" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
    <text x="91" y="454" fill="#166534" font-size="18" font-weight="750">Balkon</text>
    <path d="M116 238v-18h42v18M274 238v-18h42v18M317 335h18v42h-18" fill="#fff" stroke="#292524" stroke-width="3"/>
  </g>
  <text x="955" y="684" text-anchor="end" fill="#78716c" font-family="system-ui,sans-serif" font-size="13">Simuliertes Lernmaterial · keine echte Anzeige</text>
</svg>
