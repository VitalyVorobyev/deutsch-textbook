<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 762" role="img" aria-labelledby="title description">
  <title id="title">E-Mail: Nächste Woche</title>
  <desc id="description">E-Mail von Markus Hahn an Sara Wolf. Betreff: Nächste Woche</desc>
  <rect x="1" y="1" width="478" height="760" rx="14" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <path d="M1 15 a14 14 0 0 1 14 -14 H465 a14 14 0 0 1 14 14 V46 H1 Z" fill="#e2e8f0"/>
  <circle cx="24" cy="24" r="7" fill="#ef4444"/>
  <circle cx="46" cy="24" r="7" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="7" fill="#22c55e"/>
  <text x="240" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#334155">E-Mail</text>
  <text x="24" y="80" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">Von:</text>
  <text x="110" y="80" font-family="system-ui, sans-serif" font-size="17" fill="#172033">Markus Hahn</text>
  <text x="24" y="110" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">An:</text>
  <text x="110" y="110" font-family="system-ui, sans-serif" font-size="17" fill="#172033">Sara Wolf</text>
  <text x="24" y="140" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">Betreff:</text>
  <text x="110" y="140" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#172033">Nächste Woche</text>
  <path d="M24 162 H456" stroke="#cbd5e1" stroke-width="2"/>
  <text x="24" y="192" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Liebe Sara,</text>
  <text x="24" y="228" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">ich bin ab morgen eine Woche im Urlaub und</text>
  <text x="24" y="254" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">möchte dir noch ein paar Informationen geben.</text>
  <text x="24" y="290" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Am Dienstag kommt Herr Kaya von der Firma Lenz.</text>
  <text x="24" y="316" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Der Termin ist um zehn Uhr, nicht um elf, wie</text>
  <text x="24" y="342" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">im Kalender steht. Bitte sprich mit ihm über</text>
  <text x="24" y="368" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">die neuen Preise. Die Unterlagen liegen auf</text>
  <text x="24" y="394" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">meinem Tisch im Büro.</text>
  <text x="24" y="430" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Am Mittwoch hat Frau Roth Geburtstag. Wir</text>
  <text x="24" y="456" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">wollen ihr Blumen schenken. Petra sammelt das</text>
  <text x="24" y="482" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Geld, du musst also nichts organisieren.</text>
  <text x="24" y="518" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Unser Drucker ist leider kaputt. Der Techniker</text>
  <text x="24" y="544" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">kommt erst am Freitag. Bis Freitag kannst du</text>
  <text x="24" y="570" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">den Drucker im zweiten Stock benutzen.</text>
  <text x="24" y="606" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Wenn du Fragen hast, schreib mir bitte keine</text>
  <text x="24" y="632" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">E-Mail, ich lese im Urlaub keine. Ruf lieber</text>
  <text x="24" y="658" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Thomas an, er kennt das Projekt auch gut.</text>
  <text x="24" y="694" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Danke und bis bald</text>
  <text x="24" y="720" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Markus</text>
</svg>
