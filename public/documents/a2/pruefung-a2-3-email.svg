<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 726" role="img" aria-labelledby="title description">
  <title id="title">E-Mail: Ihre Ferienwohnung in Lindau</title>
  <desc id="description">E-Mail von Anna Berger an Pavel Ivanov. Betreff: Ihre Ferienwohnung in Lindau</desc>
  <rect x="1" y="1" width="478" height="724" rx="14" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <path d="M1 15 a14 14 0 0 1 14 -14 H465 a14 14 0 0 1 14 14 V46 H1 Z" fill="#e2e8f0"/>
  <circle cx="24" cy="24" r="7" fill="#ef4444"/>
  <circle cx="46" cy="24" r="7" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="7" fill="#22c55e"/>
  <text x="240" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#334155">E-Mail</text>
  <text x="24" y="80" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">Von:</text>
  <text x="110" y="80" font-family="system-ui, sans-serif" font-size="17" fill="#172033">Anna Berger</text>
  <text x="24" y="110" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">An:</text>
  <text x="110" y="110" font-family="system-ui, sans-serif" font-size="17" fill="#172033">Pavel Ivanov</text>
  <text x="24" y="140" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#475569">Betreff:</text>
  <text x="110" y="140" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#172033">Ihre Ferienwohnung in Lindau</text>
  <path d="M24 162 H456" stroke="#cbd5e1" stroke-width="2"/>
  <text x="24" y="192" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Sehr geehrter Herr Ivanov,</text>
  <text x="24" y="228" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">vielen Dank für Ihre Buchung. Wir freuen uns,</text>
  <text x="24" y="254" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">dass Sie vom 3. bis 10. August zu uns kommen.</text>
  <text x="24" y="290" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Leider können wir Ihnen die Wohnung im</text>
  <text x="24" y="316" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Erdgeschoss nicht geben, denn dort ist im Bad</text>
  <text x="24" y="342" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">etwas kaputt. Sie bekommen deshalb die Wohnung</text>
  <text x="24" y="368" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">im ersten Stock. Sie ist etwas größer und man</text>
  <text x="24" y="394" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">sieht den See. Der Preis bleibt gleich.</text>
  <text x="24" y="430" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Sie kommen mit dem Zug, schreiben Sie. Vom</text>
  <text x="24" y="456" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Bahnhof fährt der Bus Nummer 4 zu uns, die</text>
  <text x="24" y="482" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Haltestelle heißt „Seestraße“. Wir können Sie</text>
  <text x="24" y="508" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">aber auch gern mit dem Auto abholen. Bitte</text>
  <text x="24" y="534" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">rufen Sie uns dann eine Stunde vorher an.</text>
  <text x="24" y="570" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Handtücher liegen in der Wohnung. Frühstück</text>
  <text x="24" y="596" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">gibt es bei uns nicht, aber zur nächsten</text>
  <text x="24" y="622" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Bäckerei geht man nur fünf Minuten.</text>
  <text x="24" y="658" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Mit freundlichen Grüßen</text>
  <text x="24" y="684" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Anna Berger</text>
</svg>
