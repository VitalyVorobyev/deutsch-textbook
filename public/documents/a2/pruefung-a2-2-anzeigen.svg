<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 812" role="img" aria-labelledby="title description">
  <title id="title">Kleinanzeigen</title>
  <desc id="description">Anzeige a: Kinderfahrrad. Anzeige b: Umzug? Wir helfen!. Anzeige c: Esstisch zu verkaufen. Anzeige d: Möbel kostenlos. Anzeige e: Hilfe für Schüler. Anzeige f: Babysitterin</desc>
  <rect width="480" height="812" rx="18" fill="#f1f5f9"/>
  <text x="20" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172033">Kleinanzeigen</text>
  <rect x="20" y="64" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="92" r="16" fill="#172033"/>
  <text x="48" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">a</text>
  <text x="76" y="98" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Kinderfahrrad</text>
  <text x="36" y="132" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Blau, für Kinder von 5 bis 8 Jahren, fast neu,</text>
  <text x="36" y="155" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">45 €. Nur Abholung in Bonn-Beuel.</text>
  <rect x="20" y="188" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="216" r="16" fill="#172033"/>
  <text x="48" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">b</text>
  <text x="76" y="222" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Umzug? Wir helfen!</text>
  <text x="36" y="256" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Zwei starke Studenten mit Transporter, auch am</text>
  <text x="36" y="279" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Wochenende. 25 € pro Stunde. Tel. 0176 5544332</text>
  <rect x="20" y="312" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="340" r="16" fill="#172033"/>
  <text x="48" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">c</text>
  <text x="76" y="346" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Esstisch zu verkaufen</text>
  <text x="36" y="380" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Holztisch mit vier Stühlen, wie neu, 120 €. Wir</text>
  <text x="36" y="403" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">ziehen ins Ausland.</text>
  <rect x="20" y="436" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="464" r="16" fill="#172033"/>
  <text x="48" y="471" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">d</text>
  <text x="76" y="470" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Möbel kostenlos</text>
  <text x="36" y="504" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Sofa und Schrank – Sie bezahlen nichts! Bitte bis</text>
  <text x="36" y="527" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Samstag abholen. Sie brauchen dafür ein Auto.</text>
  <rect x="20" y="560" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="588" r="16" fill="#172033"/>
  <text x="48" y="595" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">e</text>
  <text x="76" y="594" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Hilfe für Schüler</text>
  <text x="36" y="628" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Mathematik und Englisch für Schüler der Klassen 5</text>
  <text x="36" y="651" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">bis 10. Bei Ihnen zu Hause, 15 € pro Stunde.</text>
  <rect x="20" y="684" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="712" r="16" fill="#172033"/>
  <text x="48" y="719" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">f</text>
  <text x="76" y="718" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Babysitterin</text>
  <text x="36" y="752" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Studentin (22), hat abends und am Wochenende Zeit.</text>
  <text x="36" y="775" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Erfahrung mit Kindern ab einem Jahr.</text>
</svg>
