<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 881" role="img" aria-labelledby="title description">
  <title id="title">Das Reparatur-Café</title>
  <desc id="description">Kaputt? Nicht gleich neu kaufen! – Im Reparatur-Café helfen Nachbarn ihren Nachbarn</desc>
  <rect x="1" y="1" width="478" height="879" rx="14" fill="#fbf8f1" stroke="#172033" stroke-width="2"/>
  <text x="24" y="44" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172033">Nachrichten aus Bremen-Ost</text>
  <text x="24" y="70" font-family="system-ui, sans-serif" font-size="15" fill="#4b5563">Montag, 6. Mai</text>
  <path d="M24 84 H456" stroke="#172033" stroke-width="3"/>
  <path d="M24 90 H456" stroke="#172033" stroke-width="1.2"/>
  <text x="24" y="128" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#172033">Kaputt? Nicht gleich neu</text>
  <text x="24" y="162" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#172033">kaufen!</text>
  <text x="24" y="196" font-family="system-ui, sans-serif" font-size="18" font-style="italic" fill="#334155">Im Reparatur-Café helfen Nachbarn ihren Nachbarn</text>
  <text x="24" y="235" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Seit März gibt es in der Stadtbibliothek am</text>
  <text x="24" y="261" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Marktplatz ein Reparatur-Café. Jeden ersten</text>
  <text x="24" y="287" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Samstag im Monat treffen sich dort von 14 bis</text>
  <text x="24" y="313" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">17 Uhr Leute, die gern etwas reparieren. Sie</text>
  <text x="24" y="339" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">helfen allen Besuchern, die eine kaputte Lampe,</text>
  <text x="24" y="365" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">ein altes Radio oder eine Kaffeemaschine</text>
  <text x="24" y="391" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">mitbringen. Fahrräder repariert das Team aber</text>
  <text x="24" y="417" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">nicht, denn dafür ist der Raum zu klein.</text>
  <text x="24" y="453" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Die Idee hatte Monika Brandt. Sie ist 64 Jahre</text>
  <text x="24" y="479" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">alt und hat früher in einer Firma für</text>
  <text x="24" y="505" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Elektrogeräte gearbeitet. „Viele Leute kaufen</text>
  <text x="24" y="531" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">schnell etwas Neues. Dabei kann man die alten</text>
  <text x="24" y="557" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Sachen oft noch reparieren“, sagt sie.</text>
  <text x="24" y="593" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Die Reparatur ist kostenlos. Neue Teile muss</text>
  <text x="24" y="619" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">man aber selbst bezahlen. Wer möchte, kann</text>
  <text x="24" y="645" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">etwas Geld in eine Kasse geben. Davon kauft das</text>
  <text x="24" y="671" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Team neue Werkzeuge.</text>
  <text x="24" y="707" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Am Anfang kamen nur zehn Gäste, letzten Samstag</text>
  <text x="24" y="733" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">waren es schon über vierzig. Deshalb sucht Frau</text>
  <text x="24" y="759" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Brandt jetzt noch Helferinnen und Helfer. Man</text>
  <text x="24" y="785" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">muss nicht alles wissen: „Wichtig ist, dass man</text>
  <text x="24" y="811" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Zeit und Lust hat“, sagt sie. Wer mitmachen</text>
  <text x="24" y="837" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">möchte, kann sich in der Bibliothek melden.</text>
</svg>
