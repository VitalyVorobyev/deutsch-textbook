<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 855" role="img" aria-labelledby="title description">
  <title id="title">Der Bücherbus</title>
  <desc id="description">Die Bibliothek kommt ins Dorf – Ein Bücherbus fährt jede Woche zu den Dörfern</desc>
  <rect x="1" y="1" width="478" height="853" rx="14" fill="#fbf8f1" stroke="#172033" stroke-width="2"/>
  <text x="24" y="44" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172033">Nachrichten aus Celle</text>
  <text x="24" y="70" font-family="system-ui, sans-serif" font-size="15" fill="#4b5563">Donnerstag, 14. März</text>
  <path d="M24 84 H456" stroke="#172033" stroke-width="3"/>
  <path d="M24 90 H456" stroke="#172033" stroke-width="1.2"/>
  <text x="24" y="128" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#172033">Die Bibliothek kommt ins</text>
  <text x="24" y="162" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#172033">Dorf</text>
  <text x="24" y="196" font-family="system-ui, sans-serif" font-size="18" font-style="italic" fill="#334155">Ein Bücherbus fährt jede Woche zu den Dörfern</text>
  <text x="24" y="235" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Nicht alle Dörfer haben eine Bibliothek.</text>
  <text x="24" y="261" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Deshalb fährt seit Januar ein Bücherbus durch</text>
  <text x="24" y="287" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">die Dörfer um Celle. Er hält jede Woche in</text>
  <text x="24" y="313" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">zwölf Dörfern, immer am gleichen Tag und zur</text>
  <text x="24" y="339" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">gleichen Zeit.</text>
  <text x="24" y="375" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Im Bus gibt es über 3000 Bücher, aber auch</text>
  <text x="24" y="401" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Filme und Spiele für Kinder. Zeitungen kann man</text>
  <text x="24" y="427" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">im Bus lesen, aber nicht mitnehmen. Alles</text>
  <text x="24" y="453" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">andere darf man kostenlos für drei Wochen</text>
  <text x="24" y="479" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">mitnehmen. Man braucht nur einen Ausweis der</text>
  <text x="24" y="505" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Stadtbibliothek Celle. Den bekommt man direkt</text>
  <text x="24" y="531" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">im Bus.</text>
  <text x="24" y="567" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Peter Lorenz fährt den Bus. Früher war er</text>
  <text x="24" y="593" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Busfahrer in der Stadt. „Jetzt kenne ich viele</text>
  <text x="24" y="619" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Leute in den Dörfern. Die Kinder warten schon</text>
  <text x="24" y="645" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">an der Haltestelle auf mich“, erzählt er.</text>
  <text x="24" y="681" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Besonders ältere Menschen freuen sich über den</text>
  <text x="24" y="707" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Bus. Viele haben kein Auto mehr, und der Weg in</text>
  <text x="24" y="733" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">die Stadt ist zu weit. Wer gar nicht zum Bus</text>
  <text x="24" y="759" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">kommen kann, bekommt die Bücher sogar nach</text>
  <text x="24" y="785" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Hause gebracht. Dafür muss man nur in der</text>
  <text x="24" y="811" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Bibliothek anrufen.</text>
</svg>
