<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 769" role="img" aria-labelledby="title description">
  <title id="title">Neue Bäume für die Stadt</title>
  <desc id="description">1000 neue Bäume für Leipzig – Die Stadt sucht Helferinnen und Helfer</desc>
  <rect x="1" y="1" width="478" height="767" rx="14" fill="#fbf8f1" stroke="#172033" stroke-width="2"/>
  <text x="24" y="44" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172033">Neues aus Leipzig</text>
  <text x="24" y="70" font-family="system-ui, sans-serif" font-size="15" fill="#4b5563">Samstag, 21. September</text>
  <path d="M24 84 H456" stroke="#172033" stroke-width="3"/>
  <path d="M24 90 H456" stroke="#172033" stroke-width="1.2"/>
  <text x="24" y="128" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#172033">1000 neue Bäume für Leipzig</text>
  <text x="24" y="162" font-family="system-ui, sans-serif" font-size="18" font-style="italic" fill="#334155">Die Stadt sucht Helferinnen und Helfer</text>
  <text x="24" y="201" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Im Sommer ist es in der Stadt oft sehr heiß.</text>
  <text x="24" y="227" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Unter Bäumen ist es nicht so heiß, und sie</text>
  <text x="24" y="253" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">machen die Luft besser. Deshalb will die Stadt</text>
  <text x="24" y="279" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">in diesem Herbst 1000 neue Bäume pflanzen – und</text>
  <text x="24" y="305" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">alle können mitmachen.</text>
  <text x="24" y="341" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Am 12. Oktober treffen sich die Helfer um neun</text>
  <text x="24" y="367" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Uhr am Rathaus. Von dort fahren Busse in die</text>
  <text x="24" y="393" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">verschiedenen Stadtteile. Werkzeug und Getränke</text>
  <text x="24" y="419" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">bekommen alle von der Stadt. Man muss nur feste</text>
  <text x="24" y="445" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Schuhe mitbringen.</text>
  <text x="24" y="481" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Wer an diesem Tag keine Zeit hat, kann trotzdem</text>
  <text x="24" y="507" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">helfen: Für 50 Euro kann man einen Baum</text>
  <text x="24" y="533" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">bezahlen. Dann bekommt der Baum ein kleines</text>
  <text x="24" y="559" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Schild mit dem Namen. Viele Familien schenken</text>
  <text x="24" y="585" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">so einen Baum, wenn ein Baby kommt.</text>
  <text x="24" y="621" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Junge Bäume brauchen viel Wasser. Im Sommer</text>
  <text x="24" y="647" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">geben Mitarbeiter der Stadt den Bäumen Wasser,</text>
  <text x="24" y="673" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">aber auch Nachbarn können helfen. „Zehn Liter</text>
  <text x="24" y="699" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">pro Woche sind schon eine große Hilfe“, sagt</text>
  <text x="24" y="725" font-family="system-ui, sans-serif" font-size="19" fill="#1f2937">Lena Vogt von der Stadt.</text>
</svg>
