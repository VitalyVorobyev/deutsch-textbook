<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 950" role="img" aria-labelledby="title description">
  <title id="title">Kurse und Gruppen in der Stadt</title>
  <desc id="description">Anzeige a: Schwimmkurs für Erwachsene. Anzeige b: Kochen mit Kindern. Anzeige c: Gitarre lernen. Anzeige d: Fotokurs am Sonntag. Anzeige e: Spanisch für die Reise. Anzeige f: Laufgruppe Stadtpark</desc>
  <rect width="480" height="950" rx="18" fill="#f1f5f9"/>
  <text x="20" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172033">Kurse und Gruppen in der Stadt</text>
  <rect x="20" y="64" width="440" height="135" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="92" r="16" fill="#172033"/>
  <text x="48" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">a</text>
  <text x="76" y="98" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Schwimmkurs für Erwachsene</text>
  <text x="36" y="132" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Sie können nicht schwimmen? Kein Problem! Kleine</text>
  <text x="36" y="155" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Gruppen, dienstags 19 Uhr im Hallenbad Nord.</text>
  <text x="36" y="178" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">8 Termine für 60 €.</text>
  <rect x="20" y="211" width="440" height="135" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="239" r="16" fill="#172033"/>
  <text x="48" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">b</text>
  <text x="76" y="245" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Kochen mit Kindern</text>
  <text x="36" y="279" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Für Eltern mit Kindern ab 6 Jahren. Samstags</text>
  <text x="36" y="302" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">10–13 Uhr. Wir kochen gesund und lecker.</text>
  <text x="36" y="325" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Familienzentrum Lindenstraße.</text>
  <rect x="20" y="358" width="440" height="135" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="386" r="16" fill="#172033"/>
  <text x="48" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">c</text>
  <text x="76" y="392" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Gitarre lernen</text>
  <text x="36" y="426" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Erfahrener Lehrer gibt Unterricht für Anfänger und</text>
  <text x="36" y="449" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">für Leute, die schon ein bisschen spielen können –</text>
  <text x="36" y="472" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">gern auch bei Ihnen zu Hause. Tel. 0151 2345678</text>
  <rect x="20" y="505" width="440" height="135" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="533" r="16" fill="#172033"/>
  <text x="48" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">d</text>
  <text x="76" y="539" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Fotokurs am Sonntag</text>
  <text x="36" y="573" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Mit dem Handy schöne Fotos machen! Sonntag</text>
  <text x="36" y="596" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">11–16 Uhr, wir treffen uns am Hauptbahnhof. Bitte</text>
  <text x="36" y="619" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">bringen Sie Ihr Handy mit.</text>
  <rect x="20" y="652" width="440" height="135" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="680" r="16" fill="#172033"/>
  <text x="48" y="687" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">e</text>
  <text x="76" y="686" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Spanisch für die Reise</text>
  <text x="36" y="720" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Sie fahren im Sommer nach Spanien? Kurs für</text>
  <text x="36" y="743" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Anfänger, montags und mittwochs 18 Uhr,</text>
  <text x="36" y="766" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Sprachschule Sol, Raum 12.</text>
  <rect x="20" y="799" width="440" height="135" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="827" r="16" fill="#172033"/>
  <text x="48" y="834" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">f</text>
  <text x="76" y="833" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Laufgruppe Stadtpark</text>
  <text x="36" y="867" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Wir laufen jeden Morgen um 6:30 Uhr fünf</text>
  <text x="36" y="890" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Kilometer. Für alle, die nicht allein Sport machen</text>
  <text x="36" y="913" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">möchten. Kostenlos!</text>
</svg>
