<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 858" role="img" aria-labelledby="title description">
  <title id="title">Ausflüge und Reisen</title>
  <desc id="description">Anzeige a: Radtour am Bodensee. Anzeige b: Mit dem Schiff auf dem Rhein. Anzeige c: Wanderwochenende in den Alpen. Anzeige d: Stadtführung in Dresden. Anzeige e: Busreise nach Prag. Anzeige f: Fahren Sie mit!</desc>
  <rect width="480" height="858" rx="18" fill="#f1f5f9"/>
  <text x="20" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172033">Ausflüge und Reisen</text>
  <rect x="20" y="64" width="440" height="135" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="92" r="16" fill="#172033"/>
  <text x="48" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">a</text>
  <text x="76" y="98" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Radtour am Bodensee</text>
  <text x="36" y="132" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">3 Tage, mit Hotel und Transport für Ihr Gepäck.</text>
  <text x="36" y="155" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Fahrräder kann man bei uns mieten. 249 € pro</text>
  <text x="36" y="178" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Person.</text>
  <rect x="20" y="211" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="239" r="16" fill="#172033"/>
  <text x="48" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">b</text>
  <text x="76" y="245" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Mit dem Schiff auf dem Rhein</text>
  <text x="36" y="279" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Jeden Sonntag 10–16 Uhr, mit Mittagessen auf dem</text>
  <text x="36" y="302" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Schiff. Kinder unter 6 Jahren fahren kostenlos.</text>
  <rect x="20" y="335" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="363" r="16" fill="#172033"/>
  <text x="48" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">c</text>
  <text x="76" y="369" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Wanderwochenende in den Alpen</text>
  <text x="36" y="403" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Für sportliche Leute mit Erfahrung. Sie schlafen</text>
  <text x="36" y="426" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">in einem Haus auf dem Berg. Nur für Erwachsene.</text>
  <rect x="20" y="459" width="440" height="135" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="487" r="16" fill="#172033"/>
  <text x="48" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">d</text>
  <text x="76" y="493" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Stadtführung in Dresden</text>
  <text x="36" y="527" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Täglich um 11 Uhr auf Deutsch, um 14 Uhr auf</text>
  <text x="36" y="550" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Englisch. Wir treffen uns vor dem Rathaus.</text>
  <text x="36" y="573" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">2 Stunden, 12 €.</text>
  <rect x="20" y="606" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="634" r="16" fill="#172033"/>
  <text x="48" y="641" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">e</text>
  <text x="76" y="640" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Busreise nach Prag</text>
  <text x="36" y="674" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Freitag bis Sonntag, mit Hotel, Frühstück und</text>
  <text x="36" y="697" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Stadtführung. Abfahrt in München. 189 €.</text>
  <rect x="20" y="730" width="440" height="112" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/>
  <circle cx="48" cy="758" r="16" fill="#172033"/>
  <text x="48" y="765" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">f</text>
  <text x="76" y="764" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#172033">Fahren Sie mit!</text>
  <text x="36" y="798" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Auf unserer Webseite finden Sie Fahrer, die in</text>
  <text x="36" y="821" font-family="system-ui, sans-serif" font-size="17" fill="#1f2937">Ihre Stadt fahren. Günstig und bequem.</text>
</svg>
