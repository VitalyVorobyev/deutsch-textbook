portrait: /characters/mira/mira.webp
scenes:
  - id: mira-1
    src: /characters/mira/mira-1.webp
    alt_de: Mira steht im Trikot auf einem Fußballplatz und hält einen Ball unter dem Arm. Sie lacht.
    description: >-
      In a football shirt on a local pitch, a ball under her arm, a goal behind her. Opens no
      episode: a2/lena-4-miras-fest is the only one about her club, and it opens with her party.
  - id: mira-2
    src: /characters/mira/mira-2.webp
    alt_de: Mira fährt am frühen Morgen mit dem Fahrrad am Fluss entlang. Im Korb liegt eine Tüte mit Brot.
    description: >-
      Cycling along a river path in grey morning light, street lamps on, another cyclist behind
      her, a bag of bread in the basket. Opens no episode: b1/krimi-3-die-zeugin says it was still
      dark and the streets were empty when she rode to the early shift, and the picture shows
      neither.
  - id: mira-3
    src: /characters/mira/mira-3.webp
    alt_de: Mira steht auf ihrem Geburtstagsfest draußen unter Lampions und isst ein Stück Torte.
    description: >-
      At her summer birthday party, outdoors under paper lanterns, a slice of cake in her hand,
      guests behind her. Opens a2/lena-4-miras-fest, whose first lines say she turned thirty in
      August; its questions ask why Lena is afraid of the party and how her evening went, and the
      picture shows Mira alone.
