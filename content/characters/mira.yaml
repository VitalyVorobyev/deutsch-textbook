facts:
  - de: Mira arbeitet mit Lena in der Bäckerei.
    source: reading:a2/lena-3-die-bewerbung
  - de: Mira wird im August dreißig.
    source: reading:a2/lena-4-miras-fest
  - de: Mira spielt seit zehn Jahren Fußball beim SV Nord.
    source: reading:a2/lena-4-miras-fest
  - de: Mira fährt mit dem Fahrrad zur Frühschicht in der Bäckerei.
    source: reading:b1/krimi-3-die-zeugin
  - de: Auf dem Weg zur Frühschicht stürzt Mira, weil ein weißer Lieferwagen mit einer Leiter auf dem Dach rückwärts über den Radweg fährt. Ihr Knie ist nur geprellt, aber ihr Vorderrad ist kaputt, und der Fahrer fährt weg.
    source: reading:b1/krimi-3-die-zeugin
  - de: Mira hat gesehen, dass der Fahrer die Nummer für das Hoftor in der Gartenstraße eintippt. In diesem Hof steht auch ein neues Fahrraddach.
    source: reading:b1/krimi-3-die-zeugin
