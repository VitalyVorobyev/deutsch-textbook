scenes:
  - id: frau-kern-1
    src: /characters/frau-kern/frau-kern-1.webp
    alt_de: Frau Kern steht früh am Morgen mit einer Tasse Kaffee am Fenster und sieht in den Hof.
    description: >-
      At her open window at dawn with a cup of coffee, looking out over the courtyard. Opens
      a2/lena-7-ein-brief-fuer-den-hof, which begins in the courtyard with her complaint about
      the Hausverwaltung; its questions ask why Lena rewrites her letter and what is allowed in
      the end, and neither the bench nor a table is in view.
  - id: frau-kern-2
    src: /characters/frau-kern/frau-kern-2.webp
    alt_de: Frau Kern trägt ein Tablett mit Kaffee über den Hof. Hinter ihr arbeiten Männer auf einem Gerüst.
    description: >-
      Carrying a tray with a coffee pot and cups across the courtyard towards workers on a
      scaffold at a house wall, a ladder beside them. Opens no episode: in
      b1/krimi-4-was-die-versicherung-wissen-will the men she brought coffee to built the
      bicycle shelter, and the picture shows work on a house.
  - id: frau-kern-3
    src: /characters/frau-kern/frau-kern-3.webp
    alt_de: Frau Kern sitzt mit Nachbarn an einem Tisch im Hof. Sie hebt die Hand und spricht.
    description: >-
      Among neighbours at a table in the courtyard, one hand raised, speaking, a notepad in the
      other. Opens b1/krimi-6-ein-dach-fuer-alle, where she raises her hand at the meeting; its
      questions ask what two sentences do in the conversation, and the picture carries no words.
