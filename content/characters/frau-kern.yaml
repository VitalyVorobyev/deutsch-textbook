# Lena's neighbour in the Lena serial (ADR 0016). Each fact names the text that states it.
# Speaks through the roster voice catalogued as anna-keller (ADR 0018): the roster has no older
# woman's voice, and the course designs no new one.
id: frau-kern
name: Frau Kern
voice: anna-keller
age_band: older-adult
facts:
  - de: Frau Kern ist Lenas Nachbarin. Sie ist siebzig und steht immer früh auf.
    source: reading:a2/lena-2-der-wecker-um-vier
  - de: Frau Kern hat eine Tochter.
    source: listening:ls-dativ-01
  - de: Frau Kern verdächtigt den neuen Nachbarn aus dem dritten Stock, Herrn Hansen, weil er jeden Abend Fahrräder in den Keller trägt.
    source: reading:b1/krimi-1-das-leere-dach
  - de: Beim Bau des Fahrraddachs hat Frau Kern den Männern der Firma jeden Morgen Kaffee gebracht. Sie erinnert sich an ihren weißen Wagen mit einer Leiter auf dem Dach.
    source: reading:b1/krimi-4-was-die-versicherung-wissen-will
  - de: Frau Kern sieht ein, dass ihr Verdacht gegen Herrn Hansen falsch war. Er repariert alte Kinderräder für die Grundschule am Park.
    source: reading:b1/krimi-4-was-die-versicherung-wissen-will
  - de: Bei der Versammlung im Hof schlägt Frau Kern vor, dass Herr Hansen die Kinderräder unter dem Fahrraddach repariert.
    source: reading:b1/krimi-6-ein-dach-fuer-alle
