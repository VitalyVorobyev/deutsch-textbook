# The protagonist of the Lena serial (ADR 0016). Each fact names the text that states it.
id: lena
name: Lena
voice: lena
age_band: young-adult
facts:
  - de: Lena kommt aus Polen. Sie ist vierundzwanzig, als sie nach Bremen kommt.
    source: reading:a1/lena-1-der-erste-tag
  - de: Lena hat ein Zimmer in der Bahnhofstraße in Bremen.
    source: reading:a1/lena-1-der-erste-tag
  - de: Ihr Deutschkurs fängt im September an. Seit Oktober arbeitet sie in einer Bäckerei in der Bahnhofstraße.
    source: reading:a2/lena-2-der-wecker-um-vier
  - de: Lenas Vater hat in Polen eine kleine Fahrradwerkstatt, und Lena kann Fahrräder reparieren.
    source: reading:a2/lena-3-die-bewerbung
  - de: Ab dem ersten Juli arbeitet Lena drei Tage in der Woche in der Werkstatt von Frau Beck und macht nur noch zwei Frühschichten in der Bäckerei.
    source: reading:a2/lena-3-die-bewerbung
  - de: Lena hat im Winter Geburtstag.
    source: reading:a2/lena-4-miras-fest
  - de: Lenas Fahrrad ist grün, und am Lenker hat es eine alte Klingel aus der Werkstatt ihres Vaters. Lena hat die Rahmennummer fotografiert.
    source: reading:b1/krimi-1-das-leere-dach
  - de: Lenas Fahrrad wird unter dem neuen Fahrraddach im Hof gestohlen, und Lena macht bei der Polizei eine Anzeige.
    source: reading:b1/krimi-1-das-leere-dach
  - de: Mit Timo findet Lena im Internet eine zweite Anzeige desselben Verkäufers, mit dem Rad von Frau Aydin. Sie bringen die Screenshots beider Anzeigen zur Polizei.
    source: reading:b1/krimi-2-nur-zwei-monate-gefahren
  - de: Lena hat eine Hausratversicherung. Ihr Fahrrad ist dort nur versichert, wenn es abgeschlossen war.
    source: reading:b1/krimi-4-was-die-versicherung-wissen-will
  - de: In der Werkstatt von Frau Beck erkennt Lena ihr gestohlenes Fahrrad an der Rahmennummer. Ein Kunde in der Jacke der Firma, die das Fahrraddach gebaut hat, bringt es zur Reparatur.
    source: reading:b1/krimi-5-ein-kunde-ohne-eile
  - de: Lena bekommt ihr Fahrrad schwarz lackiert von der Polizei zurück, und mit ihm die alte Klingel aus der Werkstatt ihres Vaters.
    source: reading:b1/krimi-6-ein-dach-fuer-alle
  - de: Lena hilft Herrn Hansen bei den Bremsen, wenn er unter dem Fahrraddach Kinderräder repariert.
    source: reading:b1/krimi-6-ein-dach-fuer-alle
