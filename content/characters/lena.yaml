  - de: Lena hat ein Zimmer in der Bahnhofstraße in Bremen.
    source: reading:a1/lena-1-der-erste-tag
  - de: Ihr Deutschkurs fängt im September an. Seit Oktober arbeitet sie in einer Bäckerei in der Bahnhofstraße.
    source: reading:a2/lena-2-der-wecker-um-vier
  - de: Lenas Vater hat in Polen eine kleine Fahrradwerkstatt, und Lena kann Fahrräder reparieren.
    source: reading:a2/lena-3-die-bewerbung
  - de: Ab dem ersten Juli arbeitet Lena drei Tage in der Woche in der Werkstatt von Frau Beck und macht nur noch zwei Frühschichten in der Bäckerei.
    source: reading:a2/lena-3-die-bewerbung
