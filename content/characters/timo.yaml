# Lena's friend in the Lena serial (ADR 0016). Each fact names the text that states it.
# The roster voice is the one catalogued as "jonas": a voice is casting, not a name.
id: timo
name: Timo
voice: jonas
age_band: young-adult
facts:
  - de: Timo ist Torwart beim SV Nord und arbeitet in einer Werkstatt.
    source: reading:a2/lena-4-miras-fest
  - de: Timo kennt Bremen gut und erklärt Lena den Roland.
    source: reading:a2/lena-5-der-mann-aus-stein
  - de: Timo hilft Lena, ihr gestohlenes Fahrrad zu finden. Er schreibt dem Verkäufer als Käufer und sieht auf beiden Fotos einen weißen Lieferwagen mit einer Leiter auf dem Dach.
    source: reading:b1/krimi-2-nur-zwei-monate-gefahren
relations:
  - with: lena
    de: Bekannte von Miras Fest
    address: du
    source: reading:a2/lena-7-ein-brief-fuer-den-hof
appearances:
  - reading:a2/lena-4-miras-fest
  - reading:a2/lena-5-der-mann-aus-stein
  - reading:a2/lena-7-ein-brief-fuer-den-hof
  - reading:b1/krimi-2-nur-zwei-monate-gefahren
portrait: /characters/timo/timo.webp
scenes:
  - id: timo-1
    src: /characters/timo/timo-1.webp
    alt_de: Timo steht mit Torwarthandschuhen vor einem Tor und hält einen Ball unter dem Arm.
    description: >-
      In goalkeeper gloves in front of a goal net, a ball under his arm. Opens no episode:
      a2/lena-4-miras-fest, where Lena meets the goalkeeper, opens with Mira's party.
  - id: timo-2
    src: /characters/timo/timo-2.webp
    alt_de: Timo steht auf einem Marktplatz und zeigt auf eine große Figur aus Stein, einen Ritter mit Schild.
    description: >-
      On a market square, pointing up at a tall stone knight with a shield, market stalls and
      gabled houses behind. Opens a2/lena-5-der-mann-aus-stein, whose questions ask what Lena
      prepared for her appointment and how she notices her independence; the statue answers
      neither.
  - id: timo-3
    src: /characters/timo/timo-3.webp
    alt_de: Timo sitzt abends am Küchentisch und sieht konzentriert auf einen Laptop.
    description: >-
      At a kitchen table in the evening, leaning towards a laptop, a mug and a notebook beside
      it. Opens no episode: in b1/krimi-2-nur-zwei-monate-gefahren he writes to the seller on
      Lena's phone, on the bench in the courtyard on a Sunday morning.
