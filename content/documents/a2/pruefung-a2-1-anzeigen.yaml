description:
  en: "Six simulated small ads, a to f, for courses and groups in a city: swimming, cooking with children, guitar lessons, phone photography, Spanish and a running group."
  ru: "Шесть учебных объявлений, от a до f, о курсах и группах в городе: плавание, готовка с детьми, уроки гитары, фотография на телефон, испанский язык и группа для бега."
  uk: "Шість навчальних оголошень, від a до f, про курси й групи в місті: плавання, готування з дітьми, уроки гітари, фотографія на телефон, іспанська мова і група для бігу."
transcript:
  - Kurse und Gruppen in der Stadt
  - a) Schwimmkurs für Erwachsene – Sie können nicht schwimmen? Kein Problem! Kleine Gruppen, dienstags 19 Uhr im Hallenbad Nord. 8 Termine für 60 €.
  - b) Kochen mit Kindern – Für Eltern mit Kindern ab 6 Jahren. Samstags 10–13 Uhr. Wir kochen gesund und lecker. Familienzentrum Lindenstraße.
  - c) Gitarre lernen – Erfahrener Lehrer gibt Unterricht für Anfänger und für Leute, die schon ein bisschen spielen können – gern auch bei Ihnen zu Hause. Tel. 0151 2345678
  - d) Fotokurs am Sonntag – Mit dem Handy schöne Fotos machen! Sonntag 11–16 Uhr, wir treffen uns am Hauptbahnhof. Bitte bringen Sie Ihr Handy mit.
  - e) Spanisch für die Reise – Sie fahren im Sommer nach Spanien? Kurs für Anfänger, montags und mittwochs 18 Uhr, Sprachschule Sol, Raum 12.
  - f) Laufgruppe Stadtpark – Wir laufen jeden Morgen um 6:30 Uhr fünf Kilometer. Für alle, die nicht allein Sport machen möchten. Kostenlos!
