transcript:
  - Nachrichten aus Bremen-Ost · Montag, 6. Mai
  - Kaputt? Nicht gleich neu kaufen!
  - Im Reparatur-Café helfen Nachbarn ihren Nachbarn
  - Seit März gibt es in der Stadtbibliothek am Marktplatz ein Reparatur-Café. Jeden ersten Samstag im Monat treffen sich dort von 14 bis 17 Uhr Leute, die gern etwas reparieren. Sie helfen allen Besuchern, die eine kaputte Lampe, ein altes Radio oder eine Kaffeemaschine mitbringen. Fahrräder repariert das Team aber nicht, denn dafür ist der Raum zu klein.
  - Die Idee hatte Monika Brandt. Sie ist 64 Jahre alt und hat früher in einer Firma für Elektrogeräte gearbeitet. „Viele Leute kaufen schnell etwas Neues. Dabei kann man die alten Sachen oft noch reparieren“, sagt sie.
  - Die Reparatur ist kostenlos. Neue Teile muss man aber selbst bezahlen. Wer möchte, kann etwas Geld in eine Kasse geben. Davon kauft das Team neue Werkzeuge.
  - "Am Anfang kamen nur zehn Gäste, letzten Samstag waren es schon über vierzig. Deshalb sucht Frau Brandt jetzt noch Helferinnen und Helfer. Man muss nicht alles wissen: „Wichtig ist, dass man Zeit und Lust hat“, sagt sie. Wer mitmachen möchte, kann sich in der Bibliothek melden."
