description:
  en: "A simulated work e-mail: before his holiday, Markus tells his colleague Sara about a client meeting, a colleague's birthday present, a broken printer and whom to ask."
  ru: "Учебное рабочее письмо: перед отпуском Маркус сообщает коллеге Саре о встрече с клиентом, о подарке коллеге на день рождения, о сломанном принтере и о том, к кому обращаться с вопросами."
  uk: "Навчальний робочий лист: перед відпусткою Маркус повідомляє колегу Сару про зустріч із клієнтом, про подарунок колезі на день народження, про зламаний принтер і про те, до кого звертатися з питаннями."
transcript:
  - "Von: Markus Hahn"
  - "An: Sara Wolf"
  - "Betreff: Nächste Woche"
  - Liebe Sara,
  - ich bin ab morgen eine Woche im Urlaub und möchte dir noch ein paar Informationen geben.
  - Am Dienstag kommt Herr Kaya von der Firma Lenz. Der Termin ist um zehn Uhr, nicht um elf, wie im Kalender steht. Bitte sprich mit ihm über die neuen Preise. Die Unterlagen liegen auf meinem Tisch im Büro.
  - Am Mittwoch hat Frau Roth Geburtstag. Wir wollen ihr Blumen schenken. Petra sammelt das Geld, du musst also nichts organisieren.
  - Unser Drucker ist leider kaputt. Der Techniker kommt erst am Freitag. Bis Freitag kannst du den Drucker im zweiten Stock benutzen.
  - Wenn du Fragen hast, schreib mir bitte keine E-Mail, ich lese im Urlaub keine. Ruf lieber Thomas an, er kennt das Projekt auch gut.
  - Danke und bis bald · Markus
