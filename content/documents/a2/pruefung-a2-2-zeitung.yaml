description:
  en: "A simulated regional newspaper article about a mobile library bus that visits twelve villages every week: what it lends, what it costs, its driver and its home delivery."
  ru: "Учебная статья из районной газеты о библиотеке-автобусе, который каждую неделю приезжает в двенадцать деревень: что в нём можно взять, сколько это стоит, кто водитель и как работает доставка на дом."
  uk: "Навчальна стаття з районної газети про бібліотеку-автобус, який щотижня приїжджає до дванадцяти сіл: що в ньому можна взяти, скільки це коштує, хто водій і як працює доставка додому."
transcript:
  - Nachrichten aus Celle · Donnerstag, 14. März
  - Die Bibliothek kommt ins Dorf
  - Ein Bücherbus fährt jede Woche zu den Dörfern
  - Nicht alle Dörfer haben eine Bibliothek. Deshalb fährt seit Januar ein Bücherbus durch die Dörfer um Celle. Er hält jede Woche in zwölf Dörfern, immer am gleichen Tag und zur gleichen Zeit.
  - Im Bus gibt es über 3000 Bücher, aber auch Filme und Spiele für Kinder. Zeitungen kann man im Bus lesen, aber nicht mitnehmen. Alles andere darf man kostenlos für drei Wochen mitnehmen. Man braucht nur einen Ausweis der Stadtbibliothek Celle. Den bekommt man direkt im Bus.
  - Peter Lorenz fährt den Bus. Früher war er Busfahrer in der Stadt. „Jetzt kenne ich viele Leute in den Dörfern. Die Kinder warten schon an der Haltestelle auf mich“, erzählt er.
  - Besonders ältere Menschen freuen sich über den Bus. Viele haben kein Auto mehr, und der Weg in die Stadt ist zu weit. Wer gar nicht zum Bus kommen kann, bekommt die Bücher sogar nach Hause gebracht. Dafür muss man nur in der Bibliothek anrufen.
