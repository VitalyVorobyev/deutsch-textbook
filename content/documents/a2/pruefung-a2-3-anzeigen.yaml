description:
  en: "Six simulated ads, a to f, for trips: a cycling tour, a Rhine boat trip, a hiking weekend in the Alps, a city tour of Dresden, a coach trip to Prague and a ride-sharing website."
  ru: "Шесть учебных объявлений, от a до f, о поездках: велотур, прогулка на теплоходе по Рейну, походные выходные в Альпах, экскурсия по Дрездену, автобусный тур в Прагу и сайт для совместных поездок."
  uk: "Шість навчальних оголошень, від a до f, про поїздки: велотур, прогулянка теплоходом Рейном, похідні вихідні в Альпах, екскурсія Дрезденом, автобусний тур до Праги та сайт для спільних поїздок."
transcript:
  - Ausflüge und Reisen
  - a) Radtour am Bodensee – 3 Tage, mit Hotel und Transport für Ihr Gepäck. Fahrräder kann man bei uns mieten. 249 € pro Person.
  - b) Mit dem Schiff auf dem Rhein – Jeden Sonntag 10–16 Uhr, mit Mittagessen auf dem Schiff. Kinder unter 6 Jahren fahren kostenlos.
  - c) Wanderwochenende in den Alpen – Für sportliche Leute mit Erfahrung. Sie schlafen in einem Haus auf dem Berg. Nur für Erwachsene.
  - d) Stadtführung in Dresden – Täglich um 11 Uhr auf Deutsch, um 14 Uhr auf Englisch. Wir treffen uns vor dem Rathaus. 2 Stunden, 12 €.
  - e) Busreise nach Prag – Freitag bis Sonntag, mit Hotel, Frühstück und Stadtführung. Abfahrt in München. 189 €.
  - f) Fahren Sie mit! – Auf unserer Webseite finden Sie Fahrer, die in Ihre Stadt fahren. Günstig und bequem.
