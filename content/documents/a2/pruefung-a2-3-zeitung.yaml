transcript:
  - Neues aus Leipzig · Samstag, 21. September
  - 1000 neue Bäume für Leipzig
  - Die Stadt sucht Helferinnen und Helfer
  - Im Sommer ist es in der Stadt oft sehr heiß. Unter Bäumen ist es nicht so heiß, und sie machen die Luft besser. Deshalb will die Stadt in diesem Herbst 1000 neue Bäume pflanzen – und alle können mitmachen.
  - Am 12. Oktober treffen sich die Helfer um neun Uhr am Rathaus. Von dort fahren Busse in die verschiedenen Stadtteile. Werkzeug und Getränke bekommen alle von der Stadt. Man muss nur feste Schuhe mitbringen.
  - "Wer an diesem Tag keine Zeit hat, kann trotzdem helfen: Für 50 Euro kann man einen Baum bezahlen. Dann bekommt der Baum ein kleines Schild mit dem Namen. Viele Familien schenken so einen Baum, wenn ein Baby kommt."
  - Junge Bäume brauchen viel Wasser. Im Sommer geben Mitarbeiter der Stadt den Bäumen Wasser, aber auch Nachbarn können helfen. „Zehn Liter pro Woche sind schon eine große Hilfe“, sagt Lena Vogt von der Stadt.
