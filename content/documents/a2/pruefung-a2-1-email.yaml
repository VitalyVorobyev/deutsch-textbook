description:
  en: "A simulated personal e-mail: Jana tells her friend Tom about her new flat in Freiburg, the move, her new working hours and when he can visit."
  ru: "Учебное личное письмо: Яна рассказывает другу Тому о новой квартире во Фрайбурге, о переезде, о новом рабочем графике и о том, когда он может приехать в гости."
  uk: "Навчальний особистий лист: Яна розповідає другові Тому про нову квартиру у Фрайбурзі, про переїзд, про новий робочий графік і про те, коли він може приїхати в гості."
transcript:
  - "Von: Jana Krüger"
  - "An: Tom Becker"
  - "Betreff: Endlich in der neuen Wohnung!"
  - Hallo Tom,
  - seit zwei Wochen wohne ich jetzt in Freiburg. Die Wohnung ist kleiner als meine alte in Köln, aber sie hat einen großen Balkon. Von dort sieht man die Berge – wunderschön!
  - Der Umzug war anstrengend. Mein Bruder wollte mir helfen, aber dann war er krank. Zum Glück hatte meine neue Nachbarin Zeit. Sie hat mit mir die Kisten getragen, und am Abend haben wir zusammen Pizza gegessen.
  - Meine neue Arbeit gefällt mir sehr gut. Ich fange jeden Tag um halb neun an, also kann ich morgens in Ruhe frühstücken. In Köln musste ich schon um sieben im Büro sein.
  - Hast du im Mai Zeit? Dann kannst du mich besuchen. Ein Gästezimmer habe ich nicht, aber im Wohnzimmer steht ein Sofa für Gäste. Im Juni geht es leider nicht, da mache ich einen Kurs in Berlin.
  - Viele Grüße · Jana
