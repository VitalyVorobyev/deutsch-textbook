description:
  en: "Six simulated classified ads, a to f: a child's bike, student movers, a dining table, free furniture, maths and English tutoring, and a babysitter."
  ru: "Шесть учебных частных объявлений, от a до f: детский велосипед, студенты-грузчики, обеденный стол, мебель даром, репетитор по математике и английскому и няня."
  uk: "Шість навчальних приватних оголошень, від a до f: дитячий велосипед, студенти-вантажники, обідній стіл, меблі задарма, репетитор з математики й англійської та няня."
transcript:
  - Kleinanzeigen
  - a) Kinderfahrrad – Blau, für Kinder von 5 bis 8 Jahren, fast neu, 45 €. Nur Abholung in Bonn-Beuel.
  - b) Umzug? Wir helfen! – Zwei starke Studenten mit Transporter, auch am Wochenende. 25 € pro Stunde. Tel. 0176 5544332
  - c) Esstisch zu verkaufen – Holztisch mit vier Stühlen, wie neu, 120 €. Wir ziehen ins Ausland.
  - d) Möbel kostenlos – Sofa und Schrank – Sie bezahlen nichts! Bitte bis Samstag abholen. Sie brauchen dafür ein Auto.
  - e) Hilfe für Schüler – Mathematik und Englisch für Schüler der Klassen 5 bis 10. Bei Ihnen zu Hause, 15 € pro Stunde.
  - f) Babysitterin – Studentin (22), hat abends und am Wochenende Zeit. Erfahrung mit Kindern ab einem Jahr.
