  en: "A simulated formal e-mail from a holiday-flat owner: a change of flat, the price, how to get there from the station, pick-up, towels and bedding, and breakfast."
  ru: "Учебное официальное письмо от хозяйки апартаментов: другая квартира, цена, как добраться от вокзала, встреча на машине, бельё и полотенца, завтрак."
  uk: "Навчальний офіційний лист від власниці апартаментів: інша квартира, ціна, як дістатися від вокзалу, зустріч на машині, білизна й рушники, сніданок."
transcript:
  - "Von: Anna Berger"
  - "An: Pavel Ivanov"
  - "Betreff: Ihre Ferienwohnung in Lindau"
  - Sehr geehrter Herr Ivanov,
  - vielen Dank für Ihre Buchung. Wir freuen uns, dass Sie vom 3. bis 10. August zu uns kommen.
  - Leider können wir Ihnen die Wohnung im Erdgeschoss nicht geben, denn dort ist im Bad etwas kaputt. Sie bekommen deshalb die Wohnung im ersten Stock. Sie ist etwas größer und man sieht den See. Der Preis bleibt gleich.
  - Sie kommen mit dem Zug, schreiben Sie. Vom Bahnhof fährt der Bus Nummer 4 zu uns, die Haltestelle heißt „Seestraße“. Wir können Sie aber auch gern mit dem Auto abholen. Bitte rufen Sie uns dann eine Stunde vorher an.
  - Handtücher liegen in der Wohnung. Frühstück gibt es bei uns nicht, aber zur nächsten Bäckerei geht man nur fünf Minuten.
  - Mit freundlichen Grüßen · Anna Berger
