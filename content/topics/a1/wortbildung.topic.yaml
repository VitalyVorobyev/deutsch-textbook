outcomes:
  - id: wortbildung-komposita
    mode: reading
    domain: educational
    de: Ich kann ein zusammengesetztes Nomen vom letzten Wort her lesen und seinen Artikel bestimmen.
    en: I can read a compound noun from its final member and determine its article.
    ru: Я умею читать сложное существительное от последней части и определять его артикль.
    uk: Я вмію читати складний іменник від останньої частини та визначати його артикль.
  - id: wortbildung-nomenformen
    mode: writing
    domain: personal
    de: Ich kann häufige Nomen mit -er, -in, -ung und -chen verstehen und einfache Formen selbst bilden.
    en: I can understand common nouns with -er, -in, -ung and -chen and form simple examples myself.
    ru: Я понимаю частые существительные с -er, -in, -ung и -chen и умею сам образовывать простые формы.
    uk: Я розумію часті іменники з -er, -in, -ung та -chen і вмію сам утворювати прості форми.
  - id: wortbildung-adjektive
    mode: writing
    domain: educational
    de: Ich kann die Bedeutung einfacher Adjektive mit un-, -los und -bar erschließen und passende Formen benutzen.
    en: I can infer the meaning of simple adjectives with un-, -los and -bar and use suitable forms.
    ru: Я умею выводить значение простых прилагательных с un-, -los и -bar и употреблять подходящие формы.
    uk: Я вмію виводити значення простих прикметників з un-, -los та -bar і вживати доречні форми.
