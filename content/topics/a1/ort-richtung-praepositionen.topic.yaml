outcomes:
  - id: weg-verstehen
    mode: reading
    domain: personal
    de: Ich kann in einem einfachen Text verstehen, wohin jemand geht, wo er ist und woher er kommt.
    en: I can follow in a simple text where somebody is going, where they are and where they have come from.
    ru: Я понимаю в простом тексте, куда человек идёт, где он находится и откуда возвращается.
    uk: Я розумію в простому тексті, куди людина йде, де вона перебуває і звідки повертається.
  - id: ziel-nennen
    mode: writing
    domain: personal
    de: Ich kann sagen, wohin ich gehe oder fahre.
    en: I can say where I am going.
    ru: Я умею сказать, куда я иду или еду.
    uk: Я вмію сказати, куди я йду або їду.
  - id: ort-nennen
    mode: writing
    domain: personal
    de: Ich kann sagen, wo ich gerade bin.
    en: I can say where I am at the moment.
    ru: Я умею сказать, где я сейчас нахожусь.
    uk: Я вмію сказати, де я зараз перебуваю.
  - id: herkunft-nennen
    mode: writing
    domain: personal
    de: Ich kann sagen, woher ich komme.
    en: I can say where I have come from.
    ru: Я умею сказать, откуда я иду или приехал.
    uk: Я вмію сказати, звідки я йду або приїхав.
    claims:
      - goethe-dtz-handlungen:migrationserfahrung-berichten
