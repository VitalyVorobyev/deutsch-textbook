group: nomen-kasus
title_de: Artikel und Genus
title_en: Articles and gender
title_ru: Артикли и род существительных
title_uk: Артиклі та рід іменників
status: draft
tags:
  - nouns
  - articles
prerequisites: []
deepens: []
related:
  - akkusativ
outcomes:
  - id: artikel-richtig-verwenden
    mode: writing
    domain: personal
    de: "Ich kann Nomen mit dem richtigen Artikel benutzen: der, die oder das."
    en: "I can use nouns with the correct article: der, die or das."
    ru: "Я умею употреблять существительные с правильным артиклем: der, die или das."
    uk: "Я вмію вживати іменники з правильним артиклем: der, die чи das."
  - id: artikel-genus-erkennen
    mode: reading
    domain: educational
    de: "Ich kann an der Endung oft das Genus erkennen: die -ung, das -chen."
    en: I can often tell a noun's gender from its ending (die -ung, das -chen).
    ru: Я умею определять род существительного по окончанию (die -ung, das -chen).
    uk: Я вмію визначати рід іменника за закінченням (die -ung, das -chen).
  - id: artikel-plural-verwenden
    mode: writing
    domain: personal
    de: "Ich weiß: Der Artikel im Plural ist immer die."
    en: I know that the plural article is always die.
    ru: Я знаю, что во множественном числе артикль всегда die.
    uk: Я знаю, що у множині артикль завжди die.
  - id: artikel-kein-verwenden
    mode: writing
    domain: personal
    de: "Ich kann Nomen mit kein verneinen: Das ist kein Problem."
    en: I can negate nouns with kein (Das ist kein Problem) and know when nicht is wrong.
    ru: Я умею отрицать существительные с помощью kein (Das ist kein Problem) и знаю, когда nicht не подходит.
    uk: Я вмію заперечувати іменники за допомогою kein (Das ist kein Problem) і знаю, коли nicht не годиться.
  - id: artikel-demonstrativ-verwenden
    mode: writing
    domain: personal
    de: Ich kann mit dieser, diese und dieses auf ein bestimmtes Nomen zeigen.
    en: I can point to a particular noun with dieser, diese and dieses.
    ru: Я умею указывать на конкретное существительное с помощью dieser, diese и dieses.
    uk: Я вмію вказувати на конкретний іменник за допомогою dieser, diese та dieses.
