group: nomen-kasus
title_de: man, jemand & wem etwas gehört
title_en: man, jemand & saying whose it is
title_ru: man, jemand и чьё это
title_uk: man, jemand і чиє це
status: reviewed
tags:
  - pronouns
  - indefinite
  - possession
  - genitive
prerequisites:
  - modalverben
  - dativ
  - verbindungen-folgen
deepens:
  - dativ
related: []
outcomes:
  - id: regeln-mit-man
    mode: spoken-interaction
    domain: public
    de: Ich kann mit man sagen, was man wo darf, muss und nicht darf.
    en: I can use man to say what is allowed, required and forbidden somewhere.
    ru: Я умею с помощью man сказать, что где можно, нужно и нельзя.
    uk: Я вмію за допомогою man сказати, що де можна, треба і не можна.
    claims:
      - goethe-dtz-handlungen:erlaubnis-genehmigung
  - id: unbestimmt-sprechen
    mode: writing
    domain: personal
    de: Ich kann mit jemand, niemand, etwas und nichts über Unbestimmtes sprechen.
    en: I can talk about the unspecified with jemand, niemand, etwas and nichts.
    ru: Я умею говорить о неопределённом с помощью jemand, niemand, etwas и nichts.
    uk: Я вмію говорити про неозначене за допомогою jemand, niemand, etwas і nichts.
  - id: besitz-ausdruecken
    mode: writing
    domain: personal
    de: "Ich kann sagen, wem etwas gehört: Annas Auto oder das Auto von meinem Bruder."
    en: "I can say whose something is: Annas Auto or das Auto von meinem Bruder."
    ru: "Я умею сказать, кому что принадлежит: Annas Auto или das Auto von meinem Bruder."
    uk: "Я вмію сказати, кому що належить: Annas Auto або das Auto von meinem Bruder."
  - id: passiv-verstehen
    mode: reading
    domain: public
    de: "Ich kann Schilder und Durchsagen im Passiv verstehen: Hier wird gebaut."
    en: "I can understand signs and announcements in the passive: Hier wird gebaut."
    ru: "Я умею понимать таблички и объявления в пассиве: Hier wird gebaut."
    uk: "Я вмію розуміти таблички й оголошення в пасиві: Hier wird gebaut."
