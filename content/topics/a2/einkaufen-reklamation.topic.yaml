outcomes:
  - id: produkte-vergleichen
    mode: writing
    domain: personal
    de: Ich kann Preise, Größen und Produkte vergleichen.
    en: I can compare prices, sizes and products.
    ru: Я умею сравнивать цены, размеры и товары.
    uk: Я вмію порівнювати ціни, розміри й товари.
    claims:
      - goethe-dtz-handlungen:beschreiben
  - id: gefallen-passen-sagen
    mode: spoken-interaction
    domain: personal
    de: Ich kann sagen, was mir passt und was mir gefällt.
    en: I can say what fits me and what I like.
    ru: Я умею сказать, что мне подходит и что мне нравится.
    uk: Я вмію сказати, що мені підходить і що мені подобається.
    claims:
      - goethe-dtz-handlungen:haltungen-meinungen-ausdruecken
  - id: umtausch-begruenden
    mode: spoken-interaction
    domain: public
    de: Ich kann einen Umtausch begründen.
    en: I can give the reason for an exchange or a return.
    ru: Я умею объяснить причину обмена или возврата.
    uk: Я вмію пояснити причину обміну чи повернення.
    claims:
      - goethe-dtz-handlungen:erklaeren
  - id: reklamation-schreiben
    mode: writing
    domain: public
    de: Ich kann eine kurze Reklamation schreiben.
    en: I can write a short complaint.
    ru: Я умею написать краткую рекламацию.
    uk: Я вмію написати коротку рекламацію.
    claims:
      - goethe-dtz-handlungen:umgang-konflikte
