outcomes:
  - id: aufgaben-beschreiben
    mode: spoken-production
    domain: professional
    de: Ich kann meine Aufgaben und meine Arbeitszeiten beschreiben.
    en: I can describe my duties and my working hours.
    ru: Я умею описать свои обязанности и рабочее время.
    uk: Я вмію описати свої обов'язки та робочий час.
    claims:
      - goethe-dtz-handlungen:beschreiben
      - goethe-dtz-handlungen:eigene-kompetenzen-darstellen
  - id: arbeitszeit-aushandeln
    mode: spoken-interaction
    domain: professional
    de: Ich kann eine Bitte am Arbeitsplatz aussprechen und eine Schicht tauschen.
    en: I can make a request at work and swap a shift.
    ru: Я умею обратиться с просьбой на работе и поменяться сменой.
    uk: Я вмію звернутися з проханням на роботі та помінятися зміною.
    claims:
      - goethe-dtz-handlungen:bitte-ausdruecken
      - goethe-dtz-handlungen:vorschlag-machen
  - id: arbeitsanweisung-verstehen
    mode: listening
    domain: professional
    de: Ich kann Anweisungen und kurze Nachrichten am Arbeitsplatz verstehen.
    en: I can understand instructions and short messages at work.
    ru: Я понимаю указания и короткие сообщения на работе.
    uk: Я розумію вказівки та короткі повідомлення на роботі.
  - id: berufliche-nachricht-schreiben
    mode: writing
    domain: professional
    de: Ich kann eine kurze berufliche Nachricht schreiben.
    en: I can write a short work message.
    ru: Я умею написать короткое рабочее сообщение.
    uk: Я вмію написати коротке робоче повідомлення.
