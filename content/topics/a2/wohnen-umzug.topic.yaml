outcomes:
  - id: wohnungsanzeige-lesen
    mode: reading
    domain: personal
    de: Ich kann eine Wohnungsanzeige lesen und die wichtigen Informationen finden.
    en: I can read a flat advertisement and find the information that matters.
    ru: Я умею читать объявление о сдаче квартиры и находить в нём главное.
    uk: Я вмію читати оголошення про оренду квартири та знаходити в ньому головне.
  - id: wohnung-beschreiben
    mode: writing
    domain: personal
    de: Ich kann eine Wohnung und ihre Lage genauer beschreiben.
    en: I can describe a flat and where it is in more detail.
    ru: Я умею подробнее описать квартиру и её расположение.
    uk: Я вмію докладніше описати квартиру та її розташування.
    claims:
      - goethe-dtz-handlungen:beschreiben
  - id: wo-wohin-position
    mode: writing
    domain: personal
    de: Ich kann sagen, wo etwas steht und wohin es kommt.
    en: I can say where something is and where it is going.
    ru: Я умею сказать, где что-то стоит и куда это ставят.
    uk: Я вмію сказати, де щось стоїть і куди це ставлять.
  - id: nachbarn-bitte
    mode: spoken-interaction
    domain: personal
    de: Ich kann eine Bitte an Vermieter oder Nachbarn formulieren.
    en: I can make a request to a landlord or a neighbour.
    ru: Я умею обратиться с просьбой к арендодателю или соседям.
    uk: Я вмію звернутися з проханням до орендодавця чи сусідів.
    claims:
      - goethe-dtz-handlungen:bitte-ausdruecken
