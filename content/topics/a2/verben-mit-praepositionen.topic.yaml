outcomes:
  - id: verb-praeposition-waehlen
    mode: writing
    domain: educational
    de: Ich kann häufige Verben mit der passenden Präposition verwenden.
    en: I can use common verbs with the preposition they govern.
    ru: Я умею употреблять частые глаголы с нужным предлогом.
    uk: Я вмію вживати часті дієслова з потрібним прийменником.
  - id: da-wort-sache
    mode: writing
    domain: educational
    de: Ich kann mit einem da-Wort auf eine Sache oder einen Plan zurückverweisen.
    en: I can use a da-word to refer back to a thing or plan.
    ru: Я умею ссылаться на предмет или план с помощью da-слова.
    uk: Я вмію посилатися на предмет або план за допомогою da-слова.
  - id: wo-wort-fragen
    mode: spoken-interaction
    domain: educational
    de: Ich kann mit einem wo-Wort nach einer Sache fragen.
    en: I can use a wo-word to ask about a thing.
    ru: Я умею задавать вопрос о предмете с помощью wo-слова.
    uk: Я вмію ставити питання про предмет за допомогою wo-слова.
    claims:
      - goethe-dtz-handlungen:nachfragen
  - id: person-sache-unterscheiden
    mode: spoken-interaction
    domain: personal
    de: Ich kann bei Präpositionalobjekten zwischen Personen und Sachen unterscheiden.
    en: I can distinguish people from things in prepositional objects.
    ru: Я умею различать людей и предметы в предложных дополнениях.
    uk: Я вмію розрізняти людей і предмети в прийменникових додатках.
