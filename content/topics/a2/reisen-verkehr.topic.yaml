outcomes:
  - id: verbindung-waehlen
    mode: reading
    domain: public
    de: Ich kann eine Verbindung auswählen und die wichtigen Informationen im Fahrplan finden.
    en: I can choose a connection and find the information that matters in a timetable.
    ru: Я умею выбрать маршрут и найти нужную информацию в расписании.
    uk: Я вмію вибрати маршрут і знайти потрібну інформацію в розкладі.
  - id: durchsage-verstehen
    mode: listening
    domain: public
    de: Ich kann wichtige Durchsagen am Bahnhof verstehen.
    en: I can understand the announcements that matter at a station.
    ru: Я понимаю важные объявления на вокзале.
    uk: Я розумію важливі оголошення на вокзалі.
  - id: reise-problem-loesen
    mode: spoken-interaction
    domain: public
    de: Ich kann ein Reiseproblem erklären und um Hilfe bitten.
    en: I can explain a travel problem and ask for help.
    ru: Я умею объяснить проблему в пути и попросить о помощи.
    uk: Я вмію пояснити проблему в дорозі та попросити про допомогу.
    claims:
      - goethe-dtz-handlungen:erklaeren
      - goethe-dtz-handlungen:bitte-ausdruecken
      - goethe-dtz-handlungen:hilfe-anbieten
  - id: reise-berichten
    mode: spoken-production
    domain: personal
    de: Ich kann kurz von einer Reise berichten.
    en: I can give a short account of a journey.
    ru: Я умею коротко рассказать о поездке.
    uk: Я вмію коротко розповісти про поїздку.
    claims:
      - goethe-dtz-handlungen:vergangenes-berichten
