id: infinitiv-mit-zu
level: A2
kind: grammar
strand: grammar
group: satzbau
title_de: Infinitiv mit zu & um … zu
title_en: The zu-infinitive & purpose with um … zu
title_ru: Инфинитив с zu и цель с um … zu
title_uk: Інфінітив із zu та мета з um … zu
status: draft
tags:
  - syntax
  - infinitive
  - purpose
  - plans
prerequisites:
  - modalverben
  - trennbare-verben
  - nebensaetze-plaene
deepens:
  - nebensaetze-plaene
related: []
outcomes:
  - id: plan-zu-infinitiv
    mode: writing
    domain: personal
    de: Ich kann mit vorhaben, versuchen und Lust haben sagen, was ich plane.
    en: I can say what I am planning, using vorhaben, versuchen and Lust haben.
    ru: Я умею рассказать о своих планах с помощью vorhaben, versuchen и Lust haben.
    uk: Я вмію розповісти про свої плани за допомогою vorhaben, versuchen і Lust haben.
    claims:
      - goethe-dtz-handlungen:ankuendigen-plaene
  - id: zweck-um-zu
    mode: spoken-production
    domain: personal
    de: Ich kann mit um … zu sagen, wozu ich etwas mache.
    en: I can use um … zu to say what I am doing something for.
    ru: Я умею с помощью um … zu сказать, зачем я что-то делаю.
    uk: Я вмію за допомогою um … zu сказати, навіщо я щось роблю.
    claims:
      - goethe-dtz-handlungen:zweck-angeben
  - id: zu-oder-ohne-zu
    mode: writing
    domain: personal
    de: Ich kann entscheiden, ob ein Infinitiv zu braucht — und wo das zu steht.
    en: I can decide whether an infinitive needs zu, and where the zu goes.
    ru: Я умею определить, нужен ли инфинитиву zu и где этот zu стоит.
    uk: Я вмію визначити, чи потрібне інфінітиву zu і де це zu стоїть.
  - id: zukunft-werden
    mode: writing
    domain: personal
    de: Ich kann mit werden + Infinitiv eine Vorhersage machen oder etwas versprechen.
    en: I can use werden + infinitive to make a prediction or a promise.
    ru: Я умею с помощью werden + инфинитив сделать прогноз или дать обещание.
    uk: Я вмію за допомогою werden + інфінітив зробити прогноз або дати обіцянку.
    claims:
      - goethe-dtz-handlungen:ankuendigen-plaene
