outcomes:
  - id: rektion-verstehen
    mode: reading
    domain: personal
    de: Ich kann in einem einfachen Text verstehen, wem jemand hilft und wen jemand anruft.
    en: I can understand in a simple text whom somebody is helping and whom somebody is calling.
    ru: Я понимаю в простом тексте, кому человек помогает и кому звонит.
    uk: Я розумію в простому тексті, кому людина допомагає і кому дзвонить.
  - id: akkusativ-person-nennen
    mode: writing
    domain: personal
    de: Ich kann Verben wie anrufen, fragen und stören mit der Person im Akkusativ verwenden.
    en: I can use verbs like anrufen, fragen and stören with the person in the accusative.
    ru: Я умею употреблять глаголы вроде anrufen, fragen и stören с человеком в Akkusativ.
    uk: Я вмію вживати дієслова на кшталт anrufen, fragen і stören з людиною в Akkusativ.
  - id: dativ-person-nennen
    mode: writing
    domain: personal
    de: Ich kann bei gelernten Dativverben die Person in den Dativ setzen.
    en: I can put the person in the dative with the dative verbs I have learned.
    ru: Я умею ставить человека в Dativ при изученных дативных глаголах.
    uk: Я вмію ставити людину в Dativ при вивчених давальних дієсловах.
  - id: verbchunk-nennen
    mode: writing
    domain: personal
    de: Ich kann ein Verb mit fester Präposition im richtigen Kasus verwenden.
    en: I can use a verb with a fixed preposition in the case that preposition brings.
    ru: Я умею употреблять глагол с закреплённым предлогом в нужном падеже.
    uk: Я вмію вживати дієслово із закріпленим прийменником у потрібному відмінку.
