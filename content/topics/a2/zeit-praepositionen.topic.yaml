outcomes:
  - id: zeitangabe-verstehen
    mode: reading
    domain: personal
    de: Ich kann in einem einfachen Text verstehen, wann etwas passiert und wie lange es schon läuft.
    en: I can understand in a simple text when something happens and how long it has been going on.
    ru: Я понимаю в простом тексте, когда что-то происходит и как долго это уже длится.
    uk: Я розумію в простому тексті, коли щось відбувається і як довго це вже триває.
  - id: zeitpunkt-nennen
    mode: writing
    domain: personal
    de: "Ich kann einen Zeitpunkt nennen: um acht, am Montag, im Juli, vor dem Kurs — oder ganz ohne Präposition."
    en: "I can name a point in time: um acht, am Montag, im Juli, vor dem Kurs — or with no preposition at all."
    ru: "Я умею назвать момент времени: um acht, am Montag, im Juli, vor dem Kurs — или вообще без предлога."
    uk: "Я вмію назвати момент часу: um acht, am Montag, im Juli, vor dem Kurs — або взагалі без прийменника."
  - id: dauer-nennen
    mode: writing
    domain: personal
    de: Ich kann mit seit sagen, wie lange etwas schon läuft, und mit vor, wann etwas vorbei ist.
    en: I can say with seit how long something has been going on, and with vor when something was over.
    ru: Я умею сказать с seit, как долго что-то длится, и с vor, когда что-то было.
    uk: Я вмію сказати з seit, як довго щось триває, і з vor, коли щось було.
  - id: zeitraum-nennen
    mode: writing
    domain: personal
    de: Ich kann mit ab, bis und von … bis sagen, wann ein Zeitraum beginnt und endet.
    en: I can say with ab, bis and von … bis when a stretch of time begins and ends.
    ru: Я умею сказать с ab, bis и von … bis, когда отрезок времени начинается и заканчивается.
    uk: Я вмію сказати з ab, bis і von … bis, коли відрізок часу починається й закінчується.
  - id: dauer-schwelle-nennen
    mode: writing
    domain: personal
    de: Ich kann mit über ausdrücken, dass eine genannte Dauer überschritten wurde.
    en: I can use über to express that a stated duration was exceeded.
    ru: Я умею с помощью über выразить, что указанная длительность была превышена.
    uk: Я вмію за допомогою über виразити, що вказану тривалість було перевищено.
