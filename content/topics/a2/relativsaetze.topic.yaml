outcomes:
  - id: person-beschreiben-relativ
    mode: writing
    domain: personal
    de: Ich kann mit einem Relativsatz sagen, welche Person oder Sache ich meine.
    en: I can use a relative clause to say which person or thing I mean.
    ru: Я умею с помощью относительного придаточного сказать, какого человека или какую вещь я имею в виду.
    uk: Я вмію за допомогою відносного підрядного сказати, яку людину чи яку річ я маю на увазі.
    claims:
      - goethe-dtz-handlungen:beschreiben
  - id: sache-definieren
    mode: spoken-production
    domain: public
    de: Ich kann eine Sache beschreiben, wenn mir das Wort fehlt (Ich suche ein Ding, das …).
    en: I can describe a thing when the word escapes me (Ich suche ein Ding, das …).
    ru: Я умею описать предмет, когда не могу вспомнить слово (Ich suche ein Ding, das …).
    uk: Я вмію описати предмет, коли не можу згадати слово (Ich suche ein Ding, das …).
    claims:
      - goethe-dtz-handlungen:kompensation
  - id: relativ-kasus-waehlen
    mode: writing
    domain: personal
    de: "Ich kann der und den unterscheiden: Der Kasus kommt aus der Rolle im Relativsatz."
    en: "I can tell der from den: the case comes from the role inside the relative clause."
    ru: "Я умею различать der и den: падеж определяется ролью внутри придаточного."
    uk: "Я вмію розрізняти der і den: відмінок визначається роллю всередині підрядного."
  - id: relativ-satzbau
    mode: writing
    domain: personal
    de: "Ich kann den Relativsatz richtig bauen: Verb am Ende, Kommas auf beiden Seiten."
    en: "I can build a relative clause correctly: verb at the end, commas on both sides."
    ru: "Я умею правильно строить относительное придаточное: глагол в конце, запятые с обеих сторон."
    uk: "Я вмію правильно будувати відносне підрядне: дієслово в кінці, коми з обох боків."
