outcomes:
  - id: folge-ausdruecken
    mode: writing
    domain: personal
    de: Ich kann eine Folge mit deshalb, deswegen oder trotzdem ausdrücken — mit dem Verb an zweiter Stelle.
    en: I can express a consequence with deshalb, deswegen or trotzdem, keeping the verb second.
    ru: Я умею выразить следствие через deshalb, deswegen или trotzdem, оставляя глагол на втором месте.
    uk: Я вмію виразити наслідок через deshalb, deswegen або trotzdem, залишаючи дієслово на другому місці.
    claims:
      - goethe-dtz-handlungen:erklaeren
  - id: vergangenheit-erzaehlen
    mode: writing
    domain: personal
    de: Ich kann von früher erzählen und dabei als und wenn richtig wählen.
    en: I can talk about the past and choose correctly between als and wenn.
    ru: Я умею рассказывать о прошлом, правильно выбирая между als и wenn.
    uk: Я вмію розповідати про минуле, правильно обираючи між als і wenn.
    claims:
      - goethe-dtz-handlungen:vergangenes-berichten
  - id: ereignisse-ordnen
    mode: spoken-production
    domain: personal
    de: "Ich kann Ereignisse ordnen: zuerst, dann, danach, schließlich."
    en: "I can put events in order: zuerst, dann, danach, schließlich."
    ru: "Я умею упорядочить события: zuerst, dann, danach, schließlich."
    uk: "Я вмію впорядкувати події: zuerst, dann, danach, schließlich."
    claims:
      - goethe-dtz-handlungen:vergangenes-berichten
