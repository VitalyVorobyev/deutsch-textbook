outcomes:
  - id: wohnsituation-vergleichen
    mode: spoken-production
    domain: personal
    de: Ich kann Wohnsituationen vergleichen und eine Wahl begründen.
    en: I can compare housing situations and justify a choice.
    ru: Я умею сравнивать варианты жилья и обосновать выбор.
    uk: Я вмію порівнювати варіанти житла й обґрунтувати вибір.
    claims:
      - goethe-dtz-handlungen:haltungen-meinungen-ausdruecken
  - id: relativsatz-praezisieren
    mode: writing
    domain: personal
    de: Ich kann mit Relativsätzen im Dativ und nach Präpositionen genauer beschreiben, was ich meine.
    en: I can use relative clauses in the dative and after prepositions to say more precisely what I mean.
    ru: Я умею с помощью относительных придаточных в дативе и после предлогов точнее описать, что я имею в виду.
    uk: Я вмію за допомогою відносних підрядних у дативі та після прийменників точніше описати, що я маю на увазі.
    claims:
      - goethe-dtz-handlungen:beschreiben
  - id: veraenderung-berichten
    mode: writing
    domain: personal
    de: Ich kann über eine Lebensveränderung berichten und Vor- und Nachteile nennen.
    en: I can report on a life change and name its advantages and disadvantages.
    ru: Я умею рассказать об изменении в жизни и назвать его плюсы и минусы.
    uk: Я вмію розповісти про зміну в житті й назвати її плюси та мінуси.
    claims:
      - goethe-dtz-handlungen:vergangenes-berichten
