outcomes:
  - id: praeteritum-erzaehlen
    mode: writing
    domain: personal
    de: Ich kann ein Erlebnis schriftlich im Präteritum erzählen.
    en: I can narrate an experience in writing, in the Präteritum.
    ru: Я умею письменно рассказать о пережитом в Präteritum.
    uk: Я вмію письмово розповісти про пережите в Präteritum.
    claims:
      - goethe-dtz-handlungen:vergangenes-berichten
  - id: vorzeitigkeit-ausdruecken
    mode: writing
    domain: personal
    de: Ich kann mit nachdem und Plusquamperfekt sagen, was zuerst geschah.
    en: I can say what happened first, with nachdem and the Plusquamperfekt.
    ru: Я умею сказать, что произошло раньше, через nachdem и Plusquamperfekt.
    uk: Я вмію сказати, що сталося раніше, через nachdem і Plusquamperfekt.
    claims:
      - goethe-dtz-handlungen:vergangenes-berichten
  - id: interview-verstehen
    mode: listening
    domain: personal
    de: Ich kann einem Interview über Erfahrungen die Hauptpunkte entnehmen.
    en: I can pick out the main points of an interview about experiences.
    ru: Я умею выделить главное в интервью о пережитом.
    uk: Я вмію виділити головне в інтерв'ю про пережите.
  - id: muendlich-nacherzaehlen
    mode: spoken-production
    domain: personal
    de: Ich kann eine Geschichte mündlich zusammenhängend nacherzählen.
    en: I can retell a story aloud in a connected way.
    ru: Я умею связно пересказать историю вслух.
    uk: Я вмію зв'язно переказати історію вголос.
    claims:
      - goethe-dtz-handlungen:vergangenes-berichten
