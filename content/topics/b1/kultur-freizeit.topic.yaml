outcomes:
  - id: programm-verstehen
    mode: reading
    domain: personal
    de: Ich kann einem Veranstaltungsprogramm die für mich wichtigen Informationen entnehmen.
    en: I can find the information that matters to me in an events programme.
    ru: Я умею находить в программе мероприятий нужную мне информацию.
    uk: Я вмію знаходити в програмі заходів потрібну мені інформацію.
  - id: veranstaltung-empfehlen
    mode: spoken-interaction
    domain: personal
    de: Ich kann eine Veranstaltung empfehlen und mich mit anderen auf einen Plan einigen.
    en: I can recommend an event and agree on a plan with others.
    ru: Я умею порекомендовать мероприятие и договориться с другими о плане.
    uk: Я вмію порекомендувати захід і домовитися з іншими про план.
    claims:
      - goethe-dtz-handlungen:rat-empfehlung-warnung
      - goethe-dtz-handlungen:vorschlag-machen
  - id: erlebnis-bewerten
    mode: writing
    domain: personal
    de: Ich kann einen kurzen Erfahrungsbericht schreiben und begründet bewerten.
    en: I can write a short account of an experience and give a reasoned judgement.
    ru: Я умею написать короткий отзыв о впечатлении и обосновать свою оценку.
    uk: Я вмію написати короткий відгук про враження й обґрунтувати свою оцінку.
    claims:
      - goethe-dtz-handlungen:haltungen-meinungen-ausdruecken
