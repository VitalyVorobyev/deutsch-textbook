outcomes:
  - id: bericht-verstehen
    mode: reading
    domain: public
    de: Ich kann einen kurzen Bericht verstehen und seine Kernaussage wiedergeben.
    en: I can understand a short report and give its central point back in my own words.
    ru: Я понимаю короткое сообщение и умею передать его главную мысль.
    uk: Я розумію коротке повідомлення і вмію передати його головну думку.
  - id: meinung-begruenden
    mode: spoken-production
    domain: public
    de: Ich kann meine Meinung äußern und mit Argumenten stützen.
    en: I can express my opinion and support it with reasons.
    ru: Я умею высказать своё мнение и подкрепить его доводами.
    uk: Я вмію висловити свою думку і підкріпити її доказами.
    claims:
      - goethe-dtz-handlungen:haltungen-meinungen-ausdruecken
  - id: argumente-verbinden
    mode: writing
    domain: public
    de: Ich kann Aussagen mit zweiteiligen Konnektoren verknüpfen und abwägen.
    en: I can link statements with two-part connectors and weigh them against each other.
    ru: Я умею связывать высказывания двойными союзами и взвешивать их.
    uk: Я вмію пов'язувати висловлювання подвійними сполучниками і зважувати їх.
    claims:
      - goethe-dtz-handlungen:haltungen-meinungen-ausdruecken
