outcomes:
  - id: passiv-beschreiben
    mode: writing
    domain: public
    de: Ich kann mit dem Passiv beschreiben, wie etwas hergestellt oder geregelt wird.
    en: I can use the passive to describe how something is made or regulated.
    ru: Я умею описывать с помощью пассива, как что-то производят или регулируют.
    uk: Я вмію описувати за допомогою пасиву, як щось виробляють або регулюють.
    claims:
      - goethe-dtz-handlungen:beschreiben
      - goethe-dtz-handlungen:erklaeren
  - id: hinweise-verstehen
    mode: reading
    domain: public
    de: Ich kann öffentliche Hinweise und Regelungen verstehen.
    en: I can understand public notices and the rules they state.
    ru: Я понимаю публичные объявления и изложенные в них правила.
    uk: Я розумію публічні оголошення та викладені в них правила.
  - id: konsum-vergleichen
    mode: spoken-production
    domain: public
    de: Ich kann Konsumentscheidungen vergleichen und meine Wahl begründen.
    en: I can compare consumer choices and justify my own.
    ru: Я умею сравнивать потребительские решения и обосновывать свой выбор.
    uk: Я вмію порівнювати споживчі рішення та обґрунтовувати свій вибір.
    claims:
      - goethe-dtz-handlungen:haltungen-meinungen-ausdruecken
