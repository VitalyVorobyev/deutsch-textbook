outcomes:
  - id: anleitung-verstehen
    mode: reading
    domain: personal
    de: Ich kann einer schriftlichen Anleitung Schritt für Schritt folgen.
    en: I can follow a set of written instructions step by step.
    ru: Я умею шаг за шагом следовать письменной инструкции.
    uk: Я вмію крок за кроком дотримуватися письмової інструкції.
  - id: technikproblem-schildern
    mode: writing
    domain: personal
    de: Ich kann ein technisches Problem schildern und gezielt um Hilfe bitten.
    en: I can describe a technical problem and ask for help in a targeted way.
    ru: Я умею описать техническую неполадку и обратиться за конкретной помощью.
    uk: Я вмію описати технічну несправність і звернутися по конкретну допомогу.
    claims:
      - goethe-dtz-handlungen:beschreiben
      - goethe-dtz-handlungen:bitte-ausdruecken
  - id: mediennutzung-berichten
    mode: spoken-production
    domain: personal
    de: Ich kann über meine Mediennutzung berichten und sie einordnen.
    en: I can report on my media use and put it in perspective.
    ru: Я умею рассказать о своём пользовании медиа и оценить его.
    uk: Я вмію розповісти про своє користування медіа й оцінити його.
    claims:
      - goethe-dtz-handlungen:beschreiben
