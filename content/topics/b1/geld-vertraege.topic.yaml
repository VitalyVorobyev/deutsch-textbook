    mode: spoken-production
    domain: personal
    de: Ich kann Kosten und Tarife vergleichen und meine Wahl begründen.
    en: I can compare costs and plans and give the reason for my choice.
    ru: Я умею сравнить расходы и тарифы и обосновать свой выбор.
    uk: Я вмію порівняти витрати й тарифи та обґрунтувати свій вибір.
    claims:
      - goethe-dtz-handlungen:haltungen-meinungen-ausdruecken
