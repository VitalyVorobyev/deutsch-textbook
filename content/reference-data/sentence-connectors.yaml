id: sentence-connectors

# The level is the first Atlas stage at which the form is expected productively.
# A reference page may show later language early, but it never turns that language
# into a current-level learning target.
relations:
  - id: addition
    title: { de: "Ergänzung", en: "Addition", ru: "Добавление", uk: "Доповнення" }
    cue: { en: "Add another fact or argument?", ru: "Добавить ещё один факт или аргумент?", uk: "Додати ще один факт або аргумент?" }
    description:
      en: "The second part adds information without changing or opposing the first."
      ru: "Вторая часть добавляет информацию, не изменяя первую и не споря с ней."
      uk: "Друга частина додає інформацію, не змінюючи першу і не сперечаючись із нею."
    entries:
      - form: und
        level: A1
        syntax: coordinating
        meaning: { en: "and; the neutral connection", ru: "и; нейтральное соединение", uk: "і; нейтральне поєднання" }
        note:
          en: "It joins equal words, phrases or clauses and does not change their word order."
          ru: "Соединяет равноправные слова, группы или предложения и не меняет порядок слов."
          uk: "Поєднує рівноправні слова, групи або речення і не змінює порядок слів."
        example: { de: "Ich lerne Deutsch und ich lese jeden Abend.", en: "I learn German and I read every evening.", ru: "Я учу немецкий и каждый вечер читаю.", uk: "Я вчу німецьку і щовечора читаю." }
      - form: auch
        level: A1
        syntax: adverbial
        meaning: { en: "also, too", ru: "тоже, также", uk: "теж, також" }
        note:
          en: "Usually stands inside the clause next to the information it adds; it is not normally a sentence-opening connector like außerdem."
          ru: "Обычно стоит внутри предложения рядом с добавляемой информацией; это не обычная связка в начале предложения, как außerdem."
          uk: "Зазвичай стоїть усередині речення поряд з інформацією, яку додає; це не звичайна сполучна ланка на початку речення, як außerdem."
        example: { de: "Ich lerne Deutsch und lese auch deutsche Nachrichten.", en: "I learn German and also read German news.", ru: "Я учу немецкий и также читаю новости по-немецки.", uk: "Я вчу німецьку і також читаю новини німецькою." }
      - form: außerdem
        level: A2
        syntax: adverbial
        meaning: { en: "in addition, besides", ru: "кроме того, к тому же", uk: "крім того, до того ж" }
        note:
          en: "In position 1 it is followed immediately by the verb: Außerdem ist sie hell."
          ru: "На первом месте за ним сразу идёт глагол: Außerdem ist sie hell."
          uk: "На першому місці за ним одразу йде дієслово: Außerdem ist sie hell."
        example: { de: "Die Wohnung ist groß. Außerdem ist sie sehr hell.", en: "The flat is large. In addition, it is very bright.", ru: "Квартира большая. Кроме того, она очень светлая.", uk: "Квартира велика. Крім того, вона дуже світла." }
      - form: zudem
        level: B1
        syntax: adverbial
        register: written
        meaning: { en: "moreover, in addition", ru: "вдобавок, кроме того", uk: "до того ж, крім того" }
        note:
          en: "Close to außerdem but more typical of structured or written argument. Fronted zudem is followed by the verb."
          ru: "Близко к außerdem, но чаще встречается в структурированной или письменной аргументации. После zudem в начале идёт глагол."
          uk: "Близьке до außerdem, але частіше трапляється в структурованій або писемній аргументації. Після zudem на початку йде дієслово."
        example: { de: "Der Weg ist kurz. Zudem ist er gut ausgeschildert.", en: "The route is short. Moreover, it is well signposted.", ru: "Маршрут короткий. Кроме того, он хорошо обозначен.", uk: "Маршрут короткий. До того ж він добре позначений." }

  - id: contrast
    title: { de: "Gegensatz & Korrektur", en: "Contrast and correction", ru: "Противопоставление и исправление", uk: "Протиставлення і виправлення" }
    cue: { en: "Put two facts against each other—or replace a denied one?", ru: "Противопоставить два факта — или заменить отвергнутый?", uk: "Протиставити два факти — чи замінити відкинутий?" }
    description:
      en: "Simple contrast keeps both statements true. Correction with sondern replaces what a negation rejected."
      ru: "При простом противопоставлении обе части остаются верными. Sondern после отрицания заменяет отвергнутый вариант."
      uk: "При простому протиставленні обидві частини лишаються правдивими. Sondern після заперечення замінює відкинутий варіант."
    entries:
      - form: aber
        level: A1
        syntax: coordinating
        meaning: { en: "but; neutral contrast", ru: "но; нейтральное противопоставление", uk: "але; нейтральне протиставлення" }
        note:
          en: "Both parts remain true, and the clause after aber keeps normal main-clause order."
          ru: "Обе части остаются верными, а после aber сохраняется обычный порядок главного предложения."
          uk: "Обидві частини лишаються правдивими, а після aber зберігається звичайний порядок головного речення."
        example: { de: "Das Zimmer ist klein, aber es ist ruhig.", en: "The room is small, but it is quiet.", ru: "Комната маленькая, но тихая.", uk: "Кімната маленька, але тиха." }
      - form: sondern
        level: A2
        syntax: coordinating
        meaning: { en: "but rather; correction after negation", ru: "а, а наоборот; исправление после отрицания", uk: "а, а навпаки; виправлення після заперечення" }
        note:
          en: "Use it only when the first part explicitly denies X and the second replaces X with Y."
          ru: "Употребляется, только когда первая часть явно отрицает X, а вторая заменяет X на Y."
          uk: "Вживається лише тоді, коли перша частина явно заперечує X, а друга замінює X на Y."
        example: { de: "Wir treffen uns nicht am Freitag, sondern am Samstag.", en: "We are not meeting on Friday but on Saturday.", ru: "Мы встречаемся не в пятницу, а в субботу.", uk: "Ми зустрічаємося не в п'ятницю, а в суботу." }
      - form: jedoch
        level: B1
        syntax: adverbial
        register: written
        meaning: { en: "however, yet", ru: "однако, всё же", uk: "однак, проте" }
        note:
          en: "More typical of writing than aber. In position 1 it takes the verb with it: Jedoch ist der Weg steil."
          ru: "Характернее для письма, чем aber. На первом месте за ним идёт глагол: Jedoch ist der Weg steil."
          uk: "Характерніше для письма, ніж aber. На першому місці за ним іде дієслово: Jedoch ist der Weg steil."
        example: { de: "Der Weg ist kurz. Jedoch ist er ziemlich steil.", en: "The route is short. However, it is quite steep.", ru: "Маршрут короткий. Однако он довольно крутой.", uk: "Маршрут короткий. Однак він доволі крутий." }

  - id: cause
    title: { de: "Grund", en: "Cause", ru: "Причина", uk: "Причина" }
    cue: { en: "Explain why?", ru: "Объяснить почему?", uk: "Пояснити чому?" }
    description:
      en: "These introduce the reason. Their meaning overlaps, but their sentence structure and discourse use differ."
      ru: "Эти слова вводят причину. Значение похоже, но структура предложения и употребление различаются."
      uk: "Ці слова вводять причину. Значення схоже, але будова речення і вживання різняться."
    entries:
      - form: weil
        level: A2
        syntax: subordinating
        meaning: { en: "because; the normal productive choice", ru: "потому что; обычный активный вариант", uk: "тому що; звичайний активний варіант" }
        note:
          en: "It opens a subordinate clause, so the conjugated verb goes to the end."
          ru: "Вводит придаточное, поэтому спрягаемый глагол уходит в конец."
          uk: "Вводить підрядне речення, тому відмінюване дієслово йде в кінець."
        example: { de: "Ich bleibe zu Hause, weil ich krank bin.", en: "I am staying at home because I am ill.", ru: "Я остаюсь дома, потому что болен.", uk: "Я лишаюся вдома, тому що хворий." }
      - form: denn
        level: A2
        syntax: coordinating
        meaning: { en: "because, for", ru: "ведь, потому что", uk: "адже, бо" }
        note:
          en: "It connects a following main clause and changes nothing in its word order."
          ru: "Присоединяет следующее главное предложение и не меняет его порядок слов."
          uk: "Приєднує наступне головне речення і нічого не змінює в його порядку слів."
        example: { de: "Ich bleibe zu Hause, denn ich bin krank.", en: "I am staying at home because I am ill.", ru: "Я остаюсь дома, ведь я болен.", uk: "Я лишаюся вдома, адже я хворий." }
      - form: da
        level: B1
        syntax: subordinating
        register: written
        meaning: { en: "since, as; a reason treated as known or backgrounded", ru: "так как, поскольку; причина как известный фон", uk: "оскільки, позаяк; причина як відоме тло" }
        note:
          en: "This is causal da, not locative da. Its subordinate clause is often placed first, and its verb goes to the end."
          ru: "Это причинное da, а не da со значением места. Такое придаточное часто ставят первым, а глагол уходит в конец."
          uk: "Це причинове da, а не da зі значенням місця. Таке підрядне часто ставлять першим, а дієслово йде в кінець."
        example: { de: "Da der Zug ausfällt, nehmen wir den Bus.", en: "Since the train is cancelled, we are taking the bus.", ru: "Так как поезд отменён, мы поедем на автобусе.", uk: "Оскільки потяг скасовано, ми поїдемо автобусом." }

  - id: result
    title: { de: "Folge & Schluss", en: "Result and conclusion", ru: "Следствие и вывод", uk: "Наслідок і висновок" }
    cue: { en: "Say what follows from it?", ru: "Сказать, что из этого следует?", uk: "Сказати, що з цього випливає?" }
    description:
      en: "The reason normally comes first; the connector points forward to its consequence."
      ru: "Причина обычно стоит первой, а связка указывает вперёд на следствие."
      uk: "Причина зазвичай стоїть першою, а сполучна ланка вказує вперед на наслідок."
    entries:
      - form: deshalb
        level: A2
        syntax: adverbial
        meaning: { en: "therefore, that is why", ru: "поэтому", uk: "тому" }
        note:
          en: "It introduces the consequence, not the reason. In position 1 it is followed by the verb."
          ru: "Вводит следствие, а не причину. На первом месте за ним сразу идёт глагол."
          uk: "Вводить наслідок, а не причину. На першому місці за ним одразу йде дієслово."
        example: { de: "Ich bin krank. Deshalb bleibe ich zu Hause.", en: "I am ill. That is why I am staying at home.", ru: "Я болен. Поэтому остаюсь дома.", uk: "Я хворий. Тому лишаюся вдома." }
      - form: deswegen
        level: A2
        syntax: adverbial
        meaning: { en: "that is why, for that reason", ru: "поэтому, из-за этого", uk: "тому, через це" }
        note:
          en: "Interchangeable with deshalb in most everyday contexts and follows the same verb-second pattern."
          ru: "В большинстве бытовых контекстов взаимозаменяемо с deshalb и требует того же порядка с глаголом на втором месте."
          uk: "У більшості побутових контекстів взаємозамінне з deshalb і вимагає того самого порядку з дієсловом на другому місці."
        example: { de: "Der Bus hatte Verspätung. Deswegen kam ich zu spät.", en: "The bus was late. That is why I arrived late.", ru: "Автобус опоздал. Поэтому я пришёл поздно.", uk: "Автобус запізнився. Через це я прийшов пізно." }
      - form: darum
        level: B1
        syntax: adverbial
        register: spoken
        meaning: { en: "that is why, so", ru: "поэтому, вот почему", uk: "тому, ось чому" }
        note:
          en: "Common in speech. Here it means consequence; darum can also be a pronominal adverb in Worum geht es? — Darum."
          ru: "Часто встречается в речи. Здесь оно выражает следствие; darum бывает и местоименным наречием: Worum geht es? — Darum."
          uk: "Часто трапляється в мовленні. Тут воно виражає наслідок; darum буває і займенниковим прислівником: Worum geht es? — Darum."
        example: { de: "Morgen ist ein Feiertag. Darum bleibt das Geschäft zu.", en: "Tomorrow is a public holiday. That is why the shop is closed.", ru: "Завтра праздник. Поэтому магазин будет закрыт.", uk: "Завтра свято. Тому крамниця буде зачинена." }
      - form: daher
        level: B1
        syntax: adverbial
        register: written
        meaning: { en: "therefore, hence", ru: "поэтому, отсюда", uk: "тому, звідси" }
        note:
          en: "Frequent in explanations and written conclusions. Fronted daher is followed by the verb."
          ru: "Часто встречается в объяснениях и письменных выводах. После daher в начале идёт глагол."
          uk: "Часто трапляється в поясненнях і писемних висновках. Після daher на початку йде дієслово."
        example: { de: "Die Nachfrage ist sehr hoch. Daher verlängern wir die Öffnungszeiten.", en: "Demand is very high. Therefore, we are extending the opening hours.", ru: "Спрос очень высокий. Поэтому мы продлеваем часы работы.", uk: "Попит дуже високий. Тому ми продовжуємо години роботи." }

  - id: condition
    title: { de: "Bedingung", en: "Condition", ru: "Условие", uk: "Умова" }
    cue: { en: "Under what condition?", ru: "При каком условии?", uk: "За якої умови?" }
    description:
      en: "The main statement is valid only if the condition is met."
      ru: "Главная часть действует, только если условие выполнено."
      uk: "Головна частина діє лише тоді, коли умову виконано."
    entries:
      - form: wenn
        level: A2
        syntax: subordinating
        meaning: { en: "if; also when/whenever", ru: "если; также когда", uk: "якщо; також коли" }
        note:
          en: "The verb closes the wenn-clause. When that clause comes first, the main verb follows directly after the comma."
          ru: "Глагол замыкает придаточное с wenn. Если оно стоит первым, глагол главного идёт сразу после запятой."
          uk: "Дієслово замикає підрядне з wenn. Якщо воно стоїть першим, дієслово головного йде одразу після коми."
        example: { de: "Wenn ich Zeit habe, komme ich mit.", en: "If I have time, I will come along.", ru: "Если у меня будет время, я пойду с вами.", uk: "Якщо я матиму час, я піду з вами." }
      - form: falls
        level: B1
        syntax: subordinating
        meaning: { en: "if, in case; presents the condition as a possibility", ru: "если, в случае если; условие как возможность", uk: "якщо, у разі якщо; умова як можливість" }
        note:
          en: "Often close to wenn, but it more clearly leaves open whether the condition will happen."
          ru: "Часто близко к wenn, но яснее подчёркивает, что неизвестно, наступит ли условие."
          uk: "Часто близьке до wenn, але ясніше підкреслює, що невідомо, чи настане умова."
        example: { de: "Falls du später kommst, ruf mich bitte an.", en: "If you are going to be late, please call me.", ru: "Если ты опоздаешь, пожалуйста, позвони мне.", uk: "Якщо ти запізнишся, будь ласка, зателефонуй мені." }
      - form: sofern
        level: B2
        syntax: subordinating
        register: formal
        meaning: { en: "provided that, insofar as", ru: "при условии что, поскольку", uk: "за умови що, оскільки" }
        note:
          en: "Typical of formal conditions, rules and careful qualifications; not an everyday replacement for wenn."
          ru: "Характерно для формальных условий, правил и точных оговорок; это не бытовая замена wenn."
          uk: "Характерне для формальних умов, правил і точних застережень; це не побутова заміна wenn."
        example: { de: "Sie können teilnehmen, sofern noch Plätze frei sind.", en: "You may take part provided that places are still available.", ru: "Вы можете участвовать при условии, что ещё есть свободные места.", uk: "Ви можете взяти участь за умови, що ще є вільні місця." }

  - id: alternative
    title: { de: "Alternative", en: "Alternative", ru: "Альтернатива", uk: "Альтернатива" }
    cue: { en: "Offer a choice?", ru: "Предложить выбор?", uk: "Запропонувати вибір?" }
    description:
      en: "Two or more possibilities are presented as alternatives."
      ru: "Две или несколько возможностей представлены как варианты выбора."
      uk: "Дві або кілька можливостей подано як варіанти вибору."
    entries:
      - form: oder
        level: A1
        syntax: coordinating
        meaning: { en: "or", ru: "или", uk: "або" }
        note:
          en: "It joins equal alternatives and does not change their word order."
          ru: "Соединяет равноправные варианты и не меняет их порядок слов."
          uk: "Поєднує рівноправні варіанти і не змінює їхній порядок слів."
        example: { de: "Fahren wir mit dem Zug oder nehmen wir den Bus?", en: "Shall we go by train or take the bus?", ru: "Мы поедем на поезде или на автобусе?", uk: "Ми поїдемо потягом чи автобусом?" }
      - form: entweder … oder
        level: B1
        syntax: paired
        meaning: { en: "either … or", ru: "либо … либо", uk: "або … або" }
        note:
          en: "The two halves mark the alternatives explicitly; keep the structures after them parallel."
          ru: "Две части явно отмечают варианты; конструкции после них лучше строить параллельно."
          uk: "Дві частини явно позначають варіанти; конструкції після них краще будувати паралельно."
        example: { de: "Wir fahren entweder mit dem Zug oder mit dem Bus.", en: "We are travelling either by train or by bus.", ru: "Мы поедем либо на поезде, либо на автобусе.", uk: "Ми поїдемо або потягом, або автобусом." }

  - id: exception
    title: { de: "Ausnahme", en: "Exception", ru: "Исключение", uk: "Виняток" }
    cue: { en: "Exclude one case from a general statement?", ru: "Исключить один случай из общего утверждения?", uk: "Вилучити один випадок із загального твердження?" }
    description:
      en: "An otherwise general statement is narrowed by naming what does not belong to it."
      ru: "Общее утверждение сужается: называется то, что в него не входит."
      uk: "Загальне твердження звужується: називають те, що до нього не належить."
    entries:
      - form: außer
        level: A2
        syntax: prepositional
        meaning: { en: "except, apart from", ru: "кроме, за исключением", uk: "крім, за винятком" }
        note:
          en: "As a preposition it normally takes the dative: außer mir, außer dem Kind."
          ru: "Как предлог обычно требует Dativ: außer mir, außer dem Kind."
          uk: "Як прийменник зазвичай вимагає Dativ: außer mir, außer dem Kind."
        example: { de: "Außer mir kommen alle.", en: "Everyone is coming except me.", ru: "Все придут, кроме меня.", uk: "Усі прийдуть, крім мене." }
      - form: außer dass
        level: B1
        syntax: subordinating
        meaning: { en: "except that, apart from the fact that", ru: "кроме того что, если не считать что", uk: "крім того що, якщо не рахувати що" }
        note:
          en: "It introduces a whole exceptional fact, so the conjugated verb goes to the end of the dass-clause."
          ru: "Вводит целый факт-исключение, поэтому спрягаемый глагол уходит в конец придаточного с dass."
          uk: "Вводить цілий факт-виняток, тому відмінюване дієслово йде в кінець підрядного з dass."
        example: { de: "Die Wohnung gefällt mir, außer dass die Küche sehr klein ist.", en: "I like the flat, except that the kitchen is very small.", ru: "Мне нравится квартира, если не считать того, что кухня очень маленькая.", uk: "Квартира мені подобається, якщо не рахувати того, що кухня дуже маленька." }

  - id: otherwise
    title: { de: "Andernfalls", en: "Otherwise", ru: "Иначе", uk: "Інакше" }
    cue: { en: "Warn what happens if the first instruction is not followed?", ru: "Предупредить, что случится, если первое не выполнить?", uk: "Попередити, що станеться, якщо перше не виконати?" }
    description:
      en: "Sonst points to the alternative consequence: if not X, then Y."
      ru: "Sonst указывает на альтернативное следствие: если не X, то Y."
      uk: "Sonst вказує на альтернативний наслідок: якщо не X, то Y."
    entries:
      - form: sonst
        level: A2
        syntax: adverbial
        meaning: { en: "otherwise, or else; also else", ru: "иначе, а то; также ещё", uk: "інакше, а то; також ще" }
        note:
          en: "As a connector it introduces the consequence if the first part fails. In questions such as Sonst noch etwas? it simply means else."
          ru: "Как связка вводит следствие при невыполнении первой части. В вопросах вроде Sonst noch etwas? оно просто означает «ещё»."
          uk: "Як сполучна ланка вводить наслідок, якщо першу частину не виконано. У питаннях на кшталт Sonst noch etwas? воно просто означає «ще»."
        example: { de: "Beeil dich, sonst verpassen wir den Zug.", en: "Hurry up, otherwise we will miss the train.", ru: "Поторопись, иначе мы опоздаем на поезд.", uk: "Поспіши, інакше ми запізнимося на потяг." }

  - id: concession
    title: { de: "Einräumung: unerwartete Folge", en: "Concession: an unexpected result", ru: "Уступка: неожиданное следствие", uk: "Допуст: несподіваний наслідок" }
    cue: { en: "Did the second fact happen despite the first?", ru: "Второй факт произошёл вопреки первому?", uk: "Другий факт стався всупереч першому?" }
    description:
      en: "The first fact creates an expectation; the second says that reality went the other way."
      ru: "Первый факт создаёт ожидание, а второй сообщает, что всё вышло наоборот."
      uk: "Перший факт створює очікування, а другий повідомляє, що насправді вийшло навпаки."
    entries:
      - form: trotzdem
        level: A2
        syntax: adverbial
        meaning: { en: "nevertheless, all the same", ru: "несмотря на это, всё равно", uk: "попри це, все одно" }
        note:
          en: "It introduces an unexpected consequence and follows the verb-second pattern: Trotzdem gehen wir."
          ru: "Вводит неожиданное следствие и требует глагол на втором месте: Trotzdem gehen wir."
          uk: "Вводить несподіваний наслідок і вимагає дієслова на другому місці: Trotzdem gehen wir."
        example: { de: "Es regnet. Trotzdem gehen wir spazieren.", en: "It is raining. We are going for a walk all the same.", ru: "Идёт дождь. Несмотря на это, мы идём гулять.", uk: "Іде дощ. Попри це, ми йдемо гуляти." }
      - form: dennoch
        level: B1
        syntax: adverbial
        register: written
        meaning: { en: "nevertheless, nonetheless", ru: "тем не менее, всё же", uk: "і все ж, проте" }
        note:
          en: "Very close to trotzdem, but more typical of written or carefully structured language."
          ru: "Очень близко к trotzdem, но характернее для письменной или тщательно выстроенной речи."
          uk: "Дуже близьке до trotzdem, але характерніше для писемної або ретельно вибудуваної мови."
        example: { de: "Er war müde. Dennoch arbeitete er weiter.", en: "He was tired. Nevertheless, he continued working.", ru: "Он устал. Тем не менее он продолжил работать.", uk: "Він утомився. І все ж він працював далі." }
      - form: obwohl
        level: B1
        syntax: subordinating
        meaning: { en: "although, even though", ru: "хотя, несмотря на то что", uk: "хоча, попри те що" }
        note:
          en: "It expresses the same logical relation inside a subordinate clause, so the conjugated verb goes to the end."
          ru: "Выражает ту же логическую связь внутри придаточного, поэтому спрягаемый глагол уходит в конец."
          uk: "Виражає той самий логічний зв'язок усередині підрядного, тому відмінюване дієслово йде в кінець."
        example: { de: "Obwohl es regnet, gehen wir spazieren.", en: "Although it is raining, we are going for a walk.", ru: "Хотя идёт дождь, мы идём гулять.", uk: "Хоча йде дощ, ми йдемо гуляти." }
      - form: gleichwohl
        level: B2
        syntax: adverbial
        register: formal
        meaning: { en: "nevertheless, even so", ru: "всё же, тем не менее", uk: "все ж, а проте" }
        note:
          en: "A distinctly formal or literary alternative; recognise it, but prefer trotzdem or dennoch in ordinary communication."
          ru: "Явно формальный или книжный вариант; его полезно узнавать, но в обычной речи лучше trotzdem или dennoch."
          uk: "Виразно формальний або книжний варіант; його варто впізнавати, але у звичайному спілкуванні краще trotzdem або dennoch."
        example: { de: "Es gab erhebliche Zweifel. Gleichwohl wurde der Plan umgesetzt.", en: "There were considerable doubts. Even so, the plan was implemented.", ru: "Были серьёзные сомнения. Тем не менее план осуществили.", uk: "Були серйозні сумніви. А проте план здійснили." }

  - id: qualification
    title: { de: "Einschränkung", en: "Qualification and limitation", ru: "Оговорка и ограничение", uk: "Застереження і обмеження" }
    cue: { en: "Accept the first statement, but narrow it?", ru: "Признать первую часть, но ограничить её?", uk: "Визнати першу частину, але обмежити її?" }
    description:
      en: "The second statement does not overturn an expectation; it adds a reservation to the first."
      ru: "Вторая часть не ломает ожидание, а добавляет к первой оговорку."
      uk: "Друга частина не ламає очікування, а додає до першої застереження."
    entries:
      - form: allerdings
        level: B1
        syntax: adverbial
        meaning: { en: "however, admittedly; yes, but …", ru: "правда, однако; да, но…", uk: "щоправда, однак; так, але…" }
        note:
          en: "It acknowledges the first assessment and then limits it. Unlike trotzdem, it need not describe a surprising action despite an obstacle."
          ru: "Подтверждает первую оценку, а затем ограничивает её. В отличие от trotzdem, не обязано описывать неожиданное действие вопреки препятствию."
          uk: "Підтверджує першу оцінку, а потім обмежує її. На відміну від trotzdem, не мусить описувати несподівану дію всупереч перешкоді."
        example: { de: "Das Hotel ist schön. Allerdings ist es ziemlich teuer.", en: "The hotel is nice. It is rather expensive, however.", ru: "Отель хороший. Правда, он довольно дорогой.", uk: "Готель гарний. Щоправда, він доволі дорогий." }

comparisons:
  - id: reason-result
    title: { de: "weil, denn oder deshalb?", en: "weil, denn or deshalb?", ru: "weil, denn или deshalb?", uk: "weil, denn чи deshalb?" }
    explanation:
      en: "Weil and denn introduce the reason; deshalb introduces the result. Weil sends its verb to the end, denn leaves main-clause order unchanged, and deshalb in position 1 is followed by the verb."
      ru: "Weil и denn вводят причину, deshalb — следствие. Weil отправляет глагол в конец, denn сохраняет порядок главного предложения, а после deshalb на первом месте сразу идёт глагол."
      uk: "Weil і denn вводять причину, deshalb — наслідок. Weil відправляє дієслово в кінець, denn зберігає порядок головного речення, а після deshalb на першому місці одразу йде дієслово."
    examples:
      - { de: "Ich bleibe zu Hause, weil ich krank bin.", en: "I am staying at home because I am ill.", ru: "Я остаюсь дома, потому что болен.", uk: "Я лишаюся вдома, тому що хворий." }
      - { de: "Ich bleibe zu Hause, denn ich bin krank.", en: "I am staying at home because I am ill.", ru: "Я остаюсь дома, ведь я болен.", uk: "Я лишаюся вдома, адже я хворий." }
      - { de: "Ich bin krank. Deshalb bleibe ich zu Hause.", en: "I am ill. That is why I am staying at home.", ru: "Я болен. Поэтому остаюсь дома.", uk: "Я хворий. Тому лишаюся вдома." }
  - id: expected-unexpected
    title: { de: "deshalb oder trotzdem?", en: "deshalb or trotzdem?", ru: "deshalb или trotzdem?", uk: "deshalb чи trotzdem?" }
    explanation:
      en: "Both introduce a consequence and both use verb-second order. Deshalb gives the expected consequence; trotzdem gives the one that contradicts the expectation."
      ru: "Оба вводят следствие и требуют глагол на втором месте. Deshalb называет ожидаемое следствие, trotzdem — то, которое противоречит ожиданию."
      uk: "Обидва вводять наслідок і вимагають дієслова на другому місці. Deshalb називає очікуваний наслідок, trotzdem — той, що суперечить очікуванню."
    examples:
      - { de: "Es regnet. Deshalb bleiben wir zu Hause.", en: "It is raining. Therefore, we are staying at home.", ru: "Идёт дождь. Поэтому мы остаёмся дома.", uk: "Іде дощ. Тому ми лишаємося вдома." }
      - { de: "Es regnet. Trotzdem gehen wir spazieren.", en: "It is raining. We are going for a walk all the same.", ru: "Идёт дождь. Несмотря на это, мы идём гулять.", uk: "Іде дощ. Попри це, ми йдемо гуляти." }
  - id: contrast-correction-qualification
    title: { de: "aber, sondern oder allerdings?", en: "aber, sondern or allerdings?", ru: "aber, sondern или allerdings?", uk: "aber, sondern чи allerdings?" }
    explanation:
      en: "Aber contrasts two true facts. Sondern replaces something explicitly denied. Allerdings accepts an assessment and then adds a limiting reservation."
      ru: "Aber противопоставляет два верных факта. Sondern заменяет явно отвергнутый вариант. Allerdings принимает оценку и затем добавляет ограничивающую оговорку."
      uk: "Aber протиставляє два правдиві факти. Sondern замінює явно відкинутий варіант. Allerdings приймає оцінку і потім додає обмежувальне застереження."
    examples:
      - { de: "Das Zimmer ist klein, aber es ist ruhig.", en: "The room is small, but it is quiet.", ru: "Комната маленькая, но тихая.", uk: "Кімната маленька, але тиха." }
      - { de: "Das Zimmer ist nicht groß, sondern nur praktisch eingerichtet.", en: "The room is not large; rather, it is merely furnished practically.", ru: "Комната не большая, а просто практично обставлена.", uk: "Кімната не велика, а просто практично облаштована." }
      - { de: "Das Zimmer ist schön. Allerdings ist es teuer.", en: "The room is nice. It is expensive, however.", ru: "Комната хорошая. Правда, она дорогая.", uk: "Кімната гарна. Щоправда, вона дорога." }
  - id: concession-otherwise
    title: { de: "trotzdem, dennoch oder sonst?", en: "trotzdem, dennoch or sonst?", ru: "trotzdem, dennoch или sonst?", uk: "trotzdem, dennoch чи sonst?" }
    explanation:
      en: "Trotzdem and dennoch both mean that something happened despite the first fact; dennoch is more written. Sonst does not express concession: it names what will happen if the first condition is not met."
      ru: "Trotzdem и dennoch сообщают, что нечто произошло вопреки первому факту; dennoch более книжное. Sonst не выражает уступку: оно называет то, что случится, если первое условие не выполнить."
      uk: "Trotzdem і dennoch повідомляють, що щось сталося всупереч першому факту; dennoch більш книжне. Sonst не виражає допусту: воно називає те, що станеться, якщо першу умову не виконати."
    examples:
      - { de: "Es regnet. Trotzdem gehen wir.", en: "It is raining. We are going all the same.", ru: "Идёт дождь. Мы всё равно идём.", uk: "Іде дощ. Ми все одно йдемо." }
      - { de: "Es regnet. Dennoch gehen wir.", en: "It is raining. Nevertheless, we are going.", ru: "Идёт дождь. Тем не менее мы идём.", uk: "Іде дощ. І все ж ми йдемо." }
      - { de: "Nimm einen Schirm mit, sonst wirst du nass.", en: "Take an umbrella, otherwise you will get wet.", ru: "Возьми зонт, иначе промокнешь.", uk: "Візьми парасольку, інакше змокнеш." }
