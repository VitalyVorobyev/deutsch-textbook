id: cases
articles:
  - { case: Nominativ, masculine: "der / ein / kein", feminine: "die / eine / keine", neuter: "das / ein / kein", plural: "die / — / keine" }
  - { case: Akkusativ, masculine: "den / einen / keinen", feminine: "die / eine / keine", neuter: "das / ein / kein", plural: "die / — / keine" }
  - { case: Dativ, masculine: "dem / einem / keinem", feminine: "der / einer / keiner", neuter: "dem / einem / keinem", plural: "den (+ -n) / keinen (+ -n)" }
pronouns:
  - { nominative: ich, accusative: mich, dative: mir }
  - { nominative: du, accusative: dich, dative: dir }
  - { nominative: er, accusative: ihn, dative: ihm }
  - { nominative: sie, accusative: sie, dative: ihr }
  - { nominative: es, accusative: es, dative: ihm }
  - { nominative: wir, accusative: uns, dative: uns }
  - { nominative: ihr, accusative: euch, dative: euch }
  - { nominative: sie, accusative: sie, dative: ihnen }
  - { nominative: Sie, accusative: Sie, dative: Ihnen }
prepositions:
  accusative:
    - { form: durch }
    - { form: für }
    - { form: gegen }
    - { form: ohne }
    - { form: um }
  dative:
    - { form: aus, example: "Er kommt aus der Schweiz." }
    - { form: außer, example: "Außer mir kommen alle." }
    - { form: bei, example: "Sie wohnt bei ihren Eltern." }
    - { form: gegenüber, example: "Die Bank ist dem Bahnhof gegenüber." }
    - { form: mit, example: "Wir fahren mit dem Bus." }
    - { form: nach, example: "Nach dem Essen gehen wir spazieren." }
    - { form: seit, example: "Ich lerne seit einem Jahr Deutsch." }
    - { form: von, example: "Das Geschenk ist von meiner Oma." }
    - { form: zu, example: "Ich gehe zum Arzt." }
  # Minimal pairs: the noun stays, the article moves. The verb has to change with
  # it — that is the point, not an inconsistency. A goal-directed verb (stellen,
  # legen, setzen, hängen, gehen) takes the accusative; its positional twin
  # (stehen, liegen, sitzen, hängen, wohnen) takes the dative.
  two_way:
    - form: an
      wohin: "Ich hänge das Bild an die Wand."
      wo: "Das Bild hängt an der Wand."
    - form: auf
      wohin: "Ich lege das Buch auf den Tisch."
      wo: "Das Buch liegt auf dem Tisch."
    - form: hinter
      wohin: "Er stellt das Fahrrad hinter das Haus."
      wo: "Das Fahrrad steht hinter dem Haus."
    - form: in
      wohin: "Ich gehe in die Stadt."
      wo: "Ich wohne in der Stadt."
    - form: neben
      wohin: "Sie setzt sich neben ihren Bruder."
      wo: "Sie sitzt neben ihrem Bruder."
    - form: über
      wohin: "Er hängt die Lampe über den Tisch."
      wo: "Die Lampe hängt über dem Tisch."
    - form: unter
      wohin: "Die Katze läuft unter das Bett."
      wo: "Die Katze schläft unter dem Bett."
    - form: vor
      wohin: "Ich stelle das Auto vor die Tür."
      wo: "Das Auto steht vor der Tür."
    # Plural, so the dative shows its -n as well as the article.
    - form: zwischen
      wohin: "Er setzt sich zwischen die Kinder."
      wo: "Er sitzt zwischen den Kindern."
