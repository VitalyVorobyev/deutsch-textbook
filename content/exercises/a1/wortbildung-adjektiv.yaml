topic: wortbildung
role: practice
stage: geruest
activity: extension
title_de: "Grundübung — un-, -los und -bar"
title: {en: "Core — un-, -los and -bar", ru: "Основа — un-, -los и -bar", uk: "Основа — un-, -los та -bar"}
items:
  - id: mc-unklar
    outcomes: [wortbildung-adjektive]
    type: cloze
    focus: wortbildung-adjektiv
    instruction: {en: "Negate klar with one adjective.", ru: "Отрицайте klar одним прилагательным.", uk: "Заперечте klar одним прикметником."}
    text: "klar → {{unklar}}"
    explain: {en: "un- negates the adjective: klar → unklar. It changes the quality, not the noun.", ru: "un- отрицает прилагательное: klar → unklar. Меняется качество, не существительное.", uk: "un- заперечує прикметник: klar → unklar. Змінюється якість, не іменник."}
  - id: mc-zuckerlos
    outcomes: [wortbildung-adjektive]
    type: cloze
    focus: wortbildung-adjektiv
    instruction: {en: "Build the adjective meaning ohne Zucker.", ru: "Образуйте прилагательное со значением ohne Zucker.", uk: "Утворіть прикметник зі значенням ohne Zucker."}
    text: "ohne Zucker = {{zuckerlos}}"
    explain: {en: "-los means without: zuckerlos = ohne Zucker. It does not mean a small amount; there is none.", ru: "-los означает «без»: zuckerlos = ohne Zucker. Это не «мало сахара», а его отсутствие.", uk: "-los означає «без»: zuckerlos = ohne Zucker. Це не «мало цукру», а його відсутність."}
  - id: mc-lesbar
    outcomes: [wortbildung-adjektive]
    type: cloze
    focus: wortbildung-adjektiv
    instruction: {en: "Build the adjective meaning kann gelesen werden.", ru: "Образуйте прилагательное со значением kann gelesen werden.", uk: "Утворіть прикметник зі значенням kann gelesen werden."}
    text: "lesen → {{lesbar}}"
    explain: {en: "Verb + -bar expresses possibility: lesbar = can be read. The writing does not perform the action itself.", ru: "Глагол + -bar выражает возможность: lesbar = можно прочитать. Надпись сама ничего не читает.", uk: "Дієслово + -bar виражає можливість: lesbar = можна прочитати. Напис сам нічого не читає."}
  - id: cloze-trinkbar
    outcomes: [wortbildung-adjektive]
    type: cloze
    focus: wortbildung-adjektiv
    instruction: {en: "Form the adjective meaning 'safe/possible to drink'.", ru: "Образуйте прилагательное «пригодный для питья».", uk: "Утворіть прикметник «придатний для пиття»."}
    text: "Das Wasser ist {{trinkbar}}."
    explain: {en: "trinken + -bar → trinkbar: the water can be drunk. The stem is trink-, without infinitive -en.", ru: "trinken + -bar → trinkbar: воду можно пить. Берётся основа trink- без инфинитивного -en.", uk: "trinken + -bar → trinkbar: воду можна пити. Береться основа trink- без інфінітивного -en."}
  - id: mc-hellblau
    outcomes: [wortbildung-adjektive]
    type: cloze
    focus: wortbildung-adjektiv
    instruction: {en: "Join the two adjective meanings.", ru: "Соедините два значения прилагательных.", uk: "Поєднайте два значення прикметників."}
    text: "hell + blau = {{hellblau}}"
    explain: {en: "Two adjective meanings combine: hell + blau = light blue. Neither piece changes the word class.", ru: "Соединяются два значения прилагательных: hell + blau = светло-голубой. Часть речи не меняется.", uk: "Поєднуються два значення прикметників: hell + blau = світло-блакитний. Частина мови не змінюється."}
