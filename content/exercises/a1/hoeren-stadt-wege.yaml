topic: stadt-wege
role: practice
title: { en: "Listening — asking the way", ru: "Аудирование — как спросить дорогу", uk: "Аудіювання — як спитати дорогу" }
items:
  - id: hoeren-zweite-strasse
    outcomes: [stadt-wegbeschreibung-verstehen]
    type: listen
    instruction: { en: "Listen and type what you hear.", ru: "Прослушайте и напишите, что вы слышите.", uk: "Прослухайте й напишіть, що ви чуєте." }
    text: "Die zweite Straße links, dann geradeaus."
    translation: { en: "The second street on the left, then straight ahead.", ru: "Вторая улица налево, потом прямо.", uk: "Друга вулиця ліворуч, потім прямо." }
    explain: { en: "Straße is a noun — capitalized and written with ß; zweite and geradeaus stay lowercase.", ru: "Straße — существительное: с большой буквы и с ß; zweite и geradeaus — со строчной.", uk: "Straße — іменник: з великої літери і з ß; zweite і geradeaus — з малої." }
  - id: hoeren-gehen-sie
    outcomes: [stadt-wegbeschreibung-verstehen]
    type: listen
    instruction: { en: "Listen and type what you hear.", ru: "Прослушайте и напишите, что вы слышите.", uk: "Прослухайте й напишіть, що ви чуєте." }
    text: "Gehen Sie geradeaus und dann rechts."
    translation: { en: "Go straight ahead and then right.", ru: "Идите прямо, потом направо.", uk: "Ідіть прямо, потім праворуч." }
    explain: { en: "Gehen Sie … is the polite formula locals use for directions. Sie is capitalized — it is the polite 'you'.", ru: "Gehen Sie … — вежливая формула, которой объясняют дорогу. Sie пишется с большой буквы — это вежливое «вы».", uk: "Gehen Sie … — ввічлива формула, якою пояснюють дорогу. Sie пишеться з великої літери — це ввічливе «ви»." }