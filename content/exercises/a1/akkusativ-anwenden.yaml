topic: akkusativ
role: practice
stage: transfer
activity: application
title_de: "Anwenden — Im Café und im Alltag"
title:
  en: Application — the accusative in everyday situations
  ru: Применение — Akkusativ в повседневных ситуациях
  uk: Застосування — Akkusativ у повсякденних ситуаціях
items:
  - id: uebersetzen-hund
    outcomes: [akkusativ-objekte]
    type: translate
    focus: akkusativ-artikel
    instruction:
      en: Translate into German.
      ru: Переведите на немецкий.
      uk: Перекладіть німецькою.
    prompt_en: "I have a dog."
    prompt_ru: "У меня есть собака."
    prompt_uk: "У мене є собака."
    answer: "Ich habe einen Hund."
    key_tokens: ["einen"]
    explain:
      en: "haben always takes the accusative, and der Hund is masculine, so ein → einen: Ich habe einen Hund."
      ru: "Глагол haben всегда требует Akkusativ, а der Hund — мужского рода, поэтому ein → einen: Ich habe einen Hund."
      uk: "Дієслово haben завжди вимагає Akkusativ, а der Hund — чоловічого роду, тому ein → einen: Ich habe einen Hund."
  - id: uebersetzen-kaffee
    outcomes: [akkusativ-objekte]
    type: translate
    focus: akkusativ-artikel
    revision: 2
    instruction:
      en: Translate into German. Use the indefinite article (ein-).
      ru: Переведите на немецкий. Используйте неопределённый артикль (ein-).
      uk: Перекладіть німецькою. Вживайте неозначений артикль (ein-).
    prompt_en: "He is drinking a coffee."
    prompt_ru: "Он пьёт кофе."
    prompt_uk: "Він п'є каву."
    answer: "Er trinkt einen Kaffee."
    key_tokens: ["einen"]
    explain:
      en: "The coffee is the direct object of trinken, and der Kaffee is masculine: ein → einen. And remember the capital K — every German noun is capitalized."
      ru: "Кофе — прямое дополнение при глаголе trinken, а der Kaffee — мужского рода: ein → einen. И не забудьте заглавную K — все существительные в немецком пишутся с большой буквы."
      uk: "Кава — прямий додаток при дієслові trinken, а der Kaffee — чоловічого роду: ein → einen. І не забудьте велику K — усі іменники в німецькій пишуться з великої літери. Зверніть увагу: українська «кава» жіночого роду, а der Kaffee — чоловічого."
  - id: uebersetzen-lampe
    outcomes: [akkusativ-objekte]
    type: translate
    focus: verbzweit
    revision: 2
    instruction:
      en: Translate into German.
      ru: Переведите на немецкий.
      uk: Перекладіть німецькою.
    prompt_en: "Tomorrow I am buying a lamp."
    prompt_ru: "Завтра я куплю лампу."
    prompt_uk: "Завтра я куплю лампу."
    answer: "Morgen kaufe ich eine Lampe."
    key_tokens: ["kaufe"]
    accept:
      - "Ich kaufe morgen eine Lampe."
      # Russian and Ukrainian mark no definiteness on a bare noun: «лампу» fixes
      # neither article, so the definite rendering answers the prompt the RU/UK
      # learner was shown. The graded token is kaufe, not the determiner.
      - "Morgen kaufe ich die Lampe."
      - "Ich kaufe morgen die Lampe."
    explain:
      en: "Both word orders are correct: Morgen kaufe ich … (the verb stays second, the subject moves behind it) and Ich kaufe morgen …. die Lampe is feminine, so eine does not change in the accusative."
      ru: "Правильны оба порядка слов: Morgen kaufe ich … (глагол остаётся на втором месте, подлежащее уходит за него) и Ich kaufe morgen …. die Lampe — женского рода, поэтому eine в Akkusativ не меняется."
      uk: "Правильні обидва порядки слів: Morgen kaufe ich … (дієслово лишається на другому місці, підмет іде за нього) та Ich kaufe morgen …. die Lampe — жіночого роду, тому eine в Akkusativ не змінюється."
