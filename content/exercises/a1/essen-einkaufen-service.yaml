topic: essen-trinken
role: practice
stage: transfer
activity: application
title_de: "Anwenden — Essen und Trinken"
title:
  en: Practice — quantities, ordering and paying
  ru: Практика — количество, заказ и оплата
  uk: Практика — кількість, замовлення та оплата
items:
  - id: vorlieben-sprechen
    outcomes: [essen-vorlieben]
    type: speak
    target_mode: spoken-production
    mode: spoken-production
    prompt: { en: "Say what you like to eat and drink, and what you do not like.", ru: "Расскажите, что вы любите есть и пить, а что не любите.", uk: "Розкажіть, що ви любите їсти й пити, а що не любите." }
    goal: { en: "Produce three short preference sentences.", ru: "Скажите три коротких предложения о предпочтениях.", uk: "Скажіть три короткі речення про вподобання." }
    checklist:
      - { en: "I used gern with an activity and mag with a thing.", ru: "Я использовал(а) gern с действием и mag с предметом.", uk: "Я використав(-ла) gern із дією та mag із предметом." }
      - { en: "I included one negative preference.", ru: "Я назвал(а) одно отрицательное предпочтение.", uk: "Я назвав(-ла) одне негативне вподобання." }
    model_answer: "Ich esse gern Gemüse. Ich trinke gern Tee. Kaffee mag ich nicht."
    model_translation: { en: "I like eating vegetables. I like drinking tea. I do not like coffee.", ru: "Я люблю есть овощи. Я люблю пить чай. Кофе я не люблю.", uk: "Я люблю їсти овочі. Я люблю пити чай. Каву я не люблю." }
    explain: { en: "Use verb + gern for an activity and mögen + noun for a thing.", ru: "Для действия используйте глагол + gern, для предмета — mögen + существительное.", uk: "Для дії використовуйте дієслово + gern, для предмета — mögen + іменник." }

  - id: im-cafe-bestellen-sprechen
    outcomes: [essen-bestellen]
    type: speak
    target_mode: spoken-interaction
    mode: spoken-interaction
    prompt: { en: "A server asks: Was möchten Sie? Order a drink and a snack, then say thank you.", ru: "Официант спрашивает: Was möchten Sie? Закажите напиток и закуску, затем поблагодарите.", uk: "Офіціант питає: Was möchten Sie? Замовте напій і перекус, потім подякуйте." }
    goal: { en: "Make one polite order with two items.", ru: "Сделайте один вежливый заказ из двух позиций.", uk: "Зробіть одне ввічливе замовлення з двох позицій." }
    checklist:
      - { en: "I used ich möchte or ich nehme.", ru: "Я использовал(а) ich möchte или ich nehme.", uk: "Я використав(-ла) ich möchte або ich nehme." }
      - { en: "I finished with bitte or danke.", ru: "Я закончил(а) словом bitte или danke.", uk: "Я завершив(-ла) словом bitte або danke." }
    model_answer: "Ich möchte einen Kaffee und ein Stück Kuchen, bitte. Danke."
    model_translation: { en: "I would like a coffee and a piece of cake, please. Thank you.", ru: "Я хотел(а) бы кофе и кусок пирога, пожалуйста. Спасибо.", uk: "Я хотів(-ла) би каву та шматок пирога, будь ласка. Дякую." }
    explain: { en: "Ich möchte …, bitte is a complete polite A1 ordering frame.", ru: "Ich möchte …, bitte — готовая вежливая модель заказа на A1.", uk: "Ich möchte …, bitte — готова ввічлива модель замовлення на A1." }

  - id: bezahlen-sprechen
    outcomes: [essen-service-bezahlen]
    type: speak
    target_mode: spoken-interaction
    mode: spoken-interaction
    prompt: { en: "You have finished eating. Ask for the bill and say whether you pay by card or cash.", ru: "Вы закончили есть. Попросите счёт и скажите, платите картой или наличными.", uk: "Ви закінчили їсти. Попросіть рахунок і скажіть, платите карткою чи готівкою." }
    goal: { en: "Use two service phrases in one short turn.", ru: "Используйте две сервисные фразы в одной короткой реплике.", uk: "Використайте дві сервісні фрази в одній короткій репліці." }
    checklist:
      - { en: "I asked for the bill politely.", ru: "Я вежливо попросил(а) счёт.", uk: "Я ввічливо попросив(-ла) рахунок." }
      - { en: "I named the payment method.", ru: "Я назвал(а) способ оплаты.", uk: "Я назвав(-ла) спосіб оплати." }
    model_answer: "Die Rechnung, bitte. Ich zahle mit Karte."
    model_translation: { en: "The bill, please. I am paying by card.", ru: "Счёт, пожалуйста. Я плачу картой.", uk: "Рахунок, будь ласка. Я плачу карткою." }
    explain: { en: "Die Rechnung, bitte is the compact request; mit Karte and bar name the two usual payment options.", ru: "Die Rechnung, bitte — краткая просьба; mit Karte и bar называют два обычных способа оплаты.", uk: "Die Rechnung, bitte — коротке прохання; mit Karte та bar називають два звичні способи оплати." }

  - id: match-mengen
    outcomes: [essen-service-bezahlen]
    type: match
    instruction:
      en: Match each quantity with the product it typically goes with.
      ru: Соедините меру с продуктом, с которым она обычно употребляется.
      uk: З'єднайте міру з продуктом, з яким вона зазвичай вживається.
    pairs:
      - { left: "eine Flasche", right: "Wasser" }
      - { left: "ein Stück", right: "Kuchen" }
      - { left: "ein Kilo", right: "Äpfel" }
    explain:
      en: "You buy liquids by the bottle (eine Flasche Wasser), cake by the piece (ein Stück Kuchen) and fruit by weight (ein Kilo Äpfel). German puts the two nouns directly next to each other — no 'of': eine Flasche Wasser."
      ru: "Жидкости покупают бутылками (eine Flasche Wasser), пирог — кусками (ein Stück Kuchen), фрукты — на вес (ein Kilo Äpfel). Немецкий ставит два существительных подряд: eine Flasche Wasser — второе слово не меняется, никакого родительного падежа, как в «бутылка воды»."
      uk: "Рідини купують пляшками (eine Flasche Wasser), пиріг — шматками (ein Stück Kuchen), фрукти — на вагу (ein Kilo Äpfel). Німецька ставить два іменники поспіль: eine Flasche Wasser — друге слово не змінюється, жодного родового відмінка, як в «пляшка води»."

  - id: cloze-nehmen
    outcomes: [essen-service-bezahlen]
    type: cloze
    focus: akkusativ-artikel
    instruction:
      en: Fill in the article.
      ru: Вставьте артикль.
      uk: Вставте артикль.
    text: "Ich nehme {{einen}} Kaffee und ein Stück Kuchen."
    translation:
      en: I'll take a coffee and a piece of cake.
      ru: Я возьму кофе и кусок пирога.
      uk: Я візьму каву і шматок пирога.
    explain:
      en: "nehmen takes the accusative: der Kaffee → einen Kaffee. Only masculine changes — neuter ein Stück stays ein."
      ru: "После nehmen — Akkusativ: der Kaffee → einen Kaffee. Меняется только мужской род; средний род не меняется: ein Stück."
      uk: "Після nehmen — Akkusativ: der Kaffee → einen Kaffee. Змінюється лише чоловічий рід; середній рід не змінюється: ein Stück."

  - id: mc-es-gibt
    outcomes: [essen-service-bezahlen]
    type: mc
    focus: akkusativ-artikel
    prompt: "Gibt es auch ___ Salat ohne Fleisch?"
    options: ["einen", "ein", "eine"]
    correct: 0
    translation:
      en: Is there also a salad without meat?
      ru: А есть салат без мяса?
      uk: А є салат без м'яса?
    explain:
      en: "Gibt es …? is the standard way to ask for an alternative, and es gibt always takes the accusative: der Salat → einen Salat."
      ru: "Gibt es …? — стандартный способ спросить про альтернативу, и после es gibt всегда стоит Akkusativ: der Salat → einen Salat."
      uk: "Gibt es …? — стандартний спосіб запитати про альтернативу, і після es gibt завжди стоїть Akkusativ: der Salat → einen Salat."

  - id: cloze-kostet
    outcomes: [essen-service-bezahlen]
    type: cloze
    focus: akkusativ-artikel
    instruction:
      en: Fill in the article.
      ru: Вставьте артикль.
      uk: Вставте артикль.
    text: "Was kostet {{der}} Kaffee? — Zwei Euro fünfzig."
    translation:
      en: How much is the coffee? — Two euros fifty.
      ru: Сколько стоит кофе? — Два евро пятьдесят.
      uk: Скільки коштує кава? — Два євро п'ятдесят.
    explain:
      en: "With kosten the item is the subject of the sentence, so it stays nominative: Was kostet der Kaffee? Don't switch to den — nothing here takes an accusative object article."
      ru: "При kosten предмет — подлежащее, поэтому он остаётся в Nominativ: Was kostet der Kaffee? Не ставьте den: кофе здесь сам «действует» — стоит денег, а не является объектом."
      uk: "При kosten предмет — підмет речення, тому він залишається в Nominativ: Was kostet der Kaffee? Не ставте den: кава тут сама «діє» — коштує грошей, а не є об'єктом."

  - id: match-dialog
    outcomes: [essen-service-bezahlen]
    type: match
    instruction:
      en: Match each line in the shop or café with the fitting reply.
      ru: Соедините реплику в магазине или кафе с подходящим ответом.
      uk: З'єднайте репліку в магазині чи кафе з доречною відповіддю.
    pairs:
      - { left: "Sonst noch etwas?", right: "Nein, danke. Das ist alles." }
      - { left: "Wo bezahle ich?", right: "An der Kasse." }
      - { left: "Das macht sechs Euro.", right: "Hier, bitte." }
    explain:
      en: "Sonst noch etwas? (anything else?) comes while you order; Das macht … announces the total; die Kasse is the checkout, so An der Kasse answers the question wo?."
      ru: "Sonst noch etwas? («что-нибудь ещё?») звучит во время заказа; Das macht … называет итоговую сумму; die Kasse — касса, поэтому An der Kasse отвечает на вопрос wo?."
      uk: "Sonst noch etwas? («щось іще?») звучить під час замовлення; Das macht … називає підсумкову суму; die Kasse — каса, тому An der Kasse відповідає на питання wo?."

  - id: mc-zahlen
    outcomes: [essen-service-bezahlen]
    type: mc
    prompt: "Im Café: Sie sind fertig. Was sagen Sie?"
    options: ["Zahlen, bitte!", "Guten Appetit!", "Sonst noch etwas?"]
    correct: 0
    translation:
      en: "At the café: you are done. What do you say?"
      ru: "В кафе: вы закончили. Что вы говорите?"
      uk: "У кафе: ви закінчили. Що ви кажете?"
    explain:
      en: "To ask for the bill you say Zahlen, bitte! or Die Rechnung, bitte! — die Rechnung is the bill (US: the check). Guten Appetit! is said at the start of the meal, and Sonst noch etwas? is the server's line."
      ru: "Чтобы попросить счёт, говорят Zahlen, bitte! или Die Rechnung, bitte! — как наше «Счёт, пожалуйста!». Zahlen, bitte — буквально «платить, пожалуйста»; в русском такой формулы нет. Guten Appetit! говорят в начале еды, а Sonst noch etwas? — реплика официанта."
      uk: "Щоб попросити рахунок, кажуть Zahlen, bitte! або Die Rechnung, bitte! — як наше «Рахунок, будь ласка!». Zahlen, bitte — буквально «платити, будь ласка»; в українській такої формули немає. Guten Appetit! кажуть на початку їжі, а Sonst noch etwas? — репліка офіціанта."

  - id: mc-getrennt
    outcomes: [essen-service-bezahlen]
    type: mc
    prompt: "Die Kellnerin fragt: „Zusammen oder getrennt?“ Sie bezahlen nicht zusammen. Was antworten Sie?"
    options: ["Getrennt, bitte.", "Ja, bitte.", "Nein, danke."]
    correct: 0
    translation:
      en: "The waitress asks: 'Together or separately?' You are not paying together. What do you answer?"
      ru: "Официантка спрашивает: «Вместе или раздельно?» Вы платите не вместе. Что вы отвечаете?"
      uk: "Офіціантка питає: «Разом чи окремо?» Ви платите не разом. Що ви відповідаєте?"
    explain:
      en: "Zusammen oder getrennt? is an either-or question — answer with one of the two options, never with ja or nein: Getrennt, bitte."
      ru: "В Германии официант по умолчанию спрашивает, платите вы вместе или раздельно — платить каждый за себя совершенно нормально. На альтернативный вопрос нельзя ответить ja или nein: выберите вариант — Getrennt, bitte."
      uk: "У Німеччині офіціант за замовчуванням питає, платите ви разом чи окремо — платити кожному за себе цілком нормально. На альтернативне питання не можна відповісти ja чи nein: виберіть варіант — Getrennt, bitte."

  - id: audio-zahlen-was
    outcomes: [essen-service-bezahlen]
    type: audio-comprehension
    source:
      kind: tts
      rate: 0.85
      turns:
        - { speaker: "Gast", text: "Zahlen, bitte!" }
        - { speaker: "Kellnerin", text: "Gern. Das war ein Kaffee und ein Stück Kuchen. Zusammen oder getrennt?" }
        - { speaker: "Gast", text: "Zusammen, bitte. Was macht das?" }
        - { speaker: "Kellnerin", text: "Das macht fünf Euro neunzig." }
        - { speaker: "Gast", text: "Hier sind sechs Euro. Stimmt so." }
        - { speaker: "Kellnerin", text: "Vielen Dank!" }
    question: "Was bezahlt der Gast?"
    options:
      - "Einen Kaffee und ein Stück Kuchen."
      - "Eine Suppe und ein Wasser."
      - "Zwei Kaffee und einen Kuchen."
    correct: 0
    translation:
      en: What does the guest pay for?
      ru: За что платит посетитель?
      uk: За що платить відвідувач?
    explain:
      en: "The waitress repeats the order when she brings the bill: Das war ein Kaffee und ein Stück Kuchen. Listen for the two items after Das war."
      ru: "Официантка повторяет заказ, когда называет счёт: Das war ein Kaffee und ein Stück Kuchen. Прислушайтесь к двум пунктам после Das war."
      uk: "Офіціантка повторює замовлення, коли називає рахунок: Das war ein Kaffee und ein Stück Kuchen. Прислухайтеся до двох пунктів після Das war."

  - id: audio-zahlen-preis
    outcomes: [essen-service-bezahlen]
    type: audio-comprehension
    source:
      kind: tts
      rate: 0.85
      turns:
        - { speaker: "Gast", text: "Zahlen, bitte!" }
        - { speaker: "Kellnerin", text: "Gern. Das war ein Kaffee und ein Stück Kuchen. Zusammen oder getrennt?" }
        - { speaker: "Gast", text: "Zusammen, bitte. Was macht das?" }
        - { speaker: "Kellnerin", text: "Das macht fünf Euro neunzig." }
        - { speaker: "Gast", text: "Hier sind sechs Euro. Stimmt so." }
        - { speaker: "Kellnerin", text: "Vielen Dank!" }
    question: "Wie viel kostet alles zusammen?"
    options:
      - "Fünf Euro neunzig."
      - "Sechs Euro neunzig."
      - "Neun Euro fünfzig."
    correct: 0
    translation:
      en: How much does everything cost together?
      ru: Сколько стоит всё вместе?
      uk: Скільки коштує все разом?
    explain:
      en: "The total comes after Das macht …: fünf Euro neunzig. The guest hands over six euros and says Stimmt so (keep the change) — in Germany you tip by rounding up when you pay, not by leaving money on the table."
      ru: "Итог звучит после Das macht …: fünf Euro neunzig. Гость даёт шесть евро и говорит Stimmt so — «сдачи не надо»: в Германии чаевые обычно дают, округляя сумму при оплате, а не оставляя деньги на столе."
      uk: "Підсумок звучить після Das macht …: fünf Euro neunzig. Гість дає шість євро і каже Stimmt so — «решти не треба»: у Німеччині чайові зазвичай дають, округлюючи суму під час оплати, а не залишаючи гроші на столі."

  - id: uebersetzen-flasche
    outcomes: [essen-service-bezahlen]
    type: translate
    focus: artikel-pflicht
    instruction:
      en: Translate into German.
      ru: Переведите на немецкий.
      uk: Перекладіть німецькою.
    prompt_en: "A bottle of water, please."
    prompt_ru: "Бутылку воды, пожалуйста."
    prompt_uk: "Пляшку води, будь ласка."
    answer: "Eine Flasche Wasser, bitte."
    key_tokens: ["Eine"]
    explain:
      en: "The article is needed even in a short request: eine Flasche, not just Flasche. And there is no 'of' — the two nouns stand side by side: eine Flasche Wasser."
      ru: "Артикль нужен даже в короткой просьбе: eine Flasche, а не просто Flasche, как подсказывает русское «бутылку воды». Второе слово не меняется: eine Flasche Wasser — без родительного падежа."
      uk: "Артикль потрібен навіть у короткому проханні: eine Flasche, а не просто Flasche, як підказує українське «пляшку води». Друге слово не змінюється: eine Flasche Wasser — без родового відмінка."

  - id: uebersetzen-kosten
    outcomes: [essen-service-bezahlen]
    type: translate
    instruction:
      en: Translate into German.
      ru: Переведите на немецкий.
      uk: Перекладіть німецькою.
    prompt_en: "How much are the apples?"
    prompt_ru: "Сколько стоят яблоки?"
    prompt_uk: "Скільки коштують яблука?"
    answer: "Was kosten die Äpfel?"
    accept:
      - "Wie viel kosten die Äpfel?"
    explain:
      en: "The everyday question is Was kosten …? The subject die Äpfel is plural, so the verb is kosten, not kostet. Wie viel kosten die Äpfel? is also correct."
      ru: "Обиходный вопрос — Was kosten …? Подлежащее die Äpfel во множественном числе, поэтому глагол kosten, а не kostet. Вариант Wie viel kosten die Äpfel? тоже правильный."
      uk: "Повсякденне питання — Was kosten …? Підмет die Äpfel у множині, тому дієслово kosten, а не kostet. Варіант Wie viel kosten die Äpfel? теж правильний."
