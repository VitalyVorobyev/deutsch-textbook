  question: 'Wohin geht Lisa zuerst?'
  options:
  - 'Zur Post.'
  - 'Zum Arzt.'
  - 'Zu Tom.'
  correct: 0
  explain:
    en: 'Zuerst comes right before zur Post; the doctor is dann, and Tom''s place is seven o''clock. Zur and zum both answer wohin.'
    ru: 'Zuerst стоит прямо перед zur Post; врач — это dann, а к Тому она придёт в семь. И zur, и zum отвечают на вопрос wohin.'
    uk: 'Zuerst стоїть одразу перед zur Post; лікар — це dann, а до Тома вона прийде о сьомій. І zur, і zum відповідають на питання wohin.'
