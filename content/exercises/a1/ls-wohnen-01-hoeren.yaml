  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Maklerin
      text: Hier ist die Wohnung. Sie hat drei Zimmer.
    - speaker: Interessent
      text: Wie groß ist die Küche?
    - speaker: Maklerin
      text: Die Küche ist klein, aber das Wohnzimmer ist sehr groß.
    - speaker: Interessent
      text: Gibt es einen Balkon?
    - speaker: Maklerin
      text: Ja, der Balkon ist hinten. Das Bad hat ein Fenster.
    - speaker: Interessent
      text: Und was kostet die Wohnung?
    - speaker: Maklerin
      text: Sechshundert Euro im Monat, ohne Heizung.
    - speaker: Interessent
      text: Das ist nicht teuer. Ich nehme sie.
  recording: ls-wohnen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Welcher Raum ist sehr groß?
  options:
  - Das Wohnzimmer.
  - Die Küche.
  - Das Bad.
  correct: 0
  explain:
    en: Small and very large stand in the same sentence, joined by aber. Whoever hears
      only the first half takes the kitchen.
    ru: «Маленькая» и «очень большая» стоят в одном предложении, соединённые aber.
      Кто расслышал только первую половину, выберет кухню.
    uk: '«Маленька» і «дуже велика» стоять в одному реченні, з''єднані aber. Хто розчув лише першу половину, обере кухню.'
  max_replays: 3
