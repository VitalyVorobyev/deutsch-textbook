  outcomes:
  - artikel-genus-erkennen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Kundin
      text: Entschuldigung, ich suche eine Lampe.
    - speaker: Verkäufer
      text: Die Lampen sind dort links. Brauchen Sie auch einen Tisch?
    - speaker: Kundin
      text: Nein, danke. Aber ich brauche noch ein Regal.
    - speaker: Verkäufer
      text: Das Regal dort ist neu. Der Stuhl daneben kostet zwanzig Euro.
    - speaker: Kundin
      text: Gut, ich nehme das Regal.
  recording: ls-artikel-genus-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was kauft die Kundin?
  options:
  - Das Regal.
  - Die Lampe.
  - Den Stuhl.
  correct: 0
  explain:
    en: What she is looking for and what she buys are different things, and both are
      said. The last line is the one that decides it.
    ru: То, что она ищет, и то, что покупает, — разные вещи, и названы обе. Решает
      последняя реплика.
    uk: 'Те, що вона шукає, і те, що купує, — різні речі, і названо обидві. Вирішує остання репліка.'
