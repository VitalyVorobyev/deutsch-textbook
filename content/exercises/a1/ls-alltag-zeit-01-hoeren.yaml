    turns:
    - speaker: Sara
      text: Hallo Tom, hier ist Sara. Unser Plan für morgen hat sich geändert.
    - speaker: Sara
      text: Wir treffen uns nicht um acht Uhr, sondern um halb neun am Bahnhof.
    - speaker: Sara
      text: Zuerst kaufen wir die Fahrkarten. Um neun Uhr fährt der Zug.
    - speaker: Sara
      text: Bitte ruf mich heute Abend noch einmal an. Bis dann!
  recording: ls-alltag-zeit-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was machen sie zuerst?
  options:
  - Sie kaufen die Fahrkarten.
  - Sie fahren mit dem Zug.
  - Sie rufen am Abend an.
  correct: 0
  explain:
    en: Zuerst orders the two things that happen at the station. The call is for this
      evening, before any of it.
    ru: Zuerst задаёт порядок двух действий на вокзале. Звонок — на сегодняшний вечер,
      то есть до всего остального.
    uk: 'Zuerst задає порядок двох дій на вокзалі. Дзвінок — на сьогоднішній вечір, тобто ще до всього іншого.'
  max_replays: 3
