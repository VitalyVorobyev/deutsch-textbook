topic: alltag-zeit
role: practice
stage: ausblenden
activity: extension
title_de: "Hörübung — Alltag und Zeit"
title: { en: "Listening — times and daily plans", ru: "Аудирование — время и планы на день", uk: "Аудіювання — час і плани на день"  }
items:
  - id: hoeren-kurs-halb
    outcomes: [zeit-uhrzeit-verstehen]
    type: listen
    focus: um-am-zeit
    focus_evidence:
      retained: ["\\bum halb neun$"]
      failed: ["\\b(am|im) halb neun$"]
    instruction: { en: "Listen and type what you hear.", ru: "Прослушайте и напишите, что вы слышите.", uk: "Прослухайте й напишіть, що ви чуєте." }
    text: "Der Kurs beginnt um halb neun."
    translation: { en: "The course begins at half past eight (8:30).", ru: "Курс начинается в половине девятого (8:30).", uk: "Курс починається о пів на дев'яту (8:30)." }
    explain: { en: "Clock times take um. halb neun is two words, both lowercase, and means 8:30.", ru: "Время по часам вводит um. halb neun пишется в два слова со строчной буквы и означает 8:30.", uk: "Час за годинником вводить um. halb neun пишеться двома словами з малої літери й означає 8:30." }
  - id: hoeren-sonntag-lange
    outcomes: [zeit-uhrzeit-verstehen]
    type: listen
    focus: um-am-zeit
    focus_evidence:
      retained: ["^Am Sonntag\\b"]
      failed: ["^(Um|Im) Sonntag\\b"]
    instruction: { en: "Listen and type what you hear.", ru: "Прослушайте и напишите, что вы слышите.", uk: "Прослухайте й напишіть, що ви чуєте." }
    text: "Am Sonntag schlafe ich lange."
    translation: { en: "On Sunday I sleep in.", ru: "В воскресенье я долго сплю.", uk: "У неділю я довго сплю." }
    explain: { en: "Days take am, never in. Sonntag is a noun — capitalized; lange stays lowercase.", ru: "С днями недели — am, а не in, хотя по-русски «в воскресенье». Sonntag — существительное, с большой буквы; lange — со строчной.", uk: "З днями тижня — am, а не in, хоча українською «у неділю». Sonntag — іменник, з великої літери; lange — з малої." }