  explain:
    en: 'She says the rule herself — das letzte Wort ist Flasche. The last noun decides the article, and it is die Flasche, whatever der Saft is.'
    ru: 'Элла сама называет правило: das letzte Wort ist Flasche. Артикль определяет последнее существительное, а это die Flasche — неважно, что der Saft мужского рода.'
