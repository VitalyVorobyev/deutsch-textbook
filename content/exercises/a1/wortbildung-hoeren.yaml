items:
- id: q1
  outcomes:
  - wortbildung-komposita
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Ella
      text: 'Schau mal: „Sommerfest im Garten, Samstag ab drei Uhr.“'
    - speaker: Ben
      text: 'Sommerfest – ein Fest im Sommer. Schön!'
    - speaker: Ella
      text: 'Und alles ist kostenlos.'
    - speaker: Ben
      text: 'Ohne Kosten? Super. Ist es der oder die Saftflasche?'
    - speaker: Ella
      text: 'Die Saftflasche. Das letzte Wort ist Flasche.'
    - speaker: Ben
      text: 'Und der Saft?'
    - speaker: Ella
      text: 'Der Saft ist zuckerlos.'
    - speaker: Ben
      text: 'Und was steht unten?'
    - speaker: Ella
      text: 'Der Fahrplan. Da steht, wann der Bus fährt.'
  recording: ls-wortbildung-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: 'Was ist ein Sommerfest?'
  options:
  - 'Ein Fest im Sommer.'
  - 'Ein Sommer mit vielen Festen.'
  - 'Ein Fest nur für Kinder.'
  correct: 0
  explain:
    en: 'Ben reads it from the back, the way German builds the word — Fest is the thing, Sommer says which one. "A summer full of parties" reads it from the front.'
    ru: 'Бен читает слово с конца, как его и строит немецкий: Fest — это сам предмет, а Sommer уточняет, какой именно. «Лето, полное праздников» — это чтение с начала.'
    uk: 'Бен читає слово з кінця, як його й будує німецька: Fest — це сам предмет, а Sommer уточнює, яке саме. «Літо, повне свят» — це читання з початку.'
  max_replays: 3
