  question: 'Wie ist der Radfahrer verletzt?'
  options:
  - 'Er blutet am Kopf, und sein Bein tut weh.'
  - 'Er spricht nicht mehr.'
  - 'Er hat sich am Arm verletzt.'
  correct: 0
  explain:
    en: 'He is awake — er spricht mit mir — and the caller names two injuries: er blutet am Kopf, sein Bein tut ihm sehr weh. Nothing is said about an arm.'
    ru: 'Он в сознании — er spricht mit mir, — и звонящий называет две травмы: er blutet am Kopf, sein Bein tut ihm sehr weh. О руке ничего не сказано.'
    uk: 'Він при тямі — er spricht mit mir, — і той, хто дзвонить, називає дві травми: er blutet am Kopf, sein Bein tut ihm sehr weh. Про руку нічого не сказано.'
    de: 'Er ist wach — „er spricht mit mir“ —, und der Anrufer nennt zwei Verletzungen: Er blutet am Kopf, und sein Bein tut ihm sehr weh. Von einem Arm ist keine Rede.'
  max_replays: 3
