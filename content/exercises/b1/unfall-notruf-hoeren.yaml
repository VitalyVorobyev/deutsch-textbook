topic: unfall-notruf
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Unfall & Notruf"
title:
  en: 'An emergency call'
  ru: 'Звонок в экстренную службу'
  uk: 'Дзвінок до екстреної служби'
  de: 'Ein Notruf'
items:
- id: q1
  outcomes:
  - notruf-absetzen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Leitstelle
      text: 'Notruf Feuerwehr und Rettungsdienst. Wo genau ist der Unfall?'
    - speaker: Anrufer
      text: 'An der Kreuzung Bahnhofstraße und Lindenweg, vor der Apotheke.'
    - speaker: Leitstelle
      text: 'Was ist passiert?'
    - speaker: Anrufer
      text: 'Ein Auto hat einen Radfahrer getroffen. Er liegt auf der Straße.'
    - speaker: Leitstelle
      text: 'Ist er verletzt? Ist er wach?'
    - speaker: Anrufer
      text: 'Ja, er spricht mit mir. Er blutet am Kopf, und sein Bein tut ihm sehr weh.'
    - speaker: Leitstelle
      text: 'Gibt es noch weitere Verletzte?'
    - speaker: Anrufer
      text: 'Nein. Der Autofahrer ist nicht verletzt.'
    - speaker: Leitstelle
      text: 'Gut. Der Krankenwagen ist unterwegs und in wenigen Minuten da. Bewegen Sie den Mann nicht und bleiben Sie bitte am Telefon, bis die Kollegen da sind.'
    - speaker: Anrufer
      text: 'In Ordnung, ich bleibe am Telefon.'
  recording: ls-unfall-notruf-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Wo ist der Unfall passiert?'
  options:
  - 'An einer Kreuzung vor der Apotheke.'
  - 'Am Bahnhof.'
  - 'Vor dem Krankenhaus im Lindenweg.'
  correct: 0
  explain:
    en: 'The first thing the control centre asks is wo, and the caller names the crossing and a landmark: vor der Apotheke. Bahnhofstraße is a street name, not the station.'
    ru: 'Первым делом диспетчер спрашивает wo, и звонящий называет перекрёсток и ориентир: vor der Apotheke. Bahnhofstraße — название улицы, а не вокзал.'
    uk: 'Першим ділом диспетчер питає wo, і той, хто дзвонить, називає перехрестя й орієнтир: vor der Apotheke. Bahnhofstraße — назва вулиці, а не вокзал.'
    de: 'Die Leitstelle fragt zuerst nach dem Ort, und der Anrufer nennt die Kreuzung und einen Ort, den man leicht findet: „vor der Apotheke“. Die Bahnhofstraße ist eine Straße, nicht der Bahnhof.'
  max_replays: 3
