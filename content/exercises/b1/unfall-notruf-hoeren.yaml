  question: 'Was soll der Anrufer tun, bis der Krankenwagen da ist?'
  options:
  - 'Am Telefon bleiben und den Mann nicht bewegen.'
  - 'Den Mann an den Straßenrand tragen.'
  - 'In der Apotheke Hilfe holen.'
  correct: 0
  explain:
    en: 'Two instructions in one line: bewegen Sie den Mann nicht and bleiben Sie am Telefon. His ich bleibe am Telefon — I''ll stay on the line — confirms the second.'
    ru: 'Две инструкции в одной реплике: bewegen Sie den Mann nicht и bleiben Sie am Telefon. Его ich bleibe am Telefon — «я остаюсь на линии» — подтверждает вторую.'
    uk: 'Дві інструкції в одній репліці: bewegen Sie den Mann nicht і bleiben Sie am Telefon. Його ich bleibe am Telefon — «я залишаюся на лінії» — підтверджує другу.'
    de: 'In einem Satz stehen zwei Anweisungen: „Bewegen Sie den Mann nicht“ und „bleiben Sie am Telefon“. Mit „Ich bleibe am Telefon“ bestätigt der Anrufer die zweite.'
