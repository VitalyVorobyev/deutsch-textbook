      en: "The participle of a mixed verb keeps the Präteritum vowel and ends in -t, like a weak participle: gekannt, gebracht, gedacht, gewusst, gerannt, genannt. gebringt and gedenkt keep the old vowel; gebrachen is the strong ending on a verb that never takes it. rennen is fast movement, so it takes ist: Er ist zum Bus gerannt."
      ru: "Причастие смешанного глагола сохраняет гласную Präteritum и кончается на -t, как у слабого: gekannt, gebracht, gedacht, gewusst, gerannt, genannt. gebringt и gedenkt сохраняют старую гласную, а gebrachen — сильное окончание у глагола, который его никогда не берёт. rennen — быстрое движение, поэтому оно идёт с ist: Er ist zum Bus gerannt."
      uk: "Дієприкметник змішаного дієслова має голосну Präteritum і закінчення -t, як у слабкого: gekannt, gebracht, gedacht, gewusst, gerannt, genannt. У gebringt і gedenkt лишилася стара голосна, а gebrachen — сильне закінчення, якого це дієслово не бере. rennen — швидкий рух, тому з ist: Er ist zum Bus gerannt."

  - id: table-praeteritum-stark-schwach
    outcomes: [praeteritum-erzaehlen]
    type: table
    focus: praeteritum-vollverben
    title: "Stark oder schwach?"
    instruction:
      en: "Write the Präteritum for er/sie. The verbs come in look-alike pairs: one is weak (-te), one is strong (new vowel)."
      ru: "Впишите Präteritum для er/sie. Глаголы идут похожими парами: один слабый (-te), другой сильный (новая гласная)."
      uk: "Впишіть Präteritum для er/sie. Дієслова йдуть схожими парами: одне слабке (-te), друге сильне (нова голосна)."
    columns: ["er/sie (Präteritum)"]
    rows:
      - label: legen
        cells: [{ answer: legte, given: true }]
      - label: liegen
        cells: [{ answer: lag }]
      - label: setzen
        cells: [{ answer: setzte }]
      - label: sitzen
        cells: [{ answer: saß }]
      - label: fragen
        cells: [{ answer: fragte }]
      - label: tragen
        cells: [{ answer: trug }]
      - label: kaufen
        cells: [{ answer: kaufte }]
      - label: laufen
        cells: [{ answer: lief }]
    explain:
      en: "Two verbs that look alike can belong to different groups, so -te has to be decided verb by verb. legen, setzen, fragen, kaufen are weak: legte, setzte, fragte, kaufte. liegen, sitzen, tragen, laufen are strong: lag, saß, trug, lief. sitzen → saß is easy to mix up with sehen → sah: saß has ß, sah has h."
      ru: "Два похожих глагола могут относиться к разным группам, так что -te решается для каждого глагола отдельно. legen, setzen, fragen, kaufen — слабые: legte, setzte, fragte, kaufte. liegen, sitzen, tragen, laufen — сильные: lag, saß, trug, lief. sitzen → saß легко спутать с sehen → sah: в saß стоит ß, в sah — h."
      uk: "Два схожі дієслова можуть належати до різних груп, тож про -te треба вирішувати для кожного дієслова окремо. legen, setzen, fragen, kaufen — слабкі: legte, setzte, fragte, kaufte. liegen, sitzen, tragen, laufen — сильні: lag, saß, trug, lief. sitzen → saß легко сплутати з sehen → sah: у saß пишуть ß, у sah — h."

