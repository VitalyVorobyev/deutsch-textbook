    explain:
      en: "Weak: gelegt, gesetzt, gekauft — ge- plus the unchanged stem plus -t. Strong: gelegen, gesessen, gelaufen — -en, and sitzen also changes its vowel and its tz to ss. gelegt (someone put it there) and gelegen (it lay there) are two different verbs, as are gesetzt and gesessen. liegen and sitzen take hat in the north and ist in the south and Austria; laufen takes ist."
      ru: "Слабые: gelegt, gesetzt, gekauft — ge- плюс неизменная основа плюс -t. Сильные: gelegen, gesessen, gelaufen — на -en, причём у sitzen меняются и гласная, и tz на ss. gelegt (кто-то положил) и gelegen (что-то лежало) — это два разных глагола, как и gesetzt и gesessen. liegen и sitzen на севере идут с hat, а на юге и в Австрии — с ist; laufen идёт с ist."
      uk: "Слабкі: gelegt, gesetzt, gekauft — ge-, незмінна основа і -t. Сильні: gelegen, gesessen, gelaufen — на -en, а в sitzen змінюються ще й голосна та tz на ss. gelegt (хтось поклав) і gelegen (щось лежало) — два різні дієслова, так само як gesetzt і gesessen. liegen і sitzen на півночі вживають з hat, а на півдні та в Австрії — з ist; laufen завжди з ist."

  - id: cloze-cafe-fenster
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-vollverben
    instruction:
      en: "A written narrative: put each verb in brackets into the Präteritum."
      ru: "Письменный рассказ: поставьте каждый глагол из скобок в Präteritum."
      uk: "Письмова розповідь: поставте кожне дієслово з дужок у Präteritum."
    text: "Wir {{saßen}} (sitzen) den ganzen Nachmittag im Café am Fenster und {{sahen}} (sehen) auf den Platz. Dann {{kam}} (kommen) Jonas, und ich {{schrieb}} (schreiben) ihm meine neue Adresse auf einen Zettel."
    translation:
      en: "We sat in the café by the window all afternoon and looked out at the square. Then Jonas came, and I wrote my new address down on a piece of paper for him."
      ru: "Мы весь день просидели в кафе у окна и смотрели на площадь. Потом пришёл Jonas, и я написал ему на листочке свой новый адрес."
      uk: "Ми весь день просиділи в кафе біля вікна й дивилися на площу. Потім прийшов Jonas, і я написав йому на папірці свою нову адресу."
    explain:
      en: "sitzen → saßen and sehen → sahen sound close and stand side by side here: saßen with ß is the sitting, sahen with h the looking. kommen → kam is a loner. schreiben → schrieb follows ei – ie – ie, and for ich it has no ending at all; schrieb is already past, so schriebte doubles the job."
      ru: "sitzen → saßen и sehen → sahen звучат похоже и стоят здесь рядом: saßen с ß — сидели, sahen с h — смотрели. kommen → kam — одиночка. schreiben → schrieb идёт по образцу ei – ie – ie и у ich вовсе без окончания: schrieb уже прошедшее, так что schriebte выражает прошлое дважды."
      uk: "sitzen → saßen і sehen → sahen звучать схоже, і тут вони стоять поруч: saßen з ß — сиділи, sahen з h — дивилися. kommen → kam — одинак. schreiben → schrieb іде за зразком ei – ie – ie і для ich не має закінчення взагалі: schrieb уже означає минуле, тож у schriebte минулий час позначено двічі."

  - id: cloze-zug-verspaetung
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-vollverben
    instruction:
      en: "A written narrative: put each verb in brackets into the Präteritum."
      ru: "Письменный рассказ: поставьте каждый глагол из скобок в Präteritum."
      uk: "Письмова розповідь: поставте кожне дієслово з дужок у Präteritum."
    text: "Unser Zug {{kam}} (kommen) zwei Stunden zu spät. Wir {{tranken}} (trinken) einen Kaffee nach dem anderen, und mein Bruder {{schlief}} (schlafen) eine Stunde auf der Bank. Ich {{fand}} (finden) eine alte Zeitung und {{las}} (lesen) jede Seite."
    translation:
      en: "Our train was two hours late. We drank one coffee after another, and my brother slept on the bench for an hour. I found an old newspaper and read every page."
      ru: "Наш поезд опоздал на два часа. Мы пили кофе чашку за чашкой, а брат час проспал на скамейке. Я нашёл старую газету и прочитал её от первой до последней страницы."
      uk: "Наш потяг запізнився на дві години. Ми пили каву чашку за чашкою, а брат годину спав на лавці. Я знайшов стару газету й прочитав кожну сторінку."
    explain:
      en: "Five strong verbs from four patterns: kam (loner), tranken (i – a – u, plural -en), schlief (a – ie – a), fand (i – a – u), las (e – a – e). None takes -te, and for er/sie and ich the bare stem is the whole form. For wir the strong Präteritum adds only -en: tranken, not trankten."
      ru: "Пять сильных глаголов из четырёх образцов: kam (одиночка), tranken (i – a – u, во множественном -en), schlief (a – ie – a), fand (i – a – u), las (e – a – e). Ни один не берёт -te, а у er/sie и ich голая основа и есть вся форма. Для wir сильный Präteritum добавляет только -en: tranken, а не trankten."
      uk: "П'ять сильних дієслів із чотирьох зразків: kam (одинак), tranken (i – a – u, у множині -en), schlief (a – ie – a), fand (i – a – u), las (e – a – e). Жодне не бере -te, а для er/sie та ich уся форма — це гола основа. Для wir сильний Präteritum додає лише -en: tranken, а не trankten."

  - id: cloze-rom-perfekt
    outcomes: [muendlich-nacherzaehlen]
    type: cloze
    focus: partizip2-form
