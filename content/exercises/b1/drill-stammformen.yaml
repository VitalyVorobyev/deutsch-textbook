      ru: "Впишите Perfekt для er/sie: hat или ist, затем Partizip II."
      uk: "Впишіть Perfekt для er/sie: hat або ist, а тоді Partizip II."
    columns: ["er/sie (Perfekt)"]
    rows:
      - label: kennen
        cells: [{ answer: hat gekannt }]
      - label: bringen
