    instruction:
      en: "Translate with müssen and lassen: the office does the work. For 'renew' take verlängern."
      ru: "Переведите с müssen и lassen: работу делает учреждение. Для «продлить» возьмите verlängern."
      uk: "Перекладіть із müssen і lassen: роботу виконує установа. Для «продовжити» візьміть verlängern."
    prompt_en: "I have to get my passport renewed."
    prompt_ru: "Мне нужно продлить паспорт."
    prompt_uk: "Мені треба продовжити паспорт."
    answer: "Ich muss meinen Pass verlängern lassen."
    accept:
      - "Ich muss meinen Reisepass verlängern lassen."
