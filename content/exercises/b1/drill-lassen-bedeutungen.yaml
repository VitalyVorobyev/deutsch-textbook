      en: "A modal and lassen together: muss in position 2, then two infinitives at the end, the action first and lassen last — verlängern lassen. Ich muss meinen Pass verlängern would mean you renew it yourself, which only the office can do. Neither verb at the end takes zu."
      ru: "Модальный глагол вместе с lassen: muss на втором месте, а в конце два инфинитива — сначала действие, последним lassen: verlängern lassen. Ich muss meinen Pass verlängern значило бы, что вы продлеваете паспорт сами, а это может сделать только учреждение. Русское «продлить паспорт» об этом молчит, немецкий говорит это через lassen. Ни один из двух инфинитивов в конце не берёт zu."
