topic: polizei-anzeige
role: pretest
title:
  en: "Before you read — reporting what somebody said"
  ru: "Перед чтением — как передать чужие слова"
  uk: "Перед читанням — як передати чужі слова"
  de: "Vor dem Lesen — wiedergeben, was jemand gesagt hat"

# Three guesses, one per decision the article answers: where the verb lands in a dass-clause,
# which word a reported question keeps, and whether a participle in front of a noun declines.
# Two are non-mc — a pretest is generation, not recognition.
items:
  - id: dass-verbendstellung
    # Revision 2 (2026-10-13 quality pass): the prompt asks for no tense, and "did not see"
    # / «не видел» / «не бачив» are a Präteritum as much as a Perfekt, so sah is accepted
    # and pinned.
    outcomes: [aussage-wiedergeben]
    type: translate
    key_tokens: ["dass", "hat", "sah"]
    prompt_en: "The witness says that he did not see anything."
    prompt_ru: "Свидетель говорит, что ничего не видел."
    prompt_uk: "Свідок каже, що нічого не бачив."
    answer: "Der Zeuge sagt, dass er nichts gesehen hat."
    accept:
      - "Der Zeuge sagt, dass er nichts sah."
    revision: 2
    explain:
      en: "*Dass* opens a Nebensatz, and a Nebensatz puts its conjugated verb at the very end. The conjugated part of a perfect is the auxiliary, so *hat* comes after the participle: *gesehen hat*, not *hat gesehen*."
      ru: "*Dass* открывает придаточное, а придаточное ставит спрягаемый глагол в самый конец. Спрягаемая часть перфекта — вспомогательный глагол, поэтому *hat* идёт после причастия: *gesehen hat*, а не *hat gesehen*."
      uk: "*Dass* відкриває підрядне, а підрядне ставить відмінюване дієслово в самий кінець. Відмінювана частина перфекта — допоміжне дієслово, тому *hat* іде після дієприкметника: *gesehen hat*, а не *hat gesehen*."
      de: "*Dass* eröffnet einen Nebensatz, und ein Nebensatz stellt sein konjugiertes Verb ganz ans Ende. Im Perfekt ist der konjugierte Teil das Hilfsverb, also steht *hat* nach dem Partizip: *gesehen hat*, nicht *hat gesehen*."

  - id: ob-oder-wann
    outcomes: [aussage-wiedergeben]
    type: cloze
    instruction:
      en: "Fill in the word each reported question needs."
      ru: "Вставьте слово, которого требует каждый переданный вопрос."
      uk: "Вставте слово, якого потребує кожне передане питання."
      de: "Ergänze das Wort, das jede indirekte Frage braucht."
    text: "Sie fragt, {{ob}} ich den Täter erkannt habe. Er fragt, {{wann}} der Einbruch passiert ist."
    translation:
      en: "She asks whether I recognised the perpetrator. He asks when the break-in happened."
      ru: "Она спрашивает, узнал ли я преступника. Он спрашивает, когда произошёл взлом."
      uk: "Вона питає, чи впізнав я злочинця. Він питає, коли стався злам."
    explain:
      en: "A yes/no question needs *ob* — there is no question word to keep, so German supplies one. A question that already has a question word simply keeps it: *wann*. The trap in the second gap is *wenn*, which opens a condition or a time clause, never a question."
      ru: "Вопросу «да/нет» нужен *ob*: сохранять нечего, поэтому немецкий подставляет союз. Вопрос, у которого вопросительное слово уже есть, просто сохраняет его: *wann*. Ловушка второго пропуска — *wenn*: оно вводит условие или время, но не вопрос, тогда как русское «когда» служит обоим."
      uk: "Питанню «так/ні» потрібен *ob*: зберігати нічого, тому німецька підставляє сполучник. Питання, у якого питальне слово вже є, просто зберігає його: *wann*. Пастка другого пропуску — *wenn*: воно вводить умову або час, але не питання, тоді як українське «коли» служить обом."
      de: "Eine Ja-Nein-Frage braucht *ob* — es gibt kein Fragewort, das man behalten könnte, also setzt man eins ein. Eine Frage, die schon ein Fragewort hat, behält es einfach: *wann*. Die Falle in der zweiten Lücke ist *wenn*, denn es eröffnet eine Bedingung oder einen Zeitsatz, nie eine Frage."

  - id: partizip-endung
    outcomes: [diebstahl-melden]
    type: mc
    prompt: "Welche Form ist richtig?"
    options:
      - "das gestohlene Fahrrad"
      - "das gestohlen Fahrrad"
      - "das gestohlenes Fahrrad"
    correct: 0
    explain:
      en: "In front of a noun a Partizip II behaves as an adjective, so it takes the ending the article and case require — after *das* in the accusative or nominative singular neuter, that is *-e*. Without an ending the participle is not an attribute but part of the verb: *Das Fahrrad wurde gestohlen*, *Man hat es gestohlen*."
      ru: "Перед существительным Partizip II ведёт себя как прилагательное и берёт окончание, которого требуют артикль и падеж: после *das* в именительном или винительном среднего рода это *-e*. Без окончания причастие — не определение, а часть глагольной формы: *Das Fahrrad wurde gestohlen*, *Man hat es gestohlen*."
      uk: "Перед іменником Partizip II поводиться як прикметник і бере закінчення, якого вимагають артикль і відмінок: після *das* у називному чи знахідному середнього роду це *-e*. Без закінчення дієприкметник — не означення, а частина дієслівної форми: *Das Fahrrad wurde gestohlen*, *Man hat es gestohlen*."
      de: "Vor einem Nomen verhält sich ein Partizip II wie ein Adjektiv, also bekommt es die Endung, die Artikel und Kasus verlangen — nach *das* im Nominativ oder Akkusativ Singular Neutrum ist das *-e*. Ohne Endung ist das Partizip kein Attribut, sondern Teil des Verbs: *Das Fahrrad wurde gestohlen*, *Man hat es gestohlen*."
