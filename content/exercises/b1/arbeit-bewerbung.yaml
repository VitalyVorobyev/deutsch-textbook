      ru: "Переведите — постройте предложение вокруг существительного Rolle и его устойчивого глагола; Erfahrung — без артикля."
      uk: "Перекладіть — побудуйте речення навколо іменника Rolle та його стійкого дієслова; Erfahrung — без артикля."
      de: "Übersetze — bau den Satz um das Nomen Rolle und sein festes Verb, und verwende Erfahrung ohne Artikel."
    prompt_en: "Experience plays a big role for this position."
    prompt_ru: "Опыт играет большую роль для этой должности."
    prompt_uk: "Досвід відіграє велику роль для цієї посади."
