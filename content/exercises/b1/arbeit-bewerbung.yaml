    accept:
      - "Bei dieser Stelle spielt Erfahrung eine große Rolle."
      - "Erfahrung spielt für diese Stelle eine große Rolle."
      - "Für diese Stelle spielt Erfahrung eine große Rolle."
    key_tokens: ["spielt"]
    explain:
      en: "Graded is the pair's verb: eine Rolle spielen, a rare case where English (play a role) matches German word for word. Enjoy the coincidence, but do not generalize it — the next noun picks its own verb, and machen here (the all-purpose German verb) would break the pair. bei dieser Stelle and für diese Stelle are both idiomatic, fronted or not — the verb choice is what the item measures."
      ru: "Оценивается глагол пары: eine Rolle spielen — редкий случай, когда русское «играть роль» совпадает с немецким дословно. Радуйтесь совпадению, но не обобщайте его: следующее существительное выберет себе другой глагол, а универсальное machen здесь разрушило бы пару. bei dieser Stelle и für diese Stelle равно идиоматичны, с выносом вперёд или без — предмет проверки только выбор глагола."
      uk: "Оцінюється дієслово пари: eine Rolle spielen — рідкісний випадок, коли українське «відігравати роль» збігається з німецьким майже дослівно. Радійте збігу, але не узагальнюйте його: наступний іменник вибере собі інше дієслово, а універсальне machen тут зруйнувало б пару. bei dieser Stelle і für diese Stelle однаково ідіоматичні, з винесенням уперед чи без — предмет перевірки лише вибір дієслова."
      de: "Bewertet wird das Verb des Paares: eine Rolle spielen — einer der seltenen Fälle, in denen mehrere Sprachen dasselbe Verb gewählt haben. Das Muster darf man trotzdem nicht verallgemeinern: Das nächste Nomen wählt sein eigenes Verb, und das Allzweckverb machen würde das Paar hier zerstören. bei dieser Stelle und für diese Stelle sind beide idiomatisch, vorangestellt oder nicht — gemessen wird nur die Verbwahl."

  - id: cloze-sie-staerken
    outcomes: [erfahrung-praesentieren]
    type: cloze
    focus: du-sie
    instruction:
      en: "Interview register — fill in the polite possessive."
      ru: "Регистр собеседования — впишите вежливое притяжательное местоимение."
      uk: "Регістр співбесіди — впишіть увічливий присвійний займенник."
      de: "Register im Vorstellungsgespräch — ergänze das höfliche Possessiv."
    text: "Die Chefin fragt im Vorstellungsgespräch: „Erzählen Sie uns bitte etwas über {{Ihre}} Stärken.“"
    translation:
      en: "In the job interview the boss asks: \"Please tell us something about your strengths.\""
      ru: "На собеседовании начальница спрашивает: «Расскажите нам, пожалуйста, немного о ваших сильных сторонах»."
      uk: "На співбесіді начальниця питає: «Розкажіть нам, будь ласка, трохи про ваші сильні сторони»."
    explain:
      en: "The interview lives in the Sie register until the team itself offers du — and Sie's possessive is Ihre, capitalized in writing. deine would drop the register in the most formal conversation German working life has; lowercase ihre would say her or their strengths instead of yours. The A2 rule, now earning money."
      ru: "Собеседование живёт в регистре Sie, пока команда сама не предложит du, — а притяжательное к Sie — это Ihre, на письме с большой буквы. deine уронило бы регистр в самом официальном разговоре немецкой рабочей жизни; строчное ihre означало бы «её» или «их» сильные стороны, а не ваши. Правило с A2 — теперь оно зарабатывает деньги."
      uk: "Співбесіда живе в регістрі Sie, доки команда сама не запропонує du, — а присвійний до Sie — це Ihre, на письмі з великої літери. deine впустило б регістр у найофіційнішій розмові німецького робочого життя; мале ihre означало б «її» або «їхні» сильні сторони, а не ваші. Правило з A2 — тепер воно заробляє гроші."
      de: "Das Vorstellungsgespräch lebt im Sie-Register, bis das Team selbst das du anbietet — und das Possessiv zu Sie heißt Ihre, geschrieben mit großem Buchstaben. deine würde das Register im formellsten Gespräch des deutschen Berufslebens fallen lassen; das kleine ihre spräche von ihren Stärken, nicht von deinen. Die A2-Regel — jetzt verdient sie Geld."
