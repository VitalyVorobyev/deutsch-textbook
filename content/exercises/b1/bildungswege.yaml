topic: bildungswege
role: practice
stage: geruest
activity: core
title_de: "Grundübung — Betreuung, Schule und wozu"
title:
  en: "Practice — childcare, school and what for"
  ru: "Практика — сад, школа и «зачем»"
  uk: "Практика — садок, школа і «навіщо»"

# The topic's primary practice set, so its item list is frozen once this ships.
#
# Eleven items over the article's three sections: the condition words
# (cloze-wenn-falls-platz, mc-falls-eventualitaet, uebersetzen-falls-platz,
# uebersetzen-wenn-sicher), the purpose clause (cloze-damit-um-zu, table-zweck,
# uebersetzen-damit-zeugnis, mc-damit-subjekt) and the institutions themselves
# (match-schulen, cloze-hochschule, cloze-noten).
#
# Two tags, both recycled, both taken from `bun scripts/grammar-depth.ts B1 --thin`, where each
# was sitting inside a single practice file — lernen-zukunft's. This set is their second file.
#
# Each tag grades only the direction the focus-tag table calls genuinely forced. For
# `falls-wenn` that is the certain, temporal case, where falls is impossible; the two
# eventuality items name falls in their bilingual instruction instead, because wenn stays
# grammatical there. For `damit-um-zu` it is the two-subject case, where the subjectless
# um … zu frame has no room for the second doer.
#
# Mix over this file: 2 mc of 11 (18%), mc+match+order 3 of 11 (27%), 3 translate, 0 order.
#
# Every noun is a headword of `bildung-schulsystem-b1`, the deck this topic adopts, or of an
# A1/A2/B1 deck — checked against a parse of content/vocab/, not from memory: Krippe, Kita,
# Grundschule, Realschule, Gymnasium, Sekundarstufe, Hochschule, Fachhochschule, Uni,
# Volkshochschule, Abitur, Abschluss, Zeugnis, Note, Eins…Sechs, befriedigend, ausreichend,
# mangelhaft, ungenügend, Platz, Anmeldung, Kurs, Praktikum, Studium, Herbst, September.
items:
  - id: cloze-wenn-falls-platz
    outcomes: [betreuung-klaeren]
    type: cloze
    focus: falls-wenn
    instruction:
      en: "wenn or falls? The first event is on the calendar; the second is a case nobody is counting on. One of the two gaps allows both words."
      ru: "wenn или falls? Первое событие стоит в календаре; второе — случай, на который никто не рассчитывает. Одна из двух лакун допускает оба слова."
      uk: "wenn чи falls? Перша подія стоїть у календарі; друга — випадок, на який ніхто не розраховує. Одна з двох лакун допускає обидва слова."
    text: "{{Wenn}} die Grundschule im September beginnt, ist meine Tochter sechs Jahre alt. {{Falls|Wenn}} in der Kita kein Platz frei wird, warten wir noch ein Jahr."
    translation:
      en: "When the primary school starts in September, my daughter will be six years old. In case no place comes free at the day-care centre, we will wait another year."
      ru: "Когда в сентябре начнётся начальная школа, дочери будет шесть лет. Если в саду не освободится место, мы подождём ещё год."
      uk: "Коли у вересні почнеться початкова школа, доньці буде шість років. Якщо в садку не звільниться місце, ми зачекаємо ще рік."
    explain:
      en: "The asymmetry is the whole lesson. The school year starts in September whatever anybody does, so the first clause is about time — and *falls* has no temporal reading at all, which leaves only *wenn*. The second gap covers a case the family hopes to avoid: *falls* is the precise signal there, but *wenn* stays grammatical, because *wenn* can always stand in for *falls* and never the other way round."
      ru: "Вся суть — в асимметрии. Учебный год начинается в сентябре независимо ни от чего, поэтому первое придаточное — о времени, а у *falls* временно́го прочтения нет вовсе: остаётся только *wenn*. Второй пропуск страхует случай, которого семья надеется избежать: там *falls* — точный сигнал, но *wenn* остаётся грамматичным, потому что *wenn* всегда может заменить *falls* — и никогда наоборот."
      uk: "Уся суть — в асиметрії. Навчальний рік починається у вересні незалежно ні від чого, тому перше підрядне — про час, а в *falls* часового прочитання немає взагалі: лишається тільки *wenn*. Другий пропуск страхує випадок, якого родина сподівається уникнути: там *falls* — точний сигнал, але *wenn* лишається граматичним, бо *wenn* завжди може замінити *falls* — і ніколи навпаки."

  - id: mc-falls-eventualitaet
    outcomes: [betreuung-klaeren]
    type: mc
    focus: falls-wenn
    prompt: "Welcher Satz plant einen Fall ein, mit dem die Eltern nicht rechnen?"
    options:
      - "Falls die Kita früher zumacht, hole ich mein Kind schon am Mittag ab."
      - "Wenn die Grundschule zu Ende ist, entscheidet die Familie über die neue Schule."
      - "Wenn der Unterricht endet, gehen die Kinder nach Hause."
    correct: 0
    translation:
      en: "Which sentence plans for a case the parents are not counting on?"
      ru: "Какое предложение закладывает случай, на который родители не рассчитывают?"
      uk: "Яке речення закладає випадок, на який батьки не розраховують?"
    explain:
      en: "The early closing is the only one of the three that may never happen, and *falls* is the word for exactly that — «for the case that». The other two stand on *wenn*'s home ground: the Grundschule ends after four years for every child, and lessons end every single day. Putting *falls* into either of those would claim that the calendar itself is in doubt."
      ru: "Раннее закрытие сада — единственное из трёх, чего может и не случиться, и *falls* — слово ровно для этого: «на случай, если». Два других стоят на родной территории *wenn*: Grundschule кончается через четыре года у всех детей, а занятия заканчиваются каждый день. Поставить туда *falls* значило бы объявить сомнительным сам календарь."
      uk: "Раннє зачинення садка — єдине з трьох, чого може й не статися, і *falls* — слово рівно для цього: «на випадок, якщо». Два інші стоять на рідній території *wenn*: Grundschule кінчається через чотири роки в усіх дітей, а заняття закінчуються щодня. Поставити туди *falls* означало б оголосити сумнівним сам календар."

  - id: uebersetzen-falls-platz
    outcomes: [betreuung-klaeren]
    type: translate
    focus: falls-wenn
    instruction:
      en: "A bare eventuality — attach the condition with falls. For 'get' take bekommen."
      ru: "Голая эвентуальность — присоедините условие союзом falls. Для «получить» возьмите bekommen."
      uk: "Гола можливість — приєднайте умову сполучником falls. Для «отримати» візьміть bekommen."
    prompt_en: "In case we do not get a place, our daughter will stay at home a year longer."
    prompt_ru: "Если места мы вдруг не получим, дочь останется дома ещё на год."
    prompt_uk: "Якщо місця ми раптом не отримаємо, донька залишиться вдома ще на рік."
    answer: "Falls wir keinen Platz bekommen, bleibt unsere Tochter ein Jahr länger zu Hause."
    accept:
      # dann may hold position 1 after the fronted condition, and the extra year goes by both
      # of its ordinary names — the product is 2 × 2 renderings.
      - "Falls wir keinen Platz bekommen, dann bleibt unsere Tochter ein Jahr länger zu Hause."
      - "Falls wir keinen Platz bekommen, bleibt unsere Tochter noch ein Jahr zu Hause."
      - "Falls wir keinen Platz bekommen, dann bleibt unsere Tochter noch ein Jahr zu Hause."
    explain:
      en: "Graded are *falls* and the wall behind it: *bekommen* closes its own clause, exactly as after *wenn* or *weil* — the choice of condition word says something about expectancy and changes no word order at all. The plan does not predict the refusal; it survives it. Note also that the fronted condition fills position 1, so the main clause opens with its verb: *bleibt unsere Tochter*."
      ru: "Оцениваются *falls* и стена за ним: *bekommen* закрывает своё придаточное — ровно как после *wenn* или *weil*, ведь выбор союза говорит об ожидании и порядок слов не меняет вовсе. План не предсказывает отказ — он его переживает. Обратите внимание и на то, что вынесенное условие занимает первую позицию, поэтому главное предложение открывается глаголом: *bleibt unsere Tochter*."
      uk: "Оцінюються *falls* і стіна за ним: *bekommen* закриває своє підрядне — рівно як після *wenn* чи *weil*, адже вибір сполучника говорить про очікування і порядку слів не змінює зовсім. План не передбачає відмову — він її переживає. Зверніть увагу й на те, що винесена умова займає першу позицію, тому головне речення відкривається дієсловом: *bleibt unsere Tochter*."
    key_tokens: ["Falls", "bekommen"]

  - id: uebersetzen-wenn-sicher
    outcomes: [betreuung-klaeren, bildungsweg-erklaeren]
    type: translate
    focus: falls-wenn
    prompt_en: "When my son turns ten, he changes school."
    prompt_ru: "Когда сыну исполнится десять, он сменит школу."
    prompt_uk: "Коли синові виповниться десять, він змінить школу."
    answer: "Wenn mein Sohn zehn wird, wechselt er die Schule."
    accept:
      - "Wenn mein Sohn zehn wird, dann wechselt er die Schule."
    explain:
      en: "This is the direction that is genuinely forced, and it is the reason the pair has to be learned as a pair. A tenth birthday is not an eventuality — it arrives — so the clause is temporal, and *falls* has no temporal reading whatsoever. *Wenn* is the only possible word here, while in the other direction both are allowed. Graded are that word and the clause-final *wird*."
      ru: "Это то направление, которое действительно обязательно, и именно поэтому пару приходится учить парой. Десятый день рождения — не эвентуальность, он наступит, — значит, придаточное временно́е, а у *falls* временно́го прочтения нет вовсе. Здесь возможно только *wenn*, тогда как в обратную сторону допустимы оба. Оцениваются это слово и *wird* в конце придаточного."
      uk: "Це той напрям, який справді обов'язковий, і саме тому пару доводиться вчити парою. Десятий день народження — не можливість, він настане, — отже, підрядне часове, а в *falls* часового прочитання немає зовсім. Тут можливе лише *wenn*, тоді як у зворотний бік припустимі обидва. Оцінюються це слово і *wird* у кінці підрядного."
    key_tokens: ["Wenn", "wird"]

  - id: cloze-damit-um-zu
    outcomes: [lernziel-begruenden]
    type: cloze
    focus: damit-um-zu
    instruction:
      en: "Fill in the connector each purpose clause needs. Look at whether the clause has a subject of its own."
      ru: "Впишите союз, которого требует каждое придаточное цели. Смотрите, есть ли у придаточного собственное подлежащее."
      uk: "Впишіть сполучник, якого потребує кожне підрядне мети. Дивіться, чи має підрядне власний підмет."
    text: "Ich besuche einen Kurs an der Volkshochschule, {{um}} meinen Abschluss zu machen. Ich melde mein Kind früh an, {{damit}} es einen Platz in der Kita bekommt."
    translation:
      en: "I am taking a course at the adult education centre in order to get my leaving certificate. I am registering my child early so that it gets a place at the day-care centre."
      ru: "Я хожу на курс в народном университете, чтобы получить аттестат. Я записываю ребёнка заранее, чтобы он получил место в саду."
      uk: "Я ходжу на курс у народному університеті, щоб здобути атестат. Я записую дитину заздалегідь, щоб вона отримала місце в садку."
    explain:
      en: "Count the doers in each half. In the first, the person taking the course and the person getting the certificate are the same, and the clause ends in the bare *zu machen* with no subject anywhere — that shape belongs to *um* alone. In the second the clause brings its own subject *es*, and a subject cannot stand inside *um … zu*, so only *damit* can hold it; as a subordinating conjunction it then sends *bekommt* to the very end."
      ru: "Сосчитайте деятелей в каждой половине. В первой на курс ходит и аттестат получает один и тот же человек, а придаточное заканчивается голым *zu machen*, и подлежащего в нём нет нигде — такая форма бывает только у *um*. Во второй придаточное приводит своё подлежащее *es*, а внутри *um … zu* подлежащему стоять негде, поэтому вместить его может только *damit*; как подчинительный союз он затем отправляет *bekommt* в самый конец."
      uk: "Порахуйте діячів у кожній половині. У першій на курс ходить і атестат здобуває та сама людина, а підрядне закінчується голим *zu machen*, і підмета в ньому немає ніде — така форма буває лише в *um*. У другій підрядне приводить свій підмет *es*, а всередині *um … zu* підметові стояти ніде, тому вмістити його може тільки *damit*; як підрядний сполучник він потім відправляє *bekommt* у самий кінець."

  - id: table-zweck
    outcomes: [lernziel-begruenden]
    type: table
    focus: damit-um-zu
    title: "Wozu? — damit oder um … zu"
    instruction:
      en: "Turn the second sentence into a purpose clause. Count the subjects before you choose the form."
      ru: "Превратите второе предложение в придаточное цели. Сосчитайте подлежащие, прежде чем выбрать форму."
      uk: "Перетворіть друге речення на підрядне мети. Порахуйте підмети, перш ніж вибрати форму."
    columns: ["Finalsatz"]
    rows:
      - label: "Ich lerne Deutsch. Ich will einen Abschluss machen. — Ich lerne Deutsch, …"
        cells:
          - { answer: "um einen Abschluss zu machen", given: true }
      - label: "Ich melde mein Kind an. Es soll früher Deutsch lernen. — Ich melde mein Kind an, …"
        cells:
          - { answer: "damit es früher Deutsch lernt" }
      - label: "Wir gehen in die Schule. Die Lehrerin soll uns das Zeugnis erklären. — Wir gehen in die Schule, …"
        cells:
          - { answer: "damit die Lehrerin uns das Zeugnis erklärt" }
      - label: "Sie geht zur Volkshochschule. Sie will einen Kurs besuchen. — Sie geht zur Volkshochschule, …"
        cells:
          - { answer: "um einen Kurs zu besuchen" }
    explain:
      en: "Two rows keep one doer and compress, two rows have a second doer and cannot. The test is mechanical: if the second sentence has a subject the first one does not supply, *um … zu* is out, because that frame owns no subject slot. Watch what happens to the modal as well — *soll* and *will* only marked the purpose in the source pair and disappear from the clause; *damit* and *um … zu* carry the meaning themselves."
      ru: "Две строки сохраняют одного деятеля и сжимаются, две приводят второго и сжаться не могут. Проверка механическая: если во втором предложении есть подлежащее, которого не даёт первое, *um … zu* отпадает — в этой рамке места для подлежащего нет. Проследите и за модальным глаголом: *soll* и *will* лишь помечали цель в исходной паре и из придаточного исчезают, потому что смысл несут сами *damit* и *um … zu*."
      uk: "Два рядки зберігають одного діяча і стискаються, два приводять другого і стиснутися не можуть. Перевірка механічна: якщо в другому реченні є підмет, якого не дає перше, *um … zu* відпадає — у цій рамці місця для підмета немає. Простежте і за модальним дієсловом: *soll* і *will* лише позначали мету у вихідній парі і з підрядного зникають, бо зміст несуть самі *damit* і *um … zu*."

  - id: uebersetzen-damit-zeugnis
    outcomes: [lernziel-begruenden, bildungsweg-erklaeren]
    type: translate
    focus: damit-um-zu
    instruction:
      en: "Count the subjects before you choose the form. For 'explain' take erklären, and for the teacher die Lehrerin."
      ru: "Сосчитайте подлежащие, прежде чем выбрать форму. Для «объяснить» возьмите erklären, для учительницы — die Lehrerin."
      uk: "Порахуйте підмети, перш ніж вибрати форму. Для «пояснити» візьміть erklären, для вчительки — die Lehrerin."
    prompt_en: "I am going to the school so that the teacher explains the report to me."
    prompt_ru: "Я иду в школу, чтобы учительница объяснила мне табель."
    prompt_uk: "Я йду до школи, щоб учителька пояснила мені табель."
    answer: "Ich gehe in die Schule, damit die Lehrerin mir das Zeugnis erklärt."
    accept:
      # Pronoun before or after the subject in the Mittelfeld, and both ordinary ways of naming
      # the destination — the product is 2 × 2 renderings.
      - "Ich gehe in die Schule, damit mir die Lehrerin das Zeugnis erklärt."
      - "Ich gehe zur Schule, damit die Lehrerin mir das Zeugnis erklärt."
      - "Ich gehe zur Schule, damit mir die Lehrerin das Zeugnis erklärt."
    explain:
      en: "Graded are the two ends of the forced form: *damit* and the clause-final *erklärt*. I go, the teacher explains — two doers, so the subjectless frame has nowhere to put the second one (*um die Lehrerin mir das Zeugnis zu erklären* is exactly the impossible sentence, and it would also say that I do the explaining). Inside the clause, *mir* and *die Lehrerin* may stand in either order."
      ru: "Оцениваются два конца обязательной формы: *damit* и *erklärt* в самом конце. Иду я, объясняет учительница — два деятеля, поэтому бессубъектной рамке второго деть некуда (*um die Lehrerin mir das Zeugnis zu erklären* — ровно то невозможное предложение, и оно к тому же сказало бы, что объясняю я). Внутри придаточного *mir* и *die Lehrerin* могут стоять в любом порядке."
      uk: "Оцінюються два кінці обов'язкової форми: *damit* і *erklärt* у самому кінці. Іду я, пояснює вчителька — два діячі, тому безпідметовій рамці другого подіти нікуди (*um die Lehrerin mir das Zeugnis zu erklären* — рівно те неможливе речення, і воно до того ж сказало б, що пояснюю я). Усередині підрядного *mir* і *die Lehrerin* можуть стояти в будь-якому порядку."
    key_tokens: ["damit", "erklärt"]

  - id: mc-damit-subjekt
    outcomes: [lernziel-begruenden, betreuung-klaeren]
    type: mc
    focus: damit-um-zu
    prompt: "Welcher Satz ist richtig?"
    options:
      - "Ich melde mein Kind an, damit es einen Platz bekommt."
      - "Ich melde mein Kind an, um es einen Platz zu bekommen."
      - "Ich melde mein Kind an, damit es einen Platz zu bekommen."
    correct: 0
    translation:
      en: "Which sentence is correct?"
      ru: "Какое предложение верное?"
      uk: "Яке речення правильне?"
    explain:
      en: "Only *damit es einen Platz bekommt* works. The rendering with *um es einen Platz zu bekommen* is impossible because the frame has no subject slot: with *es* squeezed inside, the sentence would still say that **I** get the place. And *damit es einen Platz zu bekommen* mixes the two machines — *damit* opens a full Nebensatz and therefore needs a conjugated verb (*bekommt*), never a *zu*-infinitive."
      ru: "Работает только *damit es einen Platz bekommt*. Вариант *um es einen Platz zu bekommen* невозможен, потому что в рамке нет места для подлежащего: даже с втиснутым *es* предложение по-прежнему сказало бы, что место получаю **я**. А *damit es einen Platz zu bekommen* смешивает две машины: *damit* открывает полноценный Nebensatz и потому требует спрягаемого глагола (*bekommt*), а не инфинитива с *zu*."
      uk: "Працює лише *damit es einen Platz bekommt*. Варіант *um es einen Platz zu bekommen* неможливий, бо в рамці немає місця для підмета: навіть із втиснутим *es* речення все одно сказало б, що місце отримую **я**. А *damit es einen Platz zu bekommen* змішує дві машини: *damit* відкриває повноцінний Nebensatz і тому потребує відмінюваного дієслова (*bekommt*), а не інфінітива з *zu*."

  - id: match-schulen
    outcomes: [bildungsweg-erklaeren]
    type: match
    instruction:
      en: "Match each institution with what it is."
      ru: "Соотнесите каждое учреждение с тем, что оно собой представляет."
      uk: "Зіставте кожен заклад із тим, чим він є."
    pairs:
      - left: "die Krippe"
        right: { en: "day care for children under three", ru: "присмотр за детьми младше трёх лет", uk: "догляд за дітьми, молодшими за три роки" }
      - left: "die Grundschule"
        right: { en: "the first four years, which every child shares", ru: "первые четыре класса, которые проходят все дети", uk: "перші чотири класи, які проходять усі діти" }
      - left: "die Realschule"
        right: { en: "the middle branch, ending after year ten", ru: "средняя ветвь, заканчивается после десятого класса", uk: "середня гілка, закінчується після десятого класу" }
      - left: "das Gymnasium"
        right: { en: "the branch that leads to the Abitur", ru: "ветвь, ведущая к Abitur", uk: "гілка, що веде до Abitur" }
      - left: "die Fachhochschule"
        right: { en: "higher education with a work placement built into the course", ru: "вуз, где практика входит в программу", uk: "виш, де практика входить до програми" }
      - left: "die Volkshochschule"
        right: { en: "evening courses for adults, run by the town", ru: "вечерние курсы для взрослых от города", uk: "вечірні курси для дорослих від міста" }
    explain:
      en: "The list is a ladder, and the two long words at the bottom are the ones to keep apart. A *Fachhochschule* really is higher education and awards degrees; a *Volkshochschule*, despite the same *-hochschule* inside it, awards none — it is the town's evening school, and it is where most language courses are taught. Between them sits the ordinary university, which everybody calls *die Uni*."
      ru: "Список — это лестница, и два длинных слова внизу как раз надо развести. *Fachhochschule* действительно относится к высшему образованию и выдаёт дипломы; *Volkshochschule*, несмотря на то же *-hochschule* внутри, не выдаёт ничего — это вечерняя школа города, и именно там идёт большинство языковых курсов. Между ними стоит обычный университет, который все зовут *die Uni*."
      uk: "Список — це драбина, і два довгі слова внизу якраз треба розвести. *Fachhochschule* справді належить до вищої освіти і видає дипломи; *Volkshochschule*, попри те саме *-hochschule* всередині, не видає нічого — це вечірня школа міста, і саме там іде більшість мовних курсів. Між ними стоїть звичайний університет, який усі звуть *die Uni*."

  - id: cloze-hochschule
    outcomes: [bildungsweg-erklaeren]
    type: cloze
    instruction:
      en: "Fill in the missing institution: Hochschule, Fachhochschule, Uni, Volkshochschule."
      ru: "Вставьте пропущенное учреждение: Hochschule, Fachhochschule, Uni, Volkshochschule."
      uk: "Вставте пропущений заклад: Hochschule, Fachhochschule, Uni, Volkshochschule."
    text: "Nach dem Abitur kann man an jeder {{Hochschule}} studieren. An einer {{Fachhochschule}} macht man im Studium ein Praktikum. Unter Studenten heißt die Universität einfach die {{Uni}}. Kurse für Erwachsene am Abend gibt es an der {{Volkshochschule}}."
    translation:
      en: "After the Abitur you may study at any institution of higher education. At a college of applied sciences you do a work placement as part of the course. Among students the university is simply called the Uni. Evening courses for adults are held at the adult education centre."
      ru: "После Abitur можно учиться в любом вузе. В прикладном вузе практика входит в программу обучения. Между собой студенты называют университет просто die Uni. Вечерние курсы для взрослых есть в народном университете."
      uk: "Після Abitur можна вчитися в будь-якому виші. У прикладному виші практика входить до програми навчання. Між собою студенти звуть університет просто die Uni. Вечірні курси для дорослих є в народному університеті."
    explain:
      en: "*Hochschule* is the umbrella over all four gaps, which is why the first sentence says *jeder Hochschule* rather than naming one kind. The false friend is worth saying out loud once: it is not a high school, and nobody under eighteen attends one. *Uni* is a clipped word that keeps the gender of its long form, and *Volkshochschule* is the odd one out — the *-hochschule* in its name is historical and it awards no degree."
      ru: "*Hochschule* — зонт над всеми четырьмя пропусками, поэтому в первом предложении стоит *jeder Hochschule*, а не название конкретного вида. Ложного друга стоит проговорить один раз вслух: это не средняя школа, и никто младше восемнадцати туда не ходит. *Uni* — усечённое слово, сохраняющее род полного, а *Volkshochschule* выпадает из ряда: *-hochschule* в её названии историческое, и никакой степени она не даёт."
      uk: "*Hochschule* — парасоля над усіма чотирма пропусками, тому в першому реченні стоїть *jeder Hochschule*, а не назва конкретного виду. Фальшивого друга варто проговорити один раз уголос: це не середня школа, і ніхто, молодший за вісімнадцять, туди не ходить. *Uni* — усічене слово, що зберігає рід повного, а *Volkshochschule* випадає з ряду: *-hochschule* в її назві історичне, і жодного ступеня вона не дає."

  - id: cloze-noten
    outcomes: [schulinfo-verstehen]
    type: cloze
    instruction:
      en: "Fill in the mark word: befriedigend, ausreichend, mangelhaft, ungenügend."
      ru: "Вставьте название отметки: befriedigend, ausreichend, mangelhaft, ungenügend."
      uk: "Вставте назву оцінки: befriedigend, ausreichend, mangelhaft, ungenügend."
    text: "Eine Drei heißt {{befriedigend}}. Eine Vier heißt {{ausreichend}} — die Prüfung ist gerade noch bestanden. Eine Fünf heißt {{mangelhaft}} und eine Sechs heißt {{ungenügend}}."
    translation:
      en: "A three is called satisfactory. A four is called adequate — the exam has only just been passed. A five is called deficient and a six is called unsatisfactory."
      ru: "Тройка называется befriedigend. Четвёрка — ausreichend: экзамен сдан едва-едва. Пятёрка — mangelhaft, а шестёрка — ungenügend."
      uk: "Трійка зветься befriedigend. Четвірка — ausreichend: іспит складено ледь-ледь. П'ятірка — mangelhaft, а шістка — ungenügend."
    explain:
      en: "The scale runs from 1 to 6 and 1 is the best, which is the direction to unlearn if your own school counted upwards. The pass line runs between the second and third gap: a 4 is *bestanden*, a 5 is not. Note that *ausreichend* is the German word for the lowest pass — Austria writes *genügend* there, and *genügend* is not a German mark at all."
      ru: "Шкала идёт от 1 до 6, и 1 — лучшая; это направление придётся переучить тем, у кого в школе считали вверх. Черта «сдал / не сдал» проходит между вторым и третьим пропуском: 4 — это *bestanden*, 5 — уже нет. Обратите внимание: немецкое слово для низшей проходной отметки — *ausreichend*; Австрия пишет там *genügend*, а немецкой отметкой *genügend* не является вовсе."
      uk: "Шкала йде від 1 до 6, і 1 — найкраща; цей напрям доведеться переучити тим, у кого в школі рахували вгору. Межа «склав / не склав» проходить між другим і третім пропуском: 4 — це *bestanden*, 5 — уже ні. Зверніть увагу: німецьке слово для найнижчої прохідної оцінки — *ausreichend*; Австрія пише там *genügend*, а німецькою оцінкою *genügend* не є зовсім."
