  question: 'Was passiert mit den Beträgen für Januar und Februar?'
  options:
  - 'Frau Rossi bekommt das Geld zurück.'
  - 'Sie muss sie noch zusätzlich bezahlen.'
  - 'Sie werden am fünfzehnten vom Konto genommen.'
  correct: 0
  explain:
    en: 'The rent was on the bill by mistake in those months too, so she gets that money back: Sie bekommen das Geld zurück. On the fifteenth she pays only the basic price.'
    ru: 'Аренда по ошибке стояла в счёте и в эти месяцы, поэтому деньги ей вернут: Sie bekommen das Geld zurück. Пятнадцатого она платит только базовую цену.'
    uk: 'Оренда помилково стояла в рахунку й у ці місяці, тому гроші їй повернуть: Sie bekommen das Geld zurück. П''ятнадцятого вона платить лише базову ціну.'
    de: 'Die Miete stand auch in diesen Monaten falsch auf der Rechnung, deshalb bekommt sie das Geld zurück. Am fünfzehnten zahlt sie nur den Grundpreis.'
  max_replays: 3
