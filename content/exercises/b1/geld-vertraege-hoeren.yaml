topic: geld-vertraege
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Geld & Verträge"
title:
  en: 'A wrong line on the internet bill'
  ru: 'Ошибка в счёте за интернет'
  uk: 'Помилка в рахунку за інтернет'
  de: 'Eine falsche Zeile auf der Internetrechnung'
items:
- id: q1
  outcomes:
  - rechnung-pruefen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Herr Schulz
      text: 'Netzwelt, Kundenservice, mein Name ist Schulz. Was kann ich für Sie tun?'
    - speaker: Frau Rossi
      text: 'Guten Tag, ich rufe wegen meiner Rechnung vom März an. Da steht eine Miete für das Telefon, vier Euro neunundneunzig im Monat.'
    - speaker: Herr Schulz
      text: 'Einen Moment, ich sehe nach. Ja, das steht in Ihrem Vertrag.'
    - speaker: Frau Rossi
      text: 'Das Telefon habe ich aber am Anfang vom Vertrag gekauft, nicht gemietet. Die Quittung habe ich noch.'
    - speaker: Herr Schulz
      text: 'Sie haben recht, das war ein Fehler bei uns. Ich nehme die Miete von der Rechnung, und Sie bekommen das Geld für Januar und Februar zurück.'
    - speaker: Frau Rossi
      text: 'Muss ich die Rechnung jetzt trotzdem bezahlen?'
    - speaker: Herr Schulz
      text: 'Ja, aber nur den Grundpreis von neunundzwanzig Euro. Das Geld nehmen wir wie immer am fünfzehnten von Ihrem Konto, daran ändert sich nichts.'
    - speaker: Frau Rossi
      text: 'Bekomme ich das schriftlich?'
    - speaker: Herr Schulz
      text: 'Natürlich. Sie bekommen heute noch eine E-Mail mit der korrigierten Rechnung.'
  recording: ls-geld-vertraege-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Was stimmt auf der Rechnung nicht?'
  options:
  - 'Sie enthält eine Miete für ein Telefon, das Frau Rossi gekauft hat.'
  - 'Der Grundpreis ist zu hoch.'
  - 'Der Tag der Zahlung ist falsch.'
  correct: 0
  explain:
    en: 'Gekauft, nicht gemietet is the whole complaint, and the receipt proves it. The basic price and the payment day stay as they are.'
    ru: 'Gekauft, nicht gemietet — в этом вся претензия, и квитанция это подтверждает. Базовая цена и день оплаты остаются прежними.'
    uk: 'Gekauft, nicht gemietet — у цьому вся претензія, і квитанція це підтверджує. Базова ціна й день оплати залишаються незмінними.'
    de: '„Gekauft, nicht gemietet“ ist das ganze Problem, und die Quittung beweist es. Der Grundpreis und der Tag der Zahlung bleiben, wie sie sind.'
  max_replays: 3
