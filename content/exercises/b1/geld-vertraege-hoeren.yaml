  question: 'Wann nimmt die Firma das Geld vom Konto?'
  options:
  - 'Wie immer am fünfzehnten.'
  - 'Erst nach der neuen Rechnung.'
  - 'Heute noch.'
  correct: 0
  explain:
    en: 'Wie immer am fünfzehnten, daran ändert sich nichts — one line of the bill changes, the payment day does not. Heute noch is when the corrected bill arrives by e-mail.'
    ru: 'Wie immer am fünfzehnten, daran ändert sich nichts — меняется строка, а день оплаты нет. Heute noch придёт исправленный счёт по почте.'
    uk: 'Wie immer am fünfzehnten, daran ändert sich nichts — змінюється рядок, а день оплати ні. Heute noch прийде виправлений рахунок електронною поштою.'
