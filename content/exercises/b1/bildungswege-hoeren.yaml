topic: bildungswege
role: practice
stage: transfer
activity: task
skill: hoeren
title_de: "Hören im Kontext — Bildungswege"
title:
  en: 'A place at the Kita'
  ru: 'Место в детском саду'
  uk: 'Місце в дитсадку'
  de: 'Ein Platz in der Kita'
items:
- id: q1
  outcomes:
  - betreuung-klaeren
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Frau Wolff
      text: 'Guten Tag, kommen Sie herein. Wie kann ich Ihnen helfen?'
    - speaker: Frau Haddad
      text: 'Guten Tag. Ich möchte meinen Sohn anmelden. Karim ist zwei Jahre alt. Haben Sie noch einen Platz frei?'
    - speaker: Frau Wolff
      text: 'Im Moment leider nicht. Aber im September werden Plätze frei, weil dann viele Kinder in die Grundschule kommen.'
    - speaker: Frau Haddad
      text: 'September wäre gut. Ich fange dann an der Hochschule an und brauche den Platz, damit ich vormittags zu meinen Kursen gehen kann.'
    - speaker: Frau Wolff
      text: 'Also nur vormittags, bis vierzehn Uhr?'
    - speaker: Frau Haddad
      text: 'Erst einmal ja. Falls ich später auch nachmittags Kurse habe, möchte ich gern länger buchen. Geht das?'
    - speaker: Frau Wolff
      text: 'Falls dann ein Platz frei ist, ja. Versprechen kann ich es Ihnen aber nicht.'
    - speaker: Frau Haddad
      text: 'Verstehe. Was muss ich für die Anmeldung mitbringen?'
    - speaker: Frau Wolff
      text: 'Dieses Formular, die Geburtsurkunde und eine Bestätigung vom Kinderarzt. Wenn Sie alles bis Ende März abgeben, kommt Karim auf die Liste für September.'
    - speaker: Frau Haddad
      text: 'Gut, dann komme ich nächste Woche, um alles abzugeben.'
  recording: ls-bildungswege-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Warum werden im September Plätze frei?'
  options:
  - 'Weil dann viele Kinder in die Grundschule kommen.'
  - 'Weil die Kita dann größer wird.'
  - 'Weil Frau Haddad dann an der Hochschule anfängt.'
  correct: 0
  explain:
    en: 'Frau Wolff gives the reason with weil: im September viele Kinder kommen in die Grundschule, and their places open up. The Hochschule is Frau Haddad''s own plan for September.'
    ru: 'Госпожа Вольф объясняет причину через weil: в сентябре многие дети идут в Grundschule, и их места освобождаются. Hochschule — это планы самой госпожи Хаддад на сентябрь.'
    uk: 'Пані Вольф пояснює причину через weil: у вересні багато дітей ідуть до Grundschule, і їхні місця звільняються. Hochschule — це плани самої пані Хаддад на вересень.'
    de: 'Frau Wolff nennt den Grund mit „weil“: Im September kommen viele Kinder in die Grundschule, und ihre Plätze werden frei. Die Hochschule ist Frau Haddads eigener Plan.'
  max_replays: 3
