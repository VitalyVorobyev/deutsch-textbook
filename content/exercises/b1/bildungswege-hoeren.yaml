  question: 'Wozu braucht Frau Haddad den Platz?'
  options:
  - 'Damit sie vormittags zu ihren Kursen gehen kann.'
  - 'Damit Karim vor der Grundschule Deutsch lernt.'
  - 'Damit sie nachmittags arbeiten kann.'
  correct: 0
  explain:
    en: 'Damit introduces the purpose, and the subject changes: she needs the place so that she can go to her courses in the morning. Afternoons come up only as a possibility later.'
    ru: 'Damit вводит цель, причём подлежащее меняется: место нужно, чтобы она сама могла по утрам ходить на занятия. Вторая половина дня появляется лишь как возможность на будущее.'
    uk: 'Damit вводить мету, причому підмет змінюється: місце потрібне, щоб вона сама могла вранці ходити на заняття. Друга половина дня з''являється лише як можливість на майбутнє.'
    de: 'Mit „damit“ nennt sie das Ziel: Sie braucht den Platz, „damit ich vormittags zu meinen Kursen gehen kann“. Von Nachmittagen spricht sie nur als Möglichkeit für später.'
