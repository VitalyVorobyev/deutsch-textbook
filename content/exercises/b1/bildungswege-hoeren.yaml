  question: 'Was sagt Frau Wolff über einen längeren Platz?'
  options:
  - 'Das geht nur, falls dann ein Platz frei ist.'
  - 'Das ist ab September sicher möglich.'
  - 'Die Kita hat nachmittags geschlossen.'
  correct: 0
  explain:
    en: 'Falls marks a condition that may never happen. Frau Wolff repeats it — falls dann ein Platz frei ist — and adds that she cannot promise anything.'
    ru: 'Falls обозначает условие, которое может и не наступить. Госпожа Вольф повторяет его — falls dann ein Platz frei ist — и добавляет, что ничего обещать не может.'
    uk: 'Falls позначає умову, яка може й не настати. Пані Вольф повторює її — falls dann ein Platz frei ist — і додає, що нічого обіцяти не може.'
    de: '„Falls“ nennt eine Bedingung, die vielleicht nicht eintritt. Frau Wolff sagt: „Falls dann ein Platz frei ist, ja“, und sagt auch, dass sie es nicht versprechen kann.'
