# B1.9 primary practice. The three new tags close the unit's three contract points
# (finalsatz-damit → damit-um-zu; konditionalsatz-falls → falls-wenn;
# infinitivsatz-ohne-statt → ohne-statt-zu). Three items recycle earlier tags and
# close nothing — they are the live runtime channels of the `deepens` edges:
# uebersetzen-um-zu-ziel (um-zu-zweck) carries the edge to infinitiv-mit-zu — the
# shared-subject um … zu produced on its own, the form the new subject test prefers;
# uebersetzen-wissen-ob (indirekte-frage) carries the edge to lernen-verstehen —
# Marta prepares her Beratung questions with the A2 machine; uebersetzen-vorfeld-falls
# (nebensatz-vorfeld) carries the edge to nebensaetze-plaene — the fronted
# falls-clause fills position 1, so the main clause opens with its verb.
# Outcome discipline, because probe families arm by outcome (src/lib/probes.ts):
# every item on `ziele-begruenden` builds or weighs a purpose clause (damit or
# um … zu), every item on `plan-formulieren` builds a plan condition (falls/wenn and
# its word order), every item on `beratung-verstehen` works the what-instead/
# what-without structures the adviser's key points travel in, plus the indirect
# question that prepares them. Nothing arms a family whose competence it does not
# touch.
# Format ladder per B1.8: each new point runs cloze → mc → translate. order is
# saturated per the standing backlog ruling (99% over 78 attempts), so the practice
# union ships zero order items. Contract exclusions hold: no Futur II anywhere —
# plans stay in the present or take A2's werden — and no counselling jargon beyond
# the deck's own Beratung.
# This set is the primaryPractice — its item list never grows after shipping.
topic: lernen-zukunft
role: practice
title:
  en: "Practice — damit or um … zu, wenn or falls, the zu-family"
  ru: "Практика — damit или um … zu, wenn или falls, семья с zu"
  uk: "Практика — damit чи um … zu, wenn чи falls, родина з zu"
  de: "Übung — damit oder um … zu, wenn oder falls, die zu-Familie"
items:
  - id: cloze-damit-passt
    outcomes: [ziele-begruenden]
    type: cloze
    focus: damit-um-zu
    instruction:
      en: "The purpose clause answers wozu? — and it has its own, second subject. Fill in the connector and the verb passen in the form the clause needs."
      ru: "Придаточное цели отвечает на wozu? — и у него своё, второе подлежащее. Впишите союз и глагол passen в нужной форме."
      uk: "Підрядне мети відповідає на wozu? — і має свій, другий підмет. Впишіть сполучник і дієслово passen у потрібній формі."
      de: "Der Finalsatz antwortet auf wozu? — und er hat ein eigenes, zweites Subjekt. Ergänze die Konjunktion und das Verb passen in der passenden Form."
    text: "Ich erzähle kurz von meinem Beruf, {{damit}} die Empfehlung zu meinem Alltag {{passt}}."
    translation:
      en: "I tell them briefly about my job, so that the recommendation fits my everyday life."
      ru: "Я коротко рассказываю о своей работе, чтобы рекомендация подходила к моим будням."
      uk: "Я коротко розповідаю про свою роботу, щоб рекомендація пасувала до моїх буднів."
    explain:
      en: "Count the subjects: ich tell, but die Empfehlung fits — two different doers. The um … zu clause has no subject slot at all, so only damit can hold the second one, and as a subordinating conjunction it sends passt to the very end. With one shared subject this course would compress to um … zu instead."
      ru: "Считайте подлежащие: рассказываю я, а подходит die Empfehlung — деятели разные. В обороте с um … zu места для подлежащего нет вовсе, поэтому второго деятеля вмещает только damit — а как подчинительный союз он отправляет passt в самый конец. При общем подлежащем курс сжал бы фразу до um … zu."
      uk: "Рахуйте підмети: розповідаю я, а пасує die Empfehlung — діячі різні. У звороті з um … zu місця для підмета немає взагалі, тому другого діяча вміщає лише damit — а як підрядний сполучник воно відправляє passt у самий кінець. За спільного підмета курс стиснув би фразу до um … zu."
      de: "Zähl die Subjekte: ich erzähle, aber die Empfehlung passt — zwei verschiedene Handelnde. Der um … zu-Satz hat gar keinen Platz für ein Subjekt, also kann nur damit das zweite aufnehmen — und als unterordnende Konjunktion schickt es passt ganz ans Ende. Bei einem gemeinsamen Subjekt würde dieser Kurs stattdessen zu um … zu greifen."

  - id: mc-um-zu-abendkurs
    outcomes: [ziele-begruenden]
    type: mc
    focus: damit-um-zu
    prompt: "Ich mache den Abendkurs, ___ neben der Arbeit weiterzulernen."
    options:
      - "um"
      - "damit"
      - "dass"
    correct: 0
    translation:
      en: "I am doing the evening course in order to keep learning alongside my job."
      ru: "Я иду на вечерний курс, чтобы продолжать учиться параллельно с работой."
      uk: "Я йду на вечірній курс, щоб продовжувати вчитися поряд із роботою."
    explain:
      en: "Look at what follows the gap: no subject of its own, and the clause closes with the zu-infinitive weiterzulernen. That shape belongs to um alone. damit and dass both open a full Nebensatz — they would need their own subject and a conjugated verb (damit ich … weiterlerne). English blurs the same line, because 'so that' and 'in order to' both translate a purpose — which is exactly why the hand reaches for damit here; the missing subject says no."
      ru: "Посмотрите, что стоит после пропуска: собственного подлежащего нет, а оборот закрывает инфинитив с zu — weiterzulernen. Такая форма бывает только у um. damit и dass открывают полноценный Nebensatz — им нужны своё подлежащее и спрягаемый глагол (damit ich … weiterlerne). Русское «чтобы» одно на обе конструкции — потому рука и тянется к damit; отсутствие подлежащего говорит «нет»."
      uk: "Подивіться, що стоїть після пропуску: власного підмета немає, а зворот закриває інфінітив із zu — weiterzulernen. Така форма буває лише в um. damit і dass відкривають повноцінний Nebensatz — їм потрібні свій підмет і відмінюване дієслово (damit ich … weiterlerne). Українське «щоб» одне на обидві конструкції — тому рука й тягнеться до damit; відсутність підмета каже «ні»."
      de: "Sieh dir an, was nach der Lücke steht: kein eigenes Subjekt, und der Satz schließt mit dem zu-Infinitiv weiterzulernen. Diese Form gehört allein zu um. damit und dass eröffnen einen vollen Nebensatz — sie bräuchten ein eigenes Subjekt und ein konjugiertes Verb (damit ich … weiterlerne). Das fehlende Subjekt entscheidet."

  - id: uebersetzen-damit-beratung
    outcomes: [ziele-begruenden]
    type: translate
    focus: damit-um-zu
    instruction:
      en: "Translate — count the subjects before you choose the connector. Use zur Beratung gehen; for 'recommend' take empfehlen."
      ru: "Переведите — сосчитайте подлежащие, прежде чем выбрать союз. Используйте zur Beratung gehen; для «порекомендовать» возьмите empfehlen."
      uk: "Перекладіть — порахуйте підмети, перш ніж вибрати сполучник. Використайте zur Beratung gehen; для «порекомендувати» візьміть empfehlen."
      de: "Übersetze — zähl die Subjekte, bevor du die Konjunktion wählst. Nimm zur Beratung gehen; für die Empfehlung empfehlen."
    prompt_en: "I am going to the counselling session on Thursday so that Frau Weber recommends me a course."
    prompt_ru: "В четверг я иду на консультацию, чтобы фрау Вебер порекомендовала мне курс."
    prompt_uk: "У четвер я йду на консультацію, щоб пані Вебер порекомендувала мені курс."
    answer: "Ich gehe am Donnerstag zur Beratung, damit mir Frau Weber einen Kurs empfiehlt."
    accept:
      # Both Mittelfeld orders of pronoun and subject are neutral German, and the
      # time phrase may take position 1 — the product is 2 × 2 renderings.
      - "Ich gehe am Donnerstag zur Beratung, damit Frau Weber mir einen Kurs empfiehlt."
      - "Am Donnerstag gehe ich zur Beratung, damit mir Frau Weber einen Kurs empfiehlt."
      - "Am Donnerstag gehe ich zur Beratung, damit Frau Weber mir einen Kurs empfiehlt."
    key_tokens: ["damit", "empfiehlt"]
    explain:
      en: "Graded are the two ends of the forced form: damit and the clause-final empfiehlt. I go, Frau Weber recommends — two subjects, so the subjectless um … zu has no room (um Frau Weber mir … zu empfehlen is exactly the impossible sentence). Inside the damit-clause, mir and Frau Weber may stand in either order, and the fronted Am Donnerstag simply pulls gehe to second position."
      ru: "Оцениваются два конца обязательной формы: damit и empfiehlt в самом конце. Иду я, а рекомендует фрау Вебер — два подлежащих, поэтому бессубъектному um … zu здесь нет места (um Frau Weber mir … zu empfehlen — ровно то невозможное предложение). Внутри придаточного mir и Frau Weber могут стоять в любом порядке, а вынесенное Am Donnerstag просто притягивает gehe на второе место."
      uk: "Оцінюються два кінці обов'язкової форми: damit і empfiehlt у самому кінці. Іду я, а рекомендує пані Вебер — два підмети, тому безпідметовому um … zu тут немає місця (um Frau Weber mir … zu empfehlen — рівно те неможливе речення). Усередині підрядного mir і Frau Weber можуть стояти в будь-якому порядку, а винесене Am Donnerstag просто притягує gehe на друге місце."
      de: "Bewertet werden die zwei Enden der erzwungenen Form: damit und das satzfinale empfiehlt. Ich gehe, Frau Weber empfiehlt — zwei Subjekte, also hat das subjektlose um … zu keinen Raum (um Frau Weber mir … zu empfehlen ist genau der unmögliche Satz). Im damit-Satz dürfen mir und Frau Weber in beiden Reihenfolgen stehen, und das vorangestellte Am Donnerstag zieht gehe auf Position 2."

  - id: uebersetzen-um-zu-ziel
    outcomes: [ziele-begruenden]
    type: translate
    focus: um-zu-zweck
    instruction:
      en: "One shared subject — use the um … zu frame. For 'revise' take wiederholen, for 'pass' bestehen."
      ru: "Общее подлежащее — используйте рамку um … zu. Для «повторять» возьмите wiederholen, для «сдать» — bestehen."
      uk: "Спільний підмет — використайте рамку um … zu. Для «повторювати» візьміть wiederholen, для «скласти» — bestehen."
      de: "Ein gemeinsames Subjekt — nimm den Rahmen um … zu. Für das Wiederholen wiederholen, für das Bestehen bestehen."
    prompt_en: "I revise grammar every evening in order to pass the exam."
    prompt_ru: "Я повторяю грамматику каждый вечер, чтобы сдать экзамен."
    prompt_uk: "Я повторюю граматику щовечора, щоб скласти іспит."
    answer: "Ich wiederhole jeden Abend Grammatik, um die Prüfung zu bestehen."
    accept:
      - "Jeden Abend wiederhole ich Grammatik, um die Prüfung zu bestehen."
      - "Um die Prüfung zu bestehen, wiederhole ich jeden Abend Grammatik."
    key_tokens: ["um", "Um", "zu", "bestehen"]
    explain:
      en: "The one who revises and the one who passes are the same person, so the compact frame does it: um opens, zu bestehen closes, no subject in between. The frame has two ends and needs both — never für + infinitive and never um alone. This is the A2 machine; the new B1 fact is only that a second subject would break it and hand the sentence to damit."
      ru: "Повторяет и сдаёт один и тот же человек, поэтому работает компактная рамка: um открывает, zu bestehen закрывает, подлежащего между ними нет. У рамки два конца, и нужны оба — никогда für + инфинитив и никогда одиночное um. Это машина из A2; новый факт B1 лишь в том, что второе подлежащее её сломало бы и отдало предложение damit."
      uk: "Повторює і складає та сама людина, тому працює компактна рамка: um відкриває, zu bestehen закриває, підмета між ними немає. У рамки два кінці, і потрібні обидва — ніколи für + інфінітив і ніколи одиночне um. Це машина з A2; новий факт B1 лише в тому, що другий підмет зламав би її і віддав речення damit."
      de: "Wer wiederholt und wer besteht, ist dieselbe Person, also reicht der kompakte Rahmen: um öffnet, zu bestehen schließt, kein Subjekt dazwischen. Der Rahmen hat zwei Enden und braucht beide — nie für + Infinitiv und nie ein bloßes um. Das ist die A2-Maschine; der neue B1-Befund ist nur, dass ein zweites Subjekt sie sprengen und den Satz an damit übergeben würde."

  - id: cloze-wenn-oder-falls
    outcomes: [plan-formulieren]
    type: cloze
    focus: falls-wenn
    instruction:
      en: "wenn or falls? The first event is certain — it is on the timetable; the second is a mere possibility. One of the two gaps allows both words."
      ru: "wenn или falls? Первое событие наверняка случится — оно стоит в расписании; второе лишь возможно. Одна из двух лакун допускает оба слова."
      uk: "wenn чи falls? Перша подія напевно станеться — вона стоїть у розкладі; друга лише можлива. Одна з двох лакун допускає обидва слова."
      de: "wenn oder falls? Das erste Ereignis ist sicher — es steht im Stundenplan; das zweite ist bloß möglich. Eine der zwei Lücken erlaubt beide Wörter."
    text: "{{Wenn}} der Unterricht am Abend endet, ist es draußen schon dunkel. {{Falls|Wenn}} die Schule früher zumacht, schicke ich dir eine Nachricht."
    translation:
      en: "When the lessons end in the evening, it is already dark outside. In case the school closes earlier, I will send you a message."
      ru: "Когда занятия вечером заканчиваются, на улице уже темно. Если школа вдруг закроется раньше, я отправлю тебе сообщение."
      uk: "Коли заняття ввечері закінчуються, надворі вже темно. Якщо школа раптом зачиниться раніше, я надішлю тобі повідомлення."
    explain:
      en: "The asymmetry is the lesson. The first sentence is about time — the lessons will certainly end — and falls has no temporal reading at all, so only wenn fits. The second covers a case nobody expects: falls is the precise signal («in the event that»), but wenn stays grammatical there, because wenn can always stand in for falls — never the other way round."
      ru: "Урок — в асимметрии. Первое предложение о времени: занятия закончатся наверняка, а у falls временно́го прочтения нет вовсе — подходит только wenn. Второе страхует случай, которого никто не ждёт: falls — точный сигнал («на случай, если»), но wenn там остаётся грамматичным, потому что wenn всегда может заменить falls — и никогда наоборот."
      uk: "Урок — в асиметрії. Перше речення про час: заняття закінчаться напевно, а в falls часового прочитання немає взагалі — пасує лише wenn. Друге страхує випадок, якого ніхто не чекає: falls — точний сигнал («на випадок, якщо»), але wenn там лишається граматичним, бо wenn завжди може замінити falls — і ніколи навпаки."
      de: "Die Asymmetrie ist die Lektion. Der erste Satz handelt von Zeit — der Unterricht endet sicher —, und falls hat gar keine zeitliche Lesart, also passt nur wenn. Der zweite sichert einen Fall ab, den niemand erwartet: falls ist das präzise Signal („für den Fall, dass“), aber wenn bleibt dort grammatisch, denn wenn kann falls immer ersetzen — nie umgekehrt."

  - id: mc-falls-erwartung
    outcomes: [plan-formulieren]
    type: mc
    focus: falls-wenn
    prompt: "Welcher Satz plant einen Fall ein, den der Sprecher nicht erwartet?"
    options:
      - "Falls der Abendkurs voll ist, nehme ich den Samstagskurs."
      - "Wenn der Kurs im September beginnt, habe ich sechs Wochen Zeit für die Vorbereitung."
      - "Wenn der Unterricht endet, gehen wir zusammen nach Hause."
    correct: 0
    translation:
      en: "Which sentence plans for a case the speaker does not expect?"
      ru: "Какое предложение закладывает в план случай, которого говорящий не ждёт?"
      uk: "Яке речення закладає в план випадок, якого мовець не чекає?"
    explain:
      en: "falls is the signal of the bare eventuality — «for the case that» the evening course is full, which the speaker hopes will not happen. The other two sentences ride on wenn's home ground: a course start that is on the calendar and a lesson end that comes every day. Putting falls into either of those would claim the timetable itself is in doubt."
      ru: "falls — сигнал голой эвентуальности: «на случай, если» вечерний курс полон, чего говорящий как раз не ждёт. Два других предложения стоят на родной территории wenn: старт курса по календарю и конец занятий, который наступает каждый день. Поставить туда falls значило бы объявить сомнительным само расписание."
      uk: "falls — сигнал голої можливості: «на випадок, якщо» вечірній курс повний, чого мовець якраз не чекає. Два інші речення стоять на рідній території wenn: старт курсу за календарем і кінець занять, що настає щодня. Поставити туди falls означало б оголосити сумнівним сам розклад."
      de: "falls ist das Signal der bloßen Eventualität — „für den Fall, dass“ der Abendkurs voll ist, was der Sprecher gerade nicht erwartet. Die zwei anderen Sätze stehen auf wenns Heimatboden: ein Kursbeginn, der im Kalender steht, und ein Unterrichtsende, das jeden Tag kommt. Ein falls dort würde behaupten, der Stundenplan selbst sei zweifelhaft."

  - id: uebersetzen-falls-antwort
    outcomes: [plan-formulieren]
    type: translate
    focus: falls-wenn
    instruction:
      en: "A mere eventuality — attach the condition with falls. For 'call' take anrufen."
      ru: "Голая эвентуальность — присоедините условие союзом falls. Для «позвонить» возьмите anrufen."
      uk: "Гола можливість — приєднайте умову сполучником falls. Для «зателефонувати» візьміть anrufen."
      de: "Eine bloße Eventualität — häng die Bedingung mit falls an. Für den Anruf nimm anrufen."
    prompt_en: "In case the school does not answer, I will call on Monday."
    prompt_ru: "Если школа вдруг не ответит, я позвоню в понедельник."
    prompt_uk: "Якщо школа раптом не відповість, я зателефоную в понеділок."
    answer: "Falls die Schule nicht antwortet, rufe ich am Montag an."
    accept:
      - "Falls die Schule nicht antwortet, dann rufe ich am Montag an."
      - "Ich rufe am Montag an, falls die Schule nicht antwortet."
    key_tokens: ["Falls", "falls", "antwortet"]
    explain:
      en: "Graded are falls and the wall: antwortet closes its clause, exactly as after wenn or weil — falls is a signal about expectancy, not new word order. The plan does not predict the school's silence; it survives it. Fronted, the whole condition fills position 1, so the main clause opens verb-first: rufe ich … an, with anrufen's prefix at the very end."
      ru: "Оцениваются falls и стена: antwortet закрывает своё придаточное — ровно как после wenn или weil, ведь falls — сигнал об ожидании, а не новый порядок слов. План не предсказывает молчание школы — он его переживает. Вынесенное вперёд условие занимает первую позицию, и главное предложение начинается с глагола: rufe ich … an, приставка anrufen — в самом конце."
      uk: "Оцінюються falls і стіна: antwortet закриває своє підрядне — рівно як після wenn чи weil, адже falls — сигнал про очікування, а не новий порядок слів. План не передбачає мовчання школи — він його переживає. Винесена наперед умова займає першу позицію, і головне речення починається з дієслова: rufe ich … an, префікс anrufen — у самому кінці."
      de: "Bewertet werden falls und die Wand: antwortet schließt seinen Nebensatz — genau wie nach wenn oder weil, denn falls ist ein Signal über die Erwartung, keine neue Wortstellung. Der Plan sagt das Schweigen der Schule nicht voraus; er übersteht es. Vorangestellt besetzt die Bedingung Position 1, also beginnt der Hauptsatz mit dem Verb: rufe ich … an, das Präfix von anrufen ganz am Ende."

  - id: uebersetzen-vorfeld-falls
    outcomes: [plan-formulieren]
    type: translate
    focus: nebensatz-vorfeld
    instruction:
      en: "Begin with the falls-clause — and watch what comes right after the comma. For 'take' use nehmen."
      ru: "Начните с придаточного с falls — и проследите, что стоит сразу после запятой. Для «взять» используйте nehmen."
      uk: "Почніть з підрядного з falls — і простежте, що стоїть одразу після коми. Для «взяти» використайте nehmen."
      de: "Beginn mit dem falls-Satz — und achte darauf, was direkt nach dem Komma kommt. Für das Nehmen nimm nehmen."
    prompt_en: "If the evening course is full, I will take the Saturday course."
    prompt_ru: "Если вечерний курс будет полон, я возьму субботний курс."
    prompt_uk: "Якщо вечірній курс буде повний, я візьму суботній курс."
    answer: "Falls der Abendkurs voll ist, nehme ich den Kurs am Samstag."
    accept:
      # dann may hold position 1 after the fronted clause, and the course goes by
      # both its names — the product is 2 × 2 renderings.
      - "Falls der Abendkurs voll ist, dann nehme ich den Kurs am Samstag."
      - "Falls der Abendkurs voll ist, nehme ich den Samstagskurs."
      - "Falls der Abendkurs voll ist, dann nehme ich den Samstagskurs."
    key_tokens: ["nehme", "ich"]
    explain:
      en: "Graded is the pair after the comma: nehme ich, never ich nehme. The fronted falls-clause is not a warm-up before the sentence — it is the sentence's position 1, so the finite verb must come straight after it. English keeps subject-first order there ('If the course is full, I will take …'), which is exactly the habit this item measures. With dann, that word holds position 1 and the verb is still second."
      ru: "Оценивается пара после запятой: nehme ich, и никогда ich nehme. Вынесенное придаточное с falls — не разминка перед предложением, а его первая позиция, поэтому спрягаемый глагол обязан идти сразу за ним. Русский и украинский сохраняют там прямой порядок — ровно эту привычку задание и измеряет. С dann первую позицию занимает dann, и глагол всё равно второй."
      uk: "Оцінюється пара після коми: nehme ich, і ніколи ich nehme. Винесене підрядне з falls — не розминка перед реченням, а його перша позиція, тому відмінюване дієслово мусить іти одразу за ним. Українська і російська зберігають там прямий порядок — рівно цю звичку завдання й вимірює. З dann першу позицію займає dann, і дієслово все одно друге."
      de: "Bewertet wird das Paar nach dem Komma: nehme ich, niemals ich nehme. Der vorangestellte falls-Satz ist kein Aufwärmen vor dem Satz — er ist dessen Position 1, also muss das finite Verb direkt folgen. Die Ausgangssprachen behalten dort die Subjekt-zuerst-Ordnung, und genau diese Gewohnheit misst die Aufgabe. Mit dann besetzt dann Position 1, und das Verb bleibt zweites Element."

  - id: uebersetzen-wissen-ob
    outcomes: [beratung-verstehen]
    type: translate
    focus: indirekte-frage
    instruction:
      en: "Prepare a question for the Beratung as one sentence — start with Ich möchte wissen. For 'start' take beginnen."
      ru: "Подготовьте вопрос к консультации одним предложением — начните с Ich möchte wissen. Для «начинаться» возьмите beginnen."
      uk: "Підготуйте запитання до консультації одним реченням — почніть з Ich möchte wissen. Для «починатися» візьміть beginnen."
      de: "Bereite eine Frage für die Beratung als einen Satz vor — beginn mit Ich möchte wissen. Für den Kursbeginn nimm beginnen."
    prompt_en: "I would like to know whether the evening course starts in September."
    prompt_ru: "Я хочу узнать, начинается ли вечерний курс в сентябре."
    prompt_uk: "Я хочу дізнатися, чи починається вечірній курс у вересні."
    answer: "Ich möchte wissen, ob der Abendkurs im September beginnt."
    accept:
      - "Ich möchte gern wissen, ob der Abendkurs im September beginnt."
    key_tokens: ["ob", "beginnt"]
    explain:
      en: "Two decisions, both graded. A yes/no question has no question word, so ob must open the clause — it is English 'whether', and just as 'I would like to know starts the course' is impossible, the German clause cannot do without ob. And the wrapped verb goes to the wall: beginnt last, never ob beginnt der Abendkurs, which is the bare question smuggled in behind ob. This is the A2 machine from lernen-verstehen, now preparing Thursday's appointment."
      ru: "Два решения, и оба оцениваются. У вопроса «да/нет» нет вопросительного слова, поэтому придаточное открывает ob — по-русски эту работу делает частица «ли». А «обёрнутый» глагол уходит к стене: beginnt в конце, и никогда ob beginnt der Abendkurs — это самостоятельный вопрос, тайком пронесённый за ob. Машина из lernen-verstehen (A2), теперь она готовит встречу в четверг."
      uk: "Два рішення, і обидва оцінюються. У питання «так/ні» немає питального слова, тому підрядне відкриває ob — українською цю роботу робить частка «чи». А «обгорнуте» дієслово йде до стіни: beginnt у кінці, і ніколи ob beginnt der Abendkurs — це самостійне питання, потайки пронесене за ob. Машина з lernen-verstehen (A2), тепер вона готує зустріч у четвер."
      de: "Zwei Entscheidungen, beide bewertet. Eine Ja/Nein-Frage hat kein Fragewort, also muss ob den Nebensatz öffnen. Und das eingepackte Verb geht an die Wand: beginnt zuletzt, niemals ob beginnt der Abendkurs — das wäre die nackte Frage, hinter ob hineingeschmuggelt. Die A2-Maschine aus lernen-verstehen, jetzt bei der Vorbereitung des Donnerstagstermins."

  - id: cloze-ohne-zu
    outcomes: [beratung-verstehen]
    type: cloze
    focus: ohne-statt-zu
    instruction:
      en: "The ohne-clause — fill in the particle the infinitive clause never drops, and the verb benutzen in the form the clause ends with."
      ru: "Оборот с ohne — впишите частицу, которую инфинитивный оборот никогда не теряет, и глагол benutzen в той форме, которой оборот заканчивается."
      uk: "Зворот з ohne — впишіть частку, яку інфінітивний зворот ніколи не втрачає, і дієслово benutzen у тій формі, якою зворот закінчується."
      de: "Der ohne-Satz — ergänze die Partikel, die der Infinitivsatz nie verliert, und das Verb benutzen in der Form, mit der der Satz endet."
    text: "Ich lese meinen Text am nächsten Tag noch einmal, ohne das Wörterbuch {{zu}} {{benutzen}}."
    translation:
      en: "I read my text again the next day without using the dictionary."
      ru: "На следующий день я перечитываю свой текст, не пользуясь словарём."
      uk: "Наступного дня я перечитую свій текст, не користуючись словником."
    explain:
      en: "English says 'without using' with a bare gerund, and a gerund carries no particle at all — so the hand drops zu. The German clause is built on it: ohne + everything else + zu + infinitive at the very end, and no subject of its own — the same person reads and skips the dictionary. That shared subject is the whole family's entry condition, inherited from um … zu."
      ru: "Русское «не пользуясь» — деепричастие без всяких частиц, поэтому рука и теряет zu. Немецкий оборот на нём построен: ohne + всё остальное + zu + инфинитив в самом конце, и без собственного подлежащего — читает и обходится без словаря один и тот же человек. Это общее подлежащее — входное условие всей семьи, унаследованное от um … zu."
      uk: "Українське «не користуючись» — дієприслівник без жодних часток, тому рука й губить zu. Німецький зворот на ньому побудований: ohne + все інше + zu + інфінітив у самому кінці, і без власного підмета — читає і обходиться без словника та сама людина. Цей спільний підмет — вхідна умова всієї родини, успадкована від um … zu."
      de: "Andere Sprachen kommen hier ohne Partikel aus — Gerundium, Adverbialpartizip —, also lässt die Hand das zu fallen. Der deutsche Satz ist darauf gebaut: ohne + alles andere + zu + Infinitiv ganz am Ende, und ohne eigenes Subjekt — ein und dieselbe Person liest und verzichtet aufs Wörterbuch. Dieses gemeinsame Subjekt ist die Eintrittsbedingung der ganzen Familie, geerbt von um … zu."

  - id: mc-statt-wortstellung
    outcomes: [beratung-verstehen]
    type: mc
    focus: ohne-statt-zu
    prompt: "Welcher Satz ist richtig?"
    options:
      - "Statt auf die Antwort der Schule zu warten, ruft Marta einfach an."
      - "Statt zu warten auf die Antwort der Schule, ruft Marta einfach an."
      - "Statt auf die Antwort der Schule warten, ruft Marta einfach an."
    correct: 0
    translation:
      en: "Instead of waiting for the school's answer, Marta simply calls."
      ru: "Вместо того чтобы ждать ответа школы, Марта просто звонит."
      uk: "Замість того щоб чекати відповіді школи, Марта просто телефонує."
    explain:
      en: "The infinitive clause closes with zu + infinitive, and everything else stands before it: Statt auf die Antwort der Schule zu warten. The version with zu warten straight after statt copies the English order, where the verb comes right after 'instead of' — German parks it at the end. The version without zu drops what the clause is built on: statt never appears without it."
      ru: "Инфинитивный оборот закрывается через zu + инфинитив, а всё остальное стоит перед ними: Statt auf die Antwort der Schule zu warten. Вариант, где zu warten стоит сразу после statt, копирует порядок «вместо того чтобы ждать…», где глагол идёт сразу после союза, — немецкий ставит его в конец. Вариант без zu теряет то, на чём оборот построен: statt без него не бывает."
      uk: "Інфінітивний зворот закривається через zu + інфінітив, а все інше стоїть перед ними: Statt auf die Antwort der Schule zu warten. Варіант, де zu warten стоїть одразу після statt, копіює порядок «замість того щоб чекати…», де дієслово йде одразу після сполучника, — німецька ставить його в кінець. Варіант без zu губить те, на чому зворот побудований: statt без нього не буває."
      de: "Der Infinitivsatz schließt mit zu + Infinitiv, alles andere steht davor: Statt auf die Antwort der Schule zu warten. Die Variante mit zu warten direkt nach statt kopiert die Ordnung der Ausgangssprachen, wo das Verb gleich nach dem Konnektor kommt — das Deutsche parkt es am Ende. Die Variante ohne zu lässt das fallen, worauf der Satz gebaut ist: statt steht nie ohne es."

  - id: uebersetzen-statt-videos
    revision: 2
    outcomes: [beratung-verstehen]
    type: translate
    focus: ohne-statt-zu
    instruction:
      en: "Use statt … zu. For 'watch' take schauen, for 'revise' wiederholen."
      ru: "Используйте statt … zu. Для «смотреть» возьмите schauen, для «повторять» — wiederholen."
      uk: "Використайте statt … zu. Для «дивитися» візьміть schauen, для «повторювати» — wiederholen."
      de: "Nimm statt … zu. Für das Schauen schauen, für das Wiederholen wiederholen."
    prompt_en: "Instead of just watching videos, I revise grammar every evening."
    prompt_ru: "Вместо того чтобы просто смотреть видео, я каждый вечер повторяю грамматику."
    prompt_uk: "Замість того щоб просто дивитися відео, я щовечора повторюю граматику."
    answer: "Statt nur Videos zu schauen, wiederhole ich jeden Abend Grammatik."
    accept:
      # Clause order is free, and with the statt-clause last the main clause may
      # front its time phrase — three renderings. The restrictive adverb is a
      # second dimension: «просто»/«просто» name no particular one of nur and
      # bloß, and the intensifier carries no part of the graded frame, so both
      # run through all three orders.
      - "Ich wiederhole jeden Abend Grammatik, statt nur Videos zu schauen."
      - "Jeden Abend wiederhole ich Grammatik, statt nur Videos zu schauen."
      - "Statt bloß Videos zu schauen, wiederhole ich jeden Abend Grammatik."
      - "Ich wiederhole jeden Abend Grammatik, statt bloß Videos zu schauen."
      - "Jeden Abend wiederhole ich Grammatik, statt bloß Videos zu schauen."
    key_tokens: ["Statt", "statt", "zu", "schauen"]
    explain:
      en: "Graded is the clause's skeleton: statt opens it, zu schauen closes it, and the watching is thereby named as the alternative that does not happen. The subjects must match — the one who skips the videos is the one who revises. Fronted, the whole statt-clause fills position 1, so the main clause opens with wiederhole."
      ru: "Оценивается скелет оборота: statt его открывает, zu schauen закрывает — и просмотр тем самым назван альтернативой, которая не происходит. Подлежащие должны совпадать: кто пропускает видео, тот и повторяет. Вынесенный вперёд оборот со statt занимает первую позицию, поэтому главное предложение начинается с wiederhole."
      uk: "Оцінюється скелет звороту: statt його відкриває, zu schauen закриває — і перегляд тим самим названо альтернативою, що не відбувається. Підмети мусять збігатися: хто пропускає відео, той і повторює. Винесений наперед зворот зі statt займає першу позицію, тому головне речення починається з wiederhole."
      de: "Bewertet wird das Gerüst des Satzes: statt öffnet ihn, zu schauen schließt ihn — und das Schauen ist damit als die Alternative benannt, die ausbleibt. Die Subjekte müssen übereinstimmen: Wer die Videos auslässt, ist derselbe, der wiederholt. Vorangestellt besetzt der ganze statt-Satz Position 1, also beginnt der Hauptsatz mit wiederhole."
