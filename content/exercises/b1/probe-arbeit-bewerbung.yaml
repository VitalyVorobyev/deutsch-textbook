# Delayed probe family 1 of 3 — ONE competence: giving an n-declension person noun its
# -(e)n when the case is anything but the nominative singular. Three parallel cloze
# variants, one per oblique case (Dativ, Akkusativ, Genitiv), in three lexemes no practice
# item, article example or reading sentence uses — Kunde, Student, Nachbar, all named in
# the chapter's family table. Cloze-preferred for attribution: the frame is given, only the
# graded form is produced, and each instruction names the base noun so the target is
# determinate served alone.
topic: arbeit-bewerbung
role: probe
title:
  en: "Delayed check — the noun that declines with its article"
  ru: "Отложенная проверка — существительное, склоняющееся вместе с артиклем"
  uk: "Відкладена перевірка — іменник, що відмінюється разом з артиклем"
  de: "Kontrolle mit Abstand — das Nomen, das mit seinem Artikel dekliniert"
items:
  - id: variant-a
    outcomes: [bewerbung-schreiben]
    type: cloze
    focus: n-deklination
    instruction:
      en: "Fill in Kunde in the form the sentence needs."
      ru: "Впишите Kunde в форме, которой требует предложение."
      uk: "Впишіть Kunde у формі, якої вимагає речення."
      de: "Ergänze Kunde in der Form, die der Satz verlangt."
    text: "Die Verkäuferin erklärt dem {{Kunden}} den Weg zur Kasse."
    translation:
      en: "The salesperson explains the way to the till to the customer."
      ru: "Продавщица объясняет клиенту дорогу к кассе."
      uk: "Продавчиня пояснює клієнтові дорогу до каси."
    explain:
      en: "dem says dative, and Kunde belongs to the family that answers: outside the nominative singular it wears its -n — dem Kunden. It joins through its final -e, like Kollege and Junge. The article is the warning, and the noun is the second half of the same signal."
      ru: "dem говорит «датив», а Kunde принадлежит к семье, которая на это отзывается: вне номинатива единственного числа оно носит своё -n — dem Kunden. В семью оно входит через конечное -e, как Kollege и Junge. Артикль — предупреждение, а существительное — вторая половина того же сигнала."
      uk: "dem каже «давальний», а Kunde належить до родини, яка на це відгукується: поза називним однини воно носить своє -n — dem Kunden. У родину воно входить через кінцеве -e, як Kollege і Junge. Артикль — попередження, а іменник — друга половина того самого сигналу."
      de: "dem sagt Dativ, und Kunde gehört zu der Familie, die darauf antwortet: Außerhalb des Nominativ Singular trägt es sein -n — dem Kunden. Es gehört durch sein -e dazu, wie Kollege und Junge. Der Artikel ist die Warnung, das Nomen die zweite Hälfte desselben Signals."

  - id: variant-b
    outcomes: [bewerbung-schreiben]
    type: cloze
    focus: n-deklination
    instruction:
      en: "Fill in Student in the form the sentence needs."
      ru: "Впишите Student в форме, которой требует предложение."
      uk: "Впишіть Student у формі, якої вимагає речення."
      de: "Ergänze Student in der Form, die der Satz verlangt."
    text: "Im Kurs habe ich einen netten {{Studenten}} aus Polen kennengelernt."
    translation:
      en: "In the course I got to know a nice student from Poland."
      ru: "На курсе я познакомился с приятным студентом из Польши."
      uk: "На курсі я познайомився з приємним студентом із Польщі."
    explain:
      en: "einen says accusative, and Student joins the family through the person suffix -ent — so it takes -en: einen Studenten. The adjective in front changes nothing; netten is doing its own job, and the noun still has to add its own ending."
      ru: "einen говорит «аккузатив», а Student входит в семью через суффикс лица -ent — значит, берёт -en: einen Studenten. Прилагательное впереди ничего не меняет: netten выполняет свою работу, а существительное всё равно обязано добавить собственное окончание."
      uk: "einen каже «знахідний», а Student входить у родину через суфікс особи -ent — отже, бере -en: einen Studenten. Прикметник попереду нічого не змінює: netten виконує свою роботу, а іменник усе одно мусить додати власне закінчення."
      de: "einen sagt Akkusativ, und Student gehört über das Personensuffix -ent zur Familie — also nimmt es -en: einen Studenten. Das Adjektiv davor ändert nichts; netten macht seine eigene Arbeit, und das Nomen muss trotzdem seine eigene Endung setzen."

  - id: variant-c
    outcomes: [bewerbung-schreiben]
    type: cloze
    focus: n-deklination
    instruction:
      en: "Fill in Nachbar in the form the sentence needs."
      ru: "Впишите Nachbar в форме, которой требует предложение."
      uk: "Впишіть Nachbar у формі, якої вимагає речення."
      de: "Ergänze Nachbar in der Form, die der Satz verlangt."
    text: "Die Adresse des neuen {{Nachbarn}} steht auf dem Brief."
    translation:
      en: "The new neighbour's address is on the letter."
      ru: "Адрес нового соседа стоит на письме."
      uk: "Адреса нового сусіда стоїть на листі."
    explain:
      en: "des says genitive, and Nachbar is on the short memorized list — Herr, Mensch, Nachbar — so it takes -n here too: des Nachbarn. Note what it does not take: the ordinary masculine genitive -s. A noun of this family never carries both, and this is the case where the difference is easiest to miss. One family, one competence: the ending the article demands, produced cold."
      ru: "des говорит «генитив», а Nachbar стоит в коротком списке для запоминания — Herr, Mensch, Nachbar, — значит, и здесь берёт -n: des Nachbarn. Обратите внимание, чего оно не берёт: обычного мужского генитивного -s. Слово этой семьи никогда не носит оба окончания сразу, и именно в этом падеже разницу проще всего не заметить. Одна семья, одна компетенция: окончание, которого требует артикль, воспроизведённое без подготовки."
      uk: "des каже «родовий», а Nachbar стоїть у короткому списку для запам'ятовування — Herr, Mensch, Nachbar, — отже, і тут бере -n: des Nachbarn. Зверніть увагу, чого воно не бере: звичайного чоловічого родового -s. Слово цієї родини ніколи не носить обидва закінчення разом, і саме в цьому відмінку різницю найлегше не помітити. Одна родина, одна компетенція: закінчення, якого вимагає артикль, відтворене без підготовки."
      de: "des sagt Genitiv, und Nachbar steht auf der kurzen Merkliste — Herr, Mensch, Nachbar —, also nimmt es auch hier -n: des Nachbarn. Und es nimmt gerade nicht das übliche maskuline Genitiv-s. Ein Nomen dieser Familie trägt nie beides, und in diesem Kasus übersieht man den Unterschied am leichtesten. Eine Familie, eine Fähigkeit: die Endung, die der Artikel verlangt, aus dem Stand gebildet."
