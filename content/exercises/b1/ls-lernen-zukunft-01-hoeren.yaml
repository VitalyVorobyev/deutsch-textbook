topic: lernen-zukunft
role: practice
title:
  en: Guidance on the next professional step
  ru: Консультация о следующем шаге в работе
  uk: 'Консультація про наступний крок у роботі'
items:
- id: q1
  outcomes:
  - beratung-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Berater
      text: Was ist Ihr wichtigstes berufliches Ziel für das nächste Jahr?
    - speaker: Frau Ilić
      text: Ich möchte im Büro mehr Verantwortung übernehmen. Dafür brauche ich besseres
        Deutsch und mehr Erfahrung mit Kunden.
    - speaker: Berater
      text: Dann empfehle ich Ihnen einen berufsbegleitenden B2-Kurs. Der Kurs findet
        zweimal pro Woche am Abend statt.
    - speaker: Frau Ilić
      text: Das passt, falls ich an den anderen Tagen weiterarbeiten kann. Gibt es
        auch praktische Übungen?
    - speaker: Berater
      text: Ja. Sie üben Gespräche und schreiben echte E-Mails, damit Sie das Gelernte
        direkt anwenden können.
    - speaker: Frau Ilić
      text: Was wäre mein nächster Schritt?
    - speaker: Berater
      text: Melden Sie sich zuerst zur Beratung beim Kursanbieter an. Danach können
        Sie mit Ihrer Chefin über einen freien Kursabend sprechen.
  recording: ls-lernen-zukunft-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was ist Frau Ilićs erster nächster Schritt?
  options:
  - Sich beim Kursanbieter zur Beratung anmelden.
  - Mit der Chefin über den Kursabend sprechen.
  - Sich direkt für den B2-Kurs anmelden.
  correct: 0
  explain:
    en: 'Two steps are given in one turn, in order: zuerst the appointment with the
      provider, danach the conversation with the boss. Signing up for the course itself
      is the goal, not the step — advice sessions almost always end with this kind
      of ordered pair.'
    ru: 'В одной реплике названы два шага по порядку: zuerst — запись на консультацию
      у организатора курсов, danach — разговор с начальницей. Запись на сам курс —
      это цель, а не шаг; консультации почти всегда заканчиваются такой упорядоченной
      парой.'
    uk: 'В одній репліці названо два кроки по порядку: zuerst — запис на консультацію в організатора курсів, danach — розмова з начальницею. Запис на сам курс — це мета, а не крок; консультації майже завжди закінчуються такою впорядкованою парою.'
  max_replays: 3
- id: q2
  outcomes:
  - beratung-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Berater
      text: Was ist Ihr wichtigstes berufliches Ziel für das nächste Jahr?
    - speaker: Frau Ilić
      text: Ich möchte im Büro mehr Verantwortung übernehmen. Dafür brauche ich besseres
        Deutsch und mehr Erfahrung mit Kunden.
    - speaker: Berater
      text: Dann empfehle ich Ihnen einen berufsbegleitenden B2-Kurs. Der Kurs findet
        zweimal pro Woche am Abend statt.
    - speaker: Frau Ilić
      text: Das passt, falls ich an den anderen Tagen weiterarbeiten kann. Gibt es
        auch praktische Übungen?
    - speaker: Berater
      text: Ja. Sie üben Gespräche und schreiben echte E-Mails, damit Sie das Gelernte
        direkt anwenden können.
    - speaker: Frau Ilić
      text: Was wäre mein nächster Schritt?
    - speaker: Berater
      text: Melden Sie sich zuerst zur Beratung beim Kursanbieter an. Danach können
        Sie mit Ihrer Chefin über einen freien Kursabend sprechen.
  recording: ls-lernen-zukunft-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wann findet der Kurs statt?
  options:
  - Zweimal pro Woche am Abend.
  - Jeden Abend in der Woche.
  - Zweimal pro Monat am Wochenende.
  correct: 0
  explain:
    en: Frequency and time of day arrive together in one clause, and the whole point
      of berufsbegleitend is that it fits around a working day — which is also why
      Frau Ilić immediately checks that she can keep working on the other days.
    ru: Частота и время суток названы вместе в одном предложении, а весь смысл слова
      berufsbegleitend в том, что курс совмещается с работой, — потому госпожа Илич
      сразу и уточняет, сможет ли она работать в остальные дни.
    uk: 'Частоту і час доби названо разом в одному реченні, а весь сенс слова berufsbegleitend у тому, що курс поєднується з роботою, — тому пані Ілич одразу й уточнює, чи зможе працювати в решту днів.'
  max_replays: 3
