    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was schlägt Frau Adamu am Ende vor?
  options:
  - Er soll vorher klingeln, wenn er länger probt.
  - Er soll leiser spielen.
  - Er soll nur noch sonntags proben.
  correct: 0
  explain:
    en: The offer comes after the agreement is already settled and goes beyond it
      — it is a concession, not a condition. Whoever stops listening once the times
      are fixed misses it.
    ru: 'Предложение звучит уже после того, как договорённость достигнута, и выходит
      за её рамки: это уступка, а не условие. Кто перестал слушать, когда время согласовали,
      его пропустит.'
    uk: 'Пропозиція звучить уже після того, як домовленість досягнуто, і виходить за її межі: це поступка, а не умова. Хто перестав слухати, коли час погодили, її пропустить.'
  max_replays: 3
