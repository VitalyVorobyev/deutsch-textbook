topic: regeln-verantwortung
role: practice
title:
  en: Negotiating the rehearsal times
  ru: Договариваются о времени репетиций
  uk: 'Домовляються про час репетицій'
items:
- id: q1
  outcomes:
  - loesung-aushandeln
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Frau Vogt
      text: 'Ich habe Sie beide gebeten zu kommen, weil sich mehrere Nachbarn über
        die Musik am Wochenende beschwert haben. In der Hausordnung steht: nach zweiundzwanzig
        Uhr Zimmerlautstärke.'
    - speaker: Herr Simon
      text: Mir ist klar, dass es zu laut war. Aber ich probe nur samstags, weil ich
        unter der Woche bis acht arbeite.
    - speaker: Frau Adamu
      text: Das Problem ist nicht der Samstag, sondern die Uhrzeit. Bei uns schlafen
        zwei kleine Kinder ab halb neun.
    - speaker: Herr Simon
      text: Wenn ich früher anfange, komme ich kaum auf zwei Stunden.
    - speaker: Frau Vogt
      text: Zwei Stunden müssen es ja nicht am Stück sein. Wäre samstags von fünfzehn
        bis siebzehn Uhr denkbar?
    - speaker: Herr Simon
      text: Das ginge, wenn ich dafür sonntags noch eine Stunde dazubekomme.
    - speaker: Frau Adamu
      text: Sonntagvormittag wäre für uns in Ordnung, da sind wir sowieso draußen.
    - speaker: Herr Simon
      text: Dann sagen wir sonntags von elf bis zwölf.
    - speaker: Frau Vogt
      text: Gut. Ich halte das schriftlich fest und hänge es aus, damit alle es wissen.
        Wenn es wieder Beschwerden gibt, reden wir noch einmal.
    - speaker: Frau Adamu
      text: Und wenn Sie einmal länger proben müssen, klingeln Sie einfach vorher
        bei uns.
    - speaker: Herr Simon
      text: Das mache ich. Danke, dass Sie so entgegenkommend sind.
  recording: ls-regeln-verantwortung-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wann darf Herr Simon jetzt samstags proben?
  options:
  - Von fünfzehn bis siebzehn Uhr.
  - Von elf bis zwölf Uhr.
  - Bis zweiundzwanzig Uhr.
  correct: 0
  explain:
    en: Four times circulate here and only one belongs to Saturday. Eleven to twelve
      is the Sunday hour agreed two lines later, and twenty-two is the rule that was
      broken.
    ru: Здесь ходят четыре времени, и к субботе относится только одно. С одиннадцати
      до двенадцати — воскресный час, согласованный двумя репликами позже, а двадцать
      два — нарушенное правило.
    uk: 'Тут ходять чотири часові позначки, і до суботи належить лише одна. З одинадцятої до дванадцятої — це недільна година, погоджена двома репліками пізніше, а двадцять друга — порушене правило.'
  max_replays: 3
