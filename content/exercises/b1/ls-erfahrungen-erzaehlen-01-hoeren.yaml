  recording: ls-erfahrungen-erzaehlen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was hat Dilan aus dieser Zeit gelernt?
  options:
  - Dass sie früher um Hilfe bitten sollte.
  - Dass man am besten allein zurechtkommt.
  - Dass ein Sprachkurs nicht nötig ist.
  correct: 0
  explain:
    en: 'The conclusion is the last sentence: help is what turned things round — the
      neighbour checked her papers — so the lesson is to ask sooner. "Dass man am besten
      allein zurechtkommt" contradicts the story she has just told.'
    ru: 'Вывод — последняя фраза: перелом наступил благодаря помощи — соседка проверила
      её документы, — поэтому урок в том, чтобы просить о помощи раньше. «Dass man am besten
      allein zurechtkommt» противоречит только что рассказанной истории.'
    uk: 'Висновок — останнє речення: усе змінила допомога — сусідка перевірила її документи, — тож урок у тому, щоб просити про допомогу раніше. «Dass man am besten allein zurechtkommt» суперечить щойно розказаній історії.'
  max_replays: 3
