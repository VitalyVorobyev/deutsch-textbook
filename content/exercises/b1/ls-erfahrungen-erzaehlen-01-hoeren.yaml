  recording: ls-erfahrungen-erzaehlen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was hat Dilan aus dieser Zeit gelernt?
  options:
  - Dass sie früher um Hilfe bitten sollte.
  - Dass man am besten allein zurechtkommt.
  - Dass ein Sprachkurs nicht nötig ist.
  correct: 0
  explain:
    en: 'The conclusion is the last sentence, and it inverts the story: someone who
      managed alone says she should have asked sooner. "Dass man am besten allein zurechtkommt" is the moral
      the narrative seems to point at — and the speaker rejects it.'
    ru: 'Вывод — последняя фраза, и она переворачивает рассказ: та, кто справилась
      сама, говорит, что просить помощи надо было раньше. «Dass man am besten allein zurechtkommt» — та мораль,
      к которой рассказ будто ведёт, и говорящая её отвергает.'
    uk: 'Висновок — останнє речення, і воно перевертає розповідь: та, хто впоралася сама, каже, що просити допомоги слід було раніше. «Dass man am besten allein zurechtkommt» — та мораль, до якої розповідь ніби веде, і вона її відкидає.'
  max_replays: 3
