topic: erfahrungen-erzaehlen
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Erfahrungen erzählen"
title:
  en: An interview about a difficult time
  ru: Интервью о трудном периоде
  uk: 'Розмова про важкий період'
items:
- id: q1
  outcomes:
  - interview-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Interviewer
      text: Welche Erfahrung war für Sie besonders schwierig?
    - speaker: Dilan
      text: Vor zwei Jahren bin ich allein nach Deutschland gezogen. Zuerst kannte
        ich niemanden und verstand im Alltag nur wenig. Besonders schwierig war die
        Wohnungssuche.
    - speaker: Interviewer
      text: Was hat Ihnen damals geholfen?
    - speaker: Dilan
      text: Ich besuchte einen Sprachkurs und lernte dort eine Nachbarin kennen. Nachdem
        sie meine Unterlagen geprüft hatte, half sie mir bei mehreren Bewerbungen.
    - speaker: Interviewer
      text: Wann änderte sich die Situation?
    - speaker: Dilan
      text: Der Wendepunkt kam nach drei Monaten. Ich bekam eine kleine Wohnung und
        fand gleichzeitig eine Teilzeitstelle.
    - speaker: Interviewer
      text: Wie denken Sie heute über diese Zeit?
    - speaker: Dilan
      text: Die ersten Wochen waren anstrengend, aber ich habe es geschafft. Die Erfahrung
        zeigte mir, dass ich früher um Hilfe bitten sollte.
  recording: ls-erfahrungen-erzaehlen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was war für Dilan am schwierigsten?
  options:
  - Die Wohnungssuche.
  - Der Sprachkurs.
  - Die Arbeit im Büro.
  correct: 0
  explain:
    en: Besonders schwierig war … singles one thing out of several hardships. The
      language course is named as what helped, not as what was hard — in an interview
      the two are easy to swap.
    ru: Besonders schwierig war … выделяет одно из нескольких затруднений. Языковые
      курсы названы как то, что помогло, а не как трудность, — в интервью эти роли
      легко перепутать.
    uk: 'Besonders schwierig war … вирізняє одне з кількох ускладнень. Мовний курс названо як те, що допомогло, а не як труднощі, — у розмові ці ролі легко переплутати.'
  max_replays: 3
- id: q2
  outcomes:
  - interview-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Interviewer
      text: Welche Erfahrung war für Sie besonders schwierig?
    - speaker: Dilan
      text: Vor zwei Jahren bin ich allein nach Deutschland gezogen. Zuerst kannte
        ich niemanden und verstand im Alltag nur wenig. Besonders schwierig war die
        Wohnungssuche.
    - speaker: Interviewer
      text: Was hat Ihnen damals geholfen?
    - speaker: Dilan
      text: Ich besuchte einen Sprachkurs und lernte dort eine Nachbarin kennen. Nachdem
        sie meine Unterlagen geprüft hatte, half sie mir bei mehreren Bewerbungen.
    - speaker: Interviewer
      text: Wann änderte sich die Situation?
    - speaker: Dilan
      text: Der Wendepunkt kam nach drei Monaten. Ich bekam eine kleine Wohnung und
        fand gleichzeitig eine Teilzeitstelle.
    - speaker: Interviewer
      text: Wie denken Sie heute über diese Zeit?
    - speaker: Dilan
      text: Die ersten Wochen waren anstrengend, aber ich habe es geschafft. Die Erfahrung
