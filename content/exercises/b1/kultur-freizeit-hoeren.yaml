  question: 'Wie viel zahlt Herr Okafor für seine Karten?'
  options:
  - 'Sechzehn Euro.'
  - 'Vierundzwanzig Euro.'
  - 'Nichts.'
  correct: 0
  explain:
    en: 'He takes zwei Karten mit Ermäßigung, and with the discount a ticket costs eight euros: two times eight. What is free is the author''s evening on Saturday.'
    ru: 'Он берёт zwei Karten mit Ermäßigung, а со скидкой билет стоит восемь евро: дважды восемь. Бесплатный — вечер с писательницей в субботу.'
    uk: 'Він бере zwei Karten mit Ermäßigung, а зі знижкою квиток коштує вісім євро: двічі вісім. Безкоштовний — вечір із письменницею в суботу.'
    de: 'Er nimmt „zwei Karten mit Ermäßigung“, und mit Ermäßigung kostet eine Karte acht Euro: zweimal acht. Kostenlos ist der Abend mit der Autorin am Samstag.'
  max_replays: 3
