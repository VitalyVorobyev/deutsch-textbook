topic: kultur-freizeit
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Kultur & Freizeit"
title:
  en: 'Calling the cultural centre about the weekend'
  ru: 'Звонок в культурный центр о программе выходных'
  uk: 'Дзвінок до культурного центру щодо програми на вихідні'
  de: 'Ein Anruf im Kulturzentrum wegen des Wochenendes'
items:
- id: q1
  outcomes:
  - programm-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Frau Simon
      text: 'Kulturzentrum am Markt, Simon, guten Tag.'
    - speaker: Herr Okafor
      text: 'Guten Tag. Ich interessiere mich für Ihr Programm am Wochenende. Was gibt es am Freitag?'
    - speaker: Frau Simon
      text: 'Am Freitag spielt eine Band im großen Saal. Das Konzert beginnt um acht, aber der Saal ist schon ab sieben offen. Karten kosten zwölf Euro, mit Ermäßigung acht.'
    - speaker: Herr Okafor
      text: 'Gibt es die Ermäßigung auch für Studierende?'
    - speaker: Frau Simon
      text: 'Ja, mit Studentenausweis. Am Samstag liest außerdem eine Autorin aus ihrem neuen Buch. Das ist kostenlos, aber Sie müssen sich vorher anmelden, weil der Raum klein ist.'
    - speaker: Herr Okafor
      text: 'Und bis wann kann ich mich anmelden?'
    - speaker: Frau Simon
      text: 'Bis Freitagmittag, telefonisch oder auf unserer Internetseite.'
    - speaker: Herr Okafor
      text: 'Dann nehme ich zwei Karten mit Ermäßigung für Freitag und melde mich gleich für Samstag an.'
  recording: ls-kultur-freizeit-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Ab wann kann man am Freitag in den Saal?'
  options:
  - 'Ab sieben Uhr.'
  - 'Ab acht Uhr.'
  - 'Ab zwölf Uhr.'
  correct: 0
  explain:
    en: 'There are two different times: the concert starts at eight, aber der Saal ist schon ab sieben offen. Zwölf is the full price in euros.'
    ru: 'Здесь два разных времени: концерт начинается в восемь, aber der Saal ist schon ab sieben offen — зал открыт уже с семи. Zwölf — это полная цена в евро.'
    uk: 'Тут два різні часи: концерт починається о восьмій, aber der Saal ist schon ab sieben offen — зал відкритий уже з сьомої. Zwölf — це повна ціна в євро.'
    de: 'Hier gibt es zwei verschiedene Zeiten: Das Konzert beginnt um acht, aber der Saal ist schon ab sieben offen. Zwölf ist der volle Preis in Euro.'
  max_replays: 3
