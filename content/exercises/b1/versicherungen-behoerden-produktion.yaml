topic: versicherungen-behoerden
role: practice
stage: transfer
activity: application
title_de: "Anwenden — antworten und nachfragen"
title:
  en: "Apply — answer the letter and ask at the counter"
  ru: "Применение — ответить на письмо и спросить у окошка"
  uk: "Застосування — відповісти на лист і спитати біля віконця"
  de: "Anwenden — auf den Brief antworten und am Schalter nachfragen"

# Independent transfer: a letter that has to be answered inside its deadline, and a counter
# conversation where the learner does not know the answer and has to say so. Fresh contexts,
# no scaffolding, nothing that re-skins a Grundübung item.
#
# Both thin tags get their second production context here — `praeposition-genitiv` in
# uebersetzen-frist and `adjektiv-nullartikel` in uebersetzen-angaben — which is what lifts each
# off the single-file tail. uebersetzen-angaben puts genau in front of the bare plural, because
# the tag grades an adjective's strong ending and a bare noun has none.
#
# The speak task is where `wissen-nichtwissen` is actually taught rather than merely claimed:
# the model's second line is the admission, and the checklist makes it the thing to check.
items:
  - id: uebersetzen-frist
    # revision 2: the noun was unpinned, so wegen des Umzug — the masculine -s the tag names —
    # was forgiven as a spelling slip and scored correct; Umzugs and Umzuges are now pinned and
    # both accepted. The pins graded position, so the wegen-phrase after the object and
    # meines Umzugs (the possessive «с переездом» leaves free) were charged with the genitive
    # intact; both are accepted, and focus_evidence reads the genitive group instead.
    # «прошу продлить срок» opened the frame (eine Verlängerung der Frist, die Frist zu
    # verlängern), so the instruction names um eine längere Frist bitten.
    revision: 2
    outcomes: [frist-nennen]
    type: translate
    focus: praeposition-genitiv
    key_tokens: ["wegen", "des", "meines", "Umzugs", "Umzuges"]
    instruction:
      en: "Write it in the register of a letter, not of a conversation, and use um eine längere Frist bitten."
      ru: "Напишите в регистре письма, а не разговора, и используйте um eine längere Frist bitten."
      uk: "Напишіть у регістрі листа, а не розмови, і використайте um eine längere Frist bitten."
      de: "Schreib es in der Sprache eines Briefes, nicht eines Gesprächs, und benutze um eine längere Frist bitten."
    prompt_en: "Because of the move I am asking for a longer deadline."
    prompt_ru: "В связи с переездом я прошу продлить срок."
    prompt_uk: "У зв'язку з переїздом я прошу продовжити строк."
    answer: "Wegen des Umzugs bitte ich um eine längere Frist."
    accept:
      - "Ich bitte wegen des Umzugs um eine längere Frist."
      - "Ich bitte um eine längere Frist wegen des Umzugs."
      - "Wegen des Umzuges bitte ich um eine längere Frist."
      - "Ich bitte wegen des Umzuges um eine längere Frist."
      - "Ich bitte um eine längere Frist wegen des Umzuges."
      - "Wegen meines Umzugs bitte ich um eine längere Frist."
      - "Ich bitte wegen meines Umzugs um eine längere Frist."
      - "Ich bitte um eine längere Frist wegen meines Umzugs."
      - "Wegen meines Umzuges bitte ich um eine längere Frist."
      - "Ich bitte wegen meines Umzuges um eine längere Frist."
      - "Ich bitte um eine längere Frist wegen meines Umzuges."
    focus_evidence:
      failed: ["(?<!\\p{L})Umzug(?!\\p{L})", "(?<!\\p{L})(?:dem|den|der|die|das|meinem|meinen|meiner|meine|mein)\\s+Umzug(?:e?s)?(?!\\p{L})", "(?<!\\p{L})wegen\\s+(?:von|vom)(?!\\p{L})"]
      retained: ["(?<!\\p{L})wegen\\s+(?:des|meines)\\s+Umzuge?s(?!\\p{L})"]
    explain:
      en: "*Wegen* plus the genitive is what makes this a letter rather than a remark: *wegen dem Umzug* is what you would say out loud and is not wrong German, but it is the wrong register here. *Umzug* is masculine, so the case shows twice — *des* and the *-s*. Note the frame the rest of the sentence uses: *bitten um* plus accusative is the fixed way German asks for something in writing."
      ru: "*Wegen* с генитивом и делает это письмом, а не репликой: *wegen dem Umzug* — то, что вы сказали бы вслух, и это не ошибочный немецкий, но здесь неверный регистр. *Umzug* мужского рода, поэтому падеж виден дважды — *des* и *-s*. Обратите внимание и на рамку остальной фразы: *bitten um* с аккузативом — устойчивый способ, которым немецкий просит о чём-то письменно."
      uk: "*Wegen* з родовим і робить це листом, а не реплікою: *wegen dem Umzug* — те, що ви сказали б уголос, і це не хибна німецька, але тут неправильний регістр. *Umzug* чоловічого роду, тому відмінок видно двічі — *des* і *-s*. Зверніть увагу й на рамку решти фрази: *bitten um* зі знахідним — сталий спосіб, яким німецька просить про щось письмово."
      de: "*Wegen* mit Genitiv macht diesen Satz zu einem Brief und nicht zu einer Bemerkung: *wegen dem Umzug* sagt man im Gespräch, und es ist kein falsches Deutsch, aber hier passt es nicht zum Stil. *Umzug* ist maskulin, also sieht man den Kasus zweimal — *des* und das *-s*. Beachte auch den Rahmen im Rest des Satzes: *bitten um* mit Akkusativ ist die feste Form, mit der man im Deutschen schriftlich um etwas bittet."

  - id: uebersetzen-angaben
    # revision 2: the item had no adjective, so `adjektiv-nullartikel` could not see its own
    # error and was charged instead for an added die — which «данные» leaves open — or for any
    # rendering without the pinned Angaben (Daten, the course's card for «данные»; fragt nach).
    # It now asks for genau in front of the bare plural and names the verb, the adjective and
    # the noun; zu meinem Einkommen is accepted.
    revision: 2
    outcomes: [personalien-angeben]
    type: translate
    focus: adjektiv-nullartikel
    key_tokens: ["genaue"]
    instruction:
      en: "Use verlangen, genau and Angaben."
      ru: "Используйте verlangen, genau и Angaben."
      uk: "Використайте verlangen, genau і Angaben."
      de: "Benutze verlangen, genau und Angaben."
    prompt_en: "The form is asking for exact details about my income."
    prompt_ru: "Бланк запрашивает точные данные о моём доходе."
    prompt_uk: "Бланк запитує точні дані про мій дохід."
    answer: "Das Formular verlangt genaue Angaben über mein Einkommen."
    accept:
      - "Das Formular verlangt genaue Angaben zu meinem Einkommen."
    # Failed: genau with no article in front and any ending but the strong -e. An article
    # with the weak ending (die genauen Angaben) is not this tag's error.
    focus_evidence:
      failed: ["(?<!\\p{L})(?<!(?:die|den|der|diese|keine|meine|ihre|seine|alle)\\s)genau(?:en|er|es|em)?\\s+Angaben(?!\\p{L})"]
      retained: ["(?<!\\p{L})(?<!(?:die|den|der|diese|keine|meine|ihre|seine|alle)\\s)genaue\\s+Angaben(?!\\p{L})"]
    explain:
      en: "*Angaben* stands without an article — details in general, whichever the form asks for — so *genau* wears the ending the missing *die* would have shown: *genaue*. *genauen* is the ending that belongs after an article (*die genauen Angaben*). Compare the subject: *das Formular* keeps its article because it is one particular sheet in front of you."
      ru: "*Angaben* стоит без артикля — какие-то данные, те, что требует бланк, — поэтому *genau* надевает окончание, которое показал бы отсутствующий *die*: *genaue*. *genauen* — окончание после артикля (*die genauen Angaben*). Сравните с подлежащим: *das Formular* артикль сохраняет, потому что это один конкретный лист перед вами. В русском «точные данные» не меняются от того, определённые они или нет, — немецкому же окончание прилагательного приходится выбирать по тому, стоит ли перед ним артикль."
      uk: "*Angaben* стоїть без артикля — якісь дані, ті, що їх вимагає бланк, — тому *genau* надягає закінчення, яке показав би відсутній *die*: *genaue*. *genauen* — закінчення після артикля (*die genauen Angaben*). Порівняйте з підметом: *das Formular* артикль зберігає, бо це один конкретний аркуш перед вами. В українській «точні дані» не змінюються від того, означені вони чи ні, — а німецькій закінчення прикметника доводиться обирати за тим, чи стоїть перед ним артикль."
      de: "*Angaben* steht ohne Artikel — Angaben allgemein, welche auch immer das Formular verlangt —, also trägt *genau* die Endung, die das fehlende *die* gezeigt hätte: *genaue*. *genauen* ist die Endung nach einem Artikel (*die genauen Angaben*). Vergleiche das Subjekt: *das Formular* behält seinen Artikel, weil es ein bestimmtes Blatt vor dir ist."

  - id: diktat-frist
    outcomes: [behoerdenbrief-verstehen]
    type: listen
    text: "Bitte antworten Sie innerhalb der Frist."
    translation:
      en: "Please reply within the deadline."
      ru: "Пожалуйста, ответьте в течение установленного срока."
      uk: "Будь ласка, відповідайте протягом встановленого строку."
    explain:
      en: "A sentence typical of letters from an authority, and the word that decides what it means is *innerhalb*: three syllables, stressed on the first, which run together in quick speech — and hearing plain *in* instead changes a deadline into a place. Writing it once is the way to find out whether you would recognise it on a recorded message."
      ru: "Типичная фраза из писем учреждений, а слово, от которого зависит смысл, — *innerhalb*: три слога с ударением на первом, которые в быстрой речи сливаются, — и услышать вместо него простое *in* значит превратить срок в место. Записать её один раз — способ выяснить, узнали бы вы её в автоответчике."
      uk: "Типова фраза з листів установ, а слово, від якого залежить зміст, — *innerhalb*: три склади з наголосом на першому, які у швидкому мовленні зливаються, — і почути замість нього просте *in* означає перетворити строк на місце. Записати її один раз — спосіб з'ясувати, чи впізнали б ви її в автовідповідачі."
      de: "Ein typischer Satz aus Briefen von Behörden, und das Wort, das die Bedeutung entscheidet, ist *innerhalb*: drei Silben, betont auf der ersten, die in schneller Sprache zusammenlaufen — und wer nur *in* hört, macht aus einer Frist einen Ort. Wer den Satz einmal aufschreibt, merkt, ob er ihn auf einer Ansage erkennen würde."

  - id: sprechen-schalter
    outcomes: [versicherung-klaeren]
    type: speak
    mode: spoken-interaction
    instruction:
      en: "Say it aloud — and if you can, record yourself: the checklist names what to listen for."
      ru: "Скажите вслух — и, если можете, запишите себя: чек-лист подсказывает, на что обращать внимание."
      uk: "Скажіть уголос — і, якщо можете, запишіть себе: чек-лист підказує, на що звертати увагу."
      de: "Sprich laut — und wenn du kannst, nimm dich auf: Die Checkliste sagt, worauf du hören sollst."
    prompt:
      en: "Your bicycle was stolen. You are at your insurer's counter and you genuinely do not know whether theft is covered by your policy. Find out — aloud — and ask for written confirmation."
      ru: "У вас украли велосипед. Вы у окошка страховой и действительно не знаете, покрывает ли ваш полис кражу. Выясните это вслух и попросите письменное подтверждение."
      uk: "У вас украли велосипед. Ви біля віконця страхової і справді не знаєте, чи покриває ваш поліс крадіжку. З'ясуйте це вголос і попросіть письмове підтвердження."
      de: "Dein Fahrrad wurde gestohlen. Du bist am Schalter deiner Versicherung und weißt wirklich nicht, ob dein Vertrag Diebstahl abdeckt. Find es heraus — laut — und bitte um eine schriftliche Bestätigung."
    goal:
      en: "Say what you do not know instead of guessing, and leave with something in writing."
      ru: "Сказать, чего вы не знаете, вместо того чтобы гадать, и уйти с чем-то письменным."
      uk: "Сказати, чого ви не знаєте, замість того щоб гадати, і піти з чимось письмовим."
      de: "Sag, was du nicht weißt, statt zu raten, und geh mit etwas Schriftlichem nach Hause."
    checklist:
      - en: "I said openly that I do not know: Ich weiß nicht, ob … — with ob and the verb at the end."
        ru: "Я прямо сказал(а), что не знаю: Ich weiß nicht, ob … — с ob и глаголом в конце."
        uk: "Я прямо сказав(ла), що не знаю: Ich weiß nicht, ob … — з ob і дієсловом у кінці."
        de: "Ich habe offen gesagt, dass ich es nicht weiß: Ich weiß nicht, ob … — mit ob und dem Verb am Ende."
      - en: "I named the risk with gegen and a bare noun: gegen Diebstahl."
        ru: "Я назвал(а) риск через gegen и существительное без артикля: gegen Diebstahl."
        uk: "Я назвав(ла) ризик через gegen та іменник без артикля: gegen Diebstahl."
        de: "Ich habe das Risiko mit gegen und einem Nomen ohne Artikel genannt: gegen Diebstahl."
      - en: "I asked for a Nachweis in writing rather than accepting a spoken yes."
        ru: "Я попросил(а) письменный Nachweis, а не удовлетворился(лась) устным «да»."
        uk: "Я попросив(ла) письмовий Nachweis, а не задовольнився(лася) усним «так»."
        de: "Ich habe um einen schriftlichen Nachweis gebeten, statt ein mündliches Ja zu akzeptieren."
    # The model's last line asked the insurer for a confirmation to show the police — the
    # wrong way round in Germany, where the police report comes first and the insurer asks for
    # it. It now asks for the answer in writing, keeping damit and its verb at the end.
    model_answer: "Guten Tag. Mein Fahrrad wurde gestohlen. Ich weiß nicht, ob ich gegen Diebstahl versichert bin — können Sie das bitte prüfen? Ich bin seit Januar bei Ihnen versichert. Und könnten Sie mir das bitte schriftlich geben, damit ich einen Nachweis habe?"
    model_translation:
      en: "Hello. My bicycle has been stolen. I do not know whether I am insured against theft — could you check, please? I have been insured with you since January. And could you give me that in writing, please, so that I have proof?"
      ru: "Здравствуйте. У меня украли велосипед. Я не знаю, застрахован ли я от кражи, — вы не могли бы проверить? Я застрахован у вас с января. И не могли бы вы дать мне это в письменном виде, чтобы у меня было подтверждение?"
      uk: "Добрий день. У мене вкрали велосипед. Я не знаю, чи застрахований я від крадіжки, — чи не могли б ви перевірити? Я застрахований у вас із січня. І чи не могли б ви дати мені це письмово, щоб у мене було підтвердження?"
    explain:
      en: "Play yourself back and check the second sentence first. Saying *Ich weiß nicht, ob …* out loud is the whole skill here, and it is the one that is easiest to route around by asking a question you already half-know the answer to. The clause needs *ob* and the verb at the end: *ob ich gegen Diebstahl versichert bin*. Then check the risk phrase — *gegen Diebstahl*, no article — and the last line, where *damit* introduces the purpose and sends its own verb to the end too."
      ru: "Прослушайте запись и проверьте сначала второе предложение. Произнести вслух *Ich weiß nicht, ob …* — здесь и есть всё умение, и именно его проще всего обойти, задав вопрос, ответ на который уже наполовину знаешь. Придаточному нужны *ob* и глагол в конце: *ob ich gegen Diebstahl versichert bin*. Потом проверьте сочетание с риском — *gegen Diebstahl*, без артикля — и последнюю строку, где *damit* вводит цель и тоже отправляет свой глагол в конец."
      uk: "Прослухайте запис і перевірте спершу друге речення. Вимовити вголос *Ich weiß nicht, ob …* — тут і є все вміння, і саме його найпростіше обійти, поставивши питання, відповідь на яке вже наполовину знаєш. Підрядному потрібні *ob* і дієслово в кінці: *ob ich gegen Diebstahl versichert bin*. Потім перевірте сполучення з ризиком — *gegen Diebstahl*, без артикля — і останній рядок, де *damit* вводить мету і теж відправляє своє дієслово в кінець."
      de: "Hör dich noch einmal an und prüfe zuerst den zweiten Satz. *Ich weiß nicht, ob …* laut zu sagen ist hier die ganze Fertigkeit, und man umgeht sie am leichtesten mit einer Frage, deren Antwort man schon halb kennt. Der Nebensatz braucht *ob* und das Verb am Ende: *ob ich gegen Diebstahl versichert bin*. Prüfe dann den Ausdruck für das Risiko — *gegen Diebstahl*, ohne Artikel — und die letzte Zeile, in der *damit* den Zweck einleitet und sein Verb auch ans Ende schickt."

  - id: schreiben-antwort
    outcomes: [personalien-angeben, frist-nennen]
    type: write
    prompt:
      en: "An authority has written asking for evidence of your income within four weeks. You are moving house next week and will not manage it in time. Write a short reply: say why, ask for a longer deadline, and give your new address."
      ru: "Учреждение прислало письмо с просьбой предоставить подтверждения дохода в течение четырёх недель. На следующей неделе вы переезжаете и не успеете. Напишите короткий ответ: объясните причину, попросите продлить срок и сообщите новый адрес."
      uk: "Установа надіслала лист із проханням надати підтвердження доходу протягом чотирьох тижнів. Наступного тижня ви переїжджаєте і не встигнете. Напишіть коротку відповідь: поясніть причину, попросіть продовжити строк і повідомте нову адресу."
      de: "Eine Behörde hat dir geschrieben und will innerhalb von vier Wochen Nachweise über dein Einkommen. Du ziehst nächste Woche um und schaffst es nicht rechtzeitig. Schreib eine kurze Antwort: Sag, warum, bitte um eine längere Frist und nenne deine neue Adresse."
    goal:
      en: "Ask for more time in a way an official reader will grant without a second letter."
      ru: "Попросить больше времени так, чтобы официальный читатель дал его без второго письма."
      uk: "Попросити більше часу так, щоб офіційний читач дав його без другого листа."
      de: "Bitte so um mehr Zeit, dass ein Sachbearbeiter sie ohne zweiten Brief gibt."
    requirements:
      - en: "Use at least one genitive preposition — wegen, trotz, während or innerhalb — with the article and, if the noun is masculine or neuter, its -s."
        ru: "Используйте хотя бы один генитивный предлог — wegen, trotz, während или innerhalb — с артиклем и, если существительное мужского или среднего рода, с его -s."
        uk: "Використайте хоча б один родовий прийменник — wegen, trotz, während або innerhalb — з артиклем і, якщо іменник чоловічого чи середнього роду, з його -s."
        de: "Benutze mindestens eine Präposition mit Genitiv — wegen, trotz, während oder innerhalb — mit dem Artikel und, wenn das Nomen maskulin oder neutral ist, mit seinem -s."
      - en: "Use a bare plural (Nachweise, Unterlagen, Angaben) for documents in general — die only for ones the letter has already named."
        ru: "Используйте множественное без артикля (Nachweise, Unterlagen, Angaben) для документов вообще, а die — только для тех, что письмо уже назвало."
        uk: "Використайте множину без артикля (Nachweise, Unterlagen, Angaben) для документів загалом, а die — лише для тих, що лист уже назвав."
        de: "Benutze einen Plural ohne Artikel (Nachweise, Unterlagen, Angaben) für Dokumente allgemein — die nur für Dokumente, die der Brief schon genannt hat."
      - en: "Name the new address the way a form does — street and number, postcode and town."
        ru: "Укажите новый адрес так, как это делает бланк: улица и номер, индекс и город."
        uk: "Укажіть нову адресу так, як це робить бланк: вулиця і номер, індекс і місто."
        de: "Nenne die neue Adresse so, wie ein Formular sie verlangt — Straße und Hausnummer, Postleitzahl und Ort."
    min_words: 55
    model_answer: "Sehr geehrte Damen und Herren, ich habe Ihren Brief vom fünften Mai erhalten. Wegen des Umzugs kann ich die Unterlagen nicht innerhalb der Frist von vier Wochen schicken. Ich ziehe nächste Woche um und bitte deshalb um zwei Wochen mehr. Nachweise über mein Einkommen liegen bereit; ich schicke sie sofort nach dem Umzug. Meine neue Adresse ist Hauptstraße 14, 28195 Bremen. Mit freundlichen Grüßen Anna Petrova"
    model_translation:
      en: "Dear Sir or Madam, I have received your letter of the fifth of May. Because of the move I cannot send the documents within the four-week deadline. I am moving next week and therefore ask for two more weeks. Evidence of my income is ready; I will send it immediately after the move. My new address is Hauptstraße 14, 28195 Bremen. Kind regards, Anna Petrova"
      ru: "Уважаемые дамы и господа, я получила ваше письмо от пятого мая. В связи с переездом я не могу отправить документы в течение четырёхнедельного срока. На следующей неделе я переезжаю и поэтому прошу дать ещё две недели. Подтверждения дохода готовы; я отправлю их сразу после переезда. Мой новый адрес: Hauptstraße 14, 28195 Bremen. С уважением, Анна Петрова"
      uk: "Шановні пані та панове, я отримала ваш лист від п'ятого травня. У зв'язку з переїздом я не можу надіслати документи протягом чотиритижневого строку. Наступного тижня я переїжджаю і тому прошу дати ще два тижні. Підтвердження доходу готові; я надішлю їх одразу після переїзду. Моя нова адреса: Hauptstraße 14, 28195 Bremen. З повагою, Анна Петрова"
    explain:
      en: "Read your draft against the model on three points. First, find your genitive preposition and check the noun after it: *wegen des Umzugs* and *innerhalb der Frist* — masculine takes the *-s*, feminine takes nothing. Second, look at how you named the documents: the model has *die Unterlagen* once, with an article, because those are the specific ones the letter asked for, and *Nachweise* once without, because that sentence speaks of proof of income in general rather than of particular papers. The rule is about what the reader already knows, not about the plural. Third, no comma after *Mit freundlichen Grüßen* — the name simply follows."
      ru: "Сверьте черновик с образцом по трём точкам. Сначала найдите свой генитивный предлог и проверьте существительное после него: *wegen des Umzugs* и *innerhalb der Frist* — мужской род берёт *-s*, женский не берёт ничего. Затем посмотрите, как вы назвали документы: в образце один раз *die Unterlagen*, с артиклем, потому что это именно те, о которых просило письмо, и один раз *Nachweise* без артикля, потому что то предложение говорит о подтверждениях дохода вообще, а не о конкретных бумагах. Правило про то, что читатель уже знает, а не про множественное число. И третье: после *Mit freundlichen Grüßen* запятая не ставится — имя просто идёт следом."
      uk: "Звірте чернетку зі зразком за трьома точками. Спершу знайдіть свій родовий прийменник і перевірте іменник після нього: *wegen des Umzugs* та *innerhalb der Frist* — чоловічий рід бере *-s*, жіночий не бере нічого. Потім подивіться, як ви назвали документи: у зразку один раз *die Unterlagen*, з артиклем, бо це саме ті, про які просив лист, і один раз *Nachweise* без артикля, бо те речення говорить про підтвердження доходу загалом, а не про конкретні папери. Правило про те, що читач уже знає, а не про множину. І третє: після *Mit freundlichen Grüßen* кома не ставиться — ім'я просто йде слідом."
      de: "Vergleiche deinen Text in drei Punkten mit dem Muster. Such zuerst deine Präposition mit Genitiv und prüfe das Nomen danach: *wegen des Umzugs* und *innerhalb der Frist* — maskulin bekommt das *-s*, feminin bekommt nichts. Sieh dir dann an, wie du die Dokumente genannt hast: Das Muster hat einmal *die Unterlagen*, mit Artikel, weil das genau die sind, die der Brief verlangt hat, und einmal *Nachweise* ohne Artikel, weil dieser Satz von Nachweisen über das Einkommen allgemein spricht, nicht von bestimmten Papieren. Die Regel hängt davon ab, was der Leser schon kennt, nicht vom Plural. Und drittens: kein Komma nach *Mit freundlichen Grüßen* — der Name folgt einfach."

  - id: sprechen-frist
    outcomes: [frist-nennen]
    type: speak
    mode: spoken-production
    focus: praeposition-genitiv
    instruction:
      en: "Say it aloud in one go — a short voice message, nobody answering."
      ru: "Скажите вслух одним куском — короткое голосовое сообщение, никто не отвечает."
      uk: "Скажіть уголос одним шматком — коротке голосове повідомлення, ніхто не відповідає."
      de: "Sprich es laut in einem Zug — eine kurze Sprachnachricht, niemand antwortet."
    prompt:
      en: "Leave a voice message for a colleague explaining why your application is late: the move, the deadline you were given, the extra two weeks you asked for, and when you will send the documents."
      ru: "Оставьте коллеге голосовое сообщение с объяснением, почему ваше заявление задерживается: переезд, назначенный срок, дополнительные две недели, о которых вы попросили, и когда вы отправите документы."
      uk: "Залиште колезі голосове повідомлення з поясненням, чому ваша заява затримується: переїзд, призначений строк, додаткові два тижні, про які ви попросили, і коли ви надішлете документи."
      de: "Sprich einer Kollegin oder einem Kollegen eine Nachricht aufs Handy und erkläre, warum dein Antrag zu spät kommt: der Umzug, die Frist, die du bekommen hast, die zwei Wochen mehr, um die du gebeten hast, und wann du die Unterlagen schickst."
    goal:
      en: "Give a reason and a date that somebody can act on without asking you back."
      ru: "Назвать причину и дату так, чтобы человеку не пришлось переспрашивать."
      uk: "Назвати причину і дату так, щоб людині не довелося перепитувати."
      de: "Nenne einen Grund und ein Datum, mit denen jemand handeln kann, ohne zurückzufragen."
    checklist:
      - en: "I used at least one genitive preposition — wegen, trotz, während, innerhalb — with its article."
        ru: "Я использовал(а) хотя бы один генитивный предлог — wegen, trotz, während, innerhalb — с артиклем."
        uk: "Я використав(ла) хоча б один родовий прийменник — wegen, trotz, während, innerhalb — з артиклем."
        de: "Ich habe mindestens eine Präposition mit Genitiv benutzt — wegen, trotz, während, innerhalb — mit ihrem Artikel."
      - en: "If the noun after it was masculine or neuter, I said the -s: des Umzugs, des Termins."
        ru: "Если существительное после него было мужского или среднего рода, я произнёс(ла) -s: des Umzugs, des Termins."
        uk: "Якщо іменник після нього був чоловічого чи середнього роду, я вимовив(ла) -s: des Umzugs, des Termins."
        de: "Wenn das Nomen danach maskulin oder neutral war, habe ich das -s gesagt: des Umzugs, des Termins."
      - en: "I named the documents with a bare plural, not with die."
        ru: "Я назвал(а) документы обобщающим множественным без артикля, а не с die."
        uk: "Я назвав(ла) документи узагальнювальною множиною без артикля, а не з die."
        de: "Ich habe die Dokumente mit einem Plural ohne Artikel genannt, nicht mit die."
    model_answer: "Hallo, kurz zu meinem Antrag: Wegen des Umzugs schaffe ich die Frist nicht. Das Amt hat mir vier Wochen gegeben, aber ich ziehe nächste Woche um. Ich habe deshalb um zwei Wochen mehr gebeten. Nachweise über mein Einkommen habe ich schon; ich schicke sie zwei Tage nach dem Umzug."
    model_translation:
      en: "Hello, briefly about my application: because of the move I will not manage the deadline. The office gave me four weeks, but I am moving next week. So I have asked for two more weeks. I already have evidence of my income; I will send it two days after the move."
      ru: "Привет, коротко о моём заявлении: из-за переезда я не укладываюсь в срок. Учреждение дало мне четыре недели, но на следующей неделе я переезжаю. Поэтому я попросил ещё две недели. Подтверждения дохода у меня уже есть; отправлю их через два дня после переезда."
      uk: "Привіт, коротко про мою заяву: через переїзд я не встигаю у строк. Установа дала мені чотири тижні, але наступного тижня я переїжджаю. Тому я попросив ще два тижні. Підтвердження доходу в мене вже є; надішлю їх за два дні після переїзду."
    explain:
      en: "Spoken German would normally say *wegen dem Umzug* here, and this task deliberately asks for the written form out loud — because the point is to have produced the genitive at least once without a keyboard to think at. Play yourself back and listen for the *-s* on *Umzugs*; it is one consonant and it disappears first. Then check *Nachweise*: if you said *die Nachweise*, you claimed your colleague already knows which ones."
      ru: "В разговорной речи здесь сказали бы *wegen dem Umzug*, и задание намеренно просит произнести письменную форму вслух: смысл в том, чтобы хоть раз построить генитив без клавиатуры, над которой можно подумать. Прослушайте запись и вслушайтесь в *-s* у *Umzugs*: это один согласный, и исчезает он первым. Потом проверьте *Nachweise*: если вы сказали *die Nachweise*, значит вы утверждали, что коллега уже знает, о каких идёт речь."
      uk: "У розмовному мовленні тут сказали б *wegen dem Umzug*, і завдання навмисно просить вимовити писемну форму вголос: сенс у тому, щоб хоч раз побудувати родовий без клавіатури, над якою можна подумати. Прослухайте запис і вслухайтеся в *-s* у *Umzugs*: це один приголосний, і зникає він першим. Потім перевірте *Nachweise*: якщо ви сказали *die Nachweise*, значить ви стверджували, що колега вже знає, про які йдеться."
      de: "Im gesprochenen Deutsch würde man hier normalerweise *wegen dem Umzug* sagen, und diese Aufgabe verlangt mit Absicht die Schriftform, laut gesprochen — denn es geht darum, den Genitiv einmal ohne Tastatur zum Nachdenken zu bilden. Hör dich noch einmal an und achte auf das *-s* an *Umzugs*; es ist ein einziger Konsonant und verschwindet als Erstes. Prüfe dann *Nachweise*: Wenn du *die Nachweise* gesagt hast, hast du behauptet, dass dein Kollege schon weiß, welche."
