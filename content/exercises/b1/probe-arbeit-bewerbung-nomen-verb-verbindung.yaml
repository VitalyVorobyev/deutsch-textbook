# Delayed probe family 3 of 3 — ONE competence: recalling the verb a fixed noun–verb pair
# demands, rather than composing the phrase from parts. Three parallel cloze variants over
# three pairs no practice item uses (ein Gespräch führen, Verantwortung übernehmen, sich
# Mühe geben — practice drills Frage stellen, Antwort geben, Eindruck machen, Rolle
# spielen), all four of them in the chapter's table. Each instruction names the noun and
# withholds the verb, because the verb is the competence; variant-b accepts trägt beside
# übernimmt, since both are real pairs of Verantwortung and either one demonstrates the
# skill. Every instruction also names the verb it excludes: ein Gespräch haben and er hat
# Verantwortung are both good German, and sich die Mühe machen is good German with an
# infinitive clause, so without the exclusion a learner could answer correctly around the
# pair and have the probe log a false retention failure against nomen-verb-verbindung.
topic: arbeit-bewerbung
role: probe
title:
  en: "Delayed check — the verb the noun demands"
  ru: "Отложенная проверка — глагол, которого требует существительное"
  uk: "Відкладена перевірка — дієслово, якого вимагає іменник"
  de: "Kontrolle mit Abstand — das Verb, das das Nomen verlangt"
items:
  - id: variant-a
    outcomes: [interview-fragen-beantworten]
    type: cloze
    focus: nomen-verb-verbindung
    instruction:
      en: "Fill in the fixed verb that belongs to Gespräch — present tense, and not the all-purpose haben."
      ru: "Впишите устойчивый глагол, принадлежащий существительному Gespräch, — в презенсе; универсальное haben не подходит."
      uk: "Впишіть стійке дієслово, що належить іменнику Gespräch, — у презенсі; універсальне haben не підходить."
      de: "Ergänze das feste Verb, das zu Gespräch gehört — im Präsens, und nicht das Allzweckverb haben."
    text: "Der Chef {{führt}} am Nachmittag ein langes Gespräch mit ihr."
    translation:
      en: "In the afternoon the boss has a long conversation with her."
      ru: "Во второй половине дня начальник ведёт с ней долгий разговор."
      uk: "У другій половині дня начальник веде з нею довгу розмову."
    explain:
      en: "The fixed pair is ein Gespräch führen. Ein Gespräch haben is real everyday German — which is exactly why the instruction rules it out: haben would answer around the pair instead of producing it. The verb is a fact about the noun and is learned with it, the way a gender is: no rule generates it, and no other language hands it over. The same führen runs a company: eine Firma führen."
      ru: "Устойчивая пара — ein Gespräch führen. Ein Gespräch haben в разговорном немецком тоже встречается — именно поэтому задание его исключает: haben позволило бы ответить в обход пары, а не воспроизвести её. Глагол — факт о существительном и учится вместе с ним, как род: никакое правило его не порождает, и ни один другой язык его не подсказывает. То же führen руководит фирмой: eine Firma führen."
      uk: "Стійка пара — ein Gespräch führen. Ein Gespräch haben у розмовній німецькій теж трапляється — саме тому завдання його виключає: haben дало б змогу відповісти в обхід пари, а не відтворити її. Дієслово — факт про іменник і вчиться разом із ним, як рід: жодне правило його не породжує, і жодна інша мова його не підказує. Те саме führen керує фірмою: eine Firma führen."
      de: "Das feste Paar ist ein Gespräch führen. Ein Gespräch haben gibt es umgangssprachlich durchaus — genau deshalb schließt die Aufgabe es aus: haben käme an der Verbindung vorbei, statt sie zu bilden. Das Verb ist eine Eigenschaft des Nomens und wird mit ihm gelernt, wie das Genus — keine Regel erzeugt es, keine andere Sprache liefert es. Dasselbe führen leitet auch eine Firma: eine Firma führen."

  - id: variant-b
    outcomes: [interview-fragen-beantworten]
    type: cloze
    focus: nomen-verb-verbindung
    instruction:
      en: "Fill in the fixed verb that belongs to Verantwortung — present tense, er-form, and not the all-purpose haben."
      ru: "Впишите устойчивый глагол, принадлежащий существительному Verantwortung, — в презенсе, форма для er; универсальное haben не подходит."
      uk: "Впишіть стійке дієслово, що належить іменнику Verantwortung, — у презенсі, форма для er; універсальне haben не підходить."
      de: "Ergänze das feste Verb, das zu Verantwortung gehört — im Präsens, er-Form, und nicht das Allzweckverb haben."
    text: "Nach der Ausbildung {{übernimmt|trägt}} er im Betrieb mehr Verantwortung."
    translation:
      en: "After his training he takes on more responsibility in the business."
      ru: "После обучения он берёт на себя на предприятии больше ответственности."
      uk: "Після навчання він бере на себе на підприємстві більше відповідальності."
    explain:
      en: "Verantwortung keeps two verbs and both are right here: übernehmen for taking it on, tragen for carrying it. Er hat mehr Verantwortung is good German too — it just states the fact instead of using the pair, which is why the instruction rules haben out. What genuinely does not fit is the all-purpose machen. Note the vowel change in the er-form — übernimmt, trägt — which is the ordinary strong-verb present, not part of the pair."
      ru: "У Verantwortung два своих глагола, и здесь верны оба: übernehmen — «взять на себя», tragen — «нести». Er hat mehr Verantwortung — тоже правильный немецкий, но это констатация факта в обход пары, поэтому задание исключает haben. А вот универсальное machen сюда действительно не подходит. Обратите внимание на смену гласной в форме для er — übernimmt, trägt: это обычный презенс сильного глагола, а не часть пары."
      uk: "У Verantwortung два своїх дієслова, і тут правильні обидва: übernehmen — «взяти на себе», tragen — «нести». Er hat mehr Verantwortung — теж правильна німецька, але це констатація факту в обхід пари, тому завдання виключає haben. А от універсальне machen сюди справді не пасує. Зверніть увагу на зміну голосної у формі для er — übernimmt, trägt: це звичайний презенс сильного дієслова, а не частина пари."
      de: "Verantwortung hat zwei eigene Verben, und beide stimmen hier: übernehmen fürs Auf-sich-Nehmen, tragen fürs Tragen. Er hat mehr Verantwortung ist ebenfalls korrektes Deutsch — es stellt die Tatsache nur fest, statt die Verbindung zu bilden, und deshalb schließt die Aufgabe haben aus. Was wirklich nicht passt, ist das Allzweckverb machen. Und der Vokalwechsel in der er-Form — übernimmt, trägt — ist das normale Präsens starker Verben, nicht Teil der Verbindung."

  - id: variant-c
    outcomes: [interview-fragen-beantworten]
    type: cloze
    focus: nomen-verb-verbindung
    instruction:
      en: "Fill in the fixed verb that belongs to Mühe — present tense, and not machen."
      ru: "Впишите устойчивый глагол, принадлежащий существительному Mühe, — в презенсе; machen не подходит."
      uk: "Впишіть стійке дієслово, що належить іменнику Mühe, — у презенсі; machen не підходить."
      de: "Ergänze das feste Verb, das zu Mühe gehört — im Präsens, und nicht machen."
    text: "Bei jeder neuen Aufgabe {{gibt}} er sich große Mühe."
    translation:
      en: "He makes a real effort with every new task."
      ru: "В каждом новом задании он очень старается."
      uk: "У кожному новому завданні він дуже старається."
    explain:
      en: "sich Mühe geben — and the sich in it is dative: ich gebe mir Mühe, du gibst dir Mühe. German does have sich die Mühe machen, but it needs an infinitive clause after it — sich die Mühe machen, etwas zu tun. Beside bare große Mühe the pair is geben, and the instruction rules machen out so the pair is what gets produced. That is the point of the family: a pair never lends its verb to the noun next door — machen belongs to einen Eindruck machen. One family, one competence: the verb the noun demands, produced cold."
      ru: "sich Mühe geben — и sich здесь стоит в дативе: ich gebe mir Mühe, du gibst dir Mühe. Оборот sich die Mühe machen в немецком есть, но он требует после себя инфинитивной группы — sich die Mühe machen, etwas zu tun. Когда рядом стоит просто große Mühe, пара — geben, и задание исключает machen, чтобы проверялась именно она. В этом суть семьи: пара никогда не одалживает свой глагол соседнему существительному — machen принадлежит обороту einen Eindruck machen. Одна семья, одна компетенция: глагол, которого требует существительное, воспроизведённый без подготовки."
      uk: "sich Mühe geben — і sich тут стоїть у давальному: ich gebe mir Mühe, du gibst dir Mühe. Зворот sich die Mühe machen у німецькій є, але він потребує після себе інфінітивної групи — sich die Mühe machen, etwas zu tun. Коли поруч стоїть просто große Mühe, пара — geben, і завдання виключає machen, щоб перевірялася саме вона. У цьому суть родини: пара ніколи не позичає своє дієслово сусідньому іменнику — machen належить звороту einen Eindruck machen. Одна родина, одна компетенція: дієслово, якого вимагає іменник, відтворене без підготовки."
      de: "sich Mühe geben — und das sich darin steht im Dativ: ich gebe mir Mühe, du gibst dir Mühe. Sich die Mühe machen gibt es durchaus, aber es verlangt einen Infinitivsatz danach — sich die Mühe machen, etwas zu tun. Neben bloßem große Mühe ist geben das Paar, und die Aufgabe schließt machen aus, damit genau dieses Paar gebildet wird. Das ist der Kern der Familie: Ein Paar verleiht sein Verb nie an das Nomen nebenan — machen gehört zu einen Eindruck machen. Eine Familie, eine Fähigkeit: das Verb, das das Nomen verlangt, aus dem Stand gebildet."
