# Diagnostic generation, not practice: three guesses before the article.
topic: erfahrungen-erzaehlen
role: pretest
title:
  en: "Before you read — three guesses"
  ru: "Перед чтением — три догадки"
  uk: "Перед читанням — три здогади"
  de: "Vor dem Lesen — drei Vermutungen"
items:
  - id: pre-cloze-ging
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    instruction:
      en: "A written story. Guess the past form of gehen."
      ru: "Письменный рассказ. Угадайте форму прошедшего от gehen."
      uk: "Письмова розповідь. Вгадайте форму минулого від gehen."
      de: "Eine geschriebene Geschichte. Rate die Vergangenheitsform von gehen."
    text: "Gestern {{ging}} ich allein durch den Park."
    translation:
      en: "Yesterday I walked through the park alone."
      ru: "Вчера я шёл через парк один."
      uk: "Учора я йшов через парк сам."
    explain:
      en: "Written narration uses the Präteritum of every verb — gehen becomes ging, with a vowel change and no -te. The article shows which verbs work like this."
      ru: "Письменное повествование использует Präteritum каждого глагола — gehen превращается в ging: смена гласной и никакого -te. В статье показано, какие глаголы устроены так."
      uk: "Письмова оповідь використовує Präteritum кожного дієслова — gehen перетворюється на ging: зміна голосної і жодного -te. У статті показано, які дієслова влаштовані так."
      de: "Eine geschriebene Erzählung nimmt bei jedem Verb das Präteritum — aus gehen wird ging, mit Vokalwechsel und ohne -te. Das Kapitel zeigt, welche Verben so funktionieren."

  - id: pre-mc-nachdem
    outcomes: [vorzeitigkeit-ausdruecken]
    type: mc
    prompt: "Nachdem ich das Fenster ___, war es endlich leise."
    options:
      - "geschlossen hatte"
      - "schließe"
      - "geschlossen habe"
    correct: 0
    translation:
      en: "After I had closed the window, it was finally quiet."
      ru: "После того как я закрыл окно, наконец стало тихо."
      uk: "Після того як я зачинив вікно, нарешті стало тихо."
    explain:
      en: "nachdem marks the earlier event, and the verb shows it: Plusquamperfekt (geschlossen hatte) in the nachdem-clause, one tense-step before the main clause. The article builds this staircase."
      ru: "nachdem помечает более раннее событие, и глагол это показывает: Plusquamperfekt (geschlossen hatte) в придаточном с nachdem — на ступень раньше главного. Статья строит эту лестницу."
      uk: "nachdem позначає ранішу подію, і дієслово це показує: Plusquamperfekt (geschlossen hatte) у підрядному з nachdem — на сходинку раніше за головне. Стаття будує ці сходи."
      de: "nachdem kennzeichnet das frühere Ereignis, und das Verb zeigt es: Plusquamperfekt (geschlossen hatte) im nachdem-Satz, eine Zeitstufe vor dem Hauptsatz. Der Artikel baut diese Treppe auf."

  - id: pre-mc-waehrend
    outcomes: [praeteritum-erzaehlen]
    type: mc
    prompt: "Welcher Satz ist richtig?"
    options:
      - "Während ich kochte, hörte ich Musik."
      - "Während ich hörte Musik, kochte ich."
    correct: 0
    translation:
      en: "Which sentence is correct? — While I was cooking, I listened to music."
      ru: "Какое предложение верно? — Пока я готовил, я слушал музыку."
      uk: "Яке речення правильне? — Поки я готував, я слухав музику."
    explain:
      en: "während opens a Nebensatz, so its verb goes to the end: Während ich kochte. The second option keeps main-clause order inside the clause — the error the lesson trains away."
      ru: "während открывает придаточное, поэтому его глагол уходит в конец: Während ich kochte. Во втором варианте внутри придаточного остался порядок главного предложения — та самая ошибка, от которой отучает урок."
      uk: "während відкриває підрядне, тому його дієслово йде в кінець: Während ich kochte. У другому варіанті всередині підрядного залишився порядок головного речення — та сама помилка, від якої відучує урок."
      de: "während eröffnet einen Nebensatz, also geht sein Verb ans Ende: Während ich kochte. Die zweite Variante behält im Nebensatz die Stellung eines Hauptsatzes — genau der Fehler, den die Lektion abtrainiert."
