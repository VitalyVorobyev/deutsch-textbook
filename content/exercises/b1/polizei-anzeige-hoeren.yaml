  question: 'Was hat die Nachbarin erzählt?'
  options:
  - 'Dass sie nachts zwei Männer mit einem kleinen Lastwagen gesehen hat.'
  - 'Dass sie den Dieb kennt.'
  - 'Dass das Fahrrad nicht abgeschlossen war.'
  correct: 0
  explain:
    en: 'Frau Lindner reports it in indirect speech — hat erzählt, dass … — and adds what the neighbour does not know: ob die etwas damit zu tun hatten. The bike was locked: das abgeschlossene Rad.'
    ru: 'Госпожа Линднер передаёт это косвенной речью — hat erzählt, dass …, — и добавляет, чего соседка не знает: ob die etwas damit zu tun hatten. Велосипед был заперт: das abgeschlossene Rad.'
    uk: 'Пані Лінднер передає це непрямою мовою — hat erzählt, dass …, — і додає, чого сусідка не знає: ob die etwas damit zu tun hatten. Велосипед був замкнений: das abgeschlossene Rad.'
    de: 'Frau Lindner gibt es mit „hat erzählt, dass …“ wieder und sagt auch, was die Nachbarin nicht weiß: ob die Männer etwas damit zu tun hatten. Das Rad war abgeschlossen: „das abgeschlossene Rad“.'
  max_replays: 3
