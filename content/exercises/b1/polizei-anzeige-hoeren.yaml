  question: 'Was soll Frau Lindner bis Freitag bringen?'
  options:
  - 'Die Rechnung mit der Nummer vom Rad.'
  - 'Die Zeugin.'
  - 'Die Bestätigung der Versicherung.'
  correct: 0
  explain:
    en: 'The invoice is her Beweis that the bike is hers; she has it at home. The confirmation is what she gets afterwards, and the police talk to the witness themselves.'
    ru: 'Счёт — её Beweis, что велосипед принадлежит ей; он лежит у неё дома. Подтверждение она получит потом, а со свидетельницей полиция поговорит сама.'
    uk: 'Рахунок — її Beweis, що велосипед належить їй; він у неї вдома. Підтвердження вона отримає потім, а зі свідкою поліція поговорить сама.'
    de: 'Die Rechnung ist ihr Beweis, dass es ihr Rad ist; sie liegt zu Hause. Die Bestätigung bekommt sie erst danach, und mit der Zeugin spricht die Polizei selbst.'
