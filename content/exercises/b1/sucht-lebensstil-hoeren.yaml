topic: sucht-lebensstil
role: practice
stage: transfer
activity: task
skill: hoeren
title_de: "Hören im Kontext — Sucht & Lebensstil"
title:
  en: 'Trying to quit again'
  ru: 'Снова бросить'
  uk: 'Знову кинути'
  de: 'Noch ein Versuch aufzuhören'
items:
- id: q1
  outcomes:
  - rat-zum-aufhoeren
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Miriam
      text: 'Du hast ja gar keine Zigarette in der Hand, Sabine. Hast du aufgehört?'
    - speaker: Sabine
      text: 'Ich versuche es zum vierten Mal. Einmal mit Pflaster, einmal ganz ohne Hilfe. Nach zwei Wochen habe ich immer wieder angefangen.'
    - speaker: Miriam
      text: 'Das kenne ich. Ich will dir keine Vorwürfe machen. Aber wenn ich du wäre, würde ich mich beraten lassen. Mir hat das sehr geholfen.'
    - speaker: Sabine
      text: 'Beraten lassen? So schlimm ist es doch nicht. Das ist ja keine Sucht wie Alkohol.'
    - speaker: Miriam
      text: 'Doch, Rauchen ist auch eine Sucht. Das hat nichts damit zu tun, dass jemand schwach ist.'
    - speaker: Sabine
      text: 'Und was hast du anders gemacht?'
    - speaker: Miriam
      text: 'Ich habe eine Zeit lang den Kaffee am Morgen sein lassen. Zum Kaffee habe ich nämlich immer geraucht.'
    - speaker: Sabine
      text: 'Bei mir sind es die Pausen. Wenn ich nicht jeden Tag mit den Kollegen rauchen würde, wäre es viel leichter.'
    - speaker: Miriam
      text: 'Dann geh in der Pause doch mit einem Nichtraucher spazieren. Und wenn es diesmal nicht klappt, versuchst du es eben noch einmal.'
  recording: ls-sucht-lebensstil-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Was würde Miriam an Sabines Stelle tun?'
  options:
  - 'Sich beraten lassen.'
  - 'Mit Pflaster aufhören.'
  - 'Ganz ohne Hilfe aufhören.'
  correct: 0
  explain:
    en: 'Wenn ich du wäre, würde ich… is advice wrapped in the Konjunktiv II, and it ends in mich beraten lassen. Patches and quitting alone are what Sabine has already tried.'
    ru: 'Wenn ich du wäre, würde ich… — совет, завёрнутый в Konjunktiv II, и заканчивается он словами mich beraten lassen. Пластырь и попытка без помощи — это то, что Сабина уже пробовала.'
    uk: 'Wenn ich du wäre, würde ich… — порада, загорнута в Konjunktiv II, і закінчується вона словами mich beraten lassen. Пластир і спробу без допомоги Сабіна вже пробувала.'
    de: '„Wenn ich du wäre, würde ich mich beraten lassen“: Miriam gibt ihren Rat im Konjunktiv II, also vorsichtig. Pflaster und den Versuch ohne Hilfe hat Sabine schon hinter sich.'
  max_replays: 3
