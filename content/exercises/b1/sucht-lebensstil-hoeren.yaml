  question: 'Was hat Miriam eine Zeit lang sein lassen?'
  options:
  - 'Den Kaffee am Morgen.'
  - 'Die Pausen mit den Kollegen.'
  - 'Den Alkohol.'
  correct: 0
  explain:
    en: 'Etwas sein lassen means to stop doing it for a while: Miriam gave up her morning coffee because she always smoked with it. The breaks with colleagues are Sabine''s problem.'
    ru: 'Etwas sein lassen значит на время перестать что-то делать: Мириам отказалась от утреннего кофе, потому что к нему всегда курила. Перерывы с коллегами — проблема Сабины.'
    uk: 'Etwas sein lassen означає на якийсь час перестати щось робити: Міріам відмовилася від ранкової кави, бо до неї завжди курила. Перерви з колегами — проблема Сабіни.'
    de: '„Etwas sein lassen“ heißt, dass man es nicht mehr macht. Miriam hat eine Zeit lang am Morgen keinen Kaffee getrunken, weil sie dazu immer geraucht hat. Die Pausen mit den Kollegen sind Sabines Problem.'
  max_replays: 3
