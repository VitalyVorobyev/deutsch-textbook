  question: 'Wann wäre das Aufhören für Sabine leichter?'
  options:
  - 'Wenn sie in der Pause nicht mit den Kollegen rauchen würde.'
  - 'Wenn sie keinen Kaffee mehr trinken würde.'
  - 'Wenn sie ein besseres Pflaster hätte.'
  correct: 0
  explain:
    en: 'Sabine names her own trigger as an unreal condition: wenn ich nicht jeden Tag mit den Kollegen rauchen würde, wäre es viel leichter. The coffee was Miriam''s trigger, not hers.'
    ru: 'Сабина называет свой повод закурить в виде нереального условия: wenn ich nicht jeden Tag mit den Kollegen rauchen würde, wäre es viel leichter. Кофе был поводом у Мириам, а не у неё.'
    uk: 'Сабіна називає свій привід закурити у формі нереальної умови: wenn ich nicht jeden Tag mit den Kollegen rauchen würde, wäre es viel leichter. Кава була приводом у Міріам, а не в неї.'
    de: 'Sabine sagt es selbst, als irreale Bedingung: „Wenn ich nicht jeden Tag mit den Kollegen rauchen würde, wäre es viel leichter.“ Der Kaffee war Miriams Problem, nicht ihres.'
