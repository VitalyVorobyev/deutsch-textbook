topic: gesundheit-wohlbefinden
role: practice
title:
  en: Small changes to the day
  ru: Небольшие перемены в распорядке дня
  uk: 'Невеликі зміни в розпорядку дня'
items:
- id: q1
  outcomes:
  - gewohnheiten-beschreiben
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Herr Klein
      text: In letzter Zeit bin ich abends völlig erschöpft, obwohl ich eigentlich
        genug schlafe.
    - speaker: Beraterin
      text: Wie sieht denn ein normaler Tag bei Ihnen aus?
    - speaker: Herr Klein
      text: Ich sitze acht Stunden am Schreibtisch und esse meistens am Computer.
    - speaker: Beraterin
      text: Das ist schon ein Teil der Antwort. Bewegung fehlt, und die Pause auch.
    - speaker: Herr Klein
      text: Für Sport habe ich wirklich keine Zeit.
    - speaker: Beraterin
      text: Es muss kein Sport sein. Viele merken schon einen Unterschied, wenn sie
        zweimal am Tag zehn Minuten zu Fuß gehen.
    - speaker: Herr Klein
      text: So wenig soll etwas bringen?
    - speaker: Beraterin
      text: Regelmäßig ist wichtiger als lang. Wer einmal pro Woche eine Stunde läuft,
        hält das selten durch.
    - speaker: Herr Klein
      text: Und das Essen am Schreibtisch?
    - speaker: Beraterin
      text: Versuchen Sie, wenigstens einmal am Tag woanders zu essen. Der Kopf braucht
        die Unterbrechung genauso wie der Körper.
    - speaker: Herr Klein
      text: Das klingt machbar. Womit soll ich anfangen?
    - speaker: Beraterin
      text: Mit dem Spaziergang nach dem Mittagessen. Eine Sache reicht für den Anfang.
  recording: ls-gesundheit-wohlbefinden-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Womit soll Herr Klein anfangen?
  options:
  - Mit einem Spaziergang nach dem Mittagessen.
  - Mit zweimal Sport pro Woche.
  - Mit früherem Schlafengehen.
  correct: 0
  explain:
    en: Several suggestions are made across the conversation, and the last line picks
      exactly one of them to start with. Sleep is ruled out in his very first sentence.
    ru: За разговор звучит несколько советов, и последняя реплика выбирает из них
      ровно один, с которого начать. Сон исключён уже в его первой фразе.
    uk: 'За розмову звучить кілька порад, і остання репліка обирає з них рівно одну, з якої почати. Сон виключено вже в його першій фразі.'
  max_replays: 3
