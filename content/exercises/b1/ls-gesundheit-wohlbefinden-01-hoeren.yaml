    en: 'The principle is stated first and the example follows it: regelmäßig ist
      wichtiger als lang. The reason is about keeping it up, not about effort.'
    ru: 'Сначала звучит принцип, а пример следует за ним: regelmäßig ist wichtiger
      als lang. Причина — в том, чтобы выдержать режим, а не в нагрузке.'
    uk: 'Спершу звучить принцип, а приклад іде за ним: regelmäßig ist wichtiger als lang. Причина — у тому, чи витримаєш режим, а не в навантаженні.'
