topic: gespraech-steuern
role: pretest
title:
  en: "Before you read — three moves a conversation needs"
  ru: "Перед чтением — три хода, без которых разговор не идёт"
  uk: "Перед читанням — три ходи, без яких розмова не йде"

# Three guesses, one per decision the article answers: whether a discourse adverb counts as the
# first element of the sentence, what you actually say to show you are listening, and which form
# a polite request for the floor takes. Two of the three are non-mc.
items:
  - id: vorfeld-uebrigens
    outcomes: [inhalt-steuern]
    type: translate
    key_tokens: ["Übrigens", "habe"]
    instruction:
      en: "Begin the sentence with übrigens."
      ru: "Начните предложение со слова übrigens."
      uk: "Почніть речення зі слова übrigens."
    prompt_en: "By the way, I still have a question."
    prompt_ru: "Кстати, у меня есть ещё вопрос."
    prompt_uk: "До речі, у мене є ще питання."
    answer: "Übrigens habe ich noch eine Frage."
    explain:
      en: "*Übrigens* is an adverb standing inside the sentence, so it fills position 1 and the finite verb has to come immediately after it: *Übrigens **habe** ich …*. A phrase learned as a label gets written in front of a finished sentence — *Übrigens ich habe …* — and the verb then lands third, which German does not allow. The same rule you already know from *deshalb* and *trotzdem*."
      ru: "*Übrigens* — наречие внутри предложения, поэтому оно занимает первое место, а спрягаемый глагол обязан идти сразу за ним: *Übrigens **habe** ich …*. Оборот, выученный как ярлык, приписывается перед готовым предложением — *Übrigens ich habe …*, — и глагол оказывается третьим, чего немецкий не допускает. То же правило, что вы уже знаете по *deshalb* и *trotzdem*."
      uk: "*Übrigens* — прислівник усередині речення, тому він посідає перше місце, а відмінюване дієслово мусить іти одразу за ним: *Übrigens **habe** ich …*. Зворот, вивчений як ярлик, дописується перед готовим реченням — *Übrigens ich habe …*, — і дієслово опиняється третім, чого німецька не допускає. Те саме правило, що ви вже знаєте з *deshalb* і *trotzdem*."

  - id: hoerersignal
    outcomes: [zuhoeren-anknuepfen]
    type: mc
    prompt: "Eine Kollegin erzählt Ihnen, dass die Besprechung verschoben wurde. Das wussten Sie noch nicht. Was sagen Sie?"
    options:
      - "Wirklich? Das wusste ich noch nicht."
      - "Genau, das habe ich auch gesagt."
      - "Bitte schön, gern geschehen."
    correct: 0
    explain:
      en: "*Wirklich?* is the signal for information that is new to you, and it is what keeps the other person talking. *Genau* is also a listener signal but the wrong one here: it confirms something you already knew, and claiming that you said it yourself is simply false. *Bitte schön* answers a thank-you, so it belongs to a different exchange altogether. German speakers expect one of these sounds while they talk; silence reads as disagreement."
      ru: "*Wirklich?* — сигнал о том, что для вас это новость, и именно он побуждает собеседника говорить дальше. *Genau* — тоже сигнал слушателя, но здесь неверный: он подтверждает уже известное, а утверждение, что вы это сами говорили, попросту неправда. *Bitte schön* — ответ на благодарность, то есть реплика из другого обмена. Немец, который говорит, ждёт от вас одного из таких звуков; молчание читается как несогласие."
      uk: "*Wirklich?* — сигнал про те, що для вас це новина, і саме він спонукає співрозмовника говорити далі. *Genau* — теж сигнал слухача, але тут хибний: він підтверджує вже відоме, а твердження, що ви це самі казали, просто неправда. *Bitte schön* — відповідь на подяку, тобто репліка з іншого обміну. Німець, який говорить, чекає від вас одного з таких звуків; мовчання читається як незгода."

  - id: hoeflich-um-wort-bitten
    outcomes: [wort-nehmen-geben]
    type: cloze
    instruction:
      en: "Put the named verb into the polite Konjunktiv II form."
      ru: "Поставьте названный глагол в вежливую форму Konjunktiv II."
      uk: "Поставте назване дієслово у ввічливу форму Konjunktiv II."
    text: "Entschuldigung, {{dürfte}} ich dazu kurz etwas sagen? (dürfen)"
    translation:
      en: "Excuse me, could I say something about that briefly?"
      ru: "Извините, можно мне коротко сказать об этом?"
      uk: "Перепрошую, чи можна мені коротко про це сказати?"
    explain:
      en: "Breaking into somebody else's turn is the one move here that has to be softened, and German softens it with Konjunktiv II. The form is the Präteritum plus an umlaut: *durfte* → *dürfte*. *Darf ich …?* is not wrong, but it asks for permission flatly; *Dürfte ich …?* asks whether permission would be given, which is what makes it polite."
      ru: "Вклиниться в чужую реплику — единственный здесь ход, который обязан быть смягчён, и немецкий смягчает его через Konjunktiv II. Форма — это Präteritum плюс умлаут: *durfte* → *dürfte*. *Darf ich …?* не ошибка, но это прямой запрос разрешения; *Dürfte ich …?* спрашивает, было бы разрешение дано, — в этом и вежливость."
      uk: "Уклинитися в чужу репліку — єдиний тут хід, який мусить бути пом'якшений, і німецька пом'якшує його через Konjunktiv II. Форма — це Präteritum плюс умлаут: *durfte* → *dürfte*. *Darf ich …?* не помилка, але це прямий запит дозволу; *Dürfte ich …?* питає, чи був би дозвіл даний, — у цьому й ввічливість."
