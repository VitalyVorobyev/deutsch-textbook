      ru: "Оцениваются два конца придаточного следствия: sodass, который его открывает, и können у самой стены — глагольная цепочка spielen können остаётся целой, спрягаемый глагол последним. sodass können die Kinder … было бы порядком слов deshalb. Главное предложение идёт в обычном пассиве из B1.6 — здесь это носитель. Старое написание so dass — тот же союз и принимается."
      uk: "Оцінюються два кінці підрядного наслідку: sodass, що його відкриває, і können біля самої стіни — дієслівний ланцюжок spielen können лишається цілим, відмінюване дієслово останнім. sodass können die Kinder … було б порядком слів deshalb. Головне речення йде у звичайному пасиві з B1.6 — тут це носій. Старе написання so dass — той самий сполучник і приймається."
      de: "Bewertet werden die zwei Enden des Folgesatzes: sodass, das ihn eröffnet, und können an seiner Wand — die Verbkette spielen können bleibt zusammen, das finite Verb zuletzt. sodass können die Kinder … wäre die Wortstellung von deshalb. Der Hauptsatz läuft im einfachen Passiv aus B1.6, hier reines Trägermaterial. Die ältere Schreibung so dass ist dieselbe Konjunktion und wird akzeptiert."

