      - "Der Aufzug wird gestrichen. Deshalb nehme ich in dieser Woche die Treppe."
      - "Der Aufzug wird gestrichen, deshalb nehme ich in dieser Woche die Treppe."
      - "Der Aufzug wird gestrichen. Deshalb benutze ich diese Woche die Treppe."
      - "Der Aufzug wird gestrichen, deshalb benutze ich diese Woche die Treppe."
      - "Der Aufzug wird gestrichen. Deshalb benutze ich in dieser Woche die Treppe."
      - "Der Aufzug wird gestrichen, deshalb benutze ich in dieser Woche die Treppe."
    key_tokens: ["Deshalb", "deshalb", "nehme", "benutze"]
    explain:
      en: "The A2 contrast sodass lives next to: deshalb is an adverb, so it fills position 1 of a new main clause and the finite verb comes immediately — Deshalb nehme ich, never Deshalb ich nehme. Same two facts as a sodass sentence, opposite grammar: the adverb pulls the verb to itself, the conjunction sends it to the end."
      ru: "Контраст с A2, рядом с которым живёт sodass: deshalb — наречие, оно занимает первую позицию нового главного предложения, и спрягаемый глагол идёт сразу за ним — Deshalb nehme ich, никогда Deshalb ich nehme. Те же два факта, что и в предложении с sodass, но противоположная грамматика: наречие притягивает глагол к себе, союз отправляет его в конец."
      uk: "Контраст з A2, поруч з яким живе sodass: deshalb — прислівник, воно займає першу позицію нового головного речення, і відмінюване дієслово йде одразу за ним — Deshalb nehme ich, ніколи Deshalb ich nehme. Ті самі два факти, що й у реченні з sodass, але протилежна граматика: прислівник притягує дієслово до себе, сполучник відправляє його в кінець."
      de: "Der A2-Kontrast, neben dem sodass wohnt: deshalb ist ein Adverb, es besetzt Position 1 eines neuen Hauptsatzes, und das finite Verb folgt sofort — Deshalb nehme ich, nie Deshalb ich nehme. Dieselben zwei Fakten wie im sodass-Satz, die entgegengesetzte Grammatik: Das Adverb zieht das Verb zu sich, die Konjunktion schickt es ans Ende."
