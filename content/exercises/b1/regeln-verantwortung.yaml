# B1.7 primary practice. The two new tags close the unit's contract points (passiv-modal,
# konsekutivsatz-sodass → sodass-folge). Four items recycle A2 tags and close nothing:
# the duerfen-muessen block (mc-strom-abmelden, uebersetzen-miete, uebersetzen-rauchen) is
# the live runtime channel of the `deepens` edge to modalverben — the meaning of a rule is
# the modal's meaning, and misreading it is the A2 confusion this unit re-arms inside the
# passive; uebersetzen-deshalb-treppe (konjunktionaladverb-inversion) carries the edge to
# verbindungen-folgen and is the contrast sodass is taught against. The
# aemter-dienstleistungen edge is carried by uebersetzen-koennten in the produktion set,
# tag hoeflich-konjunktiv.
# Outcome discipline, because probe families arm by outcome (src/lib/probes.ts): every
# item on `pflichten-verstehen` produces or reads the modal-passive frame, every item on
# `folgen-benennen` builds a consequence clause, every item on `loesung-aushandeln`
# produces the modal choice a negotiation stands on. Nothing arms a family whose
# competence it does not touch.
# Format ladder per the B1.6 read of the audit (cloze strong, translate the format that
# discriminates): each point runs cloze → mc → translate where a cloze can grade it.
# duerfen-muessen gets no cloze — a gap that takes both modals is indeterminate served
# alone — and sodass-folge gets no cloze, because a gap cannot grade a position. order is
# saturated per the standing backlog ruling, so the practice union ships zero order items.
# This set is the primaryPractice — its item list never grows after shipping.
topic: regeln-verantwortung
role: practice
title:
  en: "Practice — the modal carries the rule, werden stays an infinitive"
  ru: "Практика — правило несёт модальный глагол, werden остаётся инфинитивом"
  uk: "Практика — правило несе модальне дієслово, werden лишається інфінітивом"
  de: "Übung — das Modalverb trägt die Regel, werden bleibt Infinitiv"
items:
  - id: cloze-garage
    outcomes: [pflichten-verstehen]
    type: cloze
    focus: passiv-modal
    instruction:
      en: "A house-rules sentence — fill in the Partizip II of abschließen and the verb after it."
      ru: "Фраза из правил дома — впишите Partizip II глагола abschließen и глагол после него."
      uk: "Фраза з правил будинку — впишіть Partizip II дієслова abschließen і дієслово після нього."
      de: "Ein Satz aus der Hausordnung — ergänze das Partizip II von abschließen und das Verb danach."
    text: "Die Garage im Hof muss nachts {{abgeschlossen}} {{werden}}."
    translation:
      en: "The garage in the courtyard must be locked at night."
      ru: "Гараж во дворе на ночь нужно запирать."
      uk: "Гараж у дворі на ніч потрібно замикати."
    explain:
      en: "The final block stacks in one order: participle first, then werden — abgeschlossen werden, never werden abgeschlossen. And the second gap wants the infinitive: after a modal every verb is an infinitive, so a wird there conjugates a verb the sentence has no seat for — muss already carries the conjugation."
      ru: "Финальный блок собирается в одном порядке: сначала причастие, потом werden — abgeschlossen werden, никогда werden abgeschlossen. Русское «должен быть заперт» подсказывает обратный порядок — сначала «быть». Во второй пропуск идёт инфинитив: после модального глагола любой глагол — инфинитив, спряжение уже несёт muss, и wird там спрягать нечего."
      uk: "Фінальний блок складається в одному порядку: спочатку дієприкметник, потім werden — abgeschlossen werden, ніколи werden abgeschlossen. Українське «має бути замкнений» підказує зворотний порядок — спершу «бути». У другий пропуск іде інфінітив: після модального дієслова будь-яке дієслово — інфінітив, відмінювання вже несе muss, і wird там відмінювати нічого."
      de: "Der Schlussblock hat eine feste Reihenfolge: zuerst das Partizip, dann werden — abgeschlossen werden, nie werden abgeschlossen. Und die zweite Lücke will den Infinitiv: Nach einem Modalverb steht jedes Verb im Infinitiv, die Konjugation trägt schon muss — ein wird hätte im Satz keinen Platz."

  - id: cloze-man-keller
    outcomes: [pflichten-verstehen]
    type: cloze
    focus: passiv-modal
    instruction:
      en: "Rewrite the man-sentence as a passive with the modal — fill in all three parts."
      ru: "Перепишите предложение с man в пассиве с модальным глаголом — впишите все три части."
      uk: "Перепишіть речення з man у пасиві з модальним дієсловом — впишіть усі три частини."
      de: "Schreib den man-Satz als Passiv mit Modalverb — ergänze alle drei Teile."
    text: "Man muss den Keller bis Samstag aufräumen. → Der Keller {{muss}} bis Samstag {{aufgeräumt}} {{werden}}."
    translation:
      en: "The cellar has to be tidied up by Saturday."
      ru: "Подвал нужно прибрать до субботы."
      uk: "Підвал потрібно прибрати до суботи."
    explain:
      en: "The B1.6 recipe with one extra part: den Keller becomes der Keller (accusative object to nominative subject), man vanishes, and the modal stays conjugated in position 2 — but the bare infinitive aufräumen is replaced by the passive infinitive aufgeräumt werden. The modal is the only verb that ever conjugates in this sentence."
      ru: "Рецепт из B1.6 с одной новой деталью: den Keller становится der Keller (дополнение в Akkusativ — подлежащим в Nominativ), man исчезает, модальный глагол остаётся спрягаемым на втором месте — а простой инфинитив aufräumen заменяется пассивным инфинитивом aufgeräumt werden. Спрягается в этом предложении только модальный глагол."
      uk: "Рецепт із B1.6 з однією новою деталлю: den Keller стає der Keller (додаток в Akkusativ — підметом у Nominativ), man зникає, модальне дієслово лишається відмінюваним на другому місці — а простий інфінітив aufräumen замінюється пасивним інфінітивом aufgeräumt werden. Відмінюється в цьому реченні лише модальне дієслово."
      de: "Das B1.6-Rezept mit einem neuen Teil: Aus den Keller wird der Keller (Akkusativobjekt zu Subjekt), man verschwindet, das Modalverb bleibt konjugiert auf Position 2 — aber der einfache Infinitiv aufräumen wird durch den Passiv-Infinitiv aufgeräumt werden ersetzt. Konjugiert wird in diesem Satz nur das Modalverb."

  - id: mc-gemeldet
    outcomes: [pflichten-verstehen]
    type: mc
    focus: passiv-modal
    prompt: "Der Schaden an der Haustür muss dem Hausmeister gemeldet ___."
    options:
      - "werden"
      - "wird"
      - "worden"
    correct: 0
    translation:
      en: "The damage to the front door must be reported to the caretaker."
      ru: "О повреждении входной двери нужно сообщить коменданту."
      uk: "Про пошкодження вхідних дверей потрібно повідомити коменданта."
    explain:
      en: "After a modal every verb is an infinitive, so werden keeps its dictionary form — muss is the only conjugated verb this clause has room for. wird would conjugate a second verb beside it, and worden belongs to a different frame entirely: B1.6's spoken past passive, ist … worden, which never follows a modal."
      ru: "После модального глагола любой глагол — инфинитив, поэтому werden сохраняет словарную форму: единственный спрягаемый глагол здесь — muss. wird спрягал бы второй глагол рядом с ним, а worden принадлежит совсем другой рамке — устному пассиву прошедшего из B1.6, ist … worden, который после модального не стоит никогда."
      uk: "Після модального дієслова будь-яке дієслово — інфінітив, тому werden зберігає словникову форму: єдине відмінюване дієслово тут — muss. wird відмінювало б друге дієслово поруч із ним, а worden належить зовсім іншій рамці — усному пасиву минулого з B1.6, ist … worden, який після модального не стоїть ніколи."
      de: "Nach einem Modalverb steht jedes Verb im Infinitiv, also behält werden die Grundform — das einzige konjugierte Verb dieses Satzes ist muss. wird würde ein zweites Verb daneben konjugieren, und worden gehört in eine ganz andere Klammer: das gesprochene Vergangenheits-Passiv aus B1.6, ist … worden, das nie auf ein Modalverb folgt."

  - id: uebersetzen-fahrraeder
    outcomes: [pflichten-verstehen]
    type: translate
    focus: passiv-modal
    instruction:
      en: "Translate — use the passive with müssen; for 'put' take stellen."
      ru: "Переведите — используйте пассив с müssen; для «поставить» возьмите stellen."
      uk: "Перекладіть — використайте пасив із müssen; для «поставити» візьміть stellen."
      de: "Übersetze — benutze das Passiv mit müssen; für das Verb nimm stellen."
    prompt_en: "The bicycles must be put in the courtyard by Sunday."
    prompt_ru: "Велосипеды нужно до воскресенья поставить во двор."
    prompt_uk: "Велосипеди потрібно до неділі поставити у двір."
    answer: "Die Fahrräder müssen bis Sonntag in den Hof gestellt werden."
    accept:
      - "Bis Sonntag müssen die Fahrräder in den Hof gestellt werden."
      # bis zum Sonntag renders the deadline just as correctly as bis Sonntag.
      - "Die Fahrräder müssen bis zum Sonntag in den Hof gestellt werden."
      - "Bis zum Sonntag müssen die Fahrräder in den Hof gestellt werden."
    key_tokens: ["müssen", "gestellt", "werden"]
    explain:
      en: "Graded are the three anchors of the form: müssen agreeing with the plural Fahrräder, and the passive infinitive gestellt werden closing the sentence in exactly that order. Everything else is carrier. Note in den Hof — direction, so accusative, as in A2's wohin-question. Fronting bis Sonntag is equally correct and accepted."
      ru: "Оцениваются три якоря формы: müssen, согласованный с множественным Fahrräder, и пассивный инфинитив gestellt werden, закрывающий предложение именно в этом порядке. Всё остальное — носитель. Обратите внимание на in den Hof: направление, значит Akkusativ, как в вопросе wohin с A2. Вынести bis Sonntag вперёд можно — вариант принимается."
      uk: "Оцінюються три якорі форми: müssen, узгоджений із множинним Fahrräder, і пасивний інфінітив gestellt werden, що закриває речення саме в цьому порядку. Усе інше — носій. Зверніть увагу на in den Hof: напрямок, отже Akkusativ, як у питанні wohin з A2. Винести bis Sonntag уперед можна — варіант приймається."
      de: "Bewertet werden die drei Anker der Form: müssen im Plural, passend zu die Fahrräder, und der Passiv-Infinitiv gestellt werden, der den Satz genau in dieser Reihenfolge schließt. Alles andere ist Träger. Beachte in den Hof — Richtung, also Akkusativ, wie bei der wohin-Frage aus A2. Bis Sonntag vorn ist genauso richtig und wird akzeptiert."

  - id: match-signale
    outcomes: [pflichten-verstehen]
    type: match
    instruction:
      en: "Match each modal signal to what the rule does."
      ru: "Соотнесите каждый модальный сигнал с тем, что делает правило."
      uk: "Співвіднесіть кожний модальний сигнал із тим, що робить правило."
      de: "Ordne jedes Modal-Signal dem zu, was die Regel tut."
    pairs:
      - left: "muss … werden"
        right: { en: "a duty — it has to be done", ru: "обязанность — это нужно сделать", uk: "обов'язок — це потрібно зробити" }
      - left: "darf … werden"
        right: { en: "a permission — it is allowed", ru: "разрешение — это можно делать", uk: "дозвіл — це можна робити" }
      - left: "darf nicht … werden"
        right: { en: "a ban — it is not allowed", ru: "запрет — этого делать нельзя", uk: "заборона — цього робити не можна" }
      - left: "muss nicht … werden"
        right: { en: "no duty — nobody requires it", ru: "нет обязанности — можно не делать", uk: "немає обов'язку — можна не робити" }
    explain:
      en: "The participle names the activity; the rule itself lives in the modal. Reading a notice therefore starts at the modal: muss imposes, darf permits, darf nicht forbids — and muss nicht only releases. The two negations are the pair worth slowing down for: they look symmetrical and are not."
      ru: "Причастие называет действие; само правило живёт в модальном глаголе. Поэтому чтение объявления начинается с модального: muss обязывает, darf разрешает, darf nicht запрещает — а muss nicht лишь освобождает. Два отрицания — пара, на которой стоит замедлиться: они выглядят симметрично, но не симметричны."
      uk: "Дієприкметник називає дію; саме правило живе в модальному дієслові. Тому читання оголошення починається з модального: muss зобов'язує, darf дозволяє, darf nicht забороняє — а muss nicht лише звільняє. Два заперечення — пара, на якій варто сповільнитися: вони виглядають симетрично, але не симетричні."
      de: "Das Partizip nennt die Tätigkeit; die Regel selbst steckt im Modalverb. Einen Aushang liest man deshalb vom Modalverb aus: muss verpflichtet, darf erlaubt, darf nicht verbietet — und muss nicht befreit nur. Die zwei Verneinungen sind das Paar, bei dem sich Langsamkeit lohnt: Sie sehen symmetrisch aus und sind es nicht."

  - id: mc-strom-abmelden
    outcomes: [loesung-aushandeln]
    type: mc
    focus: duerfen-muessen
    prompt: "Im Brief vom Amt steht: „Der Strom muss nicht abgemeldet werden.“ Was bedeutet das?"
    options:
      - "Man kann ihn abmelden, aber niemand verlangt es."
      - "Es ist verboten, ihn abzumelden."
      - "Man muss ihn unbedingt abmelden."
    correct: 0
    translation:
      en: "The letter from the office says: \"The electricity does not have to be de-registered.\" What does that mean?"
      ru: "В письме из ведомства написано: «Электричество не обязательно отключать (снимать с учёта)». Что это значит?"
      uk: "У листі з відомства написано: «Електрику не обов'язково відключати (знімати з обліку)». Що це означає?"
    explain:
      en: "muss nicht lifts the duty and nothing else: de-registering stays possible, just not required. English \"must not\" forbids, so it pulls the reading toward Es ist verboten — but the German ban is darf nicht. Before you negotiate with any office, this is the first sorting question: does the rule forbid, or merely not require?"
      ru: "muss nicht снимает обязанность — и только: отключить по-прежнему можно, просто не требуется. Дословное «не должен» тянет к варианту Es ist verboten, к запрету — но запрет по-немецки darf nicht. Перед любыми переговорами с ведомством это первый сортировочный вопрос: правило запрещает — или просто не требует?"
      uk: "muss nicht знімає обов'язок — і тільки: відключити, як і раніше, можна, просто не вимагається. Дослівне «не повинен» тягне до варіанта Es ist verboten, до заборони — але заборона німецькою darf nicht. Перед будь-якими перемовинами з відомством це перше сортувальне питання: правило забороняє — чи просто не вимагає?"
      de: "muss nicht hebt die Pflicht auf — sonst nichts: Abmelden bleibt möglich, nur verlangt es niemand. Das Verbot wäre darf nicht. Vor jedem Gespräch mit einem Amt ist das die erste Sortierfrage: Verbietet die Regel etwas — oder verlangt sie es nur nicht?"

  - id: uebersetzen-miete
    outcomes: [loesung-aushandeln]
    type: translate
    focus: duerfen-muessen
    instruction:
      en: "Translate — use the passive of bezahlen."
      ru: "Переведите — используйте пассив глагола bezahlen."
      uk: "Перекладіть — використайте пасив дієслова bezahlen."
      de: "Übersetze — benutze das Passiv von bezahlen."
    prompt_en: "The rent does not have to be paid in cash."
    prompt_ru: "Квартплату не обязательно платить наличными."
    prompt_uk: "Квартплату не обов'язково платити готівкою."
    answer: "Die Miete muss nicht bar bezahlt werden."
    accept:
      - "Die Miete muss nicht in bar bezahlt werden."
      # mit Bargeld says "in cash" as correctly as bar / in bar.
      - "Die Miete muss nicht mit Bargeld bezahlt werden."
    key_tokens: ["muss"]
    explain:
      en: "\"Does not have to\" names a released duty, and the release is muss nicht — darf nicht would forbid cash, which the landlord never said. English \"must not\" is the trap: it forbids, muss nicht does not. Only the modal is graded: the choice is this item's competence, and the frame around it belongs to other items. bar, in bar and mit Bargeld are all idiomatic."
      ru: "«Не обязательно» — снятая обязанность, и снимает её muss nicht; darf nicht запретил бы наличные, чего арендодатель не говорил. Оценивается только модальный глагол: выбор — компетенция этого задания, а рамка вокруг него — дело других заданий. bar, in bar и mit Bargeld одинаково идиоматичны."
      uk: "«Не обов'язково» — знятий обов'язок, і знімає його muss nicht; darf nicht заборонило б готівку, чого орендодавець не казав. Оцінюється лише модальне дієслово: вибір — компетенція цього завдання, а рамка навколо нього — справа інших завдань. bar, in bar та mit Bargeld однаково ідіоматичні."
      de: "Gemeint ist eine aufgehobene Pflicht, und die hebt muss nicht auf — darf nicht würde das Bargeld verbieten, was niemand gesagt hat. Bewertet wird nur das Modalverb: Die Wahl ist die Kompetenz dieser Aufgabe, die Klammer darum gehört anderen Aufgaben. bar, in bar und mit Bargeld sind alle idiomatisch."

  - id: uebersetzen-rauchen
    outcomes: [loesung-aushandeln]
    type: translate
    focus: duerfen-muessen
    instruction:
      en: "Translate — use the passive of rauchen."
      ru: "Переведите — используйте пассив глагола rauchen."
      uk: "Перекладіть — використайте пасив дієслова rauchen."
      de: "Übersetze — benutze das Passiv von rauchen."
    prompt_en: "Smoking is not allowed in the stairwell."
    prompt_ru: "В подъезде курить нельзя."
    prompt_uk: "У під'їзді курити не можна."
    answer: "Im Treppenhaus darf nicht geraucht werden."
    accept:
      - "Es darf im Treppenhaus nicht geraucht werden."
    key_tokens: ["darf"]
    explain:
      en: "\"Not allowed\" marks the ban, and the ban is darf nicht — muss nicht would announce that smoking is merely optional, a strange notice. The sentence has no subject at all: the impersonal passive is how German signs forbid an activity itself, and the article's error list warns against muss nicht in exactly this sentence."
      ru: "«Нельзя» — это запрет, а запрет — darf nicht; muss nicht объявил бы, что курить просто не обязательно, — странная табличка. Подлежащего в предложении нет вовсе: безличный пассив — то, как немецкие таблички запрещают само действие, и список ошибок в статье предупреждает о muss nicht именно на этом предложении."
      uk: "«Не можна» — це заборона, а заборона — darf nicht; muss nicht оголосило б, що курити просто не обов'язково, — дивна табличка. Підмета в реченні немає зовсім: безособовий пасив — те, як німецькі таблички забороняють саму дію, і список помилок у статті попереджає про muss nicht саме на цьому реченні."
      de: "Gemeint ist das Verbot, und das Verbot ist darf nicht — muss nicht würde verkünden, dass Rauchen bloß keine Pflicht ist: ein seltsames Schild. Der Satz hat gar kein Subjekt: Mit dem unpersönlichen Passiv verbieten deutsche Schilder die Tätigkeit selbst, und die Fehlerliste des Artikels warnt genau bei diesem Satz vor muss nicht."

  - id: mc-gebohrt-sodass
    outcomes: [folgen-benennen]
    type: mc
    focus: sodass-folge
    prompt: "Im Haus wird den ganzen Tag gebohrt, ___"
    options:
      - "sodass das Baby nicht schlafen kann."
      - "sodass kann das Baby nicht schlafen."
      - "sodass das Baby kann nicht schlafen."
    correct: 0
    translation:
      en: "There is drilling in the building all day, so the baby cannot sleep."
      ru: "В доме весь день сверлят, так что ребёнок не может спать."
      uk: "У будинку цілий день свердлять, так що дитина не може спати."
    explain:
      en: "sodass opens a Nebensatz: subject straight after the conjunction, finite verb at the very end — kann closes the clause. The version sodass kann das Baby … gives sodass the grammar of deshalb, an adverb that takes the verb right after itself; the version sodass das Baby kann … freezes main-clause order after a conjunction, the straight transfer from \"so the baby can't sleep\"."
      ru: "sodass открывает придаточное: сразу после союза — подлежащее, спрягаемый глагол — в самом конце: придаточное закрывает kann. Вариант sodass kann das Baby … даёт sodass грамматику deshalb — наречия, которое ставит глагол сразу за собой; вариант sodass das Baby kann … замораживает порядок главного предложения после союза — прямой перенос русского «так что ребёнок не может спать»."
      uk: "sodass відкриває підрядне: одразу після сполучника — підмет, відмінюване дієслово — у самому кінці: підрядне закриває kann. Варіант sodass kann das Baby … дає sodass граматику deshalb — прислівника, що ставить дієслово одразу за собою; варіант sodass das Baby kann … заморожує порядок головного речення після сполучника — прямий перенос українського «так що дитина не може спати»."
      de: "sodass eröffnet einen Nebensatz: direkt nach der Konjunktion das Subjekt, das finite Verb ganz am Ende — kann schließt den Satz. Die Variante sodass kann das Baby … gibt sodass die Grammatik von deshalb, einem Adverb, das das Verb direkt hinter sich zieht; die Variante sodass das Baby kann … friert nach der Konjunktion die Hauptsatz-Stellung ein — die wörtliche Übertragung aus vielen Sprachen."

  - id: uebersetzen-hof-sodass
