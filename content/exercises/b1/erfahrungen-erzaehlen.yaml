# B1.1 primary practice. New tags close the unit's three grammar points
# (praeteritum-vollverben, plusquamperfekt-nachdem, temporal-nebensatz); the two
# recycling items carry the deepens edges (praeteritum-sein-haben → biografie-erfahrungen,
# haben-sein → perfekt-haben-sein) and never count toward B1 coverage.
topic: erfahrungen-erzaehlen
role: practice
stage: geruest
activity: core
title:
  en: "Practice — the written past, and the tense staircase"
  ru: "Практика — письменное прошедшее и лестница времён"
  uk: "Практика — письмове минуле і сходи часів"
  de: "Übung — die geschriebene Vergangenheit und die Zeitentreppe"
items:
  - id: cloze-ging
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-vollverben
    instruction:
      en: "A written narrative: fill in the Präteritum of gehen."
      ru: "Письменный рассказ: впишите Präteritum глагола gehen."
      uk: "Письмова розповідь: впишіть Präteritum дієслова gehen."
      de: "Eine geschriebene Erzählung: Ergänze das Präteritum von gehen."
    text: "Gestern {{ging}} ich zu Fuß zur Arbeit, denn mein Fahrrad war kaputt."
    translation:
      en: "Yesterday I walked to work, because my bicycle was broken."
      ru: "Вчера я пошёл на работу пешком, потому что мой велосипед сломался."
      uk: "Учора я пішов на роботу пішки, бо мій велосипед зламався."
    explain:
      en: "gehen is strong: the vowel changes and no -te appears — ging. In speech you would say ich bin gegangen; on paper the narration itself carries the past, one word at a time."
      ru: "gehen — сильный глагол: гласная меняется, и никакого -te не появляется — ging. В речи вы бы сказали ich bin gegangen; на письме прошедшее несёт само повествование, по слову за раз."
      uk: "gehen — сильне дієслово: голосна змінюється, і жодного -te не з'являється — ging. У мовленні ви б сказали ich bin gegangen; на письмі минуле несе сама оповідь, по слову за раз."
      de: "gehen ist stark: Der Vokal wechselt, ein -te kommt nicht dazu — ging. Gesprochen hieße derselbe Satz ich bin gegangen; auf dem Papier trägt die Erzählung die Vergangenheit selbst, Verb für Verb."

  - id: cloze-kam-fand
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-vollverben
    instruction:
      en: "Continue the narrative: kommen and finden in the Präteritum."
      ru: "Продолжите рассказ: kommen и finden в Präteritum."
      uk: "Продовжіть розповідь: kommen і finden у Präteritum."
      de: "Erzähle weiter: kommen und finden im Präteritum."
    text: "Ich {{kam}} zu spät zum Kurs und {{fand}} keinen freien Platz mehr."
    translation:
      en: "I arrived at the course too late and found no free seat any more."
      ru: "Я пришёл на курс слишком поздно и уже не нашёл свободного места."
      uk: "Я прийшов на курс запізно і вже не знайшов вільного місця."
    explain:
      en: "Two strong verbs side by side: kommen → kam, finden → fand. Learn them as pairs, like the Partizip — the narrative verbs are a closed set worth knowing cold."
      ru: "Два сильных глагола подряд: kommen → kam, finden → fand. Учите их парами, как учили Partizip: повествовательные глаголы — закрытый набор, который стоит знать назубок."
      uk: "Два сильні дієслова поспіль: kommen → kam, finden → fand. Вчіть їх парами, як вчили Partizip: оповідні дієслова — закритий набір, який варто знати напам'ять."
      de: "Zwei starke Verben nebeneinander: kommen → kam, finden → fand. Lerne sie als Paare, wie damals das Partizip — die Erzählverben sind eine kleine, feste Gruppe, die man auswendig kennen muss."

  - id: cloze-wusste
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-vollverben
    instruction:
      en: "The mixed type: wissen in the Präteritum."
      ru: "Смешанный тип: wissen в Präteritum."
      uk: "Мішаний тип: wissen у Präteritum."
      de: "Der gemischte Typ: wissen im Präteritum."
    text: "Ich {{wusste}} nicht, wo ich war."
    translation:
      en: "I did not know where I was."
      ru: "Я не знал, где нахожусь."
      uk: "Я не знав, де перебуваю."
    explain:
      en: "wissen belongs to the small mixed group: a new vowel like a strong verb, weak -te endings on top — wusste. bringen → brachte and denken → dachte follow the same recipe."
      ru: "wissen входит в небольшую смешанную группу: новая гласная, как у сильного глагола, плюс слабые окончания на -te — wusste. bringen → brachte и denken → dachte устроены так же."
      uk: "wissen входить до невеликої мішаної групи: нова голосна, як у сильного дієслова, плюс слабкі закінчення на -te — wusste. bringen → brachte і denken → dachte влаштовані так само."
      de: "wissen gehört zur kleinen gemischten Gruppe: ein neuer Vokal wie bei einem starken Verb, dazu die schwachen Endungen auf -te — wusste. bringen → brachte und denken → dachte folgen demselben Rezept."

  - id: mc-ging-gehte
    outcomes: [praeteritum-erzaehlen]
    type: mc
    focus: praeteritum-vollverben
    prompt: "Nach dem Anruf ___ ich langsam nach Hause."
    options:
      - "ging"
      - "gehte"
    correct: 0
    translation:
      en: "After the phone call I walked home slowly."
      ru: "После звонка я медленно пошёл домой."
      uk: "Після дзвінка я повільно пішов додому."
    explain:
      en: "A strong verb never takes -te: gehen changes its vowel instead — ging. gehte is the regularization every learner tries once; the strong forms simply have to be known."
      ru: "Сильный глагол никогда не берёт -te: gehen вместо этого меняет гласную — ging. gehte — регуляризация, которую каждый пробует один раз; сильные формы приходится просто знать."
      uk: "Сильне дієслово ніколи не бере -te: gehen натомість змінює голосну — ging. gehte — регуляризація, яку кожен пробує один раз; сильні форми доводиться просто знати."
      de: "Ein starkes Verb nimmt nie -te: gehen wechselt stattdessen den Vokal — ging. Die Form gehte überträgt einfach das Muster von machen → machte auf ein starkes Verb; im Deutschen gibt es sie nicht. Die starken Formen muss man einzeln kennen."

  - id: mc-nachdem-tense
    outcomes: [vorzeitigkeit-ausdruecken]
    type: mc
    focus: plusquamperfekt-nachdem
    prompt: "Nachdem ich die E-Mail ___, rief ich sofort zurück."
    options:
      - "gelesen hatte"
      - "las"
    correct: 0
    translation:
      en: "After I had read the e-mail, I called back immediately."
      ru: "После того как я прочитал письмо, я сразу перезвонил."
      uk: "Після того як я прочитав листа, я одразу передзвонив."
    explain:
      en: "nachdem demands the tense staircase: its clause stands one step earlier than the main clause — Plusquamperfekt (gelesen hatte) against Präteritum (rief). With las, both events land on the same step and the before/after the sentence promises disappears."
      ru: "nachdem требует лестницы времён: его придаточное стоит на ступень раньше главного — Plusquamperfekt (gelesen hatte) против Präteritum (rief). С las оба события оказываются на одной ступени, и обещанное предложением «до/после» исчезает."
      uk: "nachdem вимагає сходів часів: його підрядне стоїть на сходинку раніше за головне — Plusquamperfekt (gelesen hatte) проти Präteritum (rief). З las обидві події опиняються на одній сходинці, і обіцяне реченням «до/після» зникає."
      de: "nachdem verlangt die Zeitentreppe: Sein Nebensatz steht eine Stufe früher als der Hauptsatz — Plusquamperfekt (gelesen hatte) gegen Präteritum (rief). Mit las landen beide Ereignisse auf derselben Stufe, und der zeitliche Abstand, den nachdem verspricht, verschwindet."

  - id: cloze-gegessen-hatten
    outcomes: [vorzeitigkeit-ausdruecken]
    type: cloze
    focus: plusquamperfekt-nachdem
    instruction:
      en: "essen in the tense the nachdem-clause demands — two gaps, participle first."
      ru: "essen в том времени, которого требует придаточное с nachdem, — два пропуска, сначала причастие."
      uk: "essen у тому часі, якого вимагає підрядне з nachdem, — два пропуски, спочатку дієприкметник."
      de: "essen in dem Tempus, das der nachdem-Satz verlangt — zwei Lücken, zuerst das Partizip."
    text: "Nachdem wir {{gegessen}} {{hatten}}, machten wir einen langen Spaziergang."
    translation:
      en: "After we had eaten, we took a long walk."
      ru: "После того как мы поели, мы отправились на долгую прогулку."
      uk: "Після того як ми поїли, ми вирушили на довгу прогулянку."
    explain:
      en: "The Plusquamperfekt is built from parts you own: hatten (Präteritum of haben) + gegessen. In the Nebensatz the conjugated hatten walks to the very end, behind the participle — gegessen hatten, never hatten gegessen."
      ru: "Plusquamperfekt собирается из знакомых деталей: hatten (Präteritum от haben) + gegessen. В придаточном спрягаемое hatten уходит в самый конец, за причастие — gegessen hatten, и никогда hatten gegessen."
      uk: "Plusquamperfekt збирається зі знайомих деталей: hatten (Präteritum від haben) + gegessen. У підрядному відмінюване hatten іде в самий кінець, за дієприкметник — gegessen hatten, і ніколи hatten gegessen."
      de: "Das Plusquamperfekt besteht aus bekannten Teilen: hatten (Präteritum von haben) + gegessen. Im Nebensatz wandert das konjugierte hatten ganz ans Ende, hinter das Partizip — gegessen hatten, nie hatten gegessen."

  - id: cloze-war-abgefahren
    outcomes: [vorzeitigkeit-ausdruecken]
    type: cloze
    focus: plusquamperfekt-nachdem
    instruction:
      en: "abfahren, one step before the past — mind the auxiliary."
      ru: "abfahren, на шаг раньше прошлого — следите за вспомогательным глаголом."
      uk: "abfahren, на крок раніше за минуле — стежте за допоміжним дієсловом."
      de: "abfahren, eine Stufe vor der Vergangenheit — achte auf das Hilfsverb."
    text: "Der Bus {{war}} schon {{abgefahren}}, als ich an der Haltestelle ankam."
    translation:
      en: "The bus had already left when I arrived at the stop."
      ru: "Автобус уже уехал, когда я пришёл на остановку."
      uk: "Автобус уже поїхав, коли я прийшов на зупинку."
    explain:
      en: "Movement takes sein — in the Plusquamperfekt that means war: Der Bus war abgefahren. The auxiliary rule is the one Perfekt taught you; only its tense moved one step back."
      ru: "Движение берёт sein — в Plusquamperfekt это значит war: Der Bus war abgefahren. Правило выбора вспомогательного — то же, что в Perfekt; на шаг назад сдвинулось только его время."
      uk: "Рух бере sein — у Plusquamperfekt це означає war: Der Bus war abgefahren. Правило вибору допоміжного — те саме, що в Perfekt; на крок назад зсунувся лише його час."
      de: "Bewegung nimmt sein — im Plusquamperfekt heißt das war: Der Bus war abgefahren. Die Regel für das Hilfsverb ist dieselbe wie im Perfekt; nur sein Tempus rückt eine Stufe zurück."

  - id: order-waehrend
    outcomes: [praeteritum-erzaehlen]
    type: order
    focus: temporal-nebensatz
    instruction:
      en: "Arrange the words — the während-clause comes first."
      ru: "Составьте предложение — придаточное с während идёт первым."
      uk: "Складіть речення — підрядне з während іде першим."
      de: "Ordne die Wörter — der während-Satz steht vorn."
    words: ["Während", "ich", "auf", "den", "Bus", "wartete,", "las", "ich", "die", "Nachrichten."]
    translation:
      en: "While I was waiting for the bus, I read the news."
      ru: "Пока я ждал автобус, я читал новости."
      uk: "Поки я чекав на автобус, я читав новини."
    explain:
      en: "während opens a Nebensatz, so wartete stands at its end. The whole clause then fills position 1 of the main sentence — which is why las comes immediately after the comma, before the second ich."
      ru: "während открывает придаточное, поэтому wartete встаёт в его конец. Всё придаточное занимает первое место главного предложения — поэтому las идёт сразу после запятой, перед вторым ich."
      uk: "während відкриває підрядне, тому wartete стає в його кінець. Усе підрядне займає перше місце головного речення — тому las іде одразу після коми, перед другим ich."
      de: "während eröffnet einen Nebensatz, also steht wartete an dessen Ende. Der ganze Nebensatz besetzt dann Position 1 des Hauptsatzes — deshalb folgt las direkt nach dem Komma, noch vor dem zweiten ich."

  - id: mc-waehrend-bis
    outcomes: [praeteritum-erzaehlen]
    type: mc
    focus: temporal-nebensatz
    prompt: "___ ich frühstückte, hörte ich die Nachrichten im Radio."
    options:
      - "Während"
      - "Bis"
    correct: 0
    translation:
      en: "While I was having breakfast, I listened to the news on the radio."
      ru: "Пока я завтракал, я слушал новости по радио."
      uk: "Поки я снідав, я слухав новини по радіо."
    explain:
      en: "Two actions running side by side take während (while). bis closes an interval — Ich hörte Radio, bis das Frühstück fertig war — and would claim the listening stopped when breakfast began."
      ru: "Два параллельных действия соединяет während («пока»). bis закрывает интервал — Ich hörte Radio, bis das Frühstück fertig war — и означал бы, что слушание закончилось, когда начался завтрак."
      uk: "Дві паралельні дії з'єднує während («поки»). bis закриває інтервал — Ich hörte Radio, bis das Frühstück fertig war — і означав би, що слухання скінчилося, коли почався сніданок."
      de: "Für zwei Handlungen, die nebeneinander laufen, steht während. bis schließt dagegen einen Zeitraum ab — Ich hörte Radio, bis das Frühstück fertig war — und behauptet hier, das Radiohören endete genau dann, als das Frühstück begann."

  - id: uebersetzen-praeteritum-bahnhof
    outcomes: [praeteritum-erzaehlen]
    type: translate
    focus: praeteritum-vollverben
    instruction:
      en: "Translate as written narrative — Präteritum."
      ru: "Переведите как письменный рассказ — в Präteritum."
      uk: "Перекладіть як письмову розповідь — у Präteritum."
      de: "Übersetze als geschriebene Erzählung — im Präteritum."
    prompt_en: "Yesterday I went to the station and waited for my friend."
    prompt_ru: "Вчера я пошёл на вокзал и ждал своего друга."
    prompt_uk: "Учора я пішов на вокзал і чекав на свого друга."
    answer: "Gestern ging ich zum Bahnhof und wartete auf meinen Freund."
    accept:
      - "Ich ging gestern zum Bahnhof und wartete auf meinen Freund."
      - "Gestern ging ich zum Bahnhof und wartete dort auf meinen Freund."
    key_tokens: ["ging", "wartete"]
    explain:
      en: "One strong form, one weak form: ging (vowel change, no -te) and wartete (-ete after the -t- stem). Only the two verbs are graded — the narrative register is the rule here, and warten auf with the accusative comes with it from A2."
      ru: "Одна сильная форма, одна слабая: ging (смена гласной, без -te) и wartete (-ete после основы на -t-). Оцениваются только два глагола — правило здесь именно повествовательный регистр, а warten auf с Akkusativ приходит из A2."
      uk: "Одна сильна форма, одна слабка: ging (зміна голосної, без -te) і wartete (-ete після основи на -t-). Оцінюються лише два дієслова — правило тут саме оповідний регістр, а warten auf з Akkusativ приходить з A2."
      de: "Eine starke und eine schwache Form: ging (Vokalwechsel, kein -te) und wartete (-ete nach dem Stamm auf -t-). Nur diese beiden Verben zählen — die Regel heißt hier Erzählregister, und warten auf mit Akkusativ kommt schon aus A2 mit."

  - id: uebersetzen-nachdem-bericht
    outcomes: [vorzeitigkeit-ausdruecken]
    type: translate
    focus: plusquamperfekt-nachdem
    instruction:
      en: "Translate. Express the earlier event with nachdem."
      ru: "Переведите. Более раннее событие выразите через nachdem."
      uk: "Перекладіть. Ранішу подію виразіть через nachdem."
      de: "Übersetze. Drücke das frühere Ereignis mit nachdem aus."
    prompt_en: "After I had written the report, I went home."
    prompt_ru: "После того как я написал отчёт, я пошёл домой."
    prompt_uk: "Після того як я написав звіт, я пішов додому."
    answer: "Nachdem ich den Bericht geschrieben hatte, ging ich nach Hause."
    accept:
      - "Ich ging nach Hause, nachdem ich den Bericht geschrieben hatte."
    key_tokens: ["geschrieben", "hatte"]
    explain:
      en: "The staircase in one sentence: geschrieben hatte (Plusquamperfekt, the earlier event, conjugated verb at the wall) — then ging, one step later. Graded are the two words of the Plusquamperfekt, in exactly that order."
      ru: "Лестница в одном предложении: geschrieben hatte (Plusquamperfekt, более раннее событие, спрягаемый глагол у стены) — затем ging, ступенькой позже. Оцениваются два слова Plusquamperfekt, именно в этом порядке."
      uk: "Сходи в одному реченні: geschrieben hatte (Plusquamperfekt, раніша подія, відмінюване дієслово біля стіни) — потім ging, сходинкою пізніше. Оцінюються два слова Plusquamperfekt, саме в цьому порядку."
      de: "Die Treppe in einem Satz: geschrieben hatte (Plusquamperfekt, das frühere Ereignis, das konjugierte Verb ganz am Ende) — dann ging, eine Stufe später. Es zählen die beiden Wörter des Plusquamperfekts, genau in dieser Reihenfolge."

  - id: uebersetzen-waehrend-regen
    outcomes: [praeteritum-erzaehlen]
    type: translate
    focus: temporal-nebensatz
    instruction:
      en: "Translate. Join the clauses with während."
      ru: "Переведите. Соедините части через während."
      uk: "Перекладіть. З'єднайте частини через während."
      de: "Übersetze. Verbinde die Teilsätze mit während."
    prompt_en: "While we were waiting, it began to rain."
    prompt_ru: "Пока мы ждали, начался дождь."
    prompt_uk: "Поки ми чекали, почався дощ."
    answer: "Während wir warteten, begann es zu regnen."
    accept:
      - "Es begann zu regnen, während wir warteten."
      - "Während wir warteten, fing es an zu regnen."
      - "Es fing an zu regnen, während wir warteten."
    key_tokens: ["Während", "warteten"]
    explain:
      en: "während opens a Nebensatz: warteten goes to its end. Graded are the doorway and the wall — Während and the clause-final warteten. Whether the rain beginnt or fängt an is vocabulary, not the rule."
      ru: "während открывает придаточное: warteten уходит в его конец. Оцениваются вход и стена — Während и конечное warteten. Начинается ли дождь через beginnen или anfangen — вопрос лексики, а не правила."
      uk: "während відкриває підрядне: warteten іде в його кінець. Оцінюються вхід і стіна — Während і кінцеве warteten. Починається дощ через beginnen чи anfangen — питання лексики, а не правила."
      de: "während eröffnet einen Nebensatz: warteten geht an dessen Ende. Es zählen beide Enden der Satzklammer — Während am Anfang und warteten ganz am Schluss. Ob der Regen beginnt oder anfängt, ist Wortschatz, nicht Regel."

  - id: cloze-als-kind-hatte
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-sein-haben
    instruction:
      en: "The A2 core still carries the story: haben and sein in the Präteritum."
      ru: "Ядро A2 по-прежнему держит рассказ: haben и sein в Präteritum."
      uk: "Ядро A2 так само тримає розповідь: haben і sein у Präteritum."
      de: "Der A2-Kern trägt die Geschichte weiter: haben und sein im Präteritum."
    text: "Als Kind {{hatte}} ich einen Hund, und wir {{waren}} jeden Tag im Park."
    translation:
      en: "As a child I had a dog, and we were in the park every day."
      ru: "В детстве у меня была собака, и мы каждый день были в парке."
      uk: "У дитинстві в мене був пес, і ми щодня були в парку."
    explain:
      en: "hatte and waren are the A2 Präteritum core — nothing about them changes at B1. The new full-verb forms join them; they do not replace them."
      ru: "hatte и waren — ядро Präteritum из A2, и на B1 в них ничего не меняется. Новые формы полнозначных глаголов присоединяются к ним, а не заменяют их."
      uk: "hatte і waren — ядро Präteritum з A2, і на B1 у них нічого не змінюється. Нові форми повнозначних дієслів приєднуються до них, а не заміняють їх."
      de: "hatte und waren sind der Präteritum-Kern aus A2 — auf B1 ändert sich daran nichts. Die neuen Formen der Vollverben treten dazu; sie lösen den Kern nicht ab."

