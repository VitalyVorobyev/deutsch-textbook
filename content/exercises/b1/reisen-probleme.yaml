# B1.8 primary practice. The three new tags close the unit's two contract points
# (konjunktiv2-irreal → konjunktiv2-form + irreale-bedingung; praeposition-genitiv).
# Two items recycle earlier tags and close nothing: uebersetzen-anschluss-perfekt
# (perfekt-satzklammer) is the live runtime channel of the `deepens` edge to
# reisen-verkehr — the Panne is reported in the Perfekt, and the bracket is the A2
# confusion this unit re-arms inside the report; uebersetzen-an-deiner-stelle
# (konjunktiv2-ratschlag) carries the edge to gesundheit-wohlbefinden, whose practice
# drills the advice machine this unit's article unmasks as a shrunken wenn-half.
# Outcome discipline, because probe families arm by outcome (src/lib/probes.ts): every
# item on `beschwerde-schreiben` produces the polite Konjunktiv II of the written
# complaint, every item on `irreale-bedingung-nutzen` builds an unreal condition (or
# its an-deiner-Stelle short form), every item on `panne-berichten` reports the
# disruption — the genitive prepositions and the Perfekt bracket. Nothing arms a
# family whose competence it does not touch.
# Format ladder per the B1.5/B1.6 read of the audit (translate 41%, cloze strong):
# each point runs cloze → mc → translate. order is saturated per the standing backlog
# ruling, so the practice union ships zero order items. KII discipline from the
# contract's exclude line: no one-word Konjunktiv II of full verbs in any answer or
# accept (no fände/ginge/käme) — würde + Infinitiv is the graded shape for full verbs,
# hätte/wäre and the core modals the one-word set.
# This set is the primaryPractice — its item list never grows after shipping.
topic: reisen-probleme
role: practice
title:
  en: "Practice — both halves unreal, the cause in the genitive"
  ru: "Практика — обе половины ирреальны, причина в родительном"
  uk: "Практика — обидві половини ірреальні, причина в родовому"
  de: "Übung — beide Hälften irreal, der Grund im Genitiv"
items:
  - id: cloze-anderes-zimmer
    outcomes: [beschwerde-schreiben]
    type: cloze
    focus: konjunktiv2-form
    instruction:
      en: "A line from the complaint letter — fill in the Konjunktiv II of sein and of können."
      ru: "Строка из письма-жалобы — впишите Konjunktiv II глаголов sein и können."
      uk: "Рядок із листа-скарги — впишіть Konjunktiv II дієслів sein і können."
      de: "Eine Zeile aus dem Beschwerdebrief — ergänze den Konjunktiv II von sein und von können."
    text: "Es {{wäre}} gut, wenn Sie mir ein anderes Zimmer geben {{könnten}}."
    translation:
      en: "It would be good if you could give me a different room."
      ru: "Было бы хорошо, если бы вы дали мне другой номер."
      uk: "Було б добре, якби ви дали мені інший номер."
    explain:
      en: "Two one-word forms from one recipe: the Präteritum with an umlaut and the Konjunktiv -e. konnten becomes könnten by the dots alone; war gains both the dots and the ending — wäre. Bare war and konnten would report the past instead of asking politely. The wenn-clause keeps its old word order: the conjugated könnten stands at the very end, after geben."
      ru: "Две однословные формы по одному рецепту: Präteritum плюс умлаут и конъюнктивное -e. konnten становится könnten одними точками; war получает и точки, и окончание — wäre. Голые war и konnten рассказывали бы о прошлом, а не просили вежливо. Придаточное с wenn сохраняет знакомый порядок: спрягаемое könnten стоит в самом конце, после geben."
      uk: "Дві однослівні форми за одним рецептом: Präteritum плюс умлаут і кон'юнктивне -e. konnten стає könnten самими крапками; war отримує і крапки, і закінчення — wäre. Голі war і konnten розповідали б про минуле, а не просили ввічливо. Підрядне з wenn зберігає знайомий порядок: відмінюване könnten стоїть у самому кінці, після geben."
      de: "Zwei Einwortformen nach einem Rezept: das Präteritum mit Umlaut und Konjunktiv-e. Aus konnten wird könnten allein durch die Punkte; war bekommt beides, Punkte und Endung — wäre. Bloßes war und konnten würden Vergangenheit melden, statt höflich zu bitten. Der wenn-Satz behält seine alte Ordnung: Das konjugierte könnten steht ganz am Ende, nach geben."

  - id: mc-wuerde-bitten
    outcomes: [beschwerde-schreiben]
    type: mc
    focus: konjunktiv2-form
    prompt: "Ich ___ Sie bitten, die Klimaanlage noch heute zu reparieren."
    options:
      - "würde"
      - "wurde"
      - "werden"
    correct: 0
    translation:
      en: "I would ask you to repair the air conditioning today."
      ru: "Я попросила бы вас починить кондиционер ещё сегодня."
      uk: "Я попросила б вас полагодити кондиціонер ще сьогодні."
    explain:
      en: "würde with the umlaut is the polite letter's workhorse: Ich würde Sie bitten softens a demand into a request. wurde without the dots is the Präteritum of werden — it would report a past change and cannot govern this sentence. werden is an infinitive and leaves ich with no conjugated verb at all."
      ru: "würde с умлаутом — рабочая лошадка вежливого письма: Ich würde Sie bitten превращает требование в просьбу. wurde без точек — Präteritum глагола werden: он сообщал бы о прошлой перемене и этим предложением управлять не может. werden — инфинитив, он оставил бы ich вовсе без спрягаемого глагола."
      uk: "würde з умлаутом — робочий кінь ввічливого листа: Ich würde Sie bitten перетворює вимогу на прохання. wurde без крапок — Präteritum дієслова werden: воно повідомляло б про минулу зміну і цим реченням керувати не може. werden — інфінітив, воно залишило б ich зовсім без відмінюваного дієслова."
      de: "würde mit Umlaut ist das Arbeitspferd des höflichen Briefs: Ich würde Sie bitten macht aus einer Forderung eine Bitte. wurde ohne Punkte ist das Präteritum von werden — es würde eine vergangene Veränderung melden und kann diesen Satz nicht regieren. werden ist ein Infinitiv und ließe ich ganz ohne konjugiertes Verb zurück."

  - id: uebersetzen-freuen
    outcomes: [beschwerde-schreiben]
    type: translate
    focus: konjunktiv2-form
    instruction:
      en: "Translate the closing line of a complaint letter — use Sie; for 'be glad' take sich freuen, for 'answer' antworten."
      ru: "Переведите финальную строку письма-жалобы — используйте Sie; для «быть рад» возьмите sich freuen, для «ответить» — antworten."
      uk: "Перекладіть фінальний рядок листа-скарги — використайте Sie; для «бути радим» візьміть sich freuen, для «відповісти» — antworten."
      de: "Übersetze die Schlusszeile eines Beschwerdebriefs — mit Sie; für die Freude nimm sich freuen, für die Antwort antworten."
    prompt_en: "I would be glad if you could answer me by Friday."
    prompt_ru: "Я была бы рада, если бы вы могли ответить мне до пятницы."
    prompt_uk: "Я була б рада, якби ви могли відповісти мені до п'ятниці."
    answer: "Ich würde mich freuen, wenn Sie mir bis Freitag antworten könnten."
    accept:
      # "answer" alone renders antworten with or without the recoverable mir,
      # and bis zum Freitag renders the deadline as correctly as bis Freitag.
      - "Ich würde mich freuen, wenn Sie bis Freitag antworten könnten."
      - "Ich würde mich freuen, wenn Sie mir bis zum Freitag antworten könnten."
      - "Ich würde mich freuen, wenn Sie bis zum Freitag antworten könnten."
    key_tokens: ["würde", "könnten"]
    explain:
      en: "Graded are the two Konjunktiv forms the letter's closing move runs on: würde opening the main clause and könnten closing the wenn-clause. Everything else is carrier. Note that each half carries its own marked form — the politeness does not stop at the comma. bis Freitag sits in the middle field, where its position is free."
      ru: "Оцениваются две формы конъюнктива, на которых держится финальный ход письма: würde открывает главное предложение, könnten закрывает придаточное с wenn. Всё остальное — носитель. Обратите внимание: каждая половина несёт свою помеченную форму — вежливость не заканчивается на запятой. bis Freitag стоит в середине, где порядок свободен."
      uk: "Оцінюються дві форми кон'юнктива, на яких тримається фінальний хід листа: würde відкриває головне речення, könnten закриває підрядне з wenn. Усе інше — носій. Зверніть увагу: кожна половина несе свою позначену форму — ввічливість не закінчується на комі. bis Freitag стоїть у середині, де порядок вільний."
      de: "Bewertet werden die zwei Konjunktivformen, die den Schlusszug des Briefs tragen: würde eröffnet den Hauptsatz, könnten schließt den wenn-Satz. Alles andere ist Träger. Beachte: Jede Hälfte trägt ihre eigene markierte Form — die Höflichkeit endet nicht am Komma. bis Freitag steht im Mittelfeld, wo die Stellung frei ist."

  - id: cloze-wenn-puenktlich
    outcomes: [irreale-bedingung-nutzen]
    type: cloze
    focus: irreale-bedingung
    instruction:
      en: "The unreal condition — fill in the Konjunktiv II of sein in the wenn-half and the plural helper that erreichen needs in the main half."
      ru: "Нереальное условие — впишите Konjunktiv II глагола sein в половине с wenn и вспомогательный глагол во множественном числе, который нужен erreichen, в главной половине."
      uk: "Нереальна умова — впишіть Konjunktiv II дієслова sein у половині з wenn і допоміжне дієслово у множині, яке потрібне erreichen, у головній половині."
      de: "Die irreale Bedingung — ergänze den Konjunktiv II von sein im wenn-Satz und das Hilfsverb im Plural, das erreichen im Hauptsatz braucht."
    text: "Wenn der Zug pünktlich {{wäre}}, {{würden}} wir den Anschluss noch erreichen."
    translation:
      en: "If the train were on time, we would still make the connection."
      ru: "Если бы поезд шёл вовремя, мы бы ещё успели на пересадку."
      uk: "Якби поїзд ішов вчасно, ми б ще встигли на пересадку."
    explain:
      en: "Both halves carry Konjunktiv II — that is the whole rule. sein brings its one-word form wäre into the wenn-clause; the full verb erreichen has none, so the main clause borrows würden, agreeing with wir. An indicative in either half (ist … or werden …) would make the sentence real again — and reality already said no."
      ru: "Konjunktiv II несут обе половины — в этом всё правило. sein приносит в придаточное однословную форму wäre; у полнозначного erreichen её нет, поэтому главное предложение одалживает würden, согласованное с wir. Индикатив в любой половине (ist … или werden …) снова сделал бы предложение реальным — а реальность уже сказала «нет»."
      uk: "Konjunktiv II несуть обидві половини — у цьому все правило. sein приносить у підрядне однослівну форму wäre; у повнозначного erreichen її немає, тому головне речення позичає würden, узгоджене з wir. Індикатив у будь-якій половині (ist … або werden …) знову зробив би речення реальним — а реальність уже сказала «ні»."
      de: "Beide Hälften tragen Konjunktiv II — das ist die ganze Regel. sein bringt seine Einwortform wäre in den wenn-Satz; das Vollverb erreichen hat keine, also leiht sich der Hauptsatz würden, im Plural zu wir. Ein Indikativ in einer der Hälften (ist … oder werden …) machte den Satz wieder real — und die Wirklichkeit hat schon Nein gesagt."

  - id: mc-beide-haelften
    outcomes: [irreale-bedingung-nutzen]
    type: mc
    focus: irreale-bedingung
    prompt: "Wenn die Klimaanlage funktionieren würde, ___ ich das Fenster schließen."
    options:
      - "könnte"
      - "kann"
      - "konnte"
    correct: 0
    translation:
      en: "If the air conditioning worked, I could close the window."
      ru: "Если бы кондиционер работал, я мог бы закрыть окно."
      uk: "Якби кондиціонер працював, я міг би зачинити вікно."
    explain:
      en: "The wenn-half has already opened an unreal world with funktionieren würde, so the main half must stay inside it: könnte. kann is indicative — it claims the closing is really possible, which the broken Klimaanlage denies. konnte is the indicative past and reports what once was. Only the umlauted form keeps both halves unreal."
      ru: "Половина с wenn уже открыла нереальный мир формой funktionieren würde, поэтому главная половина обязана в нём остаться: könnte. kann — индикатив: он утверждает, что закрыть окно действительно можно, а сломанный кондиционер это отрицает. konnte — индикатив прошедшего, он сообщает, как было раньше. Нереальными обе половины держит только форма с умлаутом."
      uk: "Половина з wenn уже відкрила нереальний світ формою funktionieren würde, тому головна половина мусить у ньому лишитися: könnte. kann — індикатив: воно стверджує, що зачинити вікно справді можна, а зламаний кондиціонер це заперечує. konnte — індикатив минулого, воно повідомляє, як було раніше. Нереальними обидві половини тримає лише форма з умлаутом."
      de: "Die wenn-Hälfte hat mit funktionieren würde schon eine irreale Welt eröffnet, also muss die Haupthälfte darin bleiben: könnte. kann ist Indikativ — es behauptet, das Schließen sei wirklich möglich, was die kaputte Klimaanlage gerade verneint. konnte ist das Präteritum und meldet, wie es einmal war. Nur die Umlautform hält beide Hälften irreal."

  - id: uebersetzen-wenn-zimmer
    revision: 2
    outcomes: [irreale-bedingung-nutzen]
    type: translate
    focus: irreale-bedingung
    instruction:
      en: "Translate — use ruhig for 'quiet' and schlafen with würde + infinitive."
      ru: "Переведите — для «тихий» используйте ruhig, для «спать» — schlafen с würde + инфинитив."
      uk: "Перекладіть — для «тихий» використайте ruhig, для «спати» — schlafen із würde + інфінітив."
      de: "Übersetze — für das Adjektiv nimm ruhig, für das Verb schlafen mit würde + Infinitiv."
    prompt_en: "If the room were quieter, I would sleep better."
    prompt_ru: "Если бы комната была тише, я бы спал лучше."
    prompt_uk: "Якби кімната була тихішою, я спав би краще."
    answer: "Wenn das Zimmer ruhiger wäre, würde ich besser schlafen."
    accept:
      - "Wenn das Zimmer ruhiger wäre, dann würde ich besser schlafen."
      - "Ich würde besser schlafen, wenn das Zimmer ruhiger wäre."
      # The wenn-less verb-first protasis is the same unreal condition, both halves marked.
      - "Wäre das Zimmer ruhiger, würde ich besser schlafen."
      - "Wäre das Zimmer ruhiger, dann würde ich besser schlafen."
    key_tokens: ["wäre", "Wäre", "würde"]
    explain:
      en: "Graded are the two markers, one per half: wäre in the wenn-clause and würde in the main clause. English splits its marking — a plain past in the if-half, 'would' only in the main half; German symmetry demands a Konjunktiv II verb on both sides. The clause order is free — main clause first is accepted — but neither half may fall back into the indicative."
      ru: "Оцениваются два маркера, по одному на половину: wäre в придаточном с wenn и würde в главном. Русское «бы» — одна неизменная частица на всё предложение, а немецкая симметрия требует помеченного глагола с обеих сторон. Порядок частей свободен — главное предложение первым принимается, — но ни одна половина не может вернуться в индикатив."
      uk: "Оцінюються два маркери, по одному на половину: wäre в підрядному з wenn і würde в головному. Українська частка «б/би» — одна незмінна на все речення, а німецька симетрія вимагає позначеного дієслова з обох боків. Порядок частин вільний — головне речення першим приймається, — але жодна половина не може повернутися в індикатив."
      de: "Bewertet werden die zwei Markierungen, eine pro Hälfte: wäre im wenn-Satz und würde im Hauptsatz. Viele Sprachen verteilen ihre Markierung ungleich auf die Hälften; die deutsche Symmetrie verlangt auf beiden Seiten ein Konjunktiv-II-Verb. Die Satzfolge ist frei — Hauptsatz zuerst wird akzeptiert —, aber keine Hälfte darf in den Indikativ zurückfallen."

  - id: uebersetzen-an-deiner-stelle
    outcomes: [irreale-bedingung-nutzen]
    type: translate
    focus: konjunktiv2-ratschlag
    instruction:
      en: "Translate the advice — use the An deiner Stelle frame; for 'complain' take sich beschweren."
      ru: "Переведите совет — используйте рамку An deiner Stelle; для «пожаловаться» возьмите sich beschweren."
      uk: "Перекладіть пораду — використайте рамку An deiner Stelle; для «поскаржитися» візьміть sich beschweren."
      de: "Übersetze den Rat — mit dem Rahmen An deiner Stelle; für das Verb nimm sich beschweren."
    prompt_en: "In your place I would complain to the hotel immediately."
    prompt_ru: "На твоём месте я бы сразу пожаловался в отель."
    prompt_uk: "На твоєму місці я б одразу поскаржився в готель."
    answer: "An deiner Stelle würde ich mich sofort beim Hotel beschweren."
    accept:
      - "Ich würde mich an deiner Stelle sofort beim Hotel beschweren."
      # gleich renders «сразу» as idiomatically as sofort.
      - "An deiner Stelle würde ich mich gleich beim Hotel beschweren."
      - "Ich würde mich an deiner Stelle gleich beim Hotel beschweren."
    key_tokens: ["würde", "beschweren"]
    explain:
      en: "B1.3's advice machine, and this unit shows what it always was: an unreal condition whose wenn-half (if I were you) has shrunk to an deiner Stelle. Graded are the two ends of the bracket — würde in second position, the infinitive beschweren at the wall. The complaint itself goes to the responsible party: sich beschweren bei + Dativ."
      ru: "Машина совета из B1.3 — и эта глава показывает, чем она всегда была: нереальным условием, у которого половина с wenn («будь я на твоём месте») сжалась до an deiner Stelle. Оцениваются два конца рамки: würde на втором месте, инфинитив beschweren у стены. Сама жалоба идёт ответственной стороне: sich beschweren bei + Dativ."
      uk: "Машина поради з B1.3 — і цей розділ показує, чим вона завжди була: нереальною умовою, у якої половина з wenn («якби я був на твоєму місці») стислася до an deiner Stelle. Оцінюються два кінці рамки: würde на другому місці, інфінітив beschweren біля стіни. Сама скарга йде відповідальній стороні: sich beschweren bei + Dativ."
      de: "Die Ratschlag-Maschine aus B1.3 — und diese Einheit zeigt, was sie immer war: eine irreale Bedingung, deren wenn-Hälfte (wenn ich du wäre) zu an deiner Stelle geschrumpft ist. Bewertet werden die zwei Enden der Klammer: würde auf Position 2, der Infinitiv beschweren an der Wand. Die Beschwerde selbst geht an die verantwortliche Seite: sich beschweren bei + Dativ."

  - id: cloze-wegen-streik
    outcomes: [panne-berichten]
    type: cloze
    focus: praeposition-genitiv
    instruction:
      en: "The announcement names its cause with wegen — fill in the preposition and the genitive article (der Streik is masculine)."
      ru: "Объявление называет причину предлогом wegen — впишите предлог и артикль в родительном падеже (der Streik — мужской род)."
      uk: "Оголошення називає причину прийменником wegen — впишіть прийменник і артикль у родовому відмінку (der Streik — чоловічий рід)."
      de: "Die Durchsage nennt ihren Grund mit wegen — ergänze die Präposition und den Genitiv-Artikel (der Streik ist maskulin)."
    text: "{{Wegen}} {{des}} Streiks fahren heute nur wenige Züge nach Hamburg."
    translation:
      en: "Because of the strike only a few trains are going to Hamburg today."
      ru: "Из-за забастовки в Гамбург сегодня идут лишь немногие поезда."
      uk: "Через страйк до Гамбурга сьогодні йдуть лише деякі поїзди."
    explain:
      en: "wegen compresses the whole cause into one noun phrase — no weil-clause, no second verb — and in writing it governs the genitive: masculine der becomes des, and the noun itself carries -s: des Streiks. Spoken German says wegen dem Streik; the announcement board and the complaint letter are exactly the registers the genitive exists for."
      ru: "wegen сжимает всю причину в одну именную группу — без придаточного с weil, без второго глагола — и на письме управляет родительным: мужское der становится des, а само существительное несёт -s: des Streiks. В разговорной речи говорят wegen dem Streik; табло объявлений и письмо-жалоба — ровно те регистры, ради которых существует Genitiv."
      uk: "wegen стискає всю причину в одну іменну групу — без підрядного з weil, без другого дієслова — і на письмі керує родовим: чоловіче der стає des, а сам іменник несе -s: des Streiks. У розмовному мовленні кажуть wegen dem Streik; табло оголошень і лист-скарга — рівно ті регістри, заради яких існує Genitiv."
      de: "wegen presst den ganzen Grund in eine Nominalgruppe — kein weil-Satz, kein zweites Verb — und regiert schriftlich den Genitiv: Aus dem maskulinen der wird des, und das Nomen selbst trägt -s: des Streiks. Gesprochen hört man wegen dem Streik; die Anzeigetafel und der Beschwerdebrief sind genau die Register, für die der Genitiv da ist."

