      ru: "После пропуска стоит именная группа — der Verspätung, — значит, там может стоять только предлог: trotz + Genitiv. trotzdem — наречие: оно бросает вызов целому предыдущему предложению с первой позиции и существительным управлять не может. weil — союз, он открыл бы придаточное с глаголом в конце, а не именную группу — да и опоздание не причина успеть на автобус."
      uk: "Після пропуску стоїть іменна група — der Verspätung, — отже, там може стояти лише прийменник: trotz + Genitiv. trotzdem — прислівник: воно кидає виклик цілому попередньому реченню з першої позиції та іменником керувати не може. weil — сполучник, воно відкрило б підрядне з дієсловом у кінці, а не іменну групу — та й запізнення не причина встигнути на автобус."
