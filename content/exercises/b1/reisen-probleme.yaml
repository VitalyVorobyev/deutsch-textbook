      - "Im Zimmer war es während der Nacht sehr laut."
      - "Es war während der Nacht im Zimmer sehr laut."
      - "Es war während der Nacht sehr laut im Zimmer."
    key_tokens: ["Während", "während", "der"]
    explain:
      en: "Graded are the preposition and its case: während + Genitiv, and feminine die Nacht shows the genitive in its article — der Nacht. The trap is the dative der looks identical to; what decides is that this der is the genitive of die, demanded by während in writing. The rest of the sentence may move freely, and the fronted variants are accepted."
      ru: "Оцениваются предлог и его падеж: während + Genitiv, и женское die Nacht показывает родительный в артикле — der Nacht. Как и русское «во время», während требует родительного — здесь родной язык союзник. Решает то, что этот der — родительный от die, которого на письме требует während. Остальное предложение свободно, вынесенные варианты принимаются."
      uk: "Оцінюються прийменник і його відмінок: während + Genitiv, і жіноче die Nacht показує родовий в артиклі — der Nacht. Як і українське «під час», während вимагає родового — тут рідна мова союзник. Вирішує те, що цей der — родовий від die, якого на письмі вимагає während. Решта речення вільна, винесені варіанти приймаються."
      de: "Bewertet werden die Präposition und ihr Kasus: während + Genitiv, und das feminine die Nacht zeigt den Genitiv im Artikel — der Nacht. Die Falle ist der Dativ, der genauso aussieht; entscheidend ist, dass dieses der der Genitiv von die ist, den während schriftlich verlangt. Der Rest des Satzes darf sich bewegen, die umgestellten Varianten werden akzeptiert."

