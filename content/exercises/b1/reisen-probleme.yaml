    prompt_en: "During the night it was very loud in the room."
    prompt_ru: "Ночью в номере было очень шумно."
    prompt_uk: "Уночі в номері було дуже гучно."
    answer: "Während der Nacht war es im Zimmer sehr laut."
    accept:
