    explain:
      en: "Graded are wegen and the genitive it governs: feminine die Verspätung takes der — the same form the dative would show, but here it is the written genitive wegen demands. The Perfekt around it is carrier and has its own item. Fronting the wegen-phrase fills position 1, so haben follows immediately — both orders are accepted."
      ru: "Оцениваются wegen и родительный, которым он управляет: женское die Verspätung берёт der — форма совпадает с дательным, но здесь это письменный родительный, которого требует wegen. Perfekt вокруг — носитель, у него своё задание. Вынесенная группа с wegen занимает первую позицию, поэтому haben идёт сразу за ней — оба порядка принимаются."
      uk: "Оцінюються wegen і родовий, яким воно керує: жіноче die Verspätung бере der — форма збігається з давальним, але тут це письмовий родовий, якого вимагає wegen. Perfekt довкола — носій, у нього своє завдання. Винесена група з wegen займає першу позицію, тому haben іде одразу за нею — обидва порядки приймаються."
      de: "Bewertet werden wegen und der Genitiv, den es regiert: Das feminine die Verspätung nimmt der — dieselbe Form, die auch der Dativ zeigte, aber hier ist es der schriftliche Genitiv, den wegen verlangt. Das Perfekt darum herum ist Träger und hat seine eigene Aufgabe. Die vorangestellte wegen-Gruppe besetzt Position 1, also folgt haben sofort — beide Ordnungen werden akzeptiert."

