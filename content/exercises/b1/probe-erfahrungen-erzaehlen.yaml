# Delayed probe family: ONE competence — the Präteritum of full verbs in written
# narration — asked three ways, in sentences no practice item uses. Cloze-preferred
# for attribution: the frame is given, only the graded form is produced.
topic: erfahrungen-erzaehlen
role: probe
title:
  en: "Delayed check — the written past"
  ru: "Отложенная проверка — письменное прошедшее"
  uk: "Відкладена перевірка — письмове минуле"
  de: "Kontrolle mit Abstand — die geschriebene Vergangenheit"
items:
  - id: variant-a
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-vollverben
    instruction:
      en: "Written narrative: the Präteritum of sehen."
      ru: "Письменный рассказ: Präteritum глагола sehen."
      uk: "Письмова розповідь: Präteritum дієслова sehen."
      de: "Geschriebene Erzählung: das Präteritum von sehen."
    text: "Am Fenster {{sah}} ich einen fremden Mann im Garten."
    translation:
      en: "At the window I saw a strange man in the garden."
      ru: "В окно я увидел в саду незнакомого мужчину."
      uk: "У вікно я побачив у саду незнайомого чоловіка."
    explain:
      en: "sehen is strong: sah, a bare vowel change with no -te. In written narration this form, not habe gesehen, carries the story."
      ru: "sehen — сильный глагол: sah, чистая смена гласной без -te. В письменном повествовании историю несёт именно эта форма, а не habe gesehen."
      uk: "sehen — сильне дієслово: sah, чиста зміна голосної без -te. У письмовій оповіді історію несе саме ця форма, а не habe gesehen."
      de: "sehen ist stark: sah, ein reiner Vokalwechsel ohne -te. In einer geschriebenen Erzählung trägt diese Form die Geschichte, nicht habe gesehen."

  - id: variant-b
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-vollverben
    instruction:
      en: "Written narrative: the Präteritum of nehmen."
      ru: "Письменный рассказ: Präteritum глагола nehmen."
      uk: "Письмова розповідь: Präteritum дієслова nehmen."
      de: "Geschriebene Erzählung: das Präteritum von nehmen."
    text: "Ich {{nahm}} meine Jacke und lief zur Tür."
    translation:
      en: "I took my jacket and ran to the door."
      ru: "Я схватил куртку и побежал к двери."
      uk: "Я схопив куртку і побіг до дверей."
    explain:
      en: "nehmen is strong: nahm. The neighbouring lief is already given — the graded fact is that you can build the strong form yourself."
      ru: "nehmen — сильный глагол: nahm. Соседнее lief уже дано — оценивается именно то, что вы сами строите сильную форму."
      uk: "nehmen — сильне дієслово: nahm. Сусіднє lief уже дано — оцінюється саме те, що ви самі будуєте сильну форму."
      de: "nehmen ist stark: nahm. Das benachbarte lief steht schon da — die Frage ist allein, ob du die starke Form selbst bildest."

  - id: variant-c
    outcomes: [praeteritum-erzaehlen]
    type: cloze
    focus: praeteritum-vollverben
    instruction:
      en: "Written narrative: the Präteritum of schreiben."
      ru: "Письменный рассказ: Präteritum глагола schreiben."
      uk: "Письмова розповідь: Präteritum дієслова schreiben."
      de: "Geschriebene Erzählung: das Präteritum von schreiben."
    text: "Am Abend {{schrieb}} ich alles in mein Notizbuch."
    translation:
      en: "In the evening I wrote everything down in my notebook."
      ru: "Вечером я записал всё в свой блокнот."
      uk: "Увечері я записав усе до свого нотатника."
    explain:
      en: "schreiben is strong: schrieb — the ei/ie pair you know from blieb. One family, one competence: the strong narrative past, produced cold."
      ru: "schreiben — сильный глагол: schrieb — пара ei/ie, знакомая по blieb. Одна семья, одна компетенция: сильное повествовательное прошедшее, воспроизведённое без подготовки."
      uk: "schreiben — сильне дієслово: schrieb — пара ei/ie, знайома за blieb. Одна сім'я, одна компетенція: сильне оповідне минуле, відтворене без підготовки."
      de: "schreiben ist stark: schrieb — dasselbe ei/ie-Paar wie in bleiben → blieb. Eine Familie, eine Fähigkeit: das starke Erzählpräteritum, aus dem Stand gebildet."
