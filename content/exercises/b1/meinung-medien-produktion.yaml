    min_words: 60
    model_answer: "In dem Beitrag vom Montag geht es um eine Umfrage unter jungen Lesern. Achtzig Prozent sagen darin, dass sie keine Tageszeitung mehr brauchen. Meiner Meinung nach ist das kein gutes Zeichen, und ich muss dieser Aussage sogar widersprechen. Da fast alle Menschen heute wenig Zeit haben, lesen sie nur noch die Schlagzeilen. Kurze Meldungen sind zwar praktisch, aber sie nennen fast nie eine Quelle. Ob eine Meldung stimmt, hängt aber genau davon ab. Ich informiere mich deshalb nicht nur auf dem Handy, sondern auch in der Zeitung. Junge Leser sollten entweder eine gute Zeitung lesen oder wenigstens die Quelle prüfen, weil sonst niemand die Nachrichten kontrolliert."
    model_translation:
      en: "Monday's piece is about a survey among young readers. Eighty per cent of them say they no longer need a daily paper. In my opinion that is not a good sign, and I even have to disagree with that statement. Since almost everyone today is short of time, people read only the headlines. Short news items are handy, admittedly, but they hardly ever name a source. And whether an item is right depends on exactly that. So I get my information not only on my phone but in the paper as well. Young readers should either read a good paper or at least check the source, because otherwise nobody is checking the news."
      ru: "В материале от понедельника речь идёт об опросе среди молодых читателей. Восемьдесят процентов говорят там, что ежедневная газета им больше не нужна. По моему мнению, это не лучший знак, и с этим утверждением я даже вынужден не согласиться. Так как почти у всех сегодня мало времени, люди читают только заголовки. Короткие сообщения, правда, удобны, но источник они называют почти никогда. А верно ли сообщение, зависит именно от этого. Поэтому я узнаю новости не только с телефона, но и из газеты. Молодым читателям стоило бы либо читать хорошую газету, либо хотя бы проверять источник, потому что иначе новости никто не контролирует."
      uk: "У матеріалі від понеділка йдеться про опитування серед молодих читачів. Вісімдесят відсотків кажуть там, що щоденна газета їм більше не потрібна. На мою думку, це не найкращий знак, і з цим твердженням я навіть змушений не погодитися. Оскільки майже в усіх сьогодні мало часу, люди читають лише заголовки. Короткі повідомлення, щоправда, зручні, але джерело вони називають майже ніколи. А чи правильне повідомлення, залежить саме від цього. Тому я дізнаюся новини не лише з телефона, а й із газети. Молодим читачам варто було б або читати добру газету, або принаймні перевіряти джерело, бо інакше новини ніхто не контролює."
    explain:
      en: "Compare your draft against the model's skeleton, not its words. It opens with the frame, not with the text as subject: In dem Beitrag … geht es um. The two reasons arrive in their two shapes — the fronted Da fast alle Menschen heute wenig Zeit haben, …, which is common knowledge and therefore makes the main clause open with lesen sie, and the closing weil sonst niemand die Nachrichten kontrolliert, which is the new point and keeps its verb at the end. The weighing is done three times and never with a bare aber: zwar praktisch, aber …, nicht nur auf dem Handy, sondern auch …, entweder … oder. Widersprechen takes the Dativ without a preposition (dieser Aussage), and davon in Ob eine Meldung stimmt, hängt aber genau davon ab is the da-word pointing back at the source — the A2 machine doing this chapter's work."
      ru: "Сверяйте черновик со скелетом образца, а не с его словами. Он открывается рамкой, а не текстом в роли подлежащего: In dem Beitrag … geht es um. Два довода приходят в двух своих формах: вынесенное вперёд Da fast alle Menschen heute wenig Zeit haben, … — это общее знание, и потому главное предложение открывается формой lesen sie, — и финальное weil sonst niemand die Nachrichten kontrolliert, где мысль новая и глагол остаётся в конце. Взвешивание сделано трижды и ни разу голым aber: zwar praktisch, aber …, nicht nur auf dem Handy, sondern auch …, entweder … oder. Widersprechen требует Dativ без предлога (dieser Aussage), а davon в Ob eine Meldung stimmt, hängt aber genau davon ab — это da-слово, указывающее назад на источник: машина с A2 выполняет работу этой главы."
      uk: "Звіряйте чернетку зі скелетом зразка, а не з його словами. Він відкривається рамкою, а не текстом у ролі підмета: In dem Beitrag … geht es um. Два докази приходять у двох своїх формах: винесене вперед Da fast alle Menschen heute wenig Zeit haben, … — це спільне знання, і тому головне речення відкривається формою lesen sie, — і фінальне weil sonst niemand die Nachrichten kontrolliert, де думка нова і дієслово лишається в кінці. Зважування зроблено тричі і жодного разу голим aber: zwar praktisch, aber …, nicht nur auf dem Handy, sondern auch …, entweder … oder. Widersprechen вимагає Dativ без прийменника (dieser Aussage), а davon в Ob eine Meldung stimmt, hängt aber genau davon ab — це da-слово, що вказує назад на джерело: машина з A2 виконує роботу цього розділу."
      de: "Vergleiche deinen Entwurf mit dem Gerüst des Musters, nicht mit seinen Wörtern. Es beginnt mit der Verbindung, nicht mit dem Text als Subjekt: In dem Beitrag … geht es um. Die beiden Gründe kommen in ihren zwei Formen — das vorangestellte Da fast alle Menschen heute wenig Zeit haben, …, allgemein bekannt und deshalb mit lesen sie im Hauptsatz, und das abschließende weil sonst niemand die Nachrichten kontrolliert, der neue Punkt, mit dem Verb am Ende. Abgewogen wird dreimal und nie mit einem bloßen aber: zwar praktisch, aber …, nicht nur auf dem Handy, sondern auch …, entweder … oder. Widersprechen verlangt den Dativ ohne Präposition (dieser Aussage), und das davon in Ob eine Meldung stimmt, hängt aber genau davon ab ist das da-Wort, das auf die Quelle zurückzeigt."
