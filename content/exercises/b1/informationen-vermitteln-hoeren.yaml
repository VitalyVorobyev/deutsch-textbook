  question: 'Was muss Herr Wolf bis zum neunten tun?'
  options:
  - 'Den Kellerschlüssel bei Frau Kraus abgeben.'
  - 'Die Hausverwaltung anrufen.'
  - 'Zu Hause auf den Techniker warten.'
  correct: 0
  explain:
    en: 'The key has its own deadline, a day before the visit: bis zum neunten bei Frau Kraus. The building management only passed the news on.'
    ru: 'У ключа свой срок, на день раньше визита: bis zum neunten bei Frau Kraus. Управляющая компания лишь сообщила новость.'
    uk: 'Ключ має власний термін, на день раніше візиту: bis zum neunten bei Frau Kraus. Керуюча компанія лише повідомила новину.'
    de: 'Der Schlüssel hat eine eigene Frist, einen Tag vor dem Termin: „bis zum neunten bei Frau Kraus“. Die Hausverwaltung hat die Nachricht nur weitergegeben.'
  max_replays: 3
