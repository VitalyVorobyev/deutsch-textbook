  question: 'Warum wiederholt Frau Nguyen die Nachricht?'
  options:
  - 'Damit sie sie richtig an Jan weitergeben kann.'
  - 'Weil sie Herrn Becker nicht glaubt.'
  - 'Weil sie selbst den Schlüssel hat.'
  correct: 0
  explain:
    en: 'She took the message for Jan — kann ich ihm etwas ausrichten? — and repeats all three points so Herr Becker can confirm them. His genau so is that confirmation.'
    ru: 'Она взялась передать сообщение Яну — kann ich ihm etwas ausrichten? — и повторяет все три пункта, чтобы господин Беккер их подтвердил. Его genau so и есть подтверждение.'
    uk: 'Вона взялася передати повідомлення Янові — kann ich ihm etwas ausrichten? — і повторює всі три пункти, щоб пан Беккер їх підтвердив. Його genau so і є підтвердження.'
    de: 'Sie hat angeboten, Jan etwas auszurichten, und wiederholt alle drei Punkte, damit Herr Becker sie bestätigen kann. Sein „Genau so“ ist diese Bestätigung.'
