activity: task
skill: hoeren
title_de: "Hören im Kontext — Informationen vermitteln"
title:
  en: 'A message at the door'
  ru: 'Сообщение у двери'
  uk: 'Повідомлення біля дверей'
  de: 'Eine Nachricht an der Wohnungstür'
items:
- id: q1
  outcomes:
  - mitteilung-weitergeben
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Herr Becker
      text: 'Guten Tag, Frau Nguyen. Entschuldigen Sie die Störung. Wohnt Herr Wolf nicht auch bei Ihnen?'
    - speaker: Frau Nguyen
      text: 'Ja, Jan ist mein Mitbewohner, aber er ist bis morgen verreist. Kann ich ihm etwas ausrichten?'
    - speaker: Herr Becker
      text: 'Gern. Der Techniker für die Heizung kommt nicht am zwölften, sondern schon am zehnten. Die Hausverwaltung hat das heute früh mitgeteilt.'
    - speaker: Frau Nguyen
      text: 'Am zehnten, also zwei Tage früher. Und die Uhrzeit?'
    - speaker: Herr Becker
      text: 'Die bleibt: zwischen neun und zwölf Uhr. Aber Herr Wolf hat doch den Kellerschlüssel. Den muss er bis zum neunten bei Frau Kraus im Erdgeschoss abgeben.'
    - speaker: Frau Nguyen
      text: 'Ich wiederhole mal: Der Termin ist am zehnten statt am zwölften, die Zeit bleibt, und der Schlüssel muss bis zum neunten zu Frau Kraus.'
    - speaker: Herr Becker
      text: 'Genau so. Vielen Dank!'
  recording: ls-informationen-vermitteln-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Was hat sich geändert?'
  options:
  - 'Der Techniker kommt zwei Tage früher.'
  - 'Er kommt am Nachmittag statt am Vormittag.'
  - 'Er kommt zwei Tage später.'
  correct: 0
  explain:
    en: 'Nicht am zwölften, sondern schon am zehnten: schon marks it as earlier, and Frau Nguyen says it outright — zwei Tage früher. The time stays nine to twelve.'
    ru: 'Nicht am zwölften, sondern schon am zehnten: schon показывает, что раньше, и госпожа Нгуен говорит это прямо — zwei Tage früher. Время остаётся с девяти до двенадцати.'
    uk: 'Nicht am zwölften, sondern schon am zehnten: schon показує, що раніше, і пані Нгуєн каже це прямо — zwei Tage früher. Час залишається з дев''ятої до дванадцятої.'
    de: '„Nicht am zwölften, sondern schon am zehnten“: „schon“ zeigt, dass es früher ist, und Frau Nguyen sagt es auch: „zwei Tage früher“. Die Uhrzeit bleibt, zwischen neun und zwölf.'
  max_replays: 3
