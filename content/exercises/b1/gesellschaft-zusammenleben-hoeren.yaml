topic: gesellschaft-zusammenleben
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Gesellschaft & Zusammenleben"
title:
  en: 'A tenants'' meeting about the courtyard'
  ru: 'Собрание жильцов о дворе'
  uk: 'Збори мешканців щодо двору'
  de: 'Eine Hausversammlung über den Hof'
items:
- id: q1
  outcomes:
  - diskussion-folgen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Frau Hartmann
      text: 'Guten Abend. Danke, dass so viele zur Versammlung gekommen sind. Heute geht es um den Hof: Spielplatz, Parkplätze oder Garten.'
    - speaker: Herr Yilmaz
      text: 'Ich bin für Parkplätze. Jeder sucht abends eine halbe Stunde, und die Straße ist immer voll.'
    - speaker: Frau Brandt
      text: 'Da habe ich einen Einwand. Parkplätze nutzen nur einige von uns, einen Spielplatz die ganze Gemeinschaft, auch die Kinder aus dem Nachbarhaus.'
    - speaker: Herr Yilmaz
      text: 'Obwohl ich keine Kinder habe, verstehe ich das. Trotzdem brauchen wir eine Lösung für die Autos.'
    - speaker: Frau Hartmann
      text: 'Was halten Sie von einem Kompromiss? Vorn zwei Parkplätze, hinten, wo jetzt die Mülltonnen stehen, ein kleiner Spielplatz.'
    - speaker: Herr Yilmaz
      text: 'Zwei Parkplätze sind nicht viel, aber besser als keine. Damit bin ich einverstanden.'
    - speaker: Frau Brandt
      text: 'Und der Garten?'
    - speaker: Frau Hartmann
      text: 'Dafür ist leider kein Platz mehr. Dann stimmen wir ab: Wer ist für den Kompromiss?'
    - speaker: Frau Brandt
      text: 'Schade. Aber für die Kinder ist der Spielplatz wichtiger. Ich bin auch dafür.'
    - speaker: Frau Hartmann
      text: 'Das ist die Mehrheit. Alles, was wir heute beschlossen haben, schicke ich Ihnen per E-Mail.'
  recording: ls-gesellschaft-zusammenleben-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Warum ist Herr Yilmaz für Parkplätze?'
  options:
  - 'Weil man abends lange einen Parkplatz sucht.'
  - 'Weil er selbst Kinder hat.'
  - 'Weil ein Garten zu viel Arbeit macht.'
  correct: 0
  explain:
    en: 'His reason follows straight after his position: jeder sucht abends eine halbe Stunde. He says later that he has no children, and nobody argues about work in the garden.'
    ru: 'Причину он называет сразу после своей позиции: jeder sucht abends eine halbe Stunde. Позже он говорит, что детей у него нет, а о работе в саду никто не спорит.'
    uk: 'Причину він називає одразу після своєї позиції: jeder sucht abends eine halbe Stunde. Пізніше він каже, що дітей у нього немає, а про роботу в саду ніхто не сперечається.'
    de: 'Den Grund nennt er direkt nach seiner Meinung: „Jeder sucht abends eine halbe Stunde.“ Später sagt er, dass er keine Kinder hat, und über Arbeit im Garten spricht niemand.'
  max_replays: 3
