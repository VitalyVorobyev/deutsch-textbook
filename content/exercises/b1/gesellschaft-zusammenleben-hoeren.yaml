  question: 'Was ist Frau Brandts Einwand?'
  options:
  - 'Parkplätze nutzen nur einige, einen Spielplatz alle.'
  - 'Der Hof ist zu klein für Autos.'
  - 'Die Kinder aus dem Nachbarhaus sind zu laut.'
  correct: 0
  explain:
    en: 'She announces it — da habe ich einen Einwand — and sets nur einige against die ganze Gemeinschaft. The children next door are part of her argument, not a complaint.'
    ru: 'Она прямо объявляет: da habe ich einen Einwand — и противопоставляет nur einige и die ganze Gemeinschaft. Дети из соседнего дома — часть её довода, а не жалоба.'
    uk: 'Вона прямо оголошує: da habe ich einen Einwand — і протиставляє nur einige та die ganze Gemeinschaft. Діти із сусіднього будинку — частина її аргументу, а не скарга.'
    de: 'Sie kündigt ihn an — „Da habe ich einen Einwand“ — und stellt „nur einige“ gegen „die ganze Gemeinschaft“. Die Kinder aus dem Nachbarhaus gehören zu ihrem Argument; sie beschwert sich nicht über sie.'
