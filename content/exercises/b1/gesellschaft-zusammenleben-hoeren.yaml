  explain:
    en: 'The vote is on Frau Hartmann''s Kompromiss, and the majority takes it. The garden drops out just before: dafür ist leider kein Platz mehr.'
    ru: 'Голосуют за Kompromiss, который предложила госпожа Хартман, и большинство его принимает. Сад отпадает чуть раньше: dafür ist leider kein Platz mehr.'
