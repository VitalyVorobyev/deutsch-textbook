  question: Was macht sie, wenn sie nicht selbst entscheiden darf?
  options:
  - Sie sagt es offen und nennt einen Rückrufzeitpunkt.
  - Sie verspricht eine schnelle Lösung.
  - Sie gibt den Anruf sofort weiter.
  correct: 0
  explain:
    en: '"Sie verspricht eine schnelle Lösung" is what she explicitly avoids: falsche Versprechen ärgern
      die Kunden mehr. The recording names the wrong strategy right after the right
      one.'
    ru: '«Sie verspricht eine schnelle Lösung» — как раз то, чего она избегает: falsche Versprechen ärgern
      die Kunden mehr. Запись называет неверную стратегию сразу после верной.'
    uk: '«Sie verspricht eine schnelle Lösung» — саме те, чого вона уникає: falsche Versprechen ärgern die Kunden mehr. Запис називає хибну стратегію одразу після правильної.'
