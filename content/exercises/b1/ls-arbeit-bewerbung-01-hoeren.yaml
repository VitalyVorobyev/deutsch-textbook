topic: arbeit-bewerbung
role: practice
title:
  en: An excerpt from a job interview
  ru: Отрывок из собеседования
  uk: 'Уривок зі співбесіди'
items:
- id: q1
  outcomes:
  - interview-fragen-beantworten
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Frau Baumann
      text: Frau Petrova, Sie haben zuletzt drei Jahre in einem Logistikunternehmen
        gearbeitet. Warum möchten Sie wechseln?
    - speaker: Frau Petrova
      text: Die Arbeit hat mir gefallen, aber ich hatte kaum Kontakt zu Kunden. Genau
        das reizt mich an Ihrer Stelle.
    - speaker: Frau Baumann
      text: Unsere Kunden rufen oft an, wenn etwas schiefgegangen ist. Wie gehen Sie
        mit Beschwerden um?
    - speaker: Frau Petrova
      text: Ich höre erst zu Ende zu und wiederhole dann, was ich verstanden habe.
        Meistens beruhigt das schon.
    - speaker: Frau Baumann
      text: Und wenn Sie die Lösung nicht selbst entscheiden dürfen?
    - speaker: Frau Petrova
      text: Dann sage ich das offen und nenne einen Zeitpunkt, bis wann ich zurückrufe.
        Falsche Versprechen ärgern die Kunden mehr als eine Verzögerung.
    - speaker: Frau Baumann
      text: Das sehe ich genauso. Wo sehen Sie Ihre größte Schwäche?
    - speaker: Frau Petrova
      text: Ich arbeite manchmal zu lange an Details. Ich setze mir inzwischen feste
        Zeiten, damit das nicht passiert.
    - speaker: Frau Baumann
      text: 'Eine letzte Frage: Ab wann könnten Sie anfangen?'
    - speaker: Frau Petrova
      text: Ich habe vier Wochen Kündigungsfrist, also ab dem ersten Oktober.
    - speaker: Frau Baumann
      text: Gut. Wir melden uns bis Ende der Woche bei Ihnen.
  recording: ls-arbeit-bewerbung-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Warum möchte Frau Petrova wechseln?
  options:
  - Sie möchte mehr Kontakt zu Kunden.
  - Die Arbeit hat ihr nicht gefallen.
  - Sie verdient zu wenig.
  correct: 0
  explain:
    en: Her answer opens by contradicting "Die Arbeit hat ihr nicht gefallen" outright — die Arbeit
      hat mir gefallen — before naming the real reason. The aber is the hinge the
      whole answer turns on.
    ru: Её ответ начинается с прямого опровержения «Die Arbeit hat ihr nicht gefallen» — die Arbeit hat
      mir gefallen — и лишь затем называет настоящую причину. Всё держится на этом
      aber.
    uk: 'Її відповідь починається з прямого спростування «Die Arbeit hat ihr nicht gefallen» — die Arbeit hat mir gefallen — і аж потім називає справжню причину. Усе тримається на цьому aber.'
  max_replays: 3
