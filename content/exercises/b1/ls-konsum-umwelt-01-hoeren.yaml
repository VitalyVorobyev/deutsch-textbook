topic: konsum-umwelt
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Konsum & Umwelt"
title:
  en: What happens to the bottle bank
  ru: Что происходит со стеклотарой
  uk: 'Що відбувається зі склотарою'
items:
- id: q1
  outcomes:
  - konsum-vergleichen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Rolf
      text: Weißt du eigentlich, was mit unserem Altglas passiert, nachdem wir es
        in den Container geworfen haben?
    - speaker: Ida
      text: Es wird nach Farben sortiert, gereinigt und dann eingeschmolzen. Aus Altglas
        wird wieder Glas, und das fast beliebig oft.
    - speaker: Rolf
      text: Das klingt fast zu gut. Wo ist der Haken?
    - speaker: Ida
      text: Das Einschmelzen braucht sehr viel Energie. Trotzdem lohnt es sich, weil
        neues Glas aus Sand noch mehr Energie kostet.
    - speaker: Rolf
      text: Und wie ist das bei Plastik?
    - speaker: Ida
      text: Da wird das meiste nicht wieder zu Verpackung, sondern verbrannt. Nur
        ein Teil wird zu Bänken oder Rohren.
    - speaker: Rolf
      text: Dann wäre eine Mehrwegflasche also besser als eine Plastikflasche zum
        Wegwerfen?
    - speaker: Ida
      text: In der Regel ja, aber nur wenn sie aus der Nähe kommt. Eine Mehrwegflasche,
        die dreihundert Kilometer transportiert wird, verliert ihren Vorteil schnell.
    - speaker: Rolf
      text: Das heißt, die Entfernung entscheidet mehr als das Material?
    - speaker: Ida
      text: Bei den Getränken oft, ja. Am wenigsten Aufwand macht immer das, was man
        gar nicht erst kauft.
  recording: ls-konsum-umwelt-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Warum lohnt sich das Einschmelzen trotzdem?
  options:
  - Neues Glas aus Sand kostet noch mehr Energie.
  - Das Einschmelzen braucht wenig Energie.
  - Altglas muss nicht sortiert werden.
  correct: 0
  explain:
    en: 'The line concedes the objection and then overrides it: viel Energie, trotzdem,
      weil … noch mehr. Both halves are needed, and "Das Einschmelzen braucht wenig Energie" is the first half misheard as the conclusion.'
    ru: 'Реплика сначала признаёт возражение, а затем его перекрывает: viel Energie,
      trotzdem, weil … noch mehr. Нужны обе половины, а «Das Einschmelzen braucht wenig Energie» — это первая половина, принятая за вывод.'
    uk: 'Репліка спершу визнає заперечення, а потім його перекриває: viel Energie, trotzdem, weil … noch mehr. Потрібні обидві половини, а «Das Einschmelzen braucht wenig Energie» — це перша половина, взята за висновок.'
  max_replays: 3
