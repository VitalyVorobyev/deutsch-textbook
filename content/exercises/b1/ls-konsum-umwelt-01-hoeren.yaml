  recording: ls-konsum-umwelt-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wann verliert eine Mehrwegflasche ihren Vorteil?
  options:
  - Wenn sie weit transportiert wird.
  - Wenn sie aus Plastik ist.
  - Wenn sie oft gereinigt wird.
  correct: 0
  explain:
    en: The answer is yes with a condition attached — in der Regel ja, aber nur wenn
      — and the condition is the part that matters. A relative clause then names the
      distance.
    ru: 'Ответ — «да» с условием: in der Regel ja, aber nur wenn, — и значимо именно
      условие. Расстояние затем называет придаточное определительное.'
    uk: 'Відповідь — «так» із умовою: in der Regel ja, aber nur wenn, — і важить саме умова. Відстань потім називає підрядне означальне.'
  max_replays: 3
