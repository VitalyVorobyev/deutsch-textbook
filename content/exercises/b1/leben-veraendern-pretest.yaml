# Diagnostic generation, not practice: three guesses before the article,
# one per grammar point (relativsatz-dativ, komparativ-attributiv, genitiv-vollstaendig).
topic: leben-veraendern
role: pretest
title:
  en: "Before you read — three guesses"
  ru: "Перед чтением — три догадки"
  uk: "Перед читанням — три здогади"
  de: "Vor dem Lesen — drei Vermutungen"
items:
  - id: pre-cloze-denen
    outcomes: [relativsatz-praezisieren]
    type: cloze
    instruction:
      en: "Guess the relative pronoun."
      ru: "Угадайте относительное местоимение."
      uk: "Вгадайте відносний займенник."
      de: "Rate das Relativpronomen."
    text: "Das sind die Nachbarn, {{denen}} die Katze gehört."
    translation:
      en: "Those are the neighbours who own the cat."
      ru: "Это соседи, которым принадлежит кошка."
      uk: "Це сусіди, яким належить кішка."
    explain:
      en: "gehören demands the dative, and in the plural the relative pronoun is denen — the one form that differs from the article den. The article builds the whole table."
      ru: "gehören требует датива, а во множественном числе относительное местоимение — denen: единственная форма, которая отличается от артикля den. Статья строит всю таблицу."
      uk: "gehören вимагає датива, а в множині відносний займенник — denen: єдина форма, яка відрізняється від артикля den. Стаття будує всю таблицю."
      de: "gehören verlangt den Dativ. Das Kapitel zeigt gleich die ganze Tabelle — dort steht auch die eine Form, die aus der Reihe fällt: Im Dativ Plural heißt das Relativpronomen denen, nicht die Artikelform den."

  - id: pre-mc-komparativ
    outcomes: [wohnsituation-vergleichen]
    type: mc
    prompt: "Wir suchen eine ___ Wohnung."
    options:
      - "größere"
      - "größer"
      - "mehr große"
    correct: 0
    translation:
      en: "We are looking for a bigger flat."
      ru: "Мы ищем квартиру побольше."
      uk: "Ми шукаємо більшу квартиру."
    explain:
      en: "In front of a noun the comparative takes the ordinary adjective ending on top of its -er: eine größere Wohnung. Bare größer is the frozen form; the ordinary gradable adjective groß forms its comparative with -er. The article shows the pattern."
      ru: "Перед существительным компаратив берёт обычное окончание прилагательного поверх своего -er: eine größere Wohnung. Голое größer — застывшая форма; обычное качественное прилагательное groß образует компаратив с -er. Статья показывает схему."
      uk: "Перед іменником компаратив бере звичайне закінчення прикметника поверх свого -er: eine größere Wohnung. Голе größer — застигла форма; звичайний якісний прикметник groß утворює компаратив із -er. Стаття показує схему."
      de: "Vor einem Nomen nimmt der Komparativ über seinem -er die normale Adjektivendung: eine größere Wohnung. Das nackte größer ist die feste Form ohne Endung; das gewöhnliche steigerbare Adjektiv groß bildet den Komparativ mit -er. mehr vergleicht hier Mengen (mehr Platz, mehr Geld). Das Kapitel zeigt das Muster."

  - id: pre-mc-genitiv
    outcomes: [veraenderung-berichten]
    type: mc
    prompt: "Der Mantel ___ hängt noch im Schrank."
    options:
      - "meines Bruders"
      - "meinem Bruder"
      - "meines Bruder"
    correct: 0
    translation:
      en: "My brother's coat is still hanging in the wardrobe."
      ru: "Пальто моего брата ещё висит в шкафу."
      uk: "Пальто мого брата ще висить у шафі."
    explain:
      en: "The written whose is the genitive: meines Bruders — and the masculine noun carries the case itself with -s. meinem Bruder is the spoken von-route with the von left off, and meines Bruder gets the article right but forgets the noun's own ending. The article gives the full paradigm."
      ru: "Письменное «чей» — это генитив: meines Bruders, и существительное мужского рода само несёт падеж через -s. meinem Bruder — разговорный путь через von, но без von, а meines Bruder угадывает артикль и забывает окончание существительного. Статья даёт полную парадигму."
      uk: "Письмове «чий» — це родовий відмінок: meines Bruders, і іменник чоловічого роду сам несе відмінок через -s. meinem Bruder — розмовний шлях через von, але без von, а meines Bruder вгадує артикль і забуває закінчення іменника. Стаття дає повну парадигму."
      de: "Die Frage wessen? beantwortet auf dem Papier der Genitiv: meines Bruders — und das maskuline Nomen trägt den Kasus selbst, mit -s. meinem Bruder ist der gesprochene Weg über von, nur ohne das von; meines Bruder trifft den Possessivartikel, vergisst aber die Endung am Nomen. Das Kapitel gibt das vollständige Paradigma."
