  question: Was befürchtet der Handelsverband?
  options:
  - Umsatzverluste, weil Kunden schlechter parken können.
  - Mehr Verkehr in den Dörfern.
  - Höhere Mieten in der Innenstadt.
  correct: 0
  explain:
    en: This is in the report itself, before either opinion, and it is the only claim
      in the whole recording attributed to the trade association rather than to a
      speaker.
    ru: Это сказано в самом сюжете, ещё до обоих мнений, и это единственное утверждение
      во всей записи, приписанное торговому союзу, а не кому-то из говорящих.
    uk: 'Це сказано в самому сюжеті, ще до обох думок, і це єдине твердження в усьому записі, приписане торговельній спілці, а не комусь із мовців.'
  max_replays: 3
