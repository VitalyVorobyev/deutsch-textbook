topic: meinung-medien
role: practice
title:
  en: A report and two reactions
  ru: Сюжет и две реакции
  uk: 'Сюжет і дві реакції'
items:
- id: q1
  outcomes:
  - bericht-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Sprecher
      text: In unserer Stadt sollen ab Januar mehrere Straßen in der Innenstadt für
        Autos gesperrt werden. Die Verwaltung rechnet mit weniger Verkehr und besserer
        Luft und will die Flächen für Cafés und Fahrräder nutzen. Der Handelsverband
        warnt dagegen vor Umsatzverlusten, weil Kunden schlechter parken können. Wir
        haben zwei Stimmen dazu gesammelt.
    - speaker: Herr Lang
      text: Ich halte das für richtig. In anderen Städten hat sich gezeigt, dass die
        Geschäfte nach einem Jahr sogar mehr verkaufen, weil mehr Leute zu Fuß vorbeikommen
        und länger bleiben. Wer mit dem Auto kommt, hält kurz und fährt wieder weg.
    - speaker: Frau Ott
      text: Das mag in großen Städten stimmen. Bei uns kommen viele Kunden aber aus
        den Dörfern, und dorthin fährt abends kaum ein Bus. Wenn man ihnen die Zufahrt
        nimmt, bevor es eine Alternative gibt, fahren sie eben ins Einkaufszentrum.
    - speaker: Herr Lang
      text: Dann muss man zuerst die Busse verbessern und danach sperren, nicht umgekehrt.
        Da bin ich ganz bei Ihnen.
    - speaker: Frau Ott
      text: Genau das ist mein Punkt. Ich bin nicht gegen die Idee, sondern gegen
        den Zeitplan.
    - speaker: Sprecher
      text: Die Entscheidung fällt im Stadtrat am zwanzigsten November. Wir berichten
        weiter.
  recording: ls-meinung-medien-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Worin sind sich Herr Lang und Frau Ott einig?
  options:
  - Die Busse müssen vor der Sperrung besser werden.
  - Die Innenstadt soll gar nicht gesperrt werden.
  - Die Geschäfte verlieren auf jeden Fall Umsatz.
  correct: 0
  explain:
    en: The agreement arrives late and quietly, after two turns that sound like disagreement.
      Da bin ich ganz bei Ihnen and genau das ist mein Punkt are the two lines that
      mark it.
    ru: Согласие приходит поздно и негромко, после двух реплик, звучащих как спор.
      Отмечают его именно фразы da bin ich ganz bei Ihnen и genau das ist mein Punkt.
    uk: 'Згода приходить пізно і неголосно, після двох реплік, що звучать як суперечка. Позначають її саме фрази da bin ich ganz bei Ihnen і genau das ist mein Punkt.'
  max_replays: 3
