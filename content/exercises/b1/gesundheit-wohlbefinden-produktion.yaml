# B1.3 production half: the modes the outcomes claim — two spoken-interaction turns
# (Beschwerden schildern with a Rückfrage to answer, advice frames to a friend), a
# spoken-production habits monologue, one KII transfer translate, and a dictation
# carrying an audible frame-case decision (sound→spelling, not a listening claim:
# this unit has no listening outcome). empfehlungen-verstehen is measured on both
# halves of its can-do: the reading's questions cover the recommendations half, and
# lesen-packungsangabe below covers the Packungsangaben half.
topic: gesundheit-wohlbefinden
role: practice
stage: transfer
activity: application
title:
  en: "Production — describe the complaint, give the advice, tell your habits"
  ru: "Продукция — описать жалобу, дать совет, рассказать о привычках"
  uk: "Продукція — описати скаргу, дати пораду, розповісти про звички"
  de: "Produktion — die Beschwerde schildern, den Rat geben, die Gewohnheiten erzählen"
items:
  - id: uebersetzen-transfer-zucker
    outcomes: [ratschlaege-formulieren]
    type: translate
    focus: konjunktiv2-ratschlag
    instruction:
      en: "Translate — advice to a friend (du). Use sollen in the Konjunktiv II and verzichten."
      ru: "Переведите — совет другу (du). Используйте sollen в Konjunktiv II и verzichten."
      uk: "Перекладіть — порада другові (du). Використайте sollen у Konjunktiv II і verzichten."
      de: "Übersetze — ein Rat an einen Freund (du). Verwende sollen im Konjunktiv II und verzichten."
    prompt_en: "You should give up sugar for a few weeks."
    prompt_ru: "Тебе стоило бы на несколько недель отказаться от сахара."
    prompt_uk: "Тобі варто було б на кілька тижнів відмовитися від цукру."
    answer: "Du solltest ein paar Wochen auf Zucker verzichten."
    accept:
      - "Du solltest für ein paar Wochen auf Zucker verzichten."
      - "Du solltest ein paar Wochen lang auf Zucker verzichten."
      - "Du solltest einige Wochen auf Zucker verzichten."
      - "Du solltest für einige Wochen auf Zucker verzichten."
      - "Du solltest einige Wochen lang auf Zucker verzichten."
    key_tokens: ["solltest"]
    explain:
      en: "Graded is only the advice form: solltest, the Konjunktiv II of sollen — the softened du solltest behind the A2 doctor's Sie sollten. Indicative sollst would turn the advice into an order from above. The frame auf + Akkusativ belongs to verzichten, and the time span works bare (ein paar Wochen), with für or with lang — all three are idiomatic."
      ru: "Оценивается только форма совета: solltest, Konjunktiv II глагола sollen — смягчённое du solltest, стоящее за врачебным Sie sollten с A2. Индикатив sollst превратил бы совет в указание сверху — как русское «ты должен» вместо «тебе стоило бы». Рамка auf + Akkusativ принадлежит глаголу verzichten, а отрезок времени работает и без предлога (ein paar Wochen), и с für, и с lang — все три варианта идиоматичны."
      uk: "Оцінюється лише форма поради: solltest, Konjunktiv II дієслова sollen — пом'якшене du solltest, що стоїть за лікарським Sie sollten з A2. Індикатив sollst перетворив би пораду на вказівку згори — як українське «ти мусиш» замість «тобі варто було б». Рамка auf + Akkusativ належить дієслову verzichten, а відрізок часу працює і без прийменника (ein paar Wochen), і з für, і з lang — усі три варіанти ідіоматичні."
      de: "Bewertet wird nur die Ratschlagform: solltest, der Konjunktiv II von sollen — das weiche du solltest hinter dem Sie sollten vom Arzt aus A2. Der Indikativ sollst würde aus dem Rat eine Anweisung von oben machen. Der Rahmen auf + Akkusativ gehört zu verzichten, und die Zeitspanne funktioniert nackt (ein paar Wochen), mit für und mit lang — alle drei sind idiomatisch."

  - id: hoeren-diktat-garten
    outcomes: [gewohnheiten-beschreiben]
    type: listen
    focus: reflexiv-praeposition
    instruction:
      en: "Listen and type what you hear."
      ru: "Прослушайте и напишите, что вы слышите."
      uk: "Прослухайте і напишіть, що ви чуєте."
      de: "Hör zu und tippe, was du hörst."
    text: "Meine Eltern kümmern sich gut um ihren Garten."
    translation:
      en: "My parents look after their garden well."
      ru: "Мои родители хорошо заботятся о своём саде."
      uk: "Мої батьки добре дбають про свій сад."
    explain:
      en: "The frame has its own sound: sich kümmern um demands the accusative, so the ear must catch ihren, not ihrem — one nasal consonant separates the frame's case from the wrong one. Hearing the -n of the accusative inside connected speech is exactly what this dictation trains."
      ru: "У рамки своё звучание: sich kümmern um требует аккузатива, поэтому ухо должно поймать ihren, а не ihrem — падеж рамки от неверного отделяет один носовой согласный. Услышать аккузативное -n внутри связной речи — ровно то, что тренирует этот диктант."
      uk: "У рамки своє звучання: sich kümmern um вимагає знахідного, тому вухо має впіймати ihren, а не ihrem — відмінок рамки від хибного відділяє один носовий приголосний. Почути знахідне -n усередині зв'язного мовлення — рівно те, що тренує цей диктант."
      de: "Der Rahmen hat seinen eigenen Klang: sich kümmern um verlangt den Akkusativ, also muss das Ohr ihren treffen, nicht ihrem — ein einziger Nasal trennt den Kasus des Rahmens vom falschen. Genau das übt dieses Diktat: das -n des Akkusativs mitten im schnellen Sprechen zu hören."

  - id: lesen-packungsangabe
    outcomes: [empfehlungen-verstehen]
    type: mc
    prompt: "Auf der Packung steht: „Zweimal täglich fünf Tropfen vor dem Essen einnehmen. Nicht länger als eine Woche anwenden.“ — Wie nehmen Sie die Tropfen?"
    options:
      - "Fünf Tropfen am Morgen und am Abend, vor dem Essen — höchstens eine Woche."
      - "Zehn Tropfen einmal am Tag, nach dem Essen — mindestens eine Woche."
      - "Fünf Tropfen einmal pro Woche, vor dem Essen."
    correct: 0
    translation:
      en: "The package says: \"Take five drops twice a day before meals. Do not use for longer than one week.\" — How do you take the drops?"
      ru: "На упаковке написано: «Принимать по пять капель два раза в день перед едой. Не применять дольше одной недели». — Как принимать капли?"
      uk: "На упаковці написано: «Приймати по п'ять крапель двічі на день перед їдою. Не застосовувати довше одного тижня». — Як приймати краплі?"
    explain:
      en: "Package directions speak in bare infinitives — einnehmen, anwenden — that read as instructions. Decode slot by slot: zweimal täglich (how often), fünf Tropfen (how much), vor dem Essen (when), nicht länger als eine Woche (how long, so höchstens — at most). The wrong options swap exactly what a hurried reader swaps: dose with frequency, vor with nach, höchstens with mindestens."
      ru: "Указания на упаковке говорят голыми инфинитивами — einnehmen, anwenden — и читаются как инструкции. Разбирайте по слотам: zweimal täglich (как часто), fünf Tropfen (сколько), vor dem Essen (когда), nicht länger als eine Woche (как долго, то есть höchstens — не более). Неверные варианты меняют местами ровно то, что путает торопливый читатель: дозу с частотой, vor с nach, höchstens с mindestens."
      uk: "Вказівки на упаковці говорять голими інфінітивами — einnehmen, anwenden — і читаються як інструкції. Розбирайте по слотах: zweimal täglich (як часто), fünf Tropfen (скільки), vor dem Essen (коли), nicht länger als eine Woche (як довго, тобто höchstens — не більше). Хибні варіанти міняють місцями рівно те, що плутає квапливий читач: дозу з частотою, vor із nach, höchstens із mindestens."
      de: "Packungstexte sprechen in bloßen Infinitiven — einnehmen, anwenden —, und man liest sie als Anweisung. Geh Feld für Feld vor: zweimal täglich (wie oft), fünf Tropfen (wie viel), vor dem Essen (wann), nicht länger als eine Woche (wie lange, also höchstens). Die falschen Antworten vertauschen genau das, was ein eiliger Leser vertauscht: Menge und Häufigkeit, vor und nach, höchstens und mindestens."

  - id: sprechen-beschwerden-apotheke
    outcomes: [beschwerden-schildern]
    type: speak
    mode: spoken-interaction
    instruction:
      en: "Speak both of your turns aloud — and if you can, listen to yourself: the checklist names what to listen for."
      ru: "Произнесите вслух обе свои реплики — и, если можете, послушайте себя: чек-лист подсказывает, на что обращать внимание."
      uk: "Вимовте вголос обидві свої репліки — і, якщо можете, послухайте себе: чек-лист підказує, на що звертати увагу."
      de: "Sprich beide Redebeiträge laut — und hör dir dabei selbst zu, wenn du kannst: Die Checkliste sagt, worauf es ankommt."
    prompt:
      en: "You have had headaches almost every evening for two weeks, and you work all day at a screen. At the pharmacy the pharmacist asks: „Guten Tag, wie kann ich Ihnen helfen?“ — and after you describe the problem, she asks a follow-up: „Wie viele Stunden sitzen Sie am Bildschirm, und trinken Sie genug?“ Speak both of your turns aloud."
      ru: "Уже две недели у вас почти каждый вечер болит голова, а работаете вы весь день за экраном. В аптеке провизор спрашивает: «Guten Tag, wie kann ich Ihnen helfen?» — а после вашего рассказа задаёт уточняющий вопрос: «Wie viele Stunden sitzen Sie am Bildschirm, und trinken Sie genug?» Произнесите вслух обе свои реплики."
      uk: "Уже два тижні у вас майже щовечора болить голова, а працюєте ви весь день за екраном. В аптеці провізорка питає: «Guten Tag, wie kann ich Ihnen helfen?» — а після вашої розповіді ставить уточнювальне запитання: «Wie viele Stunden sitzen Sie am Bildschirm, und trinken Sie genug?» Вимовте вголос обидві свої репліки."
      de: "Seit zwei Wochen hast du fast jeden Abend Kopfschmerzen, und du arbeitest den ganzen Tag am Bildschirm. In der Apotheke fragt die Apothekerin: „Guten Tag, wie kann ich Ihnen helfen?“ — und nachdem du das Problem geschildert hast, kommt eine Rückfrage: „Wie viele Stunden sitzen Sie am Bildschirm, und trinken Sie genug?“ Sprich beide Redebeiträge laut."
    goal:
      en: "Describe the complaint with its duration, then answer the follow-up question with real detail instead of a bare yes or no."
      ru: "Опишите жалобу и её длительность, а затем ответьте на уточняющий вопрос содержательно, а не одним ja или nein."
      uk: "Опишіть скаргу та її тривалість, а потім відповідайте на уточнювальне запитання змістовно, а не одним ja чи nein."
      de: "Schildere die Beschwerde samt Dauer und beantworte danach die Rückfrage mit echten Angaben, nicht mit einem bloßen ja oder nein."
    checklist:
      - en: "I named the complaint and how long it has lasted, with seit + Dativ (seit zwei Wochen — plural -n)."
        ru: "Я назвал(а) жалобу и её длительность через seit + Dativ (seit zwei Wochen — с -n во множественном числе)."
        uk: "Я назвав(ла) скаргу та її тривалість через seit + Dativ (seit zwei Wochen — з -n у множині)."
        de: "Ich habe die Beschwerde und ihre Dauer genannt, mit seit + Dativ (seit zwei Wochen — mit -n im Plural)."
      - en: "A reflexive frame did the wellbeing talk: ich fühle mich …, or sich erholen von + Dativ."
        ru: "О самочувствии говорила возвратная рамка: ich fühle mich … или sich erholen von + Dativ."
        uk: "Про самопочуття говорила зворотна рамка: ich fühle mich … або sich erholen von + Dativ."
        de: "Über das Befinden hat ein reflexiver Rahmen gesprochen: ich fühle mich … oder sich erholen von + Dativ."
      - en: "I answered the Rückfrage with concrete numbers (hours, glasses), not just ja or nein."
        ru: "На уточняющий вопрос я ответил(а) конкретными цифрами (часы, стаканы), а не просто ja или nein."
        uk: "На уточнювальне запитання я відповів(ла) конкретними цифрами (години, склянки), а не просто ja чи nein."
        de: "Ich habe die Rückfrage mit konkreten Zahlen beantwortet (Stunden, Gläser), nicht nur mit ja oder nein."
    model_answer: "Guten Tag! Ich habe seit zwei Wochen fast jeden Abend Kopfschmerzen, und ich fühle mich ständig müde. — Am Bildschirm sitze ich ungefähr acht Stunden am Tag. Und ehrlich gesagt trinke ich zu wenig, meistens nur zwei oder drei Tassen Kaffee. Am Wochenende erhole ich mich auch nicht richtig von der Arbeit."
    model_translation:
      en: "Good afternoon! I have had headaches almost every evening for two weeks, and I feel constantly tired. — I sit at a screen for about eight hours a day. And to be honest I drink too little, usually only two or three cups of coffee. At the weekend I do not really recover from work either."
      ru: "Здравствуйте! Уже две недели у меня почти каждый вечер болит голова, и я постоянно чувствую себя уставшим. — За экраном я сижу примерно восемь часов в день. И, честно говоря, пью я слишком мало — обычно только две-три чашки кофе. В выходные я тоже по-настоящему не восстанавливаюсь после работы."
      uk: "Добрий день! Уже два тижні в мене майже щовечора болить голова, і я постійно почуваюся втомленим. — За екраном я сиджу приблизно вісім годин на день. І, чесно кажучи, п'ю я замало — зазвичай лише дві-три чашки кави. У вихідні я теж по-справжньому не відновлююся після роботи."
    explain:
      en: "The turn has three moves, and the second turn is the B1 addition: A2 could name the complaint, B1 answers the question after it. The complaint with its duration: seit zwei Wochen, dative plural. The reflexive frames doing the wellbeing talk: ich fühle mich (accusative pronoun), sich erholen von der Arbeit (the frame's dative). And the Rückfrage answered like a person — hours and cups, not a bare ja. Say it a second time and listen for mich and von der."
      ru: "В реплике три хода, и именно вторая реплика — прибавка B1: на A2 вы умели назвать жалобу, на B1 отвечаете на вопрос после неё. Жалоба с длительностью: seit zwei Wochen, датив множественного числа. Возвратные рамки ведут разговор о самочувствии: ich fühle mich (аккузативное местоимение), sich erholen von der Arbeit (датив рамки). И ответ на Rückfrage — по-человечески: часы и чашки, а не голое ja. Произнесите всё второй раз и вслушайтесь в mich и von der."
      uk: "У репліці три ходи, і саме друга репліка — здобуток B1: на A2 ви вміли назвати скаргу, на B1 відповідаєте на запитання після неї. Скарга з тривалістю: seit zwei Wochen, давальний множини. Зворотні рамки ведуть розмову про самопочуття: ich fühle mich (знахідний займенник), sich erholen von der Arbeit (давальний рамки). І відповідь на Rückfrage — по-людськи: години й чашки, а не голе ja. Вимовте все вдруге і вслухайтеся в mich і von der."
      de: "Der Beitrag hat drei Züge, und der zweite Redebeitrag ist der Zugewinn von B1: Auf A2 konntest du die Beschwerde nennen, auf B1 antwortest du auf die Frage danach. Die Beschwerde mit ihrer Dauer: seit zwei Wochen, Dativ Plural. Die reflexiven Rahmen führen das Gespräch über das Befinden: ich fühle mich (Pronomen im Akkusativ), sich erholen von der Arbeit (der Dativ des Rahmens). Und die Rückfrage bekommt eine menschliche Antwort — Stunden und Tassen, kein nacktes ja. Sag alles ein zweites Mal und hör dabei auf mich und auf von der."

  - id: sprechen-ratschlag-freundin
    outcomes: [ratschlaege-formulieren]
    type: speak
    mode: spoken-interaction
    instruction:
      en: "Answer your friend aloud — the checklist names the frames to reach for."
      ru: "Ответьте подруге вслух — чек-лист называет рамки, за которыми стоит потянуться."
      uk: "Дайте подрузі відповідь уголос — чек-лист називає рамки, до яких варто сягнути."
      de: "Antworte deiner Freundin laut — die Checkliste nennt die Rahmen, nach denen du greifen kannst."
    prompt:
      en: "A friend tells you: „Ich bin im Moment total gestresst und schlafe schlecht. Was würdest du machen?“ Give her advice aloud in four or more sentences, with at least two different Konjunktiv II frames — and soften one piece of advice with a wenn-clause."
      ru: "Подруга говорит вам: «Ich bin im Moment total gestresst und schlafe schlecht. Was würdest du machen?» Дайте ей совет вслух, четыре и более предложений, минимум с двумя разными рамками Konjunktiv II — и один совет смягчите придаточным с wenn."
      uk: "Подруга каже вам: «Ich bin im Moment total gestresst und schlafe schlecht. Was würdest du machen?» Дайте їй пораду вголос, чотири й більше речень, щонайменше з двома різними рамками Konjunktiv II — і одну пораду пом'якшіть підрядним із wenn."
      de: "Eine Freundin sagt zu dir: „Ich bin im Moment total gestresst und schlafe schlecht. Was würdest du machen?“ Gib ihr laut einen Rat, in vier oder mehr Sätzen, mit mindestens zwei verschiedenen Konjunktiv-II-Rahmen — und mach einen Ratschlag mit einem wenn-Satz weicher."
    goal:
      en: "Connected, friendly advice in the Konjunktiv II — not commands — with at least one softened suggestion."
      ru: "Связный дружеский совет в Konjunktiv II — не команды — и хотя бы одно смягчённое предложение."
      uk: "Зв'язна дружня порада в Konjunktiv II — не команди — і принаймні одна пом'якшена пропозиція."
      de: "Ein zusammenhängender, freundlicher Rat im Konjunktiv II — keine Befehle — und mindestens ein weicher formulierter Vorschlag."
    checklist:
      - en: "I used An deiner Stelle würde ich … with the infinitive at the very end."
        ru: "Я использовал(а) An deiner Stelle würde ich … с инфинитивом в самом конце."
        uk: "Я використав(ла) An deiner Stelle würde ich … з інфінітивом у самому кінці."
        de: "Ich habe An deiner Stelle würde ich … benutzt, mit dem Infinitiv ganz am Ende."
      - en: "A second frame joined it: Du solltest …, Du könntest … or Wie wäre es mit …?"
        ru: "К ней добавилась вторая рамка: Du solltest …, Du könntest … или Wie wäre es mit …?"
        uk: "До неї додалася друга рамка: Du solltest …, Du könntest … або Wie wäre es mit …?"
        de: "Ein zweiter Rahmen ist dazugekommen: Du solltest …, Du könntest … oder Wie wäre es mit …?"
      - en: "One piece of advice is softened: Es wäre besser, wenn du … würdest — with würdest at the very end of the wenn-clause."
        ru: "Один совет смягчён: Es wäre besser, wenn du … würdest — и würdest стоит в самом конце придаточного с wenn."
        uk: "Одна порада пом'якшена: Es wäre besser, wenn du … würdest — і würdest стоїть у самому кінці підрядного з wenn."
        de: "Ein Ratschlag ist weicher geworden: Es wäre besser, wenn du … würdest — und würdest steht ganz am Ende des wenn-Satzes."
    model_answer: "An deiner Stelle würde ich abends auf den zweiten Kaffee verzichten und öfter an die frische Luft gehen. Du solltest dich am Wochenende richtig von der Arbeit erholen — ohne Laptop und ohne E-Mails. Wie wäre es mit einem kurzen Spaziergang nach dem Abendessen? Und es wäre besser, wenn du vor Mitternacht ins Bett gehen würdest."
    model_translation:
      en: "If I were you, I would do without the second coffee in the evening and get out into the fresh air more often. You should properly recover from work at the weekend — no laptop, no emails. How about a short walk after dinner? And it would be better if you went to bed before midnight."
      ru: "Я бы на твоём месте отказался вечером от второго кофе и чаще бывал на свежем воздухе. Тебе стоило бы в выходные по-настоящему отдохнуть от работы — без ноутбука и без почты. Как насчёт короткой прогулки после ужина? И было бы лучше, если бы ты ложилась до полуночи."
      uk: "Я б на твоєму місці відмовився ввечері від другої кави й частіше бував на свіжому повітрі. Тобі варто було б у вихідні по-справжньому відпочити від роботи — без ноутбука й без пошти. Як щодо короткої прогулянки після вечері? І було б краще, якби ти лягала до півночі."
    explain:
      en: "Four frames in a row, one system. An deiner Stelle würde ich … is the default machine — infinitive at the very end. Du solltest is the one-word Konjunktiv II. Wie wäre es mit …? takes the dative (mit einem Spaziergang). And the softener Es wäre besser, wenn … würdest sends würdest to the very end of its clause, obeying the A2 Nebensatz rule. Advice among friends stays Konjunktiv II throughout — the bare imperative (geh ins Bett!) would be a command, not a suggestion."
      ru: "Четыре рамки подряд — одна система. An deiner Stelle würde ich … — машина по умолчанию, инфинитив в самом конце. Du solltest — однословный Konjunktiv II. Wie wäre es mit …? требует датива (mit einem Spaziergang). А смягчитель Es wäre besser, wenn … würdest отправляет würdest в самый конец придаточного — по правилу A2 о Nebensatz; русское «если бы» клеит «бы» к союзу, немецкий несёт würdest до конца. Совет между друзьями весь остаётся в Konjunktiv II — голый императив (geh ins Bett!) был бы командой, а не предложением."
      uk: "Чотири рамки поспіль — одна система. An deiner Stelle würde ich … — машина за замовчуванням, інфінітив у самому кінці. Du solltest — однослівний Konjunktiv II. Wie wäre es mit …? вимагає давального (mit einem Spaziergang). А пом'якшувач Es wäre besser, wenn … würdest відправляє würdest у самий кінець підрядного — за правилом A2 про Nebensatz; українське «якби» клеїть «б» до сполучника, німецька несе würdest до кінця. Порада між друзями вся залишається в Konjunktiv II — голий імператив (geh ins Bett!) був би командою, а не пропозицією."
      de: "Vier Rahmen hintereinander, ein System. An deiner Stelle würde ich … ist die Standard-Maschine — der Infinitiv ganz am Ende. Du solltest ist der Konjunktiv II in einem einzigen Wort. Wie wäre es mit …? verlangt den Dativ (mit einem Spaziergang). Und der Weichmacher Es wäre besser, wenn … würdest schickt würdest ans Ende seines Nebensatzes, nach der A2-Regel für wenn. Ein Rat unter Freundinnen bleibt durchgehend im Konjunktiv II — der bloße Imperativ (geh ins Bett!) wäre ein Befehl, kein Vorschlag."

  - id: sprechen-gewohnheiten
    outcomes: [gewohnheiten-beschreiben]
    type: speak
    mode: spoken-production
    instruction:
      en: "Tell it aloud — and if you can, listen to yourself: the checklist names what to listen for."
      ru: "Расскажите вслух — и, если можете, послушайте себя: чек-лист подсказывает, на что обращать внимание."
      uk: "Розкажіть уголос — і, якщо можете, послухайте себе: чек-лист підказує, на що звертати увагу."
      de: "Erzähl es laut — und hör dir dabei selbst zu, wenn du kannst: Die Checkliste sagt, worauf es ankommt."
    prompt:
      en: "How do you look after your health — and what has changed in the last few years? Sleep, food, movement, screens: describe your habits aloud in six or more sentences, including at least one thing you used to do differently."
      ru: "Как вы заботитесь о своём здоровье — и что изменилось за последние годы? Сон, еда, движение, экраны: опишите свои привычки вслух, шесть и более предложений, включая хотя бы одну вещь, которую раньше вы делали иначе."
      uk: "Як ви дбаєте про своє здоров'я — і що змінилося за останні роки? Сон, їжа, рух, екрани: опишіть свої звички вголос, шість і більше речень, включно бодай з однією річчю, яку раніше ви робили інакше."
      de: "Wie kümmerst du dich um deine Gesundheit — und was hat sich in den letzten Jahren verändert? Schlaf, Essen, Bewegung, Bildschirme: Beschreib deine Gewohnheiten laut, in sechs oder mehr Sätzen, und nenne dabei mindestens eine Sache, die du früher anders gemacht hast."
    goal:
      en: "A connected spoken description of your habits, with a before/after contrast."
      ru: "Связный устный рассказ о привычках с контрастом «раньше/теперь»."
      uk: "Зв'язна усна розповідь про звички з контрастом «раніше/тепер»."
      de: "Eine zusammenhängende mündliche Beschreibung deiner Gewohnheiten, mit einem Kontrast von früher und heute."
    checklist:
      - en: "At least two preposition frames carry the right case: sich kümmern um + Akk, sich erholen von + Dat, verzichten auf + Akk."
        ru: "Хотя бы две предложные рамки несут верный падеж: sich kümmern um + Akk, sich erholen von + Dat, verzichten auf + Akk."
        uk: "Принаймні дві прийменникові рамки несуть правильний відмінок: sich kümmern um + Akk, sich erholen von + Dat, verzichten auf + Akk."
        de: "Mindestens zwei Präpositionsrahmen tragen den richtigen Kasus: sich kümmern um + Akk, sich erholen von + Dat, verzichten auf + Akk."
      - en: "At least one null-article phrase wears the strong ending: frisches Obst, starker Kaffee, warmes Wasser."
        ru: "Хотя бы одна группа без артикля носит сильное окончание: frisches Obst, starker Kaffee, warmes Wasser."
        uk: "Принаймні одна група без артикля носить сильне закінчення: frisches Obst, starker Kaffee, warmes Wasser."
        de: "Mindestens eine artikellose Gruppe trägt die starke Endung: frisches Obst, starker Kaffee, warmes Wasser."
      - en: "Before and after are contrasted: früher + Perfekt, heute + Präsens."
        ru: "«Раньше» и «теперь» противопоставлены: früher + Perfekt, heute + Präsens."
        uk: "«Раніше» і «тепер» протиставлені: früher + Perfekt, heute + Präsens."
        de: "Früher und heute stehen im Kontrast: früher + Perfekt, heute + Präsens."
    model_answer: "Früher habe ich mich kaum um meine Gesundheit gekümmert: viel starker Kaffee, wenig Schlaf, kaum Bewegung. Heute sieht mein Tag anders aus. Ich esse jeden Morgen frisches Obst und trinke zuerst ein Glas warmes Wasser. Mittags mache ich einen kurzen Spaziergang, und am Wochenende erhole ich mich richtig von der Arbeit. Auf den dritten Kaffee verzichte ich inzwischen gern. Und meine Augen lasse ich jetzt jedes Jahr kontrollieren."
    model_translation:
      en: "I used to hardly look after my health: lots of strong coffee, little sleep, hardly any exercise. Today my day looks different. Every morning I eat fresh fruit and first drink a glass of warm water. At midday I take a short walk, and at the weekend I properly recover from work. I now gladly do without the third coffee. And I have my eyes checked every year now."
      ru: "Раньше я почти не заботился о своём здоровье: много крепкого кофе, мало сна, почти никакого движения. Сегодня мой день выглядит иначе. Каждое утро я ем свежие фрукты и первым делом выпиваю стакан тёплой воды. В обед я делаю короткую прогулку, а в выходные по-настоящему восстанавливаюсь после работы. От третьего кофе я теперь с удовольствием отказываюсь. А зрение я теперь проверяю каждый год."
      uk: "Раніше я майже не дбав про своє здоров'я: багато міцної кави, мало сну, майже ніякого руху. Сьогодні мій день виглядає інакше. Щоранку я їм свіжі фрукти й насамперед випиваю склянку теплої води. В обід я роблю коротку прогулянку, а у вихідні по-справжньому відновлююся після роботи. Від третьої кави я тепер залюбки відмовляюся. А зір я тепер перевіряю щороку."
    explain:
      en: "The four tools of the unit meet in one description. The frames with their fixed cases: um meine Gesundheit (accusative), von der Arbeit (dative), auf den dritten Kaffee (accusative). The strong endings where no article stands: starker Kaffee, frisches Obst, warmes Wasser. lassen for what someone else does: lasse … kontrollieren, bare infinitive at the end. And the before/after contrast that A2's Perfekt still carries: früher habe ich … gekümmert, heute esse ich. Compare your take against that skeleton, not against the exact words."
      ru: "Четыре инструмента урока сходятся в одном рассказе. Рамки с фиксированными падежами: um meine Gesundheit (аккузатив), von der Arbeit (датив), auf den dritten Kaffee (аккузатив). Сильные окончания там, где нет артикля: starker Kaffee, frisches Obst, warmes Wasser. lassen для того, что делает другой: lasse … kontrollieren, голый инфинитив в конце. И контраст «раньше/теперь», который по-прежнему несёт Perfekt с A2: früher habe ich … gekümmert, heute esse ich. Сверяйте свой рассказ с этим скелетом, а не с точными словами."
      uk: "Чотири інструменти уроку сходяться в одній розповіді. Рамки з фіксованими відмінками: um meine Gesundheit (знахідний), von der Arbeit (давальний), auf den dritten Kaffee (знахідний). Сильні закінчення там, де немає артикля: starker Kaffee, frisches Obst, warmes Wasser. lassen для того, що робить інший: lasse … kontrollieren, голий інфінітив у кінці. І контраст «раніше/тепер», який так само несе Perfekt з A2: früher habe ich … gekümmert, heute esse ich. Звіряйте свою розповідь із цим скелетом, а не з точними словами."
      de: "Die vier Werkzeuge der Einheit treffen sich in einer einzigen Beschreibung. Die Rahmen mit ihrem festen Kasus: um meine Gesundheit (Akkusativ), von der Arbeit (Dativ), auf den dritten Kaffee (Akkusativ). Die starken Endungen dort, wo kein Artikel steht: starker Kaffee, frisches Obst, warmes Wasser. lassen für das, was ein anderer tut: lasse … kontrollieren, bloßer Infinitiv am Ende. Und den Kontrast von früher und heute trägt weiterhin das Perfekt aus A2: früher habe ich … gekümmert, heute esse ich. Vergleiche deine Version mit diesem Gerüst, nicht mit den genauen Wörtern."
