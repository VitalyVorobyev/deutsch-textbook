    answer: "Der Aufzug ist kaputt, sodass wir die Treppe nehmen müssen."
    key_tokens: ["sodass", "müssen"]
    explain: { en: "Graded are both ends of the rule: sodass opening the clause and müssen closing it. sodass is a conjunction, so what follows it is a subordinate clause and the finite verb goes to the very wall — sodass wir die Treppe nehmen müssen, with the infinitive in front of the modal. The adverb route says the same thing with different machinery and a different order: Der Aufzug ist kaputt. Deshalb müssen wir die Treppe nehmen. Mixing them produces sodass müssen wir …, which is the collapse this item watches for.", ru: "Оцениваются оба конца правила: sodass, открывающий придаточное, и müssen, закрывающий его. sodass — союз, поэтому за ним придаточное, и спрягаемый глагол уходит к самой стене: sodass wir die Treppe nehmen müssen, где инфинитив стоит перед модальным. Наречный путь выражает то же самое другим механизмом и другим порядком: Der Aufzug ist kaputt. Deshalb müssen wir die Treppe nehmen. Смешение даёт sodass müssen wir … — именно эту ошибку задание и ловит.", uk: "Оцінюються обидва кінці правила: sodass, що відкриває підрядне, і müssen, що його закриває. sodass — сполучник, тому за ним підрядне, і відмінюване дієслово йде до самої стіни: sodass wir die Treppe nehmen müssen, де інфінітив стоїть перед модальним. Прислівниковий шлях виражає те саме іншим механізмом і іншим порядком: Der Aufzug ist kaputt. Deshalb müssen wir die Treppe nehmen. Змішування дає sodass müssen wir … — саме цю помилку завдання й ловить.", de: "Bewertet werden beide Enden der Regel: sodass am Anfang des Nebensatzes und müssen an seinem Ende. sodass ist eine Konjunktion, dahinter steht also ein Nebensatz, und das finite Verb geht an die Wand — sodass wir die Treppe nehmen müssen, mit dem Infinitiv vor dem Modalverb. Der Adverbweg sagt dasselbe mit anderer Maschine und anderer Stellung: Der Aufzug ist kaputt. Deshalb müssen wir die Treppe nehmen. Wer beides mischt, schreibt sodass müssen wir … — genau darauf schaut diese Aufgabe." }

  - id: uebersetzen-ohne-zu
    outcomes: [plan-formulieren]
    type: translate
    focus: ohne-statt-zu
    instruction:
      en: "Translate into German. Use ohne … zu. For 'say goodbye' take sich verabschieden."
      ru: "Переведите на немецкий. Используйте ohne … zu. Для «попрощаться» возьмите sich verabschieden."
      uk: "Перекладіть німецькою. Використайте ohne … zu. Для «попрощатися» візьміть sich verabschieden."
      de: "Übersetze ins Deutsche. Benutze ohne … zu. Für den Abschied nimm sich verabschieden."
    prompt_en: "He left the meeting without saying goodbye."
    prompt_ru: "Он ушёл со встречи, не попрощавшись."
    prompt_uk: "Він пішов зі зустрічі, не попрощавшись."
    answer: "Er verließ die Besprechung, ohne sich zu verabschieden."
    key_tokens: ["ohne", "zu", "verabschieden"]
    accept:
      # Spoken German would tell the same thing in the Perfekt; the graded frame is untouched.
      - "Er hat die Besprechung verlassen, ohne sich zu verabschieden."
    explain: { en: "ohne … zu is a two-ended frame like um … zu: ohne opens the clause, zu stands directly in front of the infinitive, and the infinitive is the last word. What sits between them here is the reflexive pronoun, which belongs to the verb and cannot be left out — sich verabschieden is one item. There is no subject inside the clause, which is why it works only when the two halves share one: it is he who left and he who did not say goodbye. And nothing in the clause is negated — the ohne already carries the negation.", ru: "ohne … zu — двусторонняя рамка, как um … zu: ohne открывает придаточное, zu стоит прямо перед инфинитивом, а инфинитив — последнее слово. Между ними здесь возвратное местоимение, которое принадлежит глаголу и опустить его нельзя: sich verabschieden — единое целое. Подлежащего внутри придаточного нет, поэтому конструкция работает только при общем подлежащем: ушёл он и не попрощался тоже он. И ничего внутри не отрицается — отрицание уже несёт само ohne.", uk: "ohne … zu — двобічна рамка, як um … zu: ohne відкриває підрядне, zu стоїть прямо перед інфінітивом, а інфінітив — останнє слово. Між ними тут зворотний займенник, який належить дієслову і його не можна опустити: sich verabschieden — єдине ціле. Підмета всередині підрядного немає, тому конструкція працює лише за спільного підмета: пішов він і не попрощався теж він. І нічого всередині не заперечується — заперечення вже несе саме ohne.", de: "ohne … zu ist ein Rahmen mit zwei Enden wie um … zu: ohne eröffnet den Satz, zu steht direkt vor dem Infinitiv, und der Infinitiv ist das letzte Wort. Dazwischen steht hier das Reflexivpronomen, das zum Verb gehört und nicht wegfallen darf — sich verabschieden ist eine Einheit. Ein Subjekt gibt es im Satz nicht, deshalb funktioniert er nur bei gemeinsamem Subjekt: Er ging, und er verabschiedete sich nicht. Und verneint wird darin nichts — die Verneinung steckt schon im ohne." }

  - id: uebersetzen-reflexiv-praeposition
    outcomes: [gewohnheiten-beschreiben]
    type: translate
    focus: reflexiv-praeposition
    instruction:
      en: "Translate into German. Use sich interessieren."
      ru: "Переведите на немецкий. Используйте sich interessieren."
      uk: "Перекладіть німецькою. Вживайте sich interessieren."
      de: "Übersetze ins Deutsche. Benutze sich interessieren."
    prompt_en: "I am interested in old films."
    prompt_ru: "Я интересуюсь старыми фильмами."
    prompt_uk: "Я цікавлюся старими фільмами."
    answer: "Ich interessiere mich für alte Filme."
    key_tokens: ["mich", "für"]
    accept:
      - "Für alte Filme interessiere ich mich."
    explain: { en: "The verb comes as a package of three parts and both graded ones are in it: the reflexive pronoun mich and the preposition für, which then takes the accusative — alte Filme. Learn the whole frame in one piece, sich interessieren für, because nothing in the meaning predicts the preposition: sich freuen takes auf or über, sich kümmern takes um, sich ärgern takes über. Dropping the pronoun leaves ich interessiere, which means something else entirely — that would be me being interesting to somebody.", ru: "Глагол приходит комплектом из трёх частей, и обе оцениваемые в нём: возвратное местоимение mich и предлог für, который дальше требует аккузатива — alte Filme. Заучивайте рамку целиком, sich interessieren für, потому что из значения предлог не выводится: sich freuen берёт auf или über, sich kümmern — um, sich ärgern — über. Без местоимения остаётся ich interessiere, а это уже совсем другое: тогда интересен кому-то я.", uk: "Дієслово приходить комплектом із трьох частин, і обидві оцінювані в ньому: зворотний займенник mich і прийменник für, який далі вимагає акузатива — alte Filme. Заучуйте рамку цілком, sich interessieren für, бо зі значення прийменник не виводиться: sich freuen бере auf або über, sich kümmern — um, sich ärgern — über. Без займенника лишається ich interessiere, а це вже зовсім інше: тоді цікавий комусь я.", de: "Das Verb kommt als Paket aus drei Teilen, und beide bewerteten Teile stecken darin: das Reflexivpronomen mich und die Präposition für, die dann den Akkusativ nimmt — alte Filme. Lern den ganzen Rahmen als Stück, sich interessieren für, denn aus der Bedeutung folgt die Präposition nicht: sich freuen nimmt auf oder über, sich kümmern um, sich ärgern über. Ohne das Pronomen bleibt ich interessiere, und das heißt etwas ganz anderes — dann bin ich für jemanden interessant." }

  - id: uebersetzen-zweiteilige-konnektoren
    outcomes: [argumente-verbinden]
    type: translate
    focus: zweiteilige-konnektoren
    instruction:
      en: "Translate into German. Use nicht nur … sondern auch."
      ru: "Переведите на немецкий. Используйте nicht nur … sondern auch."
      uk: "Перекладіть німецькою. Використайте nicht nur … sondern auch."
      de: "Übersetze ins Deutsche. Benutze nicht nur … sondern auch."
    prompt_en: "The course is not only cheap but also close by."
    prompt_ru: "Курс не только дешёвый, но и находится рядом."
    prompt_uk: "Курс не тільки дешевий, а й розташований поруч."
    answer: "Der Kurs ist nicht nur billig, sondern auch in der Nähe."
    key_tokens: ["nur", "sondern", "auch"]
    accept:
      - "Der Kurs ist nicht nur günstig, sondern auch in der Nähe."
    explain: { en: "A two-part connector is one word split in two, and both parts have to be there: nicht nur in front of the first item, sondern auch in front of the second. The half that gets forgotten is auch, and without it the sentence turns into a plain correction — nicht A, sondern B says B instead of A, while nicht nur A, sondern auch B says both. The comma goes before sondern. Note too that the nicht here is not a negation of the course; it belongs to nur.", ru: "Двойной союз — это одно слово, разорванное надвое, и обе части обязательны: nicht nur перед первым членом, sondern auch перед вторым. Забывают обычно auch — и без него предложение превращается в простое исправление: nicht A, sondern B значит «не A, а B», тогда как nicht nur A, sondern auch B значит «и то, и другое». Запятая ставится перед sondern. И ещё: nicht здесь не отрицает курс, оно принадлежит слову nur.", uk: "Подвійний сполучник — це одне слово, розірване надвоє, і обидві частини обов'язкові: nicht nur перед першим членом, sondern auch перед другим. Забувають зазвичай auch — і без нього речення перетворюється на просте виправлення: nicht A, sondern B означає «не A, а B», тоді як nicht nur A, sondern auch B означає «і те, і те». Кома ставиться перед sondern. І ще: nicht тут не заперечує курс, воно належить слову nur.", de: "Ein zweiteiliger Konnektor ist ein Wort in zwei Stücken, und beide müssen da sein: nicht nur vor dem ersten Glied, sondern auch vor dem zweiten. Vergessen wird meist das auch — und ohne es wird der Satz zur bloßen Korrektur: nicht A, sondern B heißt B statt A, nicht nur A, sondern auch B heißt beides. Das Komma steht vor sondern. Und das nicht verneint hier nicht den Kurs; es gehört zu nur." }

  - id: uebersetzen-lassen
    outcomes: [beschwerden-schildern]
    type: translate
    focus: lassen-verwendung
    instruction:
      en: "You are not doing it yourself — somebody does it for you. Use lassen; for 'examine' take untersuchen."
      ru: "Вы не делаете это сами — это делают для вас. Используйте lassen; для «проверить» возьмите untersuchen."
      uk: "Ви не робите це самі — це роблять для вас. Використайте lassen; для «перевірити» візьміть untersuchen."
      de: "Du machst es nicht selbst — jemand macht es für dich. Benutze lassen; für das Prüfen nimm untersuchen."
    prompt_en: "I am having my eyes examined on Friday."
    prompt_ru: "В пятницу мне проверят глаза."
    prompt_uk: "У п'ятницю мені перевірять очі."
    answer: "Ich lasse am Freitag meine Augen untersuchen."
    key_tokens: ["lasse", "untersuchen"]
    accept:
      - "Am Freitag lasse ich meine Augen untersuchen."
      - "Ich lasse mir am Freitag die Augen untersuchen."
    explain: { en: "lassen builds a bracket exactly like a modal verb: lasse in position 2, the bare infinitive at the very end, and no zu anywhere. What the construction adds is who acts — not me. The doctor is never named, and that is the point of the form: Ich lasse meine Augen untersuchen says the examining is arranged, not done by me, while Ich untersuche meine Augen would say I do it myself. The dative variant Ich lasse mir die Augen untersuchen says the same thing and marks whose eyes rather than repeating the possessive.", ru: "lassen строит рамку в точности как модальный глагол: lasse на втором месте, чистый инфинитив в самом конце, и никакого zu. Новое, что вносит конструкция, — кто действует, и это не я. Врача не называют вовсе, в этом и смысл формы: Ich lasse meine Augen untersuchen значит, что проверку организуют, а не что её делаю я, тогда как Ich untersuche meine Augen означало бы «я сам осматриваю свои глаза». Дативный вариант Ich lasse mir die Augen untersuchen говорит то же самое, помечая принадлежность падежом вместо притяжательного местоимения.", uk: "lassen будує рамку точно як модальне дієслово: lasse на другому місці, чистий інфінітив у самому кінці, і жодного zu. Нове, що вносить конструкція, — хто діє, і це не я. Лікаря не називають зовсім, у цьому й суть форми: Ich lasse meine Augen untersuchen означає, що перевірку організують, а не що її роблю я, тоді як Ich untersuche meine Augen означало б «я сам оглядаю свої очі». Давальний варіант Ich lasse mir die Augen untersuchen каже те саме, позначаючи належність відмінком замість присвійного займенника.", de: "lassen baut eine Klammer wie ein Modalverb: lasse auf Position 2, der reine Infinitiv ganz am Ende, nirgends ein zu. Neu ist, wer handelt — nämlich nicht ich. Die Ärztin wird gar nicht genannt, und das ist der Sinn der Form: Ich lasse meine Augen untersuchen heißt, dass die Untersuchung veranlasst wird, nicht dass ich sie mache; Ich untersuche meine Augen hieße genau das. Die Dativvariante Ich lasse mir die Augen untersuchen sagt dasselbe und markiert die Zugehörigkeit über den Kasus statt über das Possessivum." }

  - id: uebersetzen-pronomen-stellung
    outcomes: [mitteilung-weitergeben]
    type: translate
    focus: pronomen-stellung
    instruction:
      en: "Translate into German. There are two objects in the sentence — one pronoun and one noun."
      ru: "Переведите на немецкий. В предложении два дополнения — местоимение и существительное."
      uk: "Перекладіть німецькою. У реченні два додатки — займенник та іменник."
      de: "Übersetze ins Deutsche. Der Satz hat zwei Objekte — ein Pronomen und ein Nomen."
    prompt_en: "I gave him your message."
    prompt_ru: "Я передал ему твоё сообщение."
    prompt_uk: "Я передав йому твоє повідомлення."
    answer: "Ich habe ihm deine Nachricht gegeben."
    key_tokens: ["ihm", "Nachricht"]
    accept:
      # Written narrative would use the Präteritum; the graded pair keeps its order.
      - "Ich gab ihm deine Nachricht."
    explain: { en: "Graded is the order of the two objects, so both are pinned. The rule is short and it beats the case rule: a pronoun object comes in front of a noun object, whatever their cases are. With two nouns the dative leads (Ich habe dem Kollegen die Nachricht gegeben); the moment one of them becomes a pronoun, the pronoun moves in front — ihm deine Nachricht — and it would do the same if it were the accusative one (Ich habe sie dem Kollegen gegeben). Short and known first, long and new last: that is the principle underneath it.", ru: "Оценивается порядок двух дополнений, поэтому пришпилены оба. Правило короткое, и оно сильнее падежного: местоименное дополнение идёт впереди именного, какими бы ни были падежи. Если оба существительные, впереди датив (Ich habe dem Kollegen die Nachricht gegeben); как только одно из них становится местоимением, местоимение выходит вперёд — ihm deine Nachricht, — и точно так же поступило бы местоимение в аккузативе (Ich habe sie dem Kollegen gegeben). Короткое и известное — раньше, длинное и новое — позже: вот принцип под этим правилом.", uk: "Оцінюється порядок двох додатків, тому пришпилені обидва. Правило коротке, і воно сильніше за відмінкове: займенниковий додаток іде попереду іменникового, хоч би якими були відмінки. Якщо обидва іменники, попереду давальний (Ich habe dem Kollegen die Nachricht gegeben); щойно один із них стає займенником, займенник виходить наперед — ihm deine Nachricht, — і так само вчинив би займенник в акузативі (Ich habe sie dem Kollegen gegeben). Коротке й відоме — раніше, довге й нове — пізніше: ось принцип під цим правилом.", de: "Bewertet wird die Reihenfolge der beiden Objekte, deshalb sind beide gepinnt. Die Regel ist kurz und sie schlägt die Kasusregel: Ein Pronomenobjekt steht vor einem Nomenobjekt, gleich welche Kasus vorliegen. Bei zwei Nomen führt der Dativ (Ich habe dem Kollegen die Nachricht gegeben); sobald eines davon ein Pronomen wird, rückt das Pronomen nach vorn — ihm deine Nachricht —, und ein Akkusativpronomen täte dasselbe (Ich habe sie dem Kollegen gegeben). Kurz und bekannt zuerst, lang und neu zuletzt: Das ist das Prinzip darunter." }

  - id: tabelle-partizip-attribut
    outcomes: [text-zusammenfassen]
    type: table
    focus: partizip-adjektiv
    title: "Partizip als Attribut"
    instruction:
      en: "Left: the bare participle. Right: the same participle in front of its noun, with the ending the article demands."
      ru: "Слева — чистое причастие. Справа — оно же перед существительным, с окончанием, которого требует артикль."
      uk: "Ліворуч — чистий дієприкметник. Праворуч — він же перед іменником, із закінченням, якого вимагає артикль."
      de: "Links das reine Partizip. Rechts dasselbe Partizip vor seinem Nomen, mit der Endung, die das Artikelwort verlangt."
    columns: ["Partizip", "Attribut"]
    rows:
      - { label: "kochen · das Ei", cells: [{ answer: "gekocht", given: true }, { answer: "das gekochte Ei" }] }
      - { label: "planen · das Treffen", cells: [{ answer: "geplant" }, { answer: "das geplante Treffen" }] }
      - { label: "lachen · die Kinder", cells: [{ answer: "lachend" }, { answer: "die lachenden Kinder" }] }
    explain: { en: "A participle put in front of a noun becomes an adjective and takes an adjective ending — that ending is the whole exercise, because the bare form is what learners leave standing there. The two participles do different jobs: the Partizip II is passive and finished (das geplante Treffen — somebody planned it), while the Partizip I is active and ongoing and is built from the infinitive plus -d (lachen → lachend → die lachenden Kinder). This is how a notice compresses a whole relative clause into two words.", ru: "Причастие, поставленное перед существительным, становится прилагательным и получает соответствующее окончание — и всё задание именно про него, потому что чаще всего там оставляют чистую форму. Два причастия делают разную работу: Partizip II пассивно и завершено (das geplante Treffen — встречу кто-то запланировал), а Partizip I активно и длится и образуется от инфинитива плюс -d (lachen → lachend → die lachenden Kinder). Именно так объявление сжимает целое придаточное в два слова.", uk: "Дієприкметник, поставлений перед іменником, стає прикметником і отримує відповідне закінчення — і все завдання саме про нього, бо найчастіше там залишають чисту форму. Два дієприкметники роблять різну роботу: Partizip II пасивний і завершений (das geplante Treffen — зустріч хтось запланував), а Partizip I активний і триває й утворюється від інфінітива плюс -d (lachen → lachend → die lachenden Kinder). Саме так оголошення стискає ціле підрядне у два слова.", de: "Ein Partizip vor einem Nomen wird zum Adjektiv und nimmt eine Adjektivendung — und genau um die geht es hier, denn stehen bleibt meist die reine Form. Die beiden Partizipien tun Verschiedenes: Das Partizip II ist passivisch und abgeschlossen (das geplante Treffen — jemand hat es geplant), das Partizip I ist aktivisch und im Verlauf und entsteht aus Infinitiv plus -d (lachen → lachend → die lachenden Kinder). So verdichtet ein Aushang einen ganzen Relativsatz zu zwei Wörtern." }

  # --- Schreiben ---
  - id: schreiben-beschwerde-zug
    outcomes: [beschwerde-schreiben, folgen-benennen]
    type: write
    instruction:
      en: "Write the complaint yourself — the list below is what to check it against, not a form to fill in."
      ru: "Напишите жалобу сами — список ниже подсказывает, что в ней проверить, а не бланк для заполнения."
      uk: "Напишіть скаргу самі — список нижче підказує, що в ній перевірити, а не бланк для заповнення."
      de: "Schreib die Beschwerde selbst — die Liste unten sagt, woran du sie prüfen kannst, sie ist kein Formular."
    prompt:
      en: "Your train from Hamburg to Munich was cancelled at short notice because of a strike. You waited two hours, missed your connection in Nuremberg and arrived four hours late; the hotel had already given your room away. Write a formal complaint to the railway company."
      ru: "Ваш поезд из Гамбурга в Мюнхен отменили в последний момент из-за забастовки. Вы прождали два часа, не успели на пересадку в Нюрнберге и приехали на четыре часа позже; отель тем временем отдал ваш номер. Напишите официальную жалобу в железнодорожную компанию."
      uk: "Ваш потяг із Гамбурга до Мюнхена скасували в останній момент через страйк. Ви прочекали дві години, не встигли на пересадку в Нюрнберзі й приїхали на чотири години пізніше; готель тим часом віддав ваш номер. Напишіть офіційну скаргу до залізничної компанії."
      de: "Dein Zug von Hamburg nach München fiel wegen eines Streiks kurzfristig aus. Du hast zwei Stunden gewartet, den Anschluss in Nürnberg verpasst und bist vier Stunden zu spät angekommen; das Hotel hatte dein Zimmer inzwischen weitergegeben. Schreib eine formelle Beschwerde an die Bahn."
    goal:
      en: "Six to eight sentences: what was booked, what happened, what followed from it, and what you are asking for — formal throughout, and factual rather than angry."
      ru: "Шесть-восемь предложений: что было забронировано, что произошло, что из этого последовало и чего вы требуете — официальным тоном и по фактам, а не эмоционально."
      uk: "Шість-вісім речень: що було заброньовано, що сталося, що з цього випливло і чого ви вимагаєте — офіційним тоном і по фактах, а не емоційно."
      de: "Sechs bis acht Sätze: was gebucht war, was geschah, was daraus folgte und was du forderst — durchgehend formell und sachlich statt wütend."
    requirements:
      - en: "Open and close formally: Sehr geehrte Damen und Herren, … Mit freundlichen Grüßen. Stay with Sie throughout."
        ru: "Официальное начало и конец: Sehr geehrte Damen und Herren, … Mit freundlichen Grüßen. Форму Sie выдерживайте до конца."
        uk: "Офіційний початок і кінець: Sehr geehrte Damen und Herren, … Mit freundlichen Grüßen. Форму Sie витримуйте до кінця."
        de: "Formell beginnen und schließen: Sehr geehrte Damen und Herren, … Mit freundlichen Grüßen. Bleib durchgehend beim Sie."
      - en: "Name the facts first — train, date, route, booking number — before you name the problem. A complaint that opens with the annoyance is harder to process."
        ru: "Сначала факты — поезд, дата, маршрут, номер брони, — и только потом проблема. Жалобу, которая начинается с возмущения, труднее обработать."
        uk: "Спочатку факти — потяг, дата, маршрут, номер броні, — і лише потім проблема. Скаргу, що починається з обурення, важче опрацювати."
        de: "Nenn zuerst die Fakten — Zug, Datum, Strecke, Buchungsnummer — und erst dann das Problem. Eine Beschwerde, die mit dem Ärger anfängt, lässt sich schwerer bearbeiten."
      - en: "Give the cause with wegen + genitive (wegen eines Streiks) and the consequence with sodass (…, sodass ich meinen Anschluss verpasst habe). Those two sentences are the core of the letter."
        ru: "Причину назовите через wegen + генитив (wegen eines Streiks), следствие — через sodass (…, sodass ich meinen Anschluss verpasst habe). Эти два предложения и есть ядро письма."
        uk: "Причину назвіть через wegen + генитив (wegen eines Streiks), наслідок — через sodass (…, sodass ich meinen Anschluss verpasst habe). Ці два речення і є ядром листа."
        de: "Nenn den Grund mit wegen + Genitiv (wegen eines Streiks) und die Folge mit sodass (…, sodass ich meinen Anschluss verpasst habe). Diese beiden Sätze sind der Kern des Briefs."
      - en: "End with one clear request and a date: Ich bitte Sie, mir die Kosten bis zum 30. September zu erstatten. A complaint without a request is only a report."
        ru: "Закончите одним чётким требованием и датой: Ich bitte Sie, mir die Kosten bis zum 30. September zu erstatten. Жалоба без требования — это просто отчёт."
        uk: "Закінчіть одним чітким проханням і датою: Ich bitte Sie, mir die Kosten bis zum 30. September zu erstatten. Скарга без вимоги — це просто звіт."
        de: "Schließ mit einer klaren Forderung und einem Datum: Ich bitte Sie, mir die Kosten bis zum 30. September zu erstatten. Eine Beschwerde ohne Forderung ist nur ein Bericht."
    min_words: 45
    model_answer: "Sehr geehrte Damen und Herren, am 12. September wollte ich mit dem ICE 585 von Hamburg nach München fahren, Buchungsnummer XK4821. Wegen eines Streiks fiel dieser Zug kurzfristig aus. Ich habe zwei Stunden am Gleis gewartet, sodass ich meinen Anschluss in Nürnberg verpasst habe und erst vier Stunden später in München angekommen bin. Mein Hotelzimmer war zu diesem Zeitpunkt bereits anderweitig vergeben worden, und ich musste eine teurere Unterkunft nehmen. Die Rechnung über 140 Euro lege ich bei. Ich bitte Sie, mir den Fahrpreis und die zusätzlichen Kosten bis zum 30. September zu erstatten. Mit freundlichen Grüßen, Anna Weber"
    model_translation:
      en: "Dear Sir or Madam, on 12 September I intended to travel from Hamburg to Munich on ICE 585, booking number XK4821. Because of a strike this train was cancelled at short notice. I waited two hours on the platform, so that I missed my connection in Nuremberg and only arrived in Munich four hours later. By that time my hotel room had already been given to somebody else, and I had to take more expensive accommodation. I enclose the invoice for 140 euros. I ask you to refund the fare and the additional costs by 30 September. Yours faithfully, Anna Weber"
      ru: "Уважаемые дамы и господа! 12 сентября я собиралась ехать поездом ICE 585 из Гамбурга в Мюнхен, номер брони XK4821. Из-за забастовки этот поезд был отменён в последний момент. Я прождала на платформе два часа, так что не успела на пересадку в Нюрнберге и приехала в Мюнхен только на четыре часа позже. К этому моменту мой номер в отеле уже отдали другим, и мне пришлось взять более дорогое жильё. Счёт на 140 евро прилагаю. Прошу возместить мне стоимость проезда и дополнительные расходы до 30 сентября. С уважением, Анна Вебер"
      uk: "Шановні пані та панове! 12 вересня я збиралася їхати потягом ICE 585 з Гамбурга до Мюнхена, номер броні XK4821. Через страйк цей потяг було скасовано в останній момент. Я прочекала на платформі дві години, тож не встигла на пересадку в Нюрнберзі й приїхала до Мюнхена лише на чотири години пізніше. На той момент мій номер у готелі вже віддали іншим, і мені довелося взяти дорожче житло. Рахунок на 140 євро додаю. Прошу відшкодувати мені вартість проїзду та додаткові витрати до 30 вересня. З повагою, Анна Вебер"
    explain: { en: "Compare your draft with the model's moves rather than its words. The facts come first and carry a booking number, so the company can find the journey without writing back. The cause is a genitive phrase and the consequence a sodass-clause, which is the pair a complaint is actually built from — everything else is detail hanging off those two. The past passive vergeben worden war says the room went without saying who gave it away, which is exactly the right amount of blame to assign to a hotel that is not the addressee. And the letter closes with one request and one date; a complaint that asks for nothing gets filed rather than answered.", ru: "Сверяйте черновик с ходами образца, а не со словами. Сначала идут факты, и среди них номер брони — чтобы компания нашла поездку, не переспрашивая. Причина оформлена генитивной группой, следствие — придаточным с sodass: именно эта пара и составляет каркас жалобы, всё остальное к ней подвешено. Пассив прошедшего vergeben worden war сообщает, что номер отдали, не называя кто, — ровно столько вины, сколько уместно возложить на отель, который тут не адресат. И письмо закрывается одним требованием и одной датой: жалобу, которая ничего не просит, подшивают, а не отвечают на неё.", uk: "Звіряйте чернетку з ходами зразка, а не зі словами. Спочатку йдуть факти, і серед них номер броні — щоб компанія знайшла поїздку, не перепитуючи. Причина оформлена генитивною групою, наслідок — підрядним із sodass: саме ця пара й складає каркас скарги, усе інше до неї підвішене. Пасив минулого vergeben worden war повідомляє, що номер віддали, не називаючи кому саме належить провина, — рівно стільки, скільки доречно покласти на готель, який тут не адресат. І лист закривається однією вимогою й однією датою: скаргу, що нічого не просить, підшивають, а не відповідають на неї.", de: "Vergleiche deinen Entwurf mit den Zügen des Musters, nicht mit seinen Wörtern. Zuerst kommen die Fakten, und darunter eine Buchungsnummer, damit die Bahn die Fahrt ohne Rückfrage findet. Der Grund steht als Genitivgruppe, die Folge als sodass-Satz — dieses Paar ist das Gerüst jeder Beschwerde, alles andere hängt daran. Das Vergangenheitspassiv vergeben worden war sagt, dass das Zimmer weg war, ohne zu nennen, wer es weitergab: genau so viel Schuld, wie einem Hotel zusteht, das hier nicht der Adressat ist. Und der Brief schließt mit einer Forderung und einem Datum; eine Beschwerde ohne Forderung wird abgeheftet statt beantwortet." }
