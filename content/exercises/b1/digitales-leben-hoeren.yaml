topic: digitales-leben
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Digitales Leben"
title:
  en: 'Help with the library''s reading app'
  ru: 'Помощь с читательским приложением библиотеки'
  uk: 'Допомога з читацьким застосунком бібліотеки'
  de: 'Hilfe bei der Lese-App der Bibliothek'
items:
- id: q1
  outcomes:
  - anleitung-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Herr Lange
      text: 'Stadtbibliothek, Hilfe für die Lese-App, Lange am Apparat.'
    - speaker: Frau Petrović
      text: 'Guten Tag. Ich möchte E-Books leihen, aber die Anmeldung in der App funktioniert nicht.'
    - speaker: Herr Lange
      text: 'Das schaffen wir. Es sind nur zwei Schritte. Zuerst tippen Sie auf „Anmelden“ und geben Ihre Ausweisnummer und Ihr Passwort ein. Die Nummer steht hinten auf Ihrem Bibliotheksausweis.'
    - speaker: Frau Petrović
      text: 'Gut, das habe ich gemacht. Und jetzt?'
    - speaker: Herr Lange
      text: 'Jetzt bekommen Sie eine E-Mail mit einem Link. Den müssen Sie innerhalb einer Stunde anklicken. Erst danach funktioniert die Anmeldung.'
    - speaker: Frau Petrović
      text: 'Ich sehe aber keine E-Mail.'
    - speaker: Herr Lange
      text: 'Dann schauen Sie bitte im Ordner für Werbung. Wenn sie dort auch nicht ist, schicke ich Ihnen den Link noch einmal.'
    - speaker: Frau Petrović
      text: 'Ah, da ist sie. Vielen Dank!'
    - speaker: Herr Lange
      text: 'Gern geschehen. Viel Spaß beim Lesen!'
  recording: ls-digitales-leben-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Wo steht die Ausweisnummer?'
  options:
  - 'Hinten auf dem Bibliotheksausweis.'
  - 'In der E-Mail.'
  - 'Auf dem Personalausweis.'
  correct: 0
  explain:
    en: 'Herr Lange gives it as part of step one: hinten auf Ihrem Bibliotheksausweis. The e-mail comes only in step two and brings a link, not a number.'
    ru: 'Господин Ланге называет это в первом шаге: hinten auf Ihrem Bibliotheksausweis. Письмо приходит только на втором шаге, и в нём ссылка, а не номер.'
    uk: 'Пан Ланге називає це на першому кроці: hinten auf Ihrem Bibliotheksausweis. Лист приходить лише на другому кроці, і в ньому посилання, а не номер.'
    de: 'Herr Lange sagt es im ersten Schritt: „hinten auf Ihrem Bibliotheksausweis“. Die E-Mail kommt erst im zweiten Schritt, und in ihr steht ein Link, keine Nummer.'
  max_replays: 3
