  - 'In der App.'
  - 'Herr Lange schickt sie ihr noch einmal.'
  correct: 0
  explain:
    en: 'The resend is only a fallback — wenn sie dort auch nicht ist. Her ah, da ist sie comes right after the advice to look in the Ordner für Werbung, the folder for advertising.'
    ru: 'Повторная отправка — только запасной вариант: wenn sie dort auch nicht ist. Её ah, da ist sie звучит сразу после совета заглянуть в Ordner für Werbung — папку для рекламы.'
    uk: 'Повторне надсилання — лише запасний варіант: wenn sie dort auch nicht ist. Її ah, da ist sie звучить одразу після поради зазирнути в Ordner für Werbung — папку для реклами.'
