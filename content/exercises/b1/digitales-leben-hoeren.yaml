  question: 'Was ist der zweite Schritt?'
  options:
  - 'Den Link in der E-Mail innerhalb einer Stunde anklicken.'
  - 'Die App neu installieren.'
  - 'Noch einmal bei der Bibliothek anrufen.'
  correct: 0
  explain:
    en: 'Zuerst opens step one; jetzt opens step two — the link, within an hour. Erst danach funktioniert die Anmeldung says the order matters.'
    ru: 'Zuerst открывает первый шаг, jetzt — второй: ссылка, в течение часа. Erst danach funktioniert die Anmeldung подчёркивает, что порядок важен.'
    uk: 'Zuerst відкриває перший крок, jetzt — другий: посилання, протягом години. Erst danach funktioniert die Anmeldung підкреслює, що порядок важливий.'
    de: '„Zuerst“ leitet den ersten Schritt ein, „jetzt“ den zweiten: den Link innerhalb einer Stunde anklicken. „Erst danach funktioniert die Anmeldung“ zeigt, dass die Reihenfolge wichtig ist.'
  max_replays: 3
