  options:
  - 'Für die Schule.'
  - 'Für ihren Antrag bei der Unfallkasse.'
  - 'Damit die Krankenkasse später doch zahlt.'
  correct: 0
  explain:
    en: 'Könnten Sie mir bitte schriftlich geben… — the Konjunktiv makes the request polite, and she says what it is for: eine Bestätigung für die Schule. She files no Antrag at all.'
    ru: 'Könnten Sie mir bitte schriftlich geben… — сослагательное наклонение делает просьбу вежливой, а зачем ей это, она говорит сама: eine Bestätigung für die Schule. Никакого Antrag она не подаёт.'
    uk: 'Könnten Sie mir bitte schriftlich geben… — умовний спосіб робить прохання ввічливим, а навіщо їй це, вона каже сама: eine Bestätigung für die Schule. Жодного Antrag вона не подає.'
    de: 'Mit „Könnten Sie mir bitte schriftlich geben …“ bittet sie höflich um eine Bestätigung und sagt auch, wofür: „Dann habe ich eine Bestätigung für die Schule.“ Einen Antrag stellt sie gar nicht.'
