topic: versicherungen-behoerden
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Versicherungen & Behörden"
title:
  en: 'Who pays for the glasses?'
  ru: 'Кто заплатит за очки?'
  uk: 'Хто заплатить за окуляри?'
  de: 'Wer zahlt die Brille?'
items:
- id: q1
  outcomes:
  - versicherung-klaeren
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Herr Krüger
      text: 'Guten Tag. Was kann ich für Sie tun?'
    - speaker: Frau Sommer
      text: 'Guten Tag. Meiner Tochter ist beim Schulsport die Brille kaputtgegangen. Ich weiß nicht, ob so ein Schaden versichert ist.'
    - speaker: Herr Krüger
      text: 'Ist das während der Sportstunde passiert?'
    - speaker: Frau Sommer
      text: 'Ja, ein Ball hat sie im Gesicht getroffen. Verletzt ist sie zum Glück nicht.'
    - speaker: Herr Krüger
      text: 'Dann sind wir leider nicht zuständig. Bei Unfällen in der Schule zahlt statt der Krankenkasse die Unfallkasse.'
    - speaker: Frau Sommer
      text: 'Die Unfallkasse? Muss ich dort einen Antrag stellen? Mit Behörden habe ich wenig Erfahrung.'
    - speaker: Herr Krüger
      text: 'Nein, den Unfall meldet die Schule. Aber sagen Sie heute noch im Sekretariat Bescheid. Die Schule hat dafür nur eine kurze Frist.'
    - speaker: Frau Sommer
      text: 'Gut. Könnten Sie mir bitte schriftlich geben, dass Sie nicht zahlen? Dann habe ich eine Bestätigung für die Schule.'
    - speaker: Herr Krüger
      text: 'Natürlich. Ich drucke Ihnen das gleich aus.'
  recording: ls-versicherungen-behoerden-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Warum zahlt die Krankenkasse nicht?'
  options:
  - 'Weil der Unfall während der Sportstunde passiert ist.'
  - 'Weil eine Brille nie versichert ist.'
  - 'Weil die Tochter nicht verletzt ist.'
  correct: 0
  explain:
    en: 'Herr Krüger asks whether it happened während der Sportstunde, and her ja settles it: accidents at school are paid by the Unfallkasse, statt der Krankenkasse. That the girl wasn''t hurt is good news, not the reason.'
    ru: 'Господин Крюгер уточняет, случилось ли это während der Sportstunde, и её ja всё решает: несчастные случаи в школе оплачивает Unfallkasse, statt der Krankenkasse. То, что девочка не пострадала, — хорошая новость, а не причина.'
    uk: 'Пан Крюгер уточнює, чи сталося це während der Sportstunde, і її ja все вирішує: нещасні випадки в школі оплачує Unfallkasse, statt der Krankenkasse. Те, що дівчинка не постраждала, — добра новина, а не причина.'
    de: 'Der Unfall ist „während der Sportstunde“ passiert, und bei Unfällen in der Schule zahlt „statt der Krankenkasse die Unfallkasse“. Dass die Tochter nicht verletzt ist, ist eine gute Nachricht, aber nicht der Grund.'
  max_replays: 3
