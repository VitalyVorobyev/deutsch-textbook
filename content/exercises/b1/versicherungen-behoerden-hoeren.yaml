  question: 'Was soll Frau Sommer heute noch tun?'
  options:
  - 'Im Sekretariat der Schule Bescheid sagen.'
  - 'Einen Antrag bei der Unfallkasse stellen.'
  - 'Eine neue Brille kaufen.'
  correct: 0
  explain:
    en: 'She asks whether she has to file an Antrag, and the answer is nein — the school reports the accident. Her own task is heute noch im Sekretariat Bescheid sagen, because the school has only a short Frist.'
    ru: 'Она спрашивает, нужно ли подавать Antrag, и слышит nein — о несчастном случае сообщает школа. Её задача — heute noch im Sekretariat Bescheid sagen, потому что у школы короткий срок, Frist.'
    uk: 'Вона питає, чи треба подавати Antrag, і чує nein — про нещасний випадок повідомляє школа. Її завдання — heute noch im Sekretariat Bescheid sagen, бо в школи короткий строк, Frist.'
    de: 'Einen Antrag muss sie nicht stellen, denn den Unfall meldet die Schule. Sie selbst soll „heute noch im Sekretariat Bescheid sagen“, weil die Schule nur eine kurze Frist hat.'
  max_replays: 3
