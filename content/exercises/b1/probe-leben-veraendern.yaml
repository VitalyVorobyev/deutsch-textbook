# Delayed probe family: ONE competence — the dative relative pronoun, chosen by
# the verb inside the clause — asked three ways, in sentences no practice item
# uses. Cloze-preferred for attribution: the frame is given, only the graded
# form is produced.
topic: leben-veraendern
role: probe
title:
  en: "Delayed check — the dative relative pronoun"
  ru: "Отложенная проверка — относительное местоимение в дативе"
  uk: "Відкладена перевірка — відносний займенник у дативі"
items:
  - id: variant-a
    outcomes: [relativsatz-praezisieren]
    type: cloze
    focus: relativpronomen-dativ
    instruction:
      en: "Fill in the relative pronoun."
      ru: "Впишите относительное местоимение."
      uk: "Впишіть відносний займенник."
    text: "Das ist der Lehrer, {{dem}} ich für die Hilfe gedankt habe."
    translation:
      en: "That is the teacher I thanked for the help."
      ru: "Это учитель, которого я поблагодарил за помощь."
      uk: "Це вчитель, якому я подякував за допомогу."
    explain:
      en: "danken takes the dative, so masculine der becomes dem. The case comes from the verb inside the clause — the main clause's nominative has no vote."
      ru: "danken требует датива, поэтому мужское der становится dem. Падеж приходит от глагола внутри придаточного — номинатив главного предложения права голоса не имеет."
      uk: "danken вимагає датива, тому чоловіче der стає dem. Відмінок приходить від дієслова всередині підрядного — номінатив головного речення права голосу не має."

  - id: variant-b
    outcomes: [relativsatz-praezisieren]
    type: cloze
    focus: relativpronomen-dativ
    instruction:
      en: "Fill in the relative pronoun."
      ru: "Впишите относительное местоимение."
      uk: "Впишіть відносний займенник."
    text: "Die Tante, {{der}} unsere neue Wohnung gefällt, kommt jetzt öfter zu Besuch."
    translation:
      en: "The aunt who likes our new flat now visits more often."
      ru: "Тётя, которой нравится наша новая квартира, теперь приходит в гости чаще."
      uk: "Тітка, якій подобається наша нова квартира, тепер приходить у гості частіше."
    explain:
      en: "gefallen puts the person in the dative: feminine die becomes der. The flat is the subject inside the clause — the aunt only receives the liking, which is exactly what the dative marks."
      ru: "gefallen ставит человека в датив: женское die становится der. Подлежащее внутри придаточного — квартира; тётя лишь получает «нравится», и именно это датив и помечает."
      uk: "gefallen ставить людину в датив: жіноче die стає der. Підмет усередині підрядного — квартира; тітка лише отримує «подобається», і саме це датив і позначає."

  - id: variant-c
    outcomes: [relativsatz-praezisieren]
    type: cloze
    focus: relativpronomen-dativ
    instruction:
      en: "Fill in the relative pronoun."
      ru: "Впишите относительное местоимение."
      uk: "Впишіть відносний займенник."
    text: "Das sind die Studenten, {{denen}} die Fahrräder im Hof gehören."
    translation:
      en: "Those are the students who own the bicycles in the courtyard."
      ru: "Это студенты, которым принадлежат велосипеды во дворе."
      uk: "Це студенти, яким належать велосипеди у дворі."
    explain:
      en: "gehören demands the dative, and the plural is the one cell with a form of its own: denen, never the article's den. One family, one competence — the dative relative pronoun, produced cold."
      ru: "gehören требует датива, а множественное число — единственная клетка с собственной формой: denen, никогда не артикльное den. Одна семья, одна компетенция — относительное местоимение в дативе, воспроизведённое без подготовки."
      uk: "gehören вимагає датива, а множина — єдина клітинка з власною формою: denen, ніколи не артикльне den. Одна сім'я, одна компетенція — відносний займенник у дативі, відтворений без підготовки."
