  question: Was rät Kai ihr zuerst zu tun?
  options:
  - Mit dem Chef über Homeoffice sprechen.
  - Eine Wohnung auf dem Land suchen.
  - Ein Auto kaufen.
  correct: 0
  explain:
    en: The advice is a reversal of her own order — andersherum, frag zuerst — so
      the wrong option is precisely what she was going to do first.
    ru: Совет переворачивает её собственный порядок действий — andersherum, frag zuerst,
      — поэтому неверный вариант и есть то, с чего она собиралась начать.
    uk: 'Порада перевертає її власний порядок дій — andersherum, frag zuerst, — тому хибний варіант і є те, з чого вона збиралася почати.'
