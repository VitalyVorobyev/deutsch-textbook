topic: gespraech-steuern
role: practice
stage: geruest
activity: core
title_de: "Grundübung — Redemittel für ein Gespräch"
title:
  en: "Practice — the phrases that run a conversation"
  ru: "Практика — обороты, которыми ведут разговор"
  uk: "Практика — звороти, якими ведуть розмову"
  de: "Übung — die Redemittel, die ein Gespräch steuern"

# The topic's primary practice set, so its item list is frozen once this ships.
#
# Twelve items over the article's five sections: the frame of a turn (match-funktion-chunk,
# cloze-rahmen), asking for and giving the floor (cloze-konjunktiv2-bitte, table-konjunktiv2,
# uebersetzen-wort-bitten, mc-sprechen-auffordern), the listener signals and the shared-knowledge
# particle (mc-hoerersignal, cloze-partikel-ja), steering the content (order-uebrigens,
# table-vorfeld, uebersetzen-vor-allem) and declining to answer (uebersetzen-ausweichen).
#
# Most of this material is Redemittel — formulaic chunks retrieved whole — and chunks name no
# confusion a focus tag could grade, so seven of the twelve items are deliberately untagged. The
# five that are tagged carry the two confusions the chunks sit inside, both recycled:
# `konjunktiv2-form` (thin at B1: 4 items in 2 files) and `konjunktionaladverb-inversion`.
#
# Mix over this file: 2 mc of 12 (17 %), mc+match+order 4 of 12 (33 %), 3 translate, 1 order.
#
# Lexis checked with the YAML parser against every content/vocab/*.yaml rather than by eye —
# Besprechung, Versammlung, Verein, Mitglied, Kantine, Abteilung, Vormittag, Pause, Lärm, Kosten,
# Baustelle, Hof, Termin, Antwort, Frage, Beispiel, Bescheid, ergänzen, wiederholen, erklären,
# unterbrechen, verschieben, fehlen. Kaya, Blum and Weber are proper nouns.
items:
  - id: match-funktion-chunk
    outcomes: [beitrag-rahmen, wort-nehmen-geben, zuhoeren-anknuepfen, inhalt-steuern]
    type: match
    instruction:
      en: "Match each phrase with the move it makes. None of them says anything about the subject."
      ru: "Соотнесите каждый оборот с ходом, который он делает. Ни один из них ничего не сообщает по существу."
      uk: "Зіставте кожен зворот із ходом, який він робить. Жоден із них нічого не повідомляє по суті."
      de: "Ordne jeden Ausdruck dem Schritt zu, den er im Gespräch macht. Keiner davon sagt etwas über das Thema."
    pairs:
      - left: "Ich möchte kurz etwas dazu sagen."
        right: { en: "you are opening your turn", ru: "вы начинаете своё высказывание", uk: "ви починаєте свій виступ" }
      - left: "Das wäre alles von mir."
        right: { en: "you are closing your turn", ru: "вы заканчиваете своё высказывание", uk: "ви завершуєте свій виступ" }
      - left: "Dürfte ich dazu kurz etwas sagen?"
        right: { en: "you are asking for the floor", ru: "вы просите слова", uk: "ви просите слова" }
      - left: "Wie sehen Sie das?"
        right: { en: "you are inviting somebody else to speak", ru: "вы предлагаете высказаться другому", uk: "ви пропонуєте висловитися іншому" }
      - left: "Noch etwas anderes: …"
        right: { en: "you are moving to a different point", ru: "вы переходите к другому пункту", uk: "ви переходите до іншого пункту" }
      - left: "Verstehe."
        right: { en: "you are signalling that you are still listening", ru: "вы сигнализируете, что слушаете", uk: "ви сигналізуєте, що слухаєте" }
    explain:
      en: "None of these six phrases carries any content — they organise the conversation instead. That is why they are learned whole rather than built: *Dürfte ich dazu kurz etwas sagen?* is one unit you retrieve, not a sentence you assemble under time pressure. Note the two that are easy to swap: *Wie sehen Sie das?* hands the floor to somebody else, while *Ich möchte kurz etwas dazu sagen* takes it — the same subject, opposite directions."
      ru: "Ни один из шести оборотов не несёт содержания — они организуют разговор. Поэтому их и учат целиком, а не строят: *Dürfte ich dazu kurz etwas sagen?* — это одна единица, которую достают из памяти, а не фраза, которую собирают в цейтноте. Отметьте два, которые легко перепутать: *Wie sehen Sie das?* передаёт слово другому, а *Ich möchte kurz etwas dazu sagen* его берёт — тема та же, направления противоположные."
      uk: "Жоден із шести зворотів не несе змісту — вони організують розмову. Тому їх і вчать цілком, а не будують: *Dürfte ich dazu kurz etwas sagen?* — це одна одиниця, яку дістають із пам'яті, а не фраза, яку збирають у цейтноті. Відзначте два, які легко переплутати: *Wie sehen Sie das?* передає слово іншому, а *Ich möchte kurz etwas dazu sagen* його бере — тема та сама, напрямки протилежні."
      de: "Keiner dieser sechs Ausdrücke hat einen Inhalt — sie organisieren das Gespräch. Deshalb lernt man sie als Ganzes und baut sie nicht: *Dürfte ich dazu kurz etwas sagen?* ist eine Einheit, die man abruft, kein Satz, den man unter Zeitdruck zusammensetzt. Achte auf die zwei, die man leicht verwechselt: *Wie sehen Sie das?* gibt das Wort an jemand anderen weiter, *Ich möchte kurz etwas dazu sagen* nimmt es — dasselbe Thema, entgegengesetzte Richtungen."

  - id: cloze-rahmen
    # revision 2: the first gap rejected Nun, as correct a one-word opener before the comma as
    # Also.
    revision: 2
    outcomes: [beitrag-rahmen]
    type: cloze
    instruction:
      en: "First gap: the one-word opener that stands outside the sentence, before the comma. Second gap: sein in Konjunktiv II."
      ru: "Первый пропуск: односложный зачин, который стоит вне предложения, перед запятой. Второй: sein в Konjunktiv II."
      uk: "Перший пропуск: односкладовий зачин, що стоїть поза реченням, перед комою. Другий: sein у Konjunktiv II."
      de: "Erste Lücke: das einzelne Einleitungswort, das außerhalb des Satzes vor dem Komma steht. Zweite Lücke: sein im Konjunktiv II."
    text: "{{Also|Nun}}, ich sehe das so: Wir brauchen mehr Zeit. Mehr wollte ich dazu nicht sagen. Das {{wäre}} alles von mir."
    translation:
      en: "Well, I see it like this: we need more time. That was all I wanted to say about it. That would be all from me."
      ru: "Так вот, я вижу это так: нам нужно больше времени. Больше мне сказать нечего. У меня всё."
      uk: "Отже, я бачу це так: нам потрібно більше часу. Більше мені сказати нема чого. У мене все."
    explain:
      en: "Both ends of a turn are marked, and both markers are empty of content. *Also* opens; it is followed by a comma because it stands outside the sentence, which is why *ich* keeps first position and the verb still comes second. *Das wäre alles von mir* closes; the Konjunktiv II *wäre* is what makes it an offer to stop rather than an announcement. *Nun,* works as the opener too. *Das ist alles* is not wrong, but it sounds like a full stop somebody else has to accept."
      ru: "Оба конца реплики отмечаются, и оба маркера пусты по содержанию. *Also* открывает; после него запятая, потому что он стоит вне предложения, — поэтому *ich* сохраняет первое место, а глагол по-прежнему второй. *Das wäre alles von mir* закрывает; именно Konjunktiv II *wäre* делает это предложением закончить, а не объявлением. Зачином годится и *Nun,*. *Das ist alles* не ошибка, но звучит как точка, с которой другим остаётся только согласиться."
      uk: "Обидва кінці репліки позначаються, і обидва маркери порожні за змістом. *Also* відкриває; після нього кома, бо він стоїть поза реченням, — тому *ich* зберігає перше місце, а дієслово так само друге. *Das wäre alles von mir* закриває; саме Konjunktiv II *wäre* робить це пропозицією завершити, а не оголошенням. Зачином годиться і *Nun,*. *Das ist alles* не помилка, але звучить як крапка, з якою іншим лишається тільки погодитися."
      de: "Beide Enden eines Redebeitrags sind markiert, und beide Signale haben keinen Inhalt. *Also* eröffnet; danach steht ein Komma, weil es außerhalb des Satzes steht — deshalb behält *ich* die erste Position, und das Verb steht trotzdem an zweiter Stelle. *Das wäre alles von mir* schließt; erst der Konjunktiv II *wäre* macht daraus ein Angebot, aufzuhören, statt einer Ankündigung. Auch *Nun,* passt als Einleitung. *Das ist alles* ist nicht falsch, klingt aber wie ein Schlusspunkt, den die anderen hinnehmen müssen."

  - id: cloze-konjunktiv2-bitte
    outcomes: [wort-nehmen-geben]
    type: cloze
    focus: konjunktiv2-form
    focus_evidence:
      failed: ["(?<!\\p{L})entschuldigung (darf|durfte)(?!\\p{L})", "\\(dürfen\\) (kann|können|konnte|konnten)(?!\\p{L})", "(?<!\\p{L})ich (habe|hab|hatte) dazu(?!\\p{L})"]
      retained: ["(?<!\\p{L})entschuldigung dürfte(?!\\p{L})", "\\(dürfen\\) könnten(?!\\p{L})", "(?<!\\p{L})ich hätte dazu(?!\\p{L})"]
    instruction:
      en: "Put each named verb into the polite Konjunktiv II form."
      ru: "Поставьте каждый названный глагол в вежливую форму Konjunktiv II."
      uk: "Поставте кожне назване дієслово у ввічливу форму Konjunktiv II."
      de: "Setze jedes genannte Verb in die höfliche Form des Konjunktiv II."
    text: "Entschuldigung, {{dürfte}} ich Sie kurz unterbrechen? (dürfen) {{Könnten}} Sie das bitte wiederholen? (können) Ich {{hätte}} dazu noch eine Frage. (haben)"
    translation:
      en: "Excuse me, could I interrupt you briefly? Could you repeat that, please? I would have one more question about it."
      ru: "Извините, можно вас ненадолго прервать? Не могли бы вы это повторить? У меня был бы ещё один вопрос по этому поводу."
      uk: "Перепрошую, чи можна вас ненадовго перервати? Чи не могли б ви це повторити? У мене було б ще одне питання щодо цього."
    explain:
      en: "Three verbs, one rule: the Konjunktiv II of these words is the Präteritum with an umlaut added — *durfte* → *dürfte*, *konnte* → *könnte*, *hatte* → *hätte*. The *-e* ending is already there in the Präteritum, so the umlaut is the whole visible change, and leaving it off gives you *durfte ich* — a statement about the past, not a request. All three of these are chunks worth having ready: you will not have time to derive them mid-conversation."
      ru: "Три глагола, одно правило: Konjunktiv II этих слов — это Präteritum с добавленным умлаутом: *durfte* → *dürfte*, *konnte* → *könnte*, *hatte* → *hätte*. Окончание *-e* в Präteritum уже есть, поэтому весь видимый сдвиг — умлаут, а без него получается *durfte ich* — высказывание о прошлом, а не просьба. Все три стоит держать наготове: выводить их посреди разговора будет некогда."
      uk: "Три дієслова, одне правило: Konjunktiv II цих слів — це Präteritum із доданим умлаутом: *durfte* → *dürfte*, *konnte* → *könnte*, *hatte* → *hätte*. Закінчення *-e* у Präteritum уже є, тому весь видимий зсув — умлаут, а без нього виходить *durfte ich* — висловлювання про минуле, а не прохання. Усі три варто тримати напоготові: виводити їх посеред розмови буде ніколи."
      de: "Drei Verben, eine Regel: Der Konjunktiv II dieser Wörter ist das Präteritum mit Umlaut — *durfte* → *dürfte*, *konnte* → *könnte*, *hatte* → *hätte*. Die Endung *-e* hat schon das Präteritum, also ist der Umlaut die ganze sichtbare Änderung. Ohne ihn bekommt man *durfte ich* — eine Aussage über die Vergangenheit, keine Bitte. Alle drei lohnen sich als feste Ausdrücke: Mitten im Gespräch hat man keine Zeit, sie abzuleiten."

  - id: table-konjunktiv2
    # revision 2: a cell takes one answer, and the table charges every miss to konjunktiv2-form.
    # The sagen row keyed gern etwas dazu and rejected the article's own dazu gern etwas, so the
    # row has no dazu to move; the instruction keeps each verb, which rules out Würdest du … and
    # Ich möchte … in advance rather than rejecting them unannounced.
    revision: 2
    outcomes: [wort-nehmen-geben]
    type: table
    focus: konjunktiv2-form
    focus_evidence:
      failed: ["^(kannst|konntest) du(?!\\p{L})", "^(?:[^/]*/ ){1}ich (habe|hab|hatte)(?!\\p{L})", "^(?:[^/]*/ ){2}ich (sage|sagte)(?!\\p{L})", "^(?:[^/]*/ ){2}ich würde (gern )?sagen(?!\\p{L})", "^(?:[^/]*/ ){3}das (ist|war)(?!\\p{L})"]
      retained: ["^könntest du(?!\\p{L})", "/ ich hätte(?!\\p{L})", "/ ich würde(?!\\p{L})", "/ das wäre(?!\\p{L})"]
    title: "Vom Indikativ zur höflichen Form"
    instruction:
      en: "Rewrite each sentence in Konjunktiv II so that it asks rather than states. Keep each verb; one without a one-word form takes würde."
      ru: "Перепишите каждое предложение в Konjunktiv II так, чтобы оно спрашивало, а не утверждало. Глагол сохраните; если однословной формы у него нет, он берёт würde."
      uk: "Перепишіть кожне речення в Konjunktiv II так, щоб воно питало, а не стверджувало. Дієслово збережіть; якщо однослівної форми в нього немає, воно бере würde."
      de: "Schreib jeden Satz im Konjunktiv II, sodass er bittet statt feststellt. Behalte jedes Verb; ein Verb ohne Einwortform bekommt würde."
    columns: ["höflich"]
    rows:
      - label: "Darf ich etwas fragen?"
        cells:
          - { answer: "Dürfte ich etwas fragen?", given: true }
      - label: "Kannst du das erklären?"
        cells:
          - { answer: "Könntest du das erklären?" }
      - label: "Ich habe eine Bitte."
        cells:
          - { answer: "Ich hätte eine Bitte." }
      - label: "Ich sage gern etwas."
        cells:
          - { answer: "Ich würde gern etwas sagen." }
      - label: "Das ist alles."
        cells:
          - { answer: "Das wäre alles." }
    explain:
      en: "Four of the five rows stay one word: *durfte*, *konntest* and *hatte* already end in *-e* or its ending, so the umlaut is the whole change, and *war* gains both and becomes *wäre*. The fourth row is the one that changes shape, because *sagen* has no polite one-word form in everyday use: it borrows *würde*, which takes position 2, and the infinitive *sagen* then closes the sentence. That bracket is the same one *können* and *müssen* build; only the word in front of it is new. Note *könntest* keeps the du-ending: Konjunktiv II conjugates normally."
      ru: "Четыре строки из пяти остаются одним словом: у *durfte*, *konntest* и *hatte* окончание уже на месте, поэтому всё изменение — умлаут, а *war* получает и то и другое и становится *wäre*. Четвёртая строка меняет саму конструкцию, потому что у *sagen* однословной вежливой формы в обиходе нет: он берёт *würde*, которое встаёт на второе место, а инфинитив *sagen* закрывает предложение. Эта рамка — та же, что строят *können* и *müssen*; новым является только слово перед ней. Обратите внимание: *könntest* сохраняет окончание для du — Konjunktiv II спрягается как обычно."
      uk: "Чотири рядки з п'яти залишаються одним словом: у *durfte*, *konntest* і *hatte* закінчення вже на місці, тому вся зміна — умлаут, а *war* отримує і те й інше і стає *wäre*. Четвертий рядок змінює саму конструкцію, бо в *sagen* однослівної ввічливої форми в побуті немає: він бере *würde*, яке стає на друге місце, а інфінітив *sagen* закриває речення. Ця рамка — та сама, що будують *können* і *müssen*; новим є лише слово перед нею. Зверніть увагу: *könntest* зберігає закінчення для du — Konjunktiv II відмінюється як звичайно."
      de: "Vier der fünf Zeilen bleiben ein Wort: *durfte*, *konntest* und *hatte* haben ihre Endung schon, also ist der Umlaut die ganze Änderung, und *war* bekommt beides und wird zu *wäre*. Die vierte Zeile ändert ihre Form, weil *sagen* im Alltag keine höfliche Einwortform hat: Es leiht sich *würde*, das auf Position 2 steht, und der Infinitiv *sagen* schließt dann den Satz. Diese Klammer kennst du schon von *können* und *müssen*; neu ist nur das Wort davor. Beachte: *könntest* behält die du-Endung — der Konjunktiv II wird ganz normal konjugiert."

  - id: uebersetzen-wort-bitten
    # revision 2: "add" left the verb open (hinzufügen) — the instruction names ergänzen — and
    # Entschuldigen Sie for "Excuse me" was rejected.
    revision: 2
    outcomes: [wort-nehmen-geben]
    type: translate
    focus: konjunktiv2-form
    key_tokens: ["dürfte", "könnte"]
    instruction:
      en: "Ask politely with ergänzen — the request has to be in Konjunktiv II."
      ru: "Попросите вежливо, с глаголом ergänzen, — просьба должна стоять в Konjunktiv II."
      uk: "Попросіть ввічливо, з дієсловом ergänzen, — прохання має стояти в Konjunktiv II."
      de: "Bitte höflich mit ergänzen — die Bitte muss im Konjunktiv II stehen."
    prompt_en: "Excuse me, could I add something briefly?"
    prompt_ru: "Извините, можно мне коротко кое-что добавить?"
    prompt_uk: "Перепрошую, чи можна мені коротко дещо додати?"
    answer: "Entschuldigung, dürfte ich kurz etwas ergänzen?"
    accept:
      - "Entschuldigung, könnte ich kurz etwas ergänzen?"
      - "Entschuldigen Sie, dürfte ich kurz etwas ergänzen?"
      - "Entschuldigen Sie, könnte ich kurz etwas ergänzen?"
    explain:
      en: "Both *dürfte* and *könnte* are correct here and both are accepted — the point being drilled is the form, not the choice of modal. *darf* and *kann* are not accepted because the instruction asks for Konjunktiv II — they are polite too, and *dürfte* or *könnte* softens the request one step further. *Entschuldigung* and *Entschuldigen Sie* are both accepted; either stands outside the sentence with a comma, so the modal still holds first position in the question."
      ru: "И *dürfte*, и *könnte* здесь верны, и оба принимаются: отрабатывается форма, а не выбор модального глагола. *darf* и *kann* не принимаются, потому что инструкция требует Konjunktiv II; они тоже вежливы, а *dürfte* или *könnte* смягчает просьбу ещё на ступень. Приняты и *Entschuldigung*, и *Entschuldigen Sie*; любое из них стоит вне предложения, через запятую, поэтому модальный глагол сохраняет первое место в вопросе."
      uk: "І *dürfte*, і *könnte* тут правильні, і обидва приймаються: відпрацьовується форма, а не вибір модального дієслова. *darf* і *kann* не приймаються, бо інструкція вимагає Konjunktiv II; вони теж увічливі, а *dürfte* чи *könnte* пом'якшує прохання ще на щабель. Прийняті і *Entschuldigung*, і *Entschuldigen Sie*; будь-яке з них стоїть поза реченням, через кому, тому модальне дієслово зберігає перше місце в питанні."
      de: "Hier sind *dürfte* und *könnte* beide richtig und beide werden akzeptiert — geübt wird die Form, nicht die Wahl des Modalverbs. *darf* und *kann* werden nicht akzeptiert, weil die Aufgabe den Konjunktiv II verlangt: Auch sie sind höflich, aber *dürfte* oder *könnte* macht die Bitte noch eine Stufe weicher. *Entschuldigung* und *Entschuldigen Sie* werden beide akzeptiert; beide stehen mit Komma außerhalb des Satzes, also hält das Modalverb in der Frage trotzdem die erste Position."

  - id: mc-sprechen-auffordern
    outcomes: [wort-nehmen-geben]
    type: mc
    prompt: "Sie leiten eine kleine Besprechung. Frau Kaya hat noch nichts gesagt. Wie fordern Sie sie zum Sprechen auf?"
    options:
      - "Wie sehen Sie das, Frau Kaya?"
      - "Frau Kaya, Sie müssen jetzt auch etwas sagen."
      - "Frau Kaya, ich bin fertig."
    correct: 0
    explain:
      en: "Handing over the floor is done with a question that names the person: *Wie sehen Sie das, Frau Kaya?* Nothing has to be softened, because you are giving rather than taking. *Sie müssen jetzt auch etwas sagen* turns an invitation into an obligation, and *müssen* is exactly the wrong verb in front of a group. *Ich bin fertig* only ends your own turn and leaves it open who speaks next."
      ru: "Слово передают вопросом, в котором названо имя: *Wie sehen Sie das, Frau Kaya?* Смягчать здесь нечего — вы отдаёте, а не берёте. *Sie müssen jetzt auch etwas sagen* превращает приглашение в обязанность, и *müssen* — ровно тот глагол, который перед группой звучит хуже всего. *Ich bin fertig* лишь заканчивает вашу собственную реплику и оставляет открытым, кто говорит следующим."
      uk: "Слово передають питанням, у якому названо ім'я: *Wie sehen Sie das, Frau Kaya?* Пом'якшувати тут нема чого — ви віддаєте, а не берете. *Sie müssen jetzt auch etwas sagen* перетворює запрошення на обов'язок, і *müssen* — рівно те дієслово, яке перед групою звучить найгірше. *Ich bin fertig* лише завершує вашу власну репліку і залишає відкритим, хто говорить наступним."
      de: "Das Wort gibt man mit einer Frage weiter, die die Person nennt: *Wie sehen Sie das, Frau Kaya?* Hier muss nichts weicher werden, denn man gibt etwas, statt etwas zu nehmen. *Sie müssen jetzt auch etwas sagen* macht aus einer Einladung eine Pflicht, und *müssen* ist vor einer Gruppe genau das falsche Verb. *Ich bin fertig* beendet nur den eigenen Beitrag und lässt offen, wer als Nächstes spricht."

  - id: mc-hoerersignal
    outcomes: [zuhoeren-anknuepfen]
    type: mc
    prompt: "Ein Kollege erzählt Ihnen etwas Neues. Sie wollen zeigen, dass Sie zuhören, ohne schon etwas zu versprechen. Was sagen Sie?"
    options:
      - "Verstehe. Und dann?"
      - "Ja, einverstanden."
      - "Das mache ich gern."
    correct: 0
    explain:
      en: "A listener signal says only that the line is still open. *Verstehe. Und dann?* does exactly that and commits you to nothing. *Ja, einverstanden* is agreement to a proposal, and *Das mache ich gern* promises to do something — both answer a question that has not been asked. The distinction matters at a counter and in a meeting alike: in German, saying nothing at all can read as disagreement, so the signal should be there, but it must not accidentally be a yes."
      ru: "Сигнал слушателя сообщает только, что связь ещё есть. *Verstehe. Und dann?* делает ровно это и ни к чему вас не обязывает. *Ja, einverstanden* — согласие с предложением, а *Das mache ich gern* — обещание что-то сделать; и то и другое отвечает на не заданный вопрос. Различие важно и у окошка, и на совещании: в немецком полное молчание может читаться как несогласие, поэтому сигнал нужен — но он не должен случайно оказаться согласием."
      uk: "Сигнал слухача повідомляє лише, що зв'язок ще є. *Verstehe. Und dann?* робить рівно це і ні до чого вас не зобов'язує. *Ja, einverstanden* — згода з пропозицією, а *Das mache ich gern* — обіцянка щось зробити; і те й інше відповідає на непоставлене питання. Різниця важлива і біля віконця, і на нараді: у німецькій цілковите мовчання може читатися як незгода, тому сигнал потрібен — але він не має випадково виявитися згодою."
      de: "Ein Hörersignal sagt nur, dass die Leitung noch offen ist. *Verstehe. Und dann?* tut genau das und verspricht nichts. *Ja, einverstanden* ist die Zustimmung zu einem Vorschlag, und *Das mache ich gern* verspricht, etwas zu tun — beide antworten auf eine Frage, die niemand gestellt hat. Der Unterschied ist am Schalter genauso wichtig wie in einer Besprechung: Im Deutschen kann gar nichts zu sagen wie Widerspruch wirken. Das Signal sollte also da sein, aber es darf nicht aus Versehen ein Ja sein."

  - id: cloze-partikel-ja
    # revision 2: the first gap rejected doch, the other unstressed particle that appeals to what
    # the listener already knows.
    revision: 2
    outcomes: [zuhoeren-anknuepfen]
    type: cloze
    instruction:
      en: "First gap: the unstressed particle that means „as you know“. Second gap: fehlen, in the slot the comma leaves for it."
      ru: "Первый пропуск: безударная частица со значением «как вы знаете». Второй: fehlen — на месте, которое оставляет для него запятая."
      uk: "Перший пропуск: ненаголошена частка зі значенням «як ви знаєте». Другий: fehlen — на місці, яке залишає для нього кома."
      de: "Erste Lücke: die unbetonte Partikel, die „wie Sie wissen“ bedeutet. Zweite Lücke: fehlen, an der Stelle, die das Komma dafür freilässt."
    text: "Sie kennen {{ja|doch}} unsere Regeln. Wie Sie wissen, {{fehlt}} uns noch ein Mitglied."
    translation:
      en: "You know our rules, of course. As you know, we are still one member short."
      ru: "Вы ведь знаете наши правила. Как вы знаете, нам не хватает ещё одного члена."
      uk: "Ви ж знаєте наші правила. Як ви знаєте, нам бракує ще одного члена."
    explain:
      en: "Two ways of saying the same thing. The particle *ja* sits unstressed inside the sentence and means *as you both know* — it is not the answer word *yes*, and moving it to the front would turn it into one; unstressed *doch* appeals to the same shared knowledge and is accepted too. The long form is a clause in first position, *Wie Sie wissen*, and after its comma the finite verb of the main clause comes immediately: *…, **fehlt** uns noch ein Mitglied*. Writing *…, uns fehlt noch ein Mitglied* is the mistake that follows from reading the comma as a full stop."
      ru: "Два способа сказать одно и то же. Частица *ja* стоит без ударения внутри предложения и значит «как мы оба знаем» — это не слово-ответ «да», и вынос её в начало превратил бы её именно в него; безударное *doch* тоже отсылает к общему знанию и тоже принимается. Длинная форма — придаточное на первом месте, *Wie Sie wissen*, и после запятой сразу идёт спрягаемый глагол главного предложения: *…, **fehlt** uns noch ein Mitglied*. Вариант *…, uns fehlt noch ein Mitglied* — ошибка, которая следует из чтения запятой как точки."
      uk: "Два способи сказати те саме. Частка *ja* стоїть без наголосу всередині речення і означає «як ми обидва знаємо» — це не слово-відповідь «так», і винесення її на початок перетворило б її саме на нього; ненаголошене *doch* теж відсилає до спільного знання і теж приймається. Довга форма — підрядне на першому місці, *Wie Sie wissen*, і після коми одразу йде відмінюване дієслово головного речення: *…, **fehlt** uns noch ein Mitglied*. Варіант *…, uns fehlt noch ein Mitglied* — помилка, що випливає з читання коми як крапки."
      de: "Zwei Arten, dasselbe zu sagen. Die Partikel *ja* steht unbetont im Satz und bedeutet *wie wir beide wissen* — sie ist nicht das Antwortwort *ja*, und am Satzanfang würde sie zu diesem Antwortwort. Unbetontes *doch* beruft sich auf dasselbe gemeinsame Wissen und wird auch akzeptiert. Die lange Form ist ein Nebensatz auf Position 1, *Wie Sie wissen*, und nach seinem Komma kommt sofort das konjugierte Verb des Hauptsatzes: *…, **fehlt** uns noch ein Mitglied*. *…, uns fehlt noch ein Mitglied* ist der Fehler, der entsteht, wenn man das Komma wie einen Punkt liest."

  - id: order-uebrigens
    outcomes: [inhalt-steuern]
    type: order
    focus: konjunktionaladverb-inversion
    instruction:
      en: "Build the sentence. The capitalised word can only stand in one place."
      ru: "Составьте предложение. Слово с заглавной буквы может стоять только в одном месте."
      uk: "Складіть речення. Слово з великої літери може стояти лише в одному місці."
      de: "Bau den Satz. Das großgeschriebene Wort kann nur an einer Stelle stehen."
    words: ["Übrigens", "fehlt", "uns", "noch", "eine", "Antwort."]
    translation:
      en: "By the way, we are still missing an answer."
      ru: "Кстати, нам всё ещё не хватает ответа."
      uk: "До речі, нам усе ще бракує відповіді."
    explain:
      en: "*Übrigens* is an adverb, and an adverb at the front of a German sentence occupies position 1 like any other element. The finite verb therefore comes second and the subject moves behind it: *Übrigens **fehlt uns** …*. The tokens are handed to you here so that the position is the only thing you have to decide; later items ask for the same rule with nothing on the screen."
      ru: "*Übrigens* — наречие, а наречие в начале немецкого предложения занимает первое место, как любой другой член. Поэтому спрягаемый глагол идёт вторым, а подлежащее уходит за него: *Übrigens **fehlt uns** …*. Слова здесь выданы вам готовыми, чтобы решать пришлось только позицию; дальше то же правило спросят, ничего не показывая на экране."
      uk: "*Übrigens* — прислівник, а прислівник на початку німецького речення посідає перше місце, як будь-який інший член. Тому відмінюване дієслово йде другим, а підмет відходить за нього: *Übrigens **fehlt uns** …*. Слова тут видані вам готовими, щоб вирішувати довелося лише позицію; далі те саме правило спитають, нічого не показуючи на екрані."
      de: "*Übrigens* ist ein Adverb, und ein Adverb am Anfang eines deutschen Satzes besetzt Position 1 wie jedes andere Satzglied. Das konjugierte Verb kommt deshalb an zweiter Stelle, und das Subjekt rückt dahinter: *Übrigens **fehlt uns** …*. Die Wörter sind hier vorgegeben, damit du nur über die Stellung entscheiden musst; spätere Aufgaben verlangen dieselbe Regel ohne Vorlage."

  - id: table-vorfeld
    outcomes: [inhalt-steuern, beitrag-rahmen]
    type: table
    focus: konjunktionaladverb-inversion
    focus_evidence:
      failed: ["^übrigens der termin ist(?!\\p{L})", "^(?:[^/]*/ ){2}übrigens wir brauchen(?!\\p{L})"]
      retained: ["^übrigens ist(?!\\p{L})", "/ übrigens brauchen(?!\\p{L})"]
    title: "Vor dem Satz oder im Satz?"
    instruction:
      en: "Build one sentence per row. The label says whether the marker stands outside the sentence (comma) or inside it (position 1)."
      ru: "Составьте по одному предложению в строке. В подписи сказано, стоит ли маркер вне предложения (запятая) или внутри него (первое место)."
      uk: "Складіть по одному реченню в рядку. У підписі сказано, чи стоїть маркер поза реченням (кома), чи всередині нього (перше місце)."
      de: "Bau pro Zeile einen Satz. Die Angabe sagt, ob das Signalwort außerhalb des Satzes steht (Komma) oder im Satz (Position 1)."
    columns: ["Satz"]
    rows:
      - label: "Also (außerhalb) + Ich sehe das anders."
        cells:
          - { answer: "Also, ich sehe das anders.", given: true }
      - label: "Übrigens (im Satz) + Der Termin ist schon nächste Woche."
        cells:
          - { answer: "Übrigens ist der Termin schon nächste Woche." }
      - label: "Genau (außerhalb) + Das habe ich auch gedacht."
        cells:
          - { answer: "Genau, das habe ich auch gedacht." }
      - label: "Übrigens (im Satz) + Wir brauchen noch eine Antwort."
        cells:
          - { answer: "Übrigens brauchen wir noch eine Antwort." }
      - label: "Entschuldigung (außerhalb) + Dürfte ich kurz etwas sagen?"
        cells:
          - { answer: "Entschuldigung, dürfte ich kurz etwas sagen?" }
    explain:
      en: "One question, five rows: does the marker count as the first element of the sentence? *Also*, *Genau* and *Entschuldigung* do not — they are set off by a comma and the sentence behind them is untouched, so the subject keeps its place. *Übrigens* does — it is an ordinary adverb inside the sentence, so it fills position 1 and the finite verb comes straight after it, pushing the subject behind: *Übrigens **ist** der Termin …*, *Übrigens **brauchen** wir …*. The comma in the label is the whole clue."
      ru: "Один вопрос, пять строк: считается ли маркер первым членом предложения? *Also*, *Genau* и *Entschuldigung* — нет: они отделены запятой, а предложение за ними не тронуто, поэтому подлежащее сохраняет своё место. *Übrigens* — да: это обычное наречие внутри предложения, поэтому оно занимает первое место, а спрягаемый глагол идёт сразу за ним, оттесняя подлежащее: *Übrigens **ist** der Termin …*, *Übrigens **brauchen** wir …*. Вся подсказка — в запятой в подписи."
      uk: "Одне питання, п'ять рядків: чи рахується маркер першим членом речення? *Also*, *Genau* та *Entschuldigung* — ні: вони відділені комою, а речення за ними не зачеплене, тому підмет зберігає своє місце. *Übrigens* — так: це звичайний прислівник усередині речення, тому він посідає перше місце, а відмінюване дієслово йде одразу за ним, відтісняючи підмет: *Übrigens **ist** der Termin …*, *Übrigens **brauchen** wir …*. Уся підказка — у комі в підписі."
      de: "Eine Frage, fünf Zeilen: Zählt das Signalwort als erstes Satzglied? *Also*, *Genau* und *Entschuldigung* zählen nicht — sie stehen mit Komma davor, und der Satz dahinter bleibt unverändert, das Subjekt behält seinen Platz. *Übrigens* zählt — es ist ein normales Adverb im Satz, füllt also Position 1, und das konjugierte Verb folgt direkt danach und schiebt das Subjekt nach hinten: *Übrigens **ist** der Termin …*, *Übrigens **brauchen** wir …*. Das Komma in der Angabe ist der ganze Hinweis."

  - id: uebersetzen-vor-allem
    # revision 2: vor allem alone in position 1 (Vor allem ist es am Abend zu laut) — the order
    # the article's own rule describes — was rejected and charged to the tag. focus_evidence
    # fails only es standing before the verb after the front.
    revision: 2
    outcomes: [inhalt-steuern]
    type: translate
    focus: konjunktionaladverb-inversion
    focus_evidence:
      failed: ["^vor allem (?:am abend |abends )?es(?!\\p{L})"]
      retained: ["^vor allem (?:am abend |abends )?ist es(?!\\p{L})"]
    key_tokens: ["Vor", "ist"]
    instruction:
      en: "Begin the sentence with vor allem."
      ru: "Начните предложение с vor allem."
      uk: "Почніть речення з vor allem."
      de: "Beginn den Satz mit vor allem."
    prompt_en: "Above all it is too loud in the evening."
    prompt_ru: "Прежде всего вечером слишком шумно."
    prompt_uk: "Насамперед увечері надто гучно."
    answer: "Vor allem am Abend ist es zu laut."
    accept:
      - "Vor allem abends ist es zu laut."
      - "Vor allem ist es am Abend zu laut."
      - "Vor allem ist es abends zu laut."
    explain:
      en: "*Vor allem am Abend* is one element, however many words it contains, so it fills position 1 on its own and the finite verb comes second: *… **ist** es zu laut*. *Vor allem* can also fill position 1 alone — *Vor allem **ist** es am Abend zu laut* — and that is accepted too. Counting the phrase as two or three elements and writing *Vor allem am Abend es ist zu laut* is the standard collapse. The instruction fixes the front because *Es ist vor allem am Abend zu laut* is equally good German — with the emphasis in a different place, which is exactly what this item is about."
      ru: "*Vor allem am Abend* — один член предложения, сколько бы слов в нём ни было, поэтому он сам занимает первое место, а спрягаемый глагол идёт вторым: *… **ist** es zu laut*. *Vor allem* может занять первое место и само — *Vor allem **ist** es am Abend zu laut*, — это тоже принимается. Посчитать это сочетание за два-три члена и написать *Vor allem am Abend es ist zu laut* — стандартный сбой. Инструкция закрепляет начало, потому что *Es ist vor allem am Abend zu laut* — столь же хороший немецкий, только с другим местом выделения, а именно о нём это задание."
      uk: "*Vor allem am Abend* — один член речення, скільки б слів у ньому не було, тому він сам посідає перше місце, а відмінюване дієслово йде другим: *… **ist** es zu laut*. *Vor allem* може посісти перше місце й саме — *Vor allem **ist** es am Abend zu laut*, — це теж приймається. Порахувати це сполучення за два-три члени і написати *Vor allem am Abend es ist zu laut* — стандартний збій. Інструкція закріплює початок, бо *Es ist vor allem am Abend zu laut* — так само добра німецька, лише з іншим місцем виділення, а саме про нього це завдання."
      de: "*Vor allem am Abend* ist ein Satzglied, egal wie viele Wörter es hat. Es füllt also allein Position 1, und das konjugierte Verb steht an zweiter Stelle: *… **ist** es zu laut*. Auch *Vor allem* allein kann Position 1 füllen — *Vor allem **ist** es am Abend zu laut* — und wird ebenfalls akzeptiert. Wer den Ausdruck als zwei oder drei Satzglieder zählt und *Vor allem am Abend es ist zu laut* schreibt, macht den typischen Fehler. Die Aufgabe legt den Anfang fest, weil *Es ist vor allem am Abend zu laut* genauso gutes Deutsch ist — nur mit der Betonung an einer anderen Stelle, und genau darum geht es hier."

  - id: uebersetzen-ausweichen
    # revision 2: leider in position 1, nichts before dazu and darüber for "about that" / «об
    # этом» / «про це» were rejected.
    revision: 2
    outcomes: [hoeflich-ausweichen]
    type: translate
    key_tokens: ["dazu", "nichts"]
    prompt_en: "I am afraid I cannot say anything about that."
    prompt_ru: "К сожалению, я ничего не могу об этом сказать."
    prompt_uk: "На жаль, я нічого не можу про це сказати."
    answer: "Dazu kann ich leider nichts sagen."
    accept:
      - "Ich kann dazu leider nichts sagen."
      - "Ich kann leider dazu nichts sagen."
      - "Ich kann leider nichts dazu sagen."
      - "Leider kann ich dazu nichts sagen."
      - "Leider kann ich nichts dazu sagen."
      - "Darüber kann ich leider nichts sagen."
      - "Ich kann darüber leider nichts sagen."
      - "Ich kann leider darüber nichts sagen."
      - "Ich kann leider nichts darüber sagen."
      - "Leider kann ich darüber nichts sagen."
      - "Leider kann ich nichts darüber sagen."
    explain:
      en: "Here the refusal is softened by *leider* rather than explained. *Dazu* points back at whatever was just raised and saves you naming it again — put it first and the finite verb follows it, put *leider* or the subject first and the verb still comes second; every one of those orders is accepted, and so is *darüber*. What does not work is a bare *Nein*: the phrase exists precisely so that declining does not sound like refusing the person."
      ru: "Здесь отказ смягчается словом *leider*, а не объясняется. *Dazu* указывает назад на только что поднятое и избавляет от повторного называния; поставьте его первым — за ним пойдёт спрягаемый глагол, поставьте первым *leider* или подлежащее — глагол всё равно будет вторым: приняты все эти порядки, а также *darüber*. Не работает голое *Nein*: оборот и существует затем, чтобы уход от ответа не звучал как отказ человеку."
      uk: "Тут відмова пом'якшується словом *leider*, а не пояснюється. *Dazu* вказує назад на щойно порушене і позбавляє повторного називання; поставте його першим — за ним піде відмінюване дієслово, поставте першим *leider* чи підмет — дієслово однаково буде другим: прийняті всі ці порядки, а також *darüber*. Не працює голе *Nein*: зворот і існує для того, щоб ухилення від відповіді не звучало як відмова людині."
      de: "Hier wird die Absage mit *leider* weicher gemacht, nicht erklärt. *Dazu* zeigt zurück auf das, was gerade angesprochen wurde, und man muss es nicht noch einmal nennen. Steht es vorn, folgt das konjugierte Verb; steht *leider* oder das Subjekt vorn, steht das Verb trotzdem an zweiter Stelle. Alle diese Reihenfolgen werden akzeptiert, ebenso *darüber*. Ein bloßes *Nein* funktioniert nicht: Der Ausdruck existiert gerade dafür, dass eine Absage nicht wie eine Zurückweisung der Person klingt."
