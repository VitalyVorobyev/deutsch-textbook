# Delayed probe family: ONE competence — producing the Konjunktiv II advice form the
# frame demands — asked three ways (würde, solltest, wäre are cells of one paradigm),
# in sentences no article, reading or practice item uses. Cloze-preferred for
# attribution: the frame is given, only the graded form is produced, and each
# instruction names the verb so the target form is determinate served alone.
topic: gesundheit-wohlbefinden
role: probe
title:
  en: "Delayed check — the advice form, produced cold"
  ru: "Отложенная проверка — форма совета без подготовки"
  uk: "Відкладена перевірка — форма поради без підготовки"
items:
  - id: variant-a
    outcomes: [ratschlaege-formulieren]
    type: cloze
    focus: konjunktiv2-ratschlag
    instruction:
      en: "Complete the advice frame: werden in the Konjunktiv II."
      ru: "Завершите рамку совета: werden в Konjunktiv II."
      uk: "Завершіть рамку поради: werden у Konjunktiv II."
    text: "Du siehst müde aus — an deiner Stelle {{würde}} ich heute früher Feierabend machen."
    translation:
      en: "You look tired — if I were you, I would call it a day earlier today."
      ru: "Ты выглядишь уставшим — я бы на твоём месте сегодня закончил работу пораньше."
      uk: "Ти виглядаєш утомленим — я б на твоєму місці сьогодні закінчив роботу раніше."
    explain:
      en: "an deiner Stelle borrows an unreal ich, and the unreal demands the Konjunktiv II: würde, with the infinitive machen waiting at the very end. The look-alike wurde without the umlaut is the Präteritum of werden — it would turn the advice into history."
      ru: "an deiner Stelle одалживает нереальное ich, а нереальное требует Konjunktiv II: würde, и инфинитив machen ждёт в самом конце. Двойник wurde без умлаута — Präteritum глагола werden: он превратил бы совет в историю."
      uk: "an deiner Stelle позичає нереальне ich, а нереальне вимагає Konjunktiv II: würde, та інфінітив machen чекає в самому кінці. Двійник wurde без умлаута — Präteritum дієслова werden: він перетворив би пораду на історію."

  - id: variant-b
    outcomes: [ratschlaege-formulieren]
    type: cloze
    focus: konjunktiv2-ratschlag
    instruction:
      en: "Fill in sollen as softened advice — Konjunktiv II, du-form."
      ru: "Впишите sollen как смягчённый совет — Konjunktiv II, форма для du."
      uk: "Впишіть sollen як пом'якшену пораду — Konjunktiv II, форма для du."
    text: "Du {{solltest}} vor der langen Autofahrt noch etwas essen."
    translation:
      en: "You should eat something before the long drive."
      ru: "Тебе стоило бы поесть перед долгой поездкой на машине."
      uk: "Тобі варто було б поїсти перед довгою поїздкою автомобілем."
    explain:
      en: "sollen's Konjunktiv II is solltest — the same letters as its Präteritum, but in an advice sentence it reads as the softened you-should. The indicative sollst would make it an instruction from above rather than advice between equals."
      ru: "Konjunktiv II глагола sollen — solltest: буквы те же, что у Präteritum, но в предложении-совете это читается как смягчённое «тебе стоило бы». Индикатив sollst сделал бы из него указание сверху, а не совет на равных."
      uk: "Konjunktiv II дієслова sollen — solltest: літери ті самі, що в Präteritum, але в реченні-пораді це читається як пом'якшене «тобі варто було б». Індикатив sollst зробив би з нього вказівку згори, а не пораду на рівних."

  - id: variant-c
    outcomes: [ratschlaege-formulieren]
    type: cloze
    focus: konjunktiv2-ratschlag
    instruction:
      en: "Complete the suggestion frame: sein in the Konjunktiv II."
      ru: "Завершите рамку предложения: sein в Konjunktiv II."
      uk: "Завершіть рамку пропозиції: sein у Konjunktiv II."
    text: "Wie {{wäre}} es mit einem Abend ganz ohne Handy?"
    translation:
      en: "How about an evening entirely without your phone?"
      ru: "Как насчёт вечера совсем без телефона?"
      uk: "Як щодо вечора зовсім без телефона?"
    explain:
      en: "Wie wäre es mit …? is the suggestion frame, and its verb is the one-word Konjunktiv II of sein: wäre. Plain war would ask about a past evening — the umlaut moves the sentence from memory to possibility. One family, one competence: the Konjunktiv II advice form, produced cold."
      ru: "Wie wäre es mit …? — рамка предложения, и её глагол — однословный Konjunktiv II глагола sein: wäre. Простое war спрашивало бы о прошедшем вечере — умлаут переводит предложение из воспоминания в возможность. Одна семья, одна компетенция: форма совета в Konjunktiv II, воспроизведённая без подготовки."
      uk: "Wie wäre es mit …? — рамка пропозиції, і її дієслово — однослівний Konjunktiv II дієслова sein: wäre. Просте war питало б про минулий вечір — умлаут переводить речення зі спогаду в можливість. Одна сім'я, одна компетенція: форма поради в Konjunktiv II, відтворена без підготовки."
