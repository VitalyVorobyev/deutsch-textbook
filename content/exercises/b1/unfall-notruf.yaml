topic: unfall-notruf
role: practice
stage: geruest
activity: core
title_de: "Grundübung — den Hergang erzählen"
title:
  en: "Practice — telling what happened"
  ru: "Практика — рассказать, как это произошло"
  uk: "Практика — розповісти, як це сталося"

# The topic's primary practice set, so its item list is frozen once this ships.
#
# Twelve items over the article's four sections: the call's fixed order (table-notruf,
# mc-notrufnummer), the sequence of two past events (cloze-nachdem-plusquam,
# uebersetzen-nachdem, cloze-nachdem-sein, order-nachdem), the order of the adverbials
# (cloze-angaben, uebersetzen-angaben, table-angaben) and naming the injury
# (cloze-koerperteil, uebersetzen-weh, match-verletzung).
#
# Two tags, both recycled and both chosen from `bun scripts/grammar-depth.ts B1 --thin`:
# `plusquamperfekt-nachdem` and `angaben-reihenfolge` were each living in a single practice
# file, met once in one sitting and never interleaved again. This set is their second file and
# their second context, which is the whole of what the thin tail measures.
#
# Mix over this file: 1 mc of 12 (8%), mc+match+order 3 of 12 (25%), 3 translate, 1 order.
#
# Every noun is a headword of `koerper-medizin-b1`, the deck this topic adopts, or of an A1/A2
# deck — grepped in content/vocab/ rather than remembered: Wunde, Verletzung, Blut, bluten,
# Knie, Schulter, Kopf, Arm, Krankenwagen, Klinik, Untersuchung, Pflaster, Patient, Straße,
# Auto, Fahrrad, Regen, Arzt, Kreuzung, Morgen.
items:
  - id: table-notruf
    outcomes: [notruf-absetzen]
    type: table
    title: "Der Notruf in der richtigen Reihenfolge"
    instruction:
      en: "Number the steps of an emergency call from 1 to 5."
      ru: "Пронумеруйте шаги экстренного звонка от 1 до 5."
      uk: "Пронумеруйте кроки екстреного дзвінка від 1 до 5."
    columns: ["Nummer"]
    rows:
      - label: "Ihren Namen nennen"
        cells:
          - { answer: "5" }
      - label: "sagen, wo es passiert ist"
        cells:
          - { answer: "1", given: true }
      - label: "sagen, welche Verletzung die Person hat"
        cells:
          - { answer: "4" }
      - label: "sagen, was passiert ist"
        cells:
          - { answer: "2" }
      - label: "sagen, wie viele Personen verletzt sind"
        cells:
          - { answer: "3" }
    explain:
      en: "The address comes first because it is what starts the ambulance moving — the dispatcher can send a vehicle while you are still talking. Everything else follows the same logic: what happened, then how many are hurt, then how badly, and your name last, because it changes nothing about the response. Your instinct is to start with the drama; the system needs the map reference."
      ru: "Адрес идёт первым, потому что именно он приводит машину в движение: диспетчер может отправить её, пока вы ещё говорите. Всё остальное следует той же логике — что случилось, потом сколько пострадавших, потом насколько тяжело, а имя последним, потому что оно ничего не меняет в реакции. Инстинкт велит начать с самого страшного; системе нужна точка на карте."
      uk: "Адреса йде першою, бо саме вона приводить машину в рух: диспетчер може відправити її, поки ви ще говорите. Усе інше слідує тій самій логіці — що сталося, потім скільки потерпілих, потім наскільки тяжко, а ім'я останнім, бо воно нічого не змінює в реакції. Інстинкт велить почати з найстрашнішого; системі потрібна точка на карті."

  - id: mc-notrufnummer
    # revision 2 (2026-10-13 quality pass): the prompt was a bicycle stolen in the night and
    # keyed 110, but 110 is the police emergency line — a theft found the next morning is
    # reported at a police station or through the police's online service, which is what
    # polizei-anzeige then does at the counter. The theft now happens while you watch.
    revision: 2
    outcomes: [notruf-absetzen]
    type: mc
    prompt: "Sie sehen gerade, wie jemand Ihr Fahrrad stiehlt. Welche Nummer wählen Sie?"
    options:
      - "110"
      - "112"
      - "116117"
    correct: 0
    explain:
      en: "A crime happening in front of you is police business: 110. 112 is the fire brigade and the ambulance, and calling it for a theft occupies a line somebody may need for an injury. A bicycle you find gone in the morning is no emergency at all: you report it at a police station or through the police's online service, not on 110."
      ru: "Преступление, которое происходит у вас на глазах, — дело полиции: 110. 112 — пожарные и скорая, и звонок туда из-за кражи занимает линию, которая может понадобиться пострадавшему. А если утром вы обнаружили, что велосипеда нет, это уже не экстренный случай: о краже заявляют в полицейском участке или через онлайн-сервис полиции, а не по 110."
      uk: "Злочин, що відбувається у вас на очах, — справа поліції: 110. 112 — пожежні та швидка, і дзвінок туди через крадіжку займає лінію, яка може знадобитися потерпілому. А якщо вранці ви виявили, що велосипеда немає, це вже не екстрений випадок: про крадіжку заявляють у поліцейському відділку або через онлайн-сервіс поліції, а не на 110."

  - id: cloze-nachdem-plusquam
    outcomes: [unfallhergang-schildern]
    type: cloze
    focus: plusquamperfekt-nachdem
    instruction:
      en: "Fill in the auxiliary each clause needs: hatte or war."
      ru: "Вставьте вспомогательный глагол, нужный каждой части: hatte или war."
      uk: "Вставте допоміжне дієслово, потрібне кожній частині: hatte або war."
    text: "Nachdem der Fahrer gebremst {{hatte}}, rutschte das Auto weiter. Nachdem der Krankenwagen angekommen {{war}}, ging alles schnell."
    translation:
      en: "After the driver had braked, the car went on sliding. Once the ambulance had arrived, everything went quickly."
      ru: "После того как водитель затормозил, машина продолжила скользить. После того как приехала скорая, всё пошло быстро."
      uk: "Після того як водій загальмував, машина продовжила ковзати. Після того як приїхала швидка, усе пішло швидко."
    explain:
      en: "Both clauses take the Plusquamperfekt because *nachdem* names the earlier of two past events — but they choose different auxiliaries. *Bremsen* is an ordinary action verb and builds its perfect with *haben*, so *hatte gebremst*. *Ankommen* is a change of place and takes *sein*, so *war angekommen*. The Plusquamperfekt inherits that choice unchanged from the Perfekt; nothing new has to be learned about which verb takes which."
      ru: "Обе части стоят в Plusquamperfekt, потому что *nachdem* называет более раннее из двух прошедших событий, — но вспомогательные у них разные. *Bremsen* — обычный глагол действия и строит перфект с *haben*, отсюда *hatte gebremst*. *Ankommen* — перемена места и берёт *sein*, отсюда *war angekommen*. Plusquamperfekt наследует этот выбор у Perfekt без изменений: заново запоминать ничего не нужно."
      uk: "Обидві частини стоять у Plusquamperfekt, бо *nachdem* називає ранішу з двох минулих подій, — але допоміжні в них різні. *Bremsen* — звичайне дієслово дії і будує перфект із *haben*, звідси *hatte gebremst*. *Ankommen* — зміна місця і бере *sein*, звідси *war angekommen*. Plusquamperfekt успадковує цей вибір від Perfekt без змін: наново запам'ятовувати нічого не треба."

  - id: uebersetzen-nachdem
    # revision 2 (2026-10-13 quality pass): the two lexical verbs were the learner's to guess —
    # «осмотрел» is untersuchen or sich ansehen, "put on a plaster" anlegen or aufkleben, and
    # RU/UK «пластырь» leaves ein/das free — so the instruction names them. focus_evidence
    # charges only the tag's own decision: the participle not closed by hatte (Perfekt,
    # Präteritum, war, a missing or fronted auxiliary) and a main clause stepped back as well.
    # An unfinished answer (logged: Nachdem der Arzt die Wunde gese) is no longer charged.
    revision: 2
    outcomes: [unfallhergang-schildern]
    type: translate
    focus: plusquamperfekt-nachdem
    key_tokens: ["Nachdem", "hatte"]
    focus_evidence:
      failed: ["(?<!\\p{L})unters\\p{L}*(?!\\p{L})(?!\\s+hatte(?!\\p{L}))", "(?<!\\p{L})hatte\\s+hatte(?!\\p{L})"]
      retained: ["(?<!\\p{L})nachdem(?!\\p{L}).*(?<!\\p{L})unters\\p{L}*\\s+hatte(?!\\p{L})"]
    instruction:
      en: "Begin with the earlier event. For 'examined' take untersuchen, for 'put on a plaster' ein Pflaster anlegen."
      ru: "Начните с более раннего события. Для «осмотрел» возьмите untersuchen, для «наложил пластырь» — ein Pflaster anlegen."
      uk: "Почніть із ранішої події. Для «оглянув» візьміть untersuchen, для «наклав пластир» — ein Pflaster anlegen."
    prompt_en: "After the doctor had examined the wound, he put on a plaster."
    prompt_ru: "После того как врач осмотрел рану, он наложил пластырь."
    prompt_uk: "Після того як лікар оглянув рану, він наклав пластир."
    answer: "Nachdem der Arzt die Wunde untersucht hatte, hat er ein Pflaster angelegt."
    accept:
      - "Nachdem der Arzt die Wunde untersucht hatte, legte er ein Pflaster an."
    explain:
      en: "Two things follow from *nachdem* and both are graded here. It opens a Nebensatz, so the whole verb group goes to the end — *untersucht hatte*, with the auxiliary last. And the earlier event steps back into the Plusquamperfekt while the later one stays in Perfekt or Präteritum; both are accepted, because German lets you tell the second half either way."
      ru: "Из *nachdem* следуют две вещи, и обе здесь оцениваются. Он открывает придаточное, поэтому вся глагольная группа уходит в конец — *untersucht hatte*, со вспомогательным последним. И более раннее событие отступает в Plusquamperfekt, а более позднее остаётся в Perfekt или Präteritum; принимаются оба, потому что немецкий разрешает рассказать вторую половину и так и так. По-русски достаточно одного прошедшего в обеих частях — отсюда и соблазн."
      uk: "Із *nachdem* випливають дві речі, і обидві тут оцінюються. Він відкриває підрядне, тому вся дієслівна група йде в кінець — *untersucht hatte*, з допоміжним останнім. І раніша подія відступає в Plusquamperfekt, а пізніша лишається в Perfekt або Präteritum; приймаються обидва, бо німецька дозволяє розповісти другу половину і так і так."

  - id: order-nachdem
    # revision 2 (2026-10-13 quality pass): the chips held two articles, den and der, so a
    # learner could swap them (logged: Nachdem ich der Notruf gewählt hatte, kam den
    # Krankenwagen.) — a case decision the item handed over and then charged to
    # plusquamperfekt-nachdem with the verb group right. The object is now 112, which takes
    # no article, so the one article left has one slot.
    revision: 2
    outcomes: [unfallhergang-schildern]
    type: order
    focus: plusquamperfekt-nachdem
    focus_evidence:
      failed: ["(?<!\\p{L})hatte(?!\\p{L}).*(?<!\\p{L})gewählt(?!\\p{L})"]
      retained: ["(?<!\\p{L})gewählt hatte(?!\\p{L})"]
    instruction:
      en: "Build the Nebensatz."
      ru: "Составьте придаточное предложение."
      uk: "Складіть підрядне речення."
    words: ["Nachdem", "ich", "112", "gewählt", "hatte,", "kam", "der", "Krankenwagen."]
    translation:
      en: "After I had dialled 112, the ambulance came."
      ru: "После того как я набрал 112, приехала скорая."
      uk: "Після того як я набрав 112, приїхала швидка."
    explain:
      en: "The order is the point: *nachdem* opens the clause, the subject and object follow, and the verb group closes it with the participle before the auxiliary — *gewählt hatte*, not *hatte gewählt*. That inversion inside the verb group is what a Nebensatz does to the Plusquamperfekt, and it is the part that disappears if you only ever meet the construction in a main clause."
      ru: "Порядок здесь и есть суть: *nachdem* открывает придаточное, дальше идут подлежащее и дополнение, а глагольная группа закрывает его — причастие перед вспомогательным: *gewählt hatte*, а не *hatte gewählt*. Эта перестановка внутри глагольной группы и есть то, что придаточное делает с Plusquamperfekt, и именно она пропадает, если встречать конструкцию только в главном предложении."
      uk: "Порядок тут і є суть: *nachdem* відкриває підрядне, далі йдуть підмет і додаток, а дієслівна група закриває його — дієприкметник перед допоміжним: *gewählt hatte*, а не *hatte gewählt*. Ця перестановка всередині дієслівної групи і є те, що підрядне робить із Plusquamperfekt, і саме вона зникає, якщо зустрічати конструкцію лише в головному реченні."

  - id: cloze-nachdem-sein
    # revision 2 (2026-10-13 quality pass): the second gap asked for "the tense the main
    # clause takes" without naming its verb, and a cloze charges its tag for any wrong gap —
    # logged: waren / hat, the auxiliary right and the main clause given haben for the sein of
    # a state, which is not the tense staircase. The instruction now names sein for that gap,
    # so what is left to decide there is its tense.
    revision: 2
    outcomes: [unfallhergang-schildern]
    type: cloze
    focus: plusquamperfekt-nachdem
    focus_evidence:
      failed: ["(?<!\\p{L})angekommen (sind|seid|haben|hatten|hätten|wären)(?!\\p{L})", "(?<!\\p{L})angekommen \\S+ (ist|hat|wird|wurde|wäre)(?!\\p{L})"]
      retained: ["(?<!\\p{L})angekommen waren war(?!\\p{L})"]
    instruction:
      en: "Fill in the auxiliary, then the form of sein the main clause takes."
      ru: "Вставьте вспомогательный глагол, затем форму sein, которая нужна главному предложению."
      uk: "Вставте допоміжне дієслово, потім форму sein, потрібну головному реченню."
    text: "Nachdem wir angekommen {{waren}}, {{war}} die Straße schon gesperrt."
    translation:
      en: "By the time we arrived, the road had already been closed off."
      ru: "К тому времени как мы приехали, улица была уже перекрыта."
      uk: "На той час, коли ми приїхали, вулиця була вже перекрита."
    explain:
      en: "The same verb, sein, fills both gaps and does two different jobs, which is exactly why this item exists. The first *waren* is an auxiliary building the Plusquamperfekt of *ankommen*. The second *war* is the full verb *sein* in the Präteritum, describing the state of the road. Reading the sentence as if both were the same tense loses the sequence."
      ru: "Один и тот же глагол, sein, заполняет оба пропуска и делает две разные работы — ради этого пункт и существует. Первое *waren* — вспомогательный глагол, строящий Plusquamperfekt от *ankommen*. Второе *war* — полнозначный *sein* в Präteritum, описывающий состояние улицы. Прочитать фразу так, будто оба одинаковы, значит потерять последовательность."
      uk: "Те саме дієслово, sein, заповнює обидва пропуски і робить дві різні роботи — заради цього пункт і існує. Перше *waren* — допоміжне дієслово, що будує Plusquamperfekt від *ankommen*. Друге *war* — повнозначне *sein* у Präteritum, що описує стан вулиці. Прочитати фразу так, ніби обидва однакові, означає втратити послідовність."

  - id: cloze-angaben
    outcomes: [unfallhergang-schildern]
    type: cloze
    focus: angaben-reihenfolge
    focus_evidence:
      failed: ["(?<!\\p{L})langsam(?!\\p{L}).*(?<!\\p{L})gestern(?!\\p{L})", "(?<!\\p{L})straße(?!\\p{L}).*(?<!\\p{L})gestern(?!\\p{L})", "(?<!\\p{L})straße(?!\\p{L}).*(?<!\\p{L})langsam(?!\\p{L})"]
      retained: ["(?<!\\p{L})gestern(?!\\p{L}).*(?<!\\p{L})langsam(?!\\p{L}).*(?<!\\p{L})straße(?!\\p{L})"]
    instruction:
      en: "Put the three details in the order German requires: langsam, gestern, über die Straße."
      ru: "Расставьте три обстоятельства в порядке, которого требует немецкий: langsam, gestern, über die Straße."
      uk: "Розставте три обставини в порядку, якого вимагає німецька: langsam, gestern, über die Straße."
    text: "Ich bin {{gestern}} {{langsam}} {{über die Straße}} gegangen."
    translation:
      en: "Yesterday I walked slowly across the road."
      ru: "Вчера я медленно перешёл дорогу."
      uk: "Учора я повільно перейшов дорогу."
    explain:
      en: "Time, then manner, then place — the default order of the middle field. Here the place holds its slot firmly, because über die Straße says which way you went: a direction belongs to the verb and stands right in front of the participle. The place phrase feels like the most important information and still comes last. To put weight on one element, front it — and only one may stand there."
      ru: "Время, потом образ действия, потом место — порядок по умолчанию. Здесь место держится за своё место крепко: über die Straße говорит, куда вы шли, а направление принадлежит глаголу и стоит прямо перед причастием. Обстоятельство места кажется главной информацией и всё равно стоит последним. Чтобы выделить один элемент, его выносят вперёд — и вынести можно только один. По-русски порядок свободен, поэтому проверять его приходится сознательно."
      uk: "Час, потім спосіб дії, потім місце — порядок за замовчуванням. Тут місце тримається своєї позиції міцно: über die Straße каже, куди ви йшли, а напрямок належить дієслову і стоїть просто перед дієприкметником. Обставина місця здається головною інформацією і все одно стоїть останньою. Щоб виділити один елемент, його виносять уперед — і винести можна лише один."

  - id: uebersetzen-angaben
    outcomes: [unfallhergang-schildern]
    type: translate
    focus: angaben-reihenfolge
    key_tokens: ["heute", "vorsichtig"]
    instruction:
      en: "Keep all three details behind the verb."
      ru: "Оставьте все три обстоятельства после глагола."
      uk: "Залиште всі три обставини після дієслова."
    prompt_en: "Today I drove carefully to the crossroads."
    prompt_ru: "Сегодня я осторожно доехал до перекрёстка."
    prompt_uk: "Сьогодні я обережно доїхав до перехрестя."
    answer: "Ich bin heute vorsichtig zur Kreuzung gefahren."
    accept:
      - "Heute bin ich vorsichtig zur Kreuzung gefahren."
      # revision 2: «до перекрёстка» / «до перехрестя» is bis zur Kreuzung as readily as zur Kreuzung;
      # the place still closes the middle field.
      - "Ich bin heute vorsichtig bis zur Kreuzung gefahren."
      - "Heute bin ich vorsichtig bis zur Kreuzung gefahren."
      # revision 3 (2026-10-13 quality pass): no prompt asks for a tense, and "drove" /
      # «доехал» are as much fuhr as bin … gefahren; the middle field is the same.
      - "Ich fuhr heute vorsichtig zur Kreuzung."
      - "Heute fuhr ich vorsichtig zur Kreuzung."
      - "Ich fuhr heute vorsichtig bis zur Kreuzung."
      - "Heute fuhr ich vorsichtig bis zur Kreuzung."
    revision: 3
    # focus_evidence (2026-10-13 quality pass): the order counted from the finite verb — the
    # time after the manner or the place, the manner after the direction — so a fronted
    # Angabe is not charged, and a slip in the noun (logged: zum Kreuz) still is not.
    focus_evidence:
      failed: ["(?<!\\p{L})(?:bin|fuhr)(?!\\p{L}).*(?<!\\p{L})(?:vorsichtig|kreuz\\p{L}*)(?!\\p{L}).*(?<!\\p{L})heute(?!\\p{L})", "(?<!\\p{L})(?:bin|fuhr)(?!\\p{L}).*(?<!\\p{L})kreuz\\p{L}*(?!\\p{L}).*(?<!\\p{L})vorsichtig(?!\\p{L})"]
      retained: ["(?<!\\p{L})heute(?!\\p{L}).*(?<!\\p{L})vorsichtig(?!\\p{L}).*(?<!\\p{L})kreuz\\p{L}*(?!\\p{L})"]
    explain:
      en: "Time before manner before place, again — and the accepted variants show what the rule does and does not cover. Moving *heute* in front of the verb is allowed and changes nothing about the two that stay behind it, and the Präteritum *fuhr* keeps the same middle. What the neutral sentence does not do is put *vorsichtig* behind *zur Kreuzung*: that is where the drive goes, a direction, and a direction stays right in front of the participle."
      ru: "Снова время перед образом действия перед местом — и принятые варианты показывают, что правило покрывает, а что нет. Вынести *heute* перед глаголом можно, и на порядок двух оставшихся это никак не влияет; Präteritum *fuhr* сохраняет ту же середину. А вот *vorsichtig* за *zur Kreuzung* нейтральная фраза не ставит: это то, куда вы ехали, — направление, а направление стоит прямо перед причастием."
      uk: "Знову час перед способом дії перед місцем — і прийняті варіанти показують, що правило покриває, а що ні. Винести *heute* перед дієсловом можна, і на порядок двох, що лишилися, це ніяк не впливає; Präteritum *fuhr* зберігає ту саму середину. А от *vorsichtig* за *zur Kreuzung* нейтральна фраза не ставить: це те, куди ви їхали, — напрямок, а напрямок стоїть просто перед дієприкметником."

  - id: table-angaben
    # revision 2 (2026-10-13 quality pass): each row label listed its phrases in the column
    # order, so the item could be filled by copying the label left to right; the labels are
    # now shuffled. The last column said wo while row two's answer, zur Klinik, answers
    # wohin? — the wo-wohin distinction the course drills — so it is wo / wohin.
    revision: 2
    outcomes: [unfallhergang-schildern]
    type: table
    focus: angaben-reihenfolge
    focus_evidence:
      failed: ["^(schnell|an der kreuzung|heute morgen)(?: /|$)", "^(?:[^/]*/ ){1}(wegen des regens|an der kreuzung|heute morgen)(?: /|$)", "^(?:[^/]*/ ){2}(wegen des regens|schnell|heute morgen)(?: /|$)", "^(?:[^/]*/ ){3}(aus angst|zu fuß|zur klinik)(?: /|$)", "^(?:[^/]*/ ){4}(sofort|zu fuß|zur klinik)(?: /|$)", "^(?:[^/]*/ ){5}(sofort|aus angst|zur klinik)(?: /|$)", "^(?:[^/]*/ ){6}(sofort|aus angst|zu fuß)(?: /|$)"]
      retained: []
    title: "Welche Angabe steht wo?"
    instruction:
      en: "Sort each phrase into its slot."
      ru: "Распределите каждое выражение по своей позиции."
      uk: "Розподіліть кожен вираз за своєю позицією."
    columns: ["wann", "warum", "wie", "wo / wohin"]
    rows:
      - label: "an der Kreuzung · schnell · heute Morgen · wegen des Regens"
        cells:
          - { answer: "heute Morgen", given: true }
          - { answer: "wegen des Regens" }
          - { answer: "schnell" }
          - { answer: "an der Kreuzung" }
      - label: "zu Fuß · zur Klinik · aus Angst · sofort"
        cells:
          - { answer: "sofort" }
          - { answer: "aus Angst" }
          - { answer: "zu Fuß" }
          - { answer: "zur Klinik" }
    explain:
      en: "Sorting them is easier than producing them, which is the point of doing it once before the translate items. The questions to ask are *wann*, *warum*, *wie*, *wo* — in that order — and each phrase answers exactly one of them; the place slot takes *wohin* too, which is why *zur Klinik* belongs there. Note that *zu Fuß* answers *wie* and not *wo*, even though it names no manner you can hear: the test is the question, not the words."
      ru: "Разложить их проще, чем построить, — ради этого упражнение и стоит перед пунктами на перевод. Задавать надо вопросы *wann*, *warum*, *wie*, *wo* именно в таком порядке, и каждое выражение отвечает ровно на один из них; в позицию места попадает и *wohin*, поэтому *zur Klinik* стоит там же. Обратите внимание: *zu Fuß* отвечает на *wie*, а не на *wo*, хотя никакого «как» в нём на слух нет. Проверка — вопрос, а не слова."
      uk: "Розкласти їх простіше, ніж побудувати, — заради цього вправа й стоїть перед пунктами на переклад. Ставити треба питання *wann*, *warum*, *wie*, *wo* саме в такому порядку, і кожен вираз відповідає рівно на одне з них; у позицію місця потрапляє і *wohin*, тому *zur Klinik* стоїть там само. Зверніть увагу: *zu Fuß* відповідає на *wie*, а не на *wo*, хоча жодного «як» у ньому на слух немає. Перевірка — питання, а не слова."

  - id: cloze-koerperteil
    outcomes: [verletzung-benennen]
    type: cloze
    instruction:
      en: "Fill in the reflexive pronoun and the article."
      ru: "Вставьте возвратное местоимение и артикль."
      uk: "Вставте зворотний займенник і артикль."
    text: "Ich habe {{mir}} {{den}} Arm verletzt, und meine Kollegin hat {{sich}} das Knie verletzt."
    translation:
      en: "I have injured my arm, and my colleague has injured her knee."
      ru: "Я повредил руку, а моя коллега повредила колено."
      uk: "Я пошкодив руку, а моя колега пошкодила коліно."
    explain:
      en: "German marks whose body it is with a dative reflexive, not with a possessive: *mir … den Arm*, *sich … das Knie*. The body part then keeps its ordinary definite article and stands in the accusative as the thing affected. Saying *meinen Arm* is understood but marks you out — the *mir* has already said whose arm it is, so the possessive doubles it."
      ru: "Немецкий отмечает принадлежность тела возвратным местоимением в дативе, а не притяжательным: *mir … den Arm*, *sich … das Knie*. Часть тела сохраняет обычный определённый артикль и стоит в аккузативе как затронутый предмет. *Meinen Arm* поймут, но так не говорят: *mir* уже сказало, чья это рука, и притяжательное её дублирует."
      uk: "Німецька позначає належність тіла зворотним займенником у давальному, а не присвійним: *mir … den Arm*, *sich … das Knie*. Частина тіла зберігає звичайний означений артикль і стоїть у знахідному як зачеплений предмет. *Meinen Arm* зрозуміють, але так не кажуть: *mir* уже сказало, чия це рука, і присвійне її дублює."

  - id: uebersetzen-weh
    # revision 2 (2026-10-13 quality pass): Mein Kopf tut weh — the English prompt's own shape,
    # and correct German — was rejected; it is accepted now. Ich habe Kopfschmerzen is correct
    # too and bypasses wehtun, which every line of the explain is about, so the instruction
    # names the verb.
    revision: 2
    outcomes: [verletzung-benennen]
    type: translate
    key_tokens: ["Mir", "tut"]
    instruction:
      en: "Use wehtun."
      ru: "Используйте wehtun."
      uk: "Використайте wehtun."
    prompt_en: "My head hurts and I cannot stand up."
    prompt_ru: "У меня болит голова, и я не могу встать."
    prompt_uk: "У мене болить голова, і я не можу встати."
    answer: "Mir tut der Kopf weh, und ich kann nicht aufstehen."
    accept:
      - "Der Kopf tut mir weh, und ich kann nicht aufstehen."
      - "Mein Kopf tut weh, und ich kann nicht aufstehen."
    explain:
      en: "In *wehtun* the body part is the subject and the person is in the dative — literally the head does the hurting, to me. So it is *der Kopf* in the nominative and *mir*, never *ich*. *Mein Kopf tut weh*, with the possessive English uses, is correct German too and accepted; the dative shape is the one this topic builds on."
      ru: "В *wehtun* подлежащее — часть тела, а человек стоит в дативе: буквально «голова делает больно мне». Поэтому *der Kopf* в номинативе и *mir*, а не *ich*. *Mein Kopf tut weh* с притяжательным — тоже правильный немецкий и принимается; тема строится на дательном обороте. Он близок к русскому «мне больно», где «я» тоже не подлежащее, — так что доверять образцу здесь можно."
      uk: "У *wehtun* підмет — частина тіла, а людина стоїть у давальному: буквально «голова робить боляче мені». Тому *der Kopf* у називному і *mir*, а не *ich*. *Mein Kopf tut weh* із присвійним — теж правильна німецька і приймається; тема будується на давальному звороті. Він близький до українського «мені боляче», де «я» теж не підмет, — тож довіряти зразку тут можна."

  - id: match-verletzung
    outcomes: [verletzung-benennen, unfallbericht-verstehen]
    type: match
    instruction:
      en: "Match each word with its meaning."
      ru: "Соотнесите каждое слово с его значением."
      uk: "Зіставте кожне слово з його значенням."
    pairs:
      - left: "die Wunde"
        right: { en: "wound, open injury", ru: "рана", uk: "рана" }
      - left: "die Verletzung"
        right: { en: "injury (the general word)", ru: "травма (общее слово)", uk: "травма (загальне слово)" }
      - left: "bluten"
        right: { en: "to bleed", ru: "кровоточить", uk: "кровоточити" }
      - left: "der Krankenwagen"
        right: { en: "ambulance", ru: "скорая помощь", uk: "швидка допомога" }
      - left: "die Notaufnahme"
        right: { en: "accident and emergency department", ru: "приёмный покой, неотложка", uk: "приймальне відділення, невідкладна" }
      - left: "das Pflaster"
        right: { en: "plaster, sticking plaster", ru: "пластырь", uk: "пластир" }
    explain:
      en: "Two of these are worth separating deliberately. *Wunde* is a specific open injury you can point at; *Verletzung* is the general word and covers a broken bone with no wound at all. And *Notaufnahme* is a place inside the hospital, while the *Notruf* is the phone call — they share the *Not-* and nothing else."
      ru: "Две пары стоит развести сознательно. *Wunde* — конкретная открытая рана, на которую можно показать; *Verletzung* — общее слово, покрывающее и перелом без всякой раны. А *Notaufnahme* — место в больнице, тогда как *Notruf* — телефонный звонок: общего у них только *Not-*."
      uk: "Дві пари варто розвести свідомо. *Wunde* — конкретна відкрита рана, на яку можна показати; *Verletzung* — загальне слово, що покриває і перелом без жодної рани. А *Notaufnahme* — місце в лікарні, тоді як *Notruf* — телефонний дзвінок: спільне в них лише *Not-*."
