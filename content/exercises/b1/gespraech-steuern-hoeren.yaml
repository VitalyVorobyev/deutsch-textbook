topic: gespraech-steuern
role: practice
stage: transfer
activity: task
skill: hoeren
title_de: "Hören im Kontext — Gespräche steuern"
title:
  en: 'Taking the floor back'
  ru: 'Вернуть себе слово'
  uk: 'Повернути собі слово'
  de: 'Das Wort zurückbekommen'
items:
- id: q1
  outcomes:
  - wort-nehmen-geben
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Frau Engel
      text: 'Gut, fangen wir an. Herr Petersen, Sie wollten kurz etwas zum Urlaubsplan sagen.'
    - speaker: Herr Petersen
      text: 'Ja, danke. Ich habe einen Vorschlag: Wir tragen unseren Urlaub ab jetzt alle in einen gemeinsamen Kalender ein. Dann sieht man zum Beispiel …'
    - speaker: Frau Ilić
      text: 'Entschuldigung, wenn ich kurz unterbreche: Gilt das auch für den Sommer? Ich habe meinen Urlaub schon beantragt.'
    - speaker: Herr Petersen
      text: 'Moment, dazu komme ich gleich. Darf ich den Gedanken noch zu Ende bringen?'
    - speaker: Frau Ilić
      text: 'Natürlich, entschuldigen Sie.'
    - speaker: Herr Petersen
      text: 'Also, im Kalender sieht man dann sofort, wer im August fehlt. Und zu Ihrer Frage, Frau Ilić: Was schon beantragt ist, bleibt so. Sie wollten noch etwas sagen?'
    - speaker: Frau Ilić
      text: 'Ja, danke. Übrigens wäre es praktisch, wenn der Kalender auch auf dem Handy funktionieren würde.'
    - speaker: Herr Petersen
      text: 'Gute Idee, das prüfe ich. Damit bin ich mit meinem Punkt fertig.'
    - speaker: Frau Engel
      text: 'Danke, Herr Petersen. Dann halten wir fest: Ab nächster Woche tragen alle ihren Urlaub in den gemeinsamen Kalender ein.'
  recording: ls-gespraech-steuern-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
    de: Hör zu und wähle die richtige Antwort.
  question: 'Wie unterbricht Frau Ilić Herrn Petersen?'
  options:
  - 'Sie entschuldigt sich und stellt eine kurze Frage.'
  - 'Sie sagt laut, dass sie anderer Meinung ist.'
  - 'Sie wartet, bis er fertig ist.'
  correct: 0
  explain:
    en: 'Entschuldigung, wenn ich kurz unterbreche is the polite way in: an apology, the word kurz, and then one question about the summer. She does not disagree with the plan.'
    ru: 'Entschuldigung, wenn ich kurz unterbreche — вежливый способ вмешаться: извинение, слово kurz и затем один вопрос про лето. С самим планом она не спорит.'
    uk: 'Entschuldigung, wenn ich kurz unterbreche — ввічливий спосіб втрутитися: вибачення, слово kurz, а потім одне питання про літо. З самим планом вона не сперечається.'
    de: '„Entschuldigung, wenn ich kurz unterbreche“: Sie entschuldigt sich, sagt „kurz“ und stellt dann nur eine Frage zum Sommer. Gegen den Vorschlag ist sie nicht.'
  max_replays: 3
