  question: 'Was macht Herr Petersen, als Frau Ilić ihn unterbricht?'
  options:
  - 'Er bittet darum, seinen Gedanken zu Ende zu bringen.'
  - 'Er beantwortet ihre Frage sofort.'
  - 'Er gibt das Wort an Frau Engel weiter.'
  correct: 0
  explain:
    en: 'Moment, dazu komme ich gleich takes the floor back without brushing her off, and darf ich den Gedanken noch zu Ende bringen? asks for it politely. He answers her question afterwards.'
    ru: 'Moment, dazu komme ich gleich возвращает ему слово, не отмахиваясь от вопроса, а darf ich den Gedanken noch zu Ende bringen? вежливо просит дать договорить. На её вопрос он отвечает потом.'
    uk: 'Moment, dazu komme ich gleich повертає йому слово, не відмахуючись від питання, а darf ich den Gedanken noch zu Ende bringen? ввічливо просить дати договорити. На її питання він відповідає потім.'
    de: 'Mit „Moment, dazu komme ich gleich“ bekommt er das Wort zurück, ohne ihre Frage zu vergessen, und fragt höflich: „Darf ich den Gedanken noch zu Ende bringen?“ Ihre Frage beantwortet er danach.'
  max_replays: 3
