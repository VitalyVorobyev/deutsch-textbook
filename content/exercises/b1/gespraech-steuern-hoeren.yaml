  question: 'Was sagt Herr Petersen zu Frau Ilićs Frage nach dem Sommer?'
  options:
  - 'Schon beantragter Urlaub bleibt so.'
  - 'Sie muss ihren Urlaub noch einmal beantragen.'
  - 'Darüber sprechen sie in der nächsten Besprechung.'
  correct: 0
  explain:
    en: 'He keeps his promise to come back to it — und zu Ihrer Frage, Frau Ilić — and the answer is was schon beantragt ist, bleibt so. Then he hands her the floor: Sie wollten noch etwas sagen?'
    ru: 'Он выполняет обещание вернуться к вопросу — und zu Ihrer Frage, Frau Ilić, — и отвечает: was schon beantragt ist, bleibt so. Потом передаёт ей слово: Sie wollten noch etwas sagen?'
    uk: 'Він виконує обіцянку повернутися до питання — und zu Ihrer Frage, Frau Ilić, — і відповідає: was schon beantragt ist, bleibt so. Потім передає їй слово: Sie wollten noch etwas sagen?'
    de: 'Er kommt wie versprochen auf ihre Frage zurück: „Was schon beantragt ist, bleibt so.“ Danach gibt er ihr das Wort: „Sie wollten noch etwas sagen?“'
