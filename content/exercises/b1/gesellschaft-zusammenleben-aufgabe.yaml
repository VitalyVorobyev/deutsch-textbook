topic: gesellschaft-zusammenleben
role: practice
stage: transfer
activity: application
title:
  en: "Task — what goes into the free corner of the courtyard"
  ru: "Задание — что поставить в свободном углу двора"
  uk: "Завдання — що поставити у вільному куті подвір'я"
  de: "Aufgabe — Was kommt in die freie Ecke im Hof?"
recording: ls-gesellschaft-zusammenleben-aufgabe-01
items:
  - id: aufgabe-worum-geht-es
    rung: gist
    outcomes: [diskussion-folgen]
    type: audio-comprehension
    instruction:
      en: "A meeting in the courtyard behind Lena's house: Lena, her neighbour Frau Kern and a man from the building are talking. Listen and choose the answer."
      ru: "Собрание во дворе за домом Лены: говорят Лена, её соседка фрау Керн и сосед по дому. Прослушайте и выберите ответ."
      uk: "Збори на подвір'ї за будинком Лени: говорять Лена, її сусідка фрау Керн і сусід із будинку. Прослухайте й оберіть відповідь."
      de: "Eine Versammlung im Hof hinter Lenas Haus: Lena, ihre Nachbarin Frau Kern und ein Nachbar aus dem Haus sprechen. Hör zu und wähle die Antwort."
    question: "Worum geht es bei der Versammlung?"
    options:
      - "Die Bewohner beschweren sich über den Lärm im Treppenhaus."
      - "Die Bewohner entscheiden, was in die freie Ecke im Hof kommt."
      - "Die Bewohner planen ein Fest im Sommer mit Tisch und Bänken im Hof."
      - "Die Bewohner sprechen über die Reparatur der alten Bank."
    correct: 1
    translation:
      en: "What is the meeting about?"
      ru: "О чём идёт речь на собрании?"
      uk: "Про що йдеться на зборах?"
    explain:
      en: "Lena's first line frames the whole meeting: „Heute geht es um die freie Ecke im Hof“, followed by three ideas for it. Everything after that weighs those ideas until one decision is reached. The stairwell comes up only as the place where the bikes stand today, the bench only as where the table might go — it was repaired long ago — and nobody plans a party."
      ru: "Первая реплика Лены задаёт рамку всему собранию: „Heute geht es um die freie Ecke im Hof“, а за ней — три идеи для этого угла. Всё дальнейшее — это взвешивание этих идей, пока не принимается одно решение. Лестничная клетка упоминается лишь как место, где сейчас стоят велосипеды, скамейка — как место, куда можно поставить стол (её давно починили), а праздник никто не планирует."
      uk: "Перша репліка Лени задає рамку всім зборам: „Heute geht es um die freie Ecke im Hof“, а за нею — три ідеї для цього кута. Усе подальше — це зважування цих ідей, доки не ухвалюють одне рішення. Сходова клітка згадується лише як місце, де зараз стоять велосипеди, лавка — як місце, куди можна поставити стіл (її давно полагодили), а свята ніхто не планує."
      de: "Lenas erster Satz gibt der ganzen Versammlung den Rahmen: „Heute geht es um die freie Ecke im Hof“, dann folgen drei Ideen dafür. Alles Weitere wägt diese Ideen ab, bis eine Entscheidung steht. Das Treppenhaus kommt nur als der Ort vor, wo die Räder heute stehen, die Bank nur als Platz für den Tisch — repariert ist sie längst —, und ein Fest plant niemand."

  - id: aufgabe-warum-einwand
    rung: detail
    outcomes: [diskussion-folgen]
    type: audio-comprehension
    instruction:
      en: "Listen for the reason behind Frau Kern's objection."
      ru: "Найдите на слух причину возражения фрау Керн."
      uk: "Знайдіть на слух причину заперечення фрау Керн."
      de: "Hör auf den Grund für Frau Kerns Einwand."
    question: "Warum ist Frau Kern gegen den Tisch?"
    options:
      - "Der Tisch kostet Geld, und die Verwaltung bezahlt ihn nicht."
      - "Neben dem Tisch ist kein Platz mehr für die Fahrräder."
      - "Sie möchte lieber Kisten mit Blumen und Gemüse in der Ecke."
      - "Sie steht früh auf, und ein Tisch bringt am Abend Lärm."
    correct: 3
    translation:
      en: "Why is Frau Kern against the table?"
      ru: "Почему фрау Керн против стола?"
      uk: "Чому фрау Керн проти столу?"
    explain:
      en: "She announces the objection and gives its reason in the same breath: „Ein Tisch bedeutet Lärm am Abend, und du weißt ja, ich stehe immer früh auf.“ The neighbour backs her up with the same point — „Abends hört man im Hof jedes Wort.“ Money is not mentioned at all, nobody says the table would take the bikes' space, and the flowers come up only at the end, as a question for the spring."
      ru: "Она объявляет возражение и тут же называет причину: „Ein Tisch bedeutet Lärm am Abend, und du weißt ja, ich stehe immer früh auf.“ Сосед поддерживает её тем же доводом — „Abends hört man im Hof jedes Wort.“ О деньгах речи нет вовсе, о том, что стол отнимет место у велосипедов, никто не говорит, а цветы всплывают только в конце — как вопрос на весну."
      uk: "Вона оголошує заперечення й одразу називає причину: „Ein Tisch bedeutet Lärm am Abend, und du weißt ja, ich stehe immer früh auf.“ Сусід підтримує її тим самим аргументом — „Abends hört man im Hof jedes Wort.“ Про гроші не йдеться взагалі, що стіл забере місце у велосипедів, ніхто не каже, а квіти з'являються лише наприкінці — як питання на весну."
      de: "Sie kündigt den Einwand an und nennt den Grund gleich mit: „Ein Tisch bedeutet Lärm am Abend, und du weißt ja, ich stehe immer früh auf.“ Der Nachbar gibt ihr mit demselben Argument recht: „Abends hört man im Hof jedes Wort.“ Von Geld ist keine Rede, dass der Tisch den Fahrrädern den Platz wegnimmt, sagt niemand, und die Blumen kommen erst am Schluss vor, als Thema für den Frühling."

  - id: aufgabe-was-beschlossen
    rung: detail
    outcomes: [diskussion-folgen]
    type: audio-comprehension
    instruction:
      en: "Listen to what is decided at the end. Every detail of the right answer counts."
      ru: "Послушайте, что решают в конце. В правильном ответе важна каждая деталь."
      uk: "Послухайте, що вирішують наприкінці. У правильній відповіді важить кожна деталь."
      de: "Hör zu, was am Ende beschlossen wird. In der richtigen Antwort zählt jedes Detail."
    question: "Was beschließen die Bewohner am Ende?"
    options:
      - "Der Tisch kommt in die Ecke, und die Fahrräder bleiben im Treppenhaus."
      - "Das Dach kommt in die Ecke und der Tisch neben die Bank; ab zehn Uhr ist dann Ruhe."
      - "Das Dach kommt in die Ecke und der Tisch neben die Bank; ab neun Uhr ist dann Ruhe."
      - "Das Dach kommt in die Ecke, und statt eines Tisches kommen Kisten für Blumen neben die Bank."
    correct: 2
    translation:
      en: "What do the residents decide at the end?"
      ru: "Что жильцы решают в конце?"
      uk: "Що мешканці вирішують наприкінці?"
    explain:
      en: "Lena's compromise does both things at once: „Das Dach kommt in die Ecke, und den Tisch könnten wir neben die Bank stellen … Ab neun Uhr ist dann Ruhe.“ Frau Kern repeats the hour — „Ab neun?“ — before she agrees, nobody objects, and Lena closes with „Dann machen wir es so.“ The flower boxes are not decided at all: they are left for the spring."
      ru: "Компромисс Лены решает обе задачи сразу: „Das Dach kommt in die Ecke, und den Tisch könnten wir neben die Bank stellen … Ab neun Uhr ist dann Ruhe.“ Фрау Керн переспрашивает час — „Ab neun?“ — и только потом соглашается, возражающих нет, и Лена подводит черту: „Dann machen wir es so.“ О ящиках для цветов ничего не решают: их оставляют на весну."
      uk: "Компроміс Лени розв'язує обидва завдання одразу: „Das Dach kommt in die Ecke, und den Tisch könnten wir neben die Bank stellen … Ab neun Uhr ist dann Ruhe.“ Фрау Керн перепитує годину — „Ab neun?“ — і лише тоді погоджується, заперечень немає, і Лена підсумовує: „Dann machen wir es so.“ Про ящики для квітів нічого не вирішують: їх лишають на весну."
      de: "Lenas Kompromiss macht beides auf einmal: „Das Dach kommt in die Ecke, und den Tisch könnten wir neben die Bank stellen … Ab neun Uhr ist dann Ruhe.“ Frau Kern fragt bei der Uhrzeit noch einmal nach — „Ab neun?“ —, bevor sie zustimmt, niemand ist dagegen, und Lena schließt mit „Dann machen wir es so.“ Über die Kisten für Blumen wird gar nichts beschlossen: Sie bleiben für den Frühling."

  - id: aufgabe-wer-sagt-jedes-wort
    rung: who
    outcomes: [diskussion-folgen]
    type: audio-comprehension
    instruction:
      en: "Who says it? Listen for the voice."
      ru: "Кто это говорит? Ориентируйтесь на голос."
      uk: "Хто це каже? Орієнтуйтеся на голос."
      de: "Wer sagt das? Achte auf die Stimme."
    question: "Wer sagt: „Abends hört man im Hof jedes Wort.“?"
    options:
      - "Lena"
      - "Frau Kern"
      - "Nachbar"
    correct: 2
    translation:
      en: "Who says: “In the evening you can hear every word in the courtyard”?"
      ru: "Кто говорит: «По вечерам во дворе слышно каждое слово»?"
      uk: "Хто каже: «Увечері на подвір'ї чути кожне слово»?"
    explain:
      en: "The neighbour says it, straight after Lena has disagreed with Frau Kern. The line sounds like Frau Kern's own complaint, and that is the point: he opens with „Da hat Frau Kern aber recht“ and takes her side with an argument of his own. Frau Kern herself spoke of noise and of getting up early, never of every word."
      ru: "Это говорит сосед — сразу после того, как Лена возразила фрау Керн. Фраза звучит как жалоба самой фрау Керн, и в этом весь смысл: он начинает с „Da hat Frau Kern aber recht“ и встаёт на её сторону со своим собственным доводом. Сама фрау Керн говорила о шуме и о том, что рано встаёт, но не о каждом слове."
      uk: "Це каже сусід — одразу після того, як Лена заперечила фрау Керн. Фраза звучить як скарга самої фрау Керн, і в цьому вся суть: він починає з „Da hat Frau Kern aber recht“ і стає на її бік із власним аргументом. Сама фрау Керн говорила про шум і про те, що рано встає, але не про кожне слово."
      de: "Das sagt der Nachbar, direkt nachdem Lena Frau Kern widersprochen hat. Der Satz klingt wie Frau Kerns eigene Klage, und genau das ist der Punkt: Er beginnt mit „Da hat Frau Kern aber recht“ und stellt sich mit einem eigenen Argument auf ihre Seite. Frau Kern selbst hat von Lärm und vom frühen Aufstehen gesprochen, nie von jedem Wort."

  - id: aufgabe-was-wo
    rung: form
    outcomes: [kompromiss-vorschlagen]
    type: cloze
    focus: relativ-was-wo
    instruction:
      en: "Two lines from the meeting. Fill in the relative word you heard, one word in each gap."
      ru: "Две реплики с собрания. Вставьте относительное слово, которое вы услышали, по одному слову в каждый пропуск."
      uk: "Дві репліки зі зборів. Вставте відносне слово, яке ви почули, по одному слову в кожен пропуск."
      de: "Zwei Sätze aus der Versammlung. Ergänze das Relativwort, das du gehört hast, je ein Wort."
    text: "Der Nachbar sagt: „Wir brauchen einen Platz, {{wo}} sie trocken bleiben.“ Am Ende sagt Frau Kern: „Ruhe am Abend ist alles, {{was}} ich brauche.“"
    translation:
      en: "The neighbour says: “We need a place where they stay dry.” At the end Frau Kern says: “Peace and quiet in the evening is all I need.”"
      ru: "Сосед говорит: «Нам нужно место, где они останутся сухими». В конце фрау Керн говорит: «Тишина по вечерам — это всё, что мне нужно»."
      uk: "Сусід каже: «Нам потрібне місце, де вони лишатимуться сухими». Наприкінці фрау Керн каже: «Тиша ввечері — це все, що мені потрібно»."
    explain:
      en: "Two relative words without gender. After einen Platz, a place, wo stands for the whole an dem — one word instead of a preposition and a pronoun. After alles there is no noun to agree with, so the relative word is was, never das. In both lines the relative clause is a Nebensatz, so bleiben and brauche stand at the end."
      ru: "Два относительных слова без рода. После einen Platz, то есть места, wo заменяет целое an dem — одно слово вместо предлога с местоимением. После alles согласовываться не с чем, поэтому относительное слово — was, а не das. В обеих репликах относительное придаточное — это Nebensatz, поэтому bleiben и brauche стоят в конце."
      uk: "Два відносні слова без роду. Після einen Platz, тобто місця, wo заміняє ціле an dem — одне слово замість прийменника із займенником. Після alles узгоджуватися нема з чим, тому відносне слово — was, а не das. В обох репліках відносне підрядне — це Nebensatz, тому bleiben і brauche стоять у кінці."
      de: "Zwei Relativwörter ohne Genus. Nach einen Platz, also einem Ort, steht wo für das ganze an dem — ein Wort statt Präposition und Pronomen. Nach alles gibt es kein Nomen, nach dem sich ein Pronomen richten könnte, also heißt das Relativwort was, nie das. In beiden Sätzen ist der Relativsatz ein Nebensatz, also stehen bleiben und brauche am Ende."

  - id: aufgabe-einwand-obwohl
    rung: reply
    outcomes: [einwand-ausdruecken]
    type: translate
    focus: obwohl-trotzdem
    instruction:
      en: "You live in the building too, and you have an objection to the bicycle roof. Pack it into one sentence with obwohl. Take die Idee verstehen, die Ecke and ein Dach."
      ru: "Вы тоже живёте в этом доме, и у вас есть возражение против навеса для велосипедов. Уложите его в одно предложение с obwohl. Возьмите die Idee verstehen, die Ecke и ein Dach."
      uk: "Ви теж живете в цьому будинку, і у вас є заперечення проти навісу для велосипедів. Умістіть його в одне речення з obwohl. Візьміть die Idee verstehen, die Ecke та ein Dach."
      de: "Du wohnst auch im Haus und hast einen Einwand gegen das Dach für die Fahrräder. Pack ihn mit obwohl in einen Satz. Nimm die Idee verstehen, die Ecke und ein Dach."
    prompt_en: "Although I understand the idea, the corner is too small for a roof."
    prompt_ru: "Хотя я понимаю идею, угол слишком маленький для навеса."
    prompt_uk: "Хоча я розумію ідею, кут замалий для навісу."
    answer: "Obwohl ich die Idee verstehe, ist die Ecke für ein Dach zu klein."
    # The concession may stand first or second, and für ein Dach may stand before or after
    # zu klein; neither choice is what the tag grades. The main clause's verb-first order
    # after a fronted Nebensatz is not pinned: that is position 1 being filled, the
    # verbzweit rule, and pinning it would charge a verbzweit error to this tag.
    accept:
      - "Obwohl ich die Idee verstehe, ist die Ecke zu klein für ein Dach."
      - "Die Ecke ist für ein Dach zu klein, obwohl ich die Idee verstehe."
      - "Die Ecke ist zu klein für ein Dach, obwohl ich die Idee verstehe."
    key_tokens: ["Obwohl", "obwohl", "verstehe"]
    explain:
      en: "Graded are the two ends of the conjunction's rule: obwohl and verstehe at the end of its clause. English leaves its word order alone after 'although', so the hand writes obwohl ich verstehe die Idee — the collapse this tag exists to catch. Put the concession first and it fills position 1, so the main clause opens with ist; put it second and nothing else moves."
      ru: "Оцениваются два конца правила союза: obwohl и verstehe в конце придаточного. В русском после «хотя» порядок слов не меняется, поэтому рука пишет obwohl ich verstehe die Idee — ровно тот развал, ради которого существует этот тег. Если уступка стоит впереди, она занимает первую позицию, и главное предложение начинается с ist; если сзади — больше ничего не сдвигается."
      uk: "Оцінюються два кінці правила сполучника: obwohl і verstehe в кінці підрядного. В українській після «хоча» порядок слів не змінюється, тому рука пише obwohl ich verstehe die Idee — рівно той розвал, заради якого існує цей тег. Якщо поступка стоїть попереду, вона займає першу позицію, і головне речення починається з ist; якщо позаду — більше нічого не зсувається."
      de: "Geprüft werden die zwei Enden der Regel für die Konjunktion: obwohl und verstehe am Ende des Nebensatzes. Englisch, Russisch und Ukrainisch ändern nach „obwohl“ die Wortstellung nicht, also schreibt die Hand obwohl ich verstehe die Idee — genau der Fehler, für den es diesen Tag gibt. Steht das Zugeständnis vorn, besetzt es Position 1, und der Hauptsatz beginnt mit ist; steht es hinten, bewegt sich sonst nichts."
