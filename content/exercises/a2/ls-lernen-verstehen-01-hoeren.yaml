topic: lernen-verstehen
role: practice
title:
  en: Instructions for a task in class
  ru: Указания к заданию на занятии
  uk: 'Вказівки до завдання на занятті'
items:
- id: q1
  outcomes:
  - kursanweisungen-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Kursleiterin
      text: Öffnen Sie bitte das Kursbuch auf Seite vierunddreißig. Lesen Sie zuerst
        die Aufgabe zwei. Danach hören Sie den Dialog zweimal und markieren die richtigen
        Sätze.
    - speaker: Teilnehmer
      text: Entschuldigung, ich habe den letzten Schritt nicht verstanden. Können
        Sie das bitte noch einmal erklären?
    - speaker: Kursleiterin
      text: Natürlich. Nach dem Hören vergleichen Sie Ihre Antworten mit Ihrer Partnerin.
        Erst danach öffnen Sie die Lösung.
    - speaker: Teilnehmer
      text: Danke, jetzt verstehe ich die Aufgabe.
  recording: ls-lernen-verstehen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Auf welcher Seite steht die Aufgabe?
  options:
  - Auf Seite 34.
  - Auf Seite 24.
  - Auf Seite 43.
  correct: 0
  explain:
    en: 'German says the units before the tens — vierunddreißig is literally ''four-and-thirty''.
      That is why "Auf Seite 43" is the tempting wrong answer: it is what the word sounds like
      read straight through.'
    ru: 'В немецком единицы называются перед десятками: vierunddreißig — буквально
      «четыре и тридцать». Именно поэтому соблазняет «Auf Seite 43»: так это слово звучит, если читать его подряд.'
    uk: 'У німецькій одиниці називають перед десятками: vierunddreißig — буквально «чотири й тридцять». Саме тому вабить «Auf Seite 43»: так це слово звучить, якщо читати його поспіль.'
  max_replays: 3
- id: q2
  outcomes:
  - kursanweisungen-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Kursleiterin
      text: Öffnen Sie bitte das Kursbuch auf Seite vierunddreißig. Lesen Sie zuerst
        die Aufgabe zwei. Danach hören Sie den Dialog zweimal und markieren die richtigen
        Sätze.
    - speaker: Teilnehmer
      text: Entschuldigung, ich habe den letzten Schritt nicht verstanden. Können
        Sie das bitte noch einmal erklären?
    - speaker: Kursleiterin
      text: Natürlich. Nach dem Hören vergleichen Sie Ihre Antworten mit Ihrer Partnerin.
        Erst danach öffnen Sie die Lösung.
    - speaker: Teilnehmer
      text: Danke, jetzt verstehe ich die Aufgabe.
  recording: ls-lernen-verstehen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wann darf man die Lösung öffnen?
  options:
  - Erst nach dem Vergleich mit der Partnerin.
  - Direkt nach dem Hören.
  - Vor dem Hören.
  correct: 0
  explain:
    en: The participant asks precisely because the last step was unclear, and the
      answer inserts one more step before the solution. Erst danach means 'only after
      that' — it postpones, it does not permit.
    ru: Участник переспрашивает именно потому, что последний шаг был неясен, и в ответе
      перед решением появляется ещё один шаг. Erst danach значит «только после этого»
      — это отсрочка, а не разрешение.
    uk: 'Учасник перепитує саме тому, що останній крок був неясний, і у відповіді перед розв''язанням з''являється ще один крок. Erst danach означає «лише після цього» — це відтермінування, а не дозвіл.'
  max_replays: 3
