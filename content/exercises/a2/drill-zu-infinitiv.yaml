topic: infinitiv-mit-zu
role: drill
title:
  en: "Drill — does this infinitive need zu, and where does the zu go?"
  ru: "Тренажёр — нужен ли этому инфинитиву zu и где этот zu стоит?"
  uk: "Тренажер — чи потрібне цьому інфінітиву zu і де це zu стоїть?"
items:
  - id: cloze-frames-mit-und-ohne-zu
    outcomes: [zu-oder-ohne-zu]
    type: cloze
    focus: zu-infinitiv
    instruction:
      en: "Every gap takes the verb in brackets as an infinitive — with zu where the sentence needs it, without zu where it does not. Never leave a gap empty."
      ru: "В каждое поле впишите глагол из скобок в форме инфинитива — с zu там, где предложение его требует, и без zu там, где не требует. Пустых полей быть не должно."
      uk: "У кожне поле впишіть дієслово з дужок у формі інфінітива — із zu там, де речення його вимагає, і без zu там, де не вимагає. Порожніх полів бути не повинно."
    text: "Am Samstag muss ich {{einkaufen}} (einkaufen). Hast du Lust, mit mir {{einzukaufen}} (einkaufen)? Danach gehen wir {{essen}} (essen), und am Abend fange ich an, für die Prüfung {{zu lernen}} (lernen)."
    translation:
      en: "On Saturday I have to do the shopping. Do you feel like doing the shopping with me? Afterwards we'll go and eat, and in the evening I'll start studying for the exam."
      ru: "В субботу мне нужно за покупками. Хочешь сходить за покупками вместе со мной? Потом мы пойдём поедим, а вечером я сяду готовиться к экзамену."
      uk: "У суботу мені треба за покупками. Хочеш сходити за покупками разом зі мною? Потім ми підемо поїмо, а ввечері я візьмуся готуватися до іспиту."
    explain:
      en: "The same verb stands here twice in two different forms, and the only thing that decides which is the word in front of it. muss is a modal, so einkaufen stays bare. Lust haben opens a zu-infinitive, and einkaufen is separable, so the zu goes inside the word: einzukaufen. Then gehen plus an activity takes a bare infinitive again — gehen wir essen — and anfangen opens a zu-infinitive: zu lernen. Before you write an infinitive, look to the left and ask what is governing it."
      ru: "Один и тот же глагол стоит здесь дважды в двух разных формах, и решает это единственно слово перед ним. muss — модальный, поэтому einkaufen остаётся голым. Lust haben открывает инфинитив с zu, а einkaufen отделяемый, поэтому zu уходит внутрь слова: einzukaufen. Дальше gehen плюс занятие снова требует голого инфинитива — gehen wir essen, — а anfangen открывает оборот с zu: zu lernen. В русском перед инфинитивом не ставится ничего, поэтому привычка подсказывает голую форму везде; смотрите влево и спрашивайте, какой глагол управляет."
      uk: "Одне й те саме дієслово стоїть тут двічі у двох різних формах, і вирішує це єдино слово перед ним. muss — модальне, тому einkaufen залишається голим. Lust haben відкриває інфінітив із zu, а einkaufen відокремлюваний, тому zu йде всередину слова: einzukaufen. Далі gehen плюс заняття знову вимагає голого інфінітива — gehen wir essen, — а anfangen відкриває зворот із zu: zu lernen. В українській перед інфінітивом не ставиться нічого, тому звичка підказує голу форму всюди; дивіться ліворуч і питайте, яке дієслово керує."

  - id: cloze-zu-im-trennbaren-verb
    outcomes: [zu-oder-ohne-zu]
    type: cloze
    focus: zu-infinitiv
    instruction:
      en: "Every gap takes the verb in brackets as a zu-infinitive. Three of the four verbs are separable — decide for each one where the zu belongs."
      ru: "В каждое поле впишите глагол из скобок в форме инфинитива с zu. Три глагола из четырёх отделяемые — для каждого решите, где стоит zu."
      uk: "У кожне поле впишіть дієслово з дужок у формі інфінітива із zu. Три дієслова з чотирьох відокремлювані — для кожного вирішіть, де стоїть zu."
    text: "Ich habe beschlossen, mit dem Rauchen {{aufzuhören}} (aufhören). Ich habe auch vor, jeden Morgen früher {{aufzustehen}} (aufstehen), und ich versuche, abends früher {{einzuschlafen}} (einschlafen). Es ist wichtig, das alles nicht wieder {{zu vergessen}} (vergessen)."
    translation:
      en: "I have decided to stop smoking. I am also planning to get up earlier every morning, and I am trying to fall asleep earlier in the evening. It is important not to forget all that again."
      ru: "Я решил бросить курить. Ещё я собираюсь каждое утро вставать пораньше и стараюсь вечером раньше засыпать. Важно всё это снова не забыть."
      uk: "Я вирішив кинути курити. Ще я збираюся щоранку вставати раніше і намагаюся ввечері раніше засинати. Важливо все це знову не забути."
    explain:
      en: "aufhören, aufstehen and einschlafen are separable. In a main clause they come apart — ich höre auf, ich stehe auf, ich schlafe ein — but in a zu-infinitive they never do: the zu slides into the seam and the whole thing is written as one word, aufzuhören, aufzustehen, einzuschlafen. vergessen behaves the other way round, because ver- is an inseparable prefix and nothing ever comes off it, so zu simply stands in front as a separate word: zu vergessen. Stress is a reliable test — ÁUFhören, ÁUFstehen, ÉINschlafen against vergéssen."
      ru: "aufhören, aufstehen и einschlafen — отделяемые. В главном предложении они распадаются: ich höre auf, ich stehe auf, ich schlafe ein, — но в инфинитиве с zu не распадаются никогда: zu встаёт в шов, и всё пишется одним словом — aufzuhören, aufzustehen, einzuschlafen. vergessen ведёт себя наоборот: ver- — приставка неотделяемая, от неё ничего не отрывается, поэтому zu просто стоит перед глаголом отдельным словом: zu vergessen. Надёжная проверка — ударение: ÁUFhören, ÁUFstehen, ÉINschlafen против vergéssen. Это ровно то же различие, по которому в Partizip II появляется или не появляется ge-."
      uk: "aufhören, aufstehen та einschlafen — відокремлювані. У головному реченні вони розпадаються: ich höre auf, ich stehe auf, ich schlafe ein, — але в інфінітиві із zu не розпадаються ніколи: zu стає у шов, і все пишеться одним словом — aufzuhören, aufzustehen, einzuschlafen. vergessen поводиться навпаки: ver- — префікс невідокремлюваний, від нього нічого не відривається, тому zu просто стоїть перед дієсловом окремим словом: zu vergessen. Надійна перевірка — наголос: ÁUFhören, ÁUFstehen, ÉINschlafen проти vergéssen. Це та сама відмінність, за якою в Partizip II з'являється або не з'являється ge-."

  - id: cloze-bleiben-lassen-ohne-zu
    outcomes: [zu-oder-ohne-zu]
    type: cloze
    focus: zu-infinitiv
    instruction:
      en: "Every gap takes the verb in brackets as an infinitive. Two of the four need zu and two do not — the verb in front decides."
      ru: "В каждое поле впишите глагол из скобок в форме инфинитива. Двум из четырёх нужен zu, двум — нет; решает глагол, стоящий перед ним."
      uk: "У кожне поле впишіть дієслово з дужок у формі інфінітива. Двом із чотирьох потрібне zu, двом — ні; вирішує дієслово, що стоїть перед ним."
    text: "Es ist so schön hier. Bleib doch noch ein bisschen {{sitzen}} (sitzen)! — Gern, aber ich habe versprochen, um acht zu Hause {{zu sein}} (sein). Lass mich morgen noch einmal {{kommen}} (kommen)! Dann hoffe ich, mehr Zeit {{zu haben}} (haben)."
    translation:
      en: "It is so nice here. Do stay a little longer! — I'd like to, but I promised to be home at eight. Let me come again tomorrow! Then I hope to have more time."
      ru: "Здесь так хорошо. Посиди ещё немножко! — С удовольствием, но я обещал быть дома в восемь. Давай я приду ещё раз завтра! Тогда, надеюсь, времени будет больше."
      uk: "Тут так гарно. Посидь ще трошки! — Залюбки, але я обіцяв бути вдома о восьмій. Дозволь мені прийти ще раз завтра! Тоді, сподіваюся, часу буде більше."
    explain:
      en: "Two of these four infinitives take no zu at all, and again it is the verb in front that decides. bleiben and lassen belong to the small group that governs a bare infinitive — bleib sitzen, lass mich kommen — and English does the same (stay seated, let me come). versprechen and hoffen are ordinary verbs, so they open an infinitive group with zu: zu sein, zu haben. Nothing about the second verb changes; only its licenser does. The rest of the bare-infinitive group: the modals, gehen/fahren plus an activity, and sehen/hören (Ich sehe sie kommen)."
      ru: "Двум из этих четырёх инфинитивов zu не нужен вовсе, и снова решает глагол впереди. bleiben и lassen входят в небольшую группу, которая управляет голым инфинитивом: bleib sitzen, lass mich kommen. Здесь русский совпадает с немецким — «посиди», «дай мне прийти», — так что запоминать нечего. versprechen и hoffen — обычные глаголы, поэтому они открывают оборот с zu: zu sein, zu haben. Сам второй глагол при этом не меняется, меняется только то, что стоит перед ним. Остальная часть группы без zu: модальные глаголы, gehen/fahren плюс занятие и sehen/hören (Ich sehe sie kommen)."
      uk: "Двом із цих чотирьох інфінітивів zu не потрібне зовсім, і знову вирішує дієслово попереду. bleiben і lassen входять до невеликої групи, яка керує голим інфінітивом: bleib sitzen, lass mich kommen. Тут українська збігається з німецькою — «посидь», «дозволь мені прийти», — тож запам'ятовувати нема чого. versprechen і hoffen — звичайні дієслова, тому вони відкривають зворот із zu: zu sein, zu haben. Саме друге дієслово при цьому не змінюється, змінюється лише те, що стоїть перед ним. Решта групи без zu: модальні дієслова, gehen/fahren плюс заняття та sehen/hören (Ich sehe sie kommen)."

  - id: mc-vergessen-aufzuraeumen
    outcomes: [zu-oder-ohne-zu]
    type: mc
    focus: zu-infinitiv
    prompt: "Welcher Satz ist richtig?"
    options:
      - "Ich habe vergessen, mein Zimmer aufzuräumen."
      - "Ich habe vergessen, mein Zimmer zu aufräumen."
      - "Ich habe vergessen, mein Zimmer aufräumen."
      - "Ich habe vergessen, um mein Zimmer aufzuräumen."
    correct: 0
    translation:
      en: "I forgot to tidy up my room."
      ru: "Я забыл убрать свою комнату."
      uk: "Я забув прибрати свою кімнату."
    explain:
      en: "vergessen opens a zu-infinitive, and aufräumen is separable, so the one correct form is a single written word with the zu in the middle: aufzuräumen. The three wrong options are the three standard ways of missing it — zu in front of the whole verb, no zu at all, and an um that does not belong. um … zu answers Wozu?, and forgetting something is not a purpose."
      ru: "vergessen открывает инфинитив с zu, а aufräumen отделяемый, поэтому единственная верная форма — одно слово с zu в середине: aufzuräumen. Три неверных варианта — это три обычных способа промахнуться: zu перед всем глаголом, zu вообще нет и um, которому здесь не место. um … zu отвечает на вопрос Wozu?, а забывчивость — не цель."
      uk: "vergessen відкриває інфінітив із zu, а aufräumen відокремлюваний, тому єдина правильна форма — одне слово із zu посередині: aufzuräumen. Три невірні варіанти — це три звичні способи схибити: zu перед усім дієсловом, zu немає взагалі та um, якому тут не місце. um … zu відповідає на питання Wozu?, а забудькуватість — не мета."

  - id: mc-komma-und-zu-vor-mitnehmen
    outcomes: [zweck-um-zu]
    type: mc
    focus: zu-infinitiv
    prompt: "Welcher Satz ist richtig?"
    options:
      - "Ich fahre früher los, um meine Schwester mitzunehmen."
      - "Ich fahre früher los um meine Schwester mitzunehmen."
      - "Ich fahre früher los, um meine Schwester zu mitnehmen."
      - "Ich fahre früher los, um meine Schwester mitnehmen."
    correct: 0
    translation:
      en: "I am setting off earlier in order to take my sister along."
      ru: "Я выезжаю пораньше, чтобы взять с собой сестру."
      uk: "Я виїжджаю раніше, щоб узяти з собою сестру."
    explain:
      en: "Three things have to be right at once, and each wrong option drops one. The comma is obligatory: an infinitive group introduced by um — or by ohne, statt, anstatt — is always set off from the main clause. The frame then needs both of its ends, um at the front and the zu-infinitive at the very end. And because mitnehmen is separable, that zu goes inside the word: mitzunehmen, never zu mitnehmen and never a bare mitnehmen."
      ru: "Верными должны быть сразу три вещи, и каждый неверный вариант теряет одну из них. Запятая обязательна: инфинитивный оборот, который вводится словом um — а также ohne, statt, anstatt, — всегда отделяется от главного предложения. Дальше рамке нужны оба конца: um в начале и инфинитив с zu в самом конце. А поскольку mitnehmen отделяемый, этот zu уходит внутрь слова: mitzunehmen, и никогда zu mitnehmen или голое mitnehmen."
      uk: "Правильними мають бути одразу три речі, і кожен невірний варіант губить одну з них. Кома обов'язкова: інфінітивний зворот, який вводиться словом um — а також ohne, statt, anstatt, — завжди відокремлюється від головного речення. Далі рамці потрібні обидва кінці: um на початку та інфінітив із zu в самому кінці. А оскільки mitnehmen відокремлюваний, це zu йде всередину слова: mitzunehmen, і ніколи zu mitnehmen чи голе mitnehmen."

  - id: uebersetzen-formular-auszufuellen
    outcomes: [plan-zu-infinitiv]
    type: translate
    focus: zu-infinitiv
    prompt_en: "Yesterday I forgot to fill in the form."
    prompt_ru: "Вчера я забыл заполнить формуляр."
    prompt_uk: "Учора я забув заповнити формуляр."
    answer: "Gestern habe ich vergessen, das Formular auszufüllen."
    accept:
      - "Ich habe gestern vergessen, das Formular auszufüllen."
    key_tokens: ["auszufüllen"]
    explain:
      en: "One word is graded here and it carries the whole rule: ausfüllen is separable, so its zu-infinitive is a single written word with the zu in the seam — auszufüllen. Neither zu ausfüllen nor aus zu füllen is German. Where you put gestern is free: Gestern habe ich vergessen … and Ich habe gestern vergessen … are both correct, and both are accepted."
      ru: "Проверяется здесь одно слово, и на нём держится всё правило: ausfüllen отделяемый, поэтому его инфинитив с zu — это одно слово, и zu стоит в шве: auszufüllen. Ни zu ausfüllen, ни aus zu füllen по-немецки не бывает. Место слова gestern свободно: Gestern habe ich vergessen … и Ich habe gestern vergessen … одинаково правильны, и оба варианта принимаются."
      uk: "Перевіряється тут одне слово, і на ньому тримається все правило: ausfüllen відокремлюваний, тому його інфінітив із zu — це одне слово, і zu стоїть у шві: auszufüllen. Ні zu ausfüllen, ні aus zu füllen німецькою не буває. Місце слова gestern вільне: Gestern habe ich vergessen … та Ich habe gestern vergessen … однаково правильні, і обидва варіанти приймаються."

  - id: uebersetzen-um-zu-erklaeren
    outcomes: [zweck-um-zu]
    type: translate
    focus: zu-infinitiv
    instruction:
      en: "Say what for — use um … zu."
      ru: "Скажите, зачем, — используйте um … zu."
      uk: "Скажіть, навіщо, — використайте um … zu."
    prompt_en: "I am calling my mother in order to explain everything to her."
    prompt_ru: "Я звоню маме, чтобы всё ей объяснить."
    prompt_uk: "Я телефоную мамі, щоб усе їй пояснити."
    answer: "Ich rufe meine Mutter an, um ihr alles zu erklären."
    key_tokens: ["zu", "erklären"]
    explain:
      en: "One sentence, both halves of the lesson. anrufen is the conjugated verb of the main clause, so it splits: rufe … an. erklären sits inside the purpose frame, so zu stands immediately in front of it and the infinitive is the last word, with nothing after it: um ihr alles zu erklären. The comma before um is obligatory. What is graded here is the zu-infinitive itself; the um is what turns the sentence from what into what for."
      ru: "Одно предложение — обе половины темы. anrufen здесь спрягаемый глагол главного предложения, поэтому он распадается: rufe … an. erklären стоит внутри оборота цели, поэтому zu стоит вплотную перед ним, а сам инфинитив — последнее слово, после него ничего: um ihr alles zu erklären. Запятая перед um обязательна. Проверяется здесь сам инфинитив с zu; а um — это то, что превращает предложение из «что делаю» в «зачем делаю»: русское «чтобы» — одно слово, и отдельного соответствия для um в нём нет."
      uk: "Одне речення — обидві половини теми. anrufen тут відмінюване дієслово головного речення, тому воно розпадається: rufe … an. erklären стоїть усередині звороту мети, тому zu стоїть впритул перед ним, а сам інфінітив — останнє слово, після нього нічого: um ihr alles zu erklären. Кома перед um обов'язкова. Перевіряється тут сам інфінітив із zu; а um — це те, що перетворює речення з «що роблю» на «навіщо роблю»: українське «щоб» — одне слово, і окремої відповідності для um в ньому немає."

  - id: uebersetzen-zeit-abzuholen
    outcomes: [plan-zu-infinitiv]
    type: translate
    focus: zu-infinitiv
    prompt_en: "Do you have time to pick me up at eight?"
    prompt_ru: "У тебя есть время заехать за мной в восемь?"
    prompt_uk: "Ти маєш час заїхати за мною о восьмій?"
    answer: "Hast du Zeit, mich um acht abzuholen?"
    accept:
      - "Hast du Zeit, mich um acht Uhr abzuholen?"
    key_tokens: ["abzuholen"]
    explain:
      en: "There is an um in this sentence and it is not the um of purpose: um acht is the preposition for a clock time. The infinitive group hangs on the noun Zeit, so it takes a plain zu — and abholen is separable, so that zu goes inside the word: abzuholen. An infinitive group depending on a noun like Zeit, Lust or die Möglichkeit is set off with a comma."
      ru: "В этом предложении есть um, и это не um цели: um acht — предлог для указания часа. Инфинитивный оборот здесь держится на существительном Zeit, поэтому ему нужен обычный zu, а abholen отделяемый, поэтому этот zu уходит внутрь слова: abzuholen. Инфинитивный оборот, который зависит от существительного вроде Zeit, Lust или die Möglichkeit, отделяется запятой."
      uk: "У цьому реченні є um, і це не um мети: um acht — прийменник для позначення години. Інфінітивний зворот тут тримається на іменнику Zeit, тому йому потрібне звичайне zu, а abholen відокремлюваний, тому це zu йде всередину слова: abzuholen. Інфінітивний зворот, який залежить від іменника на кшталт Zeit, Lust або die Möglichkeit, відокремлюється комою."

  - id: uebersetzen-modal-ohne-zu
    outcomes: [zu-oder-ohne-zu]
    type: translate
    focus: zu-infinitiv
    prompt_en: "Do you want to come along, or do you have to work?"
    prompt_ru: "Ты хочешь пойти с нами или тебе нужно работать?"
    prompt_uk: "Ти хочеш піти з нами чи тобі треба працювати?"
    answer: "Willst du mitkommen, oder musst du arbeiten?"
    accept:
      - "Möchtest du mitkommen, oder musst du arbeiten?"
    key_tokens: ["mitkommen", "arbeiten"]
    explain:
      en: "Two modals, two bare infinitives: after wollen and müssen no zu ever appears. And mitkommen stays in one piece, because a separable verb only comes apart when it is the conjugated verb of its clause (du kommst mit) — here it is an infinitive. So neither mitzukommen nor zu arbeiten belongs anywhere in this sentence. Both infinitives are graded; möchtest is accepted beside willst."
      ru: "Два модальных глагола — два голых инфинитива: после wollen и müssen zu не появляется никогда. И mitkommen остаётся целым, потому что отделяемый глагол распадается только тогда, когда он сам спрягается (du kommst mit), — а здесь это инфинитив. Так что ни mitzukommen, ни zu arbeiten в этом предложении места не имеют. Проверяются оба инфинитива; möchtest принимается наравне с willst."
      uk: "Два модальні дієслова — два голі інфінітиви: після wollen і müssen zu не з'являється ніколи. І mitkommen залишається цілим, бо відокремлюване дієслово розпадається лише тоді, коли воно саме відмінюється (du kommst mit), — а тут це інфінітив. Тож ні mitzukommen, ні zu arbeiten у цьому реченні місця не мають. Перевіряються обидва інфінітиви; möchtest приймається нарівні з willst."

  - id: uebersetzen-hoffen-ohne-um
    outcomes: [plan-zu-infinitiv]
    type: translate
    focus: zu-infinitiv
    instruction:
      en: "Use a zu-infinitive, not a dass-clause."
      ru: "Используйте инфинитивный оборот с zu, а не придаточное с dass."
      uk: "Використайте інфінітивний зворот із zu, а не підрядне з dass."
    prompt_en: "We hope to find a bigger flat soon."
    prompt_ru: "Мы надеемся скоро найти квартиру побольше."
    prompt_uk: "Ми сподіваємося скоро знайти більшу квартиру."
    answer: "Wir hoffen, bald eine größere Wohnung zu finden."
    key_tokens: ["zu", "finden"]
    explain:
      en: "hoffen is an ordinary verb, so the infinitive it governs needs a plain zu: zu finden, the last word of the group. No um belongs here — um … zu answers Wozu?, and a flat is what we hope for, not what we are doing something for. The short infinitive group is available at all because we hope and we find: one and the same subject. Give the second half a subject of its own and you would have to switch to dass."
      ru: "hoffen — обычный глагол, поэтому подчинённому инфинитиву нужен простой zu: zu finden, последнее слово оборота. Никакого um здесь нет — um … zu отвечает на вопрос Wozu?, а квартира — это то, на что мы надеемся, а не то, ради чего мы что-то делаем. Короткий оборот вообще возможен потому, что надеемся мы и находим тоже мы: подлежащее одно. Появись у второй половины своё подлежащее — пришлось бы переходить на dass."
      uk: "hoffen — звичайне дієслово, тому підпорядкованому інфінітиву потрібне просте zu: zu finden, останнє слово звороту. Жодного um тут немає — um … zu відповідає на питання Wozu?, а квартира — це те, на що ми сподіваємося, а не те, заради чого ми щось робимо. Короткий зворот узагалі можливий тому, що сподіваємося ми і знаходимо теж ми: підмет один. З'явися у другої половини свій підмет — довелося б переходити на dass."
