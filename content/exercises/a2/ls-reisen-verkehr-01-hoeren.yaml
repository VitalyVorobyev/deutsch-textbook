  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wann fährt der Zug ab?
  options:
  - Um 16.25 Uhr.
  - Um 16.10 Uhr.
  - Um 16.15 Uhr.
  correct: 0
  explain:
    en: nicht … sondern cancels the first time and gives the new one. Whichever half
      of that construction you miss, you take the wrong train.
    ru: nicht … sondern отменяет первое время и называет новое. Пропустив любую половину
      этой конструкции, сядешь не на тот поезд.
    uk: 'nicht … sondern скасовує перший час і називає новий. Пропустивши будь-яку половину цієї конструкції, сядеш не на той потяг.'
  max_replays: 3
