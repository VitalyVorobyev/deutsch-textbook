topic: alltag-tagesablauf
role: practice
title:
  en: Rearranging the day
  ru: Перекраивают день
  uk: 'Перекроюють день'
items:
- id: q1
  outcomes:
  - alltag-beschreiben
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Mira
      text: Ben, mein Termin am Nachmittag ist jetzt später.
    - speaker: Ben
      text: Wie spät denn?
    - speaker: Mira
      text: Erst um halb fünf. Deshalb kann ich Lina nicht abholen.
    - speaker: Ben
      text: Kein Problem, ich hole sie ab. Ich bin um drei fertig.
    - speaker: Mira
      text: Super. Kannst du dann auch schnell einkaufen?
    - speaker: Ben
      text: Ja. Was brauchen wir?
    - speaker: Mira
      text: Milch, Brot und Obst. Das Gemüse habe ich schon.
    - speaker: Ben
      text: Gut. Und wer kocht heute?
    - speaker: Mira
      text: Ich koche, wenn ich zu Hause bin. So gegen sechs.
    - speaker: Ben
      text: Dann decke ich mit Lina den Tisch.
    - speaker: Mira
      text: Denk bitte daran, dass Lina heute ihre Sportsachen braucht.
    - speaker: Ben
      text: Die liegen schon im Auto. Ich habe sie gestern eingepackt.
  recording: ls-alltag-tagesablauf-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wer holt Lina heute ab?
  options:
  - Ben.
  - Mira.
  - Niemand.
  correct: 0
  explain:
    en: Mira names the task only to say she cannot do it, and Ben takes it over in
      the next line. The handover happens across two speakers, not inside one sentence.
    ru: Мира называет задачу лишь затем, чтобы сказать, что не сможет, и в следующей
      реплике Бен берёт её на себя. Передача происходит между двумя говорящими, а
      не внутри одного предложения.
    uk: 'Міра називає справу лише для того, щоб сказати, що не встигне, і наступною реплікою Бен бере її на себе. Передавання відбувається між двома мовцями, а не всередині одного речення.'
  max_replays: 3
