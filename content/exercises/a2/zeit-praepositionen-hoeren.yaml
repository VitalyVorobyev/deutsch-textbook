topic: zeit-praepositionen
role: practice
stage: transfer
activity: task
skill: hoeren
title_de: "Hören im Kontext — Zeit: um, am, im, seit, ab, bis"
title:
  en: 'Finding a day to study together'
  ru: 'Когда позаниматься вместе'
  uk: 'Коли позайматися разом'
items:
- id: q1
  outcomes:
  - zeitangabe-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Ali
      text: 'Nora, hast du nächste Woche Zeit? Wir können zusammen lernen.'
    - speaker: Nora
      text: 'Bis Mittwoch leider nicht. Ich arbeite von Montag bis Mittwoch, immer bis sechs Uhr.'
    - speaker: Ali
      text: 'Und ab Donnerstag?'
    - speaker: Nora
      text: 'Ab Donnerstag habe ich frei. Wann beginnt denn der Kurs genau?'
    - speaker: Ali
      text: 'Am ersten März, um halb sieben am Abend.'
    - speaker: Nora
      text: 'Schon im März? Ich dachte, im April.'
    - speaker: Ali
      text: 'Nein, im März. Ich lerne schon seit zwei Monaten jeden Tag.'
    - speaker: Nora
      text: 'Seit zwei Monaten? Toll! Dann treffen wir uns am Donnerstag um vier hier im Café.'
    - speaker: Ali
      text: 'Gut, bis Donnerstag!'
  recording: ls-zeit-praepositionen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: 'Ab wann hat Nora Zeit?'
  options:
  - 'Ab Donnerstag.'
  - 'Ab Montag.'
  - 'Erst im April.'
  correct: 0
  explain:
    en: 'Von Montag bis Mittwoch is the span she works; ab Donnerstag is where her free time starts. April is only what she had wrongly thought about the course.'
    ru: 'Von Montag bis Mittwoch — это время, когда она работает, а ab Donnerstag — момент, с которого она свободна. Апрель — лишь её ошибочное представление о начале курса.'
    uk: 'Von Montag bis Mittwoch — це час, коли вона працює, а ab Donnerstag — момент, з якого вона вільна. Квітень — лише її хибне уявлення про початок курсу.'
  max_replays: 3
