  question: 'Wie lange lernt Ali schon jeden Tag?'
  options:
  - 'Seit zwei Monaten.'
  - 'Seit dem ersten März.'
  - 'Seit Donnerstag.'
  correct: 0
  explain:
    en: 'Seit with a length of time — seit zwei Monaten — says how long something has been going on, and the present tense lernt carries it to now. The first of March is still to come.'
    ru: 'Seit с отрезком времени — seit zwei Monaten — говорит, как долго что-то уже длится, а настоящее время lernt доводит это до сегодняшнего дня. Первое марта ещё впереди.'
    uk: 'Seit з відрізком часу — seit zwei Monaten — каже, як довго щось уже триває, а теперішній час lernt доводить це до сьогодні. Перше березня ще попереду.'
