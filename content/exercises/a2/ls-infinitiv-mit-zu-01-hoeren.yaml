topic: infinitiv-mit-zu
role: practice
title:
  en: Getting the summer party ready
  ru: Подготовка к летнему празднику
  uk: 'Готуємося до літнього свята'
items:
- id: q1
  outcomes:
  - zweck-um-zu
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Pia
      text: Wir haben noch drei Tage, um alles für das Sommerfest vorzubereiten.
    - speaker: Marek
      text: Ich habe vor, morgen die Getränke zu bestellen.
    - speaker: Pia
      text: Gut. Vergiss nicht, auch Wasser zu kaufen, um genug für alle zu haben.
    - speaker: Marek
      text: Und wer kümmert sich um die Musik?
    - speaker: Pia
      text: Nadja hat versprochen, ihre Anlage mitzubringen.
    - speaker: Marek
      text: Dann brauchen wir nur noch jemanden, um die Tische aufzustellen.
    - speaker: Pia
      text: Ich frage den Hausmeister. Er hat angeboten, früher zu kommen.
    - speaker: Marek
      text: Perfekt. Ich versuche, bis Freitag alles fertig zu haben.
    - speaker: Pia
      text: Und denk daran, die Nachbarn einzuladen, um Ärger zu vermeiden.
    - speaker: Marek
      text: Daran habe ich schon gedacht. Die Zettel liegen im Flur.
  recording: ls-infinitiv-mit-zu-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wozu soll Marek Wasser kaufen?
  options:
  - Damit es für alle reicht.
  - Weil die Getränke zu teuer sind.
  - Damit die Nachbarn kommen.
  correct: 0
  explain:
    en: The purpose is attached with um … zu directly after the task. "Damit die Nachbarn kommen" borrows a purpose from the last line, where inviting the neighbours has a different
      one entirely.
    ru: Цель присоединяется через um … zu сразу после задачи. «Damit die Nachbarn kommen» заимствует цель из последней реплики, где у приглашения соседей цель совсем другая.
    uk: 'Мету приєднано через um … zu одразу після завдання. «Damit die Nachbarn kommen» запозичує мету з останньої репліки, де в запрошення сусідів мета зовсім інша.'
  max_replays: 3
