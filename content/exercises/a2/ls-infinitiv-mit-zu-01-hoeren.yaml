  question: Wer bringt die Musikanlage mit?
  options:
  - Nadja.
  - Der Hausmeister.
  - Marek.
  correct: 0
  explain:
    en: Three people take on three jobs. The caretaker offered to come early and Marek
      is handling the drinks — the names and the tasks arrive in different lines.
    ru: 'Трое берут на себя три дела. Комендант предложил прийти раньше, а Марек занимается
      напитками: имена и задачи звучат в разных репликах.'
    uk: 'Троє беруть на себе три справи. Комендант запропонував прийти раніше, а Марек займається напоями: імена і доручення звучать у різних репліках.'
