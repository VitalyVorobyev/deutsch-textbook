  question: 'Was passiert morgen am Nachmittag?'
  options:
  - 'Es kommt ein Gewitter.'
  - 'Die Sonne scheint.'
  - 'Es wird kühl.'
  correct: 0
  explain:
    en: 'Morgen splits in two: sun am Vormittag, then aber am Nachmittag kommt ein Gewitter — with the advice to stay indoors. Kühl belongs to this evening.'
    ru: 'Завтрашний день делится надвое: солнце am Vormittag, а потом aber am Nachmittag kommt ein Gewitter — с советом остаться дома. Kühl относится к сегодняшнему вечеру.'
    uk: 'Завтрашній день ділиться навпіл: сонце am Vormittag, а потім aber am Nachmittag kommt ein Gewitter — з порадою залишитися вдома. Kühl стосується сьогоднішнього вечора.'
  max_replays: 3
