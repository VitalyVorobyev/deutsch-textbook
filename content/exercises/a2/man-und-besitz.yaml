topic: man-und-besitz
role: practice
stage: geruest
activity: core
title_de: "Grundübung — man, jemand & wem etwas gehört"
title:
  en: "Practice — man, jemand, niemand, and whose it is"
  ru: "Практика — man, jemand, niemand и чьё это"
  uk: "Практика — man, jemand, niemand і чиє це"
items:
  - id: table-man-konjugation
    outcomes: [regeln-mit-man]
    type: table
    focus: indefinitpronomen
    title: "man nimmt die er-Form"
    instruction:
      en: "Rewrite each sentence with man. Write the whole sentence."
      ru: "Перепишите каждое предложение с man. Пишите предложение целиком."
      uk: "Перепишіть кожне речення з man. Пишіть речення повністю."
    columns: ["mit ich / du", "mit man"]
    rows:
      - label: "Präsens"
        cells:
          - { answer: "Ich arbeite hier viel.", given: true }
          - { answer: "Man arbeitet hier viel." }
      - label: "Modalverb"
        cells:
          - { answer: "Du kannst hier gut essen.", given: true }
          - { answer: "Man kann hier gut essen." }
      - label: "Vokalwechsel"
        cells:
          - { answer: "Du sprichst hier Deutsch.", given: true }
          - { answer: "Man spricht hier Deutsch." }
      - label: "haben"
        cells:
          - { answer: "Ich habe wenig Zeit.", given: true }
          - { answer: "Man hat wenig Zeit." }
    explain:
      en: "man is a third-person singular subject, so it takes exactly the er/sie/es form — arbeitet, kann, spricht, hat — including the vowel change in sprechen. The English translation is usually you, and that is the trap: you would give kannst and sprichst, which are the du forms and wrong here."
      ru: "man — подлежащее третьего лица единственного числа, поэтому глагол при нём стоит ровно в форме er/sie/es: arbeitet, kann, spricht, hat, включая чередование гласной у sprechen. Английский переводит man словом you, и это ловушка: you тянет за собой kannst и sprichst, а это формы du и здесь они неверны."
      uk: "man — підмет третьої особи однини, тому дієслово при ньому стоїть рівно у формі er/sie/es: arbeitet, kann, spricht, hat, включно з чергуванням голосної у sprechen. Англійська перекладає man словом you, і це пастка: you тягне за собою kannst і sprichst, а це форми du і тут вони хибні."

  - id: cloze-man-wortstellung
    revision: 2
    outcomes: [regeln-mit-man]
    type: cloze
    focus: indefinitpronomen
    instruction:
      en: "Each sentence is missing its verb and its subject. Nobody in particular is meant."
      ru: "В каждом предложении не хватает глагола и подлежащего. Речь не о ком-то конкретном."
      uk: "У кожному реченні бракує дієслова і підмета. Ідеться не про когось конкретного."
    text: "In Deutschland {{arbeitet man}} am Sonntag nicht. Im Museum {{darf man}} nicht fotografieren. Wie {{schreibt man}} das?"
    translation:
      en: "In Germany people do not work on Sunday. Taking photos is not allowed in the museum. How do you write that?"
      ru: "В Германии в воскресенье не работают. В музее нельзя фотографировать. Как это пишется?"
      uk: "У Німеччині в неділю не працюють. У музеї не можна фотографувати. Як це пишеться?"
    explain:
      en: "Each sentence opens with something that is not the subject — In Deutschland, Im Museum, Wie — so the finite verb takes position 2 and man follows it: arbeitet man, darf man, schreibt man. Writing In Deutschland man arbeitet puts the verb third and is the commonest way to get this wrong. The verb stays in the er-form throughout, so darf and not darfst. And notice what none of the three English sentences hands you: no word in them names a subject, but the German slot cannot stay empty, and man is what fills it."
      ru: "Каждое предложение начинается не с подлежащего — In Deutschland, Im Museum, Wie, — поэтому спрягаемый глагол занимает второе место, а man идёт за ним: arbeitet man, darf man, schreibt man. Вариант In Deutschland man arbeitet отправляет глагол на третье место и портит порядок слов чаще всего. Глагол при этом стоит в форме er: darf, а не darfst. И главное: по-русски все три фразы обходятся без подлежащего — «не работают», «нельзя фотографировать», «как это пишется». Немецкому оно нужно всегда, и это место занимает man."
      uk: "Кожне речення починається не з підмета — In Deutschland, Im Museum, Wie, — тому відмінюване дієслово займає друге місце, а man іде за ним: arbeitet man, darf man, schreibt man. Варіант In Deutschland man arbeitet відправляє дієслово на третє місце і псує порядок слів найчастіше. Дієслово при цьому стоїть у формі er: darf, а не darfst. І головне: українською всі три фрази обходяться без підмета — «не працюють», «не можна фотографувати», «як це пишеться». Німецькій він потрібен завжди, і це місце займає man."

  - id: mc-man-oder-jemand
    outcomes: [regeln-mit-man]
    type: mc
    focus: indefinitpronomen
    prompt: "Das Telefon hat geklingelt. Welcher Satz passt?"
    options:
      - "Jemand hat angerufen, aber ich weiß nicht, wer."
      - "Man hat angerufen, aber ich weiß nicht, wer."
      - "Niemand hat angerufen, aber ich weiß nicht, wer."
      - "Etwas hat angerufen, aber ich weiß nicht, wer."
    correct: 0
    translation:
      en: "Somebody called, but I do not know who."
      ru: "Кто-то звонил, но я не знаю кто."
      uk: "Хтось телефонував, але я не знаю хто."
    explain:
      en: "One specific person made that call and you simply do not know which — that is jemand. man would say something different and false: that calling is what people in general do here. niemand contradicts the phone having rung at all, and etwas is for things, not callers. The distinction is worth holding: man is people in general, jemand is one person unidentified."
      ru: "Звонил один конкретный человек, просто неизвестно какой, — это jemand. man сказал бы другое и неверное: что здесь принято звонить. niemand противоречит тому, что телефон вообще звонил, а etwas относится к вещам, а не к звонящим. Различие стоит удержать: man — люди вообще, jemand — один неизвестный человек."
      uk: "Телефонувала одна конкретна людина, просто невідомо яка, — це jemand. man сказав би інше й хибне: що тут заведено телефонувати. niemand суперечить тому, що телефон узагалі дзвонив, а etwas стосується речей, а не тих, хто телефонує. Різницю варто втримати: man — люди загалом, jemand — одна невідома людина."

  - id: cloze-jemand-niemand-etwas
    outcomes: [unbestimmt-sprechen]
    type: cloze
    focus: indefinitpronomen
    instruction:
      en: "jemand, niemand, etwas or nichts?"
      ru: "jemand, niemand, etwas или nichts?"
      uk: "jemand, niemand, etwas чи nichts?"
    text: "Am Sonntag war {{niemand}} im Büro. Ich habe {{etwas}} vergessen, aber ich weiß nicht mehr, was. Und im Kühlschrank war {{nichts}} mehr."
    translation:
      en: "On Sunday nobody was in the office. I have forgotten something, but I no longer know what. And there was nothing left in the fridge."
      ru: "В воскресенье в офисе никого не было. Я что-то забыл, но уже не помню что. А в холодильнике ничего не осталось."
      uk: "У неділю в офісі нікого не було. Я щось забув, але вже не пам'ятаю що. А в холодильнику нічого не залишилося."
    explain:
      en: "Two pairs, split the same way: jemand/niemand are people, etwas/nichts are things, and the second of each pair is negative. For the neutral standard meaning tested here, the negative word carries the negation on its own. A second nicht is nonstandard negative concord or can create a marked contrastive reading, so it is not a safe way to express the target."
      ru: "Две пары, устроенные одинаково: jemand/niemand — о людях, etwas/nichts — о вещах, и вторые в каждой паре отрицательные. В проверяемом здесь нейтральном стандартном варианте отрицательное слово уже несёт отрицание. Второе nicht бывает нестандартным согласованием или создаёт особое контрастное чтение, поэтому для этой мысли оно не подходит."
      uk: "Дві пари, влаштовані однаково: jemand/niemand — про людей, etwas/nichts — про речі, і другі в кожній парі заперечні. У перевірюваному тут нейтральному стандартному варіанті заперечне слово вже несе заперечення. Друге nicht буває нестандартним узгодженням або створює особливе контрастне читання, тому для цієї думки воно не підходить."

  - id: table-wem-gehoert
    outcomes: [besitz-ausdruecken]
    type: table
    focus: genitiv-eigenname
    title: "Name oder von + Dativ?"
    instruction:
      en: "Say whose it is. Write the whole phrase."
      ru: "Скажите, чьё это. Напишите всю группу целиком."
      uk: "Скажіть, чиє це. Напишіть усю групу повністю."
    columns: ["Wem gehört es?", "Wessen …?"]
    rows:
      - label: "Name"
        cells:
          - { answer: "Das Fahrrad gehört Anna.", given: true }
          - { answer: "Annas Fahrrad" }
      - label: "Name"
        cells:
          - { answer: "Die Wohnung gehört Marek.", given: true }
          - { answer: "Mareks Wohnung" }
      - label: "kein Name"
        cells:
          - { answer: "Das Auto gehört meinem Bruder.", given: true }
          - { answer: "das Auto von meinem Bruder" }
      - label: "kein Name"
        cells:
          - { answer: "Der Hund gehört unseren Nachbarn.", given: true }
          - { answer: "der Hund von unseren Nachbarn" }
    explain:
      en: "This table practises the two A2 production routes. A bare name takes -s and goes in front: Annas Fahrrad, Mareks Wohnung, with no ordinary possessive apostrophe. The name replaces the article as well — Annas Fahrrad, not das Annas Fahrrad — which is why only the von-rows keep a das or a der. For a noun phrase, use the safe spoken pattern von + Dativ: von meinem Bruder, von unseren Nachbarn. A full genitive such as das Auto meines Bruders is also grammatical but remains a recognition form here."
      ru: "Таблица тренирует две активные модели A2. Голое имя получает -s и встаёт впереди: Annas Fahrrad, Mareks Wohnung, без обычного притяжательного апострофа. И имя заменяет собой артикль — Annas Fahrrad, а не das Annas Fahrrad, — поэтому das и der остаются только в строках с von. Для группы с существительным используйте безопасную разговорную модель von + Dativ: von meinem Bruder, von unseren Nachbarn. Полный Genitiv, например das Auto meines Bruders, тоже грамматически правилен, но здесь достаточно его узнавать."
      uk: "Таблиця тренує дві активні моделі A2. Голе ім'я отримує -s і стає попереду: Annas Fahrrad, Mareks Wohnung, без звичайного присвійного апострофа. І ім'я заміняє собою артикль — Annas Fahrrad, а не das Annas Fahrrad, — тому das і der лишаються тільки в рядках із von. Для групи з іменником використовуйте безпечну розмовну модель von + Dativ: von meinem Bruder, von unseren Nachbarn. Повний Genitiv, наприклад das Auto meines Bruders, теж граматично правильний, але тут достатньо його впізнавати."

  - id: mc-apostroph
    outcomes: [besitz-ausdruecken]
    type: mc
    focus: genitiv-eigenname
    prompt: "Welche Schreibweise ist auf Deutsch richtig?"
    options:
      - "Das ist Annas Fahrrad."
      - "Das ist Anna's Fahrrad."
      - "Das ist Annas' Fahrrad."
      - "Das ist Anna Fahrrad."
    correct: 0
    translation:
      en: "That is Anna's bike."
      ru: "Это велосипед Анны."
      uk: "Це велосипед Анни."
    explain:
      en: "German writes the possessive -s straight onto the name, with nothing between: Annas. The apostrophe in Anna's is English spelling and is simply not German — it appears only after a name that already ends in an s-sound, as in Tobias' Buch, and there it replaces the -s rather than joining it. Annas' doubles up, adding an apostrophe to a name that already has its -s, and Anna Fahrrad leaves the name unmarked altogether, so nothing in the phrase says whose bike it is."
      ru: "Немецкий пишет -s прямо на имени, без всего между: Annas. Апостроф в Anna's — английское правописание, по-немецки его нет; он появляется только после имени, которое уже оканчивается на s-звук, как в Tobias' Buch, и там он заменяет -s, а не присоединяется к нему. В Annas' апостроф добавлен к имени, у которого -s уже есть, а в Anna Fahrrad имя не отмечено вовсе, и ничто во фразе не говорит, чей это велосипед."
      uk: "Німецька пише -s прямо на імені, без нічого між: Annas. Апостроф в Anna's — англійський правопис, німецькою його немає; він з'являється лише після імені, що вже закінчується на s-звук, як у Tobias' Buch, і там він замінює -s, а не приєднується до нього. В Annas' апостроф додано до імені, у якого -s уже є, а в Anna Fahrrad ім'я не позначене зовсім, і ніщо у фразі не каже, чий це велосипед."

  - id: order-man-inversion
    outcomes: [regeln-mit-man]
    type: order
    focus: indefinitpronomen
    instruction:
      en: Arrange the words into a correct sentence.
      ru: Составьте правильное предложение.
      uk: Складіть правильне речення.
    words: ["In", "der", "Bibliothek", "darf", "man", "nicht", "essen."]
    translation:
      en: You are not allowed to eat in the library.
      ru: В библиотеке нельзя есть.
      uk: У бібліотеці не можна їсти.
    explain:
      en: "In der Bibliothek fills position 1, so darf takes position 2 and man follows it — a rule stated about a place, in the ordinary main-clause order. man behaves like any other subject here; nothing about it is special except that it names nobody in particular."
      ru: "In der Bibliothek занимает первое место, поэтому darf встаёт на второе, а man идёт за ним — правило о конкретном месте в обычном порядке главного предложения. man ведёт себя как любое другое подлежащее; особенного в нём только то, что оно никого конкретно не называет."
      uk: "In der Bibliothek займає перше місце, тому darf стає на друге, а man іде за ним — правило про конкретне місце у звичайному порядку головного речення. man поводиться як будь-який інший підмет; особливого в ньому лише те, що воно нікого конкретно не називає."

  - id: uebersetzen-man-regel
    outcomes: [regeln-mit-man]
    type: translate
    focus: indefinitpronomen
    prompt_en: "You have to register beforehand."
    prompt_ru: "Нужно записаться заранее."
    prompt_uk: "Треба записатися заздалегідь."
    answer: "Man muss sich vorher anmelden."
    # revision 2: «Нужно» / «Треба» underdetermine the modal (the batch-4 probe
    # ruling); the soll rendering keeps man + the er-form agreement the item grades.
    # Pin union over renderings. (Batch-5 audit, 2026-08-12.)
    accept:
      - "Man soll sich vorher anmelden."
    key_tokens: ["Man", "muss", "soll"]
    revision: 2
    explain:
      en: "Neither source sentence contains a subject you can copy: English you means people in general here rather than the listener, and the Russian has no subject at all. German needs one, and man is it. muss is graded alongside because man takes the er-form — Man müssen would be the same error as Er müssen."
      ru: "Ни одно исходное предложение не даёт подлежащего, которое можно было бы просто перенести: русское «нужно записаться» обходится без него вовсе, а английское you значит здесь «люди вообще», а не собеседника. Немецкому подлежащее необходимо, и им становится man. Заодно проверяется muss: при man глагол стоит в форме er, и Man müssen было бы той же ошибкой, что и Er müssen."
      uk: "Жодне вихідне речення не дає підмета, який можна було б просто перенести: українське «треба записатися» обходиться без нього зовсім, а англійське you значить тут «люди загалом», а не співрозмовника. Німецькій підмет необхідний, і ним стає man. Заразом перевіряється muss: при man дієслово стоїть у формі er, і Man müssen було б тією самою помилкою, що й Er müssen."

  - id: uebersetzen-von-dativ
    revision: 3
    outcomes: [besitz-ausdruecken]
    type: translate
    focus: genitiv-eigenname
    instruction:
      en: "Translate using von + Dativ."
      ru: "Переведите, используя von + Dativ."
      uk: "Перекладіть, використовуючи von + Dativ."
    prompt_en: "I am driving my brother's car."
    prompt_ru: "Я еду на машине брата."
    prompt_uk: "Я їду машиною брата."
    answer: "Ich fahre mit dem Auto von meinem Bruder."
    # revision 3: RU/UK «брата» carries no possessive, so the definite article is
    # licensed beside meinem — the topic's own probe already ruled this for «книгу
    # коллеги» (das Buch von der Kollegin). Both new renderings carry the graded
    # construction as the contraction vom; pin union over renderings.
    # (Batch-5 audit, 2026-08-12.)
    accept:
      - "Ich fahre das Auto von meinem Bruder."
      - "Ich fahre mit dem Auto vom Bruder."
      - "Ich fahre das Auto vom Bruder."
    key_tokens: ["von", "vom"]
    explain:
      en: "This A2 item explicitly asks for the productive von + Dativ route: von meinem Bruder. A full genitive, mit dem Auto meines Bruders, is grammatical German but would bypass the construction this item measures."
      ru: "Это задание A2 прямо тренирует активную модель von + Dativ: von meinem Bruder. Полный Genitiv — mit dem Auto meines Bruders — грамматически правилен, но обходит конструкцию, которую здесь проверяют."
      uk: "Це завдання A2 прямо тренує активну модель von + Dativ: von meinem Bruder. Повний Genitiv — mit dem Auto meines Bruders — граматично правильний, але обходить конструкцію, яку тут перевіряють."

  - id: hoeren-man-sagt
    outcomes: [regeln-mit-man]
    type: listen
    focus: indefinitpronomen
    instruction:
      en: Listen and type what you hear.
      ru: Прослушайте и напишите, что вы слышите.
      uk: Прослухайте і напишіть, що ви чуєте.
    text: "Wie sagt man das auf Deutsch?"
    translation:
      en: How do you say that in German?
      ru: Как это сказать по-немецки?
      uk: Як це сказати німецькою?
    explain:
      en: "The single most useful sentence in this unit, and worth being able to produce without thinking. Note the spelling: man with one n and a small m — der Mann with two is a different word entirely, and they sound almost the same."
      ru: "Самое полезное предложение всей темы, и произносить его стоит уметь не задумываясь. Обратите внимание на написание: man с одной n и со строчной буквы — der Mann с двумя это совсем другое слово, а звучат они почти одинаково."
      uk: "Найкорисніше речення всієї теми, і вимовляти його варто вміти не замислюючись. Зверніть увагу на написання: man з однією n і з малої літери — der Mann з двома це зовсім інше слово, а звучать вони майже однаково."
