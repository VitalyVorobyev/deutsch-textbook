topic: verben-mit-kasus
role: practice
stage: transfer
activity: task
skill: hoeren
title_de: "Hören im Kontext — Welchen Kasus will das Verb?"
title:
  en: 'A call before the move'
  ru: 'Звонок перед переездом'
  uk: 'Дзвінок перед переїздом'
items:
- id: q1
  outcomes:
  - rektion-verstehen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Sara
      text: 'Hallo Daniel, hier ist Sara. Störe ich dich gerade?'
    - speaker: Daniel
      text: 'Nein, gar nicht. Ist alles fertig für Samstag?'
    - speaker: Sara
      text: 'Fast. Ich habe gestern meinen Bruder angerufen. Er hilft mir mit den Möbeln.'
    - speaker: Daniel
      text: 'Und wer hilft dir in der Küche?'
    - speaker: Sara
      text: 'Meine Nachbarin. Ihr gehören auch die Taschen vor der Tür.'
    - speaker: Daniel
      text: 'Soll ich den Vermieter anrufen? Er wartet doch auf deine Antwort.'
    - speaker: Sara
      text: 'Danke, das mache ich selbst. Ich warte nur noch auf den Schlüssel für die neue Wohnung.'
    - speaker: Daniel
      text: 'Dann frag doch Herrn Berg vom Büro. Er antwortet dir sicher schnell.'
    - speaker: Sara
      text: 'Gute Idee. Ich rufe ihn gleich an.'
  recording: ls-verben-mit-kasus-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: 'Wen hat Sara gestern angerufen?'
  options:
  - 'Ihren Bruder.'
  - 'Ihre Nachbarin.'
  - 'Den Vermieter.'
  correct: 0
  explain:
    en: 'Anrufen takes its person in the accusative: meinen Bruder angerufen. The landlord is the call Daniel offers to make, and the neighbour helps in the kitchen.'
    ru: 'При anrufen лицо стоит в аккузативе: meinen Bruder angerufen. Позвонить арендодателю только предлагает Даниэль, а соседка помогает на кухне.'
    uk: 'Після anrufen особа стоїть в акузативі: meinen Bruder angerufen. Подзвонити орендодавцеві лише пропонує Даніель, а сусідка допомагає на кухні.'
  max_replays: 3
