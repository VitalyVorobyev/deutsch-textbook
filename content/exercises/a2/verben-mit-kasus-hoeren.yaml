    en: 'Daniel''s question is wer hilft dir — helfen takes the person it helps in the dative — and the answer is meine Nachbarin. The brother helps with the furniture.'
    ru: 'Даниэль спрашивает wer hilft dir — при helfen тот, кому помогают, стоит в дативе, — и ответ: meine Nachbarin. Брат помогает с мебелью.'
