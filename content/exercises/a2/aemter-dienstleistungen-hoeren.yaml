    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was braucht Herr Demir, wenn seine Frau nicht persönlich kommt?
  options:
  - Eine Vollmacht von seiner Frau.
  - Einen neuen Ausweis für seine Frau.
  - Eine zweite Wohnungsgeberbestätigung.
  correct: 0
  explain:
    en: His wife does not necessarily have to come in person, but he then needs her
      written authorization — eine Vollmacht von ihr. No new ID card is part of this
      address-registration procedure.
    ru: Жене необязательно приходить лично, но тогда от неё нужна доверенность —
      eine Vollmacht von ihr. Новый паспорт или удостоверение личности не является
      частью регистрации адреса.
    uk: Дружині необов'язково приходити особисто, але тоді від неї потрібна довіреність —
      eine Vollmacht von ihr. Новий паспорт або посвідчення особи не є частиною
      реєстрації адреси.
  max_replays: 3
