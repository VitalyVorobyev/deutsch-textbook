topic: aemter-dienstleistungen
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Ämter & Dienstleistungen"
title:
  en: Registering an address
  ru: Регистрация по месту жительства
  uk: 'Реєстрація місця проживання'
items:
- id: q1
  revision: 2
  outcomes:
  - unterlagen-erfragen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Sachbearbeiterin
      text: Guten Tag, was kann ich für Sie tun?
    - speaker: Herr Demir
      text: Ich möchte meinen Wohnsitz anmelden. Welche Unterlagen brauche ich?
    - speaker: Sachbearbeiterin
      text: Ihren Pass, die Wohnungsgeberbestätigung und das ausgefüllte Formular.
    - speaker: Herr Demir
      text: Die Wohnungsgeberbestätigung habe ich dabei. Das Formular nicht.
    - speaker: Sachbearbeiterin
      text: Das können Sie hier ausfüllen. Es liegt am Schalter drei.
    - speaker: Herr Demir
      text: Muss meine Frau auch persönlich kommen?
    - speaker: Sachbearbeiterin
      text: Nicht unbedingt. Sie brauchen dann aber eine Vollmacht von ihr.
    - speaker: Herr Demir
      text: Und wie lange dauert die Bearbeitung?
    - speaker: Sachbearbeiterin
      text: Die Meldebestätigung bekommen Sie nach der Prüfung sofort.
    - speaker: Herr Demir
      text: Kostet das etwas?
    - speaker: Sachbearbeiterin
      text: Nein, die Anmeldung ist kostenlos.
    - speaker: Herr Demir
      text: Gut, dann fülle ich das Formular jetzt aus.
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was hat Herr Demir nicht dabei?
  options:
  - Das ausgefüllte Formular.
  - Die Wohnungsgeberbestätigung.
  - Seinen Pass.
  correct: 0
  explain:
    en: Three documents are listed and he answers about two of them in one line —
      one he has, one he does not. The nicht comes last and carries the whole answer.
    ru: 'Перечислены три документа, и в одной реплике он отвечает про два: один есть,
      другого нет. Слово nicht стоит в конце и несёт весь ответ.'
    uk: 'Перелічено три документи, і в одній репліці він відповідає про два: один має, другого — ні. Слово nicht стоїть наприкінці й несе всю відповідь.'
  max_replays: 3
- id: q2
  revision: 2
  outcomes:
