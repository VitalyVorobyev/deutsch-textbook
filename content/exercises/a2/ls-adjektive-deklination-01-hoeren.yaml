  question: Warum ist der längere Weg zur Arbeit kein Problem mehr?
  options:
  - Ein neuer Bus fährt direkt.
  - Die Miete ist niedriger.
  - Der Flur ist hell.
  correct: 0
  explain:
    en: The objection and its answer are in two consecutive lines from different speakers.
      The other options are real advantages of the flat, just not answers to this
      objection.
    ru: Возражение и ответ на него — две подряд идущие реплики разных говорящих. Другие
      варианты — реальные достоинства квартиры, но не ответ на это возражение.
    uk: 'Заперечення і відповідь на нього — дві сусідні репліки різних мовців. Інші варіанти — справжні переваги квартири, але не відповідь саме на це заперечення.'
