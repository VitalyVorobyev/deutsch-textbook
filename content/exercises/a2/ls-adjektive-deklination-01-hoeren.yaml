topic: adjektive-deklination
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Beschreiben: Adjektive vor dem Nomen"
title:
  en: Comparing two flats
  ru: Сравнивают две квартиры
  uk: 'Порівнюють дві квартири'
items:
- id: q1
  outcomes:
  - adjektiv-beschreiben
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Jana
      text: Wir haben jetzt zwei Wohnungen gesehen. Welche findest du besser?
    - speaker: Kolja
      text: Die erste hat ein großes Wohnzimmer, aber eine sehr kleine Küche.
    - speaker: Jana
      text: Stimmt. Die zweite hat einen schönen Balkon und einen hellen Flur.
    - speaker: Kolja
      text: Der Flur ist wirklich hell. Aber die alten Fenster gefallen mir nicht.
    - speaker: Jana
      text: In der ersten Wohnung sind die Fenster neu.
    - speaker: Kolja
      text: Ja, und die Miete ist niedriger. Vierzig Euro weniger.
    - speaker: Jana
      text: Dafür ist der Weg zur Arbeit länger.
    - speaker: Kolja
      text: Mit dem neuen Bus nicht mehr. Der fährt seit Januar direkt.
    - speaker: Jana
      text: Dann nehmen wir die erste. Ich rufe morgen früh an.
  recording: ls-adjektive-deklination-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Welche Wohnung hat neue Fenster?
  options:
  - Die erste.
  - Die zweite.
  - Beide.
  correct: 0
  explain:
    en: The old windows are mentioned first, about the second flat, and the new ones
      come as a contrast one line later. Two flats and six features means every detail
      has to be filed under the right one.
    ru: 'Сначала упоминаются старые окна — во второй квартире, — а новые появляются
      как противопоставление строкой позже. Две квартиры и шесть характеристик: каждую
      деталь нужно отнести к своей.'
    uk: 'Старі вікна згадано першими — у другій квартирі, — а нові з''являються як протиставлення рядком пізніше. Дві квартири і шість характеристик означають, що кожну деталь треба віднести до своєї.'
  max_replays: 3
