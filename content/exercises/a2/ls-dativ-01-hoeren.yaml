  question: Wann bringt Herr Adam den Messbecher zurück?
  options:
  - Am Freitag.
  - Am Wochenende.
  - Am Montag.
  correct: 0
  explain:
    en: The weekend is when she needs it back by, so Friday is his answer to that.
      Hearing only one of the two days gets it wrong.
    ru: Выходные — это срок, к которому мерный стакан нужен ей; пятница — его ответ
      на это. Кто расслышал только один из двух дней, ошибётся.
    uk: 'Вихідні — це строк, до якого мірний стакан потрібен їй; п''ятниця — його відповідь на це. Хто розчув лише один із двох днів, помилиться.'
