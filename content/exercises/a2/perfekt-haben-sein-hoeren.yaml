topic: perfekt-haben-sein
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — Das Perfekt mit haben und sein"
title:
  en: A weekend in Dresden
  ru: Выходные в Дрездене
  uk: 'Вихідні в Дрездені'
items:
- id: q1
  outcomes:
  - perfekt-vergangenheit-erzaehlen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Rafa
      text: Und, wie war euer Wochenende in Dresden?
    - speaker: Anja
      text: Sehr schön! Wir sind am Freitagabend mit dem Zug gefahren.
    - speaker: Rafa
      text: Habt ihr das Hotel schnell gefunden?
    - speaker: Anja
      text: Nein, wir sind zuerst falsch gelaufen und haben eine halbe Stunde gesucht.
    - speaker: Rafa
      text: Oh je. Und am Samstag?
    - speaker: Anja
      text: Am Samstag haben wir die Altstadt angeschaut und sind auf einen Turm gestiegen.
    - speaker: Rafa
      text: Habt ihr auch das Museum besucht?
    - speaker: Anja
      text: Das wollten wir, aber es war geschlossen. Deshalb sind wir an den Fluss
        gegangen.
    - speaker: Rafa
      text: Und wann seid ihr zurückgekommen?
    - speaker: Anja
      text: Am Sonntagabend. Wir haben viel gesehen und wenig geschlafen.
  recording: ls-perfekt-haben-sein-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Warum haben sie das Museum nicht besucht?
  options:
  - Es war geschlossen.
  - Sie hatten keine Zeit.
  - Sie sind falsch gelaufen.
  correct: 0
  explain:
    en: Getting lost really did happen, but on Friday and about the hotel. A wrong
      answer here is usually a real event pulled out of the wrong moment.
    ru: Заблудились они на самом деле — но в пятницу и по дороге к отелю. Неверный
      ответ здесь обычно и есть реальное событие, взятое не из того момента.
    uk: 'Заблукали вони насправді — але в п''ятницю і дорогою до готелю. Хибна відповідь тут зазвичай і є справжня подія, взята не з того моменту.'
  max_replays: 3
