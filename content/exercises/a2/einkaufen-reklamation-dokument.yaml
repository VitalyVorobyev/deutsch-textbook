topic: einkaufen-reklamation
role: practice
stage: transfer
activity: application
stimulus: a2/einkaufen-kassenbon-vergleich
title_de: "Mission — Einkaufen & Reklamation"
title:
  en: "Mission — resolve the wrong price"
  ru: "Задача — решить проблему с неверной ценой"
  uk: "Завдання — розв’язати проблему з неправильною ціною"
items:
  - id: dokument-bon-preis
    outcomes: [umtausch-begruenden]
    type: mc
    instruction:
      en: "Keep the receipt and shelf cards open. What is the problem?"
      ru: "Не закрывайте чек и карточки. В чём проблема?"
      uk: "Не закривайте чек і картки. У чому проблема?"
    prompt: "Warum reklamiert die Kundin?"
    options:
      - "Auf dem Kassenbon kosten die SoundGo-Kopfhörer zehn Euro mehr als am Regal."
      - "Die Tragetasche wurde zweimal berechnet."
      - "Die SoundPro-Kopfhörer haben nur zwanzig Stunden Akkulaufzeit."
    correct: 0
    translation:
      en: "Why is the customer making a complaint?"
      ru: "Почему покупательница предъявляет претензию?"
      uk: "Чому покупчиня подає претензію?"
    explain:
      en: "The SoundGo shelf price is 39.90 euros, while the receipt charges 49.90 euros: a difference of exactly ten euros."
      ru: "На полке SoundGo стоит 39,90 евро, а в чеке — 49,90 евро: разница ровно десять евро."
      uk: "На полиці SoundGo коштує 39,90 євро, а в чеку — 49,90 євро: різниця рівно десять євро."

  - id: dokument-produkte-vergleichen
    revision: 3
    outcomes: [produkte-vergleichen]
    type: write
    prompt:
      en: "Use the two product cards. Write a short comparison that would help a customer choose."
      ru: "Используйте две карточки товаров. Напишите короткое сравнение, которое поможет покупателю выбрать."
      uk: "Використайте дві картки товарів. Напишіть коротке порівняння, яке допоможе покупцеві обрати."
    goal:
      en: "Turn the visible figures into meaningful comparisons rather than copying a supplied sentence."
      ru: "Превратите видимые характеристики в осмысленное сравнение, а не копируйте готовую фразу."
      uk: "Перетворіть видимі характеристики на змістовне порівняння, а не копіюйте готову фразу."
    requirements:
      - {en: "Compare both weight and price with comparative + als.", ru: "Сравните вес и цену с помощью сравнительной степени + als.", uk: "Порівняйте вагу й ціну за допомогою вищого ступеня + als."}
      - {en: "State the ten-hour battery advantage.", ru: "Укажите преимущество аккумулятора в десять часов.", uk: "Укажіть перевагу акумулятора в десять годин."}
      - {en: "Use the product names so every comparison has an unambiguous referent.", ru: "Используйте названия товаров, чтобы каждое сравнение было однозначным.", uk: "Використайте назви товарів, щоб кожне порівняння було однозначним."}
    min_words: 13
    model_answer: "SoundPro ist schwerer und teurer als SoundGo. Dafür hält sein Akku zehn Stunden länger."
    model_translation:
      en: "SoundPro is heavier and more expensive than SoundGo. In return, its battery lasts ten hours longer."
      ru: "SoundPro тяжелее и дороже SoundGo. Зато его аккумулятор работает на десять часов дольше."
      uk: "SoundPro важчий і дорожчий за SoundGo. Зате його акумулятор працює на десять годин довше."
    explain:
      en: "The cards support more than one natural wording. A useful answer preserves all three facts and makes the trade-off explicit: SoundPro costs and weighs more, but offers ten additional battery hours."
      ru: "Карточки допускают несколько естественных формулировок. Полезный ответ сохраняет все три факта и явно показывает компромисс: SoundPro дороже и тяжелее, но даёт десять дополнительных часов работы."
      uk: "Картки допускають кілька природних формулювань. Корисна відповідь зберігає всі три факти й чітко показує компроміс: SoundPro дорожчий і важчий, але дає десять додаткових годин роботи."

  - id: dokument-reklamation-schreiben
    outcomes: [umtausch-begruenden, reklamation-schreiben]
    type: write
    prompt:
      en: "Write a short complaint to the shop using the receipt and shelf card."
      ru: "Напишите короткую претензию магазину, используя чек и карточку с полки."
      uk: "Напишіть коротку претензію магазину, використовуючи чек і картку з полиці."
    goal:
      en: "Identify the purchase, explain the price difference and request a solution."
      ru: "Назовите покупку, объясните разницу в цене и попросите решить проблему."
      uk: "Назвіть покупку, поясніть різницю в ціні й попросіть розв’язати проблему."
    requirements:
      - en: "Give the purchase date and product."
        ru: "Укажите дату покупки и товар."
        uk: "Укажіть дату покупки й товар."
      - en: "State both the shelf price and the charged price."
        ru: "Назовите цену на полке и сумму в чеке."
        uk: "Назвіть ціну на полиці й суму в чеку."
      - en: "Ask for the ten-euro difference to be refunded."
        ru: "Попросите вернуть разницу в десять евро."
        uk: "Попросіть повернути різницю в десять євро."
    min_words: 35
    model_answer: "Guten Tag, am 26. Juli habe ich bei Ihnen SoundGo-Kopfhörer gekauft. Am Regal kosteten sie 39,90 Euro, aber auf dem Kassenbon stehen 49,90 Euro. Bitte erstatten Sie mir die Differenz von zehn Euro. Den Bon habe ich noch. Mit freundlichen Grüßen, Mia Klein"
    model_translation:
      en: "Hello, on 26 July I bought SoundGo headphones from you. They cost 39.90 euros on the shelf, but the receipt shows 49.90 euros. Please refund the ten-euro difference. I still have the receipt. Kind regards, Mia Klein"
      ru: "Здравствуйте, 26 июля я купила у вас наушники SoundGo. На полке они стоили 39,90 евро, но в чеке указано 49,90 евро. Пожалуйста, верните мне разницу в десять евро. Чек у меня сохранился. С уважением, Миа Кляйн"
      uk: "Добрий день, 26 липня я купила у вас навушники SoundGo. На полиці вони коштували 39,90 євро, але в чеку вказано 49,90 євро. Будь ласка, поверніть мені різницю в десять євро. Чек у мене зберігся. З повагою, Міа Кляйн"
    explain:
      en: "A useful complaint connects evidence to a precise remedy: product and date, two conflicting prices, then the amount requested."
      ru: "Полезная претензия связывает доказательства с точным требованием: товар и дата, две разные цены, затем сумма возврата."
      uk: "Корисна претензія пов’язує докази з точним проханням: товар і дата, дві різні ціни, потім сума повернення."

  - id: dokument-reklamation-sprechen
    outcomes: [umtausch-begruenden, gefallen-passen-sagen]
    type: speak
    mode: spoken-interaction
    prompt:
      en: "At customer service, explain the wrong price and say whether you want to keep or return the headphones."
      ru: "В службе поддержки объясните ошибку в цене и скажите, хотите ли оставить или вернуть наушники."
      uk: "У службі підтримки поясніть помилку в ціні й скажіть, хочете залишити чи повернути навушники."
    goal:
      en: "Use the document to justify one clear request."
      ru: "Используйте документ, чтобы обосновать одно ясное требование."
      uk: "Використайте документ, щоб обґрунтувати одну чітку вимогу."
    checklist:
      - en: "I named the shelf and receipt prices."
        ru: "Я назвал(а) цену на полке и в чеке."
        uk: "Я назвав (назвала) ціну на полиці й у чеку."
      - en: "I said that I want to keep the headphones."
        ru: "Я сказал(а), что хочу оставить наушники."
        uk: "Я сказав (сказала), що хочу залишити навушники."
      - en: "I asked for the difference back politely."
        ru: "Я вежливо попросил(а) вернуть разницу."
        uk: "Я ввічливо попросив (попросила) повернути різницю."
    model_answer: "Entschuldigung, am Regal kosteten die SoundGo-Kopfhörer 39,90 Euro, aber auf dem Bon stehen 49,90 Euro. Die Kopfhörer gefallen mir, und ich möchte sie behalten. Könnten Sie mir bitte die zehn Euro zurückzahlen?"
    model_translation:
      en: "Excuse me, the SoundGo headphones cost 39.90 euros on the shelf, but the receipt shows 49.90 euros. I like the headphones and want to keep them. Could you please refund the ten euros?"
      ru: "Извините, на полке наушники SoundGo стоили 39,90 евро, но в чеке указано 49,90 евро. Наушники мне нравятся, и я хочу их оставить. Не могли бы вы вернуть мне десять евро?"
      uk: "Перепрошую, на полиці навушники SoundGo коштували 39,90 євро, але в чеку вказано 49,90 євро. Навушники мені подобаються, і я хочу їх залишити. Чи не могли б ви повернути мені десять євро?"
    explain:
      en: "The request separates the pricing error from the product decision: the customer keeps the item but asks for the documented difference."
      ru: "Просьба отделяет ошибку в цене от решения о товаре: покупатель оставляет товар, но просит вернуть подтверждённую разницу."
      uk: "Прохання відокремлює помилку в ціні від рішення щодо товару: покупець залишає товар, але просить повернути підтверджену різницю."
