topic: modalverben
role: practice
title:
  en: House rules for a new flatmate
  ru: Правила дома для нового соседа
  uk: 'Правила дому для нового сусіда'
items:
- id: q1
  outcomes:
  - modal-erlaubnis-notwendigkeit
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Nele
      text: Timo, wir müssen die Hausordnung noch einmal durchgehen.
    - speaker: Timo
      text: Okay. Was darf ich denn nicht?
    - speaker: Nele
      text: Im Treppenhaus darfst du nicht rauchen. Das ist verboten.
    - speaker: Timo
      text: Verstanden. Und die Waschküche?
    - speaker: Nele
      text: Da kannst du jeden Tag waschen, aber nach zweiundzwanzig Uhr darfst du
        die Maschine nicht mehr anstellen.
    - speaker: Timo
      text: Muss ich den Müll auch runterbringen?
    - speaker: Nele
      text: Nicht jeden Tag. Am Dienstag musst du die gelbe Tonne rausstellen.
    - speaker: Timo
      text: Und wenn ich Besuch habe?
    - speaker: Nele
      text: Das kannst du machen. Du musst nur nach zehn Uhr leise sein.
    - speaker: Timo
      text: Gut, das kann ich mir merken.
  recording: ls-modalverben-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was ist im Treppenhaus verboten?
  options:
  - Rauchen.
  - Waschen.
  - Besuch empfangen.
  correct: 0
  explain:
    en: Washing and having visitors are both allowed, each with a time limit attached.
      Only one thing in the whole conversation is called verboten.
    ru: И стирка, и гости разрешены — у каждого лишь своё ограничение по времени.
      Словом verboten во всём разговоре названо только одно.
    uk: 'І прання, і гості дозволені — у кожного лише своє обмеження за часом. Словом verboten в усій розмові названо тільки одне.'
  max_replays: 3
