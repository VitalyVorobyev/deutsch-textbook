  recording: ls-modalverben-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was muss Timo am Dienstag machen?
  options:
  - Die gelbe Tonne rausstellen.
  - Die Waschmaschine anstellen.
  - Jeden Tag den Müll runterbringen.
  correct: 0
  explain:
    en: The answer begins with a refusal — nicht jeden Tag — and only then names the
      day. "Jeden Tag den Müll runterbringen" is what the question asked, kept as the answer instead
      of the correction that followed it.
    ru: Ответ начинается с отрицания — nicht jeden Tag — и лишь затем называет день.
      «Jeden Tag den Müll runterbringen» — это сам вопрос, принятый за ответ вместо последовавшей поправки.
    uk: 'Відповідь починається із заперечення — nicht jeden Tag — і аж потім називає день. «Jeden Tag den Müll runterbringen» — це саме запитання, взяте за відповідь замість поправки, що прозвучала після нього.'
  max_replays: 3
