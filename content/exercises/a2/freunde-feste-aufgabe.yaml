topic: freunde-feste
role: practice
stage: transfer
activity: task
skill: hoeren
title_de: "Aufgabe — Wer bringt was zu Miras Fest mit?"
title:
  en: "Task — who brings what to Mira's party"
  ru: "Задание — кто что принесёт на праздник Миры"
  uk: "Завдання — хто що принесе на свято Міри"
recording: ls-freunde-feste-aufgabe-01
items:
  - id: aufgabe-worum-geht-es
    rung: gist
    outcomes: [einladen-zusagen-absagen]
    type: audio-comprehension
    instruction:
      en: "In the bakery, a few days before Mira's party: Lena, Mira and a colleague are talking. Listen and choose the answer."
      ru: "В пекарне, за несколько дней до праздника Миры, разговаривают Лена, Мира и их коллега. Прослушайте и выберите ответ."
      uk: "У пекарні, за кілька днів до свята Міри, розмовляють Лена, Міра та їхній колега. Прослухайте й оберіть відповідь."
    question: "Was ist das Thema des Gesprächs?"
    options:
      - "Der Kollege lädt Lena und Mira zur Hochzeit von seiner Schwester ein."
      - "Mira lädt zu ihrem Fest ein, und alle planen, wer kommt und wer was mitbringt."
      - "Lena plant ihren Geburtstag und fragt, wer ihr eine Torte backt."
      - "Lena und Mira backen in der Bäckerei eine Torte für eine Kundin."
    correct: 1
    translation:
      en: "What is the conversation about?"
      ru: "О чём этот разговор?"
      uk: "Про що ця розмова?"
    explain:
      en: "The first line sets the whole scene: Mira asks whether her invitation has arrived. Everything after it answers an invitation — Lena says yes, the colleague says no, and at the end they settle who brings what. The wedding is real, but it is only the colleague's reason for not coming; the cake is real too, but Lena bakes it for Mira, not for a customer."
      ru: "Первая же реплика задаёт всю сцену: Мира спрашивает, дошло ли её приглашение. Всё остальное — ответы на это приглашение: Лена соглашается, коллега отказывается, а в конце договариваются, кто что принесёт. Свадьба в разговоре есть, но это лишь причина, по которой коллега не придёт; торт тоже есть, но Лена печёт его для Миры, а не для покупательницы."
      uk: "Уже перша репліка задає всю сцену: Міра питає, чи дійшло її запрошення. Усе інше — відповіді на нього: Лена погоджується, колега відмовляється, а наприкінці домовляються, хто що принесе. Весілля в розмові є, але це лише причина, з якої колега не прийде; торт теж є, але Лена пече його для Міри, а не для покупчині."

  - id: aufgabe-warum-absage
    rung: detail
    outcomes: [einladen-zusagen-absagen]
    type: audio-comprehension
    instruction:
      en: "Listen for the reason the colleague gives."
      ru: "Найдите на слух причину, которую называет коллега."
      uk: "Знайдіть на слух причину, яку називає колега."
    question: "Warum kann der Kollege am Samstag nicht kommen?"
    options:
      - "Er muss am Samstag in der Bäckerei arbeiten."
      - "Er besucht am Samstag seine Eltern."
      - "Seine Schwester heiratet am Samstag."
      - "Er spielt am Samstag Fußball."
    correct: 2
    translation:
      en: "Why can't the colleague come on Saturday?"
      ru: "Почему коллега не может прийти в субботу?"
      uk: "Чому колега не може прийти в суботу?"
    explain:
      en: "He turns the invitation down the polite way: thanks first, then leider, then the reason with weil — „…, weil meine Schwester am Samstag heiratet.“ Mira's answer names the same event: „eine Hochzeit ist natürlich wichtiger.“ Work and football are what a Saturday in this story could hold, but neither is mentioned as his plan."
      ru: "Он отказывается вежливо: сначала благодарит, потом leider, потом причина с weil — „…, weil meine Schwester am Samstag heiratet.“ Ответ Миры называет то же событие: „eine Hochzeit ist natürlich wichtiger.“ Работа и футбол вполне могли бы занять субботу в этой истории, но о них как о его планах никто не говорит."
      uk: "Він відмовляється ввічливо: спочатку дякує, потім leider, потім причина з weil — „…, weil meine Schwester am Samstag heiratet.“ Відповідь Міри називає ту саму подію: „eine Hochzeit ist natürlich wichtiger.“ Робота і футбол цілком могли б зайняти суботу в цій історії, але як про його плани про них ніхто не говорить."

  - id: aufgabe-wer-bringt-was
    rung: detail
    outcomes: [absprachen-aushandeln]
    type: audio-comprehension
    instruction:
      en: "Listen to how they settle it at the end."
      ru: "Послушайте, о чём они договариваются в конце."
      uk: "Послухайте, про що вони домовляються наприкінці."
    question: "Was planen die drei am Ende?"
    options:
      - "Lena bringt die Torte am Samstag mit, und der Kollege kommt am Sonntag mit einem Geschenk."
      - "Lena bringt die Torte am Samstag mit, und der Kollege bringt die Getränke."
      - "Niemand bringt etwas mit, und der Kollege kommt am Sonntag mit einem Geschenk."
      - "Der Kollege backt eine Torte, und Lena bringt am Sonntag ein Geschenk."
    correct: 0
    translation:
      en: "What do the three settle on at the end?"
      ru: "О чём в итоге договорились все трое?"
      uk: "Про що зрештою домовилися всі троє?"
    explain:
      en: "Lena sums it up in the second-to-last line: „Ich bringe ihr am Samstag die Torte mit, und du kommst am Sonntag.“ The colleague said what Sunday is for just before: „Am Sonntag komme ich kurz bei dir vorbei und bringe dir ein Geschenk mit.“ Mira did say „Niemand muss etwas Großes mitbringen“ — but Lena offered a cake anyway, and Mira was glad of it. Nobody mentions drinks."
      ru: "Лена подводит итог в предпоследней реплике: „Ich bringe ihr am Samstag die Torte mit, und du kommst am Sonntag.“ Зачем коллега придёт в воскресенье, он сказал чуть раньше: „Am Sonntag komme ich kurz bei dir vorbei und bringe dir ein Geschenk mit.“ Мира действительно сказала „Niemand muss etwas Großes mitbringen“, но Лена всё равно предложила торт, и Мира обрадовалась. О напитках никто не говорит."
      uk: "Лена підсумовує в передостанній репліці: „Ich bringe ihr am Samstag die Torte mit, und du kommst am Sonntag.“ Навіщо колега прийде в неділю, він сказав трохи раніше: „Am Sonntag komme ich kurz bei dir vorbei und bringe dir ein Geschenk mit.“ Міра справді сказала „Niemand muss etwas Großes mitbringen“, але Лена все одно запропонувала торт, і Міра зраділа. Про напої ніхто не говорить."

  - id: aufgabe-wer-sagt-hochzeit
    rung: who
    outcomes: [einladen-zusagen-absagen]
    type: audio-comprehension
    instruction:
      en: "Who says it? Listen for the voice."
      ru: "Кто это говорит? Ориентируйтесь на голос."
      uk: "Хто це каже? Орієнтуйтеся на голос."
    question: "Wer sagt: „Aber eine Hochzeit ist natürlich wichtiger.“?"
    options:
      - "Lena"
      - "Mira"
      - "Kollege"
    correct: 1
    translation:
      en: "Who says: “But a wedding is more important, of course”?"
      ru: "Кто говорит: «Но свадьба, конечно, важнее»?"
      uk: "Хто каже: «Але весілля, звісно, важливіше»?"
    explain:
      en: "Mira says it, straight after the colleague turns her down. It is the other half of a polite refusal: Schade! shows you are sorry, and the second sentence tells him his reason is a good one. Lena never speaks to the colleague about the wedding, and he gives his reason without judging it."
      ru: "Это говорит Мира — сразу после того, как коллега ей отказал. Это вторая половина вежливого отказа: Schade! показывает, что ей жаль, а следующая фраза даёт понять, что причина у него уважительная. Лена со своим коллегой о свадьбе не говорит, а сам он просто называет причину, не оценивая её."
      uk: "Це каже Міра — одразу після того, як колега їй відмовив. Це друга половина ввічливої відмови: Schade! показує, що їй шкода, а наступна фраза дає зрозуміти, що причина в нього поважна. Лена з колегою про весілля не говорить, а сам він просто називає причину, не оцінюючи її."

  - id: aufgabe-dativ-pronomen
    rung: form
    outcomes: [absprachen-aushandeln]
    type: cloze
    focus: dativ-pronomen
    instruction:
      en: "Three lines from the conversation. Fill in the dative pronoun you heard."
      ru: "Три реплики из разговора. Вставьте местоимение в Dativ, которое вы услышали."
      uk: "Три репліки з розмови. Вставте займенник у Dativ, який ви почули."
    text: "Lena fragt Mira: „Was soll ich {{dir}} mitbringen?“ Mira sagt dem Kollegen: „Lena backt {{mir}} eine Torte.“ Am Ende sagt Lena dem Kollegen über Mira: „Ich bringe {{ihr}} am Samstag die Torte mit.“"
    translation:
      en: "Lena asks Mira: “What should I bring you?” Mira tells the colleague: “Lena is baking me a cake.” At the end Lena tells the colleague about Mira: “I'll bring her the cake on Saturday.”"
      ru: "Лена спрашивает Миру: «Что тебе принести?» Мира говорит коллеге: «Лена испечёт мне торт». В конце Лена говорит коллеге о Мире: «В субботу я принесу ей торт»."
      uk: "Лена питає Міру: «Що тобі принести?» Міра каже колезі: «Лена спече мені торт». Наприкінці Лена каже колезі про Міру: «У суботу я принесу їй торт»."
    explain:
      en: "One cake, three pronouns, because the person who gets it is seen from three places. Lena speaks to Mira: dir. Mira speaks about herself: mir. Lena speaks to the colleague about Mira: ihr — not sie, which would make Mira the thing being brought. In all three lines the cake keeps the accusative slot, so the person who receives it takes the dative."
      ru: "Один торт — три местоимения, потому что того, кто его получает, видно с трёх точек. Лена обращается к Мире — dir. Мира говорит о себе — mir. Лена рассказывает коллеге о Мире — ihr, а не sie: sie сделало бы Миру тем, что приносят. Во всех трёх репликах Akkusativ занят тортом, поэтому получатель стоит в Dativ."
      uk: "Один торт — три займенники, бо того, хто його отримує, видно з трьох місць. Лена звертається до Міри — dir. Міра говорить про себе — mir. Лена розповідає колезі про Міру — ihr, а не sie: sie зробило б Міру тим, що приносять. У всіх трьох репліках Akkusativ зайнятий тортом, тому отримувач стоїть у Dativ."

  - id: aufgabe-absage-vorbeikommen
    rung: reply
    outcomes: [einladen-zusagen-absagen]
    type: translate
    focus: trennbar-wortstellung
    instruction:
      en: "Mira invites you to her party too. Turn Saturday down and offer Sunday, the way her colleague did. Use vorbeikommen."
      ru: "Мира приглашает на праздник и вас. Откажитесь от субботы и предложите воскресенье, как это сделал её коллега. Используйте vorbeikommen."
      uk: "Міра запрошує на свято і вас. Відмовтеся від суботи й запропонуйте неділю, як це зробив її колега. Використайте vorbeikommen."
    prompt_en: "Unfortunately I can't make Saturday, but I'll drop by your place on Sunday."
    prompt_ru: "В субботу я, к сожалению, не могу, но в воскресенье зайду к тебе."
    prompt_uk: "У суботу я, на жаль, не можу, але в неділю зайду до тебе."
    answer: "Leider kann ich am Samstag nicht, aber am Sonntag komme ich bei dir vorbei."
    # Both ends of the separable verb are pinned: komme in position 2, vorbei at the clause end.
    # The first clause may open with Leider, Am Samstag or Ich and may close with kommen; the
    # second may open with am Sonntag or ich. Neither choice is what the tag grades.
    key_tokens: ["komme", "vorbei"]
    accept:
      - "Leider kann ich am Samstag nicht, aber ich komme am Sonntag bei dir vorbei."
      - "Leider kann ich am Samstag nicht kommen, aber am Sonntag komme ich bei dir vorbei."
      - "Leider kann ich am Samstag nicht kommen, aber ich komme am Sonntag bei dir vorbei."
      - "Am Samstag kann ich leider nicht, aber am Sonntag komme ich bei dir vorbei."
      - "Am Samstag kann ich leider nicht, aber ich komme am Sonntag bei dir vorbei."
      - "Am Samstag kann ich leider nicht kommen, aber am Sonntag komme ich bei dir vorbei."
      - "Am Samstag kann ich leider nicht kommen, aber ich komme am Sonntag bei dir vorbei."
      - "Ich kann am Samstag leider nicht, aber am Sonntag komme ich bei dir vorbei."
      - "Ich kann am Samstag leider nicht, aber ich komme am Sonntag bei dir vorbei."
      - "Ich kann am Samstag leider nicht kommen, aber am Sonntag komme ich bei dir vorbei."
      - "Ich kann am Samstag leider nicht kommen, aber ich komme am Sonntag bei dir vorbei."
    explain:
      en: "The second half is the colleague's own sentence, made yours. vorbeikommen is separable and has no modal beside it here, so it splits: komme stays in position 2 — after am Sonntag or after ich — and vorbei goes to the very end, behind bei dir. The first half needs no verb of its own: Leider kann ich am Samstag nicht is complete German, and nicht kommen says the same."
      ru: "Вторая половина — это фраза коллеги, только уже ваша. vorbeikommen — отделяемый глагол, и модального рядом нет, поэтому он распадается: komme остаётся на втором месте (после am Sonntag или после ich), а vorbei уходит в самый конец, за bei dir. Первой половине собственный глагол не нужен: Leider kann ich am Samstag nicht — законченное немецкое предложение, и nicht kommen значит то же самое."
      uk: "Друга половина — це речення колеги, тільки вже ваше. vorbeikommen — відокремлюване дієслово, і модального поруч немає, тому воно розпадається: komme лишається на другому місці (після am Sonntag або після ich), а vorbei іде в самий кінець, за bei dir. Першій половині власне дієслово не потрібне: Leider kann ich am Samstag nicht — завершене німецьке речення, і nicht kommen означає те саме."
