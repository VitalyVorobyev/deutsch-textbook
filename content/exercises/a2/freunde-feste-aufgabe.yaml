topic: freunde-feste
role: practice
stage: transfer
activity: task
skill: hoeren
title_de: "Wer bringt was zu Miras Fest mit?"
title:
  en: "Who brings what to Mira's party?"
  ru: "Кто что принесёт на праздник Миры?"
  uk: "Хто що принесе на свято Міри?"
recording: ls-freunde-feste-aufgabe-01
# Every listening question's right answer competes with something the scene says and drops: a
# time Mira corrects, two offers she turns down, a day the colleague takes back. Never reuse the
# ids aufgabe-warum-absage, aufgabe-wer-bringt-was or aufgabe-wer-sagt-hochzeit: attempts are
# logged under them.
items:
  - id: aufgabe-worum-geht-es
    revision: 2
    rung: gist
    outcomes: [einladen-zusagen-absagen]
    type: audio-comprehension
    instruction:
      en: "In the bakery, a few days before Mira's party: Lena, Mira and a colleague are talking. Listen and choose the answer."
      ru: "В пекарне, за несколько дней до праздника Миры, разговаривают Лена, Мира и их коллега. Прослушайте и выберите ответ."
      uk: "У пекарні, за кілька днів до свята Міри, розмовляють Лена, Міра та їхній колега. Прослухайте й оберіть відповідь."
    question: "Worum geht es in dem Gespräch?"
    options:
      - "Mira lädt zu ihrem Fest ein, und sie sprechen ab, wer kommt und wer was mitbringt."
      - "Mira und ihre Kollegen planen die Hochzeit von Miras Schwester."
      - "Lena lädt Mira zu ihrem Geburtstag ein."
      - "Mira sagt ihr Fest ab, weil sie am Samstag arbeiten muss."
    correct: 0
    translation:
      en: "What is the conversation about?"
      ru: "О чём этот разговор?"
      uk: "Про що ця розмова?"
    explain:
      en: "The first line sets the scene: „Lena, sag mal – ist meine Karte schon angekommen?“ Everything after it answers Mira's invitation — Lena says yes and asks what to bring, the colleague says no and offers another day. A wedding does come up, but it is the colleague's sister's, and it is only his reason for not coming. Mira's sister is in the scene too: she brings the salad."
      ru: "Первая реплика задаёт всю сцену: „Lena, sag mal – ist meine Karte schon angekommen?“ Всё остальное — ответы на приглашение Миры: Лена соглашается и спрашивает, что принести, коллега отказывается и предлагает другой день. Свадьба в разговоре есть, но выходит замуж сестра коллеги, и для него это лишь причина не прийти. Сестра Миры тоже упоминается — она принесёт салат."
      uk: "Перша репліка задає всю сцену: „Lena, sag mal – ist meine Karte schon angekommen?“ Усе інше — відповіді на запрошення Міри: Лена погоджується й питає, що принести, колега відмовляється і пропонує інший день. Весілля в розмові є, але заміж виходить сестра колеги, і для нього це лише причина не прийти. Сестра Міри теж згадується — вона принесе салат."

  - id: aufgabe-wann-beginnt
    rung: detail
    outcomes: [einladen-zusagen-absagen]
    type: audio-comprehension
    instruction:
      en: "Listen for the time of the party."
      ru: "Найдите на слух, во сколько начинается праздник."
      uk: "Знайдіть на слух, о котрій починається свято."
    question: "Wann beginnt Miras Fest?"
    options:
      - "um fünf"
      - "um sechs"
      - "um sieben"
      - "um acht"
    correct: 1
    translation:
      en: "When does Mira's party start?"
      ru: "Во сколько начинается праздник Миры?"
      uk: "О котрій починається свято Міри?"
    explain:
      en: "Mira says sieben first and takes it back at once: „Um sieben … nein, warte – um sechs. Um sechs steht auf der Karte.“ Lena repeats the time she will remember — „Okay, um sechs.“ So sieben is the slip, not the party. Nobody says fünf or acht."
      ru: "Мира сначала говорит sieben и тут же поправляется: „Um sieben … nein, warte – um sechs. Um sechs steht auf der Karte.“ Лена повторяет время, чтобы его запомнить: „Okay, um sechs.“ Значит, sieben — оговорка, а не начало праздника. Fünf и acht не звучат вообще."
      uk: "Міра спершу каже sieben і відразу виправляється: „Um sieben … nein, warte – um sechs. Um sechs steht auf der Karte.“ Лена повторює час, щоб його запам'ятати: „Okay, um sechs.“ Отже, sieben — обмовка, а не початок свята. Fünf і acht не звучать узагалі."

  - id: aufgabe-was-bringt-lena
    rung: detail
    outcomes: [absprachen-aushandeln]
    type: audio-comprehension
    instruction:
      en: "Listen to what Lena offers and what Mira answers."
      ru: "Послушайте, что предлагает Лена и что отвечает Мира."
      uk: "Послухайте, що пропонує Лена і що відповідає Міра."
    question: "Was bringt Lena mit?"
    options:
      - "einen Salat"
      - "einen Käsekuchen"
      - "eine Schokoladentorte"
      - "Getränke"
    correct: 2
    translation:
      en: "What is Lena bringing?"
      ru: "Что принесёт Лена?"
      uk: "Що принесе Лена?"
    explain:
      en: "Lena offers twice, and neither offer stands. The salad is taken: „Salat bringt mir schon meine Schwester.“ The cheesecake gets a polite no, and Mira says what she would rather have: „Lieber eine Torte, wenn das geht. Mit Schokolade!“ Lena agrees to that: „Gut, eine Schokoladentorte. Mach ich.“ Nobody mentions drinks."
      ru: "Лена предлагает дважды, и оба раза мимо. Салат уже занят: „Salat bringt mir schon meine Schwester.“ От чизкейка Мира вежливо отказывается и говорит, чего ей хочется больше: „Lieber eine Torte, wenn das geht. Mit Schokolade!“ На это Лена и соглашается: „Gut, eine Schokoladentorte. Mach ich.“ О напитках никто не говорит."
      uk: "Лена пропонує двічі, і обидва рази невдало. Салат уже зайнятий: „Salat bringt mir schon meine Schwester.“ Від сирника Міра чемно відмовляється і каже, чого їй хочеться більше: „Lieber eine Torte, wenn das geht. Mit Schokolade!“ На це Лена й погоджується: „Gut, eine Schokoladentorte. Mach ich.“ Про напої ніхто не говорить."

  - id: aufgabe-wann-vorbei
    rung: detail
    outcomes: [einladen-zusagen-absagen]
    type: audio-comprehension
    instruction:
      en: "Listen to what the colleague offers instead of Saturday."
      ru: "Послушайте, что коллега предлагает вместо субботы."
      uk: "Послухайте, що колега пропонує замість суботи."
    question: "Wann kommt der Kollege bei Mira vorbei?"
    options:
      - "am Samstagabend"
      - "am Sonntagvormittag"
      - "am Sonntagnachmittag"
      - "am Montag"
    correct: 2
    translation:
      en: "When is the colleague dropping by at Mira's?"
      ru: "Когда коллега зайдёт к Мире?"
      uk: "Коли колега зайде до Міри?"
    explain:
      en: "He names Sonntagvormittag and drops it in the same breath: „… ach nein, da schläfst du sicher noch. Am Nachmittag.“ Am Nachmittag is still Sunday — he has just said Sonntag, and Mira's „Dann bis Sonntag!“ settles it. Saturday is the day he turned down, and nobody mentions Monday."
      ru: "Он называет Sonntagvormittag и тут же от него отказывается: „… ach nein, da schläfst du sicher noch. Am Nachmittag.“ Am Nachmittag — это всё то же воскресенье: Sonntag он только что произнёс, а „Dann bis Sonntag!“ Миры это подтверждает. От субботы он отказался, а понедельник не упоминается вовсе."
      uk: "Він називає Sonntagvormittag і відразу від нього відмовляється: „… ach nein, da schläfst du sicher noch. Am Nachmittag.“ Am Nachmittag — це та сама неділя: Sonntag він щойно вимовив, а „Dann bis Sonntag!“ Міри це підтверджує. Від суботи він відмовився, а про понеділок ніхто не каже."

  - id: aufgabe-dativ-pronomen
    revision: 2
    rung: form
    outcomes: [absprachen-aushandeln]
    type: cloze
    focus: dativ-pronomen
    instruction:
      en: "Three lines from the conversation. Fill in the dative pronoun you heard."
      ru: "Три реплики из разговора. Вставьте местоимение в Dativ, которое вы услышали."
      uk: "Три репліки з розмови. Вставте займенник у Dativ, який ви почули."
    text: "Lena fragt Mira: „Soll ich {{dir}} was mitbringen?“ Mira antwortet: „Salat bringt {{mir}} schon meine Schwester.“ Der Kollege sagt über seine Schwester: „… und ich helfe {{ihr}} den ganzen Tag.“"
    translation:
      en: "Lena asks Mira: “Shall I bring you anything?” Mira answers: “My sister is already bringing me a salad.” The colleague says about his sister: “… and I'm helping her all day.”"
      ru: "Лена спрашивает Миру: «Тебе что-нибудь принести?» Мира отвечает: «Салат мне уже принесёт сестра». Коллега говорит о своей сестре: «… и я весь день ей помогаю»."
      uk: "Лена питає Міру: «Тобі щось принести?» Міра відповідає: «Салат мені вже принесе сестра». Колега каже про свою сестру: «… і я цілий день їй допомагаю»."
    explain:
      en: "Three people receive something, seen from three places. Lena speaks to Mira: dir. Mira speaks about herself: mir — the salad is what gets brought, so it takes the accusative and the person it goes to takes the dative. The colleague speaks about his sister: ihr, not sie. helfen takes a dative person even with no thing beside it, so it is ich helfe ihr, never ich helfe sie."
      ru: "Трое что-то получают, и видно их с трёх точек. Лена обращается к Мире — dir. Мира говорит о себе — mir: салат — это то, что приносят, он в Akkusativ, а тот, кому приносят, — в Dativ. Коллега говорит о сестре — ihr, а не sie. helfen требует Dativ даже без всякого предмета рядом: ich helfe ihr, но никогда ich helfe sie. По-русски «помогать ей» тоже дательный, так что здесь русская интуиция подсказывает верно."
      uk: "Троє щось отримують, і видно їх із трьох місць. Лена звертається до Міри — dir. Міра говорить про себе — mir: салат — це те, що приносять, він в Akkusativ, а той, кому приносять, — у Dativ. Колега говорить про сестру — ihr, а не sie. helfen вимагає Dativ навіть без жодного предмета поруч: ich helfe ihr, але ніколи ich helfe sie. Українською «допомагати їй» теж давальний, тож тут рідна мова підказує правильно."

  - id: aufgabe-absage-vorbeikommen
    rung: reply
    outcomes: [einladen-zusagen-absagen]
    type: translate
    focus: trennbar-wortstellung
    instruction:
      en: "Mira invites you to her party too. Turn Saturday down and offer Sunday, the way her colleague did. Use vorbeikommen."
      ru: "Мира приглашает на праздник и вас. Откажитесь от субботы и предложите воскресенье, как это сделал её коллега. Используйте vorbeikommen."
      uk: "Міра запрошує на свято і вас. Відмовтеся від суботи й запропонуйте неділю, як це зробив її колега. Використайте vorbeikommen."
    prompt_en: "Unfortunately I can't make Saturday, but I'll drop by your place on Sunday."
    prompt_ru: "В субботу я, к сожалению, не могу, но в воскресенье зайду к тебе."
    prompt_uk: "У суботу я, на жаль, не можу, але в неділю зайду до тебе."
    answer: "Leider kann ich am Samstag nicht, aber am Sonntag komme ich bei dir vorbei."
    # Both ends of the separable verb are pinned: komme in position 2, vorbei at the clause end.
    # The first clause may open with Leider, Am Samstag or Ich and may close with kommen; the
    # second may open with am Sonntag or ich. Neither choice is what the tag grades.
    key_tokens: ["komme", "vorbei"]
    accept:
      - "Leider kann ich am Samstag nicht, aber ich komme am Sonntag bei dir vorbei."
      - "Leider kann ich am Samstag nicht kommen, aber am Sonntag komme ich bei dir vorbei."
      - "Leider kann ich am Samstag nicht kommen, aber ich komme am Sonntag bei dir vorbei."
      - "Am Samstag kann ich leider nicht, aber am Sonntag komme ich bei dir vorbei."
      - "Am Samstag kann ich leider nicht, aber ich komme am Sonntag bei dir vorbei."
      - "Am Samstag kann ich leider nicht kommen, aber am Sonntag komme ich bei dir vorbei."
      - "Am Samstag kann ich leider nicht kommen, aber ich komme am Sonntag bei dir vorbei."
      - "Ich kann am Samstag leider nicht, aber am Sonntag komme ich bei dir vorbei."
      - "Ich kann am Samstag leider nicht, aber ich komme am Sonntag bei dir vorbei."
      - "Ich kann am Samstag leider nicht kommen, aber am Sonntag komme ich bei dir vorbei."
      - "Ich kann am Samstag leider nicht kommen, aber ich komme am Sonntag bei dir vorbei."
    explain:
      en: "The second half is the colleague's own sentence, made yours. vorbeikommen is separable and has no modal beside it here, so it splits: komme stays in position 2 — after am Sonntag or after ich — and vorbei goes to the very end, behind bei dir. The first half needs no verb of its own: Leider kann ich am Samstag nicht is complete German, and nicht kommen says the same."
      ru: "Вторая половина — это фраза коллеги, только уже ваша. vorbeikommen — отделяемый глагол, и модального рядом нет, поэтому он распадается: komme остаётся на втором месте (после am Sonntag или после ich), а vorbei уходит в самый конец, за bei dir. Первой половине собственный глагол не нужен: Leider kann ich am Samstag nicht — законченное немецкое предложение, и nicht kommen значит то же самое."
      uk: "Друга половина — це речення колеги, тільки вже ваше. vorbeikommen — відокремлюване дієслово, і модального поруч немає, тому воно розпадається: komme лишається на другому місці (після am Sonntag або після ich), а vorbei іде в самий кінець, за bei dir. Першій половині власне дієслово не потрібне: Leider kann ich am Samstag nicht — завершене німецьке речення, і nicht kommen означає те саме."
