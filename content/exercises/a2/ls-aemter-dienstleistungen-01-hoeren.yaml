    en: The registration is called free in the sentence immediately before the price.
      Two facts in one line, and the wrong answer is the one you keep if you stop
      at the number.
    ru: Регистрация названа бесплатной в предложении прямо перед ценой. Два факта
      в одной реплике, и неверный ответ остаётся у того, кто остановился на числе.
    uk: 'Реєстрацію названо безкоштовною в реченні просто перед ціною. Два факти в одній репліці, і хибну відповідь залишає собі той, хто зупинився на числі.'
