    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Auf wen wartet Lu am Bahnhof?
  options:
  - Auf ihre Schwester.
  - Auf ihre Lehrerin.
  - Auf den Urlaub.
  correct: 0
  explain:
    en: The question changes from worauf to auf wen — from a thing to a person — and "Auf den Urlaub" answers the previous question. That switch is what
      this recording is for.
    ru: Вопрос меняется с worauf на auf wen — с вещи на человека, — а «Auf den Urlaub» отвечает на предыдущий вопрос. Ради этого перехода запись и сделана.
    uk: 'Запитання змінюється з worauf на auf wen — з речі на людину, — а «Auf den Urlaub» відповідає на попереднє запитання. Заради цього переходу запис і зроблено.'
