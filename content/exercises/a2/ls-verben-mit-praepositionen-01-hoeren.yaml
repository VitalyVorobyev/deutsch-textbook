topic: verben-mit-praepositionen
role: practice
title:
  en: Worries and things to look forward to
  ru: Тревоги и то, чего ждёшь
  uk: 'Тривоги і те, чого чекаєш'
items:
- id: q1
  outcomes:
  - person-sache-unterscheiden
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Sami
      text: Du wirkst müde. Worüber denkst du so viel nach?
    - speaker: Lu
      text: Ich denke an meine Prüfung. Ich habe Angst vor dem mündlichen Teil.
    - speaker: Sami
      text: Davor hatte ich auch Angst. Sprichst du mit deiner Lehrerin darüber?
    - speaker: Lu
      text: Noch nicht. Aber ich freue mich auf die Zeit danach.
    - speaker: Sami
      text: Worauf freust du dich am meisten?
    - speaker: Lu
      text: Auf den Urlaub. Ich warte seit Monaten darauf.
    - speaker: Sami
      text: Und auf wen wartest du am Bahnhof, wenn du fährst?
    - speaker: Lu
      text: Auf meine Schwester. Sie kommt aus Wien mit.
    - speaker: Sami
      text: Dann kümmere dich jetzt nur um die Prüfung. Um alles andere kümmern wir
        uns später.
  recording: ls-verben-mit-praepositionen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wovor hat Lu Angst?
  options:
  - Vor dem mündlichen Teil der Prüfung.
  - Vor der Reise nach Wien.
  - Vor dem Gespräch mit der Lehrerin.
  correct: 0
  explain:
    en: Talking to the teacher is suggested, not feared, and Vienna belongs to the
      sister. Angst vor names one thing only, and it is said in the same line as the
      exam.
    ru: Разговор с учительницей предлагают, а не боятся его, а Вена относится к сестре.
      Angst vor называет только одно, и звучит это в той же реплике, что и экзамен.
    uk: 'Розмову з учителькою пропонують, а не бояться її, а Відень стосується сестри. Angst vor називає лише одне, і звучить це в тій самій репліці, що й іспит.'
  max_replays: 3
