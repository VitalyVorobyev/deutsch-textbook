topic: freunde-feste
role: practice
stage: transfer
activity: application
title_de: "Im Gruppenchat: Einladung, Absprachen, neue Pläne"
title:
  en: "In the group chat: an invitation, who brings what, a change of plan"
  ru: "В групповом чате: приглашение, кто что принесёт, планы меняются"
  uk: "У груповому чаті: запрошення, хто що принесе, плани змінюються"
items:
  - id: cloze-sich-freuen-treffen
    outcomes: [einladen-zusagen-absagen]
    type: cloze
    focus: reflexiv-akkusativ
    instruction:
      en: "Anna's friends answer the invitation. Fill in the reflexive pronoun."
      ru: "Друзья Анны отвечают на приглашение. Вставьте возвратное местоимение."
      uk: "Друзі Анни відповідають на запрошення. Вставте зворотний займенник."
    text: "Yusuf schreibt: „Ich freue {{mich}} auf die Party!“ Nina antwortet: „Wir treffen {{uns}} um acht bei Anna.“ Anna freut {{sich}} über die Geschenke. Und du? Freust du {{dich}} auch?"
    translation:
      en: "Yusuf writes: “I'm looking forward to the party!” Nina replies: “We're meeting at eight at Anna's.” Anna is delighted with the presents. And you? Are you looking forward to it too?"
      ru: "Юсуф пишет: «Жду вечеринку с нетерпением!» Нина отвечает: «Встречаемся в восемь у Анны». Анна радуется подаркам. А ты? Ты тоже ждёшь с нетерпением?"
      uk: "Юсуф пише: «Чекаю на вечірку з нетерпінням!» Ніна відповідає: «Зустрічаємося о восьмій в Анни». Анна радіє подарункам. А ти? Ти теж чекаєш із нетерпінням?"
    explain:
      en: "In the reflexive freuen frames tested here, the pronoun agrees with the subject and is required: mich for ich, dich for du, sich for er/sie, uns for wir. sich freuen auf expresses anticipation of the party; sich freuen über expresses pleasure about the presents as a fact or experience. Both prepositions take the accusative in these frames."
      ru: "В проверяемых здесь возвратных моделях с freuen местоимение согласуется с подлежащим и обязательно: mich при ich, dich при du, sich при er/sie, uns при wir. sich freuen auf выражает предвкушение вечеринки, а sich freuen über — радость по поводу подарков как уже реального факта или переживания. Оба предлога в этих моделях требуют Akkusativ."
      uk: "У перевірюваних тут зворотних моделях із freuen займенник узгоджується з підметом і є обов'язковим: mich при ich, dich при du, sich при er/sie, uns при wir. sich freuen auf виражає передчуття вечірки, а sich freuen über — радість із приводу подарунків як уже реального факту чи досвіду. Обидва прийменники в цих моделях вимагають Akkusativ."

  - id: uebersetzen-absprache-chat
    outcomes: [absprachen-aushandeln]
    type: translate
    focus: dativ-pronomen
    instruction:
      en: "Translate into German. You are settling who brings what, in the chat."
      ru: "Переведите на немецкий. Вы договариваетесь в чате, кто что приносит."
      uk: "Перекладіть німецькою. Ви домовляєтеся в чаті, хто що приносить."
    prompt_en: "Can you bring me a salad? I'll bring you the drinks."
    prompt_ru: "Ты можешь принести мне салат? А я принесу тебе напитки."
    prompt_uk: "Ти можеш принести мені салат? А я принесу тобі напої."
    answer: "Kannst du mir einen Salat mitbringen? Ich bringe dir die Getränke mit."
    revision: 2
    key_tokens: ["mir", "dir"]
    accept:
      - "Kannst du mir bitte einen Salat mitbringen? Ich bringe dir die Getränke mit."
      # The RU prompt opens its second sentence with «А …», so `Und ich bringe …` renders
      # it faithfully; and Russian has no article, so «салат» licenses `den Salat` too.
      - "Kannst du mir einen Salat mitbringen? Und ich bringe dir die Getränke mit."
      - "Kannst du mir bitte einen Salat mitbringen? Und ich bringe dir die Getränke mit."
      - "Kannst du mir den Salat mitbringen? Ich bringe dir die Getränke mit."
      - "Kannst du mir den Salat mitbringen? Und ich bringe dir die Getränke mit."
      # «принесу тебе» / "I'll bring you" is plain bringen; mit only adds "along".
      - "Kannst du mir einen Salat mitbringen? Ich bringe dir die Getränke."
      - "Kannst du mir einen Salat mitbringen? Und ich bringe dir die Getränke."
      - "Kannst du mir den Salat mitbringen? Ich bringe dir die Getränke."
      - "Kannst du mir den Salat mitbringen? Und ich bringe dir die Getränke."
    explain:
      en: "Two sentences and two shapes of the same verb. The first has a modal, so mitbringen stays whole at the end and kannst opens the question. The second has none, so the verb splits: bringe in position 2, mit at the very end (plain bringe dir die Getränke is good German too; mit only adds \"along\"). Through both of them the person keeps the same slot and the same case — mir when the salad comes to me, dir when the drinks go to you. Neither is mich or dich: the accusative belongs to the thing, and it is already taken."
      ru: "Два предложения — две формы одного глагола. В первом есть модальный, поэтому mitbringen остаётся целым в конце, а вопрос открывает kannst. Во втором модального нет, и глагол распадается: bringe на втором месте, mit в самом конце (просто bringe dir die Getränke — тоже правильный немецкий; mit лишь добавляет «с собой»). И в том и в другом человек сохраняет и своё место, и свой падеж: mir — когда салат несут мне, dir — когда напитки достаются тебе. Ни в коем случае не mich и не dich: Akkusativ принадлежит предмету, и он уже занят."
      uk: "Два речення — дві форми одного дієслова. У першому є модальне, тому mitbringen залишається цілим у кінці, а питання відкриває kannst. У другому модального немає, і дієслово розпадається: bringe на другому місці, mit у самому кінці (просто bringe dir die Getränke — теж правильна німецька; mit лише додає «із собою»). І в тому і в іншому людина зберігає і своє місце, і свій відмінок: mir — коли салат несуть мені, dir — коли напої дістаються тобі. У жодному разі не mich і не dich: Akkusativ належить предмету, і він уже зайнятий."

  - id: cloze-plan-aendert-sich
    outcomes: [absprachen-aushandeln, einladen-zusagen-absagen]
    type: cloze
    focus: aber-sondern
    instruction:
      en: "The plan keeps changing in the chat. Fill in aber or sondern."
      ru: "План в чате всё время меняется. Вставьте aber или sondern."
      uk: "План у чаті весь час змінюється. Вставте aber або sondern."
    text: "Anna schreibt: „Wir feiern nicht bei mir, {{sondern}} bei Yusuf.“ Nina antwortet: „Gern, {{aber}} ich komme erst um neun.“ Yusuf schreibt: „Ich bringe keine Getränke mit, {{sondern}} eine Torte.“ Tom schreibt: „Ich habe keine Zeit, {{aber}} ich rufe dich am Sonntag an.“"
    translation:
      en: "Anna writes: “We're not celebrating at my place, but at Yusuf's.” Nina replies: “Gladly, but I won't get there until nine.” Yusuf writes: “I'm not bringing drinks, but a cake.” Tom writes: “I haven't got time, but I'll call you on Sunday.”"
      ru: "Анна пишет: «Празднуем не у меня, а у Юсуфа». Нина отвечает: «С удовольствием, но приду только к девяти». Юсуф пишет: «Напитки я не принесу, а принесу торт». Том пишет: «У меня нет времени, но я позвоню тебе в воскресенье»."
      uk: "Анна пише: «Святкуємо не в мене, а в Юсуфа». Ніна відповідає: «Із задоволенням, але прийду тільки до дев'ятої». Юсуф пише: «Напої я не принесу, а принесу торт». Том пише: «У мене немає часу, але я подзвоню тобі в неділю»."
    explain:
      en: "Three of the four first halves contain a negation, and only two of them are corrected by what follows. Anna denies her flat and names another one instead — bei Yusuf takes the place of bei mir, so it is sondern. Yusuf denies the drinks and names the cake instead — same move, same word. Tom is the trap: he does say keine Zeit, but the phone call does not replace the time he hasn't got. He still isn't coming; the call is simply added on top. Two things side by side, both true: aber. Nina's line has no negation at all, so the question never even arises. The rule is not 'negation → sondern'. It is: does the second half step into the place the first half emptied?"
      ru: "В трёх первых половинах из четырёх стоит отрицание, но исправляет его только вторая половина в двух случаях. Анна отвергает свою квартиру и называет другую: bei Yusuf занимает место bei mir — значит, sondern. Юсуф отвергает напитки и называет вместо них торт — тот же ход, то же слово. Том — ловушка: keine Zeit он действительно говорит, но звонок не заменяет то время, которого у него нет. Прийти он всё равно не сможет, а звонок просто добавляется сверху. Две вещи стоят рядом, и обе верны: aber. А в реплике Нины отрицания нет вовсе, так что вопрос и не возникает. Правило звучит не как «есть отрицание — ставь sondern», а так: встаёт ли вторая половина на то место, которое освободила первая?"
      uk: "У трьох перших половинах із чотирьох стоїть заперечення, але виправляє його друга половина лише у двох випадках. Анна відкидає свою квартиру і називає іншу: bei Yusuf займає місце bei mir — значить, sondern. Юсуф відкидає напої і називає замість них торт — той самий хід, те саме слово. Том — пастка: keine Zeit він справді каже, але дзвінок не замінює той час, якого в нього немає. Прийти він усе одно не зможе, а дзвінок просто додається зверху. Дві речі стоять поряд, і обидві правдиві: aber. А в репліці Ніни заперечення немає зовсім, тож питання й не виникає. Правило звучить не як «є заперечення — став sondern», а так: чи стає друга половина на те місце, яке звільнила перша?"

  - id: uebersetzen-aber-sondern-chat
    revision: 5
    outcomes: [absprachen-aushandeln]
    type: translate
    focus: aber-sondern
    instruction:
      en: "Translate into German. You are correcting one detail of the plan and adding one condition of your own."
      ru: "Переведите на немецкий. Одну деталь плана вы исправляете, одно условие добавляете от себя."
      uk: "Перекладіть німецькою. Одну деталь плану ви виправляєте, одну умову додаєте від себе."
    prompt_en: "We aren't meeting at eight, but at nine. I'll bring the drinks, but no cake."
    prompt_ru: "Встречаемся не в восемь, а в девять. Напитки я принесу, но торт — нет."
    prompt_uk: "Зустрічаємося не о восьмій, а о дев'ятій. Напої я принесу, але торт — ні."
    answer: "Wir treffen uns nicht um acht, sondern um neun. Ich bringe die Getränke mit, aber keinen Kuchen."
    key_tokens: ["sondern", "aber"]
    # aber den Kuchen nicht is the literal shape of the RU prompt («но торт — нет») and
    # correct German ellipsis; kein vs nicht is not what this tag grades. Its uncontracted
    # expansion is equally valid and paired here.
    accept:
      - "Wir treffen uns nicht um acht, sondern um neun. Ich bringe die Getränke mit, aber ich bringe keinen Kuchen mit."
      - "Wir treffen uns nicht um acht, sondern um neun. Ich bringe die Getränke mit, aber den Kuchen nicht."
      - "Wir treffen uns nicht um acht, sondern um neun. Ich bringe die Getränke mit, aber ich bringe den Kuchen nicht mit."
      - "Wir treffen uns nicht um acht, sondern um neun. Ich nehme die Getränke mit, aber die Torte nicht."
      - "Wir treffen uns nicht um acht Uhr, sondern um neun Uhr. Ich bringe die Getränke mit, aber nicht die Torte."
      - "Wir treffen uns nicht um acht, sondern um neun. Ich bringe die Getränke mit, aber nicht die Torte."
      - "Wir treffen uns nicht um acht, sondern um neun. Ich bringe die Getränke mit, aber die Torte nicht."
      - "Wir treffen uns nicht um acht, sondern um neun. Ich bringe die Getränke mit, aber nicht den Kuchen."
    explain:
      en: "One sentence of each kind, and the second one is where the rule is really tested. In the first, nicht um acht is denied and um neun steps straight into its place — a replacement, so sondern. In the second there is a negation too — keinen Kuchen — but look at where it sits: it comes after the connector, not before it. Nothing in the first half was denied for the cake to replace; the drinks and the missing cake simply stand side by side, and both are true. That is aber. The word to check is never the negation itself but what it is doing: sondern needs a negation in front of it that the following words correct."
      ru: "По одному предложению каждого типа — и по-настоящему правило проверяется во втором. В первом отрицается nicht um acht, а um neun сразу встаёт на освободившееся место: это замена, значит sondern. Во втором отрицание тоже есть — keinen Kuchen, — но посмотрите, где оно стоит: после союза, а не перед ним. В первой половине ничего не отвергнуто, и торту нечего замещать; напитки и отсутствующий торт просто стоят рядом, и то и другое верно. Это aber. Смотреть надо не на само отрицание, а на то, что оно делает: для sondern нужно отрицание перед союзом, которое последующие слова исправляют."
      uk: "По одному реченню кожного типу — і по-справжньому правило перевіряється в другому. У першому заперечується nicht um acht, а um neun одразу стає на звільнене місце: це заміна, значить sondern. У другому заперечення теж є — keinen Kuchen, — але подивіться, де воно стоїть: після сполучника, а не перед ним. У першій половині нічого не відкинуто, і тортові нема чого заміщувати; напої і відсутній торт просто стоять поряд, і те й інше правдиве. Це aber. Дивитися треба не на саме заперечення, а на те, що воно робить: для sondern потрібне заперечення перед сполучником, яке наступні слова виправляють."

  - id: uebersetzen-transfer-blumen-karte
    outcomes: [absprachen-aushandeln]
    type: translate
    focus: wechsel-akk-dat
    # The transfer check of the lesson cycle, and the only free-production item in this
    # topic whose sentence is not a rehearsal of one the learner has already met: every
    # other translate answer here also appears in the article, the reading or a flashcard.
    # New person (Clara appears nowhere else in the course), new objects, same rule — and
    # both halves are two-object sentences: a noun person in the first, a pronoun person
    # in the second.
    instruction:
      en: "Translate into German. Nothing here has come up in the exercises before — build it from the rule, not from memory."
      ru: "Переведите на немецкий. Ничего из этого в упражнениях ещё не встречалось — стройте по правилу, а не по памяти."
      uk: "Перекладіть німецькою. Нічого з цього у вправах ще не траплялося — будуйте за правилом, а не за пам'яттю."
    prompt_en: "Clara is bringing her brother flowers and writing him a card."
    # revision 2: the name is written as German writes it — «Клара» is Clara or Klara alike.
    prompt_ru: "Clara принесёт своему брату цветы и напишет ему открытку."
    prompt_uk: "Clara принесе своєму братові квіти і напише йому листівку."
    revision: 2
    answer: "Clara bringt ihrem Bruder Blumen mit und schreibt ihm eine Karte."
    key_tokens: ["ihrem", "ihm"]
    accept:
      - "Clara bringt ihrem Bruder Blumen mit und sie schreibt ihm eine Karte."
      - "Clara bringt ihrem Bruder Blumen mit und schreibt ihm die Karte."
      - "Clara bringt ihrem Bruder Blumen mit und sie schreibt ihm die Karte."
      # revision 2: «принесёт» is bringen as much as mitbringen, and «цветы» marks no
      # definiteness; neither touches ihrem and ihm, which are what wechsel-akk-dat grades.
      - "Clara bringt ihrem Bruder Blumen und schreibt ihm eine Karte."
      - "Clara bringt ihrem Bruder die Blumen und schreibt ihm eine Karte."
      - "Clara bringt ihrem Bruder die Blumen mit und schreibt ihm eine Karte."
    explain:
      en: "Two two-object sentences in one line, and each shows a different half of the rule. In the first, both objects are nouns: the person goes into the Dativ and comes first — ihrem Bruder — and Blumen, the thing, follows in the Akkusativ (a bare plural, so nothing on it changes). In the second the person is a pronoun, ihm, and a pronoun goes in front of a noun object — so it stands before eine Karte. Neither ihn nor ihr: the brother is masculine and he is the one receiving, which is the Dativ, and for er that is ihm. And the separable mit closes the first clause, behind the flowers."
      ru: "Две конструкции с двумя дополнениями в одной строке, и каждая показывает свою половину правила. В первой оба дополнения — существительные: человек стоит в Dativ и идёт первым (ihrem Bruder), а предмет, Blumen, следует за ним в Akkusativ (голое множественное число — там ничего не меняется). Во второй человек выражен местоимением ihm, а местоимение идёт впереди дополнения-существительного, поэтому стоит перед eine Karte. Не ihn и не ihr: брат — мужского рода и он получает, а это Dativ, и для er это ihm. Отделяемая приставка mit при этом закрывает первую часть — уже за цветами."
      uk: "Дві конструкції з двома додатками в одному рядку, і кожна показує свою половину правила. У першій обидва додатки — іменники: людина стоїть у Dativ і йде першою (ihrem Bruder), а предмет, Blumen, іде за нею в Akkusativ (голе множинне число — там нічого не змінюється). У другій людину виражено займенником ihm, а займенник іде попереду додатка-іменника, тому стоїть перед eine Karte. Не ihn і не ihr: брат — чоловічого роду і він отримує, а це Dativ, і для er це ihm. Відокремлюваний префікс mit при цьому закриває першу частину — уже за квітами."

  # The verified half of `einladung-schreiben`. The outcome was carried by the `write` item
  # below and by nothing else — and a `write` logs unverified practice evidence by design, so
  # the outcome could never light up. The lesson claimed "I can write a short invitation" and
  # then measured it with the one item type that is never scored. This translate grades the
  # same competence in a form that counts.
  - id: uebersetzen-einladung-hochzeit
    outcomes: [einladung-schreiben, einladen-zusagen-absagen]
    type: translate
    focus: trennbar-wortstellung
    instruction:
      en: "You are writing the invitation yourself, in the group chat. Translate it into German."
      ru: "Приглашение вы пишете сами, в групповом чате. Переведите его на немецкий."
      uk: "Запрошення ви пишете самі, у груповому чаті. Перекладіть його німецькою."
    prompt_en: "I am inviting you to my wedding. We are celebrating on Saturday at eight."
    prompt_ru: "Приглашаю тебя на свою свадьбу. Празднуем в субботу в восемь."
    prompt_uk: "Запрошую тебе на своє весілля. Святкуємо в суботу о восьмій."
    answer: "Ich lade dich zu meiner Hochzeit ein. Wir feiern am Samstag um acht."
    accept:
      - "Ich lade dich zu meiner Hochzeit ein. Wir feiern am Samstag um acht Uhr."
    key_tokens: ["lade", "ein"]
    explain:
      en: "An invitation is built on einladen, and einladen is separable — so the moment it becomes the conjugated verb of the clause, it breaks in half. lade takes position 2, and the prefix ein falls to the very end, behind the person and behind the whole zu-phrase: Ich lade dich zu meiner Hochzeit ein. There are two ways to get this wrong and both are common. Ich einlade dich … keeps the verb in one piece, and that is no German sentence at all. Ich lade dich zu meiner Hochzeit — stopping before the ein — is worse, because it is a sentence that exists and means something else: laden on its own is to load. The prefix carries the meaning, and it is the last word you write. Two smaller checks: einladen takes the accusative for the person invited, so it is dich and never dir, and zu is one of the fixed dative prepositions, which is what turns the wedding into zu meiner Hochzeit."
      ru: "Приглашение строится на глаголе einladen, а einladen — отделяемый: как только он становится спрягаемым сказуемым, он разламывается надвое. lade занимает второе место, а приставка ein падает в самый конец — за человека и за всю группу с zu: Ich lade dich zu meiner Hochzeit ein. Ошибиться можно двумя способами, и оба частые. Ich einlade dich … оставляет глагол целым — такого немецкого предложения попросту нет. А Ich lade dich zu meiner Hochzeit, оборванное перед ein, даже хуже: это существующее предложение, только значит оно другое — laden сам по себе означает «грузить». Смысл несёт приставка, и пишется она последним словом. По-русски приставка приклеена к глаголу намертво, поэтому конец фразы так легко потерять. Ещё две мелочи: einladen требует Akkusativ для приглашаемого — dich, а не dir; а zu входит в число предлогов, всегда требующих Dativ, отсюда zu meiner Hochzeit."
      uk: "Запрошення будується на дієслові einladen, а einladen — відокремлюване: щойно воно стає відмінюваним присудком, воно розламується надвоє. lade займає друге місце, а префікс ein падає в самий кінець — за людину і за всю групу з zu: Ich lade dich zu meiner Hochzeit ein. Помилитися можна двома способами, і обидва часті. Ich einlade dich … залишає дієслово цілим — такого німецького речення просто немає. А Ich lade dich zu meiner Hochzeit, обірване перед ein, навіть гірше: це наявне речення, тільки значить воно інше — laden саме по собі означає «вантажити». Зміст несе префікс, і пишеться він останнім словом. Українською префікс приклеєний до дієслова намертво, тому кінець фрази так легко втратити. Ще дві дрібниці: einladen вимагає Akkusativ для запрошуваного — dich, а не dir; а zu входить до числа прийменників, що завжди вимагають Dativ, звідси zu meiner Hochzeit."
