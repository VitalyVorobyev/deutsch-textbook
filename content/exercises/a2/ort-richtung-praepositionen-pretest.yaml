topic: ort-richtung-praepositionen
role: pretest
title:
  en: "Pretest — where to, where, where from"
  ru: "Предтест — куда, где, откуда"
  uk: "Претест — куди, де, звідки"
items:
  - id: pretest-auf-den-markt
    outcomes: [ziel-nennen]
    type: cloze
    focus: wohin-wo-woher
    instruction:
      en: "Guess. You have not learnt this yet — a wrong guess here is worth more than a right one later."
      ru: "Угадывайте. Вы этого ещё не проходили: неверная догадка сейчас полезнее правильного ответа потом."
      uk: "Вгадуйте. Ви цього ще не проходили: неправильний здогад зараз корисніший за правильну відповідь потім."
    text: "Am Samstag gehe ich {{auf den}} Markt."
    translation:
      en: "On Saturday I go to the market."
      ru: "В субботу я иду на рынок."
      uk: "У суботу я йду на ринок."
    explain:
      en: "A market is an open square, and an open square takes auf. The phrase names a destination, so auf goes with the accusative: auf den Markt. The position form is auf dem Markt."
      ru: "Рынок — открытая площадка, а открытая площадка берёт auf. Группа называет цель, поэтому auf идёт с Akkusativ: auf den Markt. Форма места — auf dem Markt."
      uk: "Ринок — відкритий майданчик, а відкритий майданчик бере auf. Група називає ціль, тому auf іде з Akkusativ: auf den Markt. Форма місця — auf dem Markt."

  - id: pretest-aus-der-schule
    outcomes: [herkunft-nennen]
    type: mc
    focus: wohin-wo-woher
    instruction:
      en: "Guess which form says where somebody has come from."
      ru: "Угадайте, какая форма говорит, откуда человек пришёл."
      uk: "Вгадайте, яка форма каже, звідки людина прийшла."
    prompt: "Um eins kommt mein Sohn ___ Schule."
    options: ["aus der", "von der", "aus die"]
    correct: 0
    translation:
      en: "At one my son comes out of school."
      ru: "В час мой сын выходит из школы."
      uk: "О першій мій син виходить зі школи."
    explain:
      en: "A school is a building you are inside, so the origin is aus, and aus takes the dative: aus der Schule. von is the origin form for people, squares and events."
      ru: "Школа — здание, внутри которого находятся, поэтому исходная точка передаётся через aus, а aus требует Dativ: aus der Schule. Предлог von остаётся за людьми, площадками и мероприятиями."
      uk: "Школа — будівля, всередині якої перебувають, тому вихідна точка передається через aus, а aus вимагає Dativ: aus der Schule. Прийменник von лишається за людьми, майданчиками та заходами."

  - id: pretest-zum-arzt
    outcomes: [ziel-nennen]
    type: mc
    focus: wohin-wo-woher
    instruction:
      en: "Guess which form fits."
      ru: "Угадайте, какая форма подходит."
      uk: "Вгадайте, яка форма підходить."
    prompt: "Mein Kopf tut weh. Ich gehe ___ Arzt."
    options: ["zum", "in den", "beim"]
    correct: 0
    translation:
      en: "My head hurts. I am going to the doctor."
      ru: "У меня болит голова. Я иду к врачу."
      uk: "У мене болить голова. Я йду до лікаря."
    explain:
      en: "A person is a destination as a point, so it takes zu + Dativ, contracted to zum. in den Arzt would make the doctor a room, and beim Arzt says where you already are."
      ru: "Человек — это цель-точка, поэтому нужен zu + Dativ, в слитной форме zum. Вариант in den Arzt превратил бы врача в помещение, а beim Arzt говорит, где вы уже находитесь."
      uk: "Людина — це ціль-точка, тому потрібен zu + Dativ, у злитій формі zum. Варіант in den Arzt перетворив би лікаря на приміщення, а beim Arzt каже, де ви вже перебуваєте."
