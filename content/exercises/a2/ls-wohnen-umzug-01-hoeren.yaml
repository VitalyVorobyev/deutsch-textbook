topic: wohnen-umzug
role: practice
title:
  en: Arranging a moving day
  ru: Договариваются о дне переезда
  uk: 'Домовляються про день переїзду'
items:
- id: q1
  outcomes:
  - nachbarn-bitte
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Herr Yilmaz
      text: Guten Tag Frau Dorn, ich ziehe am Samstag um. Ich wollte kurz Bescheid
        sagen.
    - speaker: Frau Dorn
      text: Danke, das ist nett. Wann kommt der Wagen?
    - speaker: Herr Yilmaz
      text: Gegen acht Uhr morgens. Könnten Sie Ihr Auto vor dem Haus wegfahren?
    - speaker: Frau Dorn
      text: Natürlich. Ich stelle es am Freitagabend in die Seitenstraße.
    - speaker: Herr Yilmaz
      text: Vielen Dank. Wir brauchen den Platz nur bis Mittag.
    - speaker: Frau Dorn
      text: Und der Aufzug? Der ist oft besetzt.
    - speaker: Herr Yilmaz
      text: Den habe ich für Samstag reserviert, von acht bis zwölf.
    - speaker: Frau Dorn
      text: Sehr gut. Sagen Sie Bescheid, wenn Sie noch Hilfe brauchen.
    - speaker: Herr Yilmaz
      text: Das ist lieb. Am Nachmittag wird es sicher ruhiger.
    - speaker: Frau Dorn
      text: Ich bin ab zehn zu Hause und kann Ihnen Kaffee kochen.
  recording: ls-wohnen-umzug-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Worum bittet Herr Yilmaz seine Nachbarin?
  options:
  - Ihr Auto wegzufahren.
  - Den Aufzug zu reservieren.
  - Beim Tragen zu helfen.
  correct: 0
  explain:
    en: The lift really is reserved and help really is offered — but he reserved the
      lift himself, and the help is her idea, not his request. Only one thing in the
      conversation is something he asks her to do.
    ru: Лифт действительно забронирован, и помощь действительно предложена — но лифт
      он забронировал сам, а помощь предлагает она, а не просит он. Просьба во всём
      разговоре только одна.
    uk: 'Ліфт справді заброньовано, і допомогу справді запропоновано — але ліфт він забронював сам, а допомогу пропонує вона, а не просить він. Прохання в усій розмові лише одне.'
  max_replays: 3
