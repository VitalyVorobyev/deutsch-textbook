    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wie lange ist der Aufzug reserviert?
  options:
  - Von acht bis zwölf Uhr.
  - Von acht bis zehn Uhr.
  - Den ganzen Samstag.
  correct: 0
  explain:
    en: Ten o'clock is said too, but it is when the neighbour gets home. Four times
      circulate in this dialogue and each belongs to a different arrangement.
    ru: Десять часов тоже звучит, но это время, когда соседка будет дома. В диалоге
      ходят четыре времени, и каждое относится к своей договорённости.
    uk: 'Десята година теж звучить, але це час, коли сусідка буде вдома. У діалозі ходять чотири часові позначки, і кожна належить своїй домовленості.'
  max_replays: 3
