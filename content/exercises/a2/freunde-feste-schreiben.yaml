topic: freunde-feste
role: practice
stage: transfer
activity: task
skill: schreiben
title_de: "Eine Einladung zu deiner Party"
title:
  en: "An invitation to your party"
  ru: "Приглашение на вашу вечеринку"
  uk: "Запрошення на вашу вечірку"
items:
  - id: schreiben-einladung
    revision: 2
    outcomes: [einladung-schreiben, absprachen-aushandeln]
    type: write
    prompt:
      en: "It is your birthday on Saturday and you are having a party at your flat. Write a short invitation to your friends in the group chat: say what you are celebrating, when and where, ask them to come, and settle who brings what."
      ru: "В субботу у вас день рождения, и вы устраиваете вечеринку у себя дома. Напишите короткое приглашение друзьям в групповой чат: скажите, что вы празднуете, когда и где, позовите их и договоритесь, кто что принесёт."
      uk: "У суботу у вас день народження, і ви влаштовуєте вечірку в себе вдома. Напишіть коротке запрошення друзям у груповий чат: скажіть, що ви святкуєте, коли і де, покличте їх і домовтеся, хто що принесе."
    goal:
      en: "Get your friends to come and to divide the food and drink between them, in a message they can answer with one line."
      ru: "Добиться, чтобы друзья пришли и разобрали между собой еду и напитки, — сообщением, на которое можно ответить одной строкой."
      uk: "Домогтися, щоб друзі прийшли і розібрали між собою їжу та напої, — повідомленням, на яке можна відповісти одним рядком."
    requirements:
      - en: "Open with the invitation itself (Hast du Lust auf eine Party? / Ich lade euch ein)."
        ru: "Начните с самого приглашения (Hast du Lust auf eine Party? / Ich lade euch ein)."
        uk: "Почніть із самого запрошення (Hast du Lust auf eine Party? / Ich lade euch ein)."
      - en: "Give the day, the time and the place in one sentence (Am Samstag um acht bei mir)."
        ru: "Назовите день, время и место одним предложением (Am Samstag um acht bei mir)."
        uk: "Назвіть день, час і місце одним реченням (Am Samstag um acht bei mir)."
      - en: "Write at least two sentences with the schenken/mitbringen frame: recipient in the dative, thing in the accusative; use the neutral dative-before-accusative order shown here (Bringst du mir einen Salat mit? / Ich bringe euch die Getränke mit)."
        ru: "Напишите минимум два предложения по модели schenken/mitbringen: получатель в Dativ, предмет в Akkusativ; используйте показанный здесь нейтральный порядок Dativ перед Akkusativ (Bringst du mir einen Salat mit? / Ich bringe euch die Getränke mit)."
        uk: "Напишіть щонайменше два речення за моделлю schenken/mitbringen: одержувач у Dativ, предмет в Akkusativ; використайте показаний тут нейтральний порядок Dativ перед Akkusativ (Bringst du mir einen Salat mit? / Ich bringe euch die Getränke mit)."
      - en: "Close with a reflexive verb (Ich freue mich auf euch! / Wir treffen uns um acht)."
        ru: "Завершите возвратным глаголом (Ich freue mich auf euch! / Wir treffen uns um acht)."
        uk: "Завершіть зворотним дієсловом (Ich freue mich auf euch! / Wir treffen uns um acht)."
    min_words: 40
    model_answer: "Hallo zusammen! Am Samstag habe ich Geburtstag und ich lade euch ein. Habt ihr Lust auf eine Party? Wir treffen uns um acht in meiner Wohnung. Ich bringe euch die Getränke mit und mache auch einen Salat. Yusuf, bringst du mir bitte einen Kuchen mit? Nina, kannst du uns Musik mitbringen? Sagt mir bitte bis Donnerstag Bescheid. Ich freue mich sehr auf euch!"
    model_translation:
      en: "Hi everyone! It's my birthday on Saturday and I'm inviting you all. Do you fancy a party? We're meeting at eight at my flat. I'll bring the drinks and I'll make a salad too. Yusuf, could you bring me a cake? Nina, can you bring us some music? Let me know by Thursday, please. I'm really looking forward to seeing you!"
      ru: "Всем привет! В субботу у меня день рождения, и я вас приглашаю. Хотите на вечеринку? Встречаемся в восемь у меня дома. Напитки принесу я и ещё сделаю салат. Юсуф, принесёшь мне торт? Нина, можешь принести нам музыку? Ответьте, пожалуйста, до четверга. Очень жду вас!"
      uk: "Усім привіт! У суботу в мене день народження, і я вас запрошую. Хочете на вечірку? Зустрічаємося о восьмій у мене вдома. Напої принесу я і ще зроблю салат. Юсуфе, принесеш мені торт? Ніно, можеш принести нам музику? Відповідайте, будь ласка, до четверга. Дуже чекаю на вас!"
    explain:
      en: "An invitation says what is being celebrated, when and where, asks people to come, and coordinates who brings what. In the schenken/mitbringen frames, the recipient is dative and the thing is accusative; the models use the neutral dative-before-accusative order: Ich bringe euch die Getränke mit. Bringst du mir einen Kuchen mit? Kannst du uns Musik mitbringen? Check the case required by the verb frame, then check the last word: with a modal, mitbringen stays whole at the end; without one, mit separates."
      ru: "В приглашении сообщают, что празднуют, когда и где, зовут прийти и договариваются, кто что приносит. В моделях schenken/mitbringen получатель стоит в Dativ, а предмет — в Akkusativ; образцы используют нейтральный порядок Dativ перед Akkusativ: Ich bringe euch die Getränke mit. Bringst du mir einen Kuchen mit? Kannst du uns Musik mitbringen? Проверьте падеж по глагольной модели, затем последнее слово: с модальным глаголом mitbringen целиком стоит в конце, без модального mit отделяется."
      uk: "У запрошенні повідомляють, що святкують, коли й де, кличуть прийти та домовляються, хто що приносить. У моделях schenken/mitbringen одержувач стоїть у Dativ, а предмет — в Akkusativ; зразки використовують нейтральний порядок Dativ перед Akkusativ: Ich bringe euch die Getränke mit. Bringst du mir einen Kuchen mit? Kannst du uns Musik mitbringen? Перевірте відмінок за дієслівною моделлю, потім останнє слово: із модальним дієсловом mitbringen цілком стоїть у кінці, без модального mit відокремлюється."
