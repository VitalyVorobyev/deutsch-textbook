topic: man-und-besitz
role: practice
stage: transfer
activity: application
title_de: "Hören im Kontext — man, jemand & wem etwas gehört"
title:
  en: Whose is what in the building
  ru: Чьё что в доме
  uk: 'Чиє що в будинку'
items:
- id: q1
  outcomes:
  - besitz-ausdruecken
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Rita
      text: Basti, wem gehört eigentlich das Fahrrad im Hof?
    - speaker: Basti
      text: Das rote? Das ist meins. Das blaue gehört den Nachbarn oben.
    - speaker: Rita
      text: Und die Schuhe vor der Tür? Man stolpert dauernd darüber.
    - speaker: Basti
      text: Die sind nicht meine. Ich glaube, das sind Lenas.
    - speaker: Rita
      text: Dann sage ich ihr Bescheid. Hier stellt man nichts in den Flur.
    - speaker: Basti
      text: Richtig. Übrigens, ist das deine Jacke im Waschraum?
    - speaker: Rita
      text: Nein, meine ist grün. Diese hier ist viel größer.
    - speaker: Basti
      text: Dann hängen wir einen Zettel hin. Irgendjemand vermisst sie sicher.
  recording: ls-man-und-besitz-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Wem gehört das blaue Fahrrad?
  options:
  - Den Nachbarn von oben.
  - Basti.
  - Lena.
  correct: 0
  explain:
    en: Two bikes are separated by colour inside one line — the red one is his, the
      blue one is not. Lena owns the shoes, one exchange later.
    ru: 'Два велосипеда различаются по цвету внутри одной реплики: красный — его,
      синий — нет. Лене принадлежит обувь, о ней говорят репликой позже.'
    uk: 'Два велосипеди розрізняються за кольором усередині однієї репліки: червоний — його, синій — ні. Лені належить взуття, про нього мова реплікою пізніше.'
  max_replays: 3
