    en: The two tasks are handed out in consecutive lines, one each. Whoever hears
      only the verb and not who says it takes the wrong one.
    ru: Две задачи распределяются в идущих подряд репликах, по одной на каждого. Кто
      слышит только глагол, но не то, кто его произносит, возьмёт не ту.
    uk: 'Два доручення роздано в сусідніх репліках, по одному кожному. Хто чує лише дієслово, а не того, хто його вимовляє, візьме не те.'
