topic: nebensaetze-plaene
role: practice
title:
  en: Why the trip has to move
  ru: Почему поездку переносят
  uk: 'Чому поїздку переносять'
items:
- id: q1
  outcomes:
  - weil-grund
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Tom
      text: Elif, wir müssen den Ausflug verschieben.
    - speaker: Elif
      text: Schade. Warum denn?
    - speaker: Tom
      text: Weil meine Schwester am Samstag ihren Umzug hat und ich helfen muss.
    - speaker: Elif
      text: Das verstehe ich. Sollen wir den Sonntag nehmen?
    - speaker: Tom
      text: Am Sonntag geht es nicht, weil das Wetter schlecht werden soll.
    - speaker: Elif
      text: Stimmt, es soll regnen. Dann vielleicht nächstes Wochenende?
    - speaker: Tom
      text: Ja. Ich frage Nils, weil er das Auto hat.
    - speaker: Elif
      text: Gut. Und ich sage im Café Bescheid, weil wir dort reserviert haben.
    - speaker: Tom
      text: Danke. Wenn Nils nicht kann, fahren wir mit dem Zug.
    - speaker: Elif
      text: Das ist mir sogar lieber, weil ich dann lesen kann.
    - speaker: Tom
      text: Ich schreibe dir heute Abend, sobald ich mit Nils gesprochen habe.
  recording: ls-nebensaetze-plaene-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Warum geht der Ausflug am Samstag nicht?
  options:
  - Tom hilft seiner Schwester beim Umzug.
  - Das Wetter soll schlecht werden.
  - Nils braucht das Auto.
  correct: 0
  explain:
    en: Five weil-clauses in ten lines, and the wrong options are two of the real
      ones — the weather rules out Sunday, not Saturday. Each reason has to stay attached
      to its own day.
    ru: 'Пять придаточных с weil на десять реплик, и неверные варианты — две настоящие
      причины: погода отменяет воскресенье, а не субботу. Каждая причина должна остаться
      при своём дне.'
    uk: 'П''ять підрядних із weil на десять реплік, і хибні варіанти — дві справжні причини: погода скасовує неділю, а не суботу. Кожна причина має лишитися при своєму дні.'
  max_replays: 3
