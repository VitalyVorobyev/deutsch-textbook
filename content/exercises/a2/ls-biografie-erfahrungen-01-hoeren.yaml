topic: biografie-erfahrungen
role: practice
title:
  en: Twenty years, told in order
  ru: Двадцать лет, рассказанные по порядку
  uk: 'Двадцять років, розказані по порядку'
items:
- id: q1
  outcomes:
  - lebensstationen-ordnen
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Moderatorin
      text: Herr Costa, Sie leben seit zwanzig Jahren in Deutschland. Wo haben Sie
        angefangen?
    - speaker: Herr Costa
      text: Ich bin zuerst nach Bremen gekommen und habe dort in einer Bäckerei gearbeitet.
    - speaker: Moderatorin
      text: Und wie ging es weiter?
    - speaker: Herr Costa
      text: Nach drei Jahren habe ich eine Ausbildung als Koch gemacht.
    - speaker: Moderatorin
      text: War das schwer neben der Arbeit?
    - speaker: Herr Costa
      text: Sehr. Aber danach habe ich in Hamburg eine feste Stelle bekommen.
    - speaker: Moderatorin
      text: Wann ist Ihre Familie nachgekommen?
    - speaker: Herr Costa
      text: Meine Frau ist zwei Jahre später gekommen, unsere Tochter ist hier geboren.
    - speaker: Moderatorin
      text: Und heute?
    - speaker: Herr Costa
      text: Heute habe ich ein kleines Restaurant. Ich koche das, was meine Mutter
        gekocht hat.
    - speaker: Moderatorin
      text: Was war der wichtigste Schritt?
    - speaker: Herr Costa
      text: Die Ausbildung. Ohne die Ausbildung gab es keine feste Stelle.
  recording: ls-biografie-erfahrungen-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Was hat Herr Costa zuerst gemacht?
  options:
  - In einer Bäckerei gearbeitet.
  - Eine Ausbildung als Koch gemacht.
  - Ein Restaurant eröffnet.
  correct: 0
  explain:
    en: All three happen, and the question is only about the order. Zuerst, nach drei
      Jahren, danach and heute are the four markers that carry it.
    ru: 'Все три события произошли, и вопрос лишь о порядке. Несут его четыре маркера:
      zuerst, nach drei Jahren, danach и heute.'
    uk: 'Усі три події відбулися, і питання лише про їхній порядок. Несуть його чотири маркери: zuerst, nach drei Jahren, danach і heute.'
  max_replays: 3
