  question: Wer ist in Deutschland geboren?
  options:
  - Seine Tochter.
  - Seine Frau.
  - Herr Costa.
  correct: 0
  explain:
    en: Wife and daughter arrive in one sentence with two different verbs — one came
      two years later, the other was born here. The distinction sits in the second
      half of the line.
    ru: 'Жена и дочь названы в одном предложении двумя разными глаголами: одна приехала
      два года спустя, другая здесь родилась. Различие — во второй половине реплики.'
    uk: 'Дружину й доньку названо в одному реченні двома різними дієсловами: одна приїхала на два роки пізніше, друга народилася тут. Різниця — у другій половині репліки.'
