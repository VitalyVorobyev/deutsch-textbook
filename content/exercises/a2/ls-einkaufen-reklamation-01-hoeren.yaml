  question: Was muss die Kundin zusätzlich bezahlen?
  options:
  - Fünf Euro.
  - Nichts.
  - Zwei Jahre Garantie.
  correct: 0
  explain:
    en: The five euros arrive as a comparison — fünf Euro mehr — not as a price, and
      the sentence after it names who pays the difference.
    ru: Пять евро появляются как сравнение — fünf Euro mehr, — а не как цена, и следующее
      предложение называет, кто платит разницу.
    uk: 'П''ять євро з''являються як порівняння — fünf Euro mehr, — а не як ціна, і наступне речення називає, хто платить різницю.'
