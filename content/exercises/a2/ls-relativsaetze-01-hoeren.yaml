topic: relativsaetze
role: practice
title:
  en: At the lost property office
  ru: В бюро находок
  uk: 'У бюро знахідок'
items:
- id: q1
  outcomes:
  - sache-definieren
  type: audio-comprehension
  source:
    kind: tts
    turns:
    - speaker: Frau Roth
      text: Guten Tag, ich habe gestern meine Tasche in der Bahn vergessen.
    - speaker: Beamter
      text: Können Sie die Tasche beschreiben?
    - speaker: Frau Roth
      text: Es ist eine braune Tasche, die einen langen Riemen hat.
    - speaker: Beamter
      text: Wir haben hier zwei, die braun sind. Was war darin?
    - speaker: Frau Roth
      text: Ein Buch, das ich aus der Bibliothek habe, und ein blauer Schal.
    - speaker: Beamter
      text: Einen Moment. Ist das die Tasche, die Sie meinen?
    - speaker: Frau Roth
      text: Ja! Das ist die, die ich gesucht habe. Vielen Dank.
    - speaker: Beamter
      text: Bitte unterschreiben Sie hier. Und zeigen Sie mir bitte einen Ausweis.
    - speaker: Frau Roth
      text: Hier ist mein Pass. Der Schal war ein Geschenk, deshalb bin ich so froh.
  recording: ls-relativsaetze-01
  instruction:
    en: Listen and choose the correct answer.
    ru: Прослушайте и выберите правильный ответ.
    uk: 'Прослухайте та оберіть правильну відповідь.'
  question: Woran erkennt man ihre Tasche?
  options:
  - An dem langen Riemen.
  - An der braunen Farbe.
  - An dem Namen darauf.
  correct: 0
  explain:
    en: 'Brown is not enough and the recording says why: the office has two brown
      ones. The relative clause is what narrows it down, which is exactly the job
      this structure does.'
    ru: 'Коричневого недостаточно, и запись прямо объясняет почему: в бюро их две.
      Сужает круг именно придаточное определительное — в этом и состоит работа данной
      конструкции.'
    uk: 'Коричневого замало, і запис прямо каже чому: у бюро їх дві. Звужує коло саме підрядне означальне — у цьому й полягає робота цієї конструкції.'
  max_replays: 3
