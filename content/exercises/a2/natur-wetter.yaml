    type: cloze
    instruction:
      en: "Fill in the word for the unit of temperature, in the form a number requires."
      ru: "Вставьте слово для единицы температуры в той форме, которой требует число."
      uk: "Вставте слово для одиниці температури у формі, якої вимагає число."
    text: "Heute sind es dreißig {{Grad}}, gestern waren es nur achtzehn {{Grad}}."
    translation:
      en: "Today it is thirty degrees; yesterday it was only eighteen."
      ru: "Сегодня тридцать градусов, вчера было только восемнадцать."
      uk: "Сьогодні тридцять градусів, учора було лише вісімнадцять."
    explain:
      en: "After a number *Grad* does not change — not *dreißig Grade*, and not *achtzehn Grade* either. This is a small group of masculine measurement nouns that stay singular after a numeral, and it is worth noticing because the dictionary plural *die Grade* is real: it just belongs to sentences without a number in front of it."
      ru: "После числительного *Grad* не меняется — ни *dreißig Grade*, ни *achtzehn Grade*. Это небольшая группа существительных мужского рода со значением меры, которые после числительного остаются в единственном числе. Заметить это стоит потому, что словарное множественное *die Grade* существует по-настоящему: оно просто принадлежит предложениям без числа перед ним."
      uk: "Після числівника *Grad* не змінюється — ані *dreißig Grade*, ані *achtzehn Grade*. Це невелика група іменників чоловічого роду зі значенням міри, які після числівника лишаються в однині. Помітити це варто тому, що словникова множина *die Grade* існує насправді: вона просто належить реченням без числа перед ним."

  - id: mc-see-meer
    outcomes: [landschaft-beschreiben]
    type: mc
    prompt: "„Wir fahren an den See.“ Wohin fahren wir?"
    options:
      - "An einen See — ringsum ist Land."
      - "An das Meer."
      - "An einen Fluss."
    correct: 0
    explain:
      en: "*Der See* is a lake, and the masculine article is the whole signal — *die See*, feminine, would be the sea. Spelling, plural and pronunciation are identical, so the article is doing work nothing else in the word can do. For open water the everyday choice is *das Meer*, which is why *die See* is worth recognising when you read it rather than reaching for when you speak."
      ru: "*Der See* — озеро, и мужской артикль здесь единственный сигнал: *die See*, женского рода, было бы море. Написание, множественное число и произношение совпадают, так что артикль делает работу, которую больше ничто в слове не сделает. Для открытой воды обиходный выбор — *das Meer*, поэтому *die See* стоит узнавать при чтении, а не употреблять в речи."
      uk: "*Der See* — озеро, і чоловічий артикль тут єдиний сигнал: *die See*, жіночого роду, було б море. Написання, множина і вимова збігаються, тож артикль робить роботу, якої більше ніщо в слові не зробить. Для відкритої води побутовий вибір — *das Meer*, тому *die See* варто впізнавати під час читання, а не вживати в мовленні."
