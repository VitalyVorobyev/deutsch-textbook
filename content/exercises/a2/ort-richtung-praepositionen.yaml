topic: ort-richtung-praepositionen
role: practice
title:
  en: "Practice — where to, where, where from"
  ru: "Практика — куда, где, откуда"
  uk: "Практика — куди, де, звідки"

# The topic's primary practice set, so its item list is frozen once this ships.
#
# The three decisions of the article, in the order the article makes them: the place type
# picks the preposition (table, cloze aus/von, cloze zu/bei/von, both mc items, three of the
# four translate items), and only then does the direction pick the case on in/an/auf — which
# is A2's older `wo-wohin` confusion and keeps that tag (cloze im/ins, translate Bibliothek).
# That split is also what makes the `deepens: wohnen-umzug` edge real: the two wo-wohin items
# share the tag eleven of that topic's practice items carry (eight in a2/wohnen-umzug, three
# in a2/wohnen-umzug-produktion).
#
# Nouns are all A1/A2 deck words (grepped in content/vocab/, not remembered): Bibliothek,
# Markt, Friseur, Garten, Haus, Schule, Party, Freundin, Arzt, Schweiz, Kino, Bahnhof, Tante,
# Kollegin. No new deck — the topic recycles.
items:
  - id: table-ortstypen
    outcomes: [ziel-nennen, ort-nennen, herkunft-nennen]
    type: table
    focus: wohin-wo-woher
    title: "Ein Ort, drei Formen"
    instruction:
      en: "The type of place is named in brackets, and that type picks the preposition. Fill in the three forms of each place. Use the short forms zum, beim, vom where German has them."
      ru: "Тип места указан в скобках — именно он выбирает предлог. Впишите три формы для каждого места. Там, где есть слитные формы zum, beim, vom, используйте их."
      uk: "Тип місця вказано в дужках — саме він обирає прийменник. Впишіть три форми для кожного місця. Там, де є злиті форми zum, beim, vom, використовуйте їх."
    columns: ["Wohin?", "Wo?", "Woher?"]
    rows:
      - label: "die Bibliothek (ein Haus)"
        cells:
          - { answer: "in die Bibliothek", given: true }
          - { answer: "in der Bibliothek" }
          - { answer: "aus der Bibliothek" }
      - label: "der Markt (ein Platz)"
        cells:
          - { answer: "auf den Markt" }
          - { answer: "auf dem Markt" }
          - { answer: "vom Markt" }
      - label: "der Friseur (eine Person)"
        cells:
          - { answer: "zum Friseur" }
          - { answer: "beim Friseur" }
          - { answer: "vom Friseur" }
      - label: "Berlin (eine Stadt)"
        cells:
          - { answer: "nach Berlin" }
          - { answer: "in Berlin" }
          - { answer: "aus Berlin" }
    explain:
      en: "Read the table by rows, not by columns: each type of place comes with its own set of three. A building takes in – in – aus, and only the article moves (in die / in der). An open square takes auf – auf – von, so the third form changes the preposition, not the case. A person takes zu – bei – von, three different prepositions and three datives. A city name takes nach – in – aus and no article at all. The Woher? column is the one to check twice: it is never the Wohin? form with a dative article."
      ru: "Читайте таблицу по строкам, а не по столбцам: у каждого типа места свой набор из трёх форм. Здание берёт in – in – aus, и меняется только артикль (in die / in der). Открытая площадка берёт auf – auf – von, то есть в третьей форме меняется предлог, а не падеж. Человек берёт zu – bei – von: три разных предлога и три раза Dativ. Название города берёт nach – in – aus, и артикля нет вовсе. Столбец Woher? стоит проверять дважды: это никогда не форма Wohin? с артиклем в Dativ."
      uk: "Читайте таблицю за рядками, а не за стовпцями: у кожного типу місця свій набір із трьох форм. Будівля бере in – in – aus, і змінюється лише артикль (in die / in der). Відкритий майданчик бере auf – auf – von, тобто в третій формі змінюється прийменник, а не відмінок. Людина бере zu – bei – von: три різні прийменники і тричі Dativ. Назва міста бере nach – in – aus, і артикля немає взагалі. Стовпець Woher? варто перевіряти двічі: це ніколи не форма Wohin? з артиклем у Dativ."

  - id: cloze-laufen-garten
    outcomes: [ort-nennen, ziel-nennen]
    type: cloze
    focus: wo-wohin
    instruction:
      en: "Fill in the short form: im or ins."
      ru: "Вставьте краткую форму: im или ins."
      uk: "Вставте коротку форму: im або ins."
    text: "Am Nachmittag laufen die Kinder eine Stunde {{im}} Garten. Um sechs laufen sie {{ins}} Haus."
    translation:
      en: "In the afternoon the children run in the garden for an hour. At six they run into the house."
      ru: "После обеда дети час бегают в саду. В шесть они забегают в дом."
      uk: "По обіді діти годину бігають у саду. О шостій вони забігають до будинку."
    explain:
      en: "The first sentence is full of movement and still takes the dative. The running starts and ends inside the garden — nobody changes place, so the phrase answers Wo? and in dem becomes im. The second sentence names a new place: the children were outside and are now inside, so Wohin? → in das → ins. The test is never whether something moves; it is whether the phrase names a destination or the place where it all happens."
      ru: "В первом предложении движения сколько угодно, а падеж всё равно Dativ: бег начинается и заканчивается внутри сада, место не меняется, поэтому группа отвечает на Wo?, и in dem превращается в im. Во втором предложении названо новое место: дети были снаружи, а теперь внутри, значит Wohin? → in das → ins. Проверяют не наличие движения, а то, называет ли группа цель или место, где всё происходит."
      uk: "У першому реченні руху скільки завгодно, а відмінок усе одно Dativ: біг починається й закінчується всередині саду, місце не змінюється, тому група відповідає на Wo?, і in dem перетворюється на im. У другому реченні названо нове місце: діти були надворі, а тепер усередині, отже Wohin? → in das → ins. Перевіряють не наявність руху, а те, чи називає група ціль, чи місце, де все відбувається."

  - id: cloze-aus-oder-von
    outcomes: [herkunft-nennen]
    type: cloze
    focus: wohin-wo-woher
    instruction:
      en: "Woher? Fill in aus, von, or the short form vom."
      ru: "Woher? Вставьте aus, von или краткую форму vom."
      uk: "Woher? Вставте aus, von або коротку форму vom."
    text: "Um zwölf komme ich {{aus}} der Schule. Am Nachmittag komme ich {{vom}} Markt. Um zehn komme ich {{von}} der Party."
    translation:
      en: "At twelve I come out of school. In the afternoon I come back from the market. At ten I come back from the party."
      ru: "В двенадцать я выхожу из школы. После обеда я возвращаюсь с рынка. В десять я возвращаюсь с вечеринки."
      uk: "О дванадцятій я виходжу зі школи. По обіді я повертаюся з ринку. О десятій я повертаюся з вечірки."
    explain:
      en: "Ask one question each time: was I inside it, or was I at it? A school is a building you sit inside, so leaving it is aus der Schule. A market is an open square you stand on (auf dem Markt), so leaving it is von, contracted to vom. A party is an event, and an event is something you are at, so von der Party. The rule covers the ordinary cases; a handful of fixed expressions such as von der Arbeit are learned as vocabulary."
      ru: "Каждый раз задавайте один вопрос: я был внутри или я был у этого? Школа — здание, внутри которого сидят, поэтому выходят aus der Schule. Рынок — открытая площадка, на которой стоят (auf dem Markt), поэтому уходят с неё через von, в слитной форме vom. Вечеринка — мероприятие, а на мероприятии находятся «при», поэтому von der Party. Правило покрывает обычные случаи; несколько устойчивых сочетаний вроде von der Arbeit запоминают как лексику."
      uk: "Щоразу ставте одне питання: я був усередині чи я був біля цього? Школа — будівля, всередині якої сидять, тому виходять aus der Schule. Ринок — відкритий майданчик, на якому стоять (auf dem Markt), тому йдуть із нього через von, у злитій формі vom. Вечірка — захід, а на заході перебувають «при», тому von der Party. Правило покриває звичайні випадки; кілька сталих сполук на кшталт von der Arbeit запам'ятовують як лексику."

  - id: cloze-zu-bei-von-freundin
    outcomes: [ziel-nennen, ort-nennen, herkunft-nennen]
    type: cloze
    focus: wohin-wo-woher
    instruction:
      en: "One person, three questions. Fill in zu, bei or von."
      ru: "Один человек, три вопроса. Вставьте zu, bei или von."
      uk: "Одна людина, три питання. Вставте zu, bei або von."
    text: "Am Samstag fahre ich {{zu}} meiner Freundin. Ich bin den ganzen Tag {{bei}} meiner Freundin. Am Abend komme ich {{von}} meiner Freundin zurück."
    translation:
      en: "On Saturday I go to my friend's. I spend the whole day at my friend's. In the evening I come back from my friend's."
      ru: "В субботу я еду к подруге. Весь день я у подруги. Вечером я возвращаюсь от подруги."
      uk: "У суботу я їду до подруги. Весь день я в подруги. Увечері я повертаюся від подруги."
    explain:
      en: "With a person there is no case to choose: zu, bei and von are all dative, and the meaning sits in the preposition itself — zu is the destination, bei is the place, von is the origin. That is why meiner Freundin looks identical in all three sentences. And a person is never a place you go inside, so in has no business here at all."
      ru: "Когда речь о человеке, выбирать падеж не приходится: zu, bei и von — все три с Dativ, а смысл несёт сам предлог: zu — цель, bei — место, von — исходная точка. Поэтому meiner Freundin во всех трёх предложениях выглядит одинаково. И человек никогда не бывает местом, куда входят внутрь, так что предлогу in здесь делать нечего."
      uk: "Коли йдеться про людину, обирати відмінок не доводиться: zu, bei і von — усі три з Dativ, а зміст несе сам прийменник: zu — ціль, bei — місце, von — вихідна точка. Тому meiner Freundin в усіх трьох реченнях виглядає однаково. І людина ніколи не буває місцем, куди заходять усередину, тож прийменнику in тут немає чого робити."

  - id: cloze-nach-hause-zu-hause
    outcomes: [ziel-nennen, ort-nennen]
    type: cloze
    focus: wohin-wo-woher
    instruction:
      en: "Fill in nach or zu."
      ru: "Вставьте nach или zu."
      uk: "Вставте nach або zu."
    text: "Um halb sechs gehe ich {{nach}} Hause. Am Abend bleibe ich {{zu}} Hause und lese."
    translation:
      en: "At half past five I go home. In the evening I stay at home and read."
      ru: "В половине шестого я иду домой. Вечером я остаюсь дома и читаю."
      uk: "О пів на шосту я йду додому. Увечері я залишаюся вдома й читаю."
    explain:
      en: "These two are fixed expressions, so learn them as a pair rather than deriving them: nach Hause is where you are going, zu Hause is where you are. Both are written as two words, neither takes an article, and neither ever changes form. They work for a home only — for any other building you need the ordinary prepositions (ins Büro, im Büro)."
      ru: "Это устойчивые выражения, и их проще запомнить парой, чем вывести: nach Hause — куда идут, zu Hause — где находятся. Оба пишутся в два слова, артикля не имеют и никогда не изменяются. Годятся они только для дома: для любого другого здания нужны обычные предлоги (ins Büro, im Büro)."
      uk: "Це сталі вислови, і їх простіше запам'ятати парою, ніж вивести: nach Hause — куди йдуть, zu Hause — де перебувають. Обидва пишуться у два слова, артикля не мають і ніколи не змінюються. Годяться вони лише для дому: для будь-якої іншої будівлі потрібні звичайні прийменники (ins Büro, im Büro)."

  - id: mc-bin-beim-arzt
    outcomes: [ort-nennen]
    type: mc
    focus: wohin-wo-woher
    instruction:
      en: "Choose the form that says where you are."
      ru: "Выберите форму, которая говорит, где вы находитесь."
      uk: "Виберіть форму, яка каже, де ви перебуваєте."
    prompt: "Ich bin gerade ___ Arzt und komme um vier zurück."
    options: ["beim", "zum", "vom"]
    correct: 0
    translation:
      en: "I am at the doctor's right now and will be back at four."
      ru: "Я сейчас у врача и вернусь в четыре."
      uk: "Я зараз у лікаря і повернуся о четвертій."
    explain:
      en: "All three are dative and all three belong to the same triple, so only the meaning separates them. bin says where you are, and the location form for a person is bei — beim Arzt. zum names the destination (Ich gehe zum Arzt) and vom the origin (Ich komme vom Arzt). English hides the distinction in the noun phrase: 'to the doctor's', 'at the doctor's' and 'from the doctor's' all keep the same words and change only a small preposition, so it is easy to reach for whichever German form came to mind first."
      ru: "Все три формы стоят в Dativ и принадлежат одной тройке, поэтому различает их только смысл. Глагол bin говорит о местонахождении, а место при человеке — это bei: beim Arzt. Форма zum называет цель (Ich gehe zum Arzt), а vom — исходную точку (Ich komme vom Arzt). Осторожно с русским: «я у врача» и «я к врачу» различаются, но «пойти к врачу» и «быть у врача» легко смешиваются в спешке, а немецкий их не путает никогда."
      uk: "Усі три форми стоять у Dativ і належать одній трійці, тому розрізняє їх лише зміст. Дієслово bin говорить про місцеперебування, а місце при людині — це bei: beim Arzt. Форма zum називає ціль (Ich gehe zum Arzt), а vom — вихідну точку (Ich komme vom Arzt). Обережно з українською: «я в лікаря» і «я до лікаря» розрізняються, але поспіхом їх легко змішати, а німецька їх не плутає ніколи."

  - id: mc-in-die-schweiz
    outcomes: [ziel-nennen]
    type: mc
    focus: wohin-wo-woher
    instruction:
      en: "Choose the correct form."
      ru: "Выберите правильную форму."
      uk: "Виберіть правильну форму."
    prompt: "Im Sommer fahren wir ___ Schweiz."
    options: ["in die", "nach der", "in der"]
    correct: 0
    translation:
      en: "In summer we are going to Switzerland."
      ru: "Летом мы едем в Швейцарию."
      uk: "Улітку ми їдемо до Швейцарії."
    explain:
      en: "nach works only with names that carry no article: nach Berlin, nach Deutschland, nach Österreich. die Schweiz is one of the few countries with an article, so it behaves like any other enclosed place — in die Schweiz for the destination, in der Schweiz for the location, aus der Schweiz for the origin. nach der Schweiz mixes the two systems, and in der Schweiz would say where you already are."
      ru: "Предлог nach работает только с названиями без артикля: nach Berlin, nach Deutschland, nach Österreich. У die Schweiz артикль есть — это одна из немногих таких стран, — поэтому она ведёт себя как обычное «помещение»: in die Schweiz для цели, in der Schweiz для места, aus der Schweiz для исходной точки. Вариант nach der Schweiz смешивает две схемы, а in der Schweiz сказал бы, где вы уже находитесь."
      uk: "Прийменник nach працює лише з назвами без артикля: nach Berlin, nach Deutschland, nach Österreich. У die Schweiz артикль є — це одна з небагатьох таких країн, — тому вона поводиться як звичайне «приміщення»: in die Schweiz для цілі, in der Schweiz для місця, aus der Schweiz для вихідної точки. Варіант nach der Schweiz змішує дві схеми, а in der Schweiz сказав би, де ви вже перебуваєте."

  - id: uebersetzen-nach-muenchen
    outcomes: [ziel-nennen]
    type: translate
    focus: wohin-wo-woher
    instruction:
      en: "Translate into German."
      ru: "Переведите на немецкий."
      uk: "Перекладіть німецькою."
    prompt_en: "On Friday my colleague is travelling to Munich."
    prompt_ru: "В пятницу моя коллега едет в Мюнхен."
    prompt_uk: "У п'ятницю моя колега їде до Мюнхена."
    answer: "Am Freitag fährt meine Kollegin nach München."
    accept:
      - "Meine Kollegin fährt am Freitag nach München."
      # EN "is travelling" licenses reisen just as well; the verb carries no part of the
      # graded choice (nach), so both renderings stay target-preserving.
      - "Am Freitag reist meine Kollegin nach München."
      - "Meine Kollegin reist am Freitag nach München."
    key_tokens: ["nach"]
    explain:
      en: "A city name has no article, and a destination without an article takes nach: nach München, nach Berlin, nach Hamburg. There is nothing to decline, so no case question arises at all — which is exactly why this row is worth keeping separate in your head. The location form of the same city is in München and the origin form is aus München."
      ru: "У названия города нет артикля, а цель без артикля берёт nach: nach München, nach Berlin, nach Hamburg. Склонять нечего, поэтому вопрос о падеже здесь вообще не возникает — именно поэтому эту строку стоит держать в голове отдельно. Место у того же города — in München, исходная точка — aus München."
      uk: "У назви міста немає артикля, а ціль без артикля бере nach: nach München, nach Berlin, nach Hamburg. Відмінювати нічого, тому питання про відмінок тут узагалі не виникає — саме тому цей рядок варто тримати в голові окремо. Місце в того самого міста — in München, вихідна точка — aus München."

  - id: uebersetzen-aus-dem-kino
    outcomes: [herkunft-nennen]
    type: translate
    focus: wohin-wo-woher
    instruction:
      en: "Translate into German."
      ru: "Переведите на немецкий."
      uk: "Перекладіть німецькою."
    prompt_en: "We are just coming out of the cinema."
    prompt_ru: "Мы как раз выходим из кино."
    prompt_uk: "Ми якраз виходимо з кіно."
    answer: "Wir kommen gerade aus dem Kino."
    accept:
      - "Gerade kommen wir aus dem Kino."
    key_tokens: ["aus", "dem"]
    explain:
      en: "A cinema is a building you sit inside, so the origin is aus, and aus is a dative preposition: das Kino → aus dem Kino. vom Kino would say you had been standing at the building rather than watching a film in it. The other two members of the same triple are ins Kino (destination) and im Kino (location)."
      ru: "Кинотеатр — здание, внутри которого сидят, поэтому исходная точка передаётся через aus, а aus требует Dativ: das Kino → aus dem Kino. Форма vom Kino сказала бы, что вы стояли у здания, а не смотрели фильм внутри. Два других члена той же тройки — ins Kino (цель) и im Kino (место)."
      uk: "Кінотеатр — будівля, всередині якої сидять, тому вихідна точка передається через aus, а aus вимагає Dativ: das Kino → aus dem Kino. Форма vom Kino сказала б, що ви стояли біля будівлі, а не дивилися фільм усередині. Два інші члени тієї самої трійки — ins Kino (ціль) і im Kino (місце)."

  - id: uebersetzen-bibliothek-minimalpaar
    outcomes: [ziel-nennen, ort-nennen]
    type: translate
    focus: wo-wohin
    instruction:
      en: "Translate both sentences into German."
      ru: "Переведите оба предложения на немецкий."
      uk: "Перекладіть обидва речення німецькою."
    prompt_en: "At ten I go into the library. At twelve I am still in the library."
    prompt_ru: "В десять я иду в библиотеку. В двенадцать я ещё в библиотеке."
    prompt_uk: "О десятій я йду до бібліотеки. О дванадцятій я ще в бібліотеці."
    answer: "Um zehn gehe ich in die Bibliothek. Um zwölf bin ich noch in der Bibliothek."
    accept:
      - "Ich gehe um zehn in die Bibliothek. Ich bin um zwölf noch in der Bibliothek."
    key_tokens: ["die", "der"]
    explain:
      en: "One preposition, one noun, two cases — and the article is the only thing that shows which. The first sentence names a destination: Wohin? → accusative → in die Bibliothek. The second names where you are: Wo? → dative → in der Bibliothek. This is the second decision of the topic, and it only ever applies to in, an and auf. With zu, bei and von there is nothing to choose."
      ru: "Один предлог, одно существительное, два падежа — и показывает это только артикль. Первое предложение называет цель: Wohin? → Akkusativ → in die Bibliothek. Второе называет место: Wo? → Dativ → in der Bibliothek. Это второе решение темы, и оно касается только in, an и auf. У zu, bei и von выбирать нечего."
      uk: "Один прийменник, один іменник, два відмінки — і показує це лише артикль. Перше речення називає ціль: Wohin? → Akkusativ → in die Bibliothek. Друге називає місце: Wo? → Dativ → in der Bibliothek. Це друге рішення теми, і воно стосується лише in, an і auf. У zu, bei і von вибирати нічого."

  - id: diktat-zum-bahnhof
    outcomes: [ziel-nennen]
    type: listen
    focus: wohin-wo-woher
    instruction:
      en: "Listen and type the sentence exactly."
      ru: "Прослушайте и запишите предложение точно."
      uk: "Прослухайте і запишіть речення точно."
    text: "Am Morgen fahre ich zum Bahnhof."
    translation:
      en: "In the morning I go to the station."
      ru: "Утром я еду на вокзал."
      uk: "Уранці я їду на вокзал."
    explain:
      en: "One short word carries the whole decision, and it is easy to lose by ear: zum = zu dem. A station is a destination you head for as a point, so it takes zu, and the -m at the end is the dative that zu always governs. Written in full it is zu dem Bahnhof, but the short form is the normal one. The location form of this place is am Bahnhof, not beim Bahnhof."
      ru: "Всё решение несёт одно короткое слово, и на слух его легко потерять: zum = zu dem. Вокзал — цель-точка, к которой направляются, поэтому нужен zu, а окончание -m и есть Dativ, которого zu требует всегда. Полностью это zu dem Bahnhof, но нормальный вариант — краткий. Место у этого объекта — am Bahnhof, а не beim Bahnhof."
      uk: "Усе рішення несе одне коротке слово, і на слух його легко втратити: zum = zu dem. Вокзал — ціль-точка, до якої прямують, тому потрібен zu, а закінчення -m і є Dativ, якого zu вимагає завжди. Повністю це zu dem Bahnhof, але нормальний варіант — короткий. Місце в цього об'єкта — am Bahnhof, а не beim Bahnhof."

  - id: uebersetzen-zu-und-von-der-tante
    outcomes: [ziel-nennen, herkunft-nennen]
    type: translate
    focus: wohin-wo-woher
    instruction:
      en: "Translate into German."
      ru: "Переведите на немецкий."
      uk: "Перекладіть німецькою."
    prompt_en: "On Sunday we drive to my aunt's. At eight we come back from my aunt's."
    prompt_ru: "В воскресенье мы едем к моей тёте. В восемь мы возвращаемся от тёти."
    prompt_uk: "У неділю ми їдемо до моєї тітки. О восьмій ми повертаємося від тітки."
    answer: "Am Sonntag fahren wir zu meiner Tante. Um acht kommen wir von meiner Tante zurück."
    accept:
      - "Wir fahren am Sonntag zu meiner Tante. Wir kommen um acht von meiner Tante zurück."
      # «возвращаемся» renders as kommen … zurück or fahren … zurück alike; the verb is not
      # part of the graded pair (zu/von), so the fahren renderings stay target-preserving.
      - "Am Sonntag fahren wir zu meiner Tante. Um acht fahren wir von meiner Tante zurück."
      - "Wir fahren am Sonntag zu meiner Tante. Wir fahren um acht von meiner Tante zurück."
    key_tokens: ["zu", "von"]
    explain:
      en: "Both halves name the same person, and the preposition does all the work: zu for the destination, von for the origin. Neither of them alternates, so meiner Tante stays dative in both sentences and nothing about the article changes. The two errors to avoid are in meine Tante — a person is not a room — and aus meiner Tante, which is the origin form for the inside of a building."
      ru: "Обе половины называют одного и того же человека, и всю работу делает предлог: zu для цели, von для исходной точки. Ни один из них не чередует падежи, поэтому meiner Tante в обоих предложениях остаётся в Dativ, и с артиклем ничего не происходит. Двух ошибок стоит избегать: in meine Tante — человек не помещение — и aus meiner Tante: это форма выхода изнутри здания."
      uk: "Обидві половини називають ту саму людину, і всю роботу робить прийменник: zu для цілі, von для вихідної точки. Жоден із них не чергує відмінки, тому meiner Tante в обох реченнях лишається в Dativ, і з артиклем нічого не відбувається. Двох помилок варто уникати: in meine Tante — людина не приміщення — та aus meiner Tante: це форма виходу зсередини будівлі."
