      b: { en: "the construction of the Reichstag building.", ru: "строительству здания рейхстага.", uk: "спорудженню будівлі Рейхстагу." }
      c: { en: "building up the Wehrmacht.", ru: "созданию вермахта.", uk: "створенню вермахту." }
      d: { en: "the assassination attempt on Hitler on 20 July 1944.", ru: "покушению на Гитлера 20 июля 1944 года.", uk: "замаху на Гітлера 20 липня 1944 року." }
    terms:
