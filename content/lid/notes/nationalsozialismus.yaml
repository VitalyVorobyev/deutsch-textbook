  - id: general-161
    rationale_de: >-
      Die Nationalsozialisten teilten Menschen nach einer angeblichen „Rasse“ ein und hielten viele für weniger wert. Dieser Rassismus wurde Politik des Staates: Die „Nürnberger Gesetze“ von 1935 nahmen den Jüdinnen und Juden ihre politischen Rechte. Am Ende stand der Holocaust – der Mord an etwa sechs Millionen europäischen Jüdinnen und Juden; auch Sinti und Roma wurden verfolgt und ermordet.
    source: "bpb: Nationalsozialismus"
    question:
      en: "What characterised the Nazi state? A policy of …"
      ru: "Что было характерно для нацистского государства? Политика …"
      uk: "Що було характерним для нацистської держави? Політика …"
    options:
      a: { en: "state racism", ru: "государственного расизма", uk: "державного расизму" }
      b: { en: "freedom of opinion", ru: "свободы мнений", uk: "свободи слова" }
      c: { en: "general freedom of religion", ru: "всеобщей свободы вероисповедания", uk: "загальної свободи віросповідання" }
      d: { en: "developing democracy", ru: "развития демократии", uk: "розвитку демократії" }
    terms:
      - { de: "der Rassismus", en: "racism", ru: "расизм", uk: "расизм" }
      - { de: "kennzeichnen", en: "to characterise", ru: "характеризовать", uk: "характеризувати" }
      - { de: "angeblich", en: "alleged", ru: "мнимый", uk: "нібито" }
