notes:
  - id: general-152
    rationale_de: >-
      Am 30. Januar 1933 wurde Adolf Hitler Reichskanzler. Danach bauten die Nationalsozialisten in kurzer Zeit eine Diktatur auf. Ihre Herrschaft endete erst mit der Niederlage Deutschlands im Zweiten Weltkrieg im Mai 1945.
    source: "bpb: Nationalsozialismus"
    question:
      en: "When were the National Socialists under Adolf Hitler in power in Germany?"
      ru: "Когда национал-социалисты во главе с Адольфом Гитлером были у власти в Германии?"
      uk: "Коли націонал-соціалісти на чолі з Адольфом Гітлером були при владі в Німеччині?"
    options:
      a: { en: "1918 to 1923", ru: "с 1918 по 1923 год", uk: "з 1918 до 1923 року" }
      b: { en: "1932 to 1950", ru: "с 1932 по 1950 год", uk: "з 1932 до 1950 року" }
      c: { en: "1933 to 1945", ru: "с 1933 по 1945 год", uk: "з 1933 до 1945 року" }
      d: { en: "1945 to 1989", ru: "с 1945 по 1989 год", uk: "з 1945 до 1989 року" }
    terms:
      - { de: "an der Macht sein", en: "to be in power", ru: "быть у власти", uk: "бути при владі" }
      - { de: "der Nationalsozialismus", en: "National Socialism", ru: "национал-социализм", uk: "націонал-соціалізм" }
    status: reviewed
  - id: general-153
    rationale_de: >-
      Am 8. Mai 1945 endete der Zweite Weltkrieg in Europa: An diesem Tag kapitulierte die deutsche Wehrmacht bedingungslos. Hitler war schon am 30. April 1945 gestorben. Adenauer wurde erst 1949 Bundeskanzler, und die Mauer in Berlin entstand 1961.
    source: "bpb: Zweiter Weltkrieg"
    question:
      en: "What happened on 8 May 1945?"
      ru: "Что произошло 8 мая 1945 года?"
      uk: "Що відбулося 8 травня 1945 року?"
    options:
      a: { en: "the death of Adolf Hitler", ru: "смерть Адольфа Гитлера", uk: "смерть Адольфа Гітлера" }
      b: { en: "the start of the building of the Berlin Wall", ru: "начало строительства Берлинской стены", uk: "початок будівництва Берлінського муру" }
      c: { en: "the election of Konrad Adenauer as Federal Chancellor", ru: "избрание Конрада Аденауэра федеральным канцлером", uk: "обрання Конрада Аденауера федеральним канцлером" }
      d: { en: "the end of the Second World War in Europe", ru: "окончание Второй мировой войны в Европе", uk: "кінець Другої світової війни в Європі" }
    terms:
      - { de: "die Kapitulation", en: "surrender", ru: "капитуляция", uk: "капітуляція" }
      - { de: "bedingungslos", en: "unconditional", ru: "безоговорочный", uk: "беззастережний" }
    status: reviewed
  - id: general-154
    rationale_de: >-
      Der Zweite Weltkrieg dauerte von 1939 bis 1945. In Europa endete er am 8. Mai 1945 mit der bedingungslosen Kapitulation Deutschlands; Japan kapitulierte einige Monate später. 1933 kam Hitler an die Macht, 1949 wurden zwei deutsche Staaten gegründet, und 1961 wurde die Mauer gebaut.
    source: "bpb: Zweiter Weltkrieg"
    question:
      en: "When did the Second World War end?"
      ru: "Когда закончилась Вторая мировая война?"
      uk: "Коли закінчилася Друга світова війна?"
    options:
      a: { en: "1933", ru: "1933", uk: "1933" }
      b: { en: "1945", ru: "1945", uk: "1945" }
      c: { en: "1949", ru: "1949", uk: "1949" }
      d: { en: "1961", ru: "1961", uk: "1961" }
    terms:
      - { de: "der Weltkrieg", en: "world war", ru: "мировая война", uk: "світова війна" }
    status: reviewed
  - id: general-155
    rationale_de: >-
      Die Zeit des Nationalsozialismus dauerte zwölf Jahre, von 1933 bis 1945. Sie begann am 30. Januar 1933, als Hitler Reichskanzler wurde, und endete mit der Kapitulation Deutschlands im Mai 1945. Von 1888 bis 1918 regierte dagegen Kaiser Wilhelm II., und von 1949 bis 1963 war Konrad Adenauer Bundeskanzler.
    source: "bpb: Nationalsozialismus"
    question:
      en: "When were the National Socialists in power in Germany?"
      ru: "Когда национал-социалисты были у власти в Германии?"
      uk: "Коли націонал-соціалісти були при владі в Німеччині?"
    options:
      a: { en: "1888 to 1918", ru: "с 1888 по 1918 год", uk: "з 1888 до 1918 року" }
      b: { en: "1921 to 1934", ru: "с 1921 по 1934 год", uk: "з 1921 до 1934 року" }
      c: { en: "1933 to 1945", ru: "с 1933 по 1945 год", uk: "з 1933 до 1945 року" }
      d: { en: "1949 to 1963", ru: "с 1949 по 1963 год", uk: "з 1949 до 1963 року" }
    terms:
      - { de: "die Herrschaft", en: "rule", ru: "господство", uk: "панування" }
      - { de: "die Kapitulation", en: "surrender", ru: "капитуляция", uk: "капітуляція" }
    status: reviewed
  - id: general-156
    rationale_de: >-
      Reichspräsident Paul von Hindenburg ernannte Adolf Hitler am 30. Januar 1933 zum Reichskanzler. Damit begann die Diktatur der Nationalsozialisten. Schon 1923 hatte Hitler in München versucht, die Macht mit Gewalt zu übernehmen – damals ohne Erfolg.
    source: "bpb: Nationalsozialismus"
    question:
      en: "In which year did Hitler become Reich Chancellor?"
      ru: "В каком году Гитлер стал рейхсканцлером?"
      uk: "У якому році Гітлер став рейхсканцлером?"
    options:
      a: { en: "1923", ru: "1923", uk: "1923" }
      b: { en: "1927", ru: "1927", uk: "1927" }
      c: { en: "1933", ru: "1933", uk: "1933" }
      d: { en: "1936", ru: "1936", uk: "1936" }
    terms:
      - { de: "der Reichskanzler", en: "Reich Chancellor", ru: "рейхсканцлер", uk: "рейхсканцлер" }
      - { de: "ernennen", en: "to appoint", ru: "назначать", uk: "призначати" }
    status: reviewed
  - id: general-157
    rationale_de: >-
      Nach dem 30. Januar 1933 schafften die Nationalsozialisten die Demokratie in wenigen Monaten ab. Sie verboten andere Parteien, lösten die Gewerkschaften auf, verfolgten ihre Gegner und kontrollierten die Presse. So entstand eine Diktatur: Hitler und seine Partei hatten die ganze Macht. Einen König oder Fürsten gab es nicht.
    source: "bpb: Nationalsozialismus"
    question:
      en: "In 1933, the National Socialists under Adolf Hitler established in Germany …"
      ru: "В 1933 году национал-социалисты во главе с Адольфом Гитлером установили в Германии …"
      uk: "У 1933 році націонал-соціалісти на чолі з Адольфом Гітлером встановили в Німеччині …"
    options:
      a: { en: "a dictatorship.", ru: "диктатуру.", uk: "диктатуру." }
      b: { en: "a democratic state.", ru: "демократическое государство.", uk: "демократичну державу." }
      c: { en: "a monarchy.", ru: "монархию.", uk: "монархію." }
      d: { en: "a principality.", ru: "княжество.", uk: "князівство." }
    terms:
      - { de: "die Diktatur", en: "dictatorship", ru: "диктатура", uk: "диктатура" }
      - { de: "errichten", en: "to establish", ru: "установить", uk: "встановлювати" }
      - { de: "das Fürstentum", en: "principality", ru: "княжество", uk: "князівство" }
    status: reviewed
  - id: general-158
    rationale_de: >-
      Mit „Drittes Reich“ meint man den deutschen Staat unter den Nationalsozialisten von 1933 bis 1945. Er war eine Diktatur: Es gab keine freien Wahlen, andere Parteien waren verboten, und Hitler hatte die ganze Macht. Eine Räterepublik gab es nur kurz nach dem Ersten Weltkrieg, zum Beispiel 1919 in München.
    source: "bpb: Nationalsozialismus"
    question:
      en: "The “Third Reich” was a …"
      ru: "«Третий рейх» был …"
      uk: "«Третій рейх» був …"
    options:
      a: { en: "dictatorship.", ru: "диктатурой.", uk: "диктатурою." }
      b: { en: "democracy.", ru: "демократией.", uk: "демократією." }
      c: { en: "monarchy.", ru: "монархией.", uk: "монархією." }
      d: { en: "council republic.", ru: "советской республикой.", uk: "радянською республікою." }
    terms:
      - { de: "die Diktatur", en: "dictatorship", ru: "диктатура", uk: "диктатура" }
      - { de: "die Räterepublik", en: "council republic", ru: "советская республика", uk: "радянська республіка" }
    status: reviewed
  - id: general-159
    rationale_de: >-
      Freie Wahlen gab es in der NS-Zeit nicht: Ab Juli 1933 war die NSDAP die einzige erlaubte Partei. Die Presse wurde zensiert, Menschen wurden ohne Gerichtsurteil verhaftet, und Jüdinnen und Juden wurden verfolgt und ermordet. Die anderen drei Antworten beschreiben also Dinge, die es gab.
    source: "bpb: Nationalsozialismus"
    question:
      en: "What did not exist in Germany during the National Socialist era?"
      ru: "Чего не было в Германии во времена национал-социализма?"
      uk: "Чого не було в Німеччині за часів націонал-соціалізму?"
    options:
      a: { en: "free elections", ru: "свободных выборов", uk: "вільних виборів" }
      b: { en: "press censorship", ru: "цензуры прессы", uk: "цензури преси" }
      c: { en: "arbitrary arrests", ru: "произвольных арестов", uk: "свавільних арештів" }
      d: { en: "persecution of Jews", ru: "преследования евреев", uk: "переслідування євреїв" }
    terms:
      - { de: "die Pressezensur", en: "press censorship", ru: "цензура прессы", uk: "цензура преси" }
      - { de: "willkürlich", en: "arbitrary", ru: "произвольный", uk: "свавільний" }
      - { de: "die Verhaftung", en: "arrest", ru: "арест", uk: "арешт" }
    status: reviewed
  - id: general-160
    rationale_de: >-
      Der Zweite Weltkrieg begann am 1. September 1939 mit dem deutschen Angriff auf Polen. In Europa endete er am 8. Mai 1945 mit der Kapitulation Deutschlands. Der Erste Weltkrieg dauerte dagegen von 1914 bis 1918.
    source: "bpb: Zweiter Weltkrieg"
    question:
