notes:
  - id: general-152
    rationale_de: >-
      Am 30. Januar 1933 wurde Adolf Hitler Reichskanzler. Danach bauten die Nationalsozialisten in kurzer Zeit eine Diktatur auf. Ihre Herrschaft endete erst mit der Niederlage Deutschlands im Zweiten Weltkrieg im Mai 1945.
    source: "bpb: Nationalsozialismus"
    question:
      en: "When were the National Socialists under Adolf Hitler in power in Germany?"
      ru: "Когда национал-социалисты во главе с Адольфом Гитлером были у власти в Германии?"
    options:
      a: { en: "1918 to 1923", ru: "с 1918 по 1923 год" }
      b: { en: "1932 to 1950", ru: "с 1932 по 1950 год" }
      c: { en: "1933 to 1945", ru: "с 1933 по 1945 год" }
      d: { en: "1945 to 1989", ru: "с 1945 по 1989 год" }
    terms:
      - { de: "an der Macht sein", en: "to be in power", ru: "быть у власти" }
      - { de: "der Nationalsozialismus", en: "National Socialism", ru: "национал-социализм" }
    status: draft
  - id: general-153
    rationale_de: >-
      Am 8. Mai 1945 endete der Zweite Weltkrieg in Europa: An diesem Tag kapitulierte die deutsche Wehrmacht bedingungslos. Hitler war schon am 30. April 1945 gestorben. Adenauer wurde erst 1949 Bundeskanzler, und die Mauer in Berlin entstand 1961.
    source: "bpb: Zweiter Weltkrieg"
    question:
      en: "What happened on 8 May 1945?"
      ru: "Что произошло 8 мая 1945 года?"
    options:
      a: { en: "the death of Adolf Hitler", ru: "смерть Адольфа Гитлера" }
      b: { en: "the start of the building of the Berlin Wall", ru: "начало строительства Берлинской стены" }
      c: { en: "the election of Konrad Adenauer as Federal Chancellor", ru: "избрание Конрада Аденауэра федеральным канцлером" }
      d: { en: "the end of the Second World War in Europe", ru: "окончание Второй мировой войны в Европе" }
    terms:
      - { de: "die Kapitulation", en: "surrender", ru: "капитуляция" }
      - { de: "bedingungslos", en: "unconditional", ru: "безоговорочный" }
    status: draft
  - id: general-154
    rationale_de: >-
      Der Zweite Weltkrieg dauerte von 1939 bis 1945. In Europa endete er am 8. Mai 1945 mit der bedingungslosen Kapitulation Deutschlands; Japan kapitulierte einige Monate später. 1933 kam Hitler an die Macht, 1949 wurden zwei deutsche Staaten gegründet, und 1961 wurde die Mauer gebaut.
    source: "bpb: Zweiter Weltkrieg"
    question:
      en: "When did the Second World War end?"
      ru: "Когда закончилась Вторая мировая война?"
    options:
      a: { en: "1933", ru: "1933" }
      b: { en: "1945", ru: "1945" }
      c: { en: "1949", ru: "1949" }
      d: { en: "1961", ru: "1961" }
    terms:
      - { de: "der Weltkrieg", en: "world war", ru: "мировая война" }
    status: draft
  - id: general-155
    rationale_de: >-
      Die Zeit des Nationalsozialismus dauerte zwölf Jahre, von 1933 bis 1945. Sie begann am 30. Januar 1933, als Hitler Reichskanzler wurde, und endete mit der Kapitulation Deutschlands im Mai 1945. Von 1888 bis 1918 regierte dagegen Kaiser Wilhelm II., und von 1949 bis 1963 war Konrad Adenauer Bundeskanzler.
    source: "bpb: Nationalsozialismus"
    question:
      en: "When were the National Socialists in power in Germany?"
      ru: "Когда национал-социалисты были у власти в Германии?"
    options:
      a: { en: "1888 to 1918", ru: "с 1888 по 1918 год" }
      b: { en: "1921 to 1934", ru: "с 1921 по 1934 год" }
      c: { en: "1933 to 1945", ru: "с 1933 по 1945 год" }
      d: { en: "1949 to 1963", ru: "с 1949 по 1963 год" }
    terms:
      - { de: "die Herrschaft", en: "rule", ru: "господство" }
      - { de: "die Kapitulation", en: "surrender", ru: "капитуляция" }
    status: draft
  - id: general-156
    rationale_de: >-
      Reichspräsident Paul von Hindenburg ernannte Adolf Hitler am 30. Januar 1933 zum Reichskanzler. Damit begann die Diktatur der Nationalsozialisten. Schon 1923 hatte Hitler in München versucht, die Macht mit Gewalt zu übernehmen – damals ohne Erfolg.
    source: "bpb: Nationalsozialismus"
    question:
      en: "In which year did Hitler become Reich Chancellor?"
      ru: "В каком году Гитлер стал рейхсканцлером?"
    options:
      a: { en: "1923", ru: "1923" }
      b: { en: "1927", ru: "1927" }
      c: { en: "1933", ru: "1933" }
      d: { en: "1936", ru: "1936" }
    terms:
      - { de: "der Reichskanzler", en: "Reich Chancellor", ru: "рейхсканцлер" }
      - { de: "ernennen", en: "to appoint", ru: "назначать" }
    status: draft
  - id: general-157
    rationale_de: >-
      Nach dem 30. Januar 1933 schafften die Nationalsozialisten die Demokratie in wenigen Monaten ab. Sie verboten andere Parteien, lösten die Gewerkschaften auf, verfolgten ihre Gegner und kontrollierten die Presse. So entstand eine Diktatur: Hitler und seine Partei hatten die ganze Macht. Einen König oder Fürsten gab es nicht.
    source: "bpb: Nationalsozialismus"
    question:
      en: "In 1933, the National Socialists under Adolf Hitler established in Germany …"
      ru: "В 1933 году национал-социалисты во главе с Адольфом Гитлером установили в Германии …"
    options:
      a: { en: "a dictatorship.", ru: "диктатуру." }
      b: { en: "a democratic state.", ru: "демократическое государство." }
      c: { en: "a monarchy.", ru: "монархию." }
      d: { en: "a principality.", ru: "княжество." }
    terms:
      - { de: "die Diktatur", en: "dictatorship", ru: "диктатура" }
      - { de: "errichten", en: "to establish", ru: "установить" }
      - { de: "das Fürstentum", en: "principality", ru: "княжество" }
    status: draft
  - id: general-158
    rationale_de: >-
      Mit „Drittes Reich“ meint man den deutschen Staat unter den Nationalsozialisten von 1933 bis 1945. Er war eine Diktatur: Es gab keine freien Wahlen, andere Parteien waren verboten, und Hitler hatte die ganze Macht. Eine Räterepublik gab es nur kurz nach dem Ersten Weltkrieg, zum Beispiel 1919 in München.
    source: "bpb: Nationalsozialismus"
    question:
      en: "The “Third Reich” was a …"
      ru: "«Третий рейх» был …"
    options:
      a: { en: "dictatorship.", ru: "диктатурой." }
      b: { en: "democracy.", ru: "демократией." }
      c: { en: "monarchy.", ru: "монархией." }
      d: { en: "council republic.", ru: "советской республикой." }
    terms:
      - { de: "die Diktatur", en: "dictatorship", ru: "диктатура" }
      - { de: "die Räterepublik", en: "council republic", ru: "советская республика" }
    status: draft
  - id: general-159
    rationale_de: >-
      Freie Wahlen gab es in der NS-Zeit nicht: Ab Juli 1933 war die NSDAP die einzige erlaubte Partei. Die Presse wurde zensiert, Menschen wurden ohne Gerichtsurteil verhaftet, und Jüdinnen und Juden wurden verfolgt und ermordet. Die anderen drei Antworten beschreiben also Dinge, die es gab.
    source: "bpb: Nationalsozialismus"
    question:
      en: "What did not exist in Germany during the National Socialist era?"
      ru: "Чего не было в Германии во времена национал-социализма?"
    options:
      a: { en: "free elections", ru: "свободных выборов" }
      b: { en: "press censorship", ru: "цензуры прессы" }
      c: { en: "arbitrary arrests", ru: "произвольных арестов" }
      d: { en: "persecution of Jews", ru: "преследования евреев" }
    terms:
      - { de: "die Pressezensur", en: "press censorship", ru: "цензура прессы" }
      - { de: "willkürlich", en: "arbitrary", ru: "произвольный" }
      - { de: "die Verhaftung", en: "arrest", ru: "арест" }
    status: draft
  - id: general-160
    rationale_de: >-
      Der Zweite Weltkrieg begann am 1. September 1939 mit dem deutschen Angriff auf Polen. In Europa endete er am 8. Mai 1945 mit der Kapitulation Deutschlands. Der Erste Weltkrieg dauerte dagegen von 1914 bis 1918.
    source: "bpb: Zweiter Weltkrieg"
    question:
      en: "Which war lasted from 1939 to 1945?"
      ru: "Какая война продолжалась с 1939 по 1945 год?"
    options:
      a: { en: "the First World War", ru: "Первая мировая война" }
      b: { en: "the Second World War", ru: "Вторая мировая война" }
      c: { en: "the Vietnam War", ru: "война во Вьетнаме" }
      d: { en: "the Gulf War", ru: "война в Персидском заливе" }
    terms:
      - { de: "der Angriff", en: "attack", ru: "нападение" }
    status: draft
  - id: general-161
    rationale_de: >-
      Die Nationalsozialisten teilten Menschen nach einer angeblichen „Rasse“ ein und hielten viele für weniger wert. Dieser Rassismus wurde Politik des Staates: Die „Nürnberger Gesetze“ von 1935 nahmen den Jüdinnen und Juden ihre politischen Rechte. Am Ende stand der Holocaust – der Mord an etwa sechs Millionen europäischen Jüdinnen und Juden; auch Sinti und Roma wurden verfolgt und ermordet.
    source: "bpb: Nationalsozialismus"
    question:
      en: "What characterised the Nazi state? A policy of …"
      ru: "Что было характерно для нацистского государства? Политика …"
    options:
      a: { en: "state racism", ru: "государственного расизма" }
      b: { en: "freedom of opinion", ru: "свободы мнений" }
      c: { en: "general freedom of religion", ru: "всеобщей свободы вероисповедания" }
      d: { en: "developing democracy", ru: "развития демократии" }
    terms:
      - { de: "der Rassismus", en: "racism", ru: "расизм" }
      - { de: "kennzeichnen", en: "to characterise", ru: "характеризовать" }
      - { de: "angeblich", en: "alleged", ru: "мнимый" }
    status: draft
  - id: general-162
    rationale_de: >-
      Claus Schenk Graf von Stauffenberg war Offizier der Wehrmacht und gehörte zum Widerstand gegen Hitler. Am 20. Juli 1944 brachte er eine Bombe in Hitlers Hauptquartier „Wolfsschanze“. Hitler überlebte das Attentat, und Stauffenberg wurde noch in derselben Nacht in Berlin erschossen.
    source: "bpb: Widerstand gegen den Nationalsozialismus"
    question:
      en: "Claus Schenk Graf von Stauffenberg became known for …"
      ru: "Клаус Шенк граф фон Штауффенберг стал известен благодаря …"
    options:
      a: { en: "a gold medal at the 1936 Olympic Games.", ru: "золотой медали на Олимпийских играх 1936 года." }
      b: { en: "the construction of the Reichstag building.", ru: "строительству здания рейхстага." }
      c: { en: "building up the Wehrmacht.", ru: "созданию вермахта." }
      d: { en: "the assassination attempt on Hitler on 20 July 1944.", ru: "покушению на Гитлера 20 июля 1944 года." }
    terms:
      - { de: "das Attentat", en: "assassination attempt", ru: "покушение" }
      - { de: "der Widerstand", en: "resistance", ru: "сопротивление" }
    status: draft
  - id: general-163
    rationale_de: >-
      In der Nacht vom 9. zum 10. November 1938 und an den Tagen danach zerstörten Nationalsozialisten und ihre Anhänger in ganz Deutschland Synagogen und jüdische Geschäfte. Viele Jüdinnen und Juden wurden ermordet, und Zehntausende jüdische Männer kamen in Konzentrationslager. Heute nennt man diese Gewalt die Novemberpogrome.
    source: "bpb: Novemberpogrome 1938"
    question:
      en: "In which year did the National Socialists destroy synagogues and Jewish shops in Germany?"
      ru: "В каком году национал-социалисты разрушили синагоги и еврейские магазины в Германии?"
    options:
      a: { en: "1925", ru: "1925" }
      b: { en: "1930", ru: "1930" }
      c: { en: "1938", ru: "1938" }
      d: { en: "1945", ru: "1945" }
    terms:
      - { de: "die Synagoge", en: "synagogue", ru: "синагога" }
      - { de: "zerstören", en: "to destroy", ru: "разрушать" }
      - { de: "das Pogrom", en: "pogrom", ru: "погром" }
    status: draft
  - id: general-164
    rationale_de: >-
      In der Nacht vom 9. zum 10. November 1938 zerstörten Nationalsozialisten und ihre Anhänger überall in Deutschland Synagogen, jüdische Geschäfte und Wohnungen. Viele Jüdinnen und Juden wurden misshandelt oder ermordet. Man nennt diese Gewalt heute die Novemberpogrome. Der Angriff auf Polen und damit der Zweite Weltkrieg begann erst am 1. September 1939.
    source: "bpb: Novemberpogrome 1938"
    question:
      en: "What happened in Germany on 9 November 1938?"
      ru: "Что произошло в Германии 9 ноября 1938 года?"
    options:
      a: { en: "With the attack on Poland, the Second World War begins.", ru: "Нападением на Польшу начинается Вторая мировая война." }
      b: { en: "The National Socialists lose an election and dissolve the Reichstag.", ru: "Национал-социалисты проигрывают выборы и распускают рейхстаг." }
      c: { en: "Jewish shops and synagogues are destroyed by National Socialists and their supporters.", ru: "Национал-социалисты и их сторонники разрушают еврейские магазины и синагоги." }
      d: { en: "Hitler becomes Reich President and has all parties banned.", ru: "Гитлер становится рейхспрезидентом и приказывает запретить все партии." }
    terms:
      - { de: "der Anhänger", en: "supporter", ru: "сторонник" }
      - { de: "die Novemberpogrome", en: "November pogroms", ru: "ноябрьские погромы" }
    status: draft
  - id: general-170
    rationale_de: >-
      In der NS-Zeit waren alle Parteien außer der NSDAP verboten. Grundrechte wie Pressefreiheit, freie Entfaltung der Persönlichkeit oder den Schutz der Menschenwürde gab es nicht. Heute stehen genau diese Rechte am Anfang des Grundgesetzes: in den Artikeln 1, 2 und 5.
    source: "bpb: Nationalsozialismus; GG Art. 1, Art. 2, Art. 5"
    question:
      en: "What existed in Germany during the National Socialist era?"
      ru: "Что было в Германии во времена национал-социализма?"
    options:
      a: { en: "the banning of parties", ru: "запрет партий" }
      b: { en: "the right to free development of one's personality", ru: "право на свободное развитие личности" }
      c: { en: "freedom of the press", ru: "свобода прессы" }
      d: { en: "the protection of human dignity", ru: "защита человеческого достоинства" }
    terms:
      - { de: "das Verbot", en: "ban", ru: "запрет" }
      - { de: "die Entfaltung", en: "development", ru: "развитие" }
    status: draft
  - id: general-179
    rationale_de: >-
      Offiziell endete der Krieg in Europa mit der bedingungslosen Kapitulation der deutschen Wehrmacht am 8. Mai 1945. „Bedingungslos“ heißt: Deutschland konnte keine Bedingungen stellen und musste alle Forderungen der Sieger annehmen. Hitlers Tod am 30. April 1945 beendete den Krieg noch nicht – die Kämpfe gingen weiter.
    source: "bpb: Zweiter Weltkrieg"
    question:
      en: "How did the Second World War in Europe officially end?"
      ru: "Как официально закончилась Вторая мировая война в Европе?"
    options:
      a: { en: "with the death of Adolf Hitler", ru: "смертью Адольфа Гитлера" }
      b: { en: "through Germany's unconditional surrender", ru: "безоговорочной капитуляцией Германии" }
      c: { en: "with the withdrawal of the Germans from the occupied territories", ru: "отступлением немцев с оккупированных территорий" }
      d: { en: "through a revolution in Germany", ru: "революцией в Германии" }
    terms:
      - { de: "bedingungslos", en: "unconditional", ru: "безоговорочный" }
      - { de: "die Kapitulation", en: "surrender", ru: "капитуляция" }
      - { de: "der Rückzug", en: "withdrawal", ru: "отступление" }
    status: draft
