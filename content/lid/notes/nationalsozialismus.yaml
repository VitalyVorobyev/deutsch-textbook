      b: { en: "The National Socialists lose an election and dissolve the Reichstag.", ru: "Национал-социалисты проигрывают выборы и распускают рейхстаг.", uk: "Націонал-соціалісти програють вибори й розпускають Рейхстаг." }
      c: { en: "Jewish shops and synagogues are destroyed by National Socialists and their supporters.", ru: "Национал-социалисты и их сторонники разрушают еврейские магазины и синагоги.", uk: "Єврейські крамниці й синагоги руйнують націонал-соціалісти та їхні прибічники." }
      d: { en: "Hitler becomes Reich President and has all parties banned.", ru: "Гитлер становится рейхспрезидентом и приказывает запретить все партии.", uk: "Гітлер стає рейхспрезидентом і наказує заборонити всі партії." }
