      a: { en: "with the death of Adolf Hitler", ru: "смертью Адольфа Гитлера", uk: "смертю Адольфа Гітлера" }
      b: { en: "through Germany's unconditional surrender", ru: "безоговорочной капитуляцией Германии", uk: "беззастережною капітуляцією Німеччини" }
      c: { en: "with the withdrawal of the Germans from the occupied territories", ru: "отступлением немцев с оккупированных территорий", uk: "відступом німців з окупованих територій" }
      d: { en: "through a revolution in Germany", ru: "революцией в Германии", uk: "революцією в Німеччині" }
