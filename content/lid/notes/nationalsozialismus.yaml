      a: { en: "the banning of parties", ru: "запрет партий", uk: "заборона партій" }
      b: { en: "the right to free development of one's personality", ru: "право на свободное развитие личности", uk: "право на вільний розвиток особистості" }
      c: { en: "freedom of the press", ru: "свобода прессы", uk: "свобода преси" }
      d: { en: "the protection of human dignity", ru: "защита человеческого достоинства", uk: "захист людської гідності" }
