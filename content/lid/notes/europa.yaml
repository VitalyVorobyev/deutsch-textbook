notes:
  - id: general-173
    rationale_de: >-
      1957 gründete die Bundesrepublik zusammen mit fünf anderen Staaten die Europäische Wirtschaftsgemeinschaft (Römische Verträge). Aus ihr wurde später die Europäische Union, die es seit 1993 gibt. Der NATO trat die Bundesrepublik dagegen erst 1955 bei, den Vereinten Nationen 1973 – und im Warschauer Pakt war sie nie.
    source: Römische Verträge (1957); Vertrag von Maastricht
    question:
      en: "The Federal Republic of Germany is a founding member …"
      ru: "Федеративная Республика Германия является одним из основателей …"
      uk: "Федеративна Республіка Німеччина є одним із членів-засновників …"
    options:
      a: { en: "of the North Atlantic Treaty Organization (NATO).", ru: "Организации Североатлантического договора (НАТО).", uk: "Північноатлантичного договору (НАТО)." }
      b: { en: "of the United Nations (UN).", ru: "Организации Объединённых Наций (ООН).", uk: "Організації Об’єднаних Націй (ООН)." }
      c: { en: "of the European Union (EU).", ru: "Европейского союза (ЕС).", uk: "Європейського Союзу (ЄС)." }
      d: { en: "of the Warsaw Pact.", ru: "Варшавского договора.", uk: "Варшавського договору." }
    terms:
      - { de: "das Gründungsmitglied", en: "founding member", ru: "член-основатель", uk: "член-засновник" }
    status: reviewed
  - id: general-221
    rationale_de: >-
      Im Schengen-Raum gibt es an den Grenzen zwischen den Mitgliedsländern normalerweise keine Passkontrollen. Dazu gehören die meisten EU-Länder und auch einige andere, zum Beispiel die Schweiz und Norwegen. An den Außengrenzen des Schengen-Raums wird aber kontrolliert, und den Ausweis sollte man immer dabeihaben.
    source: Schengener Abkommen (1985)
    question:
      en: "Germany is a member of the Schengen Agreement. What does that mean?"
      ru: "Германия — участница Шенгенского соглашения. Что это означает?"
      uk: "Німеччина є учасницею Шенгенської угоди. Що це означає?"
    options:
      a: { en: "Germans can travel to many countries in Europe without passport control.", ru: "Немцы могут ездить во многие страны Европы без паспортного контроля.", uk: "Німці можуть подорожувати до багатьох країн Європи без паспортного контролю." }
      b: { en: "Anyone can enter Germany without identity checks.", ru: "Все люди могут въезжать в Германию без проверки документов.", uk: "Усі люди можуть в’їжджати до Німеччини без перевірки особи." }
      c: { en: "Germans can travel to any country without passport control.", ru: "Немцы могут ездить в любую страну без паспортного контроля.", uk: "Німці можуть подорожувати до будь-якої країни без паспортного контролю." }
      d: { en: "Germans can pay with the euro in every country.", ru: "Немцы могут платить евро в любой стране.", uk: "Німці можуть розраховуватися євро в будь-якій країні." }
    terms:
      - { de: "das Abkommen", en: "agreement", ru: "соглашение", uk: "угода" }
      - { de: "die Passkontrolle", en: "passport control", ru: "паспортный контроль", uk: "паспортний контроль" }
    status: reviewed
  - id: general-222
    rationale_de: >-
      Die Schweiz grenzt im Süden an Deutschland; ein großer Teil der Grenze verläuft am Rhein und am Bodensee. Deutschland hat neun Nachbarländer: Dänemark, Polen, Tschechien, Österreich, die Schweiz, Frankreich, Luxemburg, Belgien und die Niederlande. Ungarn, Portugal und Spanien haben keine gemeinsame Grenze mit Deutschland.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
      uk: "Яка країна є сусідньою з Німеччиною?"
    options:
      a: { en: "Hungary", ru: "Венгрия", uk: "Угорщина" }
      b: { en: "Portugal", ru: "Португалия", uk: "Португалія" }
      c: { en: "Spain", ru: "Испания", uk: "Іспанія" }
      d: { en: "Switzerland", ru: "Швейцария", uk: "Швейцарія" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна", uk: "сусідня країна" }
      - { de: "grenzen an", en: "to border on", ru: "граничить с", uk: "межувати з" }
    status: reviewed
  - id: general-223
    rationale_de: >-
      Polen liegt im Osten von Deutschland. Die Grenze verläuft zu einem großen Teil an den Flüssen Oder und Neiße. Rumänien, Bulgarien und Griechenland liegen weiter im Südosten Europas und grenzen nicht an Deutschland.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
      uk: "Яка країна є сусідньою з Німеччиною?"
    options:
      a: { en: "Romania", ru: "Румыния", uk: "Румунія" }
      b: { en: "Bulgaria", ru: "Болгария", uk: "Болгарія" }
      c: { en: "Poland", ru: "Польша", uk: "Польща" }
      d: { en: "Greece", ru: "Греция", uk: "Греція" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна", uk: "сусідня країна" }
      - { de: "die Grenze", en: "border", ru: "граница", uk: "кордон" }
    status: reviewed
  - id: general-224
    rationale_de: >-
      EU heißt Europäische Union. Seit 2020 hat sie 27 Mitgliedstaaten, und Deutschland ist einer davon. Unter diesem Namen gibt es die EU seit 1993, seit dem Vertrag von Maastricht.
    source: Vertrag von Maastricht
    question:
      en: "What does the abbreviation EU stand for?"
      ru: "Что означает аббревиатура EU?"
      uk: "Що означає абревіатура EU?"
    options:
      a: { en: "European Enterprises", ru: "Европейские предприятия", uk: "Європейські підприємства" }
      b: { en: "European Union", ru: "Европейский союз", uk: "Європейський Союз" }
      c: { en: "Uniform Union", ru: "Единый союз", uk: "Єдиний Союз" }
      d: { en: "Euro Union", ru: "Союз евро", uk: "Союз євро" }
    terms:
      - { de: "die Abkürzung", en: "abbreviation", ru: "аббревиатура", uk: "абревіатура" }
    status: reviewed
  - id: general-225
    rationale_de: >-
      In Österreich ist Deutsch die Amtssprache, und fast alle Menschen sprechen Deutsch. Auch in der Schweiz, in Liechtenstein und in Luxemburg ist Deutsch eine Amtssprache. Österreich ist auch ein Nachbarland von Bayern.
    question:
      en: "In which other country is there a large German-speaking population?"
      ru: "В какой ещё стране живёт много людей, говорящих по-немецки?"
      uk: "У якій іншій країні є велике німецькомовне населення?"
    options:
      a: { en: "Czech Republic", ru: "Чехия", uk: "Чехія" }
      b: { en: "Norway", ru: "Норвегия", uk: "Норвегія" }
      c: { en: "Spain", ru: "Испания", uk: "Іспанія" }
      d: { en: "Austria", ru: "Австрия", uk: "Австрія" }
    terms:
      - { de: "deutschsprachig", en: "German-speaking", ru: "немецкоязычный", uk: "німецькомовний" }
      - { de: "die Bevölkerung", en: "population", ru: "население", uk: "населення" }
      - { de: "die Amtssprache", en: "official language", ru: "официальный язык", uk: "офіційна мова" }
    status: reviewed
  - id: general-226
    rationale_de: >-
      Bild 2 zeigt die Flagge der Europäischen Union: zwölf goldene Sterne im Kreis auf blauem Grund. Es bleiben immer zwölf Sterne, auch wenn neue Länder dazukommen. Bild 1 ist die Flagge der USA, Bild 3 die Flagge der Vereinten Nationen, und Bild 4 ist zwar blau und gelb, zeigt aber keinen Sternenkreis.
    source: Europäische Union
    question:
      en: "Which is the flag of the European Union?"
      ru: "Какой из флагов — флаг Европейского союза?"
      uk: "Який із прапорів — прапор Європейського Союзу?"
    options:
      a: { en: "Picture 1", ru: "Изображение 1", uk: "Зображення 1" }
      b: { en: "Picture 2", ru: "Изображение 2", uk: "Зображення 2" }
      c: { en: "Picture 3", ru: "Изображение 3", uk: "Зображення 3" }
      d: { en: "Picture 4", ru: "Изображение 4", uk: "Зображення 4" }
    terms:
      - { de: "die Flagge", en: "flag", ru: "флаг", uk: "прапор" }
      - { de: "der Stern", en: "star", ru: "звезда", uk: "зірка" }
    status: reviewed
  - id: general-227
    rationale_de: >-
      Dänemark liegt im Norden und grenzt an Schleswig-Holstein. Norwegen, Schweden und Finnland gehören auch zu Nordeuropa, haben aber keine Landgrenze mit Deutschland. Nach Schweden kommt man zum Beispiel mit der Fähre über die Ostsee.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
      uk: "Яка країна є сусідньою з Німеччиною?"
    options:
      a: { en: "Finland", ru: "Финляндия", uk: "Фінляндія" }
      b: { en: "Denmark", ru: "Дания", uk: "Данія" }
      c: { en: "Norway", ru: "Норвегия", uk: "Норвегія" }
      d: { en: "Sweden", ru: "Швеция", uk: "Швеція" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна", uk: "сусідня країна" }
    status: reviewed
  - id: general-229
    rationale_de: >-
      Luxemburg ist ein kleines Land im Westen und grenzt an Rheinland-Pfalz und das Saarland. Es gehörte 1957 zu den sechs Gründungsstaaten der Europäischen Wirtschaftsgemeinschaft. Spanien, Bulgarien und Norwegen sind keine Nachbarländer von Deutschland.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
      uk: "Яка країна є сусідньою з Німеччиною?"
    options:
      a: { en: "Spain", ru: "Испания", uk: "Іспанія" }
      b: { en: "Bulgaria", ru: "Болгария", uk: "Болгарія" }
      c: { en: "Norway", ru: "Норвегия", uk: "Норвегія" }
      d: { en: "Luxembourg", ru: "Люксембург", uk: "Люксембург" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна", uk: "сусідня країна" }
    status: reviewed
  - id: general-230
    rationale_de: >-
      Das Europäische Parlament wird alle fünf Jahre gewählt (Vertrag über die Europäische Union, Artikel 14). Die letzte Europawahl war im Juni 2024, die nächste ist 2029. In Deutschland darf man bei der Europawahl schon ab 16 Jahren wählen.
    source: EUV Art. 14 Abs. 3
    question:
      en: "The European Parliament is elected regularly, namely every …"
      ru: "Европейский парламент избирается регулярно, а именно каждые …"
      uk: "Європейський парламент обирають регулярно, а саме кожні …"
    options:
      a: { en: "5 years.", ru: "5 лет.", uk: "5 років." }
      b: { en: "6 years.", ru: "6 лет.", uk: "6 років." }
      c: { en: "7 years.", ru: "7 лет.", uk: "7 років." }
      d: { en: "8 years.", ru: "8 лет.", uk: "8 років." }
    terms:
      - { de: "die Europawahl", en: "European election", ru: "выборы в Европейский парламент", uk: "вибори до Європейського парламенту" }
      - { de: "regelmäßig", en: "regularly", ru: "регулярно", uk: "регулярно" }
    status: reviewed
  - id: general-231
    rationale_de: >-
      Europäische Integration heißt: Die Staaten Europas arbeiten immer enger zusammen und schließen sich zusammen. Nach dem Zweiten Weltkrieg begann das mit sechs Ländern, heute hat die Europäische Union 27 Mitglieder. Mit Einwanderung hat dieser Begriff nichts zu tun – anders als die Integration von Zugewanderten.
    question:
      en: "What does the term “European integration” mean?"
      ru: "Что означает понятие «европейская интеграция»?"
      uk: "Що означає поняття «європейська інтеграція»?"
    options:
      a: { en: "It refers to American immigrants in Europe.", ru: "Имеются в виду американские иммигранты в Европе.", uk: "Ідеться про американських іммігранток та іммігрантів у Європі." }
      b: { en: "The term means the halt to immigration into Europe.", ru: "Понятие означает прекращение иммиграции в Европу.", uk: "Поняття означає припинення імміграції до Європи." }
      c: { en: "It refers to European emigrants in the USA.", ru: "Имеются в виду европейские эмигранты в США.", uk: "Ідеться про європейських емігранток та емігрантів у США." }
      d: { en: "The term means the joining together of European states to form the EU.", ru: "Понятие означает объединение европейских государств в ЕС.", uk: "Поняття означає об’єднання європейських держав у ЄС." }
    terms:
      - { de: "die Integration", en: "integration", ru: "интеграция", uk: "інтеграція" }
      - { de: "der Zusammenschluss", en: "joining together", ru: "объединение", uk: "об’єднання" }
    status: reviewed
  - id: general-232
    rationale_de: >-
      Bei der Europawahl wählen die Bürgerinnen und Bürger der EU die Abgeordneten des Europäischen Parlaments. Deutschland hat dort 96 Sitze, mehr als jedes andere Land. Die Europäische Kommission wählt das Volk dagegen nicht direkt, und eine europäische Verfassung gibt es nicht.
    source: EUV Art. 14
    question:
      en: "Who is elected in the European election?"
      ru: "Кого избирают на европейских выборах?"
      uk: "Кого обирають на європейських виборах?"
    options:
      a: { en: "the European Commission", ru: "Европейскую комиссию", uk: "Європейську комісію" }
      b: { en: "the countries that may join the EU", ru: "страны, которым разрешено вступить в ЕС", uk: "країни, яким дозволено вступити до ЄС" }
      c: { en: "the members of the European Parliament", ru: "депутатов Европейского парламента", uk: "депутатів Європейського парламенту" }
      d: { en: "the European constitution", ru: "европейскую конституцию", uk: "європейську конституцію" }
    terms:
      - { de: "die Europawahl", en: "European election", ru: "выборы в Европейский парламент", uk: "вибори до Європейського парламенту" }
      - { de: "die Europäische Kommission", en: "European Commission", ru: "Европейская комиссия", uk: "Європейська комісія" }
    status: reviewed
  - id: general-233
    rationale_de: >-
      Tschechien ist ein Nachbarland von Deutschland: Es grenzt an Bayern und an Sachsen. Die Hauptstadt ist Prag. Bulgarien, Griechenland und Portugal haben dagegen keine Grenze mit Deutschland.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
      uk: "Яка країна є сусідньою з Німеччиною?"
    options:
      a: { en: "Czech Republic", ru: "Чехия", uk: "Чехія" }
      b: { en: "Bulgaria", ru: "Болгария", uk: "Болгарія" }
      c: { en: "Greece", ru: "Греция", uk: "Греція" }
      d: { en: "Portugal", ru: "Португалия", uk: "Португалія" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна", uk: "сусідня країна" }
    status: reviewed
  - id: general-234
    rationale_de: >-
      Der offizielle Sitz des Europäischen Parlaments ist Straßburg in Frankreich; dort finden die meisten Plenarsitzungen statt. Das Parlament arbeitet auch in Brüssel und in Luxemburg. In London, Paris oder Berlin hat es keinen Sitz.
    source: EU-Verträge, Protokoll Nr. 6
    question:
      en: "Where is one seat of the European Parliament?"
      ru: "Где находится одна из резиденций Европейского парламента?"
      uk: "Де розташована одна з резиденцій Європейського парламенту?"
    options:
      a: { en: "London", ru: "Лондон", uk: "Лондон" }
      b: { en: "Paris", ru: "Париж", uk: "Париж" }
      c: { en: "Berlin", ru: "Берлин", uk: "Берлін" }
      d: { en: "Strasbourg", ru: "Страсбург", uk: "Страсбург" }
    terms:
      - { de: "der Sitz", en: "seat", ru: "резиденция", uk: "резиденція" }
      - { de: "die Plenarsitzung", en: "plenary session", ru: "пленарное заседание", uk: "пленарне засідання" }
    status: reviewed
  - id: general-235
    rationale_de: >-
      1984 trafen sich François Mitterrand und Helmut Kohl in Verdun in Frankreich. Dort starben im Ersten Weltkrieg sehr viele deutsche und französische Soldaten. Die beiden Politiker hielten sich an den Händen – ein Zeichen der Versöhnung zwischen früheren Feinden. Frieden und Sicherheit sind ein zentrales Ziel der europäischen Einigung.
    source: EUV Art. 3 Abs. 1
    question:
      en: "The then French President François Mitterrand and the then German Federal Chancellor Helmut Kohl together commemorate the dead of both world wars in Verdun. Which goal of the European Union becomes clear at this meeting?"
      ru: "Тогдашний президент Франции Франсуа Миттеран и тогдашний федеральный канцлер Германии Гельмут Коль вместе чтят в Вердене память погибших в обеих мировых войнах. Какая цель Европейского союза проявляется в этой встрече?"
      uk: "Тодішній президент Франції Франсуа Міттеран і тодішній федеральний канцлер Німеччини Гельмут Коль разом вшановують у Вердені пам’ять загиблих обох світових воєн. Яка мета Європейського Союзу стає очевидною на цій зустрічі?"
    options:
      a: { en: "friendship between England and Germany", ru: "дружба между Англией и Германией", uk: "дружба між Англією та Німеччиною" }
      b: { en: "freedom to travel to all EU countries", ru: "свобода поездок во все страны ЕС", uk: "свобода подорожей до всіх країн ЄС" }
      c: { en: "peace and security in the EU countries", ru: "мир и безопасность в странах ЕС", uk: "мир і безпека в країнах ЄС" }
      d: { en: "uniform public holidays in the EU countries", ru: "единые праздничные дни в странах ЕС", uk: "єдині святкові дні в країнах ЄС" }
    terms:
      - { de: "gedenken", en: "to commemorate", ru: "чтить память", uk: "вшановувати пам’ять" }
      - { de: "damalig", en: "then", ru: "тогдашний", uk: "тодішній" }
      - { de: "die Versöhnung", en: "reconciliation", ru: "примирение", uk: "примирення" }
    status: reviewed
  - id: general-236
    rationale_de: >-
      Die Europäische Union hat 27 Mitgliedstaaten. Bis 2020 waren es 28, dann ist das Vereinigte Königreich ausgetreten (Brexit). Deutschland gehörte 1957 zu den sechs Gründungsländern der Europäischen Wirtschaftsgemeinschaft, aus der die EU entstand.
    question:
      en: "How many member states does the EU have today?"
      ru: "Сколько государств-членов сейчас в ЕС?"
      uk: "Скільки держав-членів має ЄС сьогодні?"
    options:
      a: { en: "21", ru: "21", uk: "21" }
      b: { en: "23", ru: "23", uk: "23" }
      c: { en: "25", ru: "25", uk: "25" }
      d: { en: "27", ru: "27", uk: "27" }
    terms:
      - { de: "der Mitgliedstaat", en: "member state", ru: "государство-член", uk: "держава-член" }
      - { de: "austreten", en: "to leave", ru: "выходить", uk: "виходити" }
    status: reviewed
  - id: general-237
    rationale_de: >-
      Mit den Römischen Verträgen gründeten sechs Staaten, darunter die Bundesrepublik, 1957 die Europäische Wirtschaftsgemeinschaft (EWG). Die Verträge traten 1958 in Kraft; aus der EWG entwickelte sich später die Europäische Union. Der Beitritt zur NATO war schon 1955, und die Oder-Neiße-Grenze wurde erst 1990 endgültig anerkannt.
    source: Römische Verträge (1957)
    question:
      en: "In 2007 the 50th anniversary of the “Treaties of Rome” was celebrated. What did the treaties contain?"
      ru: "В 2007 году отмечали 50-летие «Римских договоров». Что было содержанием этих договоров?"
      uk: "У 2007 році відзначали 50-річчя «Римських договорів». Яким був зміст цих договорів?"
    options:
      a: { en: "Germany's accession to NATO", ru: "вступление Германии в НАТО", uk: "вступ Німеччини до НАТО" }
