notes:
  - id: general-173
    rationale_de: >-
      1957 gründete die Bundesrepublik zusammen mit fünf anderen Staaten die Europäische Wirtschaftsgemeinschaft (Römische Verträge). Aus ihr wurde später die Europäische Union, die es seit 1993 gibt. Der NATO trat die Bundesrepublik dagegen erst 1955 bei, den Vereinten Nationen 1973 – und im Warschauer Pakt war sie nie.
    source: Römische Verträge (1957); Vertrag von Maastricht
    question:
      en: "The Federal Republic of Germany is a founding member …"
      ru: "Федеративная Республика Германия является одним из основателей …"
    options:
      a: { en: "of the North Atlantic Treaty Organization (NATO).", ru: "Организации Североатлантического договора (НАТО)." }
      b: { en: "of the United Nations (UN).", ru: "Организации Объединённых Наций (ООН)." }
      c: { en: "of the European Union (EU).", ru: "Европейского союза (ЕС)." }
      d: { en: "of the Warsaw Pact.", ru: "Варшавского договора." }
    terms:
      - { de: "das Gründungsmitglied", en: "founding member", ru: "член-основатель" }
    status: draft
  - id: general-221
    rationale_de: >-
      Im Schengen-Raum gibt es an den Grenzen zwischen den Mitgliedsländern normalerweise keine Passkontrollen. Dazu gehören die meisten EU-Länder und auch einige andere, zum Beispiel die Schweiz und Norwegen. An den Außengrenzen des Schengen-Raums wird aber kontrolliert, und den Ausweis sollte man immer dabeihaben.
    source: Schengener Abkommen (1985)
    question:
      en: "Germany is a member of the Schengen Agreement. What does that mean?"
      ru: "Германия — участница Шенгенского соглашения. Что это означает?"
    options:
      a: { en: "Germans can travel to many countries in Europe without passport control.", ru: "Немцы могут ездить во многие страны Европы без паспортного контроля." }
      b: { en: "Anyone can enter Germany without identity checks.", ru: "Все люди могут въезжать в Германию без проверки документов." }
      c: { en: "Germans can travel to any country without passport control.", ru: "Немцы могут ездить в любую страну без паспортного контроля." }
      d: { en: "Germans can pay with the euro in every country.", ru: "Немцы могут платить евро в любой стране." }
    terms:
      - { de: "das Abkommen", en: "agreement", ru: "соглашение" }
      - { de: "die Passkontrolle", en: "passport control", ru: "паспортный контроль" }
    status: draft
  - id: general-222
    rationale_de: >-
      Die Schweiz grenzt im Süden an Deutschland; ein großer Teil der Grenze verläuft am Rhein und am Bodensee. Deutschland hat neun Nachbarländer: Dänemark, Polen, Tschechien, Österreich, die Schweiz, Frankreich, Luxemburg, Belgien und die Niederlande. Ungarn, Portugal und Spanien haben keine gemeinsame Grenze mit Deutschland.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
    options:
      a: { en: "Hungary", ru: "Венгрия" }
      b: { en: "Portugal", ru: "Португалия" }
      c: { en: "Spain", ru: "Испания" }
      d: { en: "Switzerland", ru: "Швейцария" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна" }
      - { de: "grenzen an", en: "to border on", ru: "граничить с" }
    status: draft
  - id: general-223
    rationale_de: >-
      Polen liegt im Osten von Deutschland. Die Grenze verläuft zu einem großen Teil an den Flüssen Oder und Neiße. Rumänien, Bulgarien und Griechenland liegen weiter im Südosten Europas und grenzen nicht an Deutschland.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
    options:
      a: { en: "Romania", ru: "Румыния" }
      b: { en: "Bulgaria", ru: "Болгария" }
      c: { en: "Poland", ru: "Польша" }
      d: { en: "Greece", ru: "Греция" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна" }
      - { de: "die Grenze", en: "border", ru: "граница" }
    status: draft
  - id: general-224
    rationale_de: >-
      EU heißt Europäische Union. Seit 2020 hat sie 27 Mitgliedstaaten, und Deutschland ist einer davon. Unter diesem Namen gibt es die EU seit 1993, seit dem Vertrag von Maastricht.
    source: Vertrag von Maastricht
    question:
      en: "What does the abbreviation EU stand for?"
      ru: "Что означает аббревиатура EU?"
    options:
      a: { en: "European Enterprises", ru: "Европейские предприятия" }
      b: { en: "European Union", ru: "Европейский союз" }
      c: { en: "Uniform Union", ru: "Единый союз" }
      d: { en: "Euro Union", ru: "Союз евро" }
    terms:
      - { de: "die Abkürzung", en: "abbreviation", ru: "аббревиатура" }
    status: draft
  - id: general-225
    rationale_de: >-
      In Österreich ist Deutsch die Amtssprache, und fast alle Menschen sprechen Deutsch. Auch in der Schweiz, in Liechtenstein und in Luxemburg ist Deutsch eine Amtssprache. Österreich ist auch ein Nachbarland von Bayern.
    question:
      en: "In which other country is there a large German-speaking population?"
      ru: "В какой ещё стране живёт много людей, говорящих по-немецки?"
    options:
      a: { en: "Czech Republic", ru: "Чехия" }
      b: { en: "Norway", ru: "Норвегия" }
      c: { en: "Spain", ru: "Испания" }
      d: { en: "Austria", ru: "Австрия" }
    terms:
      - { de: "deutschsprachig", en: "German-speaking", ru: "немецкоязычный" }
      - { de: "die Bevölkerung", en: "population", ru: "население" }
      - { de: "die Amtssprache", en: "official language", ru: "официальный язык" }
    status: draft
  - id: general-226
    rationale_de: >-
      Bild 2 zeigt die Flagge der Europäischen Union: zwölf goldene Sterne im Kreis auf blauem Grund. Es bleiben immer zwölf Sterne, auch wenn neue Länder dazukommen. Bild 1 ist die Flagge der USA, Bild 3 die Flagge der Vereinten Nationen, und Bild 4 ist zwar blau und gelb, zeigt aber keinen Sternenkreis.
    source: Europäische Union
    question:
      en: "Which is the flag of the European Union?"
      ru: "Какой из флагов — флаг Европейского союза?"
    options:
      a: { en: "Picture 1", ru: "Изображение 1" }
      b: { en: "Picture 2", ru: "Изображение 2" }
      c: { en: "Picture 3", ru: "Изображение 3" }
      d: { en: "Picture 4", ru: "Изображение 4" }
    terms:
      - { de: "die Flagge", en: "flag", ru: "флаг" }
      - { de: "der Stern", en: "star", ru: "звезда" }
    status: draft
  - id: general-227
    rationale_de: >-
      Dänemark liegt im Norden und grenzt an Schleswig-Holstein. Norwegen, Schweden und Finnland gehören auch zu Nordeuropa, haben aber keine Landgrenze mit Deutschland. Nach Schweden kommt man zum Beispiel mit der Fähre über die Ostsee.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
    options:
      a: { en: "Finland", ru: "Финляндия" }
      b: { en: "Denmark", ru: "Дания" }
      c: { en: "Norway", ru: "Норвегия" }
      d: { en: "Sweden", ru: "Швеция" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна" }
    status: draft
  - id: general-229
    rationale_de: >-
      Luxemburg ist ein kleines Land im Westen und grenzt an Rheinland-Pfalz und das Saarland. Es gehörte 1957 zu den sechs Gründungsstaaten der Europäischen Wirtschaftsgemeinschaft. Spanien, Bulgarien und Norwegen sind keine Nachbarländer von Deutschland.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
    options:
      a: { en: "Spain", ru: "Испания" }
      b: { en: "Bulgaria", ru: "Болгария" }
      c: { en: "Norway", ru: "Норвегия" }
      d: { en: "Luxembourg", ru: "Люксембург" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна" }
    status: draft
  - id: general-230
    rationale_de: >-
      Das Europäische Parlament wird alle fünf Jahre gewählt (Vertrag über die Europäische Union, Artikel 14). Die letzte Europawahl war im Juni 2024, die nächste ist 2029. In Deutschland darf man bei der Europawahl schon ab 16 Jahren wählen.
    source: EUV Art. 14 Abs. 3
    question:
      en: "The European Parliament is elected regularly, namely every …"
      ru: "Европейский парламент избирается регулярно, а именно каждые …"
    options:
      a: { en: "5 years.", ru: "5 лет." }
      b: { en: "6 years.", ru: "6 лет." }
      c: { en: "7 years.", ru: "7 лет." }
      d: { en: "8 years.", ru: "8 лет." }
    terms:
      - { de: "die Europawahl", en: "European election", ru: "выборы в Европейский парламент" }
      - { de: "regelmäßig", en: "regularly", ru: "регулярно" }
    status: draft
  - id: general-231
    rationale_de: >-
      Europäische Integration heißt: Die Staaten Europas arbeiten immer enger zusammen und schließen sich zusammen. Nach dem Zweiten Weltkrieg begann das mit sechs Ländern, heute hat die Europäische Union 27 Mitglieder. Mit Einwanderung hat dieser Begriff nichts zu tun – anders als die Integration von Zugewanderten.
    question:
      en: "What does the term “European integration” mean?"
      ru: "Что означает понятие «европейская интеграция»?"
    options:
      a: { en: "It refers to American immigrants in Europe.", ru: "Имеются в виду американские иммигранты в Европе." }
      b: { en: "The term means the halt to immigration into Europe.", ru: "Понятие означает прекращение иммиграции в Европу." }
      c: { en: "It refers to European emigrants in the USA.", ru: "Имеются в виду европейские эмигранты в США." }
      d: { en: "The term means the joining together of European states to form the EU.", ru: "Понятие означает объединение европейских государств в ЕС." }
    terms:
      - { de: "die Integration", en: "integration", ru: "интеграция" }
      - { de: "der Zusammenschluss", en: "joining together", ru: "объединение" }
    status: draft
  - id: general-232
    rationale_de: >-
      Bei der Europawahl wählen die Bürgerinnen und Bürger der EU die Abgeordneten des Europäischen Parlaments. Deutschland hat dort 96 Sitze, mehr als jedes andere Land. Die Europäische Kommission wählt das Volk dagegen nicht direkt, und eine europäische Verfassung gibt es nicht.
    source: EUV Art. 14
    question:
      en: "Who is elected in the European election?"
      ru: "Кого избирают на европейских выборах?"
    options:
      a: { en: "the European Commission", ru: "Европейскую комиссию" }
      b: { en: "the countries that may join the EU", ru: "страны, которым разрешено вступить в ЕС" }
      c: { en: "the members of the European Parliament", ru: "депутатов Европейского парламента" }
      d: { en: "the European constitution", ru: "европейскую конституцию" }
    terms:
      - { de: "die Europawahl", en: "European election", ru: "выборы в Европейский парламент" }
      - { de: "die Europäische Kommission", en: "European Commission", ru: "Европейская комиссия" }
    status: draft
  - id: general-233
    rationale_de: >-
      Tschechien ist ein Nachbarland von Deutschland: Es grenzt an Bayern und an Sachsen. Die Hauptstadt ist Prag. Bulgarien, Griechenland und Portugal haben dagegen keine Grenze mit Deutschland.
    question:
      en: "Which country is a neighbouring country of Germany?"
      ru: "Какая страна граничит с Германией?"
    options:
      a: { en: "Czech Republic", ru: "Чехия" }
      b: { en: "Bulgaria", ru: "Болгария" }
      c: { en: "Greece", ru: "Греция" }
      d: { en: "Portugal", ru: "Португалия" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring country", ru: "соседняя страна" }
    status: draft
  - id: general-234
    rationale_de: >-
      Der offizielle Sitz des Europäischen Parlaments ist Straßburg in Frankreich; dort finden die meisten Plenarsitzungen statt. Das Parlament arbeitet auch in Brüssel und in Luxemburg. In London, Paris oder Berlin hat es keinen Sitz.
    source: EU-Verträge, Protokoll Nr. 6
    question:
      en: "Where is one seat of the European Parliament?"
      ru: "Где находится одна из резиденций Европейского парламента?"
    options:
      a: { en: "London", ru: "Лондон" }
      b: { en: "Paris", ru: "Париж" }
      c: { en: "Berlin", ru: "Берлин" }
      d: { en: "Strasbourg", ru: "Страсбург" }
    terms:
      - { de: "der Sitz", en: "seat", ru: "резиденция" }
      - { de: "die Plenarsitzung", en: "plenary session", ru: "пленарное заседание" }
    status: draft
  - id: general-235
    rationale_de: >-
      1984 trafen sich François Mitterrand und Helmut Kohl in Verdun in Frankreich. Dort starben im Ersten Weltkrieg sehr viele deutsche und französische Soldaten. Die beiden Politiker hielten sich an den Händen – ein Zeichen der Versöhnung zwischen früheren Feinden. Frieden und Sicherheit sind ein zentrales Ziel der europäischen Einigung.
    source: EUV Art. 3 Abs. 1
    question:
      en: "The then French President François Mitterrand and the then German Federal Chancellor Helmut Kohl together commemorate the dead of both world wars in Verdun. Which goal of the European Union becomes clear at this meeting?"
      ru: "Тогдашний президент Франции Франсуа Миттеран и тогдашний федеральный канцлер Германии Гельмут Коль вместе чтят в Вердене память погибших в обеих мировых войнах. Какая цель Европейского союза проявляется в этой встрече?"
    options:
      a: { en: "friendship between England and Germany", ru: "дружба между Англией и Германией" }
      b: { en: "freedom to travel to all EU countries", ru: "свобода поездок во все страны ЕС" }
      c: { en: "peace and security in the EU countries", ru: "мир и безопасность в странах ЕС" }
      d: { en: "uniform public holidays in the EU countries", ru: "единые праздничные дни в странах ЕС" }
    terms:
      - { de: "gedenken", en: "to commemorate", ru: "чтить память" }
      - { de: "damalig", en: "then", ru: "тогдашний" }
      - { de: "die Versöhnung", en: "reconciliation", ru: "примирение" }
    status: draft
  - id: general-236
    rationale_de: >-
      Die Europäische Union hat 27 Mitgliedstaaten. Bis 2020 waren es 28, dann ist das Vereinigte Königreich ausgetreten (Brexit). Deutschland gehörte 1957 zu den sechs Gründungsländern der Europäischen Wirtschaftsgemeinschaft, aus der die EU entstand.
    question:
      en: "How many member states does the EU have today?"
      ru: "Сколько государств-членов сейчас в ЕС?"
    options:
      a: { en: "21", ru: "21" }
      b: { en: "23", ru: "23" }
      c: { en: "25", ru: "25" }
      d: { en: "27", ru: "27" }
    terms:
      - { de: "der Mitgliedstaat", en: "member state", ru: "государство-член" }
      - { de: "austreten", en: "to leave", ru: "выходить" }
    status: draft
  - id: general-237
    rationale_de: >-
      Mit den Römischen Verträgen gründeten sechs Staaten, darunter die Bundesrepublik, 1957 die Europäische Wirtschaftsgemeinschaft (EWG). Die Verträge traten 1958 in Kraft; aus der EWG entwickelte sich später die Europäische Union. Der Beitritt zur NATO war schon 1955, und die Oder-Neiße-Grenze wurde erst 1990 endgültig anerkannt.
    source: Römische Verträge (1957)
    question:
      en: "In 2007 the 50th anniversary of the “Treaties of Rome” was celebrated. What did the treaties contain?"
      ru: "В 2007 году отмечали 50-летие «Римских договоров». Что было содержанием этих договоров?"
    options:
      a: { en: "Germany's accession to NATO", ru: "вступление Германии в НАТО" }
      b: { en: "the founding of the European Economic Community (EEC)", ru: "создание Европейского экономического сообщества (ЕЭС)" }
      c: { en: "Germany's obligation to pay reparations", ru: "обязательство Германии выплачивать репарации" }
      d: { en: "fixing the Oder-Neisse line as the eastern border", ru: "установление линии Одер — Нейсе как восточной границы" }
    terms:
      - { de: "der Vertrag", en: "treaty", ru: "договор" }
      - { de: "die Gründung", en: "founding", ru: "создание" }
      - { de: "das Jubiläum", en: "anniversary", ru: "юбилей" }
    status: draft
  - id: general-238
    rationale_de: >-
      Das Europäische Parlament hat drei Arbeitsorte. In Straßburg trifft es sich zu den großen Plenarsitzungen, in Brüssel arbeiten vor allem die Ausschüsse, und in Luxemburg sitzt ein großer Teil der Verwaltung. Bern und Zürich liegen in der Schweiz – und die Schweiz ist gar nicht in der EU.
    source: EU-Verträge, Protokoll Nr. 6
    question:
      en: "In which places does the European Parliament work?"
      ru: "Где работает Европейский парламент?"
    options:
      a: { en: "Paris, London and The Hague", ru: "Париж, Лондон и Гаага" }
      b: { en: "Strasbourg, Luxembourg and Brussels", ru: "Страсбург, Люксембург и Брюссель" }
      c: { en: "Rome, Bern and Vienna", ru: "Рим, Берн и Вена" }
      d: { en: "Bonn, Zurich and Milan", ru: "Бонн, Цюрих и Милан" }
    terms:
      - { de: "der Ausschuss", en: "committee", ru: "комитет" }
      - { de: "die Verwaltung", en: "administration", ru: "администрация" }
    status: draft
  - id: general-239
    rationale_de: >-
      Die Europäische Wirtschaftsgemeinschaft wurde mit den Römischen Verträgen gegründet. Sie wurden am 25. März 1957 in Rom unterschrieben. Die „Pariser Verträge“ von 1954 regelten dagegen vor allem das Ende der Besatzungszeit und den Beitritt der Bundesrepublik zur NATO.
    source: Römische Verträge (1957)
    question:
      en: "Through which treaties did the Federal Republic of Germany join with other states to form the European Economic Community?"
      ru: "Какими договорами Федеративная Республика Германия объединилась с другими государствами в Европейское экономическое сообщество?"
    options:
      a: { en: "through the “Hamburg Treaties”", ru: "«Гамбургскими договорами»" }
      b: { en: "through the “Treaties of Rome”", ru: "«Римскими договорами»" }
      c: { en: "through the “Paris Treaties”", ru: "«Парижскими договорами»" }
      d: { en: "through the “London Treaties”", ru: "«Лондонскими договорами»" }
    terms:
      - { de: "sich zusammenschließen", en: "to join together", ru: "объединяться" }
      - { de: "die Europäische Wirtschaftsgemeinschaft", en: "European Economic Community", ru: "Европейское экономическое сообщество" }
    status: draft
  - id: general-240
    rationale_de: >-
      Euro-Münzen und Euro-Scheine gibt es in Deutschland seit dem 1. Januar 2002. Vorher bezahlte man mit der D-Mark. Für Überweisungen und Konten gab es den Euro schon seit 1999, aber noch nicht als Bargeld.
    source: Deutsche Bundesbank
    question:
      en: "Since when have people in Germany been paying in cash with the euro?"
      ru: "С какого времени в Германии расплачиваются наличными евро?"
    options:
      a: { en: "1995", ru: "1995" }
      b: { en: "1998", ru: "1998" }
      c: { en: "2002", ru: "2002" }
      d: { en: "2005", ru: "2005" }
    terms:
      - { de: "in bar", en: "in cash", ru: "наличными" }
      - { de: "das Bargeld", en: "cash", ru: "наличные" }
    status: draft
