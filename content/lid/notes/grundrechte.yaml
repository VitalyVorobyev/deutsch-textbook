notes:
  - id: general-001
    rationale_de: >-
      In Deutschland gilt Meinungsfreiheit. Das steht im Grundgesetz, Artikel 5. Jeder darf seine Meinung sagen – auch Kritik an der Regierung. Religionsfreiheit, Steuern und Wahlrecht sind wichtig, erklären das aber nicht.
    source: GG Art. 5
    question:
      en: "In Germany, people may openly speak out against the government because …"
      ru: "В Германии люди могут открыто высказываться против правительства, потому что …"
      uk: "У Німеччині люди можуть відкрито висловлюватися проти уряду, тому що …"
    options:
      a: { en: "freedom of religion applies here.", ru: "здесь действует свобода вероисповедания.", uk: "тут діє свобода віросповідання." }
      b: { en: "people pay taxes.", ru: "люди платят налоги.", uk: "люди сплачують податки." }
      c: { en: "people have the right to vote.", ru: "у людей есть избирательное право.", uk: "люди мають виборче право." }
      d: { en: "freedom of opinion applies here.", ru: "здесь действует свобода мнений.", uk: "тут діє свобода слова." }
    terms:
      - { de: "die Meinungsfreiheit", en: "freedom of opinion", ru: "свобода мнений", uk: "свобода слова" }
    status: reviewed
  - id: general-002
    rationale_de: >-
      Religionsunterricht ist an vielen Schulen ein normales Fach. Aber das Grundgesetz sagt in Artikel 7: Die Eltern bestimmen, ob ihr Kind daran teilnimmt. Bei Geschichte, Politik oder Sprachen haben die Eltern diese Wahl nicht.
    source: GG Art. 7 Abs. 2
    question:
      en: "In Germany, until their child is 14, parents can decide whether at school the child takes part in …"
      ru: "В Германии до 14 лет ребёнка родители могут решать, будет ли он в школе посещать …"
      uk: "У Німеччині, доки дитині не виповниться 14 років, батьки можуть вирішувати, чи відвідуватиме вона в школі …"
    options:
      a: { en: "history lessons.", ru: "уроки истории.", uk: "уроки історії." }
      b: { en: "religious education.", ru: "уроки религии.", uk: "уроки релігії." }
      c: { en: "politics lessons.", ru: "уроки политики.", uk: "уроки політики." }
      d: { en: "language lessons.", ru: "уроки языка.", uk: "уроки мови." }
    terms:
      - { de: "der Religionsunterricht", en: "religious education", ru: "уроки религии", uk: "уроки релігії" }
      - { de: "das Lebensjahr", en: "year of life", ru: "год жизни", uk: "рік життя" }
    status: reviewed
  - id: general-004
    rationale_de: >-
      Die Meinungsfreiheit ist ein Grundrecht – sie steht im Grundgesetz, Artikel 5. Faustrecht und Selbstjustiz sind dagegen verboten: Strafen dürfen nur Gerichte bestimmen, nicht einzelne Menschen. Waffenbesitz ist kein Grundrecht, sondern durch Gesetze streng geregelt.
    source: GG Art. 5
    question:
      en: "Which right is one of the fundamental rights in Germany?"
      ru: "Какое право относится к основным правам в Германии?"
      uk: "Яке право належить до основних прав у Німеччині?"
    options:
      a: { en: "gun ownership", ru: "владение оружием", uk: "володіння зброєю" }
      b: { en: "the law of the fist", ru: "кулачное право", uk: "кулачне право" }
      c: { en: "freedom of opinion", ru: "свобода мнений", uk: "свобода слова" }
      d: { en: "vigilante justice", ru: "самосуд", uk: "самосуд" }
    terms:
      - { de: "das Grundrecht", en: "fundamental right", ru: "основное право", uk: "основне право" }
      - { de: "die Selbstjustiz", en: "vigilante justice", ru: "самосуд", uk: "самосуд" }
      - { de: "das Faustrecht", en: "law of the fist", ru: "кулачное право", uk: "кулачне право" }
    status: reviewed
  - id: general-006
    rationale_de: >-
      Die deutsche Verfassung heißt Grundgesetz, und sie gilt seit 1949. Man nannte sie damals nicht „Verfassung“, weil Deutschland geteilt war: Das Grundgesetz sollte nur für eine Übergangszeit gelten. Seit der Wiedervereinigung 1990 ist es die Verfassung für ganz Deutschland.
    source: GG Art. 146
    question:
      en: "What is the German constitution called?"
      ru: "Как называется конституция Германии?"
      uk: "Як називається німецька конституція?"
    options:
      a: { en: "People's Law", ru: "Народный закон", uk: "Народний закон" }
      b: { en: "Federal Law", ru: "Федеральный закон", uk: "Федеральний закон" }
      c: { en: "German Law", ru: "Немецкий закон", uk: "Німецький закон" }
      d: { en: "Basic Law", ru: "Основной закон", uk: "Основний закон" }
    terms:
      - { de: "das Grundgesetz", en: "Basic Law", ru: "Основной закон", uk: "Основний закон" }
      - { de: "die Verfassung", en: "constitution", ru: "конституция", uk: "конституція" }
    status: reviewed
  - id: general-007
    rationale_de: >-
      Das Grundgesetz garantiert in Artikel 4 die Glaubens- und Gewissensfreiheit. Jeder darf selbst entscheiden, woran er glaubt – oder ob er an gar nichts glaubt. Ein Recht auf Arbeit oder auf eine Wohnung steht nicht im Grundgesetz; es schützt aber die freie Wahl des Berufs (Artikel 12).
    source: GG Art. 4, Art. 12
    question:
      en: "Which right is one of the fundamental rights guaranteed by the German constitution? The right to …"
      ru: "Какое право относится к основным правам, которые гарантирует конституция Германии? Право на …"
      uk: "Яке право належить до основних прав, які гарантує німецька конституція? Право на …"
    options:
      a: { en: "freedom of belief and conscience", ru: "свободу вероисповедания и совести", uk: "свободу віри та совісті" }
      b: { en: "entertainment", ru: "развлечения", uk: "розваги" }
      c: { en: "work", ru: "труд", uk: "працю" }
      d: { en: "housing", ru: "жильё", uk: "житло" }
    terms:
      - { de: "die Glaubensfreiheit", en: "freedom of belief", ru: "свобода вероисповедания", uk: "свобода віри" }
      - { de: "die Gewissensfreiheit", en: "freedom of conscience", ru: "свобода совести", uk: "свобода совісті" }
      - { de: "garantieren", en: "to guarantee", ru: "гарантировать", uk: "гарантувати" }
    status: reviewed
  - id: general-008
    rationale_de: >-
      Im Grundgesetz steht nicht, dass alle Menschen gleich viel Geld haben sollen. Es schützt aber die Würde des Menschen (Artikel 1), die Meinungsfreiheit (Artikel 5) und die Gleichheit vor dem Gesetz (Artikel 3). Gleich vor dem Gesetz heißt: Für Arme und Reiche gelten dieselben Regeln.
    source: GG Art. 1, Art. 3, Art. 5
    question:
      en: "What is not in Germany's Basic Law?"
      ru: "Чего нет в Основном законе Германии?"
      uk: "Чого немає в Основному законі Німеччини?"
    options:
      a: { en: "Human dignity is inviolable.", ru: "Достоинство человека неприкосновенно.", uk: "Гідність людини недоторканна." }
      b: { en: "Everyone should have the same amount of money.", ru: "У всех должно быть одинаковое количество денег.", uk: "Усі повинні мати однакову кількість грошей." }
      c: { en: "Every person may express their opinion.", ru: "Каждый человек может высказывать своё мнение.", uk: "Кожна людина має право висловлювати свою думку." }
      d: { en: "All people are equal before the law.", ru: "Все равны перед законом.", uk: "Усі рівні перед законом." }
    terms:
      - { de: "die Würde", en: "dignity", ru: "достоинство", uk: "гідність" }
      - { de: "unantastbar", en: "inviolable", ru: "неприкосновенный", uk: "недоторканний" }
    status: reviewed
  - id: general-009
    rationale_de: >-
      Das Asylrecht steht im Grundgesetz, Artikel 16a: Politisch Verfolgte bekommen Schutz in Deutschland. Nur Ausländerinnen und Ausländer brauchen dieses Recht – Deutsche müssen in ihrem eigenen Land nicht um Asyl bitten. Menschenwürde, Schutz der Familie und Meinungsfreiheit gelten dagegen für alle Menschen in Deutschland.
    source: GG Art. 16a
    question:
      en: "Which fundamental right in Germany applies only to foreigners? The fundamental right to …"
      ru: "Какое основное право в Германии действует только для иностранцев? Основное право на …"
      uk: "Яке основне право діє в Німеччині лише для іноземців? Основне право на …"
    options:
      a: { en: "protection of the family", ru: "защиту семьи", uk: "захист сім’ї" }
      b: { en: "human dignity", ru: "человеческое достоинство", uk: "людську гідність" }
      c: { en: "asylum", ru: "убежище", uk: "притулок" }
      d: { en: "freedom of opinion", ru: "свободу мнений", uk: "свободу слова" }
    terms:
      - { de: "das Asyl", en: "asylum", ru: "убежище", uk: "притулок" }
      - { de: "politisch verfolgt", en: "politically persecuted", ru: "политически преследуемый", uk: "політично переслідуваний" }
    status: reviewed
  - id: general-010
    rationale_de: >-
      Eine Geldstrafe ist erlaubt: Ein Gericht kann bestimmen, dass jemand Geld zahlen muss. Die Todesstrafe ist abgeschafft – so steht es in Artikel 102 des Grundgesetzes. Folter und Prügelstrafe verletzen die Würde des Menschen und sind verboten.
    source: GG Art. 1, Art. 102, Art. 104
    question:
      en: "What is compatible with the German Basic Law?"
      ru: "Что совместимо с Основным законом Германии?"
      uk: "Що сумісне з Основним законом Німеччини?"
    options:
      a: { en: "corporal punishment", ru: "телесные наказания", uk: "тілесні покарання" }
      b: { en: "torture", ru: "пытки", uk: "катування" }
      c: { en: "the death penalty", ru: "смертная казнь", uk: "смертна кара" }
      d: { en: "a fine", ru: "денежный штраф", uk: "грошовий штраф" }
    terms:
      - { de: "die Geldstrafe", en: "fine", ru: "денежный штраф", uk: "грошовий штраф" }
      - { de: "die Todesstrafe", en: "death penalty", ru: "смертная казнь", uk: "смертна кара" }
      - { de: "vereinbar", en: "compatible", ru: "совместимый", uk: "сумісний" }
    status: reviewed
  - id: general-011
    rationale_de: >-
      Die Verfassung der Bundesrepublik heißt Grundgesetz, abgekürzt GG. Darin stehen die Grundrechte und die wichtigsten Regeln für den Staat. „Bundesverfassung“ klingt ähnlich – so heißt aber die Verfassung der Schweiz.
    source: GG Präambel
    question:
      en: "What is the constitution of the Federal Republic of Germany called?"
      ru: "Как называется конституция Федеративной Республики Германия?"
      uk: "Як називається конституція Федеративної Республіки Німеччина?"
    options:
      a: { en: "Basic Law", ru: "Основной закон", uk: "Основний закон" }
      b: { en: "Federal Constitution", ru: "Федеральная конституция", uk: "Федеральна конституція" }
      c: { en: "Code of Law", ru: "Свод законов", uk: "Звід законів" }
      d: { en: "Constitutional Treaty", ru: "Конституционный договор", uk: "Конституційний договір" }
    terms:
      - { de: "das Grundgesetz", en: "Basic Law", ru: "Основной закон", uk: "Основний закон" }
      - { de: "die Verfassung", en: "constitution", ru: "конституция", uk: "конституція" }
    status: reviewed
  - id: general-012
    rationale_de: >-
      Die Pressefreiheit ist ein Grundrecht – sie steht im Grundgesetz, Artikel 5. Grundrechte sind besonders geschützt: Ihr Kern darf nie verletzt werden (Artikel 19). Darum kann auch eine große Mehrheit im Bundestag die Pressefreiheit nicht abschaffen.
    source: GG Art. 5, Art. 19
    question:
      en: "A party in the German Bundestag wants to abolish freedom of the press. Is that possible?"
      ru: "Одна из партий в германском бундестаге хочет отменить свободу прессы. Возможно ли это?"
      uk: "Одна з партій у німецькому Бундестазі хоче скасувати свободу преси. Чи можливо це?"
    options:
      a: { en: "Yes, if more than half of the members of the Bundestag are in favour.", ru: "Да, если за это выступает больше половины депутатов бундестага.", uk: "Так, якщо це підтримує більше половини депутатів Бундестагу." }
      b: { en: "Yes, but for that two thirds of the members of the Bundestag must be in favour.", ru: "Да, но для этого за должны быть две трети депутатов бундестага.", uk: "Так, але для цього потрібна підтримка двох третин депутатів Бундестагу." }
      c: { en: "No, because freedom of the press is a fundamental right. It cannot be abolished.", ru: "Нет, потому что свобода прессы — основное право. Её нельзя отменить.", uk: "Ні, бо свобода преси — основне право. Її не можна скасувати." }
      d: { en: "No, because only the Bundesrat can abolish freedom of the press.", ru: "Нет, потому что отменить свободу прессы может только бундесрат.", uk: "Ні, бо скасувати свободу преси може лише Бундесрат." }
    terms:
      - { de: "die Pressefreiheit", en: "freedom of the press", ru: "свобода прессы", uk: "свобода преси" }
      - { de: "abschaffen", en: "to abolish", ru: "отменить", uk: "скасовувати" }
      - { de: "der/die Abgeordnete", en: "member of parliament", ru: "депутат", uk: "депутат, депутатка" }
    status: reviewed
  - id: general-014
    rationale_de: >-
      Meinungsfreiheit heißt: Ich darf meine Meinung sagen und schreiben – auch im Internet und auch gegen die Regierung (Grundgesetz, Artikel 5). Die Freiheit hat aber Grenzen. Wer andere Menschen beschimpft oder Symbole verbotener Organisationen wie Nazi-Symbole öffentlich zeigt, kann dafür bestraft werden.
    source: GG Art. 5; StGB § 86a, § 185
    question:
      en: "Freedom of opinion in Germany means that I …"
      ru: "Свобода мнений в Германии означает, что я …"
      uk: "Свобода слова в Німеччині означає, що я …"
    options:
      a: { en: "may insult passers-by on the street.", ru: "могу оскорблять прохожих на улице.", uk: "маю право ображати перехожих на вулиці." }
      b: { en: "can express my opinion on the internet.", ru: "могу высказывать своё мнение в интернете.", uk: "можу висловлювати свою думку в інтернеті." }
      c: { en: "may wear Nazi, Hamas or Islamic State symbols in public.", ru: "могу публично носить символику нацистов, ХАМАС или «Исламского государства».", uk: "маю право публічно носити символіку нацистів, ХАМАС або «Ісламської держави»." }
      d: { en: "may only express my opinion as long as I do not contradict the government.", ru: "могу высказывать своё мнение, только пока не возражаю правительству.", uk: "маю право висловлювати свою думку лише доти, доки не суперечу уряду." }
    terms:
      - { de: "beschimpfen", en: "to insult", ru: "оскорблять", uk: "ображати, лаяти" }
      - { de: "äußern", en: "to express", ru: "высказывать", uk: "висловлювати" }
    status: reviewed
  - id: general-015
    rationale_de: >-
      Das Grundgesetz sagt in Artikel 12: Niemand darf zu einer bestimmten Arbeit gezwungen werden. Zwangsarbeit ist deshalb verboten – erlaubt sind nur enge Ausnahmen, zum Beispiel Arbeit im Gefängnis nach einem Gerichtsurteil. Die freie Berufswahl ist dagegen ein Grundrecht, und Militärdienst erlaubt das Grundgesetz ausdrücklich (Artikel 12a).
    source: GG Art. 12, Art. 12a
    question:
      en: "What does the German Basic Law prohibit?"
      ru: "Что запрещает Основной закон Германии?"
      uk: "Що забороняє Основний закон Німеччини?"
    options:
      a: { en: "military service", ru: "военную службу", uk: "військову службу" }
      b: { en: "forced labour", ru: "принудительный труд", uk: "примусову працю" }
      c: { en: "free choice of occupation", ru: "свободный выбор профессии", uk: "вільний вибір професії" }
      d: { en: "working abroad", ru: "работу за границей", uk: "роботу за кордоном" }
    terms:
      - { de: "die Zwangsarbeit", en: "forced labour", ru: "принудительный труд", uk: "примусова праця" }
      - { de: "die Berufswahl", en: "choice of occupation", ru: "выбор профессии", uk: "вибір професії" }
    status: reviewed
  - id: general-016
    rationale_de: >-
      Die Meinungsfreiheit hat Grenzen, und eine wichtige Grenze ist die Ehre anderer Menschen (Grundgesetz, Artikel 5, Absatz 2). Wer öffentlich Falsches über eine bestimmte Person behauptet, kann dafür bestraft werden. Kritik an der Regierung oder am Staat und Gespräche über Religionen sind dagegen erlaubt.
    source: GG Art. 5 Abs. 2; StGB § 186, § 187
    question:
      en: "When is freedom of opinion restricted in Germany?"
      ru: "Когда в Германии ограничивается свобода мнений?"
      uk: "Коли в Німеччині обмежено свободу слова?"
    options:
      a: { en: "when false claims about individual people are spread in public", ru: "при публичном распространении ложных утверждений об отдельных людях", uk: "у разі публічного поширення неправдивих тверджень про окремих осіб" }
      b: { en: "when opinions are expressed about the federal government", ru: "при высказываниях о федеральном правительстве", uk: "у разі висловлювань про федеральний уряд" }
      c: { en: "in discussions about religions", ru: "при обсуждении религий", uk: "у разі дискусій про релігії" }
      d: { en: "when the state is criticised", ru: "при критике государства", uk: "у разі критики держави" }
    terms:
      - { de: "die Behauptung", en: "claim", ru: "утверждение", uk: "твердження" }
      - { de: "verbreiten", en: "to spread", ru: "распространять", uk: "поширювати" }
      - { de: "einschränken", en: "to restrict", ru: "ограничивать", uk: "обмежувати" }
    status: reviewed
  - id: general-017
    rationale_de: >-
      Der Staat muss alle Menschen gleich behandeln. Das steht im Grundgesetz, Artikel 3: Alle Menschen sind vor dem Gesetz gleich. Meinungsfreiheit, Petitionen und Versammlungsfreiheit sind dagegen Grundrechte – sie sind erlaubt und geschützt.
    source: GG Art. 3
    question:
      en: "German laws prohibit …"
      ru: "Немецкие законы запрещают …"
      uk: "Німецькі закони забороняють …"
    options:
      a: { en: "freedom of opinion of the inhabitants.", ru: "свободу мнений жителей.", uk: "свободу слова мешканців." }
      b: { en: "petitions by citizens.", ru: "петиции граждан.", uk: "петиції громадян." }
      c: { en: "freedom of assembly of the inhabitants.", ru: "свободу собраний жителей.", uk: "свободу зібрань мешканців." }
      d: { en: "unequal treatment of citizens by the state.", ru: "неравное обращение государства с гражданами.", uk: "нерівне ставлення держави до громадян." }
    terms:
      - { de: "die Ungleichbehandlung", en: "unequal treatment", ru: "неравное обращение", uk: "нерівне ставлення" }
      - { de: "die Petition", en: "petition", ru: "петиция", uk: "петиція" }
      - { de: "die Versammlungsfreiheit", en: "freedom of assembly", ru: "свобода собраний", uk: "свобода зібрань" }
    status: reviewed
  - id: general-018
    rationale_de: >-
      Artikel 1 des Grundgesetzes beginnt mit dem Satz: „Die Würde des Menschen ist unantastbar.“ Das heißt: Niemand darf die Würde eines Menschen verletzen – auch nicht der Staat. Das Recht auf Leben steht in Artikel 2, die Religionsfreiheit in Artikel 4 und die Meinungsfreiheit in Artikel 5.
    source: GG Art. 1
    question:
      en: "Which fundamental right is guaranteed in Article 1 of the Basic Law of the Federal Republic of Germany?"
      ru: "Какое основное право гарантирует статья 1 Основного закона Федеративной Республики Германия?"
      uk: "Яке основне право гарантує стаття 1 Основного закону Федеративної Республіки Німеччина?"
    options:
      a: { en: "the inviolability of human dignity", ru: "неприкосновенность человеческого достоинства", uk: "недоторканність гідності людини" }
      b: { en: "the right to life", ru: "право на жизнь", uk: "право на життя" }
      c: { en: "freedom of religion", ru: "свобода вероисповедания", uk: "свобода віросповідання" }
      d: { en: "freedom of opinion", ru: "свобода мнений", uk: "свобода слова" }
    terms:
