  - id: general-019
    rationale_de: >-
      Freizügigkeit heißt: Man darf selbst entscheiden, wo man in Deutschland wohnt, und man darf frei umziehen. Für alle Deutschen garantiert das Grundgesetz dieses Recht in Artikel 11. Vorsicht: Das Adjektiv „freizügig“ kann auch „leicht bekleidet“ bedeuten – mit diesem Recht hat das nichts zu tun.
    source: GG Art. 11
    question:
      en: "What is meant in Germany by the right to “freedom of movement”?"
      ru: "Что понимается в Германии под правом на «свободу передвижения»?"
      uk: "Що в Німеччині розуміють під правом на «свободу пересування» (Freizügigkeit)?"
    options:
      a: { en: "You may choose your place of residence yourself.", ru: "Можно самому выбирать место жительства.", uk: "Можна самому обирати собі місце проживання." }
      b: { en: "You can change your job.", ru: "Можно сменить профессию.", uk: "Можна змінити професію." }
      c: { en: "You may decide on a different religion.", ru: "Можно выбрать другую религию.", uk: "Можна обрати іншу релігію." }
      d: { en: "In public you may only move about lightly dressed.", ru: "На публике можно появляться только в лёгкой одежде.", uk: "У громадських місцях можна перебувати лише легко вдягненим." }
    terms:
      - { de: "die Freizügigkeit", en: "freedom of movement", ru: "свобода передвижения", uk: "свобода пересування" }
      - { de: "der Wohnort", en: "place of residence", ru: "место жительства", uk: "місце проживання" }
    status: reviewed
  - id: general-243
    rationale_de: >-
      Das Grundgesetz garantiert die Versammlungsfreiheit (Artikel 8). Für eine Demonstration unter freiem Himmel braucht man keine Erlaubnis, aber man muss sie vorher bei der zuständigen Behörde anmelden. So kann die Polizei zum Beispiel den Verkehr regeln und die Demonstration schützen.
    source: GG Art. 8; VersG § 14, BayVersG Art. 13
    question:
      en: "Maik and Sybille want to hold a street demonstration with friends in the German town where they live. What do they have to do beforehand?"
      ru: "Майк и Зибилле хотят вместе с друзьями провести уличную демонстрацию в немецком городе, где они живут. Что им нужно сделать заранее?"
      uk: "Майк і Зібілле хочуть разом із друзями провести вуличну демонстрацію в німецькому місті, де вони живуть. Що вони мають зробити заздалегідь?"
    options:
      a: { en: "They must register the demonstration.", ru: "Они должны зарегистрировать демонстрацию.", uk: "Вони мають зареєструвати демонстрацію." }
      b: { en: "They do not have to do anything. In Germany you may demonstrate anywhere at any time.", ru: "Им ничего не нужно делать. В Германии можно проводить демонстрации где угодно и когда угодно.", uk: "Їм нічого не треба робити. У Німеччині можна демонструвати будь-де й будь-коли." }
      c: { en: "They cannot do anything at all, because demonstrations are generally prohibited in Germany.", ru: "Они ничего не могут сделать, потому что демонстрации в Германии в принципе запрещены.", uk: "Вони взагалі нічого не можуть зробити, бо демонстрації в Німеччині в принципі заборонені." }
      d: { en: "Maik and Sybille must found a new association, because only associations may demonstrate.", ru: "Майк и Зибилле должны основать новое объединение, потому что проводить демонстрации могут только объединения.", uk: "Майк і Зібілле мають заснувати нове об’єднання, бо демонструвати можуть лише об’єднання." }
    terms:
      - { de: "anmelden", en: "to register, give notice", ru: "заявить, уведомить", uk: "зареєструвати, повідомити" }
      - { de: "die Demonstration", en: "demonstration", ru: "демонстрация", uk: "демонстрація" }
      - { de: "die Versammlungsfreiheit", en: "freedom of assembly", ru: "свобода собраний", uk: "свобода зібрань" }
    status: reviewed
  - id: general-262
    rationale_de: >-
      Gleichbehandlung heißt: Niemand darf schlechter behandelt werden, weil er zum Beispiel eine Behinderung hat. Das steht im Grundgesetz, Artikel 3: „Niemand darf wegen seiner Behinderung benachteiligt werden.“ Wer benachteiligt wird, kann sich wehren und auch vor Gericht klagen.
    source: GG Art. 3 Abs. 3; AGG
    question:
      en: "What does the principle of equal treatment mean in Germany?"
      ru: "Что означает в Германии принцип равного обращения?"
      uk: "Що означає в Німеччині принцип рівного ставлення?"
    options:
      a: { en: "No one may be disadvantaged, e.g. because of a disability.", ru: "Никого нельзя ущемлять, например, из-за инвалидности.", uk: "Нікого не можна утискати, наприклад, через інвалідність." }
      b: { en: "You may disadvantage other people if there are sufficient personal reasons for it.", ru: "Можно ущемлять других людей, если для этого есть достаточные личные причины.", uk: "Інших людей можна утискати, якщо для цього є достатні особисті причини." }
      c: { en: "No one may take legal action against people if they have been disadvantaged.", ru: "Никто не имеет права подавать в суд на людей, если они были ущемлены.", uk: "Ніхто не має права подавати позов проти людей, якщо їх утискали." }
      d: { en: "It is the law for everyone to donate money to disadvantaged groups every year.", ru: "По закону все обязаны ежегодно жертвовать деньги ущемлённым группам.", uk: "За законом усі мусять щороку жертвувати гроші групам, яких утискають." }
    terms:
      - { de: "die Gleichbehandlung", en: "equal treatment", ru: "равное обращение", uk: "рівне ставлення" }
      - { de: "benachteiligen", en: "to disadvantage", ru: "ущемлять", uk: "утискати" }
      - { de: "die Behinderung", en: "disability", ru: "инвалидность", uk: "інвалідність" }
    status: reviewed
  - id: general-274
    rationale_de: >-
      Briefe sind durch das Briefgeheimnis geschützt (Grundgesetz, Artikel 10). Nur die Person, an die der Brief adressiert ist, darf ihn öffnen und lesen – wer absichtlich einen fremden Brief öffnet, kann sogar bestraft werden. Die Schweigepflicht ist etwas anderes: Sie gilt zum Beispiel für Ärztinnen und Ärzte.
    source: GG Art. 10; StGB § 202
    question:
      en: "In Germany, you have deliberately opened a letter addressed to another person. What have you not respected?"
      ru: "Вы в Германии намеренно вскрыли письмо, адресованное другому человеку. Что вы не соблюли?"
      uk: "Ви в Німеччині навмисно відкрили лист, адресований іншій людині. Чого ви не дотрималися?"
    options:
      a: { en: "the right to remain silent", ru: "право хранить молчание", uk: "права на мовчання" }
      b: { en: "the privacy of correspondence", ru: "тайну переписки", uk: "таємниці листування" }
      c: { en: "the duty of confidentiality", ru: "обязанность хранить тайну", uk: "обов’язку зберігати таємницю" }
      d: { en: "freedom of opinion", ru: "свободу мнений", uk: "свободи слова" }
    terms:
      - { de: "das Briefgeheimnis", en: "privacy of correspondence", ru: "тайна переписки", uk: "таємниця листування" }
      - { de: "die Schweigepflicht", en: "duty of confidentiality", ru: "обязанность хранить тайну", uk: "обов’язок зберігати таємницю" }
