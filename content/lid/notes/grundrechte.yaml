  - id: general-281
    rationale_de: >-
      Hier wird das Recht auf Gleichbehandlung verletzt. Das Grundgesetz sagt in Artikel 3: Niemand darf wegen seiner Abstammung oder Herkunft benachteiligt werden. Darum dürfen die beiden Freunde genauso ins Schwimmbad wie alle anderen.
    source: GG Art. 3 Abs. 3; AGG
