notes:
  - id: general-095
    rationale_de: >-
      In Deutschland gilt die Schulpflicht: Kinder müssen eine Schule besuchen, meistens ab etwa sechs Jahren. Die genauen Regeln machen die Bundesländer – in Bayern dauert die Schulpflicht zwölf Jahre, die Berufsschule eingerechnet. Eine Wahlpflicht gibt es dagegen nicht: Wählen ist ein Recht, aber keine Pflicht.
    source: BayEUG
    question:
      en: "What applies to most children in Germany?"
      ru: "Что действует для большинства детей в Германии?"
      uk: "Що поширюється на більшість дітей у Німеччині?"
    options:
      a: { en: "compulsory voting", ru: "обязанность голосовать", uk: "обов’язкове голосування" }
      b: { en: "compulsory schooling", ru: "обязательное школьное обучение", uk: "обов’язкове шкільне навчання" }
      c: { en: "duty of confidentiality", ru: "обязанность хранить тайну", uk: "обов’язок зберігати таємницю" }
      d: { en: "compulsory religion", ru: "обязательная религия", uk: "обов’язкова релігія" }
    terms:
      - { de: "die Schulpflicht", en: "compulsory schooling", ru: "обязательное школьное обучение", uk: "обов’язкове шкільне навчання" }
      - { de: "die Pflicht", en: "duty", ru: "обязанность", uk: "обов’язок" }
    status: reviewed
  - id: general-244
    rationale_de: >-
      Das Abitur ist der Schulabschluss, mit dem man normalerweise an einer Universität studieren darf. Man macht es meistens am Gymnasium. Ein Diplom bekommt man dagegen erst am Ende eines Studiums, die Gesellenprüfung am Ende einer Ausbildung im Handwerk, und die Prokura ist eine Vollmacht in einer Firma.
    question:
      en: "Which school-leaving qualification do you normally need to start a degree at a university in Germany?"
      ru: "Какой школьный аттестат обычно нужен, чтобы начать учёбу в университете в Германии?"
      uk: "Який шкільний атестат зазвичай потрібен, щоб почати навчання в університеті в Німеччині?"
    options:
      a: { en: "the Abitur", ru: "абитур", uk: "абітур" }
      b: { en: "a diploma", ru: "диплом", uk: "диплом" }
      c: { en: "the Prokura (commercial power of attorney)", ru: "прокура (торговая доверенность)", uk: "прокура (комерційна довіреність)" }
      d: { en: "a journeyman's examination", ru: "экзамен на звание подмастерья", uk: "іспит на звання підмайстра" }
    terms:
      - { de: "das Abitur", en: "upper-secondary leaving exam", ru: "аттестат зрелости", uk: "атестат зрілості" }
      - { de: "der Schulabschluss", en: "school-leaving qualification", ru: "школьный аттестат", uk: "шкільний атестат" }
      - { de: "das Studium", en: "university studies", ru: "учёба в вузе", uk: "навчання у виші" }
    status: reviewed
  - id: general-250
    rationale_de: >-
      Wer eine gute Ausbildung oder ein Studium hat, findet in Deutschland meistens leichter eine gut bezahlte Arbeit. Religion, Geschlecht oder eine Parteimitgliedschaft sollen dabei keine Rolle spielen. Wegen der Religion oder des Geschlechts darf ein Arbeitgeber niemanden benachteiligen – das verbietet das Allgemeine Gleichbehandlungsgesetz.
    source: AGG § 1
    question:
      en: "In Germany, you have the best chances of a well-paid job if you …"
      ru: "В Германии лучшие шансы на хорошо оплачиваемую работу у того, кто …"
      uk: "У Німеччині маєш найкращі шанси на добре оплачувану роботу, якщо ти …"
    options:
      a: { en: "are Catholic.", ru: "католик.", uk: "католик." }
      b: { en: "are well trained.", ru: "хорошо подготовлен профессионально.", uk: "маєш добру фахову підготовку." }
      c: { en: "are a woman.", ru: "женщина.", uk: "жінка." }
      d: { en: "are a member of a party.", ru: "член какой-либо партии.", uk: "член якоїсь партії." }
    terms:
      - { de: "gut ausgebildet", en: "well trained", ru: "хорошо подготовленный", uk: "добре підготовлений" }
      - { de: "die Ausbildung", en: "vocational training", ru: "профессиональное обучение", uk: "професійне навчання" }
    status: reviewed
  - id: general-257
    rationale_de: >-
      Am Abendgymnasium können Erwachsene das Abitur nachholen. Der Unterricht ist am Abend, darum kann man tagsüber weiter arbeiten. Eine Hochschule oder eine Privatuniversität setzt das Abitur normalerweise schon voraus, und die Hauptschule – in Bayern heißt sie Mittelschule – führt nicht zum Abitur.
    question:
      en: "An adult woman in Germany wants to catch up on her Abitur. She can do this at …"
      ru: "Взрослая женщина в Германии хочет дополнительно получить абитур. Она может сделать это в …"
      uk: "Доросла жінка в Німеччині хоче надолужити втрачене й здобути абітур. Вона може зробити це в …"
    options:
      a: { en: "an institution of higher education.", ru: "высшем учебном заведении.", uk: "вищому навчальному закладі." }
      b: { en: "an evening grammar school.", ru: "вечерней гимназии.", uk: "вечірній гімназії." }
      c: { en: "a Hauptschule (lower secondary school).", ru: "хауптшуле (основной школе).", uk: "гауптшуле (основній школі)." }
      d: { en: "a private university.", ru: "частном университете.", uk: "приватному університеті." }
    terms:
      - { de: "nachholen", en: "to catch up on", ru: "наверстать", uk: "надолужувати" }
      - { de: "das Abendgymnasium", en: "evening grammar school", ru: "вечерняя гимназия", uk: "вечірня гімназія" }
    status: reviewed
  - id: general-259
    rationale_de: >-
      Im Berufsinformationszentrum, kurz BIZ, bekommt man Informationen über Berufe, Ausbildungen und Studiengänge. Besonders junge Menschen finden dort Hilfe bei der Suche nach einer Lehrstelle, also einem Ausbildungsplatz. Für die Rente ist dagegen die Rentenversicherung zuständig, für die Steuererklärung das Finanzamt.
    source: Bundesagentur für Arbeit
    question:
      en: "The career information centre (BIZ) at the Federal Employment Agency in Germany helps with …"
      ru: "Центр профессиональной информации BIZ при Федеральном агентстве по труду в Германии помогает в …"
      uk: "Центр професійної інформації BIZ при Федеральному агентстві з питань праці в Німеччині допомагає в …"
    options:
      a: { en: "pension calculation.", ru: "расчёте пенсии.", uk: "розрахунку пенсії." }
      b: { en: "the search for an apprenticeship.", ru: "поиске места для профессионального обучения.", uk: "пошуку місця для професійного навчання." }
      c: { en: "the tax return.", ru: "составлении налоговой декларации.", uk: "складанні податкової декларації." }
      d: { en: "health insurance.", ru: "медицинском страховании.", uk: "медичному страхуванні." }
    terms:
      - { de: "die Lehrstelle", en: "apprenticeship", ru: "место ученика", uk: "місце для професійного навчання" }
      - { de: "die Ausbildung", en: "vocational training", ru: "профессиональное обучение", uk: "професійне навчання" }
    status: reviewed
  - id: general-260
    rationale_de: >-
      Wegen der Schulpflicht muss ein Kind regelmäßig zum Unterricht kommen. Wenn es krank ist, müssen die Eltern es in der Schule entschuldigen. Fehlt ein Kind ohne Grund, kann das für die Eltern ein Bußgeld bedeuten. Die meisten Fächer schreibt der Lehrplan vor, und Schulgeld ist eine Gebühr – an öffentlichen Schulen zahlt man keines.
    question:
      en: "In Germany, a child at school has …"
      ru: "В Германии у ребёнка в школе есть …"
      uk: "У Німеччині дитина в школі має …"
    options:
      a: { en: "a right to unlimited free time.", ru: "право на неограниченное свободное время.", uk: "право на необмежений вільний час." }
      b: { en: "free choice of all subjects.", ru: "свобода выбора всех предметов.", uk: "свободу вибору всіх предметів." }
      c: { en: "an entitlement to school fees.", ru: "право на плату за обучение.", uk: "право на плату за навчання." }
      d: { en: "compulsory attendance.", ru: "обязанность присутствовать на уроках.", uk: "обов’язок відвідувати уроки." }
    terms:
      - { de: "die Anwesenheitspflicht", en: "compulsory attendance", ru: "обязательное присутствие", uk: "обов’язкова присутність" }
      - { de: "das Schulgeld", en: "school fees", ru: "плата за обучение", uk: "плата за навчання" }
    status: reviewed
  - id: general-261
    rationale_de: >-
      Auch mit 30 Jahren kann man das Abitur noch machen, zum Beispiel an einem Abendgymnasium. Dort lernen Erwachsene am Abend und können tagsüber weiter in ihrem Beruf arbeiten. Wer lieber tagsüber lernt, kann ein Kolleg besuchen. An einer Hochschule studiert man dagegen normalerweise erst nach dem Abitur.
    question:
      en: "A man aged 30 wants to catch up on his Abitur in Germany. Where can he do this? At …"
      ru: "Мужчина в 30 лет хочет дополнительно получить в Германии абитур. Где он может это сделать? В …"
      uk: "Чоловік у 30 років хоче надолужити втрачене й здобути абітур у Німеччині. Де він може це зробити? У …"
    options:
      a: { en: "an institution of higher education.", ru: "высшем учебном заведении.", uk: "вищому навчальному закладі." }
      b: { en: "an evening grammar school.", ru: "вечерней гимназии.", uk: "вечірній гімназії." }
      c: { en: "a Hauptschule (lower secondary school).", ru: "хауптшуле (основной школе).", uk: "гауптшуле (основній школі)." }
      d: { en: "a private university.", ru: "частном университете.", uk: "приватному університеті." }
    terms:
      - { de: "nachholen", en: "to catch up on", ru: "наверстать", uk: "надолужувати" }
      - { de: "das Abendgymnasium", en: "evening grammar school", ru: "вечерняя гимназия", uk: "вечірня гімназія" }
    status: reviewed
  - id: general-269
    rationale_de: >-
      Kinder haben in Deutschland vom dritten Geburtstag bis zum Schulbeginn einen Rechtsanspruch auf einen Platz im Kindergarten. Schon ab dem ersten Geburtstag gibt es ein Recht auf einen Platz in einer Kita oder in der Kindertagespflege, zum Beispiel bei einer Tagesmutter. Taschengeld, ein Platz im Sportverein oder ein Ferienpass sind dagegen keine Rechte aus dem Gesetz.
    source: SGB VIII § 24
    question:
      en: "In Germany, from the age of three until they start school, children are entitled to …"
      ru: "В Германии дети с трёх лет и до поступления в школу имеют право на …"
      uk: "У Німеччині діти віком від трьох років і до вступу до школи мають право на …"
    options:
      a: { en: "monthly pocket money.", ru: "ежемесячные карманные деньги.", uk: "щомісячні кишенькові гроші." }
      b: { en: "a place in a sports club.", ru: "место в спортивном клубе.", uk: "місце в спортивному клубі." }
      c: { en: "a place in kindergarten.", ru: "место в детском саду.", uk: "місце в дитячому садку." }
      d: { en: "a holiday pass.", ru: "каникулярный абонемент.", uk: "канікулярний абонемент." }
    terms:
      - { de: "der Anspruch", en: "entitlement", ru: "право", uk: "право" }
      - { de: "die Ersteinschulung", en: "starting school", ru: "поступление в школу", uk: "вступ до школи" }
      - { de: "der Kindergartenplatz", en: "kindergarten place", ru: "место в детском саду", uk: "місце в дитячому садку" }
    status: reviewed
  - id: general-270
    rationale_de: >-
      Die Volkshochschule, kurz VHS, ist eine Einrichtung zur Weiterbildung. Dort gibt es zum Beispiel Sprachkurse, Computerkurse, Kochkurse und oft auch Integrationskurse. Die Kurse sind meistens günstig und für Menschen jeden Alters offen – nicht nur für Jugendliche oder für Rentnerinnen und Rentner.
    question:
      en: "The Volkshochschule in Germany is an institution …"
      ru: "Фольксхохшуле в Германии — это учреждение …"
      uk: "Volkshochschule у Німеччині — це заклад …"
    options:
      a: { en: "for religious education.", ru: "для уроков религии.", uk: "для уроків релігії." }
      b: { en: "only for young people.", ru: "только для молодёжи.", uk: "лише для молоді." }
      c: { en: "for further education.", ru: "для дополнительного образования.", uk: "для подальшого навчання." }
      d: { en: "only for pensioners.", ru: "только для пенсионеров.", uk: "лише для пенсіонерок і пенсіонерів." }
    terms:
      - { de: "die Volkshochschule", en: "adult education centre", ru: "народный университет", uk: "центр освіти дорослих" }
      - { de: "die Weiterbildung", en: "further education", ru: "дополнительное образование", uk: "подальше навчання" }
      - { de: "die Einrichtung", en: "institution", ru: "учреждение", uk: "заклад" }
    status: reviewed
  - id: general-284
    rationale_de: >-
      Viele Berufe ändern sich schnell, zum Beispiel durch neue Technik und die Digitalisierung. Darum ist es wichtig, auch nach der Ausbildung oder dem Studium weiterzulernen – man spricht vom lebenslangen Lernen. Dafür gibt es zum Beispiel Weiterbildungen, Kurse an der Volkshochschule und Angebote der Arbeitgeber und der Agentur für Arbeit.
    question:
      en: "What you need to be able to do for work will change very quickly in the future. What can you do?"
      ru: "То, что нужно уметь для работы, в будущем будет очень быстро меняться. Что можно сделать?"
      uk: "Те, що потрібно вміти для роботи, у майбутньому змінюватиметься дуже швидко. Що можна зробити?"
    options:
      a: { en: "It doesn't matter what you learn.", ru: "Неважно, чему учиться.", uk: "Байдуже, чого вчитися." }
      b: { en: "Adults must keep on learning even after their training.", ru: "Взрослые должны продолжать учиться и после профессионального обучения.", uk: "Дорослі мають і після професійного навчання постійно вчитися далі." }
      c: { en: "Children learn at school everything that is important for their job. After school you don't need to keep learning.", ru: "Дети учат в школе всё, что важно для профессии. После школы учиться дальше не нужно.", uk: "Діти вчать у школі все, що важливо для професії. Після школи вчитися далі не потрібно." }
      d: { en: "Everyone has to stop working earlier, because everything is changing.", ru: "Все должны раньше прекращать работать, потому что всё меняется.", uk: "Усі мають раніше припиняти працювати, бо все змінюється." }
    terms:
      - { de: "die Ausbildung", en: "vocational training", ru: "профессиональное обучение", uk: "професійне навчання" }
      - { de: "die Weiterbildung", en: "further education", ru: "дополнительное образование", uk: "подальше навчання" }
      - { de: "lebenslanges Lernen", en: "lifelong learning", ru: "обучение всю жизнь", uk: "навчання впродовж життя" }
    status: reviewed
