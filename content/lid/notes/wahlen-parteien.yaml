notes:
  - id: general-005
    rationale_de: >-
      Freie Wahl heißt: Niemand darf Sie zwingen, eine bestimmte Partei oder Person zu wählen, und niemand darf Sie unter Druck setzen. Wegen Ihrer Wahl dürfen Sie keine Nachteile haben. Das steht im Grundgesetz, Artikel 38. Geld für eine Stimme anzunehmen ist verboten, und eine Wahlpflicht gibt es in Deutschland nicht.
    source: GG Art. 38 Abs. 1; StGB § 108b
    question:
      en: "Elections in Germany are free. What does that mean?"
      ru: "Выборы в Германии свободные. Что это означает?"
      uk: "Вибори в Німеччині вільні. Що це означає?"
    options:
      a: { en: "You may accept money if you vote for a particular candidate in return.", ru: "Можно брать деньги, если за это проголосовать за определённую кандидатку или определённого кандидата.", uk: "Можна брати гроші, якщо за це голосуєш за певну кандидатку чи певного кандидата." }
      b: { en: "Only people who have never been in prison may vote.", ru: "Голосовать могут только люди, которые никогда не были в тюрьме.", uk: "Голосувати мають право лише люди, які ніколи не були у в’язниці." }
      c: { en: "Voters may neither be influenced nor forced to vote in a particular way, and they may suffer no disadvantage because of the election.", ru: "На избирательницу или избирателя нельзя влиять на выборах, нельзя принуждать её или его голосовать определённым образом, и из-за выборов у неё или у него не должно быть никаких невыгод.", uk: "На виборницю чи виборця під час виборів не можна ні впливати, ні змушувати голосувати певним чином, і через вибори вона чи він не повинні зазнати жодної шкоди." }
      d: { en: "All persons entitled to vote must vote.", ru: "Все, кто имеет право голоса, обязаны голосовать.", uk: "Усі, хто має право голосу, зобов’язані голосувати." }
    terms:
      - { de: "die Stimmabgabe", en: "casting a vote", ru: "подача голоса", uk: "голосування" }
      - { de: "beeinflussen", en: "to influence", ru: "влиять", uk: "впливати" }
      - { de: "der Nachteil", en: "disadvantage", ru: "невыгода", uk: "невигода, шкода" }
    status: reviewed
  - id: general-028
    rationale_de: >-
      In einer Demokratie geht alle Staatsgewalt vom Volk aus (Grundgesetz, Artikel 20). Darum wählen die wahlberechtigten Bürgerinnen und Bürger die Abgeordneten des Bundestages – direkt und für vier Jahre (Artikel 38 und 39). Militär, Wirtschaft und Verwaltung haben bei der Wahl keine besondere Stimme.
    source: GG Art. 20 Abs. 2, Art. 38
    question:
      en: "Who elects the members of the Bundestag in Germany?"
      ru: "Кто в Германии избирает депутатов бундестага?"
      uk: "Хто в Німеччині обирає депутатів Бундестагу?"
    options:
      a: { en: "the military", ru: "армия", uk: "армія" }
      b: { en: "the business sector", ru: "экономика", uk: "економіка" }
      c: { en: "the people entitled to vote", ru: "народ, имеющий право голоса", uk: "народ, що має право голосу" }
      d: { en: "the administration", ru: "администрация", uk: "адміністрація" }
    terms:
      - { de: "wahlberechtigt", en: "entitled to vote", ru: "имеющий право голоса", uk: "з правом голосу" }
      - { de: "der/die Abgeordnete", en: "member of parliament", ru: "депутат", uk: "депутат, депутатка" }
    status: reviewed
  - id: general-031
    rationale_de: >-
      Meistens bekommt keine Partei allein die Mehrheit im Bundestag. Dann arbeiten zwei oder mehr Parteien zusammen und bilden gemeinsam eine Regierung – das ist eine Koalition. Eine Fraktion ist etwas anderes: So nennt man die Gruppe der Abgeordneten einer Partei im Parlament.
    question:
      en: "In Germany, the cooperation of parties to form a government is called …"
      ru: "Сотрудничество партий для формирования правительства в Германии называется …"
      uk: "Співпрацю партій для формування уряду в Німеччині називають …"
    options:
      a: { en: "unity.", ru: "единство.", uk: "єдністю." }
      b: { en: "coalition.", ru: "коалиция.", uk: "коаліцією." }
      c: { en: "ministry.", ru: "министерство.", uk: "міністерством." }
      d: { en: "parliamentary group.", ru: "фракция.", uk: "фракцією." }
    terms:
      - { de: "die Koalition", en: "coalition", ru: "коалиция", uk: "коаліція" }
      - { de: "die Fraktion", en: "parliamentary group", ru: "фракция", uk: "фракція" }
    status: reviewed
  - id: general-062
    rationale_de: >-
      Das Parlament eines Bundeslandes heißt meistens Landtag – darum spricht man von der Landtagswahl. In Bayern wird der Landtag alle fünf Jahre gewählt. Bei der Kommunalwahl wählt man dagegen zum Beispiel den Gemeinderat oder den Stadtrat.
    source: Bayerische Verfassung Art. 16
    question:
      en: "When the parliament of a German federal state is elected, it is called …"
      ru: "Когда избирают парламент федеральной земли Германии, это называется …"
      uk: "Коли обирають парламент німецької федеральної землі, це називається …"
    options:
      a: { en: "local election", ru: "муниципальные выборы", uk: "місцеві вибори" }
      b: { en: "Landtag election", ru: "выборы в ландтаг", uk: "вибори до ландтагу" }
      c: { en: "European election", ru: "выборы в Европейский парламент", uk: "вибори до Європейського парламенту" }
      d: { en: "Bundestag election", ru: "выборы в бундестаг", uk: "вибори до Бундестагу" }
    terms:
      - { de: "die Landtagswahl", en: "state election", ru: "выборы в ландтаг", uk: "вибори до ландтагу" }
      - { de: "die Kommunalwahl", en: "local election", ru: "муниципальные выборы", uk: "місцеві вибори" }
    status: reviewed
  - id: general-076
    rationale_de: >-
      CDU heißt Christlich Demokratische Union. Die Partei wurde 1945 gegründet, und Konrad Adenauer war ihr erster Bundeskanzler. In Bayern tritt die CDU nicht zur Wahl an – dort gibt es ihre Schwesterpartei, die CSU.
    question:
      en: "What does the abbreviation CDU stand for in Germany?"
      ru: "Что означает аббревиатура CDU в Германии?"
      uk: "Що означає абревіатура CDU в Німеччині?"
    options:
      a: { en: "Christian German Union", ru: "Христианский немецкий союз", uk: "Християнський німецький союз" }
      b: { en: "Club of German Entrepreneurs", ru: "Клуб немецких предпринимателей", uk: "Клуб німецьких підприємців" }
      c: { en: "Christian German Environmental Protection", ru: "Христианская немецкая защита окружающей среды", uk: "Християнський німецький захист довкілля" }
      d: { en: "Christian Democratic Union", ru: "Христианско-демократический союз", uk: "Християнсько-демократичний союз" }
    terms:
      - { de: "die Schwesterpartei", en: "sister party", ru: "партия-сестра", uk: "сестринська партія" }
    status: reviewed
  - id: general-078
    rationale_de: >-
      SPD heißt Sozialdemokratische Partei Deutschlands. Sie ist die älteste Partei in Deutschland; ihre Geschichte beginnt 1863. Bundeskanzler aus der SPD waren zum Beispiel Willy Brandt, Helmut Schmidt, Gerhard Schröder und Olaf Scholz.
    question:
      en: "What does the abbreviation SPD stand for?"
      ru: "Что означает аббревиатура SPD?"
      uk: "Що означає абревіатура SPD?"
    options:
      a: { en: "Socialist Party of Germany", ru: "Социалистическая партия Германии", uk: "Соціалістична партія Німеччини" }
      b: { en: "Social Policy Party of Germany", ru: "Партия социальной политики Германии", uk: "Соціально-політична партія Німеччини" }
      c: { en: "Social Democratic Party of Germany", ru: "Социал-демократическая партия Германии", uk: "Соціал-демократична партія Німеччини" }
      d: { en: "Socially Just Party of Germany", ru: "Партия социальной справедливости Германии", uk: "Соціально справедлива партія Німеччини" }
    terms:
      - { de: "sozialdemokratisch", en: "social democratic", ru: "социал-демократический", uk: "соціал-демократичний" }
    status: reviewed
  - id: general-079
    rationale_de: >-
      FDP heißt Freie Demokratische Partei. Sie ist eine liberale Partei: Die Freiheit der einzelnen Menschen und eine freie Wirtschaft sind ihr besonders wichtig. Die FDP war oft an Bundesregierungen beteiligt, zuletzt in der Ampelkoalition von 2021 bis 2024. Bei der Wahl 2025 bekam sie weniger als 5 % und ist seitdem nicht mehr im Bundestag.
    question:
      en: "What does the abbreviation FDP stand for in Germany?"
      ru: "Что означает аббревиатура FDP в Германии?"
      uk: "Що означає абревіатура FDP в Німеччині?"
    options:
      a: { en: "Peaceful Demonstrative Party", ru: "Мирная демонстративная партия", uk: "Мирна демонстративна партія" }
      b: { en: "Free Germany Party", ru: "Партия свободной Германии", uk: "Партія вільної Німеччини" }
      c: { en: "Leading Democratic Party", ru: "Ведущая демократическая партия", uk: "Провідна демократична партія" }
      d: { en: "Free Democratic Party", ru: "Свободная демократическая партия", uk: "Вільна демократична партія" }
    terms:
      - { de: "liberal", en: "liberal", ru: "либеральный", uk: "ліберальний" }
    status: reviewed
  - id: general-092
    rationale_de: >-
      CSU heißt Christlich-Soziale Union. Es gibt sie nur in Bayern, und seit 1957 kommen alle bayerischen Ministerpräsidenten aus der CSU. Im Bundestag bildet die CSU mit der CDU eine gemeinsame Fraktion, die man auch „die Union“ nennt.
    question:
      en: "What does the abbreviation CSU stand for in Germany?"
      ru: "Что означает аббревиатура CSU в Германии?"
      uk: "Що означає абревіатура CSU в Німеччині?"
    options:
      a: { en: "Christian Safe Union", ru: "Христианский надёжный союз", uk: "Християнський безпечний союз" }
      b: { en: "Christian South German Union", ru: "Христианский южногерманский союз", uk: "Християнський південнонімецький союз" }
      c: { en: "Christian Social Employers' Association", ru: "Христианско-социальное объединение предпринимателей", uk: "Християнсько-соціальна спілка підприємців" }
      d: { en: "Christian Social Union", ru: "Христианско-социальный союз", uk: "Християнсько-соціальний союз" }
    terms:
      - { de: "die Fraktion", en: "parliamentary group", ru: "фракция", uk: "фракція" }
    status: reviewed
  - id: general-093
    rationale_de: >-
      Mit der Zweitstimme wählt man eine Partei. Nach dem Anteil der Zweitstimmen wird berechnet, wie viele Sitze jede Partei im Bundestag bekommt. Mit der Erststimme wählt man dagegen eine Person im eigenen Wahlkreis.
    source: BWahlG
    question:
      en: "The more “second votes” a party receives in a Bundestag election, the …"
      ru: "Чем больше «вторых голосов» получает партия на выборах в бундестаг, тем …"
      uk: "Що більше «других голосів» партія отримує на виборах до Бундестагу, то …"
    options:
      a: { en: "fewer first votes it can have.", ru: "меньше первых голосов она может иметь.", uk: "менше перших голосів вона може мати." }
      b: { en: "more of the party's constituency candidates enter parliament.", ru: "больше прямых кандидатов от партии проходит в парламент.", uk: "більше кандидатів партії від виборчих округів проходить до парламенту." }
      c: { en: "greater the risk of having to form a coalition.", ru: "выше риск, что придётся создавать коалицию.", uk: "більший ризик, що доведеться утворювати коаліцію." }
      d: { en: "more seats the party receives in parliament.", ru: "больше мест получает партия в парламенте.", uk: "більше місць партія отримує в парламенті." }
    terms:
      - { de: "die Zweitstimme", en: "second vote", ru: "второй голос", uk: "другий голос" }
      - { de: "die Erststimme", en: "first vote", ru: "первый голос", uk: "перший голос" }
      - { de: "der Sitz", en: "seat", ru: "место в парламенте", uk: "місце в парламенті" }
    status: reviewed
  - id: general-094
    rationale_de: >-
      Bei der Bundestagswahl darf man ab 18 Jahren wählen. Das steht im Grundgesetz, Artikel 38. Bei der Europawahl dürfen in Deutschland seit 2024 schon 16-Jährige wählen – bei der Bundestagswahl aber nicht.
    source: GG Art. 38 Abs. 2
    question:
      en: "From what age may you take part in the election to the German Bundestag?"
      ru: "С какого возраста в Германии можно участвовать в выборах в германский бундестаг?"
      uk: "З якого віку в Німеччині можна брати участь у виборах до німецького Бундестагу?"
    options:
      a: { en: "16", ru: "16", uk: "16" }
      b: { en: "18", ru: "18", uk: "18" }
      c: { en: "21", ru: "21", uk: "21" }
      d: { en: "23", ru: "23", uk: "23" }
    terms:
      - { de: "teilnehmen an", en: "to take part in", ru: "участвовать в", uk: "брати участь у" }
    status: reviewed
  - id: general-103
    rationale_de: >-
      Viele Parteien haben eine Farbe: Die SPD ist rot, die FDP gelb und die Grünen sind grün – wie eine Ampel. Darum heißt eine Koalition aus SPD, FDP und Grünen Ampelkoalition. Im Bund regierte so eine Koalition von 2021 bis 2024, mit Olaf Scholz (SPD) als Kanzler.
    question:
      en: "What is called a “traffic-light coalition” in Germany? The cooperation …"
      ru: "Что в Германии называют «коалицией светофора»? Сотрудничество …"
      uk: "Що в Німеччині називають «світлофорною коаліцією» (Ampelkoalition)? Співпрацю …"
    options:
      a: { en: "of the CDU and CSU parliamentary groups in the Bundestag", ru: "фракций ХДС и ХСС в бундестаге", uk: "фракцій CDU і CSU в Бундестазі" }
      b: { en: "of the SPD, FDP and Bündnis 90/Die Grünen in one government", ru: "СДПГ, СвДП и Союза 90/Зелёных в одном правительстве", uk: "SPD, FDP і «Союзу 90/Зелених» в одному уряді" }
      c: { en: "of the CSU, Die Linke and Bündnis 90/Die Grünen in one government", ru: "ХСС, Левых и Союза 90/Зелёных в одном правительстве", uk: "CSU, «Лівих» і «Союзу 90/Зелених» в одному уряді" }
      d: { en: "of the CDU and SPD parliamentary groups in the Bundestag", ru: "фракций ХДС и СДПГ в бундестаге", uk: "фракцій CDU і SPD в Бундестазі" }
    terms:
      - { de: "die Ampel", en: "traffic light", ru: "светофор", uk: "світлофор" }
      - { de: "die Koalition", en: "coalition", ru: "коалиция", uk: "коаліція" }
    status: reviewed
  - id: general-105
    rationale_de: >-
      Wahlhelferinnen und Wahlhelfer arbeiten am Wahltag im Wahllokal. Ihre wichtigste Aufgabe: Wenn die Wahl um 18 Uhr endet, zählen sie die Stimmen – und jeder darf dabei zusehen. Die Wahlbenachrichtigungen verschickt dagegen die Gemeinde schon vor der Wahl.
    source: BWahlG § 31; BWO § 19
    question:
      en: "What is one task of election workers in Germany?"
      ru: "Что входит в задачи помощников на выборах в Германии?"
      uk: "Що є одним із завдань помічників на виборах у Німеччині?"
    options:
      a: { en: "They help elderly people cast their vote in the voting booth.", ru: "Они помогают пожилым людям голосовать в кабине для голосования.", uk: "Вони допомагають літнім людям голосувати в кабіні для голосування." }
      b: { en: "They write the election notifications before the election.", ru: "Они пишут уведомления о выборах перед выборами.", uk: "Перед виборами вони пишуть повідомлення про вибори." }
      c: { en: "They pass interim results on to the media.", ru: "Они передают промежуточные результаты средствам массовой информации.", uk: "Вони передають проміжні результати медіа." }
      d: { en: "They count the votes after the election has closed.", ru: "Они подсчитывают голоса после окончания выборов.", uk: "Вони підраховують голоси після закінчення виборів." }
    terms:
      - { de: "das Wahllokal", en: "polling station", ru: "избирательный участок", uk: "виборча дільниця" }
      - { de: "die Wahlbenachrichtigung", en: "election notification", ru: "уведомление о выборах", uk: "повідомлення про вибори" }
    status: reviewed
  - id: general-106
    rationale_de: >-
      Die wichtigste Aufgabe der Wahlhelferinnen und Wahlhelfer ist das Zählen der Stimmen nach dem Ende der Wahl. Sie machen das ehrenamtlich, also ohne Lohn; sie bekommen nur ein kleines Erfrischungsgeld. Kinder dürfen gar nicht wählen, und in der Wahlkabine ist jede Person normalerweise allein.
    source: BWahlG § 11
    question:
      en: "In Germany, volunteer election workers help at elections. What is one task of election workers?"
      ru: "В Германии на выборах помогают помощники-добровольцы. Что входит в задачи помощников на выборах?"
      uk: "У Німеччині на виборах допомагають помічниці й помічники, що працюють на громадських засадах. Що є одним із завдань помічників на виборах?"
    options:
      a: { en: "They help children and elderly people to vote.", ru: "Они помогают детям и пожилым людям голосовать.", uk: "Вони допомагають дітям і літнім людям голосувати." }
      b: { en: "They write cards and letters stating the polling station.", ru: "Они пишут открытки и письма с указанием избирательного участка.", uk: "Вони пишуть листівки й листи із зазначенням виборчої дільниці." }
      c: { en: "They pass interim results on to journalists.", ru: "Они передают промежуточные результаты журналистам.", uk: "Вони передають проміжні результати журналістам." }
      d: { en: "They count the votes after the election has closed.", ru: "Они подсчитывают голоса после окончания выборов.", uk: "Вони підраховують голоси після закінчення виборів." }
    terms:
      - { de: "ehrenamtlich", en: "voluntary, unpaid", ru: "на общественных началах", uk: "на громадських засадах" }
      - { de: "die Wahlkabine", en: "voting booth", ru: "кабина для голосования", uk: "кабіна для голосування" }
    status: reviewed
  - id: general-107
    rationale_de: >-
      Der Bundestag wird für vier Jahre gewählt – das steht im Grundgesetz, Artikel 39. Diese Zeit nennt man Wahlperiode oder Legislaturperiode. Danach gibt es eine neue Bundestagswahl.
    source: GG Art. 39 Abs. 1
    question:
      en: "For how many years is the Bundestag in Germany elected?"
      ru: "На сколько лет избирается бундестаг в Германии?"
      uk: "На скільки років обирають Бундестаг у Німеччині?"
    options:
      a: { en: "2 years", ru: "2 года", uk: "2 роки" }
      b: { en: "4 years", ru: "4 года", uk: "4 роки" }
      c: { en: "6 years", ru: "6 лет", uk: "6 років" }
      d: { en: "8 years", ru: "8 лет", uk: "8 років" }
    terms:
      - { de: "die Wahlperiode", en: "electoral term", ru: "срок полномочий", uk: "строк повноважень" }
    status: reviewed
  - id: general-108
    rationale_de: >-
      Bei der Bundestagswahl dürfen nur deutsche Staatsangehörige wählen, und sie müssen mindestens 18 Jahre alt sein (Grundgesetz, Artikel 38; Bundeswahlgesetz, § 12). Wer in Deutschland wohnt, aber nicht deutsch ist, darf also nicht mitwählen – auch nach vielen Jahren nicht. Bürgerinnen und Bürger anderer EU-Länder dürfen aber bei Kommunalwahlen und bei der Europawahl wählen.
    source: GG Art. 38 Abs. 2, Art. 28 Abs. 1; BWahlG § 12
    question:
      en: "In a Bundestag election in Germany, everyone may vote who …"
      ru: "На выборах в бундестаг в Германии может голосовать каждая или каждый, кто …"
      uk: "На виборах до Бундестагу в Німеччині має право голосувати кожна чи кожен, хто …"
    options:
      a: { en: "lives in the Federal Republic of Germany and wants to vote.", ru: "живёт в Федеративной Республике Германия и хочет голосовать.", uk: "живе у Федеративній Республіці Німеччина й хоче голосувати." }
      b: { en: "is a citizen of the Federal Republic of Germany and is at least 18 years old.", ru: "является гражданкой или гражданином Федеративной Республики Германия в возрасте не моложе 18 лет.", uk: "є громадянкою чи громадянином Федеративної Республіки Німеччина віком щонайменше 18 років." }
      c: { en: "has lived in the Federal Republic of Germany for at least 3 years.", ru: "живёт в Федеративной Республике Германия не меньше 3 лет.", uk: "щонайменше 3 роки живе у Федеративній Республіці Німеччина." }
      d: { en: "is a citizen of the Federal Republic of Germany and is at least 21 years old.", ru: "является гражданкой или гражданином Федеративной Республики Германия в возрасте не моложе 21 года.", uk: "є громадянкою чи громадянином Федеративної Республіки Німеччина віком щонайменше 21 рік." }
    terms:
      - { de: "die Bürgerin / der Bürger", en: "citizen", ru: "гражданка / гражданин", uk: "громадянка / громадянин" }
      - { de: "die Staatsangehörigkeit", en: "nationality", ru: "гражданство", uk: "громадянство" }
    status: reviewed
  - id: general-109
    rationale_de: >-
      Normalerweise wählen die Deutschen alle vier Jahre einen neuen Bundestag (Grundgesetz, Artikel 39). Manchmal gibt es eine Wahl früher: 2025 wurde vorzeitig gewählt, weil die Regierung keine Mehrheit mehr hatte. Alle fünf Jahre wählt man dagegen zum Beispiel den Bayerischen Landtag und das Europäische Parlament.
    source: GG Art. 39 Abs. 1, Art. 68
    question:
      en: "How often are there normally Bundestag elections in Germany?"
      ru: "Как часто обычно проходят выборы в бундестаг в Германии?"
      uk: "Як часто зазвичай відбуваються вибори до Бундестагу в Німеччині?"
    options:
      a: { en: "every three years", ru: "каждые три года", uk: "кожні три роки" }
      b: { en: "every four years", ru: "каждые четыре года", uk: "кожні чотири роки" }
      c: { en: "every five years", ru: "каждые пять лет", uk: "кожні п’ять років" }
      d: { en: "every six years", ru: "каждые шесть лет", uk: "кожні шість років" }
    terms:
      - { de: "vorzeitig", en: "early", ru: "досрочно", uk: "достроковий" }
    status: reviewed
  - id: general-110
    rationale_de: >-
      Die Wahlperiode des Bundestages dauert vier Jahre (Grundgesetz, Artikel 39). Fünf Jahre ist für den Bundestag falsch – so lange dauert aber die Wahlperiode des Bayerischen Landtages und des Europäischen Parlaments. Für den Bundestag gilt also: vier Jahre.
    source: GG Art. 39 Abs. 1; Bayerische Verfassung Art. 16
    question:
      en: "For how many years is the Bundestag in Germany elected?"
      ru: "На сколько лет избирается бундестаг в Германии?"
      uk: "На скільки років обирають Бундестаг у Німеччині?"
    options:
      a: { en: "2 years", ru: "2 года", uk: "2 роки" }
      b: { en: "3 years", ru: "3 года", uk: "3 роки" }
      c: { en: "4 years", ru: "4 года", uk: "4 роки" }
      d: { en: "5 years", ru: "5 лет", uk: "5 років" }
    terms:
      - { de: "die Wahlperiode", en: "electoral term", ru: "срок полномочий", uk: "строк повноважень" }
    status: reviewed
  - id: general-112
    rationale_de: >-
      Wahlen in Deutschland sind geheim: Sie kreuzen den Stimmzettel allein in der Wahlkabine an, und niemand darf sehen, wen Sie wählen. So kann Sie niemand unter Druck setzen. Beruf und Geschlecht spielen bei der Wahl keine Rolle – jede Stimme zählt gleich (Grundgesetz, Artikel 38).
    source: GG Art. 38 Abs. 1
    question:
      en: "Elections in Germany are …"
      ru: "Выборы в Германии …"
      uk: "Вибори в Німеччині …"
    options:
      a: { en: "special.", ru: "особые.", uk: "особливі." }
      b: { en: "secret.", ru: "тайные.", uk: "таємні." }
      c: { en: "occupation-based.", ru: "связаны с профессией.", uk: "пов’язані з професією." }
      d: { en: "gender-dependent.", ru: "зависят от пола.", uk: "залежать від статі." }
    terms:
      - { de: "geheim", en: "secret", ru: "тайный", uk: "таємний" }
      - { de: "der Stimmzettel", en: "ballot paper", ru: "избирательный бюллетень", uk: "виборчий бюлетень" }
    status: reviewed
  - id: general-113
    rationale_de: >-
      Die Wahl gewinnt die Partei mit den meisten Stimmen; jede Stimme zählt dabei gleich. Den Kanzler oder die Kanzlerin wählt das Volk nicht direkt – das macht danach der Bundestag (Grundgesetz, Artikel 63). Darum regiert der Gewinner nicht automatisch: Er braucht eine Mehrheit im Bundestag, oft mit einer Koalition.
    source: GG Art. 38, Art. 63
    question:
      en: "Elections in Germany are won by the party that …"
      ru: "На выборах в Германии побеждает партия, которая …"
      uk: "На виборах у Німеччині перемагає партія, яка …"
    options:
      a: { en: "receives the most votes.", ru: "получает больше всего голосов.", uk: "отримує найбільше голосів." }
      b: { en: "the majority of men voted for.", ru: "за которую проголосовало большинство мужчин.", uk: "за яку проголосувала більшість чоловіків." }
      c: { en: "has received the most votes among workers.", ru: "получила больше всего голосов среди рабочих.", uk: "отримала найбільше голосів серед робітників." }
      d: { en: "has received the most first votes for its candidate for chancellor.", ru: "получила больше всего первых голосов за своего кандидата в канцлеры.", uk: "отримала найбільше перших голосів за свого кандидата в канцлери." }
    terms:
      - { de: "die Stimme", en: "vote", ru: "голос", uk: "голос" }
      - { de: "die Kanzlerkandidatin / der Kanzlerkandidat", en: "candidate for chancellor", ru: "кандидат в канцлеры", uk: "кандидат у канцлери" }
    status: reviewed
  - id: general-114
    rationale_de: >-
      Wählen ist in Deutschland ein Recht, aber keine Pflicht. Jede Bürgerin und jeder Bürger entscheidet selbst, ob sie oder er wählen geht. Viele Menschen finden es trotzdem wichtig, zu wählen – denn so bestimmen sie mit, wer regiert.
    source: GG Art. 38
    question:
      en: "Taking part in democratic elections in Germany is …"
      ru: "Участие в демократических выборах в Германии — это …"
      uk: "Брати участь у демократичних виборах у Німеччині — це …"
    options:
      a: { en: "a duty.", ru: "обязанность.", uk: "обов’язок." }
      b: { en: "a right.", ru: "право.", uk: "право." }
      c: { en: "a compulsion.", ru: "принуждение.", uk: "примус." }
      d: { en: "a burden.", ru: "бремя.", uk: "тягар." }
    terms:
      - { de: "die Pflicht", en: "duty", ru: "обязанность", uk: "обов’язок" }
      - { de: "der Zwang", en: "compulsion", ru: "принуждение", uk: "примус" }
    status: reviewed
  - id: general-115
    rationale_de: >-
      Aktives Wahlrecht heißt: Sie dürfen wählen. Passives Wahlrecht heißt dagegen: Sie dürfen gewählt werden, zum Beispiel als Abgeordnete oder Abgeordneter. Eine Pflicht zu wählen gibt es in Deutschland nicht.
    source: GG Art. 38 Abs. 2
    question:
      en: "What does “active right to vote” mean in Germany?"
      ru: "Что означает «активное избирательное право» в Германии?"
      uk: "Що означає в Німеччині «активне виборче право»?"
    options:
      a: { en: "You can be elected.", ru: "Можно быть избранным.", uk: "Можна бути обраним." }
      b: { en: "You must go and vote.", ru: "Нужно обязательно идти на выборы.", uk: "Треба обов’язково йти на вибори." }
      c: { en: "You can vote.", ru: "Можно голосовать.", uk: "Можна голосувати." }
      d: { en: "You must go to the counting of the votes.", ru: "Нужно идти на подсчёт голосов.", uk: "Треба йти на підрахунок голосів." }
    terms:
      - { de: "das aktive Wahlrecht", en: "right to vote", ru: "активное избирательное право", uk: "активне виборче право" }
      - { de: "das passive Wahlrecht", en: "right to stand for election", ru: "пассивное избирательное право", uk: "пасивне виборче право" }
    status: reviewed
  - id: general-116
    rationale_de: >-
      Das Recht zu wählen heißt aktives Wahlrecht. Bei der Bundestagswahl hat es, wer deutsche Staatsangehörige oder deutscher Staatsangehöriger und mindestens 18 Jahre alt ist. Wahlkampf und Wahlkampagne machen dagegen die Parteien: Sie werben vor der Wahl um Stimmen.
    source: GG Art. 38 Abs. 2; BWahlG § 12
    question:
      en: "If you are allowed to vote in a Bundestag election in Germany, this is called …"
      ru: "Если вы имеете право голосовать на выборах в бундестаг в Германии, это называется …"
      uk: "Якщо ви маєте право голосувати на виборах до Бундестагу в Німеччині, це називається …"
    options:
      a: { en: "active election campaign.", ru: "активная избирательная кампания.", uk: "активна виборча кампанія." }
      b: { en: "active electoral procedure.", ru: "активная избирательная процедура.", uk: "активна виборча процедура." }
      c: { en: "active electioneering.", ru: "активная предвыборная борьба.", uk: "активна передвиборча боротьба." }
      d: { en: "active right to vote.", ru: "активное избирательное право.", uk: "активне виборче право." }
    terms:
      - { de: "der Wahlkampf", en: "election campaign", ru: "предвыборная борьба", uk: "передвиборча боротьба" }
      - { de: "werben um", en: "to canvass for", ru: "агитировать за", uk: "агітувати за" }
    status: reviewed
  - id: general-117
    rationale_de: >-
      Eine Partei braucht mindestens 5 % der Zweitstimmen, damit sie Sitze im Bundestag bekommt. Das nennt man die Fünf-Prozent-Hürde; sie steht im Bundeswahlgesetz. Es gibt nur wenige Ausnahmen, zum Beispiel für Parteien nationaler Minderheiten.
    source: BWahlG
    question:
      en: "What minimum percentage of second votes must parties receive in order to be elected to the German Bundestag?"
      ru: "Какой минимальный процент вторых голосов должны получить партии, чтобы пройти в германский бундестаг?"
      uk: "Скільки відсотків других голосів мають щонайменше отримати партії, щоб їх обрали до німецького Бундестагу?"
    options:
      a: { en: "3%", ru: "3%", uk: "3%" }
      b: { en: "4%", ru: "4%", uk: "4%" }
      c: { en: "5%", ru: "5%", uk: "5%" }
      d: { en: "6%", ru: "6%", uk: "6%" }
    terms:
      - { de: "die Fünf-Prozent-Hürde", en: "five-percent threshold", ru: "пятипроцентный барьер", uk: "п’ятивідсотковий бар’єр" }
      - { de: "die Zweitstimme", en: "second vote", ru: "второй голос", uk: "другий голос" }
    status: reviewed
  - id: general-119
    rationale_de: >-
      Freie Wahl heißt: Sie entscheiden ohne Druck, ob Sie wählen und wen Sie wählen (Grundgesetz, Artikel 38). Wo Sie wählen, können Sie dagegen nicht einfach aussuchen: Normalerweise wählen Sie in dem Wahllokal, das auf Ihrer Wahlbenachrichtigung steht. Bundestagswahlen sind immer an einem Sonntag oder Feiertag, darum muss die Chefin oder der Chef nicht frei geben.
    source: GG Art. 38 Abs. 1; BWahlG § 16
    question:
      en: "Elections in Germany are free. What does that mean?"
      ru: "Выборы в Германии свободные. Что это означает?"
      uk: "Вибори в Німеччині вільні. Що це означає?"
    options:
      a: { en: "No convicted offender may vote.", ru: "Все осуждённые преступники не имеют права голосовать.", uk: "Усі засуджені злочинці не мають права голосувати." }
      b: { en: "If I want to go and vote, my employer must give me time off.", ru: "Если я хочу пойти на выборы, работодательница или работодатель обязаны меня отпустить.", uk: "Якщо я хочу піти на вибори, мій роботодавець мусить мене відпустити." }
      c: { en: "Every person can decide without coercion whether they want to vote and whom they want to vote for.", ru: "Каждый человек может без принуждения решить, хочет ли он голосовать и за кого.", uk: "Кожна людина може без примусу вирішити, чи хоче вона голосувати і за кого." }
      d: { en: "I can freely decide where I want to go to vote.", ru: "Я могу свободно решить, где мне голосовать.", uk: "Я можу вільно вирішити, де хочу голосувати." }
    terms:
      - { de: "der Zwang", en: "coercion", ru: "принуждение", uk: "примус" }
      - { de: "die Straftäterin / der Straftäter", en: "offender", ru: "преступница / преступник", uk: "злочинниця / злочинець" }
    status: reviewed
  - id: general-120
    rationale_de: >-
      Mit der Erststimme wählt man eine Person im Wahlkreis – wer dort die meisten Stimmen bekommt, gewinnt den Wahlkreis (Mehrheitswahl). Mit der Zweitstimme wählt man eine Partei, und nach dem Anteil der Zweitstimmen werden die Sitze verteilt (Verhältniswahl). Zensus- und Dreiklassenwahlrecht gab es früher: Da durften nur Reiche wählen, oder ihre Stimme zählte mehr.
    source: BWahlG § 1
    question:
      en: "The electoral system in Germany is a …"
      ru: "Избирательная система в Германии — это …"
      uk: "Виборча система в Німеччині — це …"
    options:
      a: { en: "census suffrage.", ru: "цензовое избирательное право.", uk: "цензове виборче право." }
      b: { en: "three-class franchise.", ru: "трёхклассное избирательное право.", uk: "трикласне виборче право." }
      c: { en: "majority and proportional voting system.", ru: "мажоритарное и пропорциональное избирательное право.", uk: "мажоритарне і пропорційне виборче право." }
      d: { en: "universal male suffrage.", ru: "всеобщее избирательное право для мужчин.", uk: "загальне виборче право для чоловіків." }
    terms:
      - { de: "die Mehrheitswahl", en: "majority vote", ru: "мажоритарные выборы", uk: "мажоритарні вибори" }
      - { de: "die Verhältniswahl", en: "proportional representation", ru: "пропорциональные выборы", uk: "пропорційні вибори" }
      - { de: "der Wahlkreis", en: "constituency", ru: "избирательный округ", uk: "виборчий округ" }
    status: reviewed
  - id: general-121
    rationale_de: >-
      Diese Regel heißt Fünf-Prozent-Hürde: Eine Partei muss mindestens 5 % der Zweitstimmen bekommen, sonst bekommt sie normalerweise keine Sitze im Bundestag. Eine Hürde ist eigentlich ein Hindernis, über das man springen muss – wie beim Sport. Auch für den Bayerischen Landtag gibt es eine Fünf-Prozent-Hürde.
    source: BWahlG; Bayerische Verfassung Art. 14 Abs. 4
    question:
      en: "A party wants to get into the German Bundestag. But it must have a minimum share of the votes. This is called …"
      ru: "Партия хочет пройти в германский бундестаг. Но она должна получить минимальную долю голосов избирателей. Это называется …"
      uk: "Партія хоче потрапити до німецького Бундестагу. Але вона мусить мати мінімальну частку голосів виборців. Це називається …"
    options:
      a: { en: "5% hurdle.", ru: "5-процентный барьер.", uk: "5-відсотковий бар’єр." }
      b: { en: "admission limit.", ru: "порог допуска.", uk: "поріг допуску." }
      c: { en: "base value.", ru: "базовое значение.", uk: "базове значення." }
      d: { en: "guideline.", ru: "директива.", uk: "директива." }
    terms:
      - { de: "die Hürde", en: "hurdle", ru: "барьер", uk: "бар’єр" }
      - { de: "der Mindestanteil", en: "minimum share", ru: "минимальная доля", uk: "мінімальна частка" }
    status: reviewed
  - id: general-122
    rationale_de: >-
      Das Grundgesetz sagt in Artikel 38: Die Wahlen sind allgemein, unmittelbar, frei, gleich und geheim. Frei heißt ohne Zwang, gleich heißt: Jede Stimme zählt gleich viel, und geheim heißt: Niemand sieht, wen Sie wählen. „Offen“ ist falsch – eine offene Wahl wäre das Gegenteil von geheim.
    source: GG Art. 38 Abs. 1
    question:
      en: "Which principle are elections in Germany subject to? Elections in Germany are …"
      ru: "Каким принципам подчиняются выборы в Германии? Выборы в Германии …"
      uk: "Якому принципу підлягають вибори в Німеччині? Вибори в Німеччині …"
    options:
      a: { en: "free, equal, secret.", ru: "свободные, равные, тайные.", uk: "вільні, рівні, таємні." }
      b: { en: "open, safe, free.", ru: "открытые, безопасные, свободные.", uk: "відкриті, безпечні, вільні." }
      c: { en: "closed, equal, safe.", ru: "закрытые, равные, безопасные.", uk: "закриті, рівні, безпечні." }
      d: { en: "safe, open, voluntary.", ru: "безопасные, открытые, добровольные.", uk: "безпечні, відкриті, добровільні." }
    terms:
      - { de: "der Grundsatz", en: "principle", ru: "принцип", uk: "принцип" }
      - { de: "unterliegen", en: "to be subject to", ru: "подчиняться", uk: "підлягати" }
    status: reviewed
  - id: general-123
    rationale_de: >-
      Die Fünf-Prozent-Hürde ist eine Regel für die Wahl, nicht für die Arbeit im Parlament. Eine Partei braucht mindestens 5 % der Zweitstimmen, sonst bekommt sie normalerweise keine Sitze im Bundestag. Mit Abstimmungen im Bundestag oder im Bundesrat hat die Hürde nichts zu tun.
    source: BWahlG
    question:
      en: "What is the “5% hurdle” in Germany?"
      ru: "Что такое «5-процентный барьер» в Германии?"
      uk: "Що таке в Німеччині «5-відсотковий бар’єр»?"
    options:
      a: { en: "a voting rule in the Bundestag for small parties", ru: "правило голосования в бундестаге для малых партий", uk: "правило голосування в Бундестазі для малих партій" }
      b: { en: "an attendance check in the Bundestag for votes", ru: "проверка присутствия в бундестаге при голосованиях", uk: "перевірка присутності в Бундестазі під час голосувань" }
      c: { en: "a minimum share of the votes needed to get into parliament", ru: "минимальная доля голосов избирателей, чтобы попасть в парламент", uk: "мінімальна частка голосів виборців, щоб потрапити до парламенту" }
      d: { en: "an attendance check in the Bundesrat for votes", ru: "проверка присутствия в бундесрате при голосованиях", uk: "перевірка присутності в Бундесраті під час голосувань" }
    terms:
      - { de: "die Abstimmung", en: "vote (in parliament)", ru: "голосование", uk: "голосування" }
      - { de: "die Anwesenheit", en: "attendance", ru: "присутствие", uk: "присутність" }
    status: reviewed
  - id: general-124
    rationale_de: >-
      Bei der Bundestagswahl wählt das Volk das Parlament für ganz Deutschland, den Bundestag. Den Kanzler oder die Kanzlerin wählt danach der Bundestag (Grundgesetz, Artikel 63), das Staatsoberhaupt die Bundesversammlung (Artikel 54). Die Parlamente der Länder werden bei den Landtagswahlen gewählt.
    source: GG Art. 38, Art. 54, Art. 63
    question:
      en: "The Bundestag election in Germany is the election …"
      ru: "Выборы в бундестаг в Германии — это выборы …"
      uk: "Вибори до Бундестагу в Німеччині — це вибори …"
    options:
      a: { en: "of the Federal Chancellor.", ru: "федерального канцлера.", uk: "федерального канцлера." }
      b: { en: "of the parliaments of the federal states.", ru: "парламентов федеральных земель.", uk: "парламентів федеральних земель." }
      c: { en: "of the parliament for Germany.", ru: "парламента Германии.", uk: "парламенту Німеччини." }
      d: { en: "of the Federal President.", ru: "федерального президента.", uk: "федерального президента." }
    terms:
      - { de: "die Bundestagswahl", en: "federal election", ru: "выборы в бундестаг", uk: "вибори до Бундестагу" }
      - { de: "die Bundesversammlung", en: "Federal Convention", ru: "Федеральное собрание (выборы президента)", uk: "Федеральні збори (вибори президента)" }
    status: reviewed
  - id: general-125
    rationale_de: >-
      In einer Demokratie bekommt eine Regierung ihre Macht nur auf Zeit. Bei der nächsten Wahl entscheiden die Wählerinnen und Wähler neu: Wenn die Mehrheit es will, kommt eine andere Regierung – friedlich und ohne Gewalt. Gesetze bleiben dabei nicht automatisch gleich; ein neues Parlament kann sie ändern.
    source: GG Art. 20 Abs. 2, Art. 39
    question:
      en: "In a democracy, one function of regular elections is …"
      ru: "В демократии одна из функций регулярных выборов — …"
      uk: "У демократії одна з функцій регулярних виборів — …"
    options:
      a: { en: "to force citizens to cast their vote.", ru: "заставлять граждан голосовать.", uk: "змушувати громадян голосувати." }
      b: { en: "to make a change of government possible in line with the will of the majority of voters.", ru: "давать возможность сменить правительство по воле большинства избирателей.", uk: "давати змогу змінити уряд за волею більшості виборців." }
      c: { en: "to keep the laws that already exist in the country.", ru: "сохранять действующие в стране законы.", uk: "зберігати чинні в країні закони." }
      d: { en: "to give the poor more power.", ru: "давать бедным больше власти.", uk: "давати бідним більше влади." }
    terms:
      - { de: "der Wechsel", en: "change", ru: "смена", uk: "зміна" }
      - { de: "die Wählermehrheit", en: "majority of voters", ru: "большинство избирателей", uk: "більшість виборців" }
    status: reviewed
  - id: general-126
    rationale_de: >-
      Ein paar Wochen vor der Wahl schickt die Gemeinde allen Wahlberechtigten eine Wahlbenachrichtigung. Darauf steht, wann und in welchem Wahllokal Sie wählen können. Mit dieser Benachrichtigung können Sie auch die Briefwahl beantragen.
    source: BWO § 19
    question:
      en: "What do citizens entitled to vote in Germany receive before an election?"
      ru: "Что получают граждане Германии, имеющие право голоса, перед выборами?"
      uk: "Що отримують перед виборами громадяни Німеччини, які мають право голосу?"
    options:
      a: { en: "an election notification from the municipality", ru: "уведомление о выборах от общины", uk: "повідомлення про вибори від громади" }
      b: { en: "a permit to vote from the Federal President", ru: "разрешение на голосование от федерального президента", uk: "дозвіл голосувати від федерального президента" }
      c: { en: "a notification from the Federal Convention", ru: "уведомление от Федерального собрания", uk: "повідомлення від Федеральних зборів" }
      d: { en: "a notification from the parish office", ru: "уведомление от приходской канцелярии", uk: "повідомлення від парафіяльної канцелярії" }
    terms:
      - { de: "die Wahlbenachrichtigung", en: "election notification", ru: "уведомление о выборах", uk: "повідомлення про вибори" }
      - { de: "die Gemeinde", en: "municipality", ru: "община", uk: "громада" }
      - { de: "das Pfarramt", en: "parish office", ru: "приходская канцелярия", uk: "парафіяльна канцелярія" }
    status: reviewed
  - id: general-127
    rationale_de: >-
      Wenn sehr viele kleine Parteien im Parlament sind, ist es schwer, eine stabile Mehrheit für eine Regierung zu finden. Das hat Deutschland in der Weimarer Republik erlebt: Dort gab es keine solche Hürde, und viele Regierungen hielten nur kurze Zeit. Darum gibt es heute die Fünf-Prozent-Hürde.
    question:
      en: "Why is there a 5% hurdle in the electoral law of the Federal Republic of Germany? It exists because …"
      ru: "Почему в законе о выборах Федеративной Республики Германия есть 5-процентный барьер? Он существует, потому что …"
      uk: "Чому в законі про вибори Федеративної Республіки Німеччина є 5-відсотковий бар’єр? Він існує, бо …"
    options:
      a: { en: "the programmes of many small parties have a lot in common.", ru: "программы многих малых партий во многом похожи.", uk: "програми багатьох малих партій мають багато спільного." }
      b: { en: "citizens can lose their bearings when there are many small parties.", ru: "при множестве малых партий граждане могут потерять ориентацию.", uk: "громадяни можуть заплутатися серед багатьох малих партій." }
      c: { en: "many small parties make it harder to form a government.", ru: "множество малых партий затрудняет формирование правительства.", uk: "багато малих партій ускладнюють формування уряду." }
      d: { en: "small parties do not have enough money to pay politicians.", ru: "у малых партий не хватает денег, чтобы платить политикам.", uk: "малі партії не мають достатньо грошей, щоб платити політикам." }
    terms:
      - { de: "die Regierungsbildung", en: "forming a government", ru: "формирование правительства", uk: "формування уряду" }
      - { de: "erschweren", en: "to make harder", ru: "затруднять", uk: "ускладнювати" }
    status: reviewed
  - id: general-128
    rationale_de: >-
      Die Mitglieder des Parlaments heißen Abgeordnete. Sie werden vom Volk gewählt und entscheiden frei nach ihrem Gewissen (Grundgesetz, Artikel 38). Botschafterinnen und Botschafter vertreten Deutschland im Ausland, und Kanzler oder Ministerpräsidenten wählt das Parlament, nicht direkt das Volk.
    source: GG Art. 38 Abs. 1
    question:
      en: "Members of parliament who are elected by the citizens are called …"
      ru: "Членов парламента, которых избирают граждане, называют …"
      uk: "Членів парламенту, яких обирають громадяни, називають …"
    options:
      a: { en: "deputies.", ru: "депутатами.", uk: "депутатами." }
      b: { en: "chancellors.", ru: "канцлерами.", uk: "канцлерами." }
      c: { en: "ambassadors.", ru: "послами.", uk: "послами." }
      d: { en: "minister-presidents.", ru: "министрами-президентами.", uk: "міністрами-президентами земель." }
    terms:
      - { de: "der/die Abgeordnete", en: "member of parliament", ru: "депутат", uk: "депутат, депутатка" }
      - { de: "die Botschafterin / der Botschafter", en: "ambassador", ru: "посол", uk: "посол" }
    status: reviewed
  - id: general-129
    rationale_de: >-
      Das Volk wählt in Deutschland direkt den Bundestag. Die Bundeskanzlerin oder den Bundeskanzler wählt dann der Bundestag, das Staatsoberhaupt die Bundesversammlung. Auch die Ministerpräsidentin oder den Ministerpräsidenten eines Landes wählt das Landesparlament – in Bayern der Landtag.
    source: GG Art. 38, Art. 54, Art. 63; Bayerische Verfassung Art. 44
    question:
      en: "In Germany, the people elect …"
      ru: "В Германии народ избирает …"
      uk: "У Німеччині народ обирає …"
    options:
      a: { en: "the Federal Chancellor.", ru: "федерального канцлера.", uk: "федерального канцлера." }
      b: { en: "the minister-president of a federal state.", ru: "министра-президента федеральной земли.", uk: "міністра-президента федеральної землі." }
      c: { en: "the Bundestag.", ru: "бундестаг.", uk: "Бундестаг." }
      d: { en: "the Federal President.", ru: "федерального президента.", uk: "федерального президента." }
    terms:
      - { de: "das Volk", en: "the people", ru: "народ", uk: "народ" }
    status: reviewed
  - id: general-130
    rationale_de: >-
      Auf Stimmzettel 1 gibt es genau ein Kreuz bei der Erststimme (links) und genau ein Kreuz bei der Zweitstimme (rechts). Das ist gültig – auch wenn die beiden Kreuze für verschiedene Parteien sind. Auf den Stimmzetteln 2, 3 und 4 stehen zwei oder drei Kreuze in derselben Spalte; dann ist diese Stimme ungültig.
    source: BWahlG § 39; BWO Anlage 26
    question:
      en: "Which ballot paper would be valid in a Bundestag election? Based on the Federal Electoral Regulations (BWO), Annex 26"
      ru: "Какой избирательный бюллетень был бы действительным на выборах в бундестаг? По образцу Федерального положения о выборах (BWO), приложение 26"
      uk: "Який виборчий бюлетень був би дійсним на виборах до Бундестагу? За зразком Федерального виборчого регламенту (BWO), додаток 26"
    options:
      a: { en: "1", ru: "1", uk: "1" }
      b: { en: "2", ru: "2", uk: "2" }
      c: { en: "3", ru: "3", uk: "3" }
      d: { en: "4", ru: "4", uk: "4" }
    terms:
      - { de: "der Stimmzettel", en: "ballot paper", ru: "избирательный бюллетень", uk: "виборчий бюлетень" }
      - { de: "gültig", en: "valid", ru: "действительный", uk: "дійсний" }
    status: reviewed
  - id: general-132
    rationale_de: >-
      Ehrenamtlich heißt: Man arbeitet freiwillig und bekommt keinen Lohn dafür. Viele Menschen machen das in Vereinen und Verbänden, zum Beispiel als Trainerin im Sportverein oder bei der Freiwilligen Feuerwehr. Wer im Krankenhaus arbeitet und dafür Geld verdient, arbeitet dagegen nicht ehrenamtlich.
    question:
      en: "Many people in Germany work “ehrenamtlich” in their free time. What does that mean?"
      ru: "Многие люди в Германии в свободное время работают «ehrenamtlich». Что это значит?"
      uk: "Багато людей у Німеччині у вільний час працюють «ehrenamtlich». Що це означає?"
    options:
      a: { en: "They work as soldiers.", ru: "Они служат солдатами.", uk: "Вони працюють солдатами." }
      b: { en: "They work voluntarily and without pay in clubs and associations.", ru: "Они работают добровольно и бесплатно в клубах и объединениях.", uk: "Вони працюють добровільно й безоплатно в об’єднаннях і спілках." }
      c: { en: "They work in the federal government.", ru: "Они работают в федеральном правительстве.", uk: "Вони працюють у федеральному уряді." }
      d: { en: "They work in a hospital and earn money doing so.", ru: "Они работают в больнице и получают за это деньги.", uk: "Вони працюють у лікарні й отримують за це гроші." }
    terms:
      - { de: "ehrenamtlich", en: "voluntary, unpaid", ru: "на общественных началах", uk: "на громадських засадах" }
      - { de: "der Verein", en: "club", ru: "клуб", uk: "об’єднання, клуб" }
      - { de: "der Verband", en: "association", ru: "объединение", uk: "спілка" }
    status: reviewed
  - id: general-133
    rationale_de: >-
      Bei der Briefwahl wählt man per Post: Man beantragt die Unterlagen bei der Gemeinde, kreuzt zu Hause an und schickt den Stimmzettel rechtzeitig zurück. Jede Person wählt selbst und geheim – niemand darf für eine andere Person wählen, auch nicht der Ehemann. Am Telefon kann man nicht wählen.
    source: BWahlG § 36
    question:
      en: "What is permitted in Bundestag and Landtag elections in Germany?"
      ru: "Что разрешено на выборах в бундестаг и в ландтаг в Германии?"
      uk: "Що дозволено на виборах до Бундестагу й ландтагів у Німеччині?"
    options:
      a: { en: "A husband votes on behalf of his wife as well.", ru: "Муж голосует и за свою жену.", uk: "Чоловік голосує також за свою дружину." }
      b: { en: "You can cast your vote by postal vote.", ru: "Можно отдать свой голос, проголосовав по почте.", uk: "Можна віддати свій голос поштою." }
      c: { en: "You can cast your vote by telephone on election day.", ru: "В день выборов можно отдать свой голос по телефону.", uk: "У день виборів можна віддати свій голос телефоном." }
      d: { en: "Children aged 14 and over may vote.", ru: "Дети с 14 лет могут голосовать.", uk: "Діти з 14 років мають право голосувати." }
    terms:
      - { de: "die Briefwahl", en: "postal vote", ru: "голосование по почте", uk: "голосування поштою" }
      - { de: "die Stimme abgeben", en: "to cast a vote", ru: "отдать голос", uk: "віддати голос" }
    status: reviewed
  - id: general-134
    rationale_de: >-
      In einer Bürgerinitiative tun sich Menschen zusammen, die ein gemeinsames Ziel haben – hier: Die Buslinie soll bleiben. Sie sammeln zum Beispiel Unterschriften und sprechen mit der Gemeinde oder dem Verkehrsbetrieb. Das Finanzamt ist nur für Steuern zuständig, und ein Recht auf eine bestimmte Buslinie gibt es nicht.
    question:
      en: "There are plans to scrap the bus route you always take to work. What can you do to keep the bus route?"
      ru: "Автобусный маршрут, по которому вы всегда ездите на работу, хотят отменить. Что вы можете сделать, чтобы его сохранить?"
      uk: "Автобусний маршрут, яким ви завжди їздите на роботу, хочуть скасувати. Що ви можете зробити, щоб зберегти цей маршрут?"
    options:
      a: { en: "I take part in a citizens' initiative to keep the bus route, or I start an initiative myself.", ru: "Я участвую в гражданской инициативе за сохранение маршрута или сам создаю инициативу.", uk: "Я долучаюся до громадянської ініціативи за збереження маршруту або сам засновую ініціативу." }
      b: { en: "I join a sports club and train cycling.", ru: "Я вступаю в спортивный клуб и тренируюсь ездить на велосипеде.", uk: "Я вступаю до спортивного клубу й тренуюся їздити на велосипеді." }
      c: { en: "I contact the tax office, because as a taxpayer I have a right to the bus route.", ru: "Я обращаюсь в налоговую инспекцию, потому что как налогоплательщик имею право на этот маршрут.", uk: "Я звертаюся до податкової служби, бо як платник податків маю право на цей маршрут." }
      d: { en: "I write a letter to the municipality's forestry office.", ru: "Я пишу письмо в лесное управление общины.", uk: "Я пишу лист до лісництва громади." }
    terms:
      - { de: "die Bürgerinitiative", en: "citizens' initiative", ru: "гражданская инициатива", uk: "громадянська ініціатива" }
      - { de: "abschaffen", en: "to scrap", ru: "отменять", uk: "скасовувати" }
    status: reviewed
  - id: general-282
    rationale_de: >-
      Wer bei der Bundestagswahl wählen darf, muss auch Wahlhelferin oder Wahlhelfer werden, wenn er dazu aufgefordert wird (Bundeswahlgesetz, § 11). Ablehnen kann man nur aus einem wichtigen Grund, zum Beispiel bei Krankheit. Trainerin im Verein oder Aufsicht in der Bibliothek sind dagegen freiwillige Ehrenämter.
    source: BWahlG § 11
    question:
      en: "Which honorary office must German citizens take on if they are asked to?"
      ru: "Какую общественную должность обязаны взять на себя граждане Германии, если их к этому призовут?"
      uk: "Яку громадську посаду зобов’язані обійняти громадянки й громадяни Німеччини, якщо їх до цього закличуть?"
    options:
      a: { en: "club coach", ru: "тренер в клубе", uk: "тренер у клубі" }
      b: { en: "election worker", ru: "помощник на выборах", uk: "помічник на виборах" }
      c: { en: "library supervisor", ru: "дежурный в библиотеке", uk: "черговий у бібліотеці" }
      d: { en: "teacher", ru: "учитель", uk: "учитель" }
    terms:
      - { de: "das Ehrenamt", en: "honorary office", ru: "общественная должность", uk: "громадська посада" }
      - { de: "auffordern", en: "to call upon", ru: "призывать", uk: "закликати" }
    status: reviewed
