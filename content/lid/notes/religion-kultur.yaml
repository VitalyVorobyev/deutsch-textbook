notes:
  - id: general-264
    rationale_de: >-
      Am Rosenmontag ziehen große Umzüge mit bunten Kostümen und Masken durch die Straßen, besonders am Rhein, zum Beispiel in Köln, Düsseldorf und Mainz. Er gehört zum Karneval, den man in Bayern Fasching nennt, und ist immer der Montag vor dem Aschermittwoch. Auf dem Oktoberfest tragen viele Menschen dagegen Tracht, also Dirndl und Lederhose, aber keine Masken.
    question:
      en: "For which festival do people in Germany wear colourful costumes and masks?"
      ru: "На какой праздник люди в Германии надевают яркие костюмы и маски?"
      uk: "На яке свято люди в Німеччині вдягають барвисті костюми й маски?"
    options:
      a: { en: "on Rose Monday", ru: "в Розовый понедельник", uk: "у Розенмонтаг" }
      b: { en: "on May Day", ru: "на Первомай", uk: "на Першотравень" }
      c: { en: "at the Oktoberfest", ru: "на Октоберфест", uk: "на Октоберфест" }
      d: { en: "at Pentecost", ru: "на Троицу", uk: "на П’ятдесятницю" }
    terms:
      - { de: "der Rosenmontag", en: "Rose Monday", ru: "Розовый понедельник", uk: "Розенмонтаг (карнавальний понеділок)" }
      - { de: "der Karneval", en: "carnival", ru: "карнавал", uk: "карнавал" }
      - { de: "der Fasching", en: "carnival (in Bavaria)", ru: "карнавал (в Баварии)", uk: "карнавал (у Баварії)" }
    status: reviewed
  - id: general-271
    rationale_de: >-
      Zu Weihnachten stellen viele Familien einen Tannenbaum in die Wohnung und schmücken ihn mit Kugeln, Sternen und Lichtern. Man nennt ihn auch Weihnachtsbaum oder Christbaum. Bunte Eier versteckt man dagegen zu Ostern, Kostüme trägt man im Karneval, und Kürbisse gehören zu Halloween.
    question:
      en: "What is a Christmas custom in Germany?"
      ru: "Какой обычай есть в Германии на Рождество?"
      uk: "Що в Німеччині є різдвяним звичаєм?"
    options:
      a: { en: "hiding colourful eggs", ru: "прятать разноцветные яйца", uk: "ховати кольорові яйця" }
      b: { en: "decorating a fir tree", ru: "украшать ёлку", uk: "прикрашати ялинку" }
      c: { en: "dressing up in masks and costumes", ru: "наряжаться в маски и костюмы", uk: "перевдягатися в маски й костюми" }
      d: { en: "putting pumpkins outside the door", ru: "ставить тыквы у двери", uk: "ставити гарбузи перед дверима" }
    terms:
      - { de: "der Brauch", en: "custom", ru: "обычай", uk: "звичай" }
      - { de: "schmücken", en: "to decorate", ru: "украшать", uk: "прикрашати" }
      - { de: "der Tannenbaum", en: "fir tree", ru: "ёлка", uk: "ялинка" }
    status: reviewed
  - id: general-291
    rationale_de: >-
      In Deutschland gibt es eine Kirchensteuer. Mitglieder zum Beispiel der katholischen oder der evangelischen Kirche zahlen sie zusätzlich zur Lohn- oder Einkommensteuer – in Bayern acht Prozent davon, in den meisten anderen Ländern neun Prozent. Das Finanzamt zieht sie ein und gibt sie an die Kirchen weiter; darum muss es wissen, wer Mitglied ist. Wer zu keiner Kirche gehört, zahlt sie nicht – und deshalb auch nicht mehr Steuern.
    source: GG Art. 140, WRV Art. 137 Abs. 6
    question:
      en: "Why do you have to state on your tax return in Germany whether or not you belong to a church? Because …"
      ru: "Почему в Германии в налоговой декларации нужно указывать, принадлежишь ли ты к церкви? Потому что …"
      uk: "Чому в Німеччині в податковій декларації треба зазначати, належиш ти до церкви чи ні? Тому що …"
    options:
      a: { en: "there is a church tax that is linked to income tax and wage tax.", ru: "существует церковный налог, который привязан к подоходному налогу и налогу на заработную плату.", uk: "існує церковний податок, прив’язаний до прибуткового податку та податку із заробітної плати." }
      b: { en: "this is important for statistics in Germany.", ru: "это важно для статистики в Германии.", uk: "це важливо для статистики в Німеччині." }
      c: { en: "you have to pay more taxes if you do not belong to a church.", ru: "тот, кто не принадлежит к церкви, должен платить больше налогов.", uk: "треба платити більше податків, якщо не належиш до церкви." }
      d: { en: "the church is responsible for the tax return.", ru: "церковь отвечает за налоговую декларацию.", uk: "церква відповідає за податкову декларацію." }
    terms:
      - { de: "die Kirchensteuer", en: "church tax", ru: "церковный налог", uk: "церковний податок" }
      - { de: "die Steuererklärung", en: "tax return", ru: "налоговая декларация", uk: "податкова декларація" }
      - { de: "die Lohnsteuer", en: "wage tax", ru: "налог на зарплату", uk: "податок із заробітної плати" }
    status: reviewed
  - id: general-292
    rationale_de: >-
      Religiöse Toleranz heißt: Jeder darf glauben, was er möchte – oder an gar nichts glauben –, und die anderen respektieren das. Das Grundgesetz schützt diese Freiheit in Artikel 4. Der Staat schreibt niemandem einen Glauben vor, und auch Moscheen, Synagogen oder Tempel dürfen gebaut werden.
    source: GG Art. 4
    question:
      en: "People in Germany live by the principle of religious tolerance. What does this mean?"
      ru: "Люди в Германии живут по принципу религиозной терпимости. Что это означает?"
      uk: "Люди в Німеччині живуть за принципом релігійної толерантності. Що це означає?"
    options:
      a: { en: "No mosques may be built.", ru: "Нельзя строить мечети.", uk: "Будувати мечеті заборонено." }
      b: { en: "All people believe in God.", ru: "Все люди верят в Бога.", uk: "Усі люди вірять у Бога." }
      c: { en: "Everyone can believe what they want.", ru: "Каждый может верить во что хочет.", uk: "Кожен може вірити в те, у що хоче." }
      d: { en: "The state decides which god people believe in.", ru: "Государство решает, в какого бога верят люди.", uk: "Держава вирішує, в якого бога вірять люди." }
    terms:
      - { de: "die Toleranz", en: "tolerance", ru: "терпимость", uk: "толерантність" }
      - { de: "der Grundsatz", en: "principle", ru: "принцип", uk: "принцип" }
      - { de: "der Glaube", en: "faith", ru: "вера", uk: "віра" }
    status: reviewed
  - id: general-293
    rationale_de: >-
      Zu Ostern bemalen viele Menschen in Deutschland Eier und verstecken sie für die Kinder – nach der Tradition bringt sie der Osterhase. Ostern ist das wichtigste Fest der Christen: Sie feiern, dass Jesus von den Toten auferstanden ist. Einen Tannenbaum schmückt man dagegen zu Weihnachten, und Raketen schießt man an Silvester in die Luft.
    question:
      en: "What is an Easter custom in Germany?"
      ru: "Какой обычай есть в Германии на Пасху?"
      uk: "Що в Німеччині є великодним звичаєм?"
    options:
      a: { en: "putting pumpkins outside the door", ru: "ставить тыквы у двери", uk: "ставити гарбузи перед дверима" }
      b: { en: "decorating a fir tree", ru: "украшать ёлку", uk: "прикрашати ялинку" }
      c: { en: "painting eggs", ru: "расписывать яйца", uk: "розписувати яйця" }
      d: { en: "shooting rockets into the air", ru: "запускать в небо ракеты", uk: "запускати ракети в повітря" }
    terms:
      - { de: "bemalen", en: "to paint", ru: "расписывать", uk: "розписувати" }
      - { de: "der Osterhase", en: "Easter bunny", ru: "пасхальный заяц", uk: "великодній заєць" }
    status: reviewed
  - id: general-294
    rationale_de: >-
      Pfingsten ist ein christlicher Feiertag, sieben Wochen nach Ostern. Christen feiern an Pfingsten, dass der Heilige Geist zu den Jüngern von Jesus kam. Der Pfingstmontag ist in ganz Deutschland ein gesetzlicher Feiertag – Pfingsten ist also kein bayerischer Brauch und auch kein Gedenktag.
    question:
      en: "Pentecost is a …"
      ru: "Троица (Пятидесятница) — это …"
      uk: "Pfingsten — це …"
    options:
      a: { en: "Christian holiday.", ru: "христианский праздник.", uk: "християнське свято." }
      b: { en: "German day of remembrance.", ru: "немецкий день памяти.", uk: "німецький день пам’яті." }
      c: { en: "international day of mourning.", ru: "международный день траура.", uk: "міжнародний день жалоби." }
      d: { en: "Bavarian custom.", ru: "баварский обычай.", uk: "баварський звичай." }
    terms:
      - { de: "der Feiertag", en: "public holiday", ru: "праздничный день", uk: "святковий день" }
      - { de: "der Gedenktag", en: "day of remembrance", ru: "день памяти", uk: "день пам’яті" }
      - { de: "christlich", en: "Christian", ru: "христианский", uk: "християнський" }
    status: reviewed
  - id: general-295
    rationale_de: >-
      Das Christentum hat die Kultur in Europa und in Deutschland über viele Jahrhunderte geprägt. Man sieht das an den Kirchen in fast jedem Ort, an Feiertagen wie Weihnachten, Ostern und Pfingsten und an vielen Bräuchen. Heute leben in Deutschland aber auch viele Menschen mit anderen Religionen oder ohne Religion.
    question:
      en: "Which religion has shaped European and German culture?"
      ru: "Какая религия сформировала европейскую и немецкую культуру?"
      uk: "Яка релігія сформувала європейську та німецьку культуру?"
    options:
      a: { en: "Hinduism", ru: "индуизм", uk: "індуїзм" }
      b: { en: "Christianity", ru: "христианство", uk: "християнство" }
      c: { en: "Buddhism", ru: "буддизм", uk: "буддизм" }
      d: { en: "Islam", ru: "ислам", uk: "іслам" }
    terms:
      - { de: "prägen", en: "to shape", ru: "формировать", uk: "формувати" }
      - { de: "das Christentum", en: "Christianity", ru: "христианство", uk: "християнство" }
    status: reviewed
  - id: general-296
    rationale_de: >-
      Die letzten vier Wochen vor Weihnachten heißen Adventszeit. An jedem der vier Adventssonntage zündet man eine weitere Kerze am Adventskranz an, und viele Kinder öffnen jeden Tag ein Türchen am Adventskalender. Allerheiligen ist dagegen am 1. November, das Erntedankfest feiert man im Herbst, und der Buß- und Bettag ist ein evangelischer Feiertag im November.
    question:
      en: "In Germany, the last four weeks before Christmas are called …"
      ru: "В Германии последние четыре недели перед Рождеством называют …"
      uk: "У Німеччині останні чотири тижні перед Різдвом називають …"
    options:
      a: { en: "the Day of Repentance and Prayer.", ru: "Днём покаяния и молитвы.", uk: "Днем покаяння і молитви." }
      b: { en: "the harvest festival.", ru: "праздником урожая.", uk: "святом подяки за врожай." }
      c: { en: "Advent.", ru: "Адвентом.", uk: "Адвентом." }
      d: { en: "All Saints' Day.", ru: "Днём всех святых.", uk: "Днем усіх святих." }
    terms:
      - { de: "der Advent", en: "Advent", ru: "Адвент", uk: "Адвент" }
      - { de: "der Adventskranz", en: "Advent wreath", ru: "адвентский венок", uk: "адвентовий вінок" }
    status: reviewed
