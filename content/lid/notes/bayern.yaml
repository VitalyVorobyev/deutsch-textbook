notes:
  - id: BY-01
    rationale_de: >-
      Bild 2 zeigt das Wappen des Freistaates Bayern: einen Schild mit weißen und blauen Rauten, darüber eine goldene Krone. Die weiß-blauen Rauten sind das bekannteste Zeichen Bayerns – man sieht sie auch auf der bayerischen Rautenflagge. Bild 1 mit den drei schwarzen Löwen ist das Wappen von Baden-Württemberg, Bild 3 gehört zu Sachsen-Anhalt und Bild 4 zu Mecklenburg-Vorpommern.
    source: Gesetz über das Wappen des Freistaates Bayern (1950)
    question:
      en: "Which coat of arms belongs to the Free State of Bavaria?"
      ru: "Какой герб принадлежит Свободному государству Бавария?"
      uk: "Який герб належить Вільній державі Баварія?"
    options:
      a: { en: "Picture 1", ru: "Изображение 1", uk: "Зображення 1" }
      b: { en: "Picture 2", ru: "Изображение 2", uk: "Зображення 2" }
      c: { en: "Picture 3", ru: "Изображение 3", uk: "Зображення 3" }
      d: { en: "Picture 4", ru: "Изображение 4", uk: "Зображення 4" }
    terms:
      - { de: "das Wappen", en: "coat of arms", ru: "герб", uk: "герб" }
      - { de: "die Raute", en: "lozenge", ru: "ромб", uk: "ромб" }
      - { de: "der Freistaat", en: "free state", ru: "свободное государство", uk: "вільна держава" }
    status: reviewed
  - id: BY-02
    rationale_de: >-
      Altötting ist ein Landkreis in Oberbayern, im Südosten von Bayern; die Stadt Altötting ist ein bekannter Wallfahrtsort. Die anderen Landkreise liegen in anderen Bundesländern: Prignitz in Brandenburg, der Rhein-Sieg-Kreis in Nordrhein-Westfalen und Nordfriesland in Schleswig-Holstein. Insgesamt hat Bayern 71 Landkreise.
    question:
      en: "Which of these is a district (Landkreis) in Bavaria?"
      ru: "Какой из этих районов (ландкрайсов) находится в Баварии?"
      uk: "Який із цих районів (Landkreis) розташований у Баварії?"
    options:
      a: { en: "Prignitz", ru: "Пригниц", uk: "Пригніц" }
      b: { en: "Rhein-Sieg-Kreis", ru: "Рейн-Зиг-Крайс", uk: "Рейн-Зіг-Крайс" }
      c: { en: "Nordfriesland (North Frisia)", ru: "Нордфрисланд (Северная Фрисландия)", uk: "Нордфрисланд (Північна Фрисландія)" }
      d: { en: "Altötting", ru: "Альтёттинг", uk: "Альтеттінг" }
    terms:
      - { de: "der Landkreis", en: "rural district", ru: "район", uk: "район" }
    status: reviewed
  - id: BY-03
    rationale_de: >-
      Der Bayerische Landtag wird für fünf Jahre gewählt – so steht es in der Bayerischen Verfassung, Artikel 16. Die letzte Landtagswahl war im Oktober 2023, die nächste ist also voraussichtlich 2028. Der Bundestag wird dagegen nur für vier Jahre gewählt.
    source: Bayerische Verfassung Art. 16
    question:
      en: "For how many years is the Landtag (state parliament) in Bavaria elected?"
      ru: "На сколько лет избирается ландтаг (парламент земли) в Баварии?"
      uk: "На скільки років обирають ландтаг (парламент землі) у Баварії?"
    options:
      a: { en: "3", ru: "3", uk: "3" }
      b: { en: "4", ru: "4", uk: "4" }
      c: { en: "5", ru: "5", uk: "5" }
      d: { en: "6", ru: "6", uk: "6" }
    terms:
      - { de: "der Landtag", en: "state parliament", ru: "ландтаг", uk: "ландтаг" }
      - { de: "die Landtagswahl", en: "state election", ru: "выборы в ландтаг", uk: "вибори до ландтагу" }
    status: reviewed
  - id: BY-04
    rationale_de: >-
      Bei Kommunalwahlen in Bayern – also bei der Wahl des Gemeinderats, des Bürgermeisters oder des Landrats – darf man ab 18 Jahren wählen. Manche andere Bundesländer erlauben das schon ab 16, Bayern aber nicht. Wählen dürfen dabei auch Bürgerinnen und Bürger aus anderen EU-Staaten, wenn sie in der Gemeinde wohnen.
    source: GLKrWG Art. 1
    question:
      en: "From what age can you vote in local elections in Bavaria?"
      ru: "С какого возраста в Баварии можно голосовать на муниципальных выборах?"
      uk: "З якого віку в Баварії можна голосувати на місцевих виборах?"
    options:
      a: { en: "14", ru: "14", uk: "14" }
      b: { en: "16", ru: "16", uk: "16" }
      c: { en: "18", ru: "18", uk: "18" }
      d: { en: "20", ru: "20", uk: "20" }
    terms:
      - { de: "die Kommunalwahl", en: "local election", ru: "муниципальные выборы", uk: "місцеві вибори" }
      - { de: "der Gemeinderat", en: "municipal council", ru: "совет общины", uk: "рада громади" }
    status: reviewed
  - id: BY-05
    rationale_de: >-
      Die Landesfarben von Bayern sind Weiß und Blau – so steht es in der Bayerischen Verfassung, Artikel 1. Die Landesflagge gibt es in zwei Formen: mit zwei Streifen, oben Weiß und unten Blau, oder mit weißen und blauen Rauten. Beide Formen sind offiziell.
    source: Bayerische Verfassung Art. 1 Abs. 2
    question:
      en: "What colours does the state flag of Bavaria have?"
      ru: "Какие цвета у флага земли Бавария?"
      uk: "Які кольори має прапор землі Баварія?"
    options:
      a: { en: "blue-white-red", ru: "сине-бело-красный", uk: "синьо-біло-червоний" }
      b: { en: "white-blue", ru: "бело-синий", uk: "біло-синій" }
      c: { en: "green-white-red", ru: "зелёно-бело-красный", uk: "зелено-біло-червоний" }
      d: { en: "black-yellow", ru: "чёрно-жёлтый", uk: "чорно-жовтий" }
    terms:
      - { de: "die Landesflagge", en: "state flag", ru: "флаг земли", uk: "прапор землі" }
      - { de: "die Raute", en: "lozenge", ru: "ромб", uk: "ромб" }
    status: reviewed
  - id: BY-06
    rationale_de: >-
      In Bayern informiert die Bayerische Landeszentrale für politische Bildungsarbeit über Politik, Geschichte und Demokratie. Sie gibt Bücher und Broschüren heraus, viele davon kostenlos, und organisiert Veranstaltungen. Für ganz Deutschland gibt es die Bundeszentrale für politische Bildung. Die Verbraucherzentrale berät dagegen beim Einkaufen und bei Verträgen.
    source: Bayerische Landeszentrale für politische Bildungsarbeit
    question:
      en: "Where can you find information about political topics in Bavaria?"
      ru: "Где в Баварии можно получить информацию на политические темы?"
      uk: "Де в Баварії ви можете отримати інформацію на політичні теми?"
    options:
      a: { en: "at the municipality's public order office", ru: "в ведомстве по охране общественного порядка общины", uk: "у відомстві громадського порядку громади" }
      b: { en: "at the State Agency for Civic Education", ru: "в земельном центре политического образования", uk: "у земельному центрі політичної освіти" }
      c: { en: "at the consumer advice centre", ru: "в центре защиты прав потребителей", uk: "у центрі захисту прав споживачів" }
      d: { en: "at the churches", ru: "в церквях", uk: "у церквах" }
    terms:
      - { de: "die politische Bildung", en: "civic education", ru: "политическое образование", uk: "політична освіта" }
      - { de: "die Verbraucherzentrale", en: "consumer advice centre", ru: "центр защиты потребителей", uk: "центр захисту споживачів" }
    status: reviewed
  - id: BY-07
    rationale_de: >-
      München ist die Landeshauptstadt von Bayern: Hier sitzen der Bayerische Landtag und die Staatsregierung. München ist die größte Stadt Bayerns und nach Berlin und Hamburg die drittgrößte Stadt Deutschlands. Nürnberg, Regensburg und Ingolstadt sind ebenfalls große bayerische Städte, aber nicht die Hauptstadt.
    question:
      en: "The state capital of Bavaria is called …"
      ru: "Столица земли Бавария называется …"
      uk: "Столиця землі Баварія називається …"
    options:
      a: { en: "Ingolstadt.", ru: "Ингольштадт.", uk: "Інгольштадт." }
      b: { en: "Regensburg.", ru: "Регенсбург.", uk: "Регенсбург." }
      c: { en: "Nuremberg.", ru: "Нюрнберг.", uk: "Нюрнберг." }
      d: { en: "Munich.", ru: "Мюнхен.", uk: "Мюнхен." }
    terms:
      - { de: "die Landeshauptstadt", en: "state capital", ru: "столица земли", uk: "столиця землі" }
    status: reviewed
  - id: BY-08
    rationale_de: >-
      Bayern ist auf der Karte die Nummer 4: das große Bundesland ganz im Südosten. Nach der Fläche ist es das größte Bundesland, und es grenzt an Österreich und an Tschechien. Nummer 1 ist Hessen, Nummer 2 Baden-Württemberg und Nummer 3 Thüringen.
    question:
      en: "Which federal state is Bavaria?"
      ru: "Какая из федеральных земель — Бавария?"
      uk: "Яка з федеральних земель — Баварія?"
    options:
      a: { en: "1", ru: "1", uk: "1" }
      b: { en: "2", ru: "2", uk: "2" }
      c: { en: "3", ru: "3", uk: "3" }
      d: { en: "4", ru: "4", uk: "4" }
    terms:
      - { de: "das Bundesland", en: "federal state", ru: "федеральная земля", uk: "федеральна земля" }
      - { de: "die Fläche", en: "area", ru: "площадь", uk: "площа" }
    status: reviewed
  - id: BY-09
    rationale_de: >-
      In Bayern heißt die Chefin oder der Chef der Staatsregierung Ministerpräsidentin oder Ministerpräsident. Der Landtag wählt sie oder ihn für fünf Jahre; seit 2018 ist Markus Söder von der CSU im Amt. Eine Bürgermeisterin oder ein Bürgermeister leitet dagegen eine Gemeinde oder eine Stadt.
    source: Bayerische Verfassung Art. 44
    question:
      en: "What is the head of government in Bavaria called?"
      ru: "Как называется глава правительства в Баварии?"
      uk: "Як у Баварії називають главу уряду?"
    options:
      a: { en: "First Minister", ru: "первый министр", uk: "перший міністр" }
      b: { en: "Prime Minister", ru: "премьер-министр", uk: "прем’єр-міністр" }
      c: { en: "Mayor", ru: "бургомистр", uk: "бургомістр" }
      d: { en: "Minister-President", ru: "министр-президент", uk: "міністр-президент" }
    terms:
      - { de: "der Regierungschef", en: "head of government", ru: "глава правительства", uk: "глава уряду" }
      - { de: "der Ministerpräsident", en: "Minister-President", ru: "министр-президент", uk: "міністр-президент" }
    status: reviewed
  - id: BY-10
    rationale_de: >-
      Bayern hat keine Außenministerin und keinen Außenminister. Die Beziehungen zu anderen Staaten sind nach dem Grundgesetz Sache des Bundes (Artikel 32 und 73); dafür gibt es in Berlin das Auswärtige Amt. Justiz, Finanzen und Innere Sicherheit sind dagegen auch Aufgaben der Länder – darum hat Bayern dafür eigene Staatsministerien.
    source: GG Art. 32, Art. 73
    question:
      en: "Which minister does Bavaria not have?"
      ru: "Какого министра нет в Баварии?"
      uk: "Якого міністра немає в Баварії?"
    options:
      a: { en: "Minister of Justice", ru: "министр юстиции", uk: "міністр юстиції" }
      b: { en: "Foreign Minister", ru: "министр иностранных дел", uk: "міністр закордонних справ" }
      c: { en: "Minister of Finance", ru: "министр финансов", uk: "міністр фінансів" }
      d: { en: "Minister of the Interior", ru: "министр внутренних дел", uk: "міністр внутрішніх справ" }
    terms:
      - { de: "der Außenminister", en: "foreign minister", ru: "министр иностранных дел", uk: "міністр закордонних справ" }
      - { de: "der Innenminister", en: "interior minister", ru: "министр внутренних дел", uk: "міністр внутрішніх справ" }
    status: reviewed
