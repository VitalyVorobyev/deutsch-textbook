notes:
  - id: general-024
    rationale_de: >-
      Deutschland hat 16 Bundesländer, zum Beispiel Bayern, Berlin und Nordrhein-Westfalen. Seit der Wiedervereinigung 1990 sind es 16 – damals kamen die Länder der früheren DDR dazu. Bayern ist nach der Fläche das größte Bundesland.
    source: GG Präambel
    question:
      en: "How many federal states does the Federal Republic of Germany have?"
      ru: "Сколько федеральных земель в Федеративной Республике Германия?"
      uk: "Скільки федеральних земель має Федеративна Республіка Німеччина?"
    options:
      a: { en: "14", ru: "14", uk: "14" }
      b: { en: "15", ru: "15", uk: "15" }
      c: { en: "16", ru: "16", uk: "16" }
      d: { en: "17", ru: "17", uk: "17" }
    terms:
      - { de: "das Bundesland", en: "federal state", ru: "федеральная земля", uk: "федеральна земля" }
    status: reviewed
  - id: general-025
    rationale_de: >-
      Elsass-Lothringen ist ein Gebiet in Frankreich. Es gehörte von 1871 bis 1918 zum Deutschen Reich, ist aber heute kein Teil von Deutschland. Nordrhein-Westfalen, Mecklenburg-Vorpommern und Sachsen-Anhalt sind dagegen deutsche Bundesländer.
    source: GG Präambel
    question:
      en: "Which of these is not a federal state of the Federal Republic of Germany?"
      ru: "Что из этого не является федеральной землёй Федеративной Республики Германия?"
      uk: "Що з переліченого не є федеральною землею Федеративної Республіки Німеччина?"
    options:
      a: { en: "Alsace-Lorraine", ru: "Эльзас-Лотарингия", uk: "Ельзас-Лотарингія" }
      b: { en: "North Rhine-Westphalia", ru: "Северный Рейн — Вестфалия", uk: "Північний Рейн-Вестфалія" }
      c: { en: "Mecklenburg-Western Pomerania", ru: "Мекленбург — Передняя Померания", uk: "Мекленбург-Передня Померанія" }
      d: { en: "Saxony-Anhalt", ru: "Саксония-Анхальт", uk: "Саксонія-Ангальт" }
    status: reviewed
  - id: general-037
    rationale_de: >-
      In den meisten Bundesländern heißt die Chefin oder der Chef der Landesregierung Ministerpräsidentin oder Ministerpräsident, zum Beispiel in Bayern. In den Stadtstaaten Berlin, Hamburg und Bremen ist das anders: Dort heißt der Regierungschef Bürgermeister, und die Ministerinnen und Minister heißen Senatorinnen und Senatoren.
    question:
      en: "What are the heads of government of most German federal states called?"
      ru: "Как называются главы правительств большинства федеральных земель Германии?"
      uk: "Як у Німеччині називають глав урядів більшості федеральних земель?"
    options:
      a: { en: "First Minister", ru: "первый министр", uk: "перший міністр" }
      b: { en: "Prime Minister", ru: "премьер-министр", uk: "прем’єр-міністр" }
      c: { en: "Senator", ru: "сенатор", uk: "сенатор" }
      d: { en: "Minister-President", ru: "министр-президент", uk: "міністр-президент" }
    terms:
      - { de: "die Regierungschefin / der Regierungschef", en: "head of government", ru: "глава правительства", uk: "глава уряду" }
      - { de: "der Stadtstaat", en: "city-state", ru: "город-земля", uk: "місто-земля" }
    status: reviewed
  - id: general-039
    rationale_de: >-
      Jedes Bundesland hat eine eigene Regierung und ein eigenes Parlament. In Bayern heißt die Regierung Staatsregierung, und an ihrer Spitze steht der Ministerpräsident. Eine eigene Armee oder Währung hat kein Bundesland, und auch die Außenpolitik macht der Bund (Grundgesetz, Artikel 32 und 73).
    source: GG Art. 32, Art. 73
    question:
      en: "What does every German federal state have?"
      ru: "Что есть у каждой федеральной земли Германии?"
      uk: "Що має кожна німецька федеральна земля?"
    options:
      a: { en: "its own foreign minister", ru: "собственный министр иностранных дел", uk: "власного міністра закордонних справ" }
      b: { en: "its own currency", ru: "собственная валюта", uk: "власну валюту" }
      c: { en: "its own army", ru: "собственная армия", uk: "власну армію" }
      d: { en: "its own government", ru: "собственное правительство", uk: "власний уряд" }
    terms:
      - { de: "die Landesregierung", en: "state government", ru: "правительство земли", uk: "уряд землі" }
      - { de: "die Währung", en: "currency", ru: "валюта", uk: "валюта" }
    status: reviewed
  - id: general-049
    rationale_de: >-
      Für die Schulen sind in Deutschland die Bundesländer zuständig. Darum sind die Schulsysteme nicht überall gleich: Ferien, Lehrpläne und Schularten unterscheiden sich von Land zu Land. In Bayern ist das Kultusministerium in München für die Schulen verantwortlich.
    source: GG Art. 30, Art. 70
    question:
      en: "Who determines school policy in Germany?"
      ru: "Кто в Германии определяет школьную политику?"
      uk: "Хто в Німеччині визначає шкільну політику?"
    options:
      a: { en: "the teachers", ru: "учителя", uk: "вчителі та вчительки" }
      b: { en: "the federal states", ru: "федеральные земли", uk: "федеральні землі" }
      c: { en: "the Ministry for Family Affairs", ru: "министерство по делам семьи", uk: "міністерство у справах сім’ї" }
      d: { en: "the universities", ru: "университеты", uk: "університети" }
    terms:
      - { de: "die Schulpolitik", en: "school policy", ru: "школьная политика", uk: "шкільна політика" }
      - { de: "zuständig", en: "responsible", ru: "ответственный", uk: "відповідальний" }
    status: reviewed
  - id: general-056
    rationale_de: >-
      Das Ordnungsamt gehört zur Verwaltung der Stadt oder Gemeinde. Es kümmert sich zum Beispiel um falsch geparkte Autos und um die öffentliche Ordnung. Das Finanzamt ist dagegen eine Behörde des Bundeslandes, das Auswärtige Amt ist ein Bundesministerium, und das Pfarramt gehört zur Kirche.
    question:
      en: "Which office is part of the municipal administration in Germany?"
      ru: "Какое ведомство в Германии относится к администрации общины?"
      uk: "Яке відомство в Німеччині належить до адміністрації громади?"
    options:
      a: { en: "parish office", ru: "приходская канцелярия", uk: "парафіяльна канцелярія" }
      b: { en: "public order office", ru: "ведомство общественного порядка", uk: "відомство громадського порядку" }
      c: { en: "tax office", ru: "налоговая инспекция", uk: "податкова служба" }
      d: { en: "Federal Foreign Office", ru: "Министерство иностранных дел", uk: "Міністерство закордонних справ" }
    terms:
      - { de: "das Ordnungsamt", en: "public order office", ru: "ведомство общественного порядка", uk: "відомство громадського порядку" }
      - { de: "die Gemeindeverwaltung", en: "municipal administration", ru: "администрация общины", uk: "адміністрація громади" }
    status: reviewed
  - id: general-064
    rationale_de: >-
      Deutschland hat drei Ebenen: den Bund, die 16 Länder und die Kommunen, also die Städte, Gemeinden und Landkreise. Jede Ebene hat eigene Aufgaben. Vier Besatzungszonen gab es nach dem Zweiten Weltkrieg bis 1949, zwei deutsche Staaten bis 1990, und Kantone gibt es in der Schweiz.
    source: GG Art. 20 Abs. 1, Art. 28
    question:
      en: "Today the Federal Republic of Germany is divided into …"
      ru: "Сегодня Федеративная Республика Германия делится на …"
      uk: "Сьогодні Федеративна Республіка Німеччина поділяється на …"
    options:
      a: { en: "four occupation zones.", ru: "четыре оккупационные зоны.", uk: "чотири окупаційні зони." }
      b: { en: "an eastern state and a western state.", ru: "восточное и западное государство.", uk: "східну державу та західну державу." }
      c: { en: "16 cantons.", ru: "16 кантонов.", uk: "16 кантонів." }
      d: { en: "the Federation, the federal states and the municipalities.", ru: "федерацию, земли и муниципалитеты.", uk: "федерацію, землі та муніципалітети." }
    terms:
      - { de: "die Kommune", en: "municipality", ru: "муниципалитет", uk: "муніципалітет" }
      - { de: "die Besatzungszone", en: "occupation zone", ru: "оккупационная зона", uk: "окупаційна зона" }
      - { de: "gegliedert sein in", en: "to be divided into", ru: "делиться на", uk: "поділятися на" }
    status: reviewed
  - id: general-067
    rationale_de: >-
      Die Schulpolitik ist vor allem Aufgabe der Bundesländer – man spricht von der Kulturhoheit der Länder. Verteidigung und Außenpolitik macht dagegen der Bund (Grundgesetz, Artikel 73). Auch die Wirtschaftspolitik wird vor allem vom Bund gemacht.
    source: GG Art. 30, Art. 70, Art. 73
    question:
      en: "What is above all a task of the federal states in Germany?"
      ru: "Что в Германии является прежде всего задачей федеральных земель?"
      uk: "Що в Німеччині є передусім завданням федеральних земель?"
    options:
      a: { en: "defence policy", ru: "оборонная политика", uk: "оборонна політика" }
      b: { en: "foreign policy", ru: "внешняя политика", uk: "зовнішня політика" }
      c: { en: "economic policy", ru: "экономическая политика", uk: "економічна політика" }
      d: { en: "school policy", ru: "школьная политика", uk: "шкільна політика" }
    terms:
      - { de: "die Kulturhoheit", en: "authority over education and culture", ru: "культурный суверенитет", uk: "культурний суверенітет" }
      - { de: "die Verteidigung", en: "defence", ru: "оборона", uk: "оборона" }
    status: reviewed
  - id: general-068
    rationale_de: >-
      Im Grundgesetz, Artikel 7, steht: Das gesamte Schulwesen steht unter der Aufsicht des Staates. Diese Aufgabe haben vor allem die Bundesländer. Es gibt aber nicht nur staatliche Schulen – auch Privatschulen sind erlaubt, wenn der Staat sie genehmigt.
    source: GG Art. 7 Abs. 1, Abs. 4
    question:
      en: "Why does the state control the school system in Germany?"
      ru: "Почему в Германии государство контролирует систему школьного образования?"
      uk: "Чому в Німеччині держава контролює систему шкільної освіти?"
    options:
      a: { en: "because there are only state schools in Germany", ru: "потому что в Германии есть только государственные школы", uk: "тому що в Німеччині є лише державні школи" }
      b: { en: "because all pupils must obtain a school-leaving qualification", ru: "потому что все ученики обязаны получить школьный аттестат", uk: "тому що всі учениці та учні мусять мати атестат про закінчення школи" }
      c: { en: "because there are different schools in the federal states", ru: "потому что в федеральных землях разные школы", uk: "тому що у федеральних землях є різні школи" }
      d: { en: "because it is its task under the Basic Law", ru: "потому что по Основному закону это его задача", uk: "тому що за Основним законом це її завдання" }
    terms:
      - { de: "das Schulwesen", en: "school system", ru: "система школьного образования", uk: "система шкільної освіти" }
      - { de: "die Aufsicht", en: "supervision", ru: "надзор", uk: "нагляд" }
    status: reviewed
  - id: general-069
    rationale_de: >-
      Die drei Stufen sind Bund, Länder und Gemeinden. Die Gemeinden sind die unterste Stufe: Sie regeln viele Dinge vor Ort selbst, zum Beispiel Kindergärten, Straßen oder Friedhöfe (Grundgesetz, Artikel 28). Stadträte, Landräte und Bezirksämter gibt es auch, aber sie sind keine eigene Stufe des Staates.
    source: GG Art. 28 Abs. 2
    question:
      en: "The Federal Republic of Germany has a three-tier administrative structure. What is the lowest political tier called?"
      ru: "В Федеративной Республике Германия трёхуровневая система управления. Как называется самый нижний политический уровень?"
      uk: "Федеративна Республіка Німеччина має триступеневу структуру управління. Як називається найнижчий політичний рівень?"
    options:
      a: { en: "town councils", ru: "городские советы", uk: "міські ради" }
      b: { en: "district administrators", ru: "ландраты", uk: "ландрати" }
      c: { en: "municipalities", ru: "общины", uk: "громади" }
      d: { en: "district offices", ru: "районные управы", uk: "районні адміністрації" }
    terms:
      - { de: "die Gemeinde", en: "municipality", ru: "община", uk: "громада" }
      - { de: "die Stufe", en: "tier", ru: "уровень", uk: "рівень, ступінь" }
      - { de: "die Verwaltung", en: "administration", ru: "управление", uk: "управління" }
    status: reviewed
  - id: general-131
    rationale_de: >-
      Die Bürgermeisterin oder der Bürgermeister leitet die Gemeinde oder die Stadt und ihre Verwaltung. In Bayern wählen die Bürgerinnen und Bürger sie oder ihn direkt, für sechs Jahre. In großen Städten heißt das Amt oft Oberbürgermeisterin oder Oberbürgermeister.
    source: Bayerische Gemeindeordnung
    question:
      en: "In Germany, a mayor is …"
      ru: "В Германии бургомистр — это …"
      uk: "У Німеччині бургомістр — це …"
    options:
      a: { en: "the head of a school.", ru: "директор школы.", uk: "директор школи." }
      b: { en: "the boss of a bank.", ru: "руководитель банка.", uk: "керівник банку." }
      c: { en: "the head of a municipality.", ru: "глава общины.", uk: "голова громади." }
      d: { en: "the chair of a party.", ru: "председатель партии.", uk: "голова партії." }
    terms:
      - { de: "das Oberhaupt", en: "head", ru: "глава", uk: "голова, очільник" }
      - { de: "die Gemeinde", en: "municipality", ru: "община", uk: "громада" }
    status: reviewed
