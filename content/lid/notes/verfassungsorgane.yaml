notes:
  - id: general-044
    rationale_de: >-
      Nicht das Volk wählt die Bundespräsidentin oder den Bundespräsidenten, sondern die Bundesversammlung (Grundgesetz, Artikel 54). Die Bundesversammlung besteht aus allen Abgeordneten des Bundestages und genauso vielen Personen, die von den Landtagen gewählt werden. Die Abgeordneten im Bundestag, im Landtag und im EU-Parlament werden dagegen direkt vom Volk gewählt.
    source: GG Art. 54
    question:
      en: "Whom can you, as a citizen in Germany, not elect directly?"
      ru: "Кого вы как гражданин Германии не можете выбрать напрямую?"
    options:
      a: { en: "members of the European Parliament", ru: "депутатов Европейского парламента" }
      b: { en: "the Federal President", ru: "федерального президента" }
      c: { en: "members of a state parliament (Landtag)", ru: "депутатов ландтага" }
      d: { en: "members of the Bundestag", ru: "депутатов бундестага" }
    terms:
      - { de: "direkt wählen", en: "to elect directly", ru: "избирать напрямую" }
      - { de: "die Bundesversammlung", en: "Federal Convention", ru: "Федеральное собрание (выборы президента)" }
    status: reviewed
  - id: general-048
    rationale_de: >-
      Verfassungsorgane sind die obersten Organe des Bundes, die das Grundgesetz einrichtet. Dazu gehören der Bundestag, der Bundesrat, die Bundesregierung, die Bundespräsidentin oder der Bundespräsident und das Bundesverfassungsgericht. Eine „Bürgerversammlung“ steht nicht im Grundgesetz – sie ist kein Verfassungsorgan.
    source: Grundgesetz
    question:
      en: "Which body is not one of Germany's constitutional bodies?"
      ru: "Какой орган не относится к конституционным органам Германии?"
    options:
      a: { en: "the Bundesrat", ru: "бундесрат" }
      b: { en: "the Federal President", ru: "федеральный президент" }
      c: { en: "the citizens' assembly", ru: "собрание граждан" }
      d: { en: "the government", ru: "правительство" }
    terms:
      - { de: "das Verfassungsorgan", en: "constitutional body", ru: "конституционный орган" }
      - { de: "die Bürgerversammlung", en: "citizens' assembly", ru: "собрание граждан" }
    status: reviewed
  - id: general-055
    rationale_de: >-
      Das Foto zeigt den Sitz des Deutschen Bundestages in Berlin. Das Parlament arbeitet seit 1999 im Reichstagsgebäude, das eine große Kuppel aus Glas hat. Das Bundesverfassungsgericht ist dagegen nicht in Berlin, sondern in Karlsruhe.
    source: Deutscher Bundestag
    question:
      en: "What does this picture show?"
      ru: "Что изображено на этом снимке?"
    options:
      a: { en: "the seat of the Bundestag in Berlin", ru: "резиденция бундестага в Берлине" }
      b: { en: "the Federal Constitutional Court in Karlsruhe", ru: "Федеральный конституционный суд в Карлсруэ" }
      c: { en: "the Bundesrat building in Berlin", ru: "здание бундесрата в Берлине" }
      d: { en: "the Federal Chancellery in Berlin", ru: "Ведомство федерального канцлера в Берлине" }
    terms:
      - { de: "der Sitz", en: "seat", ru: "резиденция" }
      - { de: "das Reichstagsgebäude", en: "Reichstag building", ru: "здание рейхстага" }
    status: reviewed
  - id: general-057
    rationale_de: >-
      Der Bundestag wählt seine Präsidentin oder seinen Präsidenten selbst (Grundgesetz, Artikel 40). Es ist eine Tradition, dass die stärkste Fraktion diese Person vorschlägt. Seit 2025 ist Julia Klöckner von der CDU Bundestagspräsidentin – die CDU/CSU ist die stärkste Fraktion.
    source: GG Art. 40
    question:
      en: "Who is usually elected President of the German Bundestag?"
      ru: "Кого обычно избирают председателем германского бундестага?"
    options:
      a: { en: "the oldest member of parliament", ru: "самого старшего депутата парламента" }
      b: { en: "the minister-president of the largest federal state", ru: "премьер-министра самой большой федеральной земли" }
      c: { en: "a former federal chancellor", ru: "бывшего федерального канцлера" }
      d: { en: "a member of the strongest parliamentary group", ru: "депутата от крупнейшей фракции" }
    terms:
      - { de: "die Fraktion", en: "parliamentary group", ru: "фракция" }
      - { de: "der/die Abgeordnete", en: "member of parliament", ru: "депутат" }
    status: reviewed
  - id: general-058
    rationale_de: >-
      Die Bundespräsidentin oder der Bundespräsident ernennt die Ministerinnen und Minister (Grundgesetz, Artikel 64). Ausgewählt und vorgeschlagen werden sie aber von der Bundeskanzlerin oder vom Bundeskanzler. Ernennen heißt: Sie bekommen offiziell ihr Amt.
    source: GG Art. 64 Abs. 1
    question:
      en: "Who appoints the ministers of the federal government in Germany?"
      ru: "Кто в Германии назначает министров федерального правительства?"
    options:
      a: { en: "the President of the Federal Constitutional Court", ru: "председатель Федерального конституционного суда" }
      b: { en: "the Federal President", ru: "федеральный президент" }
      c: { en: "the President of the Bundesrat", ru: "председатель бундесрата" }
      d: { en: "the President of the Bundestag", ru: "председатель бундестага" }
    terms:
      - { de: "ernennen", en: "to appoint", ru: "назначать" }
      - { de: "die Bundesregierung", en: "federal government", ru: "федеральное правительство" }
    status: reviewed
  - id: general-065
    rationale_de: >-
      Die Bundeskanzlerin oder der Bundeskanzler bildet das Bundeskabinett, also die Bundesregierung: Sie oder er schlägt die Ministerinnen und Minister vor, und das Staatsoberhaupt ernennt sie (Grundgesetz, Artikel 64). Der Bundestag wählt aber die Kanzlerin oder den Kanzler, kontrolliert die Regierung und macht Gesetze.
    source: GG Art. 63, Art. 64
    question:
      en: "It is not one of the tasks of the German Bundestag …"
      ru: "К задачам германского бундестага не относится …"
    options:
      a: { en: "to draft laws.", ru: "разрабатывать законы." }
      b: { en: "to scrutinise the federal government.", ru: "контролировать федеральное правительство." }
      c: { en: "to elect the Federal Chancellor.", ru: "избирать федерального канцлера." }
      d: { en: "to form the federal cabinet.", ru: "формировать федеральный кабинет." }
    terms:
      - { de: "das Bundeskabinett", en: "federal cabinet", ru: "федеральный кабинет" }
      - { de: "entwerfen", en: "to draft", ru: "разрабатывать" }
    status: reviewed
  - id: general-070
    rationale_de: >-
      Die Bundespräsidentin oder der Bundespräsident schlägt dem Bundestag eine Person als Kanzlerin oder Kanzler vor (Grundgesetz, Artikel 63). Der Bundestag wählt, und danach ernennt das Staatsoberhaupt die gewählte Person – so wie Gustav Heinemann 1974 Helmut Schmidt. Der Kanzler führt dagegen die Regierung und wählt auch die Ministerinnen und Minister aus.
    source: GG Art. 63, Art. 64
    question:
      en: "In 1974, German Federal President Gustav Heinemann hands Helmut Schmidt his certificate of appointment as German Federal Chancellor. What is one of the tasks of the German Federal President?"
      ru: "Федеральный президент Германии Густав Хайнеман в 1974 году вручает Гельмуту Шмидту грамоту о назначении федеральным канцлером Германии. Что входит в задачи федерального президента Германии?"
    options:
      a: { en: "She/He conducts the business of government.", ru: "Она/он руководит работой правительства." }
      b: { en: "She/He controls the governing party.", ru: "Она/он контролирует правящую партию." }
      c: { en: "She/He selects the ministers.", ru: "Она/он выбирает министров." }
      d: { en: "She/He proposes the chancellor for election.", ru: "Она/он предлагает кандидатуру канцлера для избрания." }
    terms:
      - { de: "die Ernennungsurkunde", en: "certificate of appointment", ru: "грамота о назначении" }
      - { de: "vorschlagen", en: "to propose", ru: "предлагать" }
    status: reviewed
  - id: general-071
    rationale_de: >-
      Der Bundeskanzler oder die Bundeskanzlerin arbeitet vor allem in Berlin, denn dort sind das Bundeskanzleramt und der Bundestag. Bonn war bis 1999 der Sitz von Parlament und Regierung. Schloss Bellevue ist der Amtssitz des Bundespräsidenten, nicht des Kanzlers.
    question:
      en: "Where does the German Federal Chancellor spend most of their time? Most often she/he is …"
      ru: "Где чаще всего находится федеральный канцлер Германии? Чаще всего она/он находится …"
    options:
      a: { en: "in Bonn, because the Federal Chancellery and the Bundestag are located there.", ru: "в Бонне, потому что там находятся Ведомство федерального канцлера и бундестаг." }
      b: { en: "at Meseberg Palace, the federal government's guest house, to receive state guests.", ru: "в замке Мезеберг, гостевом доме федерального правительства, чтобы принимать государственных гостей." }
      c: { en: "at Bellevue Palace, the official residence of the Federal President, to receive state guests.", ru: "во дворце Бельвю, официальной резиденции федерального президента, чтобы принимать государственных гостей." }
      d: { en: "in Berlin, because the Federal Chancellery and the Bundestag are located there.", ru: "в Берлине, потому что там находятся Ведомство федерального канцлера и бундестаг." }
    terms:
      - { de: "das Bundeskanzleramt", en: "Federal Chancellery", ru: "Ведомство федерального канцлера" }
      - { de: "der Amtssitz", en: "official residence", ru: "официальная резиденция" }
    status: reviewed
  - id: general-072
    rationale_de: >-
      Friedrich Merz von der CDU ist seit Mai 2025 Bundeskanzler. Vor ihm waren unter anderen Angela Merkel (2005–2021) und Gerhard Schröder (1998–2005) im Amt. Ursula von der Leyen war nie Kanzlerin; sie ist Präsidentin der Europäischen Kommission.
    source: Bundesregierung
    question:
      en: "What is the name of the current Federal Chancellor of Germany?"
      ru: "Как зовут нынешнего федерального канцлера Германии?"
    options:
      a: { en: "Gerhard Schröder", ru: "Герхард Шрёдер" }
      b: { en: "Angela Merkel", ru: "Ангела Меркель" }
      c: { en: "Ursula von der Leyen", ru: "Урсула фон дер Ляйен" }
      d: { en: "Friedrich Merz", ru: "Фридрих Мерц" }
    terms:
      - { de: "jetzig", en: "current", ru: "нынешний" }
    status: reviewed
  - id: general-073
    rationale_de: >-
      Bei der Bundestagswahl im Februar 2025 bekam die CDU/CSU die meisten Stimmen, die AfD die zweitmeisten. Darum sind CDU/CSU und AfD zurzeit die beiden größten Fraktionen im Bundestag. Die Regierung bilden aber CDU/CSU und SPD; die AfD ist in der Opposition.
    source: "Bundeswahlleiterin: Bundestagswahl 2025"
    question:
      en: "The two largest parliamentary groups in the German Bundestag are currently …"
      ru: "Две крупнейшие фракции в германском бундестаге сейчас — это …"
    options:
      a: { en: "CDU/CSU and AfD.", ru: "ХДС/ХСС и АдГ." }
      b: { en: "Die Linke and Bündnis 90/Die Grünen.", ru: "Левые и Союз 90/Зелёные." }
      c: { en: "Bündnis 90/Die Grünen and SPD.", ru: "Союз 90/Зелёные и СДПГ." }
      d: { en: "Die Linke and CDU/CSU.", ru: "Левые и ХДС/ХСС." }
    terms:
      - { de: "die Fraktion", en: "parliamentary group", ru: "фракция" }
      - { de: "zurzeit", en: "currently", ru: "в настоящее время" }
    status: reviewed
  - id: general-074
    rationale_de: >-
      Das Parlament für ganz Deutschland ist der Bundestag in Berlin. Seine Abgeordneten werden vom Volk für vier Jahre gewählt. Die Volkskammer war das Parlament der DDR, und die Bundesversammlung kommt nur zusammen, um das Staatsoberhaupt zu wählen.
    source: GG Art. 38, Art. 39
    question:
      en: "What is the name of the parliament for the whole of Germany?"
      ru: "Как называется парламент всей Германии?"
    options:
      a: { en: "Federal Convention", ru: "Федеральное собрание" }
      b: { en: "People's Chamber", ru: "Народная палата" }
      c: { en: "Bundestag", ru: "бундестаг" }
      d: { en: "Federal Court of Justice", ru: "Федеральный верховный суд" }
    terms:
      - { de: "das Parlament", en: "parliament", ru: "парламент" }
      - { de: "die Volkskammer", en: "People's Chamber", ru: "Народная палата" }
    status: reviewed
  - id: general-075
    rationale_de: >-
      Das Staatsoberhaupt von Deutschland ist der Bundespräsident, und seit 2017 ist das Frank-Walter Steinmeier. Joachim Gauck war vor ihm Bundespräsident, von 2012 bis 2017. Bärbel Bas und Bodo Ramelow kennt man aus der Politik, aber sie sind nicht Staatsoberhaupt.
    source: Bundespräsidialamt
    question:
      en: "What is the name of Germany's current head of state?"
      ru: "Как зовут нынешнего главу государства Германии?"
    options:
      a: { en: "Frank-Walter Steinmeier", ru: "Франк-Вальтер Штайнмайер" }
      b: { en: "Bärbel Bas", ru: "Бербель Бас" }
      c: { en: "Bodo Ramelow", ru: "Бодо Рамелов" }
      d: { en: "Joachim Gauck", ru: "Йоахим Гаук" }
    terms:
      - { de: "das Staatsoberhaupt", en: "head of state", ru: "глава государства" }
    status: reviewed
  - id: general-077
    rationale_de: >-
      Die Bundeswehr ist die Armee der Bundesrepublik Deutschland. Sie wurde 1955 gegründet und soll Deutschland verteidigen (Grundgesetz, Artikel 87a). Über bewaffnete Einsätze im Ausland entscheidet der Bundestag – darum nennt man sie auch eine Parlamentsarmee.
    source: GG Art. 87a
    question:
      en: "What is the Bundeswehr?"
      ru: "Что такое бундесвер?"
    options:
      a: { en: "the German police", ru: "немецкая полиция" }
      b: { en: "a German port", ru: "немецкий порт" }
      c: { en: "a German citizens' initiative", ru: "немецкая гражданская инициатива" }
      d: { en: "the German army", ru: "немецкая армия" }
    terms:
      - { de: "die Bundeswehr", en: "German armed forces", ru: "бундесвер" }
      - { de: "die Bürgerinitiative", en: "citizens' initiative", ru: "гражданская инициатива" }
    status: reviewed
  - id: general-080
    rationale_de: >-
      Das Bundesverfassungsgericht in Karlsruhe entscheidet, wie das Grundgesetz zu verstehen ist (Grundgesetz, Artikel 93). Es prüft zum Beispiel, ob ein Gesetz mit dem Grundgesetz vereinbar ist. Auch Bürgerinnen und Bürger können sich mit einer Verfassungsbeschwerde an das Gericht wenden.
    source: GG Art. 93
    question:
      en: "Which court in Germany is responsible for interpreting the Basic Law?"
      ru: "Какой суд в Германии отвечает за толкование Основного закона?"
    options:
      a: { en: "Higher Regional Court", ru: "Высший земельный суд" }
      b: { en: "Local Court", ru: "Участковый суд" }
      c: { en: "Federal Constitutional Court", ru: "Федеральный конституционный суд" }
      d: { en: "Administrative Court", ru: "Административный суд" }
    terms:
      - { de: "die Auslegung", en: "interpretation", ru: "толкование" }
      - { de: "zuständig", en: "responsible", ru: "компетентный" }
    status: reviewed
  - id: general-081
    rationale_de: >-
      Der Bundestag wählt die Bundeskanzlerin oder den Bundeskanzler (Grundgesetz, Artikel 63). Das Volk wählt den Kanzler also nicht direkt, sondern die Abgeordneten des Bundestages. Die Bundesversammlung wählt nur das Staatsoberhaupt, also den Bundespräsidenten.
    source: GG Art. 63
    question:
      en: "Who elects the Federal Chancellor in Germany?"
      ru: "Кто избирает федерального канцлера в Германии?"
    options:
      a: { en: "the Bundesrat", ru: "бундесрат" }
      b: { en: "the Federal Convention", ru: "Федеральное собрание" }
      c: { en: "the people", ru: "народ" }
      d: { en: "the Bundestag", ru: "бундестаг" }
    terms:
      - { de: "die Bundesversammlung", en: "Federal Convention", ru: "Федеральное собрание (выборы президента)" }
    status: reviewed
  - id: general-082
    rationale_de: >-
      Das Bundeskabinett besteht aus der Bundeskanzlerin oder dem Bundeskanzler und den Ministerinnen und Ministern (Grundgesetz, Artikel 62). Der Kanzler leitet die Arbeit der Regierung und bestimmt die Richtung der Politik (Artikel 65). Der Bundespräsident gehört nicht zum Kabinett.
    source: GG Art. 62, Art. 65
    question:
      en: "Who leads the German federal cabinet?"
      ru: "Кто руководит федеральным кабинетом Германии?"
    options:
      a: { en: "the President of the Bundestag", ru: "председатель бундестага" }
      b: { en: "the Federal President", ru: "федеральный президент" }
      c: { en: "the President of the Bundesrat", ru: "председатель бундесрата" }
      d: { en: "the Federal Chancellor", ru: "федеральный канцлер" }
    terms:
      - { de: "das Bundeskabinett", en: "federal cabinet", ru: "федеральный кабинет" }
      - { de: "leiten", en: "to lead", ru: "руководить" }
    status: reviewed
  - id: general-083
    rationale_de: >-
      Die Abgeordneten im Bundestag wählen die Bundeskanzlerin oder den Bundeskanzler (Grundgesetz, Artikel 63). Meistens haben die Regierungsparteien diese Person schon vorher ausgesucht. Die Bürgerinnen und Bürger wählen den Kanzler nicht direkt – sie wählen den Bundestag.
    source: GG Art. 63
    question:
      en: "Who elects the German Federal Chancellor?"
      ru: "Кто избирает федерального канцлера Германии?"
    options:
      a: { en: "the people", ru: "народ" }
      b: { en: "the Federal Convention", ru: "Федеральное собрание" }
      c: { en: "the Bundestag", ru: "бундестаг" }
      d: { en: "the federal government", ru: "федеральное правительство" }
    terms:
      - { de: "die Bundesregierung", en: "federal government", ru: "федеральное правительство" }
    status: reviewed
  - id: general-084
    rationale_de: >-
      Die Bundespräsidentin oder der Bundespräsident vertritt Deutschland, zum Beispiel bei Besuchen im Ausland und beim Empfang von Staatsgästen (Grundgesetz, Artikel 59). Regieren ist dagegen die Aufgabe der Bundesregierung mit dem Kanzler an der Spitze. Der Bundespräsident unterschreibt die Gesetze, aber er schreibt sie nicht.
    source: GG Art. 59, Art. 82
    question:
      en: "What is the main task of the German Federal President? She/He …"
      ru: "Какова главная задача федерального президента Германии? Она/он …"
    options:
      a: { en: "governs the country.", ru: "управляет страной." }
      b: { en: "drafts the laws.", ru: "разрабатывает законы." }
      c: { en: "represents the country.", ru: "представляет страну." }
      d: { en: "monitors compliance with the laws.", ru: "следит за соблюдением законов." }
    terms:
      - { de: "repräsentieren", en: "to represent", ru: "представлять" }
      - { de: "die Hauptaufgabe", en: "main task", ru: "главная задача" }
    status: reviewed
  - id: general-085
    rationale_de: >-
      Im Bundesrat sitzen Mitglieder der Regierungen der 16 Bundesländer, zum Beispiel Ministerpräsidentinnen und Ministerpräsidenten (Grundgesetz, Artikel 51). So können die Länder bei der Politik des Bundes mitbestimmen. Die Abgeordneten des Bundestages sitzen dagegen nicht im Bundesrat.
    source: GG Art. 51
    question:
      en: "Who makes up the German Bundesrat?"
      ru: "Кто входит в состав германского бундесрата?"
    options:
      a: { en: "the members of the Bundestag", ru: "депутаты бундестага" }
      b: { en: "the ministers of the federal government", ru: "министры федерального правительства" }
      c: { en: "the government representatives of the federal states", ru: "представители правительств федеральных земель" }
      d: { en: "the party members", ru: "члены партий" }
    terms:
      - { de: "der Bundesrat", en: "Bundesrat (Federal Council)", ru: "бундесрат" }
      - { de: "das Bundesland", en: "federal state (Land)", ru: "федеральная земля" }
    status: reviewed
  - id: general-086
    rationale_de: >-
      Die Bundesversammlung wählt die Bundespräsidentin oder den Bundespräsidenten für fünf Jahre (Grundgesetz, Artikel 54). Sie besteht aus allen Abgeordneten des Bundestages und genauso vielen Mitgliedern, die von den Landtagen gewählt werden. Die Bundesversammlung kommt nur für diese eine Wahl zusammen.
    source: GG Art. 54
    question:
      en: "Who elects the Federal President in Germany?"
      ru: "Кто избирает федерального президента в Германии?"
    options:
      a: { en: "the Federal Convention", ru: "Федеральное собрание" }
      b: { en: "the Bundesrat", ru: "бундесрат" }
      c: { en: "the federal parliament", ru: "федеральный парламент" }
      d: { en: "the Federal Constitutional Court", ru: "Федеральный конституционный суд" }
    terms:
      - { de: "die Bundesversammlung", en: "Federal Convention", ru: "Федеральное собрание (выборы президента)" }
    status: reviewed
  - id: general-087
    rationale_de: >-
      Staatsoberhaupt ist die Bundespräsidentin oder der Bundespräsident. Sie oder er vertritt Deutschland, hat aber wenig politische Macht. Die meiste Macht hat die Bundeskanzlerin oder der Bundeskanzler als Chef der Regierung – das verwechseln viele.
    source: "bpb: Bundespräsident"
    question:
      en: "Who is the head of state of the Federal Republic of Germany?"
      ru: "Кто является главой государства Федеративной Республики Германия?"
    options:
      a: { en: "the Federal Chancellor", ru: "федеральный канцлер" }
      b: { en: "the Federal President", ru: "федеральный президент" }
      c: { en: "the President of the Bundesrat", ru: "председатель бундесрата" }
      d: { en: "the President of the Bundestag", ru: "председатель бундестага" }
    terms:
      - { de: "das Staatsoberhaupt", en: "head of state", ru: "глава государства" }
    status: reviewed
  - id: general-089
    rationale_de: >-
      Die Abgeordneten einer Partei bilden im Parlament eine Fraktion. Sie arbeiten zusammen und stimmen oft gemeinsam ab. CDU und CSU sind übrigens zwei Parteien, bilden im Bundestag aber eine gemeinsame Fraktion.
    source: GO-BT § 10
    question:
      en: "In Germany, what do you call the union of the members of parliament of one party in the parliament?"
      ru: "Как в Германии называется объединение депутатов одной партии в парламенте?"
    options:
      a: { en: "association", ru: "союз" }
      b: { en: "Council of Elders", ru: "совет старейшин" }
      c: { en: "parliamentary group", ru: "фракция" }
      d: { en: "opposition", ru: "оппозиция" }
    terms:
      - { de: "die Fraktion", en: "parliamentary group", ru: "фракция" }
      - { de: "der Ältestenrat", en: "Council of Elders", ru: "совет старейшин" }
    status: reviewed
  - id: general-090
    rationale_de: >-
      Durch den Bundesrat wirken die Länder bei der Gesetzgebung des Bundes mit – so steht es in Artikel 50 des Grundgesetzes. Im Bundesrat sitzen Vertreterinnen und Vertreter der Landesregierungen. Viele Gesetze brauchen die Zustimmung des Bundesrates.
    source: GG Art. 50
    question:
      en: "The German federal states take part in federal legislation through …"
      ru: "Федеральные земли Германии участвуют в федеральном законодательстве через …"
    options:
      a: { en: "the Bundesrat.", ru: "бундесрат." }
      b: { en: "the Federal Convention.", ru: "Федеральное собрание." }
      c: { en: "the Bundestag.", ru: "бундестаг." }
      d: { en: "the federal government.", ru: "федеральное правительство." }
    terms:
      - { de: "mitwirken", en: "to take part", ru: "участвовать" }
      - { de: "die Gesetzgebung", en: "legislation", ru: "законодательство" }
    status: reviewed
  - id: general-091
    rationale_de: >-
      Jede Landesregierung schickt Vertreter in den Bundesrat, und eine neue Landesregierung kann deshalb die Mehrheit im Bundesrat ändern. Viele Gesetze brauchen die Zustimmung des Bundesrates. Wenn die Bundesregierung dort keine Mehrheit mehr hat, wird das Regieren schwieriger. Die Mehrheit im Bundestag ändert sich durch eine Landtagswahl dagegen nicht.
    source: GG Art. 51, Art. 77
    question:
      en: "In Germany, a change of government in a federal state can affect federal politics. Governing becomes …"
      ru: "В Германии смена правительства в федеральной земле может повлиять на федеральную политику. Управлять становится …"
    options:
      a: { en: "more difficult if this changes the majority in the Bundestag.", ru: "труднее, если из-за этого меняется большинство в бундестаге." }
      b: { en: "easier if this brings new parties into the Bundesrat.", ru: "легче, если из-за этого в бундесрат приходят новые партии." }
      c: { en: "more difficult if this changes the majority in the Bundesrat.", ru: "труднее, если из-за этого меняется большинство в бундесрате." }
      d: { en: "easier if it is a rich federal state.", ru: "легче, если речь идёт о богатой федеральной земле." }
    terms:
      - { de: "die Mehrheit", en: "majority", ru: "большинство" }
      - { de: "die Auswirkung", en: "effect", ru: "последствие" }
    status: reviewed
  - id: general-098
    rationale_de: >-
      Abgeordnete sind nur ihrem Gewissen verpflichtet und dürfen ihre Fraktion wechseln (Grundgesetz, Artikel 38). Sie behalten dabei ihren Platz im Bundestag. Wenn Abgeordnete die Regierungsfraktionen verlassen, kann die Regierung deshalb ihre Mehrheit verlieren.
    source: GG Art. 38 Abs. 1
    question:
      en: "If members of the German Bundestag switch their parliamentary group, …"
      ru: "Если депутаты германского бундестага меняют фракцию, …"
    options:
      a: { en: "they may no longer take part in the sessions of parliament.", ru: "они больше не могут участвовать в заседаниях парламента." }
      b: { en: "the government may lose its majority.", ru: "правительство может потерять большинство." }
      c: { en: "the Federal President must give her/his consent beforehand.", ru: "федеральный президент должен заранее дать своё согласие." }
      d: { en: "the voters of these members may vote again.", ru: "избиратели этих депутатов могут проголосовать ещё раз." }
    terms:
      - { de: "die Fraktion wechseln", en: "to switch parliamentary group", ru: "сменить фракцию" }
      - { de: "die Mehrheit", en: "majority", ru: "большинство" }
    status: reviewed
  - id: general-102
    rationale_de: >-
      Mit dem Bundesverdienstkreuz ehrt Deutschland Menschen, die viel für die Gesellschaft getan haben. Die Bundespräsidentin oder der Bundespräsident verleiht es, zum Beispiel an Menschen, die sich viele Jahre ehrenamtlich engagieren. Der Vaterländische Verdienstorden und der Titel „Held der DDR“ waren Auszeichnungen der DDR. Die DDR gibt es seit 1990 nicht mehr.
    source: "Bundespräsident: Verdienstorden"
    question:
      en: "What can you be honoured with in the Federal Republic of Germany if you have achieved something special in the political, economic, cultural, intellectual or social field? With the …"
      ru: "Чем в Федеративной Республике Германия могут наградить человека, который добился особых успехов в политической, экономической, культурной, духовной или социальной области? …"
    options:
      a: { en: "Federal Cross of Merit", ru: "Федеральным крестом за заслуги" }
      b: { en: "Federal Eagle", ru: "Федеральным орлом" }
      c: { en: "Patriotic Order of Merit", ru: "Орденом «За заслуги перед Отечеством»" }
      d: { en: "honorary title “Hero of the German Democratic Republic”", ru: "Почётным званием «Герой Германской Демократической Республики»" }
    terms:
      - { de: "das Bundesverdienstkreuz", en: "Federal Cross of Merit", ru: "Федеральный крест за заслуги" }
      - { de: "ehren", en: "to honour", ru: "награждать" }
      - { de: "die Leistung", en: "achievement", ru: "достижение" }
    status: reviewed
