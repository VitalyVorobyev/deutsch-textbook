notes:
  - id: general-021
    rationale_de: >-
      Bild 1 zeigt das Bundeswappen: einen schwarzen Adler mit rotem Schnabel, roter Zunge und roten Krallen auf einem goldgelben Schild. Bild 4 ist das Wappen der früheren DDR mit Hammer und Zirkel. Bild 3 ist das Zeichen der Bundeswehr, und Bild 2 ist ein christliches Symbol.
    source: Bekanntmachung betreffend das Bundeswappen und den Bundesadler (1950)
    question:
      en: "Which is the coat of arms of the Federal Republic of Germany?"
      ru: "Какой из них — герб Федеративной Республики Германия?"
    options:
      a: { en: "Picture 1", ru: "Изображение 1" }
      b: { en: "Picture 2", ru: "Изображение 2" }
      c: { en: "Picture 3", ru: "Изображение 3" }
      d: { en: "Picture 4", ru: "Изображение 4" }
    terms:
      - { de: "das Wappen", en: "coat of arms", ru: "герб" }
      - { de: "der Adler", en: "eagle", ru: "орёл" }
    status: draft
  - id: general-029
    rationale_de: >-
      Das Wappentier der Bundesrepublik ist der Adler. Man sieht ihn als Bundesadler zum Beispiel auf dem Reisepass, auf manchen Euromünzen und im Plenarsaal des Bundestages. Der Bär ist dagegen das Wappentier von Berlin, und Löwen findet man im großen Staatswappen von Bayern.
    source: Bekanntmachung betreffend das Bundeswappen und den Bundesadler (1950)
    question:
      en: "Which animal is the heraldic animal of the Federal Republic of Germany?"
      ru: "Какое животное изображено на гербе Федеративной Республики Германия?"
    options:
      a: { en: "lion", ru: "лев" }
      b: { en: "eagle", ru: "орёл" }
      c: { en: "bear", ru: "медведь" }
      d: { en: "horse", ru: "лошадь" }
    terms:
      - { de: "das Wappentier", en: "heraldic animal", ru: "геральдическое животное" }
      - { de: "der Adler", en: "eagle", ru: "орёл" }
    status: draft
  - id: general-040
    rationale_de: >-
      Die deutsche Nationalhymne ist die dritte Strophe des „Liedes der Deutschen“ und beginnt mit „Einigkeit und Recht und Freiheit für das deutsche Vaterland“. „Freude schöner Götterfunken“ kommt aus Beethovens Neunter Sinfonie; die Melodie ist heute die Hymne Europas. „Deutschland einig Vaterland“ stammt aus der Hymne der DDR, „Völker, hört die Signale“ aus dem Arbeiterlied „Die Internationale“.
    source: Briefwechsel Weizsäcker–Kohl (1991)
    question:
      en: "With which words does the German national anthem begin?"
      ru: "С каких слов начинается национальный гимн Германии?"
    options:
      a: { en: "Peoples, hear the signals …", ru: "Народы, слушайте сигналы …" }
      b: { en: "Unity and justice and freedom …", ru: "Единство, право и свобода …" }
      c: { en: "Joy, beautiful spark of the gods …", ru: "Радость, прекрасная искра богов …" }
      d: { en: "Germany, united fatherland …", ru: "Германия, единое отечество …" }
    terms:
      - { de: "die Nationalhymne", en: "national anthem", ru: "национальный гимн" }
      - { de: "die Einigkeit", en: "unity", ru: "единство" }
    status: draft
  - id: general-212
    rationale_de: >-
      Der volle Name ist „Bundesrepublik Deutschland“ – so steht es zum Beispiel in Artikel 20 des Grundgesetzes. „Bund“ zeigt, dass Deutschland aus 16 Bundesländern besteht. „Republik“ heißt, dass es keinen König gibt, sondern ein gewähltes Staatsoberhaupt.
    source: GG Art. 20 Abs. 1
    question:
      en: "What is Germany's full name?"
      ru: "Как звучит полное название Германии?"
    options:
      a: { en: "Federal State of Germany", ru: "Федеративное государство Германия" }
      b: { en: "Federal States of Germany", ru: "Федеральные земли Германия" }
      c: { en: "Federal Republic of Germany", ru: "Федеративная Республика Германия" }
      d: { en: "Federal District of Germany", ru: "Федеральный округ Германия" }
    terms:
      - { de: "die Bundesrepublik", en: "federal republic", ru: "федеративная республика" }
    status: draft
  - id: general-214
    rationale_de: >-
      Die Bundesflagge ist schwarz-rot-gold – so steht es im Grundgesetz, Artikel 22. Die Farben kommen aus der Freiheitsbewegung des 19. Jahrhunderts, zum Beispiel vom Hambacher Fest 1832. Achtung: Die dritte Farbe heißt offiziell „Gold“, nicht „Gelb“.
    source: GG Art. 22 Abs. 2
    question:
      en: "What are the colours of the German flag?"
      ru: "Какие цвета у немецкого флага?"
    options:
      a: { en: "black-red-gold", ru: "чёрно-красно-золотой" }
      b: { en: "red-white-black", ru: "красно-бело-чёрный" }
      c: { en: "black-red-green", ru: "чёрно-красно-зелёный" }
      d: { en: "black-yellow-red", ru: "чёрно-жёлто-красный" }
    terms:
      - { de: "die Flagge", en: "flag", ru: "флаг" }
    status: draft
  - id: general-216
    rationale_de: >-
      Im Plenarsaal des Bundestages hängt vorne an der Wand ein großer Bundesadler. Der Adler ist das Wappentier der Bundesrepublik Deutschland, und im Plenarsaal debattieren und stimmen die Abgeordneten ab. Reichsadler und Reichskrone sind Zeichen aus der Zeit des früheren Deutschen Reiches; auf der Fahne von Berlin ist ein Bär.
    source: Deutscher Bundestag
    question:
      en: "Which symbol can be seen in the plenary hall of the German Bundestag?"
      ru: "Какой символ можно увидеть в зале пленарных заседаний германского бундестага?"
    options:
      a: { en: "the Federal Eagle", ru: "федеральный орёл" }
      b: { en: "the flag of the city of Berlin", ru: "флаг города Берлина" }
      c: { en: "the Imperial Eagle", ru: "имперский орёл" }
      d: { en: "the Imperial Crown", ru: "имперская корона" }
    terms:
      - { de: "der Plenarsaal", en: "plenary hall", ru: "зал пленарных заседаний" }
      - { de: "der Bundesadler", en: "Federal Eagle", ru: "федеральный орёл" }
    status: draft
