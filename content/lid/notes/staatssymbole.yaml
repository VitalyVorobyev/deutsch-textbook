notes:
  - id: general-021
    rationale_de: >-
      Bild 1 zeigt das Bundeswappen: einen schwarzen Adler mit rotem Schnabel, roter Zunge und roten Krallen auf einem goldgelben Schild. Bild 4 ist das Wappen der früheren DDR mit Hammer und Zirkel. Bild 3 ist das Zeichen der Bundeswehr, und Bild 2 ist ein christliches Symbol.
    source: Bekanntmachung betreffend das Bundeswappen und den Bundesadler (1950)
    question:
      en: "Which is the coat of arms of the Federal Republic of Germany?"
      ru: "Какой из них — герб Федеративной Республики Германия?"
      uk: "Який із них — герб Федеративної Республіки Німеччина?"
    options:
      a: { en: "Picture 1", ru: "Изображение 1", uk: "Зображення 1" }
      b: { en: "Picture 2", ru: "Изображение 2", uk: "Зображення 2" }
      c: { en: "Picture 3", ru: "Изображение 3", uk: "Зображення 3" }
      d: { en: "Picture 4", ru: "Изображение 4", uk: "Зображення 4" }
    terms:
      - { de: "das Wappen", en: "coat of arms", ru: "герб", uk: "герб" }
      - { de: "der Adler", en: "eagle", ru: "орёл", uk: "орел" }
    status: reviewed
  - id: general-029
    rationale_de: >-
      Das Wappentier der Bundesrepublik ist der Adler. Man sieht ihn als Bundesadler zum Beispiel auf dem Reisepass, auf manchen Euromünzen und im Plenarsaal des Bundestages. Der Bär ist dagegen das Wappentier von Berlin, und Löwen findet man im großen Staatswappen von Bayern.
    source: Bekanntmachung betreffend das Bundeswappen und den Bundesadler (1950)
    question:
      en: "Which animal is the heraldic animal of the Federal Republic of Germany?"
      ru: "Какое животное изображено на гербе Федеративной Республики Германия?"
