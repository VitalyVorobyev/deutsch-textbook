  - id: general-040
    rationale_de: >-
      Die deutsche Nationalhymne ist die dritte Strophe des „Liedes der Deutschen“ und beginnt mit „Einigkeit und Recht und Freiheit für das deutsche Vaterland“. „Freude schöner Götterfunken“ kommt aus Beethovens Neunter Sinfonie; die Melodie ist heute die Hymne Europas. „Deutschland einig Vaterland“ stammt aus der Hymne der DDR, „Völker, hört die Signale“ aus dem Arbeiterlied „Die Internationale“.
    source: Briefwechsel Weizsäcker–Kohl (1991)
    question:
      en: "With which words does the German national anthem begin?"
      ru: "С каких слов начинается национальный гимн Германии?"
      uk: "З яких слів починається національний гімн Німеччини?"
    options:
      a: { en: "Peoples, hear the signals …", ru: "Народы, слушайте сигналы …", uk: "Народи, слухайте сигнали …" }
      b: { en: "Unity and justice and freedom …", ru: "Единство, право и свобода …", uk: "Єдність, право і свобода …" }
      c: { en: "Joy, beautiful spark of the gods …", ru: "Радость, прекрасная искра богов …", uk: "Радість, прекрасна іскра богів …" }
      d: { en: "Germany, united fatherland …", ru: "Германия, единое отечество …", uk: "Німеччина, єдина вітчизна …" }
    terms:
      - { de: "die Nationalhymne", en: "national anthem", ru: "национальный гимн", uk: "національний гімн" }
      - { de: "die Einigkeit", en: "unity", ru: "единство", uk: "єдність" }
    status: reviewed
  - id: general-212
    rationale_de: >-
      Der volle Name ist „Bundesrepublik Deutschland“ – so steht es zum Beispiel in Artikel 20 des Grundgesetzes. „Bund“ zeigt, dass Deutschland aus 16 Bundesländern besteht. „Republik“ heißt, dass es keinen König gibt, sondern ein gewähltes Staatsoberhaupt.
    source: GG Art. 20 Abs. 1
    question:
      en: "What is Germany's full name?"
      ru: "Как звучит полное название Германии?"
      uk: "Як звучить повна назва Німеччини?"
    options:
      a: { en: "Federal State of Germany", ru: "Федеративное государство Германия", uk: "Федеративна держава Німеччина" }
      b: { en: "Federal States of Germany", ru: "Федеральные земли Германия", uk: "Федеральні землі Німеччина" }
      c: { en: "Federal Republic of Germany", ru: "Федеративная Республика Германия", uk: "Федеративна Республіка Німеччина" }
      d: { en: "Federal District of Germany", ru: "Федеральный округ Германия", uk: "Федеральний округ Німеччина" }
    terms:
      - { de: "die Bundesrepublik", en: "federal republic", ru: "федеративная республика", uk: "федеративна республіка" }
    status: reviewed
  - id: general-214
    rationale_de: >-
      Die Bundesflagge ist schwarz-rot-gold – so steht es im Grundgesetz, Artikel 22. Die Farben kommen aus der Freiheitsbewegung des 19. Jahrhunderts, zum Beispiel vom Hambacher Fest 1832. Achtung: Die dritte Farbe heißt offiziell „Gold“, nicht „Gelb“.
    source: GG Art. 22 Abs. 2
    question:
      en: "What are the colours of the German flag?"
      ru: "Какие цвета у немецкого флага?"
      uk: "Які кольори має німецький прапор?"
    options:
      a: { en: "black-red-gold", ru: "чёрно-красно-золотой", uk: "чорно-червоно-золотий" }
      b: { en: "red-white-black", ru: "красно-бело-чёрный", uk: "червоно-біло-чорний" }
      c: { en: "black-red-green", ru: "чёрно-красно-зелёный", uk: "чорно-червоно-зелений" }
      d: { en: "black-yellow-red", ru: "чёрно-жёлто-красный", uk: "чорно-жовто-червоний" }
    terms:
      - { de: "die Flagge", en: "flag", ru: "флаг", uk: "прапор" }
    status: reviewed
  - id: general-216
    rationale_de: >-
      Im Plenarsaal des Bundestages hängt vorne an der Wand ein großer Bundesadler. Der Adler ist das Wappentier der Bundesrepublik Deutschland, und im Plenarsaal debattieren und stimmen die Abgeordneten ab. Reichsadler und Reichskrone sind Zeichen aus der Zeit des früheren Deutschen Reiches; auf der Fahne von Berlin ist ein Bär.
    source: Deutscher Bundestag
    question:
      en: "Which symbol can be seen in the plenary hall of the German Bundestag?"
      ru: "Какой символ можно увидеть в зале пленарных заседаний германского бундестага?"
      uk: "Який символ можна побачити в залі пленарних засідань німецького Бундестагу?"
    options:
      a: { en: "the Federal Eagle", ru: "федеральный орёл", uk: "федеральний орел" }
      b: { en: "the flag of the city of Berlin", ru: "флаг города Берлина", uk: "прапор міста Берлін" }
      c: { en: "the Imperial Eagle", ru: "имперский орёл", uk: "імперський орел" }
      d: { en: "the Imperial Crown", ru: "имперская корона", uk: "імперська корона" }
    terms:
      - { de: "der Plenarsaal", en: "plenary hall", ru: "зал пленарных заседаний", uk: "зал пленарних засідань" }
      - { de: "der Bundesadler", en: "Federal Eagle", ru: "федеральный орёл", uk: "федеральний орел" }
    status: reviewed
