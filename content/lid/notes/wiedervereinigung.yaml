  - id: general-196
    rationale_de: >-
      Im Herbst 1989 demonstrierten in der DDR immer mehr Menschen für Freiheit und Demokratie. Die SED verlor ihre Macht, die Mauer wurde geöffnet, und im März 1990 gab es die ersten freien Wahlen zur Volkskammer. Diese Veränderung von der Diktatur zur Demokratie nennt man „die Wende“ oder die Friedliche Revolution.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Why is the period in autumn 1989 in the GDR called “Die Wende” (the turning point)? During this time the GDR changed politically …"
      ru: "Почему период осенью 1989 года в ГДР называют «Die Wende» («поворот»)? В это время ГДР политически изменилась …"
      uk: "Чому період восени 1989 року в НДР називають «Die Wende» («поворот»)? У цей час НДР політично змінилася …"
    options:
      a: { en: "from a dictatorship to a democracy.", ru: "от диктатуры к демократии.", uk: "від диктатури до демократії." }
      b: { en: "from a liberal market economy to socialism.", ru: "от либеральной рыночной экономики к социализму.", uk: "від ліберальної ринкової економіки до соціалізму." }
      c: { en: "from a monarchy to social democracy.", ru: "от монархии к социал-демократии.", uk: "від монархії до соціал-демократії." }
      d: { en: "from a religious state to a communist state.", ru: "от религиозного государства к коммунистическому государству.", uk: "від релігійної держави до комуністичної держави." }
    terms:
      - { de: "die Wende", en: "turning point", ru: "поворот", uk: "поворот" }
      - { de: "die Volkskammer", en: "People's Chamber", ru: "Народная палата", uk: "Народна палата" }
    status: reviewed
  - id: general-197
    rationale_de: >-
      Thüringen mit der Landeshauptstadt Erfurt liegt in der Mitte Deutschlands und gehörte zur DDR. Dort liegt auch Weimar, die Stadt von Goethe und Schiller. Die Nachbarländer Hessen und Bayern gehörten dagegen zur Bundesrepublik, ebenso Bremen im Norden.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
      uk: "Яка сучасна федеральна земля Німеччини раніше належала до території НДР?"
    options:
      a: { en: "Thuringia", ru: "Тюрингия", uk: "Тюрингія" }
      b: { en: "Hesse", ru: "Гессен", uk: "Гессен" }
      c: { en: "Bavaria", ru: "Бавария", uk: "Баварія" }
      d: { en: "Bremen", ru: "Бремен", uk: "Бремен" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring state", ru: "соседняя земля", uk: "сусідня земля" }
    status: reviewed
  - id: general-198
    rationale_de: >-
      Sachsen mit der Landeshauptstadt Dresden liegt im Osten Deutschlands und gehörte zur DDR. In Leipzig fanden 1989 die großen Montagsdemonstrationen statt. Vorsicht: Niedersachsen klingt ähnlich, liegt aber im Nordwesten und gehörte nie zur DDR – genauso wenig wie Bayern und Baden-Württemberg.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
      uk: "Яка сучасна федеральна земля Німеччини раніше належала до території НДР?"
    options:
      a: { en: "Bavaria", ru: "Бавария", uk: "Баварія" }
      b: { en: "Lower Saxony", ru: "Нижняя Саксония", uk: "Нижня Саксонія" }
      c: { en: "Saxony", ru: "Саксония", uk: "Саксонія" }
      d: { en: "Baden-Württemberg", ru: "Баден-Вюртемберг", uk: "Баден-Вюртемберг" }
    terms:
      - { de: "Sachsen", en: "Saxony", ru: "Саксония", uk: "Саксонія" }
      - { de: "Niedersachsen", en: "Lower Saxony", ru: "Нижняя Саксония", uk: "Нижня Саксонія" }
    status: reviewed
  - id: general-200
    rationale_de: >-
      Mecklenburg-Vorpommern liegt im Nordosten Deutschlands an der Ostsee; die Landeshauptstadt ist Schwerin. Es gehörte zur DDR. Schleswig-Holstein liegt auch an der Ostsee, gehörte aber nie zur DDR – genauso wenig wie Hessen und das Saarland.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
      uk: "Яка сучасна федеральна земля Німеччини раніше належала до території НДР?"
    options:
      a: { en: "Hesse", ru: "Гессен", uk: "Гессен" }
      b: { en: "Schleswig-Holstein", ru: "Шлезвиг-Гольштейн", uk: "Шлезвіг-Гольштейн" }
      c: { en: "Mecklenburg-Western Pomerania", ru: "Мекленбург-Передняя Померания", uk: "Мекленбург-Передня Померанія" }
      d: { en: "Saarland", ru: "Саар", uk: "Саарланд" }
    terms:
      - { de: "die Ostsee", en: "Baltic Sea", ru: "Балтийское море", uk: "Балтійське море" }
    status: reviewed
  - id: general-201
    rationale_de: >-
      Auf dem Gebiet der früheren DDR liegen fünf Länder: Mecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt und Thüringen. Man nennt sie oft die „neuen Bundesländer“. Dazu kommt der Ostteil Berlins. In den anderen Listen steht immer mindestens ein westdeutsches Land, zum Beispiel Hessen oder Bayern.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which of the following lists contains only federal states that belonged to the territory of the former GDR?"
      ru: "Какой из следующих списков содержит только федеральные земли, которые находились на территории бывшей ГДР?"
      uk: "Який із наведених переліків містить лише федеральні землі, що належали до території колишньої НДР?"
    options:
      a: { en: "Lower Saxony, North Rhine-Westphalia, Hesse, Schleswig-Holstein, Brandenburg", ru: "Нижняя Саксония, Северный Рейн-Вестфалия, Гессен, Шлезвиг-Гольштейн, Бранденбург", uk: "Нижня Саксонія, Північний Рейн-Вестфалія, Гессен, Шлезвіг-Гольштейн, Бранденбург" }
      b: { en: "Mecklenburg-Western Pomerania, Brandenburg, Saxony, Saxony-Anhalt, Thuringia", ru: "Мекленбург-Передняя Померания, Бранденбург, Саксония, Саксония-Анхальт, Тюрингия", uk: "Мекленбург-Передня Померанія, Бранденбург, Саксонія, Саксонія-Ангальт, Тюрингія" }
      c: { en: "Bavaria, Baden-Württemberg, Rhineland-Palatinate, Thuringia, Saxony", ru: "Бавария, Баден-Вюртемберг, Рейнланд-Пфальц, Тюрингия, Саксония", uk: "Баварія, Баден-Вюртемберг, Рейнланд-Пфальц, Тюрингія, Саксонія" }
      d: { en: "Saxony, Thuringia, Hesse, Lower Saxony, Brandenburg", ru: "Саксония, Тюрингия, Гессен, Нижняя Саксония, Бранденбург", uk: "Саксонія, Тюрингія, Гессен, Нижня Саксонія, Бранденбург" }
    terms:
      - { de: "die Auflistung", en: "list", ru: "перечень", uk: "перелік" }
