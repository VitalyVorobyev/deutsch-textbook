    status: reviewed
  - id: general-204
    rationale_de: >-
      Die Wiedervereinigung war ein Beitritt: Am 3. Oktober 1990 trat die DDR der Bundesrepublik bei, und ihre fünf Länder wurden Bundesländer. Das hatte die frei gewählte Volkskammer der DDR im August 1990 beschlossen. Seitdem gilt das Grundgesetz in ganz Deutschland – niemand hat ein Land besetzt.
    source: GG Art. 23 (alte Fassung); Einigungsvertrag Art. 1
    question:
      en: "How did the Federal Republic of Germany and the GDR become one state?"
      ru: "Как Федеративная Республика Германия и ГДР стали одним государством?"
      uk: "Як Федеративна Республіка Німеччина та НДР стали однією державою?"
    options:
      a: { en: "The Federal Republic occupied the GDR.", ru: "Федеративная Республика оккупировала ГДР.", uk: "Федеративна Республіка окупувала НДР." }
      b: { en: "Today's five eastern federal states joined the Federal Republic of Germany.", ru: "Нынешние пять восточных федеральных земель присоединились к Федеративной Республике Германия.", uk: "Нинішні п’ять східних федеральних земель приєдналися до Федеративної Республіки Німеччина." }
      c: { en: "The western federal states joined the GDR.", ru: "Западные федеральные земли присоединились к ГДР.", uk: "Західні федеральні землі приєдналися до НДР." }
      d: { en: "The GDR occupied the Federal Republic of Germany.", ru: "ГДР оккупировала Федеративную Республику Германия.", uk: "НДР окупувала Федеративну Республіку Німеччина." }
    terms:
      - { de: "der Beitritt", en: "accession", ru: "присоединение", uk: "приєднання" }
      - { de: "beitreten", en: "to accede", ru: "присоединиться", uk: "приєднуватися" }
      - { de: "besetzen", en: "to occupy", ru: "оккупировать", uk: "окупувати" }
    status: reviewed
  - id: general-205
    rationale_de: >-
      Mit dem Beitritt am 3. Oktober 1990 wurde das Gebiet der DDR Teil der Bundesrepublik – und damit sofort auch Teil der Europäischen Gemeinschaft. Aus dieser Gemeinschaft wurde 1993 die Europäische Union. Den Warschauer Pakt hatte die DDR schon vor der Einheit verlassen.
    source: "bpb: Deutsche Einheit"
    question:
      en: "With the accession of the GDR to the Federal Republic of Germany, the new federal states now also belong …"
      ru: "С присоединением ГДР к Федеративной Республике Германия новые федеральные земли теперь также входят …"
      uk: "Із приєднанням НДР до Федеративної Республіки Німеччина нові федеральні землі тепер також належать …"
    options:
      a: { en: "to the European Union.", ru: "в Европейский союз.", uk: "до Європейського Союзу." }
      b: { en: "to the Warsaw Pact.", ru: "в Варшавский договор.", uk: "до Варшавського договору." }
      c: { en: "to OPEC.", ru: "в ОПЕК.", uk: "до ОПЕК." }
      d: { en: "to the European Defence Community.", ru: "в Европейское оборонительное сообщество.", uk: "до Європейського оборонного співтовариства." }
    terms:
      - { de: "der Beitritt", en: "accession", ru: "присоединение", uk: "приєднання" }
      - { de: "die Europäische Gemeinschaft", en: "European Community", ru: "Европейское сообщество", uk: "Європейське співтовариство" }
    status: reviewed
  - id: general-215
    rationale_de: >-
      Helmut Kohl von der CDU war von 1982 bis 1998 Bundeskanzler. In seiner Regierungszeit fiel 1989 die Mauer, und am 3. Oktober 1990 wurde Deutschland wiedervereinigt. Darum nennt man ihn „Kanzler der Einheit“. Helmut Schmidt regierte vor ihm, Gerhard Schröder nach ihm.
    question:
      en: "Who is called the “Chancellor of German Unity”?"
      ru: "Кого называют «канцлером германского единства»?"
      uk: "Кого називають «канцлером німецької єдності»?"
    options:
      a: { en: "Gerhard Schröder", ru: "Герхард Шрёдер", uk: "Герхард Шредер" }
      b: { en: "Helmut Kohl", ru: "Гельмут Коль", uk: "Гельмут Коль" }
      c: { en: "Konrad Adenauer", ru: "Конрад Аденауэр", uk: "Конрад Аденауер" }
      d: { en: "Helmut Schmidt", ru: "Гельмут Шмидт", uk: "Гельмут Шмідт" }
    terms:
      - { de: "die Einheit", en: "unity", ru: "единство", uk: "єдність" }
      - { de: "die Regierungszeit", en: "time in office", ru: "время правления", uk: "період урядування" }
    status: reviewed
  - id: general-218
    rationale_de: >-
      Bei der Wiedervereinigung 1990 kamen fünf Länder zur Bundesrepublik: Brandenburg, Mecklenburg-Vorpommern, Sachsen, Sachsen-Anhalt und Thüringen. Außerdem wurden Ost- und West-Berlin zu einem Land Berlin vereinigt. Seitdem hat Deutschland 16 Bundesländer.
    source: Einigungsvertrag Art. 1
    question:
      en: "How many federal states joined the Federal Republic of Germany at reunification in 1990?"
      ru: "Сколько федеральных земель вошло в состав Федеративной Республики Германия при воссоединении в 1990 году?"
      uk: "Скільки федеральних земель додалося до Федеративної Республіки Німеччина під час возз’єднання 1990 року?"
    options:
      a: { en: "4", ru: "4", uk: "4" }
      b: { en: "5", ru: "5", uk: "5" }
      c: { en: "6", ru: "6", uk: "6" }
      d: { en: "7", ru: "7", uk: "7" }
    terms:
      - { de: "die Wiedervereinigung", en: "reunification", ru: "воссоединение", uk: "возз’єднання" }
    status: reviewed
  - id: general-219
    rationale_de: >-
      Seit der Wiedervereinigung am 3. Oktober 1990 hat Deutschland seine heutigen Grenzen. Im Zwei-plus-Vier-Vertrag von 1990 wurden sie als endgültig bestätigt – auch die Grenze zu Polen an Oder und Neiße. 1949 entstanden dagegen zwei deutsche Staaten mit einer Grenze dazwischen.
    source: Zwei-plus-Vier-Vertrag (1990) Art. 1
    question:
      en: "The Federal Republic of Germany has had its present-day borders since …"
      ru: "Федеративная Республика Германия существует в нынешних границах с …"
      uk: "Федеративна Республіка Німеччина має нинішні кордони з …"
    options:
      a: { en: "1933", ru: "1933", uk: "1933" }
      b: { en: "1949", ru: "1949", uk: "1949" }
      c: { en: "1971", ru: "1971", uk: "1971" }
      d: { en: "1990", ru: "1990", uk: "1990" }
    terms:
      - { de: "die Grenze", en: "border", ru: "граница", uk: "кордон" }
      - { de: "endgültig", en: "final", ru: "окончательный", uk: "остаточний" }
    status: reviewed
  - id: general-228
    rationale_de: >-
      Den Beitritt der DDR zur Bundesrepublik am 3. Oktober 1990 nennt man die Deutsche Wiedervereinigung oder die Deutsche Einheit. Nach über 40 Jahren Teilung war Deutschland wieder ein Staat. Die Osterweiterungen von NATO und EU kamen erst später: Polen zum Beispiel wurde 1999 NATO-Mitglied und 2004 EU-Mitglied.
    source: "bpb: Deutsche Einheit"
    question:
      en: "What is the accession of the GDR to the Federal Republic of Germany in 1990 generally called?"
      ru: "Как обычно называют присоединение ГДР к Федеративной Республике Германия в 1990 году?"
      uk: "Як зазвичай називають приєднання НДР до Федеративної Республіки Німеччина в 1990 році?"
