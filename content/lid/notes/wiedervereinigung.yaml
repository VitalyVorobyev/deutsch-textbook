notes:
  - id: general-166
    rationale_de: >-
      „Wir sind das Volk!“ riefen die Menschen im Herbst 1989 bei den Montagsdemonstrationen in der DDR, besonders in Leipzig. Damit sagten sie: Nicht die SED soll bestimmen, sondern das Volk. Am 9. Oktober 1989 demonstrierten in Leipzig etwa 70.000 Menschen friedlich, und der Staat griff nicht ein.
    source: "bpb: Deutsche Einheit"
    question:
      en: "At which demonstrations in Germany did people shout “We are the people”?"
      ru: "На каких демонстрациях в Германии люди скандировали «Мы — народ»?"
    options:
      a: { en: "at the workers' uprising of 1953 in the GDR", ru: "во время рабочего восстания 1953 года в ГДР" }
      b: { en: "at the 1968 demonstrations in the Federal Republic of Germany", ru: "на демонстрациях 1968 года в Федеративной Республике Германия" }
      c: { en: "at the anti-nuclear demonstrations of 1985 in the Federal Republic of Germany", ru: "на демонстрациях против атомной энергетики 1985 года в Федеративной Республике Германия" }
      d: { en: "at the Monday demonstrations of 1989 in the GDR", ru: "на понедельничных демонстрациях 1989 года в ГДР" }
    terms:
      - { de: "die Montagsdemonstration", en: "Monday demonstration", ru: "понедельничная демонстрация" }
      - { de: "das Volk", en: "the people", ru: "народ" }
    status: reviewed
  - id: general-191
    rationale_de: >-
      Am 9. November 1989 wurde die Mauer in Berlin geöffnet. Am Abend kündigte die DDR-Führung neue Reiseregeln an, und noch in derselben Nacht öffneten sich die Grenzübergänge. Weniger als ein Jahr später, am 3. Oktober 1990, war Deutschland wiedervereinigt.
    source: "bpb: Deutsche Einheit"
    question:
      en: "When was the Wall in Berlin opened to everyone?"
      ru: "Когда стена в Берлине была открыта для всех?"
    options:
      a: { en: "1987", ru: "1987" }
      b: { en: "1989", ru: "1989" }
      c: { en: "1992", ru: "1992" }
      d: { en: "1995", ru: "1995" }
    terms:
      - { de: "der Grenzübergang", en: "border crossing", ru: "пограничный переход" }
    status: reviewed
  - id: general-192
    rationale_de: >-
      Brandenburg liegt im Osten Deutschlands rund um Berlin; die Landeshauptstadt ist Potsdam. Es gehört zu den fünf Ländern, die 1990 auf dem Gebiet der DDR wieder gegründet wurden. Bayern, das Saarland und Hessen haben nie zur DDR gehört.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
    options:
      a: { en: "Brandenburg", ru: "Бранденбург" }
      b: { en: "Bavaria", ru: "Бавария" }
      c: { en: "Saarland", ru: "Саар" }
      d: { en: "Hesse", ru: "Гессен" }
    terms:
      - { de: "das Bundesland", en: "federal state", ru: "федеральная земля" }
      - { de: "das Gebiet", en: "territory", ru: "территория" }
    status: reviewed
  - id: general-194
    rationale_de: >-
      Am 3. Oktober 1990 trat die DDR der Bundesrepublik bei, und Deutschland war wieder ein Staat. Darum ist der 3. Oktober der Tag der Deutschen Einheit. Er ist der Nationalfeiertag und in ganz Deutschland ein gesetzlicher Feiertag.
    source: Einigungsvertrag Art. 2 Abs. 2
    question:
      en: "On 3 October, Germany celebrates the Day of German …"
      ru: "3 октября в Германии отмечают День …"
    options:
      a: { en: "Unity.", ru: "немецкого единства." }
      b: { en: "Nation.", ru: "немецкой нации." }
      c: { en: "Federal States.", ru: "немецких федеральных земель." }
      d: { en: "Cities.", ru: "немецких городов." }
    terms:
      - { de: "die Einheit", en: "unity", ru: "единство" }
      - { de: "der Nationalfeiertag", en: "national holiday", ru: "национальный праздник" }
    status: reviewed
  - id: general-195
    rationale_de: >-
      Sachsen-Anhalt mit der Landeshauptstadt Magdeburg liegt in der Mitte Ostdeutschlands und gehörte zur DDR. Bekannt ist dort zum Beispiel die Lutherstadt Wittenberg. Hessen, Nordrhein-Westfalen und das Saarland liegen im Westen und haben nie zur DDR gehört.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
    options:
      a: { en: "Hesse", ru: "Гессен" }
      b: { en: "Saxony-Anhalt", ru: "Саксония-Анхальт" }
      c: { en: "North Rhine-Westphalia", ru: "Северный Рейн-Вестфалия" }
      d: { en: "Saarland", ru: "Саар" }
    terms:
      - { de: "die Landeshauptstadt", en: "state capital", ru: "столица земли" }
    status: reviewed
  - id: general-196
    rationale_de: >-
      Im Herbst 1989 demonstrierten in der DDR immer mehr Menschen für Freiheit und Demokratie. Die SED verlor ihre Macht, die Mauer wurde geöffnet, und im März 1990 gab es die ersten freien Wahlen zur Volkskammer. Diese Veränderung von der Diktatur zur Demokratie nennt man „die Wende“ oder die Friedliche Revolution.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Why is the period in autumn 1989 in the GDR called “Die Wende” (the turning point)? During this time the GDR changed politically …"
      ru: "Почему период осенью 1989 года в ГДР называют «Die Wende» («поворот»)? В это время ГДР политически изменилась …"
    options:
      a: { en: "from a dictatorship to a democracy.", ru: "от диктатуры к демократии." }
      b: { en: "from a liberal market economy to socialism.", ru: "от либеральной рыночной экономики к социализму." }
      c: { en: "from a monarchy to social democracy.", ru: "от монархии к социал-демократии." }
      d: { en: "from a religious state to a communist state.", ru: "от религиозного государства к коммунистическому государству." }
    terms:
      - { de: "die Wende", en: "turning point", ru: "поворот" }
      - { de: "die Volkskammer", en: "People's Chamber", ru: "Народная палата" }
    status: reviewed
  - id: general-197
    rationale_de: >-
      Thüringen mit der Landeshauptstadt Erfurt liegt in der Mitte Deutschlands und gehörte zur DDR. Dort liegt auch Weimar, die Stadt von Goethe und Schiller. Die Nachbarländer Hessen und Bayern gehörten dagegen zur Bundesrepublik, ebenso Bremen im Norden.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
    options:
      a: { en: "Thuringia", ru: "Тюрингия" }
      b: { en: "Hesse", ru: "Гессен" }
      c: { en: "Bavaria", ru: "Бавария" }
      d: { en: "Bremen", ru: "Бремен" }
    terms:
      - { de: "das Nachbarland", en: "neighbouring state", ru: "соседняя земля" }
    status: reviewed
  - id: general-198
    rationale_de: >-
      Sachsen mit der Landeshauptstadt Dresden liegt im Osten Deutschlands und gehörte zur DDR. In Leipzig fanden 1989 die großen Montagsdemonstrationen statt. Vorsicht: Niedersachsen klingt ähnlich, liegt aber im Nordwesten und gehörte nie zur DDR – genauso wenig wie Bayern und Baden-Württemberg.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
    options:
      a: { en: "Bavaria", ru: "Бавария" }
      b: { en: "Lower Saxony", ru: "Нижняя Саксония" }
      c: { en: "Saxony", ru: "Саксония" }
      d: { en: "Baden-Württemberg", ru: "Баден-Вюртемберг" }
    terms:
      - { de: "Sachsen", en: "Saxony", ru: "Саксония" }
      - { de: "Niedersachsen", en: "Lower Saxony", ru: "Нижняя Саксония" }
    status: reviewed
  - id: general-200
    rationale_de: >-
      Mecklenburg-Vorpommern liegt im Nordosten Deutschlands an der Ostsee; die Landeshauptstadt ist Schwerin. Es gehörte zur DDR. Schleswig-Holstein liegt auch an der Ostsee, gehörte aber nie zur DDR – genauso wenig wie Hessen und das Saarland.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
    options:
      a: { en: "Hesse", ru: "Гессен" }
      b: { en: "Schleswig-Holstein", ru: "Шлезвиг-Гольштейн" }
      c: { en: "Mecklenburg-Western Pomerania", ru: "Мекленбург-Передняя Померания" }
      d: { en: "Saarland", ru: "Саар" }
    terms:
      - { de: "die Ostsee", en: "Baltic Sea", ru: "Балтийское море" }
    status: reviewed
  - id: general-201
    rationale_de: >-
      Auf dem Gebiet der früheren DDR liegen fünf Länder: Mecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt und Thüringen. Man nennt sie oft die „neuen Bundesländer“. Dazu kommt der Ostteil Berlins. In den anderen Listen steht immer mindestens ein westdeutsches Land, zum Beispiel Hessen oder Bayern.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which of the following lists contains only federal states that belonged to the territory of the former GDR?"
      ru: "Какой из следующих списков содержит только федеральные земли, которые находились на территории бывшей ГДР?"
    options:
      a: { en: "Lower Saxony, North Rhine-Westphalia, Hesse, Schleswig-Holstein, Brandenburg", ru: "Нижняя Саксония, Северный Рейн-Вестфалия, Гессен, Шлезвиг-Гольштейн, Бранденбург" }
      b: { en: "Mecklenburg-Western Pomerania, Brandenburg, Saxony, Saxony-Anhalt, Thuringia", ru: "Мекленбург-Передняя Померания, Бранденбург, Саксония, Саксония-Анхальт, Тюрингия" }
      c: { en: "Bavaria, Baden-Württemberg, Rhineland-Palatinate, Thuringia, Saxony", ru: "Бавария, Баден-Вюртемберг, Рейнланд-Пфальц, Тюрингия, Саксония" }
      d: { en: "Saxony, Thuringia, Hesse, Lower Saxony, Brandenburg", ru: "Саксония, Тюрингия, Гессен, Нижняя Саксония, Бранденбург" }
    terms:
      - { de: "die Auflistung", en: "list", ru: "перечень" }
      - { de: "die neuen Bundesländer", en: "the new federal states", ru: "новые федеральные земли" }
    status: reviewed
  - id: general-204
    rationale_de: >-
      Die Wiedervereinigung war ein Beitritt: Am 3. Oktober 1990 trat die DDR der Bundesrepublik bei, und ihre fünf Länder wurden Bundesländer. Das hatte die frei gewählte Volkskammer der DDR im August 1990 beschlossen. Seitdem gilt das Grundgesetz in ganz Deutschland – niemand hat ein Land besetzt.
    source: GG Art. 23 (alte Fassung); Einigungsvertrag Art. 1
    question:
      en: "How did the Federal Republic of Germany and the GDR become one state?"
      ru: "Как Федеративная Республика Германия и ГДР стали одним государством?"
    options:
      a: { en: "The Federal Republic occupied the GDR.", ru: "Федеративная Республика оккупировала ГДР." }
      b: { en: "Today's five eastern federal states joined the Federal Republic of Germany.", ru: "Нынешние пять восточных федеральных земель присоединились к Федеративной Республике Германия." }
      c: { en: "The western federal states joined the GDR.", ru: "Западные федеральные земли присоединились к ГДР." }
      d: { en: "The GDR occupied the Federal Republic of Germany.", ru: "ГДР оккупировала Федеративную Республику Германия." }
    terms:
      - { de: "der Beitritt", en: "accession", ru: "присоединение" }
      - { de: "beitreten", en: "to accede", ru: "присоединиться" }
      - { de: "besetzen", en: "to occupy", ru: "оккупировать" }
    status: reviewed
  - id: general-205
    rationale_de: >-
      Mit dem Beitritt am 3. Oktober 1990 wurde das Gebiet der DDR Teil der Bundesrepublik – und damit sofort auch Teil der Europäischen Gemeinschaft. Aus dieser Gemeinschaft wurde 1993 die Europäische Union. Den Warschauer Pakt hatte die DDR schon vor der Einheit verlassen.
    source: "bpb: Deutsche Einheit"
    question:
      en: "With the accession of the GDR to the Federal Republic of Germany, the new federal states now also belong …"
      ru: "С присоединением ГДР к Федеративной Республике Германия новые федеральные земли теперь также входят …"
    options:
      a: { en: "to the European Union.", ru: "в Европейский союз." }
      b: { en: "to the Warsaw Pact.", ru: "в Варшавский договор." }
      c: { en: "to OPEC.", ru: "в ОПЕК." }
      d: { en: "to the European Defence Community.", ru: "в Европейское оборонительное сообщество." }
    terms:
      - { de: "der Beitritt", en: "accession", ru: "присоединение" }
      - { de: "die Europäische Gemeinschaft", en: "European Community", ru: "Европейское сообщество" }
    status: reviewed
  - id: general-215
    rationale_de: >-
      Helmut Kohl von der CDU war von 1982 bis 1998 Bundeskanzler. In seiner Regierungszeit fiel 1989 die Mauer, und am 3. Oktober 1990 wurde Deutschland wiedervereinigt. Darum nennt man ihn „Kanzler der Einheit“. Helmut Schmidt regierte vor ihm, Gerhard Schröder nach ihm.
    question:
      en: "Who is called the “Chancellor of German Unity”?"
      ru: "Кого называют «канцлером германского единства»?"
    options:
      a: { en: "Gerhard Schröder", ru: "Герхард Шрёдер" }
      b: { en: "Helmut Kohl", ru: "Гельмут Коль" }
      c: { en: "Konrad Adenauer", ru: "Конрад Аденауэр" }
      d: { en: "Helmut Schmidt", ru: "Гельмут Шмидт" }
    terms:
      - { de: "die Einheit", en: "unity", ru: "единство" }
      - { de: "die Regierungszeit", en: "time in office", ru: "время правления" }
    status: reviewed
  - id: general-218
    rationale_de: >-
      Bei der Wiedervereinigung 1990 kamen fünf Länder zur Bundesrepublik: Brandenburg, Mecklenburg-Vorpommern, Sachsen, Sachsen-Anhalt und Thüringen. Außerdem wurden Ost- und West-Berlin zu einem Land Berlin vereinigt. Seitdem hat Deutschland 16 Bundesländer.
    source: Einigungsvertrag Art. 1
    question:
      en: "How many federal states joined the Federal Republic of Germany at reunification in 1990?"
      ru: "Сколько федеральных земель вошло в состав Федеративной Республики Германия при воссоединении в 1990 году?"
    options:
      a: { en: "4", ru: "4" }
      b: { en: "5", ru: "5" }
      c: { en: "6", ru: "6" }
      d: { en: "7", ru: "7" }
    terms:
      - { de: "die Wiedervereinigung", en: "reunification", ru: "воссоединение" }
    status: reviewed
  - id: general-219
    rationale_de: >-
      Seit der Wiedervereinigung am 3. Oktober 1990 hat Deutschland seine heutigen Grenzen. Im Zwei-plus-Vier-Vertrag von 1990 wurden sie als endgültig bestätigt – auch die Grenze zu Polen an Oder und Neiße. 1949 entstanden dagegen zwei deutsche Staaten mit einer Grenze dazwischen.
    source: Zwei-plus-Vier-Vertrag (1990) Art. 1
    question:
      en: "The Federal Republic of Germany has had its present-day borders since …"
      ru: "Федеративная Республика Германия существует в нынешних границах с …"
    options:
      a: { en: "1933", ru: "1933" }
      b: { en: "1949", ru: "1949" }
      c: { en: "1971", ru: "1971" }
      d: { en: "1990", ru: "1990" }
    terms:
      - { de: "die Grenze", en: "border", ru: "граница" }
      - { de: "endgültig", en: "final", ru: "окончательный" }
    status: reviewed
  - id: general-228
    rationale_de: >-
      Den Beitritt der DDR zur Bundesrepublik am 3. Oktober 1990 nennt man die Deutsche Wiedervereinigung oder die Deutsche Einheit. Nach über 40 Jahren Teilung war Deutschland wieder ein Staat. Die Osterweiterungen von NATO und EU kamen erst später: Polen zum Beispiel wurde 1999 NATO-Mitglied und 2004 EU-Mitglied.
    source: "bpb: Deutsche Einheit"
    question:
      en: "What is the accession of the GDR to the Federal Republic of Germany in 1990 generally called?"
      ru: "Как обычно называют присоединение ГДР к Федеративной Республике Германия в 1990 году?"
    options:
      a: { en: "NATO's eastward enlargement", ru: "расширение НАТО на восток" }
      b: { en: "the EU's eastward enlargement", ru: "расширение ЕС на восток" }
      c: { en: "German reunification", ru: "воссоединение Германии" }
      d: { en: "European Community", ru: "Европейское сообщество" }
    terms:
      - { de: "die Wiedervereinigung", en: "reunification", ru: "воссоединение" }
      - { de: "die Osterweiterung", en: "eastward enlargement", ru: "расширение на восток" }
    status: reviewed
