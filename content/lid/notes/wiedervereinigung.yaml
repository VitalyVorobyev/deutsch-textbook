notes:
  - id: general-166
    rationale_de: >-
      „Wir sind das Volk!“ riefen die Menschen im Herbst 1989 bei den Montagsdemonstrationen in der DDR, besonders in Leipzig. Damit sagten sie: Nicht die SED soll bestimmen, sondern das Volk. Am 9. Oktober 1989 demonstrierten in Leipzig etwa 70.000 Menschen friedlich, und der Staat griff nicht ein.
    source: "bpb: Deutsche Einheit"
    question:
      en: "At which demonstrations in Germany did people shout “We are the people”?"
      ru: "На каких демонстрациях в Германии люди скандировали «Мы — народ»?"
      uk: "На яких демонстраціях у Німеччині люди вигукували «Ми — народ»?"
    options:
      a: { en: "at the workers' uprising of 1953 in the GDR", ru: "во время рабочего восстания 1953 года в ГДР", uk: "під час робітничого повстання 1953 року в НДР" }
      b: { en: "at the 1968 demonstrations in the Federal Republic of Germany", ru: "на демонстрациях 1968 года в Федеративной Республике Германия", uk: "на демонстраціях 1968 року у Федеративній Республіці Німеччина" }
      c: { en: "at the anti-nuclear demonstrations of 1985 in the Federal Republic of Germany", ru: "на демонстрациях против атомной энергетики 1985 года в Федеративной Республике Германия", uk: "на демонстраціях проти атомної енергетики 1985 року у Федеративній Республіці Німеччина" }
      d: { en: "at the Monday demonstrations of 1989 in the GDR", ru: "на понедельничных демонстрациях 1989 года в ГДР", uk: "на понеділкових демонстраціях 1989 року в НДР" }
    terms:
      - { de: "die Montagsdemonstration", en: "Monday demonstration", ru: "понедельничная демонстрация", uk: "понеділкова демонстрація" }
      - { de: "das Volk", en: "the people", ru: "народ", uk: "народ" }
    status: reviewed
  - id: general-191
    rationale_de: >-
      Am 9. November 1989 wurde die Mauer in Berlin geöffnet. Am Abend kündigte die DDR-Führung neue Reiseregeln an, und noch in derselben Nacht öffneten sich die Grenzübergänge. Weniger als ein Jahr später, am 3. Oktober 1990, war Deutschland wiedervereinigt.
    source: "bpb: Deutsche Einheit"
    question:
      en: "When was the Wall in Berlin opened to everyone?"
      ru: "Когда стена в Берлине была открыта для всех?"
      uk: "Коли мур у Берліні відкрили для всіх?"
    options:
      a: { en: "1987", ru: "1987", uk: "1987" }
      b: { en: "1989", ru: "1989", uk: "1989" }
      c: { en: "1992", ru: "1992", uk: "1992" }
      d: { en: "1995", ru: "1995", uk: "1995" }
    terms:
      - { de: "der Grenzübergang", en: "border crossing", ru: "пограничный переход", uk: "прикордонний пункт пропуску" }
    status: reviewed
  - id: general-192
    rationale_de: >-
      Brandenburg liegt im Osten Deutschlands rund um Berlin; die Landeshauptstadt ist Potsdam. Es gehört zu den fünf Ländern, die 1990 auf dem Gebiet der DDR wieder gegründet wurden. Bayern, das Saarland und Hessen haben nie zur DDR gehört.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
      uk: "Яка сучасна федеральна земля Німеччини раніше належала до території НДР?"
    options:
      a: { en: "Brandenburg", ru: "Бранденбург", uk: "Бранденбург" }
      b: { en: "Bavaria", ru: "Бавария", uk: "Баварія" }
      c: { en: "Saarland", ru: "Саар", uk: "Саарланд" }
      d: { en: "Hesse", ru: "Гессен", uk: "Гессен" }
    terms:
      - { de: "das Bundesland", en: "federal state", ru: "федеральная земля", uk: "федеральна земля" }
      - { de: "das Gebiet", en: "territory", ru: "территория", uk: "територія" }
    status: reviewed
  - id: general-194
    rationale_de: >-
      Am 3. Oktober 1990 trat die DDR der Bundesrepublik bei, und Deutschland war wieder ein Staat. Darum ist der 3. Oktober der Tag der Deutschen Einheit. Er ist der Nationalfeiertag und in ganz Deutschland ein gesetzlicher Feiertag.
    source: Einigungsvertrag Art. 2 Abs. 2
    question:
      en: "On 3 October, Germany celebrates the Day of German …"
      ru: "3 октября в Германии отмечают День …"
      uk: "3 жовтня в Німеччині відзначають День …"
    options:
      a: { en: "Unity.", ru: "немецкого единства.", uk: "німецької єдності." }
      b: { en: "Nation.", ru: "немецкой нации.", uk: "німецької нації." }
      c: { en: "Federal States.", ru: "немецких федеральных земель.", uk: "німецьких федеральних земель." }
      d: { en: "Cities.", ru: "немецких городов.", uk: "німецьких міст." }
    terms:
      - { de: "die Einheit", en: "unity", ru: "единство", uk: "єдність" }
      - { de: "der Nationalfeiertag", en: "national holiday", ru: "национальный праздник", uk: "національне свято" }
    status: reviewed
  - id: general-195
    rationale_de: >-
      Sachsen-Anhalt mit der Landeshauptstadt Magdeburg liegt in der Mitte Ostdeutschlands und gehörte zur DDR. Bekannt ist dort zum Beispiel die Lutherstadt Wittenberg. Hessen, Nordrhein-Westfalen und das Saarland liegen im Westen und haben nie zur DDR gehört.
    source: "bpb: Deutsche Einheit"
    question:
      en: "Which present-day German federal state used to be part of the territory of the GDR?"
      ru: "Какая из нынешних федеральных земель Германии раньше находилась на территории ГДР?"
      uk: "Яка сучасна федеральна земля Німеччини раніше належала до території НДР?"
    options:
      a: { en: "Hesse", ru: "Гессен", uk: "Гессен" }
      b: { en: "Saxony-Anhalt", ru: "Саксония-Анхальт", uk: "Саксонія-Ангальт" }
      c: { en: "North Rhine-Westphalia", ru: "Северный Рейн-Вестфалия", uk: "Північний Рейн-Вестфалія" }
      d: { en: "Saarland", ru: "Саар", uk: "Саарланд" }
    terms:
      - { de: "die Landeshauptstadt", en: "state capital", ru: "столица земли", uk: "столиця землі" }
