notes:
  - id: general-139
    rationale_de: >-
      Wenn jemand eine Straftat begangen hat, ermittelt die Staatsanwaltschaft. Gibt es genug Beweise, erhebt sie Anklage, und das Gericht führt einen Strafprozess. Falschparken ist dagegen keine Straftat, sondern eine Ordnungswidrigkeit: Man zahlt Geld, aber normalerweise gibt es keinen Prozess. Eine andere Religion oder Meinung schützt das Grundgesetz (Artikel 4 und 5).
    source: StPO § 170; GG Art. 4, Art. 5
    question:
      en: "When does a case go to trial in court in Germany? When someone …"
      ru: "Когда в Германии дело доходит до судебного процесса? Когда кто-то …"
      uk: "Коли в Німеччині справа доходить до судового процесу? Коли хтось …"
    options:
      a: { en: "converts to another religion.", ru: "переходит в другую религию.", uk: "переходить до іншої релігії." }
      b: { en: "has committed a criminal offence and is charged.", ru: "совершил преступление и ему предъявлено обвинение.", uk: "вчинив злочин і його обвинувачують." }
      c: { en: "holds an opinion different from the government's.", ru: "придерживается мнения, отличного от мнения правительства.", uk: "дотримується іншої думки, ніж уряд." }
      d: { en: "has parked their car illegally and it is towed away.", ru: "неправильно припарковал машину и её эвакуировали.", uk: "неправильно припаркував свій автомобіль і його евакуюють." }
    terms:
      - { de: "die Straftat", en: "criminal offence", ru: "преступление", uk: "злочин" }
      - { de: "anklagen", en: "to charge", ru: "предъявлять обвинение", uk: "обвинувачувати" }
      - { de: "die Ordnungswidrigkeit", en: "regulatory offence", ru: "административное правонарушение", uk: "адміністративне правопорушення" }
    status: reviewed
  - id: general-140
    rationale_de: >-
      Schöffinnen und Schöffen sind ehrenamtliche Richterinnen und Richter. Sie sitzen in Strafprozessen neben den Berufsrichtern und entscheiden mit gleicher Stimme über Schuld und Strafe (Gerichtsverfassungsgesetz, § 30). Sie müssen nicht Jura studiert haben – so bringen normale Bürgerinnen und Bürger ihre Sicht ins Gericht.
    source: GVG § 30
    question:
      en: "What does a “Schöffin/Schöffe” do in Germany? She/He …"
      ru: "Чем занимается «Schöffin/Schöffe» в Германии? Она/он …"
      uk: "Чим займається «Schöffin/Schöffe» в Німеччині? Вона/він …"
    options:
      a: { en: "decides together with judges on guilt and punishment.", ru: "вместе с судьями решает вопрос о вине и наказании.", uk: "разом із суддями вирішує питання про вину та покарання." }
      b: { en: "gives citizens legal advice.", ru: "даёт гражданам юридические консультации.", uk: "дає громадянам юридичні поради." }
      c: { en: "issues official documents.", ru: "выдаёт официальные документы.", uk: "видає офіційні документи." }
      d: { en: "defends the accused.", ru: "защищает обвиняемую или обвиняемого.", uk: "захищає обвинувачену чи обвинуваченого." }
    terms:
      - { de: "die Schöffin / der Schöffe", en: "lay judge", ru: "народный заседатель", uk: "народний засідатель" }
      - { de: "die Schuld", en: "guilt", ru: "вина", uk: "вина" }
      - { de: "die Strafe", en: "punishment", ru: "наказание", uk: "покарання" }
    status: reviewed
  - id: general-141
    rationale_de: >-
      Eine Rechtsanwältin oder ein Rechtsanwalt berät Menschen bei rechtlichen Problemen und vertritt sie vor Gericht. Die Richterin oder der Richter muss dagegen neutral bleiben und entscheidet den Fall. Die Staatsanwältin oder der Staatsanwalt erhebt im Strafprozess die Anklage.
    source: BRAO § 3
    question:
      en: "Who advises people on legal questions in Germany and represents them in court?"
      ru: "Кто в Германии консультирует людей по юридическим вопросам и представляет их в суде?"
      uk: "Хто в Німеччині консультує людей з правових питань і представляє їх у суді?"
    options:
      a: { en: "a lawyer", ru: "адвокат", uk: "адвокат" }
      b: { en: "a judge", ru: "судья", uk: "суддя" }
      c: { en: "a lay judge", ru: "народный заседатель", uk: "народний засідатель" }
      d: { en: "a public prosecutor", ru: "прокурор", uk: "прокурор" }
    terms:
      - { de: "die Rechtsanwältin / der Rechtsanwalt", en: "lawyer", ru: "адвокат", uk: "адвокат" }
      - { de: "vertreten", en: "to represent", ru: "представлять", uk: "представляти" }
      - { de: "die Staatsanwältin / der Staatsanwalt", en: "public prosecutor", ru: "прокурор", uk: "прокурор" }
    status: reviewed
  - id: general-142
    rationale_de: >-
      Richterinnen und Richter arbeiten an einem Gericht und sprechen Urteile. Sie sind unabhängig und nur an das Gesetz gebunden (Grundgesetz, Artikel 97). Gesetze ändern darf dagegen nur das Parlament, und vor Gericht vertreten Anwältinnen und Anwälte die Menschen.
    source: GG Art. 92, Art. 97
    question:
      en: "What is the main task of a judge in Germany? A judge …"
      ru: "Какова главная задача судьи в Германии? Судья …"
      uk: "Яке головне завдання судді в Німеччині? Суддя …"
    options:
      a: { en: "represents citizens before a court.", ru: "представляет граждан в суде.", uk: "представляє громадян у суді." }
      b: { en: "works at a court and delivers judgments.", ru: "работает в суде и выносит судебные решения.", uk: "працює в суді й ухвалює судові рішення." }
      c: { en: "changes laws.", ru: "изменяет законы.", uk: "змінює закони." }
      d: { en: "looks after young people in court.", ru: "сопровождает подростков в суде.", uk: "опікується підлітками в суді." }
    terms:
      - { de: "das Urteil", en: "judgment", ru: "судебное решение", uk: "судове рішення" }
      - { de: "unabhängig", en: "independent", ru: "независимый", uk: "незалежний" }
    status: reviewed
  - id: general-143
    rationale_de: >-
      Im Staat gibt es drei Gewalten: Die Legislative macht die Gesetze, die Exekutive führt sie aus, und die Judikative spricht Recht. Richterinnen und Richter sprechen Recht, also gehören sie zur Judikative (Grundgesetz, Artikel 20 und 92). Eine „Operative“ gibt es bei der Gewaltenteilung nicht.
    source: GG Art. 20 Abs. 2, Art. 92
    question:
      en: "A judge in Germany belongs to the …"
      ru: "Судья в Германии относится к …"
      uk: "Суддя в Німеччині належить до …"
    options:
      a: { en: "judiciary.", ru: "судебной власти.", uk: "судової влади." }
      b: { en: "executive.", ru: "исполнительной власти.", uk: "виконавчої влади." }
      c: { en: "operative.", ru: "«оперативной» власти.", uk: "оперативної влади." }
      d: { en: "legislature.", ru: "законодательной власти.", uk: "законодавчої влади." }
    terms:
      - { de: "die Judikative", en: "judiciary", ru: "судебная власть", uk: "судова влада" }
      - { de: "die Gewaltenteilung", en: "separation of powers", ru: "разделение властей", uk: "поділ влади" }
    status: reviewed
  - id: general-144
    rationale_de: >-
      Richterinnen und Richter gehören zur rechtsprechenden Gewalt – das ist das deutsche Wort für Judikative. Das Grundgesetz sagt in Artikel 92: Die rechtsprechende Gewalt ist den Richtern anvertraut. Die gesetzgebende Gewalt ist das Parlament, die vollziehende Gewalt sind Regierung und Verwaltung.
    source: GG Art. 20 Abs. 2, Art. 92
    question:
      en: "In Germany, a judge belongs to the …"
      ru: "В Германии судья относится к …"
      uk: "У Німеччині суддя належить до …"
    options:
      a: { en: "executive power.", ru: "исполнительной власти.", uk: "виконавчої влади." }
      b: { en: "judicial power.", ru: "судебной власти.", uk: "судової влади." }
      c: { en: "planning power.", ru: "планирующей власти.", uk: "планувальної влади." }
      d: { en: "legislative power.", ru: "законодательной власти.", uk: "законодавчої влади." }
    terms:
      - { de: "die rechtsprechende Gewalt", en: "judicial power", ru: "судебная власть", uk: "судова влада" }
      - { de: "die vollziehende Gewalt", en: "executive power", ru: "исполнительная власть", uk: "виконавча влада" }
      - { de: "die gesetzgebende Gewalt", en: "legislative power", ru: "законодательная власть", uk: "законодавча влада" }
    status: reviewed
  - id: general-145
    rationale_de: >-
      Die Staatsgewalt ist in Deutschland auf drei Gewalten verteilt, damit niemand zu viel Macht hat. Richterinnen und Richter arbeiten für die Judikative, die rechtsprechende Gewalt. Die Presse nennt man manchmal die „vierte Gewalt“, weil sie die Mächtigen kontrolliert – sie ist aber keine Staatsgewalt, sondern frei und unabhängig.
    source: GG Art. 20 Abs. 2
    question:
      en: "In Germany, state power is divided. For which state power does a judge work? For the …"
      ru: "В Германии государственная власть разделена. На какую ветвь власти работает судья? На …"
      uk: "У Німеччині державна влада поділена. На яку гілку державної влади працює суддя? На …"
    options:
      a: { en: "judiciary", ru: "судебную власть", uk: "судову владу" }
      b: { en: "executive", ru: "исполнительную власть", uk: "виконавчу владу" }
      c: { en: "press", ru: "прессу", uk: "пресу" }
      d: { en: "legislature", ru: "законодательную власть", uk: "законодавчу владу" }
    terms:
      - { de: "die Staatsgewalt", en: "state power", ru: "государственная власть", uk: "державна влада" }
      - { de: "die Judikative", en: "judiciary", ru: "судебная власть", uk: "судова влада" }
    status: reviewed
  - id: general-146
    rationale_de: >-
      Ein Verfahren vor Gericht heißt Prozess, zum Beispiel Strafprozess oder Zivilprozess. „Prozedur“ klingt ähnlich, ist aber kein Wort für ein Gerichtsverfahren. Ein Protokoll ist ein schriftlicher Bericht, zum Beispiel über eine Sitzung im Gericht.
    question:
      en: "What are proceedings before a court called in Germany?"
      ru: "Как в Германии называется разбирательство в суде?"
      uk: "Як у Німеччині називають провадження в суді?"
    options:
      a: { en: "programme", ru: "программа", uk: "програма" }
      b: { en: "procedure", ru: "процедура", uk: "процедура" }
      c: { en: "record", ru: "протокол", uk: "протокол" }
      d: { en: "trial", ru: "процесс", uk: "процес" }
    terms:
      - { de: "das Verfahren", en: "proceedings", ru: "разбирательство", uk: "провадження" }
      - { de: "der Prozess", en: "trial", ru: "судебный процесс", uk: "судовий процес" }
    status: reviewed
  - id: general-147
    rationale_de: >-
      Richterinnen und Richter sprechen Recht: Sie hören beide Seiten an und entscheiden dann nach dem Gesetz. Gesetze erlassen dagegen die Parlamente, und das Land regiert die Regierung. So sind die drei Gewalten getrennt (Grundgesetz, Artikel 20).
    source: GG Art. 20 Abs. 2, Art. 92
    question:
      en: "What is the work of a judge in Germany?"
      ru: "В чём состоит работа судьи в Германии?"
      uk: "У чому полягає робота судді в Німеччині?"
    options:
      a: { en: "governing Germany", ru: "управлять Германией", uk: "керувати Німеччиною" }
      b: { en: "administering justice", ru: "вершить правосудие", uk: "здійснювати правосуддя" }
      c: { en: "drawing up plans", ru: "составлять планы", uk: "складати плани" }
      d: { en: "enacting laws", ru: "издавать законы", uk: "ухвалювати закони" }
    terms:
      - { de: "Recht sprechen", en: "to administer justice", ru: "вершить правосудие", uk: "здійснювати правосуддя" }
      - { de: "erlassen", en: "to enact", ru: "издавать", uk: "ухвалювати" }
    status: reviewed
  - id: general-148
    rationale_de: >-
      Die Polizei achtet darauf, dass die Gesetze eingehalten werden. Sie hilft bei Gefahr und ermittelt bei Straftaten. Das Land verteidigt dagegen die Bundeswehr, und Gesetze beschließt das Parlament. Telefone abhören darf die Polizei nur in Ausnahmefällen, denn das Grundgesetz schützt das Fernmeldegeheimnis (Artikel 10).
    source: GG Art. 10, Art. 87a
    question:
      en: "What is one task of the police in Germany?"
      ru: "Что входит в задачи полиции в Германии?"
      uk: "Що є одним із завдань поліції в Німеччині?"
    options:
      a: { en: "to defend the country", ru: "защищать страну", uk: "захищати країну" }
      b: { en: "to eavesdrop on citizens", ru: "прослушивать граждан", uk: "прослуховувати громадян" }
      c: { en: "to pass laws", ru: "принимать законы", uk: "ухвалювати закони" }
      d: { en: "to monitor compliance with the laws", ru: "следить за соблюдением законов", uk: "стежити за дотриманням законів" }
    terms:
      - { de: "die Einhaltung", en: "compliance", ru: "соблюдение", uk: "дотримання" }
      - { de: "überwachen", en: "to monitor", ru: "следить", uk: "стежити, наглядати" }
      - { de: "abhören", en: "to eavesdrop", ru: "прослушивать", uk: "прослуховувати" }
    status: reviewed
  - id: general-150
    rationale_de: >-
      Schöffinnen und Schöffen sind ehrenamtliche Richterinnen und Richter: Sie bekommen keinen Lohn, nur eine Entschädigung. Sie werden für fünf Jahre gewählt und müssen nicht Jura studiert haben. Wer gewählt wird, muss das Amt normalerweise übernehmen.
    source: GVG § 31, § 42
    question:
      en: "In Germany, a “Gerichtsschöffin/Gerichtsschöffe” is …"
      ru: "В Германии «Gerichtsschöffin/Gerichtsschöffe» — это …"
      uk: "У Німеччині «Gerichtsschöffin/Gerichtsschöffe» — це …"
    options:
      a: { en: "the deputy of the head of a town.", ru: "заместительница или заместитель главы города.", uk: "заступниця чи заступник голови міста." }
      b: { en: "an honorary judge.", ru: "судья на общественных началах.", uk: "суддя на громадських засадах." }
      c: { en: "a member of a municipal council.", ru: "член совета общины.", uk: "член ради громади." }
      d: { en: "a person who has studied law.", ru: "человек, который изучал право.", uk: "людина, яка вивчала право." }
    terms:
      - { de: "die Schöffin / der Schöffe", en: "lay judge", ru: "народный заседатель", uk: "народний засідатель" }
      - { de: "ehrenamtlich", en: "voluntary, unpaid", ru: "на общественных началах", uk: "на громадських засадах" }
      - { de: "die Entschädigung", en: "compensation", ru: "компенсация", uk: "компенсація" }
    status: reviewed
  - id: general-263
    rationale_de: >-
      Kinder unter 14 Jahren können nicht bestraft werden (Strafgesetzbuch, § 19). Ab 14 Jahren kann ein Gericht Jugendliche bestrafen, aber für sie gilt das Jugendstrafrecht und nicht das Strafrecht für Erwachsene: Es will vor allem erziehen. Mögliche Folgen sind zum Beispiel Sozialstunden, Jugendarrest oder Jugendstrafe.
    source: StGB § 19; JGG
    question:
      en: "In Germany, young people aged 14 and over are criminally responsible. That means: young people who are 14 or older and break criminal laws …"
      ru: "В Германии подростки с 14 лет несут уголовную ответственность. Это значит: подростки, которым 14 лет или больше и которые нарушают уголовные законы, …"
      uk: "У Німеччині підлітки з 14 років несуть кримінальну відповідальність. Це означає: підлітки, яким 14 років або більше і які порушують кримінальні закони, …"
    options:
      a: { en: "are punished.", ru: "наказываются.", uk: "отримують покарання." }
      b: { en: "are treated like adults.", ru: "рассматриваются как взрослые.", uk: "до них ставляться як до дорослих." }
      c: { en: "share the punishment with their parents.", ru: "делят наказание со своими родителями.", uk: "поділяють покарання зі своїми батьками." }
      d: { en: "are not punished.", ru: "не наказываются.", uk: "не отримують покарання." }
    terms:
      - { de: "strafmündig", en: "criminally responsible", ru: "несущий уголовную ответственность", uk: "кримінально відповідальний" }
      - { de: "das Strafgesetz", en: "criminal law", ru: "уголовный закон", uk: "кримінальний закон" }
      - { de: "verstoßen gegen", en: "to break", ru: "нарушать", uk: "порушувати" }
    status: reviewed
  - id: general-283
    rationale_de: >-
      Gegen einen falschen Bescheid kann man Widerspruch einlegen: Man schreibt der Behörde und erklärt, warum die Rechnung falsch ist. Dafür gibt es eine Frist, meistens einen Monat. Was man genau tun muss, steht am Ende des Bescheids. In Bayern ist ein Widerspruch oft gar nicht vorgesehen – dann klagt man direkt beim Verwaltungsgericht.
    source: VwGO § 68, § 70; Bayern AGVwGO Art. 15
    question:
      en: "What do you do if you receive an incorrect bill from a German authority?"
      ru: "Что вы делаете, если получили неправильный счёт от немецкого ведомства?"
      uk: "Що ви робите, якщо отримали від німецької державної установи неправильний рахунок?"
    options:
      a: { en: "I just leave the bill lying there.", ru: "Я оставляю счёт без внимания.", uk: "Я залишаю рахунок без уваги." }
      b: { en: "I lodge an objection with the authority.", ru: "Я подаю в ведомство возражение.", uk: "Я подаю до установи заперечення." }
      c: { en: "I send the bill back to the authority.", ru: "Я отправляю счёт обратно в ведомство.", uk: "Я надсилаю рахунок назад до установи." }
      d: { en: "I take the bill to the tax office.", ru: "Я иду со счётом в налоговую инспекцию.", uk: "Я йду з рахунком до податкової служби." }
    terms:
      - { de: "der Widerspruch", en: "objection", ru: "возражение", uk: "заперечення" }
      - { de: "die Behörde", en: "public authority", ru: "ведомство", uk: "державна установа" }
      - { de: "die Frist", en: "deadline", ru: "срок", uk: "строк" }
    status: reviewed
