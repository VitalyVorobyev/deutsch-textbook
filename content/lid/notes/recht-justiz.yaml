notes:
  - id: general-139
    rationale_de: >-
      Wenn jemand eine Straftat begangen hat, ermittelt die Staatsanwaltschaft. Gibt es genug Beweise, erhebt sie Anklage, und das Gericht führt einen Strafprozess. Falschparken ist dagegen keine Straftat, sondern eine Ordnungswidrigkeit: Man zahlt Geld, aber normalerweise gibt es keinen Prozess. Eine andere Religion oder Meinung schützt das Grundgesetz (Artikel 4 und 5).
    source: StPO § 170; GG Art. 4, Art. 5
    question:
      en: "When does a case go to trial in court in Germany? When someone …"
      ru: "Когда в Германии дело доходит до судебного процесса? Когда кто-то …"
    options:
      a: { en: "converts to another religion.", ru: "переходит в другую религию." }
      b: { en: "has committed a criminal offence and is charged.", ru: "совершил преступление и ему предъявлено обвинение." }
      c: { en: "holds an opinion different from the government's.", ru: "придерживается мнения, отличного от мнения правительства." }
      d: { en: "has parked their car illegally and it is towed away.", ru: "неправильно припарковал машину и её эвакуировали." }
    terms:
      - { de: "die Straftat", en: "criminal offence", ru: "преступление" }
      - { de: "anklagen", en: "to charge", ru: "предъявлять обвинение" }
      - { de: "die Ordnungswidrigkeit", en: "regulatory offence", ru: "административное правонарушение" }
    status: draft
  - id: general-140
    rationale_de: >-
      Schöffinnen und Schöffen sind ehrenamtliche Richterinnen und Richter. Sie sitzen in Strafprozessen neben den Berufsrichtern und entscheiden mit gleicher Stimme über Schuld und Strafe (Gerichtsverfassungsgesetz, § 30). Sie müssen nicht Jura studiert haben – so bringen normale Bürgerinnen und Bürger ihre Sicht ins Gericht.
    source: GVG § 30
    question:
      en: "What does a “Schöffin/Schöffe” do in Germany? She/He …"
      ru: "Чем занимается «Schöffin/Schöffe» в Германии? Она/он …"
    options:
      a: { en: "decides together with judges on guilt and punishment.", ru: "вместе с судьями решает вопрос о вине и наказании." }
      b: { en: "gives citizens legal advice.", ru: "даёт гражданам юридические консультации." }
      c: { en: "issues official documents.", ru: "выдаёт официальные документы." }
      d: { en: "defends the accused.", ru: "защищает обвиняемую или обвиняемого." }
    terms:
      - { de: "die Schöffin / der Schöffe", en: "lay judge", ru: "народный заседатель" }
      - { de: "die Schuld", en: "guilt", ru: "вина" }
      - { de: "die Strafe", en: "punishment", ru: "наказание" }
    status: draft
  - id: general-141
    rationale_de: >-
      Eine Rechtsanwältin oder ein Rechtsanwalt berät Menschen bei rechtlichen Problemen und vertritt sie vor Gericht. Die Richterin oder der Richter muss dagegen neutral bleiben und entscheidet den Fall. Die Staatsanwältin oder der Staatsanwalt erhebt im Strafprozess die Anklage.
    source: BRAO § 3
    question:
      en: "Who advises people on legal questions in Germany and represents them in court?"
      ru: "Кто в Германии консультирует людей по юридическим вопросам и представляет их в суде?"
    options:
      a: { en: "a lawyer", ru: "адвокат" }
      b: { en: "a judge", ru: "судья" }
      c: { en: "a lay judge", ru: "народный заседатель" }
      d: { en: "a public prosecutor", ru: "прокурор" }
    terms:
      - { de: "die Rechtsanwältin / der Rechtsanwalt", en: "lawyer", ru: "адвокат" }
      - { de: "vertreten", en: "to represent", ru: "представлять" }
      - { de: "die Staatsanwältin / der Staatsanwalt", en: "public prosecutor", ru: "прокурор" }
    status: draft
  - id: general-142
    rationale_de: >-
      Richterinnen und Richter arbeiten an einem Gericht und sprechen Urteile. Sie sind unabhängig und nur an das Gesetz gebunden (Grundgesetz, Artikel 97). Gesetze ändern darf dagegen nur das Parlament, und vor Gericht vertreten Anwältinnen und Anwälte die Menschen.
    source: GG Art. 92, Art. 97
    question:
      en: "What is the main task of a judge in Germany? A judge …"
      ru: "Какова главная задача судьи в Германии? Судья …"
    options:
      a: { en: "represents citizens before a court.", ru: "представляет граждан в суде." }
      b: { en: "works at a court and delivers judgments.", ru: "работает в суде и выносит судебные решения." }
      c: { en: "changes laws.", ru: "изменяет законы." }
      d: { en: "looks after young people in court.", ru: "сопровождает подростков в суде." }
    terms:
      - { de: "das Urteil", en: "judgment", ru: "судебное решение" }
      - { de: "unabhängig", en: "independent", ru: "независимый" }
    status: draft
  - id: general-143
    rationale_de: >-
      Im Staat gibt es drei Gewalten: Die Legislative macht die Gesetze, die Exekutive führt sie aus, und die Judikative spricht Recht. Richterinnen und Richter sprechen Recht, also gehören sie zur Judikative (Grundgesetz, Artikel 20 und 92). Eine „Operative“ gibt es bei der Gewaltenteilung nicht.
    source: GG Art. 20 Abs. 2, Art. 92
    question:
      en: "A judge in Germany belongs to the …"
      ru: "Судья в Германии относится к …"
    options:
      a: { en: "judiciary.", ru: "судебной власти." }
      b: { en: "executive.", ru: "исполнительной власти." }
      c: { en: "operative.", ru: "«оперативной» власти." }
      d: { en: "legislature.", ru: "законодательной власти." }
    terms:
      - { de: "die Judikative", en: "judiciary", ru: "судебная власть" }
      - { de: "die Gewaltenteilung", en: "separation of powers", ru: "разделение властей" }
    status: draft
  - id: general-144
    rationale_de: >-
      Richterinnen und Richter gehören zur rechtsprechenden Gewalt – das ist das deutsche Wort für Judikative. Das Grundgesetz sagt in Artikel 92: Die rechtsprechende Gewalt ist den Richtern anvertraut. Die gesetzgebende Gewalt ist das Parlament, die vollziehende Gewalt sind Regierung und Verwaltung.
    source: GG Art. 20 Abs. 2, Art. 92
    question:
      en: "In Germany, a judge belongs to the …"
      ru: "В Германии судья относится к …"
    options:
      a: { en: "executive power.", ru: "исполнительной власти." }
      b: { en: "judicial power.", ru: "судебной власти." }
      c: { en: "planning power.", ru: "планирующей власти." }
      d: { en: "legislative power.", ru: "законодательной власти." }
    terms:
      - { de: "die rechtsprechende Gewalt", en: "judicial power", ru: "судебная власть" }
      - { de: "die vollziehende Gewalt", en: "executive power", ru: "исполнительная власть" }
      - { de: "die gesetzgebende Gewalt", en: "legislative power", ru: "законодательная власть" }
    status: draft
  - id: general-145
    rationale_de: >-
      Die Staatsgewalt ist in Deutschland auf drei Gewalten verteilt, damit niemand zu viel Macht hat. Richterinnen und Richter arbeiten für die Judikative, die rechtsprechende Gewalt. Die Presse nennt man manchmal die „vierte Gewalt“, weil sie die Mächtigen kontrolliert – sie ist aber keine Staatsgewalt, sondern frei und unabhängig.
    source: GG Art. 20 Abs. 2
    question:
      en: "In Germany, state power is divided. For which state power does a judge work? For the …"
      ru: "В Германии государственная власть разделена. На какую ветвь власти работает судья? На …"
    options:
      a: { en: "judiciary", ru: "судебную власть" }
      b: { en: "executive", ru: "исполнительную власть" }
      c: { en: "press", ru: "прессу" }
      d: { en: "legislature", ru: "законодательную власть" }
    terms:
      - { de: "die Staatsgewalt", en: "state power", ru: "государственная власть" }
      - { de: "die Judikative", en: "judiciary", ru: "судебная власть" }
    status: draft
  - id: general-146
    rationale_de: >-
      Ein Verfahren vor Gericht heißt Prozess, zum Beispiel Strafprozess oder Zivilprozess. „Prozedur“ klingt ähnlich, ist aber kein Wort für ein Gerichtsverfahren. Ein Protokoll ist ein schriftlicher Bericht, zum Beispiel über eine Sitzung im Gericht.
    question:
      en: "What are proceedings before a court called in Germany?"
      ru: "Как в Германии называется разбирательство в суде?"
    options:
      a: { en: "programme", ru: "программа" }
      b: { en: "procedure", ru: "процедура" }
      c: { en: "record", ru: "протокол" }
      d: { en: "trial", ru: "процесс" }
    terms:
      - { de: "das Verfahren", en: "proceedings", ru: "разбирательство" }
      - { de: "der Prozess", en: "trial", ru: "судебный процесс" }
    status: draft
  - id: general-147
    rationale_de: >-
      Richterinnen und Richter sprechen Recht: Sie hören beide Seiten an und entscheiden dann nach dem Gesetz. Gesetze erlassen dagegen die Parlamente, und das Land regiert die Regierung. So sind die drei Gewalten getrennt (Grundgesetz, Artikel 20).
    source: GG Art. 20 Abs. 2, Art. 92
    question:
      en: "What is the work of a judge in Germany?"
      ru: "В чём состоит работа судьи в Германии?"
    options:
      a: { en: "governing Germany", ru: "управлять Германией" }
      b: { en: "administering justice", ru: "вершить правосудие" }
      c: { en: "drawing up plans", ru: "составлять планы" }
      d: { en: "enacting laws", ru: "издавать законы" }
    terms:
      - { de: "Recht sprechen", en: "to administer justice", ru: "вершить правосудие" }
      - { de: "erlassen", en: "to enact", ru: "издавать" }
    status: draft
  - id: general-148
    rationale_de: >-
      Die Polizei achtet darauf, dass die Gesetze eingehalten werden. Sie hilft bei Gefahr und ermittelt bei Straftaten. Das Land verteidigt dagegen die Bundeswehr, und Gesetze beschließt das Parlament. Telefone abhören darf die Polizei nur in Ausnahmefällen, denn das Grundgesetz schützt das Fernmeldegeheimnis (Artikel 10).
    source: GG Art. 10, Art. 87a
    question:
      en: "What is one task of the police in Germany?"
      ru: "Что входит в задачи полиции в Германии?"
    options:
      a: { en: "to defend the country", ru: "защищать страну" }
      b: { en: "to eavesdrop on citizens", ru: "прослушивать граждан" }
      c: { en: "to pass laws", ru: "принимать законы" }
      d: { en: "to monitor compliance with the laws", ru: "следить за соблюдением законов" }
    terms:
      - { de: "die Einhaltung", en: "compliance", ru: "соблюдение" }
      - { de: "überwachen", en: "to monitor", ru: "следить" }
      - { de: "abhören", en: "to eavesdrop", ru: "прослушивать" }
    status: draft
  - id: general-150
    rationale_de: >-
      Schöffinnen und Schöffen sind ehrenamtliche Richterinnen und Richter: Sie bekommen keinen Lohn, nur eine Entschädigung. Sie werden für fünf Jahre gewählt und müssen nicht Jura studiert haben. Wer gewählt wird, muss das Amt normalerweise übernehmen.
    source: GVG § 31, § 42
    question:
      en: "In Germany, a “Gerichtsschöffin/Gerichtsschöffe” is …"
      ru: "В Германии «Gerichtsschöffin/Gerichtsschöffe» — это …"
    options:
      a: { en: "the deputy of the head of a town.", ru: "заместительница или заместитель главы города." }
      b: { en: "an honorary judge.", ru: "судья на общественных началах." }
      c: { en: "a member of a municipal council.", ru: "член совета общины." }
      d: { en: "a person who has studied law.", ru: "человек, который изучал право." }
    terms:
      - { de: "die Schöffin / der Schöffe", en: "lay judge", ru: "народный заседатель" }
      - { de: "ehrenamtlich", en: "voluntary, unpaid", ru: "на общественных началах" }
      - { de: "die Entschädigung", en: "compensation", ru: "компенсация" }
    status: draft
  - id: general-263
    rationale_de: >-
      Kinder unter 14 Jahren können nicht bestraft werden (Strafgesetzbuch, § 19). Ab 14 Jahren kann ein Gericht Jugendliche bestrafen, aber für sie gilt das Jugendstrafrecht und nicht das Strafrecht für Erwachsene: Es will vor allem erziehen. Mögliche Folgen sind zum Beispiel Sozialstunden, Jugendarrest oder Jugendstrafe.
    source: StGB § 19; JGG
    question:
      en: "In Germany, young people aged 14 and over are criminally responsible. That means: young people who are 14 or older and break criminal laws …"
      ru: "В Германии подростки с 14 лет несут уголовную ответственность. Это значит: подростки, которым 14 лет или больше и которые нарушают уголовные законы, …"
    options:
      a: { en: "are punished.", ru: "наказываются." }
      b: { en: "are treated like adults.", ru: "рассматриваются как взрослые." }
      c: { en: "share the punishment with their parents.", ru: "делят наказание со своими родителями." }
      d: { en: "are not punished.", ru: "не наказываются." }
    terms:
      - { de: "strafmündig", en: "criminally responsible", ru: "несущий уголовную ответственность" }
      - { de: "das Strafgesetz", en: "criminal law", ru: "уголовный закон" }
      - { de: "verstoßen gegen", en: "to break", ru: "нарушать" }
    status: draft
  - id: general-283
    rationale_de: >-
      Gegen einen falschen Bescheid kann man Widerspruch einlegen: Man schreibt der Behörde und erklärt, warum die Rechnung falsch ist. Dafür gibt es eine Frist, meistens einen Monat. Was man genau tun muss, steht am Ende des Bescheids – in Bayern muss man zum Beispiel in manchen Fällen direkt beim Verwaltungsgericht klagen.
    source: VwGO § 68, § 70
    question:
      en: "What do you do if you receive an incorrect bill from a German authority?"
      ru: "Что вы делаете, если получили неправильный счёт от немецкого ведомства?"
    options:
      a: { en: "I just leave the bill lying there.", ru: "Я оставляю счёт без внимания." }
      b: { en: "I lodge an objection with the authority.", ru: "Я подаю в ведомство возражение." }
      c: { en: "I send the bill back to the authority.", ru: "Я отправляю счёт обратно в ведомство." }
      d: { en: "I take the bill to the tax office.", ru: "Я иду со счётом в налоговую инспекцию." }
    terms:
      - { de: "der Widerspruch", en: "objection", ru: "возражение" }
      - { de: "die Behörde", en: "public authority", ru: "ведомство" }
      - { de: "die Frist", en: "deadline", ru: "срок" }
    status: draft
