notes:
  - id: general-003
    rationale_de: >-
      In einem Rechtsstaat gelten die Gesetze für alle: für alle Menschen, die hier leben, und auch für den Staat selbst. Das steht im Grundgesetz, Artikel 20: Regierung, Verwaltung und Gerichte sind an Gesetz und Recht gebunden. Die Gesetze machen übrigens nicht die Gerichte, sondern das Parlament.
    source: GG Art. 20 Abs. 3
    question:
      en: "Germany is a state under the rule of law. What is meant by that?"
      ru: "Германия — правовое государство. Что под этим подразумевается?"
    options:
      a: { en: "All inhabitants and the state must abide by the laws.", ru: "Все жители и государство должны соблюдать законы." }
      b: { en: "The state does not have to abide by the laws.", ru: "Государство не обязано соблюдать законы." }
      c: { en: "Only Germans have to obey the laws.", ru: "Только немцы должны соблюдать законы." }
      d: { en: "The courts make the laws.", ru: "Законы создают суды." }
    terms:
      - { de: "der Rechtsstaat", en: "state under the rule of law", ru: "правовое государство" }
      - { de: "sich an die Gesetze halten", en: "to abide by the laws", ru: "соблюдать законы" }
    status: draft
  - id: general-013
    rationale_de: >-
      Zur Opposition gehören alle Abgeordneten, deren Parteien nicht in der Regierung sind. Die Opposition kritisiert und kontrolliert die Regierung und macht eigene Vorschläge. Die größte Fraktion gehört meistens zur Regierung, nicht zur Opposition.
    question:
      en: "In parliament, the term “opposition” stands for …"
      ru: "В парламенте понятие «оппозиция» означает …"
    options:
      a: { en: "the governing parties.", ru: "правящие партии." }
      b: { en: "the parliamentary group with the most members.", ru: "фракцию с наибольшим числом депутатов." }
      c: { en: "all parties that managed to clear the 5% threshold in the last election.", ru: "все партии, которые на последних выборах смогли преодолеть пятипроцентный барьер." }
      d: { en: "all members of parliament who do not belong to the governing party or parties.", ru: "всех депутатов, которые не принадлежат к правящей партии или правящим партиям." }
    terms:
      - { de: "die Opposition", en: "opposition", ru: "оппозиция" }
      - { de: "die Fraktion", en: "parliamentary group", ru: "фракция" }
      - { de: "die 5%-Hürde", en: "5% threshold", ru: "пятипроцентный барьер" }
    status: draft
  - id: general-020
    rationale_de: >-
      Eine Diktatur passt nicht zur Demokratie im Grundgesetz. Eine Partei, die die Demokratie abschaffen will, ist deshalb verfassungswidrig (Artikel 21). Ob eine solche Partei verboten wird, entscheidet nur das Bundesverfassungsgericht.
    source: GG Art. 21
    question:
      en: "A party in Germany pursues the goal of establishing a dictatorship. It is then …"
      ru: "Партия в Германии ставит перед собой цель установить диктатуру. В таком случае она …"
    options:
      a: { en: "tolerant.", ru: "толерантна." }
      b: { en: "oriented towards the rule of law.", ru: "ориентирована на правовое государство." }
      c: { en: "law-abiding.", ru: "законопослушна." }
      d: { en: "unconstitutional.", ru: "антиконституционна." }
    terms:
      - { de: "verfassungswidrig", en: "unconstitutional", ru: "антиконституционный" }
      - { de: "die Diktatur", en: "dictatorship", ru: "диктатура" }
      - { de: "errichten", en: "to establish", ru: "установить" }
    status: draft
  - id: general-022
    rationale_de: >-
      Deutschland ist eine Republik – das zeigt schon der Name „Bundesrepublik Deutschland“. In einer Republik gibt es keinen König und keinen Kaiser. Das Staatsoberhaupt ist die Bundespräsidentin oder der Bundespräsident, und sie oder er wird für fünf Jahre gewählt.
    source: GG Art. 20 Abs. 1, Art. 54
    question:
      en: "What form of state does Germany have?"
      ru: "Какая форма правления в Германии?"
    options:
      a: { en: "monarchy", ru: "монархия" }
      b: { en: "dictatorship", ru: "диктатура" }
      c: { en: "republic", ru: "республика" }
      d: { en: "principality", ru: "княжество" }
    terms:
      - { de: "die Staatsform", en: "form of state", ru: "форма правления" }
      - { de: "die Republik", en: "republic", ru: "республика" }
    status: draft
  - id: general-026
    rationale_de: >-
      Artikel 20 des Grundgesetzes sagt: „Die Bundesrepublik Deutschland ist ein demokratischer und sozialer Bundesstaat.“ Sozial heißt: Der Staat hilft Menschen in Not – das ist nicht dasselbe wie sozialistisch. Bundesstaat heißt: Deutschland besteht aus 16 Bundesländern.
    source: GG Art. 20 Abs. 1
    question:
      en: "Germany is …"
      ru: "Германия — это …"
    options:
      a: { en: "a communist republic.", ru: "коммунистическая республика." }
      b: { en: "a democratic and social federal state.", ru: "демократическое и социальное федеративное государство." }
      c: { en: "a capitalist and social monarchy.", ru: "капиталистическая и социальная монархия." }
      d: { en: "a social and socialist federal state.", ru: "социальное и социалистическое федеративное государство." }
    terms:
      - { de: "der Bundesstaat", en: "federal state", ru: "федеративное государство" }
      - { de: "sozial", en: "social", ru: "социальный" }
    status: draft
  - id: general-027
    rationale_de: >-
      Deutschland ist ein Bundesstaat aus 16 Bundesländern (Grundgesetz, Artikel 20). Jedes Land hat ein eigenes Parlament und eine eigene Regierung, zum Beispiel Bayern mit dem Landtag in München. Für ganz Deutschland gibt es den Bundestag und die Bundesregierung in Berlin.
    source: GG Art. 20 Abs. 1
    question:
      en: "Germany is …"
      ru: "Германия — это …"
    options:
      a: { en: "a socialist state.", ru: "социалистическое государство." }
      b: { en: "a federal state.", ru: "федеративное государство." }
      c: { en: "a dictatorship.", ru: "диктатура." }
      d: { en: "a monarchy.", ru: "монархия." }
    terms:
      - { de: "der Bundesstaat", en: "federal state", ru: "федеративное государство" }
      - { de: "das Bundesland", en: "federal state (Land)", ru: "федеральная земля" }
    status: draft
  - id: general-030
    rationale_de: >-
      In Deutschland gibt es keine Pressezensur. Das Grundgesetz sagt in Artikel 5 ganz klar: „Eine Zensur findet nicht statt.“ Der Staat darf also nicht vorher kontrollieren, was Zeitungen schreiben. Regelmäßige Wahlen, Meinungsfreiheit und verschiedene Parteien gehören dagegen zu jeder Demokratie.
    source: GG Art. 5 Abs. 1
    question:
      en: "What is not a feature of our democracy?"
      ru: "Что не является признаком нашей демократии?"
    options:
      a: { en: "regular elections", ru: "регулярные выборы" }
      b: { en: "press censorship", ru: "цензура прессы" }
      c: { en: "freedom of opinion", ru: "свобода мнений" }
      d: { en: "different parties", ru: "разные партии" }
    terms:
      - { de: "die Zensur", en: "censorship", ru: "цензура" }
      - { de: "das Merkmal", en: "feature", ru: "признак" }
    status: draft
  - id: general-032
    rationale_de: >-
      Der Staat hat drei Gewalten: die Gesetzgebung (das Parlament), die ausführende Gewalt (Regierung und Verwaltung) und die Rechtsprechung (die Gerichte). Die Presse gehört nicht zum Staat – sie ist frei und unabhängig. Manchmal nennt man sie die „vierte Gewalt“, weil sie die Politik kritisch beobachtet.
    source: GG Art. 20 Abs. 2
    question:
      en: "What is not a state power in Germany?"
      ru: "Что в Германии не относится к государственной власти?"
    options:
      a: { en: "legislation", ru: "законодательство" }
      b: { en: "government", ru: "правительство" }
      c: { en: "the press", ru: "пресса" }
      d: { en: "the administration of justice", ru: "правосудие" }
    terms:
      - { de: "die staatliche Gewalt", en: "state power", ru: "государственная власть" }
      - { de: "die Gesetzgebung", en: "legislation", ru: "законодательство" }
      - { de: "die Rechtsprechung", en: "administration of justice", ru: "правосудие" }
    status: draft
  - id: general-033
    rationale_de: >-
      In Deutschland gibt es keine Staatskirche. Das steht im Grundgesetz, Artikel 140, zusammen mit Artikel 137 der Weimarer Verfassung. Staat und Religionsgemeinschaften sind also getrennt, aber in manchen Bereichen arbeiten sie zusammen, zum Beispiel beim Religionsunterricht an Schulen.
    source: GG Art. 140 mit WRV Art. 137
    question:
      en: "Which statement is correct? In Germany …"
      ru: "Какое утверждение верно? В Германии …"
    options:
      a: { en: "the state and religious communities are separate from each other.", ru: "государство и религиозные общины отделены друг от друга." }
      b: { en: "the religious communities form the state.", ru: "религиозные общины образуют государство." }
      c: { en: "the state is dependent on the religious communities.", ru: "государство зависит от религиозных общин." }
      d: { en: "the state and religious communities form a single unit.", ru: "государство и религиозные общины составляют единое целое." }
    terms:
      - { de: "die Religionsgemeinschaft", en: "religious community", ru: "религиозная община" }
      - { de: "trennen", en: "to separate", ru: "разделять" }
    status: draft
  - id: general-034
    rationale_de: >-
      Deutschland ist keine Monarchie, denn es hat keinen König und keine Königin. Seit 1918 gibt es in Deutschland keinen Kaiser mehr. Demokratie, Rechtsstaat und Sozialstaat sind dagegen wichtige Prinzipien des Grundgesetzes (Artikel 20).
    source: GG Art. 20
    question:
      en: "What is Germany not?"
      ru: "Чем Германия не является?"
    options:
      a: { en: "a democracy", ru: "демократией" }
      b: { en: "a state under the rule of law", ru: "правовым государством" }
      c: { en: "a monarchy", ru: "монархией" }
      d: { en: "a welfare state", ru: "социальным государством" }
    terms:
      - { de: "die Monarchie", en: "monarchy", ru: "монархия" }
      - { de: "der Sozialstaat", en: "welfare state", ru: "социальное государство" }
    status: draft
  - id: general-038
    rationale_de: >-
      Die Bundesrepublik Deutschland ist ein demokratischer und sozialer Bundesstaat – so steht es in Artikel 20 des Grundgesetzes. Ein Bundesstaat besteht aus Ländern; in Deutschland sind es 16, jedes mit eigenem Parlament. Ein Staatenbund oder ein Staatenverbund ist dagegen ein Zusammenschluss von selbstständigen Staaten – die Europäische Union zum Beispiel ist ein Staatenverbund.
    source: GG Art. 20 Abs. 1
    question:
      en: "The Federal Republic of Germany is a democratic and social …"
      ru: "Федеративная Республика Германия является демократическим и социальным …"
    options:
      a: { en: "union of states.", ru: "объединением государств." }
      b: { en: "federal state.", ru: "федеративным государством." }
      c: { en: "confederation of states.", ru: "союзом государств." }
      d: { en: "centralised state.", ru: "централизованным государством." }
    terms:
      - { de: "der Bundesstaat", en: "federal state", ru: "федеративное государство" }
      - { de: "der Staatenbund", en: "confederation of states", ru: "конфедерация" }
      - { de: "der Zentralstaat", en: "centralised state", ru: "унитарное государство" }
    status: draft
  - id: general-041
    rationale_de: >-
      Die Menschen in einem Land haben unterschiedliche Meinungen und Interessen. Verschiedene Parteien vertreten diese Meinungen, und bei der Wahl kann jeder die Partei wählen, die am besten zu ihm passt. Das Grundgesetz sagt: Die Parteien helfen dem Volk, sich eine politische Meinung zu bilden (Artikel 21).
    source: GG Art. 21 Abs. 1
    question:
      en: "Why is there more than one party in a democracy?"
      ru: "Почему в демократии существует больше одной партии?"
    options:
      a: { en: "because this way the different opinions of the citizens are represented", ru: "потому что так представлены разные мнения граждан" }
      b: { en: "so that bribery in politics is limited", ru: "чтобы ограничить взяточничество в политике" }
      c: { en: "to prevent political demonstrations", ru: "чтобы предотвращать политические демонстрации" }
      d: { en: "to stimulate economic competition", ru: "чтобы стимулировать экономическую конкуренцию" }
    terms:
      - { de: "vertreten", en: "to represent", ru: "представлять" }
      - { de: "die Bestechung", en: "bribery", ru: "взяточничество" }
    status: draft
  - id: general-042
    rationale_de: >-
      Das Parlament, also der Bundestag, beschließt neue Gesetze für ganz Deutschland; der Bundesrat wirkt dabei mit (Grundgesetz, Artikel 77). Die Regierung kann Gesetze vorschlagen, aber nicht allein beschließen. Die Gerichte wenden die Gesetze an, und die Polizei sorgt dafür, dass man sie einhält.
    source: GG Art. 77
    question:
      en: "Who passes a new law in Germany?"
      ru: "Кто в Германии принимает новый закон?"
    options:
      a: { en: "the government", ru: "правительство" }
      b: { en: "the parliament", ru: "парламент" }
      c: { en: "the courts", ru: "суды" }
      d: { en: "the police", ru: "полиция" }
    terms:
      - { de: "beschließen", en: "to pass (a law)", ru: "принимать (закон)" }
      - { de: "das Gesetz", en: "law", ru: "закон" }
    status: draft
  - id: general-043
    rationale_de: >-
      Eine Partei kann verboten werden, wenn sie gegen die Verfassung kämpft und die Demokratie abschaffen will (Grundgesetz, Artikel 21). Über ein Verbot entscheidet nur das Bundesverfassungsgericht. Kritik am Staatsoberhaupt und neue politische Ideen sind dagegen erlaubt – sie gehören zur Demokratie.
    source: GG Art. 21 Abs. 2, Abs. 4
    question:
      en: "When can a party be banned in Germany?"
      ru: "Когда в Германии может быть запрещена партия?"
    options:
      a: { en: "if its election campaign is too expensive", ru: "если её предвыборная кампания слишком дорогая" }
      b: { en: "if it fights against the constitution", ru: "если она борется против конституции" }
      c: { en: "if it criticises the head of state", ru: "если она критикует главу государства" }
      d: { en: "if its programme proposes a new direction", ru: "если её программа предлагает новое направление" }
    terms:
      - { de: "verbieten", en: "to ban", ru: "запрещать" }
      - { de: "die Verfassung", en: "constitution", ru: "конституция" }
    status: draft
  - id: general-046
    rationale_de: >-
      Der Staat sorgt für Dinge, die alle Menschen brauchen: Straßen, Schulen, Polizei oder Gerichte. Das bezahlt er mit den Steuern der Bürgerinnen und Bürger. Private Firmen verkaufen dagegen Lebensmittel, Kleidung, Autos und Zeitungen.
    question:
      en: "The German state has many tasks. Which task is one of them?"
      ru: "У германского государства много задач. Какая задача к ним относится?"
    options:
      a: { en: "It builds roads and schools.", ru: "Оно строит дороги и школы." }
      b: { en: "It sells food and clothing.", ru: "Оно продаёт продукты питания и одежду." }
      c: { en: "It supplies all inhabitants with newspapers free of charge.", ru: "Оно бесплатно снабжает всех жителей газетами." }
      d: { en: "It produces cars and buses.", ru: "Оно производит автомобили и автобусы." }
    status: draft
  - id: general-047
    rationale_de: >-
      Die Menschen bezahlen ihre Urlaubsreisen selbst – das ist keine Aufgabe des Staates. Der Staat zahlt aber Kindergeld für Familien und unterstützt Kultur und Sport, zum Beispiel Museen und Sportlerinnen und Sportler. Das Geld dafür kommt aus Steuern.
    question:
      en: "The German state has many tasks. Which task is not one of them?"
      ru: "У германского государства много задач. Какая задача к ним не относится?"
    options:
      a: { en: "It pays for holidays for all its citizens.", ru: "Оно оплачивает отпускные поездки всем своим гражданам." }
      b: { en: "It pays child benefit.", ru: "Оно выплачивает пособие на детей." }
      c: { en: "It supports museums.", ru: "Оно поддерживает музеи." }
      d: { en: "It promotes athletes.", ru: "Оно оказывает поддержку спортсменам." }
    terms:
      - { de: "das Kindergeld", en: "child benefit", ru: "пособие на детей" }
      - { de: "fördern", en: "to promote, support", ru: "поддерживать" }
    status: draft
  - id: general-051
    rationale_de: >-
      In einem Rechtsstaat darf niemand ohne Grund verhaftet werden. Über eine Haft entscheidet ein Gericht (Grundgesetz, Artikel 104), nicht eine private Gruppe. Wer ein Verbrechen begeht, kann dagegen verhaftet werden – auch das gehört zum Rechtsstaat.
    source: GG Art. 104
    question:
      en: "It is not part of a democratic state under the rule of law that …"
      ru: "К демократическому правовому государству не относится то, что …"
    options:
      a: { en: "people can express criticism of the government.", ru: "люди могут критически высказываться о правительстве." }
      b: { en: "citizens may go and demonstrate peacefully.", ru: "граждане могут мирно выходить на демонстрации." }
      c: { en: "people are arrested without reason by a private police force.", ru: "людей без причины арестовывает частная полиция." }
      d: { en: "someone commits a crime and is arrested for it.", ru: "кто-то совершает преступление, и за это его арестовывают." }
    terms:
      - { de: "verhaften", en: "to arrest", ru: "арестовывать" }
      - { de: "das Verbrechen", en: "crime", ru: "преступление" }
    status: draft
  - id: general-052
    rationale_de: >-
      Das steht in Artikel 20 des Grundgesetzes: „Alle Staatsgewalt geht vom Volke aus.“ („Volke“ ist eine alte Form von „Volk“.) Das Volk bestimmt also, wer regiert – vor allem durch Wahlen. Auch Bundestag und Gerichte bekommen ihre Macht am Ende vom Volk.
    source: GG Art. 20 Abs. 2
    question:
      en: "What does “popular sovereignty” mean? All state authority is derived from …"
      ru: "Что означает «народный суверенитет»? Вся государственная власть исходит от …"
    options:
      a: { en: "the people.", ru: "народа." }
      b: { en: "the Bundestag.", ru: "бундестага." }
      c: { en: "the Prussian king.", ru: "прусского короля." }
      d: { en: "the Federal Constitutional Court.", ru: "Федерального конституционного суда." }
    terms:
      - { de: "die Volkssouveränität", en: "popular sovereignty", ru: "народный суверенитет" }
      - { de: "die Staatsgewalt", en: "state authority", ru: "государственная власть" }
    status: draft
  - id: general-053
    rationale_de: >-
      Rechtsstaat heißt: Auch der Staat muss sich an die Gesetze halten (Grundgesetz, Artikel 20). Das Wort „Recht“ bedeutet hier „Gesetz“ – nicht „recht haben“ und nicht „politisch rechts“. Wenn der Staat einen Fehler macht, kann man vor Gericht gegen ihn klagen.
    source: GG Art. 20 Abs. 3
    question:
      en: "What does “Rechtsstaat” mean in Germany?"
      ru: "Что означает в Германии понятие «Rechtsstaat»?"
    options:
      a: { en: "The state is right.", ru: "Государство право." }
      b: { en: "There are only right-wing parties.", ru: "Существуют только правые партии." }
      c: { en: "The citizens decide on laws.", ru: "Граждане решают вопрос о законах." }
      d: { en: "The state must abide by the laws.", ru: "Государство обязано соблюдать законы." }
    terms:
      - { de: "der Rechtsstaat", en: "state under the rule of law", ru: "правовое государство" }
      - { de: "einhalten", en: "to abide by", ru: "соблюдать" }
    status: draft
  - id: general-054
    rationale_de: >-
      Die drei staatlichen Gewalten heißen Legislative (Gesetzgebung), Exekutive (Regierung und Verwaltung) und Judikative (Rechtsprechung). Sie sind getrennt und kontrollieren sich gegenseitig – das nennt man Gewaltenteilung (Grundgesetz, Artikel 20). Eine „Direktive“ gibt es als staatliche Gewalt nicht.
    source: GG Art. 20 Abs. 2
    question:
      en: "What is not a state power in Germany?"
      ru: "Что в Германии не относится к государственной власти?"
    options:
      a: { en: "the legislature", ru: "законодательная власть" }
      b: { en: "the judiciary", ru: "судебная власть" }
      c: { en: "the executive", ru: "исполнительная власть" }
      d: { en: "the directive", ru: "директивная власть" }
    terms:
      - { de: "die Legislative", en: "legislature", ru: "законодательная власть" }
      - { de: "die Exekutive", en: "executive", ru: "исполнительная власть" }
      - { de: "die Judikative", en: "judiciary", ru: "судебная власть" }
    status: draft
  - id: general-060
    rationale_de: >-
      Bundestag und Bundesrat sind an der Gesetzgebung beteiligt, also an der Legislative. Der Bundestag beschließt die Gesetze, und der Bundesrat wirkt dabei für die Bundesländer mit (Grundgesetz, Artikel 50 und 77). Die Exekutive ist die Regierung mit der Verwaltung, die Judikative sind die Gerichte.
    source: GG Art. 50, Art. 77
    question:
      en: "In Germany, the Bundestag and the Bundesrat belong to the …"
      ru: "В Германии бундестаг и бундесрат относятся к …"
    options:
      a: { en: "executive.", ru: "исполнительной власти." }
      b: { en: "legislature.", ru: "законодательной власти." }
      c: { en: "directive.", ru: "директивной власти." }
      d: { en: "judiciary.", ru: "судебной власти." }
    terms:
      - { de: "die Legislative", en: "legislature", ru: "законодательная власть" }
      - { de: "die Gesetzgebung", en: "legislation", ru: "законодательство" }
    status: draft
  - id: general-061
    rationale_de: >-
      Volkssouveränität heißt: Die Staatsgewalt geht vom Volk aus (Grundgesetz, Artikel 20). Das Volk wählt zum Beispiel den Bundestag, und so bekommen Parlament und Regierung ihre Macht. Auch das Bundesverfassungsgericht steht nicht über der Verfassung – es muss sie selbst beachten.
    source: GG Art. 20 Abs. 2
    question:
      en: "What does “popular sovereignty” mean?"
      ru: "Что означает «народный суверенитет»?"
    options:
      a: { en: "The queen/king rules over the people.", ru: "Королева/король правит народом." }
      b: { en: "The Federal Constitutional Court stands above the constitution.", ru: "Федеральный конституционный суд стоит выше конституции." }
      c: { en: "Interest groups exercise sovereignty together with the government.", ru: "Группы интересов осуществляют суверенитет вместе с правительством." }
      d: { en: "State authority is derived from the people.", ru: "Государственная власть исходит от народа." }
    terms:
      - { de: "die Volkssouveränität", en: "popular sovereignty", ru: "народный суверенитет" }
      - { de: "der Interessenverband", en: "interest group", ru: "группа интересов" }
    status: draft
  - id: general-063
    rationale_de: >-
      Die Gerichte gehören zur Judikative, also zur Rechtsprechung. Zur Exekutive gehören die Regierung mit ihren Ministerien und die Verwaltung, zum Beispiel die Polizei und das Finanzamt. Die Gerichte sind unabhängig, damit sie auch die Regierung kontrollieren können.
    source: GG Art. 20 Abs. 2, Art. 97
    question:
      en: "What does not belong to the executive in Germany?"
      ru: "Что в Германии не относится к исполнительной власти?"
    options:
      a: { en: "the police", ru: "полиция" }
      b: { en: "the courts", ru: "суды" }
      c: { en: "the tax office", ru: "налоговая инспекция" }
      d: { en: "the ministries", ru: "министерства" }
    terms:
      - { de: "die Exekutive", en: "executive", ru: "исполнительная власть" }
      - { de: "das Finanzamt", en: "tax office", ru: "налоговая инспекция" }
    status: draft
  - id: general-088
    rationale_de: >-
      Die Opposition kontrolliert die Regierung. Sie stellt zum Beispiel Fragen an die Ministerinnen und Minister und kritisiert ihre Arbeit in Debatten. Der Bundeskanzler oder die Bundeskanzlerin schlägt dagegen vor, wer Ministerin oder Minister wird – nicht die Opposition.
    source: GG Art. 64
    question:
      en: "The parliamentary opposition in the German Bundestag …"
      ru: "Парламентская оппозиция в германском бундестаге …"
    options:
      a: { en: "scrutinises the government.", ru: "контролирует правительство." }
      b: { en: "decides who becomes a federal minister.", ru: "решает, кто станет федеральным министром." }
      c: { en: "determines who sits in the Bundesrat.", ru: "определяет, кто заседает в бундесрате." }
      d: { en: "proposes the heads of government of the federal states.", ru: "предлагает кандидатуры глав правительств федеральных земель." }
    terms:
      - { de: "die Opposition", en: "opposition", ru: "оппозиция" }
      - { de: "kontrollieren", en: "to scrutinise", ru: "контролировать" }
    status: draft
