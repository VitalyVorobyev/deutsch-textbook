notes:
  - id: general-003
    rationale_de: >-
      In einem Rechtsstaat gelten die Gesetze für alle: für alle Menschen, die hier leben, und auch für den Staat selbst. Das steht im Grundgesetz, Artikel 20: Regierung, Verwaltung und Gerichte sind an Gesetz und Recht gebunden. Die Gesetze machen übrigens nicht die Gerichte, sondern das Parlament.
    source: GG Art. 20 Abs. 3
    question:
      en: "Germany is a state under the rule of law. What is meant by that?"
      ru: "Германия — правовое государство. Что под этим подразумевается?"
      uk: "Німеччина — правова держава. Що під цим розуміють?"
    options:
      a: { en: "All inhabitants and the state must abide by the laws.", ru: "Все жители и государство должны соблюдать законы.", uk: "Усі мешканці й держава повинні дотримуватися законів." }
      b: { en: "The state does not have to abide by the laws.", ru: "Государство не обязано соблюдать законы.", uk: "Держава не мусить дотримуватися законів." }
      c: { en: "Only Germans have to obey the laws.", ru: "Только немцы должны соблюдать законы.", uk: "Лише німці повинні виконувати закони." }
      d: { en: "The courts make the laws.", ru: "Законы создают суды.", uk: "Закони створюють суди." }
    terms:
      - { de: "der Rechtsstaat", en: "state under the rule of law", ru: "правовое государство", uk: "правова держава" }
      - { de: "sich an die Gesetze halten", en: "to abide by the laws", ru: "соблюдать законы", uk: "дотримуватися законів" }
    status: reviewed
  - id: general-013
    rationale_de: >-
      Zur Opposition gehören alle Abgeordneten, deren Parteien nicht in der Regierung sind. Die Opposition kritisiert und kontrolliert die Regierung und macht eigene Vorschläge. Die größte Fraktion gehört meistens zur Regierung, nicht zur Opposition.
    question:
      en: "In parliament, the term “opposition” stands for …"
      ru: "В парламенте понятие «оппозиция» означает …"
      uk: "У парламенті поняття «опозиція» означає …"
    options:
      a: { en: "the governing parties.", ru: "правящие партии.", uk: "правлячі партії." }
      b: { en: "the parliamentary group with the most members.", ru: "фракцию с наибольшим числом депутатов.", uk: "фракцію з найбільшою кількістю депутатів." }
      c: { en: "all parties that managed to clear the 5% threshold in the last election.", ru: "все партии, которые на последних выборах смогли преодолеть пятипроцентный барьер.", uk: "усі партії, які на останніх виборах змогли подолати 5-відсотковий бар’єр." }
      d: { en: "all members of parliament who do not belong to the governing party or parties.", ru: "всех депутатов, которые не принадлежат к правящей партии или правящим партиям.", uk: "усіх депутатів, які не належать до правлячої партії чи правлячих партій." }
    terms:
      - { de: "die Opposition", en: "opposition", ru: "оппозиция", uk: "опозиція" }
      - { de: "die Fraktion", en: "parliamentary group", ru: "фракция", uk: "фракція" }
      - { de: "die 5%-Hürde", en: "5% threshold", ru: "пятипроцентный барьер", uk: "5-відсотковий бар’єр" }
    status: reviewed
  - id: general-020
    rationale_de: >-
      Eine Diktatur passt nicht zur Demokratie im Grundgesetz. Eine Partei, die die Demokratie abschaffen will, ist deshalb verfassungswidrig (Artikel 21). Ob eine solche Partei verboten wird, entscheidet nur das Bundesverfassungsgericht.
    source: GG Art. 21
    question:
      en: "A party in Germany pursues the goal of establishing a dictatorship. It is then …"
      ru: "Партия в Германии ставит перед собой цель установить диктатуру. В таком случае она …"
      uk: "Партія в Німеччині має на меті встановити диктатуру. У такому разі вона …"
    options:
      a: { en: "tolerant.", ru: "толерантна.", uk: "толерантна." }
      b: { en: "oriented towards the rule of law.", ru: "ориентирована на правовое государство.", uk: "орієнтована на правову державу." }
      c: { en: "law-abiding.", ru: "законопослушна.", uk: "законослухняна." }
      d: { en: "unconstitutional.", ru: "антиконституционна.", uk: "неконституційна." }
    terms:
      - { de: "verfassungswidrig", en: "unconstitutional", ru: "антиконституционный", uk: "неконституційний" }
      - { de: "die Diktatur", en: "dictatorship", ru: "диктатура", uk: "диктатура" }
      - { de: "errichten", en: "to establish", ru: "установить", uk: "встановити" }
    status: reviewed
  - id: general-022
    rationale_de: >-
      Deutschland ist eine Republik – das zeigt schon der Name „Bundesrepublik Deutschland“. In einer Republik gibt es keinen König und keinen Kaiser. Das Staatsoberhaupt ist die Bundespräsidentin oder der Bundespräsident, und sie oder er wird für fünf Jahre gewählt.
    source: GG Art. 20 Abs. 1, Art. 54
    question:
      en: "What form of state does Germany have?"
      ru: "Какая форма правления в Германии?"
      uk: "Яку форму держави має Німеччина?"
    options:
      a: { en: "monarchy", ru: "монархия", uk: "монархія" }
      b: { en: "dictatorship", ru: "диктатура", uk: "диктатура" }
      c: { en: "republic", ru: "республика", uk: "республіка" }
      d: { en: "principality", ru: "княжество", uk: "князівство" }
    terms:
      - { de: "die Staatsform", en: "form of state", ru: "форма правления", uk: "форма держави" }
      - { de: "die Republik", en: "republic", ru: "республика", uk: "республіка" }
    status: reviewed
  - id: general-026
    rationale_de: >-
      Artikel 20 des Grundgesetzes sagt: „Die Bundesrepublik Deutschland ist ein demokratischer und sozialer Bundesstaat.“ Sozial heißt: Der Staat hilft Menschen in Not – das ist nicht dasselbe wie sozialistisch. Bundesstaat heißt: Deutschland besteht aus 16 Bundesländern.
    source: GG Art. 20 Abs. 1
    question:
      en: "Germany is …"
      ru: "Германия — это …"
      uk: "Німеччина — це …"
    options:
      a: { en: "a communist republic.", ru: "коммунистическая республика.", uk: "комуністична республіка." }
      b: { en: "a democratic and social federal state.", ru: "демократическое и социальное федеративное государство.", uk: "демократична і соціальна федеративна держава." }
      c: { en: "a capitalist and social monarchy.", ru: "капиталистическая и социальная монархия.", uk: "капіталістична і соціальна монархія." }
      d: { en: "a social and socialist federal state.", ru: "социальное и социалистическое федеративное государство.", uk: "соціальна і соціалістична федеративна держава." }
    terms:
      - { de: "der Bundesstaat", en: "federal state", ru: "федеративное государство", uk: "федеративна держава" }
      - { de: "sozial", en: "social", ru: "социальный", uk: "соціальний" }
    status: reviewed
  - id: general-027
    rationale_de: >-
      Deutschland ist ein Bundesstaat aus 16 Bundesländern (Grundgesetz, Artikel 20). Jedes Land hat ein eigenes Parlament und eine eigene Regierung, zum Beispiel Bayern mit dem Landtag in München. Für ganz Deutschland gibt es den Bundestag und die Bundesregierung in Berlin.
    source: GG Art. 20 Abs. 1
    question:
      en: "Germany is …"
      ru: "Германия — это …"
      uk: "Німеччина — це …"
    options:
      a: { en: "a socialist state.", ru: "социалистическое государство.", uk: "соціалістична держава." }
      b: { en: "a federal state.", ru: "федеративное государство.", uk: "федеративна держава." }
      c: { en: "a dictatorship.", ru: "диктатура.", uk: "диктатура." }
      d: { en: "a monarchy.", ru: "монархия.", uk: "монархія." }
    terms:
      - { de: "der Bundesstaat", en: "federal state", ru: "федеративное государство", uk: "федеративна держава" }
      - { de: "das Bundesland", en: "federal state (Land)", ru: "федеральная земля", uk: "федеральна земля" }
    status: reviewed
  - id: general-030
    rationale_de: >-
      In Deutschland gibt es keine Pressezensur. Das Grundgesetz sagt in Artikel 5 ganz klar: „Eine Zensur findet nicht statt.“ Der Staat darf also nicht vorher kontrollieren, was Zeitungen schreiben. Regelmäßige Wahlen, Meinungsfreiheit und verschiedene Parteien gehören dagegen zu jeder Demokratie.
    source: GG Art. 5 Abs. 1
    question:
      en: "What is not a feature of our democracy?"
      ru: "Что не является признаком нашей демократии?"
      uk: "Що не є ознакою нашої демократії?"
    options:
      a: { en: "regular elections", ru: "регулярные выборы", uk: "регулярні вибори" }
      b: { en: "press censorship", ru: "цензура прессы", uk: "цензура преси" }
      c: { en: "freedom of opinion", ru: "свобода мнений", uk: "свобода слова" }
      d: { en: "different parties", ru: "разные партии", uk: "різні партії" }
    terms:
      - { de: "die Zensur", en: "censorship", ru: "цензура", uk: "цензура" }
      - { de: "das Merkmal", en: "feature", ru: "признак", uk: "ознака" }
    status: reviewed
  - id: general-032
    rationale_de: >-
      Der Staat hat drei Gewalten: die Gesetzgebung (das Parlament), die ausführende Gewalt (Regierung und Verwaltung) und die Rechtsprechung (die Gerichte). Die Presse gehört nicht zum Staat – sie ist frei und unabhängig. Manchmal nennt man sie die „vierte Gewalt“, weil sie die Politik kritisch beobachtet.
    source: GG Art. 20 Abs. 2
    question:
      en: "What is not a state power in Germany?"
      ru: "Что в Германии не относится к государственной власти?"
      uk: "Що в Німеччині не належить до державної влади?"
    options:
      a: { en: "legislation", ru: "законодательство", uk: "законодавство" }
      b: { en: "government", ru: "правительство", uk: "уряд" }
      c: { en: "the press", ru: "пресса", uk: "преса" }
      d: { en: "the administration of justice", ru: "правосудие", uk: "правосуддя" }
    terms:
      - { de: "die staatliche Gewalt", en: "state power", ru: "государственная власть", uk: "державна влада" }
      - { de: "die Gesetzgebung", en: "legislation", ru: "законодательство", uk: "законодавство" }
      - { de: "die Rechtsprechung", en: "administration of justice", ru: "правосудие", uk: "правосуддя" }
    status: reviewed
  - id: general-033
    rationale_de: >-
      In Deutschland gibt es keine Staatskirche. Das steht im Grundgesetz, Artikel 140, zusammen mit Artikel 137 der Weimarer Verfassung. Staat und Religionsgemeinschaften sind also getrennt, aber in manchen Bereichen arbeiten sie zusammen, zum Beispiel beim Religionsunterricht an Schulen.
    source: GG Art. 140 mit WRV Art. 137
    question:
      en: "Which statement is correct? In Germany …"
      ru: "Какое утверждение верно? В Германии …"
      uk: "Яке твердження правильне? У Німеччині …"
    options:
      a: { en: "the state and religious communities are separate from each other.", ru: "государство и религиозные общины отделены друг от друга.", uk: "держава і релігійні громади відокремлені одне від одного." }
      b: { en: "the religious communities form the state.", ru: "религиозные общины образуют государство.", uk: "релігійні громади утворюють державу." }
      c: { en: "the state is dependent on the religious communities.", ru: "государство зависит от религиозных общин.", uk: "держава залежить від релігійних громад." }
      d: { en: "the state and religious communities form a single unit.", ru: "государство и религиозные общины составляют единое целое.", uk: "держава і релігійні громади становлять єдине ціле." }
    terms:
      - { de: "die Religionsgemeinschaft", en: "religious community", ru: "религиозная община", uk: "релігійна громада" }
      - { de: "trennen", en: "to separate", ru: "разделять", uk: "відокремлювати" }
    status: reviewed
  - id: general-034
    rationale_de: >-
      Deutschland ist keine Monarchie, denn es hat keinen König und keine Königin. Seit 1918 gibt es in Deutschland keinen Kaiser mehr. Demokratie, Rechtsstaat und Sozialstaat sind dagegen wichtige Prinzipien des Grundgesetzes (Artikel 20).
    source: GG Art. 20
    question:
      en: "What is Germany not?"
      ru: "Чем Германия не является?"
      uk: "Чим Німеччина не є?"
    options:
      a: { en: "a democracy", ru: "демократией", uk: "демократією" }
      b: { en: "a state under the rule of law", ru: "правовым государством", uk: "правовою державою" }
      c: { en: "a monarchy", ru: "монархией", uk: "монархією" }
      d: { en: "a welfare state", ru: "социальным государством", uk: "соціальною державою" }
    terms:
      - { de: "die Monarchie", en: "monarchy", ru: "монархия", uk: "монархія" }
      - { de: "der Sozialstaat", en: "welfare state", ru: "социальное государство", uk: "соціальна держава" }
    status: reviewed
  - id: general-038
    rationale_de: >-
      Die Bundesrepublik Deutschland ist ein demokratischer und sozialer Bundesstaat – so steht es in Artikel 20 des Grundgesetzes. Ein Bundesstaat besteht aus Ländern; in Deutschland sind es 16, jedes mit eigenem Parlament. Ein Staatenbund oder ein Staatenverbund ist dagegen ein Zusammenschluss von selbstständigen Staaten – die Europäische Union zum Beispiel ist ein Staatenverbund.
    source: GG Art. 20 Abs. 1
    question:
      en: "The Federal Republic of Germany is a democratic and social …"
      ru: "Федеративная Республика Германия является демократическим и социальным …"
      uk: "Федеративна Республіка Німеччина — це демократична і соціальна …"
    options:
      a: { en: "union of states.", ru: "объединением государств.", uk: "спілка держав." }
      b: { en: "federal state.", ru: "федеративным государством.", uk: "федеративна держава." }
      c: { en: "confederation of states.", ru: "союзом государств.", uk: "конфедерація." }
      d: { en: "centralised state.", ru: "централизованным государством.", uk: "централізована держава." }
    terms:
      - { de: "der Bundesstaat", en: "federal state", ru: "федеративное государство", uk: "федеративна держава" }
      - { de: "der Staatenbund", en: "confederation of states", ru: "конфедерация", uk: "конфедерація" }
      - { de: "der Zentralstaat", en: "centralised state", ru: "унитарное государство", uk: "централізована держава" }
    status: reviewed
  - id: general-041
    rationale_de: >-
      Die Menschen in einem Land haben unterschiedliche Meinungen und Interessen. Verschiedene Parteien vertreten diese Meinungen, und bei der Wahl kann jeder die Partei wählen, die am besten zu ihm passt. Das Grundgesetz sagt: Die Parteien helfen dem Volk, sich eine politische Meinung zu bilden (Artikel 21).
    source: GG Art. 21 Abs. 1
    question:
      en: "Why is there more than one party in a democracy?"
      ru: "Почему в демократии существует больше одной партии?"
      uk: "Чому в демократії існує більше ніж одна партія?"
    options:
      a: { en: "because this way the different opinions of the citizens are represented", ru: "потому что так представлены разные мнения граждан", uk: "тому що так представлено різні думки громадян" }
      b: { en: "so that bribery in politics is limited", ru: "чтобы ограничить взяточничество в политике", uk: "щоб обмежити хабарництво в політиці" }
      c: { en: "to prevent political demonstrations", ru: "чтобы предотвращать политические демонстрации", uk: "щоб запобігати політичним демонстраціям" }
      d: { en: "to stimulate economic competition", ru: "чтобы стимулировать экономическую конкуренцию", uk: "щоб стимулювати економічну конкуренцію" }
    terms:
      - { de: "vertreten", en: "to represent", ru: "представлять", uk: "представляти" }
      - { de: "die Bestechung", en: "bribery", ru: "взяточничество", uk: "хабарництво" }
    status: reviewed
  - id: general-042
    rationale_de: >-
      Das Parlament, also der Bundestag, beschließt neue Gesetze für ganz Deutschland; der Bundesrat wirkt dabei mit (Grundgesetz, Artikel 77). Die Regierung kann Gesetze vorschlagen, aber nicht allein beschließen. Die Gerichte wenden die Gesetze an, und die Polizei sorgt dafür, dass man sie einhält.
    source: GG Art. 77
    question:
      en: "Who passes a new law in Germany?"
      ru: "Кто в Германии принимает новый закон?"
      uk: "Хто в Німеччині ухвалює новий закон?"
    options:
      a: { en: "the government", ru: "правительство", uk: "уряд" }
      b: { en: "the parliament", ru: "парламент", uk: "парламент" }
      c: { en: "the courts", ru: "суды", uk: "суди" }
      d: { en: "the police", ru: "полиция", uk: "поліція" }
    terms:
      - { de: "beschließen", en: "to pass (a law)", ru: "принимать (закон)", uk: "ухвалювати (закон)" }
      - { de: "das Gesetz", en: "law", ru: "закон", uk: "закон" }
    status: reviewed
  - id: general-043
    rationale_de: >-
      Eine Partei kann verboten werden, wenn sie gegen die Verfassung kämpft und die Demokratie abschaffen will (Grundgesetz, Artikel 21). Über ein Verbot entscheidet nur das Bundesverfassungsgericht. Kritik am Staatsoberhaupt und neue politische Ideen sind dagegen erlaubt – sie gehören zur Demokratie.
    source: GG Art. 21 Abs. 2, Abs. 4
    question:
      en: "When can a party be banned in Germany?"
      ru: "Когда в Германии может быть запрещена партия?"
      uk: "Коли в Німеччині партію можуть заборонити?"
    options:
      a: { en: "if its election campaign is too expensive", ru: "если её предвыборная кампания слишком дорогая", uk: "якщо її передвиборча кампанія надто дорога" }
      b: { en: "if it fights against the constitution", ru: "если она борется против конституции", uk: "якщо вона бореться проти конституції" }
      c: { en: "if it criticises the head of state", ru: "если она критикует главу государства", uk: "якщо вона критикує главу держави" }
      d: { en: "if its programme proposes a new direction", ru: "если её программа предлагает новое направление", uk: "якщо її програма пропонує новий напрям" }
    terms:
      - { de: "verbieten", en: "to ban", ru: "запрещать", uk: "забороняти" }
      - { de: "die Verfassung", en: "constitution", ru: "конституция", uk: "конституція" }
    status: reviewed
  - id: general-046
    rationale_de: >-
      Der Staat sorgt für Dinge, die alle Menschen brauchen: Straßen, Schulen, Polizei oder Gerichte. Das bezahlt er mit den Steuern der Bürgerinnen und Bürger. Private Firmen verkaufen dagegen Lebensmittel, Kleidung, Autos und Zeitungen.
    question:
      en: "The German state has many tasks. Which task is one of them?"
      ru: "У германского государства много задач. Какая задача к ним относится?"
      uk: "Німецька держава має багато завдань. Яке завдання до них належить?"
    options:
      a: { en: "It builds roads and schools.", ru: "Оно строит дороги и школы.", uk: "Вона будує дороги і школи." }
      b: { en: "It sells food and clothing.", ru: "Оно продаёт продукты питания и одежду.", uk: "Вона продає продукти харчування та одяг." }
      c: { en: "It supplies all inhabitants with newspapers free of charge.", ru: "Оно бесплатно снабжает всех жителей газетами.", uk: "Вона безкоштовно забезпечує всіх мешканців газетами." }
      d: { en: "It produces cars and buses.", ru: "Оно производит автомобили и автобусы.", uk: "Вона виробляє автомобілі та автобуси." }
    status: reviewed
  - id: general-047
    rationale_de: >-
      Die Menschen bezahlen ihre Urlaubsreisen selbst – das ist keine Aufgabe des Staates. Der Staat zahlt aber Kindergeld für Familien und unterstützt Kultur und Sport, zum Beispiel Museen und Sportlerinnen und Sportler. Das Geld dafür kommt aus Steuern.
    question:
      en: "The German state has many tasks. Which task is not one of them?"
      ru: "У германского государства много задач. Какая задача к ним не относится?"
      uk: "Німецька держава має багато завдань. Яке завдання до них не належить?"
    options:
      a: { en: "It pays for holidays for all its citizens.", ru: "Оно оплачивает отпускные поездки всем своим гражданам.", uk: "Вона оплачує всім громадянам поїздки у відпустку." }
      b: { en: "It pays child benefit.", ru: "Оно выплачивает пособие на детей.", uk: "Вона виплачує допомогу на дітей." }
      c: { en: "It supports museums.", ru: "Оно поддерживает музеи.", uk: "Вона підтримує музеї." }
      d: { en: "It promotes athletes.", ru: "Оно оказывает поддержку спортсменам.", uk: "Вона сприяє спортсменам." }
    terms:
      - { de: "das Kindergeld", en: "child benefit", ru: "пособие на детей", uk: "допомога на дітей" }
      - { de: "fördern", en: "to promote, support", ru: "поддерживать", uk: "підтримувати, сприяти" }
    status: reviewed
  - id: general-051
    rationale_de: >-
      In einem Rechtsstaat darf niemand ohne Grund verhaftet werden. Über eine Haft entscheidet ein Gericht (Grundgesetz, Artikel 104), nicht eine private Gruppe. Wer ein Verbrechen begeht, kann dagegen verhaftet werden – auch das gehört zum Rechtsstaat.
    source: GG Art. 104
    question:
      en: "It is not part of a democratic state under the rule of law that …"
      ru: "К демократическому правовому государству не относится то, что …"
      uk: "До демократичної правової держави не належить те, що …"
    options:
      a: { en: "people can express criticism of the government.", ru: "люди могут критически высказываться о правительстве.", uk: "люди можуть критично висловлюватися про уряд." }
      b: { en: "citizens may go and demonstrate peacefully.", ru: "граждане могут мирно выходить на демонстрации.", uk: "громадяни мають право мирно виходити на демонстрації." }
      c: { en: "people are arrested without reason by a private police force.", ru: "людей без причины арестовывает частная полиция.", uk: "людей без причини заарештовує приватна поліція." }
      d: { en: "someone commits a crime and is arrested for it.", ru: "кто-то совершает преступление, и за это его арестовывают.", uk: "хтось учиняє злочин, і тому його заарештовують." }
    terms:
      - { de: "verhaften", en: "to arrest", ru: "арестовывать", uk: "заарештовувати" }
      - { de: "das Verbrechen", en: "crime", ru: "преступление", uk: "злочин" }
    status: reviewed
  - id: general-052
    rationale_de: >-
      Das steht in Artikel 20 des Grundgesetzes: „Alle Staatsgewalt geht vom Volke aus.“ („Volke“ ist eine alte Form von „Volk“.) Das Volk bestimmt also, wer regiert – vor allem durch Wahlen. Auch Bundestag und Gerichte bekommen ihre Macht am Ende vom Volk.
    source: GG Art. 20 Abs. 2
    question:
      en: "What does “popular sovereignty” mean? All state authority is derived from …"
      ru: "Что означает «народный суверенитет»? Вся государственная власть исходит от …"
      uk: "Що означає «народний суверенітет» (Volkssouveränität)? Уся державна влада походить від …"
    options:
      a: { en: "the people.", ru: "народа.", uk: "народу." }
      b: { en: "the Bundestag.", ru: "бундестага.", uk: "Бундестагу." }
      c: { en: "the Prussian king.", ru: "прусского короля.", uk: "прусського короля." }
      d: { en: "the Federal Constitutional Court.", ru: "Федерального конституционного суда.", uk: "Федерального конституційного суду." }
    terms:
      - { de: "die Volkssouveränität", en: "popular sovereignty", ru: "народный суверенитет", uk: "народний суверенітет" }
      - { de: "die Staatsgewalt", en: "state authority", ru: "государственная власть", uk: "державна влада" }
    status: reviewed
  - id: general-053
    rationale_de: >-
      Rechtsstaat heißt: Auch der Staat muss sich an die Gesetze halten (Grundgesetz, Artikel 20). Das Wort „Recht“ bedeutet hier „Gesetz“ – nicht „recht haben“ und nicht „politisch rechts“. Wenn der Staat einen Fehler macht, kann man vor Gericht gegen ihn klagen.
    source: GG Art. 20 Abs. 3
    question:
      en: "What does “Rechtsstaat” mean in Germany?"
      ru: "Что означает в Германии понятие «Rechtsstaat»?"
      uk: "Що означає в Німеччині поняття «Rechtsstaat»?"
    options:
      a: { en: "The state is right.", ru: "Государство право.", uk: "Держава має рацію." }
      b: { en: "There are only right-wing parties.", ru: "Существуют только правые партии.", uk: "Існують лише праві партії." }
      c: { en: "The citizens decide on laws.", ru: "Граждане решают вопрос о законах.", uk: "Громадяни ухвалюють рішення щодо законів." }
      d: { en: "The state must abide by the laws.", ru: "Государство обязано соблюдать законы.", uk: "Держава мусить дотримуватися законів." }
    terms:
      - { de: "der Rechtsstaat", en: "state under the rule of law", ru: "правовое государство", uk: "правова держава" }
      - { de: "einhalten", en: "to abide by", ru: "соблюдать", uk: "дотримуватися" }
    status: reviewed
  - id: general-054
    rationale_de: >-
      Die drei staatlichen Gewalten heißen Legislative (Gesetzgebung), Exekutive (Regierung und Verwaltung) und Judikative (Rechtsprechung). Sie sind getrennt und kontrollieren sich gegenseitig – das nennt man Gewaltenteilung (Grundgesetz, Artikel 20). Eine „Direktive“ gibt es als staatliche Gewalt nicht.
    source: GG Art. 20 Abs. 2
    question:
      en: "What is not a state power in Germany?"
      ru: "Что в Германии не относится к государственной власти?"
      uk: "Що в Німеччині не належить до державної влади?"
    options:
      a: { en: "the legislature", ru: "законодательная власть", uk: "законодавча влада" }
      b: { en: "the judiciary", ru: "судебная власть", uk: "судова влада" }
      c: { en: "the executive", ru: "исполнительная власть", uk: "виконавча влада" }
      d: { en: "the directive", ru: "директивная власть", uk: "директивна влада" }
    terms:
      - { de: "die Legislative", en: "legislature", ru: "законодательная власть", uk: "законодавча влада" }
      - { de: "die Exekutive", en: "executive", ru: "исполнительная власть", uk: "виконавча влада" }
      - { de: "die Judikative", en: "judiciary", ru: "судебная власть", uk: "судова влада" }
    status: reviewed
  - id: general-060
    rationale_de: >-
      Bundestag und Bundesrat sind an der Gesetzgebung beteiligt, also an der Legislative. Der Bundestag beschließt die Gesetze, und der Bundesrat wirkt dabei für die Bundesländer mit (Grundgesetz, Artikel 50 und 77). Die Exekutive ist die Regierung mit der Verwaltung, die Judikative sind die Gerichte.
    source: GG Art. 50, Art. 77
    question:
      en: "In Germany, the Bundestag and the Bundesrat belong to the …"
      ru: "В Германии бундестаг и бундесрат относятся к …"
      uk: "У Німеччині Бундестаг і Бундесрат належать до …"
    options:
      a: { en: "executive.", ru: "исполнительной власти.", uk: "виконавчої влади." }
      b: { en: "legislature.", ru: "законодательной власти.", uk: "законодавчої влади." }
      c: { en: "directive.", ru: "директивной власти.", uk: "директивної влади." }
      d: { en: "judiciary.", ru: "судебной власти.", uk: "судової влади." }
    terms:
      - { de: "die Legislative", en: "legislature", ru: "законодательная власть", uk: "законодавча влада" }
      - { de: "die Gesetzgebung", en: "legislation", ru: "законодательство", uk: "законодавство" }
    status: reviewed
  - id: general-061
    rationale_de: >-
      Volkssouveränität heißt: Die Staatsgewalt geht vom Volk aus (Grundgesetz, Artikel 20). Das Volk wählt zum Beispiel den Bundestag, und so bekommen Parlament und Regierung ihre Macht. Auch das Bundesverfassungsgericht steht nicht über der Verfassung – es muss sie selbst beachten.
    source: GG Art. 20 Abs. 2
    question:
      en: "What does “popular sovereignty” mean?"
      ru: "Что означает «народный суверенитет»?"
      uk: "Що означає «народний суверенітет» (Volkssouveränität)?"
    options:
      a: { en: "The queen/king rules over the people.", ru: "Королева/король правит народом.", uk: "Королева / король править народом." }
      b: { en: "The Federal Constitutional Court stands above the constitution.", ru: "Федеральный конституционный суд стоит выше конституции.", uk: "Федеральний конституційний суд стоїть над конституцією." }
      c: { en: "Interest groups exercise sovereignty together with the government.", ru: "Группы интересов осуществляют суверенитет вместе с правительством.", uk: "Групи інтересів здійснюють суверенітет разом з урядом." }
      d: { en: "State authority is derived from the people.", ru: "Государственная власть исходит от народа.", uk: "Державна влада походить від народу." }
    terms:
      - { de: "die Volkssouveränität", en: "popular sovereignty", ru: "народный суверенитет", uk: "народний суверенітет" }
      - { de: "der Interessenverband", en: "interest group", ru: "группа интересов", uk: "група інтересів" }
    status: reviewed
  - id: general-063
    rationale_de: >-
      Die Gerichte gehören zur Judikative, also zur Rechtsprechung. Zur Exekutive gehören die Regierung mit ihren Ministerien und die Verwaltung, zum Beispiel die Polizei und das Finanzamt. Die Gerichte sind unabhängig, damit sie auch die Regierung kontrollieren können.
    source: GG Art. 20 Abs. 2, Art. 97
    question:
      en: "What does not belong to the executive in Germany?"
      ru: "Что в Германии не относится к исполнительной власти?"
      uk: "Що в Німеччині не належить до виконавчої влади?"
    options:
      a: { en: "the police", ru: "полиция", uk: "поліція" }
      b: { en: "the courts", ru: "суды", uk: "суди" }
      c: { en: "the tax office", ru: "налоговая инспекция", uk: "податкова служба" }
      d: { en: "the ministries", ru: "министерства", uk: "міністерства" }
    terms:
      - { de: "die Exekutive", en: "executive", ru: "исполнительная власть", uk: "виконавча влада" }
      - { de: "das Finanzamt", en: "tax office", ru: "налоговая инспекция", uk: "податкова служба" }
    status: reviewed
  - id: general-088
    rationale_de: >-
      Die Opposition kontrolliert die Regierung. Sie stellt zum Beispiel Fragen an die Ministerinnen und Minister und kritisiert ihre Arbeit in Debatten. Der Bundeskanzler oder die Bundeskanzlerin schlägt dagegen vor, wer Ministerin oder Minister wird – nicht die Opposition.
    source: GG Art. 64
    question:
      en: "The parliamentary opposition in the German Bundestag …"
      ru: "Парламентская оппозиция в германском бундестаге …"
      uk: "Парламентська опозиція в німецькому Бундестазі …"
    options:
      a: { en: "scrutinises the government.", ru: "контролирует правительство.", uk: "контролює уряд." }
      b: { en: "decides who becomes a federal minister.", ru: "решает, кто станет федеральным министром.", uk: "вирішує, хто стане федеральним міністром." }
      c: { en: "determines who sits in the Bundesrat.", ru: "определяет, кто заседает в бундесрате.", uk: "визначає, хто засідає в Бундесраті." }
      d: { en: "proposes the heads of government of the federal states.", ru: "предлагает кандидатуры глав правительств федеральных земель.", uk: "пропонує кандидатури глав урядів федеральних земель." }
    terms:
      - { de: "die Opposition", en: "opposition", ru: "оппозиция", uk: "опозиція" }
      - { de: "kontrollieren", en: "to scrutinise", ru: "контролировать", uk: "контролювати" }
    status: reviewed
