notes:
  - id: general-151
    rationale_de: >-
      Die DDR begann am 13. August 1961, die Mauer in Berlin zu bauen. Die Mauer lag rund um West-Berlin und trennte es von Ost-Berlin und vom Umland. So wollte die DDR verhindern, dass noch mehr Menschen in den Westen flohen – bis dahin waren schon Millionen gegangen.
    source: "bpb: Deutsche Teilung"
    question:
      en: "Who built the Wall in Berlin?"
      ru: "Кто построил стену в Берлине?"
      uk: "Хто збудував мур у Берліні?"
    options:
      a: { en: "Great Britain", ru: "Великобритания", uk: "Велика Британія" }
      b: { en: "the GDR", ru: "ГДР", uk: "НДР" }
      c: { en: "the Federal Republic of Germany", ru: "Федеративная Республика Германия", uk: "Федеративна Республіка Німеччина" }
      d: { en: "the USA", ru: "США", uk: "США" }
    terms:
      - { de: "die Mauer", en: "wall", ru: "стена", uk: "мур" }
      - { de: "fliehen", en: "to flee", ru: "бежать", uk: "тікати" }
    status: reviewed
  - id: general-165
    rationale_de: >-
      Konrad Adenauer von der CDU war von 1949 bis 1963 der erste Bundeskanzler der Bundesrepublik. Er verband den neuen Staat eng mit dem Westen, besonders mit den USA und Frankreich. Kiesinger, Brandt und Schmidt regierten erst später, zwischen 1966 und 1982.
    question:
      en: "What was the name of the first Federal Chancellor of the Federal Republic of Germany?"
      ru: "Как звали первого федерального канцлера Федеративной Республики Германия?"
      uk: "Як звали першого федерального канцлера Федеративної Республіки Німеччина?"
    options:
      a: { en: "Konrad Adenauer", ru: "Конрад Аденауэр", uk: "Конрад Аденауер" }
      b: { en: "Kurt Georg Kiesinger", ru: "Курт Георг Кизингер", uk: "Курт Георг Кізінгер" }
      c: { en: "Helmut Schmidt", ru: "Гельмут Шмидт", uk: "Гельмут Шмідт" }
      d: { en: "Willy Brandt", ru: "Вилли Брандт", uk: "Віллі Брандт" }
    terms:
      - { de: "der Bundeskanzler", en: "Federal Chancellor", ru: "федеральный канцлер", uk: "федеральний канцлер" }
    status: reviewed
  - id: general-167
    rationale_de: >-
      Nach dem Zweiten Weltkrieg teilten vier Siegermächte Deutschland in vier Besatzungszonen: die USA, die Sowjetunion, Großbritannien und Frankreich. Man nannte sie die alliierten Besatzungsmächte. In den anderen Antworten steht immer mindestens ein Land, das keine Besatzungsmacht war, zum Beispiel Japan – es hatte im Krieg auf der Seite Deutschlands gekämpft.
    source: "bpb: Deutsche Teilung"
    question:
      en: "Which countries were called the “Allied occupying powers” in Germany after the Second World War?"
      ru: "Какие страны после Второй мировой войны называли в Германии «союзными оккупационными державами»?"
      uk: "Які країни після Другої світової війни в Німеччині називали «окупаційними державами союзників»?"
    options:
      a: { en: "Soviet Union, Great Britain, Poland, Sweden", ru: "Советский Союз, Великобритания, Польша, Швеция", uk: "Радянський Союз, Велика Британія, Польща, Швеція" }
      b: { en: "France, Soviet Union, Italy, Japan", ru: "Франция, Советский Союз, Италия, Япония", uk: "Франція, Радянський Союз, Італія, Японія" }
      c: { en: "USA, Soviet Union, Spain, Portugal", ru: "США, Советский Союз, Испания, Португалия", uk: "США, Радянський Союз, Іспанія, Португалія" }
      d: { en: "USA, Soviet Union, Great Britain, France", ru: "США, Советский Союз, Великобритания, Франция", uk: "США, Радянський Союз, Велика Британія, Франція" }
    terms:
      - { de: "die Besatzungsmacht", en: "occupying power", ru: "оккупационная держава", uk: "окупаційна держава" }
      - { de: "die Alliierten", en: "the Allies", ru: "союзники", uk: "союзники" }
      - { de: "die Siegermacht", en: "victorious power", ru: "держава-победительница", uk: "держава-переможниця" }
    status: reviewed
  - id: general-168
    rationale_de: >-
      Japan hatte im Zweiten Weltkrieg auf der Seite Deutschlands gekämpft und den Krieg ebenfalls verloren. Darum war Japan keine Besatzungsmacht in Deutschland. Die vier Besatzungsmächte waren die USA, die Sowjetunion, Großbritannien und Frankreich.
    source: "bpb: Deutsche Teilung"
    question:
      en: "Which country was not an “Allied occupying power” in Germany?"
      ru: "Какая страна не была «союзной оккупационной державой» в Германии?"
      uk: "Яка країна не була «окупаційною державою союзників» у Німеччині?"
    options:
      a: { en: "USA", ru: "США", uk: "США" }
      b: { en: "Soviet Union", ru: "Советский Союз", uk: "Радянський Союз" }
      c: { en: "France", ru: "Франция", uk: "Франція" }
      d: { en: "Japan", ru: "Япония", uk: "Японія" }
    terms:
      - { de: "die Besatzungsmacht", en: "occupying power", ru: "оккупационная держава", uk: "окупаційна держава" }
    status: reviewed
  - id: general-169
    rationale_de: >-
      Die Bundesrepublik Deutschland wurde 1949 gegründet: Am 23. Mai 1949 wurde das Grundgesetz verkündet. Im selben Jahr, am 7. Oktober, entstand im Osten die DDR. 1945 war nur der Krieg zu Ende; danach regierten zuerst die Besatzungsmächte.
    source: GG Art. 145
    question:
      en: "When was the Federal Republic of Germany founded?"
      ru: "Когда была основана Федеративная Республика Германия?"
      uk: "Коли було засновано Федеративну Республіку Німеччина?"
    options:
      a: { en: "1939", ru: "1939", uk: "1939" }
      b: { en: "1945", ru: "1945", uk: "1945" }
      c: { en: "1949", ru: "1949", uk: "1949" }
      d: { en: "1951", ru: "1951", uk: "1951" }
    terms:
      - { de: "gründen", en: "to found", ru: "основать", uk: "засновувати" }
      - { de: "verkünden", en: "to promulgate", ru: "обнародовать", uk: "оприлюднювати" }
    status: reviewed
  - id: general-172
    rationale_de: >-
      Nach 1945 war Deutschland in vier Besatzungszonen geteilt. Im Osten lag die sowjetische Zone – dort wurde am 7. Oktober 1949 die DDR gegründet. Aus den drei Westzonen der USA, Großbritanniens und Frankreichs entstand im selben Jahr die Bundesrepublik.
    source: "bpb: Deutsche Teilung"
    question:
      en: "In which occupation zone was the GDR founded? In the …"
      ru: "В какой оккупационной зоне была основана ГДР? В …"
      uk: "У якій окупаційній зоні було засновано НДР? У …"
    options:
      a: { en: "American occupation zone", ru: "американской оккупационной зоне", uk: "американській окупаційній зоні" }
      b: { en: "French occupation zone", ru: "французской оккупационной зоне", uk: "французькій окупаційній зоні" }
      c: { en: "British occupation zone", ru: "британской оккупационной зоне", uk: "британській окупаційній зоні" }
      d: { en: "Soviet occupation zone", ru: "советской оккупационной зоне", uk: "радянській окупаційній зоні" }
    terms:
      - { de: "die Besatzungszone", en: "occupation zone", ru: "оккупационная зона", uk: "окупаційна зона" }
    status: reviewed
  - id: general-174
    rationale_de: >-
      Die DDR wurde am 7. Oktober 1949 gegründet, wenige Monate nach der Bundesrepublik. Sie bestand bis zum 3. Oktober 1990. Das Jahr 1953 ist wegen des Volksaufstands vom 17. Juni bekannt.
    source: "bpb: Deutsche Teilung"
    question:
      en: "When was the GDR founded?"
      ru: "Когда была основана ГДР?"
      uk: "Коли було засновано НДР?"
    options:
      a: { en: "1947", ru: "1947", uk: "1947" }
      b: { en: "1949", ru: "1949", uk: "1949" }
      c: { en: "1953", ru: "1953", uk: "1953" }
      d: { en: "1956", ru: "1956", uk: "1956" }
    terms:
      - { de: "bestehen", en: "to exist", ru: "существовать", uk: "існувати" }
    status: reviewed
  - id: general-175
    rationale_de: >-
      Die vier Siegermächte – die USA, die Sowjetunion, Großbritannien und Frankreich – teilten Deutschland nach dem Krieg in vier Besatzungszonen. Jede Macht verwaltete eine Zone. Berlin lag mitten in der sowjetischen Zone und wurde zusätzlich in vier Sektoren geteilt.
    source: "bpb: Deutsche Teilung"
    question:
      en: "How many occupation zones were there in Germany after the Second World War?"
      ru: "Сколько оккупационных зон было в Германии после Второй мировой войны?"
      uk: "Скільки окупаційних зон було в Німеччині після Другої світової війни?"
    options:
      a: { en: "3", ru: "3", uk: "3" }
      b: { en: "4", ru: "4", uk: "4" }
      c: { en: "5", ru: "5", uk: "5" }
      d: { en: "6", ru: "6", uk: "6" }
    terms:
      - { de: "die Besatzungszone", en: "occupation zone", ru: "оккупационная зона", uk: "окупаційна зона" }
      - { de: "verwalten", en: "to administer", ru: "управлять", uk: "управляти" }
    status: reviewed
  - id: general-176
    rationale_de: >-
      Auf der Karte ist Zone 1 im Nordwesten die britische Zone, zum Beispiel mit Hamburg und dem Ruhrgebiet. Zone 2 im Osten war die sowjetische Zone, aus der später die DDR wurde. Zone 3 im Süden mit Bayern und Hessen war amerikanisch, und Zone 4 im Südwesten war die französische Zone.
    source: "bpb: Deutsche Teilung"
    question:
      en: "How were Germany's occupation zones divided up after 1945?"
      ru: "Как были распределены оккупационные зоны Германии после 1945 года?"
      uk: "Як було розподілено окупаційні зони Німеччини після 1945 року?"
    options:
      a: { en: "1 = Great Britain, 2 = Soviet Union, 3 = France, 4 = USA", ru: "1 = Великобритания, 2 = Советский Союз, 3 = Франция, 4 = США", uk: "1 = Велика Британія, 2 = Радянський Союз, 3 = Франція, 4 = США" }
      b: { en: "1 = Soviet Union, 2 = Great Britain, 3 = USA, 4 = France", ru: "1 = Советский Союз, 2 = Великобритания, 3 = США, 4 = Франция", uk: "1 = Радянський Союз, 2 = Велика Британія, 3 = США, 4 = Франція" }
      c: { en: "1 = Great Britain, 2 = Soviet Union, 3 = USA, 4 = France", ru: "1 = Великобритания, 2 = Советский Союз, 3 = США, 4 = Франция", uk: "1 = Велика Британія, 2 = Радянський Союз, 3 = США, 4 = Франція" }
      d: { en: "1 = Great Britain, 2 = USA, 3 = Soviet Union, 4 = France", ru: "1 = Великобритания, 2 = США, 3 = Советский Союз, 4 = Франция", uk: "1 = Велика Британія, 2 = США, 3 = Радянський Союз, 4 = Франція" }
    terms:
      - { de: "die Besatzungszone", en: "occupation zone", ru: "оккупационная зона", uk: "окупаційна зона" }
      - { de: "verteilen", en: "to distribute", ru: "распределять", uk: "розподіляти" }
    status: reviewed
  - id: general-177
    rationale_de: >-
      Berlin lag mitten in der sowjetischen Besatzungszone. Trotzdem teilten die vier Siegermächte die Stadt in vier Sektoren: einen amerikanischen, einen britischen, einen französischen und einen sowjetischen. Aus den drei westlichen Sektoren wurde West-Berlin, aus dem sowjetischen Sektor Ost-Berlin.
    source: "bpb: Deutsche Teilung"
    question:
      en: "Which German city was divided into four sectors after the Second World War?"
      ru: "Какой немецкий город после Второй мировой войны был разделён на четыре сектора?"
      uk: "Яке німецьке місто після Другої світової війни було поділено на чотири сектори?"
    options:
      a: { en: "Munich", ru: "Мюнхен", uk: "Мюнхен" }
      b: { en: "Berlin", ru: "Берлин", uk: "Берлін" }
      c: { en: "Dresden", ru: "Дрезден", uk: "Дрезден" }
      d: { en: "Frankfurt (Oder)", ru: "Франкфурт-на-Одере", uk: "Франкфурт-на-Одері" }
    terms:
      - { de: "der Sektor", en: "sector", ru: "сектор", uk: "сектор" }
    status: reviewed
  - id: general-178
    rationale_de: >-
      Im Juni 1948 sperrte die Sowjetunion alle Straßen, Bahnlinien und Wasserwege nach West-Berlin. Darum versorgten vor allem die USA und Großbritannien die Menschen fast ein Jahr lang mit Flugzeugen: mit Lebensmitteln, Kohle und anderen Waren. Im Mai 1949 beendete die Sowjetunion diese Berlin-Blockade.
    source: "bpb: Deutsche Teilung"
    question:
      en: "From June 1948 to May 1949, the people of West Berlin were supplied by an airlift. What circumstance was responsible for this?"
      ru: "С июня 1948 по май 1949 года жителей Западного Берлина снабжали по воздушному мосту. Какое обстоятельство стало тому причиной?"
      uk: "З червня 1948 до травня 1949 року мешканок і мешканців Західного Берліна забезпечували через повітряний міст. Яка обставина спричинила це?"
    options:
      a: { en: "For France, supplying the people of West Berlin by plane was cheaper.", ru: "Для Франции снабжать население Западного Берлина самолётами было дешевле.", uk: "Для Франції забезпечувати населення Західного Берліна літаками було дешевше." }
      b: { en: "The American soldiers were afraid of raids during land transport.", ru: "Американские солдаты боялись нападений при перевозках по суше.", uk: "Американські військові боялися нападів під час перевезень суходолом." }
      c: { en: "For Great Britain, supplying the city via the airlift was faster.", ru: "Для Великобритании снабжение по воздушному мосту было быстрее.", uk: "Для Великої Британії забезпечення через повітряний міст було швидшим." }
      d: { en: "The Soviet Union cut off all traffic by land.", ru: "Советский Союз прервал всё сообщение по суше.", uk: "Радянський Союз перервав усе сполучення суходолом." }
    terms:
      - { de: "die Luftbrücke", en: "airlift", ru: "воздушный мост", uk: "повітряний міст" }
      - { de: "versorgen", en: "to supply", ru: "снабжать", uk: "забезпечувати" }
      - { de: "die Blockade", en: "blockade", ru: "блокада", uk: "блокада" }
    status: reviewed
  - id: general-180
    rationale_de: >-
      Der Bundestag wählte Konrad Adenauer am 15. September 1949 zum ersten Bundeskanzler. Er blieb 14 Jahre im Amt, bis 1963. Sein Nachfolger wurde Ludwig Erhard, den man den „Vater des Wirtschaftswunders“ nennt; Willy Brandt und Gerhard Schröder kamen viel später.
    question:
      en: "The first Federal Chancellor of the Federal Republic of Germany was …"
      ru: "Первым федеральным канцлером Федеративной Республики Германия был …"
      uk: "Першим федеральним канцлером Федеративної Республіки Німеччина був …"
    options:
      a: { en: "Ludwig Erhard.", ru: "Людвиг Эрхард.", uk: "Людвіг Ерхард." }
      b: { en: "Willy Brandt.", ru: "Вилли Брандт.", uk: "Віллі Брандт." }
      c: { en: "Konrad Adenauer.", ru: "Конрад Аденауэр.", uk: "Конрад Аденауер." }
      d: { en: "Gerhard Schröder.", ru: "Герхард Шрёдер.", uk: "Герхард Шредер." }
    terms:
      - { de: "der Nachfolger", en: "successor", ru: "преемник", uk: "наступник" }
    status: reviewed
  - id: general-183
    rationale_de: >-
      Mit „Wirtschaftswunder“ meint man den schnellen wirtschaftlichen Aufschwung in der Bundesrepublik in den 1950er-Jahren. Nach der Währungsreform 1948 wuchs die Wirtschaft stark, viele Menschen fanden Arbeit, und der Wohlstand stieg. Ludwig Erhard, damals Wirtschaftsminister, gilt als „Vater des Wirtschaftswunders“.
    source: "bpb: Soziale Marktwirtschaft"
    question:
      en: "When was the “economic miracle” in the Federal Republic of Germany?"
      ru: "Когда в Федеративной Республике Германия было «экономическое чудо»?"
      uk: "Коли у Федеративній Республіці Німеччина було «економічне диво»?"
    options:
      a: { en: "the 1940s", ru: "1940-е годы", uk: "1940-ті роки" }
      b: { en: "the 1950s", ru: "1950-е годы", uk: "1950-ті роки" }
      c: { en: "the 1970s", ru: "1970-е годы", uk: "1970-ті роки" }
      d: { en: "the 1980s", ru: "1980-е годы", uk: "1980-ті роки" }
    terms:
      - { de: "das Wirtschaftswunder", en: "economic miracle", ru: "экономическое чудо", uk: "економічне диво" }
      - { de: "der Aufschwung", en: "upswing", ru: "подъём", uk: "піднесення" }
      - { de: "die Währungsreform", en: "currency reform", ru: "денежная реформа", uk: "грошова реформа" }
    status: reviewed
  - id: general-185
    rationale_de: >-
      „Eiserner Vorhang“ war ein Bild für die Grenze zwischen Ost und West im Kalten Krieg. Die Staaten des Warschauer Pakts schlossen sich mit Zäunen, Mauern und Wachtürmen gegen den Westen ab, und ihre Bürgerinnen und Bürger durften meist nicht frei reisen. Bekannt machte den Ausdruck 1946 der britische Politiker Winston Churchill.
    source: "bpb: Kalter Krieg"
    question:
      en: "What did the expression “Iron Curtain” stand for? For the sealing-off of …"
      ru: "Что обозначало выражение «железный занавес»? Изоляцию …"
      uk: "Що означав вислів «залізна завіса»? Відгородження …"
    options:
      a: { en: "the Warsaw Pact from the West", ru: "Варшавского договора от Запада", uk: "Варшавського договору від Заходу" }
      b: { en: "northern Germany from southern Germany", ru: "Северной Германии от Южной Германии", uk: "Північної Німеччини від Південної Німеччини" }
      c: { en: "Nazi Germany from the Allies", ru: "нацистской Германии от союзников", uk: "нацистської Німеччини від союзників" }
      d: { en: "Europe from the USA", ru: "Европы от США", uk: "Європи від США" }
    terms:
      - { de: "der Eiserne Vorhang", en: "Iron Curtain", ru: "железный занавес", uk: "залізна завіса" }
      - { de: "die Abschottung", en: "sealing off", ru: "изоляция", uk: "відгородження" }
    status: reviewed
  - id: general-186
    rationale_de: >-
      Am 17. Juni 1953 gingen in der DDR viele Menschen auf die Straße und streikten – gegen höhere Arbeitsnormen und für freie Wahlen. Sowjetische Panzer beendeten den Aufstand mit Gewalt. In der Bundesrepublik war der 17. Juni danach bis 1990 ein Feiertag, der „Tag der deutschen Einheit“.
    source: "bpb: 17. Juni 1953"
    question:
      en: "In 1953 there was an uprising in the GDR which, for a long time, was commemorated by a public holiday in the Federal Republic of Germany. When was that?"
      ru: "В 1953 году в ГДР произошло восстание, о котором долгое время напоминал праздничный день в Федеративной Республике Германия. Когда это было?"
      uk: "1953 року в НДР відбулося повстання, про яке у Федеративній Республіці Німеччина тривалий час нагадував святковий день. Коли це було?"
    options:
      a: { en: "1 May", ru: "1 мая", uk: "1 травня" }
      b: { en: "17 June", ru: "17 июня", uk: "17 червня" }
      c: { en: "20 July", ru: "20 июля", uk: "20 липня" }
      d: { en: "9 November", ru: "9 ноября", uk: "9 листопада" }
    terms:
      - { de: "der Aufstand", en: "uprising", ru: "восстание", uk: "повстання" }
      - { de: "der Feiertag", en: "public holiday", ru: "праздничный день", uk: "святковий день" }
    status: reviewed
  - id: general-187
    rationale_de: >-
      Die DDR hatte wie die Bundesrepublik eine Flagge in Schwarz-Rot-Gold. Ab 1959 stand in der Mitte aber das Staatswappen der DDR: Hammer und Zirkel in einem Kranz aus Ähren. Diese Zeichen standen für die Arbeiter, die Intelligenz und die Bauern.
    question:
      en: "Which German state had a black-red-gold flag with a hammer, a pair of compasses and a wreath of ears of grain?"
