  - id: general-210
    rationale_de: >-
      Am 17. Juni 1953 streikten und demonstrierten in der ganzen DDR Hunderttausende Menschen. Es begann am Tag davor mit Bauarbeitern in Ost-Berlin, die gegen höhere Arbeitsnormen protestierten; bald forderten die Menschen auch freie Wahlen. Die sowjetische Armee schlug den Volksaufstand mit Panzern nieder.
    source: "bpb: 17. Juni 1953"
    question:
      en: "What happened in the GDR on 17 June 1953?"
      ru: "Что произошло в ГДР 17 июня 1953 года?"
    options:
      a: { en: "the ceremonial accession to the Warsaw Pact", ru: "торжественное вступление в Варшавский договор" }
      b: { en: "nationwide strikes and a popular uprising", ru: "забастовки по всей стране и народное восстание" }
      c: { en: "the 1st SED party congress", ru: "первый съезд СЕПГ" }
      d: { en: "Fidel Castro's first visit", ru: "первый визит Фиделя Кастро" }
    terms:
      - { de: "der Streik", en: "strike", ru: "забастовка" }
      - { de: "der Volksaufstand", en: "popular uprising", ru: "народное восстание" }
      - { de: "landesweit", en: "nationwide", ru: "по всей стране" }
    status: draft
  - id: general-211
    rationale_de: >-
      Willy Brandt von der SPD war von 1969 bis 1974 Bundeskanzler. Mit seiner neuen Ostpolitik schloss die Bundesrepublik Verträge mit der Sowjetunion, mit Polen, mit der Tschechoslowakei und mit der DDR – die „Ostverträge“. Für diese Politik der Entspannung bekam Brandt 1971 den Friedensnobelpreis.
    question:
      en: "Which politician is associated with the “Eastern Treaties”?"
      ru: "Какой политик ассоциируется с «Восточными договорами»?"
    options:
      a: { en: "Helmut Kohl", ru: "Гельмут Коль" }
      b: { en: "Willy Brandt", ru: "Вилли Брандт" }
      c: { en: "Mikhail Gorbachev", ru: "Михаил Горбачёв" }
      d: { en: "Ludwig Erhard", ru: "Людвиг Эрхард" }
    terms:
      - { de: "der Vertrag", en: "treaty", ru: "договор" }
      - { de: "die Entspannung", en: "détente", ru: "разрядка" }
    status: draft
  - id: general-217
    rationale_de: >-
      Die DDR wurde am 7. Oktober 1949 gegründet. Am 3. Oktober 1990 trat sie der Bundesrepublik bei, und danach gab es sie nicht mehr. Von 1945 bis 1949 gab es im Osten noch keinen Staat DDR, sondern die sowjetische Besatzungszone.
    source: "bpb: Geschichte der DDR"
    question:
      en: "During which period did the German Democratic Republic (GDR) exist?"
      ru: "В какой период существовала Германская Демократическая Республика (ГДР)?"
    options:
      a: { en: "1919 to 1927", ru: "с 1919 по 1927 год" }
      b: { en: "1933 to 1945", ru: "с 1933 по 1945 год" }
      c: { en: "1945 to 1961", ru: "с 1945 по 1961 год" }
      d: { en: "1949 to 1990", ru: "с 1949 по 1990 год" }
    terms:
      - { de: "der Zeitraum", en: "period", ru: "период" }
      - { de: "beitreten", en: "to accede", ru: "присоединиться" }
    status: draft
  - id: general-297
    rationale_de: >-
      1961 schloss die Bundesrepublik ein Anwerbeabkommen mit der Türkei, und viele türkische Arbeitskräfte kamen nach Deutschland. Viele von ihnen blieben und holten ihre Familien nach. Bis heute sind Menschen mit Wurzeln in der Türkei die größte Gruppe unter den Eingewanderten und ihren Nachkommen.
    source: Statistisches Bundesamt (Mikrozensus)
    question:
      en: "From which country have most migrants come to Germany?"
      ru: "Из какой страны в Германию приехало больше всего мигрантов?"
    options:
      a: { en: "Italy", ru: "Италия" }
      b: { en: "Poland", ru: "Польша" }
      c: { en: "Morocco", ru: "Марокко" }
      d: { en: "Turkey", ru: "Турция" }
    terms:
      - { de: "das Anwerbeabkommen", en: "recruitment agreement", ru: "соглашение о вербовке" }
      - { de: "die Nachkommen", en: "descendants", ru: "потомки" }
    status: draft
  - id: general-298
    rationale_de: >-
      Auch die DDR holte ausländische Arbeitskräfte ins Land; man nannte sie „Vertragsarbeiter“. Sie kamen vor allem aus anderen sozialistischen Ländern, besonders aus Vietnam, Polen und Mosambik. Sie wohnten meist getrennt von der Bevölkerung in Wohnheimen und sollten nach einigen Jahren wieder in ihre Heimat zurückkehren.
    source: "bpb: Migration"
    question:
      en: "The migrants who lived in the GDR came mainly from …"
      ru: "В ГДР жили главным образом мигранты из …"
    options:
      a: { en: "Vietnam, Poland, Mozambique.", ru: "Вьетнама, Польши, Мозамбика." }
      b: { en: "France, Romania, Somalia.", ru: "Франции, Румынии, Сомали." }
      c: { en: "Chile, Hungary, Zimbabwe.", ru: "Чили, Венгрии, Зимбабве." }
      d: { en: "North Korea, Mexico, Egypt.", ru: "Северной Кореи, Мексики, Египта." }
    terms:
      - { de: "der Vertragsarbeiter", en: "contract worker", ru: "рабочий по контракту" }
      - { de: "das Wohnheim", en: "hostel", ru: "общежитие" }
    status: draft
  - id: general-299
    rationale_de: >-
      In den 1950er- und 1960er-Jahren fehlten in der Bundesrepublik Arbeitskräfte. Darum warb sie Arbeiterinnen und Arbeiter aus dem Ausland an, zuerst 1955 aus Italien. Man nannte sie „Gastarbeiter“, weil man glaubte, dass sie nur für kurze Zeit bleiben. Viele blieben aber für immer in Deutschland.
    source: "bpb: Migration"
    question:
      en: "Foreign workers recruited by the Federal Republic of Germany in the 1950s and 1960s were called …"
      ru: "Иностранных работников, которых Федеративная Республика Германия вербовала в 1950-х и 1960-х годах, называли …"
    options:
      a: { en: "undeclared workers.", ru: "работниками «вчёрную»." }
      b: { en: "guest workers.", ru: "гастарбайтерами." }
      c: { en: "temporary agency workers.", ru: "временными работниками." }
      d: { en: "shift workers.", ru: "сменными рабочими." }
    terms:
      - { de: "anwerben", en: "to recruit", ru: "вербовать" }
      - { de: "der Gastarbeiter", en: "guest worker", ru: "гастарбайтер" }
      - { de: "die Schwarzarbeit", en: "undeclared work", ru: "работа вчёрную" }
    status: draft
  - id: general-300
    rationale_de: >-
      Das erste Anwerbeabkommen schloss die Bundesrepublik 1955 mit Italien – darum kamen die ersten Gastarbeiterinnen und Gastarbeiter von dort. Später folgten Abkommen mit Spanien und Griechenland (1960), der Türkei (1961) und Portugal (1964).
    source: "bpb: Migration"
    question:
      en: "From which country did the first guest workers come to the Federal Republic of Germany?"
      ru: "Из какой страны в Федеративную Республику Германия приехали первые гастарбайтеры?"
    options:
