notes:
  - id: general-151
    rationale_de: >-
      Die DDR begann am 13. August 1961, die Mauer in Berlin zu bauen. Die Mauer lag rund um West-Berlin und trennte es von Ost-Berlin und vom Umland. So wollte die DDR verhindern, dass noch mehr Menschen in den Westen flohen – bis dahin waren schon Millionen gegangen.
    source: "bpb: Deutsche Teilung"
    question:
      en: "Who built the Wall in Berlin?"
      ru: "Кто построил стену в Берлине?"
    options:
      a: { en: "Great Britain", ru: "Великобритания" }
      b: { en: "the GDR", ru: "ГДР" }
      c: { en: "the Federal Republic of Germany", ru: "Федеративная Республика Германия" }
      d: { en: "the USA", ru: "США" }
    terms:
      - { de: "die Mauer", en: "wall", ru: "стена" }
      - { de: "fliehen", en: "to flee", ru: "бежать" }
    status: draft
  - id: general-165
    rationale_de: >-
      Konrad Adenauer von der CDU war von 1949 bis 1963 der erste Bundeskanzler der Bundesrepublik. Er verband den neuen Staat eng mit dem Westen, besonders mit den USA und Frankreich. Kiesinger, Brandt und Schmidt regierten erst später, zwischen 1966 und 1982.
    question:
      en: "What was the name of the first Federal Chancellor of the Federal Republic of Germany?"
      ru: "Как звали первого федерального канцлера Федеративной Республики Германия?"
    options:
      a: { en: "Konrad Adenauer", ru: "Конрад Аденауэр" }
      b: { en: "Kurt Georg Kiesinger", ru: "Курт Георг Кизингер" }
      c: { en: "Helmut Schmidt", ru: "Гельмут Шмидт" }
      d: { en: "Willy Brandt", ru: "Вилли Брандт" }
    terms:
      - { de: "der Bundeskanzler", en: "Federal Chancellor", ru: "федеральный канцлер" }
    status: draft
  - id: general-167
    rationale_de: >-
      Nach dem Zweiten Weltkrieg teilten vier Siegermächte Deutschland in vier Besatzungszonen: die USA, die Sowjetunion, Großbritannien und Frankreich. Man nannte sie die alliierten Besatzungsmächte. In den anderen Antworten steht immer mindestens ein Land, das keine Besatzungsmacht war, zum Beispiel Japan – es hatte im Krieg auf der Seite Deutschlands gekämpft.
    source: "bpb: Deutsche Teilung"
    question:
      en: "Which countries were called the “Allied occupying powers” in Germany after the Second World War?"
      ru: "Какие страны после Второй мировой войны называли в Германии «союзными оккупационными державами»?"
    options:
      a: { en: "Soviet Union, Great Britain, Poland, Sweden", ru: "Советский Союз, Великобритания, Польша, Швеция" }
      b: { en: "France, Soviet Union, Italy, Japan", ru: "Франция, Советский Союз, Италия, Япония" }
      c: { en: "USA, Soviet Union, Spain, Portugal", ru: "США, Советский Союз, Испания, Португалия" }
      d: { en: "USA, Soviet Union, Great Britain, France", ru: "США, Советский Союз, Великобритания, Франция" }
    terms:
      - { de: "die Besatzungsmacht", en: "occupying power", ru: "оккупационная держава" }
      - { de: "die Alliierten", en: "the Allies", ru: "союзники" }
      - { de: "die Siegermacht", en: "victorious power", ru: "держава-победительница" }
    status: draft
  - id: general-168
    rationale_de: >-
      Japan hatte im Zweiten Weltkrieg auf der Seite Deutschlands gekämpft und den Krieg ebenfalls verloren. Darum war Japan keine Besatzungsmacht in Deutschland. Die vier Besatzungsmächte waren die USA, die Sowjetunion, Großbritannien und Frankreich.
    source: "bpb: Deutsche Teilung"
    question:
      en: "Which country was not an “Allied occupying power” in Germany?"
      ru: "Какая страна не была «союзной оккупационной державой» в Германии?"
    options:
      a: { en: "USA", ru: "США" }
      b: { en: "Soviet Union", ru: "Советский Союз" }
      c: { en: "France", ru: "Франция" }
      d: { en: "Japan", ru: "Япония" }
    terms:
      - { de: "die Besatzungsmacht", en: "occupying power", ru: "оккупационная держава" }
    status: draft
  - id: general-169
    rationale_de: >-
      Die Bundesrepublik Deutschland wurde 1949 gegründet: Am 23. Mai 1949 wurde das Grundgesetz verkündet. Im selben Jahr, am 7. Oktober, entstand im Osten die DDR. 1945 war nur der Krieg zu Ende; danach regierten zuerst die Besatzungsmächte.
    source: GG Art. 145
    question:
      en: "When was the Federal Republic of Germany founded?"
      ru: "Когда была основана Федеративная Республика Германия?"
    options:
      a: { en: "1939", ru: "1939" }
      b: { en: "1945", ru: "1945" }
      c: { en: "1949", ru: "1949" }
      d: { en: "1951", ru: "1951" }
    terms:
      - { de: "gründen", en: "to found", ru: "основать" }
      - { de: "verkünden", en: "to promulgate", ru: "обнародовать" }
    status: draft
  - id: general-172
    rationale_de: >-
      Nach 1945 war Deutschland in vier Besatzungszonen geteilt. Im Osten lag die sowjetische Zone – dort wurde am 7. Oktober 1949 die DDR gegründet. Aus den drei Westzonen der USA, Großbritanniens und Frankreichs entstand im selben Jahr die Bundesrepublik.
    source: "bpb: Deutsche Teilung"
    question:
      en: "In which occupation zone was the GDR founded? In the …"
      ru: "В какой оккупационной зоне была основана ГДР? В …"
    options:
      a: { en: "American occupation zone", ru: "американской оккупационной зоне" }
      b: { en: "French occupation zone", ru: "французской оккупационной зоне" }
      c: { en: "British occupation zone", ru: "британской оккупационной зоне" }
      d: { en: "Soviet occupation zone", ru: "советской оккупационной зоне" }
    terms:
      - { de: "die Besatzungszone", en: "occupation zone", ru: "оккупационная зона" }
    status: draft
  - id: general-174
    rationale_de: >-
      Die DDR wurde am 7. Oktober 1949 gegründet, wenige Monate nach der Bundesrepublik. Sie bestand bis zum 3. Oktober 1990. Das Jahr 1953 ist wegen des Volksaufstands vom 17. Juni bekannt.
    source: "bpb: Deutsche Teilung"
    question:
      en: "When was the GDR founded?"
      ru: "Когда была основана ГДР?"
    options:
      a: { en: "1947", ru: "1947" }
      b: { en: "1949", ru: "1949" }
      c: { en: "1953", ru: "1953" }
      d: { en: "1956", ru: "1956" }
    terms:
      - { de: "bestehen", en: "to exist", ru: "существовать" }
    status: draft
  - id: general-175
    rationale_de: >-
      Die vier Siegermächte – die USA, die Sowjetunion, Großbritannien und Frankreich – teilten Deutschland nach dem Krieg in vier Besatzungszonen. Jede Macht verwaltete eine Zone. Berlin lag mitten in der sowjetischen Zone und wurde zusätzlich in vier Sektoren geteilt.
    source: "bpb: Deutsche Teilung"
    question:
      en: "How many occupation zones were there in Germany after the Second World War?"
      ru: "Сколько оккупационных зон было в Германии после Второй мировой войны?"
    options:
      a: { en: "3", ru: "3" }
      b: { en: "4", ru: "4" }
      c: { en: "5", ru: "5" }
      d: { en: "6", ru: "6" }
    terms:
      - { de: "die Besatzungszone", en: "occupation zone", ru: "оккупационная зона" }
      - { de: "verwalten", en: "to administer", ru: "управлять" }
    status: draft
  - id: general-176
    rationale_de: >-
      Auf der Karte ist Zone 1 im Nordwesten die britische Zone, zum Beispiel mit Hamburg und dem Ruhrgebiet. Zone 2 im Osten war die sowjetische Zone, aus der später die DDR wurde. Zone 3 im Süden mit Bayern und Hessen war amerikanisch, und Zone 4 im Südwesten war die französische Zone.
    source: "bpb: Deutsche Teilung"
    question:
      en: "How were Germany's occupation zones divided up after 1945?"
      ru: "Как были распределены оккупационные зоны Германии после 1945 года?"
    options:
      a: { en: "1 = Great Britain, 2 = Soviet Union, 3 = France, 4 = USA", ru: "1 = Великобритания, 2 = Советский Союз, 3 = Франция, 4 = США" }
      b: { en: "1 = Soviet Union, 2 = Great Britain, 3 = USA, 4 = France", ru: "1 = Советский Союз, 2 = Великобритания, 3 = США, 4 = Франция" }
      c: { en: "1 = Great Britain, 2 = Soviet Union, 3 = USA, 4 = France", ru: "1 = Великобритания, 2 = Советский Союз, 3 = США, 4 = Франция" }
      d: { en: "1 = Great Britain, 2 = USA, 3 = Soviet Union, 4 = France", ru: "1 = Великобритания, 2 = США, 3 = Советский Союз, 4 = Франция" }
    terms:
      - { de: "die Besatzungszone", en: "occupation zone", ru: "оккупационная зона" }
      - { de: "verteilen", en: "to distribute", ru: "распределять" }
    status: draft
  - id: general-177
    rationale_de: >-
      Berlin lag mitten in der sowjetischen Besatzungszone. Trotzdem teilten die vier Siegermächte die Stadt in vier Sektoren: einen amerikanischen, einen britischen, einen französischen und einen sowjetischen. Aus den drei westlichen Sektoren wurde West-Berlin, aus dem sowjetischen Sektor Ost-Berlin.
    source: "bpb: Deutsche Teilung"
    question:
      en: "Which German city was divided into four sectors after the Second World War?"
      ru: "Какой немецкий город после Второй мировой войны был разделён на четыре сектора?"
    options:
      a: { en: "Munich", ru: "Мюнхен" }
      b: { en: "Berlin", ru: "Берлин" }
      c: { en: "Dresden", ru: "Дрезден" }
      d: { en: "Frankfurt (Oder)", ru: "Франкфурт-на-Одере" }
    terms:
      - { de: "der Sektor", en: "sector", ru: "сектор" }
    status: draft
  - id: general-178
    rationale_de: >-
      Im Juni 1948 sperrte die Sowjetunion alle Straßen, Bahnlinien und Wasserwege nach West-Berlin. Darum versorgten vor allem die USA und Großbritannien die Menschen fast ein Jahr lang mit Flugzeugen: mit Lebensmitteln, Kohle und anderen Waren. Im Mai 1949 beendete die Sowjetunion diese Berlin-Blockade.
    source: "bpb: Deutsche Teilung"
    question:
      en: "From June 1948 to May 1949, the people of West Berlin were supplied by an airlift. What circumstance was responsible for this?"
      ru: "С июня 1948 по май 1949 года жителей Западного Берлина снабжали по воздушному мосту. Какое обстоятельство стало тому причиной?"
    options:
      a: { en: "For France, supplying the people of West Berlin by plane was cheaper.", ru: "Для Франции снабжать население Западного Берлина самолётами было дешевле." }
      b: { en: "The American soldiers were afraid of raids during land transport.", ru: "Американские солдаты боялись нападений при перевозках по суше." }
      c: { en: "For Great Britain, supplying the city via the airlift was faster.", ru: "Для Великобритании снабжение по воздушному мосту было быстрее." }
      d: { en: "The Soviet Union cut off all traffic by land.", ru: "Советский Союз прервал всё сообщение по суше." }
    terms:
      - { de: "die Luftbrücke", en: "airlift", ru: "воздушный мост" }
      - { de: "versorgen", en: "to supply", ru: "снабжать" }
      - { de: "die Blockade", en: "blockade", ru: "блокада" }
    status: draft
  - id: general-180
    rationale_de: >-
      Der Bundestag wählte Konrad Adenauer am 15. September 1949 zum ersten Bundeskanzler. Er blieb 14 Jahre im Amt, bis 1963. Sein Nachfolger wurde Ludwig Erhard, den man den „Vater des Wirtschaftswunders“ nennt; Willy Brandt und Gerhard Schröder kamen viel später.
    question:
      en: "The first Federal Chancellor of the Federal Republic of Germany was …"
      ru: "Первым федеральным канцлером Федеративной Республики Германия был …"
    options:
      a: { en: "Ludwig Erhard.", ru: "Людвиг Эрхард." }
      b: { en: "Willy Brandt.", ru: "Вилли Брандт." }
      c: { en: "Konrad Adenauer.", ru: "Конрад Аденауэр." }
      d: { en: "Gerhard Schröder.", ru: "Герхард Шрёдер." }
    terms:
      - { de: "der Nachfolger", en: "successor", ru: "преемник" }
    status: draft
  - id: general-183
    rationale_de: >-
      Mit „Wirtschaftswunder“ meint man den schnellen wirtschaftlichen Aufschwung in der Bundesrepublik in den 1950er-Jahren. Nach der Währungsreform 1948 wuchs die Wirtschaft stark, viele Menschen fanden Arbeit, und der Wohlstand stieg. Ludwig Erhard, damals Wirtschaftsminister, gilt als „Vater des Wirtschaftswunders“.
    source: "bpb: Soziale Marktwirtschaft"
    question:
      en: "When was the “economic miracle” in the Federal Republic of Germany?"
      ru: "Когда в Федеративной Республике Германия было «экономическое чудо»?"
    options:
      a: { en: "the 1940s", ru: "1940-е годы" }
      b: { en: "the 1950s", ru: "1950-е годы" }
      c: { en: "the 1970s", ru: "1970-е годы" }
      d: { en: "the 1980s", ru: "1980-е годы" }
    terms:
      - { de: "das Wirtschaftswunder", en: "economic miracle", ru: "экономическое чудо" }
      - { de: "der Aufschwung", en: "upswing", ru: "подъём" }
      - { de: "die Währungsreform", en: "currency reform", ru: "денежная реформа" }
    status: draft
  - id: general-185
    rationale_de: >-
      „Eiserner Vorhang“ war ein Bild für die Grenze zwischen Ost und West im Kalten Krieg. Die Staaten des Warschauer Pakts schlossen sich mit Zäunen, Mauern und Wachtürmen gegen den Westen ab, und ihre Bürgerinnen und Bürger durften meist nicht frei reisen. Bekannt machte den Ausdruck 1946 der britische Politiker Winston Churchill.
    source: "bpb: Kalter Krieg"
    question:
      en: "What did the expression “Iron Curtain” stand for? For the sealing-off of …"
      ru: "Что обозначало выражение «железный занавес»? Изоляцию …"
    options:
      a: { en: "the Warsaw Pact from the West", ru: "Варшавского договора от Запада" }
      b: { en: "northern Germany from southern Germany", ru: "Северной Германии от Южной Германии" }
      c: { en: "Nazi Germany from the Allies", ru: "нацистской Германии от союзников" }
      d: { en: "Europe from the USA", ru: "Европы от США" }
    terms:
      - { de: "der Eiserne Vorhang", en: "Iron Curtain", ru: "железный занавес" }
      - { de: "die Abschottung", en: "sealing off", ru: "изоляция" }
    status: draft
  - id: general-186
    rationale_de: >-
      Am 17. Juni 1953 gingen in der DDR viele Menschen auf die Straße und streikten – gegen höhere Arbeitsnormen und für freie Wahlen. Sowjetische Panzer beendeten den Aufstand mit Gewalt. In der Bundesrepublik war der 17. Juni danach bis 1990 ein Feiertag, der „Tag der deutschen Einheit“.
    source: "bpb: 17. Juni 1953"
    question:
      en: "In 1953 there was an uprising in the GDR which, for a long time, was commemorated by a public holiday in the Federal Republic of Germany. When was that?"
      ru: "В 1953 году в ГДР произошло восстание, о котором долгое время напоминал праздничный день в Федеративной Республике Германия. Когда это было?"
    options:
      a: { en: "1 May", ru: "1 мая" }
      b: { en: "17 June", ru: "17 июня" }
      c: { en: "20 July", ru: "20 июля" }
      d: { en: "9 November", ru: "9 ноября" }
    terms:
      - { de: "der Aufstand", en: "uprising", ru: "восстание" }
      - { de: "der Feiertag", en: "public holiday", ru: "праздничный день" }
    status: draft
  - id: general-187
    rationale_de: >-
      Die DDR hatte wie die Bundesrepublik eine Flagge in Schwarz-Rot-Gold. Ab 1959 stand in der Mitte aber das Staatswappen der DDR: Hammer und Zirkel in einem Kranz aus Ähren. Diese Zeichen standen für die Arbeiter, die Intelligenz und die Bauern.
    question:
      en: "Which German state had a black-red-gold flag with a hammer, a pair of compasses and a wreath of ears of grain?"
      ru: "У какого немецкого государства был чёрно-красно-золотой флаг с молотом, циркулем и венком из колосьев?"
    options:
      a: { en: "Prussia", ru: "Пруссия" }
      b: { en: "Federal Republic of Germany", ru: "Федеративная Республика Германия" }
      c: { en: "“Third Reich”", ru: "«Третий рейх»" }
      d: { en: "GDR", ru: "ГДР" }
    terms:
      - { de: "der Zirkel", en: "pair of compasses", ru: "циркуль" }
      - { de: "der Ährenkranz", en: "wreath of grain", ru: "венок из колосьев" }
    status: draft
  - id: general-188
    rationale_de: >-
      In der Nacht zum 13. August 1961 sperrten bewaffnete Einheiten der DDR die Grenze zwischen Ost- und West-Berlin. Danach baute die DDR eine Mauer aus Beton. 1953 gab es den Volksaufstand in der DDR – die Mauer kam erst acht Jahre später.
    source: "bpb: Deutsche Teilung"
    question:
      en: "In which year was the Wall in Berlin built?"
      ru: "В каком году была построена стена в Берлине?"
    options:
      a: { en: "1953", ru: "1953" }
      b: { en: "1956", ru: "1956" }
      c: { en: "1959", ru: "1959" }
      d: { en: "1961", ru: "1961" }
    terms:
      - { de: "der Mauerbau", en: "building of the Wall", ru: "строительство стены" }
      - { de: "sperren", en: "to close off", ru: "перекрывать" }
    status: draft
  - id: general-189
    rationale_de: >-
      Am 13. August 1961 begann die DDR, die Mauer in Berlin zu bauen. 28 Jahre lang war die Stadt geteilt. Am 9. November 1989 wurde die Mauer geöffnet, und 1990 wurde Deutschland wiedervereinigt.
    source: "bpb: Deutsche Teilung"
    question:
      en: "When did the GDR build the Wall in Berlin?"
      ru: "Когда ГДР построила стену в Берлине?"
    options:
      a: { en: "1919", ru: "1919" }
      b: { en: "1933", ru: "1933" }
      c: { en: "1961", ru: "1961" }
      d: { en: "1990", ru: "1990" }
    status: draft
  - id: general-190
    rationale_de: >-
      DDR ist die Abkürzung für Deutsche Demokratische Republik. Trotz des Namens war die DDR keine Demokratie: Die SED bestimmte die Politik, und freie Wahlen gab es erst im März 1990. Den Staat gab es von 1949 bis 1990.
    source: "bpb: Geschichte der DDR"
    question:
      en: "What does the abbreviation DDR stand for?"
      ru: "Что означает аббревиатура DDR?"
    options:
      a: { en: "Third German Broadcasting", ru: "Третье немецкое радио" }
      b: { en: "The German Republic", ru: "Немецкая республика" }
      c: { en: "Third German Republic", ru: "Третья немецкая республика" }
      d: { en: "German Democratic Republic", ru: "Германская Демократическая Республика" }
    terms:
      - { de: "die Abkürzung", en: "abbreviation", ru: "аббревиатура" }
    status: draft
  - id: general-193
    rationale_de: >-
      Von 1961 bis 1989 teilte die Mauer Berlin in Ost und West. Für die Menschen aus der DDR war es fast unmöglich, nach West-Berlin zu kommen. Nur mit dem Flugzeug erreichbar war West-Berlin aber nicht: Es gab auch Straßen und Bahnlinien durch die DDR, die sogenannten Transitwege.
    source: "bpb: Deutsche Teilung"
    question:
      en: "From 1961 to 1989, Berlin was …"
      ru: "С 1961 по 1989 год Берлин был …"
    options:
      a: { en: "without a mayor.", ru: "без бургомистра." }
      b: { en: "a separate state.", ru: "отдельным государством." }
      c: { en: "divided by a wall.", ru: "разделён стеной." }
      d: { en: "only reachable by plane.", ru: "доступен только на самолёте." }
    terms:
      - { de: "teilen", en: "to divide", ru: "разделять" }
      - { de: "erreichbar", en: "reachable", ru: "доступный" }
    status: draft
  - id: general-199
    rationale_de: >-
      „Stasi“ ist die Kurzform für das Ministerium für Staatssicherheit der DDR. Die Stasi war Geheimpolizei und Geheimdienst zugleich. Sie überwachte die eigenen Bürgerinnen und Bürger und verfolgte Menschen, die den Staat oder die SED kritisierten.
    source: Stasi-Unterlagen-Archiv (Bundesarchiv)
    question:
      en: "In the GDR, the abbreviation “Stasi” meant …"
      ru: "Под сокращением «Штази» в ГДР понимали …"
    options:
      a: { en: "the parliament.", ru: "парламент." }
      b: { en: "the Ministry for State Security.", ru: "Министерство государственной безопасности." }
      c: { en: "a governing party.", ru: "правящую партию." }
      d: { en: "the Ministry of Public Education.", ru: "Министерство народного образования." }
    terms:
      - { de: "die Staatssicherheit", en: "state security", ru: "государственная безопасность" }
      - { de: "überwachen", en: "to keep under surveillance", ru: "следить" }
    status: draft
  - id: general-202
    rationale_de: >-
      Im Kalten Krieg standen sich zwei Blöcke gegenüber: der Westen mit der NATO und der Osten mit dem Warschauer Pakt unter Führung der Sowjetunion. Die DDR gehörte zum Warschauer Pakt, die Bundesrepublik zur NATO. Blockfreie Staaten wollten zu keinem der beiden Blöcke gehören.
    source: "bpb: Kalter Krieg"
    question:
      en: "Which side did the GDR belong to in the “Cold War”?"
      ru: "К кому относилась ГДР во время «холодной войны»?"
    options:
      a: { en: "to the Western powers", ru: "к западным державам" }
      b: { en: "to the Warsaw Pact", ru: "к Варшавскому договору" }
      c: { en: "to NATO", ru: "к НАТО" }
      d: { en: "to the non-aligned states", ru: "к неприсоединившимся государствам" }
    terms:
      - { de: "der Kalte Krieg", en: "Cold War", ru: "холодная война" }
