  - id: general-203
    rationale_de: >-
      In der DDR plante der Staat die Wirtschaft: Er bestimmte, was produziert wurde, wie viel und zu welchem Preis. Das nennt man Planwirtschaft. Die Bundesrepublik hat dagegen eine Soziale Marktwirtschaft, in der Angebot und Nachfrage die Preise bestimmen.
    source: "bpb: Geschichte der DDR"
    question:
      en: "What was the economic system of the GDR called?"
      ru: "Как называлась экономическая система ГДР?"
    options:
      a: { en: "market economy", ru: "рыночная экономика" }
      b: { en: "planned economy", ru: "плановая экономика" }
      c: { en: "supply and demand", ru: "спрос и предложение" }
      d: { en: "capitalism", ru: "капитализм" }
    terms:
      - { de: "die Planwirtschaft", en: "planned economy", ru: "плановая экономика" }
      - { de: "die Marktwirtschaft", en: "market economy", ru: "рыночная экономика" }
      - { de: "Angebot und Nachfrage", en: "supply and demand", ru: "спрос и предложение" }
    status: draft
  - id: general-207
    rationale_de: >-
      Der Warschauer Pakt war das Militärbündnis der Sowjetunion und der sozialistischen Staaten in Osteuropa. Die DDR war von 1955 bis 1990 Mitglied. Die Bundesrepublik gehörte dagegen zur NATO, und das vereinte Deutschland ist bis heute NATO-Mitglied.
    source: "bpb: Kalter Krieg"
    question:
      en: "Which military alliance was the GDR a member of?"
      ru: "В каком военном союзе состояла ГДР?"
    options:
      a: { en: "NATO", ru: "в НАТО" }
      b: { en: "the Confederation of the Rhine", ru: "в Рейнском союзе" }
      c: { en: "the Warsaw Pact", ru: "в Варшавском договоре" }
      d: { en: "the European Alliance", ru: "в Европейском альянсе" }
    terms:
      - { de: "das Militärbündnis", en: "military alliance", ru: "военный союз" }
    status: draft
  - id: general-208
    rationale_de: >-
      Die Stasi war der Geheimdienst der DDR. Neben ihren hauptamtlichen Mitarbeitern hatte sie viele „inoffizielle Mitarbeiter“, die heimlich über Freunde, Kollegen und sogar über die eigene Familie berichteten. Heute kann jeder Mensch nachfragen, ob es eine Stasi-Akte über ihn gibt, und sie lesen. Die Geheimpolizei im „Dritten Reich“ war dagegen die Gestapo.
    source: Stasi-Unterlagen-Archiv (Bundesarchiv)
    question:
      en: "What was the “Stasi”?"
      ru: "Чем была «Штази»?"
    options:
      a: { en: "the secret service in the “Third Reich”", ru: "спецслужбой в «Третьем рейхе»" }
      b: { en: "a famous German memorial site", ru: "известным немецким мемориалом" }
      c: { en: "the secret service of the GDR", ru: "спецслужбой ГДР" }
      d: { en: "a German sports club during the Second World War", ru: "немецким спортивным клубом во время Второй мировой войны" }
    terms:
      - { de: "der Geheimdienst", en: "secret service", ru: "спецслужба" }
      - { de: "die Akte", en: "file", ru: "досье" }
    status: draft
  - id: general-209
    rationale_de: >-
      Bild 4 zeigt das Staatswappen der DDR: Hammer und Zirkel auf rotem Grund, umgeben von einem Kranz aus goldenen Ähren mit einem schwarz-rot-goldenen Band. Bild 1 ist das Wappen der Bundesrepublik mit dem schwarzen Adler. Bild 3 ist das Zeichen der Bundeswehr, und Bild 2 ist ein altes christliches Symbol.
    question:
