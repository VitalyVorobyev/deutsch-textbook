  - id: general-202
    rationale_de: >-
      Im Kalten Krieg standen sich zwei Blöcke gegenüber: der Westen mit der NATO und der Osten mit dem Warschauer Pakt unter Führung der Sowjetunion. Die DDR gehörte zum Warschauer Pakt, die Bundesrepublik zur NATO. Blockfreie Staaten wollten zu keinem der beiden Blöcke gehören.
    source: "bpb: Kalter Krieg"
