    rationale_de: >-
      Von 1961 bis 1989 teilte die Mauer Berlin in Ost und West. Für die Menschen aus der DDR war es fast unmöglich, nach West-Berlin zu kommen. Nur mit dem Flugzeug erreichbar war West-Berlin aber nicht: Es gab auch Straßen und Bahnlinien durch die DDR, die sogenannten Transitwege.
    source: "bpb: Deutsche Teilung"
