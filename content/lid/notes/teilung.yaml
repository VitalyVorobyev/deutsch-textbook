  - id: general-188
    rationale_de: >-
      In der Nacht zum 13. August 1961 sperrten bewaffnete Einheiten der DDR die Grenze zwischen Ost- und West-Berlin. Danach baute die DDR eine Mauer aus Beton. 1953 gab es den Volksaufstand in der DDR – die Mauer kam erst acht Jahre später.
