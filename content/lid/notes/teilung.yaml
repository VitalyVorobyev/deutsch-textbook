  - id: general-190
    rationale_de: >-
      DDR ist die Abkürzung für Deutsche Demokratische Republik. Trotz des Namens war die DDR keine Demokratie: Die SED bestimmte die Politik, und freie Wahlen gab es erst im März 1990. Den Staat gab es von 1949 bis 1990.
