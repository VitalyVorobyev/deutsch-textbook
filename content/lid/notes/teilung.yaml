    rationale_de: >-
      „Stasi“ ist die Kurzform für das Ministerium für Staatssicherheit der DDR. Die Stasi war Geheimpolizei und Geheimdienst zugleich. Sie überwachte die eigenen Bürgerinnen und Bürger und verfolgte Menschen, die den Staat oder die SED kritisierten.
    source: Stasi-Unterlagen-Archiv (Bundesarchiv)
