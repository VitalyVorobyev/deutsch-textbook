notes:
  - id: general-059
    rationale_de: >-
      Aus dem Jahr 321 gibt es ein Gesetz des römischen Kaisers Konstantin: Juden durften in Köln in den Stadtrat berufen werden. Das ist der älteste schriftliche Beleg für eine jüdische Gemeinde auf dem Gebiet des heutigen Deutschlands. Darum feierte man 2021 das Festjahr „1700 Jahre jüdisches Leben in Deutschland“.
    source: "Edikt Kaiser Konstantins (321); Festjahr 2021"
    question:
      en: "How many years ago was there a Jewish community for the first time in the territory of present-day Germany?"
      ru: "Сколько лет назад на территории нынешней Германии впервые появилась еврейская община?"
    options:
      a: { en: "about 300 years ago", ru: "около 300 лет назад" }
      b: { en: "about 700 years ago", ru: "около 700 лет назад" }
      c: { en: "about 1150 years ago", ru: "около 1150 лет назад" }
      d: { en: "about 1700 years ago", ru: "около 1700 лет назад" }
    terms:
      - { de: "die jüdische Gemeinde", en: "Jewish community", ru: "еврейская община" }
      - { de: "der Beleg", en: "evidence", ru: "свидетельство" }
    status: reviewed
  - id: general-066
    rationale_de: >-
      Die größten jüdischen Gemeinden in Deutschland gibt es in Berlin und in München. Viele ihrer Mitglieder sind nach 1990 aus der früheren Sowjetunion eingewandert. Worms und Speyer sind dagegen für ihre sehr alte jüdische Geschichte bekannt – zusammen mit Mainz gehören sie heute zum UNESCO-Welterbe.
    source: "ZWST: Mitgliederstatistik der jüdischen Gemeinden"
    question:
      en: "Which cities have the largest Jewish communities in Germany?"
      ru: "В каких городах Германии самые большие еврейские общины?"
    options:
      a: { en: "Berlin and Munich", ru: "Берлин и Мюнхен" }
      b: { en: "Hamburg and Essen", ru: "Гамбург и Эссен" }
      c: { en: "Nuremberg and Stuttgart", ru: "Нюрнберг и Штутгарт" }
      d: { en: "Worms and Speyer", ru: "Вормс и Шпайер" }
    terms:
      - { de: "die Gemeinde", en: "community", ru: "община" }
      - { de: "einwandern", en: "to immigrate", ru: "иммигрировать" }
    status: reviewed
  - id: general-096
    rationale_de: >-
      Den Holocaust zu leugnen heißt, den Mord an etwa sechs Millionen europäischen Jüdinnen und Juden zu bestreiten. Wer das öffentlich tut oder den Holocaust verharmlost, kann nach § 130 des Strafgesetzbuches mit einer Freiheitsstrafe bis zu fünf Jahren oder mit einer Geldstrafe bestraft werden. Die Meinungsfreiheit schützt diese Lüge nicht.
    source: StGB § 130 Abs. 3
    question:
      en: "How can someone who denies the Holocaust be punished?"
      ru: "Как может быть наказан человек, который отрицает Холокост?"
    options:
      a: { en: "a cut in social benefits", ru: "сокращение социальных выплат" }
      b: { en: "up to 100 hours of community service", ru: "до 100 часов общественных работ" }
      c: { en: "not at all, Holocaust denial is permitted", ru: "никак, отрицание Холокоста разрешено" }
      d: { en: "with imprisonment of up to five years or a fine", ru: "лишением свободы на срок до пяти лет или денежным штрафом" }
    terms:
      - { de: "leugnen", en: "to deny", ru: "отрицать" }
      - { de: "die Freiheitsstrafe", en: "prison sentence", ru: "лишение свободы" }
      - { de: "verharmlosen", en: "to trivialise", ru: "преуменьшать" }
    status: reviewed
  - id: general-111
    rationale_de: >-
      Die Politik Israels darf man in Deutschland kritisieren und öffentlich diskutieren – das schützt die Meinungsfreiheit (Grundgesetz, Artikel 5). Auch eine israelische Flagge darf man auf dem eigenen Grundstück aufhängen. Wer aber öffentlich dazu aufruft, den Staat Israel zu vernichten, ruft zu Gewalt auf. Das ist verboten und kann bestraft werden.
    source: GG Art. 5
    question:
      en: "Which actions relating to the State of Israel are prohibited in Germany?"
      ru: "Какие действия, связанные с Государством Израиль, запрещены в Германии?"
    options:
      a: { en: "publicly criticising Israel's policy", ru: "публично критиковать политику Израиля" }
      b: { en: "hanging an Israeli flag on private property", ru: "вывешивать израильский флаг на частном участке" }
      c: { en: "a discussion about Israel's policy", ru: "обсуждение политики Израиля" }
      d: { en: "a public call for the destruction of Israel", ru: "публичный призыв к уничтожению Израиля" }
    terms:
      - { de: "der Aufruf", en: "call", ru: "призыв" }
      - { de: "die Vernichtung", en: "destruction", ru: "уничтожение" }
    status: reviewed
  - id: general-118
    rationale_de: >-
      Makkabi ist der Name der jüdischen Sportvereine in Deutschland. Mitglied werden können alle Menschen – egal, welche Religion, Herkunft oder Staatsangehörigkeit sie haben. In den Vereinen treiben jüdische und nichtjüdische Sportlerinnen und Sportler gemeinsam Sport.
    source: Makkabi Deutschland
    question:
      en: "Who may become a member of the roughly 40 Jewish Maccabi sports clubs?"
      ru: "Кто может стать членом примерно 40 еврейских спортивных клубов «Маккаби»?"
    options:
      a: { en: "only Germans", ru: "только немцы" }
      b: { en: "only Israelis", ru: "только израильтяне" }
      c: { en: "only religious people", ru: "только религиозные люди" }
      d: { en: "everyone", ru: "все люди" }
    terms:
      - { de: "der Sportverein", en: "sports club", ru: "спортивный клуб" }
      - { de: "das Mitglied", en: "member", ru: "член" }
    status: reviewed
  - id: general-149
    rationale_de: >-
      Wer den Holocaust leugnet, bestreitet den Mord an etwa sechs Millionen europäischen Jüdinnen und Juden. Das ist eine Form von Antisemitismus und kann in Deutschland bestraft werden (Strafgesetzbuch, § 130). Die israelische Regierung zu kritisieren ist dagegen erlaubt – wie bei jeder anderen Regierung.
    source: StGB § 130 Abs. 3
    question:
      en: "What is an example of antisemitic behaviour?"
      ru: "Что является примером антисемитского поведения?"
    options:
      a: { en: "attending a Jewish festival", ru: "посетить еврейский праздник" }
      b: { en: "criticising the Israeli government", ru: "критиковать правительство Израиля" }
      c: { en: "denying the Holocaust", ru: "отрицать Холокост" }
      d: { en: "playing football against Jews.", ru: "играть в футбол против евреев." }
    terms:
      - { de: "antisemitisch", en: "antisemitic", ru: "антисемитский" }
      - { de: "leugnen", en: "to deny", ru: "отрицать" }
    status: reviewed
  - id: general-181
    rationale_de: >-
      Am 7. Dezember 1970 besuchte Bundeskanzler Willy Brandt in Warschau das Denkmal für die Helden des Ghettos. Es erinnert an den Aufstand im Warschauer Ghetto 1943. Dort kniete Brandt unerwartet nieder und schwieg. Ohne Worte bat er so Polen und die polnischen Jüdinnen und Juden um Vergebung für die deutschen Verbrechen im Zweiten Weltkrieg.
    source: "bpb: Kniefall von Warschau"
    question:
      en: "What did Willy Brandt want to express by kneeling in 1970 in the former Jewish ghetto in Warsaw?"
      ru: "Что хотел выразить Вилли Брандт своим коленопреклонением в 1970 году в бывшем еврейском гетто в Варшаве?"
    options:
      a: { en: "He submitted to the former Allies.", ru: "Он подчинился бывшим союзникам." }
      b: { en: "He asked Poland and the Polish Jews for forgiveness.", ru: "Он просил прощения у Польши и польских евреев." }
      c: { en: "He showed his humility before the Warsaw Pact.", ru: "Он показал своё смирение перед Варшавским договором." }
      d: { en: "He said a prayer at the grave of the Unknown Soldier.", ru: "Он прочитал молитву у могилы Неизвестного солдата." }
    terms:
      - { de: "der Kniefall", en: "kneeling", ru: "коленопреклонение" }
      - { de: "die Vergebung", en: "forgiveness", ru: "прощение" }
      - { de: "die Demut", en: "humility", ru: "смирение" }
    status: reviewed
  - id: general-182
    rationale_de: >-
      Das Gebetshaus der Jüdinnen und Juden heißt Synagoge. Dort trifft sich die Gemeinde zum Gottesdienst, besonders am Schabbat. Kirche und Basilika sind christliche Gotteshäuser, und die Moschee ist das Gebetshaus der Musliminnen und Muslime.
    question:
      en: "What is the Jewish house of prayer called?"
      ru: "Как называется еврейский молитвенный дом?"
    options:
      a: { en: "basilica", ru: "базилика" }
      b: { en: "mosque", ru: "мечеть" }
      c: { en: "synagogue", ru: "синагога" }
      d: { en: "church", ru: "церковь" }
    terms:
      - { de: "das Gebetshaus", en: "house of prayer", ru: "молитвенный дом" }
      - { de: "die Synagoge", en: "synagogue", ru: "синагога" }
    status: reviewed
  - id: general-184
    rationale_de: >-
      Am 29. November 1947 beschloss die Generalversammlung der Vereinten Nationen die Resolution 181. Sie sah vor, Palästina in einen jüdischen und einen arabischen Staat zu teilen. Auf dieser Grundlage wurde am 14. Mai 1948 der Staat Israel gegründet.
    source: UN-Resolution 181 (1947)
    question:
      en: "On what legal basis was the State of Israel founded?"
      ru: "На какой правовой основе было основано Государство Израиль?"
    options:
      a: { en: "a resolution of the United Nations", ru: "резолюция Организации Объединённых Наций" }
      b: { en: "a decision of the Zionist Congress", ru: "решение Сионистского конгресса" }
      c: { en: "a proposal by the Federal Government", ru: "предложение федерального правительства" }
      d: { en: "a proposal by the USSR", ru: "предложение СССР" }
    terms:
      - { de: "die Vereinten Nationen", en: "United Nations", ru: "Организация Объединённых Наций" }
      - { de: "die Resolution", en: "resolution", ru: "резолюция" }
      - { de: "gründen", en: "to found", ru: "основать" }
    status: reviewed
  - id: general-206
    rationale_de: >-
      Stolpersteine sind kleine Gedenktafeln aus Messing im Gehweg. Sie liegen vor dem Haus, in dem ein Mensch zuletzt frei gewohnt hat, bevor die Nationalsozialisten ihn verfolgten, vertrieben oder ermordeten. Auf jedem Stein stehen der Name und das Schicksal dieses Menschen. Der Künstler Gunter Demnig verlegt die Steine seit den 1990er-Jahren.
    source: Projekt Stolpersteine (Gunter Demnig)
    question:
      en: "What do the so-called “Stolpersteine” (stumbling stones) in Germany commemorate?"
      ru: "О чём напоминают так называемые «камни преткновения» (Stolpersteine) в Германии?"
    options:
      a: { en: "famous German politicians", ru: "о знаменитых немецких политиках" }
      b: { en: "the victims of National Socialism", ru: "о жертвах национал-социализма" }
      c: { en: "road traffic deaths", ru: "о погибших в дорожных авариях" }
      d: { en: "well-known Jewish musicians", ru: "об известных еврейских музыкантах" }
    terms:
      - { de: "der Stolperstein", en: "stumbling stone", ru: "камень преткновения" }
      - { de: "das Opfer", en: "victim", ru: "жертва" }
      - { de: "erinnern an", en: "to commemorate", ru: "напоминать о" }
    status: reviewed
  - id: general-220
    rationale_de: >-
      Am 27. Januar 1945 befreiten Soldaten der sowjetischen Armee das Konzentrations- und Vernichtungslager Auschwitz. Dort hatten die Nationalsozialisten mehr als eine Million Menschen ermordet, die meisten von ihnen Jüdinnen und Juden. Seit 1996 ist der 27. Januar in Deutschland der Tag des Gedenkens an die Opfer des Nationalsozialismus.
    source: Proklamation des Bundespräsidenten (1996)
    question:
      en: "27 January is an official day of remembrance in Germany. What does this day commemorate?"
      ru: "27 января — официальный день памяти в Германии. О чём напоминает этот день?"
    options:
      a: { en: "the end of the Second World War", ru: "об окончании Второй мировой войны" }
      b: { en: "the adoption of the Basic Law", ru: "о принятии Основного закона" }
      c: { en: "the reunification of Germany", ru: "о воссоединении Германии" }
      d: { en: "the victims of National Socialism (the day the Auschwitz extermination camp was liberated)", ru: "о жертвах национал-социализма (день освобождения лагеря смерти Освенцим)" }
    terms:
      - { de: "der Gedenktag", en: "day of remembrance", ru: "день памяти" }
      - { de: "das Vernichtungslager", en: "extermination camp", ru: "лагерь смерти" }
      - { de: "die Befreiung", en: "liberation", ru: "освобождение" }
    status: reviewed
  - id: general-288
    rationale_de: >-
      Im Holocaust ermordeten die Nationalsozialisten etwa sechs Millionen europäische Jüdinnen und Juden. Aus diesem Verbrechen folgt die besondere Verantwortung Deutschlands gegenüber Israel. 1965 nahmen die Bundesrepublik und Israel diplomatische Beziehungen auf. Die Verantwortung kommt aus der Geschichte – im Grundgesetz wird Israel nicht genannt.
    question:
      en: "Where does Germany's special responsibility for Israel come from?"
      ru: "Из чего вытекает особая ответственность Германии за Израиль?"
    options:
      a: { en: "from membership of the European Union (EU)", ru: "из членства в Европейском союзе (ЕС)" }
      b: { en: "from the National Socialist crimes against Jews", ru: "из преступлений национал-социалистов против евреев" }
      c: { en: "from the Basic Law of the Federal Republic of Germany", ru: "из Основного закона Федеративной Республики Германия" }
      d: { en: "from the Christian tradition", ru: "из христианской традиции" }
    terms:
      - { de: "die Verantwortung", en: "responsibility", ru: "ответственность" }
      - { de: "das Verbrechen", en: "crime", ru: "преступление" }
    status: reviewed
