notes:
  - id: general-059
    rationale_de: >-
      Aus dem Jahr 321 gibt es ein Gesetz des römischen Kaisers Konstantin: Juden durften in Köln in den Stadtrat berufen werden. Das ist der älteste schriftliche Beleg für eine jüdische Gemeinde auf dem Gebiet des heutigen Deutschlands. Darum feierte man 2021 das Festjahr „1700 Jahre jüdisches Leben in Deutschland“.
    source: "Edikt Kaiser Konstantins (321); Festjahr 2021"
    question:
      en: "How many years ago was there a Jewish community for the first time in the territory of present-day Germany?"
      ru: "Сколько лет назад на территории нынешней Германии впервые появилась еврейская община?"
      uk: "Скільки років тому на території сучасної Німеччини вперше з’явилася єврейська громада?"
    options:
      a: { en: "about 300 years ago", ru: "около 300 лет назад", uk: "приблизно 300 років тому" }
      b: { en: "about 700 years ago", ru: "около 700 лет назад", uk: "приблизно 700 років тому" }
      c: { en: "about 1150 years ago", ru: "около 1150 лет назад", uk: "приблизно 1150 років тому" }
      d: { en: "about 1700 years ago", ru: "около 1700 лет назад", uk: "приблизно 1700 років тому" }
    terms:
      - { de: "die jüdische Gemeinde", en: "Jewish community", ru: "еврейская община", uk: "єврейська громада" }
      - { de: "der Beleg", en: "evidence", ru: "свидетельство", uk: "свідчення" }
    status: reviewed
  - id: general-066
    rationale_de: >-
      Die größten jüdischen Gemeinden in Deutschland gibt es in Berlin und in München. Viele ihrer Mitglieder sind nach 1990 aus der früheren Sowjetunion eingewandert. Worms und Speyer sind dagegen für ihre sehr alte jüdische Geschichte bekannt – zusammen mit Mainz gehören sie heute zum UNESCO-Welterbe.
    source: "ZWST: Mitgliederstatistik der jüdischen Gemeinden"
    question:
      en: "Which cities have the largest Jewish communities in Germany?"
      ru: "В каких городах Германии самые большие еврейские общины?"
      uk: "У яких містах Німеччини найбільші єврейські громади?"
    options:
      a: { en: "Berlin and Munich", ru: "Берлин и Мюнхен", uk: "Берлін і Мюнхен" }
      b: { en: "Hamburg and Essen", ru: "Гамбург и Эссен", uk: "Гамбург і Ессен" }
      c: { en: "Nuremberg and Stuttgart", ru: "Нюрнберг и Штутгарт", uk: "Нюрнберг і Штутгарт" }
      d: { en: "Worms and Speyer", ru: "Вормс и Шпайер", uk: "Вормс і Шпаєр" }
    terms:
      - { de: "die Gemeinde", en: "community", ru: "община", uk: "громада" }
      - { de: "einwandern", en: "to immigrate", ru: "иммигрировать", uk: "іммігрувати" }
    status: reviewed
  - id: general-096
    rationale_de: >-
      Den Holocaust zu leugnen heißt, den Mord an etwa sechs Millionen europäischen Jüdinnen und Juden zu bestreiten. Wer das öffentlich tut oder den Holocaust verharmlost, kann nach § 130 des Strafgesetzbuches mit einer Freiheitsstrafe bis zu fünf Jahren oder mit einer Geldstrafe bestraft werden. Die Meinungsfreiheit schützt diese Lüge nicht.
    source: StGB § 130 Abs. 3
    question:
      en: "How can someone who denies the Holocaust be punished?"
      ru: "Как может быть наказан человек, который отрицает Холокост?"
      uk: "Як можуть покарати того, хто заперечує Голокост?"
    options:
      a: { en: "a cut in social benefits", ru: "сокращение социальных выплат", uk: "скорочення соціальних виплат" }
      b: { en: "up to 100 hours of community service", ru: "до 100 часов общественных работ", uk: "до 100 годин громадських робіт" }
      c: { en: "not at all, Holocaust denial is permitted", ru: "никак, отрицание Холокоста разрешено", uk: "ніяк, заперечення Голокосту дозволене" }
      d: { en: "with imprisonment of up to five years or a fine", ru: "лишением свободы на срок до пяти лет или денежным штрафом", uk: "позбавленням волі на строк до п’яти років або штрафом" }
    terms:
      - { de: "leugnen", en: "to deny", ru: "отрицать", uk: "заперечувати" }
      - { de: "die Freiheitsstrafe", en: "prison sentence", ru: "лишение свободы", uk: "позбавлення волі" }
      - { de: "verharmlosen", en: "to trivialise", ru: "преуменьшать", uk: "применшувати" }
    status: reviewed
  - id: general-111
    rationale_de: >-
      Die Politik Israels darf man in Deutschland kritisieren und öffentlich diskutieren – das schützt die Meinungsfreiheit (Grundgesetz, Artikel 5). Auch eine israelische Flagge darf man auf dem eigenen Grundstück aufhängen. Wer aber öffentlich dazu aufruft, den Staat Israel zu vernichten, ruft zu Gewalt auf. Das ist verboten und kann bestraft werden.
    source: GG Art. 5
    question:
      en: "Which actions relating to the State of Israel are prohibited in Germany?"
      ru: "Какие действия, связанные с Государством Израиль, запрещены в Германии?"
      uk: "Які дії щодо Держави Ізраїль заборонені в Німеччині?"
    options:
      a: { en: "publicly criticising Israel's policy", ru: "публично критиковать политику Израиля", uk: "публічно критикувати політику Ізраїлю" }
      b: { en: "hanging an Israeli flag on private property", ru: "вывешивать израильский флаг на частном участке", uk: "вивішування ізраїльського прапора на приватній ділянці" }
      c: { en: "a discussion about Israel's policy", ru: "обсуждение политики Израиля", uk: "дискусія про політику Ізраїлю" }
      d: { en: "a public call for the destruction of Israel", ru: "публичный призыв к уничтожению Израиля", uk: "публічний заклик до знищення Ізраїлю" }
    terms:
      - { de: "der Aufruf", en: "call", ru: "призыв", uk: "заклик" }
      - { de: "die Vernichtung", en: "destruction", ru: "уничтожение", uk: "знищення" }
    status: reviewed
  - id: general-118
    rationale_de: >-
      Makkabi ist der Name der jüdischen Sportvereine in Deutschland. Mitglied werden können alle Menschen – egal, welche Religion, Herkunft oder Staatsangehörigkeit sie haben. In den Vereinen treiben jüdische und nichtjüdische Sportlerinnen und Sportler gemeinsam Sport.
    source: Makkabi Deutschland
    question:
      en: "Who may become a member of the roughly 40 Jewish Maccabi sports clubs?"
      ru: "Кто может стать членом примерно 40 еврейских спортивных клубов «Маккаби»?"
      uk: "Хто може стати членом приблизно 40 єврейських спортивних клубів «Маккабі»?"
    options:
      a: { en: "only Germans", ru: "только немцы", uk: "лише німці" }
      b: { en: "only Israelis", ru: "только израильтяне", uk: "лише ізраїльтяни" }
      c: { en: "only religious people", ru: "только религиозные люди", uk: "лише релігійні люди" }
      d: { en: "everyone", ru: "все люди", uk: "усі люди" }
    terms:
      - { de: "der Sportverein", en: "sports club", ru: "спортивный клуб", uk: "спортивний клуб" }
      - { de: "das Mitglied", en: "member", ru: "член", uk: "член" }
    status: reviewed
  - id: general-149
    rationale_de: >-
      Wer den Holocaust leugnet, bestreitet den Mord an etwa sechs Millionen europäischen Jüdinnen und Juden. Das ist eine Form von Antisemitismus und kann in Deutschland bestraft werden (Strafgesetzbuch, § 130). Die israelische Regierung zu kritisieren ist dagegen erlaubt – wie bei jeder anderen Regierung.
    source: StGB § 130 Abs. 3
    question:
      en: "What is an example of antisemitic behaviour?"
      ru: "Что является примером антисемитского поведения?"
      uk: "Що є прикладом антисемітської поведінки?"
    options:
      a: { en: "attending a Jewish festival", ru: "посетить еврейский праздник", uk: "відвідати єврейське свято" }
      b: { en: "criticising the Israeli government", ru: "критиковать правительство Израиля", uk: "критикувати ізраїльський уряд" }
      c: { en: "denying the Holocaust", ru: "отрицать Холокост", uk: "заперечувати Голокост" }
      d: { en: "playing football against Jews.", ru: "играть в футбол против евреев.", uk: "грати у футбол проти євреїв." }
    terms:
      - { de: "antisemitisch", en: "antisemitic", ru: "антисемитский", uk: "антисемітський" }
      - { de: "leugnen", en: "to deny", ru: "отрицать", uk: "заперечувати" }
    status: reviewed
  - id: general-181
    rationale_de: >-
      Am 7. Dezember 1970 besuchte Bundeskanzler Willy Brandt in Warschau das Denkmal für die Helden des Ghettos. Es erinnert an den Aufstand im Warschauer Ghetto 1943. Dort kniete Brandt unerwartet nieder und schwieg. Ohne Worte bat er so Polen und die polnischen Jüdinnen und Juden um Vergebung für die deutschen Verbrechen im Zweiten Weltkrieg.
    source: "bpb: Kniefall von Warschau"
    question:
      en: "What did Willy Brandt want to express by kneeling in 1970 in the former Jewish ghetto in Warsaw?"
      ru: "Что хотел выразить Вилли Брандт своим коленопреклонением в 1970 году в бывшем еврейском гетто в Варшаве?"
      uk: "Що хотів висловити Віллі Брандт своїм колінопреклонінням 1970 року в колишньому єврейському гетто у Варшаві?"
    options:
      a: { en: "He submitted to the former Allies.", ru: "Он подчинился бывшим союзникам.", uk: "Він підкорився колишнім союзникам." }
      b: { en: "He asked Poland and the Polish Jews for forgiveness.", ru: "Он просил прощения у Польши и польских евреев.", uk: "Він просив пробачення в Польщі та польських євреїв." }
      c: { en: "He showed his humility before the Warsaw Pact.", ru: "Он показал своё смирение перед Варшавским договором.", uk: "Він показав своє смирення перед Варшавським договором." }
      d: { en: "He said a prayer at the grave of the Unknown Soldier.", ru: "Он прочитал молитву у могилы Неизвестного солдата.", uk: "Він прочитав молитву біля могили Невідомого солдата." }
    terms:
      - { de: "der Kniefall", en: "kneeling", ru: "коленопреклонение", uk: "колінопреклоніння" }
      - { de: "die Vergebung", en: "forgiveness", ru: "прощение", uk: "прощення" }
      - { de: "die Demut", en: "humility", ru: "смирение", uk: "смирення" }
    status: reviewed
  - id: general-182
    rationale_de: >-
      Das Gebetshaus der Jüdinnen und Juden heißt Synagoge. Dort trifft sich die Gemeinde zum Gottesdienst, besonders am Schabbat. Kirche und Basilika sind christliche Gotteshäuser, und die Moschee ist das Gebetshaus der Musliminnen und Muslime.
    question:
      en: "What is the Jewish house of prayer called?"
      ru: "Как называется еврейский молитвенный дом?"
      uk: "Як називається єврейський молитовний дім?"
    options:
      a: { en: "basilica", ru: "базилика", uk: "базиліка" }
      b: { en: "mosque", ru: "мечеть", uk: "мечеть" }
      c: { en: "synagogue", ru: "синагога", uk: "синагога" }
      d: { en: "church", ru: "церковь", uk: "церква" }
    terms:
      - { de: "das Gebetshaus", en: "house of prayer", ru: "молитвенный дом", uk: "молитовний дім" }
      - { de: "die Synagoge", en: "synagogue", ru: "синагога", uk: "синагога" }
    status: reviewed
  - id: general-184
    rationale_de: >-
      Am 29. November 1947 beschloss die Generalversammlung der Vereinten Nationen die Resolution 181. Sie sah vor, Palästina in einen jüdischen und einen arabischen Staat zu teilen. Auf dieser Grundlage wurde am 14. Mai 1948 der Staat Israel gegründet.
    source: UN-Resolution 181 (1947)
    question:
      en: "On what legal basis was the State of Israel founded?"
      ru: "На какой правовой основе было основано Государство Израиль?"
      uk: "На якій правовій підставі було засновано Державу Ізраїль?"
    options:
      a: { en: "a resolution of the United Nations", ru: "резолюция Организации Объединённых Наций", uk: "резолюція Організації Об’єднаних Націй" }
      b: { en: "a decision of the Zionist Congress", ru: "решение Сионистского конгресса", uk: "рішення Сіоністського конгресу" }
      c: { en: "a proposal by the Federal Government", ru: "предложение федерального правительства", uk: "пропозиція федерального уряду" }
      d: { en: "a proposal by the USSR", ru: "предложение СССР", uk: "пропозиція СРСР" }
    terms:
      - { de: "die Vereinten Nationen", en: "United Nations", ru: "Организация Объединённых Наций", uk: "Організація Об’єднаних Націй" }
      - { de: "die Resolution", en: "resolution", ru: "резолюция", uk: "резолюція" }
      - { de: "gründen", en: "to found", ru: "основать", uk: "засновувати" }
    status: reviewed
  - id: general-206
    rationale_de: >-
      Stolpersteine sind kleine Gedenktafeln aus Messing im Gehweg. Sie liegen vor dem Haus, in dem ein Mensch zuletzt frei gewohnt hat, bevor die Nationalsozialisten ihn verfolgten, vertrieben oder ermordeten. Auf jedem Stein stehen der Name und das Schicksal dieses Menschen. Der Künstler Gunter Demnig verlegt die Steine seit den 1990er-Jahren.
    source: Projekt Stolpersteine (Gunter Demnig)
    question:
      en: "What do the so-called “Stolpersteine” (stumbling stones) in Germany commemorate?"
      ru: "О чём напоминают так называемые «камни преткновения» (Stolpersteine) в Германии?"
      uk: "Про що нагадують так звані «Stolpersteine» (пам’ятні знаки) у Німеччині?"
    options:
      a: { en: "famous German politicians", ru: "о знаменитых немецких политиках", uk: "про відомих німецьких політикинь і політиків" }
      b: { en: "the victims of National Socialism", ru: "о жертвах национал-социализма", uk: "про жертв націонал-соціалізму" }
      c: { en: "road traffic deaths", ru: "о погибших в дорожных авариях", uk: "про загиблих у дорожньо-транспортних пригодах" }
      d: { en: "well-known Jewish musicians", ru: "об известных еврейских музыкантах", uk: "про відомих єврейських музикантів" }
    terms:
      - { de: "der Stolperstein", en: "stumbling stone", ru: "памятный камень «штольперштайн»", uk: "пам’ятний знак «Stolperstein»" }
      - { de: "das Opfer", en: "victim", ru: "жертва", uk: "жертва" }
      - { de: "erinnern an", en: "to commemorate", ru: "напоминать о", uk: "нагадувати про" }
    status: reviewed
  - id: general-220
    rationale_de: >-
      Am 27. Januar 1945 befreiten Soldaten der sowjetischen Armee das Konzentrations- und Vernichtungslager Auschwitz. Dort hatten die Nationalsozialisten mehr als eine Million Menschen ermordet, die meisten von ihnen Jüdinnen und Juden. Seit 1996 ist der 27. Januar in Deutschland der Tag des Gedenkens an die Opfer des Nationalsozialismus.
    source: Proklamation des Bundespräsidenten (1996)
    question:
      en: "27 January is an official day of remembrance in Germany. What does this day commemorate?"
      ru: "27 января — официальный день памяти в Германии. О чём напоминает этот день?"
      uk: "27 січня — офіційний день пам’яті в Німеччині. Про що нагадує цей день?"
    options:
      a: { en: "the end of the Second World War", ru: "об окончании Второй мировой войны", uk: "про кінець Другої світової війни" }
      b: { en: "the adoption of the Basic Law", ru: "о принятии Основного закона", uk: "про ухвалення Основного закону" }
      c: { en: "the reunification of Germany", ru: "о воссоединении Германии", uk: "про возз’єднання Німеччини" }
      d: { en: "the victims of National Socialism (the day the Auschwitz extermination camp was liberated)", ru: "о жертвах национал-социализма (день освобождения лагеря смерти Освенцим)", uk: "про жертв націонал-соціалізму (день звільнення табору знищення Аушвіц)" }
    terms:
      - { de: "der Gedenktag", en: "day of remembrance", ru: "день памяти", uk: "день пам’яті" }
      - { de: "das Vernichtungslager", en: "extermination camp", ru: "лагерь смерти", uk: "табір знищення" }
      - { de: "die Befreiung", en: "liberation", ru: "освобождение", uk: "звільнення" }
    status: reviewed
  - id: general-288
    rationale_de: >-
      Im Holocaust ermordeten die Nationalsozialisten etwa sechs Millionen europäische Jüdinnen und Juden. Aus diesem Verbrechen folgt die besondere Verantwortung Deutschlands gegenüber Israel. 1965 nahmen die Bundesrepublik und Israel diplomatische Beziehungen auf. Die Verantwortung kommt aus der Geschichte – im Grundgesetz wird Israel nicht genannt.
    question:
      en: "Where does Germany's special responsibility for Israel come from?"
      ru: "Из чего вытекает особая ответственность Германии за Израиль?"
      uk: "Із чого випливає особлива відповідальність Німеччини за Ізраїль?"
    options:
      a: { en: "from membership of the European Union (EU)", ru: "из членства в Европейском союзе (ЕС)", uk: "із членства в Європейському Союзі (ЄС)" }
      b: { en: "from the National Socialist crimes against Jews", ru: "из преступлений национал-социалистов против евреев", uk: "із націонал-соціалістичних злочинів проти євреїв" }
      c: { en: "from the Basic Law of the Federal Republic of Germany", ru: "из Основного закона Федеративной Республики Германия", uk: "з Основного закону Федеративної Республіки Німеччина" }
      d: { en: "from the Christian tradition", ru: "из христианской традиции", uk: "з християнської традиції" }
    terms:
      - { de: "die Verantwortung", en: "responsibility", ru: "ответственность", uk: "відповідальність" }
      - { de: "das Verbrechen", en: "crime", ru: "преступление", uk: "злочин" }
    status: reviewed
