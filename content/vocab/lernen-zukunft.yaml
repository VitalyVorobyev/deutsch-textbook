id: lernen-zukunft
title_de: "Lernen & Zukunft"
title_en: "Learning & the future"
title_ru: "Учёба и будущее"
title_uk: "Навчання та майбутнє"
level: B1
entries:
  - de: "Beratung"
    ipa: "bəˈʁaːtʊŋ"
    pos: noun
    gender: f
    plural: "die Beratungen"
    en: "counselling, advice session"
    ru: "консультация"
    uk: "консультація"
    example_de: "In der Beratung haben wir über meinen nächsten Kurs gesprochen."
    example_en: "In the counselling session we talked about my next course."
    example_ru: "На консультации мы говорили о моём следующем курсе."
    example_uk: "На консультації ми говорили про мій наступний курс."
    note:
      en: "From beraten — to advise. The appointment itself is der Beratungstermin; the person across the table is die Beraterin."
      ru: "От beraten — «консультировать». Сама встреча — der Beratungstermin; человек напротив — die Beraterin."
      uk: "Від beraten — «консультувати». Сама зустріч — der Beratungstermin; людина навпроти — die Beraterin."

  - de: "Absicht"
    ipa: "ˈapzɪçt"
    pos: noun
    gender: f
    plural: "die Absichten"
    en: "intention"
    ru: "намерение"
    uk: "намір"
    example_de: "Ich habe die Absicht, im Herbst einen neuen Kurs zu beginnen."
    example_en: "I intend to start a new course in the autumn."
    example_ru: "Я намерена осенью начать новый курс."
    example_uk: "Я маю намір восени почати новий курс."
    note:
      en: "The frame is die Absicht haben + zu-infinitive — a formal cousin of vorhaben. Also mit Absicht — on purpose."
      ru: "Рамка — die Absicht haben + инфинитив с zu, официальный собрат vorhaben. Ещё mit Absicht — «нарочно»."
      uk: "Рамка — die Absicht haben + інфінітив із zu, офіційний брат vorhaben. Ще mit Absicht — «навмисно»."

  - de: "Fortschritt"
    ipa: "ˈfɔʁtˌʃʁɪt"
    pos: noun
    gender: m
    plural: "die Fortschritte"
    en: "progress"
    ru: "прогресс, успехи"
    uk: "прогрес, успіхи"
    example_de: "Mit zwanzig Minuten pro Tag macht man schnell Fortschritte."
    example_en: "With twenty minutes a day you make progress quickly."
    example_ru: "Двадцать минут в день — и успехи приходят быстро."
    example_uk: "Двадцять хвилин на день — і успіхи приходять швидко."
    note:
      en: "Almost always plural with machen: Fortschritte machen. Built from fort- (onward) + der Schritt — the step forward, literally."
      ru: "Почти всегда во множественном числе с machen: Fortschritte machen. Из fort- («вперёд») + der Schritt — буквально «шаг вперёд»."
      uk: "Майже завжди у множині з machen: Fortschritte machen. З fort- («уперед») + der Schritt — буквально «крок уперед»."

  - de: "Planung"
    ipa: "ˈplaːnʊŋ"
    pos: noun
    gender: f
    plural: "die Planungen"
    en: "planning"
    ru: "планирование"
    uk: "планування"
    example_de: "Ohne gute Planung schafft man neben der Arbeit keinen Kurs."
    example_en: "Without good planning you cannot manage a course beside a job."
    example_ru: "Без хорошего планирования курс рядом с работой не потянуть."
    example_uk: "Без доброго планування курс поряд із роботою не потягнути."
    note:
      en: "The process, not the sheet of paper: der Plan is what the Planung produces. -ung nouns from verbs are always feminine."
      ru: "Процесс, а не листок бумаги: der Plan — то, что Planung производит. Существительные на -ung от глаголов всегда женского рода."
      uk: "Процес, а не аркуш паперу: der Plan — те, що Planung виробляє. Іменники на -ung від дієслів завжди жіночого роду."

  - de: "Teilnahme"
    ipa: "ˈtaɪ̯lˌnaːmə"
    pos: noun
    gender: f
    plural: "—"
    en: "participation"
    ru: "участие"
    uk: "участь"
    example_de: "Die Teilnahme am Kurs kostet zweihundert Euro."
    example_en: "Participation in the course costs two hundred euros."
    example_ru: "Участие в курсе стоит двести евро."
    example_uk: "Участь у курсі коштує двісті євро."
    note:
      en: "Teilnahme an + Dat, exactly like its verb teilnehmen an + Dat from A2. On certificates: die regelmäßige Teilnahme."
      ru: "Teilnahme an + Dat — ровно как её глагол teilnehmen an + Dat из A2. В сертификатах: die regelmäßige Teilnahme."
      uk: "Teilnahme an + Dat — точно як її дієслово teilnehmen an + Dat з A2. У сертифікатах: die regelmäßige Teilnahme."

  - de: "Vorbereitung"
    ipa: "ˈfoːɐ̯bəˌʁaɪ̯tʊŋ"
    pos: noun
    gender: f
    plural: "die Vorbereitungen"
    en: "preparation"
    ru: "подготовка"
    uk: "підготовка"
    example_de: "Für die Vorbereitung auf die Prüfung habe ich sechs Wochen Zeit."
    example_en: "I have six weeks for the preparation for the exam."
    example_ru: "На подготовку к экзамену у меня шесть недель."
    example_uk: "На підготовку до іспиту я маю шість тижнів."
    note:
      en: "What you prepare for takes auf + Akk: die Vorbereitung auf die Prüfung. The verb pair is (sich) vorbereiten auf + Akk."
      ru: "К чему готовятся — auf + Akk: die Vorbereitung auf die Prüfung. Глагольная пара — (sich) vorbereiten auf + Akk."
      uk: "До чого готуються — auf + Akk: die Vorbereitung auf die Prüfung. Дієслівна пара — (sich) vorbereiten auf + Akk."

  - de: "Wiederholung"
    ipa: "viːdɐˈhoːlʊŋ"
    pos: noun
    gender: f
    plural: "die Wiederholungen"
    en: "revision, repetition"
    ru: "повторение"
    uk: "повторення"
    example_de: "Ohne regelmäßige Wiederholung vergisst man neue Wörter schnell."
    example_en: "Without regular revision you quickly forget new words."
    example_ru: "Без регулярного повторения новые слова быстро забываются."
    example_uk: "Без регулярного повторення нові слова швидко забуваються."
    note:
      en: "From wiederholen (A2). Also a TV rerun: Die Sendung ist eine Wiederholung."
      ru: "От wiederholen (A2). Также повтор передачи: Die Sendung ist eine Wiederholung."
      uk: "Від wiederholen (A2). Також повтор передачі: Die Sendung ist eine Wiederholung."

  - de: "Zukunft"
    ipa: "ˈtsuːkʊnft"
    pos: noun
    gender: f
    plural: "—"
    en: "future"
    ru: "будущее"
    uk: "майбутнє"
    example_de: "In Zukunft möchte ich bei der Arbeit nur Deutsch sprechen."
    example_en: "In future I want to speak only German at work."
    example_ru: "В будущем я хочу говорить на работе только по-немецки."
    example_uk: "У майбутньому я хочу говорити на роботі лише німецькою."
    note:
      en: "in Zukunft — from now on, without an article. The grammar of the future stays small: present tense plus werden + infinitive."
      ru: "in Zukunft — «впредь», без артикля. Грамматика будущего остаётся скромной: презенс плюс werden + инфинитив."
      uk: "in Zukunft — «надалі», без артикля. Граматика майбутнього лишається скромною: презенс плюс werden + інфінітив."

  - de: "Zusammenhang"
    ipa: "tsuˈzamənˌhaŋ"
    pos: noun
    gender: m
    plural: "die Zusammenhänge"
    en: "connection, context"
    ru: "связь, контекст"
    uk: "зв'язок, контекст"
    example_de: "Neue Wörter lerne ich am besten im Zusammenhang, nicht als Liste."
    example_en: "I learn new words best in context, not as a list."
    example_ru: "Новые слова я лучше всего учу в контексте, а не списком."
    example_uk: "Нові слова я найкраще вчу в контексті, а не списком."
    note:
      en: "im Zusammenhang mit + Dat — in connection with. Literally what hangs together: zusammen + hängen."
      ru: "im Zusammenhang mit + Dat — «в связи с». Буквально то, что висит вместе: zusammen + hängen."
      uk: "im Zusammenhang mit + Dat — «у зв'язку з». Буквально те, що висить разом: zusammen + hängen."

  - de: "Zweck"
    ipa: "ˈtsvɛk"
    pos: noun
    gender: m
    plural: "die Zwecke"
    en: "purpose"
    ru: "цель, назначение"
    uk: "мета, призначення"
    example_de: "Welchen Zweck hat diese Übung? — Sie trainiert die Verben."
    example_en: "What is the purpose of this exercise? — It trains the verbs."
    example_ru: "Какое назначение у этого упражнения? — Оно тренирует глаголы."
    example_uk: "Яке призначення в цієї вправи? — Вона тренує дієслова."
    note:
      en: "The question word for it is wozu?. Das Ziel is where you want to arrive; der Zweck is what a thing is for."
      ru: "Вопросительное слово к нему — wozu?. Das Ziel — куда вы хотите прийти; der Zweck — для чего вещь существует."
      uk: "Питальне слово до нього — wozu?. Das Ziel — куди ви хочете прийти; der Zweck — для чого річ існує."

  - de: "Zweifel"
    ipa: "ˈtsvaɪ̯fl̩"
    pos: noun
    gender: m
    plural: "die Zweifel"
    en: "doubt"
    ru: "сомнение"
    uk: "сумнів"
    example_de: "Ich hatte Zweifel an meinem Plan, aber die Beratung hat geholfen."
    example_en: "I had doubts about my plan, but the counselling session helped."
    example_ru: "У меня были сомнения в моём плане, но консультация помогла."
    example_uk: "Я мала сумніви щодо свого плану, але консультація допомогла."
    note:
      en: "Zweifel an + Dat; the fixed adverb is ohne Zweifel — without doubt. Built on zwei: standing between two answers."
      ru: "Zweifel an + Dat; устойчивое наречие — ohne Zweifel, «без сомнения». В корне zwei: стоять между двумя ответами."
      uk: "Zweifel an + Dat; сталий прислівник — ohne Zweifel, «без сумніву». У корені zwei: стояти між двома відповідями."

  - de: "Gelegenheit"
    ipa: "gəˈleːgn̩haɪ̯t"
    pos: noun
    gender: f
    plural: "die Gelegenheiten"
    en: "opportunity, chance"
    ru: "возможность, удобный случай"
    uk: "нагода"
    example_de: "Der Kurs ist eine gute Gelegenheit, neue Leute kennenzulernen."
    example_en: "The course is a good opportunity to meet new people."
    example_ru: "Курс — хорошая возможность познакомиться с новыми людьми."
    example_uk: "Курс — добра нагода познайомитися з новими людьми."
    note:
      en: "die Gelegenheit nutzen — to seize the chance; often with a zu-infinitive: die Gelegenheit, Deutsch zu sprechen. Die Möglichkeit says something is possible; die Gelegenheit says the moment for it has come."
      ru: "die Gelegenheit nutzen — «воспользоваться случаем»; часто с инфинитивом с zu: die Gelegenheit, Deutsch zu sprechen. Die Möglichkeit говорит, что нечто возможно; die Gelegenheit — что настал момент для этого."
      uk: "die Gelegenheit nutzen — «скористатися нагодою»; часто з інфінітивом із zu: die Gelegenheit, Deutsch zu sprechen. Die Möglichkeit каже, що щось можливе; die Gelegenheit — що настав момент для цього."

  - de: "Hoffnung"
    ipa: "ˈhɔfnʊŋ"
    pos: noun
    gender: f
    plural: "die Hoffnungen"
    en: "hope"
    ru: "надежда"
    uk: "надія"
    example_de: "Die Hoffnung auf eine bessere Stelle motiviert mich beim Lernen."
    example_en: "The hope of a better job motivates me in my studies."
    example_ru: "Надежда на лучшее место мотивирует меня учиться."
    example_uk: "Надія на краще місце мотивує мене вчитися."
    note:
      en: "Hoffnung auf + Akk, like its verb hoffen auf + Akk (A2). die Hoffnung aufgeben — to give up hope."
      ru: "Hoffnung auf + Akk, как её глагол hoffen auf + Akk (A2). die Hoffnung aufgeben — «оставить надежду»."
      uk: "Hoffnung auf + Akk, як її дієслово hoffen auf + Akk (A2). die Hoffnung aufgeben — «полишити надію»."

  - de: "Fortbildung"
    ipa: "ˈfɔʁtˌbɪldʊŋ"
    pos: noun
    gender: f
    plural: "die Fortbildungen"
    en: "further training"
    ru: "повышение квалификации"
    uk: "підвищення кваліфікації"
    example_de: "Meine Firma bezahlt eine Fortbildung pro Jahr."
    example_en: "My company pays for one further-training course per year."
    example_ru: "Моя фирма оплачивает одно повышение квалификации в год."
    example_uk: "Моя фірма оплачує одне підвищення кваліфікації на рік."
    note:
      en: "eine Fortbildung machen — the frame. Die Weiterbildung is the broad neighbour; die Fortbildung usually stays inside the job you already have."
      ru: "eine Fortbildung machen — рамка. Die Weiterbildung — широкий сосед; die Fortbildung обычно остаётся внутри профессии, которая уже есть."
      uk: "eine Fortbildung machen — рамка. Die Weiterbildung — широкий сусід; die Fortbildung зазвичай лишається всередині професії, яка вже є."

  - de: "zweifeln"
    ipa: "ˈtsvaɪ̯fl̩n"
    pos: verb
    praesens_3sg: "zweifelt"
    partizip2: "gezweifelt"
    aux: haben
    valence: "an + Dat"
    en: "to doubt"
    ru: "сомневаться"
    uk: "сумніватися"
    example_de: "Zweifle nicht an dir — dein Deutsch wird jede Woche besser."
    example_en: "Do not doubt yourself — your German gets better every week."
    example_ru: "Не сомневайся в себе — твой немецкий каждую неделю становится лучше."
    example_uk: "Не сумнівайся в собі — твоя німецька щотижня стає кращою."
    note:
      en: "What you doubt takes an + Dat: an der Entscheidung zweifeln. The noun is der Zweifel."
      ru: "В чём сомневаются — an + Dat: an der Entscheidung zweifeln. Существительное — der Zweifel."
      uk: "У чому сумніваються — an + Dat: an der Entscheidung zweifeln. Іменник — der Zweifel."

  - de: "verbessern"
    ipa: "fɛɐ̯ˈbɛsɐn"
    pos: verb
    praesens_3sg: "verbessert"
    partizip2: "verbessert"
    aux: haben
    valence: "+ Akk"
    en: "to improve"
    ru: "улучшать"
    uk: "покращувати"
    example_de: "Ich möchte mein Deutsch verbessern, um sicherer zu telefonieren."
    example_en: "I want to improve my German in order to feel safer on the phone."
    example_ru: "Я хочу улучшить свой немецкий, чтобы увереннее говорить по телефону."
    example_uk: "Я хочу покращити свою німецьку, щоб упевненіше розмовляти телефоном."
    note:
      en: "Inseparable, so no ge-: hat verbessert. sich verbessern is to get better yourself — Ich habe mich im Sprechen verbessert."
      ru: "Неотделяемая приставка, поэтому без ge-: hat verbessert. sich verbessern — «стать лучше самому»: Ich habe mich im Sprechen verbessert."
      uk: "Невідокремлюваний префікс, тому без ge-: hat verbessert. sich verbessern — «стати кращим самому»: Ich habe mich im Sprechen verbessert."

  - de: "überprüfen"
    ipa: "ˌyːbɐˈpʁyːfn̩"
    pos: verb
    praesens_3sg: "überprüft"
    partizip2: "überprüft"
    aux: haben
    valence: "+ Akk"
    en: "to check, to verify"
    ru: "проверять"
    uk: "перевіряти"
    example_de: "Bitte überprüfen Sie die Termine, bevor Sie sich anmelden."
    example_en: "Please check the dates before you register."
    example_ru: "Пожалуйста, проверьте даты, прежде чем записываться."
    example_uk: "Будь ласка, перевірте дати, перш ніж записуватися."
    note:
      en: "Inseparable — über- carries no stress and the Partizip has no ge-: hat überprüft. More systematic than plain prüfen: you go through it point by point."
      ru: "Неотделяемая приставка — über- безударна, и в партиципе нет ge-: hat überprüft. Систематичнее простого prüfen: проходят по пунктам."
      uk: "Невідокремлюваний префікс — über- ненаголошений, і в партиципі немає ge-: hat überprüft. Систематичніше за просте prüfen: проходять по пунктах."

  - de: "unterrichten"
    ipa: "ʊntɐˈʁɪçtn̩"
    pos: verb
    praesens_3sg: "unterrichtet"
    partizip2: "unterrichtet"
    aux: haben
    valence: "+ Akk"
    en: "to teach"
    ru: "преподавать"
    uk: "викладати"
    example_de: "Frau Weber unterrichtet seit zehn Jahren Deutsch."
    example_en: "Frau Weber has been teaching German for ten years."
    example_ru: "Фрау Вебер преподаёт немецкий уже десять лет."
    example_uk: "Пані Вебер викладає німецьку вже десять років."
    note:
      en: "Inseparable: unterrichtet, hat unterrichtet — never richtet … unter. The noun der Unterricht (A2) hides inside."
      ru: "Неотделяемая приставка: unterrichtet, hat unterrichtet — никогда richtet … unter. Внутри прячется der Unterricht (A2)."
      uk: "Невідокремлюваний префікс: unterrichtet, hat unterrichtet — ніколи richtet … unter. Усередині ховається der Unterricht (A2)."

  - de: "zurechtkommen"
    ipa: "tsuˈʁɛçtˌkɔmən"
    pos: verb
    praesens_3sg: "kommt zurecht"
    partizip2: "zurechtgekommen"
    aux: sein
    valence: "mit + Dat"
    en: "to cope, to manage"
    ru: "справляться"
    uk: "давати собі раду"
    example_de: "Mit den neuen Übungen komme ich gut zurecht."
    example_en: "I am coping well with the new exercises."
    example_ru: "С новыми упражнениями я хорошо справляюсь."
    example_uk: "З новими вправами я добре даю собі раду."
    note:
      en: "Separable, with sein: kommt zurecht, ist zurechtgekommen. What you cope with takes mit + Dat."
      ru: "Отделяемая приставка, с sein: kommt zurecht, ist zurechtgekommen. С чем справляются — mit + Dat."
      uk: "Відокремлюваний префікс, із sein: kommt zurecht, ist zurechtgekommen. З чим дають собі раду — mit + Dat."

  - de: "erfüllen"
    ipa: "ɛɐ̯ˈfʏlən"
    pos: verb
    praesens_3sg: "erfüllt"
    partizip2: "erfüllt"
    aux: haben
    valence: "+ Akk"
    en: "to fulfil"
    ru: "исполнять, выполнять"
    uk: "здійснювати, виконувати"
    example_de: "Der Kurs hat meine Erwartungen voll erfüllt."
    example_en: "The course fully met my expectations."
    example_ru: "Курс полностью оправдал мои ожидания."
    example_uk: "Курс повністю виправдав мої очікування."
    note:
      en: "einen Wunsch, einen Plan, Erwartungen erfüllen. sich erfüllen is the dream doing it by itself: Der Wunsch hat sich erfüllt."
      ru: "einen Wunsch, einen Plan, Erwartungen erfüllen. sich erfüllen — мечта делает это сама: Der Wunsch hat sich erfüllt."
      uk: "einen Wunsch, einen Plan, Erwartungen erfüllen. sich erfüllen — мрія робить це сама: Der Wunsch hat sich erfüllt."

  - de: "sich konzentrieren"
    ipa: "zɪç kɔntsɛnˈtʁiːʁən"
    pos: verb
    praesens_3sg: "konzentriert sich"
    partizip2: "sich konzentriert"
    aux: haben
    valence: "sich + Akk; auf + Akk"
    en: "to concentrate"
    ru: "сосредотачиваться"
    uk: "зосереджуватися"
    example_de: "Diesen Monat konzentriere ich mich auf die Verben."
    example_en: "This month I am concentrating on the verbs."
    example_ru: "В этом месяце я сосредотачиваюсь на глаголах."
    example_uk: "Цього місяця я зосереджуюся на дієсловах."
    note:
