id: regeln-verantwortung
title_de: "Regeln & Verantwortung"
title_en: "Rules & responsibility"
title_ru: "Правила и ответственность"
title_uk: "Правила та відповідальність"
level: B1
entries:
  - de: "Pflicht"
    ipa: "ˈpflɪçt"
    pos: noun
    gender: f
    plural: "die Pflichten"
    en: "duty, obligation"
    ru: "обязанность, долг"
    uk: "обов'язок"
    example_de: "Das Treppenhaus zu putzen ist Pflicht für alle Nachbarn."
    example_en: "Cleaning the stairwell is a duty for all neighbours."
    example_ru: "Убирать подъезд — обязанность всех соседей."
    example_uk: "Прибирати сходову клітку — обов'язок усіх сусідів."
    note:
      en: "etwas ist Pflicht — something is compulsory. The grammar twin is muss … werden: what a notice calls Pflicht, its sentences say with muss."
      ru: "etwas ist Pflicht — «это обязательно». Грамматический близнец — muss … werden: то, что объявление называет Pflicht, его фразы выражают через muss."
      uk: "etwas ist Pflicht — «це обов'язково». Граматичний близнюк — muss … werden: те, що оголошення називає Pflicht, його фрази виражають через muss."

  - de: "gelten"
    ipa: "ˈgɛltn̩"
    pos: verb
    praesens_3sg: "gilt"
    partizip2: "gegolten"
    aux: haben
    valence: "für + Akk"
    en: "to be valid, to apply (of a rule or ticket)"
    en_compact: "to be valid, to apply"
    ru: "действовать, распространяться (о правиле, билете)"
    uk: "діяти, поширюватися (про правило, квиток)"
    example_de: "Die Ruhezeiten gelten auch am Samstag."
    example_en: "The quiet hours also apply on Saturday."
    example_ru: "Часы тишины действуют и в субботу."
    example_uk: "Години тиші діють і в суботу."
    note:
      en: "Who or what a rule covers follows für + Akk: das gilt für alle. Also of tickets: Das Ticket gilt eine Stunde."
      ru: "На кого распространяется правило, вводит für + Akk: das gilt für alle. Также о билетах: Das Ticket gilt eine Stunde."
      uk: "На кого поширюється правило, вводить für + Akk: das gilt für alle. Також про квитки: Das Ticket gilt eine Stunde."

  - de: "Ausnahme"
    ipa: "ˈaʊ̯sˌnaːmə"
    pos: noun
    gender: f
    plural: "die Ausnahmen"
    en: "exception"
    ru: "исключение"
    uk: "виняток"
    example_de: "Der Hausmeister macht heute eine Ausnahme."
    example_en: "The caretaker is making an exception today."
    example_ru: "Комендант сегодня делает исключение."
    example_uk: "Комендант сьогодні робить виняток."
    note:
      en: "eine Ausnahme machen — the phrase every negotiation aims at; mit Ausnahme von — except for."
      ru: "eine Ausnahme machen — фраза, к которой ведёт любой разговор о правилах; mit Ausnahme von — «за исключением»."
      uk: "eine Ausnahme machen — фраза, до якої веде будь-яка розмова про правила; mit Ausnahme von — «за винятком»."

  - de: "sich beschweren"
    ipa: "zɪç bəˈʃveːʁən"
    pos: verb
    praesens_3sg: "beschwert sich"
    partizip2: "sich beschwert"
    aux: haben
    valence: "sich + Akk; über + Akk; bei + Dat"
    en: "to complain"
    ru: "жаловаться"
    uk: "скаржитися"
    example_de: "Die Nachbarn haben sich über die laute Musik beschwert."
    example_en: "The neighbours complained about the loud music."
    example_ru: "Соседи пожаловались на громкую музыку."
    example_uk: "Сусіди поскаржилися на гучну музику."
    note:
      en: "What you complain about takes über + Akk, the person you complain to bei + Dat: sich beim Hausmeister über den Lärm beschweren."
      ru: "На что жалуются — über + Akk, кому жалуются — bei + Dat: sich beim Hausmeister über den Lärm beschweren."
      uk: "На що скаржаться — über + Akk, кому скаржаться — bei + Dat: sich beim Hausmeister über den Lärm beschweren."

  - de: "lösen"
    ipa: "ˈløːzn̩"
    pos: verb
    praesens_3sg: "löst"
    partizip2: "gelöst"
    aux: haben
    valence: "+ Akk"
    en: "to solve (a problem)"
    en_compact: "to solve"
    ru: "решать (проблему)"
    uk: "розв'язувати (проблему)"
    example_de: "Dieses Problem können wir nur zusammen lösen."
    example_en: "We can only solve this problem together."
    example_ru: "Эту проблему мы можем решить только вместе."
    example_uk: "Цю проблему ми можемо розв'язати лише разом."
    note:
      en: "The verb behind die Lösung. Also of tickets in Austria and on machines: einen Fahrschein lösen — to buy one."
      ru: "Глагол, стоящий за die Lösung. Ещё о билетах в автоматах: einen Fahrschein lösen — «купить билет»."
      uk: "Дієслово, що стоїть за die Lösung. Ще про квитки в автоматах: einen Fahrschein lösen — «купити квиток»."

  - de: "sich einigen"
    ipa: "zɪç ˈaɪ̯nɪgn̩"
    pos: verb
    praesens_3sg: "einigt sich"
    partizip2: "sich geeinigt"
    aux: haben
    valence: "sich + Akk; mit + Dat; auf + Akk"
    en: "to come to an agreement"
    ru: "договориться, прийти к согласию"
    uk: "домовитися, дійти згоди"
    example_de: "Wir haben uns auf eine neue Waschzeit geeinigt."
    example_en: "We agreed on a new washing time."
    example_ru: "Мы договорились о новом времени стирки."
    example_uk: "Ми домовилися про новий час прання."
    note:
      en: "The partner takes mit + Dat, the result auf + Akk: sich mit den Nachbarn auf eine Lösung einigen."
      ru: "С кем — mit + Dat, о чём договорились — auf + Akk: sich mit den Nachbarn auf eine Lösung einigen."
      uk: "З ким — mit + Dat, про що домовилися — auf + Akk: sich mit den Nachbarn auf eine Lösung einigen."

  - de: "Kompromiss"
    ipa: "kɔmpʁoˈmɪs"
    pos: noun
    gender: m
    plural: "die Kompromisse"
    en: "compromise"
    ru: "компромисс"
    uk: "компроміс"
    example_de: "Am Ende haben wir einen guten Kompromiss gefunden."
    example_en: "In the end we found a good compromise."
    example_ru: "В конце концов мы нашли хороший компромисс."
    example_uk: "Зрештою ми знайшли хороший компроміс."
    note:
      en: "einen Kompromiss finden / schließen. Stress falls on the last syllable, and the gender is der."
      ru: "einen Kompromiss finden / schließen. Ударение на последнем слоге, род — der."
      uk: "einen Kompromiss finden / schließen. Наголос на останньому складі, рід — der."

  - de: "Rücksicht"
    ipa: "ˈʁʏkˌzɪçt"
    pos: noun
    gender: f
    plural: "—"
    en: "consideration (for others)"
    ru: "внимание к другим, деликатность"
    uk: "уважність до інших, делікатність"
    example_de: "Bitte nehmen Sie Rücksicht auf die kleinen Kinder im Haus."
    example_en: "Please show consideration for the small children in the building."
    example_ru: "Пожалуйста, считайтесь с маленькими детьми в доме."
    example_uk: "Будь ласка, зважайте на маленьких дітей у будинку."
    note:
      en: "Lives in one fixed frame: Rücksicht nehmen auf + Akk. The adjective pair is rücksichtsvoll / rücksichtslos."
      ru: "Живёт в одной устойчивой рамке: Rücksicht nehmen auf + Akk. Пара прилагательных — rücksichtsvoll / rücksichtslos."
      uk: "Живе в одній сталій рамці: Rücksicht nehmen auf + Akk. Пара прикметників — rücksichtsvoll / rücksichtslos."

  - de: "beachten"
    ipa: "bəˈʔaxtn̩"
    pos: verb
    praesens_3sg: "beachtet"
    partizip2: "beachtet"
    aux: haben
    valence: "+ Akk"
    en: "to observe, to follow (a rule, a sign)"
    en_compact: "to observe, to follow"
    ru: "соблюдать, обращать внимание (на правило, знак)"
    uk: "дотримуватися, звертати увагу (на правило, знак)"
    example_de: "Bitte beachten Sie die neuen Regeln im Hof."
    example_en: "Please observe the new rules in the courtyard."
    example_ru: "Пожалуйста, соблюдайте новые правила во дворе."
    example_uk: "Будь ласка, дотримуйтеся нових правил у дворі."
    note:
      en: "The notice verb: Bitte beachten Sie … opens half of them. No preposition — the rule itself is the Akkusativ object."
      ru: "Глагол объявлений: с Bitte beachten Sie … начинается половина из них. Без предлога — само правило стоит в Akkusativ."
      uk: "Дієслово оголошень: з Bitte beachten Sie … починається половина з них. Без прийменника — саме правило стоїть в Akkusativ."

  - de: "spätestens"
    ipa: "ˈʃpɛːtəstn̩s"
    pos: adv
    en: "at the latest"
    ru: "самое позднее, не позднее"
    uk: "щонайпізніше, не пізніше"
    example_de: "Der Schlüssel muss spätestens am Montag zurückgegeben werden."
    example_en: "The key must be returned by Monday at the latest."
    example_ru: "Ключ нужно вернуть не позднее понедельника."
    example_uk: "Ключ потрібно повернути не пізніше понеділка."
    note:
      en: "The deadline word of every notice; its mirror is frühestens — at the earliest."
      ru: "Слово-дедлайн любого объявления; зеркальная пара — frühestens «самое раннее»."
      uk: "Слово-дедлайн будь-якого оголошення; дзеркальна пара — frühestens «щонайраніше»."

  - de: "verlängern"
    ipa: "fɛɐ̯ˈlɛŋɐn"
    pos: verb
    praesens_3sg: "verlängert"
    partizip2: "verlängert"
    aux: haben
    valence: "+ Akk"
    en: "to extend (a deadline, a document)"
    en_compact: "to extend"
    ru: "продлить (срок, документ)"
    uk: "продовжити (термін, документ)"
    example_de: "Kann die Frist um eine Woche verlängert werden?"
    example_en: "Can the deadline be extended by a week?"
    example_ru: "Можно ли продлить срок на неделю?"
    example_uk: "Чи можна продовжити термін на тиждень?"
    note:
      en: "By how much takes um + Akk: um einen Monat verlängern. Works for deadlines, passports and library books alike."
      ru: "На сколько — um + Akk: um einen Monat verlängern. Подходит для сроков, паспортов и библиотечных книг."
      uk: "На скільки — um + Akk: um einen Monat verlängern. Підходить для термінів, паспортів і бібліотечних книжок."

  - de: "regeln"
    ipa: "ˈʁeːgl̩n"
    pos: verb
    praesens_3sg: "regelt"
    partizip2: "geregelt"
    aux: haben
    valence: "+ Akk"
    en: "to settle, to sort out; to set the rules for"
    ru: "урегулировать, уладить; упорядочивать"
    uk: "урегулювати, залагодити; впорядковувати"
    example_de: "Die Hausordnung regelt, wann gewaschen werden darf."
    example_en: "The house rules set out when washing may be done."
    example_ru: "Правила дома определяют, когда можно стирать."
    example_uk: "Правила будинку визначають, коли можна прати."
    note:
      en: "Das ist geregelt — that is settled. Das regeln wir schon — we will sort it out."
      ru: "Das ist geregelt — «это улажено». Das regeln wir schon — «мы это уладим»."
      uk: "Das ist geregelt — «це залагоджено». Das regeln wir schon — «ми це залагодимо»."

  - de: "mitteilen"
    ipa: "ˈmɪtˌtaɪ̯lən"
    pos: verb
    praesens_3sg: "teilt mit"
    partizip2: "mitgeteilt"
    aux: haben
    valence: "+ Dat + Akk"
    en: "to inform, to notify"
    ru: "сообщать, уведомлять"
    uk: "повідомляти"
    example_de: "Die Hausverwaltung teilt den Mietern den neuen Termin mit."
    example_en: "The building management informs the tenants of the new date."
    example_ru: "Управляющая компания сообщает жильцам новую дату."
    example_uk: "Керуюча компанія повідомляє мешканцям нову дату."
    note:
      en: "Separable and formal: teilt mit, hat mitgeteilt. The everyday verb is sagen; the noun on the notice board is die Mitteilung."
      ru: "Отделяемая приставка, официальный тон: teilt mit, hat mitgeteilt. Бытовой глагол — sagen; существительное на доске объявлений — die Mitteilung."
      uk: "Відокремлюваний префікс, офіційний тон: teilt mit, hat mitgeteilt. Побутове дієслово — sagen; іменник на дошці оголошень — die Mitteilung."

  - de: "klingeln"
    ipa: "ˈklɪŋəln"
    pos: verb
    praesens_3sg: "klingelt"
    partizip2: "geklingelt"
    aux: haben
    valence: "bei + Dat"
    en: "to ring (a doorbell)"
    ru: "звонить (в дверь)"
    uk: "дзвонити (у двері)"
    example_de: "Ich habe bei den Nachbarn geklingelt, aber niemand war da."
    example_en: "I rang the neighbours' doorbell, but nobody was there."
    example_ru: "Я позвонил в дверь к соседям, но никого не было."
    example_uk: "Я подзвонив у двері до сусідів, але нікого не було."
    note:
      en: "At whose door takes bei + Dat: bei Frau Krause klingeln. Phoning someone is anrufen — a different verb entirely."
      ru: "К кому в дверь — bei + Dat: bei Frau Krause klingeln. Звонить по телефону — anrufen, совсем другой глагол."
      uk: "До кого у двері — bei + Dat: bei Frau Krause klingeln. Телефонувати — anrufen, зовсім інше дієслово."

  - de: "einverstanden"
    ipa: "ˈaɪ̯nfɛɐ̯ˌʃtandn̩"
    pos: adj
    en: "in agreement, agreed"
    ru: "согласный, согласен"
    uk: "згодний, згоден"
    example_de: "Mit diesem Vorschlag bin ich einverstanden."
    example_en: "I agree with this suggestion."
    example_ru: "С этим предложением я согласен."
    example_uk: "З цією пропозицією я згоден."
    note:
      en: "Only ever with sein, and the partner or plan takes mit + Dat: einverstanden sein mit. As a one-word answer: Einverstanden!"
      ru: "Только со связкой sein; с кем или с чем — mit + Dat: einverstanden sein mit. Как ответ одним словом: Einverstanden!"
      uk: "Лише зі зв'язкою sein; з ким або з чим — mit + Dat: einverstanden sein mit. Як відповідь одним словом: Einverstanden!"

  - de: "ablehnen"
    ipa: "ˈapˌleːnən"
    pos: verb
    praesens_3sg: "lehnt ab"
    partizip2: "abgelehnt"
    aux: haben
    valence: "+ Akk"
    en: "to decline, to reject"
    ru: "отклонять, отказываться (от предложения)"
    uk: "відхиляти, відмовлятися (від пропозиції)"
    example_de: "Die Hausverwaltung hat unseren Vorschlag leider abgelehnt."
    example_en: "The building management unfortunately rejected our proposal."
    example_ru: "Управляющая компания, к сожалению, отклонила наше предложение."
    example_uk: "Керуюча компанія, на жаль, відхилила нашу пропозицію."
    note:
      en: "Separable: lehnt ab, hat abgelehnt. The polite spoken form softens it: Das möchte ich lieber ablehnen."
      ru: "Отделяемая приставка: lehnt ab, hat abgelehnt. В вежливой речи смягчают: Das möchte ich lieber ablehnen."
      uk: "Відокремлюваний префікс: lehnt ab, hat abgelehnt. У ввічливому мовленні пом'якшують: Das möchte ich lieber ablehnen."

  - de: "akzeptieren"
    ipa: "aktsɛpˈtiːʁən"
    pos: verb
    praesens_3sg: "akzeptiert"
    partizip2: "akzeptiert"
    aux: haben
    valence: "+ Akk"
    en: "to accept"
    ru: "принимать, соглашаться (с решением, условием)"
    uk: "приймати, погоджуватися (з рішенням, умовою)"
    example_de: "Diese Bedingung können wir akzeptieren."
    example_en: "We can accept this condition."
    example_ru: "Это условие мы можем принять."
    example_uk: "Цю умову ми можемо прийняти."
    note:
      en: "No ge- in the participle: hat akzeptiert. Its opposite in a negotiation is ablehnen."
      ru: "Причастие без ge-: hat akzeptiert. Противоположность в переговорах — ablehnen."
      uk: "Дієприкметник без ge-: hat akzeptiert. Протилежність у переговорах — ablehnen."

  - de: "Streit"
    ipa: "ˈʃtʁaɪ̯t"
    pos: noun
    gender: m
    plural: "—"
    en: "quarrel, dispute"
    ru: "ссора, спор"
    uk: "сварка, суперечка"
    example_de: "Wegen der Parkplätze gibt es oft Streit im Haus."
    example_en: "There are often quarrels in the building over the parking spaces."
    example_ru: "Из-за парковочных мест в доме часто бывают ссоры."
    example_uk: "Через паркувальні місця в будинку часто бувають сварки."
    note:
      en: "Streit haben mit + Dat, Streit um + Akk. The goal of this unit is to turn Streit into a Kompromiss."
      ru: "Streit haben mit + Dat, Streit um + Akk. Цель этой главы — превращать Streit в Kompromiss."
      uk: "Streit haben mit + Dat, Streit um + Akk. Мета цього розділу — перетворювати Streit на Kompromiss."

  - de: "Ärger"
    ipa: "ˈɛʁgɐ"
    pos: noun
    gender: m
    plural: "—"
    en: "trouble, annoyance"
    ru: "неприятности, раздражение"
    uk: "неприємності, роздратування"
    example_de: "Mit dem neuen Nachbarn gab es von Anfang an Ärger."
    example_en: "There was trouble with the new neighbour from the start."
    example_ru: "С новым соседом с самого начала были неприятности."
    example_uk: "З новим сусідом від самого початку були неприємності."
    note:
      en: "Ärger haben / bekommen mit + Dat; Ärger machen — to cause trouble. The feeling verb behind it you know from A2: sich ärgern."
      ru: "Ärger haben / bekommen mit + Dat; Ärger machen — «создавать проблемы». Глагол чувства за ним знаком с A2: sich ärgern."
      uk: "Ärger haben / bekommen mit + Dat; Ärger machen — «створювати проблеми». Дієслово почуття за ним знайоме з A2: sich ärgern."

  - de: "Vorschrift"
    ipa: "ˈfoːɐ̯ˌʃʁɪft"
    pos: noun
    gender: f
    plural: "die Vorschriften"
    cards: recognition
    en: "regulation, official rule"
    ru: "предписание, инструкция"
    uk: "припис, інструкція"
    example_de: "Auf der Baustelle gelten strenge Vorschriften."
    example_en: "Strict regulations apply on the construction site."
    example_ru: "На стройке действуют строгие предписания."
    example_uk: "На будівництві діють суворі приписи."
    note:
      en: "Stricter and more official than die Regel; heard in the shrug Das ist Vorschrift — those are the rules."
      ru: "Строже и официальнее, чем die Regel; звучит в разводящем руками Das ist Vorschrift — «таковы правила»."
      uk: "Суворіше й офіційніше, ніж die Regel; звучить у знизуванні плечима Das ist Vorschrift — «такі правила»."

  - de: "Verbot"
    ipa: "fɛɐ̯ˈboːt"
    pos: noun
    gender: n
    plural: "die Verbote"
    cards: recognition
    en: "ban, prohibition"
    ru: "запрет"
    uk: "заборона"
    example_de: "Das Verbot gilt nur werktags von acht bis achtzehn Uhr."
    example_en: "The ban applies only on workdays from eight to six."
    example_ru: "Запрет действует только по будням с восьми до восемнадцати."
    example_uk: "Заборона діє лише в робочі дні з восьмої до вісімнадцятої."
    note:
      en: "The noun behind verboten; on signs mostly in compounds — das Parkverbot, das Rauchverbot."
      ru: "Существительное от verboten; на знаках чаще в сложных словах — das Parkverbot, das Rauchverbot."
      uk: "Іменник від verboten; на знаках частіше у складних словах — das Parkverbot, das Rauchverbot."

  - de: "Hinweis"
    ipa: "ˈhɪnˌvaɪ̯s"
    pos: noun
