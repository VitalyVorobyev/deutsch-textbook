    cards: recognition
    en: having a runny nose and a sore throat from catching cold
    ru: с насморком и больным горлом, простуженный
    uk: із нежитем і болючим горлом, застуджений
    example_de: Ich bin seit gestern erkältet und bleibe heute zu Hause.
    example_en: I have had a cold since yesterday and am staying at home today.
    example_ru: Я со вчерашнего дня простужен и сегодня остаюсь дома.
    example_uk: Я від учора застуджений і сьогодні лишаюся вдома.
    note:
      en: 'The Partizip II of sich erkälten used as an adjective, and it always comes with sein — German has no verb here where English has to have a cold. Note the tense logic: the reflexive verb names the moment you caught it (Ich habe mich erkältet) and this word names the state you are in now, so the two are not interchangeable in a sentence about today. The noun is A1 die Erkältung.'
      ru: 'Partizip II от sich erkälten в роли прилагательного, и стоит оно всегда с sein — глагола, соответствующего русскому «простыл», здесь нет. Обратите внимание на логику времени: возвратный глагол называет момент, когда простуда была подхвачена (Ich habe mich erkältet), а это слово — нынешнее состояние, так что во фразе про сегодня они не взаимозаменяемы. Существительное — die Erkältung уровня A1.'
      uk: 'Partizip II від sich erkälten у ролі прикметника, і стоїть воно завжди із sein — дієслова, що відповідало б українському «застудився», тут немає. Зверніть увагу на логіку часу: зворотне дієслово називає мить, коли застуду було підхоплено (Ich habe mich erkältet), а це слово — теперішній стан, тож у фразі про сьогодні вони не взаємозамінні. Іменник — die Erkältung рівня A1.'

