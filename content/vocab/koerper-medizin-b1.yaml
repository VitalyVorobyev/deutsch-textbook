    uk: відкрите місце на шкірі, що лишилося від порізу, опіку чи операції
    example_de: Die Wunde am Finger muss jeden Tag sauber gemacht werden.
    example_en: The cut on the finger has to be cleaned every day.
    example_ru: Рану на пальце нужно каждый день промывать.
    example_uk: Рану на пальці треба щодня промивати.
    note:
      en: 'Concrete and visible: this is the hole itself, the thing you put a dressing on, while die Verletzung below is the damage as an event and can be internal. It heals — die Wunde heilt — and what covers it is das Pflaster or der Verband. Beware the adjective wund, which means sore or chafed and is not the same word in use: wunde Füße are sore feet with nothing open on them at all.'
      ru: 'Слово предметное и зримое: это само отверстие, то, на что накладывают повязку, тогда как die Verletzung ниже — повреждение как событие, и оно может быть внутренним. Оно заживает — die Wunde heilt, — а закрывают его das Pflaster или der Verband. Осторожно с прилагательным wund: оно значит «натёртый, саднящий» и в употреблении это не то же самое — wunde Füße — это стёртые ноги, на которых ничего не открыто.'
      uk: 'Слово предметне й зриме: це сам отвір, те, на що накладають пов’язку, тоді як die Verletzung нижче — пошкодження як подія, і воно може бути внутрішнім. Воно загоюється — die Wunde heilt, — а закривають його das Pflaster або der Verband. Обережно з прикметником wund: він означає «натертий, саднить», і у вжитку це не те саме — wunde Füße — це стерті ноги, на яких нічого не відкрито.'

  - de: Verletzung
    ipa: "fɛɐ̯ˈlɛtsʊŋ"
    pos: noun
    gender: f
    plural: "die Verletzungen"
    en: damage done to a body by an accident or in sport, whether it shows or not
    ru: повреждение тела, полученное при несчастном случае или в спорте, видимое или нет
    uk: пошкодження тіла, отримане при нещасному випадку чи у спорті, видиме чи ні
    example_de: Wegen einer Verletzung am Rücken kann er nicht arbeiten.
    example_en: He cannot work because of a back injury.
    example_ru: Из-за повреждения спины он не может работать.
    example_uk: Через пошкодження спини він не може працювати.
    note:
      en: 'The noun of A2 verletzen. It is the wider of the two words on this page: a broken bone, a torn muscle and a bruise are all one, and none of them has to be visible. German sport reporting runs on it — sich eine Verletzung zuziehen, verletzungsbedingt ausfallen — and an insurer''s letter will say Art der Verletzung. A second, abstract sense is a breach: eine Verletzung der Regeln, of rules rather than of a person.'
      ru: 'Существительное от verletzen уровня A2. Из двух слов этой страницы оно шире: перелом, разрыв мышцы и синяк — всё это оно, и ничему из этого не обязательно быть видимым. Немецкие спортивные сводки держатся на нём: sich eine Verletzung zuziehen, verletzungsbedingt ausfallen, — а письмо страховщика напишет Art der Verletzung. Второй, отвлечённый смысл — нарушение: eine Verletzung der Regeln, то есть правил, а не человека.'
      uk: 'Іменник від verletzen рівня A2. Із двох слів цієї сторінки воно ширше: перелом, розрив м’яза і синець — усе це воно, і нічому з цього не обов’язково бути видимим. Німецькі спортивні зведення тримаються на ньому: sich eine Verletzung zuziehen, verletzungsbedingt ausfallen, — а лист страховика напише Art der Verletzung. Другий, відсторонений сенс — порушення: eine Verletzung der Regeln, тобто правил, а не людини.'

  - de: Infektion
