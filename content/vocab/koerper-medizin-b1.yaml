      uk: 'Пишеться як англійське слово, а вимовляється з кінцевим t, бо німецька оглушує d наприкінці. Поряд із прямим значенням живуть два переносні, не менш часті: blind vertrauen — «довіряти сліпо, не перевіряючи», а ein blinder Passagier — безквитковий у трюмі. Ввічливий іменник сьогодні — der blinde Mensch або die blinde Person; давніше Blinde лишається нормою, але в мовленні звучить різкувато.'

