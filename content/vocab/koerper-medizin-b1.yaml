    example_en: The doctor suspects an infection and has taken a blood sample.
    example_ru: Врач подозревает инфекцию и взял кровь на анализ.
    example_uk: Лікар підозрює інфекцію і взяв кров на аналіз.
    note:
      en: 'Stress on the last syllable, as in every German noun in -ion, and the tion is spoken tsion. It is diagnosis language, one level above what a patient volunteers: you say Ich habe Halsschmerzen and the letter says eine Infektion der oberen Atemwege. The verb is sich anstecken, to catch something from somebody, and the adjective ansteckend means contagious. Do not use it of a computer virus — that is der Virus in a different field.'
      ru: 'Ударение на последнем слоге, как у всех немецких существительных на -ion, а tion произносится «цион». Это язык диагноза, ступенью выше того, что говорит сам больной: вы скажете Ich habe Halsschmerzen, а в заключении будет eine Infektion der oberen Atemwege. Глагол — sich anstecken, «заразиться от кого-то», прилагательное ansteckend — «заразный». О компьютере так не говорят: там der Virus и совсем другое поле.'
      uk: 'Наголос на останньому складі, як в усіх німецьких іменників на -ion, а tion вимовляється «ціон». Це мова діагнозу, щаблем вище за те, що каже сам хворий: ви скажете Ich habe Halsschmerzen, а у висновку буде eine Infektion der oberen Atemwege. Дієслово — sich anstecken, «заразитися від когось», прикметник ansteckend — «заразний». Про комп’ютер так не кажуть: там der Virus і зовсім інше поле.'

  - de: erkältet
    ipa: "ɛɐ̯ˈkɛltət"
    pos: adj
    # Recognition only: A2 ships the whole chunk `erkältet sein` (koerper-pflege-a2) as
