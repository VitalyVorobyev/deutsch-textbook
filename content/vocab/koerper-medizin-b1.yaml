      ru: 'Обиходное и чуть неформальное рядом с die Tablette уровня A1, которым говорят аптекарь и вкладыш к лекарству. С определённым артиклем и без множественного оно значит одно конкретное: die Pille — противозачаточная таблетка, и die Pille nehmen понимается только так. Горькая правда — eine bittere Pille. Глагол для приёма любых из них — nehmen, а не trinken и не essen.'
      uk: 'Побутове і трохи неформальне поряд із die Tablette рівня A1, яким говорять аптекар і вкладка до ліків. З означеним артиклем і без множини воно означає одне конкретне: die Pille — протизаплідна таблетка, і die Pille nehmen розуміють тільки так. Гірка правда — eine bittere Pille. Дієслово для прийому будь-яких із них — nehmen, а не trinken і не essen.'

  - de: Pflaster
