    example_uk: У тебе є пластир для мого пальця?
    note:
      en: 'Neuter, and the plural is spelled like the singular. Every German first-aid box has them, and the brand name Hansaplast is used the way Band-Aid is in America. A second sense is the paved surface of a street — das Kopfsteinpflaster is cobblestones — which is why a city can be called ein teures Pflaster, an expensive place to live. The pf- is a real affricate: both letters sound.'
      ru: 'Средний род, множественное пишется как единственное. Есть в любой немецкой аптечке, а фирменное название Hansaplast употребляют как нарицательное. Второй смысл — мощёное покрытие улицы: das Kopfsteinpflaster — булыжная мостовая, отсюда и оборот ein teures Pflaster о дорогом для жизни городе. Сочетание pf- — настоящая аффриката: звучат обе буквы.'
      uk: 'Середній рід, множина пишеться як однина. Є в будь-якій німецькій аптечці, а фірмову назву Hansaplast вживають як загальну. Другий сенс — брукована поверхня вулиці: das Kopfsteinpflaster — бруківка, звідси й зворот ein teures Pflaster про дороге для життя місто. Сполука pf- — справжня африката: звучать обидві літери.'

  - de: Medizin
