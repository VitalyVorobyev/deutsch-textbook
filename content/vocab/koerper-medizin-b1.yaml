# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the body-and-medicine
# field of data/goethe-b1-wortliste.txt: the parts a doctor asks you to point at, what
# goes wrong with them, and what a practice or a hospital then does about it.
# A1's `koerper-gesundheit` owns the body's outline and the sickroom (Körper, Kopf,
# Arm, Bein, Schmerzen, Fieber, Medikament, Tablette, Krankenhaus), A2's
# `koerper-pflege-a2` and `gesundheit-arzttermin` own the appointment itself
# (Beschwerden, Husten, Rezept, Sprechstunde, Hausarzt, untersuchen, verletzen), and
# B1's `gesundheit-wohlbefinden` owns living well (atmen, Ernährung, sich erkälten).
# This deck is the layer between them: the anatomy those three never name and the
# treatment they stop short of.
id: koerper-medizin-b1
title_de: "Körper und Medizin"
title_en: "The body and medicine"
title_ru: "Тело и медицина"
title_uk: "Тіло та медицина"
level: B1
entries:
  # --- Der Körper von außen ---
  - de: Haut
    ipa: "ˈhaʊ̯t"
    pos: noun
    gender: f
    plural: "die Häute"
    en: the outer layer that covers a whole body and can be dry, oily or sunburnt
    ru: наружный покров тела, который бывает сухим, жирным или обгоревшим на солнце
    uk: зовнішній покрив тіла, який буває сухим, жирним або обгорілим на сонці
    example_de: Nach zwei Wochen am Meer war seine Haut ganz braun.
    example_en: After two weeks by the sea his skin was completely brown.
    example_ru: После двух недель на море его кожа стала совсем смуглой.
    example_uk: Після двох тижнів на морі його шкіра стала зовсім смаглявою.
    note:
      en: 'Of a living person it stays singular — the plural belongs to animals and to the leather trade. A2 die Creme goes on it, and the specialist is der Hautarzt or die Hautärztin, which is the word a receptionist will use rather than the Latin one. Two idioms are worth recognising because they sound alarming and are not: aus der Haut fahren is to lose your temper, and sich in seiner Haut wohlfühlen is to be comfortable with who you are.'
      ru: 'О живом человеке слово стоит в единственном числе — множественное относится к животным и к кожевенному делу. Сверху наносят die Creme уровня A2, а специалист — der Hautarzt или die Hautärztin; именно так скажет регистратура, а не по-латыни. Два оборота стоит узнавать, потому что звучат они тревожно, а смысл мирный: aus der Haut fahren — «выйти из себя», а sich in seiner Haut wohlfühlen — «быть в ладу с самим собой».'
      uk: 'Про живу людину слово стоїть в однині — множина стосується тварин і чинбарства. Зверху наносять die Creme рівня A2, а фахівець — der Hautarzt або die Hautärztin; саме так скаже реєстратура, а не латиною. Два звороти варто впізнавати, бо звучать вони тривожно, а зміст мирний: aus der Haut fahren — «вийти із себе», а sich in seiner Haut wohlfühlen — «бути в злагоді із самим собою».'

  - de: Brust
    ipa: "ˈbʁʊst"
    pos: noun
    gender: f
    plural: "die Brüste"
    en: the front of the upper body, between the neck and the stomach
    ru: передняя часть верхней половины тела, между шеей и животом
    uk: передня частина верхньої половини тіла, між шиєю і животом
    example_de: Der Arzt hörte die Brust mit dem Stethoskop ab.
    example_en: The doctor listened to the chest with a stethoscope.
    example_ru: Врач послушал грудную клетку стетоскопом.
    example_uk: Лікар послухав грудну клітку стетоскопом.
    note:
      en: 'One German word covers what English splits into chest and breast, and the number decides which one is meant: the singular is the front of the torso in anybody, the plural is a woman''s breasts. At a practice the useful phrase is Schmerzen in der Brust, and the bones around it are der Brustkorb. Do not reach for it where English says heart in a figurative sense — an emotion sits im Herzen, never here.'
      ru: 'Одно немецкое слово покрывает то, что русский делит на «грудную клетку» и «грудь» как женский орган, а различает их число: единственное — передняя часть корпуса у любого человека, множественное — женская грудь. У врача пригодится оборот Schmerzen in der Brust, а костный каркас вокруг — der Brustkorb. Не берите это слово там, где по-русски говорят «в груди» о чувстве: чувство живёт im Herzen, а не здесь.'
      uk: 'Одне німецьке слово покриває те, що українська ділить на «грудну клітку» і «груди» як жіночий орган, а розрізняє їх число: однина — передня частина корпусу в будь-якої людини, множина — жіночі груди. У лікаря знадобиться зворот Schmerzen in der Brust, а кістковий каркас навколо — der Brustkorb. Не беріть це слово там, де українською кажуть «у грудях» про почуття: почуття живе im Herzen, а не тут.'

  - de: Schulter
    ipa: "ˈʃʊltɐ"
    pos: noun
    gender: f
    plural: "die Schultern"
    en: the joint where the arm meets the body, on the top corner of the torso
    ru: сустав, которым рука соединяется с телом, на верхнем углу корпуса
    uk: суглоб, яким рука з’єднується з тілом, на верхньому куті корпусу
    example_de: Seit dem Umzug tut mir die rechte Schulter weh.
    example_en: My right shoulder has been hurting since the move.
    example_ru: После переезда у меня болит правое плечо.
    example_uk: Після переїзду в мене болить праве плече.
    note:
      en: 'Plural in -n and no umlaut. The gesture Germans call mit den Schultern zucken is the shrug, and it turns up in reported speech as often as in a room: Er zuckte nur mit den Schultern. Beside A1 der Arm and die Hand this is the third joint a doctor asks you to move, so the sentence to have ready is Ich kann den Arm nicht heben. The idiom auf die leichte Schulter nehmen means to take a problem far too lightly.'
      ru: 'Множественное на -n, без умлаута. Жест, который немцы называют mit den Schultern zucken, — это пожатие плечами, и в пересказе он встречается не реже, чем в комнате: Er zuckte nur mit den Schultern. Рядом с der Arm и die Hand уровня A1 это третий сустав, которым врач попросит подвигать, поэтому наготове стоит держать фразу Ich kann den Arm nicht heben. Оборот auf die leichte Schulter nehmen значит «отнестись к беде слишком легкомысленно».'
      uk: 'Множина на -n, без умлаута. Жест, який німці називають mit den Schultern zucken, — це знизування плечима, і в переказі він трапляється не рідше, ніж у кімнаті: Er zuckte nur mit den Schultern. Поряд із der Arm і die Hand рівня A1 це третій суглоб, яким лікар попросить порухати, тож напоготові варто мати фразу Ich kann den Arm nicht heben. Зворот auf die leichte Schulter nehmen означає «поставитися до біди надто легковажно».'

  - de: Knie
    ipa: "ˈkniː"
    pos: noun
    gender: n
    plural: "die Knie"
    en: the joint in the middle of the leg, which bends when you sit down or kneel
    ru: сустав посреди ноги, который сгибается, когда садишься или встаёшь на колени
    uk: суглоб посеред ноги, який згинається, коли сідаєш або стаєш на коліна
    example_de: Beim Fußball hat er sich am Knie verletzt.
    example_en: He injured his knee playing football.
    example_ru: Играя в футбол, он повредил колено.
    example_uk: Граючи у футбол, він пошкодив коліно.
    note:
      en: 'Neuter, and the plural is spelled exactly like the singular — die Knie, with the e spoken. The k is pronounced in German, unlike English knee, so it opens with a real kn-. This is the joint that comes up most often at a practice, and the frame is sich am Knie verletzen, with the body part in a prepositional phrase rather than as a possessive: Germans say ich habe mir das Knie verletzt where English says my knee. The verb for going down on them is knien.'
      ru: 'Средний род, и множественное пишется так же, как единственное, — die Knie, причём e произносится. В отличие от английского knee, немецкое k звучит, так что слово начинается настоящим kn-. Это тот сустав, о котором на приёме заходит речь чаще всего, а конструкция — sich am Knie verletzen: часть тела стоит в предложной группе, а не с притяжательным местоимением, поэтому немец скажет ich habe mir das Knie verletzt там, где русский скажет «повредил своё колено». Глагол «стоять на них» — knien.'
      uk: 'Середній рід, і множина пишеться так само, як однина, — die Knie, причому e вимовляється. На відміну від англійського knee, німецьке k звучить, тож слово починається справжнім kn-. Це той суглоб, про який на прийомі йдеться найчастіше, а конструкція — sich am Knie verletzen: частина тіла стоїть у прийменниковій групі, а не з присвійним займенником, тому німець скаже ich habe mir das Knie verletzt там, де українець скаже «пошкодив своє коліно». Дієслово «стояти на них» — knien.'

  - de: Lippe
    ipa: "ˈlɪpə"
    pos: noun
    gender: f
    plural: "die Lippen"
    en: one of the two soft edges of the mouth, which crack in cold weather
    ru: один из двух мягких краёв рта, которые на морозе трескаются
    uk: один із двох м’яких країв рота, які на морозі тріскаються
    example_de: Im Winter werden meine Lippen immer trocken.
    example_en: My lips always get dry in winter.
    example_ru: Зимой у меня всегда сохнут губы.
    example_uk: Узимку в мене завжди сохнуть губи.
    note:
      en: 'Almost always plural in real sentences, because they come in a pair. The stick in every German handbag from November on is der Lippenstift — which is lipstick, not lip balm; the balm is der Lippenpflegestift or simply die Lippencreme. A2 der Mund is the opening as a whole and is what you open at a dentist''s; these are only its rim. The idiom an den Lippen hängen means to hang on somebody''s every word.'
      ru: 'В живой речи почти всегда во множественном числе — они парные. Карандаш, который с ноября лежит в каждой немецкой сумке, — der Lippenstift, и это именно губная помада, а не гигиеническая: гигиеническая — der Lippenpflegestift или просто die Lippencreme. der Mund уровня A2 — отверстие целиком, его открывают у стоматолога; здесь же речь только о его кромке. Оборот an den Lippen hängen значит «ловить каждое слово».'
      uk: 'У живому мовленні майже завжди в множині — вони парні. Олівець, що з листопада лежить у кожній німецькій сумці, — der Lippenstift, і це саме губна помада, а не гігієнічна: гігієнічна — der Lippenpflegestift або просто die Lippencreme. der Mund рівня A2 — отвір цілком, його відкривають у стоматолога; тут же йдеться лише про його край. Зворот an den Lippen hängen означає «ловити кожне слово».'

  - de: Bart
    ipa: "ˈbaːɐ̯t"
    pos: noun
    gender: m
    plural: "die Bärte"
    # Recognition only: grooming rather than medicine, and the sentence a learner
    # produces about it is built from A2 `rasieren` — the noun is read on a barber's
    # window and heard in a description, not said.
    cards: recognition
    en: the hair a man lets grow on his chin and cheeks
    ru: волосы, которые мужчина отпускает на подбородке и щеках
    uk: волосся, яке чоловік відпускає на підборідді та щоках
    example_de: Seit dem Urlaub trägt mein Bruder einen Bart.
    example_en: My brother has had a beard since the holiday.
    example_ru: После отпуска мой брат носит бороду.
    example_uk: Після відпустки мій брат носить бороду.
    note:
      en: 'The umlaut appears only in the plural: der Bart, die Bärte. German does not separate beard from moustache with two basic words — the upper lip alone is der Schnurrbart, three days'' worth is der Dreitagebart, and the collective is simply this word. The verb beside it is sich rasieren, and a man who keeps one is bärtig. Do not confuse it with die Bar, a place to drink, or with A1 das Haar on the head.'
      ru: 'Умлаут появляется только во множественном числе: der Bart, die Bärte. Немецкий не разводит бороду и усы двумя разными базовыми словами: усы отдельно — der Schnurrbart, трёхдневная щетина — der Dreitagebart, а общее слово одно. Рядом стоит глагол sich rasieren, а тот, кто её носит, — bärtig. Не путайте со словом die Bar, где пьют, и с das Haar уровня A1 на голове.'
      uk: 'Умлаут з’являється лише в множині: der Bart, die Bärte. Німецька не розводить бороду й вуса двома різними базовими словами: вуса окремо — der Schnurrbart, триденна щетина — der Dreitagebart, а спільне слово одне. Поряд стоїть дієслово sich rasieren, а той, хто її носить, — bärtig. Не плутайте зі словом die Bar, де п’ють, і з das Haar рівня A1 на голові.'

  - de: Muskel
    ipa: "ˈmʊskl̩"
    pos: noun
    gender: m
    plural: "die Muskeln"
    # Recognition only: gym and anatomy register. What a learner produces after a hard
    # day is `Ich habe Muskelkater` as a chunk, or A1 `Schmerzen`.
    cards: recognition
    en: one of the parts under the skin that pull a bone and make it move
    ru: одна из тканей под кожей, которая тянет кость и заставляет её двигаться
    uk: одна з тканин під шкірою, що тягне кістку і змушує її рухатися
    example_de: Nach dem Training tun mir alle Muskeln weh.
    example_en: All my muscles hurt after the training session.
    example_ru: После тренировки у меня болят все мышцы.
    example_uk: Після тренування в мене болять усі м’язи.
    note:
      en: 'Masculine and plural in -n — der Muskel, die Muskeln — with no umlaut anywhere. The one word every German gym-goer knows is der Muskelkater, literally a muscle hangover, for the ache two days after unusual exercise; there is no shorter way to say it. Note the stress: it falls on the first syllable, unlike English muscle''s Latin cousin musculature. Building them is Muskeln aufbauen.'
      ru: 'Мужской род, множественное на -n — der Muskel, die Muskeln, — умлаута нигде нет. Слово, которое знает каждый посетитель немецкого спортзала, — der Muskelkater, буквально «мышечное похмелье», то есть боль через день-другой после непривычной нагрузки; короче сказать нельзя. Обратите внимание на ударение: оно на первом слоге. «Накачивать» их — Muskeln aufbauen.'
      uk: 'Чоловічий рід, множина на -n — der Muskel, die Muskeln, — умлаута ніде немає. Слово, яке знає кожен відвідувач німецького спортзалу, — der Muskelkater, буквально «м’язове похмілля», тобто біль через день-другий після незвичного навантаження; коротше сказати не можна. Зверніть увагу на наголос: він на першому складі. «Накачувати» їх — Muskeln aufbauen.'

  - de: Knochen
    ipa: "ˈknɔxn̩"
    pos: noun
    gender: m
    plural: "die Knochen"
    en: one of the hard white parts that hold a body up and can break in a fall
    ru: одна из твёрдых белых частей, на которых держится тело и которые ломаются при падении
    uk: одна з твердих білих частин, на яких тримається тіло і які ламаються при падінні
    example_de: Beim Sturz auf dem Eis hat sie sich einen Knochen gebrochen.
    example_en: She broke a bone falling on the ice.
    example_ru: Упав на льду, она сломала кость.
    example_uk: Упавши на льоду, вона зламала кістку.
    note:
      en: 'Singular and plural are spelled the same, like A1 der Rücken. The k is spoken here too, so the word opens kn-. The sentence a hospital wants is sich etwas brechen with a dative reflexive — ich habe mir den Arm gebrochen — and the result on the X-ray is der Bruch. Two compounds you will hear: der Knochenbruch for the fracture itself and das Knochenmark for marrow. Of a person, knochig means gaunt.'
      ru: 'Единственное и множественное пишутся одинаково — как der Rücken уровня A1. k здесь тоже произносится, так что слово открывается сочетанием kn-. Больнице нужна конструкция sich etwas brechen с возвратным местоимением в Dativ: ich habe mir den Arm gebrochen, — а результат на снимке называется der Bruch. Два составных слова, которые вы услышите: der Knochenbruch — сам перелом и das Knochenmark — костный мозг. О человеке knochig значит «костлявый».'
      uk: 'Однина і множина пишуться однаково — як der Rücken рівня A1. k тут теж вимовляється, тож слово відкривається сполукою kn-. Лікарні потрібна конструкція sich etwas brechen зі зворотним займенником у Dativ: ich habe mir den Arm gebrochen, — а результат на знімку зветься der Bruch. Два складні слова, які ви почуєте: der Knochenbruch — сам перелом і das Knochenmark — кістковий мозок. Про людину knochig означає «кістлявий».'

  # --- Was drinnen arbeitet ---
  - de: Herz
    ipa: "ˈhɛʁts"
    pos: noun
    gender: n
    plural: "die Herzen"
    en: the organ in the chest that pumps and beats faster when you run
    ru: орган в груди, который качает кровь и бьётся чаще, когда бежишь
    uk: орган у грудях, який качає кров і б’ється частіше, коли біжиш
    example_de: Beim Treppensteigen schlägt mein Herz sehr schnell.
    example_en: My heart beats very fast when I climb stairs.
    example_ru: Когда я поднимаюсь по лестнице, сердце бьётся очень часто.
    example_uk: Коли я піднімаюся сходами, серце б’ється дуже часто.
    note:
      en: 'Neuter, and its declension is the last irregular one left in modern German: dem Herzen, des Herzens, die Herzen. The figurative sense is as alive as in English and drives whole chunks — von Herzen for sincerely, sich etwas zu Herzen nehmen for taking something to heart, and ein Herz aus Stein. In medicine everything hangs off it in compounds: der Herzinfarkt, die Herzkrankheit, der Herzschlag. Watch the r: it is the uvular one and the word is one syllable.'
      ru: 'Средний род, и его склонение — последнее неправильное, уцелевшее в современном немецком: dem Herzen, des Herzens, die Herzen. Переносное значение живо не меньше, чем в русском, и держит целые обороты: von Herzen — «от души», sich etwas zu Herzen nehmen — «принять близко к сердцу», ein Herz aus Stein. В медицине от него ветвятся составные слова: der Herzinfarkt, die Herzkrankheit, der Herzschlag. Следите за r: оно увулярное, а слово односложное.'
      uk: 'Середній рід, і його відмінювання — останнє неправильне, що вціліло в сучасній німецькій: dem Herzen, des Herzens, die Herzen. Переносне значення живе не менше, ніж в українській, і тримає цілі звороти: von Herzen — «від щирого серця», sich etwas zu Herzen nehmen — «взяти близько до серця», ein Herz aus Stein. У медицині від нього розгалужуються складні слова: der Herzinfarkt, die Herzkrankheit, der Herzschlag. Стежте за r: воно увулярне, а слово односкладове.'

  - de: Blut
    ipa: "ˈbluːt"
    pos: noun
    gender: n
    plural: "—"
    en: the red liquid that runs through a body and is taken for a laboratory test
    ru: красная жидкость, которая течёт по телу и которую берут на лабораторный анализ
    uk: червона рідина, що тече тілом і яку беруть на лабораторний аналіз
    example_de: Für den Test müssen wir Ihnen Blut abnehmen.
    example_en: We have to take some blood from you for the test.
    example_ru: Для анализа нам нужно взять у вас кровь.
    example_uk: Для аналізу нам треба взяти у вас кров.
    note:
      en: 'A mass noun with no plural at all, so it never takes ein. The two sentences a practice actually says are Blut abnehmen, to take a sample, and Blut spenden, to donate. Compounds carry most of the medical field: der Blutdruck for blood pressure, which is what a nurse measures first, das Blutbild for the lab result, and die Blutgruppe. The vowel is long — bluː — and that length is what separates it from the verb beside it.'
      ru: 'Неисчисляемое слово без множественного числа, поэтому ein при нём не ставится. Две фразы, которые действительно звучат в кабинете: Blut abnehmen — «взять анализ» и Blut spenden — «сдать донорскую». Медицинское поле держится на составных словах: der Blutdruck — давление, которое медсестра меряет первым, das Blutbild — результат анализа и die Blutgruppe. Гласный долгий — bluː, — и именно долгота отличает это слово от стоящего рядом глагола.'
      uk: 'Незлічуване слово без множини, тому ein при ньому не ставлять. Дві фрази, які справді звучать у кабінеті: Blut abnehmen — «взяти аналіз» і Blut spenden — «здати донорську». Медичне поле тримається на складних словах: der Blutdruck — тиск, який медсестра міряє першим, das Blutbild — результат аналізу і die Blutgruppe. Голосний довгий — bluː, — і саме довгота відрізняє це слово від дієслова поряд.'

  - de: bluten
    ipa: "ˈbluːtn̩"
    pos: verb
    praesens_3sg: blutet
    partizip2: geblutet
    aux: haben
    en: to lose blood from a cut or a wound
    ru: терять кровь из пореза или раны, кровоточить
    uk: втрачати кров із порізу чи рани, кровоточити
    example_de: Die Wunde blutet immer noch ein bisschen.
    example_en: The cut is still bleeding a little.
    example_ru: Рана всё ещё немного кровоточит.
    example_uk: Рана все ще трохи кровоточить.
    note:
      en: 'Weak and regular, with haben in the Perfekt even though nothing is done to an object: Es hat stark geblutet. The commonest use in daily life is die Nase blutet, a nosebleed, which German states as a full clause rather than naming it as a noun. Note the -et in blutet and geblutet: the stem ends in t, so the ending needs its helping e, exactly like arbeiten. Beside it, verbluten is to bleed to death.'
      ru: 'Слабый и правильный, в Perfekt с haben, хотя никакого объекта нет: Es hat stark geblutet. Чаще всего в быту говорят die Nase blutet — про носовое кровотечение, и немецкий выражает это целым предложением, а не отдельным существительным. Обратите внимание на -et в blutet и geblutet: основа кончается на t, поэтому окончанию нужна вставная e — ровно как у arbeiten. Рядом verbluten значит «истечь кровью».'
      uk: 'Слабке й правильне, у Perfekt із haben, хоча жодного об’єкта немає: Es hat stark geblutet. Найчастіше в побуті кажуть die Nase blutet — про носову кровотечу, і німецька виражає це цілим реченням, а не окремим іменником. Зверніть увагу на -et у blutet і geblutet: основа закінчується на t, тож закінченню потрібна вставна e — точно як в arbeiten. Поряд verbluten означає «стекти кров’ю».'

  - de: Atem
    ipa: "ˈaːtəm"
    pos: noun
    gender: m
    plural: "—"
    # Recognition only: B1's `atmen` (gesundheit-wohlbefinden) already ships as the
    # production card for this idea, and the noun lives almost entirely inside fixed
    # chunks the learner reads rather than builds.
    cards: recognition
    en: the air a person draws in and lets out, as something that can run short
    ru: воздух, который человек вдыхает и выдыхает, — то, чего может не хватать
    uk: повітря, яке людина вдихає і видихає, — те, чого може бракувати
    example_de: Nach dem Lauf war sie ganz außer Atem.
    example_en: She was completely out of breath after the run.
    example_ru: После пробежки она совсем запыхалась.
    example_uk: Після пробіжки вона зовсім захекалася.
    note:
      en: 'Masculine, no plural, and it barely appears outside three chunks: außer Atem sein, to be out of breath, tief Atem holen, to take a deep breath, and den Atem anhalten, to hold it. The verb atmen is the everyday way to say all of this, which is why the noun is worth recognising more than producing. Two compounds a doctor uses: die Atemnot for breathlessness and der Atemzug for a single breath.'
      ru: 'Мужской род, множественного нет, и вне трёх оборотов слово почти не встречается: außer Atem sein — «запыхаться», tief Atem holen — «глубоко вдохнуть» и den Atem anhalten — «задержать дыхание». Всё это в быту выражают глаголом atmen, поэтому существительное важнее узнавать, чем строить. Два врачебных составных слова: die Atemnot — одышка и der Atemzug — один вдох.'
      uk: 'Чоловічий рід, множини немає, і поза трьома зворотами слово майже не трапляється: außer Atem sein — «захекатися», tief Atem holen — «глибоко вдихнути» і den Atem anhalten — «затримати дихання». Усе це в побуті виражають дієсловом atmen, тому іменник важливіше впізнавати, ніж будувати. Два лікарські складні слова: die Atemnot — задишка і der Atemzug — один вдих.'

  - de: Kraft
    ipa: "ˈkʁaft"
    pos: noun
    gender: f
    plural: "die Kräfte"
    en: the bodily power a person has for lifting, pushing or holding out
    ru: телесная сила, которой хватает, чтобы поднять, толкнуть или продержаться
    uk: тілесна сила, якої вистачає, щоб підняти, штовхнути або протриматися
    example_de: Nach der Grippe hatte er zwei Wochen lang keine Kraft.
    example_en: After the flu he had no strength for two weeks.
    example_ru: После гриппа у него две недели не было сил.
    example_uk: Після грипу в нього два тижні не було сил.
    note:
      en: 'Not the same word as B1 die Energie, which is what a power station produces and what a diet gives you in the abstract; this one is what your arms have or do not have this morning, and the sentence Ich habe keine Kraft mehr is the everyday complaint. The plural means either forces or, in an office, staff — Fachkräfte are qualified people. A second, legal sense travels in fixed phrases: in Kraft treten, of a law coming into force. The adjective beside it is the next entry.'
      ru: 'Это не die Energie уровня B1, которую вырабатывает электростанция и о которой отвлечённо говорят применительно к питанию; здесь речь о том, есть ли у вас сегодня силы в руках, и обиходная жалоба звучит так: Ich habe keine Kraft mehr. Множественное значит либо «силы» вообще, либо, в конторском языке, «кадры»: Fachkräfte — квалифицированные работники. Второй, юридический смысл ходит в устойчивых оборотах: in Kraft treten — «вступить в силу» о законе. Прилагательное рядом — следующая запись.'
      uk: 'Це не die Energie рівня B1, яку виробляє електростанція і про яку відсторонено говорять щодо харчування; тут ідеться про те, чи є у вас сьогодні сила в руках, і побутова скарга звучить так: Ich habe keine Kraft mehr. Множина означає або «сили» взагалі, або, у канцелярській мові, «кадри»: Fachkräfte — кваліфіковані працівники. Другий, юридичний сенс ходить в усталених зворотах: in Kraft treten — «набути чинності» про закон. Прикметник поряд — наступний запис.'

  - de: kräftig
    ipa: "ˈkʁɛftɪç"
    pos: adj
    # Recognition only: A2 ships `stark` ("strong", charakter-eigenschaften-a2) as the
    # production card for exactly this prompt, and no accept list in this deck can
    # reach a card in that one.
    cards: recognition
    en: solidly built and powerful — said of a body, and also of a colour or a meal
    en_compact: solidly built and powerful
    ru: крепкий и плотный — о телосложении, а также о цвете или о еде
    uk: міцний і щільний — про статуру, а також про колір або про їжу
    example_de: Für diese Arbeit braucht man kräftige Arme.
    example_en: You need powerful arms for this job.
    example_ru: Для этой работы нужны крепкие руки.
    example_uk: Для цієї роботи потрібні міцні руки.
    note:
      en: 'Formed from the noun above with the umlaut and -ig, and it says something A2 stark does not: not just strong but thickset, with substance behind the strength. That is why it stretches to other senses — eine kräftige Farbe is a deep, saturated colour, ein kräftiges Essen is a hearty meal, and kräftig schütteln on a bottle means shake it hard. Of a person it is never an insult, unlike dick.'
      ru: 'Образовано от существительного выше умлаутом и суффиксом -ig, и говорит оно то, чего не говорит stark уровня A2: не просто «сильный», а «плотный, ладный», с телесной основательностью за силой. Отсюда и другие значения: eine kräftige Farbe — насыщенный цвет, ein kräftiges Essen — сытная еда, а kräftig schütteln на флаконе значит «хорошенько взболтать». О человеке это, в отличие от dick, никогда не обидно.'
      uk: 'Утворене від іменника вище умлаутом і суфіксом -ig, і каже воно те, чого не каже stark рівня A2: не просто «сильний», а «щільний, ладний», із тілесною ґрунтовністю за силою. Звідси й інші значення: eine kräftige Farbe — насичений колір, ein kräftiges Essen — ситна їжа, а kräftig schütteln на флаконі означає «добряче збовтати». Про людину це, на відміну від dick, ніколи не образливо.'

  - de: körperlich
    ipa: "ˈkœʁpɐlɪç"
    pos: adj
    # Recognition only: read on a job advert, a sick note and a fitness leaflet. The
    # learner who has to say it reaches for A1 `Körper` in a prepositional phrase.
    cards: recognition
    en: having to do with the body rather than with the mind
    ru: относящийся к телу, а не к душе или уму
    uk: що стосується тіла, а не душі чи розуму
    example_de: Die Arbeit im Lager ist körperlich sehr anstrengend.
    example_en: The work in the warehouse is physically very demanding.
    example_ru: Работа на складе физически очень тяжёлая.
    example_uk: Робота на складі фізично дуже виснажлива.
    note:
      en: 'Built from A1 der Körper with -lich. Its standing opposite is geistig, of the mind, and German job adverts and sick notes pair them constantly: körperlich und geistig fit. As an adverb it modifies a whole state — körperlich anstrengend, körperlich behindert. Do not use it of a physical object; a thing that exists in the world is materiell or real, and the school subject Physik is a different word entirely.'
      ru: 'Образовано от der Körper уровня A1 суффиксом -lich. Постоянная противоположность — geistig, «душевный, умственный», и немецкие объявления о работе и больничные листы всё время ставят их рядом: körperlich und geistig fit. Как наречие определяет состояние целиком: körperlich anstrengend, körperlich behindert. Не применяйте его к предмету: вещь, существующая в мире, — materiell или real, а школьный предмет Physik — совсем другое слово.'
      uk: 'Утворене від der Körper рівня A1 суфіксом -lich. Постійна протилежність — geistig, «душевний, розумовий», і німецькі оголошення про роботу й лікарняні листки весь час ставлять їх поряд: körperlich und geistig fit. Як прислівник визначає стан цілком: körperlich anstrengend, körperlich behindert. Не застосовуйте його до предмета: річ, що існує у світі, — materiell або real, а шкільний предмет Physik — зовсім інше слово.'

  - de: schwitzen
