      ru: 'Две вещи разом, и выбирает предложение: Medizin studieren — университетский предмет, а Nimm deine Medizin — пузырёк на полке, для которого точное и аптечное слово — das Medikament уровня A1. Ударение на последнем слоге. Прилагательное — medizinisch, а die Humanmedizin отделяет человеческую область от die Tiermedizin.'
      uk: 'Дві речі водночас, і обирає речення: Medizin studieren — університетський предмет, а Nimm deine Medizin — пляшечка на полиці, для якої точне й аптечне слово — das Medikament рівня A1. Наголос на останньому складі. Прикметник — medizinisch, а die Humanmedizin відділяє людську галузь від die Tiermedizin.'

  - de: Therapie
    ipa: "teʁaˈpiː"
    pos: noun
    gender: f
    plural: "die Therapien"
    # Recognition only: read on a referral and a clinic website. What a learner says is
    # `Ich gehe zur Physiotherapie` as a fixed chunk, or names the treatment itself.
    cards: recognition
    en: a course of treatment that runs over weeks, not a single visit
    ru: курс лечения, растянутый на недели, а не одно посещение
    uk: курс лікування, розтягнутий на тижні, а не одне відвідування
    example_de: Nach dem Unfall macht er eine Therapie für die Schulter.
    example_en: He is having a course of treatment for his shoulder after the accident.
    example_ru: После аварии он проходит курс лечения плеча.
    example_uk: Після аварії він проходить курс лікування плеча.
    note:
      en: 'Stress on the final -pie, and the h is silent. The word means the plan and the series, not the one appointment: eine Therapie machen, in Therapie sein. Germans shorten the two commonest kinds in speech — die Physio for physiotherapy and, said of talking treatment, simply die Therapie. Beside it, die Behandlung is any treatment at all, including a single filling at the dentist''s.'
      ru: 'Ударение на конечном -pie, h не произносится. Слово значит план и серию, а не один приём: eine Therapie machen, in Therapie sein. Две самые частые разновидности немцы в речи сокращают: die Physio — физиотерапия, а о психотерапии говорят просто die Therapie. Рядом die Behandlung — любое лечение вообще, включая одну пломбу у стоматолога.'
      uk: 'Наголос на кінцевому -pie, h не вимовляється. Слово означає план і серію, а не один прийом: eine Therapie machen, in Therapie sein. Два найчастіші різновиди німці в мовленні скорочують: die Physio — фізіотерапія, а про психотерапію кажуть просто die Therapie. Поряд die Behandlung — будь-яке лікування взагалі, включно з однією пломбою у стоматолога.'

  - de: Diät
    ipa: "diˈɛːt"
    pos: noun
    gender: f
    plural: "die Diäten"
    # Recognition only: B1's `Ernährung` ("diet, nutrition", gesundheit-wohlbefinden)
    # already ships as the production card in this field, and no prompt for a
    # restricted eating plan can be kept clear of it.
    cards: recognition
    en: a restricted eating plan followed to lose weight or on a doctor's orders
    ru: ограничительный режим питания ради похудения или по назначению врача
    uk: обмежувальний режим харчування задля схуднення або за призначенням лікаря
    example_de: Seit Januar macht meine Schwester eine strenge Diät.
    example_en: My sister has been on a strict diet since January.
    example_ru: С января моя сестра сидит на строгой диете.
    example_uk: Із січня моя сестра сидить на суворій дієті.
    note:
      en: 'A false friend for English speakers: this is never the neutral sense of what somebody normally eats — that is die Ernährung, and eine gesunde Ernährung is a healthy diet in the English sense. Here it is always the restriction, and the verb is machen or halten, never haben. The trema on the ä matters: two syllables, di-ät, with the stress on the second. The plural also means the allowance paid to a member of parliament.'
      ru: 'Ложный друг: нейтрального значения «то, что человек обычно ест» здесь нет — это die Ernährung, и eine gesunde Ernährung значит «здоровое питание». Тут всегда именно ограничение, а глагол при нём — machen или halten, но не haben. Две точки над ä существенны: слово двусложное, di-ät, ударение на втором. Множественное значит ещё и депутатское содержание.'
      uk: 'Фальшивий друг: нейтрального значення «те, що людина зазвичай їсть» тут немає — це die Ernährung, і eine gesunde Ernährung означає «здорове харчування». Тут завжди саме обмеження, а дієслово при ньому — machen або halten, але не haben. Дві крапки над ä істотні: слово двоскладове, di-ät, наголос на другому. Множина означає ще й депутатське утримання.'

  - de: ernähren
    ipa: "ɛɐ̯ˈnɛːʁən"
    pos: verb
    praesens_3sg: ernährt
    partizip2: ernährt
    aux: haben
    valence: "+ Akk / sich"
    en: to provide somebody with what they live on; with sich, to eat in a certain way
    ru: обеспечивать кого-то пропитанием; с sich — питаться определённым образом
    uk: забезпечувати когось харчуванням; із sich — харчуватися певним чином
    example_de: Seit einem Jahr ernährt sie sich ohne Fleisch.
    example_en: She has been eating without meat for a year.
    example_ru: Уже год она питается без мяса.
    example_uk: Уже рік вона харчується без м’яса.
    note:
      en: 'Two readings, and the pronoun tells them apart. Without sich it means to keep somebody alive by providing food — eine Familie ernähren is to be the breadwinner, and it is about money as much as about meals. With sich it is what you personally eat, and it is the standard way to say it: sich gesund ernähren, sich vegetarisch ernähren. The noun of the second reading is die Ernährung. The er- prefix is unstressed and its r is the vocalised one.'
      ru: 'Два чтения, и различает их местоимение. Без sich — «содержать, кормить»: eine Familie ernähren значит «кормить семью», и речь тут не меньше о деньгах, чем о еде. С sich — о том, как питаетесь вы сами, и это стандартный способ это сказать: sich gesund ernähren, sich vegetarisch ernähren. Существительное от второго чтения — die Ernährung. Приставка er- безударна, а r в ней вокализованное.'
      uk: 'Два прочитання, і розрізняє їх займенник. Без sich — «утримувати, годувати»: eine Familie ernähren означає «годувати родину», і йдеться тут не менше про гроші, ніж про їжу. Із sich — про те, як харчуєтеся ви самі, і це стандартний спосіб це сказати: sich gesund ernähren, sich vegetarisch ernähren. Іменник від другого прочитання — die Ernährung. Префікс er- ненаголошений, а r у ньому вокалізоване.'

  # --- Wer behandelt wird, und wo ---
  - de: Patient
    ipa: "paˈtsi̯ɛnt"
    pos: noun
    gender: m
    plural: "die Patienten"
    en: a man a doctor is treating, seen from the practice's side of the desk
    ru: мужчина, которого лечит врач, — как его называют по ту сторону стола в кабинете
    uk: чоловік, якого лікує лікар, — як його називають по той бік столу в кабінеті
    example_de: Der Arzt hat heute schon dreißig Patienten gesehen.
    example_en: The doctor has already seen thirty patients today.
    example_ru: Врач сегодня уже принял тридцать пациентов.
    example_uk: Лікар сьогодні вже прийняв тридцять пацієнтів.
    note:
      en: 'An n-noun: it adds -en everywhere except the nominative singular — dem Patienten, den Patienten, die Patienten — the same pattern as A2 Kollege and Kunde. The ti is spoken tsi, so the word has three syllables with the stress on the last. The feminine is die Patientin, the next entry. It is the practice''s word for you; your own word for your state is A1 krank.'
      ru: 'Слабое существительное: -en появляется везде, кроме именительного единственного, — dem Patienten, den Patienten, die Patienten, — та же модель, что у Kollege и Kunde уровня A2. ti произносится «ци», так что слогов три, ударение на последнем. Женская пара — die Patientin, следующая запись. Это слово кабинета о вас; о собственном состоянии вы скажете krank уровня A1.'
      uk: 'Слабкий іменник: -en з’являється всюди, крім називного однини, — dem Patienten, den Patienten, die Patienten, — та сама модель, що в Kollege і Kunde рівня A2. ti вимовляється «ці», тож складів три, наголос на останньому. Жіноча пара — die Patientin, наступний запис. Це слово кабінету про вас; про власний стан ви скажете krank рівня A1.'

  - de: Patientin
    ipa: "paˈtsi̯ɛntɪn"
    pos: noun
    gender: f
    plural: "die Patientinnen"
    # Recognition only: the feminine of the entry above, whose note already names this
    # form — the pair costs three cards rather than four, per the Movierung rule for
    # the B1 completion pass.
    cards: recognition
    en: a woman a doctor is treating, in that same word from the practice's side
    ru: женщина, которую лечит врач, — тем же словом со стороны кабинета
    uk: жінка, яку лікує лікар, — тим самим словом з боку кабінету
    example_de: Die Patientin wartet schon zwanzig Minuten im Wartezimmer.
    example_en: The patient has already been waiting twenty minutes in the waiting room.
    example_ru: Пациентка ждёт в приёмной уже двадцать минут.
    example_uk: Пацієнтка чекає в приймальні вже двадцять хвилин.
    note:
      en: 'Regular Movierung with -in, doubled n in the plural, and — as with A2 Kollegin — the n-declension of the masculine stops here: this form never changes its ending. Practice software and waiting-room signs write Patient/-in or Patient*in; a letter addressed to you personally will use whichever fits. The neutral plural for a mixed group is die Patienten.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается, и — как у Kollegin уровня A2 — слабое склонение мужской формы здесь обрывается: эта форма окончания не меняет. Программы для практик и таблички в приёмной пишут Patient/-in или Patient*in; в личном письме выберут подходящую. Нейтральное множественное для смешанной группы — die Patienten.'
      uk: 'Звичайна моція на -in, у множині n подвоюється, і — як у Kollegin рівня A2 — слабке відмінювання чоловічої форми тут уривається: ця форма закінчення не змінює. Програми для практик і таблички в приймальні пишуть Patient/-in або Patient*in; в особистому листі виберуть відповідну. Нейтральна множина для змішаної групи — die Patienten.'

  - de: Kranke
    ipa: "ˈkʁaŋkə"
    pos: noun
    gender: f
    plural: "die Kranken"
    # An adjectival noun (der Kranke / ein Kranker / eine Kranke), so it would need an
    # accept list if it were typed — it is not, and the note carries the declension.
    # Recognition only: A1 ships the adjective `krank` (goethe-a1-kernwortschatz) as a
    # production card, and this noun is one ending away from it — a typed prompt about
    # an ill person cannot say which of the two it wants.
    cards: recognition
    en: an ill person, referred to as a person rather than described
    ru: больной человек, названный как лицо, а не описанный
    uk: хвора людина, названа як особа, а не описана
    example_de: Auf der Station liegen zwölf Kranke.
    example_en: There are twelve sick people on the ward.
    example_ru: В отделении лежат двенадцать больных.
    example_uk: У відділенні лежать дванадцять хворих.
    note:
      en: 'An adjectival noun, so its ending changes with the article in front of it: der Kranke, ein Kranker, die Kranke, die Kranken — exactly like A2 der Angestellte and die Verwandte. It belongs to writing and to institutions; in speech a German says er ist krank rather than naming somebody this way. Compounds built on it are everywhere in the health system, though: das Krankenhaus, die Krankenkasse, der Krankenwagen below, all with -en- in the middle.'
      ru: 'Субстантивированное прилагательное, поэтому окончание меняется вместе с артиклем: der Kranke, ein Kranker, die Kranke, die Kranken — ровно как der Angestellte и die Verwandte уровня A2. Слово письменное и институциональное; в речи немец скажет er ist krank, а не назовёт человека так. Зато составные слова с ним пронизывают всю систему здравоохранения: das Krankenhaus, die Krankenkasse, der Krankenwagen ниже — все с -en- в середине.'
      uk: 'Субстантивований прикметник, тому закінчення змінюється разом з артиклем: der Kranke, ein Kranker, die Kranke, die Kranken — так само як der Angestellte і die Verwandte рівня A2. Слово письмове й інституційне; у мовленні німець скаже er ist krank, а не назве людину так. Зате складні слова з ним пронизують усю систему охорони здоров’я: das Krankenhaus, die Krankenkasse, der Krankenwagen нижче — усі з -en- посередині.'

  - de: Klinik
    ipa: "ˈkliːnɪk"
    pos: noun
    gender: f
    plural: "die Kliniken"
    # Recognition only: A1 ships `Krankenhaus` ("hospital", koerper-gesundheit) as the
    # production card for the building you are admitted to, and in everyday German the
    # two answer the same prompt.
    cards: recognition
    en: a hospital, especially one built around a single field of treatment
    ru: больница, особенно устроенная вокруг одного направления лечения
    uk: лікарня, особливо влаштована навколо одного напряму лікування
    example_de: Sie arbeitet seit drei Jahren in einer Klinik für Kinder.
    example_en: She has been working at a children's hospital for three years.
    example_ru: Она уже три года работает в детской больнице.
    example_uk: Вона вже три роки працює в дитячій лікарні.
    note:
      en: 'Interchangeable with A1 das Krankenhaus in most sentences, with one shade of difference: this word leans towards a specialised or a private house — die Augenklinik, die Privatklinik — and a university hospital is die Uniklinik. Stress on the first syllable, with a long i, and the plural adds -en. A doctor''s own rooms are die Praxis, which is never this word.'
      ru: 'В большинстве фраз взаимозаменяемо с das Krankenhaus уровня A1, с одним оттенком: это слово тяготеет к специализированному или частному заведению — die Augenklinik, die Privatklinik, — а университетская больница называется die Uniklinik. Ударение на первом слоге, i долгое, множественное на -en. Кабинет самого врача — die Praxis, и это никогда не то же слово.'
      uk: 'У більшості фраз взаємозамінне з das Krankenhaus рівня A1, з одним відтінком: це слово тяжіє до спеціалізованого або приватного закладу — die Augenklinik, die Privatklinik, — а університетська лікарня зветься die Uniklinik. Наголос на першому складі, i довге, множина на -en. Кабінет самого лікаря — die Praxis, і це ніколи не те саме слово.'

  - de: Krankenwagen
    ipa: "ˈkʁaŋkn̩ˌvaːgn̩"
    pos: noun
    gender: m
    plural: "die Krankenwagen"
    en: the emergency vehicle with a siren that drives an injured person to hospital
    ru: экстренная машина с сиреной, которая везёт пострадавшего в больницу
    uk: екстрений автомобіль із сиреною, що везе потерпілого до лікарні
    example_de: Ruf bitte sofort einen Krankenwagen!
    example_en: Please call an ambulance immediately!
    example_ru: Пожалуйста, немедленно вызови скорую!
    example_uk: Будь ласка, негайно виклич швидку!
    note:
      en: 'The single most useful sentence built on it is einen Krankenwagen rufen — and note the verb: German calls the vehicle, not a number. The emergency number is 112 everywhere in the EU, and der Rettungswagen is what the service itself calls the same van. Plural and singular are spelled alike, since Wagen never changes. Primary stress on Kranken-, secondary on -wagen, as in every German compound.'
      ru: 'Самая полезная фраза с ним — einen Krankenwagen rufen, и обратите внимание на глагол: немец «зовёт» машину, а не звонит по номеру. Экстренный номер во всём ЕС — 112, а сама служба называет тот же фургон der Rettungswagen. Множественное и единственное пишутся одинаково, ведь Wagen не меняется. Главное ударение на Kranken-, побочное на -wagen, как во всяком немецком сложном слове.'
      uk: 'Найкорисніша фраза з ним — einen Krankenwagen rufen, і зверніть увагу на дієслово: німець «кличе» машину, а не телефонує на номер. Екстрений номер в усьому ЄС — 112, а сама служба називає той самий фургон der Rettungswagen. Множина й однина пишуться однаково, адже Wagen не змінюється. Головний наголос на Kranken-, побічний на -wagen, як у кожному німецькому складному слові.'

  - de: Besserung
    ipa: "ˈbɛsəʁʊŋ"
    pos: noun
    gender: f
    plural: "—"
    # Recognition only: A2 ships the whole wish `Gute Besserung!`
    # (gesundheit-arzttermin) as a production card, and this word is that card minus
    # one adjective — the `Überstunde`/`Überstunden` ruling from arbeit-beruf-b1.
    cards: recognition
    en: the turn for the better in somebody's health, as a state that has begun
    ru: перемена к лучшему в состоянии здоровья, уже начавшаяся
    uk: зміна на краще в стані здоров’я, що вже почалася
    example_de: Der Arzt sieht seit Montag eine deutliche Besserung.
    example_en: The doctor has seen a clear improvement since Monday.
    example_ru: С понедельника врач видит заметное улучшение.
    example_uk: Із понеділка лікар бачить помітне поліпшення.
    note:
      en: 'The noun of bessern, and outside medicine it is rare — it survives above all inside the wish A2 teaches, Gute Besserung!, which is what Germans say instead of get well soon and which no letter or visit omits. Do not use it for an improvement in a text, a plan or a product: that is die Verbesserung, with ver-, and the two are not interchangeable. Weather turns for the better with die Wetterbesserung.'
      ru: 'Существительное от bessern, и вне медицины оно редко — держится прежде всего внутри пожелания, которому учит A2: Gute Besserung!, — так немцы говорят вместо «выздоравливай», и ни письмо, ни визит без этого не обходятся. Не применяйте его к улучшению текста, плана или изделия: там die Verbesserung, с ver-, и они не взаимозаменяемы. Про погоду говорят die Wetterbesserung.'
      uk: 'Іменник від bessern, і поза медициною воно рідкісне — тримається передусім усередині побажання, якого вчить A2: Gute Besserung!, — так німці кажуть замість «одужуй», і ні лист, ні візит без цього не обходяться. Не застосовуйте його до поліпшення тексту, плану чи виробу: там die Verbesserung, із ver-, і вони не взаємозамінні. Про погоду кажуть die Wetterbesserung.'
