      en: 'Two senses that share nothing: the ear one, and the pins-and-needles one — meine Finger sind taub, my fingers have gone numb. A third turns up in the kitchen, where eine taube Nuss is an empty shell and, of a person, a fool. Spoken with the final b devoiced to p and the diphthong of Haus. Do not confuse it with die Taube, the pigeon, which is a noun with a different vowel length; and the sign-language noun is die Gebärdensprache.'
      ru: 'Два значения, у которых нет ничего общего: про ухо и про онемение — meine Finger sind taub, «пальцы затекли». Третье попадается на кухне: eine taube Nuss — пустой орех, а о человеке — «пустая голова». Конечное b оглушается в p, дифтонг как в Haus. Не путайте с die Taube — голубь: это существительное с другой долготой гласного; а язык жестов называется die Gebärdensprache.'
      uk: 'Два значення, у яких немає нічого спільного: про вухо і про затерплість — meine Finger sind taub, «пальці затерпли». Третє трапляється на кухні: eine taube Nuss — порожній горіх, а про людину — «порожня голова». Кінцеве b оглушується в p, дифтонг як у Haus. Не плутайте з die Taube — голуб: це іменник з іншою довготою голосного; а мова жестів зветься die Gebärdensprache.'

  - de: stumm
    ipa: "ˈʃtʊm"
    pos: adj
    # Recognition only: narrative and technical register — a silent film, a muted phone,
    # a person in a story. A learner describing a quiet room reaches for A1 `leise`.
    cards: recognition
    en: unable to speak, or saying nothing on purpose
    ru: лишённый речи или намеренно не произносящий ни слова
    uk: позбавлений мови або навмисне такий, що не промовляє ні слова
    example_de: Den ganzen Abend saß er stumm am Tisch.
    example_en: He sat at the table without a word all evening.
    example_ru: Весь вечер он просидел за столом молча.
    example_uk: Увесь вечір він просидів за столом мовчки.
    note:
      en: 'The medical sense is rare today; what keeps the word alive is the second one, saying nothing although you could — stumm bleiben, jemanden stumm ansehen. Technology took it over too: der Stummfilm is a silent film and das Handy stumm schalten is to mute a phone. It is not A1 leise, which is about volume, nor still, which is about a room being quiet. The st- opens ʃt-.'
      ru: 'Медицинское значение сегодня редко; слово держится вторым — «молчать, хотя мог бы»: stumm bleiben, jemanden stumm ansehen. Техника тоже взяла его себе: der Stummfilm — немое кино, а das Handy stumm schalten — «поставить телефон на беззвучный». Это не leise уровня A1, где речь о громкости, и не still, где речь о тишине в комнате. Сочетание st- открывается как ʃt-.'
      uk: 'Медичне значення сьогодні рідкісне; слово тримається другим — «мовчати, хоч і міг би»: stumm bleiben, jemanden stumm ansehen. Техніка теж узяла його собі: der Stummfilm — німе кіно, а das Handy stumm schalten — «поставити телефон на беззвучний». Це не leise рівня A1, де йдеться про гучність, і не still, де йдеться про тишу в кімнаті. Сполука st- відкривається як ʃt-.'

  - de: Tod
    ipa: "ˈtoːt"
    pos: noun
    gender: m
    plural: "—"
    # Recognition only: A2 ships `sterben` ("to die", verben-handlungen-a2-2) and `tot`
    # ("dead", eigenschaften-dinge-a2) as production cards, and between them they answer
    # every prompt this noun could carry.
    cards: recognition
    en: the end of a life, named as an event
    ru: конец жизни, названный как событие
    uk: кінець життя, названий як подія
    example_de: Nach dem Tod ihres Mannes zog sie zu ihrer Tochter.
    example_en: She moved in with her daughter after her husband's death.
    example_ru: После смерти мужа она переехала к дочери.
    example_uk: Після смерті чоловіка вона переїхала до доньки.
    note:
      en: 'Masculine and effectively without a plural — where several are counted a text says die Todesfälle. Watch the spelling against A2 tot, the adjective: the noun carries a d and a long o, the adjective a t, and they sound identical. The genitive -es- shows up in every compound: die Todesursache for the cause of death on a certificate, die Todesangst for sheer terror. The verb is A2 sterben, and an tut sterben is not German — the cause takes an + Dativ.'
      ru: 'Мужской род и практически без множественного числа: там, где считают случаи, текст скажет die Todesfälle. Следите за написанием рядом с tot уровня A2: у существительного d и долгое o, у прилагательного t, а звучат они одинаково. Родительное -es- проступает во всех составных словах: die Todesursache — причина смерти в свидетельстве, die Todesangst — смертельный ужас. Глагол — sterben уровня A2, а причина при нём стоит с an + Dativ.'
      uk: 'Чоловічий рід і фактично без множини: там, де рахують випадки, текст скаже die Todesfälle. Стежте за написанням поряд із tot рівня A2: в іменника d і довге o, у прикметника t, а звучать вони однаково. Родове -es- проступає в усіх складних словах: die Todesursache — причина смерті у свідоцтві, die Todesangst — смертельний жах. Дієслово — sterben рівня A2, а причина при ньому стоїть з an + Dativ.'

  - de: tödlich
    ipa: "ˈtøːtlɪç"
    pos: adj
    # Recognition only: news and warning-label register — a learner reads it on a
    # bottle and in a report, and says `sehr gefährlich` instead.
    cards: recognition
    en: certain or likely to kill
    ru: приводящий к смерти, смертельный
    uk: що призводить до смерті, смертельний
    example_de: Diese Menge ist für ein Kind tödlich.
    example_en: This quantity is fatal for a child.
    example_ru: Такое количество для ребёнка смертельно.
    example_uk: Така кількість для дитини смертельна.
    note:
      en: 'The umlaut is what marks it off from the noun above: ö, not o. It is stronger than A2 gefährlich, which only says harm is possible — this one says the outcome is death, so a warning label reaches for it and a weather report does not. The news chunk is ein tödlicher Unfall. Figuratively it means unbearable rather than lethal: tödlich langweilig, deadly boring, and beleidigt sein bis aufs Blut is its cousin in tone.'
      ru: 'Умлаут — то, что отделяет его от существительного выше: ö, а не o. Оно сильнее, чем gefährlich уровня A2: то лишь говорит, что вред возможен, а это — что исход смертельный, поэтому за ним тянется предупреждающая этикетка, а не прогноз погоды. Новостной оборот — ein tödlicher Unfall. В переносном смысле значит «невыносимо», а не «смертоносно»: tödlich langweilig — «смертельно скучно».'
      uk: 'Умлаут — те, що відділяє його від іменника вище: ö, а не o. Воно сильніше за gefährlich рівня A2: те лише каже, що шкода можлива, а це — що наслідок смертельний, тому за ним тягнеться попереджувальна етикетка, а не прогноз погоди. Новинний зворот — ein tödlicher Unfall. У переносному сенсі означає «нестерпно», а не «смертоносно»: tödlich langweilig — «смертельно нудно».'

