    cards: recognition
    en: the science doctors study and practise; loosely, also what you are told to take
    ru: наука, которую изучают и практикуют врачи; в разговоре — также и само лекарство
    uk: наука, яку вивчають і практикують лікарі; у розмові — також і самі ліки
