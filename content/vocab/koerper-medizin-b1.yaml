      ru: 'Слабый, с haben, и один из трёх симптомов, о которых немецкий врач спрашивает поимённо наряду с Fieber и Husten: Haben Sie nachts geschwitzt? Существительное — der Schweiß; ß у него общее с прилагательным «белый», но гласный другой. В переносном смысле — «попотеть над задачей»: Ich habe über der Prüfung geschwitzt, — точно как по-русски. Не теряйте сочетание sch-: слово открывается ʃv-, а не sv-.'
      uk: 'Слабке, із haben, і один із трьох симптомів, про які німецький лікар питає поіменно поряд із Fieber і Husten: Haben Sie nachts geschwitzt? Іменник — der Schweiß; ß у нього спільне з прикметником «білий», але голосний інший. У переносному сенсі — «попотіти над завданням»: Ich habe über der Prüfung geschwitzt, — точно як українською. Не губіть сполуку sch-: слово відкривається ʃv-, а не sv-.'

