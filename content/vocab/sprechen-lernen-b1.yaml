# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the speech-and-
# course field of data/goethe-b1-wortliste.txt: how one German differs from another
# and what a second language is called, the small ceremonies of greeting and
# congratulating, the people who sit in a course and the words its worksheet uses,
# and the German a school, a Volkshochschule and a university put on a timetable.
# A1's `erste-schritte` owns the bare fact of a language (Sprache, sprechen,
# Buchstabe), A1's `schule-arbeit` owns the institutions (Schule, Kurs, Unterricht,
# Universität, Prüfung, Klasse, Aufgabe), A2's `schule-faecher-a2` owns the subjects
# and the marks (Fach, Mathematik, Note, Zeugnis, Abitur), A2's `redemittel-chunks-a2`
# and `freunde-feste` own the greeting formulas (Gruß, Glückwunsch), B1's
# `biografie-erfahrungen` owns Muttersprache and B1's `arbeit-bewerbung` owns
# Fremdsprache. This deck is the layer between them: the words a course register, a
# timetable and a northern radio announcer use, which those six never name.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# heard in an announcement and read off a worksheet, a timetable and a certificate;
# the sentence the learner *says* about the same situation is built from the A1 and
# A2 words above, which already ship as typed cards.
id: sprechen-lernen-b1
title_de: "Sprechen und lernen"
title_en: "Speech and the course world"
title_ru: "Речь и учёба"
title_uk: "Мовлення та навчання"
level: B1
entries:
  # --- Sprechen, Sprachen, Varianten ---
  - de: Dialekt
    ipa: "diaˈlɛkt"
    pos: noun
    gender: m
    plural: "die Dialekte"
    cards: recognition
    en: the form of a language spoken in one region, different from the standard in its sounds, words and grammar
    ru: форма языка, на которой говорят в одной местности, отличающаяся от нормы звуками, словами и грамматикой
    uk: форма мови, якою говорять в одній місцевості, відмінна від норми звуками, словами і граматикою
    example_de: Meine Nachbarn sprechen einen Dialekt, den ich kaum verstehe.
    example_en: My neighbours speak a dialect I can barely understand.
    example_ru: Мои соседи говорят на диалекте, который я едва понимаю.
    example_uk: Мої сусіди говорять діалектом, який я ледве розумію.
    note:
      en: 'What a course teaches is das Hochdeutsch, also called die Standardsprache; a Dialekt is what is spoken at home in Bavaria, Saxony, Swabia or Cologne, and the distance can be large enough that two speakers switch to Hochdeutsch to be understood. The older German word for the same thing is die Mundart, still used in book titles. The chunk is Dialekt sprechen, without an article. Masculine, plural in -e; the adjective is dialektal, and Swiss German is the case where the Dialekt, not the standard, is the everyday spoken language.'
      ru: 'Курс учит das Hochdeutsch, оно же die Standardsprache; Dialekt — то, на чём говорят дома в Баварии, Саксонии, Швабии или Кёльне, и расстояние бывает таким, что двое переходят на Hochdeutsch, лишь бы понять друг друга. Более старое немецкое слово для того же — die Mundart, оно ещё держится в названиях книг. Устойчивый оборот — Dialekt sprechen, без артикля. Мужской род, множественное на -e; прилагательное — dialektal, а швейцарский случай особый: там повседневный устный язык — именно Dialekt, а не норма.'
      uk: 'Курс учить das Hochdeutsch, воно ж die Standardsprache; Dialekt — те, чим говорять удома в Баварії, Саксонії, Швабії чи Кельні, і відстань буває такою, що двоє переходять на Hochdeutsch, аби зрозуміти одне одного. Давніше німецьке слово для того самого — die Mundart, воно ще тримається в назвах книжок. Усталений зворот — Dialekt sprechen, без артикля. Чоловічий рід, множина на -e; прикметник — dialektal, а швейцарський випадок особливий: там повсякденна усна мова — саме Dialekt, а не норма.'

  - de: Dialog
    ipa: "diaˈloːk"
    pos: noun
    gender: m
    plural: "die Dialoge"
    cards: recognition
    en: a spoken exchange between two people, especially one written down to be listened to, read out or practised
    ru: разговор двоих, прежде всего записанный, чтобы его прослушали, прочли по ролям или отработали
    uk: розмова двох, передусім записана, щоб її прослухали, прочитали за ролями чи відпрацювали
    example_de: Hören Sie den Dialog und ergänzen Sie die fehlenden Wörter.
    example_en: Listen to the dialogue and fill in the missing words.
    example_ru: Прослушайте диалог и вставьте пропущенные слова.
    example_uk: Прослухайте діалог і вставте пропущені слова.
    note:
      en: 'A2 das Gespräch, in the deck `menschen-beziehungen-a2`, is a real conversation between real people; a Dialog is the printed or staged one — in a coursebook, a play or a film script — which is why an exercise instruction reaches for this word and never for the other. It has a serious second life in politics and society, where im Dialog bleiben and der Dialog zwischen den Generationen mean talking instead of fighting. The opposite is der Monolog. Final -g is devoiced to a k.'
      ru: 'das Gespräch уровня A2 из колоды `menschen-beziehungen-a2` — настоящий разговор настоящих людей; Dialog же напечатан или разыгран — в учебнике, пьесе, сценарии, — потому инструкция к упражнению берёт именно это слово, а не то. У него есть и серьёзная вторая жизнь в языке политики и общества, где im Dialog bleiben и der Dialog zwischen den Generationen значат «разговаривать вместо того, чтобы ссориться». Противоположность — der Monolog. Конечное -g оглушается в k.'
      uk: 'das Gespräch рівня A2 з колоди `menschen-beziehungen-a2` — справжня розмова справжніх людей; Dialog же надрукований або розіграний — у підручнику, п’єсі, сценарії, — тому інструкція до вправи бере саме це слово, а не те. У нього є й поважне друге життя в мові політики та суспільства, де im Dialog bleiben і der Dialog zwischen den Generationen означають «розмовляти замість того, щоб сваритися». Протилежність — der Monolog. Кінцеве -g оглушується в k.'

  - de: fließend
    ipa: "ˈfliːsn̩t"
    pos: adj
    cards: recognition
    en: speaking a language without having to stop and search for words; also, of water, running out of a tap
    ru: говорящий на языке без остановок и поисков слова; а также, о воде, — текущий из крана
    uk: що говорить мовою без зупинок і пошуку слова; а також, про воду, — що тече з крана
    example_de: Sie spricht fließend Deutsch und Französisch.
    example_en: She speaks German and French fluently.
    example_ru: Она свободно говорит по-немецки и по-французски.
    example_uk: Вона вільно говорить німецькою і французькою.
    note:
      en: 'The word every CV needs, and the pattern is fixed: fließend plus the bare language name, no article — fließend Englisch, and as an adjective fließendes Deutsch. A job advert grades the ladder Grundkenntnisse, gute Kenntnisse, fließend, verhandlungssicher, so this is high but not the top and it does not claim to be faultless. From fließen, to flow, which keeps its literal life in fließendes Wasser, running water — the phrase a cheap hotel and an old flat advert both use.'
      ru: 'Слово, без которого не обходится ни одно резюме, и схема у него жёсткая: fließend плюс голое название языка, без артикля — fließend Englisch, а в роли прилагательного fließendes Deutsch. Объявление о работе выстраивает лестницу Grundkenntnisse, gute Kenntnisse, fließend, verhandlungssicher, так что это высоко, но не вершина, и безошибочности слово не обещает. От fließen — «течь», и буквальный смысл жив в обороте fließendes Wasser, «водопровод», который встретится и в дешёвой гостинице, и в старом объявлении о квартире.'
      uk: 'Слово, без якого не обходиться жодне резюме, і схема в нього жорстка: fließend плюс гола назва мови, без артикля — fließend Englisch, а в ролі прикметника fließendes Deutsch. Оголошення про роботу вибудовує драбину Grundkenntnisse, gute Kenntnisse, fließend, verhandlungssicher, тож це високо, але не вершина, і безпомилковості слово не обіцяє. Від fließen — «текти», і буквальний сенс живий у звороті fließendes Wasser, «водогін», який трапиться і в дешевому готелі, і в старому оголошенні про квартиру.'

  - de: Zweitsprache
    ipa: "ˈtsvaɪ̯tˌʃpʁaːxə"
    pos: noun
    gender: f
    plural: "die Zweitsprachen"
    cards: recognition
    en: a language learned after the first one and then used every day, in the country where it is spoken
    ru: язык, выученный после первого и затем используемый ежедневно — в стране, где на нём говорят
    uk: мова, вивчена після першої й далі вживана щодня — у країні, де нею говорять
    example_de: Für viele Kinder in der Klasse ist Deutsch die Zweitsprache.
    example_en: For many children in the class German is their second language.
    example_ru: Для многих детей в классе немецкий — второй язык.
    example_uk: Для багатьох дітей у класі німецька — друга мова.
    note:
      en: 'Three words sit on one line and the middle one is this: B1 die Muttersprache (deck `biografie-erfahrungen`) is the first language, B1 die Fremdsprache (deck `arbeit-bewerbung`) is one learned in a classroom and not needed once you leave it, and a Zweitsprache is learned in the country where it is spoken and carries school, work and the offices. German names two kinds of course after exactly that difference — Deutsch als Zweitsprache (DaZ) for people living here, Deutsch als Fremdsprache (DaF) for people learning abroad. Primary stress on Zweit-, secondary on -spra-.'
      ru: 'Три слова стоят на одной прямой, и это среднее из них: die Muttersprache уровня B1 (колода `biografie-erfahrungen`) — первый язык, die Fremdsprache уровня B1 (колода `arbeit-bewerbung`) — тот, что учат в классе и вне класса он не нужен, а Zweitsprache учат в стране, где на нём говорят, и на нём держатся школа, работа и учреждения. По этой самой разнице немцы называют и два типа курсов: Deutsch als Zweitsprache (DaZ) — для живущих здесь, Deutsch als Fremdsprache (DaF) — для тех, кто учит за границей. Главное ударение на Zweit-, побочное на -spra-.'
      uk: 'Три слова стоять на одній прямій, і це середнє з них: die Muttersprache рівня B1 (колода `biografie-erfahrungen`) — перша мова, die Fremdsprache рівня B1 (колода `arbeit-bewerbung`) — та, яку вчать у класі й поза класом вона не потрібна, а Zweitsprache вчать у країні, де нею говорять, і на ній тримаються школа, робота та установи. За цією самою різницею німці називають і два типи курсів: Deutsch als Zweitsprache (DaZ) — для тих, хто живе тут, Deutsch als Fremdsprache (DaF) — для тих, хто вчить за кордоном. Головний наголос на Zweit-, побічний на -spra-.'

  # --- Grüßen, gratulieren, raten ---
  - de: grüßen
    ipa: "ˈgʁyːsn̩"
    pos: verb
    praesens_3sg: grüßt
    partizip2: gegrüßt
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to say the words that acknowledge somebody on meeting them, or to send such words in a message
    ru: сказать слова, которыми при встрече обозначают внимание к человеку, или передать такие слова в сообщении
    uk: сказати слова, якими при зустрічі позначають увагу до людини, або передати такі слова в повідомленні
    example_de: Grüßen Sie bitte Ihre Frau von mir.
    example_en: Please give my regards to your wife.
    example_ru: Передайте, пожалуйста, привет вашей жене.
    example_uk: Передайте, будь ласка, вітання вашій дружині.
    note:
      en: 'Weak and regular, with haben and an accusative object — jemanden grüßen, never a dative. Two chunks carry it: jemanden von jemandem grüßen, to pass on regards, and the letter close Mit freundlichen Grüßen, which uses A2 der Gruß (deck `redemittel-chunks-a2`). B1 begrüßen is the different act of welcoming somebody who has just arrived, and the spoken greetings themselves are Grüß dich in the familiar register and Grüß Gott in the south and in Austria. The ü is long, and ß after it is a plain s.'
      ru: 'Слабый и правильный, с haben и винительным дополнением — jemanden grüßen, но не дательный. Держат его два оборота: jemanden von jemandem grüßen — «передать привет от кого-то» — и концовка письма Mit freundlichen Grüßen, где стоит der Gruß уровня A2 (колода `redemittel-chunks-a2`). begrüßen уровня B1 — другое действие: приветствовать только что пришедшего. Сами устные приветствия — Grüß dich на «ты» и Grüß Gott на юге и в Австрии. ü долгое, а ß после него — обычное глухое s.'
      uk: 'Слабке й правильне, із haben і знахідним додатком — jemanden grüßen, а не давальний. Тримають його два звороти: jemanden von jemandem grüßen — «передати вітання від когось» — і кінцівка листа Mit freundlichen Grüßen, де стоїть der Gruß рівня A2 (колода `redemittel-chunks-a2`). begrüßen рівня B1 — інша дія: вітати того, хто щойно прийшов. Самі усні вітання — Grüß dich на «ти» і Grüß Gott на півдні та в Австрії. ü довге, а ß після нього — звичайне глухе s.'

  - de: Gratulation
    ipa: "gʁatulaˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "die Gratulationen"
    cards: recognition
    en: the act of telling somebody you are glad about their success or their occasion, and the words used for it
    ru: выражение радости по поводу чужого успеха или праздника и сами слова, которыми это делают
    uk: вияв радості з приводу чужого успіху чи свята і самі слова, якими це роблять
    example_de: Nach der Prüfung gab es Blumen und viele Gratulationen.
    example_en: After the exam there were flowers and many congratulations.
    example_ru: После экзамена были цветы и множество поздравлений.
    example_uk: Після іспиту були квіти й безліч вітань.
    note:
      en: 'The verb is A2 gratulieren, in the deck `dativ-verben`, and it takes the dative — Ich gratuliere dir. On a card, though, the usual noun is A2 der Glückwunsch (deck `freunde-feste`): Herzlichen Glückwunsch zum Geburtstag is what is actually printed. This word is heavier and more formal, and as a bare exclamation — Gratulation! — it is more at home in Austria and Switzerland than in Germany. Feminine, plural in -en, stress on the -tion, like every noun of that family.'
      ru: 'Глагол — gratulieren уровня A2 из колоды `dativ-verben`, и он требует дательного: Ich gratuliere dir. Но на открытке обычное существительное — der Glückwunsch уровня A2 (колода `freunde-feste`): печатают именно Herzlichen Glückwunsch zum Geburtstag. Это слово тяжелее и официальнее, а как голое восклицание — Gratulation! — оно привычнее в Австрии и Швейцарии, чем в Германии. Женский род, множественное на -en, ударение на -tion, как у всего этого семейства.'
      uk: 'Дієслово — gratulieren рівня A2 з колоди `dativ-verben`, і воно вимагає давального: Ich gratuliere dir. Але на листівці звичайний іменник — der Glückwunsch рівня A2 (колода `freunde-feste`): друкують саме Herzlichen Glückwunsch zum Geburtstag. Це слово важче й офіційніше, а як голий вигук — Gratulation! — воно звичніше в Австрії та Швейцарії, ніж у Німеччині. Жіночий рід, множина на -en, наголос на -tion, як в усієї цієї родини.'

  - de: prima
    ipa: "ˈpʁiːma"
    pos: adj
    cards: recognition
    en: thoroughly good, said in easy everyday approval
    ru: вполне хороший — в непринуждённом обиходном одобрении
    uk: цілком добрий — у невимушеному побутовому схваленні
    example_de: Das ist eine prima Idee!
    example_en: That is a great idea!
    example_ru: Это отличная мысль!
    example_uk: Це чудова думка!
    note:
      en: 'Indeclinable, and that is the whole grammar of it: ein prima Ergebnis, eine prima Idee, prima Leute — the word never takes an ending, however the noun behind it changes. B1 klasse (deck `eigenschaften-bewertung-b1`) behaves the same way, while A2 toll and A2 super (deck `bewertung-a2`) inflect normally. It came from Italian bookkeeping, where prima Qualität was the top grade. It sounds a little older than toll, so it is heard most from parents and teachers, and it works alone as a reply: Prima!'
      ru: 'Не склоняется, и в этом вся его грамматика: ein prima Ergebnis, eine prima Idee, prima Leute — окончания слово не берёт никогда, как бы ни менялось существительное за ним. klasse уровня B1 (колода `eigenschaften-bewertung-b1`) ведёт себя так же, а toll и super уровня A2 (колода `bewertung-a2`) склоняются обычным образом. Пришло из итальянской бухгалтерии, где prima Qualität означало высший сорт. Звучит чуть старомоднее, чем toll, поэтому чаще слышно от родителей и учителей, и работает как самостоятельный ответ: Prima!'
      uk: 'Не відмінюється, і в цьому вся його граматика: ein prima Ergebnis, eine prima Idee, prima Leute — закінчень слово не бере ніколи, хоч би як змінювався іменник за ним. klasse рівня B1 (колода `eigenschaften-bewertung-b1`) поводиться так само, а toll і super рівня A2 (колода `bewertung-a2`) відмінюються звичайним чином. Прийшло з італійської бухгалтерії, де prima Qualität означало найвищий ґатунок. Звучить трохи старосвітськіше, ніж toll, тому частіше чути від батьків і вчителів, і працює як самостійна відповідь: Prima!'

  - de: Rat
    ipa: "ˈʁaːt"
    pos: noun
    gender: m
    plural: "die Ratschläge"
    cards: recognition
    en: a suggestion about what somebody should do, given by a person who is supposed to know better
    ru: подсказка о том, как поступить, от человека, который в этом разбирается лучше
    uk: підказка про те, як діяти, від людини, яка на цьому знається краще
    example_de: Sie hat ihre Schwester um Rat gefragt.
    example_en: She asked her sister for advice.
    example_ru: Она обратилась к сестре за советом.
    example_uk: Вона звернулася до сестри по пораду.
    note:
      en: 'In this sense the word has no plural of its own: the plural is supplied by B1 der Ratschlag (deck `gesundheit-wohlbefinden`), so one says einen Rat geben but viele Ratschläge. Two chunks carry it: jemanden um Rat fragen and jemandem einen Rat geben. A2 raten (deck `verben-handlungen-a2-2`) is the verb, and it takes the dative — Ich rate dir — while its other sense is to guess. A different der Rat is a council, with the plural die Räte: der Stadtrat, der Betriebsrat, and A1 das Rathaus is the building the first of them sits in.'
      ru: 'В этом значении у слова нет собственного множественного: его даёт der Ratschlag уровня B1 (колода `gesundheit-wohlbefinden`), так что говорят einen Rat geben, но viele Ratschläge. Держат слово два оборота: jemanden um Rat fragen и jemandem einen Rat geben. Глагол — raten уровня A2 (колода `verben-handlungen-a2-2`), он требует дательного — Ich rate dir, — а второе его значение «угадывать». Совсем другой der Rat — это совет как орган, с множественным die Räte: der Stadtrat, der Betriebsrat, а das Rathaus уровня A1 — здание, где заседает первый из них.'
      uk: 'У цьому значенні слово власної множини не має: її дає der Ratschlag рівня B1 (колода `gesundheit-wohlbefinden`), тож кажуть einen Rat geben, але viele Ratschläge. Тримають слово два звороти: jemanden um Rat fragen і jemandem einen Rat geben. Дієслово — raten рівня A2 (колода `verben-handlungen-a2-2`), воно вимагає давального — Ich rate dir, — а друге його значення «вгадувати». Зовсім інший der Rat — це рада як орган, із множиною die Räte: der Stadtrat, der Betriebsrat, а das Rathaus рівня A1 — будівля, де засідає перша з них.'

  # --- Der Kurs und seine Leute ---
  - de: Teilnehmer
    ipa: "ˈtaɪ̯lˌneːmɐ"
    pos: noun
    gender: m
    plural: "die Teilnehmer"
    cards: recognition
    en: a person who is taking part in a course, a meeting or a competition
    ru: человек, который участвует в курсе, совещании или соревновании
    uk: людина, яка бере участь у курсі, нараді чи змаганні
    example_de: Der Kurs hat höchstens zwölf Teilnehmer.
    example_en: The course has twelve participants at most.
    example_ru: На курсе не более двенадцати участников.
    example_uk: На курсі щонайбільше дванадцять учасників.
    note:
      en: 'This entry and die Teilnehmerin below are a pair: the feminine is made with -in on the same stem, and only the feminine plural doubles the n. The masculine spells singular and plural alike, so die Teilnehmer is read from the article. The verb is A2 teilnehmen an plus the dative, in the deck `arbeit-ausbildung-a2` — an einem Kurs teilnehmen — and the noun for the act is die Teilnahme. Official German writes both forms out (Teilnehmerinnen und Teilnehmer) or avoids the choice with die Teilnehmenden. Primary stress on Teil-, secondary on -neh-.'
      ru: 'Эта запись и die Teilnehmerin ниже — пара: женская форма делается прибавлением -in к той же основе, и n удваивается только в женском множественном. В мужском единственное и множественное пишутся одинаково, так что die Teilnehmer узнаётся по артиклю. Глагол — teilnehmen an с дательным, уровень A2, колода `arbeit-ausbildung-a2`: an einem Kurs teilnehmen; существительное действия — die Teilnahme. Официальный немецкий выписывает обе формы (Teilnehmerinnen und Teilnehmer) или уходит от выбора через die Teilnehmenden. Главное ударение на Teil-, побочное на -neh-.'
      uk: 'Цей запис і die Teilnehmerin нижче — пара, утворена моцією: жіноча форма постає додаванням -in до тієї самої основи, і n подвоюється лише в жіночій множині. У чоловічому роді однина й множина пишуться однаково, тож die Teilnehmer упізнається за артиклем. Дієслово — teilnehmen an з давальним, рівень A2, колода `arbeit-ausbildung-a2`: an einem Kurs teilnehmen; іменник дії — die Teilnahme. Офіційна німецька виписує обидві форми (Teilnehmerinnen und Teilnehmer) або уникає вибору через die Teilnehmenden. Головний наголос на Teil-, побічний на -neh-.'

  - de: Teilnehmerin
    ipa: "ˈtaɪ̯lˌneːməʁɪn"
    pos: noun
    gender: f
    plural: "die Teilnehmerinnen"
    cards: recognition
    en: a woman who is taking part in a course, a meeting or a competition
    ru: женщина, которая участвует в курсе, совещании или соревновании
    uk: жінка, яка бере участь у курсі, нараді чи змаганні
    example_de: Jede Teilnehmerin bekommt am Ende ein Zertifikat.
    example_en: Every participant receives a certificate at the end.
    example_ru: Каждая участница в конце получает сертификат.
    example_uk: Кожна учасниця наприкінці отримує сертифікат.
    note:
      en: 'The feminine of the entry above: -in on the untouched stem, and the plural doubles the n — die Teilnehmerinnen. A course register, a seminar list and a sports result sheet print both columns, and a trainer opens with Liebe Teilnehmerinnen und Teilnehmer. Where a single figure is given, the masculine plural still stands for everybody (zwölf Teilnehmer), which is why the two words are nowhere near equally frequent. B1 das Zertifikat, in the deck `lernen-zukunft`, is what she gets at the end.'
      ru: 'Женская пара к записи выше: -in на нетронутой основе, во множественном n удваивается — die Teilnehmerinnen. Журнал курса, список семинара и протокол соревнования печатают оба столбца, а преподаватель открывает занятие словами Liebe Teilnehmerinnen und Teilnehmer. Там, где даётся одна цифра, за всех по-прежнему отвечает мужское множественное (zwölf Teilnehmer), — потому частотность у слов далеко не одинакова. das Zertifikat уровня B1 из колоды `lernen-zukunft` — то, что она получит в конце.'
      uk: 'Жіноча пара до запису вище: -in на незайманій основі, у множині n подвоюється — die Teilnehmerinnen. Журнал курсу, список семінару і протокол змагання друкують обидва стовпці, а викладач відкриває заняття словами Liebe Teilnehmerinnen und Teilnehmer. Там, де дається одна цифра, за всіх і далі відповідає чоловіча множина (zwölf Teilnehmer), — тому частотність у слів далеко не однакова. das Zertifikat рівня B1 з колоди `lernen-zukunft` — те, що вона отримає наприкінці.'

  - de: Zuhörerin
    ipa: "ˈtsuːˌhøːʁəʁɪn"
    pos: noun
    gender: f
    plural: "die Zuhörerinnen"
    cards: recognition
    en: a woman who listens to what is being said or played, in a room or over the air
    ru: женщина, которая слушает то, что говорят или исполняют, — в зале или в эфире
    uk: жінка, яка слухає те, що говорять чи виконують, — у залі або в ефірі
    example_de: Eine Zuhörerin stellte nach dem Vortrag eine schwierige Frage.
    example_en: A listener asked a difficult question after the talk.
    example_ru: Одна из слушательниц задала после доклада трудный вопрос.
    example_uk: Одна зі слухачок поставила після доповіді складне запитання.
    note:
      en: 'This one ships without its masculine beside it: B1 der Zuhörer already lives in the deck `informationen-vermitteln`, and a headword belongs to exactly one file. It is built on A2 zuhören plus the dative (deck `dativ-verben`) — jemandem zuhören — so it names the person doing that, one at a time, while B1 das Publikum (deck `kultur-freizeit`) is all of them as one body. Beside it die Hörerin, in this wave''s deck `medien-digital-b1`, is specifically the listener a broadcast reaches.'
      ru: 'Эта запись идёт без мужской пары рядом: der Zuhörer уровня B1 уже живёт в колоде `informationen-vermitteln`, а заглавное слово принадлежит ровно одному файлу. Построено на zuhören уровня A2 с дательным (колода `dativ-verben`) — jemandem zuhören, — так что называет того, кто это делает, поштучно, тогда как das Publikum уровня B1 (колода `kultur-freizeit`) — все они как одно целое. Рядом die Hörerin из колоды `medien-digital-b1` этой же волны — именно та слушательница, до которой доходит эфир.'
      uk: 'Цей запис іде без чоловічої пари поряд: der Zuhörer рівня B1 уже живе в колоді `informationen-vermitteln`, а заголовне слово належить рівно одному файлові. Побудоване на zuhören рівня A2 з давальним (колода `dativ-verben`) — jemandem zuhören, — тож називає того, хто це робить, поштучно, тоді як das Publikum рівня B1 (колода `kultur-freizeit`) — усі вони як одне ціле. Поряд die Hörerin із колоди `medien-digital-b1` цієї ж хвилі — саме та слухачка, до якої доходить ефір.'

  - de: Referat
    ipa: "ʁefeˈʁaːt"
    pos: noun
    gender: n
    plural: "die Referate"
    cards: recognition
    en: a short prepared talk on a set topic, given to a class or a seminar group and marked as coursework
    ru: короткое подготовленное выступление на заданную тему перед классом или семинарской группой, идущее в оценку
    uk: короткий підготовлений виступ на задану тему перед класом чи семінарською групою, що йде в оцінку
    example_de: Nächste Woche halte ich ein Referat über erneuerbare Energien.
    example_en: Next week I am giving a presentation on renewable energy.
    example_ru: На следующей неделе я делаю доклад о возобновляемой энергии.
    example_uk: Наступного тижня я роблю доповідь про відновлювану енергію.
    note:
      en: 'The chunk is ein Referat halten, never machen, and the topic comes in with über plus the accusative. B1 der Vortrag, in the deck `informationen-vermitteln`, is a talk of any kind by anybody; a Referat is specifically assessed schoolwork or university work, often handed in as a written version too. A second, entirely separate sense is administrative: das Referat für Verkehr is a department inside an authority, headed by ein Referent. Neuter, plural in -e, stress on the last syllable.'
      ru: 'Устойчивый оборот — ein Referat halten, но никогда machen, а тема вводится через über с винительным. der Vortrag уровня B1 из колоды `informationen-vermitteln` — выступление любого рода и от кого угодно; Referat — именно учебная работа в школе или вузе, которую нередко сдают ещё и в письменном виде. Второе, совсем отдельное значение — административное: das Referat für Verkehr — отдел внутри ведомства, во главе с ein Referent. Средний род, множественное на -e, ударение на последнем слоге.'
      uk: 'Усталений зворот — ein Referat halten, але ніколи machen, а тема вводиться через über зі знахідним. der Vortrag рівня B1 з колоди `informationen-vermitteln` — виступ будь-якого роду і від кого завгодно; Referat — саме навчальна робота в школі чи виші, яку нерідко здають ще й у письмовому вигляді. Друге, зовсім окреме значення — адміністративне: das Referat für Verkehr — відділ усередині відомства, на чолі з ein Referent. Середній рід, множина на -e, наголос на останньому складі.'

  - de: Hilfsmittel
    ipa: "ˈhɪlfsˌmɪtl̩"
    pos: noun
    gender: n
    plural: "die Hilfsmittel"
    cards: recognition
    en: anything you are allowed to use as an aid while doing a task
    ru: всё, чем разрешено пользоваться как подспорьем при выполнении задания
    uk: усе, чим дозволено користуватися як підмогою під час виконання завдання
    example_de: In der Prüfung sind keine Hilfsmittel erlaubt.
    example_en: No aids are permitted in the exam.
    example_ru: На экзамене пользоваться вспомогательными средствами нельзя.
    example_uk: На іспиті користуватися допоміжними засобами не можна.
    note:
      en: 'An exam-instruction word: the line Erlaubte Hilfsmittel: Wörterbuch stands at the top of a paper, and its opposite is the sentence in the example. It is A1 die Hilfe joined to A2 das Mittel (deck `dinge-sachen-a2`) with the linking -s-, so it is literally a means of help. Neuter, and singular and plural are spelled alike. Outside the exam room the same word names a walking frame, a hearing aid or a wheelchair — medizinische Hilfsmittel, which a Krankenkasse pays for.'
      ru: 'Слово экзаменационной инструкции: строка Erlaubte Hilfsmittel: Wörterbuch стоит в шапке листа, а её противоположность — фраза из примера. Это die Hilfe уровня A1, соединённое с das Mittel уровня A2 (колода `dinge-sachen-a2`) через связку -s-, то есть буквально «средство помощи». Средний род, единственное и множественное пишутся одинаково. Вне экзамена то же слово называет ходунки, слуховой аппарат или коляску — medizinische Hilfsmittel, которые оплачивает Krankenkasse.'
      uk: 'Слово екзаменаційної інструкції: рядок Erlaubte Hilfsmittel: Wörterbuch стоїть у шапці аркуша, а його протилежність — фраза з прикладу. Це die Hilfe рівня A1, з’єднане з das Mittel рівня A2 (колода `dinge-sachen-a2`) через сполучне -s-, тобто буквально «засіб допомоги». Середній рід, однина і множина пишуться однаково. Поза іспитом те саме слово називає ходунки, слуховий апарат чи візок — medizinische Hilfsmittel, які оплачує Krankenkasse.'

  # --- Schule, Hochschule, Abschluss ---
  - de: Klassenarbeit
    ipa: "ˈklasn̩ˌʔaʁbaɪ̯t"
    pos: noun
    gender: f
    plural: "die Klassenarbeiten"
    cards: recognition
    en: a written test written by a whole school class during a lesson, whose mark counts for the report
    ru: письменная работа, которую весь класс пишет на уроке и оценка за которую идёт в табель
    uk: письмова робота, яку весь клас пише на уроці і оцінка за яку йде в табель
    example_de: Am Freitag schreiben wir eine Klassenarbeit in Mathe.
    example_en: On Friday we are writing a class test in maths.
    example_ru: В пятницу мы пишем контрольную по математике.
    example_uk: У п’ятницю ми пишемо контрольну з математики.
    note:
      en: 'A1 die Klasse plus A1 die Arbeit, with the linking -n-. The verb is schreiben, not machen: eine Klassenarbeit schreiben. It is strictly a school word — the university equivalent is die Klausur, a shorter school test is der Test, and A1 die Prüfung is the larger, formal examination at the end of something. The mark lands in A2 das Zeugnis (deck `schule-faecher-a2`). The stressed a of Arbeit begins with a small catch of the throat.'
      ru: 'die Klasse уровня A1 плюс die Arbeit уровня A1, со связкой -n-. Глагол здесь schreiben, а не machen: eine Klassenarbeit schreiben. Слово строго школьное — в вузе ему соответствует die Klausur, короткая проверочная называется der Test, а die Prüfung уровня A1 — крупный официальный экзамен в конце чего-либо. Оценка попадает в das Zeugnis уровня A2 (колода `schule-faecher-a2`). Ударное a в Arbeit начинается с лёгкого гортанного щелчка.'
      uk: 'die Klasse рівня A1 плюс die Arbeit рівня A1, зі сполучним -n-. Дієслово тут schreiben, а не machen: eine Klassenarbeit schreiben. Слово суто шкільне — у виші йому відповідає die Klausur, коротка перевірочна зветься der Test, а die Prüfung рівня A1 — великий офіційний іспит наприкінці чогось. Оцінка потрапляє до das Zeugnis рівня A2 (колода `schule-faecher-a2`). Наголошене a в Arbeit починається з легкого гортанного клацання.'

  - de: Mathe
    ipa: "ˈmatə"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the school subject of numbers and calculation, in the short everyday name pupils and timetables use
    ru: школьный предмет о числах и вычислениях — в коротком обиходном названии, каким пользуются ученики и расписание
    uk: шкільний предмет про числа й обчислення — у короткій побутовій назві, якою послуговуються учні й розклад
    example_de: In Mathe bin ich besser als in Chemie.
    example_en: I am better at maths than at chemistry.
    example_ru: По математике я успеваю лучше, чем по химии.
    example_uk: З математики я встигаю краще, ніж із хімії.
    note:
      en: 'A2 die Mathematik, in the deck `schule-faecher-a2`, is the full word and the one a university uses; in a school corridor and on a timetable it is always this short one. It keeps the gender of its long form but is almost always used bare, with no article: Ich habe heute Mathe, eine Fünf in Mathe. There is no plural. German clips other subjects the same way — Bio, Erdkunde, Sport, Reli — and the frame around them is A2 das Fach.'
      ru: 'die Mathematik уровня A2 из колоды `schule-faecher-a2` — полное слово, и его берёт университет; в школьном коридоре и в расписании стоит всегда это короткое. Род оно сохраняет от длинной формы, но почти всегда идёт голым, без артикля: Ich habe heute Mathe, eine Fünf in Mathe. Множественного числа нет. Немецкий так же укорачивает и другие предметы — Bio, Erdkunde, Sport, Reli, — а общая рамка для них — das Fach уровня A2.'
      uk: 'die Mathematik рівня A2 з колоди `schule-faecher-a2` — повне слово, і його бере університет; у шкільному коридорі та в розкладі стоїть завжди це коротке. Рід воно зберігає від довгої форми, але майже завжди йде голим, без артикля: Ich habe heute Mathe, eine Fünf in Mathe. Множини немає. Німецька так само вкорочує й інші предмети — Bio, Erdkunde, Sport, Reli, — а спільна рамка для них — das Fach рівня A2.'

  - de: Nachhilfe
    ipa: "ˈnaːxˌhɪlfə"
    pos: noun
    gender: f
    plural: "die Nachhilfen"
    cards: recognition
    en: extra paid teaching outside lessons, for a pupil who has fallen behind
    ru: дополнительные платные занятия вне уроков — для ученика, который отстал
    uk: додаткові платні заняття поза уроками — для учня, який відстав
    example_de: Seit einem Jahr bekommt er Nachhilfe in Englisch.
    example_en: He has been getting extra tuition in English for a year.
    example_ru: Уже год он занимается английским с репетитором.
    example_uk: Уже рік він займається англійською з репетитором.
    note:
      en: 'nach- plus A1 die Hilfe: help given afterwards, once the lesson has already failed to land. The chunks are Nachhilfe geben, Nachhilfe nehmen and Nachhilfe bekommen, always in the singular in practice, and the family runs der Nachhilfeunterricht, die Nachhilfelehrerin, die Nachhilfestunde. It is a large paid market in Germany, so a notice board in a school carries adverts for it. Do not read the nach- as the preposition of direction here; it means afterwards.'
      ru: 'nach- плюс die Hilfe уровня A1: помощь, приходящая уже потом, когда урок не сработал. Обороты — Nachhilfe geben, Nachhilfe nehmen и Nachhilfe bekommen, на практике всегда в единственном числе, а семейство даёт der Nachhilfeunterricht, die Nachhilfelehrerin, die Nachhilfestunde. В Германии это большой платный рынок, так что школьная доска объявлений увешана такими предложениями. Приставку nach- здесь не читайте как предлог направления: она значит «после».'
      uk: 'nach- плюс die Hilfe рівня A1: допомога, що приходить уже потому, коли урок не спрацював. Звороти — Nachhilfe geben, Nachhilfe nehmen і Nachhilfe bekommen, на практиці завжди в однині, а родина дає der Nachhilfeunterricht, die Nachhilfelehrerin, die Nachhilfestunde. У Німеччині це великий платний ринок, тож шкільна дошка оголошень завішана такими пропозиціями. Префікс nach- тут не читайте як прийменник напрямку: він означає «після».'

  - de: Mensa
    ipa: "ˈmɛnza"
    pos: noun
    gender: f
    plural: "die Mensen"
    cards: recognition
    en: the canteen of a university, where students eat a hot meal cheaply
    ru: университетская столовая, где студенты дёшево обедают
    uk: університетська їдальня, де студенти дешево обідають
    example_de: Um halb eins treffen wir uns in der Mensa.
    example_en: We are meeting in the university canteen at half past twelve.
    example_ru: В половине первого мы встречаемся в студенческой столовой.
    example_uk: О пів на першу ми зустрічаємося в студентській їдальні.
    note:
      en: 'From the Latin for a table, and the plural keeps a Latin shape: die Mensen. Which building it belongs to is the whole distinction — B1 die Kantine (deck `arbeit-beruf-b1`) feeds a firm''s staff, a Mensa feeds students, and a school has die Schulmensa. It is run by the Studierendenwerk, so the price is subsidised and the card that pays is der Studierendenausweis. Feminine, stress on the first syllable, and the s between the vowels is voiced.'
      ru: 'От латинского «стол», и множественное сохраняет латинскую форму: die Mensen. Всё различие в том, при каком здании она состоит: die Kantine уровня B1 (колода `arbeit-beruf-b1`) кормит сотрудников предприятия, Mensa кормит студентов, а при школе бывает die Schulmensa. Её содержит Studierendenwerk, поэтому цена дотируется, а платят по der Studierendenausweis. Женский род, ударение на первом слоге, s между гласными звонкое.'
      uk: 'Від латинського «стіл», і множина зберігає латинську форму: die Mensen. Уся відмінність у тому, при якій будівлі вона перебуває: die Kantine рівня B1 (колода `arbeit-beruf-b1`) годує працівників підприємства, Mensa годує студентів, а при школі буває die Schulmensa. Її утримує Studierendenwerk, тому ціна дотується, а платять за der Studierendenausweis. Жіночий рід, наголос на першому складі, s між голосними дзвінке.'

  - de: Modul
    ipa: "moˈduːl"
    pos: noun
    gender: n
    plural: "die Module"
    cards: recognition
    en: one self-contained part of a course or an examination, which can be taken and passed on its own
    ru: самостоятельная часть курса или экзамена, которую можно сдавать и сдать отдельно
    uk: самостійна частина курсу чи іспиту, яку можна складати і скласти окремо
    example_de: Das Modul Schreiben kann man einzeln wiederholen.
    example_en: The writing module can be retaken on its own.
    example_ru: Модуль «Письмо» можно пересдать отдельно.
    example_uk: Модуль «Письмо» можна перескласти окремо.
    note:
      en: 'The word every German degree is now built on: a Studiengang consists of Module, each with its own Prüfung and its own credit points, and das Modulhandbuch describes them. A language exam works the same way — the Goethe-Zertifikat B1 has the four Module Lesen, Hören, Schreiben and Sprechen, and each may be sat and repeated separately, which is exactly what this word is doing on the B1 list. Neuter, plural in -e, stress on the second syllable with a long u.'
      ru: 'На этом слове держится теперь всякое немецкое высшее образование: Studiengang складывается из Module, у каждого своя Prüfung и свои кредиты, а описывает их das Modulhandbuch. Языковой экзамен устроен так же: Goethe-Zertifikat B1 состоит из четырёх Module — Lesen, Hören, Schreiben, Sprechen, — и каждый можно сдавать и пересдавать по отдельности; ровно за этим слово и стоит в списке B1. Средний род, множественное на -e, ударение на втором слоге, u долгое.'
      uk: 'На цьому слові тримається тепер уся німецька вища освіта: Studiengang складається з Module, у кожного своя Prüfung і свої кредити, а описує їх das Modulhandbuch. Мовний іспит влаштований так само: Goethe-Zertifikat B1 складається з чотирьох Module — Lesen, Hören, Schreiben, Sprechen, — і кожен можна складати й перескладати окремо; саме за цим слово й стоїть у списку B1. Середній рід, множина на -e, наголос на другому складі, u довге.'

  - de: Semester
    ipa: "zeˈmɛstɐ"
    pos: noun
    gender: n
    plural: "die Semester"
    cards: recognition
    en: one of the two halves a university year is divided into
    ru: одна из двух половин, на которые делится учебный год в вузе
    uk: одна з двох половин, на які поділяється навчальний рік у виші
    example_de: Sie ist im dritten Semester und studiert Biologie.
    example_en: She is in her third semester and studies biology.
    example_ru: Она на третьем семестре и изучает биологию.
    example_uk: Вона на третьому семестрі і вивчає біологію.
    note:
      en: 'The two are das Wintersemester, which runs from October to March, and das Sommersemester, from April to September — so the German university year begins in autumn, not in September as school does. Saying im wievielten Semester somebody is answers how far along they are, not how old they are. Neuter, singular and plural spelled alike. Die Semesterferien are the weeks between, when written work is usually due. A school divides its year into Halbjahre instead.'
      ru: 'Их два: das Wintersemester с октября по март и das Sommersemester с апреля по сентябрь, — то есть немецкий вузовский год начинается осенью, а не первого сентября, как школьный. Фраза о том, im wievielten Semester человек находится, отвечает не на вопрос о возрасте, а на вопрос, далеко ли он продвинулся. Средний род, единственное и множественное пишутся одинаково. Die Semesterferien — недели между ними, когда обычно и сдают письменные работы. Школа делит год не на Semester, а на Halbjahre.'
      uk: 'Їх два: das Wintersemester з жовтня по березень і das Sommersemester з квітня по вересень, — тобто німецький вишівський рік починається восени, а не першого вересня, як шкільний. Фраза про те, im wievielten Semester людина перебуває, відповідає не на питання про вік, а на питання, чи далеко вона просунулася. Середній рід, однина і множина пишуться однаково. Die Semesterferien — тижні між ними, коли зазвичай і здають письмові роботи. Школа ділить рік не на Semester, а на Halbjahre.'

  - de: Seminar
    ipa: "zemiˈnaːɐ̯"
    pos: noun
    gender: n
    plural: "die Seminare"
    cards: recognition
    en: a small university class in which the students discuss and present, rather than sit and listen
    ru: небольшое вузовское занятие, где студенты обсуждают и выступают, а не сидят и слушают
    uk: невелике вишівське заняття, де студенти обговорюють і виступають, а не сидять і слухають
    example_de: Im Seminar müssen alle einmal ein Referat halten.
    example_en: In the seminar everybody has to give a presentation once.
    example_ru: На семинаре каждый должен один раз сделать доклад.
    example_uk: На семінарі кожен має один раз зробити доповідь.
    note:
      en: 'Its opposite inside the university is die Vorlesung, where one person talks and several hundred write; a Seminar is small, expects a Referat from everybody and usually ends in eine Seminararbeit. Outside the university the word has a second, quite ordinary life: a one-day or two-day training course for people at work — ein Seminar besuchen, das Wochenendseminar — which is how a Volkshochschule uses it. Neuter, plural in -e, stress on the last syllable, whose -ar is a long a plus the vocalised r.'
      ru: 'Его противоположность внутри вуза — die Vorlesung, где говорит один, а пишут несколько сотен; Seminar маленький, требует Referat от каждого и обычно заканчивается работой eine Seminararbeit. Вне вуза у слова есть и вторая, вполне бытовая жизнь: однодневные или двухдневные курсы для работающих — ein Seminar besuchen, das Wochenendseminar, — именно так его употребляет Volkshochschule. Средний род, множественное на -e, ударение на последнем слоге, где -ar — долгое a плюс вокализованное r.'
      uk: 'Його протилежність усередині вишу — die Vorlesung, де говорить один, а пишуть кілька сотень; Seminar малий, вимагає Referat від кожного і зазвичай завершується роботою eine Seminararbeit. Поза вишем у слова є й друге, цілком побутове життя: одноденні чи дводенні курси для працівних — ein Seminar besuchen, das Wochenendseminar, — саме так його вживає Volkshochschule. Середній рід, множина на -e, наголос на останньому складі, де -ar — довге a плюс вокалізоване r.'

  - de: Diplom
    ipa: "diˈploːm"
    pos: noun
    gender: n
    plural: "die Diplome"
    cards: recognition
    en: the document awarded for a completed course of higher study, and the degree it names
    ru: документ о завершённом высшем образовании и сама степень, которую он называет
    uk: документ про завершену вищу освіту і сам ступінь, який він називає
    example_de: Nach fünf Jahren hat er sein Diplom in der Hand.
    example_en: After five years he has his degree in his hand.
    example_ru: Через пять лет он держит диплом в руках.
    example_uk: Через п’ять років він тримає диплом у руках.
    note:
      en: 'Until the Bologna reform this was the standard German university degree, and the holder wrote it in front of the name: Dipl.-Ing., Dipl.-Kfm. Bachelor and Master have replaced it almost everywhere, so a text using it is either older or is talking about an engineer of a certain generation. Keep three documents apart: B1 das Zertifikat (deck `lernen-zukunft`) is what a language exam gives, A2 das Zeugnis (deck `schule-faecher-a2`) is the school report, and this one closes a degree. Neuter, plural in -e, stress on the last syllable.'
      ru: 'До Болонской реформы это была стандартная немецкая вузовская степень, и обладатель ставил её перед именем: Dipl.-Ing., Dipl.-Kfm. Bachelor и Master вытеснили её почти повсюду, так что текст с этим словом либо старый, либо говорит об инженере определённого поколения. Различайте три документа: das Zertifikat уровня B1 (колода `lernen-zukunft`) даёт языковой экзамен, das Zeugnis уровня A2 (колода `schule-faecher-a2`) — школьный табель, а это закрывает высшее образование. Средний род, множественное на -e, ударение на последнем слоге.'
      uk: 'До Болонської реформи це був стандартний німецький вишівський ступінь, і власник ставив його перед іменем: Dipl.-Ing., Dipl.-Kfm. Bachelor і Master витіснили його майже всюди, тож текст із цим словом або давній, або говорить про інженера певного покоління. Розрізняйте три документи: das Zertifikat рівня B1 (колода `lernen-zukunft`) дає мовний іспит, das Zeugnis рівня A2 (колода `schule-faecher-a2`) — шкільний табель, а це закриває вищу освіту. Середній рід, множина на -e, наголос на останньому складі.'

  # --- Der Sonnabend im Norden und Osten ---
  - de: Sonnabend
    ipa: "ˈzɔnˌʔaːbn̩t"
    pos: noun
    gender: m
    plural: "die Sonnabende"
    cards: recognition
    en: Saturday, under the name used in the north and east of the German-speaking area
    ru: суббота — под тем названием, каким её зовут на севере и востоке немецкоязычного пространства
    uk: субота — під тією назвою, якою її звуть на півночі та сході німецькомовного простору
    example_de: Der Markt findet jeden Sonnabend auf dem Rathausplatz statt.
    example_en: The market takes place every Saturday on the town hall square.
    example_ru: Рынок бывает каждую субботу на площади у ратуши.
    example_uk: Ринок буває щосуботи на площі біля ратуші.
    note:
      en: 'That is the whole point of the entry: it is the same day as A1 der Samstag (deck `alltag-zeit`), not a different one and not a dialect form. Samstag is the standard and southern name; Sonnabend is northern and eastern — Hamburg, Bremen, Berlin, Brandenburg, Saxony — and it is what Deutsche Bahn timetables, regional radio and northern newspapers print, so a learner meets it in writing long before hearing it. Both are correct in written German. The phrase is am Sonnabend, and the stressed a of -abend begins with a catch of the throat.'
      ru: 'В этом весь смысл записи: это тот же самый день, что и der Samstag уровня A1 (колода `alltag-zeit`), а не другой и не диалектная форма. Samstag — литературное и южное название; Sonnabend — северное и восточное: Гамбург, Бремен, Берлин, Бранденбург, Саксония, — и именно его печатают расписания Deutsche Bahn, региональное радио и северные газеты, так что учащийся встретит его на письме задолго до того, как услышит. Оба варианта литературны. Оборот — am Sonnabend, а ударное a в -abend начинается с гортанного щелчка.'
      uk: 'У цьому весь сенс запису: це той самий день, що й der Samstag рівня A1 (колода `alltag-zeit`), а не інший і не діалектна форма. Samstag — літературна й південна назва; Sonnabend — північна і східна: Гамбург, Бремен, Берлін, Бранденбург, Саксонія, — і саме його друкують розклади Deutsche Bahn, регіональне радіо та північні газети, тож учень зустріне його на письмі задовго до того, як почує. Обидва варіанти літературні. Зворот — am Sonnabend, а наголошене a в -abend починається з гортанного клацання.'

  - de: sonnabends
    ipa: "ˈzɔnˌʔaːbn̩ts"
    pos: adv
    cards: recognition
    en: on Saturdays, every Saturday — in the northern and eastern name for the day
    en_compact: "on Saturdays, every Saturday"
    ru: по субботам, каждую субботу — в северном и восточном названии этого дня
    uk: щосуботи, кожної суботи — у північній та східній назві цього дня
    example_de: Die Bäckerei hat sonnabends nur bis zwölf geöffnet.
    example_en: The bakery is only open until twelve on Saturdays.
    example_ru: По субботам булочная открыта только до двенадцати.
    example_uk: Щосуботи пекарня відчинена лише до дванадцятої.
    note:
      en: 'A2 samstags, in the deck `zeitadverbien-a2`, is the same adverb built from the other name for the day, and the two are interchangeable. The -s ending turns any weekday into a habit — montags, dienstags, mittwochs — and two things about it are worth fixing: it is written with a small letter, because it is an adverb and not a noun, and the -s is not a plural. Shop doors and course timetables are where it is read: sonnabends geschlossen.'
      ru: 'samstags уровня A2 из колоды `zeitadverbien-a2` — то же наречие, но от другого названия дня, и они взаимозаменимы. Окончание -s превращает любой день недели в привычку — montags, dienstags, mittwochs, — и запомнить о нём стоит две вещи: пишется с маленькой буквы, потому что это наречие, а не существительное, и -s здесь не множественное число. Читают его на дверях магазинов и в расписаниях курсов: sonnabends geschlossen.'
      uk: 'samstags рівня A2 з колоди `zeitadverbien-a2` — той самий прислівник, але від іншої назви дня, і вони взаємозамінні. Закінчення -s перетворює будь-який день тижня на звичку — montags, dienstags, mittwochs, — і запам’ятати про нього варто дві речі: пишеться з малої літери, бо це прислівник, а не іменник, і -s тут не множина. Читають його на дверях крамниць і в розкладах курсів: sonnabends geschlossen.'
