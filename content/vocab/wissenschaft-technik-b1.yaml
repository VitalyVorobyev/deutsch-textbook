    ru: предприятие, превращающее иной вид энергии в электричество для целого края
    uk: підприємство, що перетворює інший вид енергії на електрику для цілого краю
    example_de: Das Kraftwerk am Fluss macht Strom aus Wasser.
    example_en: The power station on the river makes electricity from water.
    example_ru: Электростанция у реки делает электричество из воды.
    example_uk: Електростанція біля річки робить електрику з води.
    note:
      en: 'B1 die Kraft in the deck `koerper-medizin-b1` plus B1 das Werk in the deck `wirtschaft-handel-b1`, and the compound always names its fuel: das Kohlekraftwerk, das Wasserkraftwerk, das Windkraftwerk, and das Atomkraftwerk or das Kernkraftwerk, shortened in headlines to AKW. Germany shut its last three nuclear ones in April 2023, so a current news item uses the word mostly about the others. What comes out is A1 der Strom in the deck `haushalt-geraete`; what goes in is B1 die Energie in the deck `konsum-umwelt`.'
      ru: 'die Kraft уровня B1 из колоды `koerper-medizin-b1` плюс das Werk уровня B1 из колоды `wirtschaft-handel-b1`, и сложное слово всегда называет топливо: das Kohlekraftwerk, das Wasserkraftwerk, das Windkraftwerk, а также das Atomkraftwerk или das Kernkraftwerk, в заголовках сокращаемое до AKW. Последние три атомные Германия остановила в апреле 2023 года, так что нынешняя новость употребляет слово больше о прочих. На выходе — der Strom уровня A1 из колоды `haushalt-geraete`; на входе — die Energie уровня B1 из колоды `konsum-umwelt`.'
      uk: 'die Kraft рівня B1 з колоди `koerper-medizin-b1` плюс das Werk рівня B1 з колоди `wirtschaft-handel-b1`, і складне слово завжди називає паливо: das Kohlekraftwerk, das Wasserkraftwerk, das Windkraftwerk, а також das Atomkraftwerk або das Kernkraftwerk, у заголовках скорочуване до AKW. Останні три атомні Німеччина зупинила у квітні 2023 року, тож теперішня новина вживає слово більше про інші. На виході — der Strom рівня A1 з колоди `haushalt-geraete`; на вході — die Energie рівня B1 з колоди `konsum-umwelt`.'

  - de: Abgase
    ipa: "ˈapˌgaːzə"
    pos: phrase
    cards: recognition
    en: the burnt gases an engine or a chimney sends out into the air
    ru: отработанные газы, которые двигатель или труба выбрасывают в воздух
    uk: відпрацьовані гази, які двигун або димар викидають у повітря
    example_de: Die Abgase der Autos sind schlecht für die Luft.
    example_en: The exhaust fumes from the cars are bad for the air.
    example_ru: Выхлопные газы машин вредны для воздуха.
    example_uk: Вихлопні гази машин шкідливі для повітря.
    note:
      en: 'The word the learner meets is the plural, and it takes a plural verb and a plural article throughout, like B1 die Zinsen in the deck `einkaufen-geld-b1`. A singular das Abgas does exist, but only in technical writing about one measured gas. It is built from ab-, away, and B1 das Gas in the deck `haushalt-notfall-b1`. Every German car is tested for them: die Abgasuntersuchung, done since 2010 as part of the Hauptuntersuchung behind the TÜV sticker, and der Abgasskandal named the affair in which the figures were falsified.'
      ru: 'Слово, с которым встречается учащийся, — множественное, и множественными идут при нём и глагол, и артикль, как у die Zinsen уровня B1 из колоды `einkaufen-geld-b1`. Единственное das Abgas существует, но лишь в технических текстах об одном измеряемом газе. Составлено из ab- — «прочь» — и das Gas уровня B1 из колоды `haushalt-notfall-b1`. Каждую немецкую машину на них проверяют: die Abgasuntersuchung — с 2010 года часть Hauptuntersuchung, за которой стоит наклейка TÜV, — а der Abgasskandal назвал ту историю, в которой цифры подделали.'
      uk: 'Слово, з яким зустрічається учень, — множинне, і множинними йдуть при ньому і дієслово, і артикль, як у die Zinsen рівня B1 з колоди `einkaufen-geld-b1`. Однина das Abgas існує, але лише в технічних текстах про один вимірюваний газ. Складене з ab- — «геть» — і das Gas рівня B1 з колоди `haushalt-notfall-b1`. Кожну німецьку машину на них перевіряють: die Abgasuntersuchung — від 2010 року частина Hauptuntersuchung, за якою стоїть наліпка TÜV, — а der Abgasskandal назвав ту історію, у якій цифри підробили.'

