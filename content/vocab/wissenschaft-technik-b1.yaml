# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the science-and-
# technology field of data/goethe-b1-wortliste.txt: what a German text calls
# knowledge and the trade of producing it, the words for how a question is worked
# on, and the machine on the other side of the plug. This is the German of a
# newspaper's science page and of the third item on the evening news.
# A1's `schule-arbeit` owns die Universität and das Studium, A2's `schule-faecher-a2`
# owns the school subjects (Physik, Chemie, Biologie, Mathematik), A2's
# `arbeit-ausbildung-a2` owns die Kenntnisse and das Projekt, B1's `digitales-leben`
# owns die Technik, B1's `konsum-umwelt` owns die Umwelt, die Energie and
# verbrauchen, B1's `abstrakte-begriffe-b1` owns die Entwicklung, and B1's
# `verben-handlungen-b1-2` owns the pair erfinden and entdecken. This deck is the
# layer above them: the nouns those seven leave the reader to guess at.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field
# is read off an article, a museum caption and an exam text; the learner who has to
# *say* something about a machine or a study reaches for the A1 or A2 word beside
# it, and that word already ships as a typed card.
id: wissenschaft-technik-b1
title_de: "Wissenschaft und Technik"
title_en: "Science and technology"
title_ru: "Наука и техника"
title_uk: "Наука і техніка"
level: B1
entries:
  # --- Was Wissenschaft ist ---
  - de: Wissen
    ipa: "ˈvɪsn̩"
    pos: noun
    gender: n
    plural: "—"
    cards: recognition
    en: everything a person or a society knows, taken as one uncountable mass
    ru: всё, что человек или общество знает, взятое как одна неисчисляемая масса
    uk: усе, що людина чи суспільство знає, узяте як одна незлічувана маса
    example_de: Für diese Arbeit braucht man viel Wissen über Computer.
    example_en: This job needs a lot of knowledge about computers.
    example_ru: Для этой работы нужно много знаний о компьютерах.
    example_uk: Для цієї роботи потрібно багато знань про комп’ютери.
    note:
      en: 'The A1 verb wissen in the deck `goethe-a1-kernwortschatz` turned into a noun with a capital letter, and like most such nouns it has no plural at all. A2 die Kenntnisse in the deck `arbeit-ausbildung-a2` is the countable neighbour and the one a CV wants — Kenntnisse in Excel — while this word is the mass behind them. Chunks: Wissen sammeln, sein Wissen weitergeben, and the old genitive meines Wissens, meaning as far as I know. Compounds: das Fachwissen, das Allgemeinwissen, der Wissensdurst.'
      ru: 'Глагол wissen уровня A1 из колоды `goethe-a1-kernwortschatz`, ставший существительным с заглавной буквы, и, как у большинства таких слов, множественного числа у него нет вовсе. die Kenntnisse уровня A2 из колоды `arbeit-ausbildung-a2` — исчисляемый сосед, и именно его хочет резюме: Kenntnisse in Excel, — а это слово называет массу, которая за ними стоит. Обороты: Wissen sammeln, sein Wissen weitergeben, — и старый родительный meines Wissens со значением «насколько мне известно». Сложные слова: das Fachwissen, das Allgemeinwissen, der Wissensdurst.'
      uk: 'Дієслово wissen рівня A1 з колоди `goethe-a1-kernwortschatz`, що стало іменником з великої літери, і, як у більшості таких слів, множини воно не має зовсім. die Kenntnisse рівня A2 з колоди `arbeit-ausbildung-a2` — злічуваний сусід, і саме його хоче резюме: Kenntnisse in Excel, — а це слово називає масу, яка за ними стоїть. Звороти: Wissen sammeln, sein Wissen weitergeben, — і давній родовий meines Wissens зі значенням «наскільки мені відомо». Складні слова: das Fachwissen, das Allgemeinwissen, der Wissensdurst.'

  - de: Wissenschaft
    ipa: "ˈvɪsn̩ˌʃaft"
    pos: noun
    gender: f
    plural: "die Wissenschaften"
    cards: recognition
    en: the organised work of finding out how things are, and any single field that does it
    ru: организованная работа по выяснению того, как всё устроено, и всякая отдельная область, которая ею занята
    uk: організована робота з’ясовування того, як усе влаштоване, і будь-яка окрема галузь, що нею зайнята
    example_de: Die Wissenschaft hat darauf noch keine Antwort.
    example_en: Science does not yet have an answer to that.
    example_ru: У науки пока нет на это ответа.
    example_uk: У науки поки немає на це відповіді.
    note:
      en: 'Wissen above plus the ending -schaft, which makes a whole out of a single thing and is feminine every time. The scope is wider than an English reader expects: German counts history, languages and law in as well, so the plural divides into die Naturwissenschaften, die Geisteswissenschaften and die Sozialwissenschaften, and only the first of those is what English usually means by science. Chunks: in der Wissenschaft arbeiten, Wissenschaft und Forschung, wissenschaftlich arbeiten.'
      ru: 'Wissen выше плюс окончание -schaft, которое делает из отдельной вещи целое и всякий раз даёт женский род. Охват здесь шире, чем ждёт английский читатель: немецкий засчитывает и историю, и языки, и право, поэтому множественное делится на die Naturwissenschaften, die Geisteswissenschaften и die Sozialwissenschaften, и только первое из трёх покрывает то, что по-английски обычно зовут science. Обороты: in der Wissenschaft arbeiten, Wissenschaft und Forschung, wissenschaftlich arbeiten.'
      uk: 'Wissen вище плюс закінчення -schaft, яке робить з окремої речі ціле і щоразу дає жіночий рід. Обшир тут ширший, ніж чекає англійський читач: німецька зараховує й історію, і мови, і право, тому множина ділиться на die Naturwissenschaften, die Geisteswissenschaften і die Sozialwissenschaften, і лише перше з трьох покриває те, що англійською зазвичай звуть science. Звороти: in der Wissenschaft arbeiten, Wissenschaft und Forschung, wissenschaftlich arbeiten.'

  - de: Wissenschaftler
    ipa: "ˈvɪsn̩ˌʃaftlɐ"
    pos: noun
    gender: m
    plural: "die Wissenschaftler"
    cards: recognition
    en: a man who works in research as his profession
    ru: мужчина, для которого научная работа — профессия
    uk: чоловік, для якого наукова праця — фах
    example_de: Der Wissenschaftler stellte seine Ergebnisse vor.
    example_en: The scientist presented his results.
    example_ru: Учёный представил свои результаты.
    example_uk: Науковець представив свої результати.
    note:
      en: 'Singular and plural are spelled alike, and the feminine is die Wissenschaftlerin, the next entry. Beside it der Forscher points at the activity rather than at the post, so a text can call the same person both in two sentences; der Gelehrte belongs to an older register and is rarely used of a living colleague. Austrian standard German drops the -l- and writes der Wissenschafter, die Wissenschafterin, which is worth recognising in a Vienna newspaper.'
      ru: 'Единственное и множественное пишутся одинаково, женская пара — die Wissenschaftlerin, следующая запись. Рядом der Forscher указывает на занятие, а не на должность, так что текст может назвать одного и того же человека и так и так через предложение; der Gelehrte принадлежит более старому регистру и о живом коллеге употребляется редко. Австрийский литературный стандарт роняет -l- и пишет der Wissenschafter, die Wissenschafterin, — это стоит узнавать в венской газете.'
      uk: 'Однина і множина пишуться однаково, жіноча пара — die Wissenschaftlerin, наступний запис. Поряд der Forscher указує на заняття, а не на посаду, тож текст може назвати ту саму людину і так і так через речення; der Gelehrte належить до давнішого регістру і про живого колегу вживається рідко. Австрійський літературний стандарт губить -l- і пише der Wissenschafter, die Wissenschafterin, — це варто впізнавати у віденській газеті.'

  - de: Wissenschaftlerin
    ipa: "ˈvɪsn̩ˌʃaftləʁɪn"
    pos: noun
    gender: f
    plural: "die Wissenschaftlerinnen"
    cards: recognition
    en: a woman who works in research as her profession
    ru: женщина, для которой научная работа — профессия
    uk: жінка, для якої наукова праця — фах
    example_de: Eine junge Wissenschaftlerin leitet das Projekt.
    example_en: A young scientist is leading the project.
    example_ru: Проектом руководит молодая учёная.
    example_uk: Проєктом керує молода науковиця.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n, and the stress does not move: it stays on Wissen-, where the compound put it. When a text has to name a mixed group it either uses the masculine plural die Wissenschaftler, or writes Wissenschaftlerinnen und Wissenschaftler in full, or prints one of the short forms Wissenschaftler:innen and Wissenschaftler*innen — all three are ordinary in German newspapers today.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается, и ударение не переезжает: оно остаётся на Wissen-, куда его поставило сложное слово. Когда тексту надо назвать смешанную группу, он либо берёт мужское множественное die Wissenschaftler, либо пишет полностью Wissenschaftlerinnen und Wissenschaftler, либо печатает одну из коротких форм — Wissenschaftler:innen или Wissenschaftler*innen; все три сегодня обычны в немецких газетах.'
      uk: 'Звичайна моція на -in, у множині n подвоюється, і наголос не переїжджає: він лишається на Wissen-, куди його поставило складне слово. Коли текстові треба назвати мішану групу, він або бере чоловічу множину die Wissenschaftler, або пише повністю Wissenschaftlerinnen und Wissenschaftler, або друкує одну з коротких форм — Wissenschaftler:innen чи Wissenschaftler*innen; усі три сьогодні звичні в німецьких газетах.'

  - de: Professor
    ipa: "pʁoˈfɛsoːɐ̯"
    pos: noun
    gender: m
    plural: "die Professoren"
    cards: recognition
    en: a man holding the highest teaching post at a university or another institution of higher education
    ru: мужчина, занимающий высшую преподавательскую должность в университете или ином высшем учебном заведении
    uk: чоловік, який обіймає найвищу викладацьку посаду в університеті чи іншому виші
    example_de: Der Professor beantwortet nach dem Seminar noch Fragen.
    example_en: The professor answers questions after the seminar.
    example_ru: После семинара профессор ещё отвечает на вопросы.
    example_uk: Після семінару професор ще відповідає на запитання.
    note:
      en: 'The stress moves as soon as anything is added: der Proféssor in the singular, but die Professóren in the plural and die Professórin in the feminine — the same shift as B1 der Moderator in the deck `meinung-medien` and die Moderatorin in the deck `medien-digital-b1`. The genitive singular is des Professors, with -s, and only the plural takes -en. In Germany the title belongs to a Hochschule and never to a school; in Austria it is also the traditional address for a teacher at a Gymnasium, so the same word describes two very different jobs across the border. Written short as Prof., usually beside Dr.'
      ru: 'Ударение переезжает, едва к слову что-нибудь прибавят: der Proféssor в единственном, но die Professóren во множественном и die Professórin в женском роде — тот же сдвиг, что у der Moderator уровня B1 из колоды `meinung-medien` и die Moderatorin уровня B1 из колоды `medien-digital-b1`. Родительный единственного — des Professors, с -s, и только множественное берёт -en. В Германии звание принадлежит вузу и никогда не школе; в Австрии же так по традиции обращаются и к учителю гимназии, так что за границей одно слово описывает две совсем разные работы. Сокращение — Prof., обычно рядом с Dr.'
      uk: 'Наголос переїжджає, щойно до слова щось додадуть: der Proféssor в однині, але die Professóren у множині і die Professórin у жіночому роді — той самий зсув, що в der Moderator рівня B1 з колоди `meinung-medien` і die Moderatorin рівня B1 з колоди `medien-digital-b1`. Родовий однини — des Professors, з -s, і лише множина бере -en. У Німеччині звання належить вишу і ніколи не школі; в Австрії ж так за традицією звертаються і до вчителя гімназії, тож за кордоном одне слово описує дві зовсім різні роботи. Скорочення — Prof., зазвичай поряд із Dr.'

  - de: Professorin
    ipa: "pʁofɛˈsoːʁɪn"
    pos: noun
    gender: f
    plural: "die Professorinnen"
    cards: recognition
    en: a woman holding the highest teaching post at a university or another institution of higher education
    ru: женщина, занимающая высшую преподавательскую должность в университете или ином высшем учебном заведении
    uk: жінка, яка обіймає найвищу викладацьку посаду в університеті чи іншому виші
    example_de: Die Professorin hat ein neues Buch geschrieben.
    example_en: The professor has written a new book.
    example_ru: Профессор написала новую книгу.
    example_uk: Професорка написала нову книжку.
    note:
      en: 'Movierung with -in, plural with a doubled n, and the transcription above shows what the ending does to the word: the stress lands on -so-, one syllable further right than in the masculine. In direct address a German says Frau Professorin, or simply Frau Professor, which is still heard and not wrong. The post itself is die Professur, and the older word for the same chair is der Lehrstuhl — the reason a job advert says einen Lehrstuhl innehaben.'
      ru: 'Мовирование на -in, во множественном n удваивается, а транскрипция выше показывает, что делает со словом окончание: ударение падает на -so-, на слог правее, чем в мужской форме. В обращении говорят Frau Professorin или просто Frau Professor — так тоже говорят, и это не ошибка. Сама должность — die Professur, а старое название той же кафедры — der Lehrstuhl, откуда и оборот объявлений einen Lehrstuhl innehaben.'
      uk: 'Моція на -in, у множині n подвоюється, а транскрипція вище показує, що робить зі словом закінчення: наголос падає на -so-, на склад правіше, ніж у чоловічій формі. У звертанні кажуть Frau Professorin або просто Frau Professor — так теж кажуть, і це не помилка. Сама посада — die Professur, а давня назва тієї ж кафедри — der Lehrstuhl, звідки й зворот оголошень einen Lehrstuhl innehaben.'

  - de: Institut
    ipa: "ɪnstiˈtuːt"
    pos: noun
    gender: n
    plural: "die Institute"
    cards: recognition
    en: a body set up to do research or teaching in one named field
    ru: учреждение, созданное для исследований или преподавания в одной названной области
    uk: заклад, створений для досліджень або викладання в одній названій царині
    example_de: Sie arbeitet in einem Institut für Sprachen.
    example_en: She works at an institute for languages.
    example_ru: Она работает в институте языков.
    example_uk: Вона працює в інституті мов.
    note:
      en: 'Neuter, plural in -e, and the stress falls on the last syllable. It is used two ways: as a department inside a Hochschule, das Institut für Physik, and as a free-standing research body of its own, das Max-Planck-Institut, das Robert-Koch-Institut. A third use is purely administrative and has nothing to do with research — das Kreditinstitut is the legal word for a bank. What names the field is für plus the accusative, exactly as in the example.'
      ru: 'Средний род, множественное на -e, ударение на последнем слоге. Употребляется двояко: как подразделение внутри вуза — das Institut für Physik — и как самостоятельное исследовательское учреждение: das Max-Planck-Institut, das Robert-Koch-Institut. Третье употребление чисто административное и к науке отношения не имеет: das Kreditinstitut — юридическое слово для банка. Область называет für с винительным, ровно как в примере.'
      uk: 'Середній рід, множина на -e, наголос на останньому складі. Уживається двояко: як підрозділ усередині вишу — das Institut für Physik — і як самостійна дослідницька установа: das Max-Planck-Institut, das Robert-Koch-Institut. Третій ужиток суто адміністративний і до науки стосунку не має: das Kreditinstitut — юридичне слово для банку. Царину називає für зі знахідним, точно як у прикладі.'

  - de: Philosophie
    ipa: "filozoˈfiː"
    pos: noun
    gender: f
    plural: "die Philosophien"
    cards: recognition
    en: the study of the most general questions about knowledge and how to live; also the set of ideas an organisation says it works by
    ru: наука о самых общих вопросах познания и жизни; а также свод взглядов, которым, по собственным словам, руководствуется организация
    uk: наука про найзагальніші питання пізнання і життя; а також звід поглядів, якими, за власними словами, керується організація
    example_de: An dieser Schule kann man Philosophie statt Religion wählen.
    example_en: At this school you may take philosophy instead of religious education.
    example_ru: В этой школе можно выбрать философию вместо религии.
    example_uk: У цій школі можна обрати філософію замість релігії.
    note:
      en: 'Feminine, like every noun in -ie, stressed on that last syllable, and the plural -n is then read as a syllable of its own. It is a school subject as well as a university one: several Bundesländer offer it, or a subject called Ethik, as the alternative to A2 die Religion in the deck `schule-faecher-a2`. The everyday second sense is common in company language — die Philosophie unserer Firma. The person is der Philosoph, a weak masculine, so des Philosophen, den Philosophen.'
      ru: 'Женский род, как всякое слово на -ie, ударение на последнем слоге, а множественное -n читается тогда отдельным слогом. Это предмет не только университетский, но и школьный: несколько земель предлагают его — или предмет под названием Ethik — как альтернативу die Religion уровня A2 из колоды `schule-faecher-a2`. Второе, обиходное значение обычно в языке фирм: die Philosophie unserer Firma. Человек — der Philosoph, слабое существительное мужского рода: des Philosophen, den Philosophen.'
      uk: 'Жіночий рід, як усяке слово на -ie, наголос на останньому складі, а множинне -n читається тоді окремим складом. Це предмет не лише університетський, а й шкільний: кілька земель пропонують його — або предмет під назвою Ethik — як альтернативу die Religion рівня A2 з колоди `schule-faecher-a2`. Друге, побутове значення звичне в мові фірм: die Philosophie unserer Firma. Людина — der Philosoph, слабкий іменник чоловічого роду: des Philosophen, den Philosophen.'

  # --- Wie geforscht wird ---
  - de: Forschung
    ipa: "ˈfɔʁʃʊŋ"
    pos: noun
    gender: f
    plural: "die Forschungen"
    cards: recognition
    en: the systematic work of looking for answers that nobody has yet
    ru: планомерная работа по поиску ответов, которых ещё ни у кого нет
    uk: планомірна робота з пошуку відповідей, яких ще ні в кого немає
    example_de: Die Firma gibt viel Geld für Forschung aus.
    example_en: The company spends a lot of money on research.
    example_ru: Фирма тратит много денег на исследования.
    example_uk: Фірма витрачає багато грошей на дослідження.
    note:
      en: 'From forschen, feminine like every noun in -ung, and normally singular even where another language would count. Two halves of the field have names: die Grundlagenforschung asks a question for its own sake, die angewandte Forschung asks it for a product. The standing pair Forschung und Entwicklung, with B1 die Entwicklung in the deck `abstrakte-begriffe-b1`, is the department every large firm has. Compounds: das Forschungsprojekt, die Forschungsergebnisse, das Forschungsinstitut.'
      ru: 'От forschen, женского рода, как всякое слово на -ung, и обычно в единственном числе даже там, где другой язык считал бы. У двух половин этой области есть имена: die Grundlagenforschung задаёт вопрос ради самого вопроса, die angewandte Forschung — ради изделия. Устойчивая пара Forschung und Entwicklung, с die Entwicklung уровня B1 из колоды `abstrakte-begriffe-b1`, — отдел, который есть в каждой крупной фирме. Сложные слова: das Forschungsprojekt, die Forschungsergebnisse, das Forschungsinstitut.'
