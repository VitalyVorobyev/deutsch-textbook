      ru: 'Женский род, ударение на последнем слоге, множественное на -n читается отдельным слогом. Устойчивое противопоставление — Theorie und Praxis; карточка die Praxis уровня A2 из колоды `termine-zeit` учит другому значению того же существительного, врачебной приёмной, а слово одно и то же. Учащийся встречает это слово впервые там, где науки нет вовсе: немецкое обучение вождению делится на die Theorie и die Praxis, а письменный экзамен перед Führerschein — die theoretische Prüfung. Вольное значение — Ich habe da eine Theorie — разговорное и никакой науки за собой не тянет.'
