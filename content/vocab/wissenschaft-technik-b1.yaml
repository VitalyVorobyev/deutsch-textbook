      uk: 'Технічне слово з інструкцій, у звичайному мовленні скорочене до der Akku. Чоловічий рід, множина на -en. Обидві форми називають перезаряджуваний елемент; die Batterie — ширша побутова категорія й може бути одноразовою.'
