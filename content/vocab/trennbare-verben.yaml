id: trennbare-verben
title_de: "Trennbare Verben"
title_en: "Separable verbs"
title_ru: "Глаголы с отделяемыми приставками"
title_uk: "Дієслова з відокремлюваними префіксами"
level: A2
entries:
  - de: abholen
    ipa: "ˈapˌhoːlən"
    pos: verb
    praesens_3sg: holt ab
    partizip2: abgeholt
    aux: haben
    valence: "+ Akk"
    en: to pick up (someone/something)
    ru: забирать, встречать
    uk: забирати, зустрічати
    example_de: Ich hole dich vom Bahnhof ab.
    example_en: I'll pick you up from the station.
    example_ru: Я встречу тебя на вокзале.
    example_uk: Я зустріну тебе на вокзалі.
  - de: ausgehen
    ipa: "ˈaʊ̯sˌgeːən"
    pos: verb
    praesens_3sg: geht aus
    partizip2: ausgegangen
    aux: sein
    en: to go out
    ru: выходить в свет, идти развлекаться
    uk: виходити в люди, іти розважатися
    example_de: Am Samstag gehen wir zusammen aus.
    example_en: On Saturday we're going out together.
    example_ru: В субботу мы вместе идём развлекаться.
    example_uk: У суботу ми разом ідемо розважатися.
  - de: umziehen
    ipa: "ˈʊmˌtsiːən"
    pos: verb
    praesens_3sg: zieht um
    partizip2: umgezogen
    aux: sein
    en: to move (house)
    ru: переезжать
    uk: переїжджати
    example_de: Wir ziehen nächsten Monat nach Berlin um.
    example_en: We are moving to Berlin next month.
    example_ru: В следующем месяце мы переезжаем в Берлин.
    example_uk: Наступного місяця ми переїжджаємо до Берліна.
  - de: aufmachen
    ipa: "ˈaʊ̯fˌmaxn̩"
    pos: verb
    praesens_3sg: macht auf
    partizip2: aufgemacht
    aux: haben
    valence: "+ Akk"
    en: to open (a window, a door, a shop — the colloquial separable verb, not öffnen)
    en_compact: "to open"
    ru: открывать (окно, дверь, магазин — разговорный отделяемый глагол, не öffnen)
    uk: відчиняти, відкривати (вікно, двері, крамницю — розмовне відокремлюване дієслово, не öffnen)
    example_de: Machst du bitte das Fenster auf?
    example_en: Will you open the window, please?
    example_ru: Открой, пожалуйста, окно.
    example_uk: Відчини, будь ласка, вікно.
    note:
      en: "öffnen is neutral and belongs equally in speech and writing; it is the form used on signs and notices. The opposite pair follows the same register contrast: zumachen beside schließen."
      ru: "öffnen — нейтральный глагол, одинаково уместный в речи и на письме; именно он стоит на вывесках и в объявлениях. Противоположная пара устроена так же: zumachen рядом со schließen."
      uk: "öffnen — нейтральне дієслово, однаково доречне в мовленні й на письмі; саме воно стоїть на вивісках та в оголошеннях. Протилежна пара влаштована так само: zumachen поряд зі schließen."
  - de: zumachen
    ipa: "ˈtsuːˌmaxn̩"
    pos: verb
    praesens_3sg: macht zu
    partizip2: zugemacht
    aux: haben
    valence: "+ Akk"
    en: to close, to shut (a window, a door, a shop — the colloquial separable verb, not schließen)
    en_compact: "to close, to shut"
    ru: закрывать (окно, дверь, магазин — разговорный отделяемый глагол, не schließen)
    uk: зачиняти, закривати (вікно, двері, крамницю — розмовне відокремлюване дієслово, не schließen)
    example_de: Der Supermarkt macht um zwanzig Uhr zu.
    example_en: The supermarket closes at eight p.m.
    example_ru: Супермаркет закрывается в восемь вечера.
    example_uk: Супермаркет зачиняється о восьмій вечора.
    note:
      en: "schließen is neutral and non-separable; it sounds natural in speech and writing and is the form used on signs: Geschäft geschlossen."
      ru: "schließen — нейтральный и неотделяемый глагол; он естественно звучит в речи и на письме и стоит на вывесках: Geschäft geschlossen."
      uk: "schließen — нейтральне й невідокремлюване дієслово; воно природно звучить у мовленні та на письмі й стоїть на вивісках: Geschäft geschlossen."
