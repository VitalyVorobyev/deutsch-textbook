    note:
      en: 'Feminine, stress on the last syllable, plural in -en, and the th is a plain t. Nobody says the full word in speech: A2 die Disco in the deck `kultur-unterhaltung-a2` is the short form, spelled Disco or Disko, and A2 der Club beside it is what a younger speaker says today. The long form survives on official signs and in newspapers. Direction takes in plus the accusative and position in plus the dative: in die Diskothek gehen, in der Diskothek sein.'
      ru: 'Женский род, ударение на последнем слоге, множественное на -en, th читается как простое t. Полное слово вслух не говорят: die Disco уровня A2 из колоды `kultur-unterhaltung-a2` — краткая форма, пишут Disco или Disko, а der Club рядом с ней — то, что скажет сегодня человек помоложе. Длинная форма держится на официальных вывесках и в газетах. Направление — in с винительным, местонахождение — in с дательным: in die Diskothek gehen, in der Diskothek sein.'
      uk: 'Жіночий рід, наголос на останньому складі, множина на -en, th читається як просте t. Повне слово вголос не кажуть: die Disco рівня A2 з колоди `kultur-unterhaltung-a2` — коротка форма, пишуть Disco або Disko, а der Club поряд із нею — те, що скаже сьогодні молодший мовець. Довга форма тримається на офіційних вивісках і в газетах. Напрямок — in зі знахідним, місцеперебування — in з давальним: in die Diskothek gehen, in der Diskothek sein.'

  - de: Garderobe
    ipa: "gaʁdəˈʁoːbə"
    pos: noun
    gender: f
    plural: "die Garderoben"
    cards: recognition
    en: the counter just inside a theatre or a club where you hand in your coat and get a numbered tag
    ru: стойка сразу за входом в театр или клуб, где сдают верхнюю одежду и получают номерок
    uk: стійка одразу за входом до театру чи клубу, де здають верхній одяг і отримують номерок
    example_de: Die Mäntel geben wir an der Garderobe ab.
