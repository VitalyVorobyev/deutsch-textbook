    ru: заведение, открытое допоздна, где ставят записанную музыку и куда ходят танцевать
    uk: заклад, відкритий допізна, де ставлять записану музику і куди ходять танцювати
    example_de: Nach dem Konzert sind wir noch in die Diskothek gegangen.
