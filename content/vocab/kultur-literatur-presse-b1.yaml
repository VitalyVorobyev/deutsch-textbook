# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains what the alphabetical
# list of data/goethe-b1-wortliste.txt leaves scattered across culture: the printed
# page and the firm behind it, the people who write and the people who read, the
# figures a story is about, and the rooms a learner walks through on the way to an
# evening out.
# A1's `kommunikation-medien` owns Zeitung and Buch, A2's `kultur-unterhaltung-a2`
# owns Zeitschrift, Kultur, Instrument, Klavier, Band and Disco, A1's `freizeit-koennen`
# owns Musik, Kino and Konzert, A1's `reisen-urlaub` owns Museum, Theater and
# Bibliothek, A2's `berufe-a2` owns Autor, Künstler, Sänger and Musiker, A2's
# `schule-faecher-a2` owns Kunst, Text and Geschichte, B1's `kultur-freizeit` owns the
# evening itself (Roman, Figur, Publikum, Bühne, Oper, Orchester), and B1's
# `meinung-medien` owns the newsroom (Medien, Redaktion, Schlagzeile, Leser, Kritik).
# This deck is what those eight leave unnamed: the word for the trade that prints a
# book, the word for the person inside a story, and the words a culture page needs
# between them.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read, never written: the learner's own sentence about a film or a concert comes out
# of A1 and A2 words, and everything here is what the review, the programme and the
# book jacket say back at him.
id: kultur-literatur-presse-b1
title_de: "Kultur, Literatur & Presse"
title_en: "Culture, literature and the press"
title_ru: "Культура, литература и пресса"
title_uk: "Культура, література і преса"
level: B1
entries:
  # --- Presse und Verlag ---
  - de: Presse
    ipa: "ˈpʁɛsə"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: all the newspapers and news programmes taken together and spoken of as one voice
    ru: все газеты и новостные передачи, взятые вместе и названные одним словом
    uk: усі газети й новинні передачі, узяті разом і названі одним словом
    example_de: Über das Konzert hat die Presse kaum berichtet.
    example_en: The press hardly reported on the concert at all.
    example_ru: О концерте пресса почти не писала.
    example_uk: Про концерт преса майже не писала.
    note:
      en: 'A collective noun with no plural in this sense. B1 die Medien in the deck `meinung-medien` is the wider word and takes in radio, television and the net; this one keeps its old link to print and to the people who write it, which is why a spokesman gives eine Pressekonferenz and not a Medienkonferenz. A1 die Zeitung in the deck `kommunikation-medien` is one title you can hold in your hand, and this is all of them at once. Chunks: die freie Presse, in der Presse stehen, eine gute Presse haben. The machine the word is named after is still around too, and the verb is pressen.'
      ru: 'Собирательное слово, в этом значении без множественного. die Medien уровня B1 из колоды `meinung-medien` шире и вбирает радио, телевидение и сеть; здесь же сохраняется старая связь с печатью и с теми, кто в ней пишет, — поэтому пресс-секретарь даёт eine Pressekonferenz, а не «Medienkonferenz». die Zeitung уровня A1 из колоды `kommunikation-medien` — одно издание, которое держат в руках, а это слово — все они разом. Обороты: die freie Presse, in der Presse stehen, eine gute Presse haben. Станок, по которому слово названо, тоже никуда не делся, а глагол — pressen.'
      uk: 'Збірне слово, у цьому значенні без множини. die Medien рівня B1 з колоди `meinung-medien` ширше і вбирає радіо, телебачення та мережу; тут же збережено давній зв’язок із друком і з тими, хто в ньому пише, — тому речник дає eine Pressekonferenz, а не «Medienkonferenz». die Zeitung рівня A1 з колоди `kommunikation-medien` — одне видання, яке тримають у руках, а це слово — усі вони разом. Звороти: die freie Presse, in der Presse stehen, eine gute Presse haben. Верстат, за яким слово названо, теж нікуди не подівся, а дієслово — pressen.'

  - de: Magazin
    ipa: "magaˈtsiːn"
    pos: noun
    gender: n
    plural: "die Magazine"
    cards: recognition
    en: an illustrated periodical on good paper, read for its long pieces rather than for the news
    ru: иллюстрированный журнал на хорошей бумаге, который читают ради больших материалов, а не ради новостей
    uk: ілюстрований журнал на добрім папері, який читають заради великих матеріалів, а не заради новин
    example_de: Das Magazin erscheint jeden Monat mit vielen Fotos.
    example_en: The magazine comes out every month with a lot of photographs.
    example_ru: Журнал выходит каждый месяц с множеством фотографий.
    example_uk: Журнал виходить щомісяця з безліччю світлин.
    note:
      en: 'Neuter, plural in -e, stress on the last syllable. A2 die Zeitschrift in the deck `kultur-unterhaltung-a2` is the plain German word for the same object; this loan is what a title calls itself when it wants to sound weightier, and television borrowed it whole for das Politmagazin, an hour of long reports. The word has a second life that has nothing to do with reading: it is also the room where a shop or a museum keeps its stock, which is the sense a museum means when it says a painting lies im Magazin.'
      ru: 'Средний род, множественное на -e, ударение на последнем слоге. die Zeitschrift уровня A2 из колоды `kultur-unterhaltung-a2` — простое немецкое название того же предмета; заимствование же берут, когда изданию хочется звучать весомее, а телевидение перенесло его целиком в das Politmagazin — час больших репортажей. У слова есть и вторая жизнь, к чтению отношения не имеющая: так называют помещение, где магазин или музей держит запасы, — именно это имеет в виду музей, говоря, что картина лежит im Magazin.'
      uk: 'Середній рід, множина на -e, наголос на останньому складі. die Zeitschrift рівня A2 з колоди `kultur-unterhaltung-a2` — просте німецьке наймення того самого предмета; запозичення ж беруть, коли виданню кортить звучати вагоміше, а телебачення перенесло його цілком у das Politmagazin — годину великих репортажів. У слова є й друге життя, до читання непричетне: так звуть приміщення, де крамниця або музей тримає запаси, — саме це має на увазі музей, кажучи, що картина лежить im Magazin.'

  - de: Verlag
    ipa: "fɛɐ̯ˈlaːk"
    pos: noun
    gender: m
    plural: "die Verlage"
    cards: recognition
    en: the firm that pays for a book to be made and puts its own name on the spine
    ru: фирма, которая оплачивает изготовление книги и ставит на корешке своё имя
    uk: фірма, яка оплачує виготовлення книжки і ставить на корінці своє ім’я
    example_de: Der Roman erscheint im Herbst bei einem kleinen Verlag.
    example_en: The novel comes out in the autumn with a small publishing house.
    example_ru: Роман выйдет осенью в небольшом издательстве.
    example_uk: Роман вийде восени в невеликому видавництві.
    note:
      en: 'Masculine, plural in -e, and the final g is spoken as k. The preposition is bei and never in: ein Buch erscheint bei einem Verlag, sie arbeitet bei einem Verlag. Do not fold the firm into the people inside it — B1 die Redaktion in the deck `meinung-medien` is the desk that edits the text, while this word is the business that finances it and sells it. The verb verlegen leads the same double life as the English "lay": to publish a book, and to mislay one''s keys. A1 das Buch in the deck `kommunikation-medien` is what comes out at the end.'
      ru: 'Мужской род, множественное на -e, конечное g звучит как k. Предлог — bei, но не in: ein Buch erscheint bei einem Verlag, sie arbeitet bei einem Verlag. Не сливайте фирму с людьми внутри неё: die Redaktion уровня B1 из колоды `meinung-medien` — это стол, за которым правят текст, а здесь предприятие, которое финансирует книгу и продаёт её. Глагол verlegen живёт двойной жизнью: «издать книгу» и «задевать куда-то ключи». das Buch уровня A1 из колоды `kommunikation-medien` — то, что выходит в конце.'
      uk: 'Чоловічий рід, множина на -e, кінцеве g звучить як k. Прийменник — bei, а не in: ein Buch erscheint bei einem Verlag, sie arbeitet bei einem Verlag. Не зливайте фірму з людьми всередині неї: die Redaktion рівня B1 з колоди `meinung-medien` — це стіл, за яким правлять текст, а тут підприємство, яке фінансує книжку і продає її. Дієслово verlegen живе подвійним життям: «видати книжку» і «десь подіти ключі». das Buch рівня A1 з колоди `kommunikation-medien` — те, що виходить наприкінці.'

  - de: Leserin
    ipa: "ˈleːzəʁɪn"
    pos: noun
    gender: f
    plural: "die Leserinnen"
    cards: recognition
    en: a woman who reads a paper or a book, counted as one of the people a title is written for
    ru: женщина, которая читает издание или книгу, взятая как одна из тех, для кого его пишут
    uk: жінка, яка читає видання або книжку, узята як одна з тих, для кого його пишуть
    example_de: Eine Leserin aus Bremen hat der Redaktion geschrieben.
    example_en: A reader from Bremen wrote to the editorial desk.
    example_ru: Читательница из Бремена написала в редакцию.
    example_uk: Читачка з Бремена написала до редакції.
    note:
      en: 'Regular Movierung with -in on B1 der Leser in the deck `meinung-medien`, which is a Wortliste headword of its own; the plural doubles the n and there are no case endings. German papers address the whole readership as Leserinnen und Leser, and the letter one of them sends in is der Leserbrief. A1 lesen in the deck `perfekt-a1-verben` is the verb underneath, and B1 der Zuschauer in `meinung-medien` is the same idea for television.'
      ru: 'Обычное мовирование на -in от der Leser уровня B1 из колоды `meinung-medien` — самостоятельной строки списка; во множественном n удваивается, падежных окончаний нет. Немецкие газеты обращаются ко всей аудитории Leserinnen und Leser, а письмо от неё называется der Leserbrief. lesen уровня A1 из колоды `perfekt-a1-verben` — глагол под всем этим, а der Zuschauer уровня B1 из `meinung-medien` — то же самое для телевидения.'
      uk: 'Звичайна моція на -in від der Leser рівня B1 з колоди `meinung-medien` — самостійного рядка списку; у множині n подвоюється, відмінкових закінчень немає. Німецькі газети звертаються до всієї авдиторії Leserinnen und Leser, а лист від неї зветься der Leserbrief. lesen рівня A1 з колоди `perfekt-a1-verben` — дієслово під усім цим, а der Zuschauer рівня B1 з `meinung-medien` — те саме для телебачення.'

  # --- Literatur und wer sie schreibt ---
  - de: Literatur
    ipa: "lɪtəʁaˈtuːɐ̯"
    pos: noun
    gender: f
    plural: "die Literaturen"
    cards: recognition
    en: writing kept and read for its own sake; also everything published on one subject
    ru: словесность, которую хранят и читают ради неё самой; а также всё написанное по одному предмету
    uk: письменство, яке зберігають і читають заради нього самого; а також усе написане з одного предмета
    example_de: Im Unterricht lesen wir Literatur aus dem 19. Jahrhundert.
    example_en: In class we read literature from the nineteenth century.
    example_ru: На занятиях мы читаем литературу девятнадцатого века.
    example_uk: На заняттях ми читаємо літературу дев’ятнадцятого століття.
    note:
      en: 'Feminine, stress on the last syllable, and the plural is confined to naming several national literatures side by side, so a B1 text uses the singular. The second sense is the one a university reading list means: Literatur zu diesem Thema is everything published about it, and das Literaturverzeichnis is the bibliography at the back of a paper. B1 der Roman in the deck `kultur-freizeit` and A2 die Geschichte in `schule-faecher-a2` are single works; this is the whole shelf. The adjective is literarisch.'
      ru: 'Женский род, ударение на последнем слоге, а множественное годится лишь там, где рядом называют несколько национальных литератур, — тексту уровня B1 хватает единственного. Второе значение — то, что имеет в виду университетский список: Literatur zu diesem Thema — всё опубликованное по теме, а das Literaturverzeichnis — список источников в конце работы. der Roman уровня B1 из колоды `kultur-freizeit` и die Geschichte уровня A2 из `schule-faecher-a2` — отдельные произведения, а здесь целая полка. Прилагательное — literarisch.'
      uk: 'Жіночий рід, наголос на останньому складі, а множина годиться лише там, де поруч називають кілька національних літератур, — текстові рівня B1 вистачає однини. Друге значення — те, що має на увазі університетський перелік: Literatur zu diesem Thema — усе опубліковане з теми, а das Literaturverzeichnis — список джерел наприкінці праці. der Roman рівня B1 з колоди `kultur-freizeit` і die Geschichte рівня A2 з `schule-faecher-a2` — окремі твори, а тут ціла полиця. Прикметник — literarisch.'

  - de: Schriftsteller
    ipa: "ˈʃʁɪftˌʃtɛlɐ"
    pos: noun
    gender: m
    plural: "die Schriftsteller"
    cards: recognition
    en: a man who writes books as his calling, novels and stories rather than reports
    ru: мужчина, который пишет книги по призванию, романы и рассказы, а не отчёты
    uk: чоловік, який пише книжки за покликанням, романи й оповідання, а не звіти
    example_de: Der Schriftsteller liest am Freitag aus seinem neuen Buch.
    example_en: The writer is reading from his new book on Friday.
    example_ru: В пятницу писатель читает отрывки из своей новой книги.
    example_uk: У п’ятницю письменник читає уривки зі своєї нової книжки.
    note:
      en: 'A compound of die Schrift and stellen, so the primary stress is on Schrift- and the secondary one on -stell-; singular and plural are spelled alike. A2 der Autor in the deck `berufe-a2` is the wider word and names whoever wrote any text at all, a manual included, while this one claims literature: every Schriftsteller is an Autor, and the reverse is not true. The trade is die Schriftstellerei, and the feminine is die Schriftstellerin, the next entry.'
      ru: 'Сложное слово из die Schrift и stellen, поэтому главное ударение на Schrift-, побочное на -stell-; единственное и множественное пишутся одинаково. der Autor уровня A2 из колоды `berufe-a2` шире и называет всякого, кто написал любой текст, хоть инструкцию, а это слово притязает на художественность: всякий Schriftsteller — Autor, но не наоборот. Само занятие — die Schriftstellerei, женская пара — die Schriftstellerin, следующая запись.'
      uk: 'Складне слово з die Schrift і stellen, тому головний наголос на Schrift-, побічний на -stell-; однина і множина пишуться однаково. der Autor рівня A2 з колоди `berufe-a2` ширший і називає будь-кого, хто написав будь-який текст, хоч інструкцію, а це слово претендує на художність: кожен Schriftsteller є Autor, але не навпаки. Саме заняття — die Schriftstellerei, жіноча пара — die Schriftstellerin, наступний запис.'

  - de: Schriftstellerin
    ipa: "ˈʃʁɪftˌʃtɛləʁɪn"
    pos: noun
    gender: f
    plural: "die Schriftstellerinnen"
    cards: recognition
    en: a woman who writes books as her calling
    ru: женщина, которая пишет книги по призванию
    uk: жінка, яка пише книжки за покликанням
    example_de: Die Schriftstellerin hat für ihren zweiten Roman einen Preis bekommen.
    example_en: The writer won a prize for her second novel.
    example_ru: За второй роман писательница получила премию.
    example_uk: За другий роман письменниця отримала премію.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n, and the stress does not move off Schrift-. A book jacket and a prize citation name whichever form fits the person; a reading list that has to cover both writes Schriftstellerinnen und Schriftsteller in full, because the -in cannot be abbreviated into the masculine here without looking like a slash form. A2 die Autorin in the deck `berufe-a2` is the neutral alternative when the text is not literature.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается, ударение с Schrift- не сходит. Обложка и формулировка премии называют ту форму, которая подходит человеку; список, которому нужно охватить обоих, пишет Schriftstellerinnen und Schriftsteller целиком, потому что -in здесь не сворачивается в мужскую форму без косой черты. die Autorin уровня A2 из колоды `berufe-a2` — нейтральная замена, когда текст не художественный.'
      uk: 'Звичайна моція на -in, у множині n подвоюється, наголос із Schrift- не сходить. Обкладинка і формулювання премії називають ту форму, яка пасує людині; перелік, якому треба охопити обох, пише Schriftstellerinnen und Schriftsteller цілком, бо -in тут не згортається в чоловічу форму без похилої риски. die Autorin рівня A2 з колоди `berufe-a2` — нейтральна заміна, коли текст не художній.'

  - de: Gedicht
    ipa: "gəˈdɪçt"
    pos: noun
    gender: n
    plural: "die Gedichte"
    cards: recognition
    en: a short piece of writing set out in lines, made to be heard as much as read
    ru: короткое сочинение, разбитое на строки и рассчитанное на слух не меньше, чем на чтение
    uk: короткий твір, розбитий на рядки і розрахований на слух не менше, ніж на читання
    example_de: In der Schule mussten wir jedes Jahr ein Gedicht auswendig lernen.
    example_en: At school we had to learn a poem by heart every year.
    example_ru: В школе мы каждый год учили наизусть стихотворение.
    example_uk: У школі ми щороку вчили напам’ять вірш.
    note:
      en: 'Neuter, plural in -e, and the verb behind it is dichten, which today means to write verse. What the text is divided into is B1 die Zeile in the deck `geld-vertraege`, and several lines together make die Strophe. Chunks: ein Gedicht schreiben, ein Gedicht vortragen, ein Gedicht auswendig lernen. The whole art is die Lyrik, and der Dichter is the person; note that a Dichter may write novels too, so the word is wider than the English "poet".'
      ru: 'Средний род, множественное на -e, а глагол за ним — dichten, что сегодня значит «сочинять стихи». То, на что разбит текст, — die Zeile уровня B1 из колоды `geld-vertraege`, а несколько строк вместе дают die Strophe. Обороты: ein Gedicht schreiben, ein Gedicht vortragen, ein Gedicht auswendig lernen. Искусство целиком — die Lyrik, а человек — der Dichter; учтите, что Dichter может писать и прозу, так что слово шире, чем «поэт».'
      uk: 'Середній рід, множина на -e, а дієслово за ним — dichten, що сьогодні означає «складати вірші». Те, на що розбито текст, — die Zeile рівня B1 з колоди `geld-vertraege`, а кілька рядків разом дають die Strophe. Звороти: ein Gedicht schreiben, ein Gedicht vortragen, ein Gedicht auswendig lernen. Мистецтво цілком — die Lyrik, а людина — der Dichter; зважте, що Dichter може писати й прозу, тож слово ширше, ніж «поет».'

  - de: Märchen
    ipa: "ˈmɛːɐ̯çən"
    pos: noun
    gender: n
    plural: "die Märchen"
    cards: recognition
    en: an old story handed down by telling, with kings and talking animals in it
    ru: старая история, дошедшая через устный пересказ, с королями и говорящими зверями
    uk: давня історія, донесена усним переказом, із королями й говірними звірами
    example_de: Meine Großmutter hat uns jeden Abend ein Märchen erzählt.
    example_en: My grandmother told us a fairy tale every evening.
    example_ru: Бабушка каждый вечер рассказывала нам сказку.
    example_uk: Бабуся щовечора розповідала нам казку.
    note:
      en: 'A diminutive in -chen, so it is neuter whatever it is about, and singular and plural are spelled alike. The opening formula every German child knows is Es war einmal, and the collection behind most of them is die Märchen der Brüder Grimm. A2 erzählen in the deck `verben-handlungen-a2-1` is the verb it goes with, because these stories are told before they are read. In everyday speech Erzähl mir keine Märchen means stop making things up, which is the nearest German gets to calling something a fib politely.'
      ru: 'Уменьшительное на -chen, поэтому средний род независимо от содержания, а единственное и множественное пишутся одинаково. Зачин, который знает каждый немецкий ребёнок, — Es war einmal, а собрание, откуда большинство из них, — die Märchen der Brüder Grimm. erzählen уровня A2 из колоды `verben-handlungen-a2-1` — глагол при нём: эти истории сперва рассказывают и лишь потом читают. В быту Erzähl mir keine Märchen значит «не выдумывай» — самый мягкий способ по-немецки назвать сказанное выдумкой.'
      uk: 'Зменшене на -chen, тому середній рід незалежно від змісту, а однина і множина пишуться однаково. Зачин, який знає кожна німецька дитина, — Es war einmal, а збірка, звідки більшість із них, — die Märchen der Brüder Grimm. erzählen рівня A2 з колоди `verben-handlungen-a2-1` — дієслово при ньому: ці історії спершу розповідають і лише потім читають. У побуті Erzähl mir keine Märchen означає «не вигадуй» — найм’якший спосіб німецькою назвати сказане вигадкою.'

  - de: Held
    ipa: "ˈhɛlt"
    pos: noun
    gender: m
    plural: "die Helden"
    cards: recognition
    en: the man a story is built around; also anybody who does something brave
    ru: мужчина, вокруг которого построена история; а также всякий, кто совершил смелый поступок
    uk: чоловік, навколо якого побудовано історію; а також будь-хто, хто вчинив сміливо
    example_de: Der Held des Romans verlässt am Ende seine Stadt.
    example_en: The hero of the novel leaves his town in the end.
    example_ru: Герой романа в конце покидает свой город.
    example_uk: Герой роману наприкінці полишає своє місто.
    note:
      en: 'A weak masculine, so -en everywhere except the nominative singular: der Held, den Helden, dem Helden, des Helden, die Helden — the same pattern as B1 der Zeuge in the deck `recht-kriminalitaet-b1` and A1 der Kollege in `termine-a1`, and the trap is the same, because the bare form is the one shape you least often need. The final d is spoken as t. B1 die Figur in the deck `kultur-freizeit` is any character in a work; this one is the central one, and die Hauptfigur says so explicitly. The feminine is die Heldin, the next entry.'
      ru: 'Слабое существительное мужского рода: -en везде, кроме именительного единственного — der Held, den Helden, dem Helden, des Helden, die Helden, — та же модель, что у der Zeuge уровня B1 из колоды `recht-kriminalitaet-b1` и der Kollege уровня A1 из `termine-a1`, и ловушка та же: голая форма нужна реже всех. Конечное d звучит как t. die Figur уровня B1 из колоды `kultur-freizeit` — любой персонаж произведения, а здесь центральный, о чём прямо говорит и die Hauptfigur. Женская пара — die Heldin, следующая запись.'
      uk: 'Слабкий іменник чоловічого роду: -en усюди, крім називного однини — der Held, den Helden, dem Helden, des Helden, die Helden, — та сама модель, що в der Zeuge рівня B1 з колоди `recht-kriminalitaet-b1` і der Kollege рівня A1 з `termine-a1`, і пастка та сама: гола форма потрібна найрідше. Кінцеве d звучить як t. die Figur рівня B1 з колоди `kultur-freizeit` — будь-який персонаж твору, а тут центральний, про що прямо каже й die Hauptfigur. Жіноча пара — die Heldin, наступний запис.'

  - de: Heldin
    ipa: "ˈhɛldɪn"
    pos: noun
    gender: f
    plural: "die Heldinnen"
    cards: recognition
    en: the woman a story is built around; also a woman who does something brave
    ru: женщина, вокруг которой построена история; а также женщина, совершившая смелый поступок
    uk: жінка, навколо якої побудовано історію; а також жінка, що вчинила сміливо
    example_de: Die Heldin des Films arbeitet als Ärztin auf dem Land.
    example_en: The heroine of the film works as a doctor in the countryside.
    example_ru: Героиня фильма работает врачом в сельской местности.
    example_uk: Героїня фільму працює лікаркою в сільській місцевості.
    note:
      en: 'Movierung with -in on the stem Held-, and the d is voiced again once a vowel follows it, so the masculine sounds with t and the feminine with d. The plural doubles the n, and the weak declension of der Held stops here: die Heldin takes no case endings at all, exactly as die Zeugin does beside der Zeuge in the deck `recht-kriminalitaet-b1`. In a plot summary die Hauptfigur is the neutral way out when the sex does not matter.'
      ru: 'Мовирование на -in по основе Held-, и d снова звонкое, раз за ним идёт гласный: в мужской форме слышно t, в женской — d. Во множественном n удваивается, а слабое склонение der Held здесь обрывается: die Heldin падежных окончаний не имеет вовсе, ровно как die Zeugin рядом с der Zeuge в колоде `recht-kriminalitaet-b1`. В пересказе сюжета die Hauptfigur — нейтральный выход, когда пол не важен.'
      uk: 'Моція на -in за основою Held-, і d знову дзвінке, раз за ним іде голосний: у чоловічій формі чути t, у жіночій — d. У множині n подвоюється, а слабке відмінювання der Held тут уривається: die Heldin відмінкових закінчень не має зовсім, точно як die Zeugin поряд із der Zeuge в колоді `recht-kriminalitaet-b1`. У переказі сюжету die Hauptfigur — нейтральний вихід, коли стать не важить.'

  - de: König
    ipa: "ˈkøːnɪç"
    pos: noun
    gender: m
    plural: "die Könige"
    cards: recognition
    en: a man who rules a country because he was born to it and keeps the title for life
    ru: мужчина, который правит страной по рождению и носит этот титул пожизненно
    uk: чоловік, який править країною за народженням і носить цей титул довічно
    example_de: In dem Märchen hat der König drei Töchter.
    example_en: In the fairy tale the king has three daughters.
    example_ru: В сказке у короля три дочери.
    example_uk: У казці в короля три доньки.
    note:
      en: 'Masculine with a regular plural in -e, and the final -ig is spoken as ç, so the word ends the way ich does — but the plural Könige brings the g back. The Wortliste lists only the masculine; die Königin is formed regularly and is what a newspaper uses for a reigning queen. The country is das Königreich, and the modern German state has none, which is why a learner meets the word mostly in fairy tales and in history. B1 die Regierung in the deck `politik-staat-b1` is who actually governs today.'
      ru: 'Мужской род, обычное множественное на -e, а конечное -ig звучит как ç, так что слово кончается тем же звуком, что ich; во множественном Könige g возвращается. Список даёт только мужскую форму; die Königin образуется обычно и именно так газета называет правящую королеву. Страна — das Königreich, а у нынешнего немецкого государства её нет, поэтому слово встречают в основном в сказках и в истории. die Regierung уровня B1 из колоды `politik-staat-b1` — те, кто правит сегодня на деле.'
      uk: 'Чоловічий рід, звичайна множина на -e, а кінцеве -ig звучить як ç, тож слово кінчається тим самим звуком, що ich; у множині Könige g повертається. Список подає лише чоловічу форму; die Königin твориться звичайно, і саме так газета зве владарку. Країна — das Königreich, а в теперішньої німецької держави її немає, тому слово зустрічають здебільшого в казках і в історії. die Regierung рівня B1 з колоди `politik-staat-b1` — ті, хто править сьогодні насправді.'

  # --- Kunst, Musik und der Abend aus ---
  - de: Galerie
    ipa: "galəˈʁiː"
    pos: noun
    gender: f
    plural: "die Galerien"
    cards: recognition
    en: a room or a small house where pictures hang and are usually for sale
    ru: помещение или небольшой дом, где висят картины, обычно выставленные на продажу
    uk: приміщення або невеликий дім, де висять картини, звичайно виставлені на продаж
    example_de: In der kleinen Galerie am Markt hängen Bilder aus der Region.
    example_en: Pictures from the region hang in the small gallery on the market square.
    example_ru: В маленькой галерее у рынка висят картины местных художников.
    example_uk: У невеликій галереї біля ринку висять картини місцевих митців.
    note:
      en: 'Feminine, stress on the last syllable, plural in -n; the -ie is one long i and never two syllables. A1 das Museum in the deck `reisen-urlaub` keeps what it owns and charges admission, while a Galerie mostly shows what it hopes to sell, and A2 die Ausstellung in `kultur-unterhaltung-a2` is the event either of them puts on. A second, older sense survives in a theatre, where die Galerie is the highest and cheapest tier of seats.'
      ru: 'Женский род, ударение на последнем слоге, множественное на -n; -ie здесь один долгий i, а не два слога. das Museum уровня A1 из колоды `reisen-urlaub` хранит своё и берёт за вход, а Galerie чаще показывает то, что надеется продать; die Ausstellung уровня A2 из `kultur-unterhaltung-a2` — событие, которое устраивает и тот и другая. Уцелело и второе, более старое значение: в театре die Galerie — самый верхний и самый дешёвый ярус.'
      uk: 'Жіночий рід, наголос на останньому складі, множина на -n; -ie тут один довгий i, а не два склади. das Museum рівня A1 з колоди `reisen-urlaub` береже своє і бере за вхід, а Galerie частіше показує те, що сподівається продати; die Ausstellung рівня A2 з `kultur-unterhaltung-a2` — подія, яку влаштовує і той і та. Уціліло й друге, давніше значення: у театрі die Galerie — найвищий і найдешевший ярус.'

  - de: Jazz
    ipa: "ˈdʒɛs"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: the kind of music that grew out of the American South and leaves room for playing freely
    ru: род музыки, выросший на американском Юге и оставляющий место для свободной игры
    uk: рід музики, що виріс на американському Півдні й лишає місце для вільної гри
    example_de: Am Donnerstag spielt im Club eine Band Jazz.
    example_en: On Thursday a band is playing jazz at the club.
    example_ru: В четверг в клубе играет джазовая группа.
    example_uk: У четвер у клубі грає джазовий гурт.
    note:
      en: 'An English loan, masculine like most music words in German (der Rock, der Pop, der Blues), and it takes no plural and no article after a verb: Jazz hören, Jazz spielen. It is spoken dʒɛs, so the a comes out as an e and the double z is not the German ts; a spelling pronunciation with a is heard beside it. A2 die Band and A2 der Club in the deck `kultur-unterhaltung-a2` are where a learner meets it, and the players are die Jazzband and der Jazzmusiker.'
      ru: 'Английское заимствование, мужского рода, как почти все названия музыки в немецком (der Rock, der Pop, der Blues); множественного нет, а после глагола нет и артикля: Jazz hören, Jazz spielen. Произносят dʒɛs: a выходит как e, а двойное z не немецкое ts; рядом держится и выговор по написанию, с a. die Band и der Club уровня A2 из колоды `kultur-unterhaltung-a2` — та обстановка, в которой слово и встречают, а исполнители — die Jazzband и der Jazzmusiker.'
      uk: 'Англійське запозичення, чоловічого роду, як майже всі назви музики в німецькій (der Rock, der Pop, der Blues); множини немає, а після дієслова немає й артикля: Jazz hören, Jazz spielen. Вимовляють dʒɛs: a виходить як e, а подвійне z не є німецьким ts; поряд тримається й вимова за написанням, з a. die Band і der Club рівня A2 з колоди `kultur-unterhaltung-a2` — те оточення, у якому слово і зустрічають, а виконавці — die Jazzband і der Jazzmusiker.'

  - de: Flöte
    ipa: "ˈfløːtə"
    pos: noun
    gender: f
    plural: "die Flöten"
    cards: recognition
    en: the wind instrument that is blown across rather than into, and the recorder children start on
    ru: духовой инструмент, в который дуют поперёк, а не внутрь; а также блокфлейта, с которой начинают дети
    uk: духовий інструмент, у який дмуть упоперек, а не всередину; а також блокфлейта, з якої починають діти
    example_de: Meine Tochter spielt seit zwei Jahren Flöte.
    example_en: My daughter has been playing the flute for two years.
    example_ru: Моя дочь два года играет на флейте.
    example_uk: Моя донька два роки грає на флейті.
    note:
      en: 'Feminine, plural in -n, and the ö is long. German names an instrument after spielen with no article at all: Flöte spielen, Klavier spielen, and A2 das Klavier in the deck `kultur-unterhaltung-a2` shows the same pattern. Two of them share the word: die Querflöte is the silver one held sideways in an orchestra, die Blockflöte the wooden one every German school child is handed in the first years. A2 das Instrument in `kultur-unterhaltung-a2` is the class it belongs to.'
      ru: 'Женский род, множественное на -n, ö долгий. Название инструмента при spielen идёт вообще без артикля: Flöte spielen, Klavier spielen, — и das Klavier уровня A2 из колоды `kultur-unterhaltung-a2` показывает ту же модель. Слово делят два инструмента: die Querflöte — серебряная, которую держат поперёк в оркестре, die Blockflöte — деревянная, которую в первые школьные годы даёт в руки каждая немецкая школа. das Instrument уровня A2 из `kultur-unterhaltung-a2` — класс, к которому всё это относится.'
      uk: 'Жіночий рід, множина на -n, ö довгий. Назва інструмента при spielen іде взагалі без артикля: Flöte spielen, Klavier spielen, — і das Klavier рівня A2 з колоди `kultur-unterhaltung-a2` показує ту саму модель. Слово ділять два інструменти: die Querflöte — срібна, яку тримають упоперек в оркестрі, die Blockflöte — дерев’яна, яку в перші шкільні роки дає до рук кожна німецька школа. das Instrument рівня A2 з `kultur-unterhaltung-a2` — клас, до якого все це належить.'

  - de: musikalisch
    ipa: "muziˈkaːlɪʃ"
    pos: adj
    cards: recognition
    en: having to do with music; also having a good ear and a feeling for it
    ru: относящийся к музыке; а также обладающий слухом и чутьём к ней
    uk: що стосується музики; а також наділений слухом і чуттям до неї
    example_de: Ihre Kinder sind alle sehr musikalisch.
    example_en: Her children are all very musical.
    example_ru: Все её дети очень музыкальны.
    example_uk: Усі її діти дуже музикальні.
    note:
      en: 'Built on A1 die Musik in the deck `freizeit-koennen` with -alisch, and the stress moves onto the -a-. The two senses take different subjects: a thing is musikalisch because it belongs to music (die musikalische Ausbildung, ein musikalischer Abend), a person because they can hear it. Do not stretch it to mean "fond of music" — that is musikbegeistert. A2 der Musiker and A2 die Musikerin in the deck `berufe-a2` do it for a living.'
      ru: 'Образовано от die Musik уровня A1 из колоды `freizeit-koennen` суффиксом -alisch, и ударение переходит на -a-. Два значения берут разные подлежащие: вещь бывает musikalisch потому, что относится к музыке (die musikalische Ausbildung, ein musikalischer Abend), а человек — потому, что её слышит. Не растягивайте слово до «любящий музыку»: это musikbegeistert. der Musiker и die Musikerin уровня A2 из колоды `berufe-a2` занимаются этим ради заработка.'
      uk: 'Утворене від die Musik рівня A1 з колоди `freizeit-koennen` суфіксом -alisch, і наголос переходить на -a-. Два значення беруть різні підмети: річ буває musikalisch тому, що належить музиці (die musikalische Ausbildung, ein musikalischer Abend), а людина — тому, що її чує. Не розтягуйте слово до «той, хто любить музику»: це musikbegeistert. der Musiker і die Musikerin рівня A2 з колоди `berufe-a2` роблять це заради заробітку.'

  - de: Diskothek
    ipa: "dɪskoˈteːk"
