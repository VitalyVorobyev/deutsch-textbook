    note:
      en: 'Feminine, plural in -n, stress on the -ro-, and the first r is uvular like every other. At B1 this is the sense that matters, because it is the one printed on a sign: an der Garderobe abgeben, an der Garderobe abholen, and in a large house it is compulsory. Two further senses run beside it and are best only recognised — the small room where a performer changes, and, in older usage, the whole of somebody''s clothing. A1 der Mantel in the deck `kleidung-farben` is what you hand over, and A1 der Schrank in `wohnen` is where it hangs at home.'
      ru: 'Женский род, множественное на -n, ударение на -ro-, первое r такое же увулярное, как и второе. На уровне B1 важно именно это значение, потому что оно и написано на табличке: an der Garderobe abgeben, an der Garderobe abholen, — а в крупном театре сдача обязательна. Рядом идут ещё два значения, которые довольно узнавать: комнатка, где переодевается артист, и, в старом употреблении, весь гардероб человека. der Mantel уровня A1 из колоды `kleidung-farben` — то, что сдают, а der Schrank уровня A1 из `wohnen` — место, где оно висит дома.'
      uk: 'Жіночий рід, множина на -n, наголос на -ro-, перше r таке саме увулярне, як і друге. На рівні B1 важить саме це значення, бо воно й написане на табличці: an der Garderobe abgeben, an der Garderobe abholen, — а у великому театрі здавання обов’язкове. Поряд ідуть ще два значення, які досить упізнавати: кімнатка, де перевдягається артист, і, у давнішому вжитку, увесь одяг людини. der Mantel рівня A1 з колоди `kleidung-farben` — те, що здають, а der Schrank рівня A1 з `wohnen` — місце, де воно висить удома.'

  # --- Wie ein Kulturteil urteilt ---
  - de: kulturell
    ipa: "kʊltuˈʁɛl"
    pos: adj
    cards: recognition
    en: having to do with the arts and with how a group lives, thinks and celebrates
    ru: относящийся к искусству и к тому, как группа живёт, мыслит и празднует
    uk: що стосується мистецтва і того, як спільнота живе, мислить і святкує
    example_de: Die Stadt hat ein großes kulturelles Angebot.
    example_en: The city has a great deal to offer culturally.
    example_ru: В городе богатая культурная жизнь.
    example_uk: У місті багате культурне життя.
    note:
      en: 'From A2 die Kultur in the deck `kultur-unterhaltung-a2`, with the stress on the last syllable and a double l that keeps the e short. It covers both halves of the noun at once: das kulturelle Angebot is concerts and exhibitions, while kulturelle Unterschiede are differences in how people live. B1 interkulturell in the deck `gesellschaft-migration-b1` is the second half sharpened, for what happens between two such groups.'
      ru: 'От die Kultur уровня A2 из колоды `kultur-unterhaltung-a2`, ударение на последнем слоге, двойное l держит e кратким. Слово покрывает обе половины исходного существительного сразу: das kulturelle Angebot — концерты и выставки, а kulturelle Unterschiede — различия в укладе жизни. interkulturell уровня B1 из колоды `gesellschaft-migration-b1` заостряет вторую половину: то, что происходит между двумя такими группами.'
      uk: 'Від die Kultur рівня A2 з колоди `kultur-unterhaltung-a2`, наголос на останньому складі, подвійне l тримає e коротким. Слово покриває обидві половини вихідного іменника заразом: das kulturelle Angebot — концерти й виставки, а kulturelle Unterschiede — відмінності в укладі життя. interkulturell рівня B1 з колоди `gesellschaft-migration-b1` загострює другу половину: те, що діється між двома такими спільнотами.'

  - de: historisch
    ipa: "hɪsˈtoːʁɪʃ"
    pos: adj
    cards: recognition
    en: belonging to the past and studied as part of it; also important enough to be remembered later
    ru: принадлежащий прошлому и изучаемый как его часть; а также настолько важный, что запомнится
    uk: що належить минулому і вивчається як його частина; а також настільки важливий, що запам’ятається
    example_de: Der historische Marktplatz wird gerade renoviert.
    example_en: The historic market square is being renovated at the moment.
    example_ru: Исторический рынок сейчас реставрируют.
    example_uk: Історичний ринок саме реставрують.
    note:
      en: 'A loan adjective with the stress on the -to-. The neutral sense simply dates something (die historische Altstadt, ein historischer Roman), while the second weighs it: ein historischer Tag is one people will still name years later. A2 die Geschichte in the deck `schule-faecher-a2` is the noun beside it, and it means both the subject and a story, which is why German says historisch when it wants the subject and nothing else. B1 das Denkmal in the deck `wohnen-gebaeude-b1` is what a town puts up to keep such a day in view.'
      ru: 'Заимствованное прилагательное с ударением на -to-. Нейтральное значение просто датирует (die historische Altstadt, ein historischer Roman), а второе взвешивает: ein historischer Tag — день, который назовут и годы спустя. die Geschichte уровня A2 из колоды `schule-faecher-a2` — существительное рядом, и оно значит и науку, и рассказ, — поэтому, когда нужна именно наука, немецкий берёт historisch. das Denkmal уровня B1 из колоды `wohnen-gebaeude-b1` — то, что город ставит, чтобы такой день не забылся.'
      uk: 'Запозичений прикметник із наголосом на -to-. Нейтральне значення просто датує (die historische Altstadt, ein historischer Roman), а друге зважує: ein historischer Tag — день, який назвуть і роки по тому. die Geschichte рівня A2 з колоди `schule-faecher-a2` — іменник поряд, і він означає і науку, і оповідь, — тому, коли потрібна саме наука, німецька бере historisch. das Denkmal рівня B1 з колоди `wohnen-gebaeude-b1` — те, що місто ставить, аби такий день не забувся.'

  - de: populär
    ipa: "popuˈlɛːɐ̯"
    pos: adj
    cards: recognition
    en: widely liked by a lot of people at once; also pitched so that anybody can follow it
    ru: нравящийся сразу очень многим; а также изложенный так, что понятен любому
    uk: що подобається одразу дуже багатьом; а також викладений так, що зрозумілий будь-кому
    example_de: Diese Sendung ist bei jungen Leuten sehr populär.
    example_en: This programme is very popular with young people.
    example_ru: Эта передача очень популярна у молодёжи.
    example_uk: Ця передача дуже популярна серед молоді.
    note:
      en: 'A Latin loan with the stress on the last syllable and the ä spoken long. Who likes it follows bei plus the dative, never für. A2 beliebt in the deck `charakter-eigenschaften-a2` is the everyday German for the same thing and works for a person as easily as for a song, while this word sounds like a report or a chart. A2 bekannt in the same deck says only that people have heard of it, which is not the same claim. The second sense is what populärwissenschaftlich means: written down to a level anybody can read.'
      ru: 'Латинское заимствование с ударением на последнем слоге и долгим ä. Кому нравится — вводится через bei с дательным, но не через für. beliebt уровня A2 из колоды `charakter-eigenschaften-a2` — обиходное немецкое для того же и годится о человеке так же, как о песне, а это слово звучит как сводка или чарт. bekannt из той же колоды говорит лишь, что о предмете слышали, — утверждение другое. Второе значение и стоит за словом populärwissenschaftlich: изложенный так, что прочтёт любой.'
      uk: 'Латинське запозичення з наголосом на останньому складі й довгим ä. Кому подобається — вводиться через bei з давальним, а не через für. beliebt рівня A2 з колоди `charakter-eigenschaften-a2` — побутове німецьке для того самого і годиться про людину так само, як про пісню, а це слово звучить як зведення чи чарт. bekannt із тієї самої колоди каже лише, що про предмет чули, — твердження інше. Друге значення й стоїть за словом populärwissenschaftlich: викладений так, що прочитає будь-хто.'
