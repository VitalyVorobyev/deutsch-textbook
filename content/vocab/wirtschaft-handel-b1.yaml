# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the economy-and-
# trade field of data/goethe-b1-wortliste.txt: the branches a country's working life
# is divided into, what crosses its borders in each direction, the two lines every
# set of books has, and the words a news item reaches for when a market turns.
# A1's `einkaufen-geschaefte` owns the shop and the transaction (Geschäft, Laden,
# Markt, Kunde, Angebot, kaufen, verkaufen), A1's `schule-arbeit` owns the employer
# seen from a desk (Firma, Chef, Arbeitgeber, Stelle, verdienen), B1's
# `arbeit-bewerbung` owns the workplace as an employer (Betrieb, Arbeitsstelle,
# Lohn), B1's `arbeit-beruf-b1` owns the shop floor and the pay packet (Fabrik,
# Einkommen, Gewerkschaft), B1's `konsum-umwelt` owns making and selling goods
# (Hersteller, produzieren, Produktion, Ware, Marke, Handel, Lieferung), B1's
# `geld-vertraege` owns the paperwork money leaves behind (Kosten, Zahlung, Ausgabe,
# Nachfrage, Anbieter), and B1's `einkaufen-geld-b1` owns the bank counter (Wert,
# Verlust, Zinsen). This deck is the layer above all of them: the economy as a
# newspaper and a Goethe reading text name it from outside, which those seven never
# do.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read off a headline, a report and an annual statement; the learner who has to
# *speak* about their own money or their own job reaches for the A1 or A2 word
# beside it, and that word already ships as a typed card.
id: wirtschaft-handel-b1
title_de: "Wirtschaft und Handel"
title_en: "The economy and trade"
title_ru: "Экономика и торговля"
title_uk: "Економіка та торгівля"
level: B1
entries:
  # --- Die Wirtschaft und ihre Zweige ---
  - de: Wirtschaft
    ipa: "ˈvɪʁtʃaft"
    pos: noun
    gender: f
    plural: "die Wirtschaften"
    cards: recognition
    en: everything a country produces, buys and sells, taken together as one working whole
    ru: всё, что страна производит, покупает и продаёт, взятое вместе как одно работающее целое
    uk: усе, що країна виробляє, купує і продає, узяте разом як одне робоче ціле
    example_de: Die Wirtschaft wächst in diesem Jahr nur langsam.
    example_en: The economy is growing only slowly this year.
    example_ru: Экономика в этом году растёт медленно.
    example_uk: Економіка цього року зростає повільно.
    note:
      en: 'Feminine. In the sense above it has no plural worth using; the plural belongs to the second sense, which is a pub or a small inn and is still alive in the south and in the countryside: In der Wirtschaft am Marktplatz gibt es Mittagstisch. That sense is where die Gastwirtschaft and der Wirt come from, so a village sign and a business page can print one word and mean two different things. The adjective is wirtschaftlich, the school subject is die Volkswirtschaft or die Betriebswirtschaft, and die Landwirtschaft below is one branch of the first sense.'
      ru: 'Женский род. В значении выше множественного, годного к употреблению, у слова нет; множественное принадлежит второму значению — «трактир, харчевня», которое живо на юге и в деревне: In der Wirtschaft am Marktplatz gibt es Mittagstisch. Из этого значения выросли die Gastwirtschaft и der Wirt, так что деревенская вывеска и деловая полоса печатают одно слово, а имеют в виду разное. Прилагательное — wirtschaftlich, учебный предмет — die Volkswirtschaft или die Betriebswirtschaft, а die Landwirtschaft ниже — одна из отраслей первого значения.'
      uk: 'Жіночий рід. У значенні вище множини, придатної до вжитку, слово не має; множина належить другому значенню — «шинок, корчма», яке живе на півдні та на селі: In der Wirtschaft am Marktplatz gibt es Mittagstisch. Із цього значення виросли die Gastwirtschaft і der Wirt, тож сільська вивіска і ділова шпальта друкують одне слово, а мають на увазі різне. Прикметник — wirtschaftlich, навчальний предмет — die Volkswirtschaft або die Betriebswirtschaft, а die Landwirtschaft нижче — одна з галузей першого значення.'

  - de: Industrie
    ipa: "ɪndʊsˈtʁiː"
    pos: noun
    gender: f
    plural: "die Industrien"
    cards: recognition
    en: the making of goods in large quantities by machine, and the firms that live by it
    ru: изготовление товаров машинами в больших количествах и предприятия, которые этим живут
    uk: виготовлення товарів машинами у великих кількостях і підприємства, які цим живуть
    example_de: In dieser Region gibt es kaum noch Industrie.
    example_en: There is hardly any industry left in this region.
    example_ru: В этом регионе промышленности почти не осталось.
    example_uk: У цьому регіоні промисловості майже не лишилося.
    note:
      en: 'Feminine like every noun in -ie, with the stress on that ending; the plural adds -n and is then read as two syllables. As a whole field the word has no plural, and the plural names branches instead: die chemische Industrie, die Automobilindustrie, die Textilindustrie. B1 die Fabrik, in the deck `arbeit-beruf-b1`, is one building with machines in it; Industrie is the whole trade those buildings belong to. Related: der Industriebetrieb, das Industriegebiet on a town plan, and the adjective industriell.'
      ru: 'Женский род, как у всех слов на -ie, ударение на этом окончании; множественное прибавляет -n и читается тогда двумя слогами. Как область в целом слово множественного не имеет, а множественное называет отрасли: die chemische Industrie, die Automobilindustrie, die Textilindustrie. die Fabrik уровня B1 из колоды `arbeit-beruf-b1` — одно здание с машинами внутри; Industrie — вся отрасль, которой такие здания принадлежат. Родственники: der Industriebetrieb, das Industriegebiet на плане города и прилагательное industriell.'
      uk: 'Жіночий рід, як в усіх слів на -ie, наголос на цьому закінченні; множина додає -n і читається тоді двома складами. Як галузь загалом слово множини не має, а множина називає підгалузі: die chemische Industrie, die Automobilindustrie, die Textilindustrie. die Fabrik рівня B1 з колоди `arbeit-beruf-b1` — одна будівля з машинами всередині; Industrie — уся галузь, якій такі будівлі належать. Родичі: der Industriebetrieb, das Industriegebiet на плані міста і прикметник industriell.'

  - de: Landwirtschaft
    ipa: "ˈlantˌvɪʁtʃaft"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the growing of crops and the keeping of animals, taken as a trade and a branch of the economy
    ru: возделывание земли и содержание скота, взятые как ремесло и отрасль хозяйства
    uk: обробіток землі й утримання худоби, узяті як ремесло і галузь господарства
    example_de: In der Landwirtschaft arbeiten immer weniger Menschen.
    example_en: Fewer and fewer people work in agriculture.
    example_ru: В сельском хозяйстве работает всё меньше людей.
    example_uk: У сільському господарстві працює дедалі менше людей.
    note:
      en: 'das Land plus die Wirtschaft above, with Wirtschaft in its economic sense: the branch that works the land. Used without a plural. The person is der Landwirt or die Landwirtin, which is the word on a form, while B1 der Bauer, in the deck `berufe-b1`, is the same job in everyday German. The adjective is landwirtschaftlich, and der landwirtschaftliche Betrieb is what an official text calls a farm. Primary stress on Land-, and the d is devoiced to t before the seam.'
      ru: 'das Land плюс die Wirtschaft выше, причём Wirtschaft здесь в хозяйственном значении: отрасль, которая работает с землёй. Множественного не имеет. Человек — der Landwirt или die Landwirtin: так пишут в анкете, тогда как der Bauer уровня B1 из колоды `berufe-b1` — та же работа обиходным словом. Прилагательное — landwirtschaftlich, а der landwirtschaftliche Betrieb — то, как официальный текст называет хозяйство. Главное ударение на Land-, а d перед швом оглушается в t.'
      uk: 'das Land плюс die Wirtschaft вище, причому Wirtschaft тут у господарському значенні: галузь, яка працює із землею. Множини не має. Людина — der Landwirt або die Landwirtin: так пишуть в анкеті, тоді як der Bauer рівня B1 з колоди `berufe-b1` — та сама робота побутовим словом. Прикметник — landwirtschaftlich, а der landwirtschaftliche Betrieb — те, як офіційний текст називає господарство. Головний наголос на Land-, а d перед швом оглушується в t.'

  - de: Werk
    ipa: "ˈvɛʁk"
    pos: noun
    gender: n
    plural: "die Werke"
    cards: recognition
    en: a large factory site taken as a whole; also what an artist or a writer has made
    ru: крупная заводская площадка, взятая целиком; а также то, что создал художник или писатель
    uk: велика заводська площадка, узята цілком; а також те, що створив митець або письменник
    example_de: Im Werk in Wolfsburg arbeiten mehrere tausend Menschen.
    example_en: Several thousand people work at the plant in Wolfsburg.
    example_ru: На заводе в Вольфсбурге работают несколько тысяч человек.
    example_uk: На заводі у Вольфсбурзі працюють кілька тисяч людей.
    note:
      en: 'Neuter, plural in -e. The industrial sense is the German-rooted one and lives largely in compounds: das Stahlwerk, das Kraftwerk, das Wasserwerk, and die Werkstatt for a small workshop. B1 die Fabrik, in the deck `arbeit-beruf-b1`, is the neutral word for the building; ein Werk is the site a company names in its own reports. The second sense is what somebody made — die Werke Goethes, ein Werk von Bach — and a third is the mechanism inside a clock, das Uhrwerk.'
      ru: 'Средний род, множественное на -e. Промышленное значение — исконно немецкое и живёт прежде всего в сложных словах: das Stahlwerk, das Kraftwerk, das Wasserwerk, а die Werkstatt — небольшая мастерская. die Fabrik уровня B1 из колоды `arbeit-beruf-b1` — нейтральное слово для здания; ein Werk — площадка, которую фирма называет так в собственных отчётах. Второе значение — созданное кем-то: die Werke Goethes, ein Werk von Bach; третье — механизм внутри часов, das Uhrwerk.'
      uk: 'Середній рід, множина на -e. Промислове значення — питомо німецьке і живе передусім у складних словах: das Stahlwerk, das Kraftwerk, das Wasserwerk, а die Werkstatt — невелика майстерня. die Fabrik рівня B1 з колоди `arbeit-beruf-b1` — нейтральне слово для будівлі; ein Werk — площадка, яку фірма називає так у власних звітах. Друге значення — створене кимось: die Werke Goethes, ein Werk von Bach; третє — механізм усередині годинника, das Uhrwerk.'

  - de: Sitz
    ipa: "ˈzɪts"
    pos: noun
    gender: m
    plural: "die Sitze"
    cards: recognition
    en: the place a company or an organization is officially based; also a seat to sit on, or one won in a parliament
    ru: место, где официально находится фирма или организация; а также сиденье, на котором сидят, или место, полученное в парламенте
    uk: місце, де офіційно перебуває фірма чи організація; а також сидіння, на якому сидять, або місце, здобуте в парламенті
    example_de: Die Firma hat ihren Sitz in Hamburg.
    example_en: The company is based in Hamburg.
    example_ru: Головной офис фирмы находится в Гамбурге.
    example_uk: Головний офіс фірми міститься в Гамбурзі.
    note:
      en: 'From sitzen, masculine, plural in -e. The official sense is the one an imprint and a contract use, der Firmensitz, der Hauptsitz, der Sitz der Regierung, and mit Sitz in Berlin is fixed. The concrete sense is the piece of furniture itself, der Beifahrersitz, ein Auto mit fünf Sitzen; A1 der Platz, in the deck `stadt-wege`, is the seat you take rather than the thing you sit on. In politics a Sitz is a seat won: Die Partei verlor zehn Sitze.'
      ru: 'От sitzen, мужской род, множественное на -e. Официальное значение — то, каким пользуются выходные данные и договор: der Firmensitz, der Hauptsitz, der Sitz der Regierung, а mit Sitz in Berlin — устойчивый оборот. Вещественное значение — сам предмет мебели: der Beifahrersitz, ein Auto mit fünf Sitzen; der Platz уровня A1 из колоды `stadt-wege` — место, которое занимают, а не предмет, на котором сидят. В политике Sitz — полученный мандат: Die Partei verlor zehn Sitze.'
      uk: 'Від sitzen, чоловічий рід, множина на -e. Офіційне значення — те, яким послуговуються вихідні дані й договір: der Firmensitz, der Hauptsitz, der Sitz der Regierung, а mit Sitz in Berlin — усталений зворот. Речовинне значення — сам предмет меблів: der Beifahrersitz, ein Auto mit fünf Sitzen; der Platz рівня A1 з колоди `stadt-wege` — місце, яке займають, а не предмет, на якому сидять. У політиці Sitz — здобутий мандат: Die Partei verlor zehn Sitze.'

  # --- Über die Grenze ---
  - de: Export
    ipa: "ɛksˈpɔʁt"
    pos: noun
    gender: m
    plural: "die Exporte"
    cards: recognition
    en: the selling of goods abroad as a trade, and the goods that leave the country
    ru: продажа товаров за границу как занятие и сами товары, которые уходят из страны
    uk: продаж товарів за кордон як заняття і самі товари, які йдуть із країни
    example_de: Der Export ist im letzten Jahr deutlich gestiegen.
    example_en: Exports rose considerably last year.
    example_ru: Экспорт в прошлом году заметно вырос.
    example_uk: Експорт торік помітно зріс.
    note:
      en: 'Masculine, plural in -e. Watch the stress: dictionaries put it on the last syllable, ex-PORT, in step with the verb exportieren — while the mirror noun Import below keeps it on the first, so the pair does not sound alike. Taken as an activity the noun is uncountable, der Export von Autos; the plural names shipments or figures, die Exporte nach China. Compounds: das Exportland, die Exportware. Its mirror image Import follows below, and the two together make die Handelsbilanz.'
      ru: 'Мужской род, множественное на -e. Следите за ударением: словари ставят его на последний слог, ex-PORT, в лад с глаголом exportieren, — а зеркальный Import ниже держит ударение на первом, так что пара на слух не совпадает. Как занятие слово неисчисляемо, der Export von Autos; множественное называет поставки или цифры, die Exporte nach China. Сложные слова: das Exportland, die Exportware. Зеркальный Import идёт ниже, а вдвоём они составляют die Handelsbilanz.'
      uk: 'Чоловічий рід, множина на -e. Пильнуйте наголос: словники ставлять його на останній склад, ex-PORT, у лад із дієсловом exportieren, — а дзеркальний Import нижче тримає наголос на першому, тож пара на слух не збігається. Як заняття слово незлічуване, der Export von Autos; множина називає постачання або цифри, die Exporte nach China. Складні слова: das Exportland, die Exportware. Дзеркальний Import іде нижче, а вдвох вони складають die Handelsbilanz.'

  - de: Import
    ipa: "ˈɪmpɔʁt"
    pos: noun
    gender: m
    plural: "die Importe"
    cards: recognition
    en: the buying in of goods from abroad as a trade, and the goods that arrive
    ru: закупка товаров за границей как занятие и сами приходящие товары
    uk: закупівля товарів за кордоном як заняття і самі товари, що надходять
    example_de: Der Import von Gas wurde deutlich teurer.
    example_en: Importing gas became considerably more expensive.
    example_ru: Импорт газа заметно подорожал.
    example_uk: Імпорт газу помітно подорожчав.
    note:
      en: 'Everything formal in the note on Export above holds here too and is not repeated. What this word adds is the direction and the phrasing that comes with it: goods arrive aus einem Land or von einem Hersteller, and the verb importieren again carries its stress on -tie-. Where a text names both, German puts them in this order, Import und Export, and the older native pair is Ein- und Ausfuhr. The firm that does it is der Importeur, stressed on the last syllable.'
      ru: 'Всё формальное из заметки к Export выше действует и здесь и не повторяется. Это слово добавляет направление и связанную с ним конструкцию: товары приходят aus einem Land или von einem Hersteller, а глагол importieren снова несёт ударение на -tie-. Там, где текст называет оба, немецкий ставит их в таком порядке: Import und Export, — а старая пара своих слов — Ein- und Ausfuhr. Фирма, которая этим занимается, — der Importeur, с ударением на последнем слоге.'
      uk: 'Усе формальне із замітки до Export вище діє і тут і не повторюється. Це слово додає напрямок і пов''язану з ним конструкцію: товари надходять aus einem Land або von einem Hersteller, а дієслово importieren знову несе наголос на -tie-. Там, де текст називає обидва, німецька ставить їх у такому порядку: Import und Export, — а давня пара своїх слів — Ein- und Ausfuhr. Фірма, що цим займається, — der Importeur, з наголосом на останньому складі.'

  - de: global
    ipa: "gloˈbaːl"
    pos: adj
    cards: recognition
    en: reaching the whole world at once, and treating it as one connected place
    ru: охватывающий сразу весь мир и рассматривающий его как единое связанное целое
    uk: що охоплює одразу весь світ і розглядає його як єдине пов'язане ціле
    example_de: Das ist längst ein globales Problem.
    example_en: That has long been a global problem.
    example_ru: Это давно уже мировая проблема.
    example_uk: Це давно вже світова проблема.
    note:
      en: 'Ordinary endings, stress on the last syllable. It belongs to reports and headlines — die globale Erwärmung, der globale Markt, global denken — and it carries the extra idea that the parts hang together, which is what die Globalisierung is built on. Beside it weltweit below says the same size in native German words and is the plainer choice. An older second sense is rough or all-in: eine globale Schätzung is a ballpark figure.'
      ru: 'Окончания обычные, ударение на последнем слоге. Слово принадлежит отчётам и заголовкам: die globale Erwärmung, der globale Markt, global denken, — и несёт добавочную мысль, что части связаны между собой; на ней и построена die Globalisierung. Рядом weltweit ниже называет тот же размах своими немецкими словами и звучит проще. Старое второе значение — «приблизительный, общий»: eine globale Schätzung — прикидка на глаз.'
      uk: 'Закінчення звичайні, наголос на останньому складі. Слово належить звітам і заголовкам: die globale Erwärmung, der globale Markt, global denken, — і несе додаткову думку, що частини пов''язані між собою; на ній і побудована die Globalisierung. Поряд weltweit нижче називає той самий розмах своїми німецькими словами і звучить простіше. Давнє друге значення — «приблизний, загальний»: eine globale Schätzung — прикидка на око.'

  - de: weltweit
    ipa: "ˈvɛltˌvaɪ̯t"
    pos: adj
    cards: recognition
    en: happening in or found in every part of the world
    ru: происходящий или встречающийся во всех частях света
    uk: що відбувається або трапляється в усіх частинах світу
    example_de: Das Unternehmen ist weltweit tätig.
    example_en: The company operates worldwide.
    example_ru: Компания работает по всему миру.
    example_uk: Компанія працює по всьому світу.
    note:
      en: 'A2 die Welt, in the deck `natur-tiere-a2`, plus weit. It works in front of a noun with ordinary endings, der weltweite Handel, and unchanged as an adverb, weltweit bekannt, weltweit tätig. This is the native-built half of the pair with global above: the two name the same size, and what separates them is the register of the text, so an advert and a news bulletin say weltweit where an analysis says global. Primary stress on Welt-.'
      ru: 'die Welt уровня A2 из колоды `natur-tiere-a2` плюс weit. Перед существительным берёт обычные окончания, der weltweite Handel, а как наречие не меняется: weltweit bekannt, weltweit tätig. Это своя, немецкая половина пары с global выше: размах у них один, а разводит их регистр текста, так что реклама и выпуск новостей скажут weltweit там, где аналитическая статья скажет global. Главное ударение на Welt-.'
      uk: 'die Welt рівня A2 з колоди `natur-tiere-a2` плюс weit. Перед іменником бере звичайні закінчення, der weltweite Handel, а як прислівник не змінюється: weltweit bekannt, weltweit tätig. Це своя, німецька половина пари з global вище: розмах у них один, а розводить їх регістр тексту, тож реклама і випуск новин скажуть weltweit там, де аналітична стаття скаже global. Головний наголос на Welt-.'

  # --- Geld herein, Geld hinaus ---
  - de: Einnahme
    ipa: "ˈaɪ̯nˌnaːmə"
    pos: noun
    gender: f
    plural: "die Einnahmen"
    cards: recognition
    en: money that comes in over a period of time, as a set of books records it
    ru: деньги, поступающие за некоторый срок, — так, как их записывает бухгалтерия
    uk: гроші, що надходять за певний строк, — так, як їх записує бухгалтерія
    example_de: Die Einnahmen aus dem Verkauf waren höher als erwartet.
    example_en: The income from the sale was higher than expected.
    example_ru: Поступления от продажи оказались выше ожидаемых.
    example_uk: Надходження від продажу виявилися вищими за очікувані.
    note:
      en: 'The noun to einnehmen below. Feminine, and almost every text uses the plural, above all in the fixed pair Einnahmen und Ausgaben, with B1 die Ausgabe from the deck `geld-vertraege`. The singular belongs to the other senses of the verb: die Einnahme des Medikaments on a package insert, die Einnahme der Stadt in a history book. Do not confuse it with der Umsatz, which is everything that came in before costs, or with der Gewinn below, which is what is left afterwards. Primary stress on Ein-.'
      ru: 'Существительное к einnehmen ниже. Женский род, и почти любой текст берёт множественное, прежде всего в устойчивой паре Einnahmen und Ausgaben — с die Ausgabe уровня B1 из колоды `geld-vertraege`. Единственное принадлежит другим значениям глагола: die Einnahme des Medikaments во вкладыше к лекарству, die Einnahme der Stadt в книге по истории. Не путайте с der Umsatz — это всё поступившее до вычета расходов, — и с der Gewinn ниже, который остаётся после них. Главное ударение на Ein-.'
      uk: 'Іменник до einnehmen нижче. Жіночий рід, і майже будь-який текст бере множину, передусім в усталеній парі Einnahmen und Ausgaben — з die Ausgabe рівня B1 з колоди `geld-vertraege`. Однина належить іншим значенням дієслова: die Einnahme des Medikaments у вкладці до ліків, die Einnahme der Stadt у книжці з історії. Не плутайте з der Umsatz — це все, що надійшло до відрахування витрат, — і з der Gewinn нижче, який лишається після них. Головний наголос на Ein-.'

  - de: einnehmen
    ipa: "ˈaɪ̯nˌneːmən"
    pos: verb
    praesens_3sg: nimmt ein
    partizip2: eingenommen
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to take money in from what one sells; also to take a medicine as prescribed, and to take up a place or a position
    ru: получать деньги с проданного; а также принимать лекарство по назначению и занимать место или положение
    uk: одержувати гроші з проданого; а також приймати ліки за призначенням і посідати місце чи становище
    example_de: Der Verein hat am Wochenende über tausend Euro eingenommen.
    example_en: The club took in more than a thousand euros over the weekend.
    example_ru: За выходные клуб выручил больше тысячи евро.
    example_uk: За вихідні клуб виторгував понад тисячу євро.
    note:
      en: 'Separable and strong like nehmen: nimmt ein, hat eingenommen. Three of its senses are worth having at B1, and they belong to three different texts. Money coming in is the accounting one and the one this deck is about. A medicine taken as prescribed is what a Beipackzettel says, Nehmen Sie die Tabletten dreimal täglich ein. And a place taken up is the figurative one, einen Platz einnehmen, eine wichtige Stellung einnehmen. A fourth belongs to war reports, eine Stadt einnehmen. The noun for the first three is die Einnahme above.'
      ru: 'Отделяемый и сильный, как nehmen: nimmt ein, hat eingenommen. Три его значения стоит иметь на уровне B1, и принадлежат они трём разным текстам. Поступление денег — бухгалтерское, и о нём эта колода. Приём лекарства по назначению — то, что пишет вкладыш: Nehmen Sie die Tabletten dreimal täglich ein. Занятие места — переносное: einen Platz einnehmen, eine wichtige Stellung einnehmen. Четвёртое принадлежит военным сводкам: eine Stadt einnehmen. Существительное для первых трёх — die Einnahme выше.'
      uk: 'Відокремлюване і сильне, як nehmen: nimmt ein, hat eingenommen. Три його значення варто мати на рівні B1, і належать вони трьом різним текстам. Надходження грошей — бухгалтерське, і про нього ця колода. Приймання ліків за призначенням — те, що пише вкладка: Nehmen Sie die Tabletten dreimal täglich ein. Посідання місця — переносне: einen Platz einnehmen, eine wichtige Stellung einnehmen. Четверте належить воєнним зведенням: eine Stadt einnehmen. Іменник для перших трьох — die Einnahme вище.'

  - de: Gewinn
    ipa: "gəˈvɪn"
    pos: noun
    gender: m
    plural: "die Gewinne"
    cards: recognition
    en: what a business has left once everything it spent has been taken off; also a prize won in a game or a draw
    ru: то, что остаётся у предприятия после вычета всех расходов; а также выигрыш в игре или лотерее
    uk: те, що лишається в підприємства після відрахування всіх витрат; а також виграш у грі чи лотереї
    example_de: Die Firma hat den Gewinn im letzten Jahr verdoppelt.
    example_en: The company doubled its profit last year.
    example_ru: В прошлом году фирма удвоила прибыль.
    example_uk: Торік фірма подвоїла прибуток.
    note:
      en: 'From A2 gewinnen, in the deck `sport-freizeit-a2`. Masculine, plural in -e. In business it is what remains after costs, and its opposite is B1 der Verlust in the deck `einkaufen-geld-b1`: Gewinn machen, mit Gewinn verkaufen, and beside it der Umsatz names the money that came in before anything was deducted. The prize sense is the everyday one, der Hauptgewinn im Lotto. A third use praises anything worth having: Das Buch ist ein echter Gewinn.'
      ru: 'От gewinnen уровня A2 из колоды `sport-freizeit-a2`. Мужской род, множественное на -e. В деле это то, что остаётся после расходов, а противоположность — der Verlust уровня B1 из колоды `einkaufen-geld-b1`: Gewinn machen, mit Gewinn verkaufen; рядом der Umsatz называет всё поступившее до вычетов. Значение выигрыша обиходно: der Hauptgewinn im Lotto. Третье употребление хвалит всё стоящее: Das Buch ist ein echter Gewinn.'
      uk: 'Від gewinnen рівня A2 з колоди `sport-freizeit-a2`. Чоловічий рід, множина на -e. У справі це те, що лишається після витрат, а протилежність — der Verlust рівня B1 з колоди `einkaufen-geld-b1`: Gewinn machen, mit Gewinn verkaufen; поряд der Umsatz називає все, що надійшло до відрахувань. Значення виграшу побутове: der Hauptgewinn im Lotto. Третє вживання хвалить усе вартісне: Das Buch ist ein echter Gewinn.'

  - de: finanzieren
    ipa: "finanˈtsiːʁən"
    pos: verb
    praesens_3sg: finanziert
    partizip2: finanziert
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to provide the money a plan needs, so that it can actually go ahead
    ru: давать деньги, нужные замыслу, чтобы он действительно осуществился
    uk: давати гроші, потрібні задумові, щоб він справді здійснився
    example_de: Wer finanziert eigentlich den neuen Bahnhof?
    example_en: Who is actually paying for the new station?
    example_ru: А кто, собственно, финансирует новый вокзал?
    example_uk: А хто, власне, фінансує новий вокзал?
    note:
      en: 'A verb in -ieren, so no ge- in the participle: hat finanziert. The subject is whoever pays and the object is the thing paid for; where the money comes from is added with aus or durch, aus Steuern finanziert, durch Werbung finanziert. A1 bezahlen names a single act of paying, while this verb names carrying the whole cost over time. The noun is die Finanzierung, the plural die Finanzen is a budget, and stress falls on -zie-.'
      ru: 'Глагол на -ieren, поэтому в причастии нет ge-: hat finanziert. Подлежащее — тот, кто платит, дополнение — то, за что платят; источник денег вводится через aus или durch: aus Steuern finanziert, durch Werbung finanziert. bezahlen уровня A1 называет один акт оплаты, а этот глагол — несение всех расходов на протяжении времени. Существительное — die Finanzierung, множественное die Finanzen — бюджет, ударение падает на -zie-.'
      uk: 'Дієслово на -ieren, тому в дієприкметнику немає ge-: hat finanziert. Підмет — той, хто платить, додаток — те, за що платять; джерело грошей уводиться через aus або durch: aus Steuern finanziert, durch Werbung finanziert. bezahlen рівня A1 називає один акт оплати, а це дієслово — несення всіх витрат протягом часу. Іменник — die Finanzierung, множина die Finanzen — бюджет, наголос падає на -zie-.'

  # --- Wettbewerb, Krise, Trend ---
  - de: Konkurrenz
    ipa: "kɔŋkʊˈʁɛnts"
    pos: noun
    gender: f
    plural: "die Konkurrenzen"
    cards: recognition
    en: the struggle between firms that want the same customers, and those rival firms taken together as one body
    ru: борьба между фирмами, которым нужны одни и те же покупатели, и сами эти соперники, взятые как одно целое
    uk: боротьба між фірмами, яким потрібні ті самі покупці, і самі ці суперники, узяті як одне ціле
    example_de: Die Konkurrenz ist in dieser Branche sehr groß.
    example_en: Competition is very strong in this sector.
    example_ru: Конкуренция в этой отрасли очень высока.
    example_uk: Конкуренція в цій галузі дуже висока.
    note:
      en: 'Feminine, and it does two jobs at once: the competing itself, die Konkurrenz zwischen den Anbietern, and the competitors as a body, Die Konkurrenz schläft nicht, where the verb is singular because the word is. The plural is rare and belongs to sport, where eine Konkurrenz is one event of a meeting. Chunks: in Konkurrenz stehen, jemandem Konkurrenz machen. The adjective konkurrenzfähig means able to hold its own, and the plain German word for the whole idea is der Wettbewerb.'
      ru: 'Женский род, и слово делает сразу две работы: само соперничество, die Konkurrenz zwischen den Anbietern, и соперники как одно целое, Die Konkurrenz schläft nicht, — где глагол в единственном, потому что в единственном само слово. Множественное редко и принадлежит спорту: eine Konkurrenz — отдельный вид на соревнованиях. Обороты: in Konkurrenz stehen, jemandem Konkurrenz machen. Прилагательное konkurrenzfähig значит «способный тягаться», а своё немецкое слово для всей идеи — der Wettbewerb.'
      uk: 'Жіночий рід, і слово робить одразу дві роботи: саме суперництво, die Konkurrenz zwischen den Anbietern, і суперники як одне ціле, Die Konkurrenz schläft nicht, — де дієслово в однині, бо в однині саме слово. Множина рідкісна і належить спортові: eine Konkurrenz — окремий вид на змаганнях. Звороти: in Konkurrenz stehen, jemandem Konkurrenz machen. Прикметник konkurrenzfähig означає «здатний змагатися», а своє німецьке слово для всієї ідеї — der Wettbewerb.'

  - de: Krise
    ipa: "ˈkʁiːzə"
    pos: noun
    gender: f
    plural: "die Krisen"
    cards: recognition
    en: a stretch of time in which a bad situation gets worse and a decision can no longer be put off
    ru: полоса времени, когда плохое положение становится хуже и решение больше нельзя откладывать
    uk: смуга часу, коли погане становище гіршає і рішення більше не можна відкладати
    example_de: Viele kleine Betriebe haben die Krise nicht überstanden.
    example_en: Many small businesses did not survive the crisis.
    example_ru: Многие маленькие предприятия кризиса не пережили.
    example_uk: Багато малих підприємств кризи не пережили.
    note:
      en: 'Feminine, plural in -n, stress on a long i in the first syllable. The word is not reserved for money: die Wirtschaftskrise and die Finanzkrise stand beside die Klimakrise, eine Krise in der Ehe and die Lebenskrise, which is a personal crisis and not an economic one. Related: krisenfest for something that holds up, das Krisengebiet for a region at war. It says more than das Problem, because a Krise threatens to change what comes after it.'
      ru: 'Женский род, множественное на -n, ударение на долгом i в первом слоге. Слово не закреплено за деньгами: die Wirtschaftskrise и die Finanzkrise стоят рядом с die Klimakrise, eine Krise in der Ehe и die Lebenskrise — личный, а не хозяйственный кризис. Родственники: krisenfest — устойчивый к потрясениям, das Krisengebiet — район бедствия или войны. Слово говорит больше, чем das Problem: Krise грозит изменить то, что будет после неё.'
      uk: 'Жіночий рід, множина на -n, наголос на довгому i в першому складі. Слово не закріплене за грішми: die Wirtschaftskrise і die Finanzkrise стоять поряд із die Klimakrise, eine Krise in der Ehe і die Lebenskrise — особиста, а не господарська криза. Родичі: krisenfest — стійкий до потрясінь, das Krisengebiet — район лиха або війни. Слово каже більше, ніж das Problem: Krise загрожує змінити те, що буде після неї.'

  - de: Trend
    ipa: "ˈtʁɛnt"
    pos: noun
    gender: m
    plural: "die Trends"
    cards: recognition
    en: the direction something has been moving in over a period; in speech also whatever is in fashion at the moment
    ru: направление, в котором что-либо движется на протяжении времени; в речи — ещё и то, что сейчас в моде
    uk: напрямок, у якому щось рухається протягом часу; у мовленні — ще й те, що зараз у моді
    example_de: Der Trend geht klar zu kleineren Wohnungen.
    example_en: The trend is clearly towards smaller flats.
    example_ru: Тенденция явно идёт к квартирам поменьше.
    example_uk: Тенденція явно йде до менших квартир.
    note:
      en: 'Masculine, plural in -s. The report sense is the one to hold, and it comes with a frame worth learning whole: der Trend geht zu plus the dative, which is how a statistic is turned into a sentence. The fashion sense gives im Trend liegen and der Trendsetter. Keep it apart from A2 die Mode, which is the fashion itself; a Trend is the direction things are heading in. The t is followed by the uvular r, and the final d is devoiced to t.'
      ru: 'Мужской род, множественное на -s. Держать стоит значение отчёта, и оно приходит с рамкой, которую учат целиком: der Trend geht zu с дательным — так цифру превращают в предложение. Значение моды даёт im Trend liegen и der Trendsetter. Не смешивайте с die Mode уровня A2: это сама мода, а Trend — направление, в котором вещи движутся. За t идёт увулярное r, а конечное d оглушается в t.'
      uk: 'Чоловічий рід, множина на -s. Тримати варто значення звіту, і воно приходить із рамкою, яку вчать цілком: der Trend geht zu з давальним — так цифру перетворюють на речення. Значення моди дає im Trend liegen і der Trendsetter. Не змішуйте з die Mode рівня A2: це сама мода, а Trend — напрямок, у якому речі рухаються. За t іде увулярне r, а кінцеве d оглушується в t.'

  - de: Eröffnung
    ipa: "ɛɐ̯ˈʔœfnʊŋ"
    pos: noun
    gender: f
    plural: "die Eröffnungen"
    cards: recognition
    en: the act of opening something for the very first time, and the event held to mark it
    ru: открытие чего-либо в самый первый раз и торжество, которым это отмечают
    uk: відкриття чогось уперше і врочистість, якою це відзначають
    example_de: Zur Eröffnung des Museums kamen hunderte Gäste.
    example_en: Hundreds of guests came to the opening of the museum.
    example_ru: На открытие музея пришли сотни гостей.
    example_uk: На відкриття музею прийшли сотні гостей.
    note:
      en: 'The noun to B1 eröffnen in the deck `verben-handlungen-b1-2`, and every noun in -ung is feminine. It is not A1 öffnen: a shop öffnet every morning at nine, but it wird eröffnet exactly once, and the sign for that day reads Neueröffnung. Beyond business the word covers an account, die Kontoeröffnung, and a formal proceeding, die Eröffnung der Sitzung. Note the seam in the sound: a glottal stop separates the prefix from the stem, so it is er-öffnung and not e-röffnung.'
      ru: 'Существительное к eröffnen уровня B1 из колоды `verben-handlungen-b1-2`, а всякое слово на -ung женского рода. Это не öffnen уровня A1: магазин öffnet каждое утро в девять, но wird eröffnet ровно один раз, и вывеска того дня читается Neueröffnung. За пределами торговли слово покрывает счёт, die Kontoeröffnung, и официальное заседание, die Eröffnung der Sitzung. Обратите внимание на шов в звучании: приставку от корня отделяет гортанная смычка, так что это er-öffnung, а не e-röffnung.'
      uk: 'Іменник до eröffnen рівня B1 з колоди `verben-handlungen-b1-2`, а кожне слово на -ung жіночого роду. Це не öffnen рівня A1: крамниця öffnet щоранку о дев''ятій, але wird eröffnet рівно один раз, і вивіска того дня читається Neueröffnung. Поза торгівлею слово покриває рахунок, die Kontoeröffnung, і офіційне засідання, die Eröffnung der Sitzung. Зверніть увагу на шов у звучанні: префікс від кореня відділяє гортанний зимкнений, тож це er-öffnung, а не e-röffnung.'

  - de: besetzen
    ipa: "bəˈzɛtsn̩"
    pos: verb
    praesens_3sg: besetzt
    partizip2: besetzt
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: 'to fill a place so that nobody else can have it: a seat, a post or a whole country'
    ru: 'занять место так, чтобы оно не досталось никому другому: сиденье, должность или целую страну'
    uk: 'зайняти місце так, щоб воно не дісталося нікому іншому: сидіння, посаду або цілу країну'
    example_de: Die Stelle ist leider schon besetzt.
    example_en: Unfortunately the position has already been filled.
    example_ru: Место, к сожалению, уже занято.
    example_uk: Місце, на жаль, уже зайняте.
    note:
      en: 'Inseparable, so the participle has no ge-: hat besetzt. One verb covers three fields, and German asks for no other: a seat somebody has taken, a post that gets filled, eine Stelle besetzen, and a country an army holds, ein Land besetzen. Its participle has long since become an adjective the learner already meets on a telephone and a train door, A2 besetzt in the deck `reisen-verkehr`, where it simply means taken or engaged. Two nouns divide the work: die Besetzung is the cast of a play, die Besatzung the occupying troops.'
      ru: 'Неотделяемый, поэтому в причастии нет ge-: hat besetzt. Один глагол покрывает три поля, и другого немецкий не просит: занятое кем-то сиденье, замещаемая должность — eine Stelle besetzen — и страна, удерживаемая войском, — ein Land besetzen. Его причастие давно стало прилагательным, которое учащийся уже встречает на телефоне и на двери вагона: besetzt уровня A2 из колоды `reisen-verkehr`, где оно значит просто «занято». Работу делят два существительных: die Besetzung — состав исполнителей в спектакле, die Besatzung — оккупационные войска.'
      uk: 'Невідокремлюване, тому в дієприкметнику немає ge-: hat besetzt. Одне дієслово покриває три поля, і іншого німецька не просить: зайняте кимось сидіння, заміщувана посада — eine Stelle besetzen — і країна, яку утримує військо, — ein Land besetzen. Його дієприкметник давно став прикметником, який учень уже зустрічає на телефоні та на дверях вагона: besetzt рівня A2 з колоди `reisen-verkehr`, де воно означає просто «зайнято». Роботу ділять два іменники: die Besetzung — склад виконавців у виставі, die Besatzung — окупаційне військо.'

  - de: Lager
    ipa: "ˈlaːgɐ"
    pos: noun
    gender: n
    plural: "die Lager"
    cards: recognition
    en: a place where goods are kept until they are needed; also a camp people live in for a while, and a side in a dispute
    ru: помещение, где товар держат до надобности; а также лагерь, в котором какое-то время живут, и сторона в споре
    uk: приміщення, де товар тримають до потреби; а також табір, у якому якийсь час живуть, і сторона у спорі
    example_de: Der Artikel ist leider nicht mehr auf Lager.
    example_en: Unfortunately the item is no longer in stock.
    example_ru: Товара, к сожалению, больше нет на складе.
    example_uk: Товару, на жаль, більше немає на складі.
    note:
      en: 'Neuter, and singular and plural are spelled alike. The trade sense runs on two chunks, etwas auf Lager haben and etwas ist auf Lager, and it gives das Lagerhaus, der Lagerbestand and the verb lagern. The camp sense is a separate word history and takes its own compounds: das Ferienlager, das Zeltlager, das Flüchtlingslager. A third, figurative sense splits people into sides, Die Partei zerfiel in zwei Lager, and a fourth is technical, das Kugellager in a machine.'
      ru: 'Средний род, единственное и множественное пишутся одинаково. Торговое значение держится на двух оборотах: etwas auf Lager haben и etwas ist auf Lager, — и даёт das Lagerhaus, der Lagerbestand и глагол lagern. Лагерное значение — отдельная история слова, и у него свои сложные слова: das Ferienlager, das Zeltlager, das Flüchtlingslager. Третье, переносное значение делит людей на стороны: Die Partei zerfiel in zwei Lager. Четвёртое техническое: das Kugellager — подшипник в машине.'
      uk: 'Середній рід, однина і множина пишуться однаково. Торгове значення тримається на двох зворотах: etwas auf Lager haben і etwas ist auf Lager, — і дає das Lagerhaus, der Lagerbestand та дієслово lagern. Табірне значення — окрема історія слова, і в нього свої складні слова: das Ferienlager, das Zeltlager, das Flüchtlingslager. Третє, переносне значення ділить людей на боки: Die Partei zerfiel in zwei Lager. Четверте технічне: das Kugellager — підшипник у машині.'
