id: gesellschaft-zusammenleben
title_de: "Gesellschaft & Zusammenleben"
title_en: "Society & living together"
title_ru: "Общество и совместная жизнь"
title_uk: "Суспільство та спільне життя"
level: B1
# The unit is one Hausversammlung about what to do with the shared Hof, so the
# deck is the vocabulary of that room: the yard itself, the meeting, and the
# moves of agreeing and disagreeing in it.
#
# Two constraints shaped the headword list and are worth stating once.
#
# 1. Ten of the twenty words the unit's brief names as core are already owned
#    by shipped decks and are RECYCLED here, not re-taught (the validator
#    hard-fails a headword living in two decks): Kompromiss, Rücksicht, sich
#    einigen, ablehnen, einverstanden (regeln-verantwortung, B1.7); zustimmen,
#    überzeugen (meinung-medien, B1.5); Vorschlag, Lösung (nebensaetze-plaene,
#    A2); vorschlagen (infinitiv-mit-zu, A2). Their slots are filled by the
#    neighbour this unit genuinely adds — die Zustimmung beside zustimmen,
#    anschließen beside einverstanden, überreden beside überzeugen.
# 2. Every headword is a Goethe-B1 Wortliste word except four, checked with
#    `bun scripts/coverage.ts B1 --check-deck content/vocab/gesellschaft-zusammenleben.yaml`
#    (8 of the 9 shipped B1 unit decks are manifest-clean; meinung-medien
#    carries eleven exceptions of the same kind). The four here: Einwand and
#    Meinungsverschiedenheit are named in the unit's own frozen atlas outcomes
#    (`einwand-ausdruecken`, and "bei einer Meinungsverschiedenheit" in
#    `kompromiss-vorschlagen`), so the article cannot avoid them; nachgeben and
#    gegenseitig are the two words of the brief's obligatory core that are
#    neither owned elsewhere nor in the manifest, and the mission — resolve a
#    disagreement — has no substitute for either.
entries:
  # --- Core (cards: both by default) --------------------------------------
  # The words the unit actively teaches and asks the learner to produce.

  - de: "Versammlung"
    ipa: "fɛɐ̯ˈzamlʊŋ"
    pos: noun
    gender: f
    plural: "die Versammlungen"
    en: "meeting, assembly"
    ru: "собрание"
    uk: "збори"
    example_de: "Auf der Versammlung geht es diesmal nur um den Hof."
    example_en: "At the meeting this time it is only about the courtyard."
    example_ru: "На собрании на этот раз речь пойдёт только о дворе."
    example_uk: "На зборах цього разу йтиметься лише про двір."
    note:
      en: "A gathering called for a purpose and with an agenda: eine Versammlung einberufen. From versammeln, to bring people together. das Treffen is simply seeing each other."
      ru: "Собрание, которое созывают с определённой целью и с повесткой: eine Versammlung einberufen. От versammeln — «собирать людей». das Treffen — просто встреча."
      uk: "Збори, які скликають із певною метою та з порядком денним: eine Versammlung einberufen. Від versammeln — «збирати людей». das Treffen — просто зустріч."

  - de: "Gemeinschaft"
    ipa: "gəˈmaɪ̯nʃaft"
    pos: noun
    gender: f
    plural: "die Gemeinschaften"
    en: "community"
    ru: "сообщество, общность"
    uk: "спільнота"
    example_de: "In unserer Gemeinschaft entscheidet niemand allein."
    example_en: "In our community nobody decides alone."
    example_ru: "В нашем сообществе никто не решает в одиночку."
    example_uk: "У нашій спільноті ніхто не вирішує на самоті."
    note:
      en: "People held together by something they share, not by an address list. The residents of one building are die Hausgemeinschaft; the verb behind it is gemeinsam handeln."
      ru: "Люди, которых держит вместе что-то общее, а не список жильцов. Жильцы одного дома — die Hausgemeinschaft; за словом стоит gemeinsam handeln."
      uk: "Люди, яких тримає разом щось спільне, а не список мешканців. Мешканці одного будинку — die Hausgemeinschaft; за словом стоїть gemeinsam handeln."

  - de: "Einwand"
    ipa: "ˈaɪ̯nvant"
    pos: noun
    gender: m
    plural: "die Einwände"
    en: "objection"
    ru: "возражение"
    uk: "заперечення"
    example_de: "Gegen den Parkplatz gab es sofort mehrere Einwände."
    example_en: "There were several objections to the parking area straight away."
    example_ru: "Против парковки сразу же прозвучало несколько возражений."
    example_uk: "Проти парковки одразу пролунало кілька заперечень."
    note:
      en: "einen Einwand haben, einen Einwand erheben. The plural takes an umlaut: die Einwände. It names one concrete point against a plan, not a general mood."
      ru: "einen Einwand haben, einen Einwand erheben. Во множественном числе появляется умлаут: die Einwände. Это один конкретный довод против плана, а не общее настроение."
      uk: "einen Einwand haben, einen Einwand erheben. У множині з'являється умлаут: die Einwände. Це один конкретний довід проти плану, а не загальний настрій."

  - de: "Meinungsverschiedenheit"
    ipa: "ˈmaɪ̯nʊŋsfɛɐ̯ˌʃiːdn̩haɪ̯t"
    pos: noun
    gender: f
    plural: "die Meinungsverschiedenheiten"
    en: "disagreement, difference of opinion"
    ru: "разногласие, расхождение во мнениях"
    uk: "розбіжність у думках, незгода"
    example_de: "Zwischen den Nachbarn gibt es eine alte Meinungsverschiedenheit."
    example_en: "There is an old disagreement between the neighbours."
    example_ru: "Между соседями есть давнее разногласие."
    example_uk: "Між сусідами є давня незгода."
    note:
      en: "Long but transparent: die Meinung + verschieden + -heit. Calmer than der Streit (B1.7), which is already a quarrel; a Meinungsverschiedenheit can stay friendly."
      ru: "Длинное, но прозрачное: die Meinung + verschieden + -heit. Спокойнее, чем der Streit (B1.7) — тот уже ссора; Meinungsverschiedenheit может остаться дружеской."
      uk: "Довге, але прозоре: die Meinung + verschieden + -heit. Спокійніше, ніж der Streit (B1.7) — той уже сварка; Meinungsverschiedenheit може лишитися дружньою."

  - de: "Zustimmung"
    ipa: "ˈtsuːˌʃtɪmʊŋ"
    pos: noun
    gender: f
    plural: "—"
    en: "approval, agreement"
    ru: "согласие, одобрение"
    uk: "згода, схвалення"
    example_de: "Der Plan mit dem Garten fand breite Zustimmung."
    example_en: "The plan with the garden met with broad approval."
    example_ru: "План с садом получил широкое одобрение."
    example_uk: "План із садом дістав широке схвалення."
    note:
      en: "Zustimmung finden, seine Zustimmung geben. The noun of zustimmen (B1.5), and its opposite is die Ablehnung. Used in the singular even when many people agree."
      ru: "Zustimmung finden, seine Zustimmung geben. Существительное к zustimmen (B1.5), противоположность — die Ablehnung. Употребляется в единственном числе, даже когда согласны многие."
      uk: "Zustimmung finden, seine Zustimmung geben. Іменник до zustimmen (B1.5), протилежність — die Ablehnung. Уживається в однині, навіть коли згодні багато людей."

  - de: "Mehrheit"
    ipa: "ˈmeːɐ̯haɪ̯t"
    pos: noun
    gender: f
    plural: "die Mehrheiten"
    en: "majority"
    ru: "большинство"
    uk: "більшість"
    example_de: "Die Mehrheit war für den Spielplatz, obwohl viele Autos im Hof stehen."
    example_en: "The majority were in favour of the playground, although many cars are parked in the courtyard."
    example_ru: "Большинство было за детскую площадку, хотя во дворе стоит много машин."
    example_uk: "Більшість була за дитячий майданчик, хоча у дворі стоїть багато автівок."
    note:
      en: "Takes a singular verb: die Mehrheit ist dafür. With a Genitiv it names the group: die Mehrheit der Bewohner."
      ru: "Согласуется с глаголом в единственном числе: die Mehrheit ist dafür. С Genitiv называет группу: die Mehrheit der Bewohner."
      uk: "Узгоджується з дієсловом в однині: die Mehrheit ist dafür. З Genitiv називає групу: die Mehrheit der Bewohner."

  - de: "Stimme"
    ipa: "ˈʃtɪmə"
    pos: noun
    gender: f
    plural: "die Stimmen"
    en: "vote; voice"
    ru: "голос"
    uk: "голос"
    example_de: "Am Ende fehlte dem Parkplatz genau eine Stimme."
    example_en: "In the end the parking area was exactly one vote short."
    example_ru: "В итоге парковке не хватило ровно одного голоса."
    example_uk: "Зрештою парковці забракло рівно одного голосу."
    note:
      en: "One word for both: seine Stimme abgeben is to cast a vote, mit leiser Stimme is to speak quietly. Counting a result: acht Stimmen dafür, drei dagegen."
      ru: "Одно слово для обоих значений: seine Stimme abgeben — «отдать голос», mit leiser Stimme — «тихо». Подсчёт результата: acht Stimmen dafür, drei dagegen."
      uk: "Одне слово для обох значень: seine Stimme abgeben — «віддати голос», mit leiser Stimme — «тихо». Підрахунок результату: acht Stimmen dafür, drei dagegen."

  - de: "Verständnis"
    ipa: "fɛɐ̯ˈʃtɛntnɪs"
    pos: noun
    gender: n
    plural: "—"
    en: "understanding, sympathy"
    ru: "понимание, сочувственное отношение"
    uk: "розуміння, співчутливе ставлення"
    example_de: "Für die Eltern mit kleinen Kindern habe ich Verständnis."
    example_en: "I have sympathy for the parents with small children."
    example_ru: "К родителям с маленькими детьми я отношусь с пониманием."
    example_uk: "До батьків із маленькими дітьми я ставлюся з розумінням."
    note:
      en: "Verständnis haben für + Akk — the sentence that opens an objection without hardening it. das Verstehen is the mental act; das Verständnis is the attitude you take to a person."
      ru: "Verständnis haben für + Akk — фраза, которой начинают возражение, не заостряя его. das Verstehen — сам мыслительный акт; das Verständnis — отношение к человеку."
      uk: "Verständnis haben für + Akk — фраза, якою починають заперечення, не загострюючи його. das Verstehen — сам розумовий акт; das Verständnis — ставлення до людини."

  - de: "Respekt"
    ipa: "ʁeˈspɛkt"
    pos: noun
    gender: m
    plural: "—"
    en: "respect"
    ru: "уважение"
    uk: "повага"
    example_de: "Ohne Respekt vor den Nachbarn geht im Hof gar nichts."
    example_en: "Without respect for the neighbours nothing works in the courtyard."
    example_ru: "Без уважения к соседям во дворе ничего не получится."
    example_uk: "Без поваги до сусідів у дворі нічого не вийде."
    note:
      en: "Respekt vor + Dat — what you have respect for stands in the Dativ. Only in the singular. die Rücksicht (B1.7) is respect turned into behaviour."
      ru: "Respekt vor + Dat — то, к чему испытывают уважение, стоит в Dativ. Только в единственном числе. die Rücksicht (B1.7) — уважение, ставшее поведением."
      uk: "Respekt vor + Dat — те, до чого відчувають повагу, стоїть у Dativ. Лише в однині. die Rücksicht (B1.7) — повага, що стала поведінкою."

  - de: "Hof"
    ipa: "ˈhoːf"
    pos: noun
    gender: m
    plural: "die Höfe"
    en: "courtyard (the shared open space behind a block of flats)"
    en_compact: "courtyard, yard"
    ru: "двор (общее пространство за жилым домом)"
    uk: "двір (спільний простір за житловим будинком)"
    example_de: "Im Hof stehen zurzeit acht Autos und ein Fahrradständer."
    example_en: "At the moment there are eight cars and a bicycle rack in the courtyard."
    example_ru: "Во дворе сейчас стоят восемь машин и велосипедная стойка."
    example_uk: "У дворі зараз стоять вісім автівок і велосипедна стійка."
    note:
      en: "The space this whole unit argues about. The word also covers a farm (der Bauernhof) and a royal court, but here it is what lies behind the front door."
      ru: "Пространство, о котором спорит весь этот раздел. Слово покрывает и ферму (der Bauernhof), и королевский двор, но здесь это то, что за подъездом."
      uk: "Простір, про який сперечається весь цей розділ. Слово покриває і ферму (der Bauernhof), і королівський двір, але тут це те, що за під'їздом."

  - de: "abstimmen"
    ipa: "ˈapˌʃtɪmən"
    pos: verb
    praesens_3sg: "stimmt ab"
    partizip2: "abgestimmt"
    aux: haben
    valence: "über + Akk"
    en: "to vote"
    ru: "голосовать"
    uk: "голосувати"
    example_de: "Am Ende haben wir über beide Vorschläge abgestimmt."
    example_en: "In the end we voted on both proposals."
    example_ru: "В конце мы проголосовали по обоим предложениям."
    example_uk: "Наприкінці ми проголосували щодо обох пропозицій."
    note:
      en: "Separable: stimmt ab, hat abgestimmt. What is being voted on takes über + Akk. A second sense is to coordinate: etwas mit jemandem abstimmen."
      ru: "Отделяемая приставка: stimmt ab, hat abgestimmt. То, по чему голосуют, вводит über + Akk. Второе значение — «согласовать»: etwas mit jemandem abstimmen."
      uk: "Відокремлюваний префікс: stimmt ab, hat abgestimmt. Те, щодо чого голосують, вводить über + Akk. Друге значення — «узгодити»: etwas mit jemandem abstimmen."

  - de: "anschließen"
    ipa: "ˈanˌʃliːsn̩"
    pos: verb
    praesens_3sg: "schließt sich an"
    partizip2: "sich angeschlossen"
    aux: haben
    valence: "sich + Akk; + Dat"
    accept: ["sich anschließen"]
    en: "to side with someone, to back what they said"
    ru: "присоединяться к мнению, поддерживать"
    uk: "приєднуватися до думки, підтримувати"
    example_de: "Ich schließe mich dem Vorschlag von Frau Adamek an."
    example_en: "I am backing Ms Adamek's proposal."
    example_ru: "Я присоединяюсь к предложению госпожи Адамек."
    example_uk: "Я приєднуюся до пропозиції пані Адамек."
    note:
      en: "In a discussion it is reflexive: sich jemandem oder einer Sache anschließen, and the person or plan stands in the Dativ with no preposition. Separable: schließt sich an, hat sich angeschlossen. zustimmen (B1.5) answers a proposal; this verb puts you behind the person who made it."
      ru: "В обсуждении глагол возвратный: sich jemandem oder einer Sache anschließen, причём человек или план стоят в Dativ без предлога. Отделяемая приставка: schließt sich an, hat sich angeschlossen. zustimmen (B1.5) отвечает на предложение; этот глагол ставит вас за спину тому, кто его внёс."
      uk: "В обговоренні дієслово зворотне: sich jemandem oder einer Sache anschließen, причому людина або план стоять у Dativ без прийменника. Відокремлюваний префікс: schließt sich an, hat sich angeschlossen. zustimmen (B1.5) відповідає на пропозицію; це дієслово ставить вас за спину тому, хто її вніс."

  - de: "überreden"
    ipa: "ˌyːbɐˈʁeːdn̩"
    pos: verb
    praesens_3sg: "überredet"
    partizip2: "überredet"
    aux: haben
    valence: "+ Akk; zu + Dat"
    en: "to talk someone into something"
    ru: "уговаривать"
    uk: "умовляти"
    example_de: "Meine Nachbarin hat mich zu dem Garten überredet."
    example_en: "My neighbour talked me into the garden."
    example_ru: "Соседка уговорила меня на сад."
    example_uk: "Сусідка вмовила мене на сад."
    note:
      en: "Inseparable, so no ge-: hat überredet. It works on the will and may leave the person unconvinced; überzeugen (B1.5) works on the mind and leaves them agreeing."
      ru: "Неотделяемая приставка, поэтому без ge-: hat überredet. Действует на волю и может оставить человека при своём мнении; überzeugen (B1.5) действует на разум и оставляет его согласным."
      uk: "Невідокремлюваний префікс, тому без ge-: hat überredet. Діє на волю й може лишити людину при своїй думці; überzeugen (B1.5) діє на розум і лишає її згодною."

  - de: "sich beteiligen"
    ipa: "zɪç bəˈtaɪ̯lɪgn̩"
    pos: verb
    praesens_3sg: "beteiligt sich"
    partizip2: "sich beteiligt"
    aux: haben
    valence: "sich + Akk; an + Dat"
    # Gloss deliberately NOT "to take part / участвовать" — that is A2 teilnehmen's
    # production prompt (arbeit-ausbildung-a2), and two entries answering one prompt
    # is the P22-11 defect. This card asks for the contribution sense only.
    en: "to get involved, to contribute one's share (in a joint effort or its costs)"
    en_compact: "to get involved, to contribute"
    ru: "участвовать, внося свой вклад (в общее дело, обсуждение или расходы)"
    uk: "долучатися, брати активну участь (у спільній справі чи витратах)"
    example_de: "An der Versammlung haben sich fast alle Bewohner beteiligt."
    example_en: "Almost all the residents took an active part in the meeting."
    example_ru: "В собрании активно участвовали почти все жильцы."
    example_uk: "У зборах активну участь узяли майже всі мешканці."
    note:
      en: "Against A2 teilnehmen: teilnehmen says you were among the participants (an einem Kurs teilnehmen); sich beteiligen says you put something of your own in — work, words or money. What you join takes an + Dat. Inseparable, so no ge-: hat sich beteiligt. Sharing a cost uses the same verb: sich an den Kosten beteiligen."
      ru: "В отличие от teilnehmen (A2): teilnehmen — вы были среди участников (an einem Kurs teilnehmen); sich beteiligen — вы вложили что-то своё: труд, слово или деньги. То, в чём участвуют, вводит an + Dat. Неотделяемая приставка, поэтому без ge-: hat sich beteiligt. О деньгах — тот же глагол: sich an den Kosten beteiligen."
      uk: "На відміну від teilnehmen (A2): teilnehmen — ви були серед учасників (an einem Kurs teilnehmen); sich beteiligen — ви вклали щось своє: працю, слово чи гроші. Те, у чому беруть участь, вводить an + Dat. Невідокремлюваний префікс, тому без ge-: hat sich beteiligt. Про гроші — те саме дієслово: sich an den Kosten beteiligen."

  - de: "hinweisen"
    ipa: "ˈhɪnˌvaɪ̯zn̩"
    pos: verb
    praesens_3sg: "weist hin"
    partizip2: "hingewiesen"
    aux: haben
    valence: "auf + Akk"
    en: "to point something out"
    ru: "указывать, обращать внимание"
    uk: "указувати, звертати увагу"
    example_de: "Der Hausmeister hat auf die Kosten hingewiesen."
    example_en: "The caretaker pointed out the costs."
    example_ru: "Управдом обратил внимание на расходы."
    example_uk: "Двірник звернув увагу на витрати."
    note:
      en: "auf etwas hinweisen — the calm way to add a fact the others have missed, without contradicting anyone. Separable and strong: weist hin, hat hingewiesen. The noun is der Hinweis."
      ru: "auf etwas hinweisen — спокойный способ добавить факт, который упустили другие, никому не возражая. Отделяемая приставка, сильный глагол: weist hin, hat hingewiesen. Существительное — der Hinweis."
      uk: "auf etwas hinweisen — спокійний спосіб додати факт, який інші проґавили, нікому не заперечуючи. Відокремлюваний префікс, сильне дієслово: weist hin, hat hingewiesen. Іменник — der Hinweis."

  - de: "nachgeben"
    ipa: "ˈnaːxˌgeːbn̩"
    pos: verb
    praesens_3sg: "gibt nach"
    partizip2: "nachgegeben"
    aux: haben
    valence: "+ Dat"
    # Same reasoning as gegenseitig: off the manifest, not named by any frozen outcome.
    # The learner meets it in the discussion and reads it on the notice; producing it is
    # not what the exam asks, and the new-card budget is the binding constraint at B1.
    cards: recognition
    en: "to give in, to yield"
    ru: "уступать"
    uk: "поступатися"
    example_de: "Beim Parkplatz haben wir nachgegeben, beim Lärm nicht."
    example_en: "We gave in on the parking area, but not on the noise."
    example_ru: "По парковке мы уступили, а по шуму нет."
