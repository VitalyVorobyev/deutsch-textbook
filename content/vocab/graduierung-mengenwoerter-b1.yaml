      uk: 'Позначає іменник як неозначений: мовець або не знає, який саме, або йому байдуже. Відмінюється точнісінько як ein — irgendeinen Grund, irgendeiner Frau, irgendein Problem, — а множина в нього окрема: irgendwelche (Hast du irgendwelche Fragen?). Без іменника воно перетворюється на irgendeiner, irgendeine, irgendeins. Родина велика й цілком регулярна: irgendwo, irgendwann, irgendwie, irgendetwas, irgendjemand.'

