      uk: 'У цьому вживанні це прийменник розподілу, і стоїть він прямо перед іменником без жодного артикля: je Person, je Stück, je Kilo, je Monat. Побутовий усний відповідник — pro (pro Person, pro Tag). Перед числом воно, навпаки, роздає рівні частки: Die Kinder bekamen je zwei Äpfel. Рамка je nach означає «залежно від»: Je nach Wetter fahren wir mit dem Rad. Ще два вживання для наших потреб окремі, і картка не про них: двочастинне порівняння je … desto, яке курс відпрацьовує як граматику, і книжне je у значенні «коли-небудь» (schöner als je zuvor).'

