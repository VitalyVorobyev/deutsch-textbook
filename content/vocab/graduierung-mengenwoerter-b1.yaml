# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the degree,
# approximation, frequency and quantity words of data/goethe-b1-wortliste.txt —
# the words that grade a statement, hedge a figure and measure out an amount.
id: graduierung-mengenwoerter-b1
title_de: "Graduierung und Mengenwörter"
title_en: "Degree, approximation and quantity words"
title_ru: "Степень, приблизительность и количество"
title_uk: "Ступінь, приблизність і кількість"
level: B1
entries:
  # --- Grad und Intensität: wie stark gilt die Aussage ---
  - de: ziemlich
    ipa: "ˈtsiːmlɪç"
    pos: adv
    en: fairly, pretty
    ru: довольно, весьма
    uk: доволі, досить-таки
    example_de: Die Wohnung ist ziemlich teuer, aber sie liegt sehr zentral.
    example_en: The flat is fairly expensive, but it is very centrally located.
    example_ru: Квартира довольно дорогая, зато находится в самом центре.
    example_uk: Квартира доволі дорога, зате розташована в самому центрі.
    note:
      en: 'It grades an adjective up towards sehr but never reaches it: ziemlich teuer is clearly above average, sehr teuer is the top of the scale. A2 ganz is the treacherous neighbour, because ganz gut swings between quite good and perfectly good depending on the stress, while this word always points at the middle. It grades quantities too (ziemlich viel Arbeit), and ziemlich genau is a fixed phrase for almost exactly.'
      ru: 'Поднимает признак вверх, к sehr, но никогда до него: ziemlich teuer — заметно выше среднего, sehr teuer — верх шкалы. Коварный сосед — ganz с уровня A2: ganz gut колеблется между «довольно хорошо» и «вполне хорошо» в зависимости от ударения, а это слово всегда указывает на середину. Оно градуирует и количество (ziemlich viel Arbeit), а ziemlich genau — устойчивое сочетание «почти точно».'
      uk: 'Піднімає ознаку вгору, до sehr, але ніколи до нього: ziemlich teuer — помітно вище за середнє, sehr teuer — верх шкали. Підступний сусід — ganz рівня A2: ganz gut коливається між «доволі добре» і «цілком добре» залежно від наголосу, а це слово завжди вказує на середину. Воно градуює й кількість (ziemlich viel Arbeit), а ziemlich genau — стале сполучення «майже точно».'

  - de: relativ
    ipa: "ʁelaˈtiːf"
    pos: adv
    en: relatively, comparatively
    ru: относительно, сравнительно
    uk: відносно, порівняно
    example_de: Für eine Großstadt sind die Mieten hier relativ niedrig.
    example_en: For a big city the rents here are relatively low.
    example_ru: Для большого города аренда здесь относительно невысокая.
    example_uk: Як на велике місто, оренда тут відносно невисока.
    note:
      en: 'It always measures against a standard, and German usually names that standard with für: für eine Großstadt, für sein Alter, für einen Anfänger. Where no standard is named the word slides into ziemlich, and in speech the two are often swapped. As an adjective it is the opposite of absolut: eine relative Mehrheit, alles ist relativ.'
      ru: 'Всегда меряет по некоторому эталону, и немецкий обычно называет этот эталон предлогом für: für eine Großstadt, für sein Alter, für einen Anfänger. Там, где эталон не назван, слово сползает к ziemlich, и в речи их часто путают. Как прилагательное оно противоположно absolut: eine relative Mehrheit, alles ist relativ.'
      uk: 'Завжди міряє за певним еталоном, і німецька зазвичай називає цей еталон прийменником für: für eine Großstadt, für sein Alter, für einen Anfänger. Там, де еталон не названо, слово сповзає до ziemlich, і в мовленні їх часто плутають. Як прикметник воно протилежне absolut: eine relative Mehrheit, alles ist relativ.'

  - de: extrem
    ipa: "ɛksˈtʁeːm"
    pos: adv
    en: extremely; extreme
    ru: крайне, чрезвычайно; крайний
    uk: украй, надзвичайно; крайній
    example_de: Die Preise für Strom sind im letzten Jahr extrem gestiegen.
    example_en: Electricity prices have risen extremely sharply over the past year.
    example_ru: Цены на электричество за последний год выросли крайне сильно.
    example_uk: Ціни на електроенергію за останній рік зросли вкрай сильно.
    note:
      en: 'One word for both jobs: in front of an adjective or a verb it is an unchanging adverb (extrem teuer, extrem gestiegen), in front of a noun an ordinary adjective with endings (extreme Hitze, bei extremen Temperaturen). It sits above sehr on the scale. In a written opinion text one is convincing and three in a row read as exaggeration, so a report reaches for sehr, deutlich or stark instead. The noun das Extrem names the far end of a scale: von einem Extrem ins andere.'
      ru: 'Одно слово на две работы: перед прилагательным или глаголом это неизменяемое наречие (extrem teuer, extrem gestiegen), перед существительным — обычное прилагательное с окончаниями (extreme Hitze, bei extremen Temperaturen). На шкале оно стоит выше sehr. В письменном тексте с мнением одно такое слово убеждает, а три подряд читаются как преувеличение, поэтому отчёт берёт sehr, deutlich или stark. Существительное das Extrem называет край шкалы: von einem Extrem ins andere.'
      uk: 'Одне слово на дві роботи: перед прикметником або дієсловом це незмінюваний прислівник (extrem teuer, extrem gestiegen), перед іменником — звичайний прикметник із закінченнями (extreme Hitze, bei extremen Temperaturen). На шкалі воно стоїть вище за sehr. У писемному тексті з думкою одне таке слово переконує, а три поспіль читаються як перебільшення, тому звіт бере sehr, deutlich або stark. Іменник das Extrem називає край шкали: von einem Extrem ins andere.'

  - de: völlig
    ipa: "ˈfœlɪç"
    pos: adv
    # Recognition only: A2 ships `total` ("totally, completely") and `ganz`
    # ("completely, quite") as production cards, and `absolut` on this list answers
    # the same prompt. A typed card here would grade which of four the author meant.
    cards: recognition
    en: completely, entirely
    ru: совершенно, полностью
    uk: цілком, повністю
    example_de: Du hast völlig recht, der Termin passt uns nicht.
    example_en: You are completely right, the date does not suit us.
    example_ru: Ты совершенно прав, эта дата нам не подходит.
    example_uk: Ти цілком маєш рацію, ця дата нам не підходить.
    note:
      en: 'It marks a property as complete, with nothing left over: völlig richtig, völlig neu, völlig egal, völlig verrückt. A2 total says the same and belongs to speech, while this word is the neutral written one; ganz is a step weaker and can even mean quite. It grades adjectives and adverbs, not verbs — a finished action takes vollständig or ganz (Der Text ist vollständig übersetzt).'
      ru: 'Помечает признак как полный, без остатка: völlig richtig, völlig neu, völlig egal, völlig verrückt. total с уровня A2 говорит то же и принадлежит разговорной речи, а это слово нейтрально-письменное; ganz на ступень слабее и может значить даже «вполне». Оно градуирует прилагательные и наречия, но не глаголы — при законченном действии берут vollständig или ganz (Der Text ist vollständig übersetzt).'
      uk: 'Позначає ознаку як повну, без залишку: völlig richtig, völlig neu, völlig egal, völlig verrückt. total рівня A2 каже те саме й належить розмовному мовленню, а це слово нейтрально-писемне; ganz на щабель слабше й може означати навіть «цілком собі». Воно градуює прикметники та прислівники, але не дієслова — при завершеній дії беруть vollständig або ganz (Der Text ist vollständig übersetzt).'

  - de: absolut
    ipa: "apzoˈluːt"
    pos: adv
    # Recognition only: A2 ships `total` and `unbedingt` ("absolutely, definitely")
    # as production cards; a typed card here would grade which of three was meant.
    cards: recognition
    en: absolutely, utterly
    ru: абсолютно, совершенно
    uk: абсолютно, цілковито
    example_de: Für mich ist das absolut kein Problem.
    example_en: For me that is absolutely no problem.
    example_ru: Для меня это абсолютно не проблема.
    example_uk: Для мене це абсолютно не проблема.
    note:
      en: 'The strongest member of the group, and it is at its most natural in front of a negation: absolut kein Problem, absolut nicht einverstanden, absolut nichts. As a one-word answer, Absolut! is emphatic agreement. As an adjective it means unconditional and is the opposite of relativ: die absolute Mehrheit, absolute Ruhe. Take care with the frozen phrase absolut sicher, which claims certainty, not merely a strong guess.'
      ru: 'Самое сильное слово ряда, и естественнее всего оно звучит перед отрицанием: absolut kein Problem, absolut nicht einverstanden, absolut nichts. Отдельной репликой Absolut! означает решительное согласие. Как прилагательное значит «безусловный» и противоположно relativ: die absolute Mehrheit, absolute Ruhe. Осторожно с застывшим absolut sicher: оно заявляет уверенность, а не сильную догадку.'
      uk: 'Найсильніше слово ряду, і найприродніше воно звучить перед запереченням: absolut kein Problem, absolut nicht einverstanden, absolut nichts. Окремою реплікою Absolut! означає рішучу згоду. Як прикметник значить «безумовний» і протилежне relativ: die absolute Mehrheit, absolute Ruhe. Обережно зі сталим absolut sicher: воно заявляє впевненість, а не сильний здогад.'

  - de: kaum
    ipa: "ˈkaʊ̯m"
    pos: adv
    en: hardly, barely
    ru: едва, почти не
    uk: ледве, майже не
    example_de: Ich habe die Prüfung bestanden, aber ich hatte kaum Zeit zum Lernen.
    example_en: I passed the exam, but I hardly had any time to study.
    example_ru: Экзамен я сдал, но времени на подготовку почти не было.
    example_uk: Іспит я склав, але часу на підготовку майже не було.
    note:
      en: 'It is already a negation, so it never takes nicht or kein beside it: kaum Zeit, not ❌ kaum keine Zeit. In front of a noun it means almost none (kaum Leute waren da), in front of a verb almost not at all (Ich kann ihn kaum verstehen). A second, temporal use means no sooner than: it stands in position 1 and pulls the finite verb straight after it, and what follows is a second main clause — Kaum war ich zu Hause, klingelte das Telefon. And kaum zu glauben is the fixed phrase for hard to believe.'
      ru: 'Само по себе отрицание, поэтому рядом с ним не ставят ни nicht, ни kein: kaum Zeit, но не ❌ kaum keine Zeit. Перед существительным значит «почти нет» (kaum Leute waren da), перед глаголом — «почти не» (Ich kann ihn kaum verstehen). Второе, временное употребление значит «едва только»: слово стоит на первом месте и тянет спрягаемый глагол сразу за собой, а дальше идёт второе главное предложение: Kaum war ich zu Hause, klingelte das Telefon. А kaum zu glauben — устойчивое «трудно поверить».'
      uk: 'Саме по собі заперечення, тому поряд із ним не ставлять ні nicht, ні kein: kaum Zeit, але не ❌ kaum keine Zeit. Перед іменником означає «майже немає» (kaum Leute waren da), перед дієсловом — «майже не» (Ich kann ihn kaum verstehen). Друге, часове вживання означає «щойно»: слово стоїть на першому місці й тягне відмінюване дієслово одразу за собою, а далі йде друге головне речення: Kaum war ich zu Hause, klingelte das Telefon. А kaum zu glauben — стале «важко повірити».'

  - de: eher
    ipa: "ˈeːɐ"
    pos: adv
    en: more likely; if anything
    ru: скорее уж, пожалуй
    uk: радше, скоріше вже
    example_de: Der Film war nicht schlecht, aber eher etwas für Kinder.
    example_en: The film was not bad, but if anything something for children.
    example_ru: Фильм неплохой, но скорее уж для детей.
    example_uk: Фільм непоганий, але радше для дітей.
    note:
      en: 'Formally the comparative of bald, and it has three lives. Earlier in time: Je eher, desto besser. A softened judgement, which is the B1 opinion-text use: Ich bin eher dagegen says the speaker leans one way without committing. And in the frame eher … als it weighs one description against another: Das ist eher eine Bitte als ein Befehl. Keep it apart from A1 lieber, which is about what someone prefers, not about what is more probable.'
      ru: 'Формально это сравнительная степень от bald, и у него три жизни. Раньше по времени: Je eher, desto besser. Смягчённая оценка — именно этим слово живёт в тексте с мнением уровня B1: Ich bin eher dagegen значит, что говорящий склоняется в одну сторону, не заявляя этого твёрдо. И в рамке eher … als оно взвешивает одну характеристику против другой: Das ist eher eine Bitte als ein Befehl. Не смешивайте с lieber уровня A1: то о предпочтении, а это о вероятности.'
      uk: 'Формально це вищий ступінь від bald, і в нього три життя. Раніше в часі: Je eher, desto besser. Пом’якшена оцінка — саме цим слово живе в тексті з думкою рівня B1: Ich bin eher dagegen означає, що мовець схиляється в один бік, не заявляючи цього твердо. І в рамці eher … als воно зважує одну характеристику проти іншої: Das ist eher eine Bitte als ein Befehl. Не змішуйте з lieber рівня A1: те про вподобання, а це про ймовірність.'

  - de: genauso
    ipa: "gəˈnaʊ̯zoː"
    pos: adv
    # `ebenso` fills the same slot in the same frame and the note says so, so the
    # production card must not mark it wrong.
    accept: ["ebenso"]
    en: just as, exactly as
    ru: точно так же, ничуть не менее
    uk: так само, достеменно так само
    example_de: Der neue Chef ist genauso freundlich wie sein Vorgänger.
    example_en: The new boss is just as friendly as his predecessor.
    example_ru: Новый начальник точно так же приветлив, как его предшественник.
    example_uk: Новий начальник так само привітний, як його попередник.
    note:
      en: 'The equality comparison, and it needs its wie: this word, then the adjective in the plain form, then wie and the thing compared. Plain so … wie says the same more neutrally; this one insists the two are equal to the same degree. ebenso is fully interchangeable and a shade more formal. It also stands alone as a reply: Mir geht es genauso. Written as two words, genau so means in exactly that way (Mach es genau so, wie ich es dir gezeigt habe).'
      ru: 'Сравнение на равенство, и ему нужно своё wie: сначала это слово, затем прилагательное в положительной степени, затем wie и предмет сравнения. Простое so … wie говорит то же нейтральнее, а это слово настаивает, что стороны равны в той же мере. ebenso полностью взаимозаменяемо и чуть более книжно. Слово работает и отдельной репликой: Mir geht es genauso. В два слова genau so значит «именно так» (Mach es genau so, wie ich es dir gezeigt habe).'
      uk: 'Порівняння на рівність, і йому потрібне своє wie: спершу це слово, тоді прикметник у звичайному ступені, тоді wie і предмет порівняння. Просте so … wie каже те саме нейтральніше, а це слово наполягає, що сторони рівні тією самою мірою. ebenso цілком взаємозамінне й трохи книжніше. Слово працює й окремою реплікою: Mir geht es genauso. У два слова genau so означає «саме так» (Mach es genau so, wie ich es dir gezeigt habe).'

  - de: möglichst
    ipa: "ˈmøːklɪçst"
    pos: adv
    en: as … as possible
    ru: как можно + сравнительная степень
    uk: якомога + вищий ступінь
    example_de: Bitte schicken Sie mir die Unterlagen möglichst schnell.
    example_en: Please send me the documents as quickly as possible.
    example_ru: Пожалуйста, пришлите мне документы как можно быстрее.
    example_uk: Будь ласка, надішліть мені документи якомога швидше.
    note:
      en: 'It stands directly in front of an adjective or adverb in its plain form and turns it into a wish for the maximum: möglichst früh, möglichst genau, möglichst wenig. Never in front of a comparative — ❌ möglichst schneller. The long version so … wie möglich (so schnell wie möglich) means exactly the same and sounds more emphatic and more spoken. On its own, möglich is the adjective possible, and wenn möglich is the polite hedge if at all possible.'
      ru: 'Стоит прямо перед прилагательным или наречием в положительной степени и превращает его в пожелание максимума: möglichst früh, möglichst genau, möglichst wenig. Никогда перед сравнительной степенью — ❌ möglichst schneller. Развёрнутый вариант so … wie möglich (so schnell wie möglich) значит ровно то же и звучит настойчивее и разговорнее. Само по себе möglich — прилагательное «возможный», а wenn möglich — вежливая оговорка «по возможности».'
      uk: 'Стоїть прямо перед прикметником або прислівником у звичайному ступені й перетворює його на побажання максимуму: möglichst früh, möglichst genau, möglichst wenig. Ніколи перед вищим ступенем — ❌ möglichst schneller. Розгорнутий варіант so … wie möglich (so schnell wie möglich) значить рівно те саме і звучить наполегливіше та розмовніше. Саме по собі möglich — прикметник «можливий», а wenn möglich — увічливе застереження «за можливості».'

  # --- Annäherung an eine Zahl: circa, etwa, ungefähr, beinahe, höchstens ---
  - de: ungefähr
    ipa: "ˈʊngəfɛːɐ̯"
    pos: adv
    en: approximately, roughly
    ru: примерно, приблизительно
    uk: приблизно, орієнтовно
    example_de: Bis zum Bahnhof sind es ungefähr zwanzig Minuten zu Fuß.
    example_en: It is approximately twenty minutes on foot to the station.
    example_ru: До вокзала пешком примерно двадцать минут.
    example_uk: До вокзалу пішки приблизно двадцять хвилин.
    note:
      en: 'This is the word to reach for when speaking: it stands in front of the figure and says the figure is not exact. etwa is its written twin and circa belongs to price lists, timetables and offers, so all three would translate the same English sentence — but only this one is at home in a conversation. It also works without a number, meaning roughly, in outline: Ich habe ungefähr verstanden, worum es geht. The noun die Ahnung inside it still shows: keine Ahnung means no idea.'
      ru: 'Именно это слово берут в устной речи: оно стоит перед числом и сообщает, что число неточное. etwa — его письменный двойник, а circa живёт в прайс-листах, расписаниях и коммерческих предложениях, так что все три перевели бы одну и ту же русскую фразу, но в разговоре уместно только это. Оно работает и без числа, в значении «в общих чертах»: Ich habe ungefähr verstanden, worum es geht. Внутри него ещё видно существительное die Ahnung: keine Ahnung значит «понятия не имею».'
      uk: 'Саме це слово беруть в усному мовленні: воно стоїть перед числом і повідомляє, що число неточне. etwa — його писемний двійник, а circa живе в прайс-листах, розкладах і комерційних пропозиціях, тож усі три переклали б ту саму українську фразу, але в розмові доречне лише це. Воно працює й без числа, у значенні «у загальних рисах»: Ich habe ungefähr verstanden, worum es geht. Усередині нього ще видно іменник die Ahnung: keine Ahnung означає «гадки не маю».'

  - de: circa
    ipa: "ˈtsɪʁka"
    pos: adv
    # Recognition only. `ungefähr` owns the production slot for "approximately"
    # in this deck, and `zirka` — the A/CH spelling of this very word — is a
    # separate manifest headword this deck does not own, so a typed card here
    # would reject correct German it has no way to accept.
    cards: recognition
    en: approximately, about
    ru: около, приблизительно
    uk: близько, приблизно
    example_de: Die Reparatur kostet circa 200 Euro.
    example_en: The repair costs approximately 200 euros.
    example_ru: Ремонт стоит около 200 евро.
    example_uk: Ремонт коштує близько 200 євро.
    note:
      en: 'A Latin loan that belongs to figures — prices, quantities, dates, running times. On the page you will meet the abbreviation ca. far more often than the spelled-out word, and ca. is what a German writes on an offer or a timetable. Austria and Switzerland spell the full word zirka; it is the same word and the same pronunciation. In conversation nobody says it: there the word is ungefähr.'
      ru: 'Латинское заимствование, живущее при числах — цены, количества, даты, длительности. На письме сокращение ca. встречается куда чаще полного слова, и именно ca. немец напишет в коммерческом предложении или в расписании. В Австрии и Швейцарии полное слово пишут zirka; это то же слово и то же произношение. В разговоре его не произносят: там работает ungefähr.'
      uk: 'Латинське запозичення, що живе при числах — ціни, кількості, дати, тривалості. На письмі скорочення ca. трапляється значно частіше за повне слово, і саме ca. німець напише в комерційній пропозиції чи в розкладі. В Австрії та Швейцарії повне слово пишуть zirka; це те саме слово й та сама вимова. У розмові його не вимовляють: там працює ungefähr.'

  - de: etwa
    ipa: "ˈɛtva"
    pos: adv
    # Recognition only: `ungefähr` owns the production slot for "approximately",
    # and the other two senses below are read far more often than they are said.
    cards: recognition
    en: about, roughly; for instance
    ru: примерно; например
    uk: приблизно; наприклад
    example_de: An dem Kurs nehmen etwa dreißig Leute teil.
    example_en: About thirty people are taking part in the course.
    example_ru: В курсе участвуют примерно тридцать человек.
    example_uk: У курсі беруть участь приблизно тридцять осіб.
    note:
      en: 'Three jobs, and only the first is about numbers. In front of a figure it is the written twin of ungefähr. Introducing an example it replaces zum Beispiel and sounds distinctly literary: viele Länder, etwa Polen und Tschechien. And as a modal particle in a question it expects the answer no, carrying surprise or reproach: Hast du etwa vergessen anzurufen? Nicht etwa in front of a noun rules that noun out: Er kam nicht etwa zu spät, er kam gar nicht.'
      ru: 'Три работы, и только первая про числа. Перед числом это письменный двойник ungefähr. Вводя пример, слово заменяет zum Beispiel и звучит подчёркнуто книжно: viele Länder, etwa Polen und Tschechien. А как модальная частица в вопросе оно ждёт ответа «нет» и несёт удивление или упрёк: Hast du etwa vergessen anzurufen? Сочетание nicht etwa перед существительным это существительное исключает: Er kam nicht etwa zu spät, er kam gar nicht.'
      uk: 'Три роботи, і лише перша про числа. Перед числом це писемний двійник ungefähr. Уводячи приклад, слово заміняє zum Beispiel і звучить підкреслено книжно: viele Länder, etwa Polen und Tschechien. А як модальна частка в питанні воно чекає відповіді «ні» й несе подив або докір: Hast du etwa vergessen anzurufen? Сполука nicht etwa перед іменником цей іменник виключає: Er kam nicht etwa zu spät, er kam gar nicht.'

  - de: beinahe
    ipa: "ˈbaɪ̯naːə"
    pos: adv
    # Recognition only: A2 ships `fast` ("almost, nearly") as a production card and
    # the two are interchangeable, which no `accept` list here could repair.
    cards: recognition
    en: almost, very nearly (but it did not happen)
    ru: чуть не, едва не
    uk: мало не, ледь не
    example_de: Ich wäre beinahe zu spät gekommen, denn der Bus hatte Verspätung.
    example_en: I very nearly arrived too late, because the bus was delayed.
    example_ru: Я чуть не опоздал, потому что автобус задержался.
    example_uk: Я мало не запізнився, бо автобус затримався.
    note:
      en: 'Its sharpest use is the near miss: with the Konjunktiv II it says the thing was on the very point of happening and then did not. Ich wäre beinahe gestürzt means the fall never took place. A2 fast covers exactly the same ground, is far commoner in speech and would fit every example here; the difference is register alone. In front of a number the word can also mean approximately (beinahe hundert Leute), but there the natural choices are ungefähr and etwa. The formal written variant is nahezu.'
      ru: 'Острее всего слово звучит там, где речь о том, что едва не случилось: с Konjunktiv II оно сообщает, что дело было на грани и не произошло. Ich wäre beinahe gestürzt значит, что падения не было. fast с уровня A2 покрывает ровно то же поле, встречается в речи куда чаще и подошло бы к любому примеру здесь; разница только в регистре. Перед числом слово может значить и «почти» в смысле приблизительности (beinahe hundert Leute), но там естественнее ungefähr и etwa. Книжный вариант — nahezu.'
      uk: 'Найгостріше слово звучить там, де йдеться про те, що ледь не сталося: з Konjunktiv II воно повідомляє, що справа була на межі й не відбулася. Ich wäre beinahe gestürzt означає, що падіння не було. fast рівня A2 покриває рівно те саме поле, трапляється в мовленні значно частіше й пасувало б до будь-якого прикладу тут; різниця лише в регістрі. Перед числом слово може означати й «майже» у сенсі приблизності (beinahe hundert Leute), але там природніші ungefähr та etwa. Книжний варіант — nahezu.'

  - de: höchstens
    ipa: "ˈhøːçstn̩s"
    pos: adv
    # `maximal` is fully interchangeable in front of a quantity and the note says so,
    # so the production card must not mark it wrong.
    accept: ["maximal"]
    en: at most, no more than
    ru: самое большее, не более
    uk: щонайбільше, не більше
    example_de: Die Reparatur dauert höchstens zwei Tage.
    example_en: The repair will take two days at most.
    example_ru: Ремонт займёт самое большее два дня.
    example_uk: Ремонт триватиме щонайбільше два дні.
    note:
      en: 'The exact counterpart of A2 mindestens: this word puts a ceiling on a quantity, mindestens puts a floor. In front of a figure maximal is fully interchangeable with it and is the form used on forms, price lists and packaging. A second use concedes a single exception and stands in position 1: Höchstens am Wochenende habe ich Zeit — if at all, then only then. Do not mix it up with A2 wenigstens, which is a consolation (at least it was cheap), not a limit.'
      ru: 'Точная противоположность mindestens с уровня A2: это слово ставит потолок, mindestens — пол. Перед числом с ним полностью взаимозаменяемо maximal, и именно maximal стоит в бланках, прайс-листах и на упаковке. Второе употребление допускает единственное исключение и занимает первое место: Höchstens am Wochenende habe ich Zeit — «разве что в выходные». Не путайте с wenigstens уровня A2: то утешение («зато было дёшево»), а не предел.'
      uk: 'Точна протилежність mindestens рівня A2: це слово ставить стелю, mindestens — підлогу. Перед числом із ним цілком взаємозамінне maximal, і саме maximal стоїть у бланках, прайс-листах і на упаковці. Друге вживання припускає єдиний виняток і займає перше місце: Höchstens am Wochenende habe ich Zeit — «хіба що у вихідні». Не плутайте з wenigstens рівня A2: то втіха («зате було дешево»), а не межа.'

  # --- Vermutung und Gewissheit ---
  - de: vermutlich
    ipa: "fɛɐ̯ˈmuːtlɪç"
    pos: adv
    # Recognition only: A2 ships `wahrscheinlich` ("probably") and A1 `vielleicht`
    # as production cards; a typed card here would grade which of three was meant.
    cards: recognition
    en: presumably, I would guess
    ru: предположительно, надо полагать
    uk: певно, слід гадати
    example_de: Der Zug hat Verspätung, vermutlich wegen des Wetters.
    example_en: The train is delayed, presumably because of the weather.
    example_ru: Поезд опаздывает, предположительно из-за погоды.
    example_uk: Потяг запізнюється, певно, через погоду.
    note:
      en: 'It marks the sentence as the speaker''s own inference from what they can see, which makes it a shade more personal than A2 wahrscheinlich, a word that simply states a probability. The scale runs vielleicht, then this word and wahrscheinlich together, then bestimmt, then sicher. It fills position 1 or sits inside the clause after the finite verb. As an adjective it means presumed: der vermutliche Grund. The verb behind it is vermuten, to suspect.'
      ru: 'Помечает сказанное как собственный вывод говорящего из увиденного, и потому звучит чуть личнее, чем wahrscheinlich с уровня A2, которое просто называет вероятность. Шкала идёт так: vielleicht, затем это слово вместе с wahrscheinlich, затем bestimmt, затем sicher. Оно занимает первое место или стоит внутри предложения после спрягаемого глагола. Как прилагательное значит «предполагаемый»: der vermutliche Grund. За ним стоит глагол vermuten — «предполагать».'
      uk: 'Позначає сказане як власний висновок мовця з побаченого, і тому звучить трохи особистіше, ніж wahrscheinlich рівня A2, яке просто називає ймовірність. Шкала йде так: vielleicht, тоді це слово разом із wahrscheinlich, тоді bestimmt, тоді sicher. Воно займає перше місце або стоїть усередині речення після відмінюваного дієслова. Як прикметник означає «гаданий»: der vermutliche Grund. За ним стоїть дієслово vermuten — «припускати».'

  - de: eventuell
    ipa: "evɛntuˈɛl"
    pos: adv
    # Recognition only: A1 ships `vielleicht` ("maybe, perhaps") as a production
    # card and the two fill the same slot.
    cards: recognition
    en: possibly, if need be
    ru: возможно, при случае
    uk: можливо, за потреби
    example_de: Eventuell komme ich später, ich muss noch etwas erledigen.
    example_en: I may possibly come later, I still have something to take care of.
    example_ru: Возможно, я приду позже, мне ещё нужно кое-что сделать.
    example_uk: Можливо, я прийду пізніше, мені ще треба дещо залагодити.
    note:
      en: 'A false friend, and an expensive one: it never means the English eventually, in the end, at last. German says that with schließlich, am Ende or zum Schluss. What this word says is that something may or may not happen — A1 vielleicht with a business suit on, at home in offers, appointments and emails, where it is abbreviated evtl. As an adjective it means potential rather than actual: eventuelle Kosten übernimmt die Versicherung.'
      ru: 'Ложный друг, и дорогой: слово никогда не значит английское eventually, то есть «в конце концов». Для этого немецкий берёт schließlich, am Ende или zum Schluss. Говорит же оно, что нечто может произойти, а может и нет, — это vielleicht уровня A1 в деловом костюме, уместное в предложениях, договорённостях и письмах, где его сокращают до evtl. Как прилагательное значит «возможный, если возникнет»: eventuelle Kosten übernimmt die Versicherung.'
      uk: 'Хибний друг, і дорогий: слово ніколи не означає англійського eventually, тобто «зрештою». Для цього німецька бере schließlich, am Ende або zum Schluss. Каже ж воно, що дещо може статися, а може й ні, — це vielleicht рівня A1 в діловому костюмі, доречне в пропозиціях, домовленостях і листах, де його скорочують до evtl. Як прикметник означає «можливий, якщо виникне»: eventuelle Kosten übernimmt die Versicherung.'

  - de: bestimmt
    ipa: "bəˈʃtɪmt"
    pos: adv
    # Recognition only: A2 ships `unbedingt` ("absolutely, definitely") and `sicher`
    # ("sure, certain") as production cards; a typed card here would grade which of
    # three the author had in mind.
    cards: recognition
    en: definitely, I am sure; particular
    ru: наверняка, точно; определённый
    uk: напевно, точно; певний
    example_de: Mach dir keine Sorgen, du bestehst die Prüfung bestimmt.
    example_en: Do not worry, you will definitely pass the exam.
    example_ru: Не волнуйся, экзамен ты наверняка сдашь.
    example_uk: Не хвилюйся, іспит ти напевно складеш.
    note:
      en: 'As an adverb it is a confident prediction, not knowledge: the speaker has no proof but expects to be right, which puts it above wahrscheinlich and just below sicher. As an adjective it means a particular one, singled out but not named — zu einer bestimmten Zeit, aus bestimmten Gründen — and it is the grammatical term for the definite article, der bestimmte Artikel. It is also the Partizip II of bestimmen, to determine.'
      ru: 'Как наречие это уверенное предсказание, а не знание: доказательств у говорящего нет, но он рассчитывает оказаться правым, — выше wahrscheinlich и чуть ниже sicher. Как прилагательное значит «определённый, некий конкретный, но не названный»: zu einer bestimmten Zeit, aus bestimmten Gründen, — и это же грамматический термин: der bestimmte Artikel, определённый артикль. Оно совпадает и с Partizip II глагола bestimmen — «определять».'
      uk: 'Як прислівник це впевнене передбачення, а не знання: доказів у мовця немає, але він розраховує мати рацію, — вище за wahrscheinlich і трохи нижче за sicher. Як прикметник означає «певний, якийсь конкретний, але не названий»: zu einer bestimmten Zeit, aus bestimmten Gründen, — і це ж граматичний термін: der bestimmte Artikel, означений артикль. Воно збігається й із Partizip II дієслова bestimmen — «визначати».'

  # --- Häufigkeit und Gewohnheit ---
  - de: häufig
    ipa: "ˈhɔʏ̯fɪç"
    pos: adj
    # Recognition only: A1 ships `oft` ("often") as a production card and the two are
    # interchangeable as adverbs; a typed card here would grade which was meant.
    cards: recognition
    en: frequent; frequently
    ru: частый; часто
    uk: частий; часто
    example_de: Fehler bei den Artikeln sind ein häufiges Problem für Lernende.
    example_en: Mistakes with articles are a frequent problem for learners.
    example_ru: Ошибки в артиклях — частая проблема для изучающих язык.
    example_uk: Помилки в артиклях — часта проблема для тих, хто вивчає мову.
    note:
      en: 'This is A1 oft with an adjective form attached. As adverbs the two are interchangeable (Ich fahre häufig mit dem Rad = oft), with oft the everyday spoken choice and this word the written one. The real difference is that only this one can stand in front of a noun and take endings: ein häufiger Fehler, in häufigen Fällen. Its comparative is häufiger and its superlative am häufigsten, while oft has the irregular öfter. The opposite is selten.'
      ru: 'Это oft с уровня A1, к которому прирастили форму прилагательного. Как наречия они взаимозаменяемы (Ich fahre häufig mit dem Rad = oft), причём oft разговорнее и обиходнее, а это слово письменное. Настоящая разница в том, что только оно может стоять перед существительным и принимать окончания: ein häufiger Fehler, in häufigen Fällen. Сравнительная степень — häufiger, превосходная — am häufigsten, тогда как у oft нерегулярное öfter. Противоположность — selten.'
      uk: 'Це oft рівня A1, до якого приростили форму прикметника. Як прислівники вони взаємозамінні (Ich fahre häufig mit dem Rad = oft), причому oft розмовніше й побутовіше, а це слово писемне. Справжня різниця в тому, що лише воно може стояти перед іменником і брати закінчення: ein häufiger Fehler, in häufigen Fällen. Вищий ступінь — häufiger, найвищий — am häufigsten, тоді як в oft нерегулярне öfter. Протилежність — selten.'

  - de: meist
    ipa: "ˈmaɪ̯st"
    pos: adv
    # Recognition only: A2 ships `meistens` as a production card with exactly this
    # meaning, and A2 `normalerweise` answers the same prompt.
    cards: recognition
    en: mostly, in most cases
    ru: чаще всего, по большей части
    uk: здебільшого, найчастіше
    example_de: Im Winter fahre ich meist mit der Bahn zur Arbeit.
    example_en: In winter I mostly take the train to work.
    example_ru: Зимой я чаще всего езжу на работу поездом.
    example_uk: Узимку я здебільшого їжджу на роботу потягом.
    note:
      en: 'The short adverb, and A2 meistens means exactly the same: the ending -ens carries no extra meaning, it just marks the commoner spoken form, while this one leans written. Keep it apart from the determiner die meisten, most of them, which takes adjective endings and stands in front of a noun: Die meisten Kollegen fahren mit dem Auto. And am meisten is the superlative of viel: Das hat mir am meisten geholfen.'
      ru: 'Короткое наречие, и meistens с уровня A2 значит ровно то же: окончание -ens ничего не добавляет, оно лишь помечает более обиходную устную форму, а это слово тяготеет к письму. Держите его отдельно от определителя die meisten («большинство»), который принимает окончания прилагательного и стоит перед существительным: Die meisten Kollegen fahren mit dem Auto. А am meisten — превосходная степень от viel: Das hat mir am meisten geholfen.'
      uk: 'Короткий прислівник, і meistens рівня A2 означає рівно те саме: закінчення -ens нічого не додає, воно лише позначає побутовішу усну форму, а це слово тяжіє до письма. Тримайте його окремо від означника die meisten («більшість»), який бере закінчення прикметника й стоїть перед іменником: Die meisten Kollegen fahren mit dem Auto. А am meisten — найвищий ступінь від viel: Das hat mir am meisten geholfen.'

  - de: gewöhnlich
    ipa: "gəˈvøːnlɪç"
    pos: adv
    # Recognition only: A2 ships `normalerweise` ("normally, usually") and `meistens`
    # as production cards, and `meist` on this list answers the same prompt.
    cards: recognition
    en: usually, as a rule; ordinary
    ru: обычно, как правило; обыкновенный
    uk: зазвичай, як правило; звичайний
    example_de: Gewöhnlich öffnet die Bäckerei schon um sechs Uhr.
    example_en: The bakery usually opens as early as six in the morning.
    example_ru: Обычно пекарня открывается уже в шесть утра.
    example_uk: Зазвичай пекарня відчиняється вже о шостій ранку.
    note:
      en: 'Two lives. As an adverb it names the habitual case and is the written neighbour of A2 normalerweise; wie gewöhnlich is the fixed phrase for as usual. As an adjective it means ordinary, and there it carries a warning: applied to a person it sounds dismissive, even coarse (ein ganz gewöhnlicher Kerl), so for neutral ordinary say normal or einfach. The derived ungewöhnlich, unusual, has no such overtone.'
      ru: 'Две жизни. Как наречие называет привычный порядок вещей и служит письменным соседом normalerweise с уровня A2; wie gewöhnlich — устойчивое «как обычно». Как прилагательное значит «обыкновенный», и здесь оно требует осторожности: сказанное о человеке, оно звучит пренебрежительно, почти грубо (ein ganz gewöhnlicher Kerl), поэтому для нейтрального «обычный» берут normal или einfach. У производного ungewöhnlich («необычный») такого оттенка нет.'
      uk: 'Два життя. Як прислівник називає звичний перебіг справ і служить писемним сусідом normalerweise рівня A2; wie gewöhnlich — стале «як завжди». Як прикметник означає «звичайний», і тут воно вимагає обережності: сказане про людину, воно звучить зневажливо, майже грубо (ein ganz gewöhnlicher Kerl), тому для нейтрального «звичайний» беруть normal або einfach. У похідного ungewöhnlich («незвичайний») такого відтінку немає.'

  # --- Menge, Auswahl, Verteilung ---
  - de: mehrere
    ipa: "ˈmeːʁəʁə"
    pos: pron
    en: several, a number of
    ru: несколько
    uk: кілька, декілька
    example_de: Ich habe mich bei mehreren Firmen beworben.
    example_en: I applied to several companies.
    example_ru: Я подал заявки в несколько фирм.
    example_uk: Я подав заяви до кількох фірм.
