      ru: 'Распределяет одно и то же утверждение по всем членам ряда — каждому курсу, каждому месяцу, каждому участнику — и формы не меняет. Будучи обычным наречием, оно может стоять в любом месте предложения. Более короткое je делает ту же работу, но только непосредственно перед считаемым существительным или числом (je Person, je zwei Stück), так что по позиции они не взаимозаменяемы. Встречается в расписаниях, прайс-листах и программах курсов; прилагательное jeweilig значит «соответствующий»: die jeweiligen Bedingungen.'
