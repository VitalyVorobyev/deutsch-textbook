      ru: 'Вопросительное слово для исчисляемого, и во множественном числе оно склоняется как прилагательное: Wie vielen Leuten hast du geschrieben? Wie viele Tage bleibst du? Для неисчисляемого количества немецкий берёт единственное число wie viel: Wie viel Zeit hast du? После реформы правописания 1996 года оба пишутся в два слова; слитное wieviel, которое ещё попадается в старых книгах, устарело. В косвенном вопросе спрягаемый глагол уходит в конец: Ich weiß nicht, wie viele kommen.'
      uk: 'Питальне слово для злічуваного, і в множині воно відмінюється як прикметник: Wie vielen Leuten hast du geschrieben? Wie viele Tage bleibst du? Для незлічуваної кількості німецька бере однину wie viel: Wie viel Zeit hast du? Після реформи правопису 1996 року обидва пишуться у два слова; злитне wieviel, яке ще трапляється в старих книжках, застаріло. У непрямому питанні відмінюване дієслово йде в кінець: Ich weiß nicht, wie viele kommen.'

