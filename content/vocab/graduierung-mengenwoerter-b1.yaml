    example_uk: Будь ласка, зверніть увагу на наступні пункти перед реєстрацією.
    note:
      en: 'It points forward inside a text and belongs to letters, notices and instructions: aus folgendem Grund, im folgenden Kapitel, Folgendes ist zu beachten. It is an ordinary adjective and takes ordinary endings. Do not confuse it with A2 nächst-: nächste Woche is the next one in time, this word is the next one on the page. Formally it is the Partizip I of folgen, to follow, and folgen also means to obey (einer Anweisung folgen).'
      ru: 'Указывает вперёд внутри текста и принадлежит письмам, объявлениям и инструкциям: aus folgendem Grund, im folgenden Kapitel, Folgendes ist zu beachten. Это обычное прилагательное с обычными окончаниями. Не путайте его с nächst- уровня A2: nächste Woche — следующий по времени, а это слово — следующий по тексту. Формально это Partizip I глагола folgen («следовать»), у которого есть и значение «подчиняться»: einer Anweisung folgen.'
      uk: 'Указує вперед усередині тексту й належить листам, оголошенням та інструкціям: aus folgendem Grund, im folgenden Kapitel, Folgendes ist zu beachten. Це звичайний прикметник зі звичайними закінченнями. Не плутайте його з nächst- рівня A2: nächste Woche — наступний за часом, а це слово — наступний за текстом. Формально це Partizip I дієслова folgen («слідувати»), у якого є й значення «підкорятися»: einer Anweisung folgen.'

  # --- Umfang: was zählt mit, was nicht ---
  - de: ausschließlich
    ipa: "ˈaʊ̯sʃliːslɪç"
    pos: adv
    # Recognition only: A1 ships `nur` ("only; just") as a production card and this
    # is its formal twin.
    cards: recognition
    en: exclusively, nothing but
    ru: исключительно, только
    uk: винятково, тільки
    example_de: Der Parkplatz ist ausschließlich für Kunden reserviert.
    example_en: The car park is reserved exclusively for customers.
    example_ru: Парковка предназначена исключительно для клиентов.
    example_uk: Парковка призначена винятково для клієнтів.
    note:
      en: 'The emphatic written nur: it shuts every other possibility out, and it is the word on notices, contracts and opening hours. As a preposition with the Genitiv it means not counting — ausschließlich der Nebenkosten — and in that use its opposite is einschließlich. The verb behind it is ausschließen, to exclude or to rule out; and der Ausschluss is exclusion.'
      ru: 'Подчёркнутое письменное nur: оно закрывает все прочие возможности и стоит на объявлениях, в договорах и в часах работы. Как предлог с Genitiv значит «не считая»: ausschließlich der Nebenkosten, — и в этом употреблении ему противостоит einschließlich. За ним стоит глагол ausschließen («исключать»), а der Ausschluss — «исключение».'
      uk: 'Підкреслене писемне nur: воно закриває всі інші можливості й стоїть на оголошеннях, у договорах і в годинах роботи. Як прийменник із Genitiv означає «не рахуючи»: ausschließlich der Nebenkosten, — і в цьому вживанні йому протистоїть einschließlich. За ним стоїть дієслово ausschließen («виключати»), а der Ausschluss — «виключення».'

  - de: einschließlich
    ipa: "ˈaɪ̯nʃliːslɪç"
    pos: prep
    # Recognition only: `inklusive` is already carded, `mit` covers the same ground
    # in speech, and this is contract and invoice language.
    cards: recognition
    en: including, up to and including
    ru: включая, включительно
    uk: включно з, включаючи
    example_de: Die Miete beträgt 700 Euro einschließlich Heizung.
    example_en: The rent is 700 euros including heating.
    example_ru: Аренда составляет 700 евро, включая отопление.
    example_uk: Оренда становить 700 євро, включно з опаленням.
    note:
      en: 'A preposition that takes the Genitiv in careful writing — einschließlich der Nebenkosten — but leaves a bare noun uninflected when nothing else marks the case (einschließlich Heizung, einschließlich Frühstück). With a date it says the day itself still counts: geöffnet bis einschließlich Freitag. Everyday German says inklusive, abbreviated inkl., or simply mit; the opposites are ausschließlich and exklusive.'
      ru: 'Предлог, который в аккуратном письме управляет Genitiv — einschließlich der Nebenkosten, — но оставляет голое существительное без склонения, когда падеж больше ничем не помечен (einschließlich Heizung, einschließlich Frühstück). С датой он говорит, что сам этот день ещё считается: geöffnet bis einschließlich Freitag. В обиходе немцы говорят inklusive (сокращённо inkl.) или просто mit; противоположности — ausschließlich и exklusive.'
      uk: 'Прийменник, який в охайному письмі керує Genitiv — einschließlich der Nebenkosten, — але лишає голий іменник без відмінювання, коли відмінок більше нічим не позначено (einschließlich Heizung, einschließlich Frühstück). Із датою він каже, що сам цей день ще рахується: geöffnet bis einschließlich Freitag. У побуті німці кажуть inklusive (скорочено inkl.) або просто mit; протилежності — ausschließlich та exklusive.'

  - de: extra
    ipa: "ˈɛkstʁa"
    pos: adv
    en: on purpose, specially for that
    ru: специально, ради этого
    uk: спеціально, задля цього
    example_de: Ich bin extra früher gekommen, um dir zu helfen.
    example_en: I came earlier on purpose in order to help you.
    example_ru: Я специально пришёл раньше, чтобы тебе помочь.
    example_uk: Я спеціально прийшов раніше, щоб тобі допомогти.
    note:
      en: 'It says the action was taken for this one purpose and would not have happened otherwise: Das habe ich extra für dich gebacken. A second sense, unrelated to the first, means on top of the price or separately: Das Frühstück kostet extra; Können wir extra bezahlen? The word never inflects, so in front of a noun the neutral choice for additional is zusätzlich (zusätzliche Kosten). For a deliberate act that harms someone German says absichtlich.'
      ru: 'Говорит, что действие совершено ради этой одной цели и иначе не состоялось бы: Das habe ich extra für dich gebacken. Второе, не связанное с первым значение — «сверх цены, отдельно»: Das Frühstück kostet extra; Können wir extra bezahlen? Слово не склоняется, поэтому перед существительным нейтральное «дополнительный» — это zusätzlich (zusätzliche Kosten). Для намеренного действия во вред немецкий берёт absichtlich.'
      uk: 'Каже, що дію вчинено заради цієї однієї мети і що інакше вона не сталася б: Das habe ich extra für dich gebacken. Друге, не пов’язане з першим значення — «понад ціну, окремо»: Das Frühstück kostet extra; Können wir extra bezahlen? Слово не відмінюється, тому перед іменником нейтральне «додатковий» — це zusätzlich (zusätzliche Kosten). Для навмисної дії на шкоду німецька бере absichtlich.'

  # --- Wiederholung und Zeitpunkt ---
  - de: noch mal
    ipa: "nɔx ˈmaːl"
    pos: adv
    # Recognition only: A2 ships `wieder` ("again") as a production card, `nochmals`
    # below says the same at another register, and a typed card here would grade the
    # space against the very frequent misspelling `nochmal`.
    cards: recognition
    en: again, one more time
    ru: ещё раз
    uk: ще раз
    example_de: Kannst du das bitte noch mal erklären?
    example_en: Could you please explain that one more time?
    example_ru: Можешь, пожалуйста, объяснить это ещё раз?
    example_uk: Можеш, будь ласка, пояснити це ще раз?
    note:
      en: 'The everyday spoken short form of noch einmal, and standard spelling keeps it as two words — the solid nochmal is everywhere in chats, but the dictionary marks it colloquial, so a written exam wants noch mal or noch einmal. It counts a repetition, a second time, where A2 wieder only says the thing is happening once more. It is the normal way to ask someone to repeat: Wie bitte, noch mal? And noch mal so teuer means twice as expensive, not once more.'
      ru: 'Обиходная устная краткая форма от noch einmal, и нормативное написание держит её в два слова: слитное nochmal сплошь и рядом встречается в переписке, но словарь помечает его как разговорное, поэтому в письменной работе пишите noch mal или noch einmal. Оборот считает повтор — «во второй раз», — тогда как wieder уровня A2 просто говорит, что нечто происходит снова. Это обычный способ попросить повторить: Wie bitte, noch mal? А noch mal so teuer значит «вдвое дороже», а не «ещё раз дорого».'
      uk: 'Побутова усна коротка форма від noch einmal, і нормативне написання тримає її у два слова: злите nochmal раз у раз трапляється в листуванні, але словник позначає його як розмовне, тож у письмовій роботі пишіть noch mal або noch einmal. Зворот лічить повтор — «удруге», — тоді як wieder рівня A2 просто каже, що дещо відбувається знову. Це звичайний спосіб попросити повторити: Wie bitte, noch mal? А noch mal so teuer означає «удвічі дорожче», а не «ще раз дорого».'

  - de: nochmals
    ipa: "ˈnɔxmaːls"
    pos: adv
    # Recognition only: identical in meaning to `noch mal` above at a higher
    # register, and A2 already ships `wieder` as the production card for "again".
    cards: recognition
    en: once again, once more
    ru: ещё раз, повторно
    uk: ще раз, повторно
    example_de: Wir bitten nochmals um Entschuldigung für die Verspätung.
    example_en: We apologise once again for the delay.
    example_ru: Мы ещё раз приносим извинения за задержку.
    example_uk: Ми ще раз перепрошуємо за затримку.
    note:
      en: 'The formal one-word form, at home in letters, announcements and customer service: nochmals vielen Dank, nochmals herzlich willkommen, nochmals nachfragen. Its meaning is identical to noch mal; only the register differs, and unlike that phrase it is never split into two words. In conversation it sounds stiff, so speech takes noch mal.'
      ru: 'Официальная однословная форма, уместная в письмах, объявлениях и клиентском обслуживании: nochmals vielen Dank, nochmals herzlich willkommen, nochmals nachfragen. По значению она тождественна noch mal; различается только регистр, и, в отличие от того оборота, это слово никогда не пишется в два слова. В разговоре звучит натянуто, поэтому в речи берут noch mal.'
      uk: 'Офіційна однослівна форма, доречна в листах, оголошеннях і клієнтському обслуговуванні: nochmals vielen Dank, nochmals herzlich willkommen, nochmals nachfragen. За значенням вона тотожна noch mal; різниться лише регістр, і, на відміну від того звороту, це слово ніколи не пишеться у два слова. У розмові звучить силувано, тому в мовленні беруть noch mal.'

  - de: bereits
    ipa: "bəˈʁaɪ̯ts"
    pos: adv
    # Recognition only: A1 ships `schon` ("already") as a production card and this
    # is its written twin.
    cards: recognition
    en: already, as early as
    ru: уже
    uk: уже
    example_de: Der Antrag liegt bereits seit drei Wochen bei der Behörde.
    example_en: The application has already been with the authority for three weeks.
    example_ru: Заявление лежит в ведомстве уже три недели.
    example_uk: Заява лежить у відомстві вже три тижні.
    note:
      en: 'The written twin of A1 schon, with the same meaning and the same position in the clause; reports, letters and news texts prefer this one, while speech runs on schon. The difference is that it is only ever an adverb — schon is also a modal particle, and Das ist schon gut, meaning that is fine as it is, cannot be said with this word. In front of a figure it stresses that the amount is surprisingly high: bereits 200 Teilnehmer haben sich angemeldet.'
      ru: 'Письменный двойник schon с уровня A1, с тем же значением и тем же местом в предложении; отчёты, письма и новостные тексты предпочитают его, а речь держится на schon. Разница в том, что это только наречие: schon бывает ещё и модальной частицей, и фразу Das ist schon gut («да ладно, и так хорошо») этим словом не скажешь. Перед числом оно подчёркивает, что величина неожиданно велика: bereits 200 Teilnehmer haben sich angemeldet.'
      uk: 'Писемний двійник schon рівня A1, із тим самим значенням і тим самим місцем у реченні; звіти, листи й новинні тексти віддають перевагу йому, а мовлення тримається на schon. Різниця в тому, що це лише прислівник: schon буває ще й модальною часткою, і фразу Das ist schon gut («та гаразд, і так добре») цим словом не скажеш. Перед числом воно підкреслює, що величина несподівано велика: bereits 200 Teilnehmer haben sich angemeldet.'

  - de: "so viel"
    ipa: "zoː ˈfiːl"
    pos: pron
    cards: both
    en: that much; so much
    ru: столько; так много
    uk: стільки; так багато
    example_de: So viel Zeit haben wir heute nicht.
    example_en: We do not have that much time today.
    example_ru: Сегодня у нас нет столько времени.
    example_uk: Сьогодні в нас немає стільки часу.
    note:
      en: 'Two words when viel carries the amount: so viel Zeit, so viel wie möglich. The conjunction soviel, written as one word, is rare and introduces what the speaker knows: Soviel ich weiß, … Keep the amount form separate.'
      ru: 'Два слова, когда viel называет количество: so viel Zeit, so viel wie möglich. Редкий союз soviel пишется слитно и вводит предел знания: Soviel ich weiß, … Форму количества пишите раздельно.'
      uk: 'Два слова, коли viel називає кількість: so viel Zeit, so viel wie möglich. Рідкісний сполучник soviel пишеться разом і вводить межу знання: Soviel ich weiß, … Форму кількості пишіть окремо.'
