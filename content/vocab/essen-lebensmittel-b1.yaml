      uk: 'Слово злічуване й ботанічне: один примірник на гілці, а множина бере умлаут — die Früchte. das Obst рівня A1 — збірне слово про те, що купують і їдять, множини в нього немає взагалі, і саме воно стоїть у списку покупок. Оскільки помідор і огірок ботанічно належать сюди і ніколи до Obst, науковий текст і зеленяр розходяться свідомо. У переносному сенсі це результат: die Früchte seiner Arbeit.'

