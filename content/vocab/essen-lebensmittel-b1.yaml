      ru: 'Постоянная противоположность scharf уровня A2 в меню и на упаковке: mild oder scharf — вопрос у турецкого прилавка, и ответ решает, сколько положат чили. Работает и о сыре, и о кофе, где значит «неострый, некрепкий». Вне еды описывает погоду — ein milder Winter — и человеческое суждение: eine milde Strafe — мягкий приговор. Конечное d оглушается в t.'
      uk: 'Постійна протилежність scharf рівня A2 в меню й на упаковці: mild oder scharf — питання біля турецького прилавка, і відповідь вирішує, скільки покладуть чилі. Працює і про сир, і про каву, де означає «негострий, неміцний». Поза їжею описує погоду — ein milder Winter — і людське судження: eine milde Strafe — м’який вирок. Кінцеве d оглушується в t.'

