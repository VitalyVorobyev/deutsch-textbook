      ru: 'О продукте это похвала на упаковке — mageres Hackfleisch, magerer Quark, — а маркетинговая форма fettarm. О человеке — нет: dünn уровня A2 нейтрально, schlank лестно, а это намекает на нехватку плоти, и в разговоре так о человеке говорить недобро. Третье, переносное употребление — про разочарование: ein mageres Ergebnis — скудный результат.'
