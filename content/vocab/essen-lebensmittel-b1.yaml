      ru: 'Существительное от schmecken уровня A1, и два его значения живут в разных комнатах: вкус на языке — ein süßer Geschmack — и вкус эстетический, который держится на устойчивых фразах. Über Geschmack lässt sich nicht streiten — немецкое «о вкусах не спорят», а Das ist Geschmackssache закрывает спор. Множественное die Geschmäcker принадлежит только второму значению. Прилагательное geschmacklos значит и «безвкусный», и «бестактный».'
      uk: 'Іменник від schmecken рівня A1, і два його значення живуть у різних кімнатах: смак на язиці — ein süßer Geschmack — і смак естетичний, який тримається на усталених фразах. Über Geschmack lässt sich nicht streiten — німецьке «про смаки не сперечаються», а Das ist Geschmackssache закриває суперечку. Множина die Geschmäcker належить лише другому значенню. Прикметник geschmacklos означає і «несмачний», і «нетактовний».'

