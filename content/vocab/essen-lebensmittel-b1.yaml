      ru: 'Средний род, множественного нет, а немцы продают его по номеру типа, крупно напечатанному на пакете: Mehl Type 405 — тонкая белая для тортов, 1050 темнее, а Vollkornmehl — цельнозерновая. Рецепт скажет Mehl sieben, «просеять», а получается из неё der Teig. Гласный долгий, h не произносится: оно лишь обозначает долготу, как в nehmen и Zahl.'
      uk: 'Середній рід, множини немає, а німці продають його за номером типу, великим шрифтом надрукованим на пакеті: Mehl Type 405 — тонке біле для тортів, 1050 темніше, а Vollkornmehl — цільнозернове. Рецепт скаже Mehl sieben, «просіяти», а виходить із нього der Teig. Голосний довгий, h не вимовляється: воно лише позначає довготу, як у nehmen і Zahl.'

