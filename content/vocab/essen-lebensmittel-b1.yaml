      ru: 'Долгое o и немое h — ровно как в Schuh и früh. Это постоянная противоположность gekocht и gebraten, и немцы строят на нём целые кулинарные слова: die Rohkost — тарелка сырых овощей, roher Schinken — вяленая ветчина. О человеке значит «грубый, жестокий» — ein roher Kerl, — и это куда более резкое слово, чем подсказывает кулинарный смысл. С rot уровня A2, цветом, оно не родственно.'
      uk: 'Довге o і німе h — точно як у Schuh і früh. Це постійна протилежність gekocht і gebraten, і німці будують на ньому цілі кулінарні слова: die Rohkost — тарілка сирих овочів, roher Schinken — в’ялена шинка. Про людину означає «грубий, жорстокий» — ein roher Kerl, — і це набагато різкіше слово, ніж підказує кулінарний сенс. Із rot рівня A2, кольором, воно не споріднене.'

