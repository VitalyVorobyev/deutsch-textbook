# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the food field of
# data/goethe-b1-wortliste.txt: what goes into the trolley beyond the basics, what a
# recipe does with it, and the words a menu and a label use for the result.
# A1's `essen-trinken` owns the shopping basket (Brot, Butter, Käse, Milch, Fleisch,
# Obst, Zucker, Salz, Wurst, Hunger, Durst, kochen) and A2's `essen-trinken-a2` owns
# the restaurant (Gericht, Lebensmittel, Hähnchen, Vorspeise, bestellen, scharf,
# probieren). This deck is what those two leave on the shelf — the second row of the
# supermarket and the middle of the recipe.
# The Austrian and Swiss siblings of several headwords here (Marille, Faschierte,
# Obers, Rüebli, Knödel) are held back for the Varianten deck of wave 4; where one
# exists, this deck's `note` names it and nothing more.
id: essen-lebensmittel-b1
title_de: "Essen und Lebensmittel"
title_en: "Food and groceries"
title_ru: "Еда и продукты"
title_uk: "Їжа та продукти"
level: B1
entries:
  # --- Fleisch, wie es im Laden liegt ---
  - de: Hackfleisch
    ipa: "ˈhakˌflaɪ̯ʃ"
    pos: noun
    gender: n
    plural: "—"
    en: meat put through a mincer, sold loose by the kilo for meatballs and sauces
    ru: мясо, пропущенное через мясорубку и продаваемое на вес для котлет и соусов
    uk: м’ясо, пропущене через м’ясорубку і продаване на вагу для котлет і соусів
    example_de: Für die Soße brauchen wir ein halbes Kilo Hackfleisch.
    example_en: We need half a kilo of mince for the sauce.
    example_ru: Для соуса нам нужно полкило фарша.
    example_uk: Для соусу нам потрібно півкіла фаршу.
    note:
      en: 'A mass noun with no plural, ordered by weight at the counter: 500 Gramm Hackfleisch, bitte. Germany distinguishes what is in it — Rinderhack from beef, gemischtes Hack from beef and pork together — and the raw seasoned kind eaten on a bread roll is das Mett, which no other country will offer you. In Austria the same product is das Faschierte. The compound''s first half is hacken, to chop.'
      ru: 'Неисчисляемое, без множественного числа, заказывают на вес: 500 Gramm Hackfleisch, bitte. Германия различает состав — Rinderhack из говядины, gemischtes Hack из говядины со свининой, — а сырой приправленный фарш, который едят на булочке, называется das Mett, и больше нигде вам такого не предложат. В Австрии тот же продукт зовётся das Faschierte. Первая половина слова — глагол hacken, «рубить».'
      uk: 'Незлічуване, без множини, замовляють на вагу: 500 Gramm Hackfleisch, bitte. Німеччина розрізняє склад — Rinderhack із яловичини, gemischtes Hack із яловичини зі свининою, — а сирий приправлений фарш, який їдять на булочці, зветься das Mett, і більше ніде вам такого не запропонують. В Австрії той самий продукт зветься das Faschierte. Перша половина слова — дієслово hacken, «рубати».'

  - de: Schinken
    ipa: "ˈʃɪŋkn̩"
    pos: noun
    gender: m
    plural: "die Schinken"
    en: the salted or smoked leg of a pig, cut in thin slices for a bread roll
    ru: солёный или копчёный свиной окорок, нарезанный тонкими ломтиками на бутерброд
    uk: солоний або копчений свинячий окіст, нарізаний тонкими скибочками на бутерброд
    example_de: Auf dem Brötchen ist Schinken und ein bisschen Butter.
    example_en: There is ham and a little butter on the roll.
    example_ru: На булочке ветчина и немного масла.
    example_uk: На булочці шинка і трохи масла.
    note:
      en: 'Distinct from A1 die Wurst, which is minced and pushed into a skin; this is one muscle, cured whole and then sliced. The two German kinds are named by the method and both appear on every breakfast board: gekochter Schinken is boiled and pale, roher Schinken air-dried and dark red, and Schwarzwälder Schinken is the famous smoked one. Singular and plural are spelled alike. Figuratively a Schinken is a fat, heavy book.'
      ru: 'Не то же, что die Wurst уровня A1: та рубленая и набита в оболочку, а здесь одна мышца, засоленная целиком и нарезанная. Немецкие разновидности названы по способу и обе лежат на любом завтраке: gekochter Schinken — варёная, бледная, roher Schinken — вяленая, тёмно-красная, а Schwarzwälder Schinken — знаменитая копчёная. Единственное и множественное пишутся одинаково. В переносном смысле Schinken — толстая тяжёлая книга.'
      uk: 'Не те саме, що die Wurst рівня A1: та січена й набита в оболонку, а тут один м’яз, засолений цілком і нарізаний. Німецькі різновиди названо за способом, і обидва лежать на будь-якому сніданку: gekochter Schinken — варена, бліда, roher Schinken — в’ялена, темно-червона, а Schwarzwälder Schinken — славетна копчена. Однина й множина пишуться однаково. У переносному сенсі Schinken — товста важка книжка.'

  - de: Schnitzel
    ipa: "ˈʃnɪtsl̩"
    pos: noun
    gender: n
    plural: "die Schnitzel"
    # Recognition only: a menu line rather than a shopping word — what a learner
    # produces at the table is A2 `bestellen` plus the name read off the card.
    cards: recognition
    en: a thin flat piece of meat, coated in breadcrumbs and fried in a pan
    ru: тонкий плоский кусок мяса, обваленный в сухарях и обжаренный на сковороде
    uk: тонкий плаский шматок м’яса, обкачаний у сухарях і засмажений на сковороді
    example_de: Zum Schnitzel gibt es Kartoffelsalat und eine Zitrone.
    example_en: The schnitzel comes with potato salad and a slice of lemon.
    example_ru: К шницелю подают картофельный салат и дольку лимона.
    example_uk: До шніцеля подають картопляний салат і скибку лимона.
    note:
      en: 'Neuter, and the plural is spelled like the singular. The name protected by Austrian law is das Wiener Schnitzel, which must be veal; anything else has to say what it is — das Schweineschnitzel, or, if it is not breaded at all, das Schnitzel Natur. Beside it on a German menu, das Kotelett keeps its bone and der Braten is a whole roasted joint. The word comes from schnitzen, to carve.'
      ru: 'Средний род, множественное пишется как единственное. Название, защищённое австрийским законом, — das Wiener Schnitzel, и это непременно телятина; всё прочее обязано назвать себя: das Schweineschnitzel, а если панировки нет вовсе — das Schnitzel Natur. Рядом в немецком меню das Kotelett сохраняет косточку, а der Braten — целый запечённый кусок. Слово идёт от schnitzen, «вырезать».'
      uk: 'Середній рід, множина пишеться як однина. Назва, захищена австрійським законом, — das Wiener Schnitzel, і це неодмінно телятина; усе інше зобов’язане назвати себе: das Schweineschnitzel, а якщо паніровки немає зовсім — das Schnitzel Natur. Поряд у німецькому меню das Kotelett зберігає кісточку, а der Braten — цілий запечений шматок. Слово походить від schnitzen, «вирізати».'

  - de: Hühnchen
    ipa: "ˈhyːnçən"
    pos: noun
    gender: n
    plural: "die Hühnchen"
    # Recognition only: A2 ships `Hähnchen` ("chicken (as food)", essen-trinken-a2) as
    # a production card, and the two differ by one umlaut — the `Überstunde` ruling
    # from arbeit-beruf-b1, where a near-identical string can only ever be keyed.
    cards: recognition
    en: a whole young bird from the poultry counter, roasted or fried
    ru: целая молодая птица с прилавка птицы, запечённая или жареная
    uk: ціла молода птиця з прилавка птиці, запечена або смажена
    example_de: Am Sonntag gibt es bei uns oft Hühnchen mit Reis.
    example_en: We often have chicken with rice on Sundays.
    example_ru: По воскресеньям у нас часто курица с рисом.
    example_uk: У неділю в нас часто курка з рисом.
    note:
      en: 'One umlaut away from A2 das Hähnchen, and in a shop the two are used for the same thing — northern Germany says the ä form, the south and Austria prefer this one or das Hendl. Strictly the ä word is a young cock and this one a young hen, but no butcher keeps that apart. The bird alive is das Huhn, and the meat on a menu is das Hühnerfleisch. The idiom ein Hühnchen mit jemandem rupfen means to have a bone to pick.'
      ru: 'На один умлаут отличается от das Hähnchen уровня A2, и в магазине оба слова означают одно и то же: север Германии говорит через ä, юг и Австрия предпочитают эту форму или das Hendl. Строго говоря, форма с ä — это молодой петушок, а эта — молодая курочка, но ни один мясник этого не различает. Живая птица — das Huhn, а мясо в меню — das Hühnerfleisch. Оборот ein Hühnchen mit jemandem rupfen значит «свести счёты».'
      uk: 'На один умлаут відрізняється від das Hähnchen рівня A2, і в магазині обидва слова означають те саме: північ Німеччини каже через ä, південь і Австрія віддають перевагу цій формі або das Hendl. Строго кажучи, форма з ä — це молодий півник, а ця — молода курочка, але жоден м’ясник цього не розрізняє. Жива птиця — das Huhn, а м’ясо в меню — das Hühnerfleisch. Зворот ein Hühnchen mit jemandem rupfen означає «звести рахунки».'

  # --- Aus dem Kühlregal und vom Frühstückstisch ---
  - de: Sahne
    ipa: "ˈzaːnə"
    pos: noun
    gender: f
    plural: "—"
    en: the thick fatty top of the milk, poured over fruit or stirred into a sauce
    ru: густая жирная часть молока, которую льют к фруктам или добавляют в соус
    uk: густа жирна частина молока, яку ллють до фруктів або додають у соус
    example_de: In die Soße kommt am Ende noch ein Becher Sahne.
    example_en: A tub of cream goes into the sauce at the end.
    example_ru: В конце в соус добавляют стаканчик сливок.
    example_uk: Наприкінці в соус додають склянку вершків.
    note:
      en: 'A mass noun with no plural, sold in small tubs marked with a fat percentage. Do not reach for A2 die Creme, which is what you put on your skin — the two are separate words in German where English has one. Austria says das Obers and Switzerland der Rahm for exactly this. Beaten stiff it changes its name, and that is the next entry but one.'
      ru: 'Неисчисляемое, без множественного числа, продаётся в стаканчиках с указанием жирности. Не берите die Creme уровня A2: то, что наносят на кожу, — в немецком другое слово. В Австрии это das Obers, в Швейцарии der Rahm. Взбитые, они меняют название — об этом через запись.'
      uk: 'Незлічуване, без множини, продається в склянках із зазначенням жирності. Не беріть die Creme рівня A2: те, що наносять на шкіру, — у німецькій інше слово. В Австрії це das Obers, у Швейцарії der Rahm. Збиті, вони змінюють назву — про це через запис.'

  - de: Schlagsahne
    ipa: "ˈʃlaːkˌzaːnə"
    pos: noun
    gender: f
    plural: "—"
    # Recognition only: the same referent as the entry above once it has been beaten,
    # and this deck sells the production card to the shorter, commoner word.
    cards: recognition
    en: cream that has been beaten stiff and spooned onto cake or hot chocolate
    ru: сливки, взбитые до густоты и положенные ложкой на пирог или в горячий шоколад
    uk: вершки, збиті до густоти й покладені ложкою на пиріг чи в гарячий шоколад
    example_de: Möchten Sie den Kuchen mit Schlagsahne?
    example_en: Would you like the cake with whipped cream?
    example_ru: Хотите пирог со взбитыми сливками?
    example_uk: Хочете пиріг зі збитими вершками?
    note:
      en: 'Built from schlagen, to beat, and it names both the liquid sold for whipping and the finished white heap on the plate. In a café the question comes as mit Sahne? and everybody understands the long form is meant. Austria says das Schlagobers or simply Obers, Switzerland der Schlagrahm. Primary stress on Schlag-, secondary on -sahne, like every German compound.'
      ru: 'Образовано от schlagen, «взбивать», и называет и жидкость, которую продают для взбивания, и готовую белую горку на тарелке. В кафе спросят просто mit Sahne?, и все поймут, что имеется в виду именно это. Австрия говорит das Schlagobers или просто Obers, Швейцария — der Schlagrahm. Главное ударение на Schlag-, побочное на -sahne, как во всяком немецком сложном слове.'
      uk: 'Утворене від schlagen, «збивати», і називає і рідину, яку продають для збивання, і готову білу гірку на тарілці. У кав’ярні спитають просто mit Sahne?, і всі зрозуміють, що йдеться саме про це. Австрія каже das Schlagobers або просто Obers, Швейцарія — der Schlagrahm. Головний наголос на Schlag-, побічний на -sahne, як у кожному німецькому складному слові.'

  - de: Margarine
    ipa: "maʁgaˈʁiːnə"
    pos: noun
    gender: f
    plural: "—"
    # Recognition only: a label word beside A1 `Butter`, which owns the spread a
    # learner asks for at the table.
    cards: recognition
    en: the cheaper plant-based spread sold in a tub beside the butter
    ru: более дешёвая растительная намазка, которую продают в ванночке рядом с маслом
    uk: дешевша рослинна намазка, яку продають у ванночці поряд із маслом
    example_de: Für den Kuchen nehme ich lieber Butter als Margarine.
    example_en: I would rather use butter than margarine for the cake.
    example_ru: Для пирога я лучше возьму сливочное масло, а не маргарин.
    example_uk: Для пирога я краще візьму вершкове масло, а не маргарин.
    note:
      en: 'Stress on the -ri-, and the g before a is hard. No plural: like A1 die Butter it is measured, not counted. German packaging distinguishes die Halbfettmargarine and die Pflanzenmargarine, and a recipe that allows either says Butter oder Margarine. The word for spreading any of it is streichen, and what you get is der Brotaufstrich.'
      ru: 'Ударение на -ri-, g перед a твёрдое. Множественного нет: как и die Butter уровня A1, слово меряют, а не считают. На немецких упаковках различают die Halbfettmargarine и die Pflanzenmargarine, а рецепт, допускающий и то и другое, пишет Butter oder Margarine. Глагол «намазывать» — streichen, а сама намазка — der Brotaufstrich.'
      uk: 'Наголос на -ri-, g перед a тверде. Множини немає: як і die Butter рівня A1, слово міряють, а не рахують. На німецьких упаковках розрізняють die Halbfettmargarine і die Pflanzenmargarine, а рецепт, що припускає і те й те, пише Butter oder Margarine. Дієслово «намащувати» — streichen, а сама намазка — der Brotaufstrich.'

  - de: Marmelade
    ipa: "maʁməˈlaːdə"
    pos: noun
    gender: f
    plural: "die Marmeladen"
    en: the sweet spread of boiled fruit and sugar that goes on bread in the morning
    ru: сладкая намазка из уваренных с сахаром плодов, которую утром кладут на хлеб
    uk: солодка намазка з уварених із цукром плодів, яку вранці кладуть на хліб
    example_de: Zum Frühstück esse ich ein Brot mit Marmelade.
    example_en: I have a slice of bread with jam for breakfast.
    example_ru: На завтрак я ем хлеб с вареньем.
    example_uk: На сніданок я їм хліб із варенням.
    note:
      en: 'The everyday word — what stands on a German breakfast table and what a child asks for. EU law reserves it for citrus only and makes producers print die Konfitüre on everything else, which is why the label and the sentence disagree; speech has ignored the rule completely. Not the English marmalade, which is only the orange kind. The jar is das Marmeladenglas, and Erdbeermarmelade names the fruit in front.'
      ru: 'Обиходное слово — то, что стоит на немецком завтраке и что просит ребёнок. Закон ЕС оставляет его за цитрусовыми и заставляет производителей писать на всём остальном die Konfitüre, отчего этикетка и живая речь расходятся; речь правило просто игнорирует. Это не английское marmalade, которое означает только апельсиновое. Банка — das Marmeladenglas, а Erdbeermarmelade называет плод впереди.'
      uk: 'Побутове слово — те, що стоїть на німецькому сніданку і що просить дитина. Закон ЄС лишає його за цитрусовими і змушує виробників писати на всьому іншому die Konfitüre, через що етикетка й жива мова розходяться; мовлення правило просто ігнорує. Це не англійське marmalade, яке означає лише апельсинове. Банка — das Marmeladenglas, а Erdbeermarmelade називає плід попереду.'

  - de: Konfitüre
    ipa: "kɔnfiˈtyːʁə"
    pos: noun
    gender: f
    plural: "die Konfitüren"
    # Recognition only: the same referent as the entry above, in the wording the label
    # is legally obliged to use — the deck sells the typed card to the spoken word.
    cards: recognition
    en: the wording a jar must carry for that spread when the law fixes its fruit content
    ru: обозначение, которое банка обязана нести по закону, если доля плодов задана нормой
    uk: позначення, яке банка зобов’язана нести за законом, якщо частку плодів задано нормою
    example_de: Auf dem Glas steht Konfitüre extra mit fünfzig Prozent Frucht.
    example_en: The jar says extra jam with fifty per cent fruit.
    example_ru: На банке стоит надпись «конфитюр экстра» с пятьюдесятью процентами плодов.
    example_uk: На банці стоїть напис «конфітюр екстра» з п’ятдесятьма відсотками плодів.
    note:
      en: 'A French loan, stressed on the -tü-, and in Germany a legal term rather than a household one: the grade Konfitüre extra requires a stated proportion of whole fruit. Nobody says it at breakfast. Switzerland is the exception — there it is the ordinary word and Marmelade sounds foreign. A useful reflex: read it on the shelf, say the other one at the table.'
      ru: 'Французское заимствование с ударением на -tü-, и в Германии это скорее юридический термин, чем домашний: сорт Konfitüre extra требует определённой доли цельных плодов. За завтраком так никто не говорит. Исключение — Швейцария: там это обычное слово, а Marmelade звучит чужеродно. Полезный рефлекс: читать его на полке, а за столом говорить другое.'
      uk: 'Французьке запозичення з наголосом на -tü-, і в Німеччині це радше юридичний термін, ніж домашній: ґатунок Konfitüre extra вимагає певної частки цілих плодів. За сніданком так ніхто не каже. Виняток — Швейцарія: там це звичайне слово, а Marmelade звучить чужорідно. Корисний рефлекс: читати його на полиці, а за столом казати інше.'

  - de: Honig
    ipa: "ˈhoːnɪç"
    pos: noun
    gender: m
    plural: "—"
    en: the thick golden sweetener bees make, spooned into tea or spread on bread
    ru: густой золотистый подсластитель, который делают пчёлы, — его кладут в чай или мажут на хлеб
    uk: густий золотистий підсолоджувач, який роблять бджоли, — його кладуть у чай або мажуть на хліб
    example_de: Bei Halsschmerzen trinke ich Tee mit Honig.
    example_en: I drink tea with honey when I have a sore throat.
    example_ru: При боли в горле я пью чай с мёдом.
    example_uk: Коли болить горло, я п’ю чай із медом.
    note:
      en: 'Masculine, no plural, and the final -ig is spoken like the ich-Laut in standard German: ˈhoːnɪç, not -ik. That rule covers a whole family — wenig, richtig, billig. The label word for the good kind is der Imkerhonig or Honig aus der Region; the runny sort is flüssiger Honig and the set sort fester Honig. The idiom jemandem Honig ums Maul schmieren is to flatter somebody shamelessly.'
      ru: 'Мужской род, множественного нет, а конечное -ig в литературном немецком звучит как ich-Laut: ˈhoːnɪç, а не -ik. Правило охватывает целое семейство: wenig, richtig, billig. На этикетке хороший сорт обозначают der Imkerhonig или Honig aus der Region; жидкий — flüssiger Honig, севший — fester Honig. Оборот jemandem Honig ums Maul schmieren значит «беззастенчиво льстить».'
      uk: 'Чоловічий рід, множини немає, а кінцеве -ig у літературній німецькій звучить як ich-Laut: ˈhoːnɪç, а не -ik. Правило охоплює ціле сімейство: wenig, richtig, billig. На етикетці добрий ґатунок позначають der Imkerhonig або Honig aus der Region; рідкий — flüssiger Honig, зацукрований — fester Honig. Зворот jemandem Honig ums Maul schmieren означає «безсоромно лестити».'

