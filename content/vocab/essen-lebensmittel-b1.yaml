      ru: 'Употребляется во множественном числе и почти никогда в единственном, хотя die Zutat существует. Это заголовок первого блока любого немецкого рецепта и, по закону, самый мелкий шрифт на любой упаковке, где порядок задан весом: чего больше, то и первое. За словом стоит глагол zutun, «добавлять», — буквально «то, что кладут». Рядом die Menge — сколько чего, а die Zubereitung — способ приготовления.'
