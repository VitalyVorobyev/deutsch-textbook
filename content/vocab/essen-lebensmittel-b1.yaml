      ru: 'Образовано от das Salz уровня A1 суффиксом -ig, который превращает вещество в свойство «имеющий это», — тот же шаг, что от Sonne к sonnig и в durstig ниже. Само по себе слово нейтрально; жалобе нужен zu впереди, как в примере. За столом его напарники — süß, sauer и bitter, а также scharf уровня A2, где речь об остроте, а не о соли. Конечное -ig звучит как ich-Laut.'
      uk: 'Утворене від das Salz рівня A1 суфіксом -ig, який перетворює речовину на властивість «той, що має це», — той самий крок, що від Sonne до sonnig і в durstig нижче. Саме по собі слово нейтральне; скарзі потрібен zu попереду, як у прикладі. За столом його напарники — süß, sauer і bitter, а також scharf рівня A2, де йдеться про гостроту, а не про сіль. Кінцеве -ig звучить як ich-Laut.'

