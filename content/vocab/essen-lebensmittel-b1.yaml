      ru: 'Почти то же слово, что das Lebensmittel уровня A2, и различие тут не смысловое, а регистровое: это принадлежит науке о питании и новостям о голоде и ценах, а слово уровня A2 висит над рядом в супермаркете и попадает в список покупок. Оба среднего рода, и у обоих множественное пишется как единственное. Первая половина — die Nahrung, «пропитание».'
      uk: 'Майже те саме слово, що das Lebensmittel рівня A2, і різниця тут не змістова, а регістрова: це належить науці про харчування й новинам про голод і ціни, а слово рівня A2 висить над рядом у супермаркеті й потрапляє до списку покупок. Обидва середнього роду, і в обох множина пишеться як однина. Перша половина — die Nahrung, «поживок».'

