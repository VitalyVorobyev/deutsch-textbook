  - de: haltbar
    ipa: "ˈhaltbaːɐ̯"
    pos: adj
    # Recognition only: a packet word, read and never said — what a shopper produces at
    # the counter is a question about the date itself.
    cards: recognition
    en: still safe to eat until a date the packet prints
    ru: пригодный в пищу до срока, напечатанного на упаковке
    uk: придатний до вживання до строку, надрукованого на упаковці
    example_de: Die Milch ist nur noch bis Freitag haltbar.
    example_en: The milk will only keep until Friday.
    example_ru: Молоко годно только до пятницы.
    example_uk: Молоко придатне лише до п’ятниці.
    note:
      en: 'Built from halten with -bar, the suffix that means can be done — the same step as essbar and lesbar. Every German packet carries the phrase mindestens haltbar bis, best before, abbreviated MHD, and Germans distinguish it sharply from zu verbrauchen bis, the harder use-by date on meat and fish. Figuratively an argument can be it too: ein haltbares Argument is one that stands up.'
      ru: 'Образовано от halten суффиксом -bar, который значит «поддающийся» — тот же шаг, что в essbar и lesbar. На каждой немецкой упаковке стоит оборот mindestens haltbar bis, «годен минимум до», сокращаемый до MHD, и немцы чётко отличают его от zu verbrauchen bis — более жёсткого срока на мясе и рыбе. В переносном смысле так говорят и о доводе: ein haltbares Argument — довод, который выдерживает проверку.'
      uk: 'Утворене від halten суфіксом -bar, що означає «здатний бути» — той самий крок, що в essbar і lesbar. На кожній німецькій упаковці стоїть зворот mindestens haltbar bis, «придатний щонайменше до», скорочуваний до MHD, і німці чітко відрізняють його від zu verbrauchen bis — жорсткішого строку на м’ясі й рибі. У переносному сенсі так кажуть і про доказ: ein haltbares Argument — доказ, який витримує перевірку.'

  - de: vegetarisch
    ipa: "vegeˈtaːʁɪʃ"
    pos: adj
    en: containing no meat and no fish, as a menu line or a way of eating
    ru: без мяса и рыбы — о строке в меню и о способе питаться
    uk: без м’яса й риби — про рядок у меню й про спосіб харчуватися
    example_de: Haben Sie auch ein vegetarisches Gericht?
    example_en: Do you have a vegetarian dish as well?
    example_ru: У вас есть и вегетарианское блюдо?
    example_uk: Чи є у вас і вегетаріанська страва?
    note:
      en: 'The single most useful sentence a non-meat-eater needs in Germany is the example above, and the answer is usually yes. The v is spoken v here, not f, because the word is a loan. The stricter word for no animal products at all is vegan, and a person is ein Vegetarier or eine Vegetarierin. To say how you eat, use sich vegetarisch ernähren rather than a noun.'
      ru: 'Самое полезное предложение, какое нужно в Германии тому, кто не ест мяса, — это пример выше, и ответ обычно утвердительный. v здесь читается как «в», а не «ф», потому что слово заимствованное. Более строгое слово, о полном отказе от продуктов животного происхождения, — vegan, а человек — ein Vegetarier или eine Vegetarierin. Чтобы сказать, как вы питаетесь, берите sich vegetarisch ernähren, а не существительное.'
      uk: 'Найкорисніше речення, яке потрібне в Німеччині тому, хто не їсть м’яса, — це приклад вище, і відповідь зазвичай ствердна. v тут читається як «в», а не «ф», бо слово запозичене. Суворіше слово, про цілковиту відмову від продуктів тваринного походження, — vegan, а людина — ein Vegetarier або eine Vegetarierin. Щоб сказати, як ви харчуєтеся, беріть sich vegetarisch ernähren, а не іменник.'

  # --- Hunger, Durst und was man dazwischen trinkt ---
  - de: hungrig
    ipa: "ˈhʊŋʁɪç"
    pos: adj
    en: needing to eat, in the adjective a person uses about themselves
    ru: испытывающий потребность поесть — прилагательным, которое человек говорит о себе
    uk: той, хто відчуває потребу поїсти, — прикметником, який людина каже про себе
    example_de: Nach der langen Wanderung waren alle sehr hungrig.
    example_en: Everybody was very hungry after the long walk.
    example_ru: После долгого похода все были очень голодны.
    example_uk: Після довгої мандрівки всі були дуже голодні.
    note:
      en: 'Formed from A1 der Hunger with -ig. German has both ways of saying it and prefers the noun: Ich habe Hunger is what you actually hear, while the adjective turns up after sein and in front of a noun — ein hungriges Kind. Note that the noun construction has no article, so Ich habe einen Hunger is an exclamation about how hungry you are, not the plain statement.'
      ru: 'Образовано от der Hunger уровня A1 суффиксом -ig. У немецкого есть оба способа, и он предпочитает существительное: в жизни звучит Ich habe Hunger, а прилагательное появляется после sein и перед существительным — ein hungriges Kind. Учтите, что в конструкции с существительным артикля нет, так что Ich habe einen Hunger — это восклицание о том, как сильно вы голодны, а не нейтральное сообщение.'
      uk: 'Утворене від der Hunger рівня A1 суфіксом -ig. У німецької є обидва способи, і вона віддає перевагу іменникові: у житті звучить Ich habe Hunger, а прикметник з’являється після sein і перед іменником — ein hungriges Kind. Зважте, що в конструкції з іменником артикля немає, тож Ich habe einen Hunger — це вигук про те, як сильно ви голодні, а не нейтральне повідомлення.'

  - de: durstig
    ipa: "ˈdʊʁstɪç"
    pos: adj
    en: needing something to drink
    ru: испытывающий потребность попить
    uk: той, хто відчуває потребу попити
    example_de: Die Kinder kamen durstig vom Spielplatz zurück.
    example_en: The children came back from the playground thirsty.
    example_ru: Дети вернулись с площадки, желая пить.
    example_uk: Діти повернулися з майданчика, спраглі.
    note:
      en: 'Built on A1 der Durst the same way the entry above is built on Hunger, and the same preference holds: Ich habe Durst is the everyday sentence and this is the adjective beside it. The r is the vocalised one in the middle of the word, ˈdʊʁstɪç. A drink that makes you want more is not this word but durstlöschend, thirst-quenching, which is what an advert claims.'
      ru: 'Построено на der Durst уровня A1 так же, как запись выше построена на Hunger, и предпочтение то же: в быту звучит Ich habe Durst, а это — прилагательное рядом. r в середине слова вокализованное: ˈdʊʁstɪç. Напиток, который утоляет жажду, называется не так, а durstlöschend — это слово обещает реклама.'
      uk: 'Побудоване на der Durst рівня A1 так само, як запис вище побудований на Hunger, і вподобання те саме: у побуті звучить Ich habe Durst, а це — прикметник поряд. r у середині слова вокалізоване: ˈdʊʁstɪç. Напій, що вгамовує спрагу, зветься не так, а durstlöschend — це слово обіцяє реклама.'

  - de: satt
    ipa: "ˈzat"
    pos: adj
    en: having eaten enough and wanting no more
    ru: наевшийся и больше не желающий есть
    uk: той, хто наївся і більше не хоче їсти
    example_de: Danke, ich bin satt — es war sehr gut.
    example_en: Thank you, I have had enough — it was very good.
    example_ru: Спасибо, я сыт — было очень вкусно.
    example_uk: Дякую, я ситий — було дуже смачно.
    note:
      en: 'The polite way to decline a second helping at a German table, and there is no verb for it — the frame is always sein or werden. Do not use A2 voll, which is about a container or a crowded train and, of a person, means drunk. A second use is figurative and impatient: etwas satt haben is to be fed up with it — Ich habe das satt.'
      ru: 'Вежливый способ отказаться от добавки за немецким столом, и глагола для этого нет — конструкция всегда с sein или werden. Не берите voll уровня A2: оно о ёмкости и о набитом поезде, а о человеке значит «пьяный». Второе употребление переносное и нетерпеливое: etwas satt haben — «быть сытым по горло»: Ich habe das satt.'
      uk: 'Ввічливий спосіб відмовитися від добавки за німецьким столом, і дієслова для цього немає — конструкція завжди із sein або werden. Не беріть voll рівня A2: воно про посудину й напханий поїзд, а про людину означає «п’яний». Друге вживання переносне й нетерпляче: etwas satt haben — «бути ситим по горло»: Ich habe das satt.'

  - de: Appetit
    ipa: "apeˈtiːt"
    pos: noun
    gender: m
    plural: "—"
    # Recognition only: A1 ships the whole wish `Guten Appetit!` (essen-trinken) as a
    # production card, and this word is that card minus one adjective — the
    # `Überstunde`/`Überstunden` ruling from arbeit-beruf-b1.
    cards: recognition
    en: the wish to eat something, as a state a person has or has lost
    ru: желание поесть как состояние, которое у человека есть или пропало
    uk: бажання поїсти як стан, який у людини є або зник
    example_de: Seit der Grippe hat sie wenig Appetit.
    example_en: She has had little appetite since the flu.
    example_ru: После гриппа у неё плохой аппетит.
    example_uk: Після грипу в неї поганий апетит.
    note:
      en: 'Stress on the last syllable, no plural. It is milder than A1 der Hunger: hunger is the body''s need, this is the willingness, which is why a doctor asks Haben Sie Appetit? about somebody who is unwell. The chunk everybody knows first is the wish Guten Appetit!, said before a meal by whoever sits down. Appetit auf etwas haben is to fancy something in particular.'
      ru: 'Ударение на последнем слоге, множественного нет. Слово мягче, чем der Hunger уровня A1: голод — телесная нужда, а это готовность, и потому врач спрашивает Haben Sie Appetit? о нездоровом человеке. Первый оборот, который узнают все, — пожелание Guten Appetit!: его говорит тот, кто садится за стол. Appetit auf etwas haben — «хотеться чего-то конкретного».'
      uk: 'Наголос на останньому складі, множини немає. Слово м’якше за der Hunger рівня A1: голод — тілесна потреба, а це готовність, і тому лікар питає Haben Sie Appetit? про нездорову людину. Перший зворот, який дізнаються всі, — побажання Guten Appetit!: його каже той, хто сідає до столу. Appetit auf etwas haben — «хотітися чогось конкретного».'

  - de: Kakao
    ipa: "kaˈkaʊ̯"
    pos: noun
    gender: m
    plural: "—"
    # Recognition only: A1 ships `Schokolade` (einkaufen-geschaefte) as the production
    # card in this field, and in a German café the drink is ordered as
    # `heiße Schokolade`.
    cards: recognition
    en: the brown powder from a tropical bean, and the hot milk drink made with it
    ru: коричневый порошок из тропических бобов и горячий напиток на молоке из него
    uk: коричневий порошок із тропічних бобів і гарячий напій на молоці з нього
    example_de: Die Kinder bekommen im Winter jeden Abend einen Kakao.
    example_en: The children get a cup of cocoa every evening in winter.
    example_ru: Зимой дети каждый вечер получают какао.
    example_uk: Узимку діти щовечора отримують какао.
    note:
      en: 'Stress on the second syllable and the ao is one diphthong: kaˈkaʊ̯. Two things at once — the tin in the cupboard and the cup, which is why einen Kakao takes an article when the drink is meant. In a café the same drink is more often ordered as eine heiße Schokolade. The idiom jemanden durch den Kakao ziehen means to make gentle fun of somebody.'
      ru: 'Ударение на втором слоге, а ao — один дифтонг: kaˈkaʊ̯. Слово значит сразу две вещи — банку в шкафу и чашку, и потому einen Kakao берёт артикль, когда речь о напитке. В кафе тот же напиток чаще заказывают как eine heiße Schokolade. Оборот jemanden durch den Kakao ziehen значит «беззлобно подтрунивать над кем-то».'
      uk: 'Наголос на другому складі, а ao — один дифтонг: kaˈkaʊ̯. Слово означає одразу дві речі — бляшанку в шафі й горнятко, і тому einen Kakao бере артикль, коли йдеться про напій. У кав’ярні той самий напій частіше замовляють як eine heiße Schokolade. Зворот jemanden durch den Kakao ziehen означає «беззлобно кепкувати з когось».'

  - de: Limonade
    ipa: "limoˈnaːdə"
    pos: noun
    gender: f
    plural: "die Limonaden"
    # Recognition only: a false friend that a German menu abbreviates to `Limo` and an
    # English speaker will misread — A1 `Saft` owns the drink a learner orders by name.
    cards: recognition
    en: any sweet fizzy soft drink, not necessarily made from any citrus at all
    ru: любой сладкий газированный безалкогольный напиток, вовсе не обязательно из цитрусов
    uk: будь-який солодкий газований безалкогольний напій, зовсім не обов’язково з цитрусів
    example_de: Für die Kinder haben wir Wasser und Limonade gekauft.
    example_en: We bought water and fizzy drinks for the children.
    example_ru: Для детей мы купили воду и газировку.
    example_uk: Для дітей ми купили воду й газованку.
    note:
      en: 'A false friend twice over. It is not lemonade in the English home-made sense, and it is not restricted to lemon: a German menu files cola, orange and herbal drinks under it alike. Everyday speech shortens it to die Limo, which is what a child asks for. The drink an English speaker means is Zitronenwasser or selbst gemachte Limonade, and A1 der Saft is pressed juice with nothing added.'
      ru: 'Ложный друг дважды. Это не «лимонад» в смысле домашнего напитка из лимона и вовсе не ограничено лимоном: немецкое меню сводит сюда и колу, и апельсиновую, и травяную. В речи слово сокращают до die Limo, и именно так просит ребёнок. То, что имеет в виду англичанин, — Zitronenwasser или selbst gemachte Limonade, а der Saft уровня A1 — отжатый сок без добавок.'
      uk: 'Фальшивий друг двічі. Це не «лимонад» у сенсі домашнього напою з лимона і зовсім не обмежене лимоном: німецьке меню зводить сюди і колу, і помаранчеву, і трав’яну. У мовленні слово скорочують до die Limo, і саме так просить дитина. Те, що має на увазі англієць, — Zitronenwasser або selbst gemachte Limonade, а der Saft рівня A1 — вичавлений сік без додатків.'
