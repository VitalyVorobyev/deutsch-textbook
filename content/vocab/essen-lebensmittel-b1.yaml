      uk: 'Чоловічий рід, множини немає, а -ig на кінці звучить як ich-Laut, так само як у Honig. Слово майже завжди ходить половиною пари — Öl und Essig; так німець називає заправку, не описуючи її. Різновиди, які трапляться: der Weinessig, der Apfelessig, der Balsamico. Зворот Das ist Essig — старомодне просторіччя про справу, яка зірвалася.'

