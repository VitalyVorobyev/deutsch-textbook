# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the broadcast-and-
# recorded-media field of data/goethe-b1-wortliste.txt: what goes out over the air
# and how, the named formats a schedule is made of, the people in front of and
# behind the microphone, and the objects sound and pictures were and are stored on.
# A1's `kommunikation-medien` owns the devices and the household media (Radio,
# Fernsehen, Fernseher, Foto, Zeitung, Internet, Handy), A2's `digital-medien-a2`
# owns the camera and the screen (Kamera, Fotoapparat, PC, Laptop), A2's
# `kultur-unterhaltung-a2` owns the programme and its printed siblings (Sendung,
# Programm, Interview, Titel, Artikel, Zeitschrift, Lied), A2's `berufe-a2` owns the
# media professions as jobs (Journalist, Journalistin, Sänger, Schauspieler), B1's
# `meinung-medien` owns the broadcaster and what it sells (Sender, Werbung,
# Zuschauer, Moderator, Aussage), and B1's `kultur-freizeit` owns the audience as a
# body (Publikum, Bühne). This deck is the layer between them: the German of a
# schedule, a credit roll, a subscribe button and a shelf of old discs, which those
# six never name.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read off a listings page, a screen and a case; the learner who has to *talk* about
# any of it reaches for the A1 or A2 word beside it, and that word already ships as
# a typed card.
id: medien-digital-b1
title_de: "Medien: Funk, Film, Aufnahme"
title_en: "Broadcast and recorded media"
title_ru: "Вещание и запись"
title_uk: "Мовлення та запис"
level: B1
entries:
  # --- Senden und empfangen ---
  - de: übertragen
    ipa: "yːbɐˈtʁaːgn̩"
    pos: verb
    praesens_3sg: überträgt
    partizip2: übertragen
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to send a programme out by radio, television or the internet so that others receive it; also to carry something over from one place or form into another
    ru: пускать передачу в эфир или в сеть, чтобы её приняли другие; а также переносить что-либо из одного места или вида в другой
    uk: пускати передачу в ефір чи в мережу, щоб її прийняли інші; а також переносити щось з одного місця чи вигляду в інший
    example_de: Das Spiel wird am Samstag im Radio übertragen.
    example_en: The match will be broadcast on the radio on Saturday.
    example_ru: Матч будут транслировать в субботу по радио.
    example_uk: Матч транслюватимуть у суботу по радіо.
    note:
      en: 'Inseparable, so the prefix never leaves the verb and there is no ge- in the participle: er überträgt, hat übertragen. It is strong like tragen and takes the same vowel change in the du and er forms. The transfer sense is what an exam paper means, and the instruction is worth recognising word for word: Übertragen Sie Ihre Lösungen auf den Antwortbogen. A disease can be übertragen too, and so can a task. The noun for the broadcast is die Übertragung.'
      ru: 'Приставка неотделяемая, поэтому она никогда не уходит от глагола, а в причастии нет ge-: er überträgt, hat übertragen. Глагол сильный, как tragen, и меняет гласный в формах du и er так же. Значение переноса — то, что имеет в виду экзаменационный лист, и инструкцию стоит узнавать дословно: Übertragen Sie Ihre Lösungen auf den Antwortbogen. Übertragen можно и болезнь, и поручение. Существительное для трансляции — die Übertragung.'
      uk: 'Префікс невідокремлюваний, тому він ніколи не відходить від дієслова, а в дієприкметнику немає ge-: er überträgt, hat übertragen. Дієслово сильне, як tragen, і змінює голосний у формах du та er так само. Значення перенесення — те, що має на увазі екзаменаційний аркуш, і інструкцію варто впізнавати дослівно: Übertragen Sie Ihre Lösungen auf den Antwortbogen. Übertragen можна і хворобу, і доручення. Іменник для трансляції — die Übertragung.'

  - de: live
    ipa: "ˈlaɪ̯f"
    pos: adv
    cards: recognition
    en: at the same moment as it is happening, not recorded first and shown later
    ru: в тот самый момент, когда это происходит, а не в записи, показанной потом
    uk: тієї самої миті, коли це відбувається, а не в запису, показаному потому
    example_de: Das Konzert wird heute Abend live gesendet.
    example_en: The concert is being broadcast live this evening.
    example_ru: Концерт сегодня вечером пойдёт в прямом эфире.
    example_uk: Концерт сьогодні ввечері піде в прямому ефірі.
    note:
      en: 'An English loan and it keeps an English vowel: it sounds like German Laif, so it must not be read the way German spelling would suggest, and it does not rhyme with the German verb leben. Indeclinable as an adverb, but it forms compounds freely with a hyphen: die Live-Sendung, das Live-Konzert, die Live-Musik. Its opposite is aufgezeichnet, recorded in advance, and the phrase on a screen is live dabei sein.'
      ru: 'Английское заимствование, и гласный в нём английский: звучит как немецкое Laif, так что по правилам немецкого чтения его читать нельзя, и с глаголом leben оно не рифмуется. Как наречие не изменяется, но легко даёт сложные слова через дефис: die Live-Sendung, das Live-Konzert, die Live-Musik. Противоположность — aufgezeichnet, «в записи», а на экране пишут live dabei sein.'
      uk: 'Англійське запозичення, і голосний у ньому англійський: звучить як німецьке Laif, тож за правилами німецького читання його читати не можна, і з дієсловом leben воно не римується. Як прислівник не змінюється, але легко дає складні слова через дефіс: die Live-Sendung, das Live-Konzert, die Live-Musik. Протилежність — aufgezeichnet, «у запису», а на екрані пишуть live dabei sein.'

  - de: Kanal
    ipa: "kaˈnaːl"
    pos: noun
    gender: m
    plural: "die Kanäle"
    cards: recognition
    en: one stream of programmes you can switch to on a television or a radio, and on a video platform the page one maker publishes on; also a waterway dug for ships or for water
    ru: одна программная дорожка, на которую переключаются на телевизоре или радио, а на видеоплатформе — страница одного автора; а также прорытый водный путь для судов или для воды
    uk: одна програмна доріжка, на яку перемикаються на телевізорі чи радіо, а на відеоплатформі — сторінка одного автора; а також прокопаний водний шлях для суден або для води
    example_de: Auf diesem Kanal laufen den ganzen Tag Nachrichten.
    example_en: News runs on this channel all day long.
    example_ru: На этом канале весь день идут новости.
    example_uk: На цьому каналі весь день ідуть новини.
    note:
      en: 'Two senses that have nothing to do with each other, and the plural takes an umlaut in both. B1 der Sender, in the deck `meinung-medien`, is the broadcaster as a company and a transmitter; a Kanal is what a viewer switches to, and on a video platform it is what a single maker fills — einen Kanal abonnieren, mein Kanal hat tausend Abonnenten. The water sense is alive in names: der Nord-Ostsee-Kanal, and der Ärmelkanal is the sea between France and England. Stress on the second syllable.'
      ru: 'Два значения, никак между собой не связанные, и во множественном у обоих умлаут. der Sender уровня B1 из колоды `meinung-medien` — вещатель как компания и как передатчик; Kanal — то, на что переключается зритель, а на видеоплатформе — то, что наполняет один автор: einen Kanal abonnieren, mein Kanal hat tausend Abonnenten. Водное значение живо в названиях: der Nord-Ostsee-Kanal, а der Ärmelkanal — пролив между Францией и Англией. Ударение на втором слоге.'
      uk: 'Два значення, ніяк між собою не пов’язані, і в множині в обох умлаут. der Sender рівня B1 з колоди `meinung-medien` — мовник як компанія і як передавач; Kanal — те, на що перемикається глядач, а на відеоплатформі — те, що наповнює один автор: einen Kanal abonnieren, mein Kanal hat tausend Abonnenten. Водне значення живе в назвах: der Nord-Ostsee-Kanal, а der Ärmelkanal — протока між Францією та Англією. Наголос на другому складі.'

  - de: TV
    ipa: "teːˈfaʊ̯"
    pos: noun
    gender: n
    plural: "—"
    cards: recognition
    en: television, in the short written form that listings, adverts and hotel signs use
    ru: телевидение — в короткой письменной форме, какой пользуются программа передач, реклама и гостиничные таблички
    uk: телебачення — у короткій письмовій формі, якою послуговуються програма передач, реклама й готельні таблички
    example_de: Der Film läuft heute um acht im TV.
    example_en: The film is on television at eight today.
    example_ru: Фильм идёт сегодня в восемь по телевидению.
    example_uk: Фільм іде сьогодні о восьмій по телебаченню.
    note:
      en: 'Read as the two German letter names with the stress on the second, the same pattern as die DVD below and as A2 der Lkw — never in the English way. Neuter, because A1 das Fernsehen is. It has no plural and is almost only written: a magazine, a shop label and a hotel room list print it where speech says Fernsehen. It compounds freely with a hyphen — das TV-Programm, der TV-Sender, das TV-Gerät.'
      ru: 'Читается по названиям двух немецких букв с ударением на второй — та же схема, что у die DVD ниже и у der Lkw уровня A2, — но никак не по-английски. Средний род, потому что среднего рода das Fernsehen уровня A1. Множественного числа нет, и слово почти всегда письменное: журнал, ценник и опись гостиничного номера печатают его там, где в речи скажут Fernsehen. Сложные слова даёт через дефис: das TV-Programm, der TV-Sender, das TV-Gerät.'
      uk: 'Читається за назвами двох німецьких літер із наголосом на другій — та сама схема, що в die DVD нижче і в der Lkw рівня A2, — але аж ніяк не по-англійськи. Середній рід, бо середнього роду das Fernsehen рівня A1. Множини немає, і слово майже завжди письмове: журнал, цінник і опис готельного номера друкують його там, де в мовленні скажуть Fernsehen. Складні слова дає через дефіс: das TV-Programm, der TV-Sender, das TV-Gerät.'

  - de: Studio
    ipa: "ˈʃtuːdi̯o"
    pos: noun
    gender: n
    plural: "die Studios"
    cards: recognition
    en: the room a broadcast, a recording or a photo session is made in, fitted out with cameras, microphones and lights
    ru: помещение, в котором делают передачу, запись или фотосъёмку, оснащённое камерами, микрофонами и светом
    uk: приміщення, у якому роблять передачу, запис чи фотозйомку, обладнане камерами, мікрофонами і світлом
    example_de: Die Moderatorin begrüßt die Gäste im Studio.
    example_en: The presenter welcomes the guests in the studio.
    example_ru: Ведущая приветствует гостей в студии.
    example_uk: Ведуча вітає гостей у студії.
    note:
      en: 'Which kind it is comes from the compound: das Fernsehstudio, das Tonstudio, das Fotostudio, and das Aufnahmestudio for the place a recording is cut. Two senses live outside the media: das Fitnessstudio, the gym, and a one-room flat let furnished. Neuter, plural in -s. It is a naturalised loan, so the initial St- is the German sh-sound, unlike der Spot further down this deck, which kept the s of the language it came from.'
      ru: 'Какая именно, показывает сложное слово: das Fernsehstudio, das Tonstudio, das Fotostudio, а место, где сводят запись, — das Aufnahmestudio. Два значения живут вне медиа: das Fitnessstudio — тренажёрный зал и однокомнатная меблированная квартира. Средний род, множественное на -s. Заимствование давно обжившееся, поэтому начальное St- звучит по-немецки, через «ш», в отличие от der Spot ниже в этой колоде, который сохранил «с» того языка, откуда пришёл.'
      uk: 'Яка саме, показує складне слово: das Fernsehstudio, das Tonstudio, das Fotostudio, а місце, де зводять запис, — das Aufnahmestudio. Два значення живуть поза медіа: das Fitnessstudio — тренажерна зала і однокімнатна умебльована квартира. Середній рід, множина на -s. Запозичення давно обжите, тому початкове St- звучить по-німецьки, через «ш», на відміну від der Spot нижче в цій колоді, який зберіг «с» тієї мови, звідки прийшов.'

  - de: abonnieren
    ipa: "aboˈniːʁən"
    pos: verb
    praesens_3sg: abonniert
    partizip2: abonniert
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to arrange to receive something regularly, usually against a payment, until you stop it
    ru: оформить регулярное получение чего-либо, обычно за плату, пока сам не откажешься
    uk: оформити регулярне отримання чогось, зазвичай за плату, доки сам не відмовишся
    example_de: Wir haben die Zeitung seit zehn Jahren abonniert.
    example_en: We have subscribed to the newspaper for ten years.
    example_ru: Мы выписываем газету уже десять лет.
    example_uk: Ми передплачуємо газету вже десять років.
    note:
      en: 'A verb in -ieren, so the Partizip II carries no ge- at all: hat abonniert, not hat geabonniert. That rule covers the whole family — studieren, telefonieren, reparieren. What can be abonniert has widened from the newspaper and the theatre seat to a streaming service and, on a video platform, a Kanal, where it is the word on the button. The noun is das Abonnement, in speech always shortened to das Abo, and the person is der Abonnent.'
      ru: 'Глагол на -ieren, поэтому в Partizip II нет ge- вовсе: hat abonniert, а не hat geabonniert. Правило распространяется на всё семейство — studieren, telefonieren, reparieren. Круг того, что можно abonnieren, расширился от газеты и абонемента в театр до стримингового сервиса и, на видеоплатформе, до Kanal, где это слово стоит на кнопке. Существительное — das Abonnement, в речи всегда сокращаемое до das Abo, а человек — der Abonnent.'
      uk: 'Дієслово на -ieren, тому в Partizip II немає ge- зовсім: hat abonniert, а не hat geabonniert. Правило поширюється на всю родину — studieren, telefonieren, reparieren. Коло того, що можна abonnieren, розширилося від газети та абонемента в театр до стримінгового сервісу і, на відеоплатформі, до Kanal, де це слово стоїть на кнопці. Іменник — das Abonnement, у мовленні завжди скорочуване до das Abo, а людина — der Abonnent.'

  # --- Sendungen und ihre Formen ---
  - de: Show
    ipa: "ˈʃoː"
    pos: noun
    gender: f
    plural: "die Shows"
    cards: recognition
    en: an entertainment programme built around a host and an audience, on a stage or on television
    ru: развлекательная передача, построенная вокруг ведущего и зала, на сцене или на телевидении
    uk: розважальна передача, побудована навколо ведучого і зали, на сцені чи на телебаченні
    example_de: Die Show läuft seit zwanzig Jahren jeden Samstagabend.
    example_en: The programme has been on every Saturday evening for twenty years.
    example_ru: Это шоу выходит каждый субботний вечер уже двадцать лет.
    example_uk: Це шоу виходить щосуботнього вечора вже двадцять років.
    note:
      en: 'German pronounces it with a single long o, so the ow is not the diphthong it is in English. Feminine, plural in -s, and it is the head of a large family of compounds, all feminine: die Talkshow, die Fernsehshow, die Quizshow, die Castingshow below. A second, dismissive sense is a performance put on to impress: Das war doch alles nur Show. A2 die Sendung, in the deck `kultur-unterhaltung-a2`, is the neutral word for any programme.'
      ru: 'По-немецки читается с одним долгим o, так что ow здесь не тот дифтонг, что в английском. Женский род, множественное на -s, и слово возглавляет большое семейство сложных слов, все женского рода: die Talkshow, die Fernsehshow, die Quizshow, die Castingshow ниже. Второе, пренебрежительное значение — представление ради впечатления: Das war doch alles nur Show. die Sendung уровня A2 из колоды `kultur-unterhaltung-a2` — нейтральное слово для любой передачи.'
      uk: 'По-німецьки читається з одним довгим o, тож ow тут не той дифтонг, що в англійській. Жіночий рід, множина на -s, і слово очолює велику родину складних слів, усі жіночого роду: die Talkshow, die Fernsehshow, die Quizshow, die Castingshow нижче. Друге, зневажливе значення — вистава задля враження: Das war doch alles nur Show. die Sendung рівня A2 з колоди `kultur-unterhaltung-a2` — нейтральне слово для будь-якої передачі.'

  - de: Castingshow
    ipa: "ˈkaːstɪŋˌʃoː"
    pos: noun
    gender: f
    plural: "die Castingshows"
    cards: recognition
    en: a television series in which unknown candidates compete before a panel of judges to be chosen as a singer, a model or a dancer
    ru: телевизионный цикл, в котором неизвестные участники соревнуются перед жюри за право быть выбранными певцом, моделью или танцором
    uk: телевізійний цикл, у якому невідомі учасники змагаються перед журі за право бути обраними співаком, моделлю чи танцюристом
    example_de: Sie hat sich bei einer Castingshow beworben.
    example_en: She applied to a talent show.
    example_ru: Она подала заявку на шоу талантов.
    example_uk: Вона подала заявку на шоу талантів.
    note:
      en: 'Taken whole from English, and feminine because die Show is. Das Casting is the audition it is named after, and die Jury is the panel that decides. The German examples the learner will hear named are DSDS and The Voice of Germany. The stress pattern is the ordinary German compound one: primary on Cast-, secondary on -show. Plural adds -s, like every noun of English shape in this deck.'
      ru: 'Взято из английского целиком, а женский род — от die Show. Das Casting — тот самый отбор, по которому передача названа, а решает die Jury. Немецкие примеры, которые учащийся услышит по названию, — DSDS и The Voice of Germany. Ударение обычное для немецкого сложного слова: главное на Cast-, побочное на -show. Множественное на -s, как у всех слов английского вида в этой колоде.'
      uk: 'Узято з англійської цілком, а жіночий рід — від die Show. Das Casting — той самий відбір, за яким передачу названо, а вирішує die Jury. Німецькі приклади, які учень почує за назвою, — DSDS і The Voice of Germany. Наголос звичайний для німецького складного слова: головний на Cast-, побічний на -show. Множина на -s, як в усіх слів англійського вигляду в цій колоді.'

  - de: Reportage
    ipa: "ʁepɔʁˈtaːʒə"
    pos: noun
    gender: f
    plural: "die Reportagen"
    cards: recognition
    en: a longer piece in which a journalist describes a place and the people in it as they were seen, rather than only stating the facts
    ru: развёрнутый материал, в котором журналист описывает место и людей такими, какими их увидел, а не только излагает факты
    uk: розгорнутий матеріал, у якому журналіст описує місце і людей такими, якими їх побачив, а не лише викладає факти
    example_de: Im Radio kam eine lange Reportage über das Krankenhaus.
    example_en: There was a long feature about the hospital on the radio.
    example_ru: По радио шёл большой репортаж о больнице.
    example_uk: По радіо йшов великий репортаж про лікарню.
    note:
      en: 'A French loan, and the -age ending is pronounced with the soft zh-sound and a light -e, exactly as in die Garage at A2; the stress sits on that syllable. B1 der Bericht, in the deck `erfahrungen-erzaehlen`, states what happened and keeps the writer out of it, while a Reportage is written from the scene and may say what it smelled like. Made with schreiben, or with drehen when it is filmed. Feminine, plural in -n.'
      ru: 'Французское заимствование, и окончание -age читается с мягким «ж» и лёгким -e, ровно как в die Garage уровня A2; на этот слог падает и ударение. der Bericht уровня B1 из колоды `erfahrungen-erzaehlen` излагает, что случилось, и автора в текст не пускает, а Reportage пишется с места и вправе рассказать, чем там пахло. Глагол — schreiben, а если снимают, то drehen. Женский род, множественное на -n.'
      uk: 'Французьке запозичення, і закінчення -age читається з м’яким «ж» і легким -e, точно як у die Garage рівня A2; на цей склад падає й наголос. der Bericht рівня B1 з колоди `erfahrungen-erzaehlen` викладає, що сталося, і автора в текст не пускає, а Reportage пишеться з місця й має право розповісти, чим там пахло. Дієслово — schreiben, а якщо знімають, то drehen. Жіночий рід, множина на -n.'

  - de: Spot
    ipa: "ˈspɔt"
    pos: noun
    gender: m
    plural: "die Spots"
    cards: recognition
    en: a very short advertising film shown between or inside programmes; also a small lamp aimed at one place
    ru: очень короткий рекламный ролик, который ставят между передачами или внутрь них; а также небольшой направленный светильник
    uk: дуже короткий рекламний ролик, який ставлять між передачами або всередину них; а також невеликий спрямований світильник
    example_de: Vor dem Film kommen noch drei Spots.
    example_en: There are three more adverts before the film.
    example_ru: Перед фильмом идут ещё три рекламных ролика.
    example_uk: Перед фільмом ідуть ще три рекламні ролики.
    note:
      en: 'Short for der Werbespot, and that longer form is what a broadcaster''s rate card actually says. B1 die Werbung, in the deck `meinung-medien`, is advertising as a whole activity; a Spot is one thirty-second piece of it, and B1 die Reklame (deck `einkaufen-geld-b1`) is the older, slightly dated word for the same trade. Watch the first sound: it is the s of the language it came from, which keeps it apart from der Spott, mockery, spelled with two t and pronounced with the German sh.'
      ru: 'Сокращение от der Werbespot, и именно длинная форма стоит в прайс-листе телеканала. die Werbung уровня B1 из колоды `meinung-medien` — реклама как занятие в целом; Spot — один тридцатисекундный её кусок, а die Reklame уровня B1 (колода `einkaufen-geld-b1`) — старое, чуть устаревшее слово для того же ремесла. Следите за первым звуком: он «с», как в языке-источнике, и это отделяет слово от der Spott — «насмешка», которое пишется с двумя t и произносится с немецким «ш».'
      uk: 'Скорочення від der Werbespot, і саме довга форма стоїть у прайс-листі телеканалу. die Werbung рівня B1 з колоди `meinung-medien` — реклама як заняття загалом; Spot — один тридцятисекундний її шматок, а die Reklame рівня B1 (колода `einkaufen-geld-b1`) — старе, трохи застаріле слово для того самого ремесла. Стежте за першим звуком: він «с», як у мові-джерелі, і це відділяє слово від der Spott — «глум», яке пишеться з двома t і вимовляється з німецьким «ш».'

  # --- Wer sendet, wer sieht, wer hört ---
  - de: Moderatorin
    ipa: "modeʁaˈtoːʁɪn"
    pos: noun
    gender: f
    plural: "die Moderatorinnen"
    cards: recognition
    en: a woman who presents a programme, introducing the items and the guests and keeping the whole thing moving
    ru: женщина, которая ведёт передачу, объявляя рубрики и гостей и держа весь ход эфира
    uk: жінка, яка веде передачу, оголошуючи рубрики й гостей і тримаючи весь перебіг ефіру
    example_de: Die Moderatorin stellt den nächsten Gast vor.
    example_en: The presenter introduces the next guest.
    example_ru: Ведущая представляет следующего гостя.
    example_uk: Ведуча представляє наступного гостя.
    note:
      en: 'This one ships without its masculine beside it: B1 der Moderator already lives in the deck `meinung-medien`, and a headword belongs to exactly one file. The pair is worth saying out loud, because the stress moves when -in is added — der Moderátor but die Moderatórin, exactly as with der Autor and die Autorin at A2. She moderiert eine Sendung or eine Diskussion; A2 die Journalistin (deck `berufe-a2`) researches and writes rather than presents.'
      ru: 'Эта запись идёт без мужской пары рядом: der Moderator уровня B1 уже живёт в колоде `meinung-medien`, а заглавное слово принадлежит ровно одному файлу. Пару стоит произнести вслух, потому что при добавлении -in ударение сдвигается: der Moderátor, но die Moderatórin, — ровно как у der Autor и die Autorin уровня A2. Она moderiert eine Sendung или eine Diskussion; die Journalistin уровня A2 (колода `berufe-a2`) собирает материал и пишет, а не ведёт.'
      uk: 'Цей запис іде без чоловічої пари поряд: der Moderator рівня B1 уже живе в колоді `meinung-medien`, а заголовне слово належить рівно одному файлові. Пару варто вимовити вголос, бо при додаванні -in наголос зсувається: der Moderátor, але die Moderatórin, — точно як у der Autor і die Autorin рівня A2. Вона moderiert eine Sendung або eine Diskussion; die Journalistin рівня A2 (колода `berufe-a2`) збирає матеріал і пише, а не веде.'

  - de: Reporter
    ipa: "ʁeˈpɔʁtɐ"
    pos: noun
    gender: m
    plural: "die Reporter"
    cards: recognition
    en: a journalist sent out to where something is happening, to describe it from there
    ru: журналист, посланный туда, где что-то происходит, чтобы рассказать об этом оттуда
    uk: журналіст, посланий туди, де щось відбувається, щоб розповісти про це звідти
    example_de: Der Reporter steht direkt vor dem Stadion.
    example_en: The reporter is standing right outside the stadium.
    example_ru: Репортёр стоит прямо перед стадионом.
    example_uk: Репортер стоїть просто перед стадіоном.
    note:
      en: 'This entry and die Reporterin below are a pair: the feminine adds -in to the same stem and doubles the n in the plural, while the masculine spells singular and plural alike. A2 der Journalist, in the deck `berufe-a2`, names the profession as a whole and follows the n-declension (den Journalisten); this word is regular in every case and names the one who is sent to the place. Compounds say which beat: der Sportreporter, der Kriegsreporter.'
      ru: 'Эта запись и die Reporterin ниже — пара: женская форма прибавляет -in к той же основе и удваивает n во множественном, а в мужском единственное и множественное пишутся одинаково. der Journalist уровня A2 из колоды `berufe-a2` называет профессию в целом и склоняется по слабому типу (den Journalisten); это же слово во всех падежах правильное и называет того, кого послали на место. Сложные слова уточняют участок: der Sportreporter, der Kriegsreporter.'
      uk: 'Цей запис і die Reporterin нижче — пара, утворена моцією: жіноча форма додає -in до тієї самої основи і подвоює n у множині, а в чоловічому роді однина й множина пишуться однаково. der Journalist рівня A2 з колоди `berufe-a2` називає професію загалом і відмінюється за слабким типом (den Journalisten); це ж слово в усіх відмінках правильне і називає того, кого послали на місце. Складні слова уточнюють ділянку: der Sportreporter, der Kriegsreporter.'

  - de: Reporterin
    ipa: "ʁeˈpɔʁtəʁɪn"
    pos: noun
    gender: f
    plural: "die Reporterinnen"
    cards: recognition
    en: a woman sent out as a journalist to where something is happening, to describe it from there
    ru: журналистка, посланная туда, где что-то происходит, чтобы рассказать об этом оттуда
    uk: журналістка, послана туди, де щось відбувається, щоб розповісти про це звідти
    example_de: Unsere Reporterin hat mit den Nachbarn gesprochen.
    example_en: Our reporter has spoken to the neighbours.
    example_ru: Наша журналистка поговорила с соседями.
    example_uk: Наша журналістка поговорила із сусідами.
    note:
      en: 'The feminine of the entry above: -in on the untouched stem, plural in -innen. A broadcast hands over to her by name and role — Dazu unsere Reporterin in Brüssel — and the stress does not move when -in is added here, unlike in die Moderatorin further up. She is at the scene; the person in the studio who takes the handover is die Moderatorin.'
      ru: 'Женская пара к записи выше: -in на нетронутой основе, множественное на -innen. Эфир передаёт ей слово по имени и роли — Dazu unsere Reporterin in Brüssel, — и ударение при добавлении -in здесь не сдвигается, в отличие от die Moderatorin выше. Она на месте события; тот, кто принимает у неё слово в студии, — die Moderatorin.'
      uk: 'Жіноча пара до запису вище: -in на незайманій основі, множина на -innen. Ефір передає їй слово за іменем і роллю — Dazu unsere Reporterin in Brüssel, — і наголос при додаванні -in тут не зсувається, на відміну від die Moderatorin вище. Вона на місці події; той, хто приймає в неї слово в студії, — die Moderatorin.'

  - de: Hörer
    ipa: "ˈhøːʁɐ"
    pos: noun
    gender: m
    plural: "die Hörer"
    cards: recognition
    en: a person the radio reaches, counted as part of a station's audience; also the part of a telephone you hold to your ear
    ru: человек, до которого доходит радио, — как часть аудитории станции; а также та часть телефона, которую подносят к уху
    uk: людина, до якої доходить радіо, — як частина авдиторії станції; а також та частина телефона, яку підносять до вуха
    example_de: Der Sender hat jeden Tag über zwei Millionen Hörer.
    example_en: The station has more than two million listeners every day.
    example_ru: У станции ежедневно больше двух миллионов слушателей.
    example_uk: У станції щодня понад два мільйони слухачів.
    note:
      en: 'This entry and die Hörerin below are a pair: -in on the same stem for the feminine, -innen in its plural, while the masculine spells singular and plural alike. From A1 hören. Keep it apart from B1 der Zuhörer, in the deck `informationen-vermitteln`, who is in the room listening to a talk; a Hörer is reached over the air, which is why a presenter opens with Liebe Hörerinnen und Hörer. The telephone sense survives in den Hörer abnehmen and den Hörer auflegen.'
      ru: 'Эта запись и die Hörerin ниже — пара: женская форма — -in на той же основе, во множественном -innen, а в мужском единственное и множественное пишутся одинаково. От hören уровня A1. Не смешивайте с der Zuhörer уровня B1 из колоды `informationen-vermitteln`: тот сидит в зале и слушает доклад, а Hörer — тот, до кого доходит эфир, потому ведущий и начинает с Liebe Hörerinnen und Hörer. Телефонное значение уцелело в оборотах den Hörer abnehmen и den Hörer auflegen.'
      uk: 'Цей запис і die Hörerin нижче — пара, утворена моцією: жіноча форма — -in на тій самій основі, у множині -innen, а в чоловічому роді однина й множина пишуться однаково. Від hören рівня A1. Не змішуйте з der Zuhörer рівня B1 з колоди `informationen-vermitteln`: той сидить у залі й слухає доповідь, а Hörer — той, до кого доходить ефір, тому ведучий і починає з Liebe Hörerinnen und Hörer. Телефонне значення вціліло у зворотах den Hörer abnehmen і den Hörer auflegen.'

  - de: Hörerin
    ipa: "ˈhøːʁəʁɪn"
    pos: noun
    gender: f
    plural: "die Hörerinnen"
    cards: recognition
    en: a woman the radio reaches, counted as part of a station's audience
    ru: женщина, до которой доходит радио, — как часть аудитории станции
    uk: жінка, до якої доходить радіо, — як частина авдиторії станції
    example_de: Eine Hörerin aus Kiel hat im Studio angerufen.
    example_en: A listener from Kiel rang the studio.
    example_ru: В студию позвонила слушательница из Киля.
    example_uk: До студії зателефонувала слухачка з Кіля.
    note:
      en: 'The feminine of the entry above, and it does not carry the telephone sense: only a person can be a Hörerin, so the receiver stays masculine. A phone-in programme runs on the word — Wir haben eine Hörerin am Telefon. Where one figure is given for the whole audience the masculine plural still stands for everybody (zwei Millionen Hörer), which is why the two words are nowhere near equally frequent.'
      ru: 'Женская пара к записи выше, и телефонного значения она не берёт: Hörerin может быть только человек, так что трубка остаётся мужского рода. На этом слове держится передача со звонками в эфир: Wir haben eine Hörerin am Telefon. Там, где на всю аудиторию даётся одна цифра, за всех по-прежнему отвечает мужское множественное (zwei Millionen Hörer), — потому частотность у слов далеко не одинакова.'
      uk: 'Жіноча пара до запису вище, і телефонного значення вона не бере: Hörerin може бути лише людина, тож слухавка лишається чоловічого роду. На цьому слові тримається передача з дзвінками в ефір: Wir haben eine Hörerin am Telefon. Там, де на всю авдиторію дається одна цифра, за всіх і далі відповідає чоловіча множина (zwei Millionen Hörer), — тому частотність у слів далеко не однакова.'

  - de: Zuschauerin
    ipa: "ˈtsuːˌʃaʊ̯əʁɪn"
    pos: noun
    gender: f
    plural: "die Zuschauerinnen"
    cards: recognition
    en: a woman watching a programme, a match or a performance
    ru: женщина, которая смотрит передачу, матч или представление
    uk: жінка, яка дивиться передачу, матч чи виставу
    example_de: Vor dem Fernseher saßen Millionen Zuschauerinnen und Zuschauer.
    example_en: Millions of viewers sat in front of the television.
    example_ru: У телевизоров сидели миллионы зрительниц и зрителей.
    example_uk: Біля телевізорів сиділи мільйони глядачок і глядачів.
    note:
      en: 'This one ships without its masculine beside it: B1 der Zuschauer already lives in the deck `meinung-medien`, and a headword belongs to exactly one file. It is built on zuschauen plus the dative, so it names one person doing the watching, while B1 das Publikum (deck `kultur-freizeit`) is all of them as a single body. Three roles run parallel and are worth holding together: die Zuschauerin watches, die Hörerin above listens to a broadcast, and die Zuhörerin in this wave''s deck `sprechen-lernen-b1` listens in the room. The count a channel cares about is die Zuschauerzahl.'
      ru: 'Эта запись идёт без мужской пары рядом: der Zuschauer уровня B1 уже живёт в колоде `meinung-medien`, а заглавное слово принадлежит ровно одному файлу. Построено на zuschauen с дательным, так что называет одного смотрящего, тогда как das Publikum уровня B1 (колода `kultur-freizeit`) — все они как одно целое. Три роли идут параллельно, и держать их стоит вместе: die Zuschauerin смотрит, die Hörerin выше слушает эфир, а die Zuhörerin из колоды `sprechen-lernen-b1` этой же волны слушает в зале. Цифра, которая важна каналу, — die Zuschauerzahl.'
      uk: 'Цей запис іде без чоловічої пари поряд: der Zuschauer рівня B1 уже живе в колоді `meinung-medien`, а заголовне слово належить рівно одному файлові. Побудоване на zuschauen з давальним, тож називає одного глядача, тоді як das Publikum рівня B1 (колода `kultur-freizeit`) — усі вони як одне ціле. Три ролі йдуть паралельно, і тримати їх варто разом: die Zuschauerin дивиться, die Hörerin вище слухає ефір, а die Zuhörerin із колоди `sprechen-lernen-b1` цієї ж хвилі слухає в залі. Цифра, важлива для каналу, — die Zuschauerzahl.'

  # --- Aufgenommen und gespeichert ---
  - de: Aufnahme
    ipa: "ˈaʊ̯fˌnaːmə"
    pos: noun
    gender: f
    plural: "die Aufnahmen"
    cards: recognition
    en: sound or pictures caught on a machine and kept, and the act of catching them; also the taking of somebody into a place or an institution
    ru: звук или изображение, пойманные аппаратом и сохранённые, и само это действие; а также приём человека куда-либо или в учреждение
    uk: звук або зображення, спіймані апаратом і збережені, і сама ця дія; а також прийняття людини кудись чи до закладу
    example_de: Die Aufnahme ist leider zu leise geworden.
    example_en: Unfortunately the recording turned out too quiet.
    example_ru: Запись, к сожалению, получилась слишком тихой.
    example_uk: Запис, на жаль, вийшов надто тихим.
    note:
      en: 'B1 aufnehmen, in the deck `informationen-vermitteln`, is the verb behind both senses, and German lets them sit in one word: eine Aufnahme machen is to record or to take a photograph, while die Aufnahme ins Krankenhaus is being admitted and die Aufnahmeprüfung is the entrance exam. B1 die Notaufnahme (deck `haushalt-notfall-b1`) is the second sense at its sharpest. Feminine, plural in -n; primary stress on auf-, secondary on -nah-.'
      ru: 'aufnehmen уровня B1 из колоды `informationen-vermitteln` — глагол за обоими значениями, и немецкий спокойно держит их в одном слове: eine Aufnahme machen — записать или сфотографировать, а die Aufnahme ins Krankenhaus — госпитализация, die Aufnahmeprüfung — вступительный экзамен. die Notaufnahme уровня B1 (колода `haushalt-notfall-b1`) — второе значение в самом остром его виде. Женский род, множественное на -n; главное ударение на auf-, побочное на -nah-.'
      uk: 'aufnehmen рівня B1 з колоди `informationen-vermitteln` — дієслово за обома значеннями, і німецька спокійно тримає їх в одному слові: eine Aufnahme machen — записати або сфотографувати, а die Aufnahme ins Krankenhaus — госпіталізація, die Aufnahmeprüfung — вступний іспит. die Notaufnahme рівня B1 (колода `haushalt-notfall-b1`) — друге значення в найгострішому його вигляді. Жіночий рід, множина на -n; головний наголос на auf-, побічний на -nah-.'

  - de: Kassette
    ipa: "kaˈsɛtə"
    pos: noun
    gender: f
    plural: "die Kassetten"
    cards: recognition
    en: a small closed plastic case holding magnetic tape, played and recorded on in a machine before discs arrived
    ru: небольшая закрытая пластиковая коробочка с магнитной лентой, на которой писали и которую слушали до появления дисков
    uk: невелика закрита пластикова коробочка з магнітною стрічкою, на якій писали і яку слухали до появи дисків
    example_de: Auf dem Dachboden lagen noch alte Kassetten.
    example_en: There were still old cassettes in the attic.
    example_ru: На чердаке ещё лежали старые кассеты.
    example_uk: На горищі ще лежали старі касети.
    note:
      en: 'The machine is der Kassettenrecorder and the tape inside is das Tonband; the disc that replaced it is played by der CD-Player below. That is where the learner meets the word: in a text about the eighties and nineties, in a story about a parent, or in a language course sold on tape. Two further senses are alive — die Geldkassette, a small lockable box, and eine Kassette mit fünf CDs, a boxed set. Double s after a short a, stress on the middle syllable.'
      ru: 'Аппарат называется der Kassettenrecorder, лента внутри — das Tonband, а диск, который её вытеснил, играет der CD-Player ниже. Именно там слово и встречается: в тексте о восьмидесятых и девяностых, в рассказе о родителях или в языковом курсе на плёнке. Живы ещё два значения — die Geldkassette, маленький запирающийся ящичек, и eine Kassette mit fünf CDs, подарочный набор. После краткого a двойное s, ударение на среднем слоге.'
      uk: 'Апарат зветься der Kassettenrecorder, стрічка всередині — das Tonband, а диск, який її витіснив, грає der CD-Player нижче. Саме там слово й трапляється: у тексті про вісімдесяті й дев’яності, в оповіді про батьків або в мовному курсі на плівці. Живі ще два значення — die Geldkassette, маленька замикана скринька, і eine Kassette mit fünf CDs, подарунковий набір. Після короткого a подвійне s, наголос на середньому складі.'

  - de: CD-Player
    ipa: "tseːˈdeːˌplɛɪ̯ɐ"
    pos: noun
    gender: m
    plural: "die CD-Player"
    cards: recognition
    en: the machine that reads a silver disc and turns what is on it back into sound
    ru: аппарат, который считывает серебристый диск и превращает записанное на нём обратно в звук
    uk: апарат, який зчитує сріблястий диск і перетворює записане на ньому назад на звук
    example_de: Im Auto ist noch ein CD-Player eingebaut.
    example_en: There is still a CD player built into the car.
    example_ru: В машине ещё встроен проигрыватель компакт-дисков.
    example_uk: В авті ще вбудований програвач компакт-дисків.
    note:
      en: 'Half German-spoken abbreviation and half English word, and the pronunciation follows both halves: the two letters are read with their German names and the stress lands on the second, as in die DVD below, then the English half follows with a lighter secondary stress. Masculine, and singular and plural are spelled alike. It replaced die Kassette above and has itself been replaced by streaming, so it belongs to a car dashboard, a hotel room and a second-hand advert.'
      ru: 'Наполовину произносимое по-немецки сокращение, наполовину английское слово, и произношение слушается обеих половин: две буквы читаются по немецким названиям, ударение падает на вторую, как в die DVD ниже, а дальше идёт английская половина с более слабым побочным ударением. Мужской род, единственное и множественное пишутся одинаково. Он вытеснил die Kassette выше, а его самого вытеснил стриминг, — так что живёт он теперь в автомобильной панели, в гостиничном номере и в объявлении о продаже подержанного.'
      uk: 'Наполовину вимовлюване по-німецьки скорочення, наполовину англійське слово, і вимова слухається обох половин: дві літери читаються за німецькими назвами, наголос падає на другу, як у die DVD нижче, а далі йде англійська половина зі слабшим побічним наголосом. Чоловічий рід, однина і множина пишуться однаково. Він витіснив die Kassette вище, а його самого витіснив стримінг, — тож живе він тепер в автомобільній панелі, у готельному номері та в оголошенні про продаж уживаного.'

  - de: DVD
    ipa: "deːfaʊ̯ˈdeː"
    pos: noun
    gender: f
    plural: "die DVDs"
    cards: recognition
    en: the disc a film is sold, lent and watched from, and the format stored on it
    ru: диск, на котором фильм продают, выдают напрокат и смотрят, и сам записанный на нём формат
    uk: диск, на якому фільм продають, видають напрокат і дивляться, і сам записаний на ньому формат
    example_de: Die Bibliothek verleiht auch Filme auf DVD.
    example_en: The library also lends films on DVD.
    example_ru: Библиотека выдаёт фильмы и на дисках.
    example_uk: Бібліотека видає фільми і на дисках.
    note:
      en: 'Feminine, plural in -s. Spoken letter by letter with the stress on the last one, the same pattern as A2 der Lkw, A2 das WC and TV above; the middle letter is the German name of V, which sounds like fau and not like the English vee. Streaming has taken most of its work, but a library, a Volkshochschule and a school still lend and play them, so the word survives on a shelf label and on an old device.'
      ru: 'Женский род, множественное на -s. Читается по буквам с ударением на последней — та же схема, что у der Lkw и das WC уровня A2 и у TV выше; средняя буква произносится по-немецки, как «фау», а не по-английски. Стриминг забрал у неё почти всю работу, но библиотека, Volkshochschule и школа по-прежнему их выдают и проигрывают, так что слово держится на полочной этикетке и на старом аппарате.'
      uk: 'Жіночий рід, множина на -s. Читається по літерах із наголосом на останній — та сама схема, що в der Lkw і das WC рівня A2 та в TV вище; середня літера вимовляється по-німецьки, як «фау», а не по-англійськи. Стримінг забрав у неї майже всю роботу, але бібліотека, Volkshochschule і школа й досі їх видають і програють, тож слово тримається на поличковій етикетці й на старому апараті.'

  - de: Video
    ipa: "ˈviːdeo"
    pos: noun
    gender: n
    plural: "die Videos"
    cards: recognition
    en: a recording of moving pictures, and the short file or clip that recording is kept and shared as
    ru: запись движущегося изображения и тот короткий файл или ролик, в виде которого её хранят и пересылают
    uk: запис рухомого зображення і той короткий файл або ролик, у вигляді якого його зберігають і пересилають
    example_de: Er hat ein kurzes Video von der Feier geschickt.
    example_en: He sent a short video of the party.
    example_ru: Он прислал короткое видео с праздника.
    example_uk: Він надіслав коротке відео зі свята.
    note:
      en: 'Neuter, plural in -s, and the v is voiced here, unlike in German-rooted words such as A1 der Vater, where the same letter is an f. The everyday verbs are drehen, aufnehmen, hochladen and posten. The word has changed what it points at: it once meant the tape and the machine (die Videokassette, der Videorekorder) and now means the clip on a screen. Die Videokonferenz and das Musikvideo are its two most useful compounds.'
      ru: 'Средний род, множественное на -s, и v здесь звонкое, в отличие от исконно немецких слов вроде der Vater уровня A1, где та же буква звучит как «ф». Обиходные глаголы — drehen, aufnehmen, hochladen, posten. Слово поменяло предмет: когда-то оно значило плёнку и аппарат (die Videokassette, der Videorekorder), а теперь — ролик на экране. Два самых полезных сложных слова — die Videokonferenz и das Musikvideo.'
      uk: 'Середній рід, множина на -s, і v тут дзвінке, на відміну від питомо німецьких слів на кшталт der Vater рівня A1, де та сама літера звучить як «ф». Побутові дієслова — drehen, aufnehmen, hochladen, posten. Слово змінило предмет: колись воно означало плівку й апарат (die Videokassette, der Videorekorder), а тепер — ролик на екрані. Два найкорисніші складні слова — die Videokonferenz і das Musikvideo.'

  # --- Musik, Bild und die Leute dahinter ---
  - de: Song
    ipa: "ˈzɔŋ"
    pos: noun
    gender: m
    plural: "die Songs"
    cards: recognition
    en: a short piece of modern popular music with words, of the kind a band or a singer releases
    ru: короткая современная песня со словами — из тех, что выпускают группа или исполнитель
    uk: коротка сучасна пісня зі словами — з тих, що випускають гурт чи виконавець
    example_de: Der neue Song läuft im Radio rauf und runter.
    example_en: The new track is played over and over on the radio.
    example_ru: Новая песня крутится по радио без остановки.
    example_uk: Нова пісня крутиться по радіо без упину.
    note:
      en: 'Masculine, plural in -s, and the initial s is voiced in German, so it does not sound like the English word it came from. A2 das Lied, in the deck `kultur-unterhaltung-a2`, is the German word and stretches from a children''s song to a church hymn to an art song; this one belongs to pop and rock and to what a chart counts. The words are der Songtext, the writer is der Songwriter, and the album it sits on is das Album.'
      ru: 'Мужской род, множественное на -s, а начальное s по-немецки звонкое, так что на английский оригинал слово не похоже. das Lied уровня A2 из колоды `kultur-unterhaltung-a2` — немецкое слово, и оно тянется от детской песенки через церковный гимн до романса; это же принадлежит поп- и рок-музыке и тому, что считают чарты. Слова песни — der Songtext, автор — der Songwriter, а альбом, на котором она стоит, — das Album.'
      uk: 'Чоловічий рід, множина на -s, а початкове s по-німецьки дзвінке, тож на англійський оригінал слово не схоже. das Lied рівня A2 з колоди `kultur-unterhaltung-a2` — німецьке слово, і воно тягнеться від дитячої пісеньки через церковний гімн до романсу; це ж належить поп- і рок-музиці та тому, що рахують чарти. Слова пісні — der Songtext, автор — der Songwriter, а альбом, на якому вона стоїть, — das Album.'

  - de: Hit
    ipa: "ˈhɪt"
    pos: noun
    gender: m
    plural: "die Hits"
    cards: recognition
    en: a piece of music or a product that suddenly succeeds everywhere and sells in very large numbers
    ru: вещь или песня, которая вдруг имеет успех повсюду и расходится огромным тиражом
    uk: річ або пісня, яка раптом має успіх усюди й розходиться величезним накладом
    example_de: Das Lied war vor dreißig Jahren ein großer Hit.
    example_en: The song was a huge success thirty years ago.
    example_ru: Тридцать лет назад эта песня была большим шлягером.
    example_uk: Тридцять років тому ця пісня була великим шлягером.
    note:
      en: 'Masculine, plural in -s. What separates it from der Song above is not the kind of thing but the success: every Hit was first a Song, and most Songs never become one. Older German says der Schlager for the same idea in its own popular-music tradition, and the ranking is die Hitparade or, more recently, die Charts. It works beyond music too: Das Buch war der Hit des Jahres, der Sommerhit.'
      ru: 'Мужской род, множественное на -s. От der Song выше его отличает не род предмета, а успех: всякий Hit сначала был Song, но большинство Songs им так и не становятся. Более старый немецкий скажет der Schlager — в своей собственной эстрадной традиции, — а рейтинг называется die Hitparade или, ближе к нашему времени, die Charts. Слово работает и вне музыки: Das Buch war der Hit des Jahres, der Sommerhit.'
      uk: 'Чоловічий рід, множина на -s. Від der Song вище його відрізняє не рід предмета, а успіх: кожен Hit спершу був Song, але більшість Songs ним так і не стають. Давніша німецька скаже der Schlager — у своїй власній естрадній традиції, — а рейтинг зветься die Hitparade або, ближче до нашого часу, die Charts. Слово працює й поза музикою: Das Buch war der Hit des Jahres, der Sommerhit.'

  - de: Fotograf
    ipa: "fotoˈgʁaːf"
    pos: noun
    gender: m
    plural: "die Fotografen"
    cards: recognition
    en: a person whose trade is taking pictures with a camera
    ru: человек, чьё ремесло — снимать камерой
    uk: людина, чиє ремесло — знімати камерою
    example_de: Der Fotograf hat für die Zeitung gearbeitet.
    example_en: The photographer worked for the newspaper.
    example_ru: Этот фотограф работал для газеты.
    example_uk: Цей фотограф працював для газети.
    note:
      en: 'A weak masculine, so it takes -en everywhere except the nominative singular: der Fotograf, den Fotografen, dem Fotografen, des Fotografen, die Fotografen. A2 der Journalist (deck `berufe-a2`) declines the same way, and the two often turn up in one sentence. A1 das Foto is the picture itself and A1 fotografieren (deck `freizeit-koennen`) is the act; the feminine is made regularly with -in. Stress on the last syllable.'
      ru: 'Слабое существительное мужского рода, поэтому берёт -en везде, кроме именительного единственного: der Fotograf, den Fotografen, dem Fotografen, des Fotografen, die Fotografen. der Journalist уровня A2 (колода `berufe-a2`) склоняется так же, и эти двое нередко оказываются в одном предложении. das Foto уровня A1 — сам снимок, fotografieren уровня A1 (колода `freizeit-koennen`) — действие; женская пара образуется обычным -in. Ударение на последнем слоге.'
      uk: 'Слабкий іменник чоловічого роду, тому бере -en усюди, крім називного однини: der Fotograf, den Fotografen, dem Fotografen, des Fotografen, die Fotografen. der Journalist рівня A2 (колода `berufe-a2`) відмінюється так само, і ці двоє нерідко опиняються в одному реченні. das Foto рівня A1 — сам знімок, fotografieren рівня A1 (колода `freizeit-koennen`) — дія; жіноча пара твориться звичайним -in, за моцією. Наголос на останньому складі.'

  - de: Fotografie
    ipa: "fotogʁaˈfiː"
    pos: noun
    gender: f
    plural: "die Fotografien"
    cards: recognition
    en: the craft and the art of making pictures with a camera; also, in careful writing, one single such picture
    ru: ремесло и искусство создавать изображения камерой; а также, в тщательной письменной речи, один отдельный такой снимок
    uk: ремесло і мистецтво творити зображення камерою; а також, у ретельному письмі, один окремий такий знімок
    example_de: Sie interessiert sich seit Jahren für Fotografie.
    example_en: She has been interested in photography for years.
    example_ru: Она уже много лет увлекается фотографией.
    example_uk: Вона вже багато років захоплюється фотографією.
    note:
      en: 'Two senses at different heights of style: the field, which has no plural and takes no article in the example above, and one printed picture, where everyday German simply says A1 das Foto. Nouns in -ie of this family are feminine, stressed on that last syllable and take -n in the plural, with the ending then read as two syllables. The older spelling Photographie is still met in books printed before the 1996 reform.'
      ru: 'Два значения на разной стилистической высоте: область занятий, у которой нет множественного и которая в примере выше идёт без артикля, и один отпечатанный снимок, для чего обиходный немецкий просто скажет das Foto уровня A1. Существительные на -ie этого семейства женского рода, ударны на последнем слоге и во множественном берут -n, причём окончание тогда читается двумя слогами. Старое написание Photographie ещё встречается в книгах, набранных до реформы 1996 года.'
      uk: 'Два значення на різній стилістичній висоті: галузь занять, яка не має множини і яка в прикладі вище йде без артикля, і один віддрукований знімок, для чого побутова німецька просто скаже das Foto рівня A1. Іменники на -ie цієї родини жіночого роду, наголошені на останньому складі й у множині беруть -n, причому закінчення тоді читається двома складами. Старий правопис Photographie ще трапляється в книжках, набраних до реформи 1996 року.'
