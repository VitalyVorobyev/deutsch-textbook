# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the eating-out and
# festivity field of data/goethe-b1-wortliste.txt: the four or five kinds of place a
# German town has for eating and drinking and what tells them apart, the person behind
# the counter, the dishes and bottles the Wortliste files under Anglizismen, the one
# German instruction every tea packet prints, and the season the south spends in
# costume. This is the German of a menu, a shop sign and a recipe.
# A1's `essen-trinken` owns das Restaurant, das Fleisch, die Wurst, das Obst, das Bier,
# der Wein and der Tee, A2's `essen-trinken-a2` owns das Lokal, das Gericht, die
# Speisekarte, braten, backen, Pommes frites and der Hamburger, A2's `berufe-a2` owns
# der Kellner, die Kellnerin and der Bäcker, A1's `reisen-urlaub` owns der Gast, A1's
# `haushalt-geraete` owns der Herd, B1's `wohnen-gebaeude-b1` owns der Ofen, A2's
# `freunde-feste` owns die Torte, das Geschenk and anstoßen, and A2's `zeit-termine-a2`
# owns der Karneval, Weihnachten and Ostern. This deck is what those eight leave
# unnamed: the sign over the door, the person who owns the place, and the words a menu
# borrowed from English and French.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read, never written: the learner orders out of A1 and A2 words, and everything here is
# what the sign, the menu, the packet and the invitation say back at him.
id: gastronomie-feste-b1
title_de: "Gastronomie und Feste"
title_en: "Eating out and festivities"
title_ru: "Общепит и праздники"
title_uk: "Гастрономія і свята"
level: B1
entries:
  # --- Wo man einkehrt ---
  - de: Gasthaus
    ipa: "ˈgasthaʊ̯s"
    pos: noun
    gender: n
    plural: "die Gasthäuser"
    cards: recognition
    en: a country inn that serves food and often has rooms upstairs
    ru: сельский трактир, где кормят и нередко сдают комнаты наверху
    uk: сільський заїзд, де годують і нерідко здають кімнати нагорі
    example_de: Im Dorf gibt es nur ein Gasthaus, aber das Essen ist gut.
    example_en: There is only one inn in the village, but the food is good.
    example_ru: В деревне только один трактир, но кормят там хорошо.
    example_uk: У селі лише один заїзд, але годують там добре.
    note:
      en: 'A1 der Gast in the deck `reisen-urlaub` plus A1 das Haus in the deck `wohnen`, neuter after its second half, umlaut in the plural. The word is old-fashioned and rural, and it is what a hiking map marks; A1 das Restaurant in the deck `essen-trinken` is the neutral word and A2 das Lokal in the deck `essen-trinken-a2` is any place you go out to. The room you sit in is die Gaststube, and a sign reading Gasthof usually promises beds as well. Gaststätte, the next entry, is the official name for the same trade.'
      ru: 'der Gast уровня A1 из колоды `reisen-urlaub` плюс das Haus уровня A1 из колоды `wohnen`, род средний по второй половине, во множественном умлаут. Слово старомодное и сельское, его отмечает туристская карта; das Restaurant уровня A1 из колоды `essen-trinken` — нейтральное название, а das Lokal уровня A2 из колоды `essen-trinken-a2` — любое заведение, куда выходят вечером. Зал, где сидят, — die Gaststube, а вывеска Gasthof обычно обещает ещё и ночлег. Gaststätte, следующая запись, — официальное имя того же ремесла.'
      uk: 'der Gast рівня A1 з колоди `reisen-urlaub` плюс das Haus рівня A1 з колоди `wohnen`, рід середній за другою половиною, у множині умлаут. Слово старомодне і сільське, його позначає туристична мапа; das Restaurant рівня A1 з колоди `essen-trinken` — нейтральна назва, а das Lokal рівня A2 з колоди `essen-trinken-a2` — будь-який заклад, куди виходять увечері. Зала, де сидять, — die Gaststube, а вивіска Gasthof зазвичай обіцяє ще й нічліг. Gaststätte, наступний запис, — офіційне ім’я того самого ремесла.'

  - de: Gaststätte
    ipa: "ˈgastʃtɛtə"
    pos: noun
    gender: f
    plural: "die Gaststätten"
    cards: recognition
    en: any place licensed to serve food and drink to the public, seen as a trade
    ru: любое заведение с разрешением кормить и поить публику, взятое как род занятий
    uk: будь-який заклад із дозволом годувати й напувати публіку, узятий як рід занять
    example_de: Die Gaststätte an der Ecke hat montags geschlossen.
    example_en: The restaurant on the corner is closed on Mondays.
    example_ru: Заведение на углу по понедельникам закрыто.
    example_uk: Заклад на розі по понеділках зачинений.
    note:
      en: 'Gast plus die Stätte, a place, and the st at the joint is spoken ʃt because a new word begins there. This is the administrative term: das Gaststättengewerbe is the trade and das Gaststättengesetz the law that governs it, so it belongs to a licence and a council decision far more than to speech. Gasthaus above is the rural building, and in conversation people say A2 das Lokal in the deck `essen-trinken-a2` or simply name the place.'
      ru: 'Gast плюс die Stätte — «место», — и st на стыке звучит как ʃt, потому что там начинается новое слово. Это административный термин: das Gaststättengewerbe — сама отрасль, das Gaststättengesetz — закон о ней, — так что живёт он в лицензии и решении муниципалитета куда больше, чем в речи. Gasthaus выше — сельское здание, а в разговоре скажут das Lokal уровня A2 из колоды `essen-trinken-a2` или просто назовут заведение по имени.'
      uk: 'Gast плюс die Stätte — «місце», — і st на стику звучить як ʃt, бо там починається нове слово. Це адміністративний термін: das Gaststättengewerbe — сама галузь, das Gaststättengesetz — закон про неї, — тож живе він у ліцензії та ухвалі муніципалітету куди більше, ніж у мовленні. Gasthaus вище — сільська будівля, а в розмові скажуть das Lokal рівня A2 з колоди `essen-trinken-a2` або просто назвуть заклад на ім’я.'

  - de: Kneipe
    ipa: "ˈknaɪ̯pə"
    pos: noun
    gender: f
    plural: "die Kneipen"
    cards: recognition
    en: a plain pub where people mostly go to drink and talk
    ru: простая пивная, куда ходят прежде всего выпить и поговорить
    uk: проста пивничка, куди ходять передусім випити й поговорити
    example_de: Wir treffen uns nach der Arbeit in der Kneipe gegenüber.
    example_en: We are meeting in the pub across the road after work.
    example_ru: Мы встречаемся после работы в пивной напротив.
    example_uk: Ми зустрічаємося після роботи в пивничці навпроти.
    note:
      en: 'Informal but entirely usable, feminine, ordinary plural, and both letters of kn- are spoken. Food is beside the point here: A1 das Restaurant in the deck `essen-trinken` is where you go to eat and this is where you go to sit. Der Kneipenbummel is a pub crawl and die Eckkneipe is the local on a street corner. B1 die Diskothek in the deck `kultur-literatur-presse-b1` is where the music is loud enough to stop the talking, and die Bar, the next entry, is the smarter neighbour.'
      ru: 'Разговорно, но вполне употребимо; женский род, множественное обычное, в kn- слышны обе буквы. Еда здесь ни при чём: das Restaurant уровня A1 из колоды `essen-trinken` — куда идут поесть, а сюда идут посидеть. Der Kneipenbummel — обход нескольких заведений за вечер, die Eckkneipe — своя пивная на углу. die Diskothek уровня B1 из колоды `kultur-literatur-presse-b1` — там, где музыка громче разговора, а die Bar, следующая запись, — более нарядный сосед.'
      uk: 'Розмовно, але цілком ужитково; жіночий рід, множина звичайна, у kn- чути обидві літери. Їжа тут ні до чого: das Restaurant рівня A1 з колоди `essen-trinken` — куди йдуть поїсти, а сюди йдуть посидіти. Der Kneipenbummel — обхід кількох закладів за вечір, die Eckkneipe — своя пивничка на розі. die Diskothek рівня B1 з колоди `kultur-literatur-presse-b1` — там, де музика гучніша за розмову, а die Bar, наступний запис, — ошатніший сусід.'

  - de: Bar
    ipa: "ˈbaːɐ̯"
    pos: noun
    gender: f
    plural: "die Bars"
    cards: recognition
    en: 'a place for drinks in the evening; and the long counter you get them at'
    ru: 'заведение, где пьют вечером; а также длинная стойка, за которой наливают'
    uk: 'заклад, де п’ють увечері; а також довга стійка, за якою наливають'
    example_de: An der Bar war kein Platz mehr frei.
    example_en: There was no seat left at the bar.
    example_ru: У стойки не осталось свободного места.
    example_uk: Біля стійки не лишилося вільного місця.
    note:
      en: 'An English loan, feminine in German, plural in -s, with the r vocalised to ɐ̯. The preposition tells the two senses apart: in der Bar is inside the place, an der Bar is at the counter, exactly as in the example. Kneipe above is plainer and older; the usual compounds are die Cocktailbar and die Hotelbar. A counter that sells coffee and rolls is eine Snackbar or der Imbiss below, and neither of those pours spirits.'
      ru: 'Английское заимствование, в немецком женского рода, множественное на -s, r вокализуется в ɐ̯. Значения разводит предлог: in der Bar — внутри заведения, an der Bar — у стойки, ровно как в примере. Kneipe выше проще и старше; обычные сложные слова — die Cocktailbar и die Hotelbar. Прилавок, где берут кофе и булку, — eine Snackbar или der Imbiss ниже, и крепкого там не наливают.'
      uk: 'Англійське запозичення, у німецькій жіночого роду, множина на -s, r вокалізується в ɐ̯. Значення розводить прийменник: in der Bar — усередині закладу, an der Bar — біля стійки, точно як у прикладі. Kneipe вище простіша й старша; звичайні складні слова — die Cocktailbar і die Hotelbar. Прилавок, де беруть каву й булку, — eine Snackbar або der Imbiss нижче, і міцного там не наливають.'

  - de: Imbiss
    ipa: "ˈɪmbɪs"
    pos: noun
    gender: m
    plural: "die Imbisse"
    cards: recognition
    en: 'a small stand selling hot food to eat standing up; and the quick bite itself'
    ru: 'маленькая закусочная, где горячее едят стоя; а также сам быстрый перекус'
    uk: 'маленька закусочна, де гаряче їдять стоячи; а також сам швидкий перекус'
    example_de: Am Bahnhof gibt es einen Imbiss mit warmen Würstchen.
    example_en: There is a snack stand with hot sausages at the station.
    example_ru: На вокзале есть закусочная с горячими сосисками.
    example_uk: На вокзалі є закусочна з гарячими сосисками.
    note:
      en: 'Masculine, and the plural doubles nothing but keeps the short i: die Imbisse. The place sense is the everyday one, and the fuller words are der Imbissstand and die Imbissstube, both written with three s where the two halves meet. A1 die Wurst in the deck `essen-trinken`, A2 Pommes frites and A2 der Hamburger in the deck `essen-trinken-a2` are what it sells. The older sense is the meal itself, einen kleinen Imbiss zu sich nehmen, which sounds formal today.'
      ru: 'Мужской род, а во множественном ничего не удваивается, кроме уже стоящего s: die Imbisse. Значение «закусочная» обиходно, а более полные слова — der Imbissstand и die Imbissstube, оба с тремя s на стыке половин. die Wurst уровня A1 из колоды `essen-trinken`, Pommes frites и der Hamburger уровня A2 из колоды `essen-trinken-a2` — то, чем там торгуют. Старшее значение — сам перекус: einen kleinen Imbiss zu sich nehmen, — и сегодня оно звучит официально.'
      uk: 'Чоловічий рід, а в множині нічого не подвоюється, крім уже наявного s: die Imbisse. Значення «закусочна» побутове, а повніші слова — der Imbissstand і die Imbissstube, обидва з трьома s на стику половин. die Wurst рівня A1 з колоди `essen-trinken`, Pommes frites і der Hamburger рівня A2 з колоди `essen-trinken-a2` — те, чим там торгують. Старше значення — сам перекус: einen kleinen Imbiss zu sich nehmen, — і сьогодні воно звучить офіційно.'

  # --- Wer bewirtet ---
  - de: Wirt
    ipa: "ˈvɪʁt"
    pos: noun
    gender: m
    plural: "die Wirte"
    cards: recognition
    en: the man who runs a pub or an inn and stands behind its counter
    ru: мужчина, который держит трактир или пивную и сам стоит за стойкой
    uk: чоловік, який тримає корчму або пивничку і сам стоїть за стійкою
    example_de: Der Wirt kennt jeden Gast beim Namen.
    example_en: The landlord knows every guest by name.
    example_ru: Хозяин знает каждого гостя по имени.
    example_uk: Господар знає кожного гостя на ім’я.
    note:
      en: 'Masculine, plural in -e. He owns or leases the place, which is what separates him from A2 der Kellner in the deck `berufe-a2`, who is employed to carry the plates. The word is the second half of der Gastwirt and the first of die Wirtschaft, which in German means a pub as well as the economy, and der Hauswirt is a landlord of flats. The feminine is die Wirtin, the next entry.'
      ru: 'Мужской род, множественное на -e. Он владеет заведением или снимает его, и этим отличается от der Kellner уровня A2 из колоды `berufe-a2`, которого наняли носить тарелки. Слово стоит второй половиной в der Gastwirt и первой в die Wirtschaft, которое по-немецки значит и «кабачок», и «экономика», а der Hauswirt — домовладелец, сдающий квартиры. Женская пара — die Wirtin, следующая запись.'
      uk: 'Чоловічий рід, множина на -e. Він володіє закладом або наймає його, і цим відрізняється від der Kellner рівня A2 з колоди `berufe-a2`, якого найняли носити тарілки. Слово стоїть другою половиною в der Gastwirt і першою в die Wirtschaft, яке німецькою означає і «шинок», і «економіка», а der Hauswirt — домовласник, що здає помешкання. Жіноча пара — die Wirtin, наступний запис.'

  - de: Wirtin
    ipa: "ˈvɪʁtɪn"
    pos: noun
    gender: f
    plural: "die Wirtinnen"
    cards: recognition
    en: the woman who runs a pub or an inn
    ru: женщина, которая держит трактир или пивную
    uk: жінка, яка тримає корчму або пивничку
    example_de: Die Wirtin bringt die Suppe selbst an den Tisch.
    example_en: The landlady brings the soup to the table herself.
    example_ru: Хозяйка сама подаёт суп на стол.
    example_uk: Господиня сама подає суп на стіл.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n. In a small house the two words name the couple who run the place together, der Wirt und die Wirtin, and a guest may address her as Frau Wirtin or simply by name. Die Hauswirtin, on the other hand, is the woman a tenant pays his rent to, which is a different trade built on the same word.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается. В маленьком заведении оба слова называют пару, которая держит его вдвоём: der Wirt und die Wirtin, — а гость обратится Frau Wirtin или просто по имени. Die Hauswirtin, напротив, — та, кому квартирант платит квартплату, и это другое занятие, построенное на том же слове.'
      uk: 'Звичайна моція на -in, у множині n подвоюється. У маленькому закладі обидва слова називають пару, яка тримає його вдвох: der Wirt und die Wirtin, — а гість звернеться Frau Wirtin або просто на ім’я. Die Hauswirtin, навпаки, — та, кому наймач платить за помешкання, і це інше заняття, побудоване на тому самому слові.'

  - de: Metzger
    ipa: "ˈmɛtsgɐ"
    pos: noun
    gender: m
    plural: "die Metzger"
    cards: recognition
    en: a man whose trade is cutting up meat and selling it
    ru: мужчина, ремесло которого разделывать мясо и продавать его
    uk: чоловік, ремесло якого розбирати м’ясо і продавати його
    example_de: Beim Metzger an der Ecke gibt es die beste Wurst.
    example_en: The butcher on the corner has the best sausage.
    example_ru: У мясника на углу лучшая колбаса.
    example_uk: У м’ясника на розі найкраща ковбаса.
    note:
      en: 'Masculine, singular and plural spelled alike, and the tz is ts. It is the everyday word in southern Germany, in Switzerland and in much of the west; northern and eastern Germany call the same trade der Fleischer. The shop is die Metzgerei, and beim Metzger in the example means at his shop, exactly as beim Bäcker does with A2 der Bäcker in the deck `berufe-a2`. A1 das Fleisch and A1 die Wurst in the deck `essen-trinken` are what he sells.'
      ru: 'Мужской род, единственное и множественное пишутся одинаково, tz звучит как ts. Это обиходное слово юга Германии, Швейцарии и значительной части запада; север и восток зовут то же ремесло der Fleischer. Лавка — die Metzgerei, а beim Metzger в примере значит «в его лавке», ровно как beim Bäcker при der Bäcker уровня A2 из колоды `berufe-a2`. das Fleisch и die Wurst уровня A1 из колоды `essen-trinken` — то, чем он торгует.'
      uk: 'Чоловічий рід, однина і множина пишуться однаково, tz звучить як ts. Це побутове слово півдня Німеччини, Швейцарії та значної частини заходу; північ і схід звуть те саме ремесло der Fleischer. Крамниця — die Metzgerei, а beim Metzger у прикладі означає «у його крамниці», точно як beim Bäcker при der Bäcker рівня A2 з колоди `berufe-a2`. das Fleisch і die Wurst рівня A1 з колоди `essen-trinken` — те, чим він торгує.'

  # --- Was auf den Tisch kommt ---
  - de: Braten
    ipa: "ˈbʁaːtn̩"
    pos: noun
    gender: m
    plural: "die Braten"
    cards: recognition
    en: a large piece of meat cooked whole in the oven and carved at the table
    ru: большой кусок мяса, запечённый целиком в духовке и разрезаемый за столом
    uk: великий шматок м’яса, запечений цілим у духовці й розрізаний за столом
    example_de: Sonntags gibt es bei uns einen Braten mit Kartoffeln.
    example_en: On Sundays we have a roast with potatoes.
    example_ru: По воскресеньям у нас жаркое с картошкой.
    example_uk: По неділях у нас печеня з картоплею.
    note:
      en: 'It looks like the infinitive A2 braten in the deck `essen-trinken-a2` turned into a noun, but a German infinitive used that way is neuter, das Braten. This one is masculine and older, and it names the piece of meat and not the cooking of it; singular and plural are spelled alike. Compounds name the animal or the day: der Schweinebraten, der Rinderbraten, der Sonntagsbraten. What it is cooked in is der Backofen below, and the gravy is die Bratensoße, built on B1 die Soße in the deck `essen-lebensmittel-b1`.'
      ru: 'Слово выглядит как инфинитив braten уровня A2 из колоды `essen-trinken-a2`, ставший существительным, но субстантивированный немецкий инфинитив был бы среднего рода: das Braten. Это же слово мужского рода и старше, и называет оно кусок мяса, а не само жарение; единственное и множественное пишутся одинаково. Сложные слова называют животное или день: der Schweinebraten, der Rinderbraten, der Sonntagsbraten. Готовят его в der Backofen ниже, а подливка — die Bratensoße, построенная на die Soße уровня B1 из колоды `essen-lebensmittel-b1`.'
      uk: 'Слово виглядає як інфінітив braten рівня A2 з колоди `essen-trinken-a2`, що став іменником, але субстантивований німецький інфінітив був би середнього роду: das Braten. Це ж слово чоловічого роду і старше, і називає воно шматок м’яса, а не саме смаження; однина і множина пишуться однаково. Складні слова називають тварину або день: der Schweinebraten, der Rinderbraten, der Sonntagsbraten. Готують його в der Backofen нижче, а підлива — die Bratensoße, побудована на die Soße рівня B1 з колоди `essen-lebensmittel-b1`.'

  - de: Steak
    ipa: "ˈʃteːk"
    pos: noun
    gender: n
    plural: "die Steaks"
    cards: recognition
