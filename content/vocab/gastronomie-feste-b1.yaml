  - de: Tee ziehen lassen
    ipa: "ˈteː ˈtsiːən ˈlasn̩"
    pos: phrase
    cards: recognition
    en: to leave tea standing in hot water until it is strong enough
    ru: дать чаю постоять в горячей воде, пока он не станет достаточно крепким
    uk: дати чаєві постояти в гарячій воді, доки він не стане досить міцним
    example_de: Den Tee drei Minuten ziehen lassen, dann den Beutel herausnehmen.
    example_en: Let the tea brew for three minutes, then take the bag out.
    example_ru: Дать чаю настояться три минуты, затем вынуть пакетик.
    example_uk: Дати чаєві настоятися три хвилини, тоді вийняти пакетик.
    note:
      en: 'The structure is lassen plus a bare infinitive, so ziehen carries no zu and both verbs stand at the end: den Tee ziehen lassen, ich habe den Tee ziehen lassen. Ziehen here is neither pulling nor moving house; it is what the leaves do in the water, and no other food takes the verb this way. A packet prints the instruction in the infinitive, as in the example, and der Teebeutel is what comes out afterwards. A1 der Tee ships in the deck `essen-trinken`.'
      ru: 'Конструкция — lassen плюс голый инфинитив, поэтому при ziehen нет zu, а оба глагола стоят в конце: den Tee ziehen lassen, ich habe den Tee ziehen lassen. Ziehen здесь не «тянуть» и не «переезжать»: это то, что делают листья в воде, и ни с какой другой едой глагол так не работает. Пачка печатает указание в инфинитиве, как в примере, а der Teebeutel — то, что потом вынимают. der Tee уровня A1 есть в колоде `essen-trinken`.'
      uk: 'Конструкція — lassen плюс голий інфінітив, тому при ziehen немає zu, а обидва дієслова стоять у кінці: den Tee ziehen lassen, ich habe den Tee ziehen lassen. Ziehen тут не «тягти» і не «переїжджати»: це те, що роблять листки у воді, і з жодною іншою їжею дієслово так не працює. Пачка друкує вказівку в інфінітиві, як у прикладі, а der Teebeutel — те, що потім виймають. der Tee рівня A1 є в колоді `essen-trinken`.'

  - de: runterwerfen
    ipa: "ˈʁʊntɐˌvɛʁfn̩"
    pos: verb
    praesens_3sg: wirft runter
    partizip2: runtergeworfen
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to throw or knock something down from where it was standing
    ru: сбросить или столкнуть что-либо вниз оттуда, где оно стояло
    uk: скинути або зіштовхнути щось униз звідти, де воно стояло
    example_de: Pass auf, du wirfst gleich das Glas runter!
    example_en: Careful, you are about to knock the glass down!
    example_ru: Осторожно, ты сейчас сбросишь стакан!
    example_uk: Обережно, ти зараз скинеш склянку!
    note:
      en: 'Separable and strong, inheriting everything from B1 werfen in the deck `verben-handlungen-b1-1`: wirft runter, warf runter, hat runtergeworfen. Runter is the spoken short form that has swallowed both herunter, down towards the speaker, and hinunter, down away from him, which is exactly why speech prefers it: it never has to choose. A written text uses the long herunterwerfen. Every verb built on runter behaves alike: runtergehen, runterfallen, runterladen.'
      ru: 'Отделяемый и сильный, всё берёт от werfen уровня B1 из колоды `verben-handlungen-b1-1`: wirft runter, warf runter, hat runtergeworfen. Runter — разговорная краткая форма, вобравшая и herunter — вниз к говорящему, — и hinunter — вниз от него, — и именно потому речь её и предпочитает: выбирать не приходится. Письменный текст берёт длинное herunterwerfen. Всякий глагол на runter ведёт себя так же: runtergehen, runterfallen, runterladen.'
      uk: 'Відокремлюване і сильне, усе бере від werfen рівня B1 з колоди `verben-handlungen-b1-1`: wirft runter, warf runter, hat runtergeworfen. Runter — розмовна коротка форма, що вбрала і herunter — униз до мовця, — і hinunter — униз від нього, — і саме тому мовлення її й воліє: обирати не доводиться. Писемний текст бере довге herunterwerfen. Кожне дієслово на runter поводиться так само: runtergehen, runterfallen, runterladen.'

  # --- Feiern ---
  - de: Fasching
    ipa: "ˈfaʃɪŋ"
    pos: noun
    gender: m
    plural: "die Faschinge"
    cards: recognition
    en: the season of costumes and parades before Lent, as the south calls it
    ru: пора костюмов и шествий перед постом, как её зовут на юге
    uk: пора костюмів і походів перед постом, як її звуть на півдні
    example_de: Im Fasching gehen die Kinder verkleidet in die Schule.
    example_en: During the carnival season the children go to school in fancy dress.
    example_ru: На карнавальной неделе дети идут в школу в костюмах.
    example_uk: На карнавальному тижні діти йдуть до школи в костюмах.
    note:
      en: 'Masculine, and the plural die Faschinge is in the dictionary but almost never needed, because the season comes round once a year. It is the word of Bavaria and of Austria, while the Rhineland says A2 der Karneval in the deck `zeit-termine-a2`, which is also what a national broadcast uses. The peak day is der Faschingsdienstag, the Tuesday before Ash Wednesday, and B1 das Kostüm in the deck `einkaufen-geld-b1` already carries the sense of an outfit worn to play a part. A B1 reader needs both words, because which one a text uses says where it was written.'
      ru: 'Мужской род, а множественное die Faschinge в словаре есть, но почти не нужно: пора эта приходит раз в год. Это слово Баварии и Австрии, тогда как Рейнская область говорит der Karneval уровня A2 из колоды `zeit-termine-a2`, и его же берёт общегерманский эфир. Кульминация — der Faschingsdienstag, вторник накануне Пепельной среды, а das Kostüm уровня B1 из колоды `einkaufen-geld-b1` уже несёт значение наряда, в котором изображают кого-то. Читателю уровня B1 нужны оба слова: то, какое из них выбрал текст, говорит, где он написан.'
      uk: 'Чоловічий рід, а множина die Faschinge у словнику є, але майже не потрібна: ця пора приходить раз на рік. Це слово Баварії та Австрії, тоді як Рейнська область каже der Karneval рівня A2 з колоди `zeit-termine-a2`, і його ж бере загальнонімецький ефір. Кульмінація — der Faschingsdienstag, вівторок напередодні Попільної середи, а das Kostüm рівня B1 з колоди `einkaufen-geld-b1` уже несе значення вбрання, у якому вдають когось. Читачеві рівня B1 потрібні обидва слова: те, яке з них обрав текст, каже, де його написано.'

  - de: dekorieren
    ipa: "dekoˈʁiːʁən"
    pos: verb
    praesens_3sg: dekoriert
    partizip2: dekoriert
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to make a room, a table or a shop window look festive by putting things on and around it
    ru: украшать комнату, стол или витрину, расставляя и развешивая что-либо
    uk: прикрашати кімнату, стіл або вітрину, розставляючи й розвішуючи щось
    example_de: Wir haben den ganzen Saal mit Blumen dekoriert.
    example_en: We decorated the whole hall with flowers.
    example_ru: Мы украсили весь зал цветами.
    example_uk: Ми прикрасили всю залу квітами.
    note:
      en: 'Weak and inseparable, so the participle carries no ge-: hat dekoriert. What is used follows mit plus the dative, as in the example. The nouns are die Dekoration and, in speech, die Deko: die Weihnachtsdeko, die Tischdeko. Dressing a shop window is the professional sense of the verb, and the plainer German schmücken does the same job for a tree, a room and a person.'
      ru: 'Слабый и неотделяемый, поэтому в причастии нет ge-: hat dekoriert. Чем украшают, вводится через mit с дательным, как в примере. Существительные — die Dekoration и в речи die Deko: die Weihnachtsdeko, die Tischdeko. Оформление витрины — профессиональное значение глагола, а более простое немецкое schmücken делает ту же работу для ёлки, комнаты и человека.'
      uk: 'Слабке і невідокремлюване, тому в дієприкметнику немає ge-: hat dekoriert. Чим прикрашають, уводиться через mit з давальним, як у прикладі. Іменники — die Dekoration і в мовленні die Deko: die Weihnachtsdeko, die Tischdeko. Оформлення вітрини — фахове значення дієслова, а простіше німецьке schmücken робить ту саму роботу для ялинки, кімнати й людини.'

  - de: Prost
    ipa: "ˈpʁoːst"
    pos: interj
    cards: recognition
    en: what Germans say to one another as they raise their glasses
    ru: то, что немцы говорят друг другу, поднимая бокалы
    uk: те, що німці кажуть одне одному, підіймаючи келихи
    example_de: Prost, auf euer neues Haus!
    example_en: Cheers, here is to your new house!
    example_ru: Ваше здоровье, за ваш новый дом!
    example_uk: Будьмо, за ваш новий дім!
    note:
      en: 'A shortened Latin prosit, may it do good, which is why the full Prosit Neujahr still appears on a New Year card. The gesture that goes with it is A2 anstoßen in the deck `freunde-feste`, and the other formulas are Zum Wohl, a shade more formal, and auf dein Wohl. German also uses the phrase Prost Mahlzeit ironically, when something has just gone thoroughly wrong.'
      ru: 'Сокращённое латинское prosit — «пусть пойдёт на пользу», — потому и полное Prosit Neujahr до сих пор стоит на новогодней открытке. Жест, который при этом делают, — anstoßen уровня A2 из колоды `freunde-feste`, а прочие формулы — Zum Wohl, чуть более официальное, и auf dein Wohl. Оборот Prost Mahlzeit немец употребляет иронически, когда дело только что окончательно расстроилось.'
      uk: 'Скорочене латинське prosit — «хай піде на користь», — тому й повне Prosit Neujahr досі стоїть на новорічній листівці. Жест, який при цьому роблять, — anstoßen рівня A2 з колоди `freunde-feste`, а решта формул — Zum Wohl, трохи офіційніше, і auf dein Wohl. Зворот Prost Mahlzeit німець уживає іронічно, коли справа щойно остаточно зіпсувалася.'
