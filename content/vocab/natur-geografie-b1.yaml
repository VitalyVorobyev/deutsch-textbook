    note:
      en: 'Masculine, singular and plural spelled alike, and the -en is a syllabic n. One German word does two jobs that a text tells apart by the verb: im Schatten sitzen is the cool place, einen langen Schatten werfen is the shape on the ground. A1 die Sonne in the deck `wetter-natur` is what makes it, while A1 dunkel in `wohnen` describes the absence of light altogether. Chunks: Schatten spenden, and jemanden in den Schatten stellen for outshining somebody.'
      ru: 'Мужской род, единственное и множественное пишутся одинаково, -en — слоговое n. Одно немецкое слово делает две работы, а текст различает их по глаголу: im Schatten sitzen — прохладное место, einen langen Schatten werfen — фигура на земле. die Sonne уровня A1 из колоды `wetter-natur` её создаёт, а dunkel уровня A1 из `wohnen` описывает отсутствие света вообще. Обороты: Schatten spenden, а jemanden in den Schatten stellen значит «затмить кого-либо».'
      uk: 'Чоловічий рід, однина і множина пишуться однаково, -en — складове n. Одне німецьке слово робить дві роботи, а текст розрізняє їх за дієсловом: im Schatten sitzen — прохолодне місце, einen langen Schatten werfen — постать на землі. die Sonne рівня A1 з колоди `wetter-natur` її створює, а dunkel рівня A1 з `wohnen` описує відсутність світла взагалі. Звороти: Schatten spenden, а jemanden in den Schatten stellen означає «затьмарити когось».'

  # --- Draußen, und wenn es schiefgeht ---
  - de: im Freien
    pos: phrase
    ipa: "ɪm ˈfʁaɪ̯ən"
    cards: recognition
    en: out of doors, with no roof and no walls
    ru: под открытым небом, без крыши и стен
    uk: просто неба, без даху і стін
    example_de: Bei gutem Wetter essen wir im Freien.
