    example_en: The Atlantic Ocean lies between Europe and America.
    example_ru: Между Европой и Америкой лежит Атлантический океан.
    example_uk: Між Європою та Америкою лежить Атлантичний океан.
    note:
      en: 'Masculine with a regular plural, and the stress is on the first syllable, with -ze- and -an as separate syllables after it. A1 das Meer in the deck `wetter-natur` is the everyday word and covers this as well as a smaller sea, which is why a German family says ans Meer fahren and never "an den Ozean"; this word belongs to geography and to writing about scale, and its plain German equivalent is die Weltmeere. The third word in the family is die See with the feminine article, and the note on A1 See in `wetter-natur` already sorts it from der See, the lake.'
      ru: 'Мужской род, обычное множественное, ударение на первом слоге, а -ze- и -an идут за ним отдельными слогами. das Meer уровня A1 из колоды `wetter-natur` — обиходное слово, покрывающее и это, и небольшое море, поэтому немецкая семья говорит ans Meer fahren, а не «an den Ozean»; здешнее слово принадлежит географии и разговору о масштабе, а простое немецкое соответствие — die Weltmeere. Третье слово семьи — die See с женским артиклем, и примечание к See уровня A1 из `wetter-natur` уже отделяет его от der See, «озеро».'
      uk: 'Чоловічий рід, звичайна множина, наголос на першому складі, а -ze- і -an ідуть за ним окремими складами. das Meer рівня A1 з колоди `wetter-natur` — побутове слово, що покриває і це, і невелике море, тому німецька родина каже ans Meer fahren, а не «an den Ozean»; тутешнє слово належить географії та розмові про масштаб, а просте німецьке відповідництво — die Weltmeere. Третє слово родини — die See з жіночим артиклем, і примітка до See рівня A1 з `wetter-natur` уже відділяє його від der See, «озеро».'

  - de: Nordsee
