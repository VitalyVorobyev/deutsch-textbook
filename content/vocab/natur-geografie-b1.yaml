      en: 'A fixed chunk built on A2 frei in the deck `termine-zeit` turned into a noun, das Freie, with the dative ending after in. Only two forms of the set occur: im Freien for being there and ins Freie for going out, and nothing else in the paradigm is used. It is a shade more formal than A2 draußen in the deck `richtung-position-a2`, which is the everyday word, and it belongs to notices and descriptions: Die Feier findet im Freien statt. Do not confuse it with A1 die Freizeit in `alltag-a1-ergaenzung`, which is time and not place.'
      ru: 'Устойчивый оборот, построенный на frei уровня A2 из колоды `termine-zeit`, превращённом в существительное das Freie, с дательным окончанием после in. Из всей парадигмы употребляются только две формы: im Freien — «находясь там», ins Freie — «выходя туда», — и больше ничего. Оборот чуть официальнее, чем draußen уровня A2 из колоды `richtung-position-a2`, обиходное слово, и принадлежит объявлениям и описаниям: Die Feier findet im Freien statt. Не смешивайте с die Freizeit уровня A1 из `alltag-a1-ergaenzung` — это время, а не место.'
      uk: 'Усталений зворот, побудований на frei рівня A2 з колоди `termine-zeit`, перетвореному на іменник das Freie, з давальним закінченням після in. З усієї парадигми вживаються лише дві форми: im Freien — «перебуваючи там», ins Freie — «виходячи туди», — і більше нічого. Зворот дещо офіційніший, ніж draußen рівня A2 з колоди `richtung-position-a2`, побутове слово, і належить оголошенням та описам: Die Feier findet im Freien statt. Не змішуйте з die Freizeit рівня A1 з `alltag-a1-ergaenzung` — це час, а не місце.'

  - de: Katastrophe
    ipa: "kataˈstʁoːfə"
    pos: noun
    gender: f
    plural: "die Katastrophen"
    cards: recognition
    en: an event that destroys a great deal at once and is beyond anybody's control
    ru: событие, которое разом уничтожает очень многое и никем не может быть остановлено
    uk: подія, що заразом нищить дуже багато і якої ніхто не може спинити
    example_de: Das Hochwasser war eine Katastrophe für die ganze Region.
    example_en: The flood was a disaster for the whole region.
    example_ru: Наводнение стало катастрофой для всего региона.
    example_uk: Повінь стала катастрофою для всього регіону.
    note:
      en: 'Feminine, plural in -n, stress on the -stro-, and the th is a plain t. It is the largest word in its family: A2 der Unfall in the deck `verkehr-unterwegs-a2` involves a few people, B1 das Unglück in `gefuehle-reflexive-verben-b1` is serious but stays local, and this one takes in a whole region — die Naturkatastrophe, das Katastrophengebiet. In speech, though, it is thrown about far more lightly, about a ruined evening or a bad haircut. The adjective is katastrophal, and B1 die Gefahr in the deck `haushalt-notfall-b1` is what comes before one.'
      ru: 'Женский род, множественное на -n, ударение на -stro-, th читается как простое t. Это самое крупное слово в своём ряду: der Unfall уровня A2 из колоды `verkehr-unterwegs-a2` затрагивает нескольких человек, das Unglück уровня B1 из `gefuehle-reflexive-verben-b1` серьёзно, но остаётся местным, а здесь захвачен целый край — die Naturkatastrophe, das Katastrophengebiet. В разговоре, впрочем, слово бросают куда легче: о загубленном вечере или о неудачной стрижке. Прилагательное — katastrophal, а die Gefahr уровня B1 из колоды `haushalt-notfall-b1` — то, что бывает до неё.'
      uk: 'Жіночий рід, множина на -n, наголос на -stro-, th читається як просте t. Це найбільше слово у своєму ряду: der Unfall рівня A2 з колоди `verkehr-unterwegs-a2` зачіпає кількох людей, das Unglück рівня B1 з `gefuehle-reflexive-verben-b1` серйозне, але лишається місцевим, а тут захоплено цілий край — die Naturkatastrophe, das Katastrophengebiet. У розмові, втім, слово кидають куди легше: про зіпсований вечір або про невдалу стрижку. Прикметник — katastrophal, а die Gefahr рівня B1 з колоди `haushalt-notfall-b1` — те, що буває до неї.'
