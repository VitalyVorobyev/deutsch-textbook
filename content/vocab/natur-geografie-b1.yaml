      en: 'Feminine and with no plural, because the second half is die See in its feminine sea sense, sorted out in the note on A1 See in the deck `wetter-natur`. The article is part of the name and the frames use an: an die Nordsee fahren, an der Nordsee sein. Primary stress on Nord-. English translates it piece for piece as the North Sea, which the next entry does not allow. The flats the tide uncovers along this coast are das Wattenmeer.'
      ru: 'Женский род и без множественного, потому что вторая половина — die See в женском значении «море», разобранном в примечании к See уровня A1 из колоды `wetter-natur`. Артикль входит в имя, а конструкции берут an: an die Nordsee fahren, an der Nordsee sein. Главное ударение на Nord-. Английский переводит название по частям, the North Sea, — со следующей записью так не выйдет. Отмели, которые обнажает здесь отлив, — das Wattenmeer.'
      uk: 'Жіночий рід і без множини, бо друга половина — die See в жіночому значенні «море», розібраному в примітці до See рівня A1 з колоди `wetter-natur`. Артикль входить в ім’я, а конструкції беруть an: an die Nordsee fahren, an der Nordsee sein. Головний наголос на Nord-. Англійська перекладає назву частинами, the North Sea, — із наступним записом так не вийде. Мілини, які оголює тут відплив, — das Wattenmeer.'

  - de: Ostsee
