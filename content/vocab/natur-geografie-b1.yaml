    ru: стоять в цвету; а также, о городе или ремесле, быть на подъёме
    uk: стояти в цвіту; а також, про місто чи ремесло, бути на піднесенні
    example_de: Im Mai blühen die Bäume im ganzen Tal.
    example_en: In May the trees are in blossom throughout the valley.
    example_ru: В мае деревья цветут по всей долине.
    example_uk: У травні дерева квітнуть по всій долині.
    note:
      en: 'Weak, with haben in the Perfekt, and the ü is long while the h is written and not spoken. A1 die Blume in the deck `wetter-natur` is the noun behind it, and die Blüte is the single flower on a tree. Beside it B1 wachsen in the deck `verben-handlungen-b1-1` is about getting bigger over time; this verb names a stage that arrives and passes. The second sense is common in a B1 reading text about a region, Der Handel blühte, and blühend as an adjective means flourishing.'
      ru: 'Слабый, в Perfekt с haben, ü долгий, а h пишется, но не произносится. die Blume уровня A1 из колоды `wetter-natur` — существительное за ним, а die Blüte — отдельный цветок на дереве. Рядом wachsen уровня B1 из колоды `verben-handlungen-b1-1` говорит об увеличении со временем, а этот глагол называет стадию, которая наступает и проходит. Второе значение обычно для текста уровня B1 о крае: Der Handel blühte, — а прилагательное blühend значит «процветающий».'
      uk: 'Слабке, у Perfekt із haben, ü довгий, а h пишеться, але не вимовляється. die Blume рівня A1 з колоди `wetter-natur` — іменник за ним, а die Blüte — окрема квітка на дереві. Поряд wachsen рівня B1 з колоди `verben-handlungen-b1-1` говорить про збільшення з часом, а це дієслово називає стадію, яка настає і минає. Друге значення звичне для тексту рівня B1 про край: Der Handel blühte, — а прикметник blühend означає «квітучий».'

  - de: gießen
    ipa: "ˈgiːsn̩"
    pos: verb
    praesens_3sg: gießt
    partizip2: gegossen
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to pour water over plants; more widely, to pour a liquid from one vessel into another
    ru: поливать растения; шире — переливать жидкость из одной посуды в другую
    uk: поливати рослини; ширше — переливати рідину з одного посуду в інший
    example_de: Am Abend gießt sie die Blumen auf dem Balkon.
    example_en: In the evening she waters the flowers on the balcony.
    example_ru: Вечером она поливает цветы на балконе.
    example_uk: Увечері вона поливає квіти на балконі.
    note:
      en: 'Strong like fließen above and spelled by the same rule, gießen, goss, hat gegossen, but the auxiliary here is haben, because the verb takes an object: what is watered or poured stands in the accusative. A1 die Blume in the deck `wetter-natur` is the usual object, and a neighbour asked to look after a flat is asked Kannst du die Blumen gießen? Impersonally es gießt means it is pouring with rain, and the technical sense is casting metal, das Gießen.'
      ru: 'Сильный, как fließen выше, и пишется по тому же правилу: gießen, goss, hat gegossen, — но вспомогательный здесь haben, потому что глагол переходный: то, что поливают или переливают, стоит в винительном. die Blume уровня A1 из колоды `wetter-natur` — обычное дополнение, и соседа, которого просят присмотреть за квартирой, спрашивают Kannst du die Blumen gießen? Безлично es gießt значит «льёт как из ведра», а техническое значение — литьё металла, das Gießen.'
      uk: 'Сильне, як fließen вище, і пишеться за тим самим правилом: gießen, goss, hat gegossen, — але допоміжне тут haben, бо дієслово перехідне: те, що поливають або переливають, стоїть у знахідному. die Blume рівня A1 з колоди `wetter-natur` — звичайний додаток, а сусіда, якого просять доглянути квартиру, питають Kannst du die Blumen gießen? Безособово es gießt означає «ллє як із відра», а технічне значення — лиття металу, das Gießen.'

  - de: Ernte
    ipa: "ˈɛʁntə"
    pos: noun
    gender: f
    plural: "die Ernten"
    cards: recognition
    en: the gathering in of what a field has grown, and the amount that comes in
    ru: уборка выросшего на поле, а также то количество, которое собрали
    uk: збирання вирослого на полі, а також та кількість, яку зібрали
    example_de: Die Ernte war dieses Jahr sehr gut.
    example_en: The harvest was very good this year.
    example_ru: Урожай в этом году очень хороший.
    example_uk: Урожай цього року дуже добрий.
    note:
      en: 'Feminine, plural in -n, and it names both the work and its result, which is why the example can be about quality: eine gute Ernte, die Ernte einbringen. The verb is ernten, weak. B1 der Bauer in the deck `berufe-b1` does it, B1 die Landwirtschaft in `wirtschaft-handel-b1` is the sector around it, and B1 wachsen in `verben-handlungen-b1-1` is what has to happen first. Figuratively the verb travels further than the noun: Lob ernten, Kritik ernten.'
      ru: 'Женский род, множественное на -n; слово называет и работу, и её итог, — потому пример и может быть о качестве: eine gute Ernte, die Ernte einbringen. Глагол — ernten, слабый. der Bauer уровня B1 из колоды `berufe-b1` этим занят, die Landwirtschaft уровня B1 из `wirtschaft-handel-b1` — отрасль вокруг, а wachsen уровня B1 из `verben-handlungen-b1-1` — то, что должно случиться прежде. В переносном употреблении глагол идёт дальше существительного: Lob ernten, Kritik ernten.'
      uk: 'Жіночий рід, множина на -n; слово називає і роботу, і її підсумок, — тому приклад і може бути про якість: eine gute Ernte, die Ernte einbringen. Дієслово — ernten, слабке. der Bauer рівня B1 з колоди `berufe-b1` цим зайнятий, die Landwirtschaft рівня B1 з `wirtschaft-handel-b1` — галузь навколо, а wachsen рівня B1 з `verben-handlungen-b1-1` — те, що має статися раніше. У переносному вжитку дієслово йде далі за іменник: Lob ernten, Kritik ernten.'

  - de: reif
    ipa: "ˈʁaɪ̯f"
    pos: adj
    cards: recognition
    en: grown far enough to be picked and eaten; of a person, old and settled enough for something
    ru: доросший до того, чтобы его сняли и съели; о человеке — достаточно взрослый и зрелый для чего-либо
    uk: дорослий настільки, щоб його зняли і з’їли; про людину — достатньо дозрілий для чогось
    example_de: Die Äpfel sind noch nicht reif.
    example_en: The apples are not ripe yet.
    example_ru: Яблоки ещё не созрели.
    example_uk: Яблука ще не достигли.
    note:
      en: 'The plain adjective for fruit and grain, and it names the state die Ernte above is waiting for; the opposite is unreif, or grün in speech. Keep it away from B1 fertig in the deck `eigenschaften-bewertung-b1`, which says a job has been finished by somebody, while this word says a thing has come to its own point by itself. The second sense is about people and decisions: reif für eine Entscheidung, and eine reife Leistung is praise. A quite different word der Reif means the thin white frost on a cold morning.'
      ru: 'Простое прилагательное о плодах и зерне; оно называет то состояние, которого ждёт die Ernte выше. Противоположность — unreif, а в речи grün. Не смешивайте с fertig уровня B1 из колоды `eigenschaften-bewertung-b1`: то слово говорит, что работу кто-то довёл до конца, а это — что вещь сама дошла до своей поры. Второе значение о людях и решениях: reif für eine Entscheidung, — а eine reife Leistung звучит как похвала. Совсем другое слово der Reif значит «иней» на холодном утре.'
      uk: 'Простий прикметник про плоди й зерно; він називає той стан, якого чекає die Ernte вище. Протилежність — unreif, а в мовленні grün. Не змішуйте з fertig рівня B1 з колоди `eigenschaften-bewertung-b1`: те слово каже, що роботу хтось довів до кінця, а це — що річ сама дійшла своєї пори. Друге значення про людей і рішення: reif für eine Entscheidung, — а eine reife Leistung звучить як похвала. Зовсім інше слово der Reif означає «паморозь» холодного ранку.'

  # --- Himmel, Licht und Schatten ---
  - de: Mond
