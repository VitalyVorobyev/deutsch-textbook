      ru: 'Мужской род, обычное множественное, St- звучит как ʃt. Кроме неба слово несёт форму и оценку: ein Hotel mit vier Sternen, — и путеводитель по ресторанам тоже их присуждает. Сложные слова: der Sternenhimmel, das Sternzeichen — знак зодиака, — а для кинозвезды берут английское der Filmstar. На письме учтите, что Ostern уровня A2 из колоды `zeit-termine-a2` делит с этим словом четыре буквы и при этом совершенно другое.'
      uk: 'Чоловічий рід, звичайна множина, St- звучить як ʃt. Крім неба слово несе форму й оцінку: ein Hotel mit vier Sternen, — і путівник по ресторанах теж їх присуджує. Складні слова: der Sternenhimmel, das Sternzeichen — знак зодіаку, — а для кінозірки беруть англійське der Filmstar. На письмі зважте, що Ostern рівня A2 з колоди `zeit-termine-a2` ділить із цим словом чотири літери і при цьому цілком інше.'

  - de: Schatten
    ipa: "ˈʃatn̩"
    pos: noun
    gender: m
    plural: "die Schatten"
    cards: recognition
    en: the cooler darker place where something blocks the light, and the dark shape it throws
    ru: более тёмное и прохладное место, куда что-либо не пускает свет, а также отбрасываемая тёмная фигура
    uk: темніше й прохолодніше місце, куди щось не пускає світла, а також відкидана темна постать
    example_de: Im Sommer sitzen wir lieber im Schatten.
