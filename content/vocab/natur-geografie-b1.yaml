    note:
      en: 'Masculine with a regular plural, and the St- is spoken ʃt. Two senses run side by side: a countable piece you can lift, and the uncountable material, which takes no article at all in aus Stein gebaut. A rock too big to lift is der Felsen. A false friend to watch: the hard middle of a cherry is not a Stein in German but der Kern. Chunks: der Stein im Weg, and Mir fällt ein Stein vom Herzen for a great relief.'
      ru: 'Мужской род, обычное множественное, St- звучит как ʃt. Два значения идут рядом: счётный кусок, который можно поднять, и неисчисляемый материал, который в обороте aus Stein gebaut идёт вовсе без артикля. Скала, которую не поднять, — der Felsen. Ложный друг: твёрдая середина вишни по-немецки не Stein, а der Kern. Обороты: der Stein im Weg, а Mir fällt ein Stein vom Herzen — о большом облегчении.'
      uk: 'Чоловічий рід, звичайна множина, St- звучить як ʃt. Два значення йдуть поряд: злічуваний шмат, який можна підняти, і незлічуваний матеріал, який у звороті aus Stein gebaut іде взагалі без артикля. Скеля, якої не підняти, — der Felsen. Оманливий друг: тверда середина вишні німецькою не Stein, а der Kern. Звороти: der Stein im Weg, а Mir fällt ein Stein vom Herzen — про велике полегшення.'

  - de: Gras
