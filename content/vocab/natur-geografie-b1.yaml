    ru: идущий вверх или вниз под большим углом, так что двигаться по нему тяжело
    uk: що йде вгору або вниз під великим кутом, тож рухатися ним важко
    example_de: Der Weg zur Hütte ist ziemlich steil.
    example_en: The path up to the hut is quite steep.
    example_ru: Тропа к хижине довольно крутая.
    example_uk: Стежка до хатини досить крута.
    note:
      en: 'An adjective of slope, and it works in both directions: ein steiler Anstieg and ein steiler Abhang are one and the same gradient seen from either end. A2 hoch in the deck `eigenschaften-dinge-a2` measures how far up something reaches and says nothing about the angle, which is the distinction worth keeping. The compounds are der Steilhang and die Steilküste. A graph does the same thing in a report: Die Kurve steigt steil an.'
      ru: 'Прилагательное уклона, и работает оно в обе стороны: ein steiler Anstieg и ein steiler Abhang — один и тот же уклон, взятый с разных концов. hoch уровня A2 из колоды `eigenschaften-dinge-a2` мерит, насколько высоко что-то поднимается, и об угле не говорит ничего, — это и стоит различать. Сложные слова — der Steilhang и die Steilküste. В отчёте то же самое делает график: Die Kurve steigt steil an.'
      uk: 'Прикметник схилу, і працює він в обидва боки: ein steiler Anstieg і ein steiler Abhang — той самий ухил, узятий з різних кінців. hoch рівня A2 з колоди `eigenschaften-dinge-a2` міряє, як високо щось сягає, і про кут не каже нічого, — це й варто розрізняти. Складні слова — der Steilhang і die Steilküste. У звіті те саме робить графік: Die Kurve steigt steil an.'

  # --- Wasser, Küste und Ufer ---
  - de: Ozean
    ipa: "ˈoːtseaːn"
    pos: noun
    gender: m
    plural: "die Ozeane"
