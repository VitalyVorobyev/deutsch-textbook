    note:
      en: 'Neuter, and the plural takes both an umlaut and -er: das Tal, die Täler, the same pattern as das Land, die Länder. The a in the singular is long. It is the counterpart to der Berg, and the pair splits direction from position in the usual way: ins Tal hinuntergehen, im Tal wohnen. A town name ending in -tal always contains this word, and the fixed phrase über Berg und Tal means across country.'
      ru: 'Средний род, а множественное берёт и умлаут, и -er: das Tal, die Täler, — та же модель, что у das Land, die Länder. В единственном a долгое. Слово — пара к der Berg, и направление с местонахождением расходятся как обычно: ins Tal hinuntergehen, im Tal wohnen. Название города на -tal всегда содержит это слово, а устойчивое über Berg und Tal значит «по горам и долам».'
      uk: 'Середній рід, а множина бере і умлаут, і -er: das Tal, die Täler, — та сама модель, що в das Land, die Länder. В однині a довге. Слово є парою до der Berg, і напрямок із місцеперебуванням розходяться як звичайно: ins Tal hinuntergehen, im Tal wohnen. Назва міста на -tal завжди містить це слово, а усталене über Berg und Tal означає «горами й долами».'

  - de: steil
