    cards: recognition
    en: the body that circles the earth and lights the night sky
    ru: небесное тело, обращающееся вокруг Земли и освещающее ночное небо
    uk: небесне тіло, що обертається навколо Землі й освітлює нічне небо
    example_de: Heute Nacht sieht man den Mond sehr gut.
    example_en: The moon is very clearly visible tonight.
