# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the landscape half
# of data/goethe-b1-wortliste.txt: the four directions turned into adjectives, the
# shapes the ground takes between a valley and a range, the water at both ends of a
# river, what grows on the land and when it is ready, what stands in the night sky —
# and the one word for when all of it goes wrong at once.
# A1's `wetter-natur` owns the base of the field (Natur, Landschaft, Berg, Wald, Baum,
# Blume, Meer, See, Fluss, Himmel, Sonne, Luft, Klima), A2's `natur-tiere-a2` owns
# Welt, Pflanze and Rose, A2's `reisen-orte-a2` owns the four directions as nouns
# (Norden, Süden, Osten, Westen) plus Insel and Strand, B1's `tiere-wetter-b1` owns
# what the sky does (Sturm, Nebel, Hitze, Kälte, Temperatur), B1's `konsum-umwelt`
# owns Umwelt and Umweltschutz, B1's `gesellschaft-zusammenleben` owns Wiese and
# Fläche, B1's `wohnen-gebaeude-b1` owns Boden, B1's `berufe-b1` owns Bauer, and B1's
# `verben-handlungen-b1-1` owns wachsen. This deck is what those eight leave unnamed:
# the words a walking map, a harvest report and a geography page need between them.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read, never written: the learner's own sentence about a walk or the weather comes
# out of A1 and A2 words, and everything here is what the guidebook, the news item and
# the reading text say back at him.
id: natur-geografie-b1
title_de: "Natur & Geografie"
title_en: "Nature and geography"
title_ru: "Природа и география"
title_uk: "Природа і географія"
level: B1
entries:
  # --- Die vier Richtungen als Adjektiv ---
  - de: nördlich
    ipa: "ˈnœʁtlɪç"
    pos: adj
    cards: recognition
    en: lying towards the north, or coming from there
    ru: расположенный к северу или идущий оттуда
    uk: розташований на північ або що йде звідти
    example_de: Der Bahnhof liegt nördlich vom Zentrum.
    example_en: The station is north of the centre.
    example_ru: Вокзал находится к северу от центра.
    example_uk: Вокзал розташований на північ від центру.
    note:
      en: 'A2 der Norden in the deck `reisen-orte-a2` is the direction as a noun; this is the adjective made from it with -lich, and the o takes an umlaut on the way. Two frames matter and they differ in case: nördlich von plus the dative for a place seen from another, nördlich von Berlin, and bare nördlich plus the genitive in written and official German, nördlich der Stadt. As an attribute it takes ordinary endings, der nördliche Teil, die nördliche Grenze. All four of these adjectives work identically, so only this one carries the explanation; note only that nördlich and östlich add an umlaut their nouns do not have, südlich keeps the ü that Süden already has, and westlich changes nothing at all.'
      ru: 'der Norden уровня A2 из колоды `reisen-orte-a2` — направление как существительное; здесь прилагательное от него на -lich, и o по дороге получает умлаут. Важны две конструкции, и различаются они падежом: nördlich von с дательным — место, взятое относительно другого, nördlich von Berlin, — и голое nördlich с родительным в письменном и официальном немецком, nördlich der Stadt. В роли определения слово берёт обычные окончания: der nördliche Teil, die nördliche Grenze. Все четыре прилагательных устроены одинаково, поэтому объяснение несёт только это; заметьте лишь, что nördlich и östlich добавляют умлаут, которого нет у их существительных, südlich сохраняет ü, уже имеющийся в Süden, а westlich не меняет ничего.'
      uk: 'der Norden рівня A2 з колоди `reisen-orte-a2` — напрямок як іменник; тут прикметник від нього на -lich, і o дорогою дістає умлаут. Важать дві конструкції, і різняться вони відмінком: nördlich von з давальним — місце, узяте щодо іншого, nördlich von Berlin, — і голе nördlich з родовим у письмовій та офіційній німецькій, nördlich der Stadt. У ролі означення слово бере звичайні закінчення: der nördliche Teil, die nördliche Grenze. Усі чотири прикметники влаштовані однаково, тому пояснення несе лише цей; завважте тільки, що nördlich і östlich додають умлаут, якого немає в їхніх іменників, südlich зберігає ü, уже наявний у Süden, а westlich не змінює нічого.'

  - de: östlich
    ipa: "ˈœstlɪç"
    pos: adj
    cards: recognition
    en: lying towards the east, or coming from there
    ru: расположенный к востоку или идущий оттуда
    uk: розташований на схід або що йде звідти
    example_de: Östlich der Stadt beginnt ein großer Wald.
    example_en: A large forest begins to the east of the town.
    example_ru: К востоку от города начинается большой лес.
    example_uk: На схід від міста починається великий ліс.
    note:
      en: 'From A2 der Osten in the deck `reisen-orte-a2`, with the umlaut added; the two frames are the ones set out at nördlich above, and the example here shows the genitive one. In German history and politics the compounds carry weight of their own — Ostdeutschland, Osteuropa — but the adjective itself is neutral and geographical.'
      ru: 'От der Osten уровня A2 из колоды `reisen-orte-a2`, с добавленным умлаутом; обе конструкции описаны при nördlich выше, а здешний пример показывает родительный. В немецкой истории и политике сложные слова несут собственный вес — Ostdeutschland, Osteuropa, — но само прилагательное нейтрально и географично.'
      uk: 'Від der Osten рівня A2 з колоди `reisen-orte-a2`, з доданим умлаутом; обидві конструкції описано при nördlich вище, а тутешній приклад показує родовий. У німецькій історії та політиці складні слова несуть власну вагу — Ostdeutschland, Osteuropa, — але сам прикметник нейтральний і географічний.'

  - de: südlich
    ipa: "ˈzyːtlɪç"
    pos: adj
    cards: recognition
    en: lying towards the south, or coming from there
    ru: расположенный к югу или идущий оттуда
    uk: розташований на південь або що йде звідти
    example_de: Südlich von München wird die Landschaft hügelig.
    example_en: South of Munich the landscape becomes hilly.
    example_ru: К югу от Мюнхена местность становится холмистой.
    example_uk: На південь від Мюнхена місцевість стає горбистою.
    note:
      en: 'From A2 der Süden in the deck `reisen-orte-a2`, and here nothing changes in the stem, because the ü is already in the noun; the d is spoken as t before the -lich. The frames are the ones at nördlich above. Weather reports pair it with the compass compounds all day long: südwestlich, südöstlich, and der Südwind.'
      ru: 'От der Süden уровня A2 из колоды `reisen-orte-a2`, и здесь в основе ничего не меняется: ü уже есть в существительном; d перед -lich звучит как t. Конструкции те же, что при nördlich выше. Сводки погоды целыми днями сочетают слово с составными направлениями: südwestlich, südöstlich, der Südwind.'
      uk: 'Від der Süden рівня A2 з колоди `reisen-orte-a2`, і тут в основі нічого не змінюється: ü уже є в іменнику; d перед -lich звучить як t. Конструкції ті самі, що при nördlich вище. Зведення погоди цілими днями сполучають слово зі складеними напрямками: südwestlich, südöstlich, der Südwind.'

  - de: westlich
    ipa: "ˈvɛstlɪç"
    pos: adj
    cards: recognition
    en: lying towards the west, or coming from there
    ru: расположенный к западу или идущий оттуда
    uk: розташований на захід або що йде звідти
    example_de: Der Wind kommt heute aus westlicher Richtung.
    example_en: The wind is coming from a westerly direction today.
    example_ru: Ветер сегодня западного направления.
    example_uk: Вітер сьогодні західного напрямку.
    note:
      en: 'From A2 der Westen in the deck `reisen-orte-a2`, and the only one of the four whose stem is unchanged. The frames are the ones at nördlich above. Of a wind German prefers aus westlicher Richtung or der Westwind to "westlicher Wind", because a wind is named after where it comes from and not where it goes. A second, political sense — die westlichen Länder — is common in newspapers and has nothing to do with the compass.'
      ru: 'От der Westen уровня A2 из колоды `reisen-orte-a2` — единственное из четырёх, где основа не меняется. Конструкции те же, что при nördlich выше. О ветре немецкий предпочитает aus westlicher Richtung или der Westwind, а не «westlicher Wind», потому что ветер называют по тому, откуда он дует, а не куда. Второе, политическое значение — die westlichen Länder — обычно в газетах и к сторонам света отношения не имеет.'
      uk: 'Від der Westen рівня A2 з колоди `reisen-orte-a2` — єдиний із чотирьох, де основа не змінюється. Конструкції ті самі, що при nördlich вище. Про вітер німецька воліє aus westlicher Richtung або der Westwind, а не «westlicher Wind», бо вітер називають за тим, звідки він віє, а не куди. Друге, політичне значення — die westlichen Länder — звичне в газетах і до сторін світу стосунку не має.'

  # --- Land, Berg und Tal ---
  - de: Erde
    ipa: "ˈeːɐ̯də"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the planet we live on; also the loose brown material a plant grows in
    ru: планета, на которой мы живём; а также рыхлая бурая масса, в которой растут растения
    uk: планета, на якій ми живемо; а також пухка бура маса, у якій ростуть рослини
    example_de: Die Erde dreht sich um die Sonne.
    example_en: The earth goes round the sun.
    example_ru: Земля обращается вокруг Солнца.
    example_uk: Земля обертається навколо Сонця.
    note:
      en: 'Feminine, and in neither sense does it take a plural in ordinary use. As the planet it always keeps its article, where English can leave the name bare: auf der Erde, unter der Erde. The second sense is the soil in a pot or a bed, which is why a garden centre sells Blumenerde by the sack, and B1 der Boden in the deck `wohnen-gebaeude-b1` is the ground you stand on rather than the material. A2 die Welt in `natur-tiere-a2` is the world as people and their affairs — Die Welt hat sich verändert is about us, Die Erde ist rund is about the planet.'
      ru: 'Женский род, и ни в одном из значений слово в обиходе не имеет множественного. Как планета оно всегда сохраняет артикль, тогда как английский может обойтись без него: auf der Erde, unter der Erde. Второе значение — почва в горшке или на грядке, поэтому садовый центр продаёт Blumenerde мешками, а der Boden уровня B1 из колоды `wohnen-gebaeude-b1` — это поверхность, по которой ходят, а не материал. die Welt уровня A2 из `natur-tiere-a2` — мир как люди и их дела: Die Welt hat sich verändert — о нас, Die Erde ist rund — о планете.'
      uk: 'Жіночий рід, і в жодному зі значень слово в побуті не має множини. Як планета воно завжди зберігає артикль, тоді як англійська може обійтися без нього: auf der Erde, unter der Erde. Друге значення — ґрунт у горщику чи на грядці, тому садовий центр продає Blumenerde мішками, а der Boden рівня B1 з колоди `wohnen-gebaeude-b1` — це поверхня, якою ходять, а не матеріал. die Welt рівня A2 з `natur-tiere-a2` — світ як люди та їхні справи: Die Welt hat sich verändert — про нас, Die Erde ist rund — про планету.'

  - de: Gebiet
    ipa: "gəˈbiːt"
    pos: noun
    gender: n
    plural: "die Gebiete"
    cards: recognition
    en: a stretch of land marked off for some purpose; also a field of knowledge or work
    ru: участок земли, выделенный для какой-то цели; а также область знаний или работы
    uk: ділянка землі, виділена задля певної мети; а також галузь знань або роботи
    example_de: In diesem Gebiet darf man nicht bauen.
    example_en: Building is not allowed in this area.
    example_ru: На этом участке строить нельзя.
    example_uk: На цій ділянці будувати не можна.
    note:
      en: 'Neuter with a regular plural, and the Ge- prefix that builds it is the same one behind das Gebirge below. It always implies a boundary somebody drew, which is why the compounds are all administrative: das Naturschutzgebiet, das Wohngebiet, das Sperrgebiet. Beside it B1 die Gegend in the deck `leben-veraendern` needs no line at all, B1 die Zone in `reisen-laender-b1` adds a rule that holds inside the line, and die Region below is larger and held together by what it has in common. The second sense is abstract and very common: Auf diesem Gebiet kenne ich mich nicht aus.'
      ru: 'Средний род, обычное множественное, а приставка Ge-, которой слово построено, та же, что и в das Gebirge ниже. Оно всегда предполагает проведённую кем-то границу, поэтому и сложные слова сплошь административные: das Naturschutzgebiet, das Wohngebiet, das Sperrgebiet. Рядом die Gegend уровня B1 из колоды `leben-veraendern` вовсе не требует черты, die Zone уровня B1 из `reisen-laender-b1` добавляет правило, действующее внутри черты, а die Region ниже крупнее и держится тем, что у неё общего. Второе значение отвлечённое и очень употребительное: Auf diesem Gebiet kenne ich mich nicht aus.'
      uk: 'Середній рід, звичайна множина, а префікс Ge-, яким слово побудовано, той самий, що й у das Gebirge нижче. Воно завжди передбачає проведену кимось межу, тому й складні слова суцільно адміністративні: das Naturschutzgebiet, das Wohngebiet, das Sperrgebiet. Поряд die Gegend рівня B1 з колоди `leben-veraendern` зовсім не потребує риски, die Zone рівня B1 з `reisen-laender-b1` додає правило, чинне всередині риски, а die Region нижче більша і тримається тим, що в неї спільного. Друге значення відвернене і дуже вживане: Auf diesem Gebiet kenne ich mich nicht aus.'

  - de: Region
    ipa: "ʁeˈgi̯oːn"
    pos: noun
    gender: f
    plural: "die Regionen"
    cards: recognition
    en: a large area held together by its landscape, its economy or its way of life
    ru: крупная территория, которую связывает воедино ландшафт, хозяйство или уклад жизни
    uk: велика територія, яку єднає ландшафт, господарство або уклад життя
    example_de: In dieser Region wird viel Wein angebaut.
    example_en: A lot of wine is grown in this region.
    example_ru: В этом регионе выращивают много винограда для вина.
    example_uk: У цьому регіоні вирощують багато винограду на вино.
    note:
      en: 'Feminine, plural in -en, and the -gio- is one syllable, gi̯oːn, not gi-on. It is bigger than das Gebiet above and is not drawn up by an office: what holds it together is a landscape, an economy or a dialect, so its edges are soft. B1 regional in the deck `konsum-umwelt` is the adjective, and it is what a supermarket sign means by regionale Produkte. In official German the administrative unit is das Bundesland, in the deck `politik-staat-b1`, and a Region is not one.'
      ru: 'Женский род, множественное на -en, а -gio- — один слог, gi̯oːn, а не gi-on. Слово крупнее, чем das Gebiet выше, и не вычерчивается ведомством: держат его вместе ландшафт, хозяйство или диалект, поэтому края у него мягкие. regional уровня B1 из колоды `konsum-umwelt` — прилагательное к нему, и именно его имеет в виду вывеска в супермаркете: regionale Produkte. В официальном немецком административная единица — das Bundesland из колоды `politik-staat-b1`, а Region ею не является.'
      uk: 'Жіночий рід, множина на -en, а -gio- — один склад, gi̯oːn, а не gi-on. Слово більше, ніж das Gebiet вище, і не викреслюється відомством: тримають його разом ландшафт, господарство або говірка, тому краї в нього м’які. regional рівня B1 з колоди `konsum-umwelt` — прикметник до нього, і саме його має на увазі вивіска в супермаркеті: regionale Produkte. В офіційній німецькій адміністративна одиниця — das Bundesland з колоди `politik-staat-b1`, а Region нею не є.'

  - de: Gebirge
    ipa: "gəˈbɪʁgə"
    pos: noun
    gender: n
    plural: "die Gebirge"
    cards: recognition
    en: a whole chain of mountains taken as one thing
    ru: целая горная цепь, взятая как одно целое
    uk: ціле гірське пасмо, узяте як одне ціле
    example_de: Im Sommer wandern wir gern im Gebirge.
    example_en: In the summer we like walking in the mountains.
    example_ru: Летом мы любим ходить в горы.
    example_uk: Улітку ми любимо ходити в гори.
    note:
      en: 'Neuter, singular and plural spelled alike, and the i is short. The Ge- here is the collecting prefix: as this word is many of A1 der Berg in the deck `wetter-natur`, so das Gebüsch is many bushes. A single peak stays der Berg, and the two German kinds are das Mittelgebirge for the older, lower ranges and das Hochgebirge for the Alps. Direction and position split as usual: ins Gebirge fahren, im Gebirge sein.'
      ru: 'Средний род, единственное и множественное пишутся одинаково, i краткое. Ge- здесь собирательная приставка: как это слово — множество того, что называет der Berg уровня A1 из колоды `wetter-natur`, так das Gebüsch — множество кустов. Отдельная вершина остаётся der Berg, а два немецких типа — das Mittelgebirge для старых невысоких хребтов и das Hochgebirge для Альп. Направление и местонахождение расходятся как обычно: ins Gebirge fahren, im Gebirge sein.'
      uk: 'Середній рід, однина і множина пишуться однаково, i коротке. Ge- тут збірний префікс: як це слово є множиною того, що зве der Berg рівня A1 з колоди `wetter-natur`, так das Gebüsch є множиною кущів. Окрема вершина лишається der Berg, а два німецькі типи — das Mittelgebirge для давніх невисоких пасом і das Hochgebirge для Альп. Напрямок і місцеперебування розходяться як звичайно: ins Gebirge fahren, im Gebirge sein.'

  - de: Hügel
    ipa: "ˈhyːgl̩"
    pos: noun
    gender: m
    plural: "die Hügel"
    cards: recognition
    en: a rounded rise in the ground, low enough to walk up without effort
    ru: округлая возвышенность, достаточно низкая, чтобы подняться без усилий
    uk: округле підвищення, досить низьке, щоб зійти без зусиль
    example_de: Hinter dem Dorf beginnen die ersten Hügel.
    example_en: The first hills begin behind the village.
    example_ru: За деревней начинаются первые холмы.
    example_uk: За селом починаються перші пагорби.
    note:
      en: 'Masculine, singular and plural spelled alike, and the ü is long. What separates it from A1 der Berg in the deck `wetter-natur` is shape rather than any fixed height: a Hügel is rounded and low and you walk up it in a few minutes, a Berg is steep enough to make a day of it. The adjective is hügelig, for country full of them, and das Hügelland is the name for such a landscape. Chunks: auf einem Hügel liegen, über die Hügel wandern.'
      ru: 'Мужской род, единственное и множественное пишутся одинаково, ü долгий. От der Berg уровня A1 из колоды `wetter-natur` слово отделяет форма, а не какая-то заданная высота: Hügel округлый и низкий, на него поднимаются за несколько минут, а Berg достаточно крут, чтобы занять целый день. Прилагательное — hügelig, о местности, где их много, а сама такая местность — das Hügelland. Обороты: auf einem Hügel liegen, über die Hügel wandern.'
      uk: 'Чоловічий рід, однина і множина пишуться однаково, ü довгий. Від der Berg рівня A1 з колоди `wetter-natur` слово відділяє форма, а не якась задана висота: Hügel округлий і низький, на нього сходять за кілька хвилин, а Berg досить крутий, щоб забрати цілий день. Прикметник — hügelig, про місцевість, де їх багато, а сама така місцевість — das Hügelland. Звороти: auf einem Hügel liegen, über die Hügel wandern.'

  - de: Tal
