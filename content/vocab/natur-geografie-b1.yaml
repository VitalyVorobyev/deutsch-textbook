      en: 'Feminine and without a plural, built like die Nordsee above and taking the same frames: an die Ostsee fahren, an der Ostsee sein. This is where the pair stops being translatable piece by piece — English calls it the Baltic Sea and never the "East Sea", so the name has to be learned as a whole. Schleswig-Holstein is the only German Land that touches both seas, which is why a text about it can name them in one sentence.'
      ru: 'Женский род и без множественного, устроено как die Nordsee выше и берёт те же конструкции: an die Ostsee fahren, an der Ostsee sein. Здесь пара и перестаёт переводиться по частям: по-английски это the Baltic Sea, а не «East Sea», так что имя приходится запоминать целиком. Шлезвиг-Гольштейн — единственная немецкая земля, выходящая к обоим морям, поэтому текст о ней может назвать их в одном предложении.'
      uk: 'Жіночий рід і без множини, влаштовано як die Nordsee вище і бере ті самі конструкції: an die Ostsee fahren, an der Ostsee sein. Тут пара й перестає перекладатися частинами: англійською це the Baltic Sea, а не «East Sea», тож ім’я доводиться запам’ятовувати цілком. Шлезвіг-Гольштейн — єдина німецька земля, що виходить до обох морів, тому текст про неї може назвати їх в одному реченні.'

