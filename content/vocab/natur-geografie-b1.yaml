      ru: 'Средний род, единственное и множественное пишутся одинаково, u долгое. Слово принадлежит пресной воде: у реки и у озера есть Ufer, у моря — die Küste выше, а песок, с которого заходят в воду, — der Strand уровня A2 из колоды `reisen-orte-a2`. У реки их два, и называют их с точки зрения смотрящего вниз по течению: das linke Ufer и das rechte Ufer. Обороты: am Ufer entlang, ans Ufer schwimmen, а über die Ufer treten — о разливе.'
      uk: 'Середній рід, однина і множина пишуться однаково, u довге. Слово належить прісній воді: у річки та в озера є Ufer, у моря — die Küste вище, а пісок, з якого заходять у воду, — der Strand рівня A2 з колоди `reisen-orte-a2`. У річки їх два, і називають їх з погляду того, хто дивиться за течією: das linke Ufer і das rechte Ufer. Звороти: am Ufer entlang, ans Ufer schwimmen, а über die Ufer treten — про розлив.'

  - de: fließen
    ipa: "ˈfliːsn̩"
    pos: verb
    praesens_3sg: fließt
    partizip2: geflossen
    aux: sein
    cards: recognition
    en: to move along steadily and without stopping, as water does
    ru: двигаться ровно и без остановки, как это делает вода
    uk: рухатися рівно і без упину, як це робить вода
    example_de: Der Fluss fließt hier langsam nach Norden.
    example_en: The river flows slowly northwards here.
    example_ru: Здесь река медленно течёт на север.
    example_uk: Тут річка повільно тече на північ.
    note:
      en: 'A strong verb with three stems, fließen, floss, ist geflossen, and the Perfekt takes sein because the verb describes movement from one place to another. The spelling follows the vowel: fließen keeps the ß after a long i, while floss and geflossen take ss after a short o. A1 der Fluss in the deck `wetter-natur` is the noun beside it, with the same short vowel and the same ss. B1 fließend in the deck `sprechen-lernen-b1`, said of a language, is this picture applied to speech. Electricity and traffic flow too: Der Strom fließt.'
      ru: 'Сильный глагол с тремя основами: fließen, floss, ist geflossen, — а Perfekt берёт sein, потому что описано перемещение из одного места в другое. Написание следует за гласным: fließen сохраняет ß после долгого i, а floss и geflossen берут ss после краткого o. der Fluss уровня A1 из колоды `wetter-natur` — существительное рядом, с тем же кратким гласным и тем же ss. fließend уровня B1 из колоды `sprechen-lernen-b1`, о языке, — та же картина, приложенная к речи. Текут и электричество, и поток машин: Der Strom fließt.'
      uk: 'Сильне дієслово з трьома основами: fließen, floss, ist geflossen, — а Perfekt бере sein, бо описано переміщення з одного місця в інше. Написання йде за голосним: fließen зберігає ß після довгого i, а floss і geflossen беруть ss після короткого o. der Fluss рівня A1 з колоди `wetter-natur` — іменник поряд, із тим самим коротким голосним і тим самим ss. fließend рівня B1 з колоди `sprechen-lernen-b1`, про мову, — та сама картина, прикладена до мовлення. Течуть і електрика, і потік машин: Der Strom fließt.'

