    ru: низкие зелёные растения, которыми покрыт газон или луг
    uk: низькі зелені рослини, якими вкрито газон або луку
    example_de: Nach dem Regen war das Gras noch nass.
    example_en: The grass was still wet after the rain.
    example_ru: После дождя трава была ещё мокрой.
    example_uk: Після дощу трава була ще мокра.
    note:
      en: 'Neuter, and the plural takes an umlaut and -er: das Gras, die Gräser — but it means the several kinds of grass, not several blades, which are die Halme. The a is long and the final s is voiceless. B1 die Wiese in the deck `gesellschaft-zusammenleben` is the field it covers, and A2 die Pflanze in `natur-tiere-a2` is the class it belongs to. Chunks: im Gras liegen, das Gras mähen, and über etwas Gras wachsen lassen for letting a matter be quietly forgotten.'
      ru: 'Средний род, а множественное берёт умлаут и -er: das Gras, die Gräser, — но значит оно «виды трав», а не отдельные стебли: те называются die Halme. A долгое, конечное s глухое. die Wiese уровня B1 из колоды `gesellschaft-zusammenleben` — поле, которое трава покрывает, а die Pflanze уровня A2 из `natur-tiere-a2` — класс, к которому она относится. Обороты: im Gras liegen, das Gras mähen, а über etwas Gras wachsen lassen значит «дать делу тихо забыться».'
      uk: 'Середній рід, а множина бере умлаут і -er: das Gras, die Gräser, — але означає вона «види трав», а не окремі стебла: ті звуться die Halme. A довге, кінцеве s глухе. die Wiese рівня B1 з колоди `gesellschaft-zusammenleben` — поле, яке трава вкриває, а die Pflanze рівня A2 з `natur-tiere-a2` — клас, до якого вона належить. Звороти: im Gras liegen, das Gras mähen, а über etwas Gras wachsen lassen означає «дати справі тихо забутися».'

  - de: blühen
