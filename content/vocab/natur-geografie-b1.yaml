    example_uk: Сьогодні вночі місяць видно дуже добре.
    note:
      en: 'Masculine, and the final d is spoken as t; the o is long. German keeps the article where English can drop it: Der Mond scheint. The plural die Monde is for the moons of other planets, so a B1 text about our own uses the singular throughout. The word is visibly related to A1 der Monat in the deck `alltag-zeit`, and for a good reason, since the month was once counted by it. Chunks: bei Vollmond, der Halbmond, and hinter dem Mond leben for being hopelessly out of touch.'
      ru: 'Мужской род, конечное d звучит как t, o долгое. Немецкий сохраняет артикль там, где английский может обойтись: Der Mond scheint. Множественное die Monde — о спутниках других планет, поэтому текст уровня B1 о нашем обходится единственным. Слово явно родственно der Monat уровня A1 из колоды `alltag-zeit`, и не случайно: месяц когда-то считали по нему. Обороты: bei Vollmond, der Halbmond, а hinter dem Mond leben значит «безнадёжно отстать от жизни».'
      uk: 'Чоловічий рід, кінцеве d звучить як t, o довге. Німецька зберігає артикль там, де англійська може обійтися: Der Mond scheint. Множина die Monde — про супутники інших планет, тому текст рівня B1 про наш обходиться одниною. Слово явно споріднене з der Monat рівня A1 з колоди `alltag-zeit`, і не випадково: місяць колись лічили за ним. Звороти: bei Vollmond, der Halbmond, а hinter dem Mond leben означає «безнадійно відстати від життя».'

