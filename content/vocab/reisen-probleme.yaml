id: reisen-probleme
title_de: "Reisen & Probleme"
title_en: "Travel & problems"
title_ru: "Путешествия и проблемы"
title_uk: "Подорожі та проблеми"
level: B1
entries:
  - de: "Verbindung"
    ipa: "fɛɐ̯ˈbɪndʊŋ"
    pos: noun
    gender: f
    plural: "die Verbindungen"
    en: "connection (a train route, a phone line)"
    en_compact: "connection"
    ru: "сообщение, стыковка (транспорт); связь"
    uk: "сполучення (транспорт); зв'язок"
    example_de: "Die nächste Verbindung nach Hamburg geht erst in zwei Stunden."
    example_en: "The next connection to Hamburg is not for another two hours."
    example_ru: "Ближайший вариант до Гамбурга — только через два часа."
    example_uk: "Найближчий варіант до Гамбурга — лише через дві години."
    note:
      en: "In the app and at the counter: a route with its changes. Also the phone line (die Verbindung ist schlecht) and staying in touch: in Verbindung bleiben."
      ru: "В приложении и у окошка: маршрут со всеми пересадками. Также телефонная связь (die Verbindung ist schlecht) и контакт: in Verbindung bleiben."
      uk: "У застосунку та біля віконця: маршрут з усіма пересадками. Також телефонний зв'язок (die Verbindung ist schlecht) і контакт: in Verbindung bleiben."

  - de: "Streik"
    ipa: "ˈʃtʁaɪ̯k"
    pos: noun
    gender: m
    plural: "die Streiks"
    en: "strike (of workers)"
    ru: "забастовка"
    uk: "страйк"
    example_de: "Wegen des Streiks fahren heute nur wenige Züge."
    example_en: "Because of the strike only a few trains are running today."
    example_ru: "Из-за забастовки сегодня ходят лишь немногие поезда."
    example_uk: "Через страйк сьогодні ходять лише деякі поїзди."
    note:
      en: "wegen des Streiks — the announcement formula of a German travel day. The verb is streiken."
      ru: "wegen des Streiks — формула объявлений в день, когда бастуют железные дороги. Глагол — streiken."
      uk: "wegen des Streiks — формула оголошень у день, коли страйкують залізниці. Дієслово — streiken."

  - de: "Übernachtung"
    ipa: "yːbɐˈnaxtʊŋ"
    pos: noun
    gender: f
    plural: "die Übernachtungen"
    en: "overnight stay"
    ru: "ночёвка, ночь в гостинице"
    uk: "ночівля"
    example_de: "Eine Übernachtung mit Frühstück kostet neunzig Euro."
    example_en: "An overnight stay with breakfast costs ninety euros."
    example_ru: "Ночь с завтраком стоит девяносто евро."
    example_uk: "Ніч зі сніданком коштує дев'яносто євро."
    note:
      en: "The unit hotels count in: Übernachtung mit Frühstück. The verb übernachten — to spend the night — hides inside."
      ru: "Единица, которой считают отели: Übernachtung mit Frühstück. Внутри прячется глагол übernachten — «переночевать»."
      uk: "Одиниця, якою рахують готелі: Übernachtung mit Frühstück. Усередині ховається дієслово übernachten — «переночувати»."

  - de: "Ersatz"
    ipa: "ɛɐ̯ˈzats"
    pos: noun
    gender: m
    plural: "—"
    en: "replacement, substitute"
    ru: "замена"
    uk: "заміна"
    example_de: "Als Ersatz für den Zug fahren heute Busse."
    example_en: "Buses are running today as a replacement for the train."
    example_ru: "Вместо поезда сегодня в качестве замены ходят автобусы."
    example_uk: "Замість поїзда сьогодні як заміна ходять автобуси."
    note:
      en: "als Ersatz für + Akk — the frame; on rail notices as der Ersatzverkehr, the replacement bus service."
      ru: "als Ersatz für + Akk — рамка; в железнодорожных объявлениях — der Ersatzverkehr, замена поезда автобусом."
      uk: "als Ersatz für + Akk — рамка; у залізничних оголошеннях — der Ersatzverkehr, заміна поїзда автобусом."

  - de: "erwarten"
    ipa: "ɛɐ̯ˈvaʁtn̩"
    pos: verb
    praesens_3sg: "erwartet"
    partizip2: "erwartet"
    aux: haben
    valence: "+ Akk"
    en: "to expect"
    ru: "ожидать"
    uk: "очікувати"
    example_de: "Ich erwarte Ihre Antwort bis Ende der Woche."
    example_en: "I expect your reply by the end of the week."
    example_ru: "Я ожидаю вашего ответа до конца недели."
    example_uk: "Я очікую вашої відповіді до кінця тижня."
    note:
      en: "Not warten auf: erwarten is counting on something coming, not standing and waiting. The firm closing line of every complaint letter."
      ru: "Не warten auf: erwarten — рассчитывать, что нечто придёт, а не стоять и ждать. Твёрдая финальная строка любой письменной жалобы."
      uk: "Не warten auf: erwarten — розраховувати, що щось прийде, а не стояти й чекати. Тверда фінальна фраза будь-якої письмової скарги."

  - de: "enttäuschen"
    ipa: "ɛntˈtɔʏ̯ʃn̩"
    pos: verb
    praesens_3sg: "enttäuscht"
    partizip2: "enttäuscht"
    aux: haben
    valence: "+ Akk"
    en: "to disappoint"
    ru: "разочаровывать"
    uk: "розчаровувати"
    example_de: "Das Hotel hat uns sehr enttäuscht."
    example_en: "The hotel disappointed us badly."
    example_ru: "Отель нас сильно разочаровал."
    example_uk: "Готель нас сильно розчарував."
    note:
      en: "Mostly heard as enttäuscht sein von + Dat — to be disappointed by. The noun is die Enttäuschung."
      ru: "Чаще всего звучит как enttäuscht sein von + Dat — «быть разочарованным». Существительное — die Enttäuschung."
      uk: "Найчастіше звучить як enttäuscht sein von + Dat — «бути розчарованим». Іменник — die Enttäuschung."

  - de: "wenden"
    ipa: "ˈvɛndn̩"
    pos: verb
    praesens_3sg: "wendet sich"
    partizip2: "sich gewandt"
    aux: haben
    valence: "sich + Akk; an + Akk"
    accept: ["sich wenden"]
    en: "to turn (to someone with a problem)"
    en_compact: "to turn to"
    ru: "обращаться (к кому-либо с проблемой)"
    uk: "звертатися (до когось із проблемою)"
    example_de: "Mit Fragen wenden Sie sich bitte an das Personal."
    example_en: "With questions, please turn to the staff."
    example_ru: "С вопросами, пожалуйста, обращайтесь к персоналу."
    example_uk: "З питаннями, будь ласка, звертайтеся до персоналу."
    note:
      en: "sich wenden an + Akk — the formal counterpart of simply asking; notices and letters use it. Perfekt: hat sich gewandt."
      ru: "sich wenden an + Akk — официальный собрат простого «спросить»; живёт в объявлениях и письмах. Perfekt: hat sich gewandt."
      uk: "sich wenden an + Akk — офіційний брат простого «спитати»; живе в оголошеннях і листах. Perfekt: hat sich gewandt."

  - de: "reagieren"
    ipa: "ʁeaˈgiːʁən"
    pos: verb
    praesens_3sg: "reagiert"
    partizip2: "reagiert"
    aux: haben
    valence: "auf + Akk"
    en: "to react, to respond"
    ru: "реагировать"
    uk: "реагувати"
    example_de: "Auf meine Beschwerde hat niemand reagiert."
    example_en: "Nobody responded to my complaint."
    example_ru: "На мою жалобу никто не отреагировал."
    example_uk: "На мою скаргу ніхто не відреагував."
    note:
      en: "-ieren verb, so no ge-: hat reagiert. What you react to takes auf + Akk."
      ru: "Глагол на -ieren, поэтому без ge-: hat reagiert. То, на что реагируют, вводит auf + Akk."
      uk: "Дієслово на -ieren, тому без ge-: hat reagiert. Те, на що реагують, вводить auf + Akk."

  - de: "Bestätigung"
    ipa: "bəˈʃtɛːtɪgʊŋ"
    pos: noun
    gender: f
    plural: "die Bestätigungen"
    en: "confirmation"
    ru: "подтверждение"
    uk: "підтвердження"
    example_de: "Ohne Bestätigung bekommen Sie das Zimmer nicht."
    example_en: "Without a confirmation you will not get the room."
    example_ru: "Без подтверждения номер вам не дадут."
    example_uk: "Без підтвердження номер вам не дадуть."
    note:
      en: "From bestätigen. The one to keep is die Buchungsbestätigung per E-Mail — your evidence when the desk says the room is gone."
      ru: "От bestätigen. Хранить стоит die Buchungsbestätigung per E-Mail — ваш довод, когда на стойке говорят, что номера нет."
      uk: "Від bestätigen. Зберігати варто die Buchungsbestätigung per E-Mail — ваш доказ, коли на стійці кажуть, що номера немає."

  - de: "ärgerlich"
    ipa: "ˈɛʁgɐlɪç"
    pos: adj
    en: "annoying; annoyed"
    ru: "досадный; раздосадованный"
    uk: "прикрий; роздратований"
    example_de: "So eine Verspätung ist wirklich ärgerlich."
    example_en: "A delay like that is really annoying."
    example_ru: "Такое опоздание — действительно досадно."
    example_uk: "Таке запізнення — справді прикро."
    note:
      en: "Situations are ärgerlich; the feeling itself you know from A2 as sich ärgern über + Akk."
      ru: "Ситуации бывают ärgerlich; само чувство знакомо с A2 — sich ärgern über + Akk."
      uk: "Ситуації бувають ärgerlich; саме почуття знайоме з A2 — sich ärgern über + Akk."

  - de: "unterwegs"
    ipa: "ʊntɐˈveːks"
    pos: adv
    en: "on the way, travelling"
    ru: "в пути, в дороге"
    uk: "у дорозі"
    example_de: "Wir waren den ganzen Tag unterwegs."
    example_en: "We were on the road all day."
    example_ru: "Мы были в дороге весь день."
    example_uk: "Ми були в дорозі весь день."
    note:
      en: "unterwegs sein — the state of this whole unit; the destination joins with nach: unterwegs nach Hamburg."
      ru: "unterwegs sein — состояние всей этой главы; пункт назначения присоединяет nach: unterwegs nach Hamburg."
      uk: "unterwegs sein — стан усього цього розділу; пункт призначення приєднує nach: unterwegs nach Hamburg."

  - de: "Betrag"
    ipa: "bəˈtʁaːk"
    pos: noun
    gender: m
    plural: "die Beträge"
    en: "amount, sum (of money)"
    en_compact: "amount, sum"
    ru: "сумма (денег)"
    uk: "сума (грошей)"
    example_de: "Bitte ersetzen Sie mir einen Teil des Betrags."
    example_en: "Please reimburse me part of the amount."
    example_ru: "Пожалуйста, возместите мне часть суммы."
    example_uk: "Будь ласка, відшкодуйте мені частину суми."
    note:
      en: "The word of receipts and letters — der volle Betrag, ein Betrag von 90 Euro; everyday speech just says Geld."
      ru: "Слово чеков и писем — der volle Betrag, ein Betrag von 90 Euro; в быту говорят просто Geld."
      uk: "Слово чеків і листів — der volle Betrag, ein Betrag von 90 Euro; у побуті кажуть просто Geld."

  - de: "Aufenthalt"
    ipa: "ˈaʊ̯fʔɛntˌhalt"
    pos: noun
    gender: m
    plural: "die Aufenthalte"
    en: "stay; stopover"
    ru: "пребывание; стоянка (поезда)"
    uk: "перебування; зупинка (поїзда)"
    example_de: "Der Zug hat in Hannover zehn Minuten Aufenthalt."
    example_en: "The train has a ten-minute stop in Hannover."
    example_ru: "У поезда в Ганновере десять минут стоянки."
    example_uk: "У поїзда в Ганновері десять хвилин зупинки."
    note:
      en: "One word for both ends of the trip: the hotel stay (während des Aufenthalts) and the train's scheduled stop."
      ru: "Одно слово для обоих концов поездки: проживание в отеле (während des Aufenthalts) и стоянка поезда по расписанию."
      uk: "Одне слово для обох кінців подорожі: проживання в готелі (während des Aufenthalts) і зупинка поїзда за розкладом."

  - de: "ersetzen"
    ipa: "ɛɐ̯ˈzɛtsn̩"
    pos: verb
    praesens_3sg: "ersetzt"
    partizip2: "ersetzt"
    aux: haben
    valence: "+ Dat + Akk"
    en: "to replace; to reimburse"
    ru: "заменять; возмещать"
    uk: "замінювати; відшкодовувати"
    example_de: "Das Hotel ersetzt mir die Kosten für die erste Nacht."
    example_en: "The hotel is reimbursing me the costs of the first night."
    example_ru: "Отель возмещает мне расходы за первую ночь."
    example_uk: "Готель відшкодовує мені витрати за першу ніч."
    note:
      en: "jemandem etwas ersetzen — reimburse someone something; without the Dativ it is plain replacement: Der Bus ersetzt den Zug. The noun is der Ersatz."
      ru: "jemandem etwas ersetzen — «возместить кому-то что-то»; без Dativ это простая замена: Der Bus ersetzt den Zug. Существительное — der Ersatz."
      uk: "jemandem etwas ersetzen — «відшкодувати комусь щось»; без Dativ це проста заміна: Der Bus ersetzt den Zug. Іменник — der Ersatz."

  - de: "Stau"
    ipa: "ˈʃtaʊ̯"
    pos: noun
    gender: m
    plural: "die Staus"
    en: "traffic jam"
    ru: "пробка (на дороге)"
    uk: "затор (на дорозі)"
    example_de: "Auf der Autobahn stehen wir seit einer Stunde im Stau."
    example_en: "We have been stuck in a traffic jam on the motorway for an hour."
    example_ru: "На автобане мы уже час стоим в пробке."
    example_uk: "На автобані ми вже годину стоїмо в заторі."
    note:
      en: "im Stau stehen — the fixed frame. A2's Verspätung names the delay; der Stau is one of its causes."
      ru: "im Stau stehen — устойчивая рамка. Verspätung с A2 называет опоздание; der Stau — одна из его причин."
      uk: "im Stau stehen — стала рамка. Verspätung з A2 називає запізнення; der Stau — одна з його причин."

  - de: "trotz"
    ipa: "ˈtʁɔts"
    pos: prep
    en: "despite, in spite of"
    ru: "несмотря на"
    uk: "попри"
    example_de: "Trotz der Verspätung haben wir den Anschluss erreicht."
    example_en: "Despite the delay we made our connection."
    example_ru: "Несмотря на опоздание, мы успели на пересадку."
    example_uk: "Попри запізнення ми встигли на пересадку."
    note:
      en: "trotz + Genitiv names the obstacle inside the sentence, before a noun phrase. Its A2 cousin trotzdem is an adverb and opens a whole new main clause."
      ru: "trotz + Genitiv называет препятствие внутри предложения, перед именной группой — русское «несмотря на» требует винительного, а trotz — родительного. Сосед с A2 trotzdem — наречие и открывает новое главное предложение."
      uk: "trotz + Genitiv називає перешкоду всередині речення, перед іменною групою — українське «попри» вимагає знахідного, а trotz — родового. Сусід з A2 trotzdem — прислівник і відкриває нове головне речення."

  - de: "während"
    ipa: "ˈvɛːʁənt"
    pos: prep
    en: "during"
    ru: "во время, в течение"
    uk: "під час"
    example_de: "Während der Fahrt gab es keine Durchsage."
    example_en: "During the journey there was no announcement."
    example_ru: "Во время поездки не было ни одного объявления."
    example_uk: "Під час поїздки не було жодного оголошення."
    note:
      en: "während + Genitiv sets the timeframe: während des Aufenthalts, während der Nacht. As a conjunction (while) it opens a verb-final clause instead — no Genitiv then."
      ru: "während + Genitiv задаёт отрезок времени: während des Aufenthalts, während der Nacht — как и русское «во время», с родительным. Как союз («пока») оно открывает придаточное с глаголом в конце — тогда без Genitiv."
      uk: "während + Genitiv задає відрізок часу: während des Aufenthalts, während der Nacht — як і українське «під час», з родовим. Як сполучник («поки») воно відкриває підрядне з дієсловом у кінці — тоді без Genitiv."

  - de: "Rückfahrt"
    ipa: "ˈʁʏkˌfaːɐ̯t"
    pos: noun
    gender: f
    plural: "die Rückfahrten"
    en: "return journey"
    ru: "обратная дорога"
    uk: "дорога назад"
    example_de: "Auf der Rückfahrt hat alles funktioniert."
    example_en: "On the return journey everything worked."
    example_ru: "На обратном пути всё работало."
    example_uk: "На зворотному шляху все працювало."
    note:
      en: "The pair is die Hinfahrt / die Rückfahrt; on tickets Hin- und Rückfahrt is the round trip."
      ru: "Пара — die Hinfahrt / die Rückfahrt; на билетах Hin- und Rückfahrt — «туда и обратно»."
      uk: "Пара — die Hinfahrt / die Rückfahrt; на квитках Hin- und Rückfahrt — «туди й назад»."

  - de: "losfahren"
    ipa: "ˈloːsˌfaːʁən"
    pos: verb
    praesens_3sg: "fährt los"
    partizip2: "losgefahren"
    aux: sein
    en: "to set off, to drive off"
    ru: "отправляться, выезжать"
    uk: "вирушати, виїжджати"
    example_de: "Wir sind schon um sechs Uhr losgefahren."
    example_en: "We set off as early as six o'clock."
    example_ru: "Мы выехали уже в шесть часов."
    example_uk: "Ми виїхали вже о шостій годині."
    note:
      en: "Separable, with sein: fährt los, ist losgefahren. A2's abfahren is the timetable word; losfahren is what you yourself do."
      ru: "Отделяемая приставка, с sein: fährt los, ist losgefahren. abfahren с A2 — слово расписаний; losfahren — то, что делаете вы сами."
      uk: "Відокремлюваний префікс, із sein: fährt los, ist losgefahren. abfahren з A2 — слово розкладів; losfahren — те, що робите ви самі."

  - de: "erfahren"
    ipa: "ɛɐ̯ˈfaːʁən"
    pos: verb
    praesens_3sg: "erfährt"
    partizip2: "erfahren"
    aux: haben
    valence: "+ Akk"
    en: "to find out, to learn (news)"
    ru: "узнавать (новость)"
    uk: "дізнаватися (новину)"
    example_de: "Erst am Schalter habe ich erfahren, dass der Zug ausfällt."
    example_en: "Only at the counter did I find out that the train was cancelled."
    example_ru: "Только у окошка я узнала, что поезд отменён."
    example_uk: "Лише біля віконця я дізналася, що поїзд скасовано."
    note:
      en: "Strong: erfährt, hat erfahren; the source takes von + Dat. Die Erfahrung (experience) is its noun with a life of its own."
      ru: "Сильный глагол: erfährt, hat erfahren; источник — von + Dat. Die Erfahrung («опыт») — его существительное с собственной жизнью."
      uk: "Сильне дієслово: erfährt, hat erfahren; джерело — von + Dat. Die Erfahrung («досвід») — його іменник із власним життям."

  - de: "vorkommen"
    ipa: "ˈfoːɐ̯ˌkɔmən"
    pos: verb
    praesens_3sg: "kommt vor"
    partizip2: "vorgekommen"
    aux: sein
    en: "to happen, to occur"
    ru: "случаться, происходить"
    uk: "траплятися, ставатися"
    example_de: "So etwas darf nicht wieder vorkommen."
    example_en: "Something like this must not happen again."
    example_ru: "Такое не должно повториться."
    example_uk: "Таке не повинно повторитися."
    note:
      en: "Separable, with sein. Two registers of the same word: the complaint's So etwas darf nicht wieder vorkommen and the shrug Das kommt vor — it happens."
      ru: "Отделяемая приставка, с sein. Два регистра одного слова: в жалобе — So etwas darf nicht wieder vorkommen, и пожимая плечами — Das kommt vor («бывает»)."
