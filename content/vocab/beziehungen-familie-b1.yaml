    gender: f
    plural: "die Geburten"
    en: birth
    ru: рождение, роды
    uk: народження, пологи
    example_de: Nach der Geburt des zweiten Kindes sind sie aufs Land gezogen.
    example_en: After the birth of their second child they moved to the countryside.
    example_ru: После рождения второго ребёнка они переехали за город.
    example_uk: Після народження другої дитини вони переїхали за місто.
    note:
      en: 'One noun for both the event and the medical process, so a hospital and a family history use the same word. The compounds are what you meet on forms — A2 der Geburtstag, das Geburtsdatum, der Geburtsort, das Geburtsjahr — and note the joining s in all of them, which the bare noun does not have. Not to be confused with A2 der Geburtstag: this word is the day you were born, that one is its anniversary every year.'
      ru: 'Одно существительное и на событие, и на медицинский процесс, так что больница и семейная хроника берут одно слово. На бланках встречаются его составные — der Geburtstag уровня A2, das Geburtsdatum, der Geburtsort, das Geburtsjahr, — и заметьте соединительное s во всех, которого у голого существительного нет. Не путать с der Geburtstag уровня A2: это слово о самом дне рождения, а то — о его ежегодной годовщине.'
      uk: 'Один іменник і на подію, і на медичний процес, тож лікарня й родинна хроніка беруть одне слово. На бланках трапляються його складні форми — der Geburtstag рівня A2, das Geburtsdatum, der Geburtsort, das Geburtsjahr, — і зауважте сполучне s в усіх, якого голий іменник не має. Не плутати з der Geburtstag рівня A2: це слово про сам день народження, а те — про його щорічну річницю.'

  - de: geboren werden
    ipa: "gəˈboːʁən ˈveːɐ̯dn̩"
    pos: phrase
    # Recognition only: the passive frame the learner already knows in the fixed form
    # `Ich bin … geboren`, taught with A1 `Geburtstag` — a typed prompt could not say
    # whether the frame or the finished sentence was wanted.
    cards: recognition
    en: to be born
    ru: родиться, появиться на свет
    uk: народитися, з’явитися на світ
    example_de: Sie ist in Hamburg geboren und in München aufgewachsen.
    example_en: She was born in Hamburg and grew up in Munich.
    example_ru: Она родилась в Гамбурге, а выросла в Мюнхене.
    example_uk: Вона народилася в Гамбурзі, а виросла в Мюнхені.
    note:
      en: 'German has no verb for it — it uses a passive, and the tense splits in a way that catches everyone out. About a living person the ordinary form drops werden altogether: Ich bin 1990 geboren. About somebody no longer alive, or in a formal record, German writes wurde geboren: Goethe wurde 1749 geboren. Both are correct and neither is a mistake for the other. A woman''s maiden name appears as geborene Müller, abbreviated geb. on a document.'
      ru: 'Отдельного глагола у немецкого нет — он берёт пассив, и время здесь распределяется так, что на этом спотыкаются все. О живом человеке обычная форма вовсе обходится без werden: Ich bin 1990 geboren. О том, кого уже нет, или в официальной записи пишут wurde geboren: Goethe wurde 1749 geboren. Обе формы верны, и ни одна не является ошибкой вместо другой. Девичья фамилия в документе стоит как geborene Müller, сокращённо geb.'
      uk: 'Окремого дієслова німецька не має — вона бере пасив, і час тут розподіляється так, що на цьому спотикаються всі. Про живу людину звичайна форма взагалі обходиться без werden: Ich bin 1990 geboren. Про того, кого вже немає, або в офіційному записі пишуть wurde geboren: Goethe wurde 1749 geboren. Обидві форми правильні, і жодна не є помилкою замість іншої. Дівоче прізвище в документі стоїть як geborene Müller, скорочено geb.'

  - de: Schwangerschaft
    ipa: "ˈʃvaŋɐʃaft"
    pos: noun
    gender: f
    plural: "die Schwangerschaften"
    # Recognition only: A2 ships `schwanger` ("pregnant", charakter-eigenschaften-a2)
    # as a production card, and that adjective is what a learner says — this noun
    # belongs to a doctor's letter and an employment law text.
    cards: recognition
    en: pregnancy
    ru: беременность
    uk: вагітність
    example_de: Während der Schwangerschaft soll sie nicht schwer heben.
    example_en: During the pregnancy she is not supposed to lift anything heavy.
    example_ru: Во время беременности ей нельзя поднимать тяжёлое.
    example_uk: Під час вагітності їй не можна піднімати важке.
    note:
      en: 'The adjective schwanger plus -schaft, the same suffix as in Freundschaft above, and the same feminine gender follows. It is a word of medical and legal German: der Mutterschutz protects a job during it, der Schwangerschaftstest is bought at a Drogerie, and der Mutterpass is the booklet that records it. In everyday speech people simply say schwanger sein or, more warmly, ein Kind bekommen.'
      ru: 'Прилагательное schwanger плюс -schaft — тот же суффикс, что в Freundschaft выше, и род тот же, женский. Это слово медицинского и юридического немецкого: der Mutterschutz защищает рабочее место в этот период, der Schwangerschaftstest покупают в Drogerie, а der Mutterpass — книжка, где всё записывают. В обиходной речи говорят просто schwanger sein или теплее — ein Kind bekommen.'
      uk: 'Прикметник schwanger плюс -schaft — той самий суфікс, що у Freundschaft вище, і рід той самий, жіночий. Це слово медичної та юридичної німецької: der Mutterschutz захищає робоче місце в цей період, der Schwangerschaftstest купують у Drogerie, а der Mutterpass — книжечка, де все записують. У побутовому мовленні кажуть просто schwanger sein або тепліше — ein Kind bekommen.'

  - de: Nachwuchs
    ipa: "ˈnaːxˌvuːks"
    pos: noun
    gender: m
    plural: "—"
    # Recognition only: newspaper and company-report lexis. A B1 learner produces
    # `Kinder` (A1) for the family sense and `junge Leute` for the other.
    cards: recognition
    en: the next lot coming up — children, or young people in a field
    en_compact: "offspring; new blood"
    ru: потомство, дети; молодая смена
    uk: потомство, діти; молода зміна
    example_de: Der Verein sucht dringend Nachwuchs für die Jugendmannschaft.
    example_en: The club is urgently looking for new young players for its youth team.
    example_ru: Клубу срочно нужна молодая смена для юношеской команды.
    example_uk: Клубові терміново потрібна молода зміна для юнацької команди.
    note:
      en: 'No plural — it is a collective. Built from nach and wachsen, literally what grows up after, and it works in three registers at once: a family announcement (Nachwuchs bekommen, to have a baby), a sports club or a firm looking for new blood (der Nachwuchs, die Nachwuchskräfte), and gardening, where it is what grows back. About one''s own children it sounds jokey and mildly newspaperish, so a family talking normally says unsere Kinder.'
      ru: 'Множественного числа нет — это собирательное. Составлено из nach и wachsen, буквально «то, что вырастает после», и работает сразу в трёх регистрах: семейное объявление (Nachwuchs bekommen — «ждать ребёнка»), спортклуб или фирма в поисках молодых кадров (der Nachwuchs, die Nachwuchskräfte) и садоводство, где это то, что отрастает заново. О собственных детях звучит шутливо и слегка по-газетному, так что в обычном разговоре семья скажет unsere Kinder.'
      uk: 'Множини немає — це збірне. Складене з nach і wachsen, буквально «те, що виростає після», і працює одразу в трьох регістрах: родинне оголошення (Nachwuchs bekommen — «чекати на дитину»), спортклуб або фірма в пошуках молодих кадрів (der Nachwuchs, die Nachwuchskräfte) і садівництво, де це те, що відростає наново. Про власних дітей звучить жартівливо й трохи по-газетному, тож у звичайній розмові родина скаже unsere Kinder.'

  - de: erziehen
    ipa: "ɛɐ̯ˈtsiːən"
    pos: verb
    praesens_3sg: erzieht
    partizip2: erzogen
    aux: haben
    valence: "+ Akk"
    en: to bring up a child, to teach it how to behave
    en_compact: "to bring up a child"
    ru: воспитывать (ребёнка)
    uk: виховувати (дитину)
    example_de: Sie hat ihre drei Kinder allein erzogen.
    example_en: She brought up her three children on her own.
    example_ru: Она одна воспитала троих детей.
    example_uk: Вона сама виховала трьох дітей.
    note:
      en: 'Strong verb: erziehen – erzog – erzogen, on the ziehen pattern, and the participle changes its vowel, which is the part to memorise. It is about manners and values, not about school subjects — teaching a skill is beibringen and teaching a class is unterrichten. The participles work as adjectives of judgement: gut erzogen is well brought up, schlecht erzogen is the opposite, and it is said of children rather than adults. Related: die Erziehung below and der Erzieher, the trained nursery teacher.'
      ru: 'Сильный глагол: erziehen – erzog – erzogen, по модели ziehen, и в причастии меняется гласный — это и стоит запомнить. Речь о манерах и ценностях, а не о школьных предметах: научить умению — beibringen, вести занятия — unterrichten. Причастия работают как оценочные прилагательные: gut erzogen — «хорошо воспитанный», schlecht erzogen — наоборот, и говорят так о детях, а не о взрослых. Родня: die Erziehung ниже и der Erzieher — воспитатель с дипломом.'
      uk: 'Сильне дієслово: erziehen – erzog – erzogen, за моделлю ziehen, і в дієприкметнику змінюється голосний — це й варто запам’ятати. Ідеться про манери й цінності, а не про шкільні предмети: навчити вміння — beibringen, вести заняття — unterrichten. Дієприкметники працюють як оцінні прикметники: gut erzogen — «добре вихований», schlecht erzogen — навпаки, і кажуть так про дітей, а не про дорослих. Рідня: die Erziehung нижче й der Erzieher — вихователь із дипломом.'

  - de: Erziehung
    ipa: "ɛɐ̯ˈtsiːʊŋ"
    pos: noun
    gender: f
    plural: "—"
    en: upbringing, the way a child is raised
    ru: воспитание
    uk: виховання
    example_de: Über die Erziehung der Kinder streiten die Eltern manchmal.
    example_en: The parents sometimes argue about how to raise the children.
    example_ru: О воспитании детей родители иногда спорят.
    example_uk: Про виховання дітей батьки іноді сперечаються.
    note:
      en: 'No plural. It covers both what parents do at home and what an institution does professionally, which is why das Erziehungsgeld and der Erziehungsurlaub were once the official names of parental benefit and leave (today Elterngeld and Elternzeit). Keep it apart from A2 die Ausbildung, which is vocational training, and die Bildung, which is education in the broad sense — three different words where English often manages with one.'
      ru: 'Множественного числа нет. Покрывает и то, что делают родители дома, и то, чем занимается учреждение профессионально, — потому das Erziehungsgeld и der Erziehungsurlaub когда-то и были официальными названиями родительского пособия и отпуска (сегодня Elterngeld и Elternzeit). Держите его отдельно от die Ausbildung уровня A2 — это профессиональное обучение, — и от die Bildung, «образование» в широком смысле: три разных слова там, где английский часто обходится одним.'
      uk: 'Множини немає. Покриває і те, що роблять батьки вдома, і те, чим займається установа професійно, — тому das Erziehungsgeld і der Erziehungsurlaub колись і були офіційними назвами батьківської допомоги та відпустки (сьогодні Elterngeld і Elternzeit). Тримайте його окремо від die Ausbildung рівня A2 — це фахове навчання, — і від die Bildung, «освіта» в широкому сенсі: три різні слова там, де англійська часто обходиться одним.'

  - de: Babysitterin
    ipa: "ˈbeːbiˌzɪtəʁɪn"
    pos: noun
    gender: f
    plural: "die Babysitterinnen"
    # Recognition only: the feminine of A2's `Babysitter` (berufe-a2), whose own note
    # already names this form — the pair costs three cards rather than four, per the
    # Movierung rule for the B1 completion pass.
    cards: recognition
    en: a woman who looks after children for a few hours
    en_compact: "babysitter (female)"
    ru: няня на несколько часов, бэбиситтер (женщина)
    uk: няня на кілька годин, бебісітерка
    example_de: Für den Abend haben wir eine Babysitterin gefunden.
    example_en: We have found a babysitter for the evening.
    example_ru: На вечер мы нашли няню.
    example_uk: На вечір ми знайшли няню.
    note:
      en: 'Movierung: the feminine of a German agent noun is built with -in and, where the stem has a vowel that can take one, an umlaut — der Arzt gives die Ärztin, der Babysitter gives this. The plural doubles the n: die Babysitterinnen. Stress stays where the loanword put it, on the first syllable. When the job is meant in general German still says der Babysitter, and a job advert today writes Babysitter/-in or Babysitter (m/w/d).'
      ru: 'Мовирование: женская пара к немецкому существительному деятеля строится суффиксом -in, а где в основе есть подходящий гласный — ещё и умлаутом: der Arzt даёт die Ärztin, der Babysitter даёт это слово. Во множественном n удваивается: die Babysitterinnen. Ударение остаётся там, куда его поставило заимствование, — на первом слоге. Когда речь о занятии вообще, немецкий по-прежнему скажет der Babysitter, а объявление о работе сегодня напишет Babysitter/-in или Babysitter (m/w/d).'
      uk: 'Мовація: жіноча пара до німецького іменника діяча будується суфіксом -in, а де в основі є придатний голосний — ще й умлаутом: der Arzt дає die Ärztin, der Babysitter дає це слово. У множині n подвоюється: die Babysitterinnen. Наголос лишається там, куди його поставило запозичення, — на першому складі. Коли йдеться про заняття взагалі, німецька й далі скаже der Babysitter, а оголошення про роботу сьогодні напише Babysitter/-in або Babysitter (m/w/d).'

