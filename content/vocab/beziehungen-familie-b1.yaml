    partizip2: geküsst
    aux: haben
    valence: "+ Akk"
    en: to kiss
    ru: целовать
    uk: цілувати
    example_de: Zum Abschied küsste sie ihn und stieg in den Zug.
    example_en: She kissed him goodbye and got on the train.
    example_ru: На прощание она поцеловала его и села в поезд.
