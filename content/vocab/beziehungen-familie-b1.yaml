# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the people words of
# data/goethe-b1-wortliste.txt: who belongs to whom, how a relationship starts and how
# it ends, and the German a family form, a birth announcement and a divorce all use.
id: beziehungen-familie-b1
title_de: "Beziehungen und Familie"
title_en: "Relationships and family"
title_ru: "Отношения и семья"
title_uk: "Стосунки та сім’я"
level: B1
entries:
  # --- Wer zu wem gehört: die Verwandtschaft ---
  - de: Neffe
    ipa: "ˈnɛfə"
    pos: noun
    gender: m
    plural: "die Neffen"
    en: nephew
    ru: племянник
    uk: небіж, племінник
    example_de: Mein Neffe kommt im Sommer für zwei Wochen zu uns.
    example_en: My nephew is coming to stay with us for two weeks in the summer.
    example_ru: Мой племянник приедет к нам летом на две недели.
    example_uk: Мій небіж приїде до нас улітку на два тижні.
    note:
      en: 'An n-noun: it adds -n in every case except the nominative singular — dem Neffen, den Neffen, des Neffen — which is the same pattern as A2 Kollege and Kunde. Its sister word Nichte is an ordinary feminine noun and takes no such ending. German has no single word for the pair, so a text says meine Nichten und Neffen where English might say the kids. The parents'' side is not marked: the child of a brother and the child of a sister are both this word.'
      ru: 'Слабое существительное (n-Deklination): во всех падежах, кроме именительного единственного, добавляется -n — dem Neffen, den Neffen, des Neffen, — та же модель, что у Kollege и Kunde уровня A2. Его сестра Nichte — обычное существительное женского рода и такого окончания не получает. Общего слова на пару у немецкого нет, поэтому текст скажет meine Nichten und Neffen. Сторона родства не различается: и сын брата, и сын сестры — одно и то же слово.'
      uk: 'Слабкий іменник (n-Deklination): в усіх відмінках, крім називного однини, додається -n — dem Neffen, den Neffen, des Neffen, — та сама модель, що в Kollege і Kunde рівня A2. Його сестра Nichte — звичайний іменник жіночого роду й такого закінчення не отримує. Спільного слова на пару німецька не має, тому текст скаже meine Nichten und Neffen. Бік споріднення не розрізняється: і син брата, і син сестри — те саме слово.'

  - de: Nichte
    ipa: "ˈnɪçtə"
    pos: noun
    gender: f
    plural: "die Nichten"
    en: niece
    ru: племянница
    uk: небога, племінниця
    example_de: Zur Hochzeit meiner Nichte fahren wir nach Bremen.
    example_en: We are travelling to Bremen for my niece's wedding.
    example_ru: На свадьбу племянницы мы едем в Бремен.
    example_uk: На весілля небоги ми їдемо до Бремена.
    note:
      en: 'A regular feminine noun with the plural in -n, and unlike Neffe it changes for nothing else. Watch the spelling against two look-alikes: nicht (not) and nichts (nothing) are among the commonest words in German and differ from this one by a single letter each. The ch is spoken as the soft ich-Laut. There is no masculine formed from it — the pair is Nichte and Neffe, two separate words.'
      ru: 'Обычное существительное женского рода с множественным на -n, и в отличие от Neffe больше ни в чём не меняется. Следите за написанием: nicht («не») и nichts («ничего») — из самых частых слов немецкого, и каждое отличается от этого одной буквой. ch произносится как мягкий ich-Laut. Мужская форма от него не образуется: пара — Nichte и Neffe, два отдельных слова.'
      uk: 'Звичайний іменник жіночого роду з множиною на -n, і, на відміну від Neffe, більше ні в чому не змінюється. Стежте за написанням: nicht («не») і nichts («нічого») — з найчастіших слів німецької, і кожне відрізняється від цього однією літерою. ch вимовляється як м’який ich-Laut. Чоловіча форма від нього не утворюється: пара — Nichte й Neffe, два окремі слова.'

  - de: Oma
    ipa: "ˈoːma"
    pos: noun
    gender: f
    plural: "die Omas"
    # Recognition only: A1 ships `Großmutter` ("grandmother") as a production card in
    # menschen-familie — the same prompt, in another deck, where no accept list here
    # can reach it.
    cards: recognition
    en: granny, gran
    ru: бабушка (ласково)
    uk: бабуся (пестливо)
    example_de: Am Sonntag backt die Oma immer einen Kuchen.
    example_en: On Sundays granny always bakes a cake.
    example_ru: По воскресеньям бабушка всегда печёт пирог.
    example_uk: У неділю бабуся завжди пече пиріг.
    note:
      en: 'The warm, spoken word beside A1 Großmutter, and inside a family it is used as a name — Oma kommt heute, with no article at all, exactly as with Mama and Papa. The plural is die Omas with -s, the ending German gives to short familiar words and to foreign borrowings. Great-grandmother is die Uroma. Used about a stranger it sounds rude, so a text about age uses ältere Frau or Seniorin instead.'
      ru: 'Тёплое разговорное слово рядом с Großmutter уровня A1, а внутри семьи оно работает как имя: Oma kommt heute — вообще без артикля, ровно как Mama и Papa. Множественное — die Omas на -s, окончание, которое немецкий даёт коротким домашним словам и заимствованиям. Прабабушка — die Uroma. О постороннем человеке звучит грубо, поэтому текст о возрасте скажет ältere Frau или Seniorin.'
      uk: 'Тепле розмовне слово поряд із Großmutter рівня A1, а всередині родини воно працює як ім’я: Oma kommt heute — узагалі без артикля, точно як Mama і Papa. Множина — die Omas на -s, закінчення, яке німецька дає коротким домашнім словам і запозиченням. Прабабуся — die Uroma. Про сторонню людину звучить грубо, тому текст про вік скаже ältere Frau або Seniorin.'

  - de: Opa
    ipa: "ˈoːpa"
    pos: noun
    gender: m
    plural: "die Opas"
    # Recognition only: A1 ships `Großvater` ("grandfather") as a production card in
    # menschen-familie, glossed letter for letter in all three languages.
    cards: recognition
    en: grandad, grandpa
    ru: дедушка (ласково)
    uk: дідусь (пестливо)
    example_de: Mein Opa hat mir das Schachspielen beigebracht.
    example_en: My grandad taught me how to play chess.
    example_ru: Дедушка научил меня играть в шахматы.
    example_uk: Дідусь навчив мене грати в шахи.
    note:
      en: 'Formed the same way as Oma and used the same way: as a name without an article inside the family, with the plural die Opas. Great-grandfather is der Uropa. Both words are short forms of the Großeltern pair, and A1 Großeltern is the neutral plural that covers all four. Do not build a plural in -en here: Omen and Open are not German words.'
      ru: 'Устроено так же, как Oma, и употребляется так же: как имя без артикля внутри семьи, множественное — die Opas. Прадедушка — der Uropa. Оба слова — короткие формы к паре Großeltern, а Großeltern уровня A1 — нейтральное множественное на всех четверых. Множественного на -en здесь не бывает: Omen и Open — не немецкие слова.'
      uk: 'Утворене так само, як Oma, і вживається так само: як ім’я без артикля всередині родини, множина — die Opas. Прадідусь — der Uropa. Обидва слова — короткі форми до пари Großeltern, а Großeltern рівня A1 — нейтральна множина на всіх чотирьох. Множини на -en тут не буває: Omen і Open — не німецькі слова.'

  - de: Bub
    ipa: "ˈbuːp"
    pos: noun
    gender: m
    plural: "die Buben"
    # Recognition only: A1 ships `Junge` ("boy") as a production card in
    # menschen-familie, and that is the word the standard written language uses —
    # this one is the southern and Austrian regional variant of the same prompt.
    cards: recognition
    en: boy (southern German, Austrian and Swiss usage)
    en_compact: "boy (southern usage)"
    ru: мальчик (юг Германии, Австрия, Швейцария)
    uk: хлопчик (південь Німеччини, Австрія, Швейцарія)
    example_de: Die Buben spielen hinter dem Haus Fußball.
    example_en: The boys are playing football behind the house.
    example_ru: Мальчики играют в футбол за домом.
    example_uk: Хлопці грають у футбол за будинком.
    note:
      en: 'A regional word, not an old one: in Bavaria, Austria and Switzerland it is simply what a boy is called, while the north and standard writing use A1 Junge. Take it as a marker of where a text or a speaker comes from. The plural is die Buben with -en, and the diminutive Bübchen is affectionate. In a pack of cards der Bube is the jack everywhere in the German-speaking area, regional preference or not.'
      ru: 'Слово областное, а не устаревшее: в Баварии, Австрии и Швейцарии мальчика зовут именно так, тогда как север и письменная норма берут Junge уровня A1. Воспринимайте его как признак того, откуда текст или говорящий. Множественное — die Buben на -en, уменьшительное Bübchen ласковое. В карточной колоде der Bube — «валет» по всему немецкоязычному пространству, независимо от областных предпочтений.'
      uk: 'Слово обласне, а не застаріле: у Баварії, Австрії та Швейцарії хлопчика звуть саме так, тоді як північ і писемна норма беруть Junge рівня A1. Сприймайте його як ознаку того, звідки текст чи мовець. Множина — die Buben на -en, зменшувальне Bübchen пестливе. У картярській колоді der Bube — «валет» по всьому німецькомовному просторі, незалежно від обласних уподобань.'

  - de: verwandt
    ipa: "fɛɐ̯ˈvant"
    pos: adj
    en: related, belonging to the same family
    ru: родственный, состоящий в родстве
    uk: споріднений, який перебуває в родинних зв’язках
    example_de: Wir sind nur weit verwandt, aber wir sehen uns jedes Jahr.
    example_en: We are only distantly related, but we see each other every year.
    example_ru: Мы лишь дальние родственники, но видимся каждый год.
    example_uk: Ми лише далекі родичі, але бачимося щороку.
    note:
      en: 'The person you are related to goes with mit + Dativ: Ich bin mit ihr verwandt. Two adverbs grade it — nah verwandt and weit verwandt — and the noun die Verwandtschaft is the whole set of relatives taken together. It also works outside families: verwandte Sprachen are languages of one family, and eine verwandte Idee is a related one. A2 Verwandte in menschen-beziehungen-a2 is the adjectival noun made from it, which is why it declines like an adjective.'
      ru: 'Тот, с кем состоят в родстве, идёт с mit + Dativ: Ich bin mit ihr verwandt. Степень задают два наречия — nah verwandt и weit verwandt, — а существительное die Verwandtschaft — вся родня разом. Работает и вне семьи: verwandte Sprachen — родственные языки, eine verwandte Idee — близкая мысль. Verwandte уровня A2 из колоды menschen-beziehungen-a2 — субстантивированное прилагательное от этого слова, потому оно и склоняется как прилагательное.'
      uk: 'Той, із ким перебувають у спорідненні, іде з mit + Dativ: Ich bin mit ihr verwandt. Ступінь задають два прислівники — nah verwandt і weit verwandt, — а іменник die Verwandtschaft — уся рідня разом. Працює й поза сім’єю: verwandte Sprachen — споріднені мови, eine verwandte Idee — близька думка. Verwandte рівня A2 з колоди menschen-beziehungen-a2 — субстантивований прикметник від цього слова, тому воно й відмінюється як прикметник.'

  - de: Angehörige
    ipa: "ˈangəˌhøːʁɪgə"
    pos: noun
    gender: f
    plural: "die Angehörigen"
    # Recognition only: A2 ships `Verwandte` ("relative") as a production card in
    # menschen-beziehungen-a2 with its full adjectival-noun accept list — this is the
    # official register of the same prompt, and it is read on a form, never typed.
    cards: recognition
    en: next of kin, a member of a family or a group
    ru: близкий родственник; член (семьи, группы)
    uk: близький родич; член (родини, групи)
    example_de: Nach dem Unfall wurden die Angehörigen sofort informiert.
    example_en: After the accident the next of kin were informed immediately.
    example_ru: После аварии близких родственников известили немедленно.
    example_uk: Після аварії близьких родичів сповістили негайно.
    note:
      en: 'An adjectival noun, so the ending follows the article exactly as an adjective''s would: der Angehörige, ein Angehöriger, eine Angehörige, die Angehörigen, and after a bare preposition simply Angehörige. It comes from angehören, to belong to, so it also names membership of a group rather than a family: Staatsangehörige are nationals, and die Staatsangehörigkeit is the line on your ID card. Hospitals, police and insurers use it; a family talking about itself says Verwandte or meine Leute.'
      ru: 'Субстантивированное прилагательное, поэтому окончание следует за артиклем ровно так же, как окончание прилагательного: der Angehörige, ein Angehöriger, eine Angehörige, die Angehörigen, а после голого предлога — просто Angehörige. Происходит от angehören («принадлежать к»), поэтому обозначает и принадлежность к группе, а не только к семье: Staatsangehörige — граждане, а die Staatsangehörigkeit — строка в удостоверении личности. Слово больниц, полиции и страховых; сама семья о себе скажет Verwandte или meine Leute.'
      uk: 'Субстантивований прикметник, тому закінчення йде за артиклем так само, як закінчення прикметника: der Angehörige, ein Angehöriger, eine Angehörige, die Angehörigen, а після голого прийменника — просто Angehörige. Походить від angehören («належати до»), тому позначає й належність до групи, а не лише до сім’ї: Staatsangehörige — громадяни, а die Staatsangehörigkeit — рядок у посвідченні особи. Слово лікарень, поліції та страхових; сама родина про себе скаже Verwandte або meine Leute.'

  - de: Generation
    ipa: "genəʁaˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "die Generationen"
    # Recognition only: the vocabulary of a newspaper feature or a sociology text.
    # A B1 learner produces `meine Eltern`, `die Jungen` or `die Alten` for the same
    # idea — all A1 words with shipped cards.
    cards: recognition
    en: generation, the people born around the same time
    ru: поколение
    uk: покоління
    example_de: In vielen Familien wohnen heute nicht mehr drei Generationen unter einem Dach.
    example_en: In many families three generations no longer live under one roof today.
    example_ru: Во многих семьях сегодня уже не живут три поколения под одной крышей.
    example_uk: У багатьох родинах сьогодні вже не живуть три покоління під одним дахом.
    note:
      en: 'Stress on the last syllable, as in every German noun ending in -tion, and that -tion is always feminine — die Situation, die Information, die Nation. The plural adds -en. Compounds carry a lot of the newspaper''s meaning: der Generationenvertrag is the pension bargain between young and old, and der Generationskonflikt is the clash between them. In a technical text the same word means a model generation of a device.'
      ru: 'Ударение на последнем слоге, как у всякого немецкого существительного на -tion, и это -tion всегда женского рода: die Situation, die Information, die Nation. Множественное на -en. Много газетного смысла держится на составных словах: der Generationenvertrag — «договор поколений» о пенсиях, der Generationskonflikt — конфликт между ними. В техническом тексте то же слово значит поколение модели устройства.'
      uk: 'Наголос на останньому складі, як у кожного німецького іменника на -tion, і це -tion завжди жіночого роду: die Situation, die Information, die Nation. Множина на -en. Багато газетного змісту тримається на складних словах: der Generationenvertrag — «договір поколінь» про пенсії, der Generationskonflikt — конфлікт між ними. У технічному тексті те саме слово означає покоління моделі пристрою.'

  - de: Jugend
    ipa: "ˈjuːgn̩t"
    pos: noun
    gender: f
    plural: "—"
    # Recognition only: A2 ships `Jugendliche` ("teenager, young person") as a
    # production card in menschen-beziehungen-a2, and `jung` is A1 — a prompt reading
    # "youth" cannot say which of the three is wanted.
    cards: recognition
    en: youth, the years of being young; young people as a group
    en_compact: "youth; young people"
    ru: юность, молодость; молодёжь
    uk: юність, молодість; молодь
    example_de: In seiner Jugend hat er in einer Band gespielt.
    example_en: In his youth he played in a band.
    example_ru: В юности он играл в группе.
    example_uk: У юності він грав у гурті.
    note:
      en: 'No plural, and two readings in one word: the period of a life (in meiner Jugend) and the young people of a society taken together (Die Jugend von heute …), where German uses a singular verb for the group. Compounds are everywhere in official German: die Jugendherberge, das Jugendamt, der Jugendliche, jugendfrei on a film rating. Do not confuse it with jung, the adjective, or with die Jugendliche, one single young person.'
      ru: 'Множественного числа нет, а чтений два: период жизни (in meiner Jugend) и молодёжь общества как целое (Die Jugend von heute …), причём глагол при этой группе стоит в единственном числе. Составные слова заполняют официальный немецкий: die Jugendherberge, das Jugendamt, der Jugendliche, пометка jugendfrei на фильме. Не путать ни с прилагательным jung, ни с die Jugendliche — одним отдельным подростком.'
      uk: 'Множини немає, а прочитань два: період життя (in meiner Jugend) і молодь суспільства як ціле (Die Jugend von heute …), причому дієслово при цій групі стоїть в однині. Складні слова заповнюють офіційну німецьку: die Jugendherberge, das Jugendamt, der Jugendliche, позначка jugendfrei на фільмі. Не плутати ні з прикметником jung, ні з die Jugendliche — одним окремим підлітком.'

  - de: erwachsen
    ipa: "ɛɐ̯ˈvaksn̩"
    pos: adj
    # Recognition only: A2 ships `Erwachsene` ("adult") as a production card in
    # menschen-beziehungen-a2, and that entry's own note names this adjective — a
    # prompt reading "adult" cannot say which of the two is wanted.
    cards: recognition
    en: grown-up, no longer a child
    ru: взрослый (о человеке)
    uk: дорослий (про людину)
    example_de: Ihre Kinder sind längst erwachsen und wohnen in anderen Städten.
    example_en: Her children have long been grown up and live in other cities.
    example_ru: Её дети давно взрослые и живут в других городах.
    example_uk: Її діти давно дорослі й живуть в інших містах.
    note:
      en: 'Formally the participle of erwachsen, to grow, but that verb is gone from ordinary German and only the adjective is left. From it comes the adjectival noun A2 Erwachsene, an adult, and the two must not be swapped: Sie ist erwachsen describes her, Sie ist eine Erwachsene classes her. Two neighbours in the same field: volljährig is the legal one from eighteen onwards, and reif means mature in character rather than in years.'
      ru: 'Формально это причастие от erwachsen — «вырастать», но сам глагол из обиходного немецкого ушёл, и осталось только прилагательное. От него образовано субстантивированное Erwachsene уровня A2 — «взрослый», и путать их нельзя: Sie ist erwachsen описывает её, Sie ist eine Erwachsene причисляет её к категории. Два соседа того же поля: volljährig — юридическое «совершеннолетний» с восемнадцати, а reif — «зрелый» по характеру, а не по годам.'
      uk: 'Формально це дієприкметник від erwachsen — «виростати», але саме дієслово з побутової німецької зникло, і лишився тільки прикметник. Від нього утворено субстантивоване Erwachsene рівня A2 — «доросла людина», і плутати їх не можна: Sie ist erwachsen описує її, Sie ist eine Erwachsene зараховує її до категорії. Два сусіди того самого поля: volljährig — юридичне «повнолітній» із вісімнадцяти, а reif — «зрілий» за вдачею, а не за роками.'

  - de: Senioren
    ipa: "zeˈni̯oːʁən"
    pos: phrase
    # Recognition only: notice-and-brochure vocabulary — a discount, a course, a
    # residence. A B1 learner produces `alte Leute` or `ältere Menschen`, both from
    # A1 words with shipped cards.
    cards: recognition
    en: senior citizens, older people as a group
    ru: пожилые люди, пенсионеры
    uk: люди похилого віку, пенсіонери
    example_de: Für Senioren kostet der Eintritt nur die Hälfte.
    example_en: For senior citizens the entrance fee is only half.
    example_ru: Для пожилых людей вход стоит вдвое дешевле.
    example_uk: Для людей похилого віку вхід коштує удвічі дешевше.
    note:
      en: 'The Wortliste lists the plural, and that is how the word is used — on notices, in price lists and in brochures, almost always without an article after a preposition: für Senioren, Angebote für Senioren. The singular der Senior and die Seniorin exist and are polite rather than warm. Compounds are everywhere in that register: das Seniorenheim, der Seniorenteller in a restaurant, die Seniorenkarte. In a company or a sports club the same word means the senior members as against the juniors.'
      ru: 'Wortliste даёт множественное число, и именно так слово и работает: на объявлениях, в прейскурантах и буклетах, почти всегда без артикля после предлога — für Senioren, Angebote für Senioren. Единственное der Senior и die Seniorin существует и звучит вежливо, а не тепло. Составные слова заполняют этот регистр: das Seniorenheim, der Seniorenteller в ресторане, die Seniorenkarte. В фирме или в спортклубе то же слово значит старших участников в противоположность юниорам.'
      uk: 'Wortliste подає множину, і саме так слово й працює: на оголошеннях, у прайсах і буклетах, майже завжди без артикля після прийменника — für Senioren, Angebote für Senioren. Однина der Senior і die Seniorin існує і звучить ввічливо, а не тепло. Складні слова заповнюють цей регістр: das Seniorenheim, der Seniorenteller у ресторані, die Seniorenkarte. У фірмі чи в спортклубі те саме слово означає старших учасників на противагу юніорам.'

  # --- Beziehung, Freundschaft, Vertrauen ---
  - de: Beziehung
    ipa: "bəˈtsiːʊŋ"
    pos: noun
    gender: f
    plural: "die Beziehungen"
    # Gloss kept to the human sense only: "connection between things / связь" is
    # Zusammenhang's and Verbindung's production prompt (lernen-zukunft,
    # reisen-probleme) — the thing-sense stays in the note, answer side.
    en: relationship between people
    ru: отношения (между людьми)
    uk: стосунки (між людьми)
    example_de: Zu seinen Eltern hat er ein gutes Verhältnis, aber die Beziehung zu seiner Schwester ist schwierig.
    example_en: He gets on well with his parents, but the relationship with his sister is difficult.
    example_ru: С родителями у него хорошие отношения, а вот отношения с сестрой сложные.
    example_uk: З батьками в нього добрі стосунки, а от стосунки із сестрою складні.
    note:
      en: 'Three uses worth keeping apart. Between two people it is a partnership — eine feste Beziehung haben means being in a couple, and the preposition is zu + Dativ for anybody else. Between things it is a link: in dieser Beziehung means in this respect. In the plural it can mean contacts that get things done, and Beziehungen haben is nearly a criticism. The verb behind it is sich beziehen auf, to refer to something.'
      ru: 'Три употребления, которые стоит держать врозь. Между двумя людьми это партнёрство: eine feste Beziehung haben — «состоять в отношениях», а с кем угодно другим предлог zu + Dativ. Между вещами это связь: in dieser Beziehung — «в этом отношении». Во множественном числе может означать полезные связи, и Beziehungen haben звучит почти упрёком. За словом стоит глагол sich beziehen auf — «ссылаться на».'
      uk: 'Три вживання, які варто тримати нарізно. Між двома людьми це партнерство: eine feste Beziehung haben — «бути в стосунках», а з будь-ким іншим прийменник zu + Dativ. Між речами це зв’язок: in dieser Beziehung — «у цьому відношенні». У множині може означати корисні знайомства, і Beziehungen haben звучить майже докором. За словом стоїть дієслово sich beziehen auf — «покликатися на».'

  - de: Verhältnis
    ipa: "fɛɐ̯ˈhɛltnɪs"
    pos: noun
    gender: n
    plural: "die Verhältnisse"
    # Recognition only: `Beziehung` in this same deck ships as the production card for
    # "relationship", and in the everyday sense the two are interchangeable — one
    # typed card per family, per the `ebenso`/`genauso` ruling in ort-richtung-verweis-b1.
    cards: recognition
    en: how two people or two figures stand to each other
    ru: отношение (между людьми); соотношение
    uk: ставлення (між людьми); співвідношення
    example_de: Das Verhältnis zwischen Preis und Leistung ist bei diesem Angebot sehr gut.
    example_en: The ratio of price to quality is very good with this offer.
    example_ru: Соотношение цены и качества у этого предложения очень хорошее.
    example_uk: Співвідношення ціни та якості в цій пропозиції дуже добре.
    note:
      en: 'Where Beziehung is the connection itself, this word is how it stands — good, bad, two to one. Between people it wants zu + Dativ (ein gutes Verhältnis zu jemandem haben); between numbers it is a ratio (im Verhältnis 2:1). The plural die Verhältnisse means the conditions somebody lives in — in guten Verhältnissen leben, die Wohnverhältnisse — and that plural is what a social report is full of. The -nis suffix doubles the s in the plural, exactly as in Geheimnis.'
      ru: 'Если Beziehung — сама связь, то это слово — то, какова она: хорошая, плохая, два к одному. Между людьми требует zu + Dativ (ein gutes Verhältnis zu jemandem haben), между числами это пропорция (im Verhältnis 2:1). Множественное die Verhältnisse значит условия, в которых человек живёт: in guten Verhältnissen leben, die Wohnverhältnisse, — и именно этим множественным полон социальный отчёт. Суффикс -nis удваивает s во множественном, ровно как в Geheimnis.'
      uk: 'Якщо Beziehung — сам зв’язок, то це слово — те, який він: добрий, поганий, два до одного. Між людьми вимагає zu + Dativ (ein gutes Verhältnis zu jemandem haben), між числами це пропорція (im Verhältnis 2:1). Множина die Verhältnisse означає умови, у яких людина живе: in guten Verhältnissen leben, die Wohnverhältnisse, — і саме цією множиною повний соціальний звіт. Суфікс -nis подвоює s у множині, точно як у Geheimnis.'

  - de: Freundschaft
    ipa: "ˈfʁɔʏ̯ntʃaft"
    pos: noun
    gender: f
    plural: "die Freundschaften"
    en: friendship
    ru: дружба
    uk: дружба
    example_de: Aus der Freundschaft zwischen den beiden ist später eine Ehe geworden.
    example_en: The friendship between the two later turned into a marriage.
    example_ru: Из дружбы между ними позже выросла семья.
    example_uk: З дружби між ними згодом виросла сім’я.
    note:
      en: 'Freund plus the suffix -schaft, which builds an abstract feminine noun out of a person or a state — die Nachbarschaft, die Mannschaft, die Gesellschaft. The verbs are eine Freundschaft schließen (to strike one up) and pflegen (to keep one going). Note that A1 Freund does double duty as friend and boyfriend, so eine Freundschaft is the safe way to say the relationship is not romantic; freundschaftlich as an adverb says the same about a tone.'
      ru: 'Freund плюс суффикс -schaft, который строит из человека или состояния отвлечённое существительное женского рода: die Nachbarschaft, die Mannschaft, die Gesellschaft. Глаголы: eine Freundschaft schließen («завязать») и pflegen («поддерживать»). Заметьте, что Freund уровня A1 значит и «друг», и «парень», поэтому eine Freundschaft — надёжный способ сказать, что отношения не романтические; наречие freundschaftlich говорит то же о тоне.'
      uk: 'Freund плюс суфікс -schaft, який будує з людини чи стану абстрактний іменник жіночого роду: die Nachbarschaft, die Mannschaft, die Gesellschaft. Дієслова: eine Freundschaft schließen («зав’язати») і pflegen («підтримувати»). Зауважте, що Freund рівня A1 означає і «друг», і «хлопець», тому eine Freundschaft — надійний спосіб сказати, що стосунки не романтичні; прислівник freundschaftlich каже те саме про тон.'

  - de: vertrauen
    ipa: "fɛɐ̯ˈtʁaʊ̯ən"
    pos: verb
    praesens_3sg: vertraut
    partizip2: vertraut
    aux: haben
    valence: "+ Dat"
    en: to trust somebody, to rely on them
    ru: доверять кому-либо, полагаться
    uk: довіряти комусь, покладатися
    example_de: Ich vertraue dir, du schaffst das schon allein.
    example_en: I trust you, you will manage it on your own.
    example_ru: Я тебе доверяю, ты справишься сам.
    example_uk: Я тобі довіряю, ти впораєшся сам.
    note:
      en: 'A plain dative verb — jemandem vertrauen — with no preposition, which is the shape to remember, since English trusts somebody directly. With a thing rather than a person it takes auf + Akkusativ: Ich vertraue auf mein Glück. The noun das Vertrauen is in the charakter-verhalten-b1 deck and takes zu (Vertrauen zu jemandem haben). Do not confuse the participle vertraut, which as an adjective means familiar: eine vertraute Stimme.'
      ru: 'Простой дативный глагол — jemandem vertrauen, — без предлога, и именно эту форму стоит запомнить, потому что русский тоже даёт дательный, а вот английский обходится прямым дополнением. С вещью, а не с человеком, берёт auf + Akkusativ: Ich vertraue auf mein Glück. Существительное das Vertrauen лежит в колоде charakter-verhalten-b1 и требует zu (Vertrauen zu jemandem haben). Не путать с причастием vertraut: как прилагательное оно значит «привычный, знакомый» — eine vertraute Stimme.'
      uk: 'Простий давальний дієслівний зразок — jemandem vertrauen, — без прийменника, і саме цю форму варто запам’ятати, бо англійська обходиться прямим додатком. З річчю, а не з людиною, бере auf + Akkusativ: Ich vertraue auf mein Glück. Іменник das Vertrauen лежить у колоді charakter-verhalten-b1 і вимагає zu (Vertrauen zu jemandem haben). Не плутати з дієприкметником vertraut: як прикметник він означає «звичний, знайомий» — eine vertraute Stimme.'

  - de: begegnen
    ipa: "bəˈgeːgnən"
    pos: verb
    praesens_3sg: begegnet
    partizip2: begegnet
    aux: sein
    valence: "+ Dat"
    # Recognition only: A1 ships `treffen` and A2 `sich treffen` (freunde-feste) as
    # production cards, and a prompt reading "to meet" is answered there — this verb
    # is the written register for meeting by chance.
    cards: recognition
    en: to run into somebody by chance
    ru: встретить случайно, повстречать
    uk: зустріти випадково, спіткати
    example_de: Gestern bin ich meiner alten Lehrerin in der Stadt begegnet.
    example_en: Yesterday I ran into my old teacher in town.
    example_ru: Вчера я случайно встретил в городе свою бывшую учительницу.
    example_uk: Учора я випадково зустрів у місті свою колишню вчительку.
    note:
      en: 'Two things to hold together: the person met is a plain dative, and the Perfekt takes sein — Ich bin ihm begegnet — which is unusual for a verb with an object and is exactly what makes it worth a card. The chance is built in: A1 treffen can be arranged (Wir treffen uns um acht), this one cannot. In writing it also means to respond to something: einer Gefahr begegnen, to meet a danger. The noun die Begegnung is an encounter.'
      ru: 'Две вещи держим вместе: тот, кого встретили, стоит в чистом Dativ, а Perfekt берёт sein — Ich bin ihm begegnet, — что необычно для глагола с дополнением и как раз стоит карточки. Случайность встроена: treffen уровня A1 можно назначить (Wir treffen uns um acht), а это — нет. В письменном языке значит ещё «противостоять чему-либо»: einer Gefahr begegnen. Существительное die Begegnung — «встреча».'
      uk: 'Дві речі тримаємо разом: той, кого зустріли, стоїть у чистому Dativ, а Perfekt бере sein — Ich bin ihm begegnet, — що незвично для дієслова з додатком і саме тому варте картки. Випадковість вбудована: treffen рівня A1 можна призначити (Wir treffen uns um acht), а це — ні. У писемній мові означає ще «протистояти чомусь»: einer Gefahr begegnen. Іменник die Begegnung — «зустріч».'

  - de: begleiten
    ipa: "bəˈglaɪ̯tn̩"
    pos: verb
    praesens_3sg: begleitet
    partizip2: begleitet
    aux: haben
    valence: "+ Akk"
    # Recognition only: A1 ships `mitkommen` ("to come along", trennbare-a1-verben) as
    # a production card, and `mitgehen` covers the rest — this verb is the polite and
    # written form of going with somebody.
    cards: recognition
    en: to go along with somebody, to see them there
    ru: сопровождать, провожать
    uk: супроводжувати, проводжати
    example_de: Darf ich Sie zum Bahnhof begleiten?
    example_en: May I walk you to the station?
    example_ru: Можно я провожу вас до вокзала?
    example_uk: Чи можу я провести вас до вокзалу?
    note:
      en: 'Accusative object and no preposition for the person — jemanden begleiten — while the destination takes zu or nach as usual. It is the courteous word: A1 mitkommen is what a friend does, this is what you offer a guest. It reaches beyond people too: eine Krankheit begleitet ihn seit Jahren, and in music jemanden am Klavier begleiten is to accompany a singer. The noun der Begleiter is the person who comes with you, and das Begleitschreiben is a covering letter.'
      ru: 'Дополнение в Akkusativ и без предлога для человека — jemanden begleiten, — а направление берёт zu или nach как обычно. Это учтивое слово: mitkommen уровня A1 — то, что делает приятель, а это — то, что предлагают гостю. Работает и за пределами людей: eine Krankheit begleitet ihn seit Jahren, а в музыке jemanden am Klavier begleiten — «аккомпанировать». Существительное der Begleiter — спутник, а das Begleitschreiben — сопроводительное письмо.'
      uk: 'Додаток у Akkusativ і без прийменника для людини — jemanden begleiten, — а напрямок бере zu або nach як звичайно. Це ґречне слово: mitkommen рівня A1 — те, що робить приятель, а це — те, що пропонують гостеві. Працює й поза людьми: eine Krankheit begleitet ihn seit Jahren, а в музиці jemanden am Klavier begleiten — «акомпанувати». Іменник der Begleiter — супутник, а das Begleitschreiben — супровідний лист.'

  # --- Liebe: sich verlieben, küssen, umarmen ---
  - de: Liebe
    ipa: "ˈliːbə"
    pos: noun
    gender: f
    plural: "—"
    en: love
    ru: любовь
    uk: любов, кохання
    example_de: Die Liebe zur Musik hat er von seinem Vater.
    example_en: His love of music comes from his father.
    example_ru: Любовь к музыке у него от отца.
    example_uk: Любов до музики в нього від батька.
    note:
      en: 'No plural in ordinary use. The preposition for what is loved is zu + Dativ: die Liebe zur Musik, die Liebe zu den Kindern. Two chunks are everywhere — Liebe auf den ersten Blick and aus Liebe zu jemandem — and one is a false friend of nothing but itself: Liebe Grüße at the end of a message is simply Best wishes, not a declaration. German uses one word where some languages use two, so the same noun covers a parent, a partner and a hobby.'
      ru: 'В обычном употреблении множественного числа нет. Предлог для того, что любят, — zu + Dativ: die Liebe zur Musik, die Liebe zu den Kindern. Два оборота встречаются повсюду — Liebe auf den ersten Blick и aus Liebe zu jemandem, — а один только выглядит признанием: Liebe Grüße в конце сообщения значит просто «с наилучшими пожеланиями». Немецкий обходится одним словом там, где русский различает любовь и влюблённость, так что оно покрывает и родителя, и партнёра, и увлечение.'
      uk: 'У звичайному вжитку множини немає. Прийменник для того, що люблять, — zu + Dativ: die Liebe zur Musik, die Liebe zu den Kindern. Два звороти трапляються всюди — Liebe auf den ersten Blick і aus Liebe zu jemandem, — а один лише виглядає освідченням: Liebe Grüße наприкінці повідомлення означає просто «з найкращими побажаннями». Німецька обходиться одним словом там, де українська розрізняє любов і кохання, тож воно покриває і батька, і партнера, і захоплення.'

  - de: lieb
    ipa: "ˈliːp"
    pos: adj
    # Recognition only: A2 ships `nett` (charakter-eigenschaften-a2) and A1
    # `freundlich` (menschen-familie) as production cards for the same prompt, and the
    # letter-writing use is a fixed formula rather than a word choice.
    cards: recognition
    en: kind and warm-hearted; dear (in a letter)
    en_compact: "kind; dear"
    ru: милый, добрый; дорогой (в письме)
    uk: милий, добрий; дорогий (у листі)
    example_de: Das war sehr lieb von dir, danke!
    example_en: That was very kind of you, thank you!
    example_ru: Это было очень мило с твоей стороны, спасибо!
    example_uk: Це було дуже мило з твого боку, дякую!
    note:
      en: 'Three jobs. As a description of a person it is warmer than nett, and Das ist lieb von dir is the standard thank-you. At the head of a letter it is the fixed opening — Liebe Anna, Lieber Herr Weber — with the ending following the person''s gender, and it is warmer than Sehr geehrte. Third, jemanden lieb haben is the mild form of lieben, used inside families where lieben would be too strong. The comparative is unusual: lieber has drifted off to mean rather.'
      ru: 'Три работы. О человеке оно теплее, чем nett, и Das ist lieb von dir — стандартная благодарность. В начале письма это устойчивое обращение — Liebe Anna, Lieber Herr Weber — с окончанием по роду адресата, и оно теплее, чем Sehr geehrte. Третье: jemanden lieb haben — смягчённая форма lieben, употребляемая внутри семьи, где lieben было бы слишком сильно. Сравнительная степень ушла в сторону: lieber теперь значит «лучше, охотнее».'
      uk: 'Три роботи. Про людину воно тепліше, ніж nett, і Das ist lieb von dir — стандартна подяка. На початку листа це стале звертання — Liebe Anna, Lieber Herr Weber — із закінченням за родом адресата, і воно тепліше, ніж Sehr geehrte. Третє: jemanden lieb haben — пом’якшена форма lieben, уживана в родині, де lieben було б надто сильно. Вищий ступінь відійшов убік: lieber тепер означає «краще, охочіше».'

  - de: sich verlieben
    ipa: "zɪç fɛɐ̯ˈliːbn̩"
    pos: verb
    praesens_3sg: verliebt sich
    partizip2: sich verliebt
    aux: haben
    valence: "sich + Akk; in + Akk"
    # Recognition only: A2 ships `verlieben` ("to fall in love (with)") as a production
    # card in gefuehle-reflexive-a2, with `sich verlieben` in its own accept list —
    # this entry keys the Wortliste's spelling and must not deal a second card for
    # the identical prompt.
    cards: recognition
    en: to fall in love with somebody
    ru: влюбиться в кого-либо
    uk: закохатися в когось
    example_de: Sie hat sich in einen Kollegen aus dem Nachbarbüro verliebt.
    example_en: She fell in love with a colleague from the office next door.
    example_ru: Она влюбилась в коллегу из соседнего кабинета.
    example_uk: Вона закохалася в колегу із сусіднього кабінету.
    note:
      en: 'The preposition is in + Akkusativ, and the accusative is the point: it marks the movement of falling, not a place of resting. Compare sich verlieben in jemanden with verliebt sein in jemanden — the second also takes the accusative, which is the exception a learner should simply memorise here. The ver- prefix marks the change of state, the same one in sich verlaufen or sich verfahren, and the family runs verlieben, verliebt, die Verliebtheit.'
      ru: 'Предлог — in + Akkusativ, и Akkusativ здесь принципиален: он помечает само движение «влюбиться», а не место пребывания. Сравните sich verlieben in jemanden и verliebt sein in jemanden — второе тоже требует Akkusativ, и это исключение стоит просто запомнить. Приставка ver- помечает смену состояния, та же, что в sich verlaufen или sich verfahren, а семья такова: verlieben, verliebt, die Verliebtheit.'
      uk: 'Прийменник — in + Akkusativ, і Akkusativ тут принциповий: він позначає сам рух «закохатися», а не місце перебування. Порівняйте sich verlieben in jemanden і verliebt sein in jemanden — друге теж вимагає Akkusativ, і цей виняток варто просто запам’ятати. Префікс ver- позначає зміну стану, той самий, що в sich verlaufen чи sich verfahren, а родина така: verlieben, verliebt, die Verliebtheit.'

  - de: verliebt
    ipa: "fɛɐ̯ˈliːpt"
    pos: adj
    # Recognition only: the participle of the verb directly above, whose production
    # card is already owned by A2's `verlieben` — one prompt cannot ask for the verb
    # and the adjective at once.
    cards: recognition
    en: in love with somebody
    ru: влюблённый
    uk: закоханий
    example_de: Die beiden sind seit dem Sommer verliebt.
    example_en: The two of them have been in love since the summer.
    example_ru: Эти двое влюблены с лета.
    example_uk: Ці двоє закохані з літа.
    note:
      en: 'The participle of sich verlieben used as a plain adjective, and it keeps the verb''s preposition: verliebt in jemanden sein, with the accusative. Before a noun it takes endings — ein verliebtes Paar, verliebte Blicke. The three-step chain a German love story runs on is worth having whole: verliebt, verlobt (engaged), verheiratet. The final -t is spoken as it is written; the b before it devoices to p.'
      ru: 'Причастие от sich verlieben в роли обычного прилагательного, и предлог глагола оно сохраняет: verliebt in jemanden sein, с Akkusativ. Перед существительным получает окончания — ein verliebtes Paar, verliebte Blicke. Трёхступенчатую цепочку, на которой держится немецкая любовная история, стоит взять целиком: verliebt, verlobt («помолвлен»), verheiratet. Конечное -t произносится как пишется, а b перед ним оглушается в p.'
      uk: 'Дієприкметник від sich verlieben у ролі звичайного прикметника, і прийменник дієслова він зберігає: verliebt in jemanden sein, з Akkusativ. Перед іменником отримує закінчення — ein verliebtes Paar, verliebte Blicke. Триступеневий ланцюжок, на якому тримається німецька любовна історія, варто взяти цілим: verliebt, verlobt («заручений»), verheiratet. Кінцеве -t вимовляється як пишеться, а b перед ним оглушується в p.'

  - de: küssen
    ipa: "ˈkʏsn̩"
