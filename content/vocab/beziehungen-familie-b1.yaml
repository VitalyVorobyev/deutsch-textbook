    # prompt reading "kiss" cannot say whether the verb or the noun is wanted.
    cards: recognition
    en: kiss
    ru: поцелуй
    uk: поцілунок
    example_de: Sie gab ihrem Sohn einen Kuss und ging zur Arbeit.
    example_en: She gave her son a kiss and left for work.
    example_ru: Она поцеловала сына и ушла на работу.
    example_uk: Вона поцілувала сина й пішла на роботу.
    note:
      en: 'Short u in the singular, umlaut and long ü in the plural: der Kuss, die Küsse — the double s after a short vowel is exactly why the spelling changes. The verb is what German normally uses, so einen Kuss geben is a shade more deliberate than küssen. In a message Liebe Grüße und Küsse or just Küsschen ends a note between people who are close. Der Handkuss survives mainly in the idiom etwas mit Handkuss annehmen, to accept something gladly.'
      ru: 'Краткое u в единственном числе, умлаут и долгое ü во множественном: der Kuss, die Küsse — двойное s после краткого гласного как раз и объясняет смену написания. Немецкий обычно пользуется глаголом, так что einen Kuss geben звучит чуть нарочитее, чем küssen. В сообщении Liebe Grüße und Küsse или просто Küsschen завершают записку между близкими. Der Handkuss выжил в основном в обороте etwas mit Handkuss annehmen — «принять с превеликой охотой».'
      uk: 'Коротке u в однині, умлаут і довге ü у множині: der Kuss, die Küsse — подвійне s після короткого голосного якраз і пояснює зміну написання. Німецька зазвичай користується дієсловом, тож einen Kuss geben звучить трохи навмисніше, ніж küssen. У повідомленні Liebe Grüße und Küsse або просто Küsschen завершують записку між близькими. Der Handkuss вижив здебільшого у звороті etwas mit Handkuss annehmen — «прийняти з превеликою охотою».'

  - de: umarmen
    ipa: "ʊmˈʔaʁmən"
    pos: verb
    praesens_3sg: umarmt
    partizip2: umarmt
    aux: haben
    valence: "+ Akk"
    # Recognition only: narrative and greeting-card lexis. A B1 learner produces
    # `in den Arm nehmen` from A1 words, and this verb is what a story uses.
    cards: recognition
    en: to hug, to put both arms around somebody
    ru: обнимать
    uk: обіймати
    example_de: Am Bahnhof umarmte sie ihre Tochter lange.
    example_en: At the station she hugged her daughter for a long time.
    example_ru: На вокзале она долго обнимала дочь.
    example_uk: На вокзалі вона довго обіймала доньку.
    note:
      en: 'An inseparable verb built on der Arm: the prefix um- stays put, the stress falls on the stem, and the Partizip II takes no ge- — er hat sie umarmt. That is the pattern for every inseparable prefix, and um- is one of the few that can go either way, so compare umziehen (separable, to move house), which stresses the prefix and does take ge-. The noun is die Umarmung; the everyday phrase is jemanden in den Arm nehmen.'
      ru: 'Неотделяемый глагол, построенный на der Arm: приставка um- остаётся на месте, ударение падает на корень, а Partizip II обходится без ge- — er hat sie umarmt. Так ведут себя все неотделяемые приставки, а um- — одна из немногих, которая может и так и так: сравните umziehen («переезжать»), отделяемое, с ударением на приставке и с ge-. Существительное — die Umarmung, а обиходный оборот — jemanden in den Arm nehmen.'
      uk: 'Невідокремлюване дієслово, побудоване на der Arm: префікс um- лишається на місці, наголос падає на корінь, а Partizip II обходиться без ge- — er hat sie umarmt. Так поводяться всі невідокремлювані префікси, а um- — один із небагатьох, що може і так, і так: порівняйте umziehen («переїжджати»), відокремлюване, з наголосом на префіксі й із ge-. Іменник — die Umarmung, а побутовий зворот — jemanden in den Arm nehmen.'

  # --- Ehe, Trennung, Scheidung ---
  - de: Ehe
    ipa: "ˈeːə"
    pos: noun
    gender: f
    plural: "die Ehen"
    en: marriage as a state and as an institution
    en_compact: "marriage"
    ru: брак, супружество
    uk: шлюб, подружжя
    example_de: Nach zwanzig Jahren Ehe wollten sie noch einmal groß feiern.
    example_en: After twenty years of marriage they wanted to celebrate in style once more.
    example_ru: После двадцати лет брака они захотели снова отпраздновать с размахом.
    example_uk: Після двадцяти років шлюбу вони захотіли ще раз відсвяткувати з розмахом.
    note:
      en: 'The state, not the ceremony: A2 die Hochzeit is the wedding day, this is the years that follow. Two vowels, two syllables — the h is silent and only lengthens the first e. Its compounds carry a great deal of official German: der Ehepartner, das Ehepaar, der Ehering, der Ehevertrag, and die Ehefrau beside der Ehemann. The verb is heiraten, and eine Ehe schließen is the phrase a registry office uses.'
      ru: 'Состояние, а не церемония: die Hochzeit уровня A2 — день свадьбы, а это годы после. Два гласных, два слога — h не произносится, оно лишь удлиняет первое e. На его составных держится немалая часть официального немецкого: der Ehepartner, das Ehepaar, der Ehering, der Ehevertrag, а также die Ehefrau и der Ehemann. Глагол — heiraten, а eine Ehe schließen — формула загса.'
      uk: 'Стан, а не церемонія: die Hochzeit рівня A2 — день весілля, а це роки після. Два голосні, два склади — h не вимовляється, воно лише подовжує перше e. На його складних словах тримається чимала частина офіційної німецької: der Ehepartner, das Ehepaar, der Ehering, der Ehevertrag, а також die Ehefrau і der Ehemann. Дієслово — heiraten, а eine Ehe schließen — формула РАЦСу.'

  - de: Ehepaar
    ipa: "ˈeːəˌpaːɐ̯"
    pos: noun
    gender: n
    plural: "die Ehepaare"
    # Recognition only: `Ehe` in this same deck and A2 `Paar` (zahlen-masse-a2) are
    # both shipped production cards, and this word is simply the two of them joined —
    # a compound the learner can read off its parts.
    cards: recognition
    en: a married couple
    ru: супружеская пара
    uk: подружня пара
    example_de: Das Ehepaar aus der dritten Etage grüßt immer freundlich.
    example_en: The married couple from the third floor always say hello politely.
    example_ru: Супружеская пара с третьего этажа всегда приветливо здоровается.
    example_uk: Подружня пара з третього поверху завжди привітно вітається.
    note:
      en: 'Ehe plus Paar, and the gender comes from the second element, as it always does in a German compound — das Paar, so das Ehepaar. Stress is on the first part. On an envelope or a guest list it works like a title: Ehepaar Schmidt, or the older Herrn und Frau Schmidt. Without the Ehe- the word is neutral about the paperwork: ein junges Paar may or may not be married, and das Paar also means a pair of shoes.'
      ru: 'Ehe плюс Paar, и род берётся от второго элемента, как всегда в немецком сложном слове: das Paar, значит das Ehepaar. Ударение на первой части. На конверте или в списке гостей работает как титул: Ehepaar Schmidt или более старое Herrn und Frau Schmidt. Без Ehe- слово нейтрально к документам: ein junges Paar может быть и не расписано, а das Paar значит ещё и «пара обуви».'
      uk: 'Ehe плюс Paar, і рід береться від другого елемента, як завжди в німецькому складному слові: das Paar, отже das Ehepaar. Наголос на першій частині. На конверті чи в списку гостей працює як титул: Ehepaar Schmidt або старіше Herrn und Frau Schmidt. Без Ehe- слово нейтральне до документів: ein junges Paar може бути й нерозписане, а das Paar означає ще й «пара взуття».'

  - de: Familienstand
