      en: 'It lives in chunks: Abschied nehmen von jemandem is the written way to say goodbye, zum Abschied marks what happens at that moment, and der Abschied fällt mir schwer says it is hard. The verb is sich verabschieden, and A1 Tschüs is what you actually say. Note the spelling and sound — the b is written but spoken p, because the syllable break falls after ab-. Der Abschiedsbrief and die Abschiedsfeier are its compounds.'
      ru: 'Живёт в оборотах: Abschied nehmen von jemandem — письменный способ попрощаться, zum Abschied помечает то, что происходит в этот миг, а der Abschied fällt mir schwer говорит, что расставание тяжело. Глагол — sich verabschieden, а вслух говорят Tschüs уровня A1. Обратите внимание на написание и звук: b пишется, но произносится как p, потому что слоговая граница проходит после ab-. Составные: der Abschiedsbrief и die Abschiedsfeier.'
      uk: 'Живе у зворотах: Abschied nehmen von jemandem — писемний спосіб попрощатися, zum Abschied позначає те, що відбувається цієї миті, а der Abschied fällt mir schwer каже, що розставання важке. Дієслово — sich verabschieden, а вголос кажуть Tschüs рівня A1. Зверніть увагу на написання і звук: b пишеться, але вимовляється як p, бо складова межа проходить після ab-. Складні слова: der Abschiedsbrief і die Abschiedsfeier.'

  # --- Kinder bekommen und großziehen ---
  - de: Geburt
    ipa: "gəˈbuːɐ̯t"
