      ru: 'Слово анкеты, и четыре ответа важнее самой графы: ledig («холост, не состоял в браке»), verheiratet, geschieden («разведён»), verwitwet («вдовец, вдова»). Заметьте, что ledig — не то же, что Single: первое — юридическое состояние в анкете, второе — образ жизни. В Австрии та же графа называется der Personenstand, в Швейцарии der Zivilstand, и такие расхождения как раз и делает видимыми трёхнациональный словник. Множественного числа нет.'
      uk: 'Слово анкети, і чотири відповіді важливіші за саму графу: ledig («неодружений, не перебував у шлюбі»), verheiratet, geschieden («розлучений»), verwitwet («вдівець, удова»). Зауважте, що ledig — не те саме, що Single: перше — юридичний стан в анкеті, друге — спосіб життя. В Австрії та сама графа зветься der Personenstand, у Швейцарії der Zivilstand, і саме такі розбіжності робить видимими тринаціональний словник. Множини немає.'

  - de: Trennung
    ipa: "ˈtʁɛnʊŋ"
    pos: noun
    gender: f
    plural: "die Trennungen"
    en: a couple splitting up; the act of keeping two things apart
    en_compact: "separation, break-up"
    ru: расставание, разрыв; разделение
    uk: розлучення пари, розрив; розділення
    example_de: Nach der Trennung ist er in eine kleinere Wohnung gezogen.
    example_en: After the break-up he moved into a smaller flat.
    example_ru: После расставания он переехал в квартиру поменьше.
    example_uk: Після розриву він переїхав до меншого помешкання.
    note:
      en: 'The noun of trennen, and it is the step before a Scheidung, not the same thing: a couple can live in Trennung for a year and never divorce at all. German law even counts that year — das Trennungsjahr. Outside relationships the word is neutral and technical: die Mülltrennung is sorting rubbish, die Worttrennung is where a word breaks at the end of a line. The reflexive verb is sich trennen: Sie haben sich letztes Jahr getrennt.'
      ru: 'Существительное от trennen, и это ступень перед Scheidung, а не то же самое: пара может год жить in Trennung и вовсе не развестись. Немецкое право даже считает этот год — das Trennungsjahr. Вне отношений слово нейтрально и технично: die Mülltrennung — сортировка мусора, die Worttrennung — перенос слова в конце строки. Возвратный глагол — sich trennen: Sie haben sich letztes Jahr getrennt.'
      uk: 'Іменник від trennen, і це щабель перед Scheidung, а не те саме: пара може рік жити in Trennung і зовсім не розлучитися. Німецьке право навіть рахує цей рік — das Trennungsjahr. Поза стосунками слово нейтральне й технічне: die Mülltrennung — сортування сміття, die Worttrennung — перенос слова наприкінці рядка. Зворотне дієслово — sich trennen: Sie haben sich letztes Jahr getrennt.'

  - de: getrennt leben
    ipa: "gəˈtʁɛnt ˈleːbn̩"
    pos: phrase
    # Recognition only: a three-word chunk made of two shipped production cards
    # (`trennen` in konsum-umwelt, `leben` in erste-schritte) — a typed prompt could
    # not say which of the several correct renderings was wanted.
    cards: recognition
    en: to live apart while still being married
    ru: жить раздельно (не расторгнув брак)
    uk: жити окремо (не розірвавши шлюб)
    example_de: Die Eltern leben seit zwei Jahren getrennt, sind aber noch verheiratet.
    example_en: The parents have been living apart for two years but are still married.
    example_ru: Родители уже два года живут раздельно, но всё ещё состоят в браке.
    example_uk: Батьки вже два роки живуть окремо, але все ще перебувають у шлюбі.
    note:
      en: 'A legal and administrative state rather than a description of a flat: on a form and in a court it means the marriage is formally in its separation phase. German needs the year of it — das Trennungsjahr — before a divorce can be granted, which is why the phrase turns up so often in official texts. getrennt on its own is simply separately, as in getrennt zahlen at a restaurant table, and that is the everyday use a learner meets first.'
      ru: 'Юридическое и административное состояние, а не описание квартиры: в анкете и в суде это значит, что брак формально находится в стадии раздельного проживания. Немецкому праву нужен год такого проживания — das Trennungsjahr, — прежде чем развод будет оформлен, потому оборот так часто и встречается в официальных текстах. Само getrennt значит просто «раздельно», как в getrennt zahlen за ресторанным столом, и с этим бытовым употреблением учащийся встречается первым.'
      uk: 'Юридичний та адміністративний стан, а не опис помешкання: в анкеті й у суді це означає, що шлюб формально перебуває у стадії роздільного проживання. Німецькому праву потрібен рік такого проживання — das Trennungsjahr, — перш ніж розлучення буде оформлено, тому зворот так часто й трапляється в офіційних текстах. Саме getrennt означає просто «окремо», як у getrennt zahlen за ресторанним столом, і саме з цим побутовим ужитком учень стикається першим.'

  - de: sich scheiden lassen
    ipa: "zɪç ˈʃaɪ̯dn̩ ˈlasn̩"
    pos: phrase
    # Recognition only: a four-part frame whose word order and pronoun a single typed
    # prompt cannot ask for. `Scheidung` below is this deck's production card for the
    # same event.
    cards: recognition
    en: to get divorced
    ru: разводиться, расторгать брак
    uk: розлучатися, розривати шлюб
    example_de: Sie haben sich nach zwei Jahren Trennung scheiden lassen.
    example_en: They got divorced after two years of separation.
    example_ru: Они развелись после двух лет раздельного проживания.
    example_uk: Вони розлучилися після двох років роздільного проживання.
    note:
      en: 'German does not divorce, it has itself divorced: the frame is sich scheiden lassen, with lassen carrying the sense that a court does the deed. In the Perfekt lassen keeps its infinitive form and closes the sentence — Sie haben sich scheiden lassen — which is the same double-infinitive pattern as bei modal verbs. The bare verb scheiden means to part or separate and is otherwise literary. The result is die Scheidung, and the adjective is geschieden.'
      ru: 'Немецкий не разводится, а «даёт себя развести»: конструкция — sich scheiden lassen, где lassen несёт мысль, что дело совершает суд. В Perfekt lassen сохраняет форму инфинитива и закрывает предложение — Sie haben sich scheiden lassen, — та же модель двойного инфинитива, что у модальных глаголов. Голый глагол scheiden значит «разделять, расставаться» и в остальном книжен. Результат — die Scheidung, а прилагательное — geschieden.'
      uk: 'Німецька не розлучається, а «дає себе розлучити»: конструкція — sich scheiden lassen, де lassen несе думку, що справу чинить суд. У Perfekt lassen зберігає форму інфінітива й закриває речення — Sie haben sich scheiden lassen, — та сама модель подвійного інфінітива, що в модальних дієслів. Голе дієслово scheiden означає «розділяти, розлучати» і в решті випадків книжне. Результат — die Scheidung, а прикметник — geschieden.'

  - de: Scheidung
    ipa: "ˈʃaɪ̯dʊŋ"
    pos: noun
    gender: f
    plural: "die Scheidungen"
    en: divorce
    ru: развод, расторжение брака
    uk: розлучення, розірвання шлюбу
    example_de: Nach der Scheidung sind die Kinder bei der Mutter geblieben.
    example_en: After the divorce the children stayed with their mother.
    example_ru: После развода дети остались с матерью.
    example_uk: Після розлучення діти залишилися з матір’ю.
    note:
      en: 'The formal end of a marriage, and the noun a form or a news item uses: die Scheidung einreichen (to file for one), nach der Scheidung, das Scheidungsurteil. It is the last step of the chain Trennung, Trennungsjahr, Scheidung. The adjective geschieden is one of the four answers in the Familienstand box above, and it describes the person: Er ist geschieden. Do not confuse it with die Entscheidung, a decision — the two share a stem and nothing else.'
      ru: 'Формальное окончание брака и то существительное, которым пользуются анкета и новостная заметка: die Scheidung einreichen («подать на развод»), nach der Scheidung, das Scheidungsurteil. Это последняя ступень цепочки Trennung, Trennungsjahr, Scheidung. Прилагательное geschieden — один из четырёх ответов в графе Familienstand выше, и описывает оно человека: Er ist geschieden. Не путать с die Entscheidung («решение»): общий у них только корень.'
      uk: 'Формальне завершення шлюбу і той іменник, яким користуються анкета й новинна замітка: die Scheidung einreichen («подати на розлучення»), nach der Scheidung, das Scheidungsurteil. Це останній щабель ланцюжка Trennung, Trennungsjahr, Scheidung. Прикметник geschieden — одна з чотирьох відповідей у графі Familienstand вище, і описує він людину: Er ist geschieden. Не плутати з die Entscheidung («рішення»): спільний у них лише корінь.'

  - de: Abschied
    ipa: "ˈapʃiːt"
    pos: noun
    gender: m
    plural: "die Abschiede"
    # Recognition only: `sich verabschieden` ("to say goodbye") ships as a production
    # card in verben-kommunikation-ausdruck-b1, and the noun lives only inside fixed
    # phrases whose preposition a one-word prompt cannot ask for.
    cards: recognition
    en: parting, the moment of saying goodbye
    ru: прощание, расставание
    uk: прощання, розставання
    example_de: Der Abschied am Flughafen fiel allen schwer.
    example_en: The goodbye at the airport was hard for everybody.
    example_ru: Прощание в аэропорту далось всем тяжело.
    example_uk: Прощання в аеропорту далося всім важко.
