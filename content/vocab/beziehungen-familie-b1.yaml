      ru: 'Дополнение в Akkusativ для человека, а место — auf + Akkusativ: auf die Wange, auf die Stirn. Возвратно-взаимное sie küssen sich значит «они целуются», и о паре так и говорят. Форма 2-го лица — küsst: основа и так кончается на ss, лишнее s не прибавляется. Родня: der Kuss ниже и старомодное приветствие Küss die Hand, которое ещё слышно в Австрии.'
      uk: 'Додаток у Akkusativ для людини, а місце — auf + Akkusativ: auf die Wange, auf die Stirn. Зворотно-взаємне sie küssen sich означає «вони цілуються», і про пару так і кажуть. Форма 2-ї особи — küsst: основа й так закінчується на ss, зайве s не додається. Рідня: der Kuss нижче й старомодне вітання Küss die Hand, яке ще чути в Австрії.'

  - de: Kuss
    ipa: "ˈkʊs"
    pos: noun
    gender: m
    plural: "die Küsse"
