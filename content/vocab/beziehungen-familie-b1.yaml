      en: 'Built from the plural of alt plus Heim, and it is the shorter of the two spellings the Wortliste lists — Altersheim is the other and means exactly the same. Today the official words are das Seniorenheim and das Pflegeheim, the second for a place with nursing care, and Altenheim now sounds a shade dated. Note the family of Heim words: das Kinderheim, das Studentenheim, das Tierheim, all places where somebody is housed by an institution rather than at home.'
      ru: 'Построено из формы множественного числа alt и слова Heim, и это более короткое из двух написаний, которые даёт Wortliste, — второе Altersheim и значит ровно то же. Сегодня официальные слова — das Seniorenheim и das Pflegeheim (второе о заведении с медицинским уходом), а Altenheim звучит чуть старомодно. Обратите внимание на семью слов с Heim: das Kinderheim, das Studentenheim, das Tierheim — всюду место, где кого-то содержит учреждение, а не дом.'
      uk: 'Побудоване з форми множини alt і слова Heim, і це коротше з двох написань, які подає Wortliste, — друге Altersheim і означає точно те саме. Сьогодні офіційні слова — das Seniorenheim і das Pflegeheim (друге про заклад із медичним доглядом), а Altenheim звучить трохи старомодно. Зверніть увагу на родину слів із Heim: das Kinderheim, das Studentenheim, das Tierheim — усюди місце, де когось утримує установа, а не дім.'

