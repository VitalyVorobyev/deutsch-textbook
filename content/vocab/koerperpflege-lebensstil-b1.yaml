      uk: 'Сильне, з трьома різними кореневими голосними: stinken, stank, hat gestunken. Джерело запаху вводиться через nach з давальним, і безособове es stinkt nach — найчастіша конструкція, точно як у прикладі. riechen рівня A2 з колоди `verben-handlungen-a2-2` нейтральне і потребує прислівника, щоб сказати, чи запах добрий: gut riechen або schlecht riechen; у цьому дієслові оцінка вже вбудована, і воно трохи грубе. Переносно Die Sache stinkt означає «справа нечиста».'

