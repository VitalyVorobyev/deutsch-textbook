      ru: 'Женский род, множественное обычное, и во множественном слово встречается куда чаще, чем в единственном. Это не лекарство: das Medikament уровня A1 из колоды `koerper-gesundheit` и das Rezept уровня A2 из колоды `gesundheit-arzttermin` принадлежат врачу, а это слово — криминальной и медицинской полосе газеты. Сбивающий с толку сосед — die Drogerie, магазин мыла и шампуня, где ничего крепче не продают. Сложные слова: der Drogenhandel, die Drogenberatung, drogenabhängig.'
      uk: 'Жіночий рід, множина звичайна, і в множині слово трапляється куди частіше, ніж в однині. Це не ліки: das Medikament рівня A1 з колоди `koerper-gesundheit` і das Rezept рівня A2 з колоди `gesundheit-arzttermin` належать лікареві, а це слово — кримінальній і медичній шпальті газети. Сусід, що збиває з пантелику, — die Drogerie, крамниця мила й шампуню, де нічого міцнішого не продають. Складні слова: der Drogenhandel, die Drogenberatung, drogenabhängig.'

