    note:
      en: 'An Arabic loan by way of Latin, masculine, with the stress on the first syllable. In the everyday sense it takes no plural at all; die Alkohole belongs to chemistry, where it names a whole class of substances. Alkoholfrei is what a menu prints beside a drink, Alkohol am Steuer is the offence in the example, and A1 das Bier and A1 der Wein in the deck `essen-trinken` are what it comes in. A person for whom it has become die Sucht below is der Alkoholiker or die Alkoholikerin.'
      ru: 'Арабское заимствование через латынь, мужской род, ударение на первом слоге. В обиходном значении множественного нет вовсе; die Alkohole принадлежит химии, где называет целый класс веществ. Alkoholfrei печатают в меню рядом с напитком, Alkohol am Steuer — это то нарушение, о котором пример, а das Bier и der Wein уровня A1 из колоды `essen-trinken` — то, в чём он к нам приходит. Тот, для кого это стало die Sucht ниже, — der Alkoholiker или die Alkoholikerin.'
      uk: 'Арабське запозичення через латину, чоловічий рід, наголос на першому складі. У побутовому значенні множини немає зовсім; die Alkohole належить хімії, де називає цілий клас речовин. Alkoholfrei друкують у меню поряд із напоєм, Alkohol am Steuer — це те порушення, про яке приклад, а das Bier і der Wein рівня A1 з колоди `essen-trinken` — те, у чому він до нас приходить. Той, для кого це стало die Sucht нижче, — der Alkoholiker або die Alkoholikerin.'

