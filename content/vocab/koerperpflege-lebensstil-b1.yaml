    ru: настолько сильная потребность в чём-либо, что человек не может остановиться, даже когда хочет
    uk: настільки сильна потреба в чомусь, що людина не може спинитися, навіть коли хоче
    example_de: Aus der Gewohnheit ist mit den Jahren eine Sucht geworden.
    example_en: Over the years the habit turned into an addiction.
    example_ru: С годами привычка превратилась в зависимость.
    example_uk: З роками звичка перетворилася на залежність.
    note:
      en: 'Feminine, umlaut in the plural, and despite the look it has nothing to do with suchen: it goes back to siech, meaning ill. What the person is addicted to stands in front as a compound: die Alkoholsucht, die Spielsucht, die Magersucht. B1 die Gewohnheit in the deck `gesundheit-wohlbefinden` is the harmless stage the example moves away from. The adjective is süchtig below and the whole class of substances is das Suchtmittel, two entries down.'
      ru: 'Женский род, во множественном умлаут, и вопреки внешнему сходству к suchen слово отношения не имеет: оно восходит к siech — «больной». То, к чему возникла зависимость, ставится впереди сложным словом: die Alkoholsucht, die Spielsucht, die Magersucht. die Gewohnheit уровня B1 из колоды `gesundheit-wohlbefinden` — та безобидная ступень, от которой пример уходит. Прилагательное — süchtig ниже, а весь класс веществ — das Suchtmittel через одну запись.'
      uk: 'Жіночий рід, у множині умлаут, і всупереч зовнішній схожості до suchen слово стосунку не має: воно сходить до siech — «хворий». Те, до чого виникла залежність, ставиться попереду складним словом: die Alkoholsucht, die Spielsucht, die Magersucht. die Gewohnheit рівня B1 з колоди `gesundheit-wohlbefinden` — той безневинний щабель, від якого приклад іде. Прикметник — süchtig нижче, а весь клас речовин — das Suchtmittel через один запис.'

  - de: süchtig
    ipa: "ˈzʏçtɪç"
    pos: adj
    cards: recognition
    en: no longer able to stop needing something, once the need has taken hold
    ru: уже не способный перестать нуждаться в чём-либо, когда потребность взяла своё
    uk: уже не здатний перестати потребувати чогось, коли потреба взяла своє
    example_de: Man kann auch nach Zucker süchtig werden.
    example_en: You can become addicted to sugar too.
    example_ru: Зависимость может возникнуть и от сахара.
    example_uk: Залежність може виникнути і від цукру.
    note:
      en: 'Die Sucht above with an umlaut and -ig, and both ch are the soft ç. What the person is addicted to follows nach plus the dative, as in the example, while the ordinary alternative wording is abhängig von plus the dative. As the second half of a compound it is everywhere: drogensüchtig, spielsüchtig, arbeitssüchtig. Loose speech has weakened it to mean merely very keen on something, which is why a serious text prefers abhängig.'
      ru: 'Die Sucht выше с умлаутом и -ig, оба ch мягкие ç. Предмет зависимости вводится через nach с дательным, как в примере, а обычная замена — abhängig von с дательным. Второй частью сложного слова оно встречается повсюду: drogensüchtig, spielsüchtig, arbeitssüchtig. В небрежной речи слово ослабло до «страстно увлечённый», поэтому серьёзный текст предпочитает abhängig.'
      uk: 'Die Sucht вище з умлаутом і -ig, обидва ch м’які ç. Предмет залежності вводиться через nach з давальним, як у прикладі, а звичайна заміна — abhängig von з давальним. Другою частиною складного слова воно трапляється всюди: drogensüchtig, spielsüchtig, arbeitssüchtig. У недбалому мовленні слово ослабло до «пристрасно захоплений», тому серйозний текст воліє abhängig.'

  - de: Suchtmittel
    ipa: "ˈzʊxtˌmɪtl̩"
    pos: noun
    gender: n
    plural: "die Suchtmittel"
    cards: recognition
    en: any substance that can leave a person unable to stop taking it
    ru: любое вещество, из-за которого человек теряет способность остановиться
    uk: будь-яка речовина, через яку людина втрачає здатність спинитися
    example_de: Alkohol ist das Suchtmittel, das am leichtesten zu bekommen ist.
    example_en: Alcohol is the addictive substance that is easiest to get hold of.
    example_ru: Алкоголь — то вещество, вызывающее зависимость, которое достать легче всего.
    example_uk: Алкоголь — та речовина, що викликає залежність, яку дістати найлегше.
    note:
      en: 'Die Sucht above plus das Mittel, with the main stress on Sucht-, neuter after its second half, and singular and plural spelled alike. It belongs to health policy and prevention rather than to conversation: it gathers Alkohol, Zigaretten and Drogen, all above, under one heading, which is exactly what a leaflet and a school lesson need. Around it die Suchtberatung is where a person goes for help and die Prävention is what a campaign does.'
      ru: 'Die Sucht выше плюс das Mittel, главное ударение на Sucht-, род средний по второй половине, единственное и множественное пишутся одинаково. Слово принадлежит здравоохранительной политике и профилактике, а не разговору: оно собирает Alkohol, Zigaretten и Drogen — всё выше — под одну шапку, что и нужно листовке и школьному уроку. Рядом die Suchtberatung — куда идут за помощью, а die Prävention — то, чем занята кампания.'
      uk: 'Die Sucht вище плюс das Mittel, головний наголос на Sucht-, рід середній за другою половиною, однина і множина пишуться однаково. Слово належить політиці охорони здоров’я і профілактиці, а не розмові: воно збирає Alkohol, Zigaretten і Drogen — усе вище — під одну шапку, що й потрібно летючці та шкільному урокові. Поряд die Suchtberatung — куди йдуть по допомогу, а die Prävention — те, чим зайнята кампанія.'

  # --- Gesund leben ---
  - de: Vitamin
    ipa: "vitaˈmiːn"
    pos: noun
    gender: n
    plural: "die Vitamine"
    cards: recognition
    en: one of the substances a body needs in small amounts and gets from its food
    ru: одно из веществ, которые организму нужны в малых количествах и которые он получает с пищей
    uk: одна з речовин, потрібних організмові в малих кількостях і які він дістає з їжею
    example_de: Frisches Obst hat mehr Vitamine als Saft.
    example_en: Fresh fruit has more vitamins than juice.
    example_ru: В свежих фруктах больше витаминов, чем в соке.
    example_uk: У свіжих фруктах більше вітамінів, ніж у соку.
    note:
      en: 'Neuter, stressed on the last syllable, ordinary plural. The letter after it is read the German way, so Vitamin C ends in the sound tseː and not in the English see. B1 ernähren in the deck `koerper-medizin-b1` and B1 die Ernährung in the deck `gesundheit-wohlbefinden` are the field it belongs to, and A1 das Obst in the deck `essen-trinken` is where the example finds it. A pill of it is die Vitamintablette, and vitaminreich is what a label claims.'
      ru: 'Средний род, ударение на последнем слоге, множественное обычное. Буква после слова читается по-немецки, поэтому Vitamin C оканчивается звуком tseː, а не английским «си». ernähren уровня B1 из колоды `koerper-medizin-b1` и die Ernährung уровня B1 из колоды `gesundheit-wohlbefinden` — поле, к которому слово принадлежит, а das Obst уровня A1 из колоды `essen-trinken` — то, где его находит пример. Таблетка — die Vitamintablette, а vitaminreich заявляет этикетка.'
      uk: 'Середній рід, наголос на останньому складі, множина звичайна. Літера після слова читається по-німецьки, тому Vitamin C закінчується звуком tseː, а не англійським «сі». ernähren рівня B1 з колоди `koerper-medizin-b1` і die Ernährung рівня B1 з колоди `gesundheit-wohlbefinden` — поле, до якого слово належить, а das Obst рівня A1 з колоди `essen-trinken` — те, де його знаходить приклад. Пігулка — die Vitamintablette, а vitaminreich заявляє етикетка.'

  - de: bio
    ipa: "ˈbiːo"
    pos: adj
    cards: recognition
    en: grown or made without chemical fertiliser and pesticide, and certified as such
    ru: выращенный или произведённый без химических удобрений и пестицидов и имеющий на это сертификат
    uk: вирощений або вироблений без хімічних добрив і пестицидів і сертифікований як такий
    example_de: Diese Eier sind bio, die anderen nicht.
    example_en: These eggs are organic, the others are not.
    example_ru: Эти яйца органические, а те нет.
    example_uk: Ці яйця органічні, а ті ні.
    note:
      en: 'Indeclinable and mostly predicative, so German says Das ist bio and Diese Eier sind bio, but puts the word in front of a noun only as a prefix: der Bioladen, die Biomilch, das Biogemüse. That prefix is where a learner meets it most, and the term is legally protected in the European Union, so a package may not carry it without certification. The longer adjective biologisch means the same on a package and something quite different in a laboratory, and Bio at school is the subject Biologie.'
      ru: 'Несклоняемое и по преимуществу предикативное: немец говорит Das ist bio и Diese Eier sind bio, а перед существительным ставит слово только как приставку — der Bioladen, die Biomilch, das Biogemüse. Именно в этой приставке учащийся встретит его чаще всего, а сам термин защищён законом Европейского союза, так что без сертификата упаковка носить его не вправе. Более длинное прилагательное biologisch на упаковке значит то же самое, а в лаборатории совсем другое, тогда как Bio в школе — предмет Biologie.'
      uk: 'Невідмінюване і переважно предикативне: німець каже Das ist bio і Diese Eier sind bio, а перед іменником ставить слово лише як префікс — der Bioladen, die Biomilch, das Biogemüse. Саме в цьому префіксі учень зустріне його найчастіше, а сам термін захищений законом Європейського Союзу, тож без сертифіката паковання носити його не вправі. Довший прикметник biologisch на пакованні означає те саме, а в лабораторії зовсім інше, тоді як Bio у школі — предмет Biologie.'
