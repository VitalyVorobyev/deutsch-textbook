    uk: бути вдягненим у щось
    example_de: Sie hat heute ein rotes Kleid an.
    example_en: She has a red dress on today.
    example_ru: На ней сегодня красное платье.
    example_uk: На ній сьогодні червона сукня.
    note:
      en: 'Separable, so the an goes to the end of the clause: sie hat ein Kleid an, sie hat ein Kleid angehabt. It names the state, and it needs a garment beside it, which is why there is no bare sie hat an. A1 tragen in the deck `kleidung-farben` says the same thing in a more neutral register and also covers carrying; A1 anziehen in the same deck is the act of putting the garment on. In the negative the verb has a second, idiomatic life: Das kann mir nichts anhaben, meaning it cannot touch me.'
      ru: 'Отделяемый, поэтому an уходит в конец: sie hat ein Kleid an, sie hat ein Kleid angehabt. Слово называет состояние и требует рядом названия одежды — потому голого sie hat an не бывает. tragen уровня A1 из колоды `kleidung-farben` говорит то же нейтральнее и покрывает ещё и «нести»; anziehen из той же колоды — само действие надевания. В отрицании у глагола есть вторая, идиоматическая жизнь: Das kann mir nichts anhaben — «мне это нипочём».'
      uk: 'Відокремлюване, тому an іде в кінець: sie hat ein Kleid an, sie hat ein Kleid angehabt. Слово називає стан і потребує поряд назви одягу — тому голого sie hat an не буває. tragen рівня A1 з колоди `kleidung-farben` каже те саме нейтральніше і покриває ще й «нести»; anziehen з тієї самої колоди — сама дія вдягання. У запереченні дієслово має друге, ідіоматичне життя: Das kann mir nichts anhaben — «мені це байдуже».'

