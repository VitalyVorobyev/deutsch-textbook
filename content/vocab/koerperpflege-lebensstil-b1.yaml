    ru: 'мужчина, который не курит: так его называют табличка и анкета'
    uk: 'чоловік, який не курить: так його називають табличка й анкета'
    example_de: Der Tisch am Fenster ist für Nichtraucher.
    example_en: The table by the window is for non-smokers.
    example_ru: Столик у окна для некурящих.
    example_uk: Столик біля вікна для тих, хто не курить.
    note:
      en: 'Nicht plus Raucher above, written as one word, with the main stress on Nicht- and a secondary one on -rau-. German builds a fair number of nouns this way, der Nichtschwimmer and das Nichtraucherabteil among them, and the negation belongs to the noun rather than to the sentence, which is why nicht cannot stand apart here. On a door and a timetable the word appears without an article at all: Nichtraucher, Nichtraucherzone, Nichtraucherschutz. The feminine is die Nichtraucherin, the next entry.'
      ru: 'Nicht плюс Raucher выше, написанные одним словом, главное ударение на Nicht-, побочное на -rau-. Немецкий строит так немало существительных — der Nichtschwimmer, das Nichtraucherabteil, — и отрицание принадлежит существительному, а не предложению, поэтому отдельно nicht здесь стоять не может. На двери и в расписании слово идёт вовсе без артикля: Nichtraucher, Nichtraucherzone, Nichtraucherschutz. Женская пара — die Nichtraucherin, следующая запись.'
      uk: 'Nicht плюс Raucher вище, написані одним словом, головний наголос на Nicht-, побічний на -rau-. Німецька будує так чимало іменників — der Nichtschwimmer, das Nichtraucherabteil, — і заперечення належить іменникові, а не реченню, тому окремо nicht тут стояти не може. На дверях і в розкладі слово йде зовсім без артикля: Nichtraucher, Nichtraucherzone, Nichtraucherschutz. Жіноча пара — die Nichtraucherin, наступний запис.'

