      ru: 'Обычное мовирование на -in, во множественном n удваивается, ударение остаётся там же, где в Nichtraucher выше. Пример показывает единственное место, где женская форма и вправду нужна: женщина говорит так о себе, — и заметьте, что немецкий обходится без артикля, Ich bin Nichtraucherin, ровно как с названием профессии. Табличка держит мужскую форму или множественное, а бланк обычно предлагает нейтральное Nichtraucherbereich.'
