# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the body-care and
# lifestyle field of data/goethe-b1-wortliste.txt: what a person does to himself in
# front of the mirror every morning, what he is judged to look like afterwards, and
# the vocabulary a health leaflet uses for smoking, drinking and the point at which a
# habit stops being one. This is the German of a chemist's shelf, a hotel form and the
# health page of a newspaper.
# A2's `koerper-pflege-a2` owns der Körper, die Seife, die Dusche, das Handtuch,
# die Creme, das Gesicht and rauchen, A1's `koerper-gesundheit` owns der Zahn, die
# Gesundheit and das Medikament, A1's `alltag-a1-ergaenzung` owns putzen and duschen,
# A2's `berufe-a2` owns der Friseur and die Friseurin, B1's `koerper-medizin-b1` owns
# der Bart, die Haut, die Lippe, die Diät and ernähren, B1's `gesundheit-wohlbefinden`
# owns die Ernährung and die Gewohnheit, A2's `charakter-eigenschaften-a2` owns dick
# and dünn, and B1's `haushalt-notfall-b1` owns die Bürste, das Feuerzeug and das
# Streichholz. This deck is what those eight leave unnamed: the act, the tube it comes
# out of, the word for the person with the habit, and the word for the habit that has
# stopped being one.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read, never written: the learner says Ich putze mir die Zähne out of A1 and A2 words,
# and everything here is what the packaging, the sign on the door and the leaflet in
# the waiting room say back at him.
id: koerperpflege-lebensstil-b1
title_de: "Körperpflege und Lebensstil"
title_en: "Personal care and lifestyle"
title_ru: "Уход за собой и образ жизни"
title_uk: "Догляд за собою і спосіб життя"
level: B1
entries:
  # --- Sich pflegen ---
  - de: pflegen
    ipa: "ˈpfleːgn̩"
    pos: verb
    praesens_3sg: pflegt
    partizip2: gepflegt
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to look after somebody or something regularly so that it stays in good condition
    ru: регулярно ухаживать за кем-либо или чем-либо, чтобы оно оставалось в порядке
    uk: регулярно доглядати когось або щось, щоб воно лишалося в порядку
    example_de: Sie pflegt ihre Mutter seit drei Jahren zu Hause.
    example_en: She has been caring for her mother at home for three years.
    example_ru: Она уже три года ухаживает за матерью дома.
    example_uk: Вона вже три роки доглядає матір удома.
    note:
      en: 'Weak, and it takes a plain accusative object where English needs a preposition: she cares FOR her mother, but sie pflegt ihre Mutter. The nursing sense gives the professions B1 der Pfleger and die Pflegerin in the deck `berufe-b1`, and the noun die Pflege covers a person and a thing alike: die Hautpflege, die Zahnpflege, die Altenpflege. A2 sich kümmern in the deck `gefuehle-reflexive-a2` needs um plus the accusative and means seeing that something gets done, while this verb is the doing. The participle works as an adjective: eine gepflegte Wohnung.'
      ru: 'Слабый, и управляет он прямым дополнением в винительном там, где русский требует предлога: «ухаживать ЗА матерью», но sie pflegt ihre Mutter, без всякого предлога. Значение ухода за больными даёт профессии der Pfleger и die Pflegerin уровня B1 из колоды `berufe-b1`, а существительное die Pflege покрывает и человека, и вещь: die Hautpflege, die Zahnpflege, die Altenpflege. sich kümmern уровня A2 из колоды `gefuehle-reflexive-a2` требует um с винительным и значит «позаботиться, чтобы дело было сделано», а этот глагол — само делание. Причастие работает прилагательным: eine gepflegte Wohnung.'
      uk: 'Слабке, і керує воно прямим додатком у знахідному там, де українська потребує прийменника: «доглядати ЗА матір’ю» або «доглядати матір», але німецька знає лише другий спосіб: sie pflegt ihre Mutter. Значення догляду за хворими дає професії der Pfleger і die Pflegerin рівня B1 з колоди `berufe-b1`, а іменник die Pflege покриває і людину, і річ: die Hautpflege, die Zahnpflege, die Altenpflege. sich kümmern рівня A2 з колоди `gefuehle-reflexive-a2` потребує um зі знахідним і означає «подбати, щоб справу було зроблено», а це дієслово — саме робіння. Дієприкметник працює прикметником: eine gepflegte Wohnung.'

  - de: rasieren
    ipa: "ʁaˈziːʁən"
    pos: verb
    praesens_3sg: rasiert
    partizip2: rasiert
    aux: haben
    valence: "+ Akk / sich"
    cards: recognition
    en: to take hair off the skin with a blade
    ru: снимать волосы с кожи лезвием
    uk: знімати волосся зі шкіри лезом
    example_de: Er rasiert sich jeden Morgen vor dem Frühstück.
    example_en: He shaves every morning before breakfast.
    example_ru: Он бреется каждое утро перед завтраком.
    example_uk: Він голиться щоранку перед сніданком.
    note:
      en: 'Weak and inseparable, so there is no ge- in the participle: hat rasiert. It works both ways round, which is why the Wortliste prints it as (sich) rasieren: sich rasieren is what a person does to himself, jemanden rasieren is what a barber does, and den Bart rasieren names the thing removed. B1 der Bart in the deck `koerper-medizin-b1` is usually what goes; the tool is der Rasierer or der Rasierapparat and the foam der Rasierschaum. Schminken below is declared the same way and for the same reason.'
      ru: 'Слабый и неотделяемый, поэтому в причастии нет ge-: hat rasiert. Глагол работает в обе стороны, потому Wortliste и печатает его как (sich) rasieren: sich rasieren — то, что человек делает с собой, jemanden rasieren — то, что делает парикмахер, а den Bart rasieren называет удаляемое. der Bart уровня B1 из колоды `koerper-medizin-b1` — обычно то, что сбривают; прибор — der Rasierer или der Rasierapparat, пена — der Rasierschaum. Schminken ниже описан так же и по той же причине.'
      uk: 'Слабке і невідокремлюване, тому в дієприкметнику немає ge-: hat rasiert. Дієслово працює в обидва боки, тому Wortliste і друкує його як (sich) rasieren: sich rasieren — те, що людина робить із собою, jemanden rasieren — те, що робить перукар, а den Bart rasieren називає те, що зголюють. der Bart рівня B1 з колоди `koerper-medizin-b1` — зазвичай те, що йде геть; прилад — der Rasierer або der Rasierapparat, піна — der Rasierschaum. Schminken нижче описано так само і з тієї самої причини.'

  - de: schminken
    ipa: "ˈʃmɪŋkn̩"
    pos: verb
    praesens_3sg: schminkt
    partizip2: geschminkt
    aux: haben
    valence: "+ Akk / sich"
    cards: recognition
    en: to put colour on a face to change the way it looks
    ru: наносить краску на лицо, чтобы изменить его вид
    uk: наносити фарбу на обличчя, щоб змінити його вигляд
    example_de: Sie schminkt sich nur, wenn sie ausgeht.
    example_en: She only puts make-up on when she is going out.
    example_ru: Она красится, только когда куда-нибудь идёт.
    example_uk: Вона фарбується, тільки коли кудись іде.
    note:
      en: 'Weak, and the nk is ŋ plus k. Like rasieren above it is reflexive and transitive at once: sich schminken is the daily one, jemanden schminken is what a theatre does before the curtain goes up, and die Augen schminken names the part. The stuff itself is die Schminke, or, far more often today, das Make-up; A2 das Gesicht in the deck `koerper-pflege-a2` is where it goes and A2 die Creme in the same deck is what comes off with it. The participle serves as an adjective: stark geschminkt.'
      ru: 'Слабый, nk звучит как ŋ плюс k. Как и rasieren выше, он разом возвратный и переходный: sich schminken — ежедневное, jemanden schminken — то, что делают в театре перед выходом, а die Augen schminken называет часть лица. Само вещество — die Schminke или, куда чаще сегодня, das Make-up; das Gesicht уровня A2 из колоды `koerper-pflege-a2` — то, на что наносят, а die Creme из той же колоды — то, чем снимают. Причастие служит прилагательным: stark geschminkt.'
      uk: 'Слабке, nk звучить як ŋ плюс k. Як і rasieren вище, воно водночас зворотне і перехідне: sich schminken — щоденне, jemanden schminken — те, що роблять у театрі перед виходом, а die Augen schminken називає частину обличчя. Сама речовина — die Schminke або, куди частіше сьогодні, das Make-up; das Gesicht рівня A2 з колоди `koerper-pflege-a2` — те, на що наносять, а die Creme з тієї самої колоди — те, чим знімають. Дієприкметник служить прикметником: stark geschminkt.'

  - de: Frisur
    ipa: "fʁiˈzuːɐ̯"
    pos: noun
    gender: f
    plural: "die Frisuren"
    cards: recognition
    en: the way somebody's hair has been cut and arranged
    ru: то, как подстрижены и уложены волосы
    uk: те, як підстрижене й укладене волосся
    example_de: Deine neue Frisur steht dir wirklich gut.
    example_en: Your new hairstyle really suits you.
    example_ru: Новая причёска тебе очень идёт.
    example_uk: Нова зачіска тобі дуже пасує.
    note:
      en: 'A French loan stressed on the last syllable, feminine, plural in -en. It is the result rather than the hair: A1 die Haare in the deck `menschen-familie` is what a person has, and this is what has been done with it. Who does it is A2 der Friseur and die Friseurin in the deck `berufe-a2`, and the verb frisieren is used far less than the noun. Chunks: eine neue Frisur, zum Friseur gehen, sich die Haare schneiden lassen.'
      ru: 'Французское заимствование с ударением на последнем слоге, женский род, множественное на -en. Это результат, а не сами волосы: die Haare уровня A1 из колоды `menschen-familie` — то, что у человека есть, а здесь — то, что с этим сделали. Делает это der Friseur и die Friseurin уровня A2 из колоды `berufe-a2`, а глагол frisieren употребляется куда реже существительного. Обороты: eine neue Frisur, zum Friseur gehen, sich die Haare schneiden lassen.'
      uk: 'Французьке запозичення з наголосом на останньому складі, жіночий рід, множина на -en. Це результат, а не саме волосся: die Haare рівня A1 з колоди `menschen-familie` — те, що людина має, а тут — те, що з цим зробили. Робить це der Friseur і die Friseurin рівня A2 з колоди `berufe-a2`, а дієслово frisieren вживається куди рідше за іменник. Звороти: eine neue Frisur, zum Friseur gehen, sich die Haare schneiden lassen.'

  - de: Zahnbürste
    ipa: "ˈtsaːnˌbʏʁstə"
    pos: noun
    gender: f
    plural: "die Zahnbürsten"
    cards: recognition
    en: the small brush a person cleans their teeth with
    ru: маленькая щётка, которой чистят зубы
    uk: маленька щітка, якою чистять зуби
    example_de: Meine Zahnbürste ist alt, ich brauche eine neue.
    example_en: My toothbrush is old, I need a new one.
    example_ru: Моя зубная щётка старая, нужна новая.
    example_uk: Моя зубна щітка стара, потрібна нова.
    note:
      en: 'A1 der Zahn in the deck `koerper-gesundheit` plus B1 die Bürste in the deck `haushalt-notfall-b1`, with the main stress on Zahn- and a secondary one on Bür-. The daily chunk uses A1 putzen in the deck `alltag-a1-ergaenzung` and puts the teeth in the accusative with the person in the dative: sich die Zähne putzen, ich putze mir die Zähne. The powered kind is die elektrische Zahnbürste; what goes on it is Zahnpasta or Zahncreme, the next two entries.'
      ru: 'der Zahn уровня A1 из колоды `koerper-gesundheit` плюс die Bürste уровня B1 из колоды `haushalt-notfall-b1`, главное ударение на Zahn-, побочное на Bür-. Ежедневный оборот берёт putzen уровня A1 из колоды `alltag-a1-ergaenzung` и ставит зубы в винительный, а человека в дательный: sich die Zähne putzen, ich putze mir die Zähne. Электрическая — die elektrische Zahnbürste; то, что на неё выдавливают, — Zahnpasta или Zahncreme, две следующие записи.'
      uk: 'der Zahn рівня A1 з колоди `koerper-gesundheit` плюс die Bürste рівня B1 з колоди `haushalt-notfall-b1`, головний наголос на Zahn-, побічний на Bür-. Щоденний зворот бере putzen рівня A1 з колоди `alltag-a1-ergaenzung` і ставить зуби у знахідний, а людину в давальний: sich die Zähne putzen, ich putze mir die Zähne. Електрична — die elektrische Zahnbürste; те, що на неї видавлюють, — Zahnpasta або Zahncreme, два наступні записи.'

  - de: Zahnpasta
    ipa: "ˈtsaːnˌpasta"
    pos: noun
    gender: f
    plural: "die Zahnpasten"
    cards: recognition
    en: the paste squeezed out of a tube to clean teeth with
    ru: паста, которую выдавливают из тюбика, чтобы чистить зубы
    uk: паста, яку видавлюють із тюбика, щоб чистити зуби
    example_de: Die Zahnpasta ist fast leer.
    example_en: The toothpaste is nearly finished.
    example_ru: Зубная паста почти кончилась.
    example_uk: Зубна паста майже скінчилася.
    note:
      en: 'From Italian pasta, feminine, and the plural swaps the ending for -en: die Zahnpasten. Nobody counts it in a bathroom, so that plural belongs to a shelf and a price list. Zahncreme, the next entry, means the same thing, and a German supermarket carries both words without any difference in the product; the Wortliste lists the two of them one after the other for that reason. The tube is die Tube, and it is used with die Zahnbürste above.'
      ru: 'От итальянского pasta, женский род, а во множественном окончание меняется на -en: die Zahnpasten. В ванной никто её не считает, поэтому множественное принадлежит полке магазина и прайс-листу. Zahncreme, следующая запись, значит то же самое, и немецкий супермаркет держит оба слова без всякой разницы в товаре; Wortliste и перечисляет их подряд именно поэтому. Тюбик — die Tube, а пользуются пастой вместе с die Zahnbürste выше.'
      uk: 'Від італійського pasta, жіночий рід, а в множині закінчення міняється на -en: die Zahnpasten. У ванній ніхто її не рахує, тому множина належить полиці крамниці й прайс-листу. Zahncreme, наступний запис, означає те саме, і німецький супермаркет тримає обидва слова без жодної різниці в товарі; Wortliste і перелічує їх поспіль саме тому. Тюбик — die Tube, а користуються пастою разом із die Zahnbürste вище.'

  - de: Zahncreme
    ipa: "ˈtsaːnˌkʁeːm"
    pos: noun
    gender: f
    plural: "die Zahncremes"
    cards: recognition
    en: the same paste for cleaning teeth, named as a cream instead of a paste
    ru: та же паста для чистки зубов, названная кремом, а не пастой
    uk: та сама паста для чищення зубів, названа кремом, а не пастою
    example_de: Diese Zahncreme schmeckt stark nach Minze.
    example_en: This toothpaste tastes strongly of mint.
    example_ru: Эта зубная паста сильно отдаёт мятой.
    example_uk: Ця зубна паста сильно віддає м’ятою.
    note:
      en: 'A2 die Creme in the deck `koerper-pflege-a2` compounded with A1 der Zahn, spoken kʁeːm with no vowel at the end, and the plural adds -s. It is the near twin of Zahnpasta above, and which one appears on a tube is a matter of the brand''s habit rather than of the substance, so a learner needs to recognise both and may produce either. In Switzerland the plural die Cremen also occurs, and Germany writes Creme where French writes crème.'
      ru: 'die Creme уровня A2 из колоды `koerper-pflege-a2` в сложении с der Zahn уровня A1, произносится kʁeːm без гласного на конце, множественное прибавляет -s. Это близнец Zahnpasta выше, и какое из двух слов стоит на тюбике, решает привычка марки, а не состав, — значит, узнавать нужно оба, а называть можно любое. В Швейцарии встречается и множественное die Cremen, а Германия пишет Creme там, где французский пишет crème.'
      uk: 'die Creme рівня A2 з колоди `koerper-pflege-a2` у складенні з der Zahn рівня A1, вимовляється kʁeːm без голосного в кінці, множина додає -s. Це близнюк Zahnpasta вище, і яке з двох слів стоїть на тюбику, вирішує звичка марки, а не склад, — отже, упізнавати треба обидва, а називати можна будь-яке. У Швейцарії трапляється й множина die Cremen, а Німеччина пише Creme там, де французька пише crème.'

  # --- Wie jemand aussieht ---
  - de: hübsch
    ipa: "ˈhʏpʃ"
    pos: adj
    cards: recognition
    en: pleasant to look at, in a light and friendly way rather than a grand one
    ru: приятный на вид, скорее мило и по-домашнему, чем величественно
    uk: приємний на вигляд, радше мило й по-домашньому, ніж велично
    example_de: Sie haben eine hübsche kleine Wohnung.
    example_en: They have a pretty little flat.
    example_ru: У них милая маленькая квартира.
    example_uk: У них мила маленька квартира.
    note:
      en: 'The b before sch is spoken p. It sits a step below A1 schön in the deck `wohnen`: schön can be said of anything from a face to a symphony, while hübsch stays small and warm, and of a man it is used far less than of a woman or a thing. It works on places and objects too, as the example shows. In front of a number it means considerable, with a touch of irony: eine hübsche Summe, ein hübsches Stück Arbeit.'
      ru: 'B перед sch звучит как p. Слово стоит ступенью ниже, чем schön уровня A1 из колоды `wohnen`: schön говорят обо всём, от лица до симфонии, а hübsch остаётся маленьким и тёплым, и о мужчине его употребляют куда реже, чем о женщине или о вещи. О местах и предметах работает тоже, как в примере. Перед числом значит «изрядный», с оттенком иронии: eine hübsche Summe, ein hübsches Stück Arbeit.'
      uk: 'B перед sch звучить як p. Слово стоїть щаблем нижче, ніж schön рівня A1 з колоди `wohnen`: schön кажуть про все, від обличчя до симфонії, а hübsch лишається маленьким і теплим, і про чоловіка його вживають куди рідше, ніж про жінку чи про річ. Про місця й предмети працює теж, як у прикладі. Перед числом означає «неабиякий», з відтінком іронії: eine hübsche Summe, ein hübsches Stück Arbeit.'

  - de: schlank
    ipa: "ˈʃlaŋk"
    pos: adj
    cards: recognition
    en: thin in a way that is meant as a compliment
    ru: худощавый так, что это звучит похвалой
    uk: худорлявий так, що це звучить похвалою
    example_de: Seit dem Sommer ist er deutlich schlanker geworden.
    example_en: He has become noticeably slimmer since the summer.
    example_ru: С лета он заметно похудел.
    example_uk: Від літа він помітно схуднув.
    note:
      en: 'The nk is ŋ plus k. Of a person it is the polite word: A2 dünn in the deck `charakter-eigenschaften-a2` can sound like a diagnosis and A2 dick in the same deck is blunt. The verbs for the change are A2 abnehmen and zunehmen in the deck `infinitiv-mit-zu`, and the field around it is B1 die Ernährung in the deck `gesundheit-wohlbefinden`, B1 die Diät in the deck `koerper-medizin-b1` and B1 die Fitness in the deck `sport-freizeit-b1`. Business German borrowed the word for schlanke Strukturen, meaning lean ones.'
      ru: 'Nk звучит как ŋ плюс k. О человеке это вежливое слово: dünn уровня A2 из колоды `charakter-eigenschaften-a2` может прозвучать как диагноз, а dick из той же колоды прямолинейно. Глаголы перемены — abnehmen и zunehmen уровня A2 из колоды `infinitiv-mit-zu`, а поле вокруг — die Ernährung уровня B1 из колоды `gesundheit-wohlbefinden`, die Diät уровня B1 из колоды `koerper-medizin-b1` и die Fitness уровня B1 из колоды `sport-freizeit-b1`. Деловой немецкий позаимствовал слово для schlanke Strukturen — «облегчённые структуры».'
      uk: 'Nk звучить як ŋ плюс k. Про людину це ввічливе слово: dünn рівня A2 з колоди `charakter-eigenschaften-a2` може прозвучати як діагноз, а dick із тієї самої колоди прямолінійне. Дієслова зміни — abnehmen і zunehmen рівня A2 з колоди `infinitiv-mit-zu`, а поле навколо — die Ernährung рівня B1 з колоди `gesundheit-wohlbefinden`, die Diät рівня B1 з колоди `koerper-medizin-b1` і die Fitness рівня B1 з колоди `sport-freizeit-b1`. Ділова німецька запозичила слово для schlanke Strukturen — «полегшені структури».'

  - de: anhaben
    ipa: "ˈanˌhaːbn̩"
