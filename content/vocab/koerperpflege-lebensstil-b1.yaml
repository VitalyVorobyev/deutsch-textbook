      en: 'A French loan stressed on the -re-, feminine, ordinary plural. The verb is A2 rauchen in the deck `koerper-pflege-a2`, and eine Zigarette rauchen is the full chunk. What lights it is B1 das Feuerzeug or B1 das Streichholz in the deck `haushalt-notfall-b1`. A packet is eine Schachtel Zigaretten, and the people who do and do not are Raucher and Nichtraucher below. The tobacco itself is der Tabak.'
      ru: 'Французское заимствование с ударением на -re-, женский род, множественное обычное. Глагол — rauchen уровня A2 из колоды `koerper-pflege-a2`, а полный оборот — eine Zigarette rauchen. Поджигают её das Feuerzeug или das Streichholz уровня B1 из колоды `haushalt-notfall-b1`. Пачка — eine Schachtel Zigaretten, а те, кто курит и не курит, — Raucher и Nichtraucher ниже. Сам табак — der Tabak.'
      uk: 'Французьке запозичення з наголосом на -re-, жіночий рід, множина звичайна. Дієслово — rauchen рівня A2 з колоди `koerper-pflege-a2`, а повний зворот — eine Zigarette rauchen. Підпалюють її das Feuerzeug або das Streichholz рівня B1 з колоди `haushalt-notfall-b1`. Пачка — eine Schachtel Zigaretten, а ті, хто курить і не курить, — Raucher і Nichtraucher нижче. Сам тютюн — der Tabak.'

  - de: Raucher
    ipa: "ˈʁaʊ̯xɐ"
    pos: noun
    gender: m
    plural: "die Raucher"
    cards: recognition
    en: a man who smokes, named for the habit rather than for a single occasion
    ru: 'мужчина, который курит: назван по привычке, а не по одному случаю'
    uk: 'чоловік, який курить: названий за звичкою, а не за одним випадком'
    example_de: Sind Sie Raucher oder Nichtraucher?
    example_en: Are you a smoker or a non-smoker?
    example_ru: Вы курящий или некурящий?
    example_uk: Ви курець чи не курець?
    note:
      en: 'A2 rauchen in the deck `koerper-pflege-a2` plus -er, with singular and plural spelled alike. German asks the question in the example with no article at all, because a bare noun after sein names a category rather than an individual. The area set aside is der Raucherbereich and a hotel offers ein Raucherzimmer or ein Nichtraucherzimmer. The heavy smoker is ein starker Raucher, not ein schwerer. The feminine is die Raucherin, the next entry.'
      ru: 'rauchen уровня A2 из колоды `koerper-pflege-a2` плюс -er, единственное и множественное пишутся одинаково. Вопрос из примера немец задаёт вовсе без артикля: голое существительное после sein называет разряд, а не отдельного человека. Отведённая зона — der Raucherbereich, а гостиница предлагает ein Raucherzimmer или ein Nichtraucherzimmer. Заядлый курильщик — ein starker Raucher, а не ein schwerer. Женская пара — die Raucherin, следующая запись.'
      uk: 'rauchen рівня A2 з колоди `koerper-pflege-a2` плюс -er, однина і множина пишуться однаково. Питання з прикладу німець ставить зовсім без артикля: голий іменник після sein називає розряд, а не окрему людину. Відведена зона — der Raucherbereich, а готель пропонує ein Raucherzimmer або ein Nichtraucherzimmer. Затятий курець — ein starker Raucher, а не ein schwerer. Жіноча пара — die Raucherin, наступний запис.'

  - de: Raucherin
    ipa: "ˈʁaʊ̯xəʁɪn"
    pos: noun
    gender: f
    plural: "die Raucherinnen"
    cards: recognition
    en: a woman who smokes
    ru: женщина, которая курит
    uk: жінка, яка курить
    example_de: Meine Kollegin ist starke Raucherin.
    example_en: My colleague is a heavy smoker.
    example_ru: Моя коллега заядлая курильщица.
    example_uk: Моя колега багато курить.
    note:
      en: 'Regular Movierung with -in and a doubled n in the plural. It is used wherever the masculine would be, but a sign, a form and a booking page almost always print the masculine or the plural, because they address a category and not a person. Starke Raucherin in the example is the fixed collocation, and the abstract wording a health campaign prefers is das Rauchverhalten rather than any personal noun at all.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается. Употребляется всюду, где стояла бы мужская форма, но табличка, бланк и страница бронирования почти всегда печатают мужскую или множественную: они обращаются к разряду, а не к человеку. Starke Raucherin в примере — устойчивое сочетание, а отвлечённая формулировка, которую предпочитает кампания за здоровье, — das Rauchverhalten, вовсе без слова о лице.'
      uk: 'Звичайна моція на -in, у множині n подвоюється. Уживається всюди, де стояла б чоловіча форма, але табличка, бланк і сторінка бронювання майже завжди друкують чоловічу або множинну: вони звертаються до розряду, а не до людини. Starke Raucherin у прикладі — усталене сполучення, а відсторонене формулювання, яке воліє кампанія за здоров’я, — das Rauchverhalten, зовсім без слова про особу.'

  - de: Nichtraucher
