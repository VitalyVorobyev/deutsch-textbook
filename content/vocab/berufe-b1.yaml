      en: 'Another n-noun, like every masculine in -ist: der Spezialisten, den Journalisten, dem Polizisten. The narrowness is the point — a specialist is defined by what they do not do — while der Experte above is defined by what they know. In medicine German usually says der Facharzt, and der Facharzt für Orthopädie is what actually stands on the door. The verb sich spezialisieren auf takes an accusative.'
      ru: 'Ещё одно слабое существительное — как всякое мужское на -ist: den Spezialisten, den Journalisten, dem Polizisten. Суть в узости: специалист определяется тем, чем он не занимается, тогда как der Experte выше — тем, что он знает. В медицине немецкий обычно говорит der Facharzt, и на двери стоит der Facharzt für Orthopädie. Глагол sich spezialisieren auf берёт дополнение в Akkusativ.'
      uk: 'Ще один слабкий іменник — як усякий чоловічий на -ist: den Spezialisten, den Journalisten, dem Polizisten. Суть у вузькості: спеціаліст визначається тим, чим він не займається, тоді як der Experte вище — тим, що він знає. У медицині німецька зазвичай каже der Facharzt, і на дверях стоїть der Facharzt für Orthopädie. Дієслово sich spezialisieren auf бере додаток у Akkusativ.'

