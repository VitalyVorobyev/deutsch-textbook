      ru: 'Мовирование на -in заодно чинит склонение: мужская форма меняется во всех падежах как слабое существительное, а эта не меняется никогда. Обратите внимание на предлог: Spezialistin für etwas, всегда für и Akkusativ, но не in. После sein и werden немецкий опускает артикль при названии профессии — потому в примере стоит Sie ist Spezialistin, а не eine Spezialistin.'
      uk: 'Мовація на -in заразом лагодить відмінювання: чоловіча форма змінюється в усіх відмінках як слабкий іменник, а ця не змінюється ніколи. Зверніть увагу на прийменник: Spezialistin für etwas, завжди für і Akkusativ, але не in. Після sein і werden німецька опускає артикль при назві професії — тому в прикладі стоїть Sie ist Spezialistin, а не eine Spezialistin.'

