  - de: Bauer
    ipa: "ˈbaʊ̯ɐ"
    pos: noun
    gender: m
    plural: "die Bauern"
    en: a man who works the land and keeps animals on a holding of his own
    en_compact: "farmer"
    ru: тот, кто обрабатывает землю и держит скот на собственном хозяйстве
    uk: той, хто обробляє землю й тримає худобу на власному господарстві
    example_de: Der Bauer verkauft Eier und Kartoffeln direkt am Hof.
    example_en: The farmer sells eggs and potatoes directly at the farm.
    example_ru: Крестьянин продаёт яйца и картофель прямо во дворе хозяйства.
    example_uk: Селянин продає яйця та картоплю просто у дворі господарства.
    note:
      en: 'An n-noun with a small irregularity: den Bauern, dem Bauern, but the genitive is des Bauern rather than the -ns some grammars expect. The modern official word is der Landwirt, which sounds businesslike, while this one carries the farmhouse with it — der Bauernhof, das Bauernbrot, der Bauernmarkt. The feminine is die Bäuerin, with an umlaut, and in chess the same word is a pawn.'
      ru: 'Слабое существительное с маленькой неправильностью: den Bauern, dem Bauern, а родительный — des Bauern, а не на -ns, как можно было бы ждать. Современное официальное слово — der Landwirt, оно звучит по-деловому, а это тянет за собой хутор: der Bauernhof, das Bauernbrot, der Bauernmarkt. Женская форма — die Bäuerin, с умлаутом, а в шахматах тем же словом называют пешку.'
      uk: 'Слабкий іменник із маленькою неправильністю: den Bauern, dem Bauern, а родовий — des Bauern, а не на -ns, як можна було б чекати. Сучасне офіційне слово — der Landwirt, воно звучить по-діловому, а це тягне за собою хутір: der Bauernhof, das Bauernbrot, der Bauernmarkt. Жіноча форма — die Bäuerin, з умлаутом, а в шахах тим самим словом звуть пішака.'

  - de: Steward
    ipa: "ˈstjuːɐt"
    pos: noun
    gender: m
    plural: "die Stewards"
    # Recognition only: heard in an announcement and read on a badge. What a learner
    # produces is the crew word or simply `Personal`.
    cards: recognition
    en: a man who looks after passengers on a plane or a ship
    en_compact: "flight attendant (male)"
    ru: бортпроводник, который обслуживает пассажиров в самолёте или на судне
    uk: бортпровідник, який обслуговує пасажирів у літаку або на судні
    example_de: Der Steward brachte uns Wasser und Decken.
    example_en: The flight attendant brought us water and blankets.
    example_ru: Бортпроводник принёс нам воду и пледы.
    example_uk: Бортпровідник приніс нам воду й пледи.
    note:
      en: 'An English loanword kept with its English sound, so the first syllable is spoken with a long u and no German st. The plural takes -s. Airlines themselves have moved on: German today says das Flugbegleitpersonal or der Flugbegleiter, and the announcement on board names die Kabinenbesatzung. In a stadium or at a festival the same word means a marshal, and there the plural is heard far more often.'
      ru: 'Английское заимствование, сохранившее английское звучание: первый слог произносят с долгим u и без немецкого st. Множественное на -s. Сами авиакомпании ушли вперёд: немецкий сегодня говорит das Flugbegleitpersonal или der Flugbegleiter, а объявление на борту называет die Kabinenbesatzung. На стадионе или фестивале тем же словом называют распорядителя, и там множественное слышится куда чаще.'
      uk: 'Англійське запозичення, що зберегло англійське звучання: перший склад вимовляють із довгим u і без німецького st. Множина на -s. Самі авіакомпанії пішли вперед: німецька сьогодні каже das Flugbegleitpersonal або der Flugbegleiter, а оголошення на борту називає die Kabinenbesatzung. На стадіоні чи фестивалі тим самим словом звуть розпорядника, і там множина чується значно частіше.'

  - de: Stewardess
    ipa: "ˈstjuːɐdɛs"
    pos: noun
    gender: f
    plural: "die Stewardessen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman who looks after passengers on a plane or a ship
    en_compact: "flight attendant (female)"
    ru: бортпроводница, которая обслуживает пассажиров в самолёте или на судне
    uk: бортпровідниця, яка обслуговує пасажирів у літаку або на судні
    example_de: Die Stewardess erklärte, wo die Notausgänge sind.
    example_en: The flight attendant explained where the emergency exits are.
    example_ru: Бортпроводница объяснила, где находятся аварийные выходы.
    example_uk: Бортпровідниця пояснила, де аварійні виходи.
    note:
      en: 'The one feminine in this deck built with neither -in nor -frau: the ending came in with the loanword and German kept it, adding only a German plural, die Stewardessen. It is the same -ess that English put on actress and waitress, and German has it in almost nothing else. The word is dated in the industry but alive in speech, and die Flugbegleiterin is what a contract says today.'
      ru: 'Единственная женская форма в этой колоде, построенная ни на -in, ни на -frau: окончание пришло вместе с заимствованием, немецкий его сохранил и добавил лишь своё множественное — die Stewardessen. Это тот же -ess, что английский поставил в actress и waitress, и в немецком он почти больше нигде не встречается. В отрасли слово устарело, но в речи живо, а в договоре сегодня стоит die Flugbegleiterin.'
      uk: 'Єдина жіноча форма в цій колоді, побудована ні на -in, ні на -frau: закінчення прийшло разом із запозиченням, німецька його зберегла й додала лише свою множину — die Stewardessen. Це той самий -ess, що англійська поставила в actress і waitress, і в німецькій він майже більше ніде не трапляється. У галузі слово застаріло, але в мовленні живе, а в договорі сьогодні стоїть die Flugbegleiterin.'

  - de: Direktorin
    ipa: "diʁɛkˈtoːʁɪn"
    pos: noun
    gender: f
    plural: "die Direktorinnen"
    # Recognition only: the feminine of A2's `Direktor` ("head teacher, principal",
    # schule-faecher-a2) — the pair costs three cards rather than four.
    cards: recognition
    en: the woman at the head of a school, a museum or a company
    en_compact: "director, principal (female)"
    ru: женщина во главе школы, музея или компании
    uk: жінка на чолі школи, музею чи компанії
    example_de: Die Direktorin des Museums führte uns selbst durch die Ausstellung.
    example_en: The director of the museum showed us round the exhibition herself.
    example_ru: Директор музея сама провела нас по выставке.
    example_uk: Директорка музею сама провела нас виставкою.
    note:
      en: 'Movierung with -in, and it moves the stress: the masculine der Direktor is stressed on the second syllable, while adding the ending pulls the accent onto the third, which is the pattern of every Latin -or noun — der Professor and die Professorin, der Motor and die Motoren. A2 cards the masculine for a school head; this form is used just as readily for a museum, a bank or a theatre.'
      ru: 'Мовирование на -in, и оно сдвигает ударение: мужское der Direktor ударяется на втором слоге, а с окончанием акцент переходит на третий — образец всех латинских существительных на -or: der Professor и die Professorin, der Motor и die Motoren. На A2 карточка мужской формы дана как «директор школы»; эта форма так же свободно применяется к музею, банку или театру.'
      uk: 'Мовація на -in, і вона зсуває наголос: чоловіче der Direktor наголошується на другому складі, а із закінченням акцент переходить на третій — зразок усіх латинських іменників на -or: der Professor і die Professorin, der Motor і die Motoren. На A2 картка чоловічої форми подана як «директор школи»; ця форма так само вільно застосовується до музею, банку чи театру.'
