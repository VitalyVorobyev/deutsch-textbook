# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the profession
# NAMES of data/goethe-b1-wortliste.txt that A2's `berufe-a2` did not reach. Every
# feminine agent noun ships `cards: recognition` and sits directly after its
# masculine, whose note carries the pair — so a pair costs three cards, not four,
# per the Movierung rule of the B1 completion pass. The work itself, its contracts
# and its office are a deck of their own (arbeit-beruf-b1).
id: berufe-b1
title_de: "Berufe"
title_en: "Professions and trades"
title_ru: "Профессии и занятия"
title_uk: "Професії та заняття"
level: B1
entries:
  # --- Freie Berufe und Praxen ---
  - de: Architekt
    ipa: "aʁçiˈtɛkt"
    pos: noun
    gender: m
    plural: "die Architekten"
    en: a man who designs buildings and oversees their construction
    en_compact: "architect"
    ru: специалист, который проектирует здания и ведёт надзор за стройкой
    uk: фахівець, який проєктує будівлі та веде нагляд за будівництвом
    example_de: Der Architekt hat für den Umbau drei Entwürfe vorgelegt.
    example_en: The architect submitted three designs for the conversion.
    example_ru: Архитектор представил три проекта перестройки.
    example_uk: Архітектор подав три проєкти перебудови.
    note:
      en: 'An n-noun: every case except the nominative singular adds -en, so den Architekten, dem Architekten, des Architekten. Nouns of foreign origin ending in a stressed syllable behave this way as a group — der Student, der Polizist, der Patient. The ch here is the back sound, as in Buch, which German keeps in Greek loanwords before a consonant. The feminine is die Architektin, the next entry, and das Architekturbüro is the practice they work in.'
      ru: 'Слабое существительное (n-Deklination): во всех падежах, кроме именительного единственного, добавляется -en — den Architekten, dem Architekten, des Architekten. Заимствованные существительные с ударением на последнем слоге ведут себя так целой группой: der Student, der Polizist, der Patient. Сочетание ch здесь — задний звук, как в Buch: немецкий сохраняет его в греческих заимствованиях перед согласной. Женская пара — die Architektin, следующая запись, а бюро называется das Architekturbüro.'
      uk: 'Слабкий іменник (n-Deklination): в усіх відмінках, крім називного однини, додається -en — den Architekten, dem Architekten, des Architekten. Запозичені іменники з наголосом на останньому складі поводяться так цілою групою: der Student, der Polizist, der Patient. Сполука ch тут — задній звук, як у Buch: німецька зберігає його в грецьких запозиченнях перед приголосною. Жіноча пара — die Architektin, наступний запис, а бюро зветься das Architekturbüro.'

  - de: Architektin
    ipa: "aʁçiˈtɛktɪn"
    pos: noun
    gender: f
    plural: "die Architektinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman who designs buildings and oversees their construction
    en_compact: "architect (female)"
    ru: женщина, которая проектирует здания и ведёт надзор за стройкой
    uk: жінка, яка проєктує будівлі та веде нагляд за будівництвом
    example_de: Die Architektin zeigte uns das Modell des neuen Museums.
    example_en: The architect showed us the model of the new museum.
    example_ru: Архитектор показала нам макет нового музея.
    example_uk: Архітекторка показала нам макет нового музею.
    note:
      en: 'Movierung with -in, and note what it does to the declension: the masculine is an n-noun and changes in every case, while this form is a plain feminine noun and never changes at all — der Architektin, die Architektinnen. The same asymmetry runs through the whole group, der Student and die Studentin, der Patient and die Patientin. Job adverts write Architekt/-in or Architekt (m/w/d), and a firm on a letterhead is die Architekten.'
      ru: 'Мовирование на -in, и обратите внимание, что оно делает со склонением: мужская форма — слабое существительное и меняется во всех падежах, а эта — обычное существительное женского рода и не меняется вовсе: der Architektin, die Architektinnen. Та же асимметрия проходит через всю группу: der Student и die Studentin, der Patient и die Patientin. В объявлениях о работе пишут Architekt/-in или Architekt (m/w/d), а на фирменном бланке бюро стоит die Architekten.'
      uk: 'Мовація на -in, і зверніть увагу, що вона робить із відмінюванням: чоловіча форма — слабкий іменник і змінюється в усіх відмінках, а ця — звичайний іменник жіночого роду й не змінюється зовсім: der Architektin, die Architektinnen. Та сама асиметрія проходить через усю групу: der Student і die Studentin, der Patient і die Patientin. В оголошеннях про роботу пишуть Architekt/-in або Architekt (m/w/d), а на фірмовому бланку бюро стоїть die Architekten.'

  - de: Anwalt
    ipa: "ˈanvalt"
    pos: noun
    gender: m
    plural: "die Anwälte"
    en: a man trained in law who advises clients and speaks for them in court
    en_compact: "lawyer"
    ru: юрист, который консультирует клиентов и представляет их в суде
    uk: юрист, який консультує клієнтів і представляє їх у суді
    example_de: Ohne Anwalt würde ich diesen Vertrag nicht unterschreiben.
    example_en: I would not sign this contract without a lawyer.
    example_ru: Без юриста я бы этот договор не подписал.
    example_uk: Без юриста я б цього договору не підписав.
    note:
      en: 'The full form is der Rechtsanwalt, and both are current — a door plate says Rechtsanwalt, a conversation says the short one. The plural takes an umlaut: die Anwälte, and the feminine is die Anwältin below, with the umlaut as well. Two neighbours belong to a courtroom, not to this word: der Richter decides the case and der Staatsanwalt brings the charge, and the second one is confusingly close in shape. The practice is die Kanzlei.'
      ru: 'Полная форма — der Rechtsanwalt, и обе в ходу: на табличке у двери стоит Rechtsanwalt, в разговоре — короткая. Множественное с умлаутом: die Anwälte, женская пара — die Anwältin ниже, тоже с умлаутом. Два соседа принадлежат залу суда, а не этому слову: der Richter решает дело, а der Staatsanwalt поддерживает обвинение, и второе слово опасно похоже по виду. Контора называется die Kanzlei.'
      uk: 'Повна форма — der Rechtsanwalt, і обидві в ужитку: на табличці біля дверей стоїть Rechtsanwalt, у розмові — коротка. Множина з умлаутом: die Anwälte, жіноча пара — die Anwältin нижче, теж з умлаутом. Два сусіди належать залі суду, а не цьому слову: der Richter вирішує справу, а der Staatsanwalt підтримує обвинувачення, і друге слово небезпечно схоже на вигляд. Контора зветься die Kanzlei.'

  - de: Anwältin
    ipa: "ˈanvɛltɪn"
    pos: noun
    gender: f
    plural: "die Anwältinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman trained in law who advises clients and speaks for them in court
    en_compact: "lawyer (female)"
    ru: женщина-юрист, которая консультирует клиентов и представляет их в суде
    uk: жінка-юрист, яка консультує клієнтів і представляє їх у суді
    example_de: Meine Anwältin hat den Brief noch am selben Abend beantwortet.
    example_en: My lawyer answered the letter the same evening.
    example_ru: Моя адвокат ответила на письмо в тот же вечер.
    example_uk: Моя адвокатка відповіла на лист того самого вечора.
    note:
      en: 'Movierung with -in and the umlaut the stem allows, which is the a to ä you also see in der Arzt and die Ärztin. Where German can put an umlaut in the feminine it usually does, and where the stem has no suitable vowel nothing changes at all, as in der Lehrer and die Lehrerin. The full form is die Rechtsanwältin, and jemanden anwaltlich vertreten lassen is the formal way of saying you have engaged one.'
      ru: 'Мовирование на -in плюс умлаут, который допускает основа, — то же a в ä, что и в паре der Arzt / die Ärztin. Там, где немецкий может поставить умлаут в женской форме, он обычно его ставит, а там, где подходящего гласного в основе нет, не меняется ничего: der Lehrer и die Lehrerin. Полная форма — die Rechtsanwältin, а jemanden anwaltlich vertreten lassen — официальный способ сказать, что вы наняли юриста.'
      uk: 'Мовація на -in плюс умлаут, який дозволяє основа, — те саме a в ä, що й у парі der Arzt / die Ärztin. Там, де німецька може поставити умлаут у жіночій формі, вона зазвичай його ставить, а там, де відповідного голосного в основі немає, не змінюється нічого: der Lehrer і die Lehrerin. Повна форма — die Rechtsanwältin, а jemanden anwaltlich vertreten lassen — офіційний спосіб сказати, що ви найняли юриста.'

  - de: Sekretär
    ipa: "zekʁeˈtɛːɐ̯"
    pos: noun
    gender: m
    plural: "die Sekretäre"
    en: a man who keeps an office running, handling appointments, letters and callers
    en_compact: "secretary"
    ru: "сотрудник, который ведёт офис: встречи, письма, посетители"
    uk: "працівник, який веде офіс: зустрічі, листи, відвідувачі"
    example_de: Der Sekretär verbindet Sie gleich mit der Abteilungsleitung.
    example_en: The secretary will put you through to the head of department in a moment.
    example_ru: Секретарь сейчас соединит вас с руководством отдела.
    example_uk: Секретар зараз з’єднає вас із керівництвом відділу.
    note:
      en: 'Stress on the last syllable, as with every German noun in -är: der Millionär, der Funktionär. The room is das Sekretariat, which schule-faecher-a2 already cards for a school office. In politics the same word names a high post, der Generalsekretär, and in old furniture catalogues der Sekretär is a writing desk with a fall front. The feminine below is far commoner in everyday German than the masculine.'
      ru: 'Ударение на последнем слоге, как у всех немецких существительных на -är: der Millionär, der Funktionär. Помещение — das Sekretariat, оно уже есть в колоде schule-faecher-a2 как школьная канцелярия. В политике тем же словом называют высокий пост — der Generalsekretär, — а в старых мебельных каталогах der Sekretär — это письменный стол с откидной крышкой. Женская форма ниже в обиходном немецком встречается куда чаще мужской.'
      uk: 'Наголос на останньому складі, як у всіх німецьких іменників на -är: der Millionär, der Funktionär. Приміщення — das Sekretariat, воно вже є в колоді schule-faecher-a2 як шкільна канцелярія. У політиці тим самим словом називають високу посаду — der Generalsekretär, — а в старих меблевих каталогах der Sekretär — це письмовий стіл із відкидною кришкою. Жіноча форма нижче в побутовій німецькій трапляється значно частіше за чоловічу.'

  - de: Sekretärin
    ipa: "zekʁeˈtɛːʁɪn"
    pos: noun
    gender: f
    plural: "die Sekretärinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman who keeps an office running, handling appointments, letters and callers
    en_compact: "secretary (female)"
    ru: "сотрудница, которая ведёт офис: встречи, письма, посетители"
    uk: "працівниця, яка веде офіс: зустрічі, листи, відвідувачі"
    example_de: Die Sekretärin trägt den Termin gleich in den Kalender ein.
    example_en: The secretary is entering the appointment in the calendar right away.
    example_ru: Секретарь сразу же вносит встречу в календарь.
    example_uk: Секретарка одразу ж вносить зустріч до календаря.
    note:
      en: 'The -är ending keeps its stress under Movierung, so the accent stays on the same syllable and only a syllable is added. Modern German has largely replaced the job title with die Assistenz or die Bürokauffrau, and a company today writes Assistenz der Geschäftsführung on the door. The word is nevertheless everywhere in older texts, in films, and in the sentence a receptionist still says on the phone.'
      ru: 'Окончание -är сохраняет ударение и при мовировании: акцент остаётся на том же слоге, добавляется лишь ещё один. Современный немецкий по большей части заменил это название должности на die Assistenz или die Bürokauffrau, и фирма сегодня пишет на двери Assistenz der Geschäftsführung. Тем не менее слово встречается всюду в старых текстах, в фильмах и в той фразе, которую до сих пор говорят по телефону в приёмной.'
      uk: 'Закінчення -är зберігає наголос і при мовації: акцент лишається на тому самому складі, додається лише ще один. Сучасна німецька здебільшого замінила цю назву посади на die Assistenz або die Bürokauffrau, і фірма сьогодні пише на дверях Assistenz der Geschäftsführung. Проте слово трапляється всюди в старих текстах, у фільмах і в тій фразі, яку досі кажуть телефоном у приймальні.'

  - de: Übersetzer
    ipa: "yːbɐˈzɛtsɐ"
    pos: noun
    gender: m
    plural: "die Übersetzer"
    en: a man who turns written texts from one language into another
    en_compact: "translator"
    ru: специалист, который передаёт письменные тексты с одного языка на другой
    uk: фахівець, який передає письмові тексти з однієї мови іншою
    example_de: Der Übersetzer hat den Vertrag ins Deutsche übertragen.
    example_en: The translator rendered the contract into German.
    example_ru: Переводчик перевёл договор на немецкий.
    example_uk: Перекладач переклав договір німецькою.
    note:
      en: 'German separates the two jobs that English blurs: this one works on writing and takes his time, while der Dolmetscher works on speech and works live, in a booth or beside a doctor''s desk. A2 übersetzen is the verb, and note that it is inseparable in this sense (er übersetzt den Text) but separable in the literal one about ferrying somebody across a river (er setzt über). The plural is unchanged, and the feminine is the next entry.'
      ru: 'Немецкий разводит две профессии, которые русский называет одним словом: эта работает с письменным текстом и никуда не спешит, а der Dolmetscher работает с устной речью в реальном времени — в кабине или рядом со столом врача. Глагол — übersetzen уровня A2, и заметьте: в этом значении он неотделяемый (er übersetzt den Text), а в буквальном, о переправе через реку, отделяемый (er setzt über). Множественное не меняется, а женская форма — следующая запись.'
      uk: 'Німецька розводить дві професії, які українська називає одним словом: ця працює з писемним текстом і нікуди не поспішає, а der Dolmetscher працює з усним мовленням у реальному часі — у кабіні або поряд зі столом лікаря. Дієслово — übersetzen рівня A2, і зауважте: у цьому значенні воно невідокремлюване (er übersetzt den Text), а в буквальному, про переправу через річку, відокремлюване (er setzt über). Множина не змінюється, а жіноча форма — наступний запис.'

  - de: Übersetzerin
    ipa: "yːbɐˈzɛtsəʁɪn"
    pos: noun
    gender: f
    plural: "die Übersetzerinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman who turns written texts from one language into another
    en_compact: "translator (female)"
    ru: женщина, которая передаёт письменные тексты с одного языка на другой
    uk: жінка, яка передає письмові тексти з однієї мови іншою
    example_de: Als Übersetzerin arbeitet sie zu Hause und teilt sich die Zeit selbst ein.
    example_en: As a translator she works at home and organises her own time.
    example_ru: Как переводчица она работает дома и сама распределяет время.
    example_uk: Як перекладачка вона працює вдома й сама розподіляє час.
    note:
      en: 'The -er of an agent noun becomes -erin with no umlaut, and this is the largest and most regular group of all: der Lehrer, der Fahrer, der Verkäufer all behave the same way. A stem with no vowel that can carry an umlaut simply never takes one, which is why die Ärztin and die Lehrerin look so different. The sworn version needed for official documents is die vereidigte Übersetzerin.'
      ru: 'Суффикс -er у существительного деятеля даёт -erin без умлаута, и это самая большая и самая правильная группа: der Lehrer, der Fahrer, der Verkäufer ведут себя одинаково. Основа, в которой нет гласного, способного принять умлаут, его просто никогда не получает — оттого die Ärztin и die Lehrerin так не похожи. Присяжный вариант, нужный для официальных документов, — die vereidigte Übersetzerin.'
      uk: 'Суфікс -er в іменника діяча дає -erin без умлаута, і це найбільша й найправильніша група: der Lehrer, der Fahrer, der Verkäufer поводяться однаково. Основа, у якій немає голосного, здатного прийняти умлаут, його просто ніколи не отримує — тому die Ärztin і die Lehrerin такі несхожі. Присяжний варіант, потрібний для офіційних документів, — die vereidigte Übersetzerin.'

  # --- Handwerk und Dienst am Haus ---
  - de: Maler
    ipa: "ˈmaːlɐ"
    pos: noun
    gender: m
    plural: "die Maler"
    en: a man who paints, either walls for a living or pictures as an artist
    en_compact: "painter; decorator"
    ru: тот, кто красит стены как ремесленник или пишет картины как художник
    uk: той, хто фарбує стіни як ремісник або пише картини як митець
    example_de: Der Maler streicht die Wohnung in drei Tagen.
    example_en: The decorator will paint the flat in three days.
    example_ru: Маляр покрасит квартиру за три дня.
    example_uk: Маляр пофарбує квартиру за три дні.
    note:
      en: 'One word for the trade and for the art, and only the sentence decides which: der Maler und Lackierer is the official name of the trade, while Dürer war ein deutscher Maler is the other one. The verb is A2 malen, to paint; the tradesman''s own verb is streichen, and eine Wand streichen is what he charges for. The feminine below is used for both readings just as freely.'
      ru: 'Одно слово и на ремесло, и на искусство, и различает их только предложение: der Maler und Lackierer — официальное название ремесла, а Dürer war ein deutscher Maler — совсем другое. Глагол — malen уровня A2 «рисовать, писать красками»; собственный глагол ремесленника — streichen, и eine Wand streichen — это то, за что он берёт деньги. Женская форма ниже так же свободно работает в обоих смыслах.'
      uk: 'Одне слово і на ремесло, і на мистецтво, і розрізняє їх лише речення: der Maler und Lackierer — офіційна назва ремесла, а Dürer war ein deutscher Maler — зовсім інше. Дієслово — malen рівня A2 «малювати, писати фарбами»; власне дієслово ремісника — streichen, і eine Wand streichen — це те, за що він бере гроші. Жіноча форма нижче так само вільно працює в обох сенсах.'

  - de: Malerin
    ipa: "ˈmaːləʁɪn"
    pos: noun
    gender: f
    plural: "die Malerinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman who paints, either walls for a living or pictures as an artist
    en_compact: "painter; decorator (female)"
    ru: женщина, которая красит стены как ремесленница или пишет картины как художница
    uk: жінка, яка фарбує стіни як ремісниця або пише картини як мисткиня
    example_de: Die Bilder stammen von einer jungen Malerin aus Leipzig.
    example_en: The pictures are by a young painter from Leipzig.
    example_ru: Картины принадлежат молодой художнице из Лейпцига.
    example_uk: Картини належать молодій мисткині з Лейпцига.
    note:
      en: 'Regular -erin with no umlaut. In art writing German prefers die Künstlerin for a woman who makes art of any kind and keeps this word for the one who paints; in the trades it is simply the female form of the craft. Careful with the near-homophone die Mahlerin, from mahlen, to grind grain, which is a different verb spelled with an h and survives mainly in die Mühle and der Müller.'
      ru: 'Правильное -erin без умлаута. В текстах об искусстве немецкий предпочитает die Künstlerin для женщины, занимающейся искусством вообще, а это слово оставляет за той, кто пишет красками; в ремесле же это просто женская форма профессии. Осторожно с почти омофоном die Mahlerin, от mahlen «молоть зерно»: это другой глагол, пишется с h и уцелел в основном в словах die Mühle и der Müller.'
      uk: 'Правильне -erin без умлаута. У текстах про мистецтво німецька віддає перевагу die Künstlerin для жінки, що займається мистецтвом узагалі, а це слово лишає за тією, хто пише фарбами; у ремеслі ж це просто жіноча форма професії. Обережно з майже омофоном die Mahlerin, від mahlen «молоти зерно»: це інше дієслово, пишеться з h і вціліло здебільшого у словах die Mühle та der Müller.'

  - de: Briefträger
    ipa: "ˈbʁiːfˌtʁɛːgɐ"
    pos: noun
    gender: m
    plural: "die Briefträger"
    en: the man who brings the post to the door every morning
    en_compact: "postman"
    ru: человек, который каждое утро приносит почту к двери
    uk: людина, яка щоранку приносить пошту до дверей
    example_de: Der Briefträger klingelt nur, wenn ein Paket dabei ist.
    example_en: The postman only rings when there is a parcel.
    example_ru: Почтальон звонит только тогда, когда есть посылка.
    example_uk: Листоноша дзвонить лише тоді, коли є посилка.
    note:
      en: 'A transparent compound of A1 der Brief and tragen, to carry. The official job title today is der Zusteller, and the Post''s own paperwork says Zustellerin und Zusteller, but everybody in the street uses this word. Switzerland has its own, der Pöstler. The feminine is the next entry, and die Zustellung is the delivery itself.'
      ru: 'Прозрачное сложение из der Brief уровня A1 и tragen «носить». Официальное название должности сегодня — der Zusteller, и в бумагах почты стоит Zustellerin und Zusteller, но на улице все говорят именно так. У Швейцарии слово своё — der Pöstler. Женская форма — следующая запись, а сама доставка — die Zustellung.'
      uk: 'Прозоре складання з der Brief рівня A1 і tragen «носити». Офіційна назва посади сьогодні — der Zusteller, і в паперах пошти стоїть Zustellerin und Zusteller, але на вулиці всі кажуть саме так. У Швейцарії слово своє — der Pöstler. Жіноча форма — наступний запис, а сама доставка — die Zustellung.'

  - de: Briefträgerin
    ipa: "ˈbʁiːfˌtʁɛːgəʁɪn"
    pos: noun
    gender: f
    plural: "die Briefträgerinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: the woman who brings the post to the door every morning
    en_compact: "postwoman"
    ru: женщина, которая каждое утро приносит почту к двери
    uk: жінка, яка щоранку приносить пошту до дверей
    example_de: Unsere Briefträgerin kennt jeden Namen im Haus.
    example_en: Our postwoman knows every name in the building.
    example_ru: Наша почтальонка знает в доме каждую фамилию.
    example_uk: Наша листоноша знає в будинку кожне прізвище.
    note:
      en: 'The umlaut in this family sits inside the second element and is already there in the masculine, because tragen gives der Träger, so the feminine only adds -in. That is a useful reminder that the umlaut belongs to the word itself, not to the Movierung: it appears wherever the stem asks for it. The same shape gives der Gepäckträger, which is a porter as well as the rack over a bicycle wheel, so a Träger compound is not always a person.'
      ru: 'Умлаут в этой семье сидит внутри второго элемента и уже есть в мужской форме, потому что от tragen образуется der Träger, — женской остаётся лишь добавить -in. Это полезное напоминание: умлаут принадлежит самому слову, а не мовированию, и появляется там, где его требует основа. Тот же облик даёт der Gepäckträger — и носильщик, и багажник над велосипедным колесом, так что составное на -träger не всегда человек.'
      uk: 'Умлаут у цій родині сидить усередині другого елемента і вже є в чоловічій формі, бо від tragen утворюється der Träger, — жіночій лишається тільки додати -in. Це корисне нагадування: умлаут належить самому слову, а не мовації, і з’являється там, де його вимагає основа. Той самий вигляд дає der Gepäckträger — і носій, і багажник над велосипедним колесом, тож складне на -träger не завжди людина.'

  - de: Hausmeisterin
    ipa: "ˈhaʊ̯sˌmaɪ̯stəʁɪn"
    pos: noun
    gender: f
    plural: "die Hausmeisterinnen"
    # Recognition only: the feminine of `Hausmeister` ("caretaker, building
    # superintendent", regeln-verantwortung), which is itself a recognition card.
    cards: recognition
    en: the woman who looks after a building, its heating, its bins and its small repairs
    en_compact: "caretaker (female)"
    ru: "женщина, которая следит за домом: отоплением, мусором и мелким ремонтом"
    uk: "жінка, яка доглядає будинок: опалення, сміття та дрібний ремонт"
    example_de: Bei einem Wasserschaden ruft man zuerst die Hausmeisterin an.
    example_en: If water damage occurs you call the caretaker first.
    example_ru: При протечке первым делом звонят коменданту дома.
    example_uk: При протіканні насамперед телефонують доглядачці будинку.
    note:
      en: 'The masculine, in the regeln-verantwortung deck, is a fixture of German block-of-flats life: keys, heating, the bin store and the notice about the stairwell. This form is the ordinary -in feminine and adds nothing to the declension. Switzerland says der Abwart and die Abwartin, and Austria often der Hausbesorger. Do not confuse the person with die Hausverwaltung, the company that manages the property from an office.'
      ru: 'Мужская форма, в колоде regeln-verantwortung, — непременная фигура жизни немецкого многоквартирного дома: ключи, отопление, мусорка и объявление о лестничной клетке. Эта форма — обычное женское -in, к склонению она ничего не добавляет. Швейцария говорит der Abwart и die Abwartin, а Австрия часто der Hausbesorger. Не путайте человека с die Hausverwaltung — компанией, которая управляет домом из офиса.'
      uk: 'Чоловіча форма, у колоді regeln-verantwortung, — неодмінна постать життя німецького багатоквартирного будинку: ключі, опалення, смітник і оголошення про сходову клітку. Ця форма — звичайне жіноче -in, до відмінювання вона нічого не додає. Швейцарія каже der Abwart і die Abwartin, а Австрія часто der Hausbesorger. Не плутайте людину з die Hausverwaltung — компанією, що керує будинком з офісу.'

  # --- Menschen betreuen und pflegen ---
  - de: Betreuer
    ipa: "bəˈtʁɔʏ̯ɐ"
    pos: noun
    gender: m
    plural: "die Betreuer"
    en: a man whose job is looking after a group or a person over a stretch of time
    en_compact: "carer, support worker"
    ru: тот, чья работа — вести группу или человека на протяжении времени
    uk: той, чия робота — вести групу чи людину протягом часу
    example_de: Im Ferienlager kommt auf zehn Kinder ein Betreuer.
    example_en: At the holiday camp there is one supervisor for every ten children.
    example_ru: В летнем лагере на десять детей приходится один воспитатель.
    example_uk: У літньому таборі на десятеро дітей припадає один вихователь.
    note:
      en: 'The person behind B1 betreuen, and German uses it very widely: a camp supervisor, a support worker, a team manager in sport, the academic who supervises a thesis. It says somebody is responsible for a person or a group over time, which is why der Helfer sounds too casual for it and der Pfleger below too medical. The verb and the noun die Betreuung are both in arbeit-beruf-b1, and the feminine is the next entry.'
      ru: 'Человек за глаголом betreuen уровня B1, и немецкий пользуется словом очень широко: вожатый в лагере, социальный работник, менеджер команды в спорте, научный руководитель диплома. Слово говорит, что кто-то отвечает за человека или группу на протяжении времени, — оттого der Helfer звучит для этого слишком мимоходом, а der Pfleger ниже слишком по-медицински. Глагол и существительное die Betreuung лежат в колоде arbeit-beruf-b1, а женская форма — следующая запись.'
      uk: 'Людина за дієсловом betreuen рівня B1, і німецька користується словом дуже широко: вожатий у таборі, соціальний працівник, менеджер команди у спорті, науковий керівник диплома. Слово каже, що хтось відповідає за людину чи групу протягом часу, — тому der Helfer звучить для цього надто мимохідь, а der Pfleger нижче надто по-медичному. Дієслово та іменник die Betreuung лежать у колоді arbeit-beruf-b1, а жіноча форма — наступний запис.'

  - de: Betreuerin
    ipa: "bəˈtʁɔʏ̯əʁɪn"
    pos: noun
    gender: f
    plural: "die Betreuerinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman whose job is looking after a group or a person over a stretch of time
    en_compact: "carer, support worker (female)"
    ru: женщина, чья работа — вести группу или человека на протяжении времени
    uk: жінка, чия робота — вести групу чи людину протягом часу
    example_de: Die Betreuerin bleibt bis zum Abend bei der alten Dame.
    example_en: The carer stays with the old lady until the evening.
    example_ru: Сиделка остаётся с пожилой дамой до вечера.
    example_uk: Доглядальниця залишається з літньою пані до вечора.
    note:
      en: 'Regular -erin. German has a whole family of care words and they are not interchangeable: die Erzieherin is trained for a nursery, die Pflegerin below works on the body, die Sozialarbeiterin works for an authority, and this word covers the rest. In elder care the common compound is die Alltagsbetreuerin, and the fee an insurer pays is das Betreuungsgeld.'
      ru: 'Правильное -erin. У немецкого целая семья слов о заботе, и они не взаимозаменяемы: die Erzieherin имеет педагогическое образование и работает в саду, die Pflegerin ниже работает с телом, die Sozialarbeiterin служит в ведомстве, а это слово покрывает всё остальное. В уходе за пожилыми частое составное — die Alltagsbetreuerin, а выплата от страховой называется das Betreuungsgeld.'
      uk: 'Правильне -erin. У німецької ціла родина слів про турботу, і вони не взаємозамінні: die Erzieherin має педагогічну освіту й працює в садку, die Pflegerin нижче працює з тілом, die Sozialarbeiterin служить у відомстві, а це слово покриває решту. У догляді за літніми часте складне — die Alltagsbetreuerin, а виплата від страхової зветься das Betreuungsgeld.'

  - de: Pfleger
    ipa: "ˈpfleːgɐ"
    pos: noun
    gender: m
    plural: "die Pfleger"
    # Recognition only: A2 ships `Krankenpfleger` ("nurse (male)", berufe-a2) as the
    # production card, and this is the same job under its short name.
    cards: recognition
    en: a man who cares for the sick or the elderly, washing, feeding and lifting them
    en_compact: "carer, nurse (male)"
    ru: "тот, кто ухаживает за больными или пожилыми: моет, кормит, поднимает"
    uk: "той, хто доглядає хворих або літніх: миє, годує, піднімає"
    example_de: Der Pfleger half ihr, aus dem Bett aufzustehen.
    example_en: The nurse helped her get out of bed.
    example_ru: Санитар помог ей встать с кровати.
    example_uk: Санітар допоміг їй встати з ліжка.
    note:
      en: 'The short form of A2 der Krankenpfleger, and it reaches further: der Altenpfleger, der Tierpfleger at a zoo, and even der Denkmalpfleger, who looks after historic buildings. The work is physical, which is what separates it from der Betreuer above. Note the spelling trap in the plural of the profession as a whole: die Pflegekräfte is what an advert says, because it covers both sexes without naming either.'
      ru: 'Короткая форма от der Krankenpfleger уровня A2, и она берёт шире: der Altenpfleger, der Tierpfleger в зоопарке и даже der Denkmalpfleger, который следит за памятниками архитектуры. Работа телесная, и этим слово отличается от der Betreuer выше. Заметьте, как профессия называется в целом: в объявлении стоит die Pflegekräfte, потому что это слово покрывает оба пола, не называя ни одного.'
      uk: 'Коротка форма від der Krankenpfleger рівня A2, і вона бере ширше: der Altenpfleger, der Tierpfleger у зоопарку і навіть der Denkmalpfleger, який доглядає пам’ятки архітектури. Робота тілесна, і цим слово відрізняється від der Betreuer вище. Зауважте, як професія зветься загалом: в оголошенні стоїть die Pflegekräfte, бо це слово покриває обидві статі, не називаючи жодної.'

  - de: Pflegerin
    ipa: "ˈpfleːgəʁɪn"
    pos: noun
    gender: f
    plural: "die Pflegerinnen"
    # Recognition only: the feminine of the entry above; A2 `Krankenschwester`
    # (berufe-a2) is the shipped production card for a female nurse.
    cards: recognition
    en: a woman who cares for the sick or the elderly, washing, feeding and lifting them
    en_compact: "carer, nurse (female)"
    ru: "женщина, которая ухаживает за больными или пожилыми: моет, кормит, поднимает"
    uk: "жінка, яка доглядає хворих або літніх: миє, годує, піднімає"
    example_de: Zwei Pflegerinnen kommen jeden Morgen zu ihm nach Hause.
    example_en: Two carers come to his home every morning.
    example_ru: Две сиделки приходят к нему домой каждое утро.
    example_uk: Дві доглядальниці приходять до нього додому щоранку.
    note:
      en: 'German is in the middle of renaming this whole field: A2 die Krankenschwester, literally a sister, has been replaced in law since 2020 by die Pflegefachfrau, and hospitals now write die Pflegefachkraft on a rota. All of them are current, and a patient hears whichever the speaker grew up with. The verb is B1 pflegen, which also means to keep up a habit — er pflegt früh aufzustehen.'
      ru: 'Немецкий как раз переименовывает всю эту область: die Krankenschwester уровня A2, буквально «сестра», с 2020 года заменена в законе на die Pflegefachfrau, а в графике смен больницы пишут die Pflegefachkraft. Все варианты в ходу, и пациент слышит тот, с которым вырос говорящий. Глагол — pflegen уровня B1, у которого есть и второе значение: er pflegt früh aufzustehen — «он имеет обыкновение рано вставать».'
      uk: 'Німецька саме перейменовує всю цю галузь: die Krankenschwester рівня A2, буквально «сестра», з 2020 року замінена в законі на die Pflegefachfrau, а в графіку змін лікарні пишуть die Pflegefachkraft. Усі варіанти в ужитку, і пацієнт чує той, з яким виріс мовець. Дієслово — pflegen рівня B1, у якого є й друге значення: er pflegt früh aufzustehen — «він має звичку рано вставати».'

  # --- Wer ein Geschäft führt ---
  - de: Unternehmer
    ipa: "ʊntɐˈneːmɐ"
    pos: noun
    gender: m
    plural: "die Unternehmer"
    en: a man who runs a business of his own and carries its risk
    en_compact: "entrepreneur, business owner"
    ru: тот, кто ведёт собственное дело и несёт его риск
    uk: той, хто веде власну справу й несе її ризик
    example_de: Als Unternehmer haftet er mit seinem eigenen Geld.
    example_en: As a business owner he is liable with his own money.
    example_ru: Как предприниматель он отвечает собственными деньгами.
    example_uk: Як підприємець він відповідає власними грошима.
    note:
      en: 'The firm itself is das Unternehmen, neuter, and the same word is the verb A2 unternehmen, to undertake something — Was unternehmen wir am Wochenende? Risk is the defining part: A2 selbstständig describes anybody working for themselves, while this word implies a business with employees. The bosses'' side in a wage negotiation is der Arbeitgeber, and the union''s side is der Arbeitnehmer.'
      ru: 'Сама фирма — das Unternehmen, среднего рода, и то же слово есть глагол unternehmen уровня A2 «предпринимать»: Was unternehmen wir am Wochenende? Определяющая часть — риск: selbstständig уровня A2 описывает любого, кто работает на себя, а это слово предполагает дело с наёмными работниками. В переговорах о зарплате сторона хозяев — der Arbeitgeber, а сторона профсоюза — der Arbeitnehmer.'
      uk: 'Сама фірма — das Unternehmen, середнього роду, і те саме слово є дієсловом unternehmen рівня A2 «започатковувати, робити»: Was unternehmen wir am Wochenende? Визначальна частина — ризик: selbstständig рівня A2 описує будь-кого, хто працює на себе, а це слово передбачає справу з найманими працівниками. У переговорах про зарплату сторона господарів — der Arbeitgeber, а сторона профспілки — der Arbeitnehmer.'

  - de: Unternehmerin
    ipa: "ʊntɐˈneːməʁɪn"
    pos: noun
    gender: f
    plural: "die Unternehmerinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman who runs a business of her own and carries its risk
    en_compact: "entrepreneur (female)"
    ru: женщина, которая ведёт собственное дело и несёт его риск
    uk: жінка, яка веде власну справу й несе її ризик
    example_de: Die Unternehmerin beschäftigt inzwischen vierzig Leute.
    example_en: The businesswoman now employs forty people.
    example_ru: Предпринимательница теперь даёт работу сорока людям.
    example_uk: Підприємиця тепер дає роботу сорока людям.
    note:
      en: 'Regular -erin on an inseparable verb stem, so nothing shifts and the stress stays on the third syllable. German business writing likes the compound die Jungunternehmerin for a young founder and die Gründerin for anybody who has started something. Beside them, die Chefin is the boss of a place whether she owns it or not, and die Geschäftsführerin is the managing director, an office rather than an ownership.'
      ru: 'Правильное -erin на основе неотделяемого глагола: ничего не сдвигается, ударение остаётся на третьем слоге. Немецкая деловая пресса любит составное die Jungunternehmerin для молодой основательницы и die Gründerin для всякого, кто что-то начал. Рядом: die Chefin — начальница заведения независимо от того, владеет ли она им, а die Geschäftsführerin — управляющая, то есть должность, а не собственность.'
      uk: 'Правильне -erin на основі невідокремлюваного дієслова: нічого не зсувається, наголос лишається на третьому складі. Німецька ділова преса любить складне die Jungunternehmerin для молодої засновниці та die Gründerin для всякого, хто щось почав. Поряд: die Chefin — начальниця закладу незалежно від того, чи володіє вона ним, а die Geschäftsführerin — керуюча, тобто посада, а не власність.'

  - de: Händler
    ipa: "ˈhɛndlɐ"
    pos: noun
    gender: m
    plural: "die Händler"
    en: a man who buys goods and sells them on as his business
    en_compact: "dealer, trader"
    ru: тот, кто закупает товар и перепродаёт его как своё дело
    uk: той, хто закуповує товар і перепродає його як свою справу
    example_de: Den Wagen habe ich bei einem Händler in der Nähe gekauft.
    example_en: I bought the car from a dealer nearby.
    example_ru: Машину я купил у дилера неподалёку.
    example_uk: Автівку я купив у дилера неподалік.
    note:
