      ru: 'Всё значение — в торговле как деле, а не в прилавке: der Verkäufer уровня A2 — тот, кто обслуживает вас в магазине, а здесь речь о том, кому принадлежит товар. Слово живёт в составных, называющих предмет торговли: der Autohändler, der Buchhändler, der Großhändler — оптовик, der Einzelhändler — розничный торговец. Сама торговля — der Handel, а глагол handeln значит ещё «действовать» и «торговаться».'
      uk: 'Усе значення — у торгівлі як справі, а не в прилавку: der Verkäufer рівня A2 — той, хто обслуговує вас у крамниці, а тут ідеться про того, кому належить товар. Слово живе у складних, що називають предмет торгівлі: der Autohändler, der Buchhändler, der Großhändler — оптовик, der Einzelhändler — роздрібний торговець. Сама торгівля — der Handel, а дієслово handeln означає ще «діяти» і «торгуватися».'

