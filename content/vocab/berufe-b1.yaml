    example_uk: З питаннями щодо страхування звертайтеся до знавця справи.
    note:
      en: 'The one feminine in this deck that is not built with -in: the masculine ends in -mann, so German swaps the whole element for -frau, exactly as in der Kaufmann and die Kauffrau, der Feuerwehrmann and die Feuerwehrfrau. Switzerland has made this the official pattern for trade qualifications — die Fachfrau Gesundheit — and Germany is following. The plural takes -en, not the umlaut of die Frauen alone.'
      ru: 'Единственная женская форма в этой колоде, построенная не на -in: мужская кончается на -mann, и немецкий заменяет весь этот элемент на -frau — ровно как в der Kaufmann и die Kauffrau, der Feuerwehrmann и die Feuerwehrfrau. Швейцария сделала эту модель официальной для профессиональных квалификаций — die Fachfrau Gesundheit, — и Германия идёт следом. Множественное на -en, а не просто с умлаутом, как у die Frauen.'
      uk: 'Єдина жіноча форма в цій колоді, побудована не на -in: чоловіча закінчується на -mann, і німецька замінює весь цей елемент на -frau — точно як у der Kaufmann і die Kauffrau, der Feuerwehrmann і die Feuerwehrfrau. Швейцарія зробила цю модель офіційною для фахових кваліфікацій — die Fachfrau Gesundheit, — і Німеччина йде слідом. Множина на -en, а не просто з умлаутом, як у die Frauen.'

  - de: Fachleute
    ipa: "ˈfaxˌlɔʏ̯tə"
    pos: phrase
    # Recognition only: the shared plural of the two entries above, and a
    # plural-only word — there is no singular for a typed prompt to ask for.
    cards: recognition
    en: people who know a trade or a field, taken together as a group
    en_compact: "professionals, specialists"
    ru: люди, знающие своё дело, взятые как группа
    uk: люди, що знають свою справу, взяті як група
    example_de: Fachleute rechnen mit einer Lösung erst im nächsten Jahr.
    example_en: Professionals expect a solution only next year.
    example_ru: Специалисты ожидают решения не раньше следующего года.
    example_uk: Фахівці очікують розв’язання не раніше наступного року.
    note:
      en: 'Plural only, and it is the ordinary plural of both entries above at once — which is why German so often reaches for it in a headline where naming a gender would be awkward. The element -leute replaces -mann and -frau throughout the language: die Kaufleute, die Geschäftsleute, die Eheleute, die Landsleute. A singular exists only through die Fachkraft, which an advert uses because it is feminine in form but neutral in meaning.'
      ru: 'Слово только во множественном числе, и это обычное множественное сразу для обеих записей выше — оттого немецкий так часто берёт его в заголовок, где называть пол было бы неловко. Элемент -leute заменяет -mann и -frau по всему языку: die Kaufleute, die Geschäftsleute, die Eheleute, die Landsleute. Единственное существует только через die Fachkraft, которое берёт объявление: по форме оно женского рода, а по смыслу нейтрально.'
      uk: 'Слово лише в множині, і це звичайна множина одразу для обох записів вище — тому німецька так часто бере його в заголовок, де називати стать було б незручно. Елемент -leute заміняє -mann і -frau по всій мові: die Kaufleute, die Geschäftsleute, die Eheleute, die Landsleute. Однина існує лише через die Fachkraft, яке бере оголошення: за формою воно жіночого роду, а за змістом нейтральне.'

