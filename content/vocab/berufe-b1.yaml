    en_compact: "specialist (female)"
    ru: женщина, которая работает в одной узкой области и ничем другим не занимается
    uk: жінка, яка працює в одній вузькій галузі й нічим іншим не займається
    example_de: Sie ist Spezialistin für alte Musik.
    example_en: She is a specialist in early music.
