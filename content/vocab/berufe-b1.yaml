      ru: 'Английское заимствование, сохранившее английское произношение: поэтому первый слог звучит как Männ-, а g — как мягкое дж. Регистр деловой: der Chef уровня A2 — начальник, которому вы подчиняетесь на деле, der Leiter называет должность, а это слово намекает на фирму, достаточно большую, чтобы их было несколько. В спорте так называют того, кто ведёт клуб или дела артиста, а das Management — и деятельность, и команда руководителей.'
      uk: 'Англійське запозичення, що зберегло англійську вимову: тому перший склад звучить як Männ-, а g — як м’яке дж. Регістр діловий: der Chef рівня A2 — начальник, якому ви підпорядковані насправді, der Leiter називає посаду, а це слово натякає на фірму, достатньо велику, щоб їх було кілька. У спорті так звуть того, хто веде клуб або справи артиста, а das Management — і діяльність, і команда керівників.'

