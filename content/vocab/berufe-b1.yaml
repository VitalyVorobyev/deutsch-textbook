      uk: 'Слабкий іменник: в усіх відмінках, крім називного однини, додається -n — den Experten, dem Experten, die Experten. Слово заявляє знання, а не посаду, — тому телестудія запрошує таку людину пояснювати, а не працювати. Поряд: der Spezialist нижче визначається роботою у вузькій галузі, а der Fachmann — знанням практичного ремесла. Жіноча форма — die Expertin, а те, чим вони володіють, — das Expertenwissen.'

