# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the general
# abstract field of data/goethe-b1-wortliste.txt: the words a B1 reading text uses
# to sort things into kinds, to weigh what may go well against what may go wrong,
# to set what is against what was imagined, and to judge without naming anything
# concrete at all. These are the words that carry the sentences *around* the topic
# vocabulary, in every unit and in none of them.
# A2's `nebensaetze-plaene` owns the reason and the plan (Grund, Idee, Problem,
# Lösung, Meinung), A2's `dinge-sachen-a2` owns the unnamed object and the
# comparison (Ding, Sache, Mittel, Unterschied, Situation), A2's `kernwortschatz-a2`
# owns the plain adjectives (schwierig), A2's `charakter-eigenschaften-a2` owns aktiv,
# B1's `eigenschaften-bewertung-b1` owns the evaluating adjectives (sinnvoll,
# erforderlich, allgemein, eindeutig), B1's `graduierung-mengenwoerter-b1` owns the
# hedges and the amounts (ziemlich, höchstens, mehrere, ungefähr), and B1's
# `verben-handlungen-b1-2` and `-b1-3` own the abstract verbs of doing and finding
# out (entwickeln, verursachen, feststellen, annehmen). This deck is the layer
# between them: the nouns those seven leave unnamed and the four adjective pairs a
# report is built on, which none of them teaches.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# met while reading; the learner who has to *write* the same thought reaches for the
# A1 or A2 word beside it, and that word already ships as a typed card.
id: abstrakte-begriffe-b1
title_de: "Abstrakte Begriffe"
title_en: "Abstract terms"
title_ru: "Отвлечённые понятия"
title_uk: "Відсторонені поняття"
level: B1
entries:
  # --- Art, Typ, System: womit ein Text ordnet ---
  - de: Art
    ipa: "ˈaːɐ̯t"
    pos: noun
    gender: f
    plural: "die Arten"
    cards: recognition
    en: the kind or sort something belongs to; also the way in which something is done
    ru: разряд или сорт, к которому что-либо относится; а также способ, каким что-либо делается
    uk: розряд або ґатунок, до якого щось належить; а також спосіб, у який щось робиться
    example_de: Diese Art von Problem kenne ich schon lange.
    example_en: I have known this kind of problem for a long time.
    example_ru: Такого рода задачи мне давно знакомы.
    example_uk: Такого штибу задачі мені давно знайомі.
    note:
      en: 'Feminine, plural die Arten. The sorting sense comes in two shapes and both are correct: eine Art von Musik and, with nothing between, eine Art Musik. The manner sense lives in the fixed pair die Art und Weise and in auf diese Art. Said of a person it names their way of being: Das ist nicht seine Art. A fourth sense belongs to biology, where eine Art is a species: die bedrohten Arten. The vowel is long and the r is vocalised, so it does not rhyme with hart.'
      ru: 'Женский род, множественное die Arten. Значение разряда даёт две конструкции, и обе верны: eine Art von Musik и, без ничего между, eine Art Musik. Значение способа держится в устойчивой паре die Art und Weise и в обороте auf diese Art. О человеке слово говорит про манеру держаться: Das ist nicht seine Art. Четвёртое значение принадлежит биологии — вид: die bedrohten Arten. Гласный долгий, r вокализовано, так что с hart слово не рифмуется.'
      uk: 'Жіночий рід, множина die Arten. Значення розряду дає дві конструкції, і обидві правильні: eine Art von Musik і, без нічого поміж, eine Art Musik. Значення способу тримається в усталеній парі die Art und Weise та у звороті auf diese Art. Про людину слово каже про манеру триматися: Das ist nicht seine Art. Четверте значення належить біології — вид: die bedrohten Arten. Голосний довгий, r вокалізоване, тож із hart слово не римується.'

  - de: Typ
    ipa: "ˈtyːp"
    pos: noun
    gender: m
    plural: "die Typen"
    cards: recognition
    en: one of the sorts a thing is built in, named by a model or a number; in speech also a man whose name is not given
    ru: один из видов, в которых предмет выпускается, названный моделью или номером; в речи — ещё и мужчина, чьё имя не называют
    uk: один із видів, у яких предмет випускається, названий моделлю чи номером; у мовленні — ще й чоловік, чиє ім'я не називають
    example_de: Dieser Typ von Motor ist besonders sparsam.
    example_en: This type of engine is particularly economical.
    example_ru: Этот тип двигателя особенно экономичен.
    example_uk: Цей тип двигуна особливо ощадливий.
    note:
      en: 'The declension is mixed and worth a second look: genitive des Typs with -s, but plural die Typen with -en, where most nouns making an -en plural would take -en everywhere. In the colloquial sense of a man, speech carries the -en into the singular as well: Ich kenne den Typen. Careful with die Type, a separate feminine word meaning a printing letter and, of a person, an odd character. The technical family runs der Fahrzeugtyp, die Typenbezeichnung and the adjective typisch.'
      ru: 'Склонение смешанное, и на него стоит взглянуть дважды: родительный des Typs с -s, но множественное die Typen с -en, тогда как большинство слов с множественным на -en брали бы -en везде. В разговорном значении «мужик, парень» речь переносит -en и в единственное: Ich kenne den Typen. Осторожно с die Type: это отдельное слово женского рода — типографская литера, а о человеке «чудак». Техническое семейство даёт der Fahrzeugtyp, die Typenbezeichnung и прилагательное typisch.'
      uk: 'Відмінювання мішане, і на нього варто глянути двічі: родовий des Typs з -s, але множина die Typen з -en, тоді як більшість слів із множиною на -en брали б -en усюди. У розмовному значенні «хлопець, тип» мовлення переносить -en і в однину: Ich kenne den Typen. Обережно з die Type: це окреме слово жіночого роду — друкарська літера, а про людину «дивак». Технічна родина дає der Fahrzeugtyp, die Typenbezeichnung і прикметник typisch.'

  - de: Faktor
    ipa: "ˈfaktoːɐ̯"
    pos: noun
    gender: m
    plural: "die Faktoren"
    cards: recognition
    en: one of the several things that together decide how something turns out
    ru: одно из нескольких обстоятельств, которые вместе решают, чем дело кончится
    uk: одна з кількох обставин, які разом вирішують, чим справа скінчиться
    example_de: Der Preis war für uns der wichtigste Faktor.
    example_en: Price was the most important factor for us.
    example_ru: Цена была для нас самым важным фактором.
    example_uk: Ціна була для нас найважливішим чинником.
    note:
      en: 'A Latin noun in -or, and the stress moves in the plural: der Fáktor but die Faktóren, exactly as with A2 der Motor in the deck `verkehr-unterwegs-a2` and A2 der Autor. In the singular the final -or is the vocalised r. Reports are built on it: ein entscheidender Faktor, der Faktor Zeit, der Risikofaktor, and in arithmetic a Faktor is one of the numbers multiplied. It never stands alone as the whole reason; that is A2 der Grund in the deck `nebensaetze-plaene`.'
      ru: 'Латинское существительное на -or, и во множественном ударение переезжает: der Fáktor, но die Faktóren — ровно как у der Motor уровня A2 из колоды `verkehr-unterwegs-a2` и у der Autor уровня A2. В единственном конечное -or звучит с вокализованным r. На этом слове держатся отчёты: ein entscheidender Faktor, der Faktor Zeit, der Risikofaktor, а в арифметике Faktor — один из перемножаемых чисел. Целой причиной оно никогда не бывает: это der Grund уровня A2 из колоды `nebensaetze-plaene`.'
      uk: 'Латинський іменник на -or, і в множині наголос переїжджає: der Fáktor, але die Faktóren — точно як у der Motor рівня A2 з колоди `verkehr-unterwegs-a2` і в der Autor рівня A2. В однині кінцеве -or звучить із вокалізованим r. На цьому слові тримаються звіти: ein entscheidender Faktor, der Faktor Zeit, der Risikofaktor, а в арифметиці Faktor — одне з перемножуваних чисел. Цілою причиною воно ніколи не буває: це der Grund рівня A2 з колоди `nebensaetze-plaene`.'

  - de: Bereich
    ipa: "bəˈʁaɪ̯ç"
    pos: noun
    gender: m
    plural: "die Bereiche"
    cards: recognition
    en: 'a marked-off part of something larger: a field of work, a section of a building, or a stretch on a scale'
    ru: 'очерченная часть чего-то большего: область деятельности, участок здания или отрезок на шкале'
    uk: 'окреслена частина чогось більшого: галузь діяльності, ділянка будівлі або відтинок на шкалі'
    example_de: In diesem Bereich hat sie viel Erfahrung.
    example_en: She has a lot of experience in this field.
    example_ru: В этой области у неё большой опыт.
    example_uk: У цій галузі в неї великий досвід.
    note:
      en: 'Masculine, plural in -e. It is the word a text uses to cut something big into named parts, and it works in three quite different sizes: im Bereich der Medizin for a field of knowledge, der Eingangsbereich for the part of a station near the doors, im Bereich von 20 bis 30 Grad for a stretch of a scale. Behind it is the same Reich as in Königreich, a stretch that somebody rules. Compounds: der Fachbereich at a university, der Wohnbereich in a flat advert.'
      ru: 'Мужской род, множественное на -e. Этим словом текст режет большое на именованные части, и работает оно в трёх совсем разных масштабах: im Bereich der Medizin — область знания, der Eingangsbereich — часть вокзала у дверей, im Bereich von 20 bis 30 Grad — отрезок шкалы. За ним стоит то же Reich, что в Königreich: пространство, на которое простирается власть. Сложные слова: der Fachbereich в университете, der Wohnbereich в объявлении о квартире.'
      uk: 'Чоловічий рід, множина на -e. Цим словом текст ріже велике на іменовані частини, і працює воно в трьох зовсім різних масштабах: im Bereich der Medizin — галузь знання, der Eingangsbereich — частина вокзалу біля дверей, im Bereich von 20 bis 30 Grad — відтинок шкали. За ним стоїть те саме Reich, що в Königreich: простір, на який сягає влада. Складні слова: der Fachbereich в університеті, der Wohnbereich в оголошенні про квартиру.'

  - de: System
    ipa: "zʏsˈteːm"
    pos: noun
    gender: n
    plural: "die Systeme"
    cards: recognition
    en: a set of parts working together by rules, taken as one whole
    ru: набор частей, работающих вместе по правилам и взятых как одно целое
    uk: набір частин, що працюють разом за правилами і взяті як одне ціле
    example_de: Das neue System funktioniert seit Montag ohne Probleme.
    example_en: The new system has been working without problems since Monday.
    example_ru: Новая система работает без сбоев с понедельника.
    example_uk: Нова система працює без збоїв від понеділка.
    note:
      en: 'Neuter, plural in -e, stress on the second syllable, and the y is the short front-rounded vowel, so the word does not sound the way its spelling suggests to a reader of English. One word covers a machine setup, a body of rules and any ordered arrangement at all: das Betriebssystem, das Schulsystem, das Gesundheitssystem, and System in etwas bringen for putting order into something. Greek-rooted neuters of this family sit together in the learner''s mind with A2 das Problem and das Thema.'
      ru: 'Средний род, множественное на -e, ударение на втором слоге, а y — краткий огублённый переднего ряда, так что на письме слово выглядит иначе, чем звучит. Одно слово покрывает и машинную настройку, и свод правил, и любое упорядоченное устройство вообще: das Betriebssystem, das Schulsystem, das Gesundheitssystem, а System in etwas bringen — «навести в чём-то порядок». Греческие по корню слова этого семейства стоят в памяти рядом с das Problem и das Thema уровня A2.'
      uk: 'Середній рід, множина на -e, наголос на другому складі, а y — короткий огублений переднього ряду, тож на письмі слово має інший вигляд, ніж звучить. Одне слово покриває і машинне налаштування, і звід правил, і будь-який упорядкований устрій узагалі: das Betriebssystem, das Schulsystem, das Gesundheitssystem, а System in etwas bringen — «навести в чомусь лад». Грецькі за коренем слова цієї родини стоять у пам''яті поряд із das Problem і das Thema рівня A2.'

  - de: Fall
    ipa: "ˈfal"
    pos: noun
    gender: m
    plural: "die Fälle"
    cards: recognition
    en: one single instance of something happening, and, in official language, a matter somebody is dealing with
    ru: отдельный случай того, что происходит, а в казённом языке — дело, которым кто-то занимается
    uk: окремий випадок того, що відбувається, а в казенній мові — справа, якою хтось займається
    example_de: In diesem Fall müssen Sie einen Antrag stellen.
    example_en: In that case you have to submit an application.
    example_ru: В этом случае вам нужно подать заявление.
    example_uk: У цьому разі вам потрібно подати заяву.
    note:
      en: 'Masculine, plural with an umlaut. Fixed chunks carry most of its work: auf jeden Fall, auf keinen Fall, im Fall einer Krankheit, für den Fall, dass …, and B1 der Notfall. Official German makes it a matter under treatment, der Fall Müller, and a grammar book makes it a case, so a German course speaks of die vier Fälle beside der Kasus. Behind all of them is fallen: the plain act of falling survives in der freie Fall and in der Wasserfall.'
      ru: 'Мужской род, во множественном умлаут. Большую часть работы несут устойчивые обороты: auf jeden Fall, auf keinen Fall, im Fall einer Krankheit, für den Fall, dass …, а также der Notfall уровня B1. Казённый немецкий делает из этого «дело в производстве» — der Fall Müller, а грамматика — падеж, так что курс немецкого говорит die vier Fälle рядом с der Kasus. За всем этим стоит fallen: чистое падение уцелело в der freie Fall и в der Wasserfall.'
      uk: 'Чоловічий рід, у множині умлаут. Більшу частину роботи несуть усталені звороти: auf jeden Fall, auf keinen Fall, im Fall einer Krankheit, für den Fall, dass …, а також der Notfall рівня B1. Казенна німецька робить із цього «справу в провадженні» — der Fall Müller, а граматика — відмінок, тож курс німецької каже die vier Fälle поряд із der Kasus. За всім цим стоїть fallen: чисте падіння вціліло в der freie Fall і в der Wasserfall.'

  # --- Chance und Risiko ---
  - de: Chance
    ipa: "ˈʃɑ̃ːsə"
    pos: noun
    gender: f
    plural: "die Chancen"
    cards: recognition
    en: a real possibility of getting something good, when it is not certain and may not come round again
    ru: настоящая возможность получить что-то хорошее, когда это не гарантировано и может не повториться
    uk: справжня можливість дістати щось добре, коли це не гарантовано і може не повторитися
    example_de: Du hast gute Chancen auf die Stelle.
    example_en: You have a good chance of getting the job.
    example_ru: У тебя хорошие шансы получить это место.
    example_uk: У тебе добрі шанси дістати це місце.
    note:
      en: 'A French loan that kept its French sounds: ʃ at the front and a nasal a in the middle, ˈʃɑ̃ːsə, with a naturalised ˈʃaŋsə heard beside it. Feminine, plural in -n. What is at stake follows auf plus the accusative: Chancen auf einen Platz. A2 die Möglichkeit, in the deck `infinitiv-mit-zu`, is neutral and covers anything that can happen at all; a Chance is a possibility somebody wants, which is why German never speaks of the Chance of an accident. The fairness sense is die Chancengleichheit.'
      ru: 'Французское заимствование, сохранившее французские звуки: ʃ впереди и носовой a в середине — ˈʃɑ̃ːsə, — рядом слышно и обрусевшее по-немецки ˈʃaŋsə. Женский род, множественное на -n. То, что на кону, вводится через auf с винительным: Chancen auf einen Platz. die Möglichkeit уровня A2 из колоды `infinitiv-mit-zu` нейтральна и покрывает всё, что вообще может случиться; Chance — возможность, которой хотят, потому по-немецки не говорят о Chance несчастного случая. Значение равенства возможностей — die Chancengleichheit.'
      uk: 'Французьке запозичення, що зберегло французькі звуки: ʃ спереду і носовий a всередині — ˈʃɑ̃ːsə, — поряд чути й унімечену вимову ˈʃaŋsə. Жіночий рід, множина на -n. Те, що на кону, вводиться через auf зі знахідним: Chancen auf einen Platz. die Möglichkeit рівня A2 з колоди `infinitiv-mit-zu` нейтральна і покриває все, що взагалі може статися; Chance — можливість, якої хочуть, тому по-німецьки не кажуть про Chance нещасного випадку. Значення рівності можливостей — die Chancengleichheit.'

  - de: Risiko
    ipa: "ˈʁiːziko"
    pos: noun
    gender: n
    plural: "die Risiken"
    cards: recognition
    en: the possibility that something goes badly, weighed up before a decision is taken
    ru: возможность того, что дело обернётся плохо, взвешиваемая до принятия решения
    uk: можливість того, що справа обернеться погано, зважувана до ухвалення рішення
    example_de: Das Risiko ist mir einfach zu groß.
    example_en: The risk is simply too great for me.
    example_ru: Риск для меня просто слишком велик.
    example_uk: Ризик для мене просто завеликий.
    note:
      en: 'Neuter, and the plural drops the -o: das Risiko → die Risiken, on the pattern of das Konto → die Konten. Chunks: ein Risiko eingehen, auf eigenes Risiko, das Risiko tragen. Against die Chance above it is the other side of the same decision, which is why a text weighs Chancen und Risiken as a pair. B1 die Gefahr, in the deck `haushalt-notfall-b1`, is a danger that is already there and threatens somebody; a Risiko is one a person knowingly accepts. Adjectives: riskant, risikoreich, risikofrei.'
      ru: 'Средний род, а во множественном -o отпадает: das Risiko → die Risiken, по образцу das Konto → die Konten. Обороты: ein Risiko eingehen, auf eigenes Risiko, das Risiko tragen. Рядом с die Chance выше это другая сторона того же решения, потому текст и взвешивает Chancen und Risiken парой. die Gefahr уровня B1 из колоды `haushalt-notfall-b1` — опасность, которая уже есть и кому-то грозит; Risiko — тот риск, который человек принимает сознательно. Прилагательные: riskant, risikoreich, risikofrei.'
      uk: 'Середній рід, а в множині -o відпадає: das Risiko → die Risiken, за зразком das Konto → die Konten. Звороти: ein Risiko eingehen, auf eigenes Risiko, das Risiko tragen. Поряд із die Chance вище це другий бік того самого рішення, тому текст і зважує Chancen und Risiken парою. die Gefahr рівня B1 з колоди `haushalt-notfall-b1` — небезпека, яка вже є і комусь загрожує; Risiko — той ризик, який людина приймає свідомо. Прикметники: riskant, risikoreich, risikofrei.'

  - de: Schwierigkeit
    ipa: "ˈʃviːʁɪçkaɪ̯t"
    pos: noun
    gender: f
    plural: "die Schwierigkeiten"
    cards: recognition
    en: something that makes a task hard to carry out, and the trouble that comes of it
    ru: то, что делает дело трудным для исполнения, и происходящие отсюда неприятности
    uk: те, що робить справу важкою для виконання, і прикрощі, які звідси постають
    example_de: Bei der Anmeldung gab es einige Schwierigkeiten.
    example_en: There were a few difficulties with the registration.
    example_ru: При регистрации возникли некоторые трудности.
    example_uk: Під час реєстрації виникли деякі труднощі.
    note:
      en: 'Built from A2 schwierig, in the deck `kernwortschatz-a2`, plus -keit, and every noun in -keit is feminine. Most of its life is in the plural: Schwierigkeiten haben, machen, bekommen, in Schwierigkeiten geraten, and jemandem Schwierigkeiten machen for making trouble for somebody. The singular names the hard part itself: Die größte Schwierigkeit war die Sprache. The -ig before the ending is spoken as the soft ch of ich, not as a k.'
      ru: 'Составлено из schwierig уровня A2 из колоды `kernwortschatz-a2` и суффикса -keit, а всякое существительное на -keit женского рода. Живёт слово прежде всего во множественном: Schwierigkeiten haben, machen, bekommen, in Schwierigkeiten geraten, а jemandem Schwierigkeiten machen — «создавать кому-то трудности». Единственное называет само трудное место: Die größte Schwierigkeit war die Sprache. Сочетание -ig перед окончанием звучит мягким ch, как в ich, а не как k.'
      uk: 'Складене зі schwierig рівня A2 з колоди `kernwortschatz-a2` і суфікса -keit, а кожен іменник на -keit жіночого роду. Живе слово передусім у множині: Schwierigkeiten haben, machen, bekommen, in Schwierigkeiten geraten, а jemandem Schwierigkeiten machen — «створювати комусь труднощі». Однина називає саме важке місце: Die größte Schwierigkeit war die Sprache. Сполука -ig перед закінченням звучить м''яким ch, як в ich, а не як k.'

  - de: Herausforderung
    ipa: "hɛˈʁaʊ̯sˌfɔʁdəʁʊŋ"
    pos: noun
    gender: f
    plural: "die Herausforderungen"
    cards: recognition
    en: a demanding task somebody takes on willingly, hard enough to be worth the effort
    ru: требовательная задача, за которую берутся добровольно и которая достаточно трудна, чтобы стоить усилий
    uk: вимоглива задача, за яку беруться добровільно і яка досить важка, щоб бути вартою зусиль
    example_de: Die neue Stelle ist eine große Herausforderung für ihn.
    example_en: The new job is a big challenge for him.
    example_ru: Новая должность для него большой вызов.
    example_uk: Нова посада для нього великий виклик.
    note:
      en: 'From herausfordern, to call somebody out, and it keeps a positive charge that Problem and Schwierigkeit above do not have: a job advert offering eine spannende Herausforderung is promising that the work will be hard, and means it as an attraction. Feminine like every noun in -ung, plural in -en. Chunks: vor einer Herausforderung stehen, and sich einer Herausforderung stellen, which takes the dative. Primary stress falls on -aus-.'
      ru: 'От herausfordern — «бросить вызов», и слово сохраняет положительный заряд, которого нет у Problem и у Schwierigkeit выше: объявление о работе, обещающее eine spannende Herausforderung, обещает, что работа будет трудной, и подаёт это как приманку. Женский род, как у всех существительных на -ung, множественное на -en. Обороты: vor einer Herausforderung stehen и sich einer Herausforderung stellen — с дательным. Главное ударение падает на -aus-.'
      uk: 'Від herausfordern — «кинути виклик», і слово зберігає позитивний заряд, якого немає в Problem і в Schwierigkeit вище: оголошення про роботу, що обіцяє eine spannende Herausforderung, обіцяє важку роботу і подає це як принаду. Жіночий рід, як в усіх іменників на -ung, множина на -en. Звороти: vor einer Herausforderung stehen і sich einer Herausforderung stellen — з давальним. Головний наголос падає на -aus-.'

  - de: Ursache
    ipa: "ˈuːɐ̯zaxə"
    pos: noun
    gender: f
    plural: "die Ursachen"
    cards: recognition
    en: the thing that made something else happen, as an investigation would name it
    ru: то, из-за чего произошло другое, — в той формулировке, какую даёт расследование
    uk: те, через що сталося інше, — у тому формулюванні, яке дає розслідування
    example_de: Die Ursache des Brandes ist noch unklar.
    example_en: The cause of the fire is still unclear.
    example_ru: Причина пожара пока неясна.
    example_uk: Причина пожежі поки що незрозуміла.
    note:
      en: 'Ur-, meaning original, plus die Sache, and B1 verursachen in the deck `verben-handlungen-b1-2` is the verb. Keep it apart from A2 der Grund, in the deck `nebensaetze-plaene`: a Grund is the reason a person gives for doing something, an Ursache is what actually produced the effect, so a fire has an Ursache and a resignation has a Grund. The pair Ursache und Wirkung is fixed. One everyday phrase is learned whole: Keine Ursache! is a polite reply to thank you.'
      ru: 'Ur- — «изначальный» — плюс die Sache, а глагол к нему — verursachen уровня B1 из колоды `verben-handlungen-b1-2`. Не смешивайте с der Grund уровня A2 из колоды `nebensaetze-plaene`: Grund — основание, которое человек приводит для своего поступка, а Ursache — то, что действительно вызвало следствие, поэтому у пожара Ursache, а у увольнения по собственному Grund. Пара Ursache und Wirkung устойчива. Один обиходный оборот учат целиком: Keine Ursache! — вежливый ответ на благодарность.'
      uk: 'Ur- — «первісний» — плюс die Sache, а дієслово до нього — verursachen рівня B1 з колоди `verben-handlungen-b1-2`. Не змішуйте з der Grund рівня A2 з колоди `nebensaetze-plaene`: Grund — підстава, яку людина наводить для свого вчинку, а Ursache — те, що справді викликало наслідок, тому в пожежі Ursache, а у звільненні за власним бажанням Grund. Пара Ursache und Wirkung усталена. Один побутовий зворот учать цілком: Keine Ursache! — ввічлива відповідь на подяку.'

  - de: Druck
    ipa: "ˈdʁʊk"
    pos: noun
    gender: m
    plural: "die Drücke"
    cards: recognition
    en: force pressing on something, and the strain a person is under from what others expect; also the printing of texts and pictures
    ru: сила, давящая на что-либо, и напряжение человека под чужими ожиданиями; а также печатание текстов и изображений
    uk: сила, що тисне на щось, і напруга людини під чужими очікуваннями; а також друкування текстів і зображень
    example_de: Sie steht im Moment unter großem Druck.
    example_en: She is under a lot of pressure at the moment.
    example_ru: Сейчас она под сильным давлением.
    example_uk: Зараз вона під сильним тиском.
    note:
      en: 'The two senses even take different plurals, which is rare enough to notice: die Drücke for pressure and die Drucke for printed pieces, though in the pressure sense the word is normally uncountable anyway. The human sense is everywhere in B1 texts: unter Druck stehen, jemanden unter Druck setzen, der Zeitdruck, der Leistungsdruck. Behind it stands A2 drücken. The printing family runs A2 drucken in the deck `digital-medien-a2`, der Drucker and der Buchdruck.'
      ru: 'У двух значений даже множественное разное — редкость, которую стоит заметить: die Drücke для давления и die Drucke для печатных изданий, хотя в значении давления слово обычно и вовсе не считается. Человеческое значение пронизывает тексты уровня B1: unter Druck stehen, jemanden unter Druck setzen, der Zeitdruck, der Leistungsdruck. За ним стоит drücken уровня A2. Печатное семейство даёт drucken уровня A2 из колоды `digital-medien-a2`, der Drucker и der Buchdruck.'
      uk: 'У двох значень навіть множина різна — рідкість, яку варто помітити: die Drücke для тиску і die Drucke для друкованих видань, хоча в значенні тиску слово зазвичай і зовсім не рахується. Людське значення пронизує тексти рівня B1: unter Druck stehen, jemanden unter Druck setzen, der Zeitdruck, der Leistungsdruck. За ним стоїть drücken рівня A2. Друкарська родина дає drucken рівня A2 з колоди `digital-medien-a2`, der Drucker і der Buchdruck.'

  # --- Wirklichkeit und Fantasie ---
  - de: Wirklichkeit
    ipa: "ˈvɪʁklɪçkaɪ̯t"
    pos: noun
    gender: f
    plural: "die Wirklichkeiten"
    cards: recognition
    en: the world as it actually is, set against what was imagined, hoped for or claimed
    ru: мир таким, каков он на деле, в противопоставлении воображённому, желаемому или заявленному
    uk: світ таким, яким він є насправді, у протиставленні уявленому, бажаному чи заявленому
    example_de: In Wirklichkeit war alles ganz anders.
    example_en: In reality everything was quite different.
    example_ru: На деле всё было совсем иначе.
    example_uk: Насправді все було зовсім інакше.
    note:
      en: 'German-rooted, from A2 wirklich in the deck `kleine-woerter-a2` and behind that wirken, to have an effect, so the Wirklichkeit is what actually acts on us. Feminine like every noun in -keit; a plural exists but is rare, and the singular does nearly all the work. Two chunks carry it: in Wirklichkeit, which corrects an impression somebody has, and etwas wird Wirklichkeit, which is what happens to a plan or a dream. Where this word sounds plain and a shade literary, die Realität below sounds sober and technical.'
      ru: 'Слово исконно немецкое: от wirklich уровня A2 из колоды `kleine-woerter-a2`, а за ним wirken — «действовать», так что Wirklichkeit — то, что на нас действительно действует. Женский род, как у всех слов на -keit; множественное существует, но редко, и почти всю работу делает единственное. Слово держат два оборота: in Wirklichkeit, который поправляет чужое впечатление, и etwas wird Wirklichkeit — то, что случается с планом или мечтой. Там, где это слово звучит просто и чуть литературно, die Realität ниже звучит трезво и технически.'
      uk: 'Слово питомо німецьке: від wirklich рівня A2 з колоди `kleine-woerter-a2`, а за ним wirken — «діяти», тож Wirklichkeit — те, що на нас справді діє. Жіночий рід, як в усіх слів на -keit; множина існує, але рідко, і майже всю роботу робить однина. Слово тримають два звороти: in Wirklichkeit, який виправляє чуже враження, і etwas wird Wirklichkeit — те, що стається з планом або мрією. Там, де це слово звучить просто і трохи літературно, die Realität нижче звучить тверезо й технічно.'

  - de: Realität
    ipa: "ʁealiˈtɛːt"
    pos: noun
    gender: f
    plural: "die Realitäten"
    cards: recognition
    en: the state of things as it can be checked and measured, especially where somebody has to come to terms with it
    ru: положение дел в том виде, в каком его можно проверить и измерить, особенно там, где с ним приходится смириться
    uk: стан справ у тому вигляді, у якому його можна перевірити і виміряти, надто там, де з ним доводиться змиритися
    example_de: Diese Pläne haben mit der Realität wenig zu tun.
    example_en: These plans have little to do with reality.
    example_ru: Эти планы мало соотносятся с реальностью.
    example_uk: Ці плани мало пов'язані з реальністю.
    note:
      en: 'The Latin-rooted sibling of die Wirklichkeit above; the difference is register and what each one can do. This one takes a plural readily and names hard facts a person must face: die Realitäten des Arbeitsmarktes, die harten Realitäten. It is also the half that technical German builds on: die virtuelle Realität, der Realitätsverlust, realitätsnah. Feminine like every noun in -tät, plural in -en, stress on the last syllable. A report reaches for Realität; a story reaches for Wirklichkeit.'
      ru: 'Латинский по корню родственник die Wirklichkeit выше; разница — в регистре и в том, что каждое из них умеет. Это легко берёт множественное и называет жёсткие обстоятельства, с которыми приходится считаться: die Realitäten des Arbeitsmarktes, die harten Realitäten. На нём же строится технический немецкий: die virtuelle Realität, der Realitätsverlust, realitätsnah. Женский род, как у всех слов на -tät, множественное на -en, ударение на последнем слоге. Отчёт возьмёт Realität, рассказ — Wirklichkeit.'
      uk: 'Латинський за коренем родич die Wirklichkeit вище; різниця — у регістрі й у тому, що кожне з них уміє. Це легко бере множину і називає жорсткі обставини, з якими доводиться рахуватися: die Realitäten des Arbeitsmarktes, die harten Realitäten. На ньому ж будується технічна німецька: die virtuelle Realität, der Realitätsverlust, realitätsnah. Жіночий рід, як в усіх слів на -tät, множина на -en, наголос на останньому складі. Звіт візьме Realität, оповідання — Wirklichkeit.'

  - de: realistisch
    ipa: "ʁeaˈlɪstɪʃ"
    pos: adj
    cards: recognition
    en: keeping to what can actually be expected or done; of a picture or a story, close to how things really look
    ru: держащийся того, чего действительно можно ждать или добиться; о картине или рассказе — близкий к тому, как всё выглядит на самом деле
    uk: що тримається того, чого справді можна чекати або досягти; про картину чи оповідь — близький до того, як усе виглядає насправді
    example_de: 'Sei bitte realistisch: das schaffen wir nicht in einer Woche.'
    example_en: 'Please be realistic: we will not manage that in a week.'
    example_ru: 'Давай по-честному: за неделю мы этого не сделаем.'
    example_uk: 'Будьмо чесні: за тиждень ми цього не зробимо.'
    note:
      en: 'Ordinary endings, and the negative is unrealistisch. Two senses are worth keeping apart: ein realistischer Plan is one that can actually be carried out, while ein realistisches Bild is one that looks like its subject. The person is der Realist, a weak masculine taking -en in every case but the nominative singular. Do not use it for the adverb meaning in fact; that is A2 wirklich or B1 tatsächlich in the deck `meinung-medien`.'
      ru: 'Окончания обычные, отрицание — unrealistisch. Два значения стоит развести: ein realistischer Plan — план, который действительно выполним, а ein realistisches Bild — картина, похожая на то, что изображает. Человек — der Realist, слабое существительное мужского рода, берущее -en во всех падежах, кроме именительного единственного. Не берите его для наречия «на самом деле»: это wirklich уровня A2 или tatsächlich уровня B1 из колоды `meinung-medien`.'
      uk: 'Закінчення звичайні, заперечення — unrealistisch. Два значення варто розвести: ein realistischer Plan — план, який справді здійсненний, а ein realistisches Bild — картина, схожа на те, що зображує. Людина — der Realist, слабкий іменник чоловічого роду, що бере -en в усіх відмінках, крім називного однини. Не беріть його для прислівника «насправді»: це wirklich рівня A2 або tatsächlich рівня B1 з колоди `meinung-medien`.'

  - de: Fantasie
    ipa: "fantaˈziː"
    pos: noun
    gender: f
    plural: "die Fantasien"
    cards: recognition
    en: the power to picture things that are not in front of you, and one of the pictures it makes
    ru: способность представлять то, чего нет перед глазами, и один из создаваемых ею образов
    uk: здатність уявляти те, чого немає перед очима, і один зі створюваних нею образів
    example_de: Für diese Arbeit braucht man viel Fantasie.
    example_en: This work takes a lot of imagination.
    example_ru: Для этой работы нужно много воображения.
    example_uk: Для цієї роботи потрібно багато уяви.
    note:
      en: 'Feminine like every noun in -ie, with the stress on that ending; the plural adds -n and the ending is then read as two syllables. The 1996 reform made Fantasie the main spelling and left Phantasie standing beside it, so older books show the other one. As a quality it has no plural, viel Fantasie haben, while single imaginings do have one, seine Fantasien. Related: fantasievoll and fantastisch, which in everyday speech simply means great.'
      ru: 'Женский род, как у всех слов на -ie, и ударение на этом окончании; множественное прибавляет -n, и окончание тогда читается двумя слогами. Реформа 1996 года сделала главным написание Fantasie, оставив рядом Phantasie, так что в книгах постарше встретится второе. Как свойство слово множественного не имеет — viel Fantasie haben, — а отдельные вымыслы имеют: seine Fantasien. Родственники: fantasievoll и fantastisch, которое в обиходе значит просто «замечательный».'
      uk: 'Жіночий рід, як в усіх слів на -ie, і наголос на цьому закінченні; множина додає -n, і закінчення тоді читається двома складами. Реформа 1996 року зробила головним написання Fantasie, лишивши поряд Phantasie, тож у книжках давніших трапиться друге. Як властивість слово множини не має — viel Fantasie haben, — а окремі вигадки мають: seine Fantasien. Родичі: fantasievoll і fantastisch, яке в побуті означає просто «чудовий».'

  - de: Einfall
    ipa: "ˈaɪ̯nˌfal"
    pos: noun
    gender: m
    plural: "die Einfälle"
    cards: recognition
    en: a thought that arrives all at once and turns out to be useful or clever
    ru: мысль, приходящая разом и оказывающаяся полезной или ловкой
    uk: думка, що приходить разом і виявляється корисною або спритною
    example_de: Das war wirklich ein guter Einfall von dir!
    example_en: That really was a good idea of yours!
    example_ru: Это и правда была удачная мысль!
    example_uk: Це справді була влучна думка!
    note:
      en: 'The noun to einfallen below, and the two share one picture: something falls into your head. Masculine, plural with an umlaut, primary stress on Ein-. A2 die Idee, in the deck `nebensaetze-plaene`, is the neutral word and may be worked out over weeks; an Einfall is quick and a little clever, which is why it fits a joke, a name or a way out of an awkward moment. Two other senses are serious: der Einfall of an army into a country, and der Lichteinfall through a window.'
      ru: 'Существительное к einfallen ниже, и оба держат один образ: нечто «падает» в голову. Мужской род, во множественном умлаут, главное ударение на Ein-. die Idee уровня A2 из колоды `nebensaetze-plaene` — нейтральное слово, и её можно вынашивать неделями; Einfall быстр и слегка остроумен, потому и годится для шутки, имени или выхода из неловкости. Ещё два значения серьёзны: der Einfall войска в страну и der Lichteinfall через окно.'
      uk: 'Іменник до einfallen нижче, і обидва тримають один образ: щось «падає» в голову. Чоловічий рід, у множині умлаут, головний наголос на Ein-. die Idee рівня A2 з колоди `nebensaetze-plaene` — нейтральне слово, і її можна виношувати тижнями; Einfall швидкий і трохи дотепний, тому й годиться для жарту, імені або виходу з ніяковості. Ще два значення серйозні: der Einfall війська в країну і der Lichteinfall крізь вікно.'

  - de: einfallen
    ipa: "ˈaɪ̯nˌfalən"
    pos: verb
    praesens_3sg: fällt ein
    partizip2: eingefallen
    aux: sein
    valence: "+ Dat"
    cards: recognition
    en: to come into somebody's mind suddenly, as a name or an answer does
    ru: внезапно приходить кому-либо в голову, как приходит имя или ответ
    uk: раптово спадати комусь на думку, як спадає ім'я чи відповідь
    example_de: Mir fällt der Name einfach nicht ein.
    example_en: I simply cannot think of the name.
    example_ru: Никак не могу вспомнить это имя.
    example_uk: Ніяк не можу пригадати це ім'я.
    note:
      en: 'Two things decide whether a sentence with this verb is right. First the pattern, which is worth storing whole: jemandem fällt etwas ein. The person who has the thought stands in the dative and the thought itself is the subject, so it is Mir fällt etwas ein and never Ich falle etwas ein. Second the Perfekt: it is separable and takes sein, ist eingefallen, because fallen does. Two further senses run beside it: an army fällt in ein Land ein, and a roof that gives way fällt ein.'
      ru: 'Правильность предложения с этим глаголом решают две вещи. Первая — конструкция, которую стоит запомнить целиком: jemandem fällt etwas ein. Тот, кому пришла мысль, стоит в дательном, а сама мысль — подлежащее, так что говорят Mir fällt etwas ein и никогда Ich falle etwas ein. По-русски порядок ролей тот же, что в «мне пришло в голову», и опираться удобно именно на это. Вторая — перфект: глагол отделяемый и берёт sein, ist eingefallen, потому что sein берёт fallen. Рядом идут ещё два значения: войско fällt in ein Land ein, а прогнувшаяся крыша fällt ein.'
      uk: 'Правильність речення з цим дієсловом вирішують дві речі. Перша — конструкція, яку варто запам''ятати цілком: jemandem fällt etwas ein. Той, кому спала думка, стоїть у давальному, а сама думка — підмет, тож кажуть Mir fällt etwas ein і ніколи Ich falle etwas ein. Українською порядок ролей той самий, що у «мені спало на думку», і спиратися зручно саме на це. Друга — перфект: дієслово відокремлюване і бере sein, ist eingefallen, бо sein бере fallen. Поряд ідуть ще два значення: військо fällt in ein Land ein, а прогнутий дах fällt ein.'

  - de: realisieren
    ipa: "ʁealiˈziːʁən"
    pos: verb
    praesens_3sg: realisiert
    partizip2: realisiert
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to carry a plan through so that it actually exists; also to become aware of something one had not taken in before
    ru: довести замысел до того, что он существует на деле; а также осознать то, что раньше не доходило
    uk: довести задум до того, що він існує насправді; а також усвідомити те, що раніше не доходило
    example_de: Das Projekt wurde am Ende nie realisiert.
    example_en: In the end the project was never carried out.
    example_ru: В итоге проект так и не был осуществлён.
    example_uk: Зрештою проєкт так і не був здійснений.
    note:
      en: 'A verb in -ieren, so the participle carries no ge- at all: hat realisiert. The first sense is the older one and the safe one in writing, einen Plan or ein Projekt realisieren, and its plain German siblings are verwirklichen and umsetzen. The second sense came in from English and Duden now records it, but careful writers still prefer merken, begreifen or klar werden. Stress on -sie-, and the noun for the carrying out is die Realisierung.'
      ru: 'Глагол на -ieren, поэтому в причастии нет ge- вовсе: hat realisiert. Первое значение старше и безопаснее на письме — einen Plan, ein Projekt realisieren, — а свои немецкие родственники к нему verwirklichen и umsetzen. Второе значение пришло из английского, и Duden его теперь фиксирует, но аккуратный автор всё же предпочтёт merken, begreifen или klar werden. Ударение на -sie-, а существительное для осуществления — die Realisierung.'
      uk: 'Дієслово на -ieren, тому в дієприкметнику немає ge- зовсім: hat realisiert. Перше значення давніше й безпечніше на письмі — einen Plan, ein Projekt realisieren, — а свої німецькі родичі до нього verwirklichen і umsetzen. Друге значення прийшло з англійської, і Duden його тепер фіксує, але ретельний автор усе ж віддасть перевагу merken, begreifen або klar werden. Наголос на -sie-, а іменник для здійснення — die Realisierung.'

  # --- Entwicklung und Umgang ---
  - de: Entwicklung
    ipa: "ɛntˈvɪklʊŋ"
    pos: noun
    gender: f
    plural: "die Entwicklungen"
    cards: recognition
    en: the way something changes across a stretch of time, taken as a whole and usually towards something more finished
    ru: то, как что-либо меняется на протяжении времени, взятое целиком и обычно в сторону более законченного
    uk: те, як щось змінюється протягом часу, узяте цілком і зазвичай у бік завершенішого
    example_de: Die Entwicklung der Preise macht vielen Sorgen.
    example_en: The way prices are developing worries a lot of people.
    example_ru: Динамика цен многих тревожит.
    example_uk: Динаміка цін багатьох тривожить.
    note:
      en: 'The noun to B1 entwickeln in the deck `verben-handlungen-b1-2`; every noun in -ung is feminine and takes -en in the plural. It reaches across every subject a B1 text touches: die wirtschaftliche Entwicklung, die Entwicklung eines Kindes, die Entwicklung eines Medikaments, and das Entwicklungsland. Note the middle: the k belongs to the stem wickeln, so -ckl- is spoken with no vowel between the k and the l. Photography kept a sense of its own, die Entwicklung eines Films.'
      ru: 'Существительное к entwickeln уровня B1 из колоды `verben-handlungen-b1-2`; всякое слово на -ung женского рода и берёт -en во множественном. Оно дотягивается до любой темы, какую трогает текст уровня B1: die wirtschaftliche Entwicklung, die Entwicklung eines Kindes, die Entwicklung eines Medikaments, das Entwicklungsland. Обратите внимание на середину: k принадлежит корню wickeln, так что -ckl- произносится без гласного между k и l. За фотографией осталось своё значение: die Entwicklung eines Films.'
      uk: 'Іменник до entwickeln рівня B1 з колоди `verben-handlungen-b1-2`; кожне слово на -ung жіночого роду і бере -en у множині. Воно сягає будь-якої теми, якої торкається текст рівня B1: die wirtschaftliche Entwicklung, die Entwicklung eines Kindes, die Entwicklung eines Medikaments, das Entwicklungsland. Зверніть увагу на середину: k належить кореневі wickeln, тож -ckl- вимовляється без голосного між k і l. За фотографією лишилося своє значення: die Entwicklung eines Films.'

  - de: Aktivität
    ipa: "aktiviˈtɛːt"
    pos: noun
    gender: f
    plural: "die Aktivitäten"
    cards: recognition
    en: something a person actually does, especially as one of several planned or offered
    ru: то, чем человек занят на деле, особенно как одно из нескольких запланированных или предложенных занятий
    uk: те, чим людина зайнята насправді, надто як одне з кількох запланованих або запропонованих занять
    example_de: Für Kinder gibt es hier zahlreiche Aktivitäten.
    example_en: There are numerous activities for children here.
    example_ru: Для детей здесь множество занятий.
    example_uk: Для дітей тут безліч занять.
    note:
      en: 'From A2 aktiv, in the deck `charakter-eigenschaften-a2`, plus -ität, so feminine, stressed on the last syllable and taking -en in the plural. The plural is the everyday one and belongs to programmes and holidays: Freizeitaktivitäten, sportliche Aktivitäten, das Aktivitätsprogramm. The singular is the fact of being active at all, die wirtschaftliche Aktivität, and belongs to a report. Its counterpart as a quality is die Passivität, built the same way from passiv below.'
      ru: 'От aktiv уровня A2 из колоды `charakter-eigenschaften-a2` плюс -ität: отсюда женский род, ударение на последнем слоге и -en во множественном. Множественное — обиходное и принадлежит программам и отдыху: Freizeitaktivitäten, sportliche Aktivitäten, das Aktivitätsprogramm. Единственное — сама активность как факт, die wirtschaftliche Aktivität, и принадлежит отчёту. Противоположность как свойство — die Passivität, построенная так же от passiv ниже.'
      uk: 'Від aktiv рівня A2 з колоди `charakter-eigenschaften-a2` плюс -ität: звідси жіночий рід, наголос на останньому складі і -en у множині. Множина — побутова і належить програмам та відпочинкові: Freizeitaktivitäten, sportliche Aktivitäten, das Aktivitätsprogramm. Однина — сама активність як факт, die wirtschaftliche Aktivität, і належить звітові. Протилежність як властивість — die Passivität, побудована так само від passiv нижче.'

  - de: auflösen
    ipa: "ˈaʊ̯fˌløːzn̩"
    pos: verb
    praesens_3sg: löst auf
    partizip2: aufgelöst
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to make something come apart until it no longer exists as a whole, whether in a liquid or as an organized body
    ru: довести что-либо до распада, пока оно не перестанет существовать как целое, — в жидкости или как организация
    uk: довести щось до розпаду, доки воно не перестане існувати як ціле, — у рідині або як організація
    example_de: Lösen Sie die Tablette in einem Glas Wasser auf.
    example_en: Dissolve the tablet in a glass of water.
    example_ru: Растворите таблетку в стакане воды.
    example_uk: Розчиніть таблетку у склянці води.
    note:
      en: 'Separable, hat aufgelöst, and it readily turns on itself: der Zucker löst sich auf, die Menge löste sich auf. B1 lösen, in the deck `regeln-verantwortung`, is to solve or to loosen; the prefix carries the sense all the way to nothing left. Three fields use it: a substance in liquid, an organization that is wound up — einen Verein, einen Vertrag auflösen — and a puzzle whose answer is finally given. The noun die Auflösung serves all three, including the answer printed at the back of a quiz.'
      ru: 'Отделяемый, hat aufgelöst, и охотно поворачивается на себя: der Zucker löst sich auf, die Menge löste sich auf. lösen уровня B1 из колоды `regeln-verantwortung` — «решать» или «ослаблять»; приставка доводит смысл до того, что ничего не осталось. Слово работает в трёх полях: вещество в жидкости, организация, которую распускают, — einen Verein, einen Vertrag auflösen — и загадка, ответ на которую наконец дают. Существительное die Auflösung обслуживает все три, включая ответ, напечатанный в конце викторины.'
      uk: 'Відокремлюване, hat aufgelöst, і охоче повертається на себе: der Zucker löst sich auf, die Menge löste sich auf. lösen рівня B1 з колоди `regeln-verantwortung` — «розв''язувати» або «послаблювати»; префікс доводить сенс до того, що нічого не лишилося. Слово працює в трьох полях: речовина в рідині, організація, яку розпускають, — einen Verein, einen Vertrag auflösen — і загадка, відповідь на яку нарешті дають. Іменник die Auflösung обслуговує всі три, включно з відповіддю, надрукованою наприкінці вікторини.'

  - de: verbringen
    ipa: "fɛɐ̯ˈbʁɪŋən"
    pos: verb
    praesens_3sg: verbringt
    partizip2: verbracht
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to pass a stretch of time in a particular place or in a particular way
    ru: проводить отрезок времени в определённом месте или определённым образом
    uk: проводити відтинок часу в певному місці або в певний спосіб
    example_de: Wir haben den ganzen Sommer am Meer verbracht.
    example_en: We spent the whole summer by the sea.
    example_ru: Всё лето мы провели у моря.
    example_uk: Усе літо ми провели біля моря.
    note:
      en: 'Inseparable, so no ge- in the participle, and irregular in the same way as bringen: hat verbracht, never verbringt as a past form. The sentence needs two things, an amount of time and a place or a manner — die Ferien in Italien verbringen, den Abend mit Freunden verbringen — and one that gives only the time sounds unfinished. Keep it apart from vergehen, which has time as its subject: Die Zeit vergeht schnell, but Ich verbringe die Zeit gut.'
      ru: 'Неотделяемый, поэтому ge- в причастии нет, и неправильный так же, как bringen: hat verbracht, а не verbringt в роли прошедшего. Предложению нужны две вещи: количество времени и место или образ — die Ferien in Italien verbringen, den Abend mit Freunden verbringen; фраза, где названо только время, звучит незаконченной. Не смешивайте с vergehen, у которого подлежащее — само время: Die Zeit vergeht schnell, но Ich verbringe die Zeit gut.'
      uk: 'Невідокремлюване, тому ge- у дієприкметнику немає, і неправильне так само, як bringen: hat verbracht, а не verbringt у ролі минулого. Реченню потрібні дві речі: кількість часу і місце або спосіб — die Ferien in Italien verbringen, den Abend mit Freunden verbringen; фраза, де названо лише час, звучить незавершеною. Не змішуйте з vergehen, у якого підметом є сам час: Die Zeit vergeht schnell, але Ich verbringe die Zeit gut.'

  - de: umgehen
    ipa: "ˈʊmˌgeːən"
    pos: verb
    praesens_3sg: geht um
    partizip2: umgegangen
    aux: sein
    valence: "mit + Dat"
    cards: recognition
    en: to deal with a person or a thing in a particular way, well or badly
    ru: обходиться с человеком или вещью определённым образом, хорошо или плохо
    uk: поводитися з людиною чи річчю певним чином, добре або погано
    example_de: Er geht sehr vorsichtig mit dem Geld um.
    example_en: He handles money very carefully.
    example_ru: С деньгами он обращается очень осторожно.
    example_uk: З грішми він поводиться дуже обережно.
    note:
      en: 'German has two verbs spelled this way and the stress tells them apart. This one is stressed on the prefix, ˈumgehen: it is separable, so the prefix leaves the verb — Sie geht gut mit Kindern um — and the Perfekt takes sein, ist umgegangen. The other is stressed on the stem, umˈgehen, is inseparable and means to get round something: Er hat das Gesetz umgangen, with haben and no -ge-. Leave that one alone until the stress is audible. The separable verb also means to go about, of a rumour or an illness: Eine Grippe geht um. The noun is der Umgang.'
      ru: 'В немецком два глагола с этим написанием, и различает их ударение. Здесь ударение на приставке — ˈumgehen: глагол отделяемый, приставка уходит от корня (Sie geht gut mit Kindern um), а перфект берёт sein: ist umgegangen. Другой ударен на корне — umˈgehen, неотделяемый и значит «обойти, обогнуть»: Er hat das Gesetz umgangen, с haben и без -ge-. Второй лучше не трогать, пока ударение не слышится на слух. У отделяемого есть и своё значение «ходить, гулять» — о слухе или болезни: Eine Grippe geht um. Существительное — der Umgang.'
      uk: 'У німецькій два дієслова з цим написанням, і розрізняє їх наголос. Тут наголос на префіксі — ˈumgehen: дієслово відокремлюване, префікс відходить від кореня (Sie geht gut mit Kindern um), а перфект бере sein: ist umgegangen. Інше наголошене на корені — umˈgehen, невідокремлюване і означає «обійти, оминути»: Er hat das Gesetz umgangen, з haben і без -ge-. Друге краще не чіпати, доки наголос не чується на слух. У відокремлюваного є й своє значення «ходити, гуляти» — про чутку чи хворобу: Eine Grippe geht um. Іменник — der Umgang.'

  - de: zugehen
    ipa: "ˈtsuːˌgeːən"
    pos: verb
    praesens_3sg: geht zu
    partizip2: zugegangen
    aux: sein
    valence: "auf + Akk"
    cards: recognition
    en: to walk towards somebody or something; of a door or a lid, to close; and of a place or an occasion, to be a certain way
    ru: подходить к кому-либо или чему-либо; о двери или крышке — закрываться; о месте или событии — обстоять определённым образом
    uk: підходити до когось або чогось; про двері чи накривку — зачинятися; про місце чи подію — відбуватися певним чином
    example_de: Sie ging langsam auf ihn zu und gab ihm die Hand.
    example_en: She walked slowly up to him and shook his hand.
    example_ru: Она медленно подошла к нему и подала руку.
    example_uk: Вона повільно підійшла до нього і подала руку.
    note:
      en: 'Separable throughout and always sein in the Perfekt, ist zugegangen. Three senses take three different shapes, and that is what makes the word worth learning. With auf plus the accusative it is movement towards, and figuratively the first step after a quarrel: auf jemanden zugehen. With no object at all it is the opposite of aufgehen: Die Tür geht nicht zu. With es and a manner adverb it describes what a place was like: Auf dem Fest ging es sehr lustig zu. A fourth use is time running out, Der Sommer geht zu Ende.'
      ru: 'Отделяемый во всех значениях и в перфекте всегда с sein: ist zugegangen. Три значения дают три разные конструкции, и именно поэтому слово стоит выучить. С auf и винительным это движение навстречу, а в переносном смысле — первый шаг после ссоры: auf jemanden zugehen. Совсем без дополнения это противоположность aufgehen: Die Tür geht nicht zu. С es и наречием образа действия описывается, как было в каком-то месте: Auf dem Fest ging es sehr lustig zu. Четвёртое употребление — про истекающее время: Der Sommer geht zu Ende.'
      uk: 'Відокремлюване в усіх значеннях і в перфекті завжди із sein: ist zugegangen. Три значення дають три різні конструкції, і саме тому слово варто вивчити. З auf і знахідним це рух назустріч, а в переносному сенсі — перший крок після сварки: auf jemanden zugehen. Зовсім без додатка це протилежність aufgehen: Die Tür geht nicht zu. З es і прислівником способу дії описується, як було в якомусь місці: Auf dem Fest ging es sehr lustig zu. Четверте вживання — про час, що спливає: Der Sommer geht zu Ende.'

  - de: erfordern
    ipa: "ɛɐ̯ˈfɔʁdɐn"
    pos: verb
    praesens_3sg: erfordert
    partizip2: erfordert
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to make something necessary, as a task makes demands on whoever takes it on
    ru: делать что-либо необходимым — так, как задача предъявляет требования тому, кто за неё берётся
    uk: робити щось необхідним — так, як задача висуває вимоги тому, хто за неї береться
    example_de: Diese Arbeit erfordert viel Geduld.
    example_en: This work demands a lot of patience.
    example_ru: Эта работа требует большого терпения.
    example_uk: Ця робота вимагає великого терпіння.
    note:
      en: 'Inseparable, so the participle has no ge-: hat erfordert. Its subject is a thing and never a person; a job, a plan or a situation erfordert something, and that is what separates it from fordern and verlangen, which a person can also do. Everyday German says brauchen or nötig sein for the same idea, so this word belongs to a written notice or a report. The related adjective is B1 erforderlich in the deck `eigenschaften-bewertung-b1`.'
      ru: 'Неотделяемый, поэтому в причастии нет ge-: hat erfordert. Подлежащим при нём стоит вещь, а не человек: erfordert работа, план, положение дел, — и это отделяет глагол от fordern и verlangen, которые может делать и человек. Обиходный немецкий скажет о том же brauchen или nötig sein, так что это слово принадлежит письменному объявлению и отчёту. Родственное прилагательное — erforderlich уровня B1 из колоды `eigenschaften-bewertung-b1`.'
      uk: 'Невідокремлюване, тому в дієприкметнику немає ge-: hat erfordert. Підметом при ньому стоїть річ, а не людина: erfordert робота, план, стан справ, — і це відділяє дієслово від fordern і verlangen, які може робити й людина. Побутова німецька скаже про те саме brauchen або nötig sein, тож це слово належить письмовому оголошенню й звітові. Споріднений прикметник — erforderlich рівня B1 з колоди `eigenschaften-bewertung-b1`.'

  - de: nützen
    ipa: "ˈnʏtsn̩"
    pos: verb
    praesens_3sg: nützt
    partizip2: genützt
    aux: haben
    valence: "+ Dat"
    cards: recognition
    en: to be of use to somebody, so that they are better off for it
    ru: приносить кому-либо пользу, так что тому от этого лучше
    uk: приносити комусь користь, так що тому від цього краще
    example_de: Das lange Warten hat uns leider nichts genützt.
    example_en: Unfortunately the long wait did us no good at all.
    example_ru: Долгое ожидание, к сожалению, нам ничего не дало.
    example_uk: Довге чекання, на жаль, нам нічого не дало.
    note:
      en: 'The person helped stands in the dative and the thing that helps is the subject: Das nützt mir nichts, Wem nützt das? Beside it stands B1 nutzen in the deck `digitales-leben`, and the two are not the same construction: nutzen takes an accusative object and means to make use of something, die Zeit nutzen, while this one takes the dative and means to be useful. On top of that, the umlauted spelling is the one the south of Germany, Austria and Switzerland prefer even in the dative sense, and the north often writes nutzen there too, so both forms turn up in print. Weak: hat genützt. The noun is der Nutzen.'
      ru: 'Тот, кому польза, стоит в дательном, а то, что приносит пользу, — подлежащее: Das nützt mir nichts, Wem nützt das? Рядом стоит nutzen уровня B1 из колоды `digitales-leben`, и конструкции у них разные: nutzen берёт винительное дополнение и значит «использовать» — die Zeit nutzen, — а это берёт дательный и значит «быть полезным». Сверх того, написание с умлаутом предпочитают юг Германии, Австрия и Швейцария даже в дательной конструкции, а север и там нередко пишет nutzen, так что в печати попадаются обе формы. Слабый: hat genützt. Существительное — der Nutzen.'
      uk: 'Той, кому користь, стоїть у давальному, а те, що приносить користь, — підмет: Das nützt mir nichts, Wem nützt das? Поряд стоїть nutzen рівня B1 з колоди `digitales-leben`, і конструкції в них різні: nutzen бере знахідний додаток і означає «використовувати» — die Zeit nutzen, — а це бере давальний і означає «бути корисним». Понад те, написання з умлаутом воліють південь Німеччини, Австрія і Швейцарія навіть у давальній конструкції, а північ і там нерідко пише nutzen, тож у друці трапляються обидві форми. Слабке: hat genützt. Іменник — der Nutzen.'

  # --- Womit ein Text bewertet ---
  - de: positiv
    ipa: "ˈpoːzitiːf"
    pos: adj
    cards: recognition
    en: good in the judgement it expresses; in a test, showing that whatever was looked for has been found
    ru: хороший по выносимой оценке; в анализе — показывающий, что искомое обнаружено
    uk: добрий за винесеною оцінкою; в аналізі — що показує, що шукане виявлено
    example_de: Die Rückmeldung war insgesamt sehr positiv.
    example_en: The feedback was very positive overall.
    example_ru: Отзывы в целом были очень хорошие.
    example_uk: Відгуки загалом були дуже добрі.
    note:
      en: 'Two senses that can point opposite ways, and a learner needs both. In an opinion it is simply good: eine positive Bewertung, positiv denken. In a test it says that what was being looked for is there, so ein positives Testergebnis is bad news at the doctor and good news in a search. Careful German stresses the first syllable, ˈpoːzitiːf, and a shifted variant is also heard. In arithmetic eine positive Zahl is one above zero. Its counterpart negativ follows directly below.'
      ru: 'Два значения могут указывать в разные стороны, и учащемуся нужны оба. В оценке это просто «хороший»: eine positive Bewertung, positiv denken. В анализе оно говорит, что искомое найдено, так что ein positives Testergebnis — плохая новость у врача и хорошая при поиске. Аккуратная речь ставит ударение на первый слог, ˈpoːzitiːf; слышен и сдвинутый вариант. В арифметике eine positive Zahl — число больше нуля. Противоположность negativ идёт прямо ниже.'
      uk: 'Два значення можуть указувати в різні боки, і учневі потрібні обидва. В оцінці це просто «добрий»: eine positive Bewertung, positiv denken. В аналізі воно каже, що шукане знайдено, тож ein positives Testergebnis — погана новина в лікаря і добра при пошуку. Ретельне мовлення ставить наголос на перший склад, ˈpoːzitiːf; чути й зсунутий варіант. В арифметиці eine positive Zahl — число більше за нуль. Протилежність negativ іде просто нижче.'

  - de: negativ
    ipa: "ˈneːgatiːf"
    pos: adj
    cards: recognition
    en: bad in the judgement it expresses; in a test, showing that what was looked for is not there
    ru: плохой по выносимой оценке; в анализе — показывающий, что искомого нет
    uk: поганий за винесеною оцінкою; в аналізі — що показує, що шуканого немає
    example_de: Der Test war zum Glück negativ.
    example_en: Fortunately the test was negative.
    example_ru: Анализ, к счастью, оказался отрицательным.
    example_uk: Аналіз, на щастя, виявився негативним.
    note:
      en: 'The counterpart of positiv above and it carries the same double life: eine negative Antwort is a refusal, while ein negatives Testergebnis at the doctor is the one to hope for. German also uses it of a person''s outlook, Er sieht alles negativ, and of numbers below zero, eine negative Zahl. Stress on the first syllable in careful speech. The noun das Negative and the phrase ins Negative are literary, so ordinary German says schlecht wherever it can.'
      ru: 'Противоположность positiv выше, и двойная жизнь у него та же: eine negative Antwort — отказ, а ein negatives Testergebnis у врача — как раз то, чего ждут. Немецкий говорит так и о взгляде человека на вещи, Er sieht alles negativ, и о числах ниже нуля, eine negative Zahl. В аккуратной речи ударение на первом слоге. Существительное das Negative и оборот ins Negative книжны, так что обиходный немецкий скажет schlecht везде, где может.'
      uk: 'Протилежність positiv вище, і подвійне життя в нього те саме: eine negative Antwort — відмова, а ein negatives Testergebnis у лікаря — саме те, чого чекають. Німецька каже так і про погляд людини на речі, Er sieht alles negativ, і про числа нижче за нуль, eine negative Zahl. У ретельному мовленні наголос на першому складі. Іменник das Negative і зворот ins Negative книжні, тож побутова німецька скаже schlecht усюди, де може.'

  - de: persönlich
    ipa: "pɛʁˈzøːnlɪç"
    pos: adj
    cards: recognition
    en: belonging to one particular person and to nobody else; also done by that person rather than through somebody else
    ru: принадлежащий одному определённому человеку и никому другому; а также сделанный им самим, а не через кого-то
    uk: що належить одній певній людині і нікому іншому; а також зроблений нею самою, а не через когось
    example_de: Diese Daten sind persönlich und gehen niemanden etwas an.
    example_en: This data is personal and is nobody else's business.
    example_ru: Эти сведения личные и никого не касаются.
    example_uk: Ці відомості особисті й нікого не стосуються.
    note:
      en: 'From A2 die Person, in the deck `menschen-beziehungen-a2`, plus -lich, with ordinary endings and no change at all as an adverb: Ich habe ihn persönlich gefragt. Three uses cover most texts: persönliche Daten and persönliche Gründe for what belongs to one person, persönlich erscheinen for turning up oneself rather than sending somebody, and Nehmen Sie das nicht persönlich for not taking offence. Keep it apart from privat, which means not public or not work-related; the two overlap but are not the same word.'
      ru: 'От die Person уровня A2 из колоды `menschen-beziehungen-a2` плюс -lich; окончания обычные, а как наречие слово не меняется вовсе: Ich habe ihn persönlich gefragt. Три употребления покрывают почти любой текст: persönliche Daten и persönliche Gründe — то, что принадлежит одному человеку; persönlich erscheinen — явиться самому, а не прислать кого-то; Nehmen Sie das nicht persönlich — не принимайте на свой счёт. Не смешивайте с privat: то значит «непубличный» или «не по работе»; слова пересекаются, но это не одно и то же.'
      uk: 'Від die Person рівня A2 з колоди `menschen-beziehungen-a2` плюс -lich; закінчення звичайні, а як прислівник слово не змінюється зовсім: Ich habe ihn persönlich gefragt. Три вживання покривають майже будь-який текст: persönliche Daten і persönliche Gründe — те, що належить одній людині; persönlich erscheinen — з''явитися самому, а не прислати когось; Nehmen Sie das nicht persönlich — не беріть на свій карб. Не змішуйте з privat: те означає «непублічний» або «не по роботі»; слова перетинаються, але це не те саме.'

  - de: individuell
    ipa: "ɪndiviˈdu̯ɛl"
    pos: adj
    cards: recognition
    en: made or chosen to fit one person on their own terms, rather than being the same for everybody
    ru: сделанный или подобранный под одного человека на его условиях, а не одинаковый для всех
    uk: зроблений або дібраний під одну людину на її умовах, а не однаковий для всіх
    example_de: Jeder Kurs wird individuell geplant.
    example_en: Every course is planned individually.
    example_ru: Каждый курс планируется индивидуально.
    example_uk: Кожен курс планується індивідуально.
    note:
      en: 'Stress on the last syllable, where -du- and -ell run together into one; the endings are ordinary, eine individuelle Lösung. It is the word an advert uses to promise that something is not off the peg: individuelle Betreuung, individuell gestaltet, individuelle Anreise. Beside it, persönlich above says whose something is, while this one says it was cut to fit. The abstract noun is die Individualität, and the plain German sibling in most sentences is einzeln.'
      ru: 'Ударение на последнем слоге, где -du- и -ell сливаются в один; окончания обычные: eine individuelle Lösung. Этим словом реклама обещает, что вещь не готовая с полки: individuelle Betreuung, individuell gestaltet, individuelle Anreise. Рядом persönlich выше говорит, чьё это, а данное — что это подогнано по мерке. Отвлечённое существительное — die Individualität, а своё немецкое слово в большинстве фраз — einzeln.'
      uk: 'Наголос на останньому складі, де -du- і -ell зливаються в один; закінчення звичайні: eine individuelle Lösung. Цим словом реклама обіцяє, що річ не готова з полиці: individuelle Betreuung, individuell gestaltet, individuelle Anreise. Поряд persönlich вище каже, чиє це, а це — що воно підігнане за міркою. Відсторонений іменник — die Individualität, а своє німецьке слово в більшості фраз — einzeln.'

  - de: menschlich
    ipa: "ˈmɛnʃlɪç"
    pos: adj
    cards: recognition
    en: belonging to people as a kind of creature; also treating others with feeling and understanding
    ru: свойственный людям как виду живых существ; а также обращающийся с другими с сочувствием и пониманием
    uk: властивий людям як видові живих істот; а також що поводиться з іншими зі співчуттям і розумінням
    example_de: Ein menschlicher Fehler kann jedem passieren.
    example_en: A human error can happen to anybody.
    example_ru: Человеческая ошибка может случиться с каждым.
    example_uk: Людська помилка може статися з кожним.
    note:
      en: 'From A1 der Mensch, in the deck `menschen-familie`. The first sense classifies and judges nothing: der menschliche Körper, and ein menschlicher Fehler, which is a mistake a person made rather than a machine fault. The second sense praises: Sie ist sehr menschlich mit uns umgegangen. Watch the negative, because it only has the second sense: unmenschlich means cruel and never non-human. The noun is die Menschlichkeit, which likewise means only kindness.'
      ru: 'От der Mensch уровня A1 из колоды `menschen-familie`. Первое значение только относит к разряду и ничего не оценивает: der menschliche Körper, а ein menschlicher Fehler — ошибка человека, а не сбой машины. Второе значение хвалит: Sie ist sehr menschlich mit uns umgegangen. Следите за отрицанием: у него есть только второе значение, так что unmenschlich значит «жестокий» и никогда «нечеловеческий». Существительное die Menschlichkeit тоже значит лишь человечность как доброту.'
      uk: 'Від der Mensch рівня A1 з колоди `menschen-familie`. Перше значення лише відносить до розряду і нічого не оцінює: der menschliche Körper, а ein menschlicher Fehler — помилка людини, а не збій машини. Друге значення хвалить: Sie ist sehr menschlich mit uns umgegangen. Пильнуйте заперечення: у нього є лише друге значення, тож unmenschlich означає «жорстокий» і ніколи «нелюдський». Іменник die Menschlichkeit теж означає лише людяність як доброту.'

  - de: passiv
    ipa: "ˈpasiːf"
    pos: adj
    cards: recognition
    en: letting things happen without joining in or pushing back
    ru: позволяющий событиям идти своим ходом, не вмешиваясь и не противясь
    uk: що дозволяє подіям іти своїм ходом, не втручаючись і не опираючись
    example_de: Bei der Diskussion blieb er völlig passiv.
    example_en: He stayed completely passive during the discussion.
    example_ru: В обсуждении он оставался совершенно безучастным.
    example_uk: В обговоренні він лишався цілком байдужим.
    note:
      en: 'The counterpart of A2 aktiv, in the deck `charakter-eigenschaften-a2`, with ordinary endings and the stress on the first syllable in careful speech. Said of a person it is a criticism rather than a description. Two fixed uses stand beside it: passives Rauchen for breathing in somebody else''s smoke, and das Passiv, spelled the same and capitalized, for the grammatical form gebaut werden. The abstract noun is die Passivität, built like die Aktivität above.'
      ru: 'Противоположность aktiv уровня A2 из колоды `charakter-eigenschaften-a2`; окончания обычные, ударение в аккуратной речи на первом слоге. О человеке это скорее упрёк, чем описание. Рядом стоят два устойчивых употребления: passives Rauchen — пассивное курение и das Passiv, с той же буквой в основе и с заглавной, — грамматическая форма gebaut werden. Отвлечённое существительное — die Passivität, построенное так же, как die Aktivität выше.'
      uk: 'Протилежність aktiv рівня A2 з колоди `charakter-eigenschaften-a2`; закінчення звичайні, наголос у ретельному мовленні на першому складі. Про людину це радше докір, ніж опис. Поряд стоять два усталені вживання: passives Rauchen — пасивне куріння і das Passiv, з тією самою основою і з великої літери, — граматична форма gebaut werden. Відсторонений іменник — die Passivität, побудований так само, як die Aktivität вище.'

  - de: maximal
    ipa: "maksiˈmaːl"
    pos: adj
    cards: recognition
    en: at the top of what is allowed or possible, and, before a number, not more than that number
    ru: находящийся на верхней границе допустимого или возможного, а перед числом — не больше названного
    uk: що перебуває на верхній межі допустимого чи можливого, а перед числом — не більше за назване
    example_de: In den Aufzug dürfen maximal acht Personen.
    example_en: A maximum of eight people are allowed in the lift.
    example_ru: В лифт можно не более восьми человек.
    example_uk: У ліфт можна не більше восьми осіб.
    note:
      en: 'Ordinary endings in front of a noun, die maximale Geschwindigkeit, and no ending at all before a number, where it means at most: maximal 30 Teilnehmer. The everyday German for that second use is B1 höchstens, in the deck `graduierung-mengenwoerter-b1`; maximal belongs to a rule, a sign or a spec sheet. The noun is das Maximum, plural die Maxima. Its counterpart minimal follows below, and a form that names only this one is setting a ceiling on what you may have.'
      ru: 'Перед существительным окончания обычные, die maximale Geschwindigkeit, а перед числом окончания нет вовсе, и значение тогда «не более»: maximal 30 Teilnehmer. Обиходный немецкий скажет во втором случае höchstens уровня B1 из колоды `graduierung-mengenwoerter-b1`; maximal принадлежит правилу, табличке и техническому описанию. Существительное — das Maximum, множественное die Maxima. Противоположность minimal идёт ниже, а бланк, называющий только это слово, ставит потолок на то, что вам полагается.'
      uk: 'Перед іменником закінчення звичайні, die maximale Geschwindigkeit, а перед числом закінчення немає зовсім, і значення тоді «не більше»: maximal 30 Teilnehmer. Побутова німецька скаже в другому випадку höchstens рівня B1 з колоди `graduierung-mengenwoerter-b1`; maximal належить правилу, табличці й технічному опису. Іменник — das Maximum, множина die Maxima. Протилежність minimal іде нижче, а бланк, що називає лише це слово, ставить стелю на те, що вам належить.'

  - de: minimal
    ipa: "miniˈmaːl"
    pos: adj
    cards: recognition
    en: at the bottom of what is possible or needed, and, in everyday use, so small as to be barely worth mentioning
    ru: находящийся на нижней границе возможного или нужного, а в обиходе — настолько малый, что о нём почти не стоит говорить
    uk: що перебуває на нижній межі можливого чи потрібного, а в побуті — настільки малий, що про нього майже не варто говорити
    example_de: Der Unterschied zwischen den beiden ist wirklich minimal.
    example_en: The difference between the two really is minimal.
    example_ru: Разница между этими двумя и правда ничтожна.
    example_uk: Різниця між цими двома і справді мізерна.
    note:
      en: 'The formal half mirrors maximal above and needs no repeating. What is worth adding is that this one has drifted: where maximal stays a limit, minimal is mostly used to say that something is tiny, minimal besser, ein minimaler Vorteil, and the rule-setting sense has largely moved to A2 mindestens in the deck `kleine-woerter-a2` and to the prefix Mindest-, as in der Mindestlohn and die Mindestteilnehmerzahl. The noun is das Minimum, plural die Minima.'
      ru: 'Формальная половина зеркальна к maximal выше, и повторять её незачем. Стоит добавить другое: это слово сместилось. Там, где maximal остаётся границей, minimal чаще всего значит «мизерный»: minimal besser, ein minimaler Vorteil, — а нормирующее значение почти целиком ушло к mindestens уровня A2 из колоды `kleine-woerter-a2` и к приставке Mindest-: der Mindestlohn, die Mindestteilnehmerzahl. Существительное — das Minimum, множественное die Minima.'
      uk: 'Формальна половина дзеркальна до maximal вище, і повторювати її нема потреби. Варто додати інше: це слово змістилося. Там, де maximal лишається межею, minimal найчастіше означає «мізерний»: minimal besser, ein minimaler Vorteil, — а нормувальне значення майже цілком відійшло до mindestens рівня A2 з колоди `kleine-woerter-a2` і до префікса Mindest-: der Mindestlohn, die Mindestteilnehmerzahl. Іменник — das Minimum, множина die Minima.'

  - de: zahlreich
    ipa: "ˈtsaːlˌʁaɪ̯ç"
    pos: adj
    cards: recognition
    en: many in number, said of things that are counted rather than measured
    ru: многочисленный — о том, что считают, а не измеряют
    uk: численний — про те, що рахують, а не вимірюють
    example_de: Zahlreiche Gäste kamen trotz des Regens.
    example_en: Numerous guests came in spite of the rain.
    example_ru: Несмотря на дождь, пришло множество гостей.
    example_uk: Попри дощ, прийшло чимало гостей.
    note:
      en: 'A1 die Zahl, in the deck `erste-schritte`, plus -reich, on the pattern of erfolgreich and hilfreich. It stands in front of a plural noun in written German where speech would simply say viele: zahlreiche Beispiele, aus zahlreichen Ländern. Two things follow from that. It takes the strong adjective ending after it, exactly as viele does, zahlreiche gute Gründe; and as a predicate it is rare and formal, Die Teilnehmer waren zahlreich. Primary stress on Zahl-.'
      ru: 'die Zahl уровня A1 из колоды `erste-schritte` плюс -reich, по образцу erfolgreich и hilfreich. Слово стоит перед существительным во множественном там, где в речи просто сказали бы viele: zahlreiche Beispiele, aus zahlreichen Ländern. Отсюда два следствия. После него прилагательное берёт сильное окончание, ровно как после viele: zahlreiche gute Gründe. А в роли сказуемого оно редко и книжно: Die Teilnehmer waren zahlreich. Главное ударение на Zahl-.'
      uk: 'die Zahl рівня A1 з колоди `erste-schritte` плюс -reich, за зразком erfolgreich і hilfreich. Слово стоїть перед іменником у множині там, де в мовленні просто сказали б viele: zahlreiche Beispiele, aus zahlreichen Ländern. Звідси два наслідки. Після нього прикметник бере сильне закінчення, точно як після viele: zahlreiche gute Gründe. А в ролі присудка воно рідкісне й книжне: Die Teilnehmer waren zahlreich. Головний наголос на Zahl-.'

  # --- Und das Wort für alles ---
  - de: Zeug
    ipa: "ˈtsɔʏ̯k"
    pos: noun
    gender: n
    plural: "—"
    cards: recognition
    en: things taken together without naming them, in the offhand way speech does it
    ru: вещи, взятые скопом и не названные поимённо, — так, как это делает разговорная речь
    uk: речі, узяті гуртом і не названі поіменно, — так, як це робить розмовне мовлення
    example_de: Räum bitte dein Zeug vom Tisch!
    example_en: Please clear your stuff off the table!
    example_ru: Убери, пожалуйста, свои вещи со стола!
    example_uk: Прибери, будь ласка, свої речі зі столу!
    note:
      en: 'Neuter and used without a plural: das Zeug, dieses Zeug, allerlei Zeug. Standing alone it is colloquial and often dismissive, so it belongs among friends and not in a letter; the neutral words are die Sachen and A2 die Dinge in the deck `dinge-sachen-a2`. As the second half of a compound it is entirely respectable and names a class of equipment: A1 das Werkzeug, B1 das Spielzeug in the deck `haushalt-notfall-b1`, das Fahrzeug, das Flugzeug, das Schreibzeug. One idiom is worth recognising: Er hat das Zeug dazu means he has what it takes. Final g devoiced to k.'
      ru: 'Средний род, множественного не имеет: das Zeug, dieses Zeug, allerlei Zeug. Само по себе слово разговорное и часто пренебрежительное, так что место ему среди своих, а не в письме; нейтральные слова — die Sachen и die Dinge уровня A2 из колоды `dinge-sachen-a2`. Вторым членом сложного слова оно вполне почтенно и называет класс снаряжения: das Werkzeug уровня A1, das Spielzeug уровня B1 из колоды `haushalt-notfall-b1`, das Fahrzeug, das Flugzeug, das Schreibzeug. Один оборот стоит узнавать: Er hat das Zeug dazu — «у него есть для этого всё нужное». Конечное g оглушается в k.'
      uk: 'Середній рід, множини не має: das Zeug, dieses Zeug, allerlei Zeug. Само по собі слово розмовне і часто зневажливе, тож місце йому серед своїх, а не в листі; нейтральні слова — die Sachen і die Dinge рівня A2 з колоди `dinge-sachen-a2`. Другим членом складного слова воно цілком поважне і називає клас спорядження: das Werkzeug рівня A1, das Spielzeug рівня B1 з колоди `haushalt-notfall-b1`, das Fahrzeug, das Flugzeug, das Schreibzeug. Один зворот варто впізнавати: Er hat das Zeug dazu — «у нього є для цього все потрібне». Кінцеве g оглушується в k.'
