# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the civic field of
# data/goethe-b1-wortliste.txt: the bodies that decide, the people who work behind
# their counters and the people who queue in front of them, the boxes an official
# form asks a foreigner to fill in, and the money the state takes and gives back.
# A2's `aemter-dienstleistungen` owns the counter itself (Amt, Antrag, Formular,
# Unterlagen, Gebühr, Kopie, Unterschrift); this deck is the layer above it.
id: verwaltung-behoerden-b1
title_de: "Verwaltung und Behörden"
title_en: "Public administration and authorities"
title_ru: "Государственные учреждения и ведомства"
title_uk: "Державні установи та відомства"
level: B1
entries:
  # --- Wer entscheidet: die Behörde und ihre Leute ---
  - de: Behörde
    ipa: "bəˈhøːɐ̯də"
    pos: noun
    gender: f
    plural: "die Behörden"
    en: the state body that is responsible for a matter and decides it
    ru: инстанция, ведающая вопросом и принимающая по нему решение
    uk: інстанція, що відає питанням і ухвалює щодо нього рішення
    example_de: Für die Verlängerung müssen Sie sich an die zuständige Behörde wenden.
    example_en: For the extension you have to turn to the responsible authority.
    example_ru: За продлением вам нужно обратиться в компетентную инстанцию.
    example_uk: Щодо продовження вам треба звернутися до компетентної інстанції.
    note:
      en: 'Two words that look interchangeable are not. A2 das Amt is the office you walk into — an address, opening hours, a queue; this word is the organisation behind it, which may run several of them and is the thing a letter names when it says who decided. The everyday chunk is die zuständige Behörde, the one that is competent for your case, and the first question at any counter is which one that is. The adjective behördlich means issued or ordered from that side (eine behördliche Genehmigung), and A2 die Verwaltung is the running of it all as an activity.'
      ru: 'Два слова, которые кажутся взаимозаменяемыми, таковыми не являются. das Amt уровня A2 — это учреждение, куда вы приходите: адрес, часы приёма, очередь; здесь же речь об организации за ним, которой таких приёмных может подчиняться несколько и которую называет письмо, сообщающее, кто принял решение. Обиходный оборот — die zuständige Behörde, то есть та, что ведает именно вашим случаем, и первый вопрос у любого окошка — какая именно. Прилагательное behördlich значит «исходящий от этой стороны, предписанный ею» (eine behördliche Genehmigung), а die Verwaltung уровня A2 — это управление как деятельность.'
      uk: 'Два слова, які здаються взаємозамінними, такими не є. das Amt рівня A2 — це установа, куди ви приходите: адреса, години прийому, черга; тут же йдеться про організацію за нею, якій таких приймалень може підпорядковуватися кілька і яку називає лист, що повідомляє, хто ухвалив рішення. Побутовий зворот — die zuständige Behörde, тобто та, що відає саме вашим випадком, і перше питання біля будь-якого віконця — яка саме. Прикметник behördlich означає «той, що походить від цієї сторони, приписаний нею» (eine behördliche Genehmigung), а die Verwaltung рівня A2 — це управління як діяльність.'

  - de: Beamte
    ipa: "bəˈʔamtə"
    pos: noun
    gender: m
    plural: "die Beamten"
    accept: ["Beamter", "ein Beamter"]
    en: a man employed by the state under a lifelong status of his own
    ru: чиновник, состоящий на государственной службе с особым пожизненным статусом
    uk: чиновник, що перебуває на державній службі з особливим довічним статусом
    example_de: Der Beamte am Schalter hat meinen Antrag sofort bearbeitet.
    example_en: The official at the counter processed my application straight away.
    example_ru: Чиновник у окошка сразу обработал моё заявление.
    example_uk: Чиновник біля віконця одразу опрацював мою заяву.
    note:
      en: 'An adjectival noun, so its ending changes with the article in front of it: der Beamte, ein Beamter, die Beamten, mit dem Beamten. The card accepts both shapes for that reason, exactly as A2 der Angestellte and die Verwandte do. The feminine is die Beamtin, an ordinary -in noun and the next entry. The status is a German legal category rather than a job description: teachers, police officers and tax inspectors can hold it, they cannot strike and they cannot be dismissed, and somebody doing the same work without it is simply ein Angestellter.'
      ru: 'Субстантивированное прилагательное, поэтому окончание меняется вместе с артиклем перед ним: der Beamte, ein Beamter, die Beamten, mit dem Beamten. Карточка принимает обе формы именно поэтому — ровно как der Angestellte и die Verwandte уровня A2. Женская пара — die Beamtin, обычное существительное на -in, следующая запись. Это не название профессии, а немецкая правовая категория: такой статус бывает у учителей, полицейских и налоговых инспекторов, бастовать они не вправе и уволить их нельзя, а тот, кто делает ту же работу без этого статуса, — просто ein Angestellter.'
      uk: 'Субстантивований прикметник, тому закінчення змінюється разом з артиклем перед ним: der Beamte, ein Beamter, die Beamten, mit dem Beamten. Картка приймає обидві форми саме тому — так само як der Angestellte та die Verwandte рівня A2. Жіноча пара — die Beamtin, звичайний іменник на -in, наступний запис. Це не назва професії, а німецька правова категорія: такий статус мають учителі, поліцейські та податкові інспектори, страйкувати вони не мають права і звільнити їх не можна, а той, хто робить ту саму роботу без цього статусу, — просто ein Angestellter.'

  - de: Beamtin
    ipa: "bəˈʔamtɪn"
    pos: noun
    gender: f
    plural: "die Beamtinnen"
    # Recognition only: the feminine of the entry above, whose note already names
    # this form — the pair costs three cards rather than four, per the Movierung
    # rule for the B1 completion pass.
    cards: recognition
    en: a woman employed by the state under that same lifelong status
    ru: чиновница, состоящая на государственной службе с тем же пожизненным статусом
    uk: чиновниця, що перебуває на державній службі з тим самим довічним статусом
    example_de: Die Beamtin erklärte mir, welche Unterlagen noch fehlen.
    example_en: The official explained to me which documents were still missing.
    example_ru: Чиновница объяснила мне, каких документов ещё не хватает.
    example_uk: Чиновниця пояснила мені, яких документів ще бракує.
    note:
      en: 'The one place where the adjectival declension of the masculine stops: this form is a plain -in noun and never changes its ending, so die Beamtin, der Beamtin, die Beamtinnen. That asymmetry is worth noticing, because a learner who has just met der Beamte / ein Beamter expects a matching pair and there is none. In job adverts and forms the state writes Beamter/Beamtin or Beamte (m/w/d), and the neutral plural for a mixed group is die Beamten.'
      ru: 'Единственное место, где склонение по образцу прилагательного у мужской формы обрывается: здесь перед нами обычное существительное на -in, оно окончания не меняет — die Beamtin, der Beamtin, die Beamtinnen. На эту асимметрию стоит обратить внимание: тот, кто только что встретил der Beamte / ein Beamter, ждёт симметричной пары, а её нет. В объявлениях о работе и в бланках государство пишет Beamter/Beamtin или Beamte (m/w/d), а нейтральное множественное для смешанной группы — die Beamten.'
      uk: 'Єдине місце, де відмінювання за зразком прикметника в чоловічої форми уривається: тут перед нами звичайний іменник на -in, він закінчення не змінює — die Beamtin, der Beamtin, die Beamtinnen. На цю асиметрію варто зважити: той, хто щойно зустрів der Beamte / ein Beamter, чекає симетричної пари, а її немає. В оголошеннях про роботу й у бланках держава пише Beamter/Beamtin або Beamte (m/w/d), а нейтральна множина для змішаної групи — die Beamten.'

  - de: Bürger
    ipa: "ˈbʏʁgɐ"
    pos: noun
    gender: m
    plural: "die Bürger"
    en: a member of a state, seen from the side that has rights and duties
    ru: "гражданин: член государства с точки зрения его прав и обязанностей"
    uk: "громадянин: член держави з погляду його прав і обов’язків"
    example_de: Jeder Bürger hat das Recht, die Akte über sich einzusehen.
    example_en: Every citizen has the right to look at the file held about them.
    example_ru: Каждый гражданин имеет право ознакомиться с делом, заведённым на него.
    example_uk: Кожен громадянин має право ознайомитися зі справою, заведеною на нього.
    note:
      en: 'The word an authority uses for the person on the other side of the counter, and A2 das Bürgeramt is literally the office named after them. Two meanings run through it: legal membership of a state (deutscher Bürger, EU-Bürger) and the inhabitant of a town, which is the older sense still visible in Bürgermeister and in the town names ending in -burg. Compounds are everywhere in civic German: die Bürgerinitiative for a residents'' campaign, bürgerlich for middle-class, and der Bürgersteig for the pavement, which has nothing to do with rights at all. The feminine is die Bürgerin, the next entry.'
      ru: 'Слово, которым ведомство называет человека по другую сторону окошка, и das Bürgeramt уровня A2 — буквально «его» учреждение. В слове живут два значения: правовая принадлежность к государству (deutscher Bürger, EU-Bürger) и житель города — более старый смысл, до сих пор видный в Bürgermeister и в названиях городов на -burg. В гражданском немецком полно производных: die Bürgerinitiative — инициативная группа жителей, bürgerlich — «буржуазный, среднего класса», а der Bürgersteig — тротуар, к правам отношения не имеющий вовсе. Женская пара — die Bürgerin, следующая запись.'
      uk: 'Слово, яким відомство називає людину по інший бік віконця, і das Bürgeramt рівня A2 — буквально «його» установа. У слові живуть два значення: правова належність до держави (deutscher Bürger, EU-Bürger) і мешканець міста — давніший сенс, досі помітний у Bürgermeister та в назвах міст на -burg. У громадянській німецькій повно похідних: die Bürgerinitiative — ініціативна група мешканців, bürgerlich — «буржуазний, середнього класу», а der Bürgersteig — тротуар, який до прав не має стосунку взагалі. Жіноча пара — die Bürgerin, наступний запис.'

  - de: Bürgerin
    ipa: "ˈbʏʁgəʁɪn"
    pos: noun
    gender: f
    plural: "die Bürgerinnen"
    # Recognition only: the feminine of the entry above, whose note names the pair.
    cards: recognition
    en: a woman who is a member of a state, with those same rights and duties
    ru: "гражданка: женщина как член государства с теми же правами и обязанностями"
    uk: "громадянка: жінка як член держави з тими самими правами й обов’язками"
    example_de: Als Bürgerin dieses Landes darf sie an der Wahl teilnehmen.
    example_en: As a citizen of this country she is allowed to take part in the election.
    example_ru: Как гражданка этой страны она вправе участвовать в выборах.
    example_uk: Як громадянка цієї країни вона має право брати участь у виборах.
    note:
      en: 'Regular Movierung with -in and no umlaut, plural with a doubled n. In addresses and speeches the full pair is the norm rather than a nicety: liebe Bürgerinnen und Bürger is how a mayor opens, and the order with the feminine first is fixed. Where a text needs one word for everybody it now often writes die Bürgerschaft or, in Switzerland, die Stimmberechtigten — the people entitled to vote.'
      ru: 'Обычное мовирование на -in без умлаута, во множественном n удваивается. В обращениях и речах полная пара — норма, а не вежливая добавка: liebe Bürgerinnen und Bürger — так начинает бургомистр, и порядок с женской формой впереди закреплён. Когда тексту нужно одно слово на всех, сегодня часто пишут die Bürgerschaft, а в Швейцарии — die Stimmberechtigten, то есть имеющие право голоса.'
      uk: 'Звичайна моція на -in без умлаута, у множині n подвоюється. У звертаннях і промовах повна пара — норма, а не ввічлива добавка: liebe Bürgerinnen und Bürger — так починає бурмістр, і порядок із жіночою формою попереду закріплений. Коли текстові потрібне одне слово на всіх, сьогодні часто пишуть die Bürgerschaft, а у Швейцарії — die Stimmberechtigten, тобто ті, хто має право голосу.'

  # --- Ausländerrecht: das Konsulat, das Asyl, die Erlaubnis ---
  - de: Konsulat
    ipa: "kɔnzuˈlaːt"
    pos: noun
    gender: n
    plural: "die Konsulate"
    # Recognition only: a word met on a website and in a letter, never produced —
    # what a learner says is `zur Botschaft gehen` or names the city.
    cards: recognition
    en: the branch office a foreign state keeps in another country for its own nationals
    ru: "консульство: представительство иностранного государства в другой стране для своих граждан"
    uk: "консульство: представництво іноземної держави в іншій країні для своїх громадян"
    example_de: Für den neuen Pass muss ich zum Konsulat nach München fahren.
    example_en: For the new passport I have to travel to the consulate in Munich.
    example_ru: За новым паспортом мне нужно ехать в консульство в Мюнхене.
    example_uk: По новий паспорт мені треба їхати до консульства в Мюнхені.
    note:
      en: 'Not the same thing as die Botschaft, and the difference is practical rather than diplomatic: there is one embassy per country and it sits in the capital, while the smaller offices are spread over the big cities and are where passports, certificates and visas are actually handled. The person in charge is der Konsul or die Konsulin, and the adjective is konsularisch (konsularische Hilfe im Ausland). Compounds you will meet on a website: das Generalkonsulat and die Konsulatsabteilung.'
      ru: 'Это не то же самое, что die Botschaft, и разница скорее практическая, чем дипломатическая: посольство у страны одно и находится в столице, а учреждения поменьше разбросаны по крупным городам, и именно там на деле оформляют паспорта, справки и визы. Во главе стоит der Konsul или die Konsulin, прилагательное — konsularisch (konsularische Hilfe im Ausland). Составные слова, которые встретятся на сайте: das Generalkonsulat и die Konsulatsabteilung.'
      uk: 'Це не те саме, що die Botschaft, і різниця радше практична, ніж дипломатична: посольство в країни одне й міститься в столиці, а менші установи розкидані по великих містах, і саме там насправді оформлюють паспорти, довідки та візи. На чолі стоїть der Konsul або die Konsulin, прикметник — konsularisch (konsularische Hilfe im Ausland). Складні слова, які трапляться на сайті: das Generalkonsulat і die Konsulatsabteilung.'

  - de: Asyl
    ipa: "aˈzyːl"
    pos: noun
    gender: n
    plural: "—"
    # Recognition only: news and form register. A learner produces `Schutz suchen`
    # or names the procedure; this word is read far more often than it is said.
    cards: recognition
    en: the protection a state grants somebody who is persecuted at home
    ru: "убежище: защита, которую государство даёт преследуемому у себя на родине"
    uk: "притулок: захист, який держава дає переслідуваному в себе на батьківщині"
    example_de: Die Familie hat in Deutschland Asyl beantragt.
    example_en: The family has applied for asylum in Germany.
    example_ru: Семья подала прошение об убежище в Германии.
    example_uk: Родина подала прохання про притулок у Німеччині.
    note:
      en: 'Effectively without a plural, and it lives in fixed chunks: Asyl beantragen, Asyl bekommen, um Asyl bitten. The German constitution states the right in a famous single line, and the word is a legal term with a narrow meaning — persecution by a state — which is why news reports carefully distinguish it from der Flüchtling, a broader word about a person''s situation. The whole procedure travels in compounds: der Asylantrag, das Asylverfahren, die Asylbewerberin.'
      ru: 'Фактически без множественного числа, и живёт слово в устойчивых оборотах: Asyl beantragen, Asyl bekommen, um Asyl bitten. Немецкая конституция закрепляет это право знаменитой одной строкой, а само слово — юридический термин с узким значением: преследование со стороны государства. Поэтому в новостях его тщательно отличают от der Flüchtling — более широкого слова о положении человека. Вся процедура ходит в составных словах: der Asylantrag, das Asylverfahren, die Asylbewerberin.'
      uk: 'Фактично без множини, і живе слово в усталених зворотах: Asyl beantragen, Asyl bekommen, um Asyl bitten. Німецька конституція закріплює це право знаменитим одним рядком, а саме слово — юридичний термін із вузьким значенням: переслідування з боку держави. Тому в новинах його ретельно відрізняють від der Flüchtling — ширшого слова про становище людини. Уся процедура ходить у складних словах: der Asylantrag, das Asylverfahren, die Asylbewerberin.'

  - de: Arbeitserlaubnis
    ipa: "ˈaʁbaɪ̯tsʔɛɐ̯ˌlaʊ̯pnɪs"
    pos: noun
    gender: f
    plural: "die Arbeitserlaubnisse"
    en: the official permission a foreigner needs before taking a job
    ru: разрешение на трудовую деятельность, которое нужно иностранцу до выхода на работу
    uk: дозвіл на трудову діяльність, потрібний іноземцеві до виходу на роботу
    example_de: Ohne Arbeitserlaubnis darf die Firma ihn nicht einstellen.
    example_en: Without a work permit the company is not allowed to hire him.
    example_ru: Без разрешения на работу фирма не имеет права его нанять.
    example_uk: Без дозволу на роботу фірма не має права його найняти.
    note:
      en: 'Built from A2 die Erlaubnis, and the -nis suffix doubles its s in the plural, like Geheimnisse and Ergebnisse. For EU citizens it does not exist at all; for everybody else it is normally printed inside the residence permit rather than issued as a separate paper, which is why the official term today is die Beschäftigungserlaubnis or a note in der Aufenthaltstitel. Two neighbours are not it: die Genehmigung is any approval an authority grants, and die Zulassung is being admitted to something, a course or a profession.'
      ru: 'Образовано от die Erlaubnis уровня A2, а суффикс -nis удваивает s во множественном числе — как в Geheimnisse и Ergebnisse. Для граждан ЕС этого документа не существует вовсе; для остальных его, как правило, впечатывают в вид на жительство, а не выдают отдельной бумагой, поэтому официальный термин сегодня — die Beschäftigungserlaubnis или отметка в der Aufenthaltstitel. Два соседа — не то же самое: die Genehmigung — любое одобрение со стороны ведомства, а die Zulassung — допуск куда-либо, на курс или в профессию.'
      uk: 'Утворене від die Erlaubnis рівня A2, а суфікс -nis подвоює s у множині — як у Geheimnisse та Ergebnisse. Для громадян ЄС цього документа не існує взагалі; для решти його зазвичай вдруковують у посвідку на проживання, а не видають окремим папером, тому офіційний термін сьогодні — die Beschäftigungserlaubnis або відмітка в der Aufenthaltstitel. Два сусіди — не те саме: die Genehmigung — будь-яке схвалення з боку відомства, а die Zulassung — допуск кудись, на курс або до професії.'

  # --- Was das Formular wissen will ---
  - de: Wohnsitz
    ipa: "ˈvoːnˌzɪts"
    pos: noun
    gender: m
    plural: "die Wohnsitze"
    en: the address a person is officially registered at
    ru: официально зарегистрированный адрес проживания
    uk: офіційно зареєстрована адреса проживання
    example_de: Seit dem Umzug hat er seinen Wohnsitz in Leipzig.
    example_en: Since the move his registered address has been in Leipzig.
    example_ru: После переезда его официальный адрес — в Лейпциге.
    example_uk: Після переїзду його офіційна адреса — у Лейпцигу.
    note:
      en: 'A legal word, and the legal part matters: der Wohnort is simply the town somebody lives in, while this one is what the register says and what tax, schooling and voting all hang on. Germany distinguishes der Hauptwohnsitz from der Zweitwohnsitz, and a second one is taxed in many towns. The verb beside it is anmelden, which A2 teaches: you register the address within two weeks of moving in, and ummelden when you move again.'
      ru: 'Юридическое слово, и юридическая сторона здесь существенна: der Wohnort — просто город, где человек живёт, а это — то, что записано в реестре, и от этого зависят налоги, школа и голосование. Германия различает der Hauptwohnsitz и der Zweitwohnsitz, причём второй во многих городах облагается налогом. Рядом стоит глагол anmelden, который проходят на A2: адрес регистрируют в течение двух недель после въезда, а при новом переезде делают ummelden.'
      uk: 'Юридичне слово, і юридичний бік тут суттєвий: der Wohnort — просто місто, де людина живе, а це — те, що записано в реєстрі, і від цього залежать податки, школа й голосування. Німеччина розрізняє der Hauptwohnsitz і der Zweitwohnsitz, причому другий у багатьох містах оподатковується. Поряд стоїть дієслово anmelden, яке вивчають на A2: адресу реєструють протягом двох тижнів після заселення, а при новому переїзді роблять ummelden.'

  - de: Herkunft
    ipa: "ˈhɛʁkʊnft"
    pos: noun
    gender: f
    plural: "—"
    en: the factual origin of a person or a thing, as a form or a label states it
    ru: "происхождение как факт: то, что записывают в анкете или указывают на этикетке"
    uk: "походження як факт: те, що записують в анкеті або зазначають на етикетці"
    example_de: Auf dem Etikett steht die Herkunft der Kartoffeln.
    example_en: The label states where the potatoes come from.
    example_ru: На этикетке указано происхождение картофеля.
    example_uk: На етикетці зазначено походження картоплі.
    note:
      en: 'It works for people and for things alike, which is why the same word appears on a form and on a bag of vegetables — das Herkunftsland is the standard label on both. The emotional word is A2 die Heimat, the place you belong to and can be homesick for; this one is neutral and factual, so a person can have one and feel nothing about it. Used of a person it points at family and background rather than at an address, and it is the noun beside the verb stammen (Sie stammt aus Polen) rather than beside wohnen. The plural Herkünfte exists but is rare enough to ignore, and die Zukunft shares only the -kunft.'
      ru: 'Слово одинаково работает и о людях, и о вещах, поэтому встречается и в бланке, и на пакете с овощами: das Herkunftsland — стандартная надпись в обоих случаях. Слово с чувством — это die Heimat уровня A2, место, к которому принадлежат и по которому тоскуют; это же слово нейтрально и фактично, так что человек может иметь его и не испытывать по этому поводу ничего. О человеке оно указывает на семью и среду, а не на адрес, и стоит рядом с глаголом stammen (Sie stammt aus Polen), а не рядом с wohnen. Множественное Herkünfte существует, но настолько редко, что им можно пренебречь, а с die Zukunft у него общее лишь -kunft.'
      uk: 'Слово однаково працює і про людей, і про речі, тому трапляється і в бланку, і на пакеті з овочами: das Herkunftsland — стандартний напис в обох випадках. Слово з почуттям — це die Heimat рівня A2, місце, до якого належать і за яким тужать; це ж слово нейтральне й фактичне, тож людина може його мати й нічого із цього приводу не відчувати. Про людину воно вказує на родину й середовище, а не на адресу, і стоїть поряд із дієсловом stammen (Sie stammt aus Polen), а не поряд із wohnen. Множина Herkünfte існує, але настільки рідкісна, що нею можна знехтувати, а з die Zukunft у нього спільне лише -kunft.'

  - de: Geschlecht
    ipa: "gəˈʃlɛçt"
    pos: noun
    gender: n
    plural: "die Geschlechter"
    en: sex, whether a person or an animal is male or female
    ru: "пол: мужской или женский"
    uk: "стать: чоловіча чи жіноча"
    example_de: Bitte kreuzen Sie Ihr Geschlecht an.
    example_en: Please tick your sex.
    example_ru: Пожалуйста, отметьте ваш пол.
    example_uk: Будь ласка, позначте вашу стать.
    note:
      en: 'One noun where English needs two. On a form the boxes have been männlich, weiblich, divers since 2018, and a fourth option is to leave it blank. In grammar the very same word names the three classes of German nouns — das grammatische Geschlecht, which is what a textbook means by der/die/das and what English calls gender. A third, older sense is a family line across time (das Geschlecht der Habsburger), and it survives in die Geschwister, the children of one house.'
      ru: 'Одно существительное там, где русскому нужны два разных слова. В бланке с 2018 года стоят männlich, weiblich, divers, а четвёртый вариант — оставить графу пустой. В грамматике то же самое слово называет три класса немецких существительных — das grammatische Geschlecht, то есть род, о котором учебник говорит der/die/das. Третий, более старый смысл — род как династия во времени (das Geschlecht der Habsburger), и он уцелел в слове die Geschwister, «дети одного дома».'
      uk: 'Один іменник там, де українській потрібні два різні слова. У бланку з 2018 року стоять männlich, weiblich, divers, а четвертий варіант — залишити графу порожньою. У граматиці те саме слово називає три класи німецьких іменників — das grammatische Geschlecht, тобто рід, про який підручник каже der/die/das. Третій, давніший сенс — рід як династія в часі (das Geschlecht der Habsburger), і він уцілів у слові die Geschwister, «діти одного дому».'

  - de: Personalien
    ipa: "pɛʁzoˈnaːliən"
    pos: phrase
    # Recognition only: heard from an official and read on a form, never produced —
    # the learner answers such a request by simply giving the details.
    cards: recognition
    en: name, date of birth and address, taken down together as one block
    ru: "анкетные сведения о человеке: имя, дата рождения и адрес, записанные вместе"
    uk: "анкетні відомості про людину: ім’я, дата народження й адреса, записані разом"
    example_de: Der Polizist notierte die Personalien aller Zeugen.
    example_en: The police officer wrote down the particulars of all the witnesses.
    example_ru: Полицейский записал данные всех свидетелей.
    example_uk: Поліцейський записав дані всіх свідків.
    note:
      en: 'Plural only, so there is no singular and no article to learn: nach den Personalien fragen, die Personalien aufnehmen. It is a narrow word for the identity block at the top of a form — who you are — while A2 die Angabe is any single piece of information stated on a form or a bill, and das Formular is the sheet itself. The sentence a police officer actually says is Ihre Personalien, bitte.'
      ru: 'Слово только во множественном числе, так что ни единственного, ни артикля учить не нужно: nach den Personalien fragen, die Personalien aufnehmen. Это узкое обозначение блока «кто вы» в шапке бланка, тогда как die Angabe уровня A2 — любое отдельное сведение, указанное в бланке или счёте, а das Formular — сам лист. Полицейский на деле говорит: Ihre Personalien, bitte.'
      uk: 'Слово лише в множині, тож ані однини, ані артикля вчити не треба: nach den Personalien fragen, die Personalien aufnehmen. Це вузьке позначення блоку «хто ви» в шапці бланка, тоді як die Angabe рівня A2 — будь-яке окреме відомості, зазначене в бланку чи рахунку, а das Formular — сам аркуш. Поліцейський насправді каже: Ihre Personalien, bitte.'

  - de: Personenstand
    ipa: "pɛʁˈzoːnənˌʃtant"
    pos: noun
    gender: m
    plural: "die Personenstände"
    # Recognition only: register-office vocabulary. The box a learner actually
    # fills in says Familienstand, which beziehungen-familie-b1 already cards.
    cards: recognition
    en: a person's status as the register records it, from birth through marriage to death
    ru: "гражданское состояние по записям загса: от рождения через брак до смерти"
    uk: "цивільний стан за записами органу реєстрації: від народження через шлюб до смерті"
    example_de: Änderungen des Personenstands muss das Standesamt eintragen.
    example_en: Changes of civil status have to be entered by the register office.
    example_ru: Изменения гражданского состояния должен вносить загс.
    example_uk: Зміни цивільного стану має вносити орган реєстрації актів.
    note:
      en: 'The legal term, and it is wider than the box on an ordinary form: it covers birth, marriage, registered partnership, divorce and death, all held in das Personenstandsregister at das Standesamt. What a job application or a tax form asks for is der Familienstand — ledig, verheiratet, geschieden, verwitwet — which is only the marriage part of it and is carded in beziehungen-familie-b1. Switzerland uses der Zivilstand for both.'
      ru: 'Юридический термин, и он шире графы в обычном бланке: он охватывает рождение, брак, зарегистрированное партнёрство, развод и смерть — всё это хранится в das Personenstandsregister при das Standesamt. Анкета о приёме на работу или налоговая форма спрашивает der Familienstand — ledig, verheiratet, geschieden, verwitwet, — а это лишь брачная часть, и она есть в колоде beziehungen-familie-b1. В Швейцарии для того и другого говорят der Zivilstand.'
      uk: 'Юридичний термін, і він ширший за графу у звичайному бланку: він охоплює народження, шлюб, зареєстроване партнерство, розлучення та смерть — усе це зберігається в das Personenstandsregister при das Standesamt. Анкета про прийом на роботу чи податкова форма питає der Familienstand — ledig, verheiratet, geschieden, verwitwet, — а це лише шлюбна частина, і вона є в колоді beziehungen-familie-b1. У Швейцарії для того й того кажуть der Zivilstand.'

  - de: Daten
    ipa: "ˈdaːtn̩"
    pos: phrase
    # Recognition only: read on privacy notices and heard from a clerk. The learner
    # who has to name one piece of it says `Angabe` (geld-vertraege) or the field
    # itself; this word is the mass noun above them.
    cards: recognition
    en: the information a company or an office stores about a person
    ru: сведения, которые фирма или учреждение хранит о человеке
    uk: відомості, які фірма чи установа зберігає про людину
    example_de: Ihre Daten werden nicht an Dritte weitergegeben.
    example_en: Your data will not be passed on to third parties.
    example_ru: Ваши сведения не передаются третьим лицам.
    example_uk: Ваші відомості не передаються третім особам.
    note:
      en: 'Plural in use, and the two words behind it have grown apart: as the plural of A2 das Datum it means calendar dates, but the modern sense is information held in a file or a system, and that is what a German privacy notice is about. Two compounds are unavoidable in Germany: der Datenschutz, the legal protection of it, and die Datenbank. Beside it, A2 die Angabe is one single item stated on a form, and die Unterlagen are the papers you bring with you.'
      ru: 'Употребляется во множественном числе, и два его смысла давно разошлись: как множественное от das Datum уровня A2 это календарные даты, но современное значение — сведения, хранящиеся в файле или системе, и именно о них говорит немецкое уведомление о защите личной информации. Два составных слова в Германии не обойти: der Datenschutz — правовая защита таких сведений, и die Datenbank. Рядом: die Angabe уровня A2 — одно отдельное указание в бланке, а die Unterlagen — бумаги, которые вы приносите с собой.'
      uk: 'Уживається в множині, і два його сенси давно розійшлися: як множина від das Datum рівня A2 це календарні дати, але сучасне значення — відомості, що зберігаються у файлі чи системі, і саме про них говорить німецьке повідомлення про захист особистої інформації. Двох складних слів у Німеччині не обійти: der Datenschutz — правовий захист таких відомостей, і die Datenbank. Поряд: die Angabe рівня A2 — одне окреме зазначення в бланку, а die Unterlagen — папери, які ви приносите з собою.'

  - de: Original
    ipa: "oʁigiˈnaːl"
    pos: noun
    gender: n
    plural: "die Originale"
    # Recognition only: `original` as an adjective already ships as a production
    # card in eigenschaften-bewertung-b1, and a prompt about originals cannot tell
    # the learner which of the two is wanted.
    cards: recognition
    en: the signed or issued document itself, as opposed to a photocopy of it
    ru: подлинник документа, в отличие от фотокопии
    uk: оригінал документа, на відміну від фотокопії
    example_de: Bringen Sie bitte das Original und zwei Kopien mit.
    example_en: Please bring the original and two copies with you.
    example_ru: Принесите, пожалуйста, подлинник и две копии.
    example_uk: Принесіть, будь ласка, оригінал і дві копії.
    note:
      en: 'The counterpart of A2 die Kopie, and the pair is the whole grammar of a German counter: im Original vorlegen means hand over the real one, in Kopie means a photocopy will do, and eine beglaubigte Kopie is one a notary or an office has certified. The adjective spelled with a small letter is a different card in eigenschaften-bewertung-b1 and means unaltered or genuine. A third, human sense is affectionate: er ist ein Original, said of somebody wonderfully unlike anybody else.'
      ru: 'Пара к die Kopie уровня A2, и эта пара — вся грамматика немецкого окошка: im Original vorlegen значит «предъявить настоящий», in Kopie — «хватит фотокопии», а eine beglaubigte Kopie — копия, заверенная нотариусом или ведомством. Прилагательное с маленькой буквы — отдельная карточка в eigenschaften-bewertung-b1, оно значит «неизменённый, подлинный». Третий, «человеческий» смысл — тёплый: er ist ein Original говорят о том, кто чудесно не похож ни на кого.'
      uk: 'Пара до die Kopie рівня A2, і ця пара — уся граматика німецького віконця: im Original vorlegen означає «подати справжній», in Kopie — «вистачить фотокопії», а eine beglaubigte Kopie — копія, засвідчена нотаріусом чи відомством. Прикметник з малої літери — окрема картка в eigenschaften-bewertung-b1, він означає «незмінений, справжній». Третій, «людський» сенс — теплий: er ist ein Original кажуть про того, хто чудово не схожий ні на кого.'

  - de: Rufnummer
    ipa: "ˈʁuːfˌnʊmɐ"
    pos: noun
    gender: f
    plural: "die Rufnummern"
    # Recognition only: A1 ships `Telefonnummer` (erste-schritte) as the production
    # card for exactly this slot — the same prompt, one register up.
    cards: recognition
    en: the number under which somebody can be phoned, in the wording forms use
    ru: номер телефона в официальном стиле, как его называют бланки и письма
    uk: номер телефону в офіційному стилі, як його називають бланки й листи
    example_de: Unter welcher Rufnummer sind Sie tagsüber erreichbar?
    example_en: On what number can you be reached during the day?
    example_ru: По какому номеру с вами можно связаться днём?
    example_uk: За яким номером з вами можна зв’язатися вдень?
    note:
      en: 'The formal twin of A1 die Telefonnummer, and it is the one printed on contracts, invoices and official letters. It carries the old verb rufen inside it, from the days when calling somebody was literally calling out — the same root as der Anruf and anrufen. Compounds worth recognising: die Mobilfunknummer for a mobile, and die Rufnummernmitnahme, the right to keep your number when you change provider.'
      ru: 'Официальный двойник die Telefonnummer уровня A1, и именно он печатается в договорах, счетах и служебных письмах. Внутри слова живёт старый глагол rufen — из времён, когда «позвать» и значило окликнуть; тот же корень, что в der Anruf и anrufen. Составные слова, которые стоит узнавать: die Mobilfunknummer — номер мобильного и die Rufnummernmitnahme — право сохранить номер при смене оператора.'
      uk: 'Офіційний двійник die Telefonnummer рівня A1, і саме він друкується в договорах, рахунках і службових листах. Усередині слова живе старе дієслово rufen — із часів, коли «покликати» й означало гукнути; той самий корінь, що в der Anruf та anrufen. Складні слова, які варто впізнавати: die Mobilfunknummer — номер мобільного і die Rufnummernmitnahme — право зберегти номер при зміні оператора.'

  - de: Vorwahl
    ipa: "ˈfoːɐ̯ˌvaːl"
    pos: noun
    gender: f
    plural: "die Vorwahlen"
    en: the digits dialled before a phone number to reach a particular town or country
    ru: код города или страны, который набирают перед номером телефона
    uk: код міста або країни, який набирають перед номером телефону
    example_de: Die Vorwahl für Wien ist 01, aus dem Ausland 43 1.
    example_en: The dialling code for Vienna is 01, and 43 1 from abroad.
    example_ru: Код Вены — 01, а из-за границы 43 1.
    example_uk: Код Відня — 01, а з-за кордону 43 1.
    note:
      en: 'Literally the choosing done beforehand, from wählen, which A2 teaches in all three of its senses: to choose, to dial and to vote. Germany writes the code with a leading zero and drops it when the country code is in front, which is exactly what the example shows. Do not confuse it with die Durchwahl, the extension that reaches one desk inside a company directly. In American politics the same German word is used for a primary election, but that sense belongs to the news, not to a form.'
      ru: 'Буквально «выбор, сделанный заранее», от wählen, у которого на A2 разбирают все три значения: выбирать, набирать номер и голосовать. Германия пишет код с ведущим нулём и опускает его, когда впереди стоит код страны, — ровно как в примере. Не путать с die Durchwahl: это добавочный номер, который сразу выводит на конкретный стол внутри фирмы. В американской политике тем же немецким словом называют праймериз, но этот смысл принадлежит новостям, а не бланку.'
      uk: 'Буквально «вибір, зроблений заздалегідь», від wählen, у якого на A2 розбирають усі три значення: вибирати, набирати номер і голосувати. Німеччина пише код із провідним нулем і опускає його, коли попереду стоїть код країни, — точно як у прикладі. Не плутати з die Durchwahl: це додатковий номер, що одразу виводить на конкретний стіл усередині фірми. В американській політиці тим самим німецьким словом називають праймеріз, але цей сенс належить новинам, а не бланку.'

  # --- Was erlaubt ist und was nicht ---
  - de: genehmigen
    ipa: "gəˈneːmɪgn̩"
    pos: verb
    praesens_3sg: genehmigt
    partizip2: genehmigt
    aux: haben
    valence: "+ Akk"
    # Recognition only: A2 ships `erlauben` ("to allow, to permit",
    # verben-handlungen-a2-1) as the production card for granting permission.
    cards: recognition
    en: to grant something officially after checking it
    ru: официально одобрять, разрешать после проверки
    uk: офіційно схвалювати, дозволяти після перевірки
    example_de: Die Stadt hat den Umbau des Balkons genehmigt.
    example_en: The town has approved the rebuilding of the balcony.
    example_ru: Город согласовал перестройку балкона.
    example_uk: Місто погодило перебудову балкона.
    note:
      en: 'The institutional relative of A2 erlauben. A parent, a teacher or a friend erlaubt something; a council, a landlord or a boss genehmigt it, and only after an application has been looked at. It takes an accusative object and no person: einen Antrag genehmigen, einen Urlaub genehmigen, and the passive is where you will meet it most (Ihr Antrag wurde genehmigt). The noun is die Genehmigung, and its opposite in an official letter is ablehnen, to turn down.'
      ru: 'Институциональный родственник глагола erlauben уровня A2. Родитель, учитель или друг что-то erlaubt; совет, домовладелец или начальник это genehmigt — и только после того, как заявление рассмотрели. Дополнение в Akkusativ, без лица: einen Antrag genehmigen, einen Urlaub genehmigen, а чаще всего вы встретите пассив (Ihr Antrag wurde genehmigt). Существительное — die Genehmigung, а противоположность в официальном письме — ablehnen, «отклонить».'
      uk: 'Інституційний родич дієслова erlauben рівня A2. Батько, учитель чи друг щось erlaubt; рада, власник житла чи начальник це genehmigt — і лише після того, як заяву розглянули. Додаток у Akkusativ, без особи: einen Antrag genehmigen, einen Urlaub genehmigen, а найчастіше ви зустрінете пасив (Ihr Antrag wurde genehmigt). Іменник — die Genehmigung, а протилежність в офіційному листі — ablehnen, «відхилити».'

  - de: untersagt
    ipa: "ʊntɐˈzaːkt"
    pos: adj
    # Recognition only: the notice-board register above `verboten`, which is itself
    # answered by A2's `verboten sein` production card in verben-handlungen-a2-2.
    cards: recognition
    en: not permitted, in the wording an official notice uses
    ru: "не допускается: формулировка официального объявления"
    uk: "не допускається: формулювання офіційного оголошення"
    example_de: Das Betreten der Baustelle ist Unbefugten untersagt.
    example_en: Entering the building site is not permitted to unauthorised persons.
    example_ru: Вход на стройплощадку посторонним не допускается.
    example_uk: Вхід на будівельний майданчик стороннім не дозволено.
    note:
      en: 'One notch more formal than verboten and almost never heard in speech: it belongs to signs, house rules and official letters, and it very often comes with a dative saying whom it applies to (Unbefugten, Kindern, Rauchern). The verb behind it is untersagen, which is inseparable and takes a dative person plus an accusative thing — Der Arzt hat ihm den Alkohol untersagt. On a sign the two often stand together, and a third, milder wording is nicht gestattet.'
      ru: 'На ступень официальнее, чем verboten, и в речи почти не встречается: это язык табличек, правил дома и служебных писем, и очень часто рядом стоит Dativ, указывающий, к кому это относится (Unbefugten, Kindern, Rauchern). За словом стоит глагол untersagen: неотделяемый, с лицом в Dativ и предметом в Akkusativ — Der Arzt hat ihm den Alkohol untersagt. На табличке эти два слова часто соседствуют, а третья, более мягкая формулировка — nicht gestattet.'
      uk: 'На щабель офіційніше, ніж verboten, і в мовленні майже не трапляється: це мова табличок, правил будинку та службових листів, і дуже часто поряд стоїть Dativ, що вказує, до кого це стосується (Unbefugten, Kindern, Rauchern). За словом стоїть дієслово untersagen: невідокремлюване, з особою в Dativ і предметом у Akkusativ — Der Arzt hat ihm den Alkohol untersagt. На табличці ці два слова часто сусідять, а третє, м''якше формулювання — nicht gestattet.'

  - de: verboten
    ipa: "fɛɐ̯ˈboːtn̩"
    pos: adj
    # Recognition only: A2 ships the phrase `verboten sein` ("to be forbidden, to be
    # not allowed", verben-handlungen-a2-2) as a production card, and `verbieten`
    # beside it — a typed prompt about being forbidden is answered one deck over.
    cards: recognition
    en: ruled out by a law or a house rule
    ru: запрещённый законом или правилом
    uk: заборонений законом або правилом
    example_de: Rauchen ist im ganzen Gebäude verboten.
    example_en: Smoking is forbidden throughout the building.
    example_ru: Курение запрещено во всём здании.
    example_uk: Куріння заборонено в усій будівлі.
    note:
      en: 'The Partizip II of A2 verbieten, long since an adjective in its own right and the everyday word on every German sign — Zutritt verboten, Parken verboten, Betreten verboten. Note the pattern the signs use: a capitalised infinitive as the subject plus this word, and no verb at all. In speech Germans often add a shrug to it, streng verboten, and the noun is das Verbot. The stiffer untersagt above says the same thing to an authority''s own standard.'
      ru: 'Partizip II от verbieten уровня A2, давно ставшее самостоятельным прилагательным и главным словом любой немецкой таблички: Zutritt verboten, Parken verboten, Betreten verboten. Обратите внимание на приём табличек: инфинитив с прописной буквы в роли подлежащего плюс это слово — и никакого глагола. В речи немцы часто усиливают его: streng verboten, а существительное — das Verbot. Более сухое untersagt выше говорит то же самое языком самого ведомства.'
      uk: 'Partizip II від verbieten рівня A2, давно самостійний прикметник і головне слово будь-якої німецької таблички: Zutritt verboten, Parken verboten, Betreten verboten. Зверніть увагу на прийом табличок: інфінітив з великої літери в ролі підмета плюс це слово — і жодного дієслова. У мовленні німці часто підсилюють його: streng verboten, а іменник — das Verbot. Сухіше untersagt вище каже те саме мовою самого відомства.'

  # --- Was der Staat nimmt und was er gibt ---
  - de: Steuer
    ipa: "ˈʃtɔʏ̯ɐ"
    pos: noun
    gender: f
    plural: "die Steuern"
    en: money the state takes from income, goods and property
    ru: "налог: деньги, которые государство берёт с дохода, товаров и имущества"
    uk: "податок: гроші, які держава бере з доходу, товарів і майна"
    example_de: Von jedem Gehalt gehen zuerst die Steuern ab.
    example_en: Tax comes off every salary first.
    example_ru: С каждой зарплаты сначала удерживаются налоги.
    example_uk: З кожної зарплати спершу утримуються податки.
    note:
      en: 'Almost always plural in real sentences — Steuern zahlen, Steuern sparen — and the singular turns up mainly inside compounds: die Einkommensteuer, die Mehrwertsteuer, die Hundesteuer, which is a real thing in Germany. The office is das Finanzamt and the yearly form is die Steuererklärung. There is a homonym to keep apart: das Steuer with the neuter article is a steering wheel or a helm, from steuern, to steer, and only the feminine one is money.'
      ru: 'В живой речи почти всегда во множественном числе — Steuern zahlen, Steuern sparen, — а единственное встречается в основном внутри составных слов: die Einkommensteuer, die Mehrwertsteuer, die Hundesteuer, которая в Германии существует всерьёз. Ведомство — das Finanzamt, а годовая форма — die Steuererklärung. Есть омоним, который надо различать: das Steuer со средним артиклем — руль или штурвал, от steuern «управлять»; деньгами является только женский вариант.'
      uk: 'У живому мовленні майже завжди в множині — Steuern zahlen, Steuern sparen, — а однина трапляється переважно всередині складних слів: die Einkommensteuer, die Mehrwertsteuer, die Hundesteuer, яка в Німеччині існує всерйоз. Відомство — das Finanzamt, а річна форма — die Steuererklärung. Є омонім, який треба розрізняти: das Steuer із середнім артиклем — кермо або штурвал, від steuern «керувати»; грошима є лише жіночий варіант.'

  - de: Versicherung
    ipa: "fɛɐ̯ˈzɪçəʁʊŋ"
    pos: noun
    gender: f
    plural: "die Versicherungen"
    en: a contract that pays for a damage, and the company that sells it
    ru: страхование как договор и страховая компания, которая его продаёт
    uk: страхування як договір і страхова компанія, що його продає
    example_de: Ohne Versicherung darf man in Deutschland kein Auto fahren.
    example_en: You are not allowed to drive a car in Germany without insurance.
    example_ru: Без страховки в Германии нельзя водить машину.
    example_uk: Без страхування в Німеччині не можна керувати автівкою.
    note:
      en: 'The word does double duty: the cover you have and the firm that provides it, so eine Versicherung abschließen is to take out a policy and bei einer Versicherung arbeiten is to work for the company. Germany runs on a handful of them and their names are worth recognising: die Krankenversicherung, die Haftpflichtversicherung, die Rentenversicherung, die Hausratversicherung. Beside it, die Krankenkasse is one particular public health insurer, not the general word. The verb is versichern, which also means to assure somebody of something.'
      ru: 'Слово делает двойную работу: это и покрытие, которое у вас есть, и фирма, которая его даёт, поэтому eine Versicherung abschließen — «оформить полис», а bei einer Versicherung arbeiten — «работать в страховой компании». Германия держится на нескольких из них, и их названия стоит узнавать: die Krankenversicherung, die Haftpflichtversicherung, die Rentenversicherung, die Hausratversicherung. Рядом: die Krankenkasse — конкретная государственная больничная касса, а не общее слово. Глагол — versichern, у него есть и второе значение: заверять кого-либо в чём-либо.'
      uk: 'Слово робить подвійну роботу: це і покриття, яке у вас є, і фірма, що його дає, тому eine Versicherung abschließen — «оформити поліс», а bei einer Versicherung arbeiten — «працювати в страховій компанії». Німеччина тримається на кількох із них, і їхні назви варто впізнавати: die Krankenversicherung, die Haftpflichtversicherung, die Rentenversicherung, die Hausratversicherung. Поряд: die Krankenkasse — конкретна державна лікарняна каса, а не загальне слово. Дієслово — versichern, у нього є й друге значення: запевняти когось у чомусь.'

  - de: Versichertenkarte
    ipa: "fɛɐ̯ˈzɪçɐtn̩ˌkaʁtə"
    pos: noun
    gender: f
    plural: "die Versichertenkarten"
    # Recognition only: read on a letter from the health insurer and handed over
    # without a word at the reception desk.
    cards: recognition
    en: the plastic card handed in at a doctor's desk to show who pays the bill
    ru: пластиковая карточка, которую подают в регистратуре врача, чтобы показать, кто платит по счёту
    uk: пластикова картка, яку подають у реєстратурі лікаря, щоб показати, хто платить за рахунком
    example_de: Bitte legen Sie Ihre Versichertenkarte an der Anmeldung vor.
    example_en: Please present your health insurance card at the reception desk.
    example_ru: Пожалуйста, предъявите вашу страховую карточку в регистратуре.
    example_uk: Будь ласка, пред’явіть вашу страхову картку в реєстратурі.
    note:
      en: 'The first thing a German practice asks for, before your name. It is a chip card issued by the Krankenkasse, valid for years, and the official name today is die elektronische Gesundheitskarte, often shortened to eGK on the letter that encloses it. Austria calls the same thing die e-card. The plural inside the compound is the genitive of der Versicherte, the insured person, which is why there is a -ten- in the middle of the word.'
      ru: 'Первое, что спрашивает немецкая практика, — раньше, чем имя. Это чиповая карта, которую выдаёт Krankenkasse, действует она годами, а официальное название сегодня — die elektronische Gesundheitskarte, в письме её часто сокращают до eGK. В Австрии то же самое называется die e-card. Внутри составного слова стоит родительный от der Versicherte, «застрахованный», — отсюда и -ten- в середине.'
      uk: 'Перше, що питає німецька практика, — раніше за ім’я. Це чипова картка, яку видає Krankenkasse, чинна вона роками, а офіційна назва сьогодні — die elektronische Gesundheitskarte, у листі її часто скорочують до eGK. В Австрії те саме називається die e-card. Усередині складного слова стоїть родовий від der Versicherte, «застрахований», — звідси й -ten- посередині.'

  - de: Unterstützung
    ipa: "ʊntɐˈʃtʏtsʊŋ"
    pos: noun
    gender: f
    plural: "die Unterstützungen"
    en: help given to somebody who needs it, above all money paid by the state
    ru: помощь нуждающемуся, прежде всего денежное пособие от государства
    uk: допомога тому, хто її потребує, передусім грошова виплата від держави
    example_de: Nach dem Unfall bekam sie sechs Monate lang finanzielle Unterstützung.
    example_en: After the accident she received financial support for six months.
    example_ru: После аварии она полгода получала денежную помощь.
    example_uk: Після аварії вона пів року отримувала грошову допомогу.
    note:
      en: 'The noun of B1 unterstützen, and in civic German it is usually money: staatliche Unterstützung, finanzielle Unterstützung, Unterstützung beantragen. It also covers help of any other kind, which is why a thank-you letter ends vielen Dank für Ihre Unterstützung. Do not reach for die Hilfe every time — that word is immediate and personal, while this one is arranged, applied for and often paid monthly. Beside it, die Förderung below is money for a purpose rather than for a person in need.'
      ru: 'Существительное от unterstützen уровня B1, и в гражданском немецком речь чаще всего о деньгах: staatliche Unterstützung, finanzielle Unterstützung, Unterstützung beantragen. Оно покрывает и любую другую помощь — поэтому благодарственное письмо кончается словами vielen Dank für Ihre Unterstützung. Не берите всякий раз die Hilfe: то слово о немедленной и личной помощи, а это — о помощи оформленной, запрошенной и часто ежемесячной. Рядом: die Förderung ниже — деньги под цель, а не человеку в нужде.'
      uk: 'Іменник від unterstützen рівня B1, і в громадянській німецькій ідеться найчастіше про гроші: staatliche Unterstützung, finanzielle Unterstützung, Unterstützung beantragen. Воно покриває й будь-яку іншу допомогу — тому подячний лист закінчується словами vielen Dank für Ihre Unterstützung. Не беріть щоразу die Hilfe: те слово про негайну й особисту допомогу, а це — про допомогу оформлену, запитану й часто щомісячну. Поряд: die Förderung нижче — гроші під мету, а не людині в скруті.'

  - de: Förderung
    ipa: "ˈfœʁdəʁʊŋ"
    pos: noun
    gender: f
    plural: "die Förderungen"
    # Recognition only: read in a letter, a website and a funding decision. Where a
    # learner has to produce the idea, `Unterstützung` above carries it.
    cards: recognition
    en: money and effort put behind a project, a talent or a piece of research so that it can develop
    en_compact: "funding for a project or a talent"
    ru: целевое финансирование и содействие развитию проекта, дарования или исследования
    uk: цільове фінансування і сприяння розвиткові проєкту, обдарування чи дослідження
    example_de: Ohne staatliche Förderung wäre das Museum längst geschlossen.
    example_en: Without state funding the museum would have closed long ago.
    example_ru: Без государственного финансирования музей давно бы закрылся.
    example_uk: Без державного фінансування музей давно б зачинився.
    note:
      en: 'It is money with a purpose attached, so it goes to a thing rather than to a person in need: die Förderung der Forschung, ein Förderprogramm, ein Förderantrag. In schools it means extra teaching for a child who needs it, die Förderung schwacher Schüler, and die Sonderschule is officially die Förderschule for the same reason. Do not confuse it with die Forderung, one letter apart, which is a demand somebody makes.'
      ru: 'Это деньги с прикреплённой целью, поэтому они идут вещи, а не человеку в нужде: die Förderung der Forschung, ein Förderprogramm, ein Förderantrag. В школе так называют дополнительные занятия для ребёнка, которому это нужно, — die Förderung schwacher Schüler, и по той же причине die Sonderschule официально называется die Förderschule. Не путайте с die Forderung, отличающимся одной буквой: это требование, которое кто-то выдвигает.'
      uk: 'Це гроші з прикріпленою метою, тому вони йдуть речі, а не людині в скруті: die Förderung der Forschung, ein Förderprogramm, ein Förderantrag. У школі так називають додаткові заняття для дитини, якій це потрібно, — die Förderung schwacher Schüler, і з тієї ж причини die Sonderschule офіційно зветься die Förderschule. Не плутайте з die Forderung, що відрізняється однією літерою: це вимога, яку хтось висуває.'

  - de: fördern
    ipa: "ˈfœʁdɐn"
    pos: verb
    praesens_3sg: fördert
    partizip2: gefördert
    aux: haben
    valence: "+ Akk"
    # Recognition only: the verb of the entry above, and B1 `unterstützen`
    # (verben-handlungen-b1-3) is the shipped production card for backing somebody.
    cards: recognition
    en: to put money and effort behind something so that it grows
    ru: содействовать развитию, вкладывать деньги и силы во что-либо
    uk: сприяти розвиткові, вкладати гроші й сили в щось
    example_de: Die Stadt fördert Vereine, die Kinder aus dem Viertel betreuen.
    example_en: The town funds clubs that look after children from the neighbourhood.
    example_ru: Город финансирует объединения, которые занимаются детьми из этого района.
    example_uk: Місто фінансує об’єднання, які опікуються дітьми з цього кварталу.
    note:
      en: 'Takes an accusative object and no preposition, and its object is almost always a cause, a talent or an institution rather than a person in trouble — that would be unterstützen or helfen. A second, quite separate meaning belongs to industry: Kohle fördern, Öl fördern, to extract it from the ground, and that is where the word originally comes from. The adjective förderlich means good for something (Bewegung ist der Gesundheit förderlich), with a dative.'
      ru: 'Дополнение в Akkusativ, без предлога, и объектом почти всегда бывает дело, дарование или учреждение, а не человек в беде — для последнего есть unterstützen или helfen. Второе, совсем отдельное значение принадлежит промышленности: Kohle fördern, Öl fördern — «добывать из земли», и именно оттуда слово родом. Прилагательное förderlich значит «полезный для чего-либо» (Bewegung ist der Gesundheit förderlich), с дополнением в Dativ.'
      uk: 'Додаток у Akkusativ, без прийменника, і об’єктом майже завжди буває справа, обдарування чи установа, а не людина в біді — для останнього є unterstützen або helfen. Друге, зовсім окреме значення належить промисловості: Kohle fördern, Öl fördern — «видобувати із землі», і саме звідти слово родом. Прикметник förderlich означає «корисний для чогось» (Bewegung ist der Gesundheit förderlich), із додатком у Dativ.'

  - de: Einrichtung
    ipa: "ˈaɪ̯nˌʁɪçtʊŋ"
    pos: noun
    gender: f
    plural: "die Einrichtungen"
    # Recognition only: an umbrella word read in letters and on websites. A learner
    # names the thing itself — die Kita, die Bibliothek, das Heim.
    cards: recognition
    en: a body set up to provide a service to the public, such as a nursery or a library
    en_compact: "a public facility or institution"
    ru: "учреждение, созданное для общественной услуги: детский сад, библиотека и подобное"
    uk: "установа, створена для громадської послуги: дитячий садок, бібліотека тощо"
    example_de: In unserem Viertel fehlen Einrichtungen für ältere Menschen.
    example_en: Our neighbourhood lacks facilities for older people.
    example_ru: В нашем районе не хватает учреждений для пожилых людей.
    example_uk: У нашому кварталі бракує установ для літніх людей.
    note:
      en: 'An umbrella word, and German reaches for it whenever a text needs one label for a nursery, a school, a hospital, a home and a library at once: öffentliche Einrichtungen, soziale Einrichtungen. A second meaning is entirely domestic — the furniture and fittings of a flat, from einrichten, to furnish it, so eine moderne Einrichtung in an advert is about the interior. A third is technical: eine Einrichtung on a machine is a device fitted to it.'
      ru: 'Слово-зонтик: немецкий берёт его всякий раз, когда тексту нужна одна метка сразу для детского сада, школы, больницы, приюта и библиотеки — öffentliche Einrichtungen, soziale Einrichtungen. Второе значение чисто бытовое: обстановка квартиры, от einrichten «обставлять», так что eine moderne Einrichtung в объявлении — про интерьер. Третье техническое: eine Einrichtung на станке — установленное на нём приспособление.'
      uk: 'Слово-парасолька: німецька бере його щоразу, коли текстові потрібна одна позначка одразу для дитячого садка, школи, лікарні, притулку й бібліотеки — öffentliche Einrichtungen, soziale Einrichtungen. Друге значення суто побутове: обстановка квартири, від einrichten «обставляти», тож eine moderne Einrichtung в оголошенні — про інтер’єр. Третє технічне: eine Einrichtung на верстаті — встановлене на ньому пристосування.'

  - de: Fundbüro
    ipa: "ˈfʊntbyˌʁoː"
    pos: noun
    gender: n
    plural: "die Fundbüros"
    en: the counter where things left on a train or a bench are handed in and collected
    ru: "бюро находок: место, куда сдают и где забирают забытые вещи"
    uk: "бюро знахідок: місце, куди здають і де забирають забуті речі"
    example_de: Meinen Schirm habe ich zwei Wochen später im Fundbüro wiederbekommen.
    example_en: I got my umbrella back two weeks later at the lost property office.
    example_ru: Свой зонт я получил обратно через две недели в бюро находок.
    example_uk: Свою парасольку я отримав назад за два тижні в бюро знахідок.
    note:
      en: 'Every German city, railway operator and airport runs one, and the rule is the same everywhere: whoever finds something worth more than ten euros is legally obliged to hand it in. Beside it, A2 die Fundsachen are the objects lying on its shelves, not the room. The verb inside is finden, and der Fund is a find — an archaeologist''s as much as a commuter''s. Austria and Switzerland write das Fundamt and das Fundbüro alike.'
      ru: 'Такое учреждение есть у каждого немецкого города, железнодорожного перевозчика и аэропорта, и правило везде одно: тот, кто нашёл вещь дороже десяти евро, обязан её сдать. Рядом: die Fundsachen уровня A2 — это предметы на его полках, а не само помещение. Внутри слова глагол finden, а der Fund — «находка», что археологическая, что забытая в электричке. В Австрии и Швейцарии пишут и das Fundamt, и das Fundbüro.'
      uk: 'Така установа є в кожного німецького міста, залізничного перевізника й аеропорту, і правило скрізь одне: той, хто знайшов річ дорожчу за десять євро, зобов’язаний її здати. Поряд: die Fundsachen рівня A2 — це предмети на його полицях, а не саме приміщення. Усередині слова дієслово finden, а der Fund — «знахідка», хоч археологічна, хоч забута в електричці. В Австрії та Швейцарії пишуть і das Fundamt, і das Fundbüro.'

  # --- Wem etwas gehört: öffentlich, städtisch, im Dienst ---
  - de: öffentlich
    ipa: "ˈœfn̩tlɪç"
    pos: adj
    en: open to everyone, or run by the state rather than by a private owner
    ru: общедоступный; государственный, а не частный
    uk: загальнодоступний; державний, а не приватний
    example_de: Die Sitzung des Gemeinderats ist öffentlich.
    example_en: The council meeting is open to the public.
    example_ru: Заседание совета общины проходит открыто для всех.
    example_uk: Засідання ради громади відбувається відкрито для всіх.
    note:
      en: 'Two senses that a German sentence keeps apart by context. Open to anybody: eine öffentliche Veranstaltung, öffentlich sprechen. Belonging to the state: die öffentlichen Verkehrsmittel, der öffentliche Dienst, eine öffentliche Schule, where the opposite is privat. The noun die Öffentlichkeit is the public as a body and public attention as a thing (an die Öffentlichkeit gehen, to go public). Do not confuse it with offiziell, which is about coming from an official source rather than about being open.'
      ru: 'Два значения, которые немецкое предложение различает по контексту. «Открытый для всех»: eine öffentliche Veranstaltung, öffentlich sprechen. «Государственный»: die öffentlichen Verkehrsmittel, der öffentliche Dienst, eine öffentliche Schule, где противоположность — privat. Существительное die Öffentlichkeit — это и общество как целое, и публичное внимание (an die Öffentlichkeit gehen — «предать огласке»). Не путайте с offiziell: то слово о происхождении из официального источника, а не об открытости.'
      uk: 'Два значення, які німецьке речення розрізняє за контекстом. «Відкритий для всіх»: eine öffentliche Veranstaltung, öffentlich sprechen. «Державний»: die öffentlichen Verkehrsmittel, der öffentliche Dienst, eine öffentliche Schule, де протилежність — privat. Іменник die Öffentlichkeit — це і суспільство як ціле, і публічна увага (an die Öffentlichkeit gehen — «оприлюднити»). Не плутайте з offiziell: те слово про походження з офіційного джерела, а не про відкритість.'

  - de: städtisch
    ipa: "ˈʃtɛtɪʃ"
    pos: adj
    # Recognition only: read on signs and in letters. A learner says von der Stadt
    # or names the town itself.
    cards: recognition
    en: belonging to the town council; also typical of towns rather than of the country
    en_compact: "municipal; urban"
    ru: муниципальный, принадлежащий городу; также городской по характеру
    uk: муніципальний, що належить місту; також міський за характером
    example_de: Der Kindergarten ist städtisch, deshalb sind die Gebühren niedriger.
    example_en: The kindergarten is run by the town, which is why the fees are lower.
    example_ru: Детский сад муниципальный, поэтому плата ниже.
    example_uk: Дитячий садок муніципальний, тому плата нижча.
    note:
      en: 'The adjective of die Stadt, with the regular umlaut that -isch brings with it. Ownership is the commoner sense in official German — das städtische Krankenhaus, die städtischen Angestellten, ein städtisches Grundstück — and it stands against staatlich for the federal state above it and privat for a company. The second sense, urban rather than rural, is more often carried by urban or by städtisches Leben. Careful with two lookalikes: ständig means constant, and städtebaulich is about town planning.'
      ru: 'Прилагательное от die Stadt с закономерным умлаутом, который приносит с собой -isch. В официальном немецком чаще звучит смысл принадлежности: das städtische Krankenhaus, die städtischen Angestellten, ein städtisches Grundstück, — и оно противостоит staatlich, «принадлежащий земле или государству», и privat. Второе значение, «городской в противоположность сельскому», чаще передают словом urban или оборотом städtisches Leben. Осторожно с двумя похожими словами: ständig значит «постоянный», а städtebaulich — «градостроительный».'
      uk: 'Прикметник від die Stadt із закономірним умлаутом, який приносить із собою -isch. В офіційній німецькій частіше звучить сенс належності: das städtische Krankenhaus, die städtischen Angestellten, ein städtisches Grundstück, — і воно протистоїть staatlich, «той, що належить землі чи державі», та privat. Друге значення, «міський на противагу сільському», частіше передають словом urban або зворотом städtisches Leben. Обережно з двома схожими словами: ständig означає «постійний», а städtebaulich — «містобудівний».'

  - de: Dienst
    ipa: "ˈdiːnst"
    pos: noun
    gender: m
    plural: "die Dienste"
    # Recognition only: too many senses for one typed prompt to name — the hours on
    # duty, the branch of the state, and a favour done for somebody.
    cards: recognition
    en: the hours somebody is on duty, and the branch of the state that employs them
    en_compact: "duty; the public service"
    ru: "дежурство и служба: часы на посту и государственная служба как место работы"
    uk: "чергування і служба: години на посту й державна служба як місце роботи"
    example_de: Am Wochenende hat sie Dienst im Krankenhaus.
    example_en: At the weekend she is on duty at the hospital.
    example_ru: В выходные она дежурит в больнице.
    example_uk: На вихідних вона чергує в лікарні.
    note:
      en: 'Three senses live in it. The shift you are rostered for: Dienst haben, im Dienst sein, außer Dienst. The employer: der öffentliche Dienst is the whole state sector, and Beamte belong to it. A favour: jemandem einen Dienst erweisen, and the wry Das hat mir gute Dienste geleistet about a thing that served you well. The days of the week keep the root — Dienstag was the day of the assembly — and der Dienstleistung is a service sold to a customer, which is the sense A2 teaches.'
      ru: 'В слове живут три смысла. Смена, на которую вы заступаете: Dienst haben, im Dienst sein, außer Dienst. Работодатель: der öffentliche Dienst — весь государственный сектор, и Beamte относятся к нему. Услуга-одолжение: jemandem einen Dienst erweisen, а также ироничное Das hat mir gute Dienste geleistet о вещи, которая хорошо послужила. Тот же корень сидит в названии дня недели — Dienstag был днём схода, — а die Dienstleistung — это услуга, проданная клиенту, и именно этот смысл разбирают на A2.'
      uk: 'У слові живуть три сенси. Зміна, на яку ви заступаєте: Dienst haben, im Dienst sein, außer Dienst. Роботодавець: der öffentliche Dienst — увесь державний сектор, і Beamte належать до нього. Послуга-послуга: jemandem einen Dienst erweisen, а також іронічне Das hat mir gute Dienste geleistet про річ, яка добре послужила. Той самий корінь сидить у назві дня тижня — Dienstag був днем сходу, — а die Dienstleistung — це послуга, продана клієнтові, і саме цей сенс розбирають на A2.'
