    example_uk: Діти хочуть з’їсти морозиво біля озера.
    note:
      en: 'Switzerland, from French glace, feminine, plural in -s. Germany and Austria say A1 das Eis in the deck `einkaufen-geschaefte`, which does two jobs at once — the frozen sweet and the frozen water on a lake. Switzerland splits them: the sweet is die Glace, the water is still das Eis. So a Swiss text can tell the two apart where a German one has to rely on context.'
      ru: 'Швейцария, от французского glace, женский род, множественное на -s. Германия и Австрия говорят das Eis уровня A1 из колоды `einkaufen-geschaefte`, а это слово делает сразу две работы: замороженное лакомство и лёд на озере. Швейцария их разводит: лакомство — die Glace, лёд по-прежнему das Eis. Поэтому швейцарский текст различает их там, где немецкому приходится полагаться на контекст.'
      uk: 'Швейцарія, від французького glace, жіночий рід, множина на -s. Німеччина й Австрія кажуть das Eis рівня A1 з колоди `einkaufen-geschaefte`, а це слово робить одразу дві роботи: заморожені ласощі і лід на озері. Швейцарія їх розводить: ласощі — die Glace, лід і далі das Eis. Тому швейцарський текст розрізняє їх там, де німецькому доводиться покладатися на контекст.'

  # --- In der Küche ---
  - de: grillieren
