      ru: 'Прежде всего Швейцария, а с нею и юг немецкоязычной области. Мужской род, множественного нет. Германия говорит die Sahne уровня B1 из колоды `essen-lebensmittel-b1`, Австрия — das Obers выше. Скисшие, они дают der Sauerrahm, а сложные слова в швейцарском меню на каждом шагу: die Rahmsauce, das Rahmschnitzel, der Rahmspinat.'
      uk: 'Передусім Швейцарія, а з нею і південь німецькомовного простору. Чоловічий рід, множини немає. Німеччина каже die Sahne рівня B1 з колоди `essen-lebensmittel-b1`, Австрія — das Obers вище. Скислі, вони дають der Sauerrahm, а складні слова у швейцарському меню на кожному кроці: die Rahmsauce, das Rahmschnitzel, der Rahmspinat.'

