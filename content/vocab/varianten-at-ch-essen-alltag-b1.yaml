    note:
      en: 'Austria and Bavaria; masculine, singular and plural spelled alike. Northern Germany calls the same thing B1 der Kloß in the deck `essen-lebensmittel-b1`, and a cookery book usually prints whichever word its author grew up with. The kinds name their filling or their dough, and three of them use words from this deck: der Semmelknödel, der Erdäpfelknödel and, as a summer dessert, der Marillenknödel.'
      ru: 'Австрия и Бавария; мужской род, единственное и множественное пишутся одинаково. Север Германии зовёт то же самое der Kloß уровня B1 из колоды `essen-lebensmittel-b1`, а поваренная книга обычно печатает то слово, с которым вырос её автор. Виды называют начинку или тесто, и три из них пользуются словами этой колоды: der Semmelknödel, der Erdäpfelknödel и, как летний десерт, der Marillenknödel.'
      uk: 'Австрія і Баварія; чоловічий рід, однина і множина пишуться однаково. Північ Німеччини зве те саме der Kloß рівня B1 з колоди `essen-lebensmittel-b1`, а кулінарна книга зазвичай друкує те слово, з яким виріс її автор. Види називають начинку або тісто, і три з них послуговуються словами цієї колоди: der Semmelknödel, der Erdäpfelknödel і, як літній десерт, der Marillenknödel.'

  - de: Obers
