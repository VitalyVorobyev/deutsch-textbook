    note:
      en: 'Switzerland''s verb where Germany and Austria use A2 grillen in the deck `essen-trinken-a2`. Weak, and the -ieren ending takes no ge- in the participle: hat grilliert, exactly like studieren and passieren. The thing it is done on is B1 der Grill in the deck `gesellschaft-zusammenleben` in all three countries, so only the verb changes at the border.'
      ru: 'Швейцарский глагол там, где Германия и Австрия берут grillen уровня A2 из колоды `essen-trinken-a2`. Слабый, а окончание -ieren не даёт ge- в причастии: hat grilliert, ровно как studieren и passieren. То, на чём это делают, во всех трёх странах der Grill уровня B1 из колоды `gesellschaft-zusammenleben`, так что на границе меняется только глагол.'
      uk: 'Швейцарське дієслово там, де Німеччина й Австрія беруть grillen рівня A2 з колоди `essen-trinken-a2`. Слабке, а закінчення -ieren не дає ge- у дієприкметнику: hat grilliert, точно як studieren і passieren. Те, на чому це роблять, в усіх трьох країнах der Grill рівня B1 з колоди `gesellschaft-zusammenleben`, тож на кордоні змінюється тільки дієслово.'

