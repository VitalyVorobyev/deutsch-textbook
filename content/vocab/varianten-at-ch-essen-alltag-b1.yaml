      ru: 'Австрия и Бавария. Это уменьшительное от das Huhn, отсюда средний род; во множественном -n. Германия говорит das Hähnchen уровня A2 из колоды `essen-trinken-a2`, а о мясе, а не о блюде, — das Hühnchen уровня B1 из колоды `essen-lebensmittel-b1`; Швейцария говорит das Poulet, следующая запись. Два обиходных сложных слова: das Brathendl и das Grillhendl.'
      uk: 'Австрія і Баварія. Це зменшене від das Huhn, звідси середній рід; у множині -n. Німеччина каже das Hähnchen рівня A2 з колоди `essen-trinken-a2`, а про м’ясо, а не про страву, — das Hühnchen рівня B1 з колоди `essen-lebensmittel-b1`; Швейцарія каже das Poulet, наступний запис. Два побутові складні слова: das Brathendl і das Grillhendl.'

  - de: Poulet
    ipa: "puˈleː"
