    ru: небольшая еда в середине утра, около девяти
    uk: невелика їжа посеред ранку, близько дев’ятої
    example_de: In der Pause um neun essen die Kinder ihr Znüni.
    example_en: The children eat their morning snack in the nine o'clock break.
    example_ru: На перемене в девять дети едят свой утренний перекус.
    example_uk: На перерві о дев’ятій діти їдять свою ранкову перекуску.
    note:
      en: 'Switzerland, and the word names its own hour: z Nüni, at nine. Neuter, and like every -li and -i word of this family it does not change in the plural. Its afternoon twin is das Zvieri, the next entry. Austria has one word for both, die Jause above; Germany has none and says eine Kleinigkeit or B1 der Imbiss in the deck `gastronomie-feste-b1`. The initial cluster is spoken ts plus n, in one push.'
      ru: 'Швейцария, и слово само называет свой час: z Nüni — «в девять». Средний род, и, как всякое слово этого семейства на -li и -i, во множественном не меняется. Его послеполуденный близнец — das Zvieri, следующая запись. У Австрии одно слово на оба случая, die Jause выше; у Германии нет ни одного, и она скажет eine Kleinigkeit или der Imbiss уровня B1 из колоды `gastronomie-feste-b1`. Начальное сочетание произносят как ts плюс n, одним толчком.'
      uk: 'Швейцарія, і слово саме називає свою годину: z Nüni — «о дев’ятій». Середній рід, і, як усяке слово цієї родини на -li та -i, у множині не змінюється. Його пообідній близнюк — das Zvieri, наступний запис. В Австрії одне слово на обидва випадки, die Jause вище; у Німеччини немає жодного, і вона скаже eine Kleinigkeit або der Imbiss рівня B1 з колоди `gastronomie-feste-b1`. Початкове сполучення вимовляють як ts плюс n, одним поштовхом.'

  - de: Zvieri
    ipa: "ˈtsfiːʁi"
    pos: noun
    gender: n
    plural: "die Zvieri"
    cards: recognition
    en: the small thing eaten in the middle of the afternoon, at about four
    ru: небольшая еда в середине дня, около четырёх
    uk: невелика їжа посеред дня, близько четвертої
    example_de: Nach der Schule gibt es zu Hause ein Zvieri.
    example_en: There is an afternoon snack at home after school.
    example_ru: После школы дома дают полдник.
    example_uk: Після школи вдома дають підвечірок.
    note:
      en: 'Built exactly like das Znüni above: z Vieri, at four, with the v spoken f — ˈtsfiːʁi. Neuter, unchanged in the plural. A Swiss day is measured out by the two of them, one at the morning break and one after school, and both words are heard far more often than they are written. Austria covers the pair with die Jause above.'
      ru: 'Построено в точности как das Znüni выше: z Vieri — «в четыре», причём v звучит как f: ˈtsfiːʁi. Средний род, во множественном не меняется. Швейцарский день размечен этими двумя — один на утренней перемене, другой после школы, — и оба слова слышат куда чаще, чем пишут. Австрия покрывает пару словом die Jause выше.'
      uk: 'Побудовано достеменно як das Znüni вище: z Vieri — «о четвертій», причому v звучить як f: ˈtsfiːʁi. Середній рід, у множині не змінюється. Швейцарський день розмічений цими двома — один на ранковій перерві, другий після школи, — і обидва слова чують куди частіше, ніж пишуть. Австрія покриває пару словом die Jause вище.'

