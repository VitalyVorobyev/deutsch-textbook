      en: 'Ordinary Movierung with -in on the masculine above, with no change to the stem and a doubled n in the plural. Austria writes the pair out in full on an apprenticeship contract, Fleischhauer/Fleischhauerin, exactly as Germany writes Metzger/Metzgerin. The trade has a third name again in the north, die Fleischerin.'
      ru: 'Обычное мовирование на -in от мужской формы выше, без изменений в основе и с удвоенным n во множественном. Австрия выписывает пару целиком в договоре об ученичестве — Fleischhauer/Fleischhauerin, — ровно как Германия пишет Metzger/Metzgerin. На севере у ремесла снова третье название: die Fleischerin.'
      uk: 'Звичайна моція на -in від чоловічої форми вище, без змін в основі і з подвоєним n у множині. Австрія виписує пару цілком у договорі про учнівство — Fleischhauer/Fleischhauerin, — точно як Німеччина пише Metzger/Metzgerin. На півночі в ремесла знову третя назва: die Fleischerin.'

  - de: Hendl
