      ru: 'Швейцария, прямо из французского, и конечное t не произносится: puˈleː. Средний род, множественное на -s. Германия говорит das Hähnchen уровня A2 из колоды `essen-trinken-a2`, Австрия — das Hendl выше. В швейцарском меню встретятся и die Pouletbrust, и das Pouletgeschnetzelte: внутри сложного слова заимствование ведёт себя как немецкое.'
      uk: 'Швейцарія, просто з французької, і кінцеве t не вимовляється: puˈleː. Середній рід, множина на -s. Німеччина каже das Hähnchen рівня A2 з колоди `essen-trinken-a2`, Австрія — das Hendl вище. У швейцарському меню трапляться і die Pouletbrust, і das Pouletgeschnetzelte: усередині складного слова запозичення поводиться як німецьке.'

