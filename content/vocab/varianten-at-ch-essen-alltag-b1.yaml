# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the Austrian and
# Swiss everyday field of data/goethe-b1-wortliste.txt: the food, the kitchen, the
# street and the calendar as Vienna and Zurich name them. The manifest prints these
# rows beside their Germany-German siblings — Aprikose/Marille, Brötchen/Semmel/Brötli,
# Kartoffel/Erdapfel, Gehsteig/Trottoir — because the exam expects a B1 reader to
# recognise both halves of every pair.
# The German half is already shipped and stays the production card: A1's `essen-trinken`
# owns Brötchen, Kartoffel, Frühstück and Fleisch, A1's `einkaufen-geschaefte` owns Dose,
# Eis and Tomate, B1's `essen-lebensmittel-b1` owns Aprikose, Karotte, Möhre, Kloß,
# Hackfleisch, Sahne, Schlagsahne and Pilz, A2's `essen-trinken-a2` owns grillen and
# Hähnchen, B1's `gastronomie-feste-b1` owns Metzger, Backofen, Imbiss, Snack and
# Fasching, A2's `zeit-termine-a2` owns Karneval, A1's `stadt-wege` owns Fahrrad, A1's
# `reisen-urlaub` owns Straßenbahn and Ecke, B1's `verkehr-auto-b1` owns Gehsteig, A2's
# `wohnen-umzug` owns Treppe, B1's `regeln-verantwortung` owns Treppenhaus, B1's
# `wohnen-gebaeude-b1` owns Ofen and Sessel, A2's `berufe-a2` owns Kellner, Friseur and
# Friseurin, B1's `text-schreiben-b1` owns Briefumschlag, A2's `einkaufen-geld-a2` owns
# Geldbörse, B1's `haushalt-notfall-b1` owns Streichholz and Feuerzeug, A1's `alltag-zeit`
# owns Januar and A1's `zahlen-daten-geld` owns Februar. This deck is the other column.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c, and here the
# reason is at its plainest: the learner writes Germany's German and is never asked to
# produce a Marille. This field is read, never written — it is what an Austrian menu,
# a Swiss timetable and a Viennese calendar say back at him.
id: varianten-at-ch-essen-alltag-b1
title_de: "Österreichisch und Schweizerisch: Essen und Alltag"
title_en: "Austrian and Swiss words: food and everyday life"
title_ru: "Австрийское и швейцарское: еда и повседневность"
title_uk: "Австрійське і швейцарське: їжа і повсякдення"
level: B1
entries:
  # --- Was auf dem Markt liegt ---
  - de: Marille
    ipa: "maˈʁɪlə"
    pos: noun
    gender: f
    plural: "die Marillen"
    cards: recognition
    en: the small soft orange stone fruit of high summer
    ru: небольшой мягкий оранжевый плод с косточкой, поспевающий в разгар лета
    uk: невеликий м’який помаранчевий плід із кісточкою, що достигає в розпал літа
    example_de: Im Sommer kauft man auf dem Markt frische Marillen.
    example_en: In summer you buy fresh apricots at the market.
    example_ru: Летом на рынке покупают свежие абрикосы.
    example_uk: Улітку на ринку купують свіжі абрикоси.
    note:
      en: 'Austria''s word, feminine, plural in -n. Germany and Switzerland say B1 die Aprikose in the deck `essen-lebensmittel-b1`, which is what a supermarket label prints. The Wachau valley on the Danube has made a name of it: Marillenmarmelade on the breakfast table, Marillenschnaps after dinner, and the Marillenknödel below among the desserts. The stress is on the middle syllable.'
      ru: 'Австрийское слово, женский род, множественное на -n. Германия и Швейцария говорят die Aprikose уровня B1 из колоды `essen-lebensmittel-b1` — именно эту форму печатает магазинная этикетка. Долина Вахау на Дунае сделала из слова имя: Marillenmarmelade к завтраку, Marillenschnaps после ужина и Marillenknödel ниже среди десертов. Ударение на среднем слоге.'
      uk: 'Австрійське слово, жіночий рід, множина на -n. Німеччина і Швейцарія кажуть die Aprikose рівня B1 з колоди `essen-lebensmittel-b1` — саме цю форму друкує магазинна етикетка. Долина Вахау на Дунаї зробила зі слова ім’я: Marillenmarmelade до сніданку, Marillenschnaps після вечері й Marillenknödel нижче серед десертів. Наголос на середньому складі.'

  - de: Erdapfel
    ipa: "ˈeːɐ̯tˌʔapfl̩"
    pos: noun
    gender: m
    plural: "die Erdäpfel"
    cards: recognition
    en: the round tuber that is boiled, fried or mashed and served beside the meat
    ru: круглый клубень, который отваривают, жарят или разминают и подают к мясу
    uk: круглий бульбоплід, який відварюють, смажать або розминають і подають до м’яса
    example_de: Zum Fleisch gibt es Erdäpfel und Salat.
    example_en: There are potatoes and salad with the meat.
    example_ru: К мясу подают картофель и салат.
    example_uk: До м’яса подають картоплю і салат.
    note:
      en: 'Literally the apple of the earth. Austria uses it where Germany and Switzerland say A1 die Kartoffel in the deck `essen-trinken`. Masculine, and the plural takes an umlaut: der Erdapfel, die Erdäpfel. The compounds follow the head, so an Austrian menu offers Erdäpfelsalat and Erdäpfelpüree. Note the glottal stop before the second half, eːɐ̯t-ʔapfl̩, which is how German joins any compound whose second part begins with a vowel.'
      ru: 'Буквально «яблоко земли». Австрия говорит так там, где Германия и Швейцария берут die Kartoffel уровня A1 из колоды `essen-trinken`. Мужской род, а во множественном умлаут: der Erdapfel, die Erdäpfel. Сложные слова идут за главной частью, поэтому австрийское меню предлагает Erdäpfelsalat и Erdäpfelpüree. Обратите внимание на гортанную смычку перед второй половиной, eːɐ̯t-ʔapfl̩: так немецкий соединяет любое сложное слово, вторая часть которого начинается с гласного.'
      uk: 'Буквально «яблуко землі». Австрія каже так там, де Німеччина і Швейцарія беруть die Kartoffel рівня A1 з колоди `essen-trinken`. Чоловічий рід, а в множині умлаут: der Erdapfel, die Erdäpfel. Складні слова йдуть за головною частиною, тому австрійське меню пропонує Erdäpfelsalat і Erdäpfelpüree. Зверніть увагу на гортанний зімкнений перед другою половиною, eːɐ̯t-ʔapfl̩: так німецька з’єднує будь-яке складне слово, друга частина якого починається з голосного.'

  - de: Paradeiser
    ipa: "paʁaˈdaɪ̯zɐ"
    pos: noun
    gender: m
    plural: "die Paradeiser"
    cards: recognition
    en: the round red fruit eaten raw in salads and cooked down into sauce
    ru: круглый красный плод, который едят сырым в салате и уваривают в соус
    uk: круглий червоний плід, який їдять сирим у салаті й уварюють у соус
    example_de: Der Salat besteht nur aus Paradeisern und Zwiebeln.
    example_en: The salad consists of nothing but tomatoes and onions.
    example_ru: Салат состоит только из помидоров и лука.
    example_uk: Салат складається тільки з помідорів і цибулі.
    note:
      en: 'Short for Paradeisapfel, the apple of paradise. It is eastern Austria''s word, Vienna above all; the west of the country says die Tomate like Germany and Switzerland, and that is A1 die Tomate in the deck `einkaufen-geschaefte`. Masculine, singular and plural spelled alike, so only the article tells them apart. Stress falls on the -dei-.'
      ru: 'Сокращение от Paradeisapfel — «райское яблоко». Это слово востока Австрии, прежде всего Вены; запад страны говорит die Tomate, как Германия и Швейцария, и это die Tomate уровня A1 из колоды `einkaufen-geschaefte`. Мужской род, единственное и множественное пишутся одинаково, так что различает их только артикль. Ударение падает на -dei-.'
      uk: 'Скорочення від Paradeisapfel — «райське яблуко». Це слово сходу Австрії, передусім Відня; захід країни каже die Tomate, як Німеччина і Швейцарія, і це die Tomate рівня A1 з колоди `einkaufen-geschaefte`. Чоловічий рід, однина і множина пишуться однаково, тож розрізняє їх лише артикль. Наголос падає на -dei-.'

  - de: Rüebli
    ipa: "ˈʁyːəbli"
    pos: noun
    gender: n
    plural: "die Rüebli"
    cards: recognition
    en: the long orange root eaten raw, grated or cooked
    ru: длинный оранжевый корнеплод, который едят сырым, тёртым или варёным
    uk: довгий помаранчевий коренеплід, який їдять сирим, тертим або вареним
    example_de: Zum Znüni nimmt das Kind immer ein Rüebli mit.
    example_en: The child always takes a carrot along for the morning snack.
    example_ru: На утренний перекус ребёнок всегда берёт с собой морковку.
    example_uk: На ранковий перекус дитина завжди бере із собою морквину.
    note:
      en: 'Switzerland''s word, a -li diminutive of die Rübe, so it is neuter and the plural is spelled exactly like the singular — the rule for the whole -li family, das Brötli below included. Germany and Austria say B1 die Karotte or B1 die Möhre in the deck `essen-lebensmittel-b1`, whose note already divides north from south. The canton of Aargau is nicknamed Rüebliland and sells the Rüeblitorte to prove it.'
      ru: 'Швейцарское слово, уменьшительное на -li от die Rübe, поэтому средний род, а множественное пишется в точности как единственное — правило для всего семейства на -li, включая das Brötli ниже. Германия и Австрия говорят die Karotte или die Möhre уровня B1 из колоды `essen-lebensmittel-b1`, и её примечание уже делит север и юг. Кантон Аргау зовут Rüebliland и в доказательство продаёт Rüeblitorte.'
      uk: 'Швейцарське слово, зменшене на -li від die Rübe, тому середній рід, а множина пишеться достеменно як однина — правило для всієї родини на -li, разом із das Brötli нижче. Німеччина й Австрія кажуть die Karotte або die Möhre рівня B1 з колоди `essen-lebensmittel-b1`, і її примітка вже ділить північ і південь. Кантон Ааргау звуть Rüebliland і на доказ продає Rüeblitorte.'

  - de: Schwammerl
    ipa: "ˈʃvamɐl"
    pos: noun
    gender: n
    plural: "die Schwammerln"
    cards: recognition
    en: the thing with a cap and a stem that grows in the wood and is gathered for the pan
    ru: то, что растёт в лесу на ножке под шляпкой и что собирают, чтобы пожарить
    uk: те, що росте в лісі на ніжці під шапинкою і що збирають, аби посмажити
    example_de: Im Herbst gehen wir im Wald Schwammerln suchen.
    example_en: In autumn we go looking for mushrooms in the wood.
    example_ru: Осенью мы ходим в лес за грибами.
    example_uk: Восени ми ходимо до лісу по гриби.
    note:
      en: 'Austria and Bavaria, a diminutive of der Schwamm, so neuter; the plural adds -n. Germany says B1 der Pilz in the deck `essen-lebensmittel-b1`, and that is also the word a shop label and a biology book use in Austria — this one belongs to the wood and the kitchen. The fixed chunk is Schwammerln suchen gehen, and a Schwammerlsuppe is what comes of it.'
      ru: 'Австрия и Бавария, уменьшительное от der Schwamm, отсюда средний род; во множественном добавляется -n. Германия говорит der Pilz уровня B1 из колоды `essen-lebensmittel-b1`, и то же слово в Австрии стоит на магазинной этикетке и в учебнике биологии, а это принадлежит лесу и кухне. Устойчивый оборот — Schwammerln suchen gehen, а получается из этого Schwammerlsuppe.'
      uk: 'Австрія і Баварія, зменшене від der Schwamm, звідси середній рід; у множині додається -n. Німеччина каже der Pilz рівня B1 з колоди `essen-lebensmittel-b1`, і те саме слово в Австрії стоїть на магазинній етикетці й у підручнику біології, а це належить лісові й кухні. Усталений зворот — Schwammerln suchen gehen, а виходить із цього Schwammerlsuppe.'

  # --- Brot, Fleisch, Milch ---
  - de: Semmel
    ipa: "ˈzɛml̩"
    pos: noun
    gender: f
    plural: "die Semmeln"
    cards: recognition
    en: a small round white roll, the everyday breakfast bread
    ru: небольшая круглая белая булочка, обиходный хлеб к завтраку
    uk: невелика кругла біла булочка, побутовий хліб до сніданку
    example_de: Zum Frühstück isst er zwei Semmeln mit Butter.
    example_en: For breakfast he eats two rolls with butter.
    example_ru: На завтрак он съедает две булочки с маслом.
    example_uk: На сніданок він з’їдає дві булочки з маслом.
    note:
      en: 'Austria and the south-east of Germany, Bavaria above all. Feminine, plural in -n. Germany''s general word is A1 das Brötchen in the deck `essen-trinken`, and Switzerland says das Brötli, the next entry — three names for one roll, which is why the Wortliste lists all three. One idiom travels beyond the bakery: etwas geht weg wie warme Semmeln, it sells like hot cakes.'
      ru: 'Австрия и юго-восток Германии, прежде всего Бавария. Женский род, множественное на -n. Общее слово Германии — das Brötchen уровня A1 из колоды `essen-trinken`, а Швейцария говорит das Brötli, следующая запись: три названия одной булочки, потому Wortliste и даёт все три. Один оборот выходит за пределы булочной: etwas geht weg wie warme Semmeln — «расходится нарасхват».'
      uk: 'Австрія і південний схід Німеччини, передусім Баварія. Жіночий рід, множина на -n. Загальне слово Німеччини — das Brötchen рівня A1 з колоди `essen-trinken`, а Швейцарія каже das Brötli, наступний запис: три назви однієї булочки, тому Wortliste і подає всі три. Один зворот виходить за межі пекарні: etwas geht weg wie warme Semmeln — «розходиться нарозхват».'

  - de: Brötli
    ipa: "ˈbʁøːtli"
    pos: noun
    gender: n
    plural: "die Brötli"
    cards: recognition
    en: a small bread roll, the size one person eats at breakfast
    ru: маленькая хлебная булочка — как раз на одного человека к завтраку
    uk: маленька хлібна булочка — саме на одну людину до сніданку
    example_de: Am Sonntag holt der Vater frische Brötli beim Bäcker.
    example_en: On Sunday the father fetches fresh rolls from the baker.
    example_ru: В воскресенье отец приносит от пекаря свежие булочки.
    example_uk: У неділю батько приносить від пекаря свіжі булочки.
    note:
      en: 'Switzerland, and the same word as A1 das Brötchen in the deck `essen-trinken` with a different diminutive on it: German makes small things with -chen, Switzerland with -li. Both endings force the neuter, but only the German one changes nothing in the plural either way — das Brötli, die Brötli, exactly as with das Rüebli above. Austria says die Semmel above.'
      ru: 'Швейцария, и это то же слово, что das Brötchen уровня A1 из колоды `essen-trinken`, только с другим уменьшительным суффиксом: немецкий делает малое через -chen, Швейцария через -li. Оба суффикса требуют среднего рода, а множественное здесь просто не меняется: das Brötli, die Brötli, ровно как у das Rüebli выше. Австрия говорит die Semmel выше.'
      uk: 'Швейцарія, і це те саме слово, що das Brötchen рівня A1 з колоди `essen-trinken`, лише з іншим зменшувальним суфіксом: німецька робить мале через -chen, Швейцарія через -li. Обидва суфікси вимагають середнього роду, а множина тут просто не змінюється: das Brötli, die Brötli, точно як у das Rüebli вище. Австрія каже die Semmel вище.'

  - de: Faschierte
    ipa: "faˈʃiːɐ̯tə"
    pos: noun
    gender: n
    plural: "—"
    # An adjectival noun (das Faschierte / ein Faschiertes / mit dem Faschierten), so it
    # would need an accept list if it were typed — it is not, and the note carries the
    # declension. The `Tote` entry in recht-kriminalitaet-b1 and `Kranke` in
    # koerper-medizin-b1 are modelled the same way and for the same reason.
    cards: recognition
    en: meat put through the mincer, sold by weight and shaped in the pan
    ru: мясо, пропущенное через мясорубку, — его продают на вес и формуют на сковороде
    uk: м’ясо, пропущене через м’ясорубку, — його продають на вагу і формують на пательні
    example_de: Für die Sauce brauchen wir ein halbes Kilo Faschiertes.
    example_en: We need half a kilo of mince for the sauce.
    example_ru: Для соуса нам нужно полкило фарша.
    example_uk: Для соусу нам потрібно півкіла фаршу.
    note:
      en: 'An adjectival noun from faschiert, minced, so the ending follows whatever stands in front: das Faschierte, ein Faschiertes, mit dem Faschierten — the same pattern as B1 die Tote in the deck `recht-kriminalitaet-b1` and B1 der Kranke in the deck `koerper-medizin-b1`. It is Austria''s word; Germany and Switzerland say B1 das Hackfleisch in the deck `essen-lebensmittel-b1`. Austrian cooking builds faschierte Laibchen out of it, and the shop counter also writes faschiertes Fleisch in full.'
      ru: 'Субстантивированное прилагательное от faschiert — «рубленый», поэтому окончание следует за тем, что стоит впереди: das Faschierte, ein Faschiertes, mit dem Faschierten — тот же образец, что у die Tote уровня B1 из колоды `recht-kriminalitaet-b1` и der Kranke уровня B1 из колоды `koerper-medizin-b1`. Это австрийское слово; Германия и Швейцария говорят das Hackfleisch уровня B1 из колоды `essen-lebensmittel-b1`. Австрийская кухня делает из него faschierte Laibchen, а прилавок пишет и полностью: faschiertes Fleisch.'
      uk: 'Субстантивований прикметник від faschiert — «січений», тому закінчення йде за тим, що стоїть попереду: das Faschierte, ein Faschiertes, mit dem Faschierten — той самий взірець, що в die Tote рівня B1 з колоди `recht-kriminalitaet-b1` і der Kranke рівня B1 з колоди `koerper-medizin-b1`. Це австрійське слово; Німеччина і Швейцарія кажуть das Hackfleisch рівня B1 з колоди `essen-lebensmittel-b1`. Австрійська кухня робить із нього faschierte Laibchen, а прилавок пише й повністю: faschiertes Fleisch.'

  - de: Fleischhauer
    ipa: "ˈflaɪ̯ʃˌhaʊ̯ɐ"
    pos: noun
    gender: m
    plural: "die Fleischhauer"
    cards: recognition
    en: the tradesman who cuts up meat and sells it over a counter
    ru: ремесленник, который разделывает мясо и продаёт его за прилавком
    uk: ремісник, який розбирає м’ясо і продає його за прилавком
    example_de: Das Fleisch für den Braten kaufen wir beim Fleischhauer.
    example_en: We buy the meat for the roast at the butcher's.
    example_ru: Мясо для жаркого мы покупаем у мясника.
    example_uk: М’ясо для печені ми купуємо в м’ясника.
    note:
      en: 'Austria''s name for the trade, the one on the shop sign and in the trade register. Southern Germany and Switzerland say B1 der Metzger in the deck `gastronomie-feste-b1`, whose note already draws that line; northern and eastern Germany say der Fleischer. Masculine, singular and plural spelled alike, and beim Fleischhauer means at his shop. The shop itself is die Fleischhauerei; the feminine is the next entry.'
      ru: 'Австрийское название ремесла — то, что стоит на вывеске и в реестре промыслов. Юг Германии и Швейцария говорят der Metzger уровня B1 из колоды `gastronomie-feste-b1`, и её примечание уже проводит эту границу; север и восток Германии говорят der Fleischer. Мужской род, единственное и множественное пишутся одинаково, а beim Fleischhauer значит «в его лавке». Сама лавка — die Fleischhauerei; женская пара — следующая запись.'
      uk: 'Австрійська назва ремесла — та, що стоїть на вивісці й у реєстрі промислів. Південь Німеччини і Швейцарія кажуть der Metzger рівня B1 з колоди `gastronomie-feste-b1`, і її примітка вже проводить цю межу; північ і схід Німеччини кажуть der Fleischer. Чоловічий рід, однина і множина пишуться однаково, а beim Fleischhauer означає «у його крамниці». Сама крамниця — die Fleischhauerei; жіноча пара — наступний запис.'

  - de: Fleischhauerin
