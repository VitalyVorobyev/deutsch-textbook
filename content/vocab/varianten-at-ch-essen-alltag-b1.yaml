      ru: 'Австрия; женский род, множественное на -n, а рядом есть и глагол jausnen. У Германии для самого понятия есть die Zwischenmahlzeit, а ближе к самой еде — der Imbiss и der Snack уровня B1 из колоды `gastronomie-feste-b1`. Швейцария делит ту же еду надвое по часам: das Znüni и das Zvieri ниже. То, что австрийский ребёнок несёт в школу, — das Jausenbrot.'
      uk: 'Австрія; жіночий рід, множина на -n, а поряд є й дієслово jausnen. У Німеччини для самого поняття є die Zwischenmahlzeit, а ближче до самої їжі — der Imbiss і der Snack рівня B1 з колоди `gastronomie-feste-b1`. Швейцарія ділить ту саму їжу надвоє за годинником: das Znüni і das Zvieri нижче. Те, що австрійська дитина несе до школи, — das Jausenbrot.'

  - de: Znüni
    ipa: "ˈtsnyːni"
    pos: noun
    gender: n
    plural: "die Znüni"
    cards: recognition
