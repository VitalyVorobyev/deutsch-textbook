    example_en: Would you like the coffee with whipped cream?
    example_ru: Вам кофе со взбитыми сливками?
    example_uk: Вам каву зі збитими вершками?
    note:
      en: 'Switzerland: Schlag- plus the Rahm above, masculine and without a plural. Three languages'' worth of one substance now stand together — B1 die Schlagsahne in the deck `essen-lebensmittel-b1` in Germany, das Schlagobers above in Austria, this in Switzerland — and which of them a menu prints says where the kitchen is. The g of Schlag is devoiced to k here too.'
      ru: 'Швейцария: Schlag- плюс Rahm выше, мужской род и без множественного. Теперь рядом стоят три названия одного и того же — die Schlagsahne уровня B1 из колоды `essen-lebensmittel-b1` в Германии, das Schlagobers выше в Австрии и это в Швейцарии, — и то, какое из них печатает меню, говорит, где находится кухня. G слова Schlag и здесь оглушается в k.'
      uk: 'Швейцарія: Schlag- плюс Rahm вище, чоловічий рід і без множини. Тепер поряд стоять три назви того самого — die Schlagsahne рівня B1 з колоди `essen-lebensmittel-b1` у Німеччині, das Schlagobers вище в Австрії і це у Швейцарії, — і те, яку з них друкує меню, каже, де кухня. G слова Schlag і тут оглушується в k.'

