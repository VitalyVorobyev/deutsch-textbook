    gender: n
    plural: "die Backrohre"
    cards: recognition
    en: the part of a cooker that is heated from all sides for baking and roasting
    ru: часть плиты, которую прогревают со всех сторон для выпечки и запекания
    uk: частина плити, яку прогрівають з усіх боків для випікання і запікання
    example_de: Bitte das Backrohr auf 180 Grad vorheizen.
    example_en: Please preheat the oven to 180 degrees.
    example_ru: Разогрейте, пожалуйста, духовку до 180 градусов.
    example_uk: Розігрійте, будь ласка, духовку до 180 градусів.
    note:
      en: 'Back- from backen plus the Rohr above: the full Austrian word, neuter, plural in -e. A recipe printed in Vienna opens with the sentence in the example; the same recipe printed in Hamburg says den Backofen vorheizen, and that is B1 der Backofen in the deck `gastronomie-feste-b1`. Primary stress on Back-, secondary on -rohr, as in every German compound of this shape.'
      ru: 'Back- от backen плюс Rohr выше: полное австрийское слово, средний род, множественное на -e. Рецепт, напечатанный в Вене, начинается фразой из примера; тот же рецепт, напечатанный в Гамбурге, скажет den Backofen vorheizen — это der Backofen уровня B1 из колоды `gastronomie-feste-b1`. Главное ударение на Back-, побочное на -rohr, как во всяком немецком сложном слове такого устройства.'
      uk: 'Back- від backen плюс Rohr вище: повне австрійське слово, середній рід, множина на -e. Рецепт, надрукований у Відні, починається фразою з прикладу; той самий рецепт, надрукований у Гамбурзі, скаже den Backofen vorheizen — це der Backofen рівня B1 з колоди `gastronomie-feste-b1`. Головний наголос на Back-, побічний на -rohr, як у кожному німецькому складному слові такої будови.'

