    example_uk: Вона щодня їздить на роботу велосипедом.
    note:
      en: 'Switzerland, clipped from French vélocipède; neuter, plural in -s. Germany and Austria say A1 das Fahrrad in the deck `stadt-wege`, shortened in speech to A2 das Rad in the deck `verkehr-unterwegs-a2`. The Swiss word carries its own family with it: der Veloweg, der Velofahrer, der Veloständer, so a signpost in Bern reads differently from one in Berlin.'
      ru: 'Швейцария, усечение французского vélocipède; средний род, множественное на -s. Германия и Австрия говорят das Fahrrad уровня A1 из колоды `stadt-wege`, а в речи сокращают до das Rad уровня A2 из колоды `verkehr-unterwegs-a2`. Швейцарское слово тянет за собой своё семейство: der Veloweg, der Velofahrer, der Veloständer, — поэтому указатель в Берне читается иначе, чем в Берлине.'
      uk: 'Швейцарія, усічення французького vélocipède; середній рід, множина на -s. Німеччина й Австрія кажуть das Fahrrad рівня A1 з колоди `stadt-wege`, а в мовленні скорочують до das Rad рівня A2 з колоди `verkehr-unterwegs-a2`. Швейцарське слово тягне за собою свою родину: der Veloweg, der Velofahrer, der Veloständer, — тому вказівник у Берні читається інакше, ніж у Берліні.'

  - de: Tram
    ipa: "ˈtʁam"
    pos: noun
    gender: n
    plural: "die Trams"
    cards: recognition
    en: the vehicle that runs on rails through the streets of a city
    ru: транспорт, который ходит по рельсам прямо по городским улицам
    uk: транспорт, що ходить рейками просто міськими вулицями
    example_de: Mit dem Tram ist man in zehn Minuten am Bahnhof.
    example_en: The tram gets you to the station in ten minutes.
    example_ru: На трамвае до вокзала десять минут.
    example_uk: Трамваєм до вокзалу десять хвилин.
    note:
      en: 'Switzerland, and the gender is the trap rather than the word: there it is das Tram, mit dem Tram. Germany''s word is A1 die Straßenbahn in the deck `reisen-urlaub`, and where a German city does use the short form it makes it feminine, die Tram. Plural die Trams. An English loan by way of the tramway, and it keeps the short a.'
      ru: 'Швейцария, и ловушка тут не в слове, а в роде: там это das Tram, mit dem Tram. Слово Германии — die Straßenbahn уровня A1 из колоды `reisen-urlaub`, а там, где немецкий город всё же берёт короткую форму, он делает её женской: die Tram. Множественное die Trams. Заимствование из английского через tramway, и краткое a сохраняется.'
      uk: 'Швейцарія, і пастка тут не у слові, а в роді: там це das Tram, mit dem Tram. Слово Німеччини — die Straßenbahn рівня A1 з колоди `reisen-urlaub`, а там, де німецьке місто таки бере коротку форму, воно робить її жіночою: die Tram. Множина die Trams. Запозичення з англійської через tramway, і коротке a зберігається.'

  - de: Trottoir
    ipa: "tʁɔˈtoaːɐ̯"
    pos: noun
    gender: n
    plural: "die Trottoirs"
    cards: recognition
    en: the raised strip beside the road where people walk
    ru: приподнятая полоса вдоль проезжей части, по которой ходят пешеходы
    uk: піднята смуга вздовж проїзної частини, якою ходять пішоходи
    example_de: Auf dem Trottoir darf man nicht Velo fahren.
    example_en: You are not allowed to cycle on the pavement.
    example_ru: По тротуару нельзя ездить на велосипеде.
    example_uk: Тротуаром не можна їздити велосипедом.
    note:
      en: 'Switzerland, straight from French; neuter, plural in -s, and the -oir ends in the oa sound plus a vocalised r. B1 der Gehsteig in the deck `verkehr-auto-b1` is what Austria and southern Germany say, northern Germany says der Bürgersteig, and an official text says der Gehweg. Four words for one strip of pavement, and the one a text chooses places it on the map.'
      ru: 'Швейцария, прямо из французского; средний род, множественное на -s, а -oir даёт сочетание oa плюс вокализованное r. der Gehsteig уровня B1 из колоды `verkehr-auto-b1` — то, что говорят Австрия и юг Германии, север Германии говорит der Bürgersteig, а официальный текст — der Gehweg. Четыре слова для одной полосы тротуара, и то, какое из них выбрал текст, помещает его на карту.'
      uk: 'Швейцарія, просто з французької; середній рід, множина на -s, а -oir дає сполучення oa плюс вокалізоване r. der Gehsteig рівня B1 з колоди `verkehr-auto-b1` — те, що кажуть Австрія і південь Німеччини, північ Німеччини каже der Bürgersteig, а офіційний текст — der Gehweg. Чотири слова для однієї смуги тротуару, і те, яке з них обрав текст, розміщує його на мапі.'

  - de: parkieren
    ipa: "paʁˈkiːʁən"
    pos: verb
    praesens_3sg: parkiert
    partizip2: parkiert
    aux: haben
    cards: recognition
    en: to leave a car standing in a place meant for it
    ru: оставить машину стоять в отведённом для этого месте
    uk: залишити машину стояти у відведеному для цього місці
    example_de: Vor dem Bahnhof darf man nur eine Stunde parkieren.
    example_en: You may only park in front of the station for an hour.
    example_ru: Перед вокзалом можно стоять только час.
    example_uk: Перед вокзалом можна стояти лише годину.
    note:
      en: 'Switzerland; A2 parken in the deck `verkehr-unterwegs-a2` everywhere else. Weak and in -ieren, so the participle takes no ge-: hat parkiert, like grillieren above. A Swiss sign reads Parkieren verboten where a German one reads Parken verboten, and the noun on the ticket machine is das Parkieren.'
      ru: 'Швейцария; во всех прочих местах parken уровня A2 из колоды `verkehr-unterwegs-a2`. Слабый и на -ieren, поэтому в причастии нет ge-: hat parkiert, как и grillieren выше. Швейцарская табличка гласит Parkieren verboten там, где немецкая — Parken verboten, а на паркомате стоит существительное das Parkieren.'
      uk: 'Швейцарія; в усіх інших місцях parken рівня A2 з колоди `verkehr-unterwegs-a2`. Слабке і на -ieren, тому в дієприкметнику немає ge-: hat parkiert, як і grillieren вище. Швейцарська табличка каже Parkieren verboten там, де німецька — Parken verboten, а на паркоматі стоїть іменник das Parkieren.'

  - de: Stiege
    ipa: "ˈʃtiːgə"
    pos: noun
    gender: f
    plural: "die Stiegen"
    cards: recognition
    en: the set of steps that takes you from one floor of a building to the next
    ru: ряд ступеней, по которым поднимаются с этажа на этаж
    uk: ряд сходинок, якими підіймаються з поверху на поверх
    example_de: Der Aufzug ist kaputt, wir nehmen die Stiege.
    example_en: The lift is out of order, we will take the stairs.
    example_ru: Лифт сломан, пойдём по лестнице.
    example_uk: Ліфт зламаний, підемо сходами.
    note:
      en: 'Austria; feminine, plural in -n. A2 die Treppe in the deck `wohnen-umzug` is the general word and the one Germany uses. In an Austrian block of flats the word does a second job that has no German equivalent: it is part of the address, so Stiege 2, Tür 14 tells the postman which staircase to enter before it tells him which door.'
      ru: 'Австрия; женский род, множественное на -n. die Treppe уровня A2 из колоды `wohnen-umzug` — общее слово, его же берёт Германия. В австрийском многоквартирном доме слово делает вторую работу, которой у немецкого нет: оно входит в адрес, и Stiege 2, Tür 14 сначала говорит почтальону, в какой подъезд войти, и лишь потом — в какую дверь.'
      uk: 'Австрія; жіночий рід, множина на -n. die Treppe рівня A2 з колоди `wohnen-umzug` — загальне слово, його ж бере Німеччина. В австрійському багатоквартирному будинку слово робить другу роботу, якої в німецького немає: воно входить до адреси, і Stiege 2, Tür 14 спершу каже листоноші, до якого під’їзду ввійти, і лише потім — до яких дверей.'

  - de: Stiegenhaus
    ipa: "ˈʃtiːgn̩ˌhaʊ̯s"
    pos: noun
    gender: n
    plural: "die Stiegenhäuser"
    cards: recognition
    en: the shaft of a building that holds the stairs and belongs to all the flats
    ru: часть дома, где идёт лестница и которая принадлежит всем квартирам сразу
    uk: частина будинку, де йдуть сходи і яка належить усім помешканням разом
    example_de: Im Stiegenhaus darf man keine Fahrräder abstellen.
    example_en: Bicycles may not be left in the stairwell.
    example_ru: В подъезде нельзя оставлять велосипеды.
    example_uk: У під’їзді не можна залишати велосипеди.
    note:
      en: 'The Stiege above plus -haus. Germany says B1 das Treppenhaus in the deck `regeln-verantwortung`, which is where the house rules hang in both countries. Neuter, umlaut in the plural, primary stress on Stie- and a secondary one on -haus. The n between the two halves is syllabic, ˈʃtiːgn̩-, with no vowel of its own.'
      ru: 'Stiege выше плюс -haus. Германия говорит das Treppenhaus уровня B1 из колоды `regeln-verantwortung`, а правила дома висят там в обеих странах. Средний род, во множественном умлаут, главное ударение на Stie-, побочное на -haus. N между половинами слоговой, ˈʃtiːgn̩-, собственного гласного при нём нет.'
      uk: 'Stiege вище плюс -haus. Німеччина каже das Treppenhaus рівня B1 з колоди `regeln-verantwortung`, а правила будинку висять там в обох країнах. Середній рід, у множині умлаут, головний наголос на Stie-, побічний на -haus. N між половинами складотворний, ˈʃtiːgn̩-, власного голосного при ньому немає.'

  - de: Eck
    ipa: "ˈɛk"
    pos: noun
    gender: n
    plural: "die Ecke"
    cards: recognition
    en: the place where two walls or two streets meet
    ru: место, где сходятся две стены или две улицы
    uk: місце, де сходяться дві стіни або дві вулиці
    example_de: Das Geschäft ist gleich ums Eck.
    example_en: The shop is just around the corner.
    example_ru: Магазин прямо за углом.
    example_uk: Крамниця просто за рогом.
    note:
      en: 'Austria and southern Germany, and the plural is the trap: die Ecke, spelled exactly like the singular of A1 die Ecke in the deck `reisen-urlaub`, so only the article and the verb separate them. The neuter is the form the shape words are built on everywhere in German — das Dreieck, das Viereck, die Vierecke. The Austrian chunk is ums Eck; the general one is um die Ecke.'
      ru: 'Австрия и юг Германии, и ловушка во множественном: die Ecke пишется в точности как единственное число die Ecke уровня A1 из колоды `reisen-urlaub`, так что различают их только артикль и глагол. Средний род — та форма, на которой всюду в немецком строятся названия фигур: das Dreieck, das Viereck, die Vierecke. Австрийский оборот — ums Eck, общий — um die Ecke.'
      uk: 'Австрія і південь Німеччини, а пастка в множині: die Ecke пишеться достеменно як однина die Ecke рівня A1 з колоди `reisen-urlaub`, тож розрізняють їх лише артикль і дієслово. Середній рід — та форма, на якій усюди в німецькій будуються назви фігур: das Dreieck, das Viereck, die Vierecke. Австрійський зворот — ums Eck, загальний — um die Ecke.'

  # --- Was man in der Tasche und im Zimmer hat ---
  - de: Kuvert
    ipa: "kuˈvɛːɐ̯"
    pos: noun
    gender: n
    plural: "die Kuverts"
    cards: recognition
    en: the paper pocket a letter goes into before it is posted
    ru: бумажный карман, в который вкладывают письмо перед отправкой
    uk: паперова кишенька, до якої вкладають лист перед відправленням
    example_de: Sie steckt die Karte in ein Kuvert und klebt eine Briefmarke darauf.
    example_en: She puts the card in an envelope and sticks a stamp on it.
    example_ru: Она вкладывает открытку в конверт и наклеивает марку.
    example_uk: Вона вкладає листівку в конверт і наклеює марку.
    note:
      en: 'From French enveloppe couverte, shortened. It is Austria''s everyday word, and Germany knows it beside B1 der Briefumschlag in the deck `text-schreiben-b1`, which is the plainer and commoner German. Switzerland spells the same word Couvert, the next entry. Neuter, plural in -s, and the final t is silent: kuˈvɛːɐ̯, the same ending as in Dessert.'
      ru: 'От французского enveloppe couverte, в сокращении. Это обиходное слово Австрии, и Германия его знает наряду с der Briefumschlag уровня B1 из колоды `text-schreiben-b1` — более простым и более частым немецким словом. Швейцария пишет то же слово как Couvert, следующая запись. Средний род, множественное на -s, а конечное t не произносится: kuˈvɛːɐ̯, то же окончание, что и в Dessert.'
      uk: 'Від французького enveloppe couverte, у скороченні. Це побутове слово Австрії, і Німеччина його знає поряд із der Briefumschlag рівня B1 з колоди `text-schreiben-b1` — простішим і частішим німецьким словом. Швейцарія пише те саме слово як Couvert, наступний запис. Середній рід, множина на -s, а кінцеве t не вимовляється: kuˈvɛːɐ̯, те саме закінчення, що й у Dessert.'

  - de: Couvert
    ipa: "kuˈvɛːɐ̯"
    pos: noun
    gender: n
    plural: "die Couverts"
    cards: recognition
    en: the paper pocket a letter is put into, in the spelling Switzerland keeps
    ru: бумажный конверт для письма — в том написании, которое сохранила Швейцария
    uk: паперовий конверт для листа — у тому написанні, яке зберегла Швейцарія
    example_de: Auf dem Couvert fehlt noch die Adresse.
    example_en: The address is still missing from the envelope.
    example_ru: На конверте ещё нет адреса.
    example_uk: На конверті ще немає адреси.
    note:
      en: 'Switzerland writes the C, Austria the K: one word, one pronunciation, two spellings, and the manifest lists both because a B1 reader meets both. Neuter, plural in -s. Germany''s plain word is B1 der Briefumschlag in the deck `text-schreiben-b1`. Pairs like this are the reason a Swiss text can look French on the page and sound German when read aloud.'
      ru: 'Швейцария пишет C, Австрия K: одно слово, одно произношение, два написания, и список даёт оба, потому что читатель уровня B1 встретит оба. Средний род, множественное на -s. Простое слово Германии — der Briefumschlag уровня B1 из колоды `text-schreiben-b1`. Такие пары и объясняют, почему швейцарский текст выглядит на бумаге французским, а вслух звучит по-немецки.'
      uk: 'Швейцарія пише C, Австрія K: одне слово, одна вимова, два написання, і список подає обидва, бо читач рівня B1 зустріне обидва. Середній рід, множина на -s. Просте слово Німеччини — der Briefumschlag рівня B1 з колоди `text-schreiben-b1`. Такі пари й пояснюють, чому швейцарський текст на папері виглядає французьким, а вголос звучить по-німецьки.'

  - de: Portemonnaie
    ipa: "pɔʁtmɔˈneː"
    pos: noun
    gender: n
    plural: "die Portemonnaies"
    cards: recognition
    en: the small folding thing coins and notes are carried in
    ru: небольшая складная вещица, в которой носят монеты и купюры
    uk: невелика складана річ, у якій носять монети й купюри
    example_de: Das Portemonnaie liegt noch in der Jackentasche.
    example_en: The purse is still in the jacket pocket.
    example_ru: Кошелёк ещё лежит в кармане куртки.
    example_uk: Гаманець іще лежить у кишені куртки.
    note:
      en: 'French porte-monnaie, carry-money, and German keeps the spelling and the silent ending; neuter, plural in -s. It is at home in Switzerland and current across the German-speaking area beside A2 die Geldbörse in the deck `einkaufen-geld-a2`. Germany also writes the reformed Portmonee and says der Geldbeutel in speech, while B1 die Brieftasche in the deck `einkaufen-geld-b1` is the flat one for notes and cards.'
      ru: 'Французское porte-monnaie — «носи деньги», — и немецкий сохраняет написание и немое окончание; средний род, множественное на -s. Слово дома в Швейцарии и ходит по всей немецкоязычной области рядом с die Geldbörse уровня A2 из колоды `einkaufen-geld-a2`. Германия пишет и упрощённое Portmonee, а в речи говорит der Geldbeutel, тогда как die Brieftasche уровня B1 из колоды `einkaufen-geld-b1` — плоский бумажник для купюр и карт.'
      uk: 'Французьке porte-monnaie — «носи гроші», — і німецька зберігає написання й німе закінчення; середній рід, множина на -s. Слово вдома у Швейцарії й ходить усім німецькомовним простором поряд із die Geldbörse рівня A2 з колоди `einkaufen-geld-a2`. Німеччина пише й спрощене Portmonee, а в мовленні каже der Geldbeutel, тоді як die Brieftasche рівня B1 з колоди `einkaufen-geld-b1` — плаский гаманець для купюр і карток.'

  - de: Fauteuil
    ipa: "foˈtøːj"
    pos: noun
    gender: m
    plural: "die Fauteuils"
    cards: recognition
    en: a soft deep seat with arms, the one you sink into to read
    ru: мягкое глубокое сиденье с подлокотниками, в которое усаживаются с книгой
    uk: м’яке глибоке сидіння з підлокітниками, у яке всідаються з книжкою
    example_de: Der Großvater sitzt im Fauteuil und hört Radio.
    example_en: The grandfather is sitting in the armchair listening to the radio.
    example_ru: Дедушка сидит в кресле и слушает радио.
    example_uk: Дідусь сидить у кріслі й слухає радіо.
    note:
      en: 'Austria and Switzerland, from French; masculine, plural in -s, and -euil ends in a j sound. The word exists because B1 der Sessel in the deck `wohnen-gebaeude-b1` does not mean the same thing on both sides of the border: in Austria der Sessel is the upright chair at the table, which is A1 der Stuhl in the deck `wohnen` in Germany, so the armchair needed a name of its own. Read an Austrian sentence with the German meaning of Sessel and you furnish the room wrongly.'
      ru: 'Австрия и Швейцария, из французского; мужской род, множественное на -s, а -euil даёт на конце звук j. Слово существует потому, что der Sessel уровня B1 из колоды `wohnen-gebaeude-b1` по обе стороны границы значит разное: в Австрии der Sessel — обычный стул у стола, то есть der Stuhl уровня A1 из колоды `wohnen` в Германии, и креслу понадобилось собственное имя. Прочтите австрийскую фразу с немецким значением Sessel — и обставите комнату неправильно.'
      uk: 'Австрія і Швейцарія, із французької; чоловічий рід, множина на -s, а -euil дає на кінці звук j. Слово існує тому, що der Sessel рівня B1 з колоди `wohnen-gebaeude-b1` по обидва боки кордону означає різне: в Австрії der Sessel — звичайний стілець при столі, тобто der Stuhl рівня A1 з колоди `wohnen` у Німеччині, і кріслу знадобилося власне ім’я. Прочитайте австрійську фразу з німецьким значенням Sessel — і обставите кімнату неправильно.'

  - de: Zünder
    ipa: "ˈtsʏndɐ"
    pos: noun
    gender: m
    plural: "die Zünder"
    cards: recognition
    en: the little wooden stick with a head that is struck to make a flame
    ru: короткая деревянная палочка с головкой, которую чиркают, чтобы получить огонь
    uk: коротка дерев’яна паличка з голівкою, яку черкають, щоб дістати вогонь
    example_de: Hast du Zünder für die Kerzen?
    example_en: Have you got any matches for the candles?
    example_ru: У тебя есть спички для свечей?
    example_uk: Ти маєш сірники до свічок?
    note:
      en: 'Austria, and usually in the plural, as in the example. Masculine, singular and plural spelled alike. B1 das Streichholz in the deck `haushalt-notfall-b1` is the German word and its note already names the Austrian one; B1 das Feuerzeug in the same deck is the refillable thing that has largely replaced both. Das Zündholz, the next entry, is the fuller form. Outside this sense der Zünder is the fuse of an explosive, so it is the plural and the kitchen that make the everyday reading.'
      ru: 'Австрия, и обычно во множественном, как в примере. Мужской род, единственное и множественное пишутся одинаково. das Streichholz уровня B1 из колоды `haushalt-notfall-b1` — немецкое слово, и её примечание уже называет австрийское; das Feuerzeug уровня B1 из той же колоды — заправляемая вещь, которая почти вытеснила оба. Das Zündholz, следующая запись, — полная форма. Вне этого значения der Zünder — взрыватель, так что обиходное чтение задают множественное число и кухня.'
      uk: 'Австрія, і зазвичай у множині, як у прикладі. Чоловічий рід, однина і множина пишуться однаково. das Streichholz рівня B1 з колоди `haushalt-notfall-b1` — німецьке слово, і її примітка вже називає австрійське; das Feuerzeug рівня B1 з тієї самої колоди — заправна річ, що майже витіснила обидва. Das Zündholz, наступний запис, — повна форма. Поза цим значенням der Zünder — підривник, тож побутове читання задають множина і кухня.'

  - de: Zündholz
    ipa: "ˈtsʏntˌhɔlts"
    pos: noun
    gender: n
    plural: "die Zündhölzer"
    cards: recognition
    en: a short thin stick of wood with a head that catches fire when it is struck
    ru: короткая тонкая деревянная палочка с головкой, которая загорается от чирканья
    uk: коротка тонка дерев’яна паличка з голівкою, що займається від черкання
    example_de: In der Schachtel sind nur noch drei Zündhölzer.
    example_en: There are only three matches left in the box.
    example_ru: В коробке осталось всего три спички.
    example_uk: У коробці залишилося лише три сірники.
    note:
      en: 'Austria, Switzerland and southern Germany; neuter, umlaut and -er in the plural. B1 das Streichholz in the deck `haushalt-notfall-b1` is the northern and general word, and the two are built on different halves of the same act: streichen names the striking, zünden the lighting, and das Holz is in both. Austria clips this one to der Zünder above. The d is devoiced before the h, ˈtsʏnt-.'
      ru: 'Австрия, Швейцария и юг Германии; средний род, во множественном умлаут и -er. das Streichholz уровня B1 из колоды `haushalt-notfall-b1` — северное и общее слово, а построены оба на разных половинах одного действия: streichen называет чирканье, zünden — зажигание, а das Holz есть и там и там. Австрия усекает это слово до der Zünder выше. D перед h оглушается: ˈtsʏnt-.'
      uk: 'Австрія, Швейцарія і південь Німеччини; середній рід, у множині умлаут і -er. das Streichholz рівня B1 з колоди `haushalt-notfall-b1` — північне і загальне слово, а побудовані обидва на різних половинах однієї дії: streichen називає черкання, zünden — займання, а das Holz є і там і там. Австрія усікає це слово до der Zünder вище. D перед h оглушується: ˈtsʏnt-.'

  # --- Beim Coiffeur ---
  - de: Coiffeur
    ipa: "koaˈføːɐ̯"
    pos: noun
    gender: m
    plural: "die Coiffeure"
    cards: recognition
    en: the man whose trade is cutting and styling hair
    ru: мужчина, чьё ремесло — стричь и укладывать волосы
    uk: чоловік, чиє ремесло — стригти й укладати волосся
    example_de: Er geht alle sechs Wochen zum Coiffeur.
    example_en: He goes to the hairdresser every six weeks.
    example_ru: Он ходит в парикмахерскую каждые шесть недель.
    example_uk: Він ходить до перукарні кожні шість тижнів.
    note:
      en: 'Switzerland, straight from French; masculine, plural in -e. Germany and Austria say A2 der Friseur in the deck `berufe-a2`, which is a French loan too but a differently built one. The shop is der Coiffeursalon, and beim Coiffeur means at his shop, exactly like beim Fleischhauer above. The feminine is the next entry, and that is where the pair stops behaving like German.'
      ru: 'Швейцария, прямо из французского; мужской род, множественное на -e. Германия и Австрия говорят der Friseur уровня A2 из колоды `berufe-a2` — тоже французское заимствование, но устроенное иначе. Салон — der Coiffeursalon, а beim Coiffeur значит «у него в салоне», ровно как beim Fleischhauer выше. Женская пара — следующая запись, и там пара перестаёт вести себя по-немецки.'
      uk: 'Швейцарія, просто з французької; чоловічий рід, множина на -e. Німеччина й Австрія кажуть der Friseur рівня A2 з колоди `berufe-a2` — теж французьке запозичення, але влаштоване інакше. Салон — der Coiffeursalon, а beim Coiffeur означає «у нього в салоні», точно як beim Fleischhauer вище. Жіноча пара — наступний запис, і там пара перестає поводитися по-німецьки.'

  - de: Coiffeuse
    ipa: "koaˈføːzə"
    pos: noun
    gender: f
    plural: "die Coiffeusen"
    cards: recognition
    en: the woman whose trade is cutting and styling hair
    ru: женщина, чьё ремесло — стричь и укладывать волосы
    uk: жінка, чиє ремесло — стригти й укладати волосся
    example_de: Die Coiffeuse hat noch am Samstag einen Termin frei.
    example_en: The hairdresser still has an appointment free on Saturday.
    example_ru: У парикмахерши есть свободное время ещё в субботу.
    example_uk: У перукарки є вільний час іще в суботу.
    note:
      en: 'The feminine comes from French, not from German: -euse instead of -in, so it is die Coiffeuse and never Coiffeurin. Plural in -n, and the s between the vowels is voiced. A2 die Friseurin in the deck `berufe-a2` is built the ordinary German way, so the two pairs side by side show that Movierung with -in is the rule and not a law.'
      ru: 'Женская форма пришла из французского, а не из немецкого: -euse вместо -in, поэтому говорят die Coiffeuse и никогда Coiffeurin. Множественное на -n, а s между гласными звонкое. die Friseurin уровня A2 из колоды `berufe-a2` построена обычным немецким способом, так что две пары рядом показывают: мовирование на -in — правило, а не закон.'
      uk: 'Жіноча форма прийшла з французької, а не з німецької: -euse замість -in, тому кажуть die Coiffeuse і ніколи Coiffeurin. Множина на -n, а s між голосними дзвінке. die Friseurin рівня A2 з колоди `berufe-a2` побудована звичайним німецьким способом, тож дві пари поряд показують: моція на -in — правило, а не закон.'

  # --- Der Kalender ---
  - de: Fasnacht
    ipa: "ˈfasˌnaxt"
    pos: noun
    gender: f
    plural: "die Fasnachten"
    cards: recognition
    en: the days of costumes, masks and processions before the fasting season
    ru: дни костюмов, масок и шествий перед постом
    uk: дні костюмів, масок і походів перед постом
    example_de: An der Fasnacht ziehen die Masken durch die Stadt.
    example_en: At carnival time the masks parade through the town.
    example_ru: На карнавале маски идут по городу.
    example_uk: На карнавалі маски йдуть містом.
    note:
      en: 'Switzerland''s name for the season, and the Alemannic south-west of Germany writes it much the same way. Feminine, plural in -en. B1 der Fasching in the deck `gastronomie-feste-b1` is Bavaria''s and Austria''s word, and A2 der Karneval in the deck `zeit-termine-a2` the Rhineland''s and the national broadcast''s. Basel''s Fasnacht opens at four in the morning with the Morgestraich, when the lights of the city go out.'
      ru: 'Швейцарское название этой поры, и алеманнский юго-запад Германии пишет его почти так же. Женский род, множественное на -en. der Fasching уровня B1 из колоды `gastronomie-feste-b1` — слово Баварии и Австрии, а der Karneval уровня A2 из колоды `zeit-termine-a2` — слово Рейнской области и общенационального эфира. Базельский Fasnacht открывается в четыре утра ходом Morgestraich, когда в городе гасят свет.'
      uk: 'Швейцарська назва цієї пори, і алеманський південний захід Німеччини пише її майже так само. Жіночий рід, множина на -en. der Fasching рівня B1 з колоди `gastronomie-feste-b1` — слово Баварії та Австрії, а der Karneval рівня A2 з колоди `zeit-termine-a2` — слово Рейнської області та загальнонаціонального ефіру. Базельський Fasnacht відкривається о четвертій ранку ходою Morgestraich, коли в місті гасять світло.'

  - de: Jänner
    ipa: "ˈjɛnɐ"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: the first month of the year
    ru: первый месяц года
    uk: перший місяць року
    example_de: Die Prüfung findet am 15. Jänner statt.
    example_en: The examination takes place on 15 January.
    example_ru: Экзамен состоится 15 января.
    example_uk: Іспит відбудеться 15 січня.
    note:
      en: 'Austria''s name for the month, and it is not a colloquial one: a newspaper, a court decision and a school timetable all print Jänner where Germany and Switzerland print A1 der Januar in the deck `alltag-zeit`. Masculine, no plural, and the dates are formed the same way in both: im Jänner, am 3. Jänner. It is the form that stayed in Austria when the rest of the language went over to Januar.'
      ru: 'Австрийское название месяца, и оно не разговорное: газета, судебное решение и школьное расписание печатают Jänner там, где Германия и Швейцария печатают der Januar уровня A1 из колоды `alltag-zeit`. Мужской род, множественного нет, а даты образуются одинаково в обоих вариантах: im Jänner, am 3. Jänner. Это форма, оставшаяся в Австрии, когда остальной язык перешёл на Januar.'
      uk: 'Австрійська назва місяця, і вона не розмовна: газета, судове рішення і шкільний розклад друкують Jänner там, де Німеччина і Швейцарія друкують der Januar рівня A1 з колоди `alltag-zeit`. Чоловічий рід, множини немає, а дати утворюються однаково в обох варіантах: im Jänner, am 3. Jänner. Це форма, що лишилася в Австрії, коли решта мови перейшла на Januar.'

  - de: Feber
    ipa: "ˈfeːbɐ"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: the second month of the year
    ru: второй месяц года
    uk: другий місяць року
    example_de: Das Formular ist bis Ende Feber gültig.
    example_en: The form is valid until the end of February.
    example_ru: Бланк действителен до конца февраля.
    example_uk: Бланк чинний до кінця лютого.
    note:
      en: 'Austria again, but not in the way der Jänner above is: Feber is rare and official-sounding, kept alive on forms and in administrative language, while ordinary Austrian speech says Februar like everybody else. Masculine, no plural. Germany and Switzerland use A1 der Februar in the deck `zahlen-daten-geld`. So the two Austrian month names are not a matching pair, and treating them as one is the mistake to avoid.'
      ru: 'Снова Австрия, но не так, как der Jänner выше: Feber редок и отдаёт канцелярией, держится на бланках и в административном языке, тогда как обычная австрийская речь говорит Februar, как и все. Мужской род, множественного нет. Германия и Швейцария берут der Februar уровня A1 из колоды `zahlen-daten-geld`. Так что два австрийских названия месяцев — не симметричная пара, и считать их такой как раз и не надо.'
      uk: 'Знову Австрія, але не так, як der Jänner вище: Feber рідкісний і віддає канцелярією, тримається на бланках і в адміністративній мові, тоді як звичайне австрійське мовлення каже Februar, як і всі. Чоловічий рід, множини немає. Німеччина і Швейцарія беруть der Februar рівня A1 з колоди `zahlen-daten-geld`. Тож дві австрійські назви місяців — не симетрична пара, і вважати їх такою якраз і не варто.'
