      ru: 'Швейцария и юг Германии называют так консервную банку там, где остальной язык говорит die Dose уровня A1 из колоды `einkaufen-geschaefte`. Женский род, множественное на -n. Сложные слова общие везде — die Büchsenmilch и der Büchsenöffner, — а вне кухни слово сохраняет во всех вариантах два более старых значения: кружка для пожертвований, die Sammelbüchse, и охотничье ружьё.'
      uk: 'Швейцарія і південь Німеччини звуть так консервну бляшанку там, де решта мови каже die Dose рівня A1 з колоди `einkaufen-geschaefte`. Жіночий рід, множина на -n. Складні слова спільні всюди — die Büchsenmilch і der Büchsenöffner, — а поза кухнею слово зберігає в усіх варіантах два давніші значення: карнавка для пожертв, die Sammelbüchse, і мисливська рушниця.'

  # --- Wo man einkehrt, und wer bedient ---
  - de: Kaffeehaus
    ipa: "kaˈfeːˌhaʊ̯s"
    pos: noun
    gender: n
    plural: "die Kaffeehäuser"
    cards: recognition
    en: a large old-fashioned place where one sits for hours over a single cup and the newspapers
    ru: просторное старомодное заведение, где часами сидят над одной чашкой и газетами
    uk: просторий старомодний заклад, де годинами сидять над однією філіжанкою і газетами
    example_de: Im Kaffeehaus liest er jeden Morgen die Zeitung.
    example_en: He reads the paper in the coffee house every morning.
    example_ru: В кофейне он каждое утро читает газету.
    example_uk: У кав’ярні він щоранку читає газету.
    note:
      en: 'Austria, and Vienna above all. Neuter, umlaut in the plural, primary stress inside Kaffee- and a secondary one on -haus. Germany and Switzerland say A1 das Café in the deck `freizeit-koennen`, which is a smaller and more modern thing. The Viennese institution brings its own vocabulary with it: der Ober below takes the order, das Schlagobers above comes on the coffee, and a glass of water stands beside every cup.'
      ru: 'Австрия, и прежде всего Вена. Средний род, во множественном умлаут, главное ударение внутри Kaffee-, побочное на -haus. Германия и Швейцария говорят das Café уровня A1 из колоды `freizeit-koennen`, а это заведение поменьше и посовременнее. Венское учреждение приносит с собой собственный словарь: заказ принимает der Ober ниже, на кофе кладут das Schlagobers выше, а рядом с каждой чашкой стоит стакан воды.'
      uk: 'Австрія, і передусім Відень. Середній рід, у множині умлаут, головний наголос усередині Kaffee-, побічний на -haus. Німеччина і Швейцарія кажуть das Café рівня A1 з колоди `freizeit-koennen`, а це заклад менший і сучасніший. Віденська інституція приносить із собою власний словник: замовлення бере der Ober нижче, на каву кладуть das Schlagobers вище, а поряд із кожною філіжанкою стоїть склянка води.'

  - de: Ober
    ipa: "ˈoːbɐ"
    pos: noun
    gender: m
    plural: "die Ober"
    cards: recognition
    en: the man who takes the order and brings the food in a restaurant
    ru: мужчина, который принимает заказ и приносит еду в ресторане
    uk: чоловік, який приймає замовлення і приносить страви в ресторані
    example_de: Der Ober bringt die Speisekarte und ein Glas Wasser.
    example_en: The waiter brings the menu and a glass of water.
    example_ru: Официант приносит меню и стакан воды.
    example_uk: Офіціант приносить меню і склянку води.
    note:
      en: 'Short for der Oberkellner. Austria and the Viennese coffee house keep it as the ordinary word; in Germany it survives mainly in the call Herr Ober! and the everyday word is A2 der Kellner in the deck `berufe-a2`. Masculine, singular and plural spelled alike. It has no feminine in ordinary use: a woman is A2 die Kellnerin in the same deck, or, on a Swiss form, die Serviceangestellte two entries below.'
      ru: 'Сокращение от der Oberkellner. Австрия и венская кофейня держат его как обиходное слово; в Германии оно живёт главным образом в обращении Herr Ober!, а обиходное там — der Kellner уровня A2 из колоды `berufe-a2`. Мужской род, единственное и множественное пишутся одинаково. Женской пары в обычном употреблении нет: женщина — die Kellnerin уровня A2 из той же колоды или, в швейцарском бланке, die Serviceangestellte через две записи ниже.'
      uk: 'Скорочення від der Oberkellner. Австрія і віденська кав’ярня тримають його як побутове слово; у Німеччині воно живе головно у звертанні Herr Ober!, а побутове там — der Kellner рівня A2 з колоди `berufe-a2`. Чоловічий рід, однина і множина пишуться однаково. Жіночої пари у звичайному вжитку немає: жінка — die Kellnerin рівня A2 з тієї самої колоди або, у швейцарському бланку, die Serviceangestellte через два записи нижче.'

  - de: Serviceangestellter
    ipa: "ˈsœʁvɪsˌʔangəʃtɛltɐ"
    pos: noun
    gender: m
    plural: "die Serviceangestellten"
    # An adjectival noun (der Serviceangestellte / ein Serviceangestellter), which is why
    # the manifest prints the -r form. Recognition only, so no accept list is needed; the
    # note carries the declension, exactly as `Tote` does in recht-kriminalitaet-b1.
    cards: recognition
    en: a man employed to wait on tables, in the wording a job advertisement uses
    ru: мужчина, нанятый обслуживать столики, — в той формулировке, которой пользуется объявление о работе
    uk: чоловік, найнятий обслуговувати столики, — у тому формулюванні, яким послуговується оголошення про роботу
    example_de: Das Restaurant sucht einen Serviceangestellten für den Abend.
    example_en: The restaurant is looking for a member of waiting staff for the evenings.
    example_ru: Ресторан ищет официанта на вечерние смены.
    example_uk: Ресторан шукає офіціанта на вечірні зміни.
    note:
      en: 'An adjectival noun built on A2 der Angestellte in the deck `berufe-a2`, so the ending follows the article: der Serviceangestellte, ein Serviceangestellter, die Serviceangestellten. That is why the manifest prints the -r form. It belongs to the register of forms, contracts and job adverts rather than of speech, and it is at home in Switzerland; across a room the person is der Ober above in Austria and A2 der Kellner in the deck `berufe-a2` in Germany. The feminine is the next entry.'
      ru: 'Субстантивированное прилагательное на базе der Angestellte уровня A2 из колоды `berufe-a2`, поэтому окончание следует за артиклем: der Serviceangestellte, ein Serviceangestellter, die Serviceangestellten. Потому список и печатает форму на -r. Слово принадлежит регистру бланков, договоров и объявлений о работе, а не речи, и дома оно в Швейцарии; через зал человека зовут der Ober выше в Австрии и der Kellner уровня A2 из колоды `berufe-a2` в Германии. Женская пара — следующая запись.'
      uk: 'Субстантивований прикметник на базі der Angestellte рівня A2 з колоди `berufe-a2`, тому закінчення йде за артиклем: der Serviceangestellte, ein Serviceangestellter, die Serviceangestellten. Тому список і друкує форму на -r. Слово належить регістрові бланків, договорів і оголошень про роботу, а не мовлення, і вдома воно у Швейцарії; через залу людину звуть der Ober вище в Австрії і der Kellner рівня A2 з колоди `berufe-a2` в Німеччині. Жіноча пара — наступний запис.'

  - de: Serviceangestellte
    ipa: "ˈsœʁvɪsˌʔangəʃtɛltə"
    pos: noun
    gender: f
    plural: "die Serviceangestellten"
    cards: recognition
    en: a woman employed to wait on tables, in the same wording of a contract or an advert
    ru: женщина, нанятая обслуживать столики, — в той же формулировке договора или объявления
    uk: жінка, найнята обслуговувати столики, — у тому самому формулюванні договору або оголошення
    example_de: Die Serviceangestellte arbeitet seit einem Jahr in diesem Betrieb.
    example_en: The waitress has been working in this establishment for a year.
    example_ru: Официантка работает в этом заведении уже год.
    example_uk: Офіціантка працює в цьому закладі вже рік.
    note:
      en: 'The same adjectival noun in the feminine: die Serviceangestellte, eine Serviceangestellte, and the plural die Serviceangestellten covers a mixed team. Nothing is added to make it feminine, because the word is an adjective and not an -er noun — which is exactly where it stops behaving like A2 der Kellner and A2 die Kellnerin in the deck `berufe-a2`. The masculine is the entry above.'
      ru: 'То же субстантивированное прилагательное в женском роде: die Serviceangestellte, eine Serviceangestellte, а множественное die Serviceangestellten покрывает и смешанную бригаду. Ничего не прибавляют, чтобы получить женский род, потому что слово — прилагательное, а не существительное на -er; именно здесь оно и перестаёт вести себя как der Kellner и die Kellnerin уровня A2 из колоды `berufe-a2`. Мужская пара — запись выше.'
      uk: 'Той самий субстантивований прикметник у жіночому роді: die Serviceangestellte, eine Serviceangestellte, а множина die Serviceangestellten покриває і змішану бригаду. Нічого не додають, щоб дістати жіночий рід, бо слово — прикметник, а не іменник на -er; саме тут воно й перестає поводитися як der Kellner і die Kellnerin рівня A2 з колоди `berufe-a2`. Чоловіча пара — запис вище.'

