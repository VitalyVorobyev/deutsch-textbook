    example_de: Den Kuchen serviert man hier mit Schlagobers.
    example_en: The cake is served here with whipped cream.
    example_ru: Пирог здесь подают со взбитыми сливками.
    example_uk: Пиріг тут подають зі збитими вершками.
    note:
      en: 'Schlag- from schlagen plus the Obers above; neuter and without a plural. Germany says B1 die Schlagsahne in the deck `essen-lebensmittel-b1`, Switzerland der Schlagrahm below. A Viennese coffee house builds a drink on it: der Einspänner is a black coffee served under a cap of Schlagobers, and mit Schlagobers is what the menu adds to almost everything else. The k sound in the middle is the devoiced g of Schlag.'
      ru: 'Schlag- от schlagen плюс Obers выше; средний род и без множественного. Германия говорит die Schlagsahne уровня B1 из колоды `essen-lebensmittel-b1`, Швейцария — der Schlagrahm ниже. Венская кофейня строит на нём напиток: der Einspänner — это чёрный кофе под шапкой из Schlagobers, а mit Schlagobers меню добавляет почти ко всему остальному. Звук k в середине — это оглушённое g слова Schlag.'
      uk: 'Schlag- від schlagen плюс Obers вище; середній рід і без множини. Німеччина каже die Schlagsahne рівня B1 з колоди `essen-lebensmittel-b1`, Швейцарія — der Schlagrahm нижче. Віденська кав’ярня будує на ньому напій: der Einspänner — це чорна кава під шапкою зі Schlagobers, а mit Schlagobers меню додає майже до всього іншого. Звук k усередині — це оглушене g слова Schlag.'

