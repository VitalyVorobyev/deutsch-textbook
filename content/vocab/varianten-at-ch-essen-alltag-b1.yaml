      en: 'Austria. Neuter, no plural, and the -s belongs to the word rather than marking one — das Obers, mit dem Obers. Germany says B1 die Sahne in the deck `essen-lebensmittel-b1`, Switzerland der Rahm below. Beaten it becomes das Schlagobers, the next entry, and a Viennese menu abbreviates that to Schlag.'
      ru: 'Австрия. Средний род, множественного нет, а -s принадлежит самому слову, а не обозначает множественное: das Obers, mit dem Obers. Германия говорит die Sahne уровня B1 из колоды `essen-lebensmittel-b1`, Швейцария — der Rahm ниже. Взбитые, они становятся das Schlagobers, следующая запись, а венское меню сокращает это до Schlag.'
      uk: 'Австрія. Середній рід, множини немає, а -s належить самому слову, а не позначає множину: das Obers, mit dem Obers. Німеччина каже die Sahne рівня B1 з колоди `essen-lebensmittel-b1`, Швейцарія — der Rahm нижче. Збиті, вони стають das Schlagobers, наступний запис, а віденське меню скорочує це до Schlag.'

  - de: Schlagobers
    ipa: "ˈʃlaːkˌʔoːbɐs"
    pos: noun
    gender: n
    plural: "—"
