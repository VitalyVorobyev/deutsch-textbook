    note:
      en: 'Austria, and short for das Backrohr, the next entry. Neuter, plural in -e. Germany says B1 der Backofen in the deck `gastronomie-feste-b1`, and B1 der Ofen in the deck `wohnen-gebaeude-b1` is the older, wider word that also heats a room. Everywhere in German das Rohr is a pipe as well, das Wasserrohr, so only the kitchen decides which of the two senses a sentence is using.'
      ru: 'Австрия, сокращение от das Backrohr — следующая запись. Средний род, множественное на -e. Германия говорит der Backofen уровня B1 из колоды `gastronomie-feste-b1`, а der Ofen уровня B1 из колоды `wohnen-gebaeude-b1` — слово более старое и широкое, которым топят и комнату. Повсюду в немецком das Rohr — ещё и труба, das Wasserrohr, так что выбор между двумя значениями делает кухня.'
      uk: 'Австрія, скорочення від das Backrohr — наступний запис. Середній рід, множина на -e. Німеччина каже der Backofen рівня B1 з колоди `gastronomie-feste-b1`, а der Ofen рівня B1 з колоди `wohnen-gebaeude-b1` — слово давніше і ширше, яким топлять і кімнату. Усюди в німецькій das Rohr — ще й труба, das Wasserrohr, тож вибір між двома значеннями робить кухня.'

  - de: Backrohr
