    en: original, exactly as it came from the maker
    ru: подлинный, в первоначальном виде
    uk: оригінальний, у первісному вигляді
    example_de: Das Handy ist noch original verpackt, ich habe es nie benutzt.
    example_en: The phone is still in its original packaging, I have never used it.
    example_ru: Телефон ещё в заводской упаковке, я им ни разу не пользовался.
