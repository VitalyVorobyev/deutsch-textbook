# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the describing and
# judging adjectives of data/goethe-b1-wortliste.txt — the words that pass a verdict
# on quality, name a property or a kind of thing, and carry the formal register of
# notices, package inserts and instructions.
id: eigenschaften-bewertung-b1
title_de: "Eigenschaften und Bewertung"
title_en: "Adjectives for describing and judging"
title_ru: "Свойства и оценка"
title_uk: "Властивості й оцінка"
level: B1
entries:
  # --- Urteil: das Beste, das Schönste, das Unglaubliche ---
  - de: ausgezeichnet
    ipa: "ˈaʊ̯sgəˌtsaɪ̯çnət"
    pos: adj
    # Recognition only: A2 ships `toll`, `super`, `fantastisch` and `wunderbar` as
    # production cards, so "excellent" is a prompt four shipped cards already answer —
    # and they live in another deck, which no `accept` list here can reach.
    cards: recognition
    en: excellent, first-rate
    ru: отличный, превосходный
    uk: відмінний, чудовий
    example_de: Das Essen in diesem Restaurant war wirklich ausgezeichnet.
    example_en: The food in this restaurant was really excellent.
    example_ru: Еда в этом ресторане была действительно отличная.
    example_uk: Їжа в цьому ресторані була справді відмінна.
    note:
      en: 'The written top verdict. It is what a Zeugnis, a reference letter and a review say where speech says toll or super, and it grades an ability as well as a thing: Er spricht ausgezeichnet Deutsch. Formally it is the Partizip II of auszeichnen, to single out or to award, and die Auszeichnung is the award itself; that same verb also means to put a price on goods, as in Waren auszeichnen. It inflects like any adjective: eine ausgezeichnete Idee.'
      ru: 'Высшая оценка на письме. Это то, что стоит в аттестате, рекомендательном письме и рецензии там, где в речи скажут toll или super, и оно оценивает не только вещь, но и умение: Er spricht ausgezeichnet Deutsch. Формально это Partizip II глагола auszeichnen («отмечать, награждать»), а die Auszeichnung — сама награда; тот же глагол значит ещё «маркировать товар ценником». Склоняется как обычное прилагательное: eine ausgezeichnete Idee.'
      uk: 'Найвища оцінка на письмі. Це те, що стоїть в атестаті, рекомендаційному листі та рецензії там, де в мовленні скажуть toll або super, і воно оцінює не лише річ, а й уміння: Er spricht ausgezeichnet Deutsch. Формально це Partizip II дієслова auszeichnen («відзначати, нагороджувати»), а die Auszeichnung — сама нагорода; те саме дієслово означає ще «маркувати товар цінником». Відмінюється як звичайний прикметник: eine ausgezeichnete Idee.'

  - de: perfekt
    ipa: "pɛʁˈfɛkt"
    pos: adj
    en: perfect, flawless
    ru: безупречный, совершенный
    uk: бездоганний, досконалий
    example_de: Die Übersetzung ist noch nicht perfekt, aber schon sehr gut.
    example_en: The translation is not perfect yet, but it is already very good.
    example_ru: Перевод пока не безупречен, но уже очень хорош.
    example_uk: Переклад поки не бездоганний, але вже дуже добрий.
    note:
      en: 'This is the one word of the excellent group this deck asks you to type, and its claim is narrower than the others: nothing is left to correct. A2 toll, super, fantastisch and wunderbar report enthusiasm; ausgezeichnet awards a top mark; this one says there is no flaw. It inflects normally (eine perfekte Lösung, perfektes Deutsch) and works as an adverb of fit: Das passt perfekt. Capitalised, das Perfekt is the past tense the course drills — a different word, and not what this card teaches.'
      ru: 'Это единственное слово из ряда «отличный», которое колода просит набрать, и его утверждение уже прочих: исправлять нечего. toll, super, fantastisch и wunderbar уровня A2 передают восторг; ausgezeichnet ставит высшую отметку; это же слово говорит, что изъяна нет. Склоняется обычным образом (eine perfekte Lösung, perfektes Deutsch) и работает наречием подгонки: Das passt perfekt. С большой буквы das Perfekt — это прошедшее время, которое курс отрабатывает как грамматику, другое слово, и карточка не о нём.'
      uk: 'Це єдине слово з ряду «відмінний», яке колода просить набрати, і його твердження вужче за інші: виправляти нічого. toll, super, fantastisch і wunderbar рівня A2 передають захват; ausgezeichnet ставить найвищу оцінку; це ж слово каже, що вади немає. Відмінюється звичайно (eine perfekte Lösung, perfektes Deutsch) і працює прислівником припасування: Das passt perfekt. З великої літери das Perfekt — це минулий час, який курс відпрацьовує як граматику, інше слово, і картка не про нього.'

  - de: ideal
    ipa: "ideˈʔaːl"
    pos: adj
    # Recognition only: it is squeezed from both sides by production cards this very
    # deck ships — `perfekt` owns "flawless" and `geeignet` owns "suitable, right for
    # the job", and this word means exactly the overlap of the two.
    cards: recognition
    en: ideal, the best there could be for it
    ru: идеальный, оптимальный
    uk: ідеальний, оптимальний
    example_de: Für einen Anfänger ist dieser Kurs ideal.
    example_en: For a beginner this course is ideal.
    example_ru: Для начинающего этот курс идеален.
    example_uk: Для початківця цей курс ідеальний.
    note:
      en: 'It measures fit against a purpose and takes für + Akkusativ: ideal für Familien, ideale Bedingungen, die ideale Lösung. That is why it sits between two words this deck does ask you to produce — perfekt, which says nothing is wrong with the thing itself, and geeignet, which says it will do for the job. This one says it could not be better for that job. The noun das Ideal is a value someone lives by, and idealerweise opens a sentence with ideally.'
      ru: 'Меряет пригодность относительно цели и берёт für + Akkusativ: ideal für Familien, ideale Bedingungen, die ideale Lösung. Поэтому оно и зажато между двумя словами, набирать которые колода как раз просит: perfekt говорит, что в самой вещи нет изъяна, geeignet — что она для дела сгодится, а это слово — что лучше для этого дела не найти. Существительное das Ideal — идеал, ценность, которой держатся, а idealerweise открывает фразу словом «в идеале».'
      uk: 'Міряє придатність щодо мети й бере für + Akkusativ: ideal für Familien, ideale Bedingungen, die ideale Lösung. Тому воно й затиснуте між двома словами, набирати які колода якраз просить: perfekt каже, що в самій речі немає вади, geeignet — що вона для справи згодиться, а це слово — що краще для цієї справи не знайти. Іменник das Ideal — ідеал, цінність, якої тримаються, а idealerweise відкриває фразу словом «в ідеалі».'

  - de: klasse
    ipa: "ˈklasə"
    pos: adj
    # Recognition only: A2 ships `toll` and `super` as production cards for exactly
    # this praise, and the noun `Klasse` is carded too — a typed card here would grade
    # capitalisation and register rather than vocabulary.
    cards: recognition
    en: brilliant, first-class
    ru: классный, потрясающий
    uk: класний, чудовий
    example_de: Das war ein klasse Film, den solltest du dir ansehen.
    example_en: That was a brilliant film, you should watch it.
    example_ru: Это был классный фильм, тебе стоит его посмотреть.
    example_uk: Це був класний фільм, тобі варто його подивитися.
    note:
      en: 'It never takes an ending, in any position: ein klasse Film, eine klasse Idee, klasse Leute — and ❌ ein klasses Auto does not exist. prima and spitze behave the same way, while cool does inflect, so do not read one off the other. It belongs to speech only; a written exam takes ausgezeichnet or sehr gut. Capitalised, die Klasse is the school class the course already teaches, and it supplies the noun phrases große Klasse and erste Klasse.'
      ru: 'Окончаний не принимает никогда и ни в какой позиции: ein klasse Film, eine klasse Idee, klasse Leute, — а ❌ ein klasses Auto не существует. Так же ведут себя prima и spitze, тогда как cool склоняется, поэтому по одному о другом судить нельзя. Слово чисто разговорное; в письменной работе берут ausgezeichnet или sehr gut. С большой буквы die Klasse — школьный класс, который курс уже проходит, и от него же обороты große Klasse и erste Klasse.'
      uk: 'Закінчень не бере ніколи й у жодній позиції: ein klasse Film, eine klasse Idee, klasse Leute, — а ❌ ein klasses Auto не існує. Так само поводяться prima і spitze, тоді як cool відмінюється, тому за одним про інше судити не можна. Слово суто розмовне; у письмовій роботі беруть ausgezeichnet або sehr gut. З великої літери die Klasse — шкільний клас, який курс уже проходить, і від нього ж звороти große Klasse та erste Klasse.'

  - de: cool
    ipa: "ˈkuːl"
    pos: adj
    # Recognition only: A2 ships `kühl` glossed "cool" as a production card, so the
    # English prompt is answered letter for letter by a word about temperature — and
    # `toll` and `super` answer the praise sense from the other side.
    cards: recognition
    en: cool, laid-back
    ru: клёвый, крутой; невозмутимый
    uk: класний, крутий; незворушний
    example_de: Meine neuen Kollegen sind echt cool, ich fühle mich schon wohl.
    example_en: My new colleagues are really cool, I already feel at home.
    example_ru: Мои новые коллеги реально классные, мне уже хорошо на работе.
    example_uk: Мої нові колеги справді класні, мені вже добре на роботі.
    note:
      en: 'It does take endings, and that is the point worth checking: ein cooler Typ, coole Musik, ein cooles Auto — ❌ ein cool Auto is wrong precisely because the ending is missing. It grades too: cooler, am coolsten. That separates it from klasse on this list, which never inflects. Beside the praise it has a second, older sense of keeping calm under pressure: Bleib cool, Er blieb ganz cool. It never means cold — the temperature word is kühl.'
      ru: 'Окончания оно принимает, и как раз это стоит проверить: ein cooler Typ, coole Musik, ein cooles Auto, — а ❌ ein cool Auto неверно именно из-за отсутствия окончания. Оно и градуируется: cooler, am coolsten. Этим оно отличается от klasse в этой же колоде, которое не склоняется никогда. Кроме похвалы у него есть второе, более старое значение — сохранять хладнокровие: Bleib cool, Er blieb ganz cool. «Холодный» оно не значит: температурное слово — kühl.'
      uk: 'Закінчення воно бере, і саме це варто перевірити: ein cooler Typ, coole Musik, ein cooles Auto, — а ❌ ein cool Auto хибне саме через брак закінчення. Воно й градуюється: cooler, am coolsten. Цим воно різниться від klasse в цій самій колоді, яке не відмінюється ніколи. Крім похвали, у нього є друге, давніше значення — зберігати незворушність: Bleib cool, Er blieb ganz cool. «Холодний» воно не означає: температурне слово — kühl.'

  - de: wunderschön
    ipa: "ˈvʊndɐˌʃøːn"
    pos: adj
    # Recognition only: A1/A2 ship `schön` ("beautiful; nice") and `wunderbar`
    # ("wonderful, marvellous") as production cards, and this is the same axis one
    # step further up — a prompt for "beautiful" they already own.
    cards: recognition
    en: gorgeous, breathtakingly beautiful
    ru: восхитительный, дивной красоты
    uk: чарівний, надзвичайно гарний
    example_de: Vom Turm hat man einen wunderschönen Blick über die ganze Stadt.
    example_en: From the tower you have a gorgeous view over the whole town.
    example_ru: С башни открывается восхитительный вид на весь город.
    example_uk: З вежі відкривається чарівний краєвид на все місто.
    note:
      en: 'It is schön with the intensifying prefix wunder- welded on, one clear step above the base word and slightly warmer than sehr schön. The prefix is productive and always does the same job: wunderbar, wundervoll, wunderhübsch. Use it for what is seen or heard — a view, a dress, a face, a piece of music — never for someone''s character, where German says nett or sympathisch. It inflects normally and forms wunderschöner, am wunderschönsten.'
      ru: 'Это schön с приросшей усилительной приставкой wunder-, на ступень выше исходного слова и чуть теплее, чем sehr schön. Приставка продуктивна и всегда делает одно и то же: wunderbar, wundervoll, wunderhübsch. Слово годится для видимого и слышимого — вид, платье, лицо, музыка, — но не для характера человека: там немецкий берёт nett или sympathisch. Склоняется обычным образом, степени — wunderschöner, am wunderschönsten.'
      uk: 'Це schön із прирослим підсилювальним префіксом wunder-, на щабель вище за вихідне слово й трохи тепліше, ніж sehr schön. Префікс продуктивний і завжди робить те саме: wunderbar, wundervoll, wunderhübsch. Слово годиться для видимого й чутного — краєвид, сукня, обличчя, музика, — але не для вдачі людини: там німецька бере nett або sympathisch. Відмінюється звичайно, ступені — wunderschöner, am wunderschönsten.'

  - de: unglaublich
    ipa: "ˈʊnglaʊ̯plɪç"
    pos: adj
    en: incredible, hard to believe
    ru: невероятный, немыслимый
    uk: неймовірний, немислимий
    example_de: Es ist unglaublich, wie schnell das Jahr vergangen ist.
    example_en: It is incredible how fast the year has gone by.
    example_ru: Невероятно, как быстро пролетел год.
    example_uk: Неймовірно, як швидко минув рік.
    note:
      en: 'Built transparently from glauben: un- plus the verb stem plus -lich, so literally not believable. It swings both ways and only the tone decides which — admiration (eine unglaubliche Leistung) or outrage (Das ist ja unglaublich!). As an adverb it intensifies and is stronger and far more spoken than sehr: unglaublich teuer, unglaublich nett. unheimlich on this list does the same intensifying job. The frame Es ist unglaublich, wie / dass … is the one to keep.'
      ru: 'Построено прозрачно от glauben: un- плюс основа глагола плюс -lich, буквально «невероятный». Слово качается в обе стороны, и выбирает только интонация: восхищение (eine unglaubliche Leistung) или возмущение (Das ist ja unglaublich!). Как наречие оно усиливает и звучит сильнее и куда разговорнее, чем sehr: unglaublich teuer, unglaublich nett. unheimlich в этой же колоде выполняет ту же усилительную работу. Стоит запомнить рамку Es ist unglaublich, wie / dass …'
      uk: 'Побудоване прозоро від glauben: un- плюс основа дієслова плюс -lich, буквально «неймовірний». Слово хитається в обидва боки, і обирає лише інтонація: захват (eine unglaubliche Leistung) або обурення (Das ist ja unglaublich!). Як прислівник воно підсилює і звучить сильніше й куди розмовніше, ніж sehr: unglaublich teuer, unglaublich nett. unheimlich у цій самій колоді виконує ту саму підсилювальну роботу. Варто запам''ятати рамку Es ist unglaublich, wie / dass …'

  # --- Wert und Sinn: lohnt es sich, und wozu ---
  - de: wertvoll
    ipa: "ˈveːɐ̯tfɔl"
    pos: adj
    en: valuable, precious
    ru: ценный, драгоценный
    uk: цінний, коштовний
    example_de: Der Ring ist sehr wertvoll, er hat meiner Großmutter gehört.
    example_en: The ring is very valuable, it belonged to my grandmother.
    example_ru: Кольцо очень ценное, оно принадлежало моей бабушке.
    example_uk: Каблучка дуже цінна, вона належала моїй бабусі.
    note:
      en: 'der Wert, worth, plus -voll. It covers money and importance alike: wertvoller Schmuck, ein wertvoller Hinweis, wertvolle Zeit, wertvolle Erfahrungen. Its partner on this list is wertlos, its exact opposite, and the suffix is the only difference between them — so keep the two prompts apart in your head: this one says the thing is worth a great deal, that one says it is worth nothing. Do not confuse it with A2 preiswert, which says the price is low for what you get, not that the thing itself is valuable.'
      ru: 'der Wert («ценность») плюс -voll. Слово покрывает и деньги, и значимость: wertvoller Schmuck, ein wertvoller Hinweis, wertvolle Zeit, wertvolle Erfahrungen. Его пара в этой колоде — wertlos, точная противоположность, и различает их только суффикс, поэтому держите подсказки врозь: здесь вещь стоит очень много, там — не стоит ничего. Не путайте с preiswert уровня A2: то говорит, что цена низка за то, что получаешь, а не что сама вещь дорога.'
      uk: 'der Wert («вартість») плюс -voll. Слово покриває і гроші, і значущість: wertvoller Schmuck, ein wertvoller Hinweis, wertvolle Zeit, wertvolle Erfahrungen. Його пара в цій колоді — wertlos, точна протилежність, і різнить їх лише суфікс, тому тримайте підказки нарізно: тут річ варта дуже багато, там — не варта нічого. Не плутайте з preiswert рівня A2: те каже, що ціна низька за те, що дістаєш, а не що сама річ дорога.'

  - de: wertlos
    ipa: "ˈveːɐ̯tloːs"
    pos: adj
    en: worthless, of no value at all
    ru: не имеющий ценности, никчёмный
    uk: що не має цінності, нікчемний
    example_de: Ohne Unterschrift ist das Formular wertlos.
    example_en: Without a signature the form is worthless.
    example_ru: Без подписи бланк не имеет никакой ценности.
    example_uk: Без підпису бланк не має жодної цінності.
    note:
      en: 'der Wert plus -los, the exact opposite of wertvoll on this list and the productive German way of saying without: arbeitslos, kostenlos, sinnlos, hoffnungslos. Take care to keep the three near neighbours apart: this word says the thing has no worth, billig says the price is low, and nutzlos says it does not do its job. It is also used of an argument or a promise that carries no weight: ein wertloses Versprechen.'
      ru: 'der Wert плюс -los, точная противоположность wertvoll в этой колоде и продуктивный немецкий способ сказать «без»: arbeitslos, kostenlos, sinnlos, hoffnungslos. Держите врозь трёх соседей: это слово говорит, что вещь ничего не стоит, billig — что цена низкая, а nutzlos — что вещь не выполняет своей задачи. Так же говорят о доводе или обещании, которым грош цена: ein wertloses Versprechen.'
      uk: 'der Wert плюс -los, точна протилежність wertvoll у цій колоді та продуктивний німецький спосіб сказати «без»: arbeitslos, kostenlos, sinnlos, hoffnungslos. Тримайте нарізно трьох сусідів: це слово каже, що річ нічого не варта, billig — що ціна низька, а nutzlos — що річ не виконує свого завдання. Так само кажуть про довід чи обіцянку, якій гріш ціна: ein wertloses Versprechen.'

  - de: sinnvoll
    ipa: "ˈzɪnfɔl"
    pos: adj
    en: sensible, worth doing
    ru: целесообразный, имеющий смысл
    uk: доцільний, що має сенс
    example_de: Ich halte es für sinnvoll, den Termin auf nächste Woche zu verschieben.
    example_en: I consider it sensible to move the appointment to next week.
    example_ru: Я считаю разумным перенести встречу на следующую неделю.
    example_uk: Я вважаю розумним перенести зустріч на наступний тиждень.
    note:
      en: 'The opinion-text word of this deck, and the frames are what make it usable: Ich finde es sinnvoll, … zu …, Es wäre sinnvoll, wenn …, Das ist wenig sinnvoll. der Sinn plus -voll. It judges whether an action is worth the effort, which is a different claim from A2 nützlich, that a thing is of use, and from A2 praktisch, that it is handy in daily life. Its partner here is sinnlos, and the two prompts are deliberately far apart.'
      ru: 'Слово этой колоды для текста с мнением, и пригодным его делают рамки: Ich finde es sinnvoll, … zu …, Es wäre sinnvoll, wenn …, Das ist wenig sinnvoll. der Sinn плюс -voll. Оно судит, стоит ли действие затраченных усилий, — это иное утверждение, чем nützlich уровня A2 («приносит пользу») и praktisch («удобно в быту»). Его пара здесь — sinnlos, и подсказки у них нарочно разведены далеко.'
      uk: 'Слово цієї колоди для тексту з думкою, і придатним його роблять рамки: Ich finde es sinnvoll, … zu …, Es wäre sinnvoll, wenn …, Das ist wenig sinnvoll. der Sinn плюс -voll. Воно судить, чи варта дія витрачених зусиль, — це інше твердження, ніж nützlich рівня A2 («приносить користь») і praktisch («зручно в побуті»). Його пара тут — sinnlos, і підказки в них навмисне розведені далеко.'

  - de: sinnlos
    ipa: "ˈzɪnloːs"
    pos: adj
    en: pointless, a waste of effort
    ru: бессмысленный, напрасный
    uk: безглуздий, марний
    example_de: Es ist sinnlos, sich über das Wetter zu ärgern.
    example_en: It is pointless to get annoyed about the weather.
    example_ru: Бессмысленно злиться на погоду.
    example_uk: Безглуздо злитися на погоду.
    note:
      en: 'The exact opposite of sinnvoll on this list, same stem and the other suffix, and it takes the same frame: Es ist sinnlos, … zu … A second and much stronger sense belongs to reports and news, where it means without any reason whatsoever: sinnlose Gewalt, sinnlose Zerstörung. Compare vergeblich, also on this list: that says the effort was made and produced nothing, while this one says it was not worth making in the first place.'
      ru: 'Точная противоположность sinnvoll в этой колоде: та же основа, другой суффикс, и рамка та же — Es ist sinnlos, … zu … Второе, куда более сильное значение живёт в отчётах и новостях, где слово значит «лишённый всякого основания»: sinnlose Gewalt, sinnlose Zerstörung. Сравните с vergeblich из этой же колоды: то говорит, что усилие было приложено и ничего не дало, а это — что прилагать его не стоило вовсе.'
      uk: 'Точна протилежність sinnvoll у цій колоді: та сама основа, інший суфікс, і рамка та сама — Es ist sinnlos, … zu … Друге, куди сильніше значення живе у звітах і новинах, де слово означає «позбавлений будь-якої підстави»: sinnlose Gewalt, sinnlose Zerstörung. Порівняйте з vergeblich із цієї ж колоди: те каже, що зусилля докладено й воно нічого не дало, а це — що докладати його не варто було взагалі.'

  - de: vergeblich
    ipa: "fɛɐ̯ˈgeːplɪç"
    pos: adj
    # Recognition only: A2 ships `umsonst` as a production card and its second gloss is
    # "in vain" — the same prompt, in another deck, which no `accept` list can reach.
    cards: recognition
    en: in vain, without success
    ru: напрасный, тщетный
    uk: марний, даремний
    example_de: Ich habe vergeblich versucht, dich gestern Abend zu erreichen.
    example_en: I tried in vain to reach you yesterday evening.
    example_ru: Я напрасно пытался дозвониться до тебя вчера вечером.
    example_uk: Я марно намагався додзвонитися до тебе вчора ввечері.
    note:
      en: 'It insists that the effort was really made and produced nothing: vergeblich warten, vergeblich suchen, ein vergeblicher Versuch. A2 umsonst says exactly this in its second sense, which is why this card only asks to be recognised; its first sense, free of charge, this word never has, and that is the one place the two come apart. vergebens is an adverb-only variant of it, and vergeblich sein is the usual predicate. Do not read vergessen into it — the stem is vergeben, to forgive or to give away.'
      ru: 'Слово настаивает, что усилие действительно было приложено и ничего не дало: vergeblich warten, vergeblich suchen, ein vergeblicher Versuch. umsonst уровня A2 говорит ровно это во втором значении, поэтому карточка просит лишь узнавания; первого значения — «бесплатно» — у этого слова нет никогда, и только в этом они расходятся. vergebens — вариант того же слова, употребляемый лишь как наречие, а vergeblich sein — обычное сказуемое. Не вчитывайте сюда vergessen: основа — vergeben, «прощать, раздавать».'
      uk: 'Слово наполягає, що зусилля справді докладено й воно нічого не дало: vergeblich warten, vergeblich suchen, ein vergeblicher Versuch. umsonst рівня A2 каже рівно це у другому значенні, тому картка просить лише впізнавання; першого значення — «безкоштовно» — це слово не має ніколи, і тільки в цьому вони розходяться. vergebens — варіант того самого слова, що вживається лише як прислівник, а vergeblich sein — звичайний присудок. Не вчитуйте сюди vergessen: основа — vergeben, «пробачати, роздавати».'

  - de: geeignet
    ipa: "gəˈʔaɪ̯gnət"
    pos: adj
    en: suitable for a particular purpose
    ru: подходящий, пригодный
    uk: придатний, відповідний
    example_de: Dieses Wörterbuch ist für Anfänger gut geeignet.
    example_en: This dictionary is well suited to beginners.
    example_ru: Этот словарь хорошо подходит для начинающих.
    example_uk: Цей словник добре підходить для початківців.
    note:
      en: 'Two frames, and it almost never appears without one: für + Akkusativ names who or what it suits (geeignet für Kinder), zu + Dativ names the purpose (zum Kochen geeignet). It usually carries a degree word in front — gut geeignet, bestens geeignet, nicht geeignet. Formally the Partizip II of eignen, and the reflexive verb sich eignen für says the same with a subject: Das Buch eignet sich für Anfänger. A2 passen is about size and about a time that suits; this word is about purpose.'
      ru: 'Две рамки, и без одной из них слово почти не встречается: für + Akkusativ называет, кому или чему оно подходит (geeignet für Kinder), zu + Dativ — назначение (zum Kochen geeignet). Обычно перед ним стоит степень: gut geeignet, bestens geeignet, nicht geeignet. Формально это Partizip II глагола eignen, а возвратный sich eignen für говорит то же с подлежащим: Das Buch eignet sich für Anfänger. passen уровня A2 — о размере и об удобном времени, а это слово — о назначении.'
      uk: 'Дві рамки, і без однієї з них слово майже не трапляється: für + Akkusativ називає, кому чи чому воно пасує (geeignet für Kinder), zu + Dativ — призначення (zum Kochen geeignet). Зазвичай перед ним стоїть ступінь: gut geeignet, bestens geeignet, nicht geeignet. Формально це Partizip II дієслова eignen, а зворотне sich eignen für каже те саме з підметом: Das Buch eignet sich für Anfänger. passen рівня A2 — про розмір і про зручний час, а це слово — про призначення.'

  # --- Richtig, klar, abgeschlossen ---
  - de: korrekt
    ipa: "kɔˈʁɛkt"
    pos: adj
    # Recognition only: A2 ships `richtig` ("correct, right") as a production card, so
    # the prompt is already owned — and `falsch` sits opposite it in the same deck.
    cards: recognition
    en: correct; proper in form
    ru: правильный; безукоризненный
    uk: правильний; бездоганний
    example_de: Bitte prüfen Sie, ob Ihre Adresse korrekt geschrieben ist.
    example_en: Please check whether your address is spelled correctly.
    example_ru: Пожалуйста, проверьте, правильно ли записан ваш адрес.
    example_uk: Будь ласка, перевірте, чи правильно записано вашу адресу.
    note:
      en: 'A2 richtig covers the same ground in everyday German and is the word to say; this one belongs to forms, invoices and technical writing, where korrekte Angaben, eine korrekte Rechnung and korrekt ausfüllen are set phrases. It has a second sense about conduct rather than facts: someone korrekt plays by every rule, which is praise for an official and faint praise for a friend. The opposite is falsch, or inkorrekt in officialese; die Korrektur is the correction a teacher writes.'
      ru: 'richtig уровня A2 покрывает то же поле в обиходной речи, и говорить надо именно его; это же слово принадлежит бланкам, счетам и техническим текстам, где korrekte Angaben, eine korrekte Rechnung и korrekt ausfüllen — устойчивые сочетания. У него есть второе значение — не о фактах, а о поведении: korrekt значит «безукоризненно соблюдающий все правила», что для чиновника похвала, а для друга похвала сомнительная. Противоположность — falsch или канцелярское inkorrekt; die Korrektur — исправление, которое вносит учитель.'
      uk: 'richtig рівня A2 покриває те саме поле в побутовому мовленні, і казати треба саме його; це ж слово належить бланкам, рахункам і технічним текстам, де korrekte Angaben, eine korrekte Rechnung і korrekt ausfüllen — сталі сполучення. У нього є друге значення — не про факти, а про поведінку: korrekt означає «бездоганно дотримується всіх правил», що для урядовця похвала, а для друга похвала сумнівна. Протилежність — falsch або канцелярське inkorrekt; die Korrektur — виправлення, яке вносить учитель.'

  - de: eindeutig
    ipa: "ˈaɪ̯ndɔʏ̯tɪç"
    pos: adj
    # Recognition only: A2 ships `klar` ("clear, plain") and `deutlich` ("clear,
    # clearly, distinctly") as production cards, and any honest prompt for this word
    # is a prompt for "clear" that those two already answer.
    cards: recognition
    en: unambiguous, beyond all doubt
    ru: однозначный, недвусмысленный
    uk: однозначний, недвозначний
    example_de: Das Ergebnis der Abstimmung war eindeutig.
    example_en: The result of the vote was unambiguous.
    example_ru: Результат голосования был однозначным.
    example_uk: Результат голосування був однозначний.
    note:
      en: 'eins plus -deutig, from deuten, to read a sign, so it says a thing can be read one way and no other. That is a narrower claim than the two words a learner already has: klar means easy to understand and deutlich means easy to make out. As an adverb it hardens a judgement and is very common in an opinion text: Das ist eindeutig zu teuer, Er hat sich eindeutig geirrt. mehrdeutig and zweideutig are the opposites, and a zweideutige Bemerkung is a remark with a second, cheeky reading.'
      ru: 'eins плюс -deutig от deuten («толковать знак»), то есть слово говорит: прочесть это можно одним способом и никаким другим. Утверждение уже, чем у двух уже известных слов: klar значит «понятный», deutlich — «разборчивый». Как наречие оно ужесточает оценку и очень частотно в тексте с мнением: Das ist eindeutig zu teuer, Er hat sich eindeutig geirrt. Противоположности — mehrdeutig и zweideutig, причём eine zweideutige Bemerkung — замечание со вторым, скабрёзным прочтением.'
      uk: 'eins плюс -deutig від deuten («тлумачити знак»), тобто слово каже: прочитати це можна одним способом і жодним іншим. Твердження вужче, ніж у двох уже відомих слів: klar означає «зрозумілий», deutlich — «розбірливий». Як прислівник воно посилює оцінку й дуже частотне в тексті з думкою: Das ist eindeutig zu teuer, Er hat sich eindeutig geirrt. Протилежності — mehrdeutig і zweideutig, причому eine zweideutige Bemerkung — зауваження з другим, двозначним прочитанням.'

  - de: endgültig
    ipa: "ˈɛntgʏltɪç"
    pos: adj
    en: final, with no revision to come
    ru: окончательный, бесповоротный
    uk: остаточний, безповоротний
    example_de: Meine Entscheidung ist endgültig, ich ziehe nach Berlin.
    example_en: My decision is final, I am moving to Berlin.
    example_ru: Моё решение окончательное, я переезжаю в Берлин.
    example_uk: Моє рішення остаточне, я переїжджаю до Берліна.
    note:
      en: 'das Ende plus gültig, valid — valid all the way to the end, with no revision to come: eine endgültige Entscheidung, das endgültige Ergebnis, endgültig absagen, endgültig Schluss machen. Keep it clear of two words the learner already has: A2 endlich is the relief of at last, and schließlich only orders events in time. Neither of them claims anything is unchangeable, which is this word''s whole content. Its counterpart is vorläufig, provisional, and gültig on its own means valid, as a ticket or a passport is.'
      ru: 'das Ende плюс gültig («действительный») — действительный до самого конца, без пересмотра: eine endgültige Entscheidung, das endgültige Ergebnis, endgültig absagen, endgültig Schluss machen. Держите его врозь с двумя уже знакомыми словами: endlich уровня A2 — облегчение «наконец-то», а schließlich лишь выстраивает события во времени. Ни то ни другое не заявляет о неизменности, а в этом всё содержание нашего слова. Пара к нему — vorläufig («предварительный»), а само gültig значит «действительный», как билет или паспорт.'
      uk: 'das Ende плюс gültig («чинний») — чинний аж до кінця, без перегляду: eine endgültige Entscheidung, das endgültige Ergebnis, endgültig absagen, endgültig Schluss machen. Тримайте його нарізно з двома вже знайомими словами: endlich рівня A2 — полегшення «нарешті», а schließlich лише вибудовує події в часі. Ані те, ані інше не заявляє про незмінність, а в цьому весь зміст нашого слова. Пара до нього — vorläufig («попередній»), а саме gültig означає «чинний», як квиток або паспорт.'

  - de: komplett
    ipa: "kɔmˈplɛt"
    pos: adj
    # Recognition only: A2 ships `total` ("totally, completely") and `ganz`
    # ("completely, quite") as production cards, and `vollständig` is the neutral
    # written twin — three words already answer this prompt.
    cards: recognition
    en: complete, with nothing missing
    ru: полный, укомплектованный
    uk: повний, укомплектований
    example_de: Die Unterlagen sind jetzt komplett, ich kann den Antrag abschicken.
    example_en: The documents are complete now, I can send off the application.
    example_ru: Документы теперь собраны полностью, могу отправить заявление.
    example_uk: Документи тепер зібрані повністю, можу надіслати заяву.
    note:
      en: 'As an adjective it says a set has every part it should have: ein kompletter Satz, die komplette Ausstattung, komplett möbliert, Die Mannschaft ist komplett. vollständig is the neutral written twin for that sense and is what a form or a report prefers. As an adverb it is A2 total in a suit — komplett neu, komplett anders, komplett verrückt — and there ganz and völlig do the same work at other registers. The verb komplettieren, to complete a set, is rare and technical.'
      ru: 'Как прилагательное говорит, что в наборе есть все положенные части: ein kompletter Satz, die komplette Ausstattung, komplett möbliert, Die Mannschaft ist komplett. vollständig — нейтральный письменный двойник в этом значении, и именно его предпочтут бланк и отчёт. Как наречие это total уровня A2 в костюме — komplett neu, komplett anders, komplett verrückt, — а ту же работу в других регистрах делают ganz и völlig. Глагол komplettieren («доукомплектовать») редок и техничен.'
      uk: 'Як прикметник каже, що в наборі є всі належні частини: ein kompletter Satz, die komplette Ausstattung, komplett möbliert, Die Mannschaft ist komplett. vollständig — нейтральний писемний двійник у цьому значенні, і саме його віддадуть перевагу бланк і звіт. Як прислівник це total рівня A2 в костюмі — komplett neu, komplett anders, komplett verrückt, — а ту саму роботу в інших регістрах роблять ganz і völlig. Дієслово komplettieren («доукомплектувати») рідкісне й технічне.'

  - de: fertig
    ipa: "ˈfɛʁtɪç"
    pos: adj
    # Recognition only: A2 ships the phrase `fertig sein` as a production card, glossed
    # "to be ready, to be finished" — this word IS that answer, and the two cards live
    # in different decks, so no `accept` list can separate them.
    cards: recognition
    en: finished, done with something
    ru: готовый, закончивший
    uk: готовий, що завершив
    example_de: Ich bin mit dem Bericht fertig und schicke ihn dir gleich.
    example_en: I am finished with the report and will send it to you right away.
    example_ru: Я закончил отчёт и сейчас же тебе его пришлю.
    example_uk: Я завершив звіт і зараз же тобі його надішлю.
    note:
      en: 'A2 already teaches the bare predicate fertig sein. What B1 adds is the frame and the chunks: mit + Dativ names what is finished (Ich bin mit der Arbeit fertig), fertig werden mit means to get something done or to come to terms with it, and fertig machen means to finish a thing off — or, said of a person, to wear them out (Die Schicht macht mich fertig). It also means ready to go: Bist du fertig? A ready meal is ein Fertiggericht, and fix und fertig is the fixed phrase for exhausted.'
      ru: 'На уровне A2 уже дано голое сказуемое fertig sein. B1 добавляет рамку и обороты: mit + Dativ называет, с чем покончено (Ich bin mit der Arbeit fertig), fertig werden mit значит «справиться с чем-то» или «смириться», а fertig machen — «доделать» или, о человеке, «вымотать» (Die Schicht macht mich fertig). Слово значит и «готов выходить»: Bist du fertig? Готовое блюдо — ein Fertiggericht, а fix und fertig — устойчивое «вымотан вконец».'
      uk: 'На рівні A2 вже дано голий присудок fertig sein. B1 додає рамку й звороти: mit + Dativ називає, з чим покінчено (Ich bin mit der Arbeit fertig), fertig werden mit означає «упоратися з чимось» або «змиритися», а fertig machen — «доробити» або, про людину, «вимотати» (Die Schicht macht mich fertig). Слово означає й «готовий виходити»: Bist du fertig? Готова страва — ein Fertiggericht, а fix und fertig — стале «вимотаний ущент».'

  # --- Beschaffenheit: woraus, wie fest, wie viel ---
  - de: künstlich
    ipa: "ˈkʏnstlɪç"
    pos: adj
    en: artificial, made by people and not by nature
    ru: искусственный
    uk: штучний
    example_de: In dieser Limonade sind keine künstlichen Farbstoffe.
    example_en: There are no artificial colourings in this lemonade.
    example_ru: В этом лимонаде нет искусственных красителей.
    example_uk: У цьому лимонаді немає штучних барвників.
    note:
      en: 'die Kunst is inside it, in its older sense of skill rather than of art, so the word means made by human skill and not by nature: künstliches Licht, künstliche Intelligenz, ein künstliches Gelenk, künstlich hergestellt. Its opposite here is natürlich in the meaning natural — and note that A2 teaches that same word as of course, so only context tells the two readings apart. For plastic as a material German says der Kunststoff; for a fake pretending to be real it says falsch or unecht, not this word.'
      ru: 'Внутри него die Kunst в старом значении «умение», а не «искусство», поэтому слово значит «сделанный человеческим умением, а не выросший»: künstliches Licht, künstliche Intelligenz, ein künstliches Gelenk, künstlich hergestellt. Противоположность здесь — natürlich в значении «природный»; заметьте, что то же слово A2 даёт как «конечно», и различает эти чтения только контекст. Пластик как материал по-немецки der Kunststoff, а подделку, выдающую себя за подлинник, называют falsch или unecht, но не этим словом.'
      uk: 'Усередині нього die Kunst у давньому значенні «уміння», а не «мистецтво», тому слово означає «зроблений людським умінням, а не вирослий»: künstliches Licht, künstliche Intelligenz, ein künstliches Gelenk, künstlich hergestellt. Протилежність тут — natürlich у значенні «природний»; зауважте, що те саме слово A2 подає як «звісно», і розрізняє ці прочитання лише контекст. Пластик як матеріал німецькою der Kunststoff, а підробку, що видає себе за оригінал, звуть falsch або unecht, але не цим словом.'

  - de: original
    ipa: "oʁigiˈnaːl"
    pos: adj
    # Recognition only: A2 ships `echt` as a production card, glossed "really; genuine",
