    ru: единый, единообразный
    uk: єдиний, однаковий для всіх
    example_de: In allen Filialen gelten einheitliche Preise.
    example_en: Uniform prices apply in all branches.
    example_ru: Во всех филиалах действуют единые цены.
    example_uk: В усіх філіях діють єдині ціни.
    note:
      en: 'die Einheit, unit or unity, plus -lich. It says a whole set is handled one and the same way, with no local exceptions: einheitliche Regeln, ein einheitliches Formular, einheitlich gekleidet, eine einheitliche Lösung. That is the difference from gleich, which only says two things match: this word makes the claim about a whole system, which is why it lives in company rules, school regulations and administration. Its opposite on this list is unterschiedlich.'
      ru: 'die Einheit («единица, единство») плюс -lich. Слово говорит, что целый ряд случаев решается одинаково, без местных исключений: einheitliche Regeln, ein einheitliches Formular, einheitlich gekleidet, eine einheitliche Lösung. Этим оно отличается от gleich, которое лишь констатирует совпадение двух вещей: наше слово высказывается обо всей системе, потому и живёт во внутренних правилах фирм, школьных уставах и администрации. Противоположность в этой колоде — unterschiedlich.'
      uk: 'die Einheit («одиниця, єдність») плюс -lich. Слово каже, що ціла низка випадків розв''язується однаково, без місцевих винятків: einheitliche Regeln, ein einheitliches Formular, einheitlich gekleidet, eine einheitliche Lösung. Цим воно різниться від gleich, яке лише констатує збіг двох речей: наше слово висловлюється про всю систему, тому й живе у внутрішніх правилах фірм, шкільних статутах і адміністрації. Протилежність у цій колоді — unterschiedlich.'

  - de: begrenzt
