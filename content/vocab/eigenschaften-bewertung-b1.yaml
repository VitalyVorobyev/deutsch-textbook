  # --- Wie gewöhnlich, wie ähnlich, wie anders ---
  - de: üblich
    ipa: "ˈyːplɪç"
    pos: adj
    # Recognition only: A2 ships `normal`, `normalerweise` and `meistens` as production
    # cards, and `gewöhnlich` on graduierung-mengenwoerter-b1 is recognition-only for
    # exactly this reason — the two rulings have to agree, and they do.
    cards: recognition
    en: customary, what people here normally do
    ru: обычный, принятый
    uk: звичний, узвичаєний
    example_de: In Deutschland ist es üblich, im Restaurant Trinkgeld zu geben.
    example_en: In Germany it is customary to leave a tip in a restaurant.
    example_ru: В Германии принято оставлять чаевые в ресторане.
    example_uk: У Німеччині заведено залишати чайові в ресторані.
    note:
      en: 'It is about custom, not about frequency: it says this is how it is done here. The frame is Es ist üblich, … zu …, and wie üblich is the fixed phrase for as usual. Its nearest neighbour, gewöhnlich, is recognition-only on the sibling B1 deck for the same reason this one is — A2 already sells normalerweise and meistens as the words to type — and the two differ in what they report: gewöhnlich names the habitual case, this word names the accepted convention. unüblich is the opposite, and an office letter asks for die üblichen Unterlagen.'
      ru: 'Слово об обычае, а не о частоте: оно сообщает, что так здесь принято. Рамка — Es ist üblich, … zu …, а wie üblich — устойчивое «как обычно». Ближайший сосед, gewöhnlich, в соседней колоде B1 тоже только на узнавание, и по той же причине: набирать надо normalerweise и meistens уровня A2. Разводит их то, о чём они сообщают: gewöhnlich называет привычный ход дел, а это слово — принятую условность. Противоположность — unüblich, а деловое письмо просит die üblichen Unterlagen.'
      uk: 'Слово про звичай, а не про частоту: воно повідомляє, що так тут заведено. Рамка — Es ist üblich, … zu …, а wie üblich — стале «як завжди». Найближчий сусід, gewöhnlich, у сусідній колоді B1 теж лише на впізнавання, і з тієї самої причини: набирати треба normalerweise та meistens рівня A2. Розводить їх те, про що вони повідомляють: gewöhnlich називає звичний перебіг справ, а це слово — усталену умовність. Протилежність — unüblich, а ділового листа просить die üblichen Unterlagen.'

  - de: alltäglich
    ipa: "ˈaltɛːklɪç"
    pos: adj
    # Recognition only: A2 ships `täglich` ("daily; a day") and the noun `Alltag`
    # ("everyday life") as production cards, so both halves of this word are already
    # answered by a shipped prompt.
    cards: recognition
    en: everyday, run-of-the-mill
    ru: повседневный, будничный
    uk: повсякденний, буденний
    example_de: Streit über den Müll gehört bei uns zu den alltäglichen Problemen.
    example_en: Arguments about the rubbish are one of the everyday problems where we live.
    example_ru: Споры из-за мусора у нас относятся к повседневным проблемам.
    example_uk: Суперечки через сміття в нас належать до повсякденних проблем.
    note:
      en: 'der Alltag, which A2 teaches as everyday life, plus -lich. Two readings shade into each other: what happens every day (alltägliche Aufgaben, alltägliche Sorgen) and what is unremarkable because of that (eine ganz alltägliche Geschichte). Careful with the stress, which used to separate them: ALLtäglich means ordinary, allTÄGlich means occurring daily, and few speakers still keep the distinction. A2 täglich only says once a day and carries no judgement at all.'
      ru: 'der Alltag, который A2 даёт как «будни», плюс -lich. Два чтения переходят одно в другое: то, что случается каждый день (alltägliche Aufgaben, alltägliche Sorgen), и то, что от этого стало ничем не примечательным (eine ganz alltägliche Geschichte). Осторожно с ударением, которое их когда-то разводило: ALLtäglich — «заурядный», allTÄGlich — «ежедневный», и мало кто из говорящих ещё держит это различие. täglich уровня A2 сообщает лишь «раз в день» и никакой оценки не несёт.'
      uk: 'der Alltag, який A2 подає як «будні», плюс -lich. Два прочитання переходять одне в одне: те, що трапляється щодня (alltägliche Aufgaben, alltägliche Sorgen), і те, що від цього стало нічим не прикметним (eine ganz alltägliche Geschichte). Обережно з наголосом, який їх колись розводив: ALLtäglich — «пересічний», allTÄGlich — «щоденний», і мало хто з мовців ще тримає цю різницю. täglich рівня A2 повідомляє лише «раз на день» і жодної оцінки не несе.'

  - de: ungewöhnlich
    ipa: "ˈʊngəvøːnlɪç"
    pos: adj
    en: unusual, a departure from the usual case
    ru: необычный, непривычный
    uk: незвичний, незвичайний
    example_de: Für März ist es dieses Jahr ungewöhnlich warm.
    example_en: For March it is unusually warm this year.
    example_ru: Для марта в этом году необычно тепло.
    example_uk: Як на березень, цього року незвично тепло.
    note:
      en: 'un- plus gewöhnlich, and the prefix strips away the dismissive tone the base word carries about people. It reports a departure from the normal case and stops there; komisch and seltsam add the judgement strange on top, which this word does not make. As an adverb it intensifies by way of surprise and is very useful in a written report: ungewöhnlich warm, ungewöhnlich viele Besucher, ungewöhnlich früh. Its neighbours here, üblich and alltäglich, describe exactly the normal case it departs from.'
      ru: 'un- плюс gewöhnlich, и приставка снимает пренебрежительный оттенок, который есть у исходного слова применительно к людям. Оно лишь сообщает об отклонении от обычного и на этом останавливается; komisch и seltsam добавляют сверху оценку «странный», которой здесь нет. Как наречие оно усиливает через удивление и очень полезно в письменном отчёте: ungewöhnlich warm, ungewöhnlich viele Besucher, ungewöhnlich früh. Его соседи в этой колоде, üblich и alltäglich, описывают как раз ту норму, от которой оно отклоняется.'
      uk: 'un- плюс gewöhnlich, і префікс знімає зневажливий відтінок, який має вихідне слово щодо людей. Воно лише повідомляє про відхилення від звичайного і на цьому спиняється; komisch і seltsam додають згори оцінку «дивний», якої тут немає. Як прислівник воно підсилює через подив і дуже корисне в писемному звіті: ungewöhnlich warm, ungewöhnlich viele Besucher, ungewöhnlich früh. Його сусіди в цій колоді, üblich та alltäglich, описують саме ту норму, від якої воно відхиляється.'

  - de: unheimlich
    ipa: "ˈʊnhaɪ̯mlɪç"
    pos: adj
    # Recognition only: two unrelated senses one example cannot carry, and the second
    # of them is a plain intensifier that would compete with `sehr` on any typed prompt.
    cards: recognition
    en: eerie, giving you an uneasy feeling
    ru: жуткий, зловещий
    uk: моторошний, лиховісний
    example_de: Nachts ist es in dem alten Haus richtig unheimlich.
    example_en: At night that old house is really eerie.
    example_ru: Ночью в этом старом доме по-настоящему жутко.
    example_uk: Уночі в тому старому будинку по-справжньому моторошно.
    note:
      en: 'This card teaches the unease: das Heim, home, with un- in front, so literally not-homely — eine unheimliche Stille, ein unheimliches Geräusch, Mir ist das Ganze unheimlich. Not what this card teaches, though it is the same word and by far the commoner use in speech: a plain intensifier with no fear in it at all — unheimlich nett, unheimlich viel Arbeit, Ich habe mich unheimlich gefreut. There it simply replaces sehr, and only tone and context separate the two. gruselig says the first sense and nothing else.'
      ru: 'Карточка учит тревожному значению: das Heim («дом, кров») с приставкой un-, то есть буквально «недомашний» — eine unheimliche Stille, ein unheimliches Geräusch, Mir ist das Ganze unheimlich. Карточка не о другом, хотя слово то же и в речи оно куда употребительнее: это простой усилитель, в котором нет ни капли страха, — unheimlich nett, unheimlich viel Arbeit, Ich habe mich unheimlich gefreut. Там оно просто заменяет sehr, и разводят их лишь интонация и контекст. gruselig выражает первое значение и только его.'
      uk: 'Картка вчить тривожного значення: das Heim («дім, оселя») з префіксом un-, тобто буквально «недомашній» — eine unheimliche Stille, ein unheimliches Geräusch, Mir ist das Ganze unheimlich. Картка не про інше, хоча слово те саме й у мовленні воно куди вживаніше: це простий підсилювач, у якому немає ані краплі страху, — unheimlich nett, unheimlich viel Arbeit, Ich habe mich unheimlich gefreut. Там воно просто заміняє sehr, і розводять їх лише інтонація та контекст. gruselig виражає перше значення й тільки його.'

  - de: ähnlich
    ipa: "ˈɛːnlɪç"
    pos: adj
    en: similar, alike
    ru: похожий, схожий
    uk: схожий, подібний
    example_de: Meine Schwester sieht unserer Mutter sehr ähnlich.
    example_en: My sister looks very much like our mother.
    example_ru: Моя сестра очень похожа на нашу маму.
    example_uk: Моя сестра дуже схожа на нашу маму.
    note:
      en: 'It governs the Dativ, and there is no preposition at all: the person or thing compared simply stands in the Dativ — Er sieht seinem Vater ähnlich, Das Kleid ist meinem sehr ähnlich, Die beiden Fälle sind sich ähnlich. English similar to invites a preposition here and German offers none, so the case is doing all the work. Two frames carry most of its use: jemandem ähnlich sehen, to look like someone, and ähnlich wie, which compares manner or action (Ich mache das ähnlich wie du). gleich claims the two are identical; this word claims only resemblance, and unterschiedlich on this list is its opposite. The noun is die Ähnlichkeit.'
      ru: 'Слово управляет дательным падежом, и никакого предлога при нём нет: тот, с кем сравнивают, просто стоит в Dativ — Er sieht seinem Vater ähnlich, Das Kleid ist meinem sehr ähnlich, Die beiden Fälle sind sich ähnlich. Русское «похож на кого-то» тянет за собой предлог, а немецкий здесь не даёт ни одного: всю работу делает падеж. Две рамки несут почти всё употребление: jemandem ähnlich sehen («быть похожим на кого-то внешне») и ähnlich wie, сравнивающее образ действия (Ich mache das ähnlich wie du). gleich заявляет тождество, а это слово — лишь сходство; противоположность в этой колоде — unterschiedlich. Существительное — die Ähnlichkeit.'
      uk: 'Слово керує давальним відмінком, і жодного прийменника при ньому немає: той, з ким порівнюють, просто стоїть у Dativ — Er sieht seinem Vater ähnlich, Das Kleid ist meinem sehr ähnlich, Die beiden Fälle sind sich ähnlich. Українське «схожий на когось» тягне за собою прийменник, а німецька тут не дає жодного: усю роботу робить відмінок. Дві рамки несуть майже все вживання: jemandem ähnlich sehen («бути схожим на когось зовні») та ähnlich wie, що порівнює спосіб дії (Ich mache das ähnlich wie du). gleich заявляє тотожність, а це слово — лише подібність; протилежність у цій колоді — unterschiedlich. Іменник — die Ähnlichkeit.'

  - de: unterschiedlich
    ipa: "ˈʊntɐʃiːtlɪç"
    pos: adj
    # Recognition only: A2 ships `verschieden` ("different, various") as a production
    # card, and the two words fill the same slot — a collision no `accept` list can
    # repair, because the cards live in different decks.
    cards: recognition
    en: differing, not all the same
    ru: различный, неодинаковый
    uk: різний, неоднаковий
    example_de: Die Preise sind je nach Jahreszeit sehr unterschiedlich.
    example_en: The prices differ a lot depending on the season.
    example_ru: Цены сильно различаются в зависимости от времени года.
    example_uk: Ціни дуже різняться залежно від пори року.
    note:
      en: 'A2 verschieden is the card to type for different, so what is worth holding on to here is the shade between them. verschieden counts the members of a set and stresses that there are several kinds of them: verschiedene Länder, verschiedene Meinungen. This word compares them and stresses that they are not equal: unterschiedlich teuer, unterschiedlich groß, Das ist von Person zu Person unterschiedlich. Behind it is der Unterschied, which A2 teaches, and sich unterscheiden von is the verb. einheitlich on this list is the opposite.'
      ru: 'Набирать для «разный» надо verschieden уровня A2, поэтому здесь стоит удержать оттенок между ними. verschieden пересчитывает члены множества и подчёркивает, что их несколько видов: verschiedene Länder, verschiedene Meinungen. Наше слово их сравнивает и подчёркивает, что они не равны: unterschiedlich teuer, unterschiedlich groß, Das ist von Person zu Person unterschiedlich. За ним стоит der Unterschied, который A2 даёт, а глагол — sich unterscheiden von. Противоположность в этой колоде — einheitlich.'
      uk: 'Набирати для «різний» треба verschieden рівня A2, тому тут варто втримати відтінок між ними. verschieden перелічує члени множини й підкреслює, що їх кілька видів: verschiedene Länder, verschiedene Meinungen. Наше слово їх порівнює й підкреслює, що вони не рівні: unterschiedlich teuer, unterschiedlich groß, Das ist von Person zu Person unterschiedlich. За ним стоїть der Unterschied, який A2 подає, а дієслово — sich unterscheiden von. Протилежність у цій колоді — einheitlich.'

  - de: allgemein
    ipa: "algəˈmaɪ̯n"
    pos: adj
    # Recognition only: it is the vocabulary of forms, contracts and course
    # descriptions, read far more often than produced at B1.
    cards: recognition
    en: general, applying to everyone
    ru: общий, всеобщий
    uk: загальний, спільний для всіх
    example_de: Im Kurs sprechen wir zuerst über allgemeine Fragen und dann über Details.
    example_en: In the course we first talk about general questions and then about details.
    example_ru: На курсе мы сначала обсуждаем общие вопросы, а потом детали.
    example_uk: На курсі ми спершу обговорюємо загальні питання, а потім деталі.
    note:
      en: 'It says a statement covers everyone or every case rather than one: allgemeine Informationen, die allgemeine Meinung, allgemein bekannt, das Allgemeinwissen. The one part worth learning as a chunk is im Allgemeinen, capital A and all, which opens a generalisation in an opinion text and is exactly what a B1 Meinung äußern task rewards. The Allgemeine Geschäftsbedingungen, abbreviated AGB, are the small print behind any contract, and der Allgemeinarzt is a GP.'
      ru: 'Слово сообщает, что высказывание касается всех или всякого случая, а не одного: allgemeine Informationen, die allgemeine Meinung, allgemein bekannt, das Allgemeinwissen. Как готовый оборот стоит выучить im Allgemeinen, с большой буквы, — он открывает обобщение в тексте с мнением и есть ровно то, что вознаграждает задание Meinung äußern уровня B1. Die Allgemeinen Geschäftsbedingungen, сокращённо AGB, — это мелкий шрифт за любым договором, а der Allgemeinarzt — терапевт.'
      uk: 'Слово повідомляє, що вислів стосується всіх або всякого випадку, а не одного: allgemeine Informationen, die allgemeine Meinung, allgemein bekannt, das Allgemeinwissen. Як готовий зворот варто вивчити im Allgemeinen, з великої літери, — він відкриває узагальнення в тексті з думкою і є саме тим, що винагороджує завдання Meinung äußern рівня B1. Die Allgemeinen Geschäftsbedingungen, скорочено AGB, — це дрібний шрифт за будь-яким договором, а der Allgemeinarzt — сімейний лікар.'

  - de: alternativ
    ipa: "altɐnaˈtiːf"
    pos: adj
    # Recognition only: instruction, service-email and product-description vocabulary,
    # read and not produced at B1.
    cards: recognition
    en: alternative, offered as another way of doing it
    ru: альтернативный; в качестве другого варианта
    uk: альтернативний; як інший варіант
    example_de: Alternativ können Sie das Formular auch online ausfüllen.
    example_en: As an alternative, you can also fill in the form online.
    example_ru: В качестве другого варианта вы можете заполнить бланк онлайн.
    example_uk: Як інший варіант, ви можете заповнити бланк онлайн.
    note:
      en: 'Two lives, and a learner meets them in different places. As a sentence adverb in position 1 it offers a second route to the same end, which is the language of instructions and service emails: Alternativ erreichen Sie uns per E-Mail. As an adjective in front of a noun it means outside the mainstream: alternative Medizin, alternative Energien, eine alternative Lebensweise. The noun die Alternative is the countable option and is stressed on the third syllable: Es gibt keine Alternative dazu.'
      ru: 'Две жизни, и встречаются они в разных местах. Как наречие на первом месте в предложении слово предлагает второй путь к той же цели — это язык инструкций и писем службы поддержки: Alternativ erreichen Sie uns per E-Mail. Как прилагательное перед существительным оно значит «не мейнстримный»: alternative Medizin, alternative Energien, eine alternative Lebensweise. Существительное die Alternative — исчисляемый вариант, ударение на третьем слоге: Es gibt keine Alternative dazu.'
      uk: 'Два життя, і трапляються вони в різних місцях. Як прислівник на першому місці в реченні слово пропонує другий шлях до тієї самої мети — це мова інструкцій і листів служби підтримки: Alternativ erreichen Sie uns per E-Mail. Як прикметник перед іменником воно означає «не мейнстримний»: alternative Medizin, alternative Energien, eine alternative Lebensweise. Іменник die Alternative — злічуваний варіант, наголос на третьому складі: Es gibt keine Alternative dazu.'

  - de: kompliziert
    ipa: "kɔmpliˈtsiːɐ̯t"
    pos: adj
    en: complicated, tangled
    ru: запутанный, сложно устроенный
    uk: заплутаний, складно влаштований
    example_de: Das Formular ist so kompliziert, dass ich ohne Hilfe nicht weiterkomme.
    example_en: The form is so complicated that I cannot get any further without help.
    example_ru: Бланк такой запутанный, что без помощи я не справлюсь.
    example_uk: Бланк такий заплутаний, що без допомоги я не впораюсь.
    note:
      en: 'It says a thing has many parts that hang together, so it is hard to see through — not that it demands effort. That is the line against A2 schwierig and schwer: eine schwierige Prüfung is demanding, ein kompliziertes Formular is tangled, and a thing can easily be one without the other. It is used of people as well (ein komplizierter Mensch is hard to deal with) and in medicine (ein komplizierter Bruch). einfach is the everyday opposite, and unkompliziert praises someone as easy-going.'
      ru: 'Слово говорит, что у вещи много взаимосвязанных частей и в ней трудно разобраться, — а не что она требует усилий. Этим оно и отделено от schwierig и schwer уровня A2: eine schwierige Prüfung — трудный, требующий сил экзамен, ein kompliziertes Formular — запутанный бланк, и одно легко бывает без другого. Так же говорят о людях (ein komplizierter Mensch — с ним непросто) и в медицине (ein komplizierter Bruch — сложный перелом). Обиходная противоположность — einfach, а unkompliziert — похвала лёгкому в общении человеку.'
      uk: 'Слово каже, що в речі багато взаємозв''язаних частин і в ній важко розібратися, — а не що вона потребує зусиль. Цим воно й відокремлене від schwierig і schwer рівня A2: eine schwierige Prüfung — важкий, виснажливий іспит, ein kompliziertes Formular — заплутаний бланк, і одне легко буває без іншого. Так само кажуть про людей (ein komplizierter Mensch — з ним непросто) і в медицині (ein komplizierter Bruch — складний перелом). Побутова протилежність — einfach, а unkompliziert — похвала легкій у спілкуванні людині.'

  # --- Aushang, Beipackzettel, Gebrauchsanweisung ---
  - de: erforderlich
    ipa: "ɛɐ̯ˈfɔʁdɐlɪç"
    pos: adj
    # Recognition only: A2 ships both `notwendig` and `nötig`, each glossed "necessary",
    # as production cards — this prompt is owned twice over, in another deck.
    cards: recognition
    en: required, demanded by the rules
    ru: необходимый, требуемый
    uk: необхідний, потрібний
    example_de: Für die Anmeldung ist ein gültiger Ausweis erforderlich.
    example_en: A valid identity card is required for registration.
    example_ru: Для регистрации необходим действительный документ.
    example_uk: Для реєстрації потрібен чинний документ.
    note:
      en: 'The officialese of nötig. It says a rule or a procedure demands the thing, not that someone happens to want it, which is why it lives on forms, notices and websites: erforderliche Unterlagen, eine Anmeldung ist erforderlich, die erforderlichen Schritte. Behind it is erfordern, to require. In conversation it sounds like a letter from an Amt, and speech says nötig or simply Ich brauche … A2 notwendig sits between the two registers.'
      ru: 'Канцелярский вариант nötig. Слово говорит, что вещи требует правило или процедура, а не чьё-то желание, — потому и живёт на бланках, объявлениях и сайтах: erforderliche Unterlagen, eine Anmeldung ist erforderlich, die erforderlichen Schritte. За ним стоит глагол erfordern («требовать»). В разговоре звучит как письмо из ведомства, и речь берёт nötig или просто Ich brauche … notwendig уровня A2 стоит между этими двумя регистрами.'
      uk: 'Канцелярський варіант nötig. Слово каже, що речі вимагає правило або процедура, а не чиєсь бажання, — тому й живе на бланках, оголошеннях і сайтах: erforderliche Unterlagen, eine Anmeldung ist erforderlich, die erforderlichen Schritte. За ним стоїть дієслово erfordern («вимагати»). У розмові звучить як лист із відомства, і мовлення бере nötig або просто Ich brauche … notwendig рівня A2 стоїть між цими двома регістрами.'

  - de: zugänglich
    ipa: "ˈtsuːgɛŋlɪç"
    pos: adj
    # Recognition only: Hausordnung, notice-board and website vocabulary — the learner
    # reads it on a sign and is not asked to produce it at B1.
    cards: recognition
    en: accessible, open to be entered or used
    ru: доступный, открытый для доступа
    uk: доступний, відкритий для доступу
    example_de: Der Garten ist für alle Bewohner des Hauses zugänglich.
    example_en: The garden is accessible to all residents of the building.
    example_ru: Сад доступен всем жильцам дома.
    example_uk: Сад доступний для всіх мешканців будинку.
    note:
      en: 'der Zugang, access, plus -lich, and the frame is für + Akkusativ: zugänglich für Rollstuhlfahrer, öffentlich zugänglich, frei zugänglich. It covers physical entry and the right to use something alike (Die Akten sind nicht öffentlich zugänglich). Said of a person it means approachable: Sie ist sehr zugänglich. The word on an accessibility sign is barrierefrei; unzugänglich is the opposite, and a package insert warns für Kinder unzugänglich aufbewahren.'
      ru: 'der Zugang («доступ») плюс -lich, и рамка — für + Akkusativ: zugänglich für Rollstuhlfahrer, öffentlich zugänglich, frei zugänglich. Слово покрывает и физический вход, и право пользоваться (Die Akten sind nicht öffentlich zugänglich). О человеке значит «открытый, к нему легко подступиться»: Sie ist sehr zugänglich. На табличке о безбарьерности стоит barrierefrei; противоположность — unzugänglich, и вкладыш к лекарству предупреждает für Kinder unzugänglich aufbewahren.'
      uk: 'der Zugang («доступ») плюс -lich, і рамка — für + Akkusativ: zugänglich für Rollstuhlfahrer, öffentlich zugänglich, frei zugänglich. Слово покриває і фізичний вхід, і право користуватися (Die Akten sind nicht öffentlich zugänglich). Про людину означає «відкритий, до неї легко підступитися»: Sie ist sehr zugänglich. На табличці про безбар''єрність стоїть barrierefrei; протилежність — unzugänglich, а вкладка до ліків попереджає für Kinder unzugänglich aufbewahren.'

  - de: sichtbar
    ipa: "ˈzɪçtˌbaːɐ̯"
    pos: adj
    en: visible, able to be seen
    ru: видимый, заметный
    uk: видимий, помітний
    example_de: Der Schaden am Auto ist deutlich sichtbar.
    example_en: The damage to the car is clearly visible.
    example_ru: Повреждение на машине хорошо заметно.
    example_uk: Пошкодження на автівці добре помітне.
    note:
      en: 'sehen plus -bar, the ending that turns a verb into can be done to it: essbar, bezahlbar, machbar, lesbar, waschbar. Learning this one word is worth more than one word, because the pattern is fully productive. It almost always carries a degree word: gut sichtbar, kaum sichtbar, deutlich sichtbar, sichtbar besser. On a notice, gut sichtbar anbringen means put it where it can be seen. unsichtbar is the opposite, and the noun behind it is die Sicht, view.'
      ru: 'sehen плюс -bar — окончание, превращающее глагол в «с этим можно так поступить»: essbar, bezahlbar, machbar, lesbar, waschbar. Выучить это слово выгоднее, чем одно слово, потому что модель полностью продуктивна. Почти всегда при нём стоит степень: gut sichtbar, kaum sichtbar, deutlich sichtbar, sichtbar besser. На объявлении gut sichtbar anbringen значит «повесить на видном месте». Противоположность — unsichtbar, а стоящее за ним существительное — die Sicht, «видимость, обзор».'
      uk: 'sehen плюс -bar — закінчення, що перетворює дієслово на «з цим можна так учинити»: essbar, bezahlbar, machbar, lesbar, waschbar. Вивчити це слово вигідніше, ніж одне слово, бо модель цілком продуктивна. Майже завжди при ньому стоїть ступінь: gut sichtbar, kaum sichtbar, deutlich sichtbar, sichtbar besser. На оголошенні gut sichtbar anbringen означає «повісити на видному місці». Протилежність — unsichtbar, а іменник за ним — die Sicht, «видимість, огляд».'

  - de: äußerlich
    ipa: "ˈɔʏ̯sɐlɪç"
    pos: adj
    # Recognition only: Beipackzettel and report vocabulary, read on a package insert
    # and not produced at B1.
    cards: recognition
    en: external, on the outside
    ru: внешний, наружный
    uk: зовнішній, назовні
    example_de: Die Salbe ist nur zur äußerlichen Anwendung bestimmt.
    example_en: The ointment is intended for external use only.
    example_ru: Мазь предназначена только для наружного применения.
    example_uk: Мазь призначена лише для зовнішнього застосування.
    note:
      en: 'It belongs to the package insert and to written reports: nur äußerlich anwenden, äußerliche Verletzungen, äußerlich unverändert. A second, everyday use sets what is shown against what is felt: Äußerlich war sie ganz ruhig, innerlich sehr nervös. Keep it apart from three neighbours A2 already teaches — außer, except for, außerhalb, outside of, and außen, on the outside as a place — and from the adjective äußer-, which appears only with an ending (die äußere Tür). Its opposite is innerlich.'
      ru: 'Слово принадлежит вкладышу к лекарству и письменным отчётам: nur äußerlich anwenden, äußerliche Verletzungen, äußerlich unverändert. Второе, обиходное употребление противопоставляет показанное пережитому: Äußerlich war sie ganz ruhig, innerlich sehr nervös. Держите его отдельно от трёх соседей, которые A2 уже даёт, — außer («кроме»), außerhalb («за пределами») и außen («снаружи», о месте), — и от прилагательного äußer-, которое встречается только с окончанием (die äußere Tür). Противоположность — innerlich.'
      uk: 'Слово належить вкладці до ліків і писемним звітам: nur äußerlich anwenden, äußerliche Verletzungen, äußerlich unverändert. Друге, побутове вживання протиставляє показане пережитому: Äußerlich war sie ganz ruhig, innerlich sehr nervös. Тримайте його окремо від трьох сусідів, яких A2 уже подає, — außer («крім»), außerhalb («за межами») та außen («ззовні», про місце), — і від прикметника äußer-, що трапляється лише із закінченням (die äußere Tür). Протилежність — innerlich.'

  - de: geheim
    ipa: "gəˈhaɪ̯m"
    pos: adj
    en: secret, kept from everyone else
    ru: тайный, секретный
    uk: таємний, секретний
    example_de: Meine PIN ist geheim, die sage ich niemandem.
    example_en: My PIN is secret, I do not tell it to anyone.
    example_ru: Мой ПИН-код секретный, я его никому не говорю.
    example_uk: Мій ПІН-код таємний, я його нікому не кажу.
    note:
      en: 'It describes information that is being kept from others on purpose: eine geheime Nummer, ein geheimes Treffen, streng geheim stamped on a file, die geheime Wahl. The verb chunk is etwas geheim halten, to keep something quiet, and das Geheimnis is the secret itself — Kannst du ein Geheimnis für dich behalten? Do not confuse it with heimlich, which describes the manner of an action done unseen (Er hat heimlich geraucht): that word is about how, this one about what.'
      ru: 'Слово характеризует сведения, которые намеренно скрывают от других: eine geheime Nummer, ein geheimes Treffen, streng geheim на папке, die geheime Wahl. Глагольный оборот — etwas geheim halten («держать в тайне»), а das Geheimnis — сама тайна: Kannst du ein Geheimnis für dich behalten? Не путайте с heimlich, которое характеризует образ действия, совершаемого украдкой (Er hat heimlich geraucht): то слово о том, как, а это — о том, что.'
      uk: 'Слово характеризує відомості, які навмисне приховують від інших: eine geheime Nummer, ein geheimes Treffen, streng geheim на теці, die geheime Wahl. Дієслівний зворот — etwas geheim halten («тримати в таємниці»), а das Geheimnis — сама таємниця: Kannst du ein Geheimnis für dich behalten? Не плутайте з heimlich, яке характеризує спосіб дії, учиненої нишком (Er hat heimlich geraucht): те слово про те, як, а це — про те, що.'

  - de: still
    ipa: "ˈʃtɪl"
    pos: adj
    # Recognition only: A2 ships `leise` ("quiet, soft") and `ruhig` ("calm; quiet") as
    # production cards, so any honest prompt here is one they already answer.
    cards: recognition
    en: silent, saying nothing and making no sound
    ru: тихий, безмолвный
    uk: тихий, безмовний
    example_de: Während der Prüfung war es im Saal ganz still.
    example_en: During the exam the hall was completely silent.
    example_ru: Во время экзамена в зале было совершенно тихо.
    example_uk: Під час іспиту в залі було зовсім тихо.
    note:
      en: 'A false friend, and an expensive one for an English speaker: it never means the English still. German says that with noch (Ich wohne noch hier) or immer noch. What this word says is that there is no sound and nobody is speaking: Sei bitte still, ein stiller Ort, still sitzen, Er blieb still. A2 leise is about volume, so eine leise Stimme is a voice you can barely hear while a person who is still says nothing at all; ruhig is about calm and is the word for a quiet street. Mineral water without gas is stilles Wasser, and die Stille is the silence itself.'
      ru: 'Ложный друг, и для говорящего по-английски дорогой: слово никогда не значит английского still, то есть «всё ещё». Для этого немецкий берёт noch (Ich wohne noch hier) или immer noch. Говорит же оно, что звука нет и никто не говорит: Sei bitte still, ein stiller Ort, still sitzen, Er blieb still. leise уровня A2 — о громкости, поэтому eine leise Stimme — это голос, который еле слышно, а тот, кто still, не произносит ни слова; ruhig — о спокойствии, и именно оно годится для тихой улицы. Вода без газа — stilles Wasser, а die Stille — сама тишина.'
      uk: 'Хибний друг, і для того, хто говорить англійською, дорогий: слово ніколи не означає англійського still, тобто «усе ще». Для цього німецька бере noch (Ich wohne noch hier) або immer noch. Каже ж воно, що звуку немає й ніхто не говорить: Sei bitte still, ein stiller Ort, still sitzen, Er blieb still. leise рівня A2 — про гучність, тому eine leise Stimme — це голос, який ледве чути, а той, хто still, не вимовляє ані слова; ruhig — про спокій, і саме воно годиться для тихої вулиці. Вода без газу — stilles Wasser, а die Stille — сама тиша.'
