      ru: 'Карточка учит наречию: «в неизменном виде, каким вышло от изготовителя или автора» — original verpackt, original italienisch, ein Rezept original nach Omas Art. Карточка не о другом, хотя слово то же: об определении при существительном в значении «подлинный, а не копия», die originale Fassung, — на практике немецкий предпочитает выразить это сложным словом: die Originalverpackung, die Originalrechnung, das Original. И не вчитывайте сюда originell: на букву длиннее, слово другое, значит «оригинальный, с выдумкой». Для «подлинный» в речи берут echt уровня A2.'
