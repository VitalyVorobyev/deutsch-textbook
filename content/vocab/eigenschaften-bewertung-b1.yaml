      en: 'The Partizip II of begrenzen, to set a limit to something, and behind both stands die Grenze, which A2 teaches as a border. On a notice it caps a number or a period: begrenzte Teilnehmerzahl, ein zeitlich begrenzter Vertrag, nur begrenzt haltbar, begrenzte Mittel. Said of a person it is an insult (Er ist geistig etwas begrenzt), so keep it for things and quantities. unbegrenzt is the opposite and is what a phone tariff advertises.'
      ru: 'Partizip II глагола begrenzen («ставить предел»), а за обоими стоит die Grenze, которую A2 даёт как «граница». На объявлении слово ставит потолок числу или сроку: begrenzte Teilnehmerzahl, ein zeitlich begrenzter Vertrag, nur begrenzt haltbar, begrenzte Mittel. О человеке это оскорбление (Er ist geistig etwas begrenzt), поэтому держите его для вещей и количеств. Противоположность — unbegrenzt, и именно её рекламирует тарифный план.'
      uk: 'Partizip II дієслова begrenzen («ставити межу»), а за обома стоїть die Grenze, яку A2 подає як «кордон». На оголошенні слово ставить стелю числу або строкові: begrenzte Teilnehmerzahl, ein zeitlich begrenzter Vertrag, nur begrenzt haltbar, begrenzte Mittel. Про людину це образа (Er ist geistig etwas begrenzt), тому тримайте його для речей і кількостей. Протилежність — unbegrenzt, і саме її рекламує тарифний план.'

  - de: riesig
    ipa: "ˈʁiːzɪç"
    pos: adj
