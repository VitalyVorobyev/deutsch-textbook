      ru: 'Карточка учит значению усилия: intensiv lernen, sich intensiv mit etwas beschäftigen, ein Intensivkurs, eine intensive Zusammenarbeit. Карточка не о другом, хотя слово то же: «сильный для органов чувств», о запахе, вкусе или цвете — ein intensiver Geruch, intensives Rot, ein intensiver Geschmack. stark уровня A2 — обиходное слово для «сильный», и оно подошло бы ко второму значению. В больничном немецком die Intensivstation — реанимация, а глагол intensivieren значит «усилить, нарастить».'
