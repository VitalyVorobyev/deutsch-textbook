      ru: 'Карточка учит значению «заранее установленный и не сдвигаемый»: eine feste Stelle, ein fester Termin, ein festes Einkommen, feste Öffnungszeiten, eine feste Beziehung. Карточка не о другом, хотя слово то же: «твёрдый на ощупь», противоположность flüssig и weich, — feste Nahrung, Der Boden ist hier fest. Как наречие значит «туго, крепко»: fest zudrehen, fest schlafen, fest daran glauben. hart уровня A2 — обиходное слово для «твёрдый на ощупь». А das Fest с большой буквы — праздник, совсем другое слово.'
