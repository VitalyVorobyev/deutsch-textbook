      en: 'der Riese, the giant, is inside it, and that is the tone: A1 groß measures, this word exaggerates, so it is a step above rather than a synonym. It also grades things that have no size at all — riesigen Hunger haben, eine riesige Freude, ein riesiger Erfolg, riesige Probleme — and standing alone in speech it means great: Das ist ja riesig! enorm and gewaltig say the same at a higher register, and winzig is the opposite.'
      ru: 'Внутри него der Riese («великан»), и отсюда его тон: groß уровня A1 измеряет, а это слово преувеличивает, так что оно не синоним, а ступень выше. Оно градуирует и то, у чего размера нет вовсе, — riesigen Hunger haben, eine riesige Freude, ein riesiger Erfolg, riesige Probleme, — а отдельной репликой в речи значит «здорово»: Das ist ja riesig! То же на более высоком регистре скажут enorm и gewaltig, а противоположность — winzig.'
      uk: 'Усередині нього der Riese («велет»), і звідси його тон: groß рівня A1 вимірює, а це слово перебільшує, тож воно не синонім, а щабель вище. Воно градуює й те, у чого розміру немає зовсім, — riesigen Hunger haben, eine riesige Freude, ein riesiger Erfolg, riesige Probleme, — а окремою реплікою в мовленні означає «чудово»: Das ist ja riesig! Те саме на вищому регістрі скажуть enorm і gewaltig, а протилежність — winzig.'

