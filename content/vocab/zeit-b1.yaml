    note:
      en: 'Standard everywhere in the duration phrase eine dreiviertel Stunde, forty-five minutes, where it stands in front of the noun and takes no endings; written as two words, drei viertel Stunden means the same. The clock reading is a different matter and it is regional: in southern Germany, Austria and eastern Germany dreiviertel drei means 2:45, counting how much of the hour towards three has already gone, and viertel drei means 2:15. Standard German and the whole north say Viertel vor drei and Viertel nach zwei instead. So if you hear dreiviertel acht, it is 7:45 and not 8:45.'
      ru: 'Повсеместно стандартно в обороте длительности eine dreiviertel Stunde — сорок пять минут, — где слово стоит перед существительным и не получает окончаний; раздельное drei viertel Stunden значит то же. С часами дело другое, и там употребление областное: на юге Германии, в Австрии и на востоке Германии dreiviertel drei значит 2:45 — считают, сколько часа до трёх уже прошло, — а viertel drei значит 2:15. Стандартный немецкий и весь север скажут вместо этого Viertel vor drei и Viertel nach zwei. Так что если вы слышите dreiviertel acht, это 7:45, а не 8:45.'
      uk: 'Повсюдно стандартно у звороті тривалості eine dreiviertel Stunde — сорок п’ять хвилин, — де слово стоїть перед іменником і не отримує закінчень; окреме drei viertel Stunden означає те саме. З годинником справа інша, і там ужиток обласний: на півдні Німеччини, в Австрії та на сході Німеччини dreiviertel drei означає 2:45 — лічать, скільки години до третьої вже минуло, — а viertel drei означає 2:15. Стандартна німецька і вся північ скажуть натомість Viertel vor drei і Viertel nach zwei. Тож якщо ви чуєте dreiviertel acht, це 7:45, а не 8:45.'
