id: gesundheit-wohlbefinden
title_de: "Gesundheit & Wohlbefinden"
title_en: "Health & wellbeing"
title_ru: "Здоровье и самочувствие"
title_uk: "Здоров'я та самопочуття"
level: B1
entries:
  - de: "sich erholen"
    ipa: "zɪç ɛɐ̯ˈhoːlən"
    pos: verb
    praesens_3sg: "erholt sich"
    partizip2: "sich erholt"
    aux: haben
    valence: "sich + Akk; von + Dat"
    en: "to recover, to get some rest"
    ru: "восстанавливаться, отдыхать (после нагрузки)"
    uk: "відновлюватися, відпочивати (після навантаження)"
    example_de: "Im Urlaub habe ich mich richtig von der Arbeit erholt."
    example_en: "On holiday I really recovered from work."
    example_ru: "В отпуске я по-настоящему восстановился после работы."
    example_uk: "У відпустці я по-справжньому відновився після роботи."
    note:
      en: "What you recover from follows von + Dat: sich vom Stress erholen. Erhol dich gut! is the fixed get-well-and-rest wish."
      ru: "То, после чего восстанавливаются, вводит von + Dat: sich vom Stress erholen. Erhol dich gut! — устойчивое пожелание отдохнуть."
      uk: "Те, після чого відновлюються, вводить von + Dat: sich vom Stress erholen. Erhol dich gut! — стале побажання відпочити."

  - de: "sich kümmern"
    ipa: "zɪç ˈkʏmɐn"
    pos: verb
    praesens_3sg: "kümmert sich"
    partizip2: "sich gekümmert"
    aux: haben
    valence: "sich + Akk; um + Akk"
    en: "to take care (of), to look after"
    ru: "заботиться (о ком-либо, чём-либо)"
    uk: "дбати, піклуватися (про когось, щось)"
    example_de: "Wer kümmert sich um deine Katze, wenn du im Urlaub bist?"
    example_en: "Who looks after your cat when you are on holiday?"
    example_ru: "Кто заботится о твоей кошке, когда ты в отпуске?"
    example_uk: "Хто дбає про твою кішку, коли ти у відпустці?"
    note:
      en: "The person or thing you look after follows um + Akk: sich um die Kinder kümmern. It also covers taking care of tasks: Ich kümmere mich um den Termin."
      ru: "Тот, о ком заботятся, вводится um + Akk: sich um die Kinder kümmern. Работает и для дел: Ich kümmere mich um den Termin — «я займусь записью»."
      uk: "Той, про кого дбають, вводиться um + Akk: sich um die Kinder kümmern. Працює й для справ: Ich kümmere mich um den Termin — «я займуся записом»."

  - de: "sich erkälten"
    ipa: "zɪç ɛɐ̯ˈkɛltn̩"
    pos: verb
    praesens_3sg: "erkältet sich"
    partizip2: "sich erkältet"
    aux: haben
    valence: "sich + Akk"
    en: "to catch a cold"
    ru: "простужаться"
    uk: "застуджуватися"
    example_de: "Zieh dich warm an, sonst erkältest du dich!"
    example_en: "Dress warmly, or you will catch a cold!"
    example_ru: "Оденься теплее, а то простудишься!"
    example_uk: "Одягнися тепліше, бо застудишся!"
    note:
      en: "The result is die Erkältung from A2; the state is erkältet sein: Ich bin erkältet — I have a cold."
      ru: "Результат — die Erkältung с A2; состояние — erkältet sein: Ich bin erkältet — «я простужен»."
      uk: "Результат — die Erkältung з A2; стан — erkältet sein: Ich bin erkältet — «я застуджений»."

  - de: "verzichten"
    ipa: "fɛɐ̯ˈtsɪçtn̩"
    pos: verb
    praesens_3sg: "verzichtet"
    partizip2: "verzichtet"
    aux: haben
    valence: "verzichten auf + Akk"
    en: "to do without, to give up (something)"
    en_compact: "to do without, to give up"
    ru: "отказываться (от чего-либо), обходиться без"
    uk: "відмовлятися (від чогось), обходитися без"
    example_de: "Der Arzt sagt, ich soll auf Zucker verzichten."
    example_en: "The doctor says I should give up sugar."
    example_ru: "Врач говорит, что мне нужно отказаться от сахара."
    example_uk: "Лікар каже, що мені треба відмовитися від цукру."
    note:
      en: "What you give up follows auf + Akk: auf Kaffee verzichten. Point back at it with darauf: Darauf kann ich nicht verzichten."
      ru: "То, от чего отказываются, вводит auf + Akk: auf Kaffee verzichten. Сослаться на это можно словом darauf: Darauf kann ich nicht verzichten."
      uk: "Те, від чого відмовляються, вводить auf + Akk: auf Kaffee verzichten. Послатися на це можна словом darauf: Darauf kann ich nicht verzichten."

  - de: "vermeiden"
    ipa: "fɛɐ̯ˈmaɪ̯dn̩"
    pos: verb
    praesens_3sg: "vermeidet"
    partizip2: "vermieden"
    aux: haben
    valence: "+ Akk"
    en: "to avoid"
    ru: "избегать"
    uk: "уникати"
    example_de: "Stress kann man nicht immer vermeiden."
    example_en: "Stress cannot always be avoided."
    example_ru: "Стресса не всегда можно избежать."
    example_uk: "Стресу не завжди можна уникнути."
    note:
      en: "Takes a plain Akkusativ, no preposition: Stress vermeiden, Fehler vermeiden."
      ru: "Требует простого Akkusativ — в отличие от русского «избегать чего» с родительным."
      uk: "Вимагає простого Akkusativ — на відміну від українського «уникати чого» з родовим."

  - de: "atmen"
    ipa: "ˈaːtmən"
    pos: verb
    praesens_3sg: "atmet"
    partizip2: "geatmet"
    aux: haben
    en: "to breathe"
    ru: "дышать"
    uk: "дихати"
    example_de: "Am Meer kann ich endlich wieder frei atmen."
    example_en: "By the sea I can finally breathe freely again."
    example_ru: "У моря я наконец снова могу свободно дышать."
    example_uk: "Біля моря я нарешті знову можу вільно дихати."
    note:
      en: "The doctor's pair is einatmen and ausatmen — breathe in, breathe out: Bitte tief einatmen!"
      ru: "У врача звучит пара einatmen и ausatmen — вдохнуть и выдохнуть: Bitte tief einatmen!"
      uk: "У лікаря звучить пара einatmen і ausatmen — вдихнути й видихнути: Bitte tief einatmen!"

  - de: "schaden"
    ipa: "ˈʃaːdn̩"
    pos: verb
    praesens_3sg: "schadet"
    partizip2: "geschadet"
    aux: haben
    valence: "+ Dat"
    en: "to harm, to be bad for"
    ru: "вредить"
    uk: "шкодити"
    example_de: "Zu wenig Schlaf schadet der Gesundheit."
    example_en: "Too little sleep is bad for your health."
    example_ru: "Недосып вредит здоровью."
    example_uk: "Недосип шкодить здоров'ю."
    note:
      en: "Takes the dative: es schadet dir nicht. The fixed shrug is Das kann nicht schaden — it can't hurt."
      ru: "Требует датива — как и русское «вредить кому»: es schadet dir nicht. Устойчивое Das kann nicht schaden — «хуже не будет»."
      uk: "Вимагає давального — як і українське «шкодити кому»: es schadet dir nicht. Стале Das kann nicht schaden — «гірше не буде»."

  - de: "wirken"
    ipa: "ˈvɪʁkn̩"
    pos: verb
    praesens_3sg: "wirkt"
    partizip2: "gewirkt"
    aux: haben
    en: "to take effect, to work (of a remedy)"
    en_compact: "to take effect, to work"
    ru: "действовать (о лекарстве, средстве)"
    uk: "діяти (про ліки, засіб)"
    example_de: "Die Tablette wirkt nach etwa zwanzig Minuten."
    example_en: "The tablet takes effect after about twenty minutes."
    example_ru: "Таблетка действует примерно через двадцать минут."
    example_uk: "Таблетка діє приблизно через двадцять хвилин."
    note:
      en: "Also of anything that has an effect: Der Tee wirkt beruhigend. A person can wirken müde — seem tired."
      ru: "Также обо всём, что даёт эффект: Der Tee wirkt beruhigend. О человеке — wirken müde: «выглядеть уставшим»."
      uk: "Також про все, що дає ефект: Der Tee wirkt beruhigend. Про людину — wirken müde: «здаватися втомленим»."

  - de: "verschreiben"
    ipa: "fɛɐ̯ˈʃʁaɪ̯bn̩"
    pos: verb
    praesens_3sg: "verschreibt"
    partizip2: "verschrieben"
    aux: haben
    valence: "+ Dat + Akk"
    en: "to prescribe"
    ru: "выписывать, прописывать (лекарство)"
    uk: "виписувати, приписувати (ліки)"
    example_de: "Die Ärztin hat mir Tropfen gegen den Husten verschrieben."
    example_en: "The doctor prescribed me drops for the cough."
    example_ru: "Врач выписала мне капли от кашля."
    example_uk: "Лікарка виписала мені краплі від кашлю."
    note:
      en: "Somebody prescribes somebody (Dat) something (Akk). The paper it lands on is das Rezept from A2."
      ru: "Кто-то выписывает кому-то (Dat) что-то (Akk). Бумага, на которой это оказывается, — das Rezept с A2."
      uk: "Хтось виписує комусь (Dat) щось (Akk). Папір, на якому це опиняється, — das Rezept з A2."

  - de: "Bewegung"
    ipa: "bəˈveːgʊŋ"
    pos: noun
    gender: f
    plural: "die Bewegungen"
    en: "exercise, physical activity; movement"
    ru: "движение, физическая активность"
    uk: "рух, фізична активність"
    example_de: "Ohne regelmäßige Bewegung schlafe ich schlecht."
    example_en: "Without regular exercise I sleep badly."
    example_ru: "Без регулярного движения я плохо сплю."
    example_uk: "Без регулярного руху я погано сплю."
    note:
      en: "In the health sense usually singular and article-free: Bewegung tut gut. The everyday chunk is sich bewegen — to get moving."
      ru: "В значении «физическая активность» обычно единственное число и без артикля: Bewegung tut gut. Бытовой оборот — sich bewegen «двигаться»."
      uk: "У значенні «фізична активність» зазвичай однина й без артикля: Bewegung tut gut. Побутовий зворот — sich bewegen «рухатися»."

  - de: "Ernährung"
    ipa: "ɛɐ̯ˈnɛːʁʊŋ"
    pos: noun
    gender: f
    plural: "—"
    en: "diet, nutrition"
    ru: "питание"
    uk: "харчування"
    example_de: "Gesunde Ernährung muss nicht teuer sein."
    example_en: "A healthy diet does not have to be expensive."
    example_ru: "Здоровое питание не обязательно должно быть дорогим."
    example_uk: "Здорове харчування не обов'язково має бути дорогим."
    note:
      en: "Means the way you eat overall, not a weight-loss plan — that is die Diät. Usually article-free: gesunde Ernährung."
      ru: "Это рацион в целом, а не диета для похудения — та будет die Diät. Обычно без артикля: gesunde Ernährung."
      uk: "Це раціон загалом, а не дієта для схуднення — та буде die Diät. Зазвичай без артикля: gesunde Ernährung."

  - de: "Gewohnheit"
    ipa: "gəˈvoːnhaɪ̯t"
    pos: noun
    gender: f
    plural: "die Gewohnheiten"
    en: "habit"
    ru: "привычка"
    uk: "звичка"
    example_de: "Der Spaziergang nach dem Essen ist bei mir eine feste Gewohnheit."
    example_en: "The walk after dinner is a firm habit of mine."
    example_ru: "Прогулка после еды — моя твёрдая привычка."
    example_uk: "Прогулянка після вечері — моя стала звичка."
    note:
      en: "The chunk for by-habit behaviour is aus Gewohnheit: Ich trinke den Kaffee nur aus Gewohnheit."
      ru: "Оборот «по привычке» — aus Gewohnheit: Ich trinke den Kaffee nur aus Gewohnheit."
      uk: "Зворот «за звичкою» — aus Gewohnheit: Ich trinke den Kaffee nur aus Gewohnheit."

  - de: "Schlaf"
    ipa: "ˈʃlaːf"
    pos: noun
    gender: m
    plural: "—"
    en: "sleep"
    ru: "сон (состояние)"
    uk: "сон (стан)"
    example_de: "Ohne genug Schlaf funktioniert bei mir gar nichts."
    example_en: "Without enough sleep nothing works for me at all."
    example_ru: "Без достаточного сна у меня вообще ничего не получается."
    example_uk: "Без достатнього сну в мене взагалі нічого не виходить."
    note:
      en: "The state, not the dream — a dream is der Traum. Mass noun, so usually article-free: guter Schlaf, zu wenig Schlaf."
      ru: "Состояние, а не сновидение — сновидение будет der Traum. Неисчисляемое, поэтому обычно без артикля: guter Schlaf, zu wenig Schlaf."
      uk: "Стан, а не сновидіння — сновидіння буде der Traum. Незліченне, тому зазвичай без артикля: guter Schlaf, zu wenig Schlaf."

  - de: "Ratschlag"
    ipa: "ˈʁaːtˌʃlaːk"
    pos: noun
    gender: m
    plural: "die Ratschläge"
    en: "piece of advice, tip"
    ru: "совет"
    uk: "порада"
    example_de: "Danke für deinen Ratschlag — ich probiere es aus."
    example_en: "Thanks for your advice — I will try it out."
    example_ru: "Спасибо за совет — попробую."
    example_uk: "Дякую за пораду — спробую."
    note:
      en: "You give one — einen Ratschlag geben. The short sibling der Rat means the same and has no plural of its own; Ratschläge fills that gap."
      ru: "Совет дают — einen Ratschlag geben. Короткий брат der Rat значит то же, но своего множественного числа не имеет; его заменяет Ratschläge."
      uk: "Пораду дають — einen Ratschlag geben. Короткий брат der Rat означає те саме, але власної множини не має; її заміняє Ratschläge."

  - de: "Empfehlung"
    ipa: "ɛmˈpfeːlʊŋ"
    pos: noun
    gender: f
    plural: "die Empfehlungen"
    en: "recommendation"
    ru: "рекомендация"
    uk: "рекомендація"
    example_de: "Auf Empfehlung meiner Ärztin trinke ich jetzt weniger Kaffee."
    example_en: "On my doctor's recommendation I now drink less coffee."
    example_ru: "По рекомендации своего врача я теперь пью меньше кофе."
    example_uk: "За рекомендацією своєї лікарки я тепер п'ю менше кави."
    note:
      en: "The verb is empfehlen (A2). Auf Empfehlung + Genitiv is the fixed written frame: auf Empfehlung des Arztes."
      ru: "Глагол — empfehlen (A2). Auf Empfehlung + Genitiv — устойчивая письменная рамка: auf Empfehlung des Arztes."
      uk: "Дієслово — empfehlen (A2). Auf Empfehlung + Genitiv — стала письмова рамка: auf Empfehlung des Arztes."

  - de: "anstrengend"
    ipa: "ˈanˌʃtʁɛŋənt"
    pos: adj
    en: "tiring, strenuous"
    ru: "утомительный, напряжённый"
    uk: "виснажливий, напружений"
    example_de: "Die Woche war so anstrengend, dass ich am Freitag sofort eingeschlafen bin."
    example_en: "The week was so tiring that I fell asleep immediately on Friday."
    example_ru: "Неделя была такой напряжённой, что в пятницу я сразу уснул."
    example_uk: "Тиждень був таким виснажливим, що в п'ятницю я одразу заснув."
    note:
      en: "From sich anstrengen — to make an effort. Work is anstrengend; the person afterwards is müde or erschöpft."
      ru: "От sich anstrengen «напрягаться, стараться». Работа бывает anstrengend; человек после неё — müde или erschöpft."
      uk: "Від sich anstrengen «напружуватися, старатися». Робота буває anstrengend; людина після неї — müde або erschöpft."

  - de: "fit"
    ipa: "ˈfɪt"
    pos: adj
    en: "fit, in good shape"
    ru: "в хорошей форме, бодрый"
    uk: "у гарній формі, бадьорий"
    example_de: "Mein Opa ist mit achtzig noch richtig fit."
    example_en: "My grandpa is still really fit at eighty."
    example_ru: "Мой дедушка в восемьдесят всё ещё в отличной форме."
    example_uk: "Мій дідусь у вісімдесят усе ще в чудовій формі."
    note:
      en: "The chunk is sich fit halten — to keep in shape: Ich halte mich mit Schwimmen fit."
      ru: "Оборот — sich fit halten «поддерживать форму»: Ich halte mich mit Schwimmen fit."
      uk: "Зворот — sich fit halten «підтримувати форму»: Ich halte mich mit Schwimmen fit."

  - de: "Schmerzmittel"
    ipa: "ˈʃmɛʁtsˌmɪtl̩"
    pos: noun
    gender: n
    plural: "die Schmerzmittel"
    cards: recognition
    en: "painkiller"
    ru: "обезболивающее"
    uk: "знеболювальне"
    example_de: "Dieses Schmerzmittel bekommen Sie nur mit Rezept."
    example_en: "You can only get this painkiller with a prescription."
    example_ru: "Это обезболивающее можно получить только по рецепту."
    example_uk: "Це знеболювальне можна отримати лише за рецептом."
    note:
      en: "Pharmacy and package language — das Mittel alone is any remedy: ein Mittel gegen Husten."
      ru: "Язык аптеки и упаковки — das Mittel само по себе значит «средство»: ein Mittel gegen Husten."
      uk: "Мова аптеки та упаковки — das Mittel саме по собі означає «засіб»: ein Mittel gegen Husten."

  - de: "Tropfen"
    ipa: "ˈtʁɔpfn̩"
    pos: noun
    gender: m
    plural: "die Tropfen"
    cards: recognition
    en: "drop; drops (liquid medicine)"
    en_compact: "drop; drops"
    ru: "капля; капли (лекарство)"
    uk: "крапля; краплі (ліки)"
    example_de: "Nehmen Sie dreimal täglich zehn Tropfen nach dem Essen."
    example_en: "Take ten drops three times a day after meals."
    example_ru: "Принимайте по десять капель три раза в день после еды."
    example_uk: "Приймайте по десять крапель тричі на день після їди."
    note:
      en: "As a medicine almost always plural: Tropfen gegen Husten. Exactly the wording you read on the package."
      ru: "Как лекарство почти всегда во множественном числе: Tropfen gegen Husten. Ровно такая формулировка стоит на упаковке."
      uk: "Як ліки майже завжди у множині: Tropfen gegen Husten. Рівно таке формулювання стоїть на упаковці."

  - de: "Wirkung"
    ipa: "ˈvɪʁkʊŋ"
    pos: noun
    gender: f
    plural: "die Wirkungen"
    cards: recognition
    en: "effect (of a medicine or remedy)"
    en_compact: "effect"
    ru: "действие, эффект (лекарства, средства)"
    uk: "дія, ефект (ліків, засобу)"
    example_de: "Die Wirkung beginnt nach ungefähr einer halben Stunde."
    example_en: "The effect starts after about half an hour."
    example_ru: "Действие начинается примерно через полчаса."
    example_uk: "Дія починається приблизно через півгодини."
    note:
      en: "Package-insert language: Wirkung und Nebenwirkungen — effect and side effects. The verb is wirken."
      ru: "Язык инструкции к лекарству: Wirkung und Nebenwirkungen — «действие и побочные эффекты». Глагол — wirken."
      uk: "Мова інструкції до ліків: Wirkung und Nebenwirkungen — «дія і побічні ефекти». Дієслово — wirken."
