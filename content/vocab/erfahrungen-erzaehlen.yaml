id: erfahrungen-erzaehlen
title_de: "Erfahrungen erzählen"
title_en: "Telling about experiences"
title_ru: "Рассказ о пережитом"
title_uk: "Розповідь про пережите"
level: B1
entries:
  - de: "Erlebnis"
    ipa: "ɛɐ̯ˈleːpnɪs"
    pos: noun
    gender: n
    plural: "die Erlebnisse"
    en: "experience (a single event you lived through)"
    ru: "переживание, (яркое) событие"
    uk: "переживання, (яскрава) подія"
    example_de: "Die Reise war ein besonderes Erlebnis für mich."
    example_en: "The trip was a special experience for me."
    example_ru: "Эта поездка стала для меня особенным событием."
    example_uk: "Ця поїздка стала для мене особливою подією."
    note:
      en: "One countable event — different from the accumulated knowledge die Erfahrung names. A story tells ein Erlebnis."
      ru: "Одно исчисляемое событие — в отличие от накопленного опыта, который называет die Erfahrung. Рассказ описывает ein Erlebnis."
      uk: "Одна злічувана подія — на відміну від накопиченого досвіду, який називає die Erfahrung. Розповідь описує ein Erlebnis."

  - de: "erleben"
    ipa: "ɛɐ̯ˈleːbn̩"
    pos: verb
    praesens_3sg: "erlebt"
    partizip2: "erlebt"
    aux: haben
    en: "to experience, to live through"
    ru: "пережить, испытать"
    uk: "пережити, зазнати"
    example_de: "So etwas habe ich noch nie erlebt."
    example_en: "I have never experienced anything like that."
    example_ru: "Ничего подобного я ещё не переживал."
    example_uk: "Нічого подібного я ще не переживав."

  - de: "geschehen"
    ipa: "gəˈʃeːən"
    pos: verb
    praesens_3sg: "geschieht"
    partizip2: "geschehen"
    aux: sein
    cards: recognition
    en: "to happen, to occur (formal)"
    ru: "происходить (книжн.)"
    uk: "відбуватися (книжн.)"
    example_de: "Der Bericht erklärt, was an diesem Tag geschehen ist."
    example_en: "The report explains what happened on that day."
    example_ru: "Отчёт объясняет, что произошло в тот день."
    example_uk: "Звіт пояснює, що сталося того дня."
    note:
      en: "The written-register sibling of passieren — you will read it in reports and narration; in your own sentences passieren does the work."
      ru: "Книжный брат passieren: вы встретите его в отчётах и повествовании; в собственных фразах достаточно passieren."
      uk: "Книжний брат passieren: ви зустрінете його у звітах і оповіді; у власних фразах достатньо passieren."

  - de: "Ereignis"
    ipa: "ɛɐ̯ˈʔaɪ̯gnɪs"
    pos: noun
    gender: n
    plural: "die Ereignisse"
    en: "event, occurrence"
    ru: "событие"
    uk: "подія"
    example_de: "Der Umzug war das wichtigste Ereignis des Jahres."
    example_en: "The move was the most important event of the year."
    example_ru: "Переезд стал главным событием года."
    example_uk: "Переїзд став головною подією року."

  - de: "Vergangenheit"
    ipa: "fɛɐ̯ˈgaŋənhaɪ̯t"
    pos: noun
    gender: f
    plural: "—"
    en: "the past"
    ru: "прошлое"
    uk: "минуле"
    example_de: "In der Vergangenheit habe ich oft den Bus genommen."
    example_en: "In the past I often took the bus."
    example_ru: "В прошлом я часто ездил на автобусе."
    example_uk: "У минулому я часто їздив автобусом."

  - de: "Bericht"
    ipa: "bəˈʁɪçt"
    pos: noun
    gender: m
    plural: "die Berichte"
    en: "report"
    ru: "отчёт, сообщение"
    uk: "звіт, повідомлення"
    example_de: "Ich habe für die Versicherung einen kurzen Bericht geschrieben."
    example_en: "I wrote a short report for the insurance company."
    example_ru: "Я написал короткий отчёт для страховой."
    example_uk: "Я написав короткий звіт для страхової."

  - de: "Erzählung"
    ipa: "ɛɐ̯ˈtsɛːlʊŋ"
    pos: noun
    gender: f
    plural: "die Erzählungen"
    en: "narrative, story (told or written)"
    ru: "рассказ, повествование"
    uk: "розповідь, оповідання"
    example_de: "Ihre Erzählung begann mitten im Sturm."
    example_en: "Her narrative began in the middle of the storm."
    example_ru: "Её рассказ начался прямо посреди бури."
    example_uk: "Її розповідь почалася просто посеред бурі."

  - de: "Abenteuer"
    ipa: "ˈaːbn̩tɔʏ̯ɐ"
    pos: noun
    gender: n
    plural: "die Abenteuer"
    en: "adventure"
    ru: "приключение"
    uk: "пригода"
    example_de: "Die Fahrt mit dem Nachtzug war ein kleines Abenteuer."
    example_en: "The night-train journey was a small adventure."
    example_ru: "Поездка ночным поездом была маленьким приключением."
    example_uk: "Поїздка нічним потягом була маленькою пригодою."

  - de: "überraschen"
    ipa: "yːbɐˈʁaʃn̩"
    pos: verb
    praesens_3sg: "überrascht"
    partizip2: "überrascht"
    aux: haben
    en: "to surprise"
    ru: "удивлять"
    uk: "дивувати"
    example_de: "Das Ende der Geschichte hat alle überrascht."
    example_en: "The end of the story surprised everyone."
    example_ru: "Конец истории всех удивил."
    example_uk: "Кінець історії всіх здивував."
    note:
      en: "Inseparable über-: no ge- in the Partizip (überrascht), and the stress sits on -rasch-."
      ru: "Неотделяемая приставка über-: в Partizip нет ge- (überrascht), ударение на -rasch-."
      uk: "Невідокремлюваний префікс über-: у Partizip немає ge- (überrascht), наголос на -rasch-."

  - de: "retten"
    ipa: "ˈʁɛtn̩"
    pos: verb
    praesens_3sg: "rettet"
    partizip2: "gerettet"
    aux: haben
    en: "to rescue, to save"
    ru: "спасать"
    uk: "рятувати"
    example_de: "Ein Nachbar rettete die Katze vom Baum."
    example_en: "A neighbour rescued the cat from the tree."
    example_ru: "Сосед снял кошку с дерева и спас её."
    example_uk: "Сусід зняв кішку з дерева і врятував її."

  - de: "seltsam"
    ipa: "ˈzɛltzaːm"
    pos: adj
    en: "strange, odd"
    ru: "странный"
    uk: "дивний"
    example_de: "Ein seltsames Geräusch weckte mich mitten in der Nacht."
    example_en: "A strange noise woke me in the middle of the night."
    example_ru: "Странный звук разбудил меня посреди ночи."
    example_uk: "Дивний звук розбудив мене посеред ночі."

  - de: "sobald"
    ipa: "zoˈbalt"
    pos: conj
    en: "as soon as"
    ru: "как только"
    uk: "щойно, як тільки"
    example_de: "Sobald ich zu Hause war, rief ich dich an."
    example_en: "As soon as I was home, I called you."
    example_ru: "Как только я оказался дома, я тебе позвонил."
    example_uk: "Щойно я опинився вдома, я тобі зателефонував."
    note:
      en: "A subordinating conjunction: the verb goes to the end of its clause."
      ru: "Подчинительный союз: глагол уходит в конец своей части."
      uk: "Підрядний сполучник: дієслово йде в кінець своєї частини."

  - de: "Panne"
    ipa: "ˈpanə"
    pos: noun
    gender: f
    plural: "die Pannen"
    en: "breakdown, mishap"
    ru: "поломка, накладка"
    uk: "поломка, прикрість"
    example_de: "Wegen einer Panne standen wir zwei Stunden auf der Autobahn."
    example_en: "Because of a breakdown we stood on the motorway for two hours."
    example_ru: "Из-за поломки мы два часа простояли на автобане."
    example_uk: "Через поломку ми дві години простояли на автобані."

  - de: "Pech"
    ipa: "ˈpɛç"
    pos: noun
    gender: n
    plural: "—"
    en: "bad luck"
    ru: "невезение"
    uk: "невезіння"
    example_de: "So ein Pech — genau an dem Tag hatte der Laden zu."
    example_en: "What bad luck — the shop was closed on exactly that day."
    example_ru: "Вот невезение — именно в тот день магазин был закрыт."
    example_uk: "От невезіння — саме того дня крамниця була зачинена."
    note:
      en: "The fixed chunk Pech haben is the everyday opposite of Glück haben."
      ru: "Устойчивое Pech haben — бытовая противоположность Glück haben."
      uk: "Стале Pech haben — побутова протилежність Glück haben."

  - de: "Zufall"
    ipa: "ˈtsuːfal"
    pos: noun
    gender: m
    plural: "die Zufälle"
    en: "coincidence, chance"
    ru: "случайность, совпадение"
    uk: "випадковість, збіг"
    example_de: "Durch einen Zufall traf ich dort meinen alten Lehrer."
    example_en: "By coincidence I met my old teacher there."
    example_ru: "По случайности я встретил там своего старого учителя."
    example_uk: "Випадково я зустрів там свого старого вчителя."

  - de: "zufällig"
    ipa: "ˈtsuːfɛlɪç"
    pos: adj
    en: "accidental; by chance"
    ru: "случайный; случайно"
    uk: "випадковий; випадково"
    example_de: "Ich habe das Foto ganz zufällig gefunden."
    example_en: "I found the photo completely by chance."
    example_ru: "Я нашёл это фото совершенно случайно."
    example_uk: "Я знайшов це фото цілком випадково."

  - de: "Lärm"
    ipa: "ˈlɛʁm"
    pos: noun
    gender: m
    plural: "—"
    en: "noise"
    ru: "шум"
    uk: "шум, гамір"
    example_de: "Der Lärm auf der Straße weckte das ganze Haus."
    example_en: "The noise in the street woke the whole building."
    example_ru: "Шум на улице разбудил весь дом."
    example_uk: "Шум на вулиці розбудив увесь будинок."

  - de: "erschrecken"
    ipa: "ɛɐ̯ˈʃʁɛkn̩"
    pos: verb
    praesens_3sg: "erschrickt"
    partizip2: "erschrocken"
    aux: sein
    cards: recognition
    en: "to get a fright, to be startled"
    ru: "испугаться"
    uk: "злякатися"
    example_de: "Ich erschrak, als das Licht plötzlich ausging."
    example_en: "I was startled when the light suddenly went out."
    example_ru: "Я испугался, когда свет вдруг погас."
    example_uk: "Я злякався, коли світло раптом згасло."
    note:
      en: "The strong intransitive verb (erschrak, ist erschrocken) means getting the fright; the weak transitive erschreckte means giving one. Recognise the strong forms in narration."
      ru: "Сильный непереходный глагол (erschrak, ist erschrocken) — испугаться самому; слабый переходный erschreckte — напугать кого-то. В повествовании узнавайте сильные формы."
      uk: "Сильне неперехідне дієслово (erschrak, ist erschrocken) — злякатися самому; слабке перехідне erschreckte — налякати когось. В оповіді впізнавайте сильні форми."
