    example_uk: Він приніс коробку цукерок.
    note:
      en: 'Feminine, plural in -n, and it works as a measure word without any preposition — eine Schachtel Zigaretten, eine Schachtel Streichhölzer. The big sturdy box is der Karton and the crate is der Kasten, so German has three sizes where English mostly has one. Note the ch after a, the back one as in machen, and the syllabic l at the end.'
      ru: 'Женский род, множественное на -n, и работает как счётное слово без всякого предлога: eine Schachtel Zigaretten, eine Schachtel Streichhölzer. Большая прочная коробка — der Karton, ящик — der Kasten, так что у немца три размера там, где по-русски чаще всего одна «коробка». Обратите внимание на ch после a — заднее, как в machen, — и на слоговое l в конце.'
      uk: 'Жіночий рід, множина на -n, і працює як лічильне слово без жодного прийменника: eine Schachtel Zigaretten, eine Schachtel Streichhölzer. Велика міцна коробка — der Karton, ящик — der Kasten, тож у німця три розміри там, де українською найчастіше одна «коробка». Зверніть увагу на ch після a — заднє, як у machen, — і на складове l наприкінці.'

