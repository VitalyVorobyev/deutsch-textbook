    note:
      en: 'Neuter, with an umlaut and -er in the plural. The verbs around it are ein Loch machen, bohren for drilling one and stopfen for darning one shut. It carries a common figurative use about money: ein Loch im Budget, and jemandem ein Loch in den Bauch fragen means to pester somebody with questions. The o is short and the ch is the back one, as in machen.'
      ru: 'Средний род, во множественном умлаут и -er. Вокруг него глаголы ein Loch machen, bohren — «сверлить» и stopfen — «заштопать». Частое переносное употребление связано с деньгами: ein Loch im Budget, а jemandem ein Loch in den Bauch fragen значит «замучить вопросами». o краткое, ch — заднее, как в machen.'
      uk: 'Середній рід, у множині умлаут і -er. Довкола нього дієслова ein Loch machen, bohren — «свердлити» і stopfen — «заштопати». Часте переносне вживання пов’язане з грошима: ein Loch im Budget, а jemandem ein Loch in den Bauch fragen означає «замучити питаннями». o коротке, ch — заднє, як у machen.'

  - de: kaputtgehen
    ipa: "kaˈpʊtˌgeːən"
    pos: verb
    praesens_3sg: geht kaputt
    partizip2: kaputtgegangen
    aux: sein
    cards: recognition
    en: to stop working or fall apart, without anybody being blamed for it
    ru: перестать работать или развалиться — без указания на виновника
    uk: перестати працювати або розвалитися — без вказівки на винуватця
    example_de: Die Waschmaschine ist schon wieder kaputtgegangen.
    example_en: The washing machine has broken down again.
    example_ru: Стиральная машина опять сломалась.
    example_uk: Пральна машина знову зламалася.
    note:
      en: 'A1 kaputt plus gehen, separable, and the auxiliary is sein because it describes a change of state rather than an action — ist kaputtgegangen, never hat. That is exactly what separates it from kaputtmachen below, where somebody does the breaking. German uses this pair where English says the thing broke against somebody broke it. Stress falls on -putt, so the primary mark sits inside the first half.'
      ru: 'kaputt уровня A1 плюс gehen, глагол отделяемый, а вспомогательный — sein, потому что описывается смена состояния, а не действие: ist kaputtgegangen, но не hat. Именно это отличает его от kaputtmachen ниже, где ломает кто-то. Немецкий разводит эту пару там, где по-русски есть «сломалось» и «сломал». Ударение падает на -putt, поэтому главный знак стоит внутри первой половины.'
      uk: 'kaputt рівня A1 плюс gehen, дієслово відокремлюване, а допоміжне — sein, бо описується зміна стану, а не дія: ist kaputtgegangen, але не hat. Саме це відрізняє його від kaputtmachen нижче, де ламає хтось. Німецька розводить цю пару там, де українською є «зламалося» і «зламав». Наголос падає на -putt, тому головний знак стоїть усередині першої половини.'

  - de: kaputtmachen
    ipa: "kaˈpʊtˌmaxn̩"
    pos: verb
    praesens_3sg: macht kaputt
    partizip2: kaputtgemacht
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to break something so that it no longer works, whether on purpose or not
    ru: сломать что-то так, что оно перестаёт работать, — намеренно или нет
    uk: зламати щось так, що воно перестає працювати, — навмисне чи ні
    example_de: Pass auf, dass du das Schloss nicht kaputtmachst.
    example_en: Be careful not to break the lock.
    example_ru: Смотри не сломай замок.
    example_uk: Дивись не зламай замок.
    note:
      en: 'The transitive half of the pair, so it takes an accusative object and haben in the Perfekt — hat die Vase kaputtgemacht. It is the everyday spoken word; a written text or a report prefers zerstören for destroying and beschädigen for damaging. Reflexively sich kaputtmachen means to wear yourself out, usually with work. Stress on -putt, as in kaputtgehen above.'
      ru: 'Переходная половина пары: требует винительного дополнения и haben в Perfekt — hat die Vase kaputtgemacht. Это обиходное разговорное слово; письменный текст или протокол предпочтёт zerstören — «уничтожить» и beschädigen — «повредить». В возвратном употреблении sich kaputtmachen значит «загонять себя», обычно работой. Ударение на -putt, как и в kaputtgehen выше.'
      uk: 'Перехідна половина пари: вимагає знахідного додатка і haben у Perfekt — hat die Vase kaputtgemacht. Це побутове розмовне слово; письмовий текст або протокол віддасть перевагу zerstören — «знищити» і beschädigen — «пошкодити». У зворотному вжитку sich kaputtmachen означає «заганяти себе», зазвичай роботою. Наголос на -putt, як і в kaputtgehen вище.'

  # --- Feuer und Licht ---
  - de: Feuer
    ipa: "ˈfɔʏ̯ɐ"
    pos: noun
    gender: n
    plural: "die Feuer"
    cards: recognition
    en: burning flame, either the useful kind you light or the destructive kind that has to be put out
    ru: горящее пламя — либо полезное, которое разводят, либо разрушительное, которое приходится тушить
    uk: полум’я, що горить, — або корисне, яке розводять, або руйнівне, яке доводиться гасити
    example_de: Im Erdgeschoss ist in der Nacht ein Feuer ausgebrochen.
    example_en: A fire broke out on the ground floor during the night.
    example_ru: Ночью на первом этаже начался пожар.
    example_uk: Уночі на першому поверсі спалахнула пожежа.
    note:
      en: 'Neuter, and singular and plural are spelled alike. Two senses live side by side: the fire you make (ein Feuer machen, am Feuer sitzen) and the fire that destroys (ein Feuer bricht aus, ein Feuer löschen). The service is A1 die Feuerwehr and the emergency number is 112. A smoker asking for a light says only Haben Sie Feuer? — the word alone is the whole request.'
      ru: 'Средний род, единственное и множественное пишутся одинаково. Рядом живут два значения: огонь, который разводят (ein Feuer machen, am Feuer sitzen), и огонь, который губит (ein Feuer bricht aus, ein Feuer löschen). Служба — die Feuerwehr уровня A1, экстренный номер 112. Курильщик, просящий прикурить, скажет только Haben Sie Feuer? — этого слова достаточно для всей просьбы.'
      uk: 'Середній рід, однина і множина пишуться однаково. Поряд живуть два значення: вогонь, який розводять (ein Feuer machen, am Feuer sitzen), і вогонь, який нищить (ein Feuer bricht aus, ein Feuer löschen). Служба — die Feuerwehr рівня A1, екстрений номер 112. Курець, що просить припалити, скаже лише Haben Sie Feuer? — цього слова досить для всього прохання.'

  - de: brennen
    ipa: "ˈbʁɛnən"
    pos: verb
    praesens_3sg: brennt
    partizip2: gebrannt
    aux: haben
    cards: recognition
    en: to be on fire; also, of a light, to be switched on, and of a wound, to sting
    ru: гореть; а также, о лампе, — быть включённой, а о ране — саднить
    uk: горіти; а також, про лампу, — бути ввімкненою, а про рану — щеміти
    example_de: Im ganzen Haus brennt noch Licht.
    example_en: The lights are still on all over the house.
    example_ru: Во всём доме ещё горит свет.
    example_uk: У всьому будинку ще горить світло.
    note:
      en: 'Irregular in a way that catches learners out — brennt, brannte, hat gebrannt — with a in the past forms and no vowel change in the present. Three senses run in parallel: something is alight, a lamp is on (das Licht brennt, where English says the light is on), and a wound or the eyes sting. The Perfekt takes haben even though nobody does anything to an object. Verbrennen is to burn something up, and abbrennen is to burn down.'
      ru: 'Неправильный так, что легко ошибиться: brennt, brannte, hat gebrannt — с a в прошедших формах и без чередования в настоящем. Три значения идут параллельно: что-то горит, лампа включена (das Licht brennt — ровно как по-русски «горит свет») и рана или глаза щиплют. В Perfekt стоит haben, хотя никакого объекта нет. verbrennen — «сжечь», abbrennen — «сгореть дотла».'
      uk: 'Неправильне так, що легко схибити: brennt, brannte, hat gebrannt — з a в минулих формах і без чергування в теперішньому. Три значення йдуть паралельно: щось горить, лампа ввімкнена (das Licht brennt — точно як українською «горить світло») і рана або очі щемлять. У Perfekt стоїть haben, хоча жодного об’єкта немає. verbrennen — «спалити», abbrennen — «згоріти дотла».'

  - de: Kerze
    ipa: "ˈkɛʁtsə"
    pos: noun
    gender: f
    plural: "die Kerzen"
    cards: recognition
    en: a stick of wax with a wick down the middle, lit for light or for atmosphere
    ru: восковая палочка с фитилём внутри, которую зажигают ради света или ради уюта
    uk: воскова паличка з ґнотом усередині, яку запалюють задля світла або задля затишку
    example_de: Zum Essen haben wir zwei Kerzen angezündet.
    example_en: We lit two candles for the meal.
    example_ru: К ужину мы зажгли две свечи.
    example_uk: До вечері ми запалили дві свічки.
    note:
      en: 'Feminine, plural in -n. The verb is anzünden, to light, and ausblasen or auspusten to blow out. German winter runs on them: der Adventskranz carries four, and a birthday cake carries one per year. In a car die Zündkerze is the spark plug, built from the same zünden. The r is uvular and the z is spoken ts.'
      ru: 'Женский род, множественное на -n. Глагол — anzünden, «зажечь», а ausblasen или auspusten — «задуть». На них держится немецкая зима: на der Adventskranz их четыре, а на именинном торте столько, сколько лет. В машине die Zündkerze — свеча зажигания, от того же zünden. r увулярное, z читается как «ц».'
      uk: 'Жіночий рід, множина на -n. Дієслово — anzünden, «запалити», а ausblasen або auspusten — «задмухати». На них тримається німецька зима: на der Adventskranz їх чотири, а на іменинному торті стільки, скільки років. У машині die Zündkerze — свічка запалювання, від того самого zünden. r увулярне, z читається як «ц».'

  - de: Streichholz
    ipa: "ˈʃtʁaɪ̯çˌhɔlts"
    pos: noun
    gender: n
    plural: "die Streichhölzer"
    cards: recognition
    en: a short thin stick with a tip that catches fire when it is drawn across a rough strip
    ru: короткая тонкая палочка с головкой, которая загорается, если чиркнуть ею о шершавую полоску
    uk: коротка тонка паличка з голівкою, що займається, якщо черкнути нею об шорстку смужку
    example_de: Ich brauche ein Streichholz für die Kerzen.
    example_en: I need a match for the candles.
    example_ru: Мне нужна спичка для свечей.
    example_uk: Мені потрібен сірник для свічок.
    note:
      en: 'Built from streichen, to stroke, and das Holz, so the word says exactly what you do with it. Plural takes an umlaut and -er, and the box is die Streichholzschachtel. Das Feuerzeug below does the same job without being used up, which is why it has largely replaced this in a pocket. In Austria the ordinary word is das Zündholz, from zünden, and in Germany that spelling reads as slightly old-fashioned.'
      ru: 'Сложено из streichen — «чиркать» и das Holz — «дерево», так что слово прямо называет действие. Множественное берёт умлаут и -er, коробок — die Streichholzschachtel. das Feuerzeug ниже делает ту же работу, не расходуя себя, поэтому в кармане почти вытеснило спички. В Австрии обиходное слово — das Zündholz, от zünden, а в Германии оно звучит слегка старомодно.'
      uk: 'Складене зі streichen — «черкати» і das Holz — «дерево», тож слово прямо називає дію. Множина бере умлаут і -er, коробка — die Streichholzschachtel. das Feuerzeug нижче виконує ту саму роботу, не витрачаючи себе, тому в кишені майже витіснило сірники. В Австрії побутове слово — das Zündholz, від zünden, а в Німеччині воно звучить трохи старомодно.'

  - de: Feuerzeug
    ipa: "ˈfɔʏ̯ɐˌtsɔʏ̯k"
    pos: noun
    gender: n
    plural: "die Feuerzeuge"
    cards: recognition
    en: the small refillable device that makes a flame at the press of a thumb
    ru: маленькое устройство с запасом газа, дающее пламя при нажатии большим пальцем
    uk: маленький пристрій із запасом газу, що дає полум’я при натисканні великим пальцем
    example_de: Hast du ein Feuerzeug dabei?
    example_en: Have you got a lighter on you?
    example_ru: У тебя есть с собой зажигалка?
    example_uk: У тебе є із собою запальничка?
    note:
      en: 'Das Feuer above plus -zeug, the ending that means gear or kit and builds das Werkzeug, das Spielzeug and das Fahrzeug from the same pattern. Neuter for that reason, and the plural is -e. Beside das Streichholz above it is the reusable one, and it is what somebody means at a bus stop when they ask Haben Sie Feuer? Primary stress on Feuer-, secondary on -zeug.'
      ru: 'das Feuer выше плюс -zeug — окончание со значением «снаряжение, штуковина», по той же схеме дающее das Werkzeug, das Spielzeug и das Fahrzeug. Отсюда и средний род, множественное на -e. Рядом с das Streichholz выше это многоразовый вариант, и именно его имеют в виду на остановке, спрашивая Haben Sie Feuer? Главное ударение на Feuer-, побочное на -zeug.'
      uk: 'das Feuer вище плюс -zeug — закінчення зі значенням «спорядження, штукенція», за тією самою схемою дає das Werkzeug, das Spielzeug і das Fahrzeug. Звідси й середній рід, множина на -e. Поряд із das Streichholz вище це багаторазовий варіант, і саме його мають на увазі на зупинці, питаючи Haben Sie Feuer? Головний наголос на Feuer-, побічний на -zeug.'

  - de: Gas
    ipa: "ˈgaːs"
    pos: noun
    gender: n
    plural: "die Gase"
    cards: recognition
    en: the fuel that is piped into a home for cooking and heating; also any airlike substance
    ru: топливо, которое подводят в дом по трубе для готовки и отопления; а также всякое газообразное вещество
    uk: паливо, яке підводять у дім трубою для готування й опалення; а також будь-яка газоподібна речовина
    example_de: Wir kochen mit Gas, geheizt wird mit Strom.
    example_en: We cook with gas and heat with electricity.
    example_ru: Готовим мы на газе, а отапливаемся электричеством.
    example_uk: Готуємо ми на газі, а опалюємося електрикою.
    note:
      en: 'Neuter, with a long a. In a household context it is the mains supply, next to A1 der Strom for electricity, and the bill lists die Gasrechnung. In chemistry and in a weather report it is any gas at all, hence the plural. A driver''s Gas geben means to accelerate, which is the same word doing an unrelated job. Never use it for petrol — that is das Benzin.'
      ru: 'Средний род, a долгое. В быту это то, что подводят в квартиру, рядом с der Strom уровня A1 — электричеством, а в счетах стоит die Gasrechnung. В химии и в прогнозе погоды это любой газ вообще, отсюда и множественное число. У водителя Gas geben значит «прибавить газу» — то же слово в совершенно другой работе. Бензин так не называют: это das Benzin.'
      uk: 'Середній рід, a довге. У побуті це те, що підводять у квартиру, поряд із der Strom рівня A1 — електрикою, а в рахунках стоїть die Gasrechnung. У хімії та в прогнозі погоди це будь-який газ узагалі, звідси й множина. У водія Gas geben означає «піддати газу» — те саме слово в цілком іншій роботі. Бензин так не звуть: це das Benzin.'

  # --- Wenn es gefährlich wird ---
  - de: Gefahr
    ipa: "gəˈfaːɐ̯"
    pos: noun
    gender: f
    plural: "die Gefahren"
    cards: recognition
    en: the possibility that something bad will happen, named as a thing one can be in or out of
    ru: возможность того, что случится беда, названная как нечто, в чём можно находиться или чего избежать
    uk: можливість того, що станеться лихо, названа як щось, у чому можна перебувати або чого уникнути
    example_de: Für die Nachbarn bestand keine Gefahr.
    example_en: There was no danger for the neighbours.
    example_ru: Для соседей опасности не было.
    example_uk: Для сусідів небезпеки не було.
    note:
      en: 'The noun behind A2 gefährlich. Three chunks carry it: in Gefahr sein, to be in danger, außer Gefahr sein, to be out of it, which is what a hospital says about a patient, and auf eigene Gefahr, at your own risk, which is what a sign says. Das Risiko is the calculated kind an insurer prices; this word is the immediate kind. The plural die Gefahren is common in official warnings.'
      ru: 'Существительное, стоящее за gefährlich уровня A2. Его держат три оборота: in Gefahr sein — «быть в опасности», außer Gefahr sein — «быть вне опасности», как говорят в больнице о пациенте, и auf eigene Gefahr — «на свой страх и риск», как пишут на табличке. das Risiko — просчитанный риск, который оценивает страховщик; это слово — непосредственная угроза. Множественное die Gefahren часто в официальных предупреждениях.'
      uk: 'Іменник, що стоїть за gefährlich рівня A2. Його тримають три звороти: in Gefahr sein — «бути в небезпеці», außer Gefahr sein — «бути поза небезпекою», як кажуть у лікарні про пацієнта, і auf eigene Gefahr — «на власний страх і ризик», як пишуть на табличці. das Risiko — прорахований ризик, який оцінює страховик; це слово — безпосередня загроза. Множина die Gefahren часта в офіційних попередженнях.'

  - de: Vorsicht
    ipa: "ˈfoːɐ̯ˌzɪçt"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the care taken in advance so that nothing goes wrong; also the single word that warns of a hazard
    ru: осмотрительность, проявляемая заранее, чтобы ничего не случилось; а также одно слово, которым предупреждают об опасности
    uk: обачність, виявлена заздалегідь, щоб нічого не сталося; а також одне слово, яким попереджають про небезпеку
    example_de: Vorsicht, die Stufe ist sehr hoch!
    example_en: Careful, the step is very high!
    example_ru: Осторожно, ступенька очень высокая!
    example_uk: Обережно, сходинка дуже висока!
    note:
      en: 'Feminine and without a plural, and most of its life is spent as a bare interjection: Vorsicht! is what a German shouts where English says careful or look out, and it is printed on a wet floor and a hot surface. In a sentence the chunk is mit Vorsicht or Vorsicht walten lassen. The adjective is vorsichtig, and it is what you call a careful driver. Not die Achtung, which warns of something already present.'
      ru: 'Женский род, множественного нет, и большую часть жизни слово проводит как голое восклицание: Vorsicht! кричат там, где по-русски скажут «осторожно», и печатают на мокром полу и горячей поверхности. В предложении оборот — mit Vorsicht или Vorsicht walten lassen. Прилагательное — vorsichtig, именно так назовут аккуратного водителя. Это не die Achtung, которое предупреждает о том, что уже перед вами.'
      uk: 'Жіночий рід, множини немає, і більшу частину життя слово проводить як голий вигук: Vorsicht! гукають там, де українською скажуть «обережно», і друкують на мокрій підлозі та гарячій поверхні. У реченні зворот — mit Vorsicht або Vorsicht walten lassen. Прикметник — vorsichtig, саме так назвуть акуратного водія. Це не die Achtung, яке попереджає про те, що вже перед вами.'

  - de: elektrisch
    ipa: "eˈlɛktʁɪʃ"
    pos: adj
    cards: recognition
    en: worked by electricity rather than by hand, by fuel or by muscle
    ru: работающий на электричестве, а не вручную, не на топливе и не мускульной силой
    uk: що працює на електриці, а не вручну, не на паливі й не м’язовою силою
    example_de: Der neue Herd ist elektrisch, der alte lief mit Gas.
    example_en: The new cooker is electric, the old one ran on gas.
    example_ru: Новая плита электрическая, старая работала на газе.
    example_uk: Нова плита електрична, стара працювала на газі.
    note:
      en: 'A1 der Strom is the electricity itself and this is the adjective for anything that runs on it — ein elektrisches Gerät, eine elektrische Zahnbürste, elektrischer Strom in the fixed phrase a technician uses. Do not read it as elektronisch, which is a different word about circuits and computing. The noun for the field is die Elektrizität and the tradesman is der Elektriker.'
      ru: 'der Strom уровня A1 — само электричество, а это прилагательное для всего, что на нём работает: ein elektrisches Gerät, eine elektrische Zahnbürste, а в устойчивом обороте техника — elektrischer Strom. Не читайте его как elektronisch: то другое слово, про схемы и вычисления. Область называется die Elektrizität, а мастер — der Elektriker.'
      uk: 'der Strom рівня A1 — сама електрика, а це прикметник для всього, що на ній працює: ein elektrisches Gerät, eine elektrische Zahnbürste, а в усталеному звороті техніка — elektrischer Strom. Не читайте його як elektronisch: то інше слово, про схеми й обчислення. Галузь зветься die Elektrizität, а майстер — der Elektriker.'

  - de: Alarm
    ipa: "aˈlaʁm"
    pos: noun
    gender: m
    plural: "die Alarme"
    cards: recognition
    en: a loud automatic warning signal, and the state of alert it puts everybody into
    ru: громкий автоматический предупреждающий сигнал и состояние тревоги, в которое он всех приводит
    uk: гучний автоматичний попереджувальний сигнал і стан тривоги, у який він усіх приводить
    example_de: Mitten in der Nacht ging der Alarm los.
    example_en: The alarm went off in the middle of the night.
    example_ru: Среди ночи сработала сигнализация.
    example_uk: Серед ночі спрацювала сигналізація.
    note:
      en: 'Masculine, stress on the second syllable. The verb that goes with it is losgehen, to go off, and Alarm schlagen means to raise the alarm. The compounds cover the household — der Rauchmelder is the smoke detector, die Alarmanlage the burglar alarm — while der Wecker is the alarm clock and is not this word at all, which is the trap for an English speaker.'
      ru: 'Мужской род, ударение на втором слоге. Глагол при нём — losgehen, «сработать», а Alarm schlagen значит «поднять тревогу». Составные слова покрывают быт: der Rauchmelder — датчик дыма, die Alarmanlage — охранная сигнализация, — а будильник называется der Wecker и этим словом не является вовсе; вот здесь и ловушка для англоязычного.'
      uk: 'Чоловічий рід, наголос на другому складі. Дієслово при ньому — losgehen, «спрацювати», а Alarm schlagen означає «зчинити тривогу». Складні слова покривають побут: der Rauchmelder — датчик диму, die Alarmanlage — охоронна сигналізація, — а будильник зветься der Wecker і цим словом не є взагалі; ось тут і пастка для англомовного.'

  - de: Klingel
    ipa: "ˈklɪŋl̩"
    pos: noun
    gender: f
    plural: "die Klingeln"
    cards: recognition
    en: the button and bell at a front door that a visitor presses to be let in
    ru: кнопка со звонком у входной двери, на которую нажимает пришедший, чтобы его впустили
    uk: кнопка з дзвінком біля вхідних дверей, на яку натискає той, хто прийшов, щоб його впустили
    example_de: Die Klingel funktioniert nicht, klopf bitte.
    example_en: The doorbell is not working, please knock.
    example_ru: Звонок не работает, постучи, пожалуйста.
    example_uk: Дзвінок не працює, постукай, будь ласка.
    note:
      en: 'The verb is klingeln, and it works both for the visitor (an der Tür klingeln) and for the thing itself (das Telefon klingelt). On a German front door the button carries the surname rather than a flat number, which is why a delivery driver needs the name and not the floor. Do not confuse it with die Glocke, the bell in a church tower.'
      ru: 'Глагол — klingeln, и он работает и для гостя (an der Tür klingeln), и для самого предмета (das Telefon klingelt). На немецкой входной двери кнопка подписана фамилией, а не номером квартиры, поэтому курьеру нужна фамилия, а не этаж. Не путайте с die Glocke — колоколом на колокольне.'
      uk: 'Дієслово — klingeln, і воно працює і для гостя (an der Tür klingeln), і для самого предмета (das Telefon klingelt). На німецьких вхідних дверях кнопка підписана прізвищем, а не номером квартири, тому кур’єрові потрібне прізвище, а не поверх. Не плутайте з die Glocke — дзвоном на дзвіниці.'

  - de: Notruf
    ipa: "ˈnoːtˌʁuːf"
    pos: noun
    gender: m
    plural: "die Notrufe"
    cards: recognition
    en: the call you make when help is needed at once, and the number you make it on
    ru: вызов, который делают, когда помощь нужна немедленно, и номер, по которому его делают
    uk: виклик, який роблять, коли допомога потрібна негайно, і номер, за яким його роблять
    example_de: Wählen Sie im Notfall den Notruf 112.
    example_en: In an emergency dial the emergency number 112.
    example_ru: В экстренном случае звоните по номеру 112.
    example_uk: У надзвичайному випадку телефонуйте на номер 112.
    note:
      en: 'Die Not, distress, plus der Ruf. Germany has two numbers and both are worth knowing: 112 reaches the fire service and the ambulance, 110 the police, and 112 works across the whole EU. The related words are der Notfall for the emergency itself and der Notdienst for the out-of-hours service a pharmacy runs. Primary stress on Not-, secondary on -ruf.'
      ru: 'die Not — «беда» плюс der Ruf. В Германии два номера, и знать стоит оба: 112 — пожарные и скорая, 110 — полиция, причём 112 работает по всему ЕС. Рядом стоят der Notfall — сам экстренный случай и der Notdienst — дежурная служба, которую держит, например, аптека. Главное ударение на Not-, побочное на -ruf.'
      uk: 'die Not — «біда» плюс der Ruf. У Німеччині два номери, і знати варто обидва: 112 — пожежники та швидка, 110 — поліція, причому 112 працює по всьому ЄС. Поряд стоять der Notfall — сам надзвичайний випадок і der Notdienst — чергова служба, яку тримає, наприклад, аптека. Головний наголос на Not-, побічний на -ruf.'

  - de: Notausgang
    ipa: "ˈnoːtˌʔaʊ̯sgaŋ"
    pos: noun
    gender: m
    plural: "die Notausgänge"
    cards: recognition
    en: the door kept clear so that people can leave a building fast if something happens
    ru: дверь, которую держат свободной, чтобы люди могли быстро выйти из здания, если что-то случится
    uk: двері, які тримають вільними, щоб люди могли швидко вийти з будівлі, якщо щось станеться
    example_de: Der Notausgang darf nicht zugestellt werden.
    example_en: The emergency exit must not be blocked.
    example_ru: Запасной выход нельзя загромождать.
    example_uk: Запасний вихід не можна захаращувати.
    note:
      en: 'Die Not plus A1 der Ausgang, and it is one of the German words a learner meets before understanding it, because the green running-man sign carries it in every cinema, train and office. Beside it der Notausstieg is the emergency window on a bus. Note the glottal stop where the two halves meet, before the Aus-, which is what keeps the compound audible as two words.'
      ru: 'die Not плюс der Ausgang уровня A1, и это одно из тех немецких слов, которые встречаешь раньше, чем понимаешь: зелёная табличка с бегущим человечком висит в каждом кинотеатре, поезде и офисе. Рядом der Notausstieg — аварийное окно в автобусе. Обратите внимание на гортанную смычку на стыке половин, перед Aus-: именно она делает сложное слово слышимым как два.'
      uk: 'die Not плюс der Ausgang рівня A1, і це одне з тих німецьких слів, які зустрічаєш раніше, ніж розумієш: зелена табличка з чоловічком, що біжить, висить у кожному кінотеатрі, потязі та офісі. Поряд der Notausstieg — аварійне вікно в автобусі. Зверніть увагу на гортанну змичку на стику половин, перед Aus-: саме вона робить складне слово чутним як два.'

  - de: Notaufnahme
    ipa: "ˈnoːtˌʔaʊ̯fnaːmə"
    pos: noun
    gender: f
    plural: "die Notaufnahmen"
    cards: recognition
    en: the hospital department that takes people in without an appointment when something is urgent
    ru: отделение больницы, куда принимают без записи, когда дело срочное
    uk: відділення лікарні, куди приймають без запису, коли справа термінова
    example_de: Mit so einer Wunde muss man in die Notaufnahme.
    example_en: With a wound like that you have to go to A&E.
    example_ru: С такой раной надо ехать в приёмное отделение.
    example_uk: Із такою раною треба їхати до приймального відділення.
    note:
      en: 'Die Not plus die Aufnahme, the taking-in. It is the department, not the vehicle — B1 der Krankenwagen brings you and this is where it stops. A2 die Sprechstunde is the opposite pole of German medicine, where nothing happens without an appointment, and this is the one place where that rule is suspended. Die Ambulanz means an outpatient clinic in German, never the vehicle, which is a false friend worth pinning down.'
      ru: 'die Not плюс die Aufnahme — «приём». Это отделение, а не машина: der Krankenwagen уровня B1 привозит, а здесь останавливается. die Sprechstunde уровня A2 — противоположный полюс немецкой медицины, где без записи не бывает ничего, и здесь единственное место, где это правило отменено. Слово die Ambulanz по-немецки значит «поликлиника», а не машину, — ложный друг, который стоит закрепить.'
      uk: 'die Not плюс die Aufnahme — «приймання». Це відділення, а не машина: der Krankenwagen рівня B1 привозить, а тут зупиняється. die Sprechstunde рівня A2 — протилежний полюс німецької медицини, де без запису не буває нічого, і тут єдине місце, де це правило скасовано. Слово die Ambulanz німецькою означає «поліклініка», а не машину, — хибний друг, якого варто закріпити.'

  # --- Gebrauchsanweisung und Spielsachen ---
  - de: Gebrauchsanweisung
    ipa: "gəˈbʁaʊ̯xsˌʔanvaɪ̯zʊŋ"
    pos: noun
    gender: f
    plural: "die Gebrauchsanweisungen"
    cards: recognition
    en: the printed sheet in the box that tells you how the thing is to be used
    ru: печатный листок в коробке, объясняющий, как пользоваться вещью
    uk: друкований аркуш у коробці, що пояснює, як користуватися річчю
    example_de: Lesen Sie bitte zuerst die Gebrauchsanweisung.
    example_en: Please read the instructions for use first.
    example_ru: Пожалуйста, сначала прочитайте инструкцию.
    example_uk: Будь ласка, спершу прочитайте інструкцію.
    note:
      en: 'Der Gebrauch, use, plus die Anweisung, instruction — a four-syllable compound of the kind German builds without hesitation, and reading it as its two halves is the trick that makes such words easy. B1 die Bedienungsanleitung is the same document for a machine with buttons, and the two are used almost interchangeably. On medicine the sheet is der Beipackzettel. Primary stress on -brauchs-, secondary on -an-.'
      ru: 'der Gebrauch — «применение» плюс die Anweisung — «указание»; четырёхсложное составное слово, какие немецкий строит не задумываясь, и умение читать его по половинам — тот приём, который делает такие слова лёгкими. die Bedienungsanleitung уровня B1 — тот же документ для машины с кнопками, и на практике их почти не различают. У лекарства этот листок называется der Beipackzettel. Главное ударение на -brauchs-, побочное на -an-.'
      uk: 'der Gebrauch — «застосування» плюс die Anweisung — «вказівка»; чотирискладове складне слово, які німецька будує не задумуючись, і вміння читати його по половинах — той прийом, що робить такі слова легкими. die Bedienungsanleitung рівня B1 — той самий документ для машини з кнопками, і на практиці їх майже не розрізняють. У ліків цей аркуш зветься der Beipackzettel. Головний наголос на -brauchs-, побічний на -an-.'

  - de: Spielzeug
    ipa: "ˈʃpiːlˌtsɔʏ̯k"
    pos: noun
    gender: n
    plural: "die Spielzeuge"
    cards: recognition
    en: things made for children to play with, taken together as a category
    ru: вещи, сделанные для детской игры, взятые вместе как разряд
    uk: речі, зроблені для дитячої гри, узяті разом як розряд
    example_de: Räum bitte dein Spielzeug ins Regal.
    example_en: Please put your toys away on the shelf.
    example_ru: Убери, пожалуйста, свои игрушки на полку.
    example_uk: Прибери, будь ласка, свої іграшки на полицю.
    note:
      en: 'A1 spielen plus -zeug, the same collective ending as in das Werkzeug and das Feuerzeug above. Because of that ending it is normally used as a mass noun for the whole heap — dein Spielzeug, viel Spielzeug — and a single item is usually named by its kind instead, das Spielzeugauto or die Puppe. The plural die Spielzeuge exists but is rare, and the collective die Spielsachen is just as common in speech. The shop is das Spielwarengeschäft.'
      ru: 'spielen уровня A1 плюс -zeug — то же собирательное окончание, что в das Werkzeug и das Feuerzeug выше. Из-за этого окончания слово обычно употребляется как собирательное, про всю кучу сразу: dein Spielzeug, viel Spielzeug, — а отдельную игрушку назовут по её виду: das Spielzeugauto, die Puppe. В речи ein Spielzeug тоже говорят, а множественное die Spielzeuge существует, но редко. Магазин — das Spielwarengeschäft.'
      uk: 'spielen рівня A1 плюс -zeug — те саме збірне закінчення, що в das Werkzeug і das Feuerzeug вище. Через це закінчення слово зазвичай уживається як збірне, про всю купу одразу: dein Spielzeug, viel Spielzeug, — а окрему іграшку назвуть за її видом: das Spielzeugauto, die Puppe. У мовленні ein Spielzeug теж кажуть, а множина die Spielzeuge існує, але рідко. Крамниця — das Spielwarengeschäft.'

  - de: Puppe
    ipa: "ˈpʊpə"
    pos: noun
    gender: f
    plural: "die Puppen"
    cards: recognition
    en: a small model of a person that a child dresses, carries about and plays with
    ru: маленькая фигурка человека, которую ребёнок одевает, носит и с которой играет
    uk: маленька фігурка людини, яку дитина вдягає, носить і з якою грається
    example_de: Das Kind nimmt die Puppe überall mit.
    example_en: The child takes the doll everywhere.
    example_ru: Ребёнок всюду берёт куклу с собой.
    example_uk: Дитина всюди бере ляльку із собою.
    note:
      en: 'Feminine, plural in -n. The theatre kind is die Handpuppe or die Marionette, and das Puppenhaus is the doll''s house. Two further senses run alongside: in biology it is the pupa of an insect, and in a shop window die Schaufensterpuppe is the mannequin. The vowel is a short ʊ and both p sounds are fully articulated, so the word has nothing of the French poupée about it.'
      ru: 'Женский род, множественное на -n. Театральная — die Handpuppe или die Marionette, а кукольный дом — das Puppenhaus. Рядом идут ещё два значения: в биологии это куколка насекомого, а в витрине die Schaufensterpuppe — манекен. Следите за гласным: краткое ʊ, и именно оно отделяет слово от похожего на вид der Papa.'
      uk: 'Жіночий рід, множина на -n. Театральна — die Handpuppe або die Marionette, а ляльковий дім — das Puppenhaus. Поряд ідуть ще два значення: у біології це лялечка комахи, а у вітрині die Schaufensterpuppe — манекен. Стежте за голосним: коротке ʊ, і саме воно відділяє слово від схожого на вигляд der Papa.'
