      ru: 'Одно слово и для гвоздя из скобяной лавки, и для ногтя, и различает их только предложение: die Fingernägel schneiden, sich einen Nagel in den Fuß treten. Множественное с умлаутом в обоих значениях. Салон называется das Nagelstudio, пилочка — die Nagelfeile. Оборот etwas an den Nagel hängen значит «бросить дело навсегда».'
      uk: 'Одне слово і для цвяха зі скобяної крамниці, і для нігтя, і розрізняє їх лише речення: die Fingernägel schneiden, sich einen Nagel in den Fuß treten. Множина з умлаутом в обох значеннях. Салон зветься das Nagelstudio, пилочка — die Nagelfeile. Зворот etwas an den Nagel hängen означає «покинути справу назавжди».'

