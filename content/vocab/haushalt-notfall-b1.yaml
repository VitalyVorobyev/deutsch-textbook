    partizip2: genäht
    aux: haben
    cards: recognition
    en: to join or mend cloth by pulling thread through it with a needle
    ru: соединять или чинить ткань, протягивая через неё нитку с иглой
    uk: з’єднувати або лагодити тканину, протягуючи крізь неї нитку з голкою
