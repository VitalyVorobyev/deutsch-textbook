# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the household-and-
# emergency field of data/goethe-b1-wortliste.txt: what gets cleaned and what is in
# the way, what is mended with a hammer or a needle, what burns on purpose and what
# burns by accident, and the German a warning sign and an emergency call use.
# A1's `haushalt-geraete` owns the fitted machines and the cleaning verbs (Herd,
# Heizung, Strom, Licht, Werkzeug, waschen, reparieren, schmutzig, sauber), A1's
# `alltag-a1-ergaenzung` owns putzen, A2's `haushalt-geschirr-a2` owns the crockery
# and the laundry (Teller, Glas, Messer, Wäsche, WC), A2's `koerper-pflege-a2` owns
# the bathroom (Seife, Handtuch, Dusche), and A1's `reisen-urlaub` owns the services
# you call (Polizei, Feuerwehr). This deck is the layer between them: the objects
# those decks assume you can already name, and the vocabulary of the moment
# something goes wrong.
# Every entry is `cards: recognition` by the frozen wave-2c tiering. This is the
# German of a label, a warning sign, an instruction sheet and a caretaker's notice —
# read and understood, while the sentence the learner produces about the same
# situation is built from the A1 and A2 words above, which already ship as typed
# cards. The Austrian and Swiss siblings of two headwords here (Zündholz, Zünder)
# are held back for the Varianten deck of wave 4; the `note` names them and nothing
# more.
id: haushalt-notfall-b1
title_de: "Haushalt und Notfall"
title_en: "The household and emergencies"
title_ru: "Домашнее хозяйство и чрезвычайные ситуации"
title_uk: "Домашнє господарство та надзвичайні ситуації"
level: B1
entries:
  # --- Sauber machen und was im Weg ist ---
  - de: abwaschen
    ipa: "ˈapˌvaʃn̩"
    pos: verb
    praesens_3sg: wäscht ab
    partizip2: abgewaschen
    aux: haben
    cards: recognition
    en: to wash the used plates, pots and glasses after a meal
    ru: мыть посуду после еды
    uk: мити посуд після їжі
    example_de: Heute wasche ich ab, morgen bist du dran.
    example_en: I am doing the washing-up today, tomorrow it is your turn.
    example_ru: Сегодня посуду мою я, завтра твоя очередь.
    example_uk: Сьогодні посуд мию я, завтра твоя черга.
    note:
      en: 'Separable and strong, following A1 waschen through the vowel change — wäscht ab, wusch ab, hat abgewaschen. It is the northern word; in the south and in Austria people say spülen or abspülen for exactly the same job, and the machine is die Spülmaschine everywhere. No object is needed, because everyone knows what is meant. The noun der Abwasch is the pile waiting to be done.'
      ru: 'Отделяемый и сильный, вслед за waschen уровня A1 меняет гласный — wäscht ab, wusch ab, hat abgewaschen. Это северное слово; на юге и в Австрии ту же работу называют spülen или abspülen, а машина везде die Spülmaschine. Дополнения не требуется — и так понятно, о чём речь. Существительное der Abwasch — та самая гора посуды, которая ждёт.'
      uk: 'Відокремлюване й сильне, услід за waschen рівня A1 змінює голосний — wäscht ab, wusch ab, hat abgewaschen. Це північне слово; на півдні та в Австрії ту саму роботу звуть spülen або abspülen, а машина всюди die Spülmaschine. Додатка не потрібно — і так зрозуміло, про що йдеться. Іменник der Abwasch — та сама гора посуду, яка чекає.'

  - de: staubsaugen
    ipa: "ˈʃtaʊ̯pˌzaʊ̯gn̩"
    pos: verb
    praesens_3sg: staubsaugt
    partizip2: gestaubsaugt
    aux: haben
    cards: recognition
    en: to clean a floor or a carpet with a machine that sucks the dirt up
    ru: чистить пол или ковёр машиной, которая всасывает грязь
    uk: чистити підлогу чи килим машиною, яка всмоктує бруд
    example_de: Am Samstag staubsauge ich die ganze Wohnung.
    example_en: On Saturday I vacuum the whole flat.
    example_ru: В субботу я пылесошу всю квартиру.
    example_uk: У суботу я пилососю всю квартиру.
    note:
      en: 'Built from der Staub and saugen, and unusual in that it behaves as one inseparable word for most speakers — ich staubsauge, ich habe gestaubsaugt. The separated forms ich sauge Staub and ich habe Staub gesaugt are also standard and just as common, so a text may show either. The machine is der Staubsauger. Primary stress on Staub-, secondary on -saugen.'
      ru: 'Собрано из der Staub и saugen и необычно тем, что для большинства говорящих ведёт себя как одно неотделяемое слово: ich staubsauge, ich habe gestaubsaugt. Разделённые формы ich sauge Staub и ich habe Staub gesaugt тоже нормативны и столь же часты, так что в тексте попадётся и то и другое. Машина — der Staubsauger. Главное ударение на Staub-, побочное на -saugen.'
      uk: 'Зібране з der Staub і saugen і незвичне тим, що для більшості мовців поводиться як одне невідокремлюване слово: ich staubsauge, ich habe gestaubsaugt. Розділені форми ich sauge Staub і ich habe Staub gesaugt теж нормативні та так само часті, тож у тексті трапиться і те й те. Машина — der Staubsauger. Головний наголос на Staub-, побічний на -saugen.'

  - de: Staub
    ipa: "ˈʃtaʊ̯p"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: the fine grey powder that settles on shelves and windowsills if nobody wipes them
    ru: мелкая серая пыль, оседающая на полках и подоконниках, если их не протирать
    uk: дрібний сірий пил, що осідає на полицях і підвіконнях, якщо їх не протирати
    example_de: Auf dem Regal liegt schon wieder Staub.
    example_en: There is dust on the shelf again.
    example_ru: На полке снова пыль.
    example_uk: На полиці знову пил.
    note:
      en: 'Masculine and a mass noun, so it takes no article of quantity and has no plural at all. The verbs beside it are Staub wischen, to dust, and staubsaugen above. The b at the end is devoiced to p, and the diphthong is the one of A1 das Haus. Figuratively sich aus dem Staub machen means to slip away before anybody notices.'
      ru: 'Мужской род, неисчисляемое, поэтому счётного артикля при нём не бывает и множественного числа нет вовсе. Рядом стоят обороты Staub wischen — «вытирать пыль» и staubsaugen выше. Конечное b оглушается в p, дифтонг — как в das Haus уровня A1. В переносном смысле sich aus dem Staub machen значит «улизнуть, пока не заметили».'
      uk: 'Чоловічий рід, незлічуване, тому лічильного артикля при ньому не буває і множини немає взагалі. Поряд стоять звороти Staub wischen — «витирати пил» і staubsaugen вище. Кінцеве b оглушується в p, дифтонг — як у das Haus рівня A1. У переносному сенсі sich aus dem Staub machen означає «вислизнути, поки не помітили».'

  - de: Schmutz
    ipa: "ˈʃmʊts"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: dirt in the neutral, general sense, as a cleaning product or a notice would name it
    ru: грязь в нейтральном, общем смысле — так, как её назовёт средство для уборки или объявление
    uk: бруд у нейтральному, загальному сенсі — так, як його назве засіб для прибирання чи оголошення
    example_de: Das Mittel entfernt auch alten Schmutz.
    example_en: The product removes old dirt as well.
    example_ru: Средство удаляет и застарелую грязь.
    example_uk: Засіб видаляє і застарілий бруд.
    note:
      en: 'The noun behind A1 schmutzig, and like it neutral in tone: a bottle of cleaner, a landlord''s letter and a school textbook all use this word. It has no plural. Der Dreck below says the same thing more bluntly and belongs to speech, not to a label — the pair is a register contrast worth hearing, because choosing the wrong one sounds either prissy or rude. The verb is schmutzig machen or verschmutzen.'
      ru: 'Существительное, стоящее за schmutzig уровня A1, и такое же нейтральное по тону: этим словом пользуются и флакон чистящего средства, и письмо домовладельца, и школьный учебник. Множественного числа нет. der Dreck ниже говорит то же самое грубее и принадлежит устной речи, а не этикетке; различие в регистре стоит слышать, потому что неверный выбор звучит либо жеманно, либо резко. Глагол — schmutzig machen или verschmutzen.'
      uk: 'Іменник, що стоїть за schmutzig рівня A1, і такий самий нейтральний за тоном: цим словом послуговуються і флакон засобу для чищення, і лист власника будинку, і шкільний підручник. Множини немає. der Dreck нижче каже те саме грубіше і належить усному мовленню, а не етикетці; різницю в регістрі варто чути, бо хибний вибір звучить або манірно, або різко. Дієслово — schmutzig machen або verschmutzen.'

  - de: Dreck
    ipa: "ˈdʁɛk"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: dirt as somebody complains about it, blunt and often with a note of anger
    ru: грязь в устах того, кто на неё жалуется, — резко и часто с досадой
    uk: бруд в устах того, хто на нього нарікає, — різко й часто з досадою
    example_de: Zieh die Schuhe aus, du bringst den ganzen Dreck herein!
    example_en: Take your shoes off, you are bringing all that muck in!
    example_ru: Разуйся, ты всю грязь тащишь в дом!
    example_uk: Роззуйся, ти весь бруд тягнеш до хати!
    note:
      en: 'Same referent as der Schmutz above, different register: this is the spoken, irritated word, the one a parent uses in the hallway and a cleaner uses about a bad job. No plural. It carries a family of dismissive idioms — Das geht dich einen Dreck an, that is none of your business, and Dreck am Stecken haben, to have something to hide. Never write it on a label or in a formal letter; there the word is Schmutz.'
      ru: 'Обозначает то же, что der Schmutz выше, но регистр другой: это разговорное, раздражённое слово — то, которое говорит родитель в прихожей и уборщица о плохо сделанной работе. Множественного числа нет. За ним тянется семейство пренебрежительных оборотов: Das geht dich einen Dreck an — «не твоё дело», Dreck am Stecken haben — «иметь рыльце в пушку». На этикетке и в официальном письме его не пишут: там Schmutz.'
      uk: 'Позначає те саме, що der Schmutz вище, але регістр інший: це розмовне, роздратоване слово — те, яке каже батько в передпокої і прибиральниця про погано зроблену роботу. Множини немає. За ним тягнеться родина зневажливих зворотів: Das geht dich einen Dreck an — «не твоя справа», Dreck am Stecken haben — «мати рильце в пушку». На етикетці й в офіційному листі його не пишуть: там Schmutz.'

  - de: Fleck
    ipa: "ˈflɛk"
    pos: noun
    gender: m
    plural: "die Flecken"
    cards: recognition
    en: a small area of a surface that has been discoloured by something spilt on it
    ru: небольшой участок поверхности, окрасившийся от того, что на него пролили
    uk: невелика ділянка поверхні, що забарвилася від того, що на неї пролили
    example_de: Der Fleck auf dem Hemd geht nicht mehr raus.
    example_en: The stain on the shirt will not come out any more.
    example_ru: Пятно на рубашке больше не выводится.
    example_uk: Пляма на сорочці більше не виводиться.
    note:
      en: 'Masculine, and the plural is die Flecken with -en. Named by what made it — der Fettfleck, der Rotweinfleck, der Kaffeefleck — and removed with der Fleckentferner. The verbs are einen Fleck machen and, of the stain itself, herausgehen. A second, older sense is a spot of ground, which survives in ein schöner Fleck Erde and in the town names ending in -fleck.'
      ru: 'Мужской род, множественное — die Flecken с -en. Называют его по причине: der Fettfleck, der Rotweinfleck, der Kaffeefleck, — а выводят при помощи der Fleckentferner. Обороты — einen Fleck machen, а о самом пятне говорят herausgehen. Второе, более старое значение — «клочок земли»; оно уцелело в ein schöner Fleck Erde и в названиях мест на -fleck.'
      uk: 'Чоловічий рід, множина — die Flecken з -en. Називають її за причиною: der Fettfleck, der Rotweinfleck, der Kaffeefleck, — а виводять за допомогою der Fleckentferner. Звороти — einen Fleck machen, а про саму пляму кажуть herausgehen. Друге, давніше значення — «клапоть землі»; воно вціліло в ein schöner Fleck Erde і в назвах місць на -fleck.'

  - de: Waschmittel
    ipa: "ˈvaʃˌmɪtl̩"
    pos: noun
    gender: n
    plural: "die Waschmittel"
    cards: recognition
    en: the powder or liquid you put into a washing machine to get clothes clean
    ru: порошок или жидкость, которые засыпают в стиральную машину, чтобы отстирать вещи
    uk: порошок або рідина, які засипають у пральну машину, щоб випрати речі
    example_de: Nimm bitte weniger Waschmittel, das reicht völlig.
    example_en: Please use less detergent, that is quite enough.
    example_ru: Клади поменьше порошка, этого вполне хватит.
    example_uk: Клади менше порошку, цього цілком вистачить.
    note:
      en: 'A1 waschen plus das Mittel, the means or agent — the same -mittel that builds das Lebensmittel and das Verkehrsmittel, which is worth noticing because it makes a dozen German words readable at once. Singular and plural are spelled alike. What goes into a dishwasher is das Spülmittel, and the softener beside it is der Weichspüler. A2 die Wäsche is the laundry itself.'
      ru: 'waschen уровня A1 плюс das Mittel — «средство»; тот же элемент -mittel строит das Lebensmittel и das Verkehrsmittel, и это стоит заметить: сразу становится читаемым десяток немецких слов. Единственное и множественное пишутся одинаково. В посудомоечную машину идёт das Spülmittel, а кондиционер рядом — der Weichspüler. die Wäsche уровня A2 — само бельё.'
      uk: 'waschen рівня A1 плюс das Mittel — «засіб»; той самий елемент -mittel будує das Lebensmittel і das Verkehrsmittel, і це варто помітити: одразу стає читабельним десяток німецьких слів. Однина і множина пишуться однаково. У посудомийну машину йде das Spülmittel, а кондиціонер поряд — der Weichspüler. die Wäsche рівня A2 — сама білизна.'

  - de: Bürste
    ipa: "ˈbʏʁstə"
    pos: noun
    gender: f
    plural: "die Bürsten"
    cards: recognition
    en: a handled tool with stiff bristles, used to scrub something or to tidy hair
    ru: щётка с жёсткой щетиной и ручкой, которой трут поверхность или расчёсывают волосы
    uk: щітка з жорсткою щетиною і ручкою, якою труть поверхню або розчісують волосся
    example_de: Nimm die Bürste, mit dem Tuch geht das nicht ab.
    example_en: Take the brush, it will not come off with the cloth.
    example_ru: Возьми щётку, тряпкой это не отойдёт.
    example_uk: Візьми щітку, ганчіркою це не відійде.
    note:
      en: 'The verb is bürsten, and the family is named by its job — die Zahnbürste, die Haarbürste, die Schuhbürste, die Klobürste. Keep it apart from der Pinsel, which is the soft brush a painter or a decorator uses; German never mixes the two. The ü is short and the r is the uvular one, so the middle of the word is a real ʁs cluster.'
      ru: 'Глагол — bürsten, а семейство называется по назначению: die Zahnbürste, die Haarbürste, die Schuhbürste, die Klobürste. Не смешивайте с der Pinsel — мягкой кистью художника или маляра; немецкий эти два предмета не путает. ü краткое, r увулярное, так что в середине слова стоит настоящее сочетание ʁs.'
      uk: 'Дієслово — bürsten, а родина зветься за призначенням: die Zahnbürste, die Haarbürste, die Schuhbürste, die Klobürste. Не змішуйте з der Pinsel — м’яким пензлем художника чи маляра; німецька ці два предмети не плутає. ü коротке, r увулярне, тож усередині слова стоїть справжня сполука ʁs.'

  # --- Was auf dem Tisch und im Schrank steht ---
  - de: Schüssel
    ipa: "ˈʃʏsl̩"
    pos: noun
    gender: f
    plural: "die Schüsseln"
    cards: recognition
    en: a deep round container that food is mixed in or served from, bigger than a plate
    ru: глубокая круглая посудина, в которой мешают или из которой подают еду, больше тарелки
    uk: глибока кругла посудина, у якій мішають або з якої подають їжу, більша за тарілку
    example_de: Der Salat steht in einer großen Schüssel auf dem Tisch.
    example_en: The salad is on the table in a big bowl.
    example_ru: Салат стоит на столе в большой миске.
    example_uk: Салат стоїть на столі у великій мисці.
    note:
      en: 'Feminine, plural in -n. It sits between A2 der Teller, which is flat and personal, and A1 der Topf, which goes on the heat: a Schüssel is for mixing, serving and carrying, never for cooking in. Named by content in the kitchen — die Salatschüssel, die Suppenschüssel. A satellite dish is die Satellitenschüssel, from the same shape.'
      ru: 'Женский род, множественное на -n. Стоит между der Teller уровня A2, который плоский и личный, и der Topf уровня A1, который ставят на огонь: Schüssel — для смешивания, подачи и переноски, но не для варки. На кухне называется по содержимому: die Salatschüssel, die Suppenschüssel. Спутниковая тарелка — die Satellitenschüssel, по той же форме.'
      uk: 'Жіночий рід, множина на -n. Стоїть між der Teller рівня A2, який плаский і особистий, і der Topf рівня A1, який ставлять на вогонь: Schüssel — для змішування, подавання й перенесення, але не для варіння. На кухні зветься за вмістом: die Salatschüssel, die Suppenschüssel. Супутникова тарілка — die Satellitenschüssel, за тією самою формою.'

  - de: Kanne
    ipa: "ˈkanə"
    pos: noun
    gender: f
    plural: "die Kannen"
    cards: recognition
    en: a tall container with a handle and a spout, for pouring a hot drink or water
    ru: высокий сосуд с ручкой и носиком, из которого разливают горячий напиток или воду
    uk: висока посудина з ручкою і носиком, з якої розливають гарячий напій або воду
    example_de: Auf dem Tisch steht eine Kanne frischer Kaffee.
    example_en: There is a pot of fresh coffee on the table.
    example_ru: На столе стоит кофейник со свежим кофе.
    example_uk: На столі стоїть кавник зі свіжою кавою.
    note:
      en: 'Feminine, plural in -n, and the compound says what is inside — die Kaffeekanne, die Teekanne, die Milchkanne, die Gießkanne for the watering can in a garden. As a measure it works like A2 die Tasse: eine Kanne Tee is what a café brings for two. Do not confuse it with die Dose (a tin) or die Flasche (a bottle), which are closed.'
      ru: 'Женский род, множественное на -n, а составное слово говорит, что внутри: die Kaffeekanne, die Teekanne, die Milchkanne, а в саду die Gießkanne — лейка. Как мера работает так же, как die Tasse уровня A2: eine Kanne Tee — то, что кафе приносит на двоих. Не путайте с die Dose — банкой и die Flasche — бутылкой: те закрыты.'
      uk: 'Жіночий рід, множина на -n, а складне слово каже, що всередині: die Kaffeekanne, die Teekanne, die Milchkanne, а в саду die Gießkanne — поливальниця. Як міра працює так само, як die Tasse рівня A2: eine Kanne Tee — те, що кав’ярня приносить на двох. Не плутайте з die Dose — банкою і die Flasche — пляшкою: ті закриті.'

  - de: Vase
    ipa: "ˈvaːzə"
    pos: noun
    gender: f
    plural: "die Vasen"
    cards: recognition
    en: a tall narrow container of glass or china that cut flowers are stood in
    ru: высокий узкий сосуд из стекла или фарфора, в который ставят срезанные цветы
    uk: висока вузька посудина зі скла чи порцеляни, у яку ставлять зрізані квіти
    example_de: Stell die Blumen bitte in die Vase auf dem Fensterbrett.
    example_en: Please put the flowers in the vase on the windowsill.
    example_ru: Поставь, пожалуйста, цветы в вазу на подоконнике.
    example_uk: Постав, будь ласка, квіти у вазу на підвіконні.
    note:
      en: 'Feminine, plural in -n, and the German pronunciation is worth fixing early: the v is spoken v, not f, because the word came in from French, and the a is long. That makes it one of the small group where German v behaves as it does in Vase, Vitamin and Villa rather than as in Vater. Flowers go in die Vase with the accusative when you put them there and stand in der Vase with the dative afterwards.'
      ru: 'Женский род, множественное на -n, и немецкое произношение стоит закрепить сразу: v здесь звучит как «в», а не как «ф», потому что слово пришло из французского, и a долгое. Это одна из немногих групп, где немецкое v ведёт себя как в Vase, Vitamin и Villa, а не как в Vater. Цветы ставят in die Vase с винительным, а стоят они потом in der Vase с дательным.'
      uk: 'Жіночий рід, множина на -n, і німецьку вимову варто закріпити одразу: v тут звучить як «в», а не як «ф», бо слово прийшло з французької, і a довге. Це одна з небагатьох груп, де німецьке v поводиться як у Vase, Vitamin і Villa, а не як у Vater. Квіти ставлять in die Vase зі знахідним, а стоять вони потім in der Vase з давальним.'

  - de: Spiegel
