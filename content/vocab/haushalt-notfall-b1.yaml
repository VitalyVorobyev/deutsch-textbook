    example_uk: Витри це, будь ласка, вологою ганчіркою.
    note:
      en: 'Neuter, with an umlaut and -er in the plural. Alone it is the general piece of cloth; the compound names the job, and there are many — A2 das Handtuch for drying hands, das Halstuch worn at the neck, das Kopftuch on the head, das Geschirrtuch for drying dishes, and das Taschentuch below. Do not confuse it with der Stoff, which is fabric by the metre before anything is cut from it.'
      ru: 'Средний род, во множественном умлаут и -er. Само по себе — общий кусок ткани; работу называет составное слово, и таких много: das Handtuch уровня A2 — вытирать руки, das Halstuch — на шею, das Kopftuch — на голову, das Geschirrtuch — для посуды, и das Taschentuch ниже. Не путайте с der Stoff — тканью в рулоне, из которой ещё ничего не выкроили.'
      uk: 'Середній рід, у множині умлаут і -er. Саме по собі — загальний шматок тканини; роботу називає складне слово, і таких багато: das Handtuch рівня A2 — витирати руки, das Halstuch — на шию, das Kopftuch — на голову, das Geschirrtuch — для посуду, і das Taschentuch нижче. Не плутайте з der Stoff — тканиною в рулоні, з якої ще нічого не викроїли.'

