    note:
      en: 'Masculine, and singular and plural are spelled alike. In a car it is der Rückspiegel and der Außenspiegel, and a fried egg is das Spiegelei, named after the shiny yolk. The verb spiegeln means to reflect, and sich spiegeln to be reflected. Careful with the opening cluster: sp- before a vowel is spoken ʃp-, so the word begins as if written schp-.'
      ru: 'Мужской род, единственное и множественное пишутся одинаково. В машине это der Rückspiegel и der Außenspiegel, а яичница-глазунья — das Spiegelei, по блестящему желтку. Глагол spiegeln значит «отражать», sich spiegeln — «отражаться». Осторожно с начальным сочетанием: sp- перед гласным звучит как ʃp-, то есть слово начинается будто написано schp-.'
      uk: 'Чоловічий рід, однина і множина пишуться однаково. У машині це der Rückspiegel і der Außenspiegel, а яєчня-очко — das Spiegelei, за блискучим жовтком. Дієслово spiegeln означає «відбивати», sich spiegeln — «відбиватися». Обережно з початковою сполукою: sp- перед голосним звучить як ʃp-, тобто слово починається наче написане schp-.'

