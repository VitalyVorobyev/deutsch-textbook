    example_en: My mother sews most of her dresses herself.
    example_ru: Мама шьёт большинство платьев сама.
    example_uk: Мама шиє більшість суконь сама.
    note:
      en: 'Weak and regular, with haben. The machine is die Nähmaschine and the trade die Schneiderei. A surgeon uses the same verb — die Wunde wird genäht — which is one of the few places where a household word and a hospital word coincide exactly. Beside it, annähen is to sew something on, such as a button, and zunähen is to sew a hole shut. The ä is long.'
      ru: 'Слабый и правильный, с haben. Машина — die Nähmaschine, ремесло — die Schneiderei. Хирург пользуется тем же глаголом: die Wunde wird genäht, — и это один из немногих случаев, когда бытовое слово и больничное совпадают точь-в-точь. Рядом annähen — «пришить» (например, пуговицу), zunähen — «зашить» дырку. ä долгое.'
      uk: 'Слабке й правильне, із haben. Машина — die Nähmaschine, ремесло — die Schneiderei. Хірург користується тим самим дієсловом: die Wunde wird genäht, — і це один із небагатьох випадків, коли побутове слово і лікарняне збігаються точнісінько. Поряд annähen — «пришити» (наприклад, ґудзик), zunähen — «зашити» дірку. ä довге.'

