      ru: 'Мужской род, во множественном умлаут. Живёт в ящике с инструментами рядом с der Nagel ниже, а глагол — hämmern. В разговорной речи голое слово выражает и восторг, и оторопь: Das Konzert war der Hammer значит «концерт был потрясающий», а Das ist ja ein Hammer! в зависимости от лица говорящего может значить обратное. В рояле внутри тоже Hämmer — молоточки.'
      uk: 'Чоловічий рід, у множині умлаут. Живе у скриньці з інструментами поряд із der Nagel нижче, а дієслово — hämmern. У розмовному мовленні голе слово виражає і захват, і оторопіння: Das Konzert war der Hammer означає «концерт був приголомшливий», а Das ist ja ein Hammer! залежно від обличчя мовця може означати протилежне. У роялі всередині теж Hämmer — молоточки.'

