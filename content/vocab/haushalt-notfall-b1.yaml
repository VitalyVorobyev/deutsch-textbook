    note:
      en: 'Neuter, and singular and plural are spelled alike. One word does two jobs that English separates, and a compound settles it where the sentence does not — das Kopfkissen is the pillow you sleep on, das Sofakissen the cushion you lean against. It is not to be confused with the verb küssen, to kiss, which differs only in the vowel. The blanket beside it is die Bettdecke.'
      ru: 'Средний род, единственное и множественное пишутся одинаково. Одно слово делает две работы, которые русский разводит на «подушку» и «диванную подушку», и там, где предложение не проясняет, уточняет составное слово: das Kopfkissen — та, на которой спят, das Sofakissen — та, на которую опираются. Не путайте с глаголом küssen — «целовать»: разница только в гласном. Одеяло рядом — die Bettdecke.'
      uk: 'Середній рід, однина і множина пишуться однаково. Одне слово виконує дві роботи, які українська розводить на «подушку» і «диванну подушку», і там, де речення не прояснює, уточнює складне слово: das Kopfkissen — та, на якій сплять, das Sofakissen — та, на яку спираються. Не плутайте з дієсловом küssen — «цілувати»: різниця лише в голосному. Ковдра поряд — die Bettdecke.'

  - de: Schachtel
    ipa: "ˈʃaxtl̩"
