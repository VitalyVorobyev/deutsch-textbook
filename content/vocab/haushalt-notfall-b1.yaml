    note:
      en: 'Feminine, plural in -n. The thread through the eye is der Faden. The same word covers a doctor''s needle (die Spritze is the syringe as a whole), the knitting needle die Stricknadel, the pin die Stecknadel and the pine needle die Tannennadel, so the compound is what tells you which one. The a is long and the l at the end is syllabic.'
      ru: 'Женский род, множественное на -n. Нитка в ушке — der Faden. Тем же словом называют иглу у врача (шприц целиком — die Spritze), спицу die Stricknadel, булавку die Stecknadel и хвоинку die Tannennadel, так что различает их составное слово. a долгое, а конечное l слоговое.'
      uk: 'Жіночий рід, множина на -n. Нитка у вушку — der Faden. Тим самим словом звуть голку в лікаря (шприц цілком — die Spritze), спицю die Stricknadel, шпильку die Stecknadel і хвоїнку die Tannennadel, тож розрізняє їх складне слово. a довге, а кінцеве l складове.'

  - de: nähen
    ipa: "ˈnɛːən"
    pos: verb
