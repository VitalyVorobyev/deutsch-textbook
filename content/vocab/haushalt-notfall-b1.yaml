    note:
      en: 'A1 die Tasche plus das Tuch above, and it means the pocket-sized one specifically. The paper kind is what a German actually hands you, and in speech many people simply say ein Tempo, after the brand, the way English once said Kleenex. Plural takes an umlaut and -er, following its second half. The verb it goes with is sich die Nase putzen.'
      ru: 'die Tasche уровня A1 плюс das Tuch выше, и значит именно карманный. Дают вам чаще всего бумажный, а в разговоре многие просто скажут ein Tempo — по названию марки; этот случай уже отмечен в списке B1. Множественное берёт умлаут и -er вслед за второй половиной. Глагол при нём — sich die Nase putzen.'
      uk: 'die Tasche рівня A1 плюс das Tuch вище, і означає саме кишенькову. Дають вам найчастіше паперову, а в розмові багато хто просто скаже ein Tempo — за назвою марки; цей випадок уже позначено у списку B1. Множина бере умлаут і -er услід за другою половиною. Дієслово при ньому — sich die Nase putzen.'

  - de: Nadel
    ipa: "ˈnaːdl̩"
