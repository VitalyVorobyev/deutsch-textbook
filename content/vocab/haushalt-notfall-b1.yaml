      ru: 'В немецком единственное число там, где по-русски множественное: eine Zange — «плоскогубцы», а не «пара» чего-либо. Вид называет составное слово: die Kombizange — комбинированные, die Beißzange — кусачки, die Kneifzange — клещи, die Zuckerzange — щипцы для сахара. z читается как «ц», а ng — один носовой звук, без «г» после него.'
      uk: 'У німецькій однина там, де українською множина: eine Zange — «плоскогубці», а не «пара» чогось. Вид називає складне слово: die Kombizange — комбіновані, die Beißzange — кусачки, die Kneifzange — обценьки, die Zuckerzange — щипці для цукру. z читається як «ц», а ng — один носовий звук, без «ґ» після нього.'

