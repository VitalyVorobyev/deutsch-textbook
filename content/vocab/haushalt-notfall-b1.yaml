    ru: маленькая лёгкая коробка из тонкого картона, в какой продают сигареты, спички или конфеты
    uk: маленька легка коробка з тонкого картону, у якій продають сигарети, сірники чи цукерки
    example_de: Er hat eine Schachtel Pralinen mitgebracht.
