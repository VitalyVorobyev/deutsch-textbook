      en: 'Switzerland. B1 der Hausmeister in the deck `regeln-verantwortung` is what Germany and Austria say. It is built on warten in its older sense of tending and looking after something, the same sense that gives die Wartung, maintenance, and not on the modern sense of waiting. Masculine, plural in -e, and the b is devoiced before the w: ˈap-. The feminine is the next entry.'
      ru: 'Швейцария. der Hausmeister уровня B1 из колоды `regeln-verantwortung` — то, что говорят Германия и Австрия. Слово построено на warten в старом значении «ухаживать, содержать в порядке» — том самом, что даёт die Wartung, «техобслуживание», — а не в современном «ждать». Мужской род, множественное на -e, а b перед w оглушается: ˈap-. Женская пара — следующая запись.'
      uk: 'Швейцарія. der Hausmeister рівня B1 з колоди `regeln-verantwortung` — те, що кажуть Німеччина й Австрія. Слово побудоване на warten у давньому значенні «доглядати, тримати в лад» — тому самому, що дає die Wartung, «технічне обслуговування», — а не в сучасному «чекати». Чоловічий рід, множина на -e, а b перед w оглушується: ˈap-. Жіноча пара — наступний запис.'

  - de: Abwartin
    ipa: "ˈapˌvaʁtɪn"
    pos: noun
    gender: f
    plural: "die Abwartinnen"
    cards: recognition
    en: the woman who looks after a building and everything that belongs to it
    ru: женщина, которая следит за домом и всем, что к нему относится
    uk: жінка, яка доглядає будинок і все, що до нього належить
    example_de: Die Abwartin wohnt im Erdgeschoss.
    example_en: The caretaker lives on the ground floor.
    example_ru: Комендантша живёт на первом этаже.
    example_uk: Комендантка живе на першому поверсі.
    note:
      en: 'Regular Movierung with -in on the masculine above, with no change to the stem and a doubled n in the plural. A Swiss notice board writes the pair out as Abwart/Abwartin, exactly as a German one writes Hausmeister/Hausmeisterin, and B1 der Hausmeister in the deck `regeln-verantwortung` is the German half.'
      ru: 'Обычное мовирование на -in от мужской формы выше, без изменений в основе и с удвоенным n во множественном. Швейцарская доска объявлений выписывает пару как Abwart/Abwartin, ровно как немецкая пишет Hausmeister/Hausmeisterin, а немецкая половина — der Hausmeister уровня B1 из колоды `regeln-verantwortung`.'
      uk: 'Звичайна моція на -in від чоловічої форми вище, без змін в основі і з подвоєним n у множині. Швейцарська дошка оголошень виписує пару як Abwart/Abwartin, точно як німецька пише Hausmeister/Hausmeisterin, а німецька половина — der Hausmeister рівня B1 з колоди `regeln-verantwortung`.'

  - de: Pöstler
    ipa: "ˈpœstlɐ"
    pos: noun
    gender: m
    plural: "die Pöstler"
    cards: recognition
    en: the man who brings the letters and parcels to the door
    ru: мужчина, который приносит письма и посылки к двери
    uk: чоловік, який приносить листи й посилки до дверей
    example_de: Der Pöstler kommt jeden Morgen um neun.
    example_en: The postman comes at nine every morning.
    example_ru: Почтальон приходит каждое утро в девять.
    example_uk: Листоноша приходить щоранку о дев’ятій.
    note:
      en: 'Switzerland. B1 der Briefträger in the deck `berufe-b1` is what Germany and Austria say. It is built straight on A1 die Post in the deck `stadt-wege` with the -ler that German uses for the person belonging to a thing, as in B1 der Sportler in the deck `sport-freizeit-b1` and B1 der Wissenschaftler in the deck `wissenschaft-technik-b1`; the ö is the umlaut that ending brings with it. Masculine, singular and plural spelled alike, and it covers anybody who works for the post, not only the one on the round.'
      ru: 'Швейцария. der Briefträger уровня B1 из колоды `berufe-b1` — то, что говорят Германия и Австрия. Слово построено прямо на die Post уровня A1 из колоды `stadt-wege` с суффиксом -ler, которым немецкий называет человека при вещи, как в der Sportler уровня B1 из колоды `sport-freizeit-b1` и der Wissenschaftler уровня B1 из колоды `wissenschaft-technik-b1`; ö — умлаут, который этот суффикс приносит с собой. Мужской род, единственное и множественное пишутся одинаково, и слово покрывает всякого, кто работает на почте, а не только разносчика.'
      uk: 'Швейцарія. der Briefträger рівня B1 з колоди `berufe-b1` — те, що кажуть Німеччина й Австрія. Слово побудоване просто на die Post рівня A1 з колоди `stadt-wege` із суфіксом -ler, яким німецька зве людину при речі, як у der Sportler рівня B1 з колоди `sport-freizeit-b1` і der Wissenschaftler рівня B1 з колоди `wissenschaft-technik-b1`; ö — умлаут, який цей суфікс приносить із собою. Чоловічий рід, однина і множина пишуться однаково, і слово покриває кожного, хто працює на пошті, а не лише рознощика.'

  - de: Pöstlerin
    ipa: "ˈpœstləʁɪn"
    pos: noun
    gender: f
    plural: "die Pöstlerinnen"
    cards: recognition
    en: the woman who brings the letters and parcels to the door
    ru: женщина, которая приносит письма и посылки к двери
    uk: жінка, яка приносить листи й посилки до дверей
    example_de: Die Pöstlerin bringt das Paket am Nachmittag.
    example_en: The postwoman is bringing the parcel in the afternoon.
    example_ru: Почтальонка принесёт посылку после обеда.
    example_uk: Листоноша принесе посилку по обіді.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n; B1 die Briefträgerin in the deck `berufe-b1` is the German word. The manifest is worth a glance here: it lists the masculine under B, beside Briefträger, and the feminine far away under P, because its order follows the German sibling rather than the alphabet. That is how the whole Austrian and Swiss column is arranged.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается; die Briefträgerin уровня B1 из колоды `berufe-b1` — немецкое слово. На список тут стоит взглянуть: мужскую форму он даёт под буквой B, рядом с Briefträger, а женскую — далеко, под P, потому что порядок следует за немецкой парой, а не за алфавитом. Так устроен весь австрийско-швейцарский столбец.'
      uk: 'Звичайна моція на -in, у множині n подвоюється; die Briefträgerin рівня B1 з колоди `berufe-b1` — німецьке слово. На список тут варто глянути: чоловічу форму він подає під літерою B, поряд із Briefträger, а жіночу — далеко, під P, бо порядок іде за німецькою парою, а не за абеткою. Так побудовано весь австрійсько-швейцарський стовпець.'

  # --- Wenn das Arbeitsleben endet ---
  - de: Pensionist
    ipa: "pɛnzi̯oˈnɪst"
    pos: noun
    gender: m
    plural: "die Pensionisten"
    cards: recognition
    en: a man who has stopped working and lives on what he draws each month
    ru: мужчина, который перестал работать и живёт на то, что получает каждый месяц
    uk: чоловік, який перестав працювати і живе з того, що дістає щомісяця
    example_de: Als Pensionist fährt er jeden Sommer nach Italien.
    example_en: As a pensioner he goes to Italy every summer.
    example_ru: Будучи пенсионером, он каждое лето ездит в Италию.
    example_uk: Бувши пенсіонером, він щоліта їздить до Італії.
    note:
      en: 'Austria. A2 der Rentner in the deck `berufe-a2` is what Germany says. An n-declension noun, so den, dem and des Pensionisten all carry the n and the plural has it too. The money itself is die Pension in Austria, and B1 die Pension in the deck `reisen-laender-b1` already carries that second sense beside the guesthouse one; Germany calls the money B1 die Rente in the deck `arbeit-beruf-b1`.'
      ru: 'Австрия. der Rentner уровня A2 из колоды `berufe-a2` — то, что говорит Германия. Существительное слабого склонения: den, dem и des Pensionisten несут n, и во множественном оно тоже есть. Сами деньги в Австрии — die Pension, и die Pension уровня B1 из колоды `reisen-laender-b1` уже несёт это второе значение рядом с «пансионом»; Германия зовёт эти деньги die Rente уровня B1 из колоды `arbeit-beruf-b1`.'
      uk: 'Австрія. der Rentner рівня A2 з колоди `berufe-a2` — те, що каже Німеччина. Іменник слабкої відміни: den, dem і des Pensionisten несуть n, і в множині воно теж є. Самі гроші в Австрії — die Pension, і die Pension рівня B1 з колоди `reisen-laender-b1` уже несе це друге значення поряд із «пансіоном»; Німеччина зве ці гроші die Rente рівня B1 з колоди `arbeit-beruf-b1`.'

  - de: Pensionistin
    ipa: "pɛnzi̯oˈnɪstɪn"
    pos: noun
    gender: f
    plural: "die Pensionistinnen"
    cards: recognition
    en: a woman who has stopped working and lives on what she draws each month
    ru: женщина, которая перестала работать и живёт на то, что получает каждый месяц
    uk: жінка, яка перестала працювати і живе з того, що дістає щомісяця
    example_de: Die Pensionistin arbeitet noch ein paar Stunden im Museum.
    example_en: The pensioner still works a few hours in the museum.
    example_ru: Пенсионерка ещё работает несколько часов в музее.
    example_uk: Пенсіонерка ще працює кілька годин у музеї.
    note:
      en: 'Regular Movierung with -in, and adding it takes the n-declension away: die Pensionistin keeps one form throughout the singular. A2 die Rentnerin in the deck `berufe-a2` is Germany''s word. How a person gets into this state is the phrase in Pension gehen/sein below in Austria, and pensioniert werden/sein in Switzerland.'
      ru: 'Обычное мовирование на -in, и вместе с ним уходит слабое склонение: die Pensionistin сохраняет одну форму во всём единственном числе. die Rentnerin уровня A2 из колоды `berufe-a2` — слово Германии. Как в это состояние попадают, говорит оборот in Pension gehen/sein ниже в Австрии и pensioniert werden/sein в Швейцарии.'
      uk: 'Звичайна моція на -in, і разом із ним зникає слабка відміна: die Pensionistin зберігає одну форму в усій однині. die Rentnerin рівня A2 з колоди `berufe-a2` — слово Німеччини. Як у цей стан потрапляють, каже зворот in Pension gehen/sein нижче в Австрії і pensioniert werden/sein у Швейцарії.'

  - de: in Pension gehen/sein
    ipa: "ɪn pɛnˈzi̯oːn ˈgeːənˈzaɪ̯n"
    pos: phrase
    # Recognition only, and for the same reason as the German sibling in arbeit-beruf-b1:
    # a slash headword cannot tell the card which of the two verbs it wants.
    cards: recognition
    en: to retire, and to be retired, in the Austrian wording
    ru: выходить на пенсию и быть на пенсии — так это говорят в Австрии
    uk: виходити на пенсію і бути на пенсії — так це кажуть в Австрії
    example_de: Mein Onkel geht im Jänner in Pension, meine Tante ist schon in Pension.
    example_en: My uncle retires in January, my aunt is already retired.
    example_ru: Мой дядя выходит на пенсию в январе, а тётя уже на пенсии.
    example_uk: Мій дядько виходить на пенсію в січні, а тітка вже на пенсії.
    note:
      en: 'Austria''s way of saying it, and it is built exactly like the German one: no article at all, so in Pension and never in die Pension, the movement verb for the step and the state verb for the situation afterwards, and the Perfekt of the first with sein — Er ist im Jänner in Pension gegangen. Germany says in Rente gehen/sein, which B1 `arbeit-beruf-b1` ships and whose note already names this phrase. Switzerland says pensioniert werden/sein, the next entry.'
      ru: 'Австрийский способ сказать это, и устроен он в точности как немецкий: артикля нет вовсе, поэтому in Pension, а не in die Pension; глагол движения — для самого шага, глагол состояния — для положения после, а Perfekt первого с sein: Er ist im Jänner in Pension gegangen. Германия говорит in Rente gehen/sein — оборот из колоды `arbeit-beruf-b1` уровня B1, и его примечание уже называет этот. Швейцария говорит pensioniert werden/sein, следующая запись.'
      uk: 'Австрійський спосіб сказати це, і побудований він точно як німецький: артикля немає зовсім, тому in Pension, а не in die Pension; дієслово руху — для самого кроку, дієслово стану — для становища після, а Perfekt першого з sein: Er ist im Jänner in Pension gegangen. Німеччина каже in Rente gehen/sein — зворот із колоди `arbeit-beruf-b1` рівня B1, і його примітка вже називає цей. Швейцарія каже pensioniert werden/sein, наступний запис.'

  - de: pensioniert werden/sein
    ipa: "pɛnzi̯oˈniːɐ̯t ˈveːɐ̯dn̩ˈzaɪ̯n"
    pos: phrase
    cards: recognition
    en: to be retired by one's employer, and to be in retirement, in the Swiss wording
    ru: быть отправленным на пенсию работодателем и находиться на пенсии — так это говорят в Швейцарии
    uk: бути відправленим на пенсію роботодавцем і перебувати на пенсії — так це кажуть у Швейцарії
    example_de: Sie wurde letztes Jahr pensioniert und ist jetzt viel unterwegs.
    example_en: She was retired last year and now travels a great deal.
    example_ru: Её отправили на пенсию в прошлом году, и теперь она много путешествует.
    example_uk: Її відправили на пенсію торік, і тепер вона багато мандрує.
    note:
      en: 'Switzerland''s way of saying it, and it is built quite differently from the Austrian phrase above: this one is a passive, so the employer or the law does the retiring and the person it happens to stands in the nominative. Sie wurde pensioniert is the step, er ist pensioniert the state afterwards. Germany says in Rente gehen/sein in the deck `arbeit-beruf-b1`, whose note already names both of these; going early is die Frühpensionierung.'
      ru: 'Швейцарский способ сказать это, и устроен он совсем иначе, чем австрийский оборот выше: здесь пассив, так что на пенсию отправляет работодатель или закон, а тот, с кем это происходит, стоит в именительном. Sie wurde pensioniert — это шаг, er ist pensioniert — состояние после. Германия говорит in Rente gehen/sein из колоды `arbeit-beruf-b1`, и её примечание уже называет оба эти оборота; уход раньше срока — die Frühpensionierung.'
      uk: 'Швейцарський спосіб сказати це, і побудований він зовсім інакше, ніж австрійський зворот вище: тут пасив, тож на пенсію відправляє роботодавець або закон, а той, із ким це стається, стоїть у називному. Sie wurde pensioniert — це крок, er ist pensioniert — стан після. Німеччина каже in Rente gehen/sein із колоди `arbeit-beruf-b1`, і її примітка вже називає обидва ці звороти; вихід раніше строку — die Frühpensionierung.'
