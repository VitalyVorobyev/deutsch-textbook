# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the Austrian and Swiss
# institutional field of data/goethe-b1-wortliste.txt: the school a child goes to, the
# mark it brings home, the chamber that makes the law, the counter that issues the card
# and the word for the day the working life stops. These are the rows the manifest
# prints beside their Germany-German siblings — Grundschule/Volksschule/Primarschule,
# Abitur/Matura, Bundestag/Nationalrat, Führerschein/Führerausweis — because the exam
# expects a B1 reader to recognise a Swiss form and an Austrian school report.
# The German half is shipped and stays the production card: B1's `bildung-schulsystem-b1`
# owns Grundschule, Hauptschule, Realschule, Gymnasium, Fachhochschule and the number
# nouns Eins to Sechs, A2's `schule-faecher-a2` owns Abitur, Note and Kindergarten,
# B1's `lernen-zukunft` owns Berufsschule, B1's `sprechen-lernen-b1` owns Klassenarbeit,
# A1's `schule-arbeit` owns Prüfung, Hausaufgabe and Führerschein, B1's `politik-staat-b1`
# owns Bundestag, Regierung, Minister, Bundesland, Gemeinde and Bürgermeister(in), A2's
# `laender-nationalitaeten-a2` owns Schweiz and Österreich, A1's `reisen-urlaub` owns
# Bahnsteig, Gleis and Fahrkarte, B1's `einkaufen-geld-b1` owns Geldautomat, Chipkarte and
# abheben, B1's `verwaltung-behoerden-b1` owns Versichertenkarte and Personenstand, B1's
# `beziehungen-familie-b1` owns Familienstand, A2's `termine-zeit` owns Praxis, B1's
# `regeln-verantwortung` owns Hausmeister, B1's `berufe-b1` owns Briefträger(in), A2's
# `berufe-a2` owns Rentner(in) and B1's `arbeit-beruf-b1` owns Rente and in Rente
# gehen/sein. This deck is the other column.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read, never written: the learner fills in German forms, and everything here is what an
# Austrian school report, a Swiss ballot paper and a counter in Bern say back at him.
id: varianten-at-ch-institutionen-b1
title_de: "Österreichisch und Schweizerisch: Schule, Staat und Ämter"
title_en: "Austrian and Swiss words: school, state and public offices"
title_ru: "Австрийское и швейцарское: школа, государство и учреждения"
title_uk: "Австрійське і швейцарське: школа, держава та установи"
level: B1
entries:
  # --- In welche Schule ein Kind geht ---
  - de: Volksschule
    ipa: "ˈfɔlksˌʃuːlə"
    pos: noun
    gender: f
    plural: "die Volksschulen"
    cards: recognition
    en: the school every child begins at, covering the first four years
    ru: школа, с которой начинают все дети и которая занимает первые четыре года
    uk: школа, з якої починають усі діти і яка займає перші чотири роки
    example_de: Meine Tochter geht seit September in die Volksschule.
    example_en: My daughter has been at primary school since September.
    example_ru: Моя дочь с сентября ходит в начальную школу.
    example_uk: Моя донька від вересня ходить до початкової школи.
    note:
      en: 'Austria: four years, from about six to about ten, and it is the school all children attend together before the tracks separate. Germany says B1 die Grundschule in the deck `bildung-schulsystem-b1`, Switzerland die Primarschule below. Feminine, plural in -n, primary stress on Volks-. What follows in Austria is either die AHS, the next entry, or the other lower secondary track.'
      ru: 'Австрия: четыре года, примерно с шести до десяти, и это школа, где все дети учатся вместе до разделения на ветви. Германия говорит die Grundschule уровня B1 из колоды `bildung-schulsystem-b1`, Швейцария — die Primarschule ниже. Женский род, множественное на -n, главное ударение на Volks-. Дальше в Австрии идут либо die AHS, следующая запись, либо другая ветвь средней школы.'
      uk: 'Австрія: чотири роки, приблизно від шести до десяти, і це школа, де всі діти вчаться разом до поділу на гілки. Німеччина каже die Grundschule рівня B1 з колоди `bildung-schulsystem-b1`, Швейцарія — die Primarschule нижче. Жіночий рід, множина на -n, головний наголос на Volks-. Далі в Австрії йдуть або die AHS, наступний запис, або інша гілка середньої школи.'

  - de: AHS
    ipa: "aːhaːˈʔɛs"
    pos: noun
    gender: f
    plural: "die AHS"
    cards: recognition
    en: the academic secondary school that runs from about the age of ten to the leaving examination
    ru: академическая средняя школа, идущая примерно с десяти лет до выпускного экзамена
    uk: академічна середня школа, що йде приблизно з десяти років до випускного іспиту
    example_de: Nach der Volksschule wechselt er in die AHS.
    example_en: After primary school he moves on to the academic secondary school.
    example_ru: После начальной школы он переходит в гимназию.
    example_uk: Після початкової школи він переходить до гімназії.
    note:
      en: 'Austria. The letters stand for allgemeinbildende höhere Schule, and nobody says the long form: it is die AHS, spelled out A-H-S with the stress on the last letter, the same way A2 der Lkw in the deck `verkehr-unterwegs-a2` and B1 das Kfz in the deck `verkehr-auto-b1` are read. Feminine, because die Schule is, and the plural is spelled the same. Germany''s nearest thing is B1 das Gymnasium in the deck `bildung-schulsystem-b1`, and what it ends in is die Matura below.'
      ru: 'Австрия. Буквы означают allgemeinbildende höhere Schule, и полную форму вслух не произносит никто: это die AHS, по буквам A-H-S с ударением на последней, — так же читают der Lkw уровня A2 из колоды `verkehr-unterwegs-a2` и das Kfz уровня B1 из колоды `verkehr-auto-b1`. Женский род, потому что die Schule, а множественное пишется так же. Ближайшее у Германии — das Gymnasium уровня B1 из колоды `bildung-schulsystem-b1`, а заканчивается всё это словом die Matura ниже.'
      uk: 'Австрія. Літери означають allgemeinbildende höhere Schule, і повної форми вголос не вимовляє ніхто: це die AHS, по літерах A-H-S з наголосом на останній, — так само читають der Lkw рівня A2 з колоди `verkehr-unterwegs-a2` і das Kfz рівня B1 з колоди `verkehr-auto-b1`. Жіночий рід, бо die Schule, а множина пишеться так само. Найближче в Німеччини — das Gymnasium рівня B1 з колоди `bildung-schulsystem-b1`, а закінчується все це словом die Matura нижче.'

  - de: BHS
    ipa: "beːhaːˈʔɛs"
    pos: noun
    gender: f
    plural: "die BHS"
    cards: recognition
    en: the upper secondary school that teaches a trade and ends in the same leaving examination
    ru: старшая школа, которая учит профессии и заканчивается тем же выпускным экзаменом
    uk: старша школа, що навчає фаху і закінчується тим самим випускним іспитом
    example_de: Die BHS dauert fünf Jahre und endet mit der Matura.
    example_en: The vocational upper secondary school lasts five years and ends with the leaving examination.
    example_ru: BHS длится пять лет и заканчивается экзаменом на аттестат.
    example_uk: BHS триває п’ять років і закінчується іспитом на атестат.
    note:
      en: 'Austria: berufsbildende höhere Schule, read out letter by letter like die AHS above. It runs five years and gives two things at once, a qualification for a job and the right to go to university, because it ends in die Matura below as well. Feminine, unchanged in the plural. Germany keeps those two things apart, in B1 die Berufsschule in the deck `lernen-zukunft` and B1 das Gymnasium in the deck `bildung-schulsystem-b1`.'
      ru: 'Австрия: berufsbildende höhere Schule, читается по буквам, как die AHS выше. Идёт пять лет и даёт сразу две вещи — профессию и право на университет, потому что тоже заканчивается die Matura ниже. Женский род, во множественном не меняется. Германия эти две вещи разводит: die Berufsschule уровня B1 из колоды `lernen-zukunft` и das Gymnasium уровня B1 из колоды `bildung-schulsystem-b1`.'
      uk: 'Австрія: berufsbildende höhere Schule, читається по літерах, як die AHS вище. Іде п’ять років і дає одразу дві речі — фах і право на університет, бо теж закінчується die Matura нижче. Жіночий рід, у множині не змінюється. Німеччина ці дві речі розводить: die Berufsschule рівня B1 з колоди `lernen-zukunft` і das Gymnasium рівня B1 з колоди `bildung-schulsystem-b1`.'

  - de: Spielgruppe
    ipa: "ˈʃpiːlˌgʁʊpə"
    pos: noun
    gender: f
    plural: "die Spielgruppen"
    cards: recognition
    en: a group where small children come together to play for a few hours a week before school begins
    ru: группа, где малыши по нескольку часов в неделю играют вместе ещё до школы
    uk: група, де малята по кілька годин на тиждень граються разом іще до школи
    example_de: Das Kind geht zweimal pro Woche in die Spielgruppe.
    example_en: The child goes to the playgroup twice a week.
    example_ru: Ребёнок ходит в игровую группу два раза в неделю.
    example_uk: Дитина ходить до ігрової групи двічі на тиждень.
    note:
      en: 'Switzerland, and it stands before what Germany would call the Kindergarten: a child of about three goes a morning or two a week, without an obligation and without a curriculum. The Swiss Kindergarten that follows belongs to the school system rather than standing before it, which is the difference from A2 der Kindergarten in the deck `schule-faecher-a2`. Feminine, plural in -n.'
      ru: 'Швейцария, и это ступень перед тем, что Германия назвала бы Kindergarten: ребёнок лет трёх ходит одно-два утра в неделю, без обязанности и без программы. Швейцарский Kindergarten, идущий следом, относится уже к школьной системе, а не стоит перед ней, — в этом и отличие от der Kindergarten уровня A2 из колоды `schule-faecher-a2`. Женский род, множественное на -n.'
      uk: 'Швейцарія, і це щабель перед тим, що Німеччина назвала б Kindergarten: дитина років трьох ходить один-два ранки на тиждень, без обов’язку і без програми. Швейцарський Kindergarten, що йде слідом, належить уже до шкільної системи, а не стоїть перед нею, — у цьому й відмінність від der Kindergarten рівня A2 з колоди `schule-faecher-a2`. Жіночий рід, множина на -n.'

  - de: Primarschule
    ipa: "pʁiˈmaːɐ̯ˌʃuːlə"
    pos: noun
    gender: f
    plural: "die Primarschulen"
    cards: recognition
    en: the first stage of school, which all children attend together
    ru: первая ступень школы, которую все дети проходят вместе
    uk: перший щабель школи, який усі діти проходять разом
    example_de: Die Primarschule dauert in den meisten Kantonen sechs Jahre.
    example_en: In most cantons primary school lasts six years.
    example_ru: В большинстве кантонов начальная школа длится шесть лет.
    example_uk: У більшості кантонів початкова школа триває шість років.
    note:
      en: 'Switzerland; six years in most cantons, and the Latin primus, first, is visible in the name. Germany says B1 die Grundschule in the deck `bildung-schulsystem-b1` and Austria die Volksschule above, and all three name the same stage. Feminine, plural in -n, stress on -mar-. What follows is die Sekundarschule, the next entry.'
      ru: 'Швейцария; в большинстве кантонов шесть лет, а латинское primus — «первый» — видно прямо в названии. Германия говорит die Grundschule уровня B1 из колоды `bildung-schulsystem-b1`, Австрия — die Volksschule выше, и все три называют одну ступень. Женский род, множественное на -n, ударение на -mar-. Дальше идёт die Sekundarschule, следующая запись.'
      uk: 'Швейцарія; у більшості кантонів шість років, а латинське primus — «перший» — видно просто в назві. Німеччина каже die Grundschule рівня B1 з колоди `bildung-schulsystem-b1`, Австрія — die Volksschule вище, і всі три називають один щабель. Жіночий рід, множина на -n, наголос на -mar-. Далі йде die Sekundarschule, наступний запис.'

  - de: Sekundarschule
    ipa: "zekʊnˈdaːɐ̯ˌʃuːlə"
    pos: noun
    gender: f
    plural: "die Sekundarschulen"
    cards: recognition
    en: the school that follows the first stage and leads either to an apprenticeship or to further study
    ru: школа, идущая после первой ступени и ведущая либо к ремеслу, либо к дальнейшей учёбе
    uk: школа, що йде після першого щабля і веде або до ремесла, або до подальшого навчання
    example_de: Nach der Primarschule besucht sie drei Jahre die Sekundarschule.
    example_en: After primary school she attends secondary school for three years.
    example_ru: После начальной школы она три года учится в средней школе.
    example_uk: Після початкової школи вона три роки вчиться в середній школі.
    note:
      en: 'Switzerland, and it follows die Primarschule above for about three years. Every canton divides and names these years in its own way, which is why die Bezirksschule below is the same stage under another name. Feminine, plural in -n, stress on -dar-. Germany splits the same years three ways, into B1 die Hauptschule, B1 die Realschule and B1 das Gymnasium in the deck `bildung-schulsystem-b1`.'
      ru: 'Швейцария, идёт после die Primarschule выше около трёх лет. Каждый кантон делит и называет эти годы по-своему, поэтому die Bezirksschule ниже — та же ступень под другим именем. Женский род, множественное на -n, ударение на -dar-. Германия делит те же годы на три: die Hauptschule, die Realschule и das Gymnasium уровня B1 из колоды `bildung-schulsystem-b1`.'
      uk: 'Швейцарія, іде після die Primarschule вище близько трьох років. Кожен кантон ділить і називає ці роки по-своєму, тому die Bezirksschule нижче — той самий щабель під іншим ім’ям. Жіночий рід, множина на -n, наголос на -dar-. Німеччина ділить ті самі роки натроє: die Hauptschule, die Realschule і das Gymnasium рівня B1 з колоди `bildung-schulsystem-b1`.'

  - de: Bezirksschule
    ipa: "bəˈtsɪʁksˌʃuːlə"
    pos: noun
    gender: f
    plural: "die Bezirksschulen"
    cards: recognition
    en: a lower secondary school under the name some districts give it
    ru: средняя школа первой ступени под тем названием, какое ей дают в некоторых округах
    uk: середня школа першого щабля під тією назвою, яку їй дають у деяких округах
    example_de: In diesem Kanton heißt die Schule Bezirksschule.
    example_en: In this canton the school is called a district school.
    example_ru: В этом кантоне школа называется окружной.
    example_uk: У цьому кантоні школа зветься окружною.
    note:
      en: 'Switzerland, and the word is worth having for what it shows rather than for what it names: schooling is a cantonal matter, so the same three years are die Sekundarschule above in one canton and die Bezirksschule in the next. Der Bezirk is the district. Feminine, plural in -n. A B1 reader is not expected to know the cantonal systems, only to recognise the word as the name of a school.'
      ru: 'Швейцария, и слово ценно не столько тем, что называет, сколько тем, что показывает: школа — дело кантона, поэтому одни и те же три года в одном кантоне зовутся die Sekundarschule выше, а в соседнем — die Bezirksschule. Der Bezirk — округ. Женский род, множественное на -n. От читателя уровня B1 не ждут знания кантональных систем, а ждут узнавания слова как названия школы.'
      uk: 'Швейцарія, і слово цінне не так тим, що називає, як тим, що показує: школа — справа кантону, тому ті самі три роки в одному кантоні звуться die Sekundarschule вище, а в сусідньому — die Bezirksschule. Der Bezirk — округ. Жіночий рід, множина на -n. Від читача рівня B1 не чекають знання кантональних систем, а чекають упізнавання слова як назви школи.'

  - de: Berufsmittelschule
    ipa: "bəˈʁuːfsˌmɪtl̩ʃuːlə"
    pos: noun
    gender: f
    plural: "die Berufsmittelschulen"
    cards: recognition
    en: the school an apprentice attends beside the workshop in order to qualify for higher study
    ru: школа, которую ученик посещает параллельно с мастерской, чтобы получить право учиться дальше
    uk: школа, яку учень відвідує паралельно з майстернею, щоб дістати право вчитися далі
    example_de: Neben der Lehre besucht er die Berufsmittelschule.
    example_en: Alongside his apprenticeship he attends the vocational upper secondary school.
    example_ru: Вместе с ученичеством он посещает профессиональную среднюю школу.
    example_uk: Разом з учнівством він відвідує професійну середню школу.
    note:
      en: 'Switzerland. It is taken beside an apprenticeship and ends in the Berufsmaturität, which opens the way to B1 die Fachhochschule in the deck `bildung-schulsystem-b1`. B1 die Berufsschule in the deck `lernen-zukunft` is the ordinary vocational school an apprentice attends anyway; this one is the demanding extra on top of it. Feminine, plural in -n, and the primary stress sits on -rufs-.'
      ru: 'Швейцария. Её проходят вместе с ученичеством, и заканчивается она Berufsmaturität, открывающей дорогу в die Fachhochschule уровня B1 из колоды `bildung-schulsystem-b1`. die Berufsschule уровня B1 из колоды `lernen-zukunft` — обычная профессиональная школа, куда ученик ходит и так; эта же — трудная надстройка над ней. Женский род, множественное на -n, главное ударение на -rufs-.'
      uk: 'Швейцарія. Її проходять разом з учнівством, і закінчується вона Berufsmaturität, що відкриває дорогу до die Fachhochschule рівня B1 з колоди `bildung-schulsystem-b1`. die Berufsschule рівня B1 з колоди `lernen-zukunft` — звичайна професійна школа, куди учень ходить і так; ця ж — важка надбудова над нею. Жіночий рід, множина на -n, головний наголос на -rufs-.'

  - de: Diplommittelschule
    ipa: "diˈploːmˌmɪtl̩ʃuːlə"
    pos: noun
    gender: f
    plural: "die Diplommittelschulen"
    cards: recognition
    en: a general upper secondary school preparing for work in health, teaching or social care
    ru: общеобразовательная старшая школа, готовящая к работе в здравоохранении, педагогике или социальной сфере
    uk: загальноосвітня старша школа, що готує до праці в охороні здоров’я, педагогіці або соціальній сфері
    example_de: Sie hat die Diplommittelschule abgeschlossen und arbeitet jetzt im Spital.
    example_en: She finished the upper secondary school and now works in the hospital.
    example_ru: Она окончила эту среднюю школу и теперь работает в больнице.
    example_uk: Вона закінчила цю середню школу і тепер працює в лікарні.
    note:
      en: 'Switzerland, and the name is the older one: most cantons have since renamed the school die Fachmittelschule. It is a third way beside an apprenticeship and an academic school, and it leads into the caring and teaching professions. Feminine, plural in -n. It stays in the manifest because a B1 reader still meets it on older certificates and in older texts.'
      ru: 'Швейцария, и название это более старое: в большинстве кантонов школу с тех пор переименовали в die Fachmittelschule. Это третий путь рядом с ученичеством и академической школой, ведущий в профессии ухода и преподавания. Женский род, множественное на -n. В списке слово держится потому, что читатель уровня B1 всё ещё встречает его в старых аттестатах и старых текстах.'
      uk: 'Швейцарія, і назва ця давніша: у більшості кантонів школу відтоді перейменували на die Fachmittelschule. Це третій шлях поряд з учнівством і академічною школою, що веде у професії догляду і викладання. Жіночий рід, множина на -n. У списку слово тримається тому, що читач рівня B1 усе ще зустрічає його в старих атестатах і старих текстах.'

  - de: Matura
    ipa: "maˈtuːʁa"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the examination at the end of academic upper secondary school, which opens the university
    ru: экзамен в конце академической старшей школы, открывающий дорогу в университет
    uk: іспит наприкінці академічної старшої школи, що відкриває дорогу до університету
    example_de: Nach der Matura will sie ein Jahr im Ausland arbeiten.
    example_en: After her leaving examination she wants to work abroad for a year.
    example_ru: После выпускного экзамена она хочет год поработать за границей.
    example_uk: Після випускного іспиту вона хоче рік попрацювати за кордоном.
    note:
      en: 'Austria and Switzerland both, from the Latin maturus, ripe. Germany says A2 das Abitur in the deck `schule-faecher-a2`. Feminine and in practice without a plural. Switzerland also writes the longer die Maturität, of which this is the short form, and Austria reaches it through die AHS or die BHS above. The chunks are die Matura machen and nach der Matura.'
      ru: 'Австрия и Швейцария сразу, от латинского maturus — «зрелый». Германия говорит das Abitur уровня A2 из колоды `schule-faecher-a2`. Женский род, множественного на практике нет. Швейцария пишет ещё и полное die Maturität, а это его краткая форма; Австрия приходит к экзамену через die AHS или die BHS выше. Обороты: die Matura machen и nach der Matura.'
      uk: 'Австрія і Швейцарія одразу, від латинського maturus — «зрілий». Німеччина каже das Abitur рівня A2 з колоди `schule-faecher-a2`. Жіночий рід, множини на практиці немає. Швейцарія пише ще й повне die Maturität, а це його коротка форма; Австрія приходить до іспиту через die AHS або die BHS вище. Звороти: die Matura machen і nach der Matura.'

  - de: Schularbeit
    ipa: "ˈʃuːlˌʔaʁbaɪ̯t"
    pos: noun
    gender: f
    plural: "die Schularbeiten"
    cards: recognition
    en: a long written test written in class and counting heavily towards the mark
    ru: продолжительная письменная работа в классе, сильно влияющая на итоговую отметку
    uk: тривала письмова робота в класі, що сильно впливає на підсумкову оцінку
    example_de: Am Freitag schreiben wir eine Schularbeit in Mathematik.
    example_en: On Friday we are writing a class test in mathematics.
    example_ru: В пятницу мы пишем контрольную по математике.
    example_uk: У п’ятницю ми пишемо контрольну з математики.
    note:
      en: 'Austria: announced weeks in advance, an hour or two long, and only a few a year in each main subject. B1 die Klassenarbeit in the deck `sprechen-lernen-b1` is Germany''s word for the same thing, and A1 die Prüfung in the deck `schule-arbeit` is the general one. The plural is the trap: in Germany die Schularbeiten simply means the homework, which is A1 die Hausaufgabe in the deck `schule-arbeit`, so one word names two different things on the two sides of the border.'
      ru: 'Австрия: объявляют за недели, длится час или два, и в каждом основном предмете их за год всего несколько. die Klassenarbeit уровня B1 из колоды `sprechen-lernen-b1` — немецкое слово для того же, а die Prüfung уровня A1 из колоды `schule-arbeit` — общее. Ловушка во множественном: в Германии die Schularbeiten значит попросту «домашние задания», то есть die Hausaufgabe уровня A1 из колоды `schule-arbeit`, — одно слово называет по разные стороны границы разные вещи.'
      uk: 'Австрія: оголошують за тижні, триває годину або дві, і в кожному основному предметі їх за рік лише кілька. die Klassenarbeit рівня B1 з колоди `sprechen-lernen-b1` — німецьке слово для того самого, а die Prüfung рівня A1 з колоди `schule-arbeit` — загальне. Пастка в множині: у Німеччині die Schularbeiten означає просто «домашні завдання», тобто die Hausaufgabe рівня A1 з колоди `schule-arbeit`, — одне слово називає по різні боки кордону різні речі.'

  # --- Die Note als Ding: der Einser bis der Sechser ---
  - de: Einser
    ipa: "ˈaɪ̯nzɐ"
    pos: noun
    gender: m
    plural: "die Einser"
    cards: recognition
    en: the mark 1 spoken of as a thing, as when somebody says what they brought home
    ru: отметка «1», названная как предмет, — так о ней говорят, рассказывая, что принесли из школы
    uk: оцінка «1», названа як предмет, — так про неї кажуть, розповідаючи, що принесли зі школи
    example_de: Für den Aufsatz hat sie einen Einser bekommen.
    example_en: She got a one for the essay.
    example_ru: За сочинение она получила единицу.
    example_uk: За твір вона дістала одиницю.
    note:
      en: 'Austria, Switzerland and southern Germany turn a mark into an -er noun: der Einser, die Einser, and the same for every number after it. The standard written form is B1 die Eins in the deck `bildung-schulsystem-b1`, and the word for the mark itself is A2 die Note in the deck `schule-faecher-a2`. What the number means depends on the country, and this is the one thing in the section worth learning by heart. Germany and Austria count down from the best: 1 is sehr gut, Austria stops at 5, Germany goes on to 6. Switzerland counts the other way round, with 6 the best and 1 the worst and 4 the lowest pass. So an Einser is the top mark in Vienna and Munich and the bottom one in Zurich, and B1 die Sechs in the deck `bildung-schulsystem-b1` states the same reversal from the German end.'
      ru: 'Австрия, Швейцария и юг Германии превращают отметку в существительное на -er: der Einser, die Einser, и так же со всеми остальными числами. Стандартная письменная форма — die Eins уровня B1 из колоды `bildung-schulsystem-b1`, а слово для самой отметки — die Note уровня A2 из колоды `schule-faecher-a2`. Что означает число, зависит от страны, и это единственное в разделе, что стоит выучить наизусть. Германия и Австрия считают вниз от лучшего: 1 — это sehr gut, Австрия останавливается на 5, Германия идёт до 6. Швейцария считает наоборот: 6 — лучшая отметка, 1 — худшая, а 4 — низший проходной балл. Так что Einser в Вене и Мюнхене — высшая отметка, а в Цюрихе низшая, и die Sechs уровня B1 из колоды `bildung-schulsystem-b1` излагает ту же перемену с немецкого конца.'
      uk: 'Австрія, Швейцарія і південь Німеччини перетворюють оцінку на іменник на -er: der Einser, die Einser, і так само з усіма іншими числами. Стандартна письмова форма — die Eins рівня B1 з колоди `bildung-schulsystem-b1`, а слово для самої оцінки — die Note рівня A2 з колоди `schule-faecher-a2`. Що означає число, залежить від країни, і це єдине в розділі, що варто вивчити напам’ять. Німеччина й Австрія лічать униз від найкращого: 1 — це sehr gut, Австрія зупиняється на 5, Німеччина йде до 6. Швейцарія лічить навпаки: 6 — найкраща оцінка, 1 — найгірша, а 4 — найнижчий прохідний бал. Тож Einser у Відні й Мюнхені — найвища оцінка, а в Цюриху найнижча, і die Sechs рівня B1 з колоди `bildung-schulsystem-b1` викладає ту саму зміну з німецького кінця.'

  - de: Zweier
    ipa: "ˈtsvaɪ̯ɐ"
    pos: noun
    gender: m
    plural: "die Zweier"
    cards: recognition
    en: the mark 2 spoken of as a thing
    ru: отметка «2», названная как предмет
    uk: оцінка «2», названа як предмет
    example_de: Ein Zweier in Deutsch ist ein gutes Ergebnis.
    example_en: A two in German is a good result.
    example_ru: Двойка по немецкому — хороший результат.
    example_uk: Двійка з німецької — добрий результат.
    note:
      en: 'The scale is set out at der Einser above; this is its second step. In Austria a Zweier is Gut and in Germany gut, the second-best mark of the scale, while in Switzerland it is the second-worst. Masculine, singular and plural spelled alike, like every noun in this section. Away from school the same -er nouns count other things in twos, so ein Zweier can also be a rowing boat for two or the number 2 tram.'
      ru: 'Шкала изложена при der Einser выше; это её вторая ступень. В Австрии Zweier — это Gut, в Германии gut, вторая сверху отметка, а в Швейцарии — вторая снизу. Мужской род, единственное и множественное пишутся одинаково, как у всех слов этого раздела. Вне школы те же существительные на -er считают парами: ein Zweier — это и лодка-двойка, и трамвай второго маршрута.'
      uk: 'Шкалу викладено при der Einser вище; це її другий щабель. В Австрії Zweier — це Gut, у Німеччині gut, друга згори оцінка, а у Швейцарії — друга знизу. Чоловічий рід, однина і множина пишуться однаково, як в усіх словах цього розділу. Поза школою ті самі іменники на -er лічать парами: ein Zweier — це і човен-двійка, і трамвай другого маршруту.'

  - de: Dreier
    ipa: "ˈdʁaɪ̯ɐ"
    pos: noun
    gender: m
    plural: "die Dreier"
    cards: recognition
    en: the mark 3 spoken of as a thing
    ru: отметка «3», названная как предмет
    uk: оцінка «3», названа як предмет
    example_de: Mit einem Dreier ist er zufrieden.
    example_en: He is satisfied with a three.
    example_ru: Тройкой он доволен.
    example_uk: Трійкою він задоволений.
    note:
      en: 'The middle of the scale in Austria, where 3 is Befriedigend, and in Germany, where it is befriedigend. In Switzerland the same number is on the other side of the line: 4 is the lowest pass there, so a Dreier is already a fail. Masculine, singular and plural alike. The scale itself is at der Einser above.'
      ru: 'Середина шкалы в Австрии, где 3 — это Befriedigend, и в Германии, где это befriedigend. В Швейцарии то же число оказывается по другую сторону черты: низший проходной там 4, значит Dreier — уже неудовлетворительно. Мужской род, единственное и множественное одинаковы. Сама шкала — при der Einser выше.'
      uk: 'Середина шкали в Австрії, де 3 — це Befriedigend, і в Німеччині, де це befriedigend. У Швейцарії те саме число опиняється по інший бік межі: найнижчий прохідний там 4, отже Dreier — уже незадовільно. Чоловічий рід, однина і множина однакові. Сама шкала — при der Einser вище.'

  - de: Vierer
    ipa: "ˈfiːʁɐ"
    pos: noun
    gender: m
    plural: "die Vierer"
    cards: recognition
    en: the mark 4 spoken of as a thing
    ru: отметка «4», названная как предмет
    uk: оцінка «4», названа як предмет
    example_de: Ein Vierer reicht, um die Klasse zu schaffen.
    example_en: A four is enough to get through the year.
    example_ru: Четвёрки хватает, чтобы перейти в следующий класс.
    example_uk: Четвірки досить, щоб перейти до наступного класу.
    note:
      en: 'This is the one number that means the same thing in all three countries, and it gets there from opposite directions. Counting down, it is the last pass in Austria, Genügend, and in Germany, ausreichend. Counting up, it is the first pass in Switzerland, genügend. So a Vierer is the pass mark everywhere, which is worth knowing when the rest of the scale is reversed at the border. Masculine, singular and plural alike.'
      ru: 'Это единственное число, которое во всех трёх странах значит одно и то же, причём приходит к этому с разных сторон. Считая вниз, оно последнее проходное в Австрии — Genügend — и в Германии — ausreichend. Считая вверх, оно первое проходное в Швейцарии — genügend. Так что Vierer везде и есть проходной балл, и это стоит помнить, когда остальная шкала на границе переворачивается. Мужской род, единственное и множественное одинаковы.'
      uk: 'Це єдине число, яке в усіх трьох країнах означає одне й те саме, причому приходить до цього з різних боків. Лічачи вниз, воно останнє прохідне в Австрії — Genügend — і в Німеччині — ausreichend. Лічачи вгору, воно перше прохідне у Швейцарії — genügend. Тож Vierer усюди і є прохідним балом, і це варто пам’ятати, коли решта шкали на кордоні перевертається. Чоловічий рід, однина і множина однакові.'

  - de: Fünfer
    ipa: "ˈfʏnfɐ"
    pos: noun
    gender: m
    plural: "die Fünfer"
    cards: recognition
    en: the mark 5 spoken of as a thing
    ru: отметка «5», названная как предмет
    uk: оцінка «5», названа як предмет
    example_de: Einen Fünfer muss er im Sommer ausbessern.
    example_en: He has to make up a five over the summer.
    example_ru: Пятёрку ему придётся исправлять летом.
    example_uk: П’ятірку йому доведеться виправляти влітку.
    note:
      en: 'The number where the three countries part company most sharply. In Austria a Fünfer is Nicht genügend and the only failing mark there is, since the Austrian scale stops here. In Germany it is mangelhaft, a fail with a worse one still below it. In Switzerland it is the second-best mark of six and something to be pleased about. Masculine, singular and plural alike; the scale is at der Einser above.'
      ru: 'Число, на котором три страны расходятся резче всего. В Австрии Fünfer — это Nicht genügend и единственная неудовлетворительная отметка, потому что австрийская шкала на нём и кончается. В Германии это mangelhaft — неудовлетворительно, но ниже есть ещё одна. В Швейцарии это вторая сверху отметка из шести, и ей радуются. Мужской род, единственное и множественное одинаковы; шкала — при der Einser выше.'
      uk: 'Число, на якому три країни розходяться найрізкіше. В Австрії Fünfer — це Nicht genügend і єдина незадовільна оцінка, бо австрійська шкала на ньому й закінчується. У Німеччині це mangelhaft — незадовільно, але нижче є ще одна. У Швейцарії це друга згори оцінка з шести, і їй радіють. Чоловічий рід, однина і множина однакові; шкала — при der Einser вище.'

  - de: Sechser
    ipa: "ˈzɛksɐ"
    pos: noun
    gender: m
    plural: "die Sechser"
    cards: recognition
    en: the mark 6 spoken of as a thing
    ru: отметка «6», названная как предмет
    uk: оцінка «6», названа як предмет
    example_de: In der Schweiz freut sich jedes Kind über einen Sechser.
    example_en: In Switzerland every child is delighted with a six.
    example_ru: В Швейцарии любой ребёнок радуется шестёрке.
    example_uk: У Швейцарії кожна дитина радіє шістці.
    note:
      en: 'The clearest case of the reversal. Austria has no six at all, because its scale stops at five, so there a Sechser is only a number. In Germany 6 is ungenügend and the bottom of the scale, as B1 die Sechs in the deck `bildung-schulsystem-b1` says. In Switzerland it is the best mark there is, and ein Zeugnis voller Sechser is an excellent report. Masculine, singular and plural alike; note the chs spoken as ks.'
      ru: 'Самый наглядный случай перемены. В Австрии шестёрки нет вовсе, потому что шкала кончается на пяти, и там Sechser — просто число. В Германии 6 — это ungenügend и низ шкалы, как и говорит die Sechs уровня B1 из колоды `bildung-schulsystem-b1`. В Швейцарии это высшая отметка, и ein Zeugnis voller Sechser — отличный табель. Мужской род, единственное и множественное одинаковы; chs читается как ks.'
      uk: 'Найнаочніший випадок зміни. В Австрії шістки немає зовсім, бо шкала закінчується на п’яти, і там Sechser — просто число. У Німеччині 6 — це ungenügend і низ шкали, як і каже die Sechs рівня B1 з колоди `bildung-schulsystem-b1`. У Швейцарії це найвища оцінка, і ein Zeugnis voller Sechser — відмінний табель. Чоловічий рід, однина і множина однакові; chs читається як ks.'

  # --- Der Staat, der Kanton und ihre Räte ---
  - de: Eidgenossenschaft
    ipa: "ˈaɪ̯tgəˌnɔsn̩ʃaft"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the confederation of member states that is the country's official name for itself
    ru: союз государств-членов — официальное самоназвание страны
    uk: союз держав-членів — офіційна самоназва країни
    example_de: Auf dem Pass steht Schweizerische Eidgenossenschaft.
    example_en: The passport says Swiss Confederation.
    example_ru: В паспорте написано «Швейцарская Конфедерация».
    example_uk: У паспорті написано «Швейцарська Конфедерація».
    note:
      en: 'Switzerland''s official name for itself: die Schweizerische Eidgenossenschaft stands on the passport and at the head of a law, while A2 die Schweiz in the deck `laender-nationalitaeten-a2` is the everyday name. It is built from der Eid, the oath, and der Genosse, the fellow, because the members swore to one another rather than to a ruler. Feminine, and in this sense without a plural; the d is devoiced to t before the g. The adjective eidgenössisch prefixes the federal institutions.'
      ru: 'Официальное самоназвание Швейцарии: die Schweizerische Eidgenossenschaft стоит в паспорте и в заголовке закона, а die Schweiz уровня A2 из колоды `laender-nationalitaeten-a2` — обиходное имя. Слово сложено из der Eid — «клятва» — и der Genosse — «товарищ»: члены союза клялись друг другу, а не государю. Женский род, в этом значении без множественного; d перед g оглушается в t. Прилагательное eidgenössisch стоит впереди названий федеральных учреждений.'
      uk: 'Офіційна самоназва Швейцарії: die Schweizerische Eidgenossenschaft стоїть у паспорті і в заголовку закону, а die Schweiz рівня A2 з колоди `laender-nationalitaeten-a2` — побутове ім’я. Слово складено з der Eid — «присяга» — і der Genosse — «товариш»: члени союзу присягали одне одному, а не володареві. Жіночий рід, у цьому значенні без множини; d перед g оглушується в t. Прикметник eidgenössisch стоїть попереду назв федеральних установ.'

  - de: Kanton
    ipa: "kanˈtoːn"
    pos: noun
    gender: m
    plural: "die Kantone"
    cards: recognition
    en: one of the twenty-six member states the country is made of, with its own laws, schools and taxes
    ru: одна из двадцати шести земель-членов, из которых состоит страна, со своими законами, школами и налогами
    uk: одна з двадцяти шести земель-членів, з яких складається країна, зі своїми законами, школами й податками
    example_de: Jeder Kanton hat seine eigenen Schulen und Steuern.
    example_en: Every canton has its own schools and taxes.
    example_ru: У каждого кантона свои школы и налоги.
    example_uk: Кожен кантон має свої школи й податки.
    note:
      en: 'Switzerland; twenty-six of them. B1 das Bundesland in the deck `politik-staat-b1` is what Germany and Austria call the same kind of unit. Masculine, plural in -e, stress on the second syllable, and the adjective is kantonal. Almost everything in this deck''s school section is a cantonal matter rather than a national one, which is why the names of the schools vary from valley to valley.'
      ru: 'Швейцария; их двадцать шесть. das Bundesland уровня B1 из колоды `politik-staat-b1` — то, как ту же единицу называют Германия и Австрия. Мужской род, множественное на -e, ударение на втором слоге, прилагательное — kantonal. Почти всё, что в школьном разделе этой колоды, — дело кантона, а не государства, поэтому названия школ и меняются от долины к долине.'
      uk: 'Швейцарія; їх двадцять шість. das Bundesland рівня B1 з колоди `politik-staat-b1` — те, як ту саму одиницю звуть Німеччина й Австрія. Чоловічий рід, множина на -e, наголос на другому складі, прикметник — kantonal. Майже все, що в шкільному розділі цієї колоди, — справа кантону, а не держави, тому назви шкіл і змінюються від долини до долини.'

  - de: Nationalrat
    ipa: "natsi̯oˈnaːlˌʁaːt"
    pos: noun
    gender: m
    plural: "die Nationalräte"
    cards: recognition
    en: the larger chamber of parliament, the one the people elect directly
    ru: бо́льшая палата парламента — та, которую народ избирает напрямую
    uk: більша палата парламенту — та, яку народ обирає безпосередньо
    example_de: Der Nationalrat hat das Gesetz gestern beschlossen.
    example_en: The National Council passed the law yesterday.
    example_ru: Национальный совет принял этот закон вчера.
    example_uk: Національна рада ухвалила цей закон учора.
    note:
      en: 'Austria and Switzerland both use the name, and in both it is the chamber the people elect directly; Germany''s is B1 der Bundestag in the deck `politik-staat-b1`. In Switzerland the same word also names one of its two hundred members, so ein Nationalrat can be a person there, and the second Swiss chamber is der Ständerat below. Masculine, umlaut in the plural, primary stress inside National-.'
      ru: 'Австрия и Швейцария обе берут это название, и в обеих это палата, которую народ избирает напрямую; у Германии это der Bundestag уровня B1 из колоды `politik-staat-b1`. В Швейцарии то же слово называет и одного из двухсот её членов, так что ein Nationalrat там может быть человеком, а вторая швейцарская палата — der Ständerat ниже. Мужской род, во множественном умлаут, главное ударение внутри National-.'
      uk: 'Австрія і Швейцарія обидві беруть цю назву, і в обох це палата, яку народ обирає безпосередньо; у Німеччини це der Bundestag рівня B1 з колоди `politik-staat-b1`. У Швейцарії те саме слово називає й одного з двохсот її членів, тож ein Nationalrat там може бути людиною, а друга швейцарська палата — der Ständerat нижче. Чоловічий рід, у множині умлаут, головний наголос усередині National-.'

  - de: Ständerat
    ipa: "ˈʃtɛndəˌʁaːt"
    pos: noun
    gender: m
    plural: "die Ständeräte"
    cards: recognition
    en: the smaller chamber, in which the member states are represented equally, and one of its members
    ru: меньшая палата, где земли-члены представлены поровну, а также один из её членов
    uk: менша палата, де землі-члени представлені порівну, а також один із її членів
    example_de: Das Gesetz muss auch durch den Ständerat.
    example_en: The law has to get through the Council of States as well.
    example_ru: Закон должен пройти и через Совет кантонов.
    example_uk: Закон має пройти й через Раду кантонів.
    note:
      en: 'Switzerland. It sits beside der Nationalrat above, and the two together are die Bundesversammlung. The name comes from der Stand, an old word for a member of the confederation, so the chamber represents the Kantone rather than the population. Like the Nationalrat, the word names both the chamber and a person sitting in it. The German chamber of the Länder is der Bundesrat, the next entry, and that is where one word pulls in three directions.'
      ru: 'Швейцария. Стоит рядом с der Nationalrat выше, а вместе они — die Bundesversammlung. Название от der Stand, старого слова для члена союза, так что палата представляет die Kantone, а не население. Как и Nationalrat, слово называет и палату, и человека в ней. Немецкая палата земель — der Bundesrat, следующая запись, и вот там одно слово тянет сразу в три стороны.'
      uk: 'Швейцарія. Стоїть поряд із der Nationalrat вище, а разом вони — die Bundesversammlung. Назва від der Stand, давнього слова для члена союзу, тож палата представляє die Kantone, а не населення. Як і Nationalrat, слово називає і палату, і людину в ній. Німецька палата земель — der Bundesrat, наступний запис, і саме там одне слово тягне одразу в три боки.'

  - de: Bundesrat
    ipa: "ˈbʊndəsˌʁaːt"
    pos: noun
    gender: m
    plural: "die Bundesräte"
    cards: recognition
    en: 'a federal council whose sense changes with the country: in Germany and Austria a chamber of the member states, in Switzerland the government and each of its members'
    ru: 'федеральный совет, значение которого меняется от страны к стране: в Германии и Австрии — палата земель, в Швейцарии — правительство и каждый из его членов'
    uk: 'федеральна рада, значення якої змінюється від країни до країни: у Німеччині й Австрії — палата земель, у Швейцарії — уряд і кожен із його членів'
    example_de: Der Bundesrat hat sieben Mitglieder.
    example_en: The Federal Council has seven members.
    example_ru: В Федеральном совете семь членов.
    example_uk: У Федеральній раді семеро членів.
    note:
      en: 'One word, three countries, and the sense changes at every border. In Germany der Bundesrat is the chamber in which the Länder are represented, beside B1 der Bundestag in the deck `politik-staat-b1`. In Austria it is the second chamber, in which the Bundesländer are represented, beside der Nationalrat above. In Switzerland it is neither: der Bundesrat is the seven-member federal government, and the same word names each one of those seven, which is why the example can count them. Masculine, umlaut in the plural. The feminine is the next entry.'
      ru: 'Одно слово, три страны, и на каждой границе значение другое. В Германии der Bundesrat — палата, где представлены земли, рядом с der Bundestag уровня B1 из колоды `politik-staat-b1`. В Австрии это вторая палата, где представлены земли, рядом с der Nationalrat выше. В Швейцарии ни то ни другое: der Bundesrat — федеральное правительство из семи человек, и тем же словом зовут каждого из этих семи, — потому пример их и считает. Мужской род, во множественном умлаут. Женская пара — следующая запись.'
      uk: 'Одне слово, три країни, і на кожному кордоні значення інше. У Німеччині der Bundesrat — палата, де представлені землі, поряд із der Bundestag рівня B1 з колоди `politik-staat-b1`. В Австрії це друга палата, де представлені землі, поряд із der Nationalrat вище. У Швейцарії ні те ні те: der Bundesrat — федеральний уряд із семи осіб, і тим самим словом звуть кожного з цих сімох, — тому приклад їх і лічить. Чоловічий рід, у множині умлаут. Жіноча пара — наступний запис.'

  - de: Bundesrätin
    ipa: "ˈbʊndəsˌʁɛːtɪn"
    pos: noun
    gender: f
    plural: "die Bundesrätinnen"
    cards: recognition
    en: a woman who is one of the seven members of the Swiss federal government
    ru: женщина, входящая в семёрку членов швейцарского федерального правительства
    uk: жінка, що входить до сімки членів швейцарського федерального уряду
    example_de: Die Bundesrätin hat das neue Gesetz vorgestellt.
    example_en: The Federal Councillor presented the new law.
    example_ru: Член Федерального совета представила новый закон.
    example_uk: Членкиня Федеральної ради представила новий закон.
    note:
      en: 'Only Switzerland can form this feminine, because only there does der Bundesrat above name a person as well as a body, and a chamber has no sex. Regular Movierung with -in, an umlaut in the stem and a doubled n in the plural. One of the seven serves as Bundespräsidentin for a year at a time, in turn, so the head of state changes every January.'
      ru: 'Такую женскую форму может образовать только Швейцария, потому что лишь там der Bundesrat выше называет и человека, а не только орган, — у палаты пола нет. Обычное мовирование на -in, умлаут в основе и удвоенное n во множественном. Один из семи по очереди служит Bundespräsidentin в течение года, так что глава государства меняется каждый январь.'
      uk: 'Таку жіночу форму може утворити лише Швейцарія, бо тільки там der Bundesrat вище називає й людину, а не тільки орган, — у палати статі немає. Звичайна моція на -in, умлаут в основі й подвоєне n у множині. Один із сімох по черзі служить Bundespräsidentin протягом року, тож глава держави змінюється щосічня.'

  - de: Regierungsrat
    ipa: "ʁeˈgiːʁʊŋsˌʁaːt"
    pos: noun
    gender: m
    plural: "die Regierungsräte"
    cards: recognition
    en: the government of a member state, and one of the people who sit in it
    ru: правительство одной из земель-членов, а также один из тех, кто в нём заседает
    uk: уряд однієї із земель-членів, а також один із тих, хто в ньому засідає
    example_de: Der Regierungsrat tagt jede Woche am Mittwoch.
    example_en: The cantonal government meets every Wednesday.
    example_ru: Правительство кантона заседает каждую среду.
    example_uk: Уряд кантону засідає щосереди.
    note:
      en: 'Switzerland: der Regierungsrat is the government of a Kanton above, and, as with der Bundesrat above, the same word names one of its members. It is elected by the people of the canton rather than by its parliament. Germany''s word for a government is B1 die Regierung in the deck `politik-staat-b1` and its members are B1 der Minister in the same deck. In Austria the word survives in quite a different job, as an honorary title given to a long-serving official. Masculine, umlaut in the plural.'
      ru: 'Швейцария: der Regierungsrat — правительство кантона, der Kanton выше, и, как у der Bundesrat выше, тем же словом называют одного из его членов. Избирает его население кантона, а не его парламент. Слово Германии для правительства — die Regierung уровня B1 из колоды `politik-staat-b1`, а его члены — der Minister уровня B1 из той же колоды. В Австрии слово живёт в совсем другой роли: как почётное звание, которое дают чиновнику за долгую службу. Мужской род, во множественном умлаут.'
      uk: 'Швейцарія: der Regierungsrat — уряд кантону, der Kanton вище, і, як у der Bundesrat вище, тим самим словом звуть одного з його членів. Обирає його населення кантону, а не його парламент. Слово Німеччини для уряду — die Regierung рівня B1 з колоди `politik-staat-b1`, а його члени — der Minister рівня B1 з тієї самої колоди. В Австрії слово живе в зовсім іншій ролі: як почесне звання, яке дають урядовцеві за довгу службу. Чоловічий рід, у множині умлаут.'

  - de: Regierungsrätin
    ipa: "ʁeˈgiːʁʊŋsˌʁɛːtɪn"
    pos: noun
    gender: f
    plural: "die Regierungsrätinnen"
    cards: recognition
    en: a woman who is a member of the government of a member state
    ru: женщина, входящая в правительство одной из земель-членов
    uk: жінка, що входить до уряду однієї із земель-членів
    example_de: Die Regierungsrätin ist für die Schulen zuständig.
    example_en: The cantonal councillor is responsible for the schools.
    example_ru: Член правительства кантона отвечает за школы.
    example_uk: Членкиня уряду кантону відповідає за школи.
    note:
      en: 'Regular -in on the masculine above, with the same umlaut and a doubled n in the plural. As with die Bundesrätin above, the feminine exists only because the Swiss word names a person; the body itself has no feminine form. Germany''s pair for the same job would be B1 die Ministerin in the deck `politik-staat-b1`, at the level of a Bundesland rather than a canton.'
      ru: 'Обычное -in от мужской формы выше, с тем же умлаутом и удвоенным n во множественном. Как и у die Bundesrätin выше, женская форма возможна лишь потому, что швейцарское слово называет человека; у самого органа женской формы нет. Немецкая пара для той же работы — die Ministerin уровня B1 из колоды `politik-staat-b1`, только на уровне земли, а не кантона.'
      uk: 'Звичайне -in від чоловічої форми вище, з тим самим умлаутом і подвоєним n у множині. Як і в die Bundesrätin вище, жіноча форма можлива лише тому, що швейцарське слово називає людину; у самого органу жіночої форми немає. Німецька пара для тієї самої роботи — die Ministerin рівня B1 з колоди `politik-staat-b1`, тільки на рівні землі, а не кантону.'

  - de: Stadtpräsident
    ipa: "ˈʃtatpʁɛziˌdɛnt"
    pos: noun
    gender: m
    plural: "die Stadtpräsidenten"
    cards: recognition
    en: the head of a town's government
    ru: глава городского правительства
    uk: очільник міського уряду
    example_de: Der Stadtpräsident eröffnet das neue Schulhaus.
    example_en: The mayor is opening the new school building.
    example_ru: Глава города открывает новое здание школы.
    example_uk: Очільник міста відкриває новий шкільний будинок.
    note:
      en: 'Switzerland. B1 der Bürgermeister in the deck `politik-staat-b1` is what Germany and Austria say. It is an n-declension noun, like every noun in -ent: der Stadtpräsident in the nominative, but den, dem and des Stadtpräsidenten everywhere else, and the plural has the n too. In several cantons the same office carries the title der Ammann below, and in a village it is often der Gemeindepräsident.'
      ru: 'Швейцария. der Bürgermeister уровня B1 из колоды `politik-staat-b1` — то, что говорят Германия и Австрия. Слово слабого склонения, как всякое на -ent: der Stadtpräsident в номинативе, но den, dem и des Stadtpräsidenten во всех прочих падежах, и во множественном n тоже есть. В нескольких кантонах ту же должность носит титул der Ammann ниже, а в селе это часто der Gemeindepräsident.'
      uk: 'Швейцарія. der Bürgermeister рівня B1 з колоди `politik-staat-b1` — те, що кажуть Німеччина й Австрія. Слово слабкої відміни, як усяке на -ent: der Stadtpräsident у називному, але den, dem і des Stadtpräsidenten в усіх інших відмінках, і в множині n теж є. У кількох кантонах ту саму посаду має титул der Ammann нижче, а в селі це часто der Gemeindepräsident.'

  - de: Stadtpräsidentin
    ipa: "ˈʃtatpʁɛziˌdɛntɪn"
    pos: noun
    gender: f
    plural: "die Stadtpräsidentinnen"
    cards: recognition
    en: a woman who heads a town's government
    ru: женщина, возглавляющая городское правительство
    uk: жінка, що очолює міський уряд
    example_de: Die Stadtpräsidentin wurde zum zweiten Mal gewählt.
    example_en: The mayor was elected for the second time.
    example_ru: Главу города избрали во второй раз.
    example_uk: Очільницю міста обрали вдруге.
    note:
      en: 'Regular Movierung with -in and a doubled n in the plural, and adding the ending takes the n-declension away with it: die Stadtpräsidentin keeps one form throughout the singular, as every feminine noun does. Germany''s word is B1 die Bürgermeisterin in the deck `politik-staat-b1`. The masculine is the entry above.'
      ru: 'Обычное мовирование на -in с удвоенным n во множественном, и вместе с окончанием уходит слабое склонение: die Stadtpräsidentin сохраняет одну форму во всём единственном числе, как всякое существительное женского рода. Слово Германии — die Bürgermeisterin уровня B1 из колоды `politik-staat-b1`. Мужская пара — запись выше.'
      uk: 'Звичайна моція на -in з подвоєним n у множині, і разом із закінченням зникає слабка відміна: die Stadtpräsidentin зберігає одну форму в усій однині, як усякий іменник жіночого роду. Слово Німеччини — die Bürgermeisterin рівня B1 з колоди `politik-staat-b1`. Чоловіча пара — запис вище.'

  - de: Ammann
    ipa: "ˈamˌman"
    pos: noun
    gender: m
    plural: "die Ammänner"
    cards: recognition
    en: the head of a commune, under the title several member states still use
    ru: глава общины — под тем титулом, который до сих пор в ходу в ряде земель-членов
    uk: очільник громади — під тим титулом, що досі в ужитку в низці земель-членів
    example_de: Der Ammann begrüßt die Gäste vor dem Gemeindehaus.
    example_en: The mayor welcomes the guests in front of the town hall.
    example_ru: Глава общины встречает гостей перед общинным домом.
    example_uk: Очільник громади вітає гостей перед громадським будинком.
    note:
      en: 'Switzerland. The word is a worn-down Amtmann, the man of the office, which is why the two m stand together and both are heard. Depending on the canton he heads a commune, der Gemeindeammann, and in some cantons the Landammann heads the cantonal government itself. Germany and Austria say B1 der Bürgermeister in the deck `politik-staat-b1`, and B1 die Gemeinde in the same deck is what he heads. Masculine, umlaut in the plural.'
      ru: 'Швейцария. Слово — стёршийся Amtmann, «человек ведомства», отсюда два m подряд, и оба слышны. В зависимости от кантона он стоит во главе общины — der Gemeindeammann, — а в некоторых кантонах der Landammann возглавляет и само правительство кантона. Германия и Австрия говорят der Bürgermeister уровня B1 из колоды `politik-staat-b1`, а то, что он возглавляет, — die Gemeinde уровня B1 из той же колоды. Мужской род, во множественном умлаут.'
      uk: 'Швейцарія. Слово — стертий Amtmann, «людина відомства», звідси два m поспіль, і обидва чути. Залежно від кантону він стоїть на чолі громади — der Gemeindeammann, — а в деяких кантонах der Landammann очолює і сам уряд кантону. Німеччина й Австрія кажуть der Bürgermeister рівня B1 з колоди `politik-staat-b1`, а те, що він очолює, — die Gemeinde рівня B1 з тієї самої колоди. Чоловічий рід, у множині умлаут.'

  - de: Ammännin
    ipa: "ˈamˌmɛnɪn"
    pos: noun
    gender: f
    plural: "die Ammänninnen"
    cards: recognition
    en: a woman who heads a commune under that title
    ru: женщина, возглавляющая общину под этим титулом
    uk: жінка, що очолює громаду під цим титулом
    example_de: Die Ammännin lädt die Bürger zur Versammlung ein.
    example_en: The mayor invites the citizens to the assembly.
    example_ru: Глава общины приглашает жителей на собрание.
    example_uk: Очільниця громади запрошує мешканців на збори.
    note:
      en: 'The feminine is built on the umlauted stem rather than the plain one: die Ammännin and not Ammannin, so the ä of the plural die Ammänner reappears here, and the plural then doubles the n on top of that. That is unusual, and the spelling is worth looking at twice. It is the Movierung of der Ammann above, and Germany''s pair for the office is B1 die Bürgermeisterin in the deck `politik-staat-b1`.'
      ru: 'Женская форма строится не на простой основе, а на основе с умлаутом: die Ammännin, а не Ammannin, — так что ä множественного die Ammänner возвращается сюда, а во множественном к нему добавляется ещё и удвоенное n. Это необычно, и на написание стоит взглянуть дважды. Это мовирование от der Ammann выше, а немецкая пара для должности — die Bürgermeisterin уровня B1 из колоды `politik-staat-b1`.'
      uk: 'Жіноча форма будується не на простій основі, а на основі з умлаутом: die Ammännin, а не Ammannin, — тож ä множини die Ammänner повертається сюди, а в множині до нього додається ще й подвоєне n. Це незвично, і на написання варто глянути двічі. Це моція від der Ammann вище, а німецька пара для посади — die Bürgermeisterin рівня B1 з колоди `politik-staat-b1`.'

  # --- Am Schalter und auf dem Formular ---
  - de: Zivilstand
    ipa: "tsiˈviːlˌʃtant"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: the line on a form that says whether a person is single, married, divorced or widowed
    ru: строка бланка, где указывают, холост человек, женат, разведён или овдовел
    uk: рядок бланка, де зазначають, чи людина неодружена, одружена, розлучена або овдовіла
    example_de: Bitte tragen Sie hier Ihren Zivilstand ein.
    example_en: Please enter your marital status here.
    example_ru: Укажите здесь, пожалуйста, ваше семейное положение.
    example_uk: Зазначте тут, будь ласка, ваш сімейний стан.
    note:
      en: 'Switzerland. B1 der Familienstand in the deck `beziehungen-familie-b1` is the same line on the same form in Germany and Austria, and B1 der Personenstand in the deck `verwaltung-behoerden-b1` is the legal term behind both. What goes in the box is A1 ledig or A1 verheiratet in the deck `menschen-familie`. Masculine, no plural in this use, and the d is devoiced to t at the end. The office that keeps the register is das Zivilstandsamt.'
      ru: 'Швейцария. der Familienstand уровня B1 из колоды `beziehungen-familie-b1` — та же строка того же бланка в Германии и Австрии, а der Personenstand уровня B1 из колоды `verwaltung-behoerden-b1` — юридический термин за обоими. В графу вписывают ledig или verheiratet уровня A1 из колоды `menschen-familie`. Мужской род, в этом значении без множественного, а конечное d оглушается в t. Учреждение, которое ведёт реестр, — das Zivilstandsamt.'
      uk: 'Швейцарія. der Familienstand рівня B1 з колоди `beziehungen-familie-b1` — той самий рядок того самого бланка в Німеччині й Австрії, а der Personenstand рівня B1 з колоди `verwaltung-behoerden-b1` — юридичний термін за обома. У графу вписують ledig або verheiratet рівня A1 з колоди `menschen-familie`. Чоловічий рід, у цьому значенні без множини, а кінцеве d оглушується в t. Установа, що веде реєстр, — das Zivilstandsamt.'

  - de: Führerausweis
    ipa: "ˈfyːʁɐˌʔaʊ̯svaɪ̯s"
    pos: noun
    gender: m
    plural: "die Führerausweise"
    cards: recognition
    en: the official card that allows its holder to drive
    ru: официальная карточка, дающая её владельцу право водить машину
    uk: офіційна картка, що дає її власникові право керувати автівкою
    example_de: Den Führerausweis muss man immer dabeihaben.
    example_en: You always have to have your driving licence with you.
    example_ru: Водительское удостоверение всегда нужно иметь при себе.
    example_uk: Посвідчення водія завжди треба мати при собі.
    note:
      en: 'Switzerland. Germany and Austria say A1 der Führerschein in the deck `schule-arbeit`, and the two second halves say the same thing twice over, because der Schein and der Ausweis are both papers that prove something. Masculine, plural in -e. In Switzerland it is often shortened to der Ausweis, and the provisional one a learner drives on is der Lernfahrausweis.'
      ru: 'Швейцария. Германия и Австрия говорят der Führerschein уровня A1 из колоды `schule-arbeit`, и обе вторые половины говорят одно и то же дважды: der Schein и der Ausweis — оба «бумага, которая что-то удостоверяет». Мужской род, множественное на -e. В Швейцарии слово часто сокращают до der Ausweis, а временное, с которым ездит ученик, — der Lernfahrausweis.'
      uk: 'Швейцарія. Німеччина й Австрія кажуть der Führerschein рівня A1 з колоди `schule-arbeit`, і обидві другі половини кажуть те саме двічі: der Schein і der Ausweis — обоє «папір, що щось посвідчує». Чоловічий рід, множина на -e. У Швейцарії слово часто скорочують до der Ausweis, а тимчасове, з яким їздить учень, — der Lernfahrausweis.'

  - de: e-card
    ipa: "ˈeːˌkaːɐ̯t"
    pos: noun
    gender: f
    plural: "die e-cards"
    cards: recognition
    en: the plastic card that shows a person is covered by the health insurance
    ru: пластиковая карточка, подтверждающая, что человек застрахован по медицинскому страхованию
    uk: пластикова картка, що підтверджує, що людина застрахована в системі медичного страхування
    example_de: Bitte bringen Sie zum Termin Ihre e-card mit.
    example_en: Please bring your health insurance card to the appointment.
    example_ru: Возьмите, пожалуйста, на приём свою страховую карточку.
    example_uk: Візьміть, будь ласка, на прийом свою страхову картку.
    note:
      en: 'Austria, and the spelling is fixed and unusual: a small e, a hyphen, and the English word after it. Feminine, because die Karte stands behind it, and the plural adds -s. It is what a patient hands over at the desk of die Ordination below. Germany calls the equivalent die Gesundheitskarte, B1 die Versichertenkarte in the deck `verwaltung-behoerden-b1` is the general word for a card of this kind, and A1 die Krankenkasse in the deck `koerper-gesundheit` is the body behind it. The letter is spoken as its own name and the second half as the English word.'
      ru: 'Австрия, и написание закреплено и необычно: строчная e, дефис и английское слово после него. Женский род, потому что за словом стоит die Karte, а во множественном добавляется -s. Именно её пациент подаёт в регистратуре die Ordination ниже. Германия зовёт аналог die Gesundheitskarte, die Versichertenkarte уровня B1 из колоды `verwaltung-behoerden-b1` — общее название карточки такого рода, а die Krankenkasse уровня A1 из колоды `koerper-gesundheit` — стоящая за ней касса. Букву произносят как её собственное имя, а вторую половину — как английское слово.'
      uk: 'Австрія, і написання закріплене й незвичне: мала e, дефіс і англійське слово після нього. Жіночий рід, бо за словом стоїть die Karte, а в множині додається -s. Саме її пацієнт подає в реєстратурі die Ordination нижче. Німеччина зве відповідник die Gesundheitskarte, die Versichertenkarte рівня B1 з колоди `verwaltung-behoerden-b1` — загальна назва картки такого штибу, а die Krankenkasse рівня A1 з колоди `koerper-gesundheit` — каса, що стоїть за нею. Літеру вимовляють як її власне ім’я, а другу половину — як англійське слово.'

  - de: Bancomat
    ipa: "baŋkoˈmaːt"
    pos: noun
    gender: m
    plural: "die Bancomaten"
    cards: recognition
    en: the machine in a wall that pays out cash against a card
    ru: машина в стене, которая выдаёт наличные по карте
    uk: машина в стіні, що видає готівку за карткою
    example_de: Der Bancomat beim Bahnhof gibt rund um die Uhr Geld.
    example_en: The cash machine by the station gives out money round the clock.
    example_ru: Банкомат у вокзала выдаёт деньги круглосуточно.
    example_uk: Банкомат біля вокзалу видає гроші цілодобово.
    note:
      en: 'Switzerland, and the c is the Swiss half of a pair the manifest prints twice: Bancomat here with a c, die Bankomat-Karte below with a k, because Austria spells the same idea the German way. B1 der Geldautomat in the deck `einkaufen-geld-b1` is what Germany says, and B1 abheben in the same deck is what one does at it. Masculine, and it declines like A1 der Automat in the deck `einkaufen-geschaefte`, so the plural is die Bancomaten. It began life as a trade name, which is why it looks like neither German nor French.'
      ru: 'Швейцария, и c — швейцарская половина пары, которую список печатает дважды: Bancomat здесь с c, die Bankomat-Karte ниже с k, потому что Австрия пишет ту же мысль по-немецки. der Geldautomat уровня B1 из колоды `einkaufen-geld-b1` — то, что говорит Германия, а abheben уровня B1 из той же колоды — то, что у него делают. Мужской род, а склоняется как der Automat уровня A1 из колоды `einkaufen-geschaefte`, поэтому множественное — die Bancomaten. Слово начиналось как торговая марка, потому и не выглядит ни немецким, ни французским.'
      uk: 'Швейцарія, і c — швейцарська половина пари, яку список друкує двічі: Bancomat тут із c, die Bankomat-Karte нижче з k, бо Австрія пише ту саму думку по-німецьки. der Geldautomat рівня B1 з колоди `einkaufen-geld-b1` — те, що каже Німеччина, а abheben рівня B1 з тієї самої колоди — те, що біля нього роблять. Чоловічий рід, а відмінюється як der Automat рівня A1 з колоди `einkaufen-geschaefte`, тому множина — die Bancomaten. Слово починалося як торгова марка, тому й не має вигляду ні німецького, ні французького.'

  - de: Bankomat-Karte
    ipa: "baŋkoˈmaːtˌkaʁtə"
    pos: noun
    gender: f
    plural: "die Bankomat-Karten"
    cards: recognition
    en: the plastic card that pays at the till and draws cash at the machine
    ru: пластиковая карта, которой платят на кассе и снимают наличные в автомате
    uk: пластикова картка, якою платять на касі й знімають готівку в автоматі
    example_de: Kann ich mit der Bankomat-Karte zahlen?
    example_en: Can I pay with my debit card?
    example_ru: Можно расплатиться дебетовой картой?
    example_uk: Чи можна розрахуватися дебетовою карткою?
    note:
      en: 'Austria, and note the k where the Swiss Bancomat above has a c: one machine, two national spellings, and the manifest lists both. Feminine, because die Karte is, and the hyphen keeps the two halves apart. Germany calls the same card die Girocard and, for many years before that, die EC-Karte. Around it stand B1 die Kreditkarte in the deck `geld-vertraege` and B1 die Chipkarte in the deck `einkaufen-geld-b1`.'
      ru: 'Австрия, и обратите внимание на k там, где у швейцарского Bancomat выше стоит c: одна машина, два национальных написания, и список даёт оба. Женский род, потому что die Karte, а дефис держит половины врозь. Германия зовёт ту же карту die Girocard, а долгие годы до того — die EC-Karte. Рядом стоят die Kreditkarte уровня B1 из колоды `geld-vertraege` и die Chipkarte уровня B1 из колоды `einkaufen-geld-b1`.'
      uk: 'Австрія, і зверніть увагу на k там, де у швейцарського Bancomat вище стоїть c: одна машина, два національні написання, і список подає обидва. Жіночий рід, бо die Karte, а дефіс тримає половини нарізно. Німеччина зве ту саму картку die Girocard, а довгі роки до того — die EC-Karte. Поряд стоять die Kreditkarte рівня B1 з колоди `geld-vertraege` і die Chipkarte рівня B1 з колоди `einkaufen-geld-b1`.'

  - de: Billett
    ipa: "bɪlˈjɛt"
    pos: noun
    gender: n
    plural: "die Billette"
    cards: recognition
    en: the printed slip that gives the right to travel or to go in
    ru: печатный талон, дающий право на проезд или на вход
    uk: друкований талон, що дає право на проїзд або на вхід
    example_de: Das Billett muss man vor der Fahrt lösen.
    example_en: You have to buy the ticket before you travel.
    example_ru: Билет нужно купить до поездки.
    example_uk: Квиток треба купити перед поїздкою.
    note:
      en: 'Switzerland, from French billet, and the -ll- is spoken as l plus j: bɪlˈjɛt. Neuter, plural die Billette. A1 die Fahrkarte and A1 das Ticket in the deck `reisen-urlaub` are what Germany and Austria say. The machine that sells it is der Billettautomat and the counter der Billettschalter; the verb in the example, ein Billett lösen, is the formal one for buying a ticket.'
      ru: 'Швейцария, от французского billet, а -ll- звучит как l плюс j: bɪlˈjɛt. Средний род, множественное die Billette. die Fahrkarte и das Ticket уровня A1 из колоды `reisen-urlaub` — то, что говорят Германия и Австрия. Автомат — der Billettautomat, касса — der Billettschalter; глагол из примера, ein Billett lösen, — официальный способ сказать «купить билет».'
      uk: 'Швейцарія, від французького billet, а -ll- звучить як l плюс j: bɪlˈjɛt. Середній рід, множина die Billette. die Fahrkarte і das Ticket рівня A1 з колоди `reisen-urlaub` — те, що кажуть Німеччина й Австрія. Автомат — der Billettautomat, каса — der Billettschalter; дієслово з прикладу, ein Billett lösen, — офіційний спосіб сказати «купити квиток».'

  - de: Perron
    ipa: "pɛˈʁɔŋ"
    pos: noun
    gender: m
    plural: "die Perrons"
    cards: recognition
    en: the raised strip beside the track where passengers wait for the train
    ru: приподнятая полоса у пути, на которой пассажиры ждут поезда
    uk: піднята смуга біля колії, на якій пасажири чекають на потяг
    example_de: Der Zug fährt heute von einem anderen Perron ab.
    example_en: The train is leaving from a different platform today.
    example_ru: Поезд сегодня отправляется с другой платформы.
    example_uk: Потяг сьогодні відходить з іншої платформи.
    note:
      en: 'Switzerland, from French. A1 der Bahnsteig in the deck `reisen-urlaub` is what Germany and Austria say, and A1 das Gleis in the same deck is the track itself, which is a different thing and is used in all three countries. Masculine, plural in -s, and Swiss usage speaks the ending as -ong rather than nasalising it in the French way. A B1 reader meets the word on Swiss station signs and in Swiss timetables.'
      ru: 'Швейцария, из французского. der Bahnsteig уровня A1 из колоды `reisen-urlaub` — то, что говорят Германия и Австрия, а das Gleis уровня A1 из той же колоды — сам путь, вещь другая и общая для всех трёх стран. Мужской род, множественное на -s, а швейцарское произношение даёт на конце -ong, а не французский носовой. Читатель уровня B1 встречает слово на швейцарских вокзальных табличках и в расписаниях.'
      uk: 'Швейцарія, із французької. der Bahnsteig рівня A1 з колоди `reisen-urlaub` — те, що кажуть Німеччина й Австрія, а das Gleis рівня A1 з тієї самої колоди — сама колія, річ інша і спільна для всіх трьох країн. Чоловічий рід, множина на -s, а швейцарська вимова дає на кінці -ong, а не французький носовий. Читач рівня B1 зустрічає слово на швейцарських вокзальних табличках і в розкладах.'

  - de: Ordination
    ipa: "ɔʁdinaˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "die Ordinationen"
    cards: recognition
    en: the rooms in which a doctor sees patients
    ru: помещение, где врач принимает пациентов
    uk: приміщення, де лікар приймає пацієнтів
    example_de: Die Ordination ist am Freitag geschlossen.
    example_en: The surgery is closed on Friday.
    example_ru: Кабинет в пятницу закрыт.
    example_uk: Кабінет у п’ятницю зачинений.
    note:
      en: 'Austria. A2 die Praxis in the deck `termine-zeit` is what Germany and Switzerland say, and A2 die Sprechstunde in the deck `gesundheit-arzttermin` is the hours rather than the rooms. Feminine, plural in -en, stress on the last syllable. The word also has a church sense everywhere in German, the ordaining of a priest, so it is the doctor in the sentence that produces the Austrian reading.'
      ru: 'Австрия. die Praxis уровня A2 из колоды `termine-zeit` — то, что говорят Германия и Швейцария, а die Sprechstunde уровня A2 из колоды `gesundheit-arzttermin` — часы приёма, а не помещение. Женский род, множественное на -en, ударение на последнем слоге. У слова есть и церковное значение во всём немецком — рукоположение священника, — так что австрийское чтение задаёт врач в предложении.'
      uk: 'Австрія. die Praxis рівня A2 з колоди `termine-zeit` — те, що кажуть Німеччина і Швейцарія, а die Sprechstunde рівня A2 з колоди `gesundheit-arzttermin` — години прийому, а не приміщення. Жіночий рід, множина на -en, наголос на останньому складі. У слова є й церковне значення в усій німецькій — висвячення священника, — тож австрійське читання задає лікар у реченні.'

  # --- Wer im Haus und bei der Post arbeitet ---
  - de: Abwart
    ipa: "ˈapˌvaʁt"
    pos: noun
    gender: m
    plural: "die Abwarte"
    cards: recognition
    en: the man who looks after a building, its heating, its cleaning and its small repairs
    ru: 'мужчина, который следит за домом: за отоплением, уборкой и мелким ремонтом'
    uk: 'чоловік, який доглядає будинок: опалення, прибирання і дрібний ремонт'
    example_de: Der Abwart hat den Schlüssel für den Keller.
    example_en: The caretaker has the key to the cellar.
    example_ru: Ключ от подвала у коменданта.
