    ru: обнаруживать, открывать
    uk: виявляти, відкривати
    example_de: Im Keller haben wir alte Fotos entdeckt.
    example_en: In the cellar we discovered some old photos.
    example_ru: В подвале мы обнаружили старые фотографии.
    example_uk: У підвалі ми виявили старі світлини.
    note:
      en: 'Regular, inseparable: entdeckt, hat entdeckt. It is finden with surprise in it: the thing was there and nobody had seen it. A travel brochure uses it constantly (Entdecken Sie die Altstadt!), and so does a doctor about a finding. Die Entdeckung is the discovery.'
      ru: 'Правильный глагол, неотделяемый: entdeckt, hat entdeckt. Это finden с оттенком неожиданности: предмет был на месте, но его никто не видел. Турбуклет пользуется им постоянно (Entdecken Sie die Altstadt!), врач — говоря о находке. Die Entdeckung — открытие.'
      uk: 'Правильне дієслово, невідокремлюване: entdeckt, hat entdeckt. Це finden з відтінком несподіванки: річ була на місці, але її ніхто не бачив. Турбуклет користується ним постійно (Entdecken Sie die Altstadt!), лікар — говорячи про знахідку. Die Entdeckung — відкриття.'

  - de: gründen
    ipa: "ˈgʁʏndn̩"
    pos: verb
    praesens_3sg: gründet
    partizip2: gegründet
    aux: haben
    valence: "+ Akk"
    en: to found, to set up (an organisation)
    en_compact: to found, to set up
    ru: основывать, учреждать
    uk: засновувати, створювати (організацію)
    example_de: Sie hat mit zwei Freundinnen eine kleine Firma gegründet.
    example_en: She set up a small company with two friends.
    example_ru: Вместе с двумя подругами она основала маленькую фирму.
    example_uk: Разом із двома подругами вона заснувала маленьку фірму.
    note:
      en: 'Regular: gründet, gründete, hat gegründet. What it takes is an organisation with members or owners — a company, a club, a party, a city. A shop opens (eröffnen), an event begins (beginnen). Die Gründung is the founding, and der Grund underneath it is the ground a thing stands on.'
      ru: 'Правильный глагол: gründet, gründete, hat gegründet. Дополнение — организация с участниками или владельцами: фирма, клуб, партия, город. Магазин открывают (eröffnen), мероприятие начинается (beginnen). Die Gründung — основание, а стоящее за ним der Grund — та земля, на которой всё держится.'
      uk: 'Правильне дієслово: gründet, gründete, hat gegründet. Додаток — організація з учасниками або власниками: фірма, клуб, партія, місто. Крамницю відкривають (eröffnen), захід починається (beginnen). Die Gründung — заснування, а der Grund за ним — та земля, на якій усе тримається.'

  - de: eröffnen
    ipa: "ɛɐ̯ˈʔœfnən"
    pos: verb
    praesens_3sg: eröffnet
    partizip2: eröffnet
    aux: haben
    valence: "+ Akk"
    # Recognition only: `öffnen` and `aufmachen` both ship "to open" as production
