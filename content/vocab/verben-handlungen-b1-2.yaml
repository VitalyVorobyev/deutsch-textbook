    cards: recognition
    en: to draw up, to create (a document, an account)
    en_compact: to draw up, to create
    ru: составлять, создавать (документ, аккаунт)
    uk: складати, створювати (документ, обліковий запис)
    example_de: Bitte erstellen Sie zuerst ein Benutzerkonto.
    example_en: Please create a user account first.
    example_ru: Пожалуйста, сначала создайте учётную запись.
    example_uk: Будь ласка, спочатку створіть обліковий запис.
    note:
      en: 'Regular, inseparable: erstellt, hat erstellt. It belongs to screens and offices: a plan, a list, an invoice, an account. The everyday verbs are machen and schreiben. On a website the button beside it is usually Konto erstellen, which is worth recognising at a glance.'
      ru: 'Правильный глагол, неотделяемый: erstellt, hat erstellt. Слово экранов и канцелярии: план, список, счёт, аккаунт. В быту говорят machen и schreiben. На сайте рядом обычно стоит кнопка Konto erstellen — её полезно узнавать сразу.'
      uk: 'Правильне дієслово, невідокремлюване: erstellt, hat erstellt. Слово екранів і канцелярії: план, список, рахунок, обліковий запис. У побуті кажуть machen і schreiben. На сайті поруч зазвичай стоїть кнопка Konto erstellen — її корисно впізнавати одразу.'

