    cards: recognition
    en: to open (a business, an account, an event)
    en_compact: to open a business or an account
    ru: открывать (заведение, счёт, мероприятие)
    uk: відкривати (заклад, рахунок, захід)
    example_de: Nächste Woche eröffnet im Erdgeschoss eine Apotheke.
    example_en: A pharmacy is opening on the ground floor next week.
    example_ru: На первом этаже на следующей неделе открывается аптека.
    example_uk: На першому поверсі наступного тижня відкривається аптека.
    note:
      en: 'Regular, inseparable: eröffnet, hat eröffnet. It opens something for the first time, or opens it as an institution: a shop, a bank account, an exhibition, a season. A door and a window are opened with öffnen or aufmachen. Die Eröffnung is the opening event, and the sign for it is Neueröffnung.'
      ru: 'Правильный глагол, неотделяемый: eröffnet, hat eröffnet. Открывает впервые или как учреждение: магазин, банковский счёт, выставку, сезон. Дверь и окно открывают через öffnen или aufmachen. Die Eröffnung — торжественное открытие, а вывеска к нему — Neueröffnung.'
      uk: 'Правильне дієслово, невідокремлюване: eröffnet, hat eröffnet. Відкриває вперше або як установу: крамницю, банківський рахунок, виставку, сезон. Двері й вікно відчиняють через öffnen або aufmachen. Die Eröffnung — урочисте відкриття, а вивіска до нього — Neueröffnung.'

  - de: einführen
