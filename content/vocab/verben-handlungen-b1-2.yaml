# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the second third of
# the action verbs of data/goethe-b1-wortliste.txt — the general-purpose doing verbs:
# using and needing a thing, having and getting it, making something exist, putting
# parts where they belong, and carrying on or leaving off.
id: verben-handlungen-b1-2
title_de: "Handlungen: benutzen, schaffen, erledigen"
title_en: "Actions: using, making, getting things done"
title_ru: "Действия: пользоваться, создавать, улаживать"
title_uk: "Дії: користуватися, створювати, залагоджувати"
level: B1
entries:
  # --- Benutzen, brauchen, besorgen ---
  - de: anwenden
    ipa: "ˈanˌvɛndn̩"
    pos: verb
    praesens_3sg: wendet an
    partizip2: angewendet
    aux: haben
    valence: "+ Akk"
    # Recognition only: A2 `benutzen` ships "to use" as a production card in
    # verben-handlungen-a2-1, and this deck carries two more words for the same
    # prompt — the family gets one typed card, not four.
    cards: recognition
    en: to apply (a rule, a method)
    en_compact: to apply a rule
    ru: применять (правило, метод)
    uk: застосовувати (правило, метод)
    example_de: Diese Regel wird nur in wenigen Fällen angewendet.
    example_en: This rule is applied in only a few cases.
    example_ru: Это правило применяется лишь в немногих случаях.
    example_uk: Це правило застосовують лише в небагатьох випадках.
    note:
      en: 'Separable, stress on an: wendet an, hat angewendet (angewandt is equally correct and sounds more formal). What it takes is abstract — a rule, a method, a law, a cream on a package insert — never a tool. For a tool the word is benutzen. The noun die Anwendung is both the application of a rule and an app on a phone.'
      ru: 'Отделяемый глагол, ударение на an: wendet an, hat angewendet (форма angewandt столь же верна и звучит официальнее). Дополнение абстрактное — правило, метод, закон, мазь в инструкции, но не инструмент. Про инструмент говорят benutzen. Существительное die Anwendung — и применение правила, и приложение в телефоне.'
      uk: 'Відокремлюване дієслово, наголос на an: wendet an, hat angewendet (форма angewandt так само правильна й звучить офіційніше). Додаток абстрактний — правило, метод, закон, мазь в інструкції, але не інструмент. Про інструмент кажуть benutzen. Іменник die Anwendung — і застосування правила, і застосунок у телефоні.'

  - de: verwenden
    ipa: "fɛɐ̯ˈvɛndn̩"
    pos: verb
    praesens_3sg: verwendet
    partizip2: verwendet
    aux: haben
    valence: "+ Akk"
    # Recognition only: the same prompt as A2 `benutzen`, one deck over, where no
    # accept list here can reach it.
    cards: recognition
    en: to use, to make use of
    ru: использовать, употреблять
    uk: використовувати, уживати
    example_de: Für den Kuchen verwende ich nur frische Eier.
    example_en: For the cake I use only fresh eggs.
    example_ru: Для пирога я использую только свежие яйца.
    example_uk: Для пирога я використовую тільки свіжі яйця.
    note:
      en: 'Regular, inseparable: verwendet, hat verwendet. It is the neutral written twin of benutzen and is what a recipe, a manual and a label print. Speech keeps benutzen and nehmen. The instruction on medicine is vor Gebrauch, and the noun die Verwendung means the use a thing is put to.'
      ru: 'Правильный глагол, неотделяемый: verwendet, hat verwendet. Нейтральный письменный двойник benutzen — так пишут в рецепте, инструкции и на этикетке. Речь оставляет за собой benutzen и nehmen. На лекарстве стоит vor Gebrauch, а существительное die Verwendung значит «применение, назначение».'
      uk: 'Правильне дієслово, невідокремлюване: verwendet, hat verwendet. Нейтральний писемний двійник benutzen — так пишуть у рецепті, інструкції та на етикетці. Мовлення лишає за собою benutzen і nehmen. На ліках стоїть vor Gebrauch, а іменник die Verwendung означає «застосування, призначення».'

  - de: gebrauchen
    ipa: "gəˈbʁaʊ̯xn̩"
    pos: verb
    praesens_3sg: gebraucht
    partizip2: gebraucht
    aux: haben
    valence: "+ Akk"
    # Recognition only: the third word in this deck for the prompt A2 `benutzen`
    # already owns; it survives mostly inside gebraucht (second-hand) and the fixed
    # phrase gut gebrauchen können.
    cards: recognition
    en: to use, to put to use
    ru: употреблять, пускать в дело
    uk: уживати, пускати в діло
    example_de: Ein zweiter Bildschirm wäre gut zu gebrauchen.
    example_en: A second screen would come in very useful.
    example_ru: Второй экран очень пригодился бы.
    example_uk: Другий екран дуже став би у пригоді.
    note:
      en: 'Regular, inseparable: gebraucht, hat gebraucht. Today the participle is met far more often than the verb: ein gebrauchtes Auto is a used car, and der Gebrauchtwagen is the whole market. The living phrase is etwas gut gebrauchen können, said of something that would come in handy.'
      ru: 'Правильный глагол, неотделяемый: gebraucht, hat gebraucht. Сегодня причастие встречается чаще самого глагола: ein gebrauchtes Auto — подержанная машина, der Gebrauchtwagen — весь этот рынок. Живая формула — etwas gut gebrauchen können, «что-то очень пригодилось бы».'
      uk: 'Правильне дієслово, невідокремлюване: gebraucht, hat gebraucht. Сьогодні дієприкметник трапляється частіше за саме дієслово: ein gebrauchtes Auto — вживана машина, der Gebrauchtwagen — увесь цей ринок. Жива формула — etwas gut gebrauchen können, «щось дуже стало б у пригоді».'

  - de: benötigen
    ipa: "bəˈnøːtɪgn̩"
    pos: verb
    praesens_3sg: benötigt
    partizip2: benötigt
    aux: haben
    valence: "+ Akk"
    # Recognition only: A1 `brauchen` ships "to need" as a production card in
    # goethe-a1-kernwortschatz — this is the same prompt in office clothes.
    cards: recognition
    en: to require, to need
    ru: требоваться, нуждаться в чём-то
    uk: потребувати, вимагати
    example_de: Für den Antrag benötigen Sie einen gültigen Ausweis.
    example_en: For the application you need a valid ID.
    example_ru: Для заявления вам потребуется действующее удостоверение.
    example_uk: Для заяви вам знадобиться чинне посвідчення.
    note:
      en: 'Regular, inseparable: benötigt, hat benötigt. Pure officialese: it is what a form, an office letter and a set of instructions say instead of brauchen. Reading it is the skill that matters — Sie benötigen folgende Unterlagen is the line that tells you what to bring. In speech, brauchen every time.'
      ru: 'Правильный глагол, неотделяемый: benötigt, hat benötigt. Чистая канцелярия: так пишут в бланке, письме из ведомства и инструкции вместо brauchen. Важен навык чтения — строка Sie benötigen folgende Unterlagen сообщает, что взять с собой. В речи всегда brauchen.'
      uk: 'Правильне дієслово, невідокремлюване: benötigt, hat benötigt. Чиста канцелярія: так пишуть у бланку, листі з відомства й інструкції замість brauchen. Важлива навичка читання — рядок Sie benötigen folgende Unterlagen повідомляє, що взяти із собою. У мовленні завжди brauchen.'

  - de: besorgen
    ipa: "bəˈzɔʁgn̩"
    pos: verb
    praesens_3sg: besorgt
    partizip2: besorgt
    aux: haben
    valence: "+ Akk"
    # Recognition only: `bekommen`, `kriegen` and `holen` all ship "to get" as
    # production cards, so the typed prompt is answered three times before this one.
    cards: recognition
    en: to get hold of, to see to (something)
    ru: раздобыть, достать; позаботиться о чём-то
    uk: роздобути, дістати; подбати про щось
    example_de: Ich besorge die Getränke für das Fest.
    example_en: I will see to the drinks for the party.
    example_ru: Напитки для праздника беру на себя я.
    example_uk: Напої для свята беру на себе я.
    note:
      en: 'Regular, inseparable: besorgt, hat besorgt. It combines getting and taking responsibility — holen is only fetching, kaufen only buying. Die Besorgungen are the errands you run in town. Do not confuse it with the adjective besorgt, which means worried.'
      ru: 'Правильный глагол, неотделяемый: besorgt, hat besorgt. Совмещает «достать» и «взять на себя»: holen — только сходить и принести, kaufen — только купить. Die Besorgungen — дела и покупки в городе. Не путать с прилагательным besorgt — «обеспокоенный».'
      uk: 'Правильне дієслово, невідокремлюване: besorgt, hat besorgt. Поєднує «дістати» і «взяти на себе»: holen — лише сходити й принести, kaufen — лише купити. Die Besorgungen — справи й покупки в місті. Не плутати з прикметником besorgt — «занепокоєний».'

  - de: anschaffen
    ipa: "ˈanˌʃafn̩"
    pos: verb
    praesens_3sg: schafft an
    partizip2: angeschafft
    aux: haben
    valence: "+ Akk"
    # Recognition only: `kaufen` (einkaufen-geschaefte) ships "to buy" as a production
    # card, and the difference this word adds — that the purchase is a big one — is
    # not something a typed prompt can ask for.
    cards: recognition
    en: to buy (something large), to acquire
    en_compact: to buy something large
    ru: приобретать (что-то крупное)
    uk: придбавати (щось велике)
    example_de: Wir haben uns eine neue Waschmaschine angeschafft.
    example_en: We have bought ourselves a new washing machine.
    example_ru: Мы приобрели новую стиральную машину.
    example_uk: Ми придбали нову пральну машину.
    note:
      en: 'Separable, stress on an: schafft an, hat angeschafft. Almost always with a dative reflexive (sich etwas anschaffen) and almost always about something expensive and lasting — a car, a machine, a piece of furniture. Bread and milk are simply gekauft. The noun die Anschaffung is the purchase itself.'
      ru: 'Отделяемый глагол, ударение на an: schafft an, hat angeschafft. Почти всегда с возвратным Dativ (sich etwas anschaffen) и почти всегда о дорогом и долговечном — машина, техника, мебель. Хлеб и молоко просто gekauft. Существительное die Anschaffung — сама покупка.'
      uk: 'Відокремлюване дієслово, наголос на an: schafft an, hat angeschafft. Майже завжди зі зворотним Dativ (sich etwas anschaffen) і майже завжди про дороге й довговічне — машина, техніка, меблі. Хліб і молоко просто gekauft. Іменник die Anschaffung — сама покупка.'

  # --- Haben, halten, bekommen, geben ---
  - de: besitzen
    ipa: "bəˈzɪtsn̩"
    pos: verb
    praesens_3sg: besitzt
    partizip2: besessen
    aux: haben
    valence: "+ Akk"
    en: to own, to possess
    ru: владеть, иметь в собственности
    uk: володіти, мати у власності
    example_de: Sie besitzt seit zehn Jahren eine kleine Wohnung in Leipzig.
    example_en: She has owned a small flat in Leipzig for ten years.
    example_ru: Уже десять лет она владеет маленькой квартирой в Лейпциге.
    example_uk: Уже десять років вона володіє маленькою квартирою в Лейпцигу.
    note:
      en: 'Strong verb, inseparable: besitzt, besaß, hat besessen. It is haben narrowed to legal ownership, so it fits property, a licence and a right, and never a headache or an appointment. Der Besitzer and die Besitzerin are the owners, and der Besitz is the property itself.'
      ru: 'Сильный глагол, неотделяемый: besitzt, besaß, hat besessen. Это haben, суженное до права собственности: подходит для недвижимости, лицензии, права — но не для головной боли или встречи. Der Besitzer и die Besitzerin — владелец и владелица, der Besitz — само имущество.'
      uk: 'Сильне дієслово, невідокремлюване: besitzt, besaß, hat besessen. Це haben, звужене до права власності: годиться для нерухомості, ліцензії, права — але не для головного болю чи зустрічі. Der Besitzer і die Besitzerin — власник і власниця, der Besitz — саме майно.'

  - de: behalten
    ipa: "bəˈhaltn̩"
    pos: verb
    praesens_3sg: behält
    partizip2: behalten
    aux: haben
    valence: "+ Akk"
    en: to keep
    ru: оставить себе, сохранить
    uk: залишити собі, зберегти
    example_de: Den Bon können Sie behalten, ich brauche ihn nicht.
    example_en: You can keep the receipt, I do not need it.
    example_ru: Чек можете оставить себе, он мне не нужен.
    example_uk: Чек можете залишити собі, він мені не потрібен.
    note:
      en: 'Strong verb, inseparable: behält, behielt, hat behalten — no ge- in the participle. It means to go on having something you already have; bleiben is about staying somewhere and halten about holding. Two everyday phrases live on it: etwas für sich behalten (to keep it to yourself) and recht behalten (to turn out to have been right).'
      ru: 'Сильный глагол, неотделяемый: behält, behielt, hat behalten — без ge- в причастии. Значит «продолжать иметь то, что уже есть»; bleiben — оставаться где-то, halten — держать. Два бытовых оборота: etwas für sich behalten («держать при себе») и recht behalten («оказаться правым»).'
      uk: 'Сильне дієслово, невідокремлюване: behält, behielt, hat behalten — без ge- у дієприкметнику. Означає «продовжувати мати те, що вже є»; bleiben — залишатися десь, halten — тримати. Два побутові звороти: etwas für sich behalten («тримати при собі») і recht behalten («виявитися правим»).'

  - de: erhalten
    ipa: "ɛɐ̯ˈhaltn̩"
    pos: verb
    praesens_3sg: erhält
    partizip2: erhalten
    aux: haben
    valence: "+ Akk"
    # Recognition only: `bekommen` (A1) and `kriegen` (A2) both ship "to receive" as
    # production cards; this is that prompt in the register of a letter.
    cards: recognition
    en: to receive (formally); to preserve
    en_compact: to receive; to preserve
    ru: получать (официально); сохранять
    uk: отримувати (офіційно); зберігати
    example_de: Ihre Anmeldung haben wir gestern erhalten.
    example_en: We received your registration yesterday.
    example_ru: Вашу заявку мы получили вчера.
    example_uk: Вашу заявку ми отримали вчора.
    note:
      en: 'Strong verb, inseparable: erhält, erhielt, hat erhalten. It is the written bekommen and opens half the office letters you will read (Sie erhalten in Kürze eine Nachricht). The second sense is preservation — ein Gebäude erhalten — and gut erhalten on a small ad means in good condition.'
      ru: 'Сильный глагол, неотделяемый: erhält, erhielt, hat erhalten. Это письменное bekommen; с него начинается половина официальных писем (Sie erhalten in Kürze eine Nachricht). Второе значение — сохранение: ein Gebäude erhalten, а gut erhalten в объявлении значит «в хорошем состоянии».'
      uk: 'Сильне дієслово, невідокремлюване: erhält, erhielt, hat erhalten. Це писемне bekommen; з нього починається половина офіційних листів (Sie erhalten in Kürze eine Nachricht). Друге значення — збереження: ein Gebäude erhalten, а gut erhalten в оголошенні означає «у доброму стані».'

  - de: empfangen
    ipa: "ɛmˈpfaŋən"
    pos: verb
    praesens_3sg: empfängt
    partizip2: empfangen
    aux: haben
    valence: "+ Akk"
    # Recognition only: the same "to receive" prompt as A1 `bekommen`, plus a second
    # sense (to receive a guest) that a single typed card could not choose between.
    cards: recognition
    en: to receive (a guest, a signal)
    en_compact: to receive a guest or signal
    ru: принимать (гостя, сигнал)
    uk: приймати (гостя, сигнал)
    example_de: Hier empfange ich leider kein Netz.
    example_en: Unfortunately I get no signal here.
    example_ru: Здесь у меня, к сожалению, не ловит сеть.
    example_uk: Тут у мене, на жаль, не ловить мережа.
    note:
      en: 'Strong verb, inseparable: empfängt, empfing, hat empfangen. Two homes: welcoming people (Gäste empfangen) and picking up a signal on a phone, a radio or a television. Der Empfang is both the hotel reception desk and the reception on your phone, and der Empfänger on a parcel is the addressee.'
      ru: 'Сильный глагол, неотделяемый: empfängt, empfing, hat empfangen. Две области: принимать людей (Gäste empfangen) и ловить сигнал — телефон, радио, телевизор. Der Empfang — и стойка регистрации в отеле, и приём сети, а der Empfänger на посылке — получатель.'
      uk: 'Сильне дієслово, невідокремлюване: empfängt, empfing, hat empfangen. Дві сфери: приймати людей (Gäste empfangen) і ловити сигнал — телефон, радіо, телевізор. Der Empfang — і стійка реєстрації в готелі, і прийом мережі, а der Empfänger на посилці — одержувач.'

  - de: bieten
    ipa: "ˈbiːtn̩"
    pos: verb
    praesens_3sg: bietet
    partizip2: geboten
    aux: haben
    valence: "+ Dat + Akk"
    # Recognition only: A2 `anbieten` ships "to offer" as a production card in
    # verben-handlungen-a2-1, and that is the form an invitation actually uses.
    cards: recognition
    en: to offer, to provide
    ru: предлагать, предоставлять
    uk: пропонувати, надавати
    example_de: Die Stadt bietet ihren Bürgern viele kostenlose Kurse.
    example_en: The city provides its residents with many free courses.
    example_ru: Город предоставляет жителям много бесплатных курсов.
    example_uk: Місто надає мешканцям багато безкоштовних курсів.
    note:
      en: 'Strong verb: bietet, bot, hat geboten. Where anbieten is the personal offer over a table (Darf ich Ihnen etwas anbieten?), this one is what an institution, a town or a job provides. The passive-like das Angebot covers both. In an auction it is what a bidder does.'
      ru: 'Сильный глагол: bietet, bot, hat geboten. Если anbieten — личное предложение за столом (Darf ich Ihnen etwas anbieten?), то это глагол о том, что предоставляет учреждение, город или работа. Существительное das Angebot покрывает оба случая. На аукционе так говорят о ставке.'
      uk: 'Сильне дієслово: bietet, bot, hat geboten. Якщо anbieten — особиста пропозиція за столом (Darf ich Ihnen etwas anbieten?), то це дієслово про те, що надає установа, місто чи робота. Іменник das Angebot покриває обидва випадки. На аукціоні так кажуть про ставку.'

  - de: leisten
    ipa: "ˈlaɪ̯stn̩"
    pos: verb
    praesens_3sg: leistet
    partizip2: geleistet
    aux: haben
    valence: "+ Akk / sich + Akk"
    # Recognition only: the bare verb (to accomplish) and the dative-reflexive chunk
    # sich etwas leisten (to afford) are two different prompts, and the second is the
    # one a learner needs — as a chunk, not as this headword.
    cards: recognition
    en: to accomplish, to put in (work); to afford
    en_compact: to accomplish; to afford
    ru: совершать, выполнять (работу); позволить себе
    uk: здійснювати, виконувати (роботу); дозволити собі
    example_de: So eine Reise können wir uns im Moment nicht leisten.
    example_en: We cannot afford a trip like that at the moment.
    example_ru: Такую поездку мы сейчас позволить себе не можем.
    example_uk: Таку подорож ми зараз дозволити собі не можемо.
    note:
      en: 'Regular: leistet, leistete, hat geleistet. Learn the two patterns apart. Without a pronoun it means to accomplish or perform: gute Arbeit leisten, Hilfe leisten, einen Beitrag leisten. With a dative reflexive it is about money, as in the example. Die Leistung is performance, and at an office it is a benefit paid out.'
      ru: 'Правильный глагол: leistet, leistete, hat geleistet. Две схемы стоит развести. Без местоимения — «совершать, выполнять»: gute Arbeit leisten, Hilfe leisten, einen Beitrag leisten. С возвратным Dativ речь о деньгах, как в примере. Die Leistung — результат, достижение, а в ведомстве — выплата.'
      uk: 'Правильне дієслово: leistet, leistete, hat geleistet. Дві схеми варто розвести. Без займенника — «здійснювати, виконувати»: gute Arbeit leisten, Hilfe leisten, einen Beitrag leisten. Зі зворотним Dativ ідеться про гроші, як у прикладі. Die Leistung — результат, досягнення, а у відомстві — виплата.'

