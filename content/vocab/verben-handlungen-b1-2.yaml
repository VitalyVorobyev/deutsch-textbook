    cards: recognition
    en: to insert (into a text or a file)
    en_compact: to insert into a text
    ru: вставлять (в текст или файл)
    uk: вставляти (у текст або файл)
    example_de: Fügen Sie hier bitte ein Foto ein.
    example_en: Please insert a photo here.
    example_ru: Вставьте сюда, пожалуйста, фотографию.
    example_uk: Вставте сюди, будь ласка, світлину.
