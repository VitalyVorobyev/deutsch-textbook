    ru: сопоставлять, относить (к категории)
    uk: зіставляти, відносити (до категорії)
    example_de: Ordnen Sie jedem Bild die passende Überschrift zu.
    example_en: Match each picture with the heading that fits.
    example_ru: Сопоставьте каждой картинке подходящий заголовок.
    example_uk: Зіставте кожному малюнку відповідний заголовок.
    note:
      en: 'Separable, stress on zu: ordnet zu, hat zugeordnet. Two objects: the thing being placed is accusative, the category it goes to is dative. Outside exercise books it appears in administration — ein Konto einer Abteilung zuordnen. The task type itself is called Zuordnung.'
      ru: 'Отделяемый глагол, ударение на zu: ordnet zu, hat zugeordnet. Два дополнения: относимый предмет — Akkusativ, категория — Dativ. Вне учебных заданий встречается в делопроизводстве: ein Konto einer Abteilung zuordnen. Сам тип задания называется Zuordnung.'
      uk: 'Відокремлюване дієслово, наголос на zu: ordnet zu, hat zugeordnet. Два додатки: віднесений предмет — Akkusativ, категорія — Dativ. Поза навчальними завданнями трапляється в діловодстві: ein Konto einer Abteilung zuordnen. Сам тип завдання називається Zuordnung.'

  - de: verteilen
    ipa: "fɛɐ̯ˈtaɪ̯lən"
    pos: verb
    praesens_3sg: verteilt
    partizip2: verteilt
    aux: haben
    valence: "+ Akk an + Akk"
    en: to hand out, to spread out
    ru: раздавать; распределять
    uk: роздавати; розподіляти
    example_de: Der Lehrer verteilt die Kopien an die Gruppe.
    example_en: The teacher hands the copies out to the group.
    example_ru: Учитель раздаёт копии группе.
    example_uk: Учитель роздає копії групі.
    note:
      en: 'Regular, inseparable: verteilt, hat verteilt. Recipients take an + Akkusativ, an area takes auf or über. It is one thing split among many, which is what separates it from geben. The everyday noun is die Verteilung, and a shared workload is gut verteilt.'
      ru: 'Правильный глагол, неотделяемый: verteilt, hat verteilt. Получатели вводятся через an + Akkusativ, площадь — через auf или über. Смысл: одно делится между многими, чем глагол и отличается от geben. Существительное die Verteilung, а о разделённой нагрузке говорят gut verteilt.'
      uk: 'Правильне дієслово, невідокремлюване: verteilt, hat verteilt. Одержувачі вводяться через an + Akkusativ, площа — через auf або über. Зміст: одне ділиться між багатьма, чим дієслово й відрізняється від geben. Іменник die Verteilung, а про розподілене навантаження кажуть gut verteilt.'

  - de: verbinden
    ipa: "fɛɐ̯ˈbɪndn̩"
    pos: verb
    praesens_3sg: verbindet
    partizip2: verbunden
    aux: haben
    valence: "+ Akk mit + Dat"
    en: to connect, to join
    ru: соединять, связывать
    uk: з’єднувати, поєднувати
    example_de: Diese Bahn verbindet die beiden Stadtteile.
    example_en: This tram line connects the two districts.
    example_ru: Эта линия соединяет два района города.
    example_uk: Ця лінія з’єднує два райони міста.
    note:
      en: 'Strong verb, inseparable: verbindet, verband, hat verbunden. The second element takes mit + Dativ. On the phone Ich verbinde Sie means putting a caller through, and die Verbindung is a connection in every sense: a train link, an internet link, a personal tie. A wound is also verbunden — bandaged.'
      ru: 'Сильный глагол, неотделяемый: verbindet, verband, hat verbunden. Второй элемент вводится через mit + Dativ. По телефону Ich verbinde Sie значит «соединяю», а die Verbindung — связь в любом смысле: пересадка, интернет, личные отношения. Рану тоже verbinden — перевязывать.'
      uk: 'Сильне дієслово, невідокремлюване: verbindet, verband, hat verbunden. Другий елемент вводиться через mit + Dativ. По телефону Ich verbinde Sie означає «з’єдную», а die Verbindung — зв’язок у будь-якому сенсі: пересадка, інтернет, особисті стосунки. Рану теж verbinden — перев’язувати.'

  # --- Weitermachen, unterlassen, gelingen ---
  - de: fortsetzen
    ipa: "ˈfɔʁtˌzɛtsn̩"
    pos: verb
    praesens_3sg: setzt fort
    partizip2: fortgesetzt
    aux: haben
    valence: "+ Akk"
    # Recognition only: `weitermachen` (infinitiv-mit-zu) ships "to keep going" as a
    # production card, and that is the spoken form; this one belongs to a written
    # announcement.
    cards: recognition
    en: to continue (something interrupted)
    en_compact: to continue something
    ru: продолжать (прерванное)
    uk: продовжувати (перерване)
    example_de: Nach der Pause setzen wir die Diskussion fort.
    example_en: After the break we will continue the discussion.
    example_ru: После перерыва мы продолжим обсуждение.
    example_uk: Після перерви ми продовжимо обговорення.
    note:
      en: 'Separable, stress on fort: setzt fort, hat fortgesetzt. It needs an accusative object, which is what separates it from weitermachen (no object) and from weitergehen (a thing carries on by itself). Die Fortsetzung is the next episode of a series and the continued part of a text — Fortsetzung folgt.'
      ru: 'Отделяемый глагол, ударение на fort: setzt fort, hat fortgesetzt. Требует дополнения в Akkusativ, чем и отличается от weitermachen (без дополнения) и weitergehen (что-то продолжается само). Die Fortsetzung — следующая серия и продолжение текста: Fortsetzung folgt.'
      uk: 'Відокремлюване дієслово, наголос на fort: setzt fort, hat fortgesetzt. Потребує додатка в Akkusativ, чим і відрізняється від weitermachen (без додатка) і weitergehen (щось триває саме). Die Fortsetzung — наступна серія та продовження тексту: Fortsetzung folgt.'

  - de: unterlassen
    ipa: "ʊntɐˈlasn̩"
    pos: verb
    praesens_3sg: unterlässt
    partizip2: unterlassen
    aux: haben
    valence: "+ Akk"
    # Recognition only: pure notice-and-warning register — a house rule or a legal
    # letter tells you to refrain from something; a learner says nicht machen.
    cards: recognition
    en: to refrain from, to stop doing
    ru: воздерживаться от, прекратить (делать)
    uk: утримуватися від, припинити (робити)
    example_de: Bitte unterlassen Sie das Rauchen im Treppenhaus.
    example_en: Please refrain from smoking in the stairwell.
    example_ru: Пожалуйста, воздержитесь от курения на лестнице.
    example_uk: Будь ласка, утримайтеся від куріння на сходах.
    note:
      en: 'Strong verb, inseparable: unterlässt, unterließ, hat unterlassen — no ge-. It is the sharp, formal way of telling someone to stop, and it lives on notices, in house rules and in letters from a lawyer. Speech says Bitte machen Sie das nicht. Reading it correctly is what matters.'
      ru: 'Сильный глагол, неотделяемый: unterlässt, unterließ, hat unterlassen — без ge-. Резкая официальная форма требования прекратить; живёт на табличках, в правилах дома и в письмах от юриста. Речь скажет Bitte machen Sie das nicht. Важно именно правильно его прочитать.'
      uk: 'Сильне дієслово, невідокремлюване: unterlässt, unterließ, hat unterlassen — без ge-. Різка офіційна форма вимоги припинити; живе на табличках, у правилах будинку та в листах від юриста. Мовлення скаже Bitte machen Sie das nicht. Важливо саме правильно його прочитати.'

  - de: verursachen
    ipa: "fɛɐ̯ˈʔuːɐ̯zaxn̩"
    pos: verb
    praesens_3sg: verursacht
    partizip2: verursacht
    aux: haben
    valence: "+ Akk"
    en: to cause
    ru: приводить к, быть причиной
    uk: призводити до, бути причиною
    example_de: Der Unfall hat einen langen Stau verursacht.
    example_en: The accident caused a long traffic jam.
    example_ru: Авария вызвала длинную пробку.
    example_uk: Аварія спричинила довгий затор.
    note:
      en: 'Regular, inseparable: verursacht, hat verursacht. The subject is the cause, the accusative object is the result — damage, costs, a delay, a problem. It is the verb an insurance form and a news report reach for, and it is worth being able to write in a complaint. Die Ursache is the cause itself.'
      ru: 'Правильный глагол, неотделяемый: verursacht, hat verursacht. Подлежащее — причина, дополнение в Akkusativ — следствие: ущерб, расходы, задержка, проблема. Этим глаголом пользуются бланк страховой и новостная заметка, и его полезно уметь написать в жалобе. Die Ursache — сама причина.'
      uk: 'Правильне дієслово, невідокремлюване: verursacht, hat verursacht. Підмет — причина, додаток у Akkusativ — наслідок: шкода, витрати, затримка, проблема. Цим дієсловом користуються бланк страхової та новинна замітка, і його корисно вміти написати у скарзі. Die Ursache — сама причина.'

  - de: gelingen
    ipa: "gəˈlɪŋən"
    pos: verb
    praesens_3sg: gelingt
    partizip2: gelungen
    aux: sein
    valence: "+ Dat"
    # Recognition only: the sentence pattern is impersonal with a dative experiencer
    # (es gelingt mir), so a typed prompt asking for a plain infinitive teaches the
    # wrong shape; A2 `schaffen` is what a learner produces.
    cards: recognition
    en: to succeed, to work out well
    ru: удаваться, получаться
    uk: удаватися, виходити
    example_de: Der Kuchen ist mir diesmal wirklich gut gelungen.
    example_en: The cake really turned out well for me this time.
    example_ru: Пирог у меня в этот раз действительно удался.
    example_uk: Пиріг у мене цього разу справді вдався.
    note:
      en: 'Strong verb with sein: gelingt, gelang, ist gelungen. The person is dative and the thing that works out is the subject — es ist mir gelungen, ihn zu erreichen. That is the mirror image of schaffen, where the person is the subject. Its opposite is misslingen, and the adjective gelungen means a success.'
      ru: 'Сильный глагол с sein: gelingt, gelang, ist gelungen. Человек стоит в Dativ, а подлежащее — то, что удалось: es ist mir gelungen, ihn zu erreichen. Это зеркальное отражение schaffen, где подлежащее — сам человек. Противоположность — misslingen, а прилагательное gelungen значит «удачный».'
      uk: 'Сильне дієслово із sein: gelingt, gelang, ist gelungen. Людина стоїть у Dativ, а підметом є те, що вдалося: es ist mir gelungen, ihn zu erreichen. Це дзеркальне відображення schaffen, де підметом є сама людина. Протилежність — misslingen, а прикметник gelungen означає «вдалий».'

  - de: ausrichten
    ipa: "ˈaʊ̯sˌʁɪçtn̩"
    pos: verb
    praesens_3sg: richtet aus
    partizip2: ausgerichtet
    aux: haben
    valence: "+ Dat + Akk"
    # Recognition only: passing on a message, hosting an event and aligning a thing
