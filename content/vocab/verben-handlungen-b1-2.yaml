      ru: 'Правильный глагол: ordnet, ordnete, hat geordnet. Признак вводится через nach (nach dem Alphabet, nach der Größe). Aufräumen — убирать комнату, а этот глагол выстраивает вещи в порядке. Die Ordnung — порядок, а In Ordnung! — бытовое «ладно, хорошо».'
      uk: 'Правильне дієслово: ordnet, ordnete, hat geordnet. Ознака вводиться через nach (nach dem Alphabet, nach der Größe). Aufräumen — прибирати кімнату, а це дієслово вибудовує речі в певному порядку. Die Ordnung — порядок, а In Ordnung! — побутове «гаразд».'

