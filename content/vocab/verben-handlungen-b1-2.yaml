    cards: recognition
    en: to pass on (a message); to host (an event)
    en_compact: to pass on a message; to host
    ru: передать (сообщение); проводить (мероприятие)
    uk: передати (повідомлення); проводити (захід)
    example_de: Kann ich ihr etwas ausrichten?
    example_en: Can I pass on a message to her?
    example_ru: Что-нибудь ей передать?
    example_uk: Щось їй передати?
    note:
      en: 'Separable, stress on aus: richtet aus, hat ausgerichtet. The example is the standard telephone sentence when the person asked for is not there, and the reply is Bitte richten Sie ihr aus, dass … The second sense hosts a wedding, a conference or a championship. A third, technical one aligns a thing straight.'
      ru: 'Отделяемый глагол, ударение на aus: richtet aus, hat ausgerichtet. Пример — стандартная телефонная фраза, когда нужного человека нет на месте; ответ звучит Bitte richten Sie ihr aus, dass … Второе значение — организовывать свадьбу, конференцию, чемпионат. Третье, техническое, — выравнивать.'
      uk: 'Відокремлюване дієслово, наголос на aus: richtet aus, hat ausgerichtet. Приклад — стандартна телефонна фраза, коли потрібної людини немає на місці; відповідь звучить Bitte richten Sie ihr aus, dass … Друге значення — організовувати весілля, конференцію, чемпіонат. Третє, технічне, — вирівнювати.'

  - de: handeln
    ipa: "ˈhandl̩n"
    pos: verb
    praesens_3sg: handelt
    partizip2: gehandelt
    aux: haben
    valence: "mit + Dat / sich um + Akk"
    # Recognition only: three jobs on one headword — to act, to trade, and the
    # impersonal es handelt sich um, which is the one a B1 reader meets most.
    cards: recognition
    en: to act; to trade; (es handelt sich um) to be a matter of
    en_compact: to act; to trade; to be a matter of
    ru: действовать; торговать; речь идёт о
    uk: діяти; торгувати; ідеться про
    example_de: Bei dem Schreiben handelt es sich um eine Mahnung.
    example_en: The letter in question is a payment reminder.
    example_ru: Речь в письме идёт о напоминании об оплате.
    example_uk: У листі йдеться про нагадування про оплату.
    note:
      en: 'Regular: handelt, handelte, hat gehandelt. Keep the three apart. Alone it means to act and take steps (Wir müssen schnell handeln). With mit + Dativ it means to trade in goods. The impersonal es handelt sich um + Akkusativ, in the example, is the formal way of saying what something is, and von etwas handeln is what a book or a film is about.'
      ru: 'Правильный глагол: handelt, handelte, hat gehandelt. Три значения стоит развести. Само по себе — «действовать, предпринимать шаги» (Wir müssen schnell handeln). С mit + Dativ — «торговать чем-то». Безличное es handelt sich um + Akkusativ, как в примере, — официальный способ сказать, что это такое; а von etwas handeln — о чём книга или фильм.'
      uk: 'Правильне дієслово: handelt, handelte, hat gehandelt. Три значення варто розвести. Само по собі — «діяти, вживати заходів» (Wir müssen schnell handeln). З mit + Dativ — «торгувати чимось». Безособове es handelt sich um + Akkusativ, як у прикладі, — офіційний спосіб сказати, що це таке; а von etwas handeln — про що книжка чи фільм.'

  - de: dienen
    ipa: "ˈdiːnən"
    pos: verb
    praesens_3sg: dient
    partizip2: gedient
    aux: haben
    valence: "+ Dat / zu + Dat"
    # Recognition only: the everyday question is what a thing is FOR, and German
    # answers it with wofür ist das or damit kann man …; this verb belongs to a
    # written explanation.
    cards: recognition
    en: to serve (a purpose)
    en_compact: to serve a purpose
    ru: служить (для чего-то)
    uk: служити (для чогось)
    example_de: Dieses Formular dient nur zur Information.
    example_en: This form serves only as information.
    example_ru: Этот бланк служит только для информации.
    example_uk: Цей бланк служить лише для інформації.
    note:
      en: 'Regular: dient, diente, hat gedient. The purpose takes zu + Dativ or als + Nominative, and the beneficiary takes the plain dative (Das dient der Sicherheit). It is the written answer to what something is for; in speech the question is Wofür ist das? Der Dienst is the service or the shift, and the note on a door is Außer Dienst.'
      ru: 'Правильный глагол: dient, diente, hat gedient. Цель вводится через zu + Dativ или als с Nominativ, а адресат стоит в чистом Dativ (Das dient der Sicherheit). Это письменный ответ на вопрос о назначении; в речи спрашивают Wofür ist das? Der Dienst — служба или смена, а табличка на двери гласит Außer Dienst.'
      uk: 'Правильне дієслово: dient, diente, hat gedient. Мета вводиться через zu + Dativ або als з Nominativ, а адресат стоїть у чистому Dativ (Das dient der Sicherheit). Це писемна відповідь на питання про призначення; у мовленні питають Wofür ist das? Der Dienst — служба або зміна, а табличка на дверях каже Außer Dienst.'
