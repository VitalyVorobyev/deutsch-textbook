      ru: 'Отделяемый глагол, ударение на ein: führt ein, hat eingeführt. Дополнение — правило, закон, система, товар; человека представляют через vorstellen. В торговле значит «импортировать», отсюда die Einfuhr на таможенных табличках. Die Einführung — ещё и вводная часть текста.'
      uk: 'Відокремлюване дієслово, наголос на ein: führt ein, hat eingeführt. Додаток — правило, закон, система, товар; людину представляють через vorstellen. У торгівлі означає «імпортувати», звідси die Einfuhr на митних табличках. Die Einführung — ще й вступна частина тексту.'

  # --- Teile an ihren Platz: einsetzen, ergänzen, ordnen ---
