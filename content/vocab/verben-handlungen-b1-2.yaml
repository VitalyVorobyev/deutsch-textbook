      ru: 'Отделяемый глагол, ударение на ein: fügt ein, hat eingefügt. Это слово из меню рядом с Kopieren и Ausschneiden и из подписи к полю формы. Родственное sich einfügen значит «вписаться в коллектив». В быту «вставить» скажут einsetzen или просто reinmachen.'
      uk: 'Відокремлюване дієслово, наголос на ein: fügt ein, hat eingefügt. Це слово з меню поряд із Kopieren і Ausschneiden та з підпису до поля форми. Споріднене sich einfügen означає «вписатися в колектив». У побуті «вставити» скажуть einsetzen або просто reinmachen.'

  - de: ergänzen
