    ru: разрабатывать; развиваться
    uk: розробляти; розвиватися
    example_de: Die Firma entwickelt eine App für den Nahverkehr.
    example_en: The company is developing an app for local transport.
    example_ru: Фирма разрабатывает приложение для городского транспорта.
    example_uk: Фірма розробляє застосунок для міського транспорту.
    note:
      en: 'Regular, inseparable: entwickelt, hat entwickelt. With an accusative object somebody develops something; with sich the thing develops on its own (die Stadt hat sich stark entwickelt), and that reflexive is the more common half at B1. Die Entwicklung covers both, from software to a child growing up.'
      ru: 'Правильный глагол, неотделяемый: entwickelt, hat entwickelt. С Akkusativ кто-то что-то разрабатывает; с sich предмет развивается сам (die Stadt hat sich stark entwickelt), и на уровне B1 возвратная половина встречается чаще. Die Entwicklung покрывает и разработку программ, и взросление ребёнка.'
      uk: 'Правильне дієслово, невідокремлюване: entwickelt, hat entwickelt. З Akkusativ хтось щось розробляє; із sich річ розвивається сама (die Stadt hat sich stark entwickelt), і на рівні B1 зворотна половина трапляється частіше. Die Entwicklung покриває і розробку програм, і дорослішання дитини.'

  - de: entstehen
    ipa: "ɛntˈʃteːən"
    pos: verb
    praesens_3sg: entsteht
    partizip2: entstanden
    aux: sein
    en: to arise, to come into being
    ru: возникать, появляться
    uk: виникати, з’являтися
    example_de: Durch die Reparatur entstehen Ihnen keine Kosten.
    example_en: The repair will not give rise to any costs for you.
    example_ru: В связи с ремонтом никаких расходов у вас не возникнет.
    example_uk: Через ремонт жодних витрат у вас не виникне.
    note:
      en: 'Strong verb with sein: entsteht, entstand, ist entstanden. Nothing does the making — a thing simply comes about: costs, a problem, a friendship, a new district. The everyday sentence to hold whole is the one in the example, which you will meet at a repair desk and in an insurance letter. The cause is introduced with durch.'
      ru: 'Сильный глагол с sein: entsteht, entstand, ist entstanden. Действующего лица нет: что-то просто возникает — расходы, проблема, дружба, новый район. Предложение из примера стоит выучить целиком: оно встречается в мастерской и в письме от страховой. Причина вводится через durch.'
      uk: 'Сильне дієслово із sein: entsteht, entstand, ist entstanden. Дійової особи немає: щось просто виникає — витрати, проблема, дружба, новий район. Речення з прикладу варто вивчити цілим: воно трапляється в майстерні та в листі від страхової. Причина вводиться через durch.'

  - de: erfinden
    ipa: "ɛɐ̯ˈfɪndn̩"
    pos: verb
    praesens_3sg: erfindet
    partizip2: erfunden
    aux: haben
    valence: "+ Akk"
    en: to invent, to make up
    ru: изобретать; выдумывать
    uk: винаходити; вигадувати
    example_de: Wer hat eigentlich den Reißverschluss erfunden?
    example_en: Who actually invented the zip?
    example_ru: А кто, собственно, изобрёл застёжку-молнию?
    example_uk: А хто, власне, винайшов застібку-блискавку?
    note:
      en: 'Strong verb, inseparable: erfindet, erfand, hat erfunden. It covers both the technical invention and the invented story (eine Ausrede erfinden). Note the pair: entdecken finds something that was already there, this one makes something that was not. Die Erfindung is the invention.'
      ru: 'Сильный глагол, неотделяемый: erfindet, erfand, hat erfunden. Покрывает и техническое изобретение, и выдуманную историю (eine Ausrede erfinden). Пара важная: entdecken — найти то, что уже было, а этот глагол — создать то, чего не было. Die Erfindung — изобретение.'
      uk: 'Сильне дієслово, невідокремлюване: erfindet, erfand, hat erfunden. Покриває і технічний винахід, і вигадану історію (eine Ausrede erfinden). Пара важлива: entdecken — знайти те, що вже було, а це дієслово — створити те, чого не було. Die Erfindung — винахід.'

  - de: entdecken
    ipa: "ɛntˈdɛkn̩"
    pos: verb
    praesens_3sg: entdeckt
    partizip2: entdeckt
    aux: haben
    valence: "+ Akk"
