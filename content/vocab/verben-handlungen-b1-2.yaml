      ru: 'Правильный глагол, неотделяемый: ergänzt, hat ergänzt. Добавляет недостающую часть — поэтому им полны формулировки заданий и бланки. Два человека тоже могут дополнять друг друга: Die beiden ergänzen sich gut. Die Ergänzung — само дополнение.'
      uk: 'Правильне дієслово, невідокремлюване: ergänzt, hat ergänzt. Додає частину, якої бракувало, — тому ним сповнені формулювання завдань і бланки. Двоє людей теж можуть доповнювати одне одного: Die beiden ergänzen sich gut. Die Ergänzung — саме доповнення.'

  - de: ordnen
