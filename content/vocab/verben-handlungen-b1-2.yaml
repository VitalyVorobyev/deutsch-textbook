    cards: recognition
    en: to insert; to deploy, to bring into action
    ru: вставлять; задействовать, применять
    uk: вставляти; залучати, застосовувати
    example_de: Setzen Sie die fehlenden Wörter in den Text ein.
    example_en: Insert the missing words into the text.
    example_ru: Вставьте пропущенные слова в текст.
    example_uk: Вставте пропущені слова в текст.
    note:
      en: 'Separable, stress on ein: setzt ein, hat eingesetzt. The example is exercise-book language and is where a learner meets it first. In a report it deploys people or machines (Die Feuerwehr wurde eingesetzt), and sich für etwas einsetzen means to campaign for something. Der Einsatz is the deployment, the commitment and the stake all at once.'
      ru: 'Отделяемый глагол, ударение на ein: setzt ein, hat eingesetzt. Пример — язык учебных заданий, где слово и встречается впервые. В сводке оно задействует людей или технику (Die Feuerwehr wurde eingesetzt), а sich für etwas einsetzen значит «выступать за что-то». Der Einsatz — и операция, и самоотдача, и ставка.'
      uk: 'Відокремлюване дієслово, наголос на ein: setzt ein, hat eingesetzt. Приклад — мова навчальних завдань, де слово й трапляється вперше. У зведенні воно залучає людей або техніку (Die Feuerwehr wurde eingesetzt), а sich für etwas einsetzen означає «виступати за щось». Der Einsatz — і операція, і самовіддача, і ставка.'

