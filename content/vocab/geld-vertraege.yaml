id: geld-vertraege
title_de: "Geld & Verträge"
title_en: "Money and contracts"
title_ru: "Деньги и договоры"
title_uk: "Гроші та договори"
level: B1
# B1.13 is a genre unit: it owns no grammar point, so the deck carries the whole
# weight of what is new here — the words a Rechnung, a Vertrag and a
# Kostenvoranschlag are made of, plus the language for asking about them and
# comparing what two of them cost.
#
# Three constraints shaped the list.
#
# 1. The frozen contract excludes banking and insurance law, investment
#    vocabulary and tax content. So no `Zinsen`, no `Versicherung`, no `Steuer`
#    — all three are free on the manifest and all three were left there. Every
#    headword is one a person who has just been sent a bill has to read or say:
#    Zeile, Kosten, Zahlung, Mahnung, Kündigung, fällig, gültig.
# 2. The money and contract words the learner already owns are RECYCLED in the
#    article, the reading and the notes below, never re-taught (the validator
#    hard-fails a headword living in two decks): Rechnung, Preis, kosten,
#    bezahlen, bestellen (essen-trinken); Vertrag (arbeit-beruf); Konto,
#    überweisen, bar, zahlen, sparen, ausgeben, Gehalt, Ermäßigung, Empfänger,
#    liefern (einkaufen-geld-a2); Quittung, Reklamation, Fehler, günstig
#    (einkaufen-reklamation); Kunde, Kundin, Angebot (einkaufen-geschaefte);
#    Gebühr, Unterschrift, unterschreiben, Antrag, Anmeldung
#    (aemter-dienstleistungen); Betrag, Zuschlag, inklusive, Bestätigung
#    (reisen-probleme); Bedingung, verlängern (regeln-verantwortung); Frist,
#    Lohn (arbeit-bewerbung); kündigen, prüfen (arbeit-ausbildung-a2); Beleg,
#    Rabatt, Ware, Lieferung (konsum-umwelt); Summe, insgesamt, berechnen,
#    erhöhen (zahlen-mengen-masse-b1); monatlich, jährlich (zeit-b1); teuer,
#    billig, Miete (wohnen); Kaution, Nebenkosten, Reparatur (wohnen-umzug);
#    vereinbaren (termine-zeit); nachfragen (lernen-verstehen). Their slots went
#    to the neighbour this unit genuinely adds — Zahlung beside zahlen, Mahnung
#    beside Rechnung, Anbieter beside Kunde, fällig beside gültig, Auftrag
#    beside Bestellung.
#    The unit is noun-heavy for the same reason, and that is a finding rather
#    than a preference: of the domain's everyday verbs, kündigen, bezahlen,
#    überweisen, sparen, ausgeben, prüfen, berechnen, vereinbaren, bestellen and
#    unterschreiben are all owned by earlier decks, so the five verbs below are
#    what the field has left.
# 3. Every headword is on the Goethe-B1 Wortliste and owned by no other deck,
#    checked with
#    `bun scripts/coverage.ts B1 --check-deck content/vocab/geld-vertraege.yaml`.
#    Two words the frozen outcomes themselves name — `Tarif` and
#    `Kostenvoranschlag` — are NOT on the manifest, so they cannot take a card:
#    they are taught receptively, in the article's tables and in the reading,
#    which is where language that earns no flashcard belongs.
#
# Tiering, decided once and never retrofitted: the 22 entries the unit actively
# teaches ship as `both`; the 16 below the divider are the receptive tail —
# language a bill, a set of terms and conditions and a Mahnung say to you, and
# `cards: recognition` from the start because the direction is baked into the
# card id.
entries:
  # --- Core (cards: both by default) --------------------------------------
  # Reading a bill line by line, asking what a contract commits you to, and
  # comparing two prices out loud. These the learner produces.

  - de: "Zeile"
    ipa: "ˈtsaɪ̯lə"
    pos: noun
    gender: f
    plural: "die Zeilen"
    en: "line of text on a page or a bill"
    ru: "строка, строчка"
    uk: "рядок, рядочок"
    example_de: "In der dritten Zeile stimmt der Preis nicht."
    example_en: "The price in the third line is wrong."
    example_ru: "В третьей строке цена не сходится."
    example_uk: "У третьому рядку ціна не сходиться."
    note:
      en: "A bill is read Zeile für Zeile: one line, one item, one price. A numbered part of a contract is ein Abschnitt, and a box on a form is ein Feld."
      ru: "Счёт читают Zeile für Zeile: одна строка — одна услуга и одна цена. Нумерованная часть договора — ein Abschnitt, поле бланка — ein Feld."
      uk: "Рахунок читають Zeile für Zeile: один рядок — одна послуга й одна ціна. Нумерована частина договору — ein Abschnitt, поле бланка — ein Feld."

  - de: "Kosten"
    ipa: "ˈkɔstn̩"
    pos: phrase
    en: "costs, what something comes to altogether"
    ru: "расходы, затраты"
    uk: "витрати, кошти"
    example_de: "Die Kosten für die Reparatur sind höher als im Angebot."
    example_en: "The costs of the repair are higher than in the quote."
    example_ru: "Расходы на ремонт выше, чем в предложении."
    example_uk: "Витрати на ремонт вищі, ніж у пропозиції."
    note:
      en: "Plural only, so the verb is plural too: Die Kosten sind hoch. One thing has einen Preis; everything together has Kosten. Fixed chunks: auf eigene Kosten, die Kosten übernehmen."
      ru: "Только множественное число, поэтому и глагол во множественном: Die Kosten sind hoch. У одной вещи есть ein Preis, а у всего вместе — Kosten. Устойчивые сочетания: auf eigene Kosten, die Kosten übernehmen."
      uk: "Лише множина, тому й дієслово в множині: Die Kosten sind hoch. В однієї речі є ein Preis, а в усього разом — Kosten. Сталі сполучення: auf eigene Kosten, die Kosten übernehmen."

  - de: "Zahlung"
    ipa: "ˈtsaːlʊŋ"
    pos: noun
    gender: f
    plural: "die Zahlungen"
    en: "payment"
    ru: "платёж, оплата"
    uk: "платіж, оплата"
    example_de: "Wir bitten um Zahlung bis zum 17. Mai."
    example_en: "We ask for payment by 17 May."
    example_ru: "Просим произвести оплату до 17 мая."
    example_uk: "Просимо здійснити оплату до 17 травня."
    note:
      en: "The word a bill uses where speech says zahlen: Zahlung bis …, Zahlung per Überweisung. Eine Zahlung leisten is the formal verb phrase; in a shop you simply zahlen."
      ru: "Слово, которым пользуется счёт там, где в речи говорят zahlen: Zahlung bis …, Zahlung per Überweisung. Формальный оборот — eine Zahlung leisten, а в магазине просто zahlen."
      uk: "Слово, яким користується рахунок там, де в мовленні кажуть zahlen: Zahlung bis …, Zahlung per Überweisung. Формальний зворот — eine Zahlung leisten, а в крамниці просто zahlen."

  - de: "Überweisung"
    ipa: "yːbɐˈvaɪ̯zʊŋ"
    pos: noun
    gender: f
    plural: "die Überweisungen"
    en: "bank transfer"
    ru: "банковский перевод"
    uk: "банківський переказ"
    example_de: "Ich habe den Betrag gestern per Überweisung bezahlt."
    example_en: "I paid the amount by bank transfer yesterday."
    example_ru: "Вчера я оплатил сумму банковским переводом."
    example_uk: "Учора я сплатив суму банківським переказом."
    note:
      en: "Money moving from one account to another, and the usual way a bill is paid in Germany: per Überweisung, eine Überweisung machen. At the doctor's the same word names the referral to a specialist."
      ru: "Деньги, идущие с одного счёта на другой, — обычный способ оплатить счёт в Германии: per Überweisung, eine Überweisung machen. У врача то же слово означает направление к специалисту."
      uk: "Гроші, що йдуть з одного рахунку на інший, — звичайний спосіб оплатити рахунок у Німеччині: per Überweisung, eine Überweisung machen. У лікаря те саме слово означає направлення до фахівця."

  - de: "Mahnung"
    ipa: "ˈmaːnʊŋ"
    pos: noun
    gender: f
    plural: "die Mahnungen"
    en: "written reminder to pay"
    ru: "напоминание об оплате, требование оплаты"
    uk: "нагадування про оплату, вимога оплати"
    example_de: "Wer zu spät zahlt, bekommt nach zwei Wochen eine Mahnung."
    example_en: "Anyone who pays late gets a reminder after two weeks."
    example_ru: "Кто платит с опозданием, через две недели получает напоминание."
    example_uk: "Хто платить із запізненням, за два тижні дістає нагадування."
    note:
      en: "The letter that follows an unpaid bill; the polite first one is often called eine Zahlungserinnerung. It usually costs extra, and it is not die Erinnerung, which is a memory."
      ru: "Письмо вслед за неоплаченным счётом; вежливое первое часто называют eine Zahlungserinnerung. Обычно оно стоит дополнительных денег и не путается с die Erinnerung — воспоминанием."
      uk: "Лист услід за несплаченим рахунком; увічливий перший часто називають eine Zahlungserinnerung. Зазвичай воно коштує додаткових грошей і не плутається з die Erinnerung — спогадом."

  - de: "Kündigung"
    ipa: "ˈkʏndɪgʊŋ"
    pos: noun
    gender: f
    plural: "die Kündigungen"
    en: "notice that brings a contract to an end"
    ru: "расторжение договора, заявление о расторжении"
    uk: "розірвання договору, заява про розірвання"
    example_de: "Die Kündigung muss schriftlich geschickt werden."
    example_en: "The notice has to be sent in writing."
    example_ru: "Заявление о расторжении нужно отправить в письменном виде."
    example_uk: "Заяву про розірвання треба надіслати письмово."
    note:
      en: "The same word covers a job and a phone contract: die Kündigung schicken, eine Kündigung bekommen. The verb behind it is kündigen, and what a contract says about the deadline is die Kündigungsfrist."
      ru: "Одно слово и для работы, и для договора связи: die Kündigung schicken, eine Kündigung bekommen. За ним стоит глагол kündigen, а срок, названный в договоре, — die Kündigungsfrist."
      uk: "Одне слово і для роботи, і для договору зв'язку: die Kündigung schicken, eine Kündigung bekommen. За ним стоїть дієслово kündigen, а строк, названий у договорі, — die Kündigungsfrist."

  - de: "Abo"
    ipa: "ˈabo"
    pos: noun
    gender: n
    plural: "die Abos"
    accept: ["das Abonnement"]
    en: "subscription"
    ru: "подписка, абонемент"
    uk: "передплата, абонемент"
    example_de: "Das Abo für die Zeitung kostet neun Euro im Monat."
    example_en: "The subscription to the newspaper costs nine euros a month."
    example_ru: "Подписка на газету стоит девять евро в месяц."
    example_uk: "Передплата на газету коштує дев'ять євро на місяць."
    note:
      en: "The everyday short form of das Abonnement, and the word spoken German actually uses: ein Abo abschließen, ein Abo kündigen. Both forms are accepted on this card."
      ru: "Обиходное сокращение от das Abonnement — именно его и говорят: ein Abo abschließen, ein Abo kündigen. Карточка принимает обе формы."
      uk: "Побутове скорочення від das Abonnement — саме його й кажуть: ein Abo abschließen, ein Abo kündigen. Картка приймає обидві форми."

  - de: "Anbieter"
    ipa: "ˈanˌbiːtɐ"
    pos: noun
    gender: m
    plural: "die Anbieter"
    en: "provider, the firm selling the service"
    ru: "поставщик услуг, оператор"
    uk: "постачальник послуг, оператор"
    example_de: "Bei einem anderen Anbieter kostet der gleiche Tarif zwölf Euro."
    example_en: "At another provider the same plan costs twelve euros."
    example_ru: "У другого оператора такой же тариф стоит двенадцать евро."
    example_uk: "В іншого оператора такий самий тариф коштує дванадцять євро."
    note:
      en: "From anbieten: the side that offers electricity, internet or a phone plan. The other side is der Kunde, which declines dem Kunden, den Kunden (→ B1.4). A woman is die Anbieterin."
      ru: "От anbieten: сторона, предлагающая электричество, интернет или тариф связи. Другая сторона — der Kunde, склоняющийся dem Kunden, den Kunden (→ B1.4). Женский вариант — die Anbieterin."
      uk: "Від anbieten: сторона, що пропонує електрику, інтернет або тариф зв'язку. Інша сторона — der Kunde, що відмінюється dem Kunden, den Kunden (→ B1.4). Жіночий варіант — die Anbieterin."

  - de: "Alternative"
    ipa: "altɛʁnaˈtiːvə"
    pos: noun
    gender: f
    plural: "die Alternativen"
    en: "second option worth considering"
    ru: "альтернатива, другой вариант"
    uk: "альтернатива, інший варіант"
    example_de: "Es gibt eine günstigere Alternative ohne Vertrag."
    example_en: "There is a cheaper option without a contract."
    example_ru: "Есть более дешёвый вариант без договора."
    example_uk: "Є дешевший варіант без договору."
    note:
      en: "eine Alternative zu + Dativ, stressed on the last syllable. It names the option you genuinely weigh against the first one, which is what a comparison of two prices needs."
      ru: "eine Alternative zu + Dativ, ударение на последнем слоге. Слово называет вариант, который действительно взвешивают против первого, — именно это и нужно сравнению двух цен."
      uk: "eine Alternative zu + Dativ, наголос на останньому складі. Слово називає варіант, який справді зважують проти першого, — саме це й потрібне порівнянню двох цін."

  - de: "Angabe"
    ipa: "ˈanˌgaːbə"
    pos: noun
    gender: f
    plural: "die Angaben"
    en: "piece of information stated on a form or a bill"
    ru: "указанные данные, сведения"
    uk: "зазначені дані, відомості"
    example_de: "Bitte prüfen Sie die Angaben auf der Rechnung."
    example_en: "Please check the information on the bill."
    example_ru: "Проверьте, пожалуйста, данные в счёте."
    example_uk: "Перевірте, будь ласка, дані в рахунку."
    note:
      en: "Nearly always plural: persönliche Angaben, Angaben zur Person. From angeben. A contract may allow a cancellation ohne Angabe von Gründen — with no reasons named."
      ru: "Почти всегда во множественном: persönliche Angaben, Angaben zur Person. От angeben. Договор может разрешать расторжение ohne Angabe von Gründen — без указания причин."
      uk: "Майже завжди в множині: persönliche Angaben, Angaben zur Person. Від angeben. Договір може дозволяти розірвання ohne Angabe von Gründen — без зазначення причин."

  - de: "Auftrag"
    ipa: "ˈaʊ̯fˌtʁaːk"
    pos: noun
    gender: m
    plural: "die Aufträge"
    en: "job you give a firm to do"
    ru: "заказ на работу, поручение"
    uk: "замовлення на роботу, доручення"
    example_de: "Den Auftrag habe ich erst nach dem Kostenvoranschlag gegeben."
    example_en: "I only placed the order after the written estimate."
    example_ru: "Заказ я дал только после сметы."
    example_uk: "Замовлення я дав лише після кошторису."
    note:
      en: "einen Auftrag geben, bekommen, ausführen. The order of events is Kostenvoranschlag, then Auftrag, then Rechnung. Goods ordered in a shop are eine Bestellung instead, and im Auftrag von means on somebody's behalf."
      ru: "einen Auftrag geben, bekommen, ausführen. Порядок событий: Kostenvoranschlag, затем Auftrag, затем Rechnung. Товар, заказанный в магазине, — это eine Bestellung, а im Auftrag von значит «по поручению»."
      uk: "einen Auftrag geben, bekommen, ausführen. Порядок подій: Kostenvoranschlag, потім Auftrag, потім Rechnung. Товар, замовлений у крамниці, — це eine Bestellung, а im Auftrag von означає «за дорученням»."

  - de: "Material"
    ipa: "mateˈʁi̯aːl"
    pos: noun
    gender: n
    plural: "die Materialien"
    en: "the stuff a job is done with"
    ru: "материалы для работы, расходные материалы"
    uk: "матеріали для роботи, витратні матеріали"
    example_de: "Im Preis sind Material und Arbeitszeit enthalten."
    example_en: "Material and labour time are included in the price."
    example_ru: "В цену включены материалы и время работы."
    example_uk: "У ціну включено матеріали та час роботи."
    note:
      en: "On a written estimate it stands beside Arbeitszeit, and the two together make the total. Stress on the last syllable, plural die Materialien."
      ru: "В смете стоит рядом с Arbeitszeit, и вдвоём они дают итог. Ударение на последнем слоге, множественное — die Materialien."
      uk: "У кошторисі стоїть поряд з Arbeitszeit, і вдвох вони дають підсумок. Наголос на останньому складі, множина — die Materialien."

  - de: "Bargeld"
    ipa: "ˈbaːɐ̯ˌgɛlt"
    pos: noun
    gender: n
    plural: "—"
    en: "notes and coins you pay with"
    ru: "наличные деньги"
    uk: "готівкові гроші"
    example_de: "Beim Handwerker kann man auch mit Bargeld bezahlen."
    example_en: "You can also pay the tradesman in cash."
    example_ru: "Мастеру можно заплатить и наличными."
    example_uk: "Майстрові можна заплатити й готівкою."
    note:
      en: "bar plus das Geld, and no plural. The adverb is what a shop asks with: Zahlen Sie bar oder mit Karte? The thing itself is Bargeld — Ich habe kein Bargeld dabei."
      ru: "bar плюс das Geld, множественного нет. Наречием спрашивают в магазине: Zahlen Sie bar oder mit Karte? Сами деньги — Bargeld: Ich habe kein Bargeld dabei."
      uk: "bar плюс das Geld, множини немає. Прислівником питають у крамниці: Zahlen Sie bar oder mit Karte? Самі гроші — Bargeld: Ich habe kein Bargeld dabei."

  - de: "Kreditkarte"
    ipa: "kʁeˈdiːtˌkaʁtə"
    pos: noun
    gender: f
    plural: "die Kreditkarten"
    en: "credit card"
    ru: "кредитная карта"
    uk: "кредитна картка"
    example_de: "Kann ich die Rechnung mit Kreditkarte bezahlen?"
    example_en: "Can I pay the bill by credit card?"
    example_ru: "Могу я оплатить счёт кредитной картой?"
    example_uk: "Чи можу я оплатити рахунок кредитною карткою?"
    note:
      en: "mit Kreditkarte zahlen — the phrase drops the article. The everyday German card that takes the money straight off the account is die EC-Karte or die Girocard, and small firms often take neither."
      ru: "mit Kreditkarte zahlen — в обороте артикль опускается. Обиходная немецкая карта, списывающая деньги прямо со счёта, — die EC-Karte или die Girocard, а мелкие фирмы часто не принимают ни ту, ни другую."
      uk: "mit Kreditkarte zahlen — у звороті артикль опускається. Побутова німецька картка, що списує гроші просто з рахунку, — die EC-Karte або die Girocard, а дрібні фірми часто не приймають ані тієї, ані тієї."

  - de: "Leistung"
    ipa: "ˈlaɪ̯stʊŋ"
    pos: noun
    gender: f
    plural: "die Leistungen"
    en: "service a contract provides"
    ru: "услуга по договору, предоставляемое обслуживание"
    uk: "послуга за договором, надаване обслуговування"
    example_de: "Welche Leistungen sind im Preis enthalten?"
    example_en: "Which services are included in the price?"
    example_ru: "Какие услуги включены в цену?"
    example_uk: "Які послуги включено в ціну?"
    note:
      en: "In a contract the plural names what you actually get for the money, which is the first thing to ask about. The same word is an achievement at school or at work — gute Leistungen — and the verb is leisten."
      ru: "В договоре множественное число называет то, что вы за деньги действительно получаете, — с этого и стоит начинать вопросы. То же слово означает достижение в школе или на работе (gute Leistungen), а глагол — leisten."
      uk: "У договорі множина називає те, що ви за гроші справді дістаєте, — саме з цього й варто починати питання. Те саме слово означає досягнення у школі чи на роботі (gute Leistungen), а дієслово — leisten."

  - de: "Trinkgeld"
    ipa: "ˈtʁɪŋkˌgɛlt"
    pos: noun
    gender: n
    plural: "die Trinkgelder"
    en: "money you leave for good service"
    ru: "чаевые"
    uk: "чайові"
    example_de: "Das Trinkgeld steht nicht auf der Rechnung."
    example_en: "The tip is not on the bill."
    example_ru: "Чаевые в счёт не входят."
    example_uk: "Чайові до рахунку не входять."
    note:
