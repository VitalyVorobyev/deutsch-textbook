      en: 'Regular: steckt, steckte, hat gesteckt. It is the member of the setzen/stellen/legen family for narrow openings — a key in a lock, a letter in a postbox, hands in pockets. Without an object it means the thing is in there and not moving: der Schlüssel steckt, and Wir stecken im Stau is the traffic jam. Im Stau stecken and stecken bleiben are worth learning whole.'
      ru: 'Правильный глагол: steckt, steckte, hat gesteckt. Это член семьи setzen/stellen/legen для узких отверстий: ключ в замок, письмо в ящик, руки в карманы. Без дополнения означает, что предмет уже там и не двигается: der Schlüssel steckt, а Wir stecken im Stau — «мы стоим в пробке». Обороты im Stau stecken и stecken bleiben стоит выучить целиком.'
      uk: 'Правильне дієслово: steckt, steckte, hat gesteckt. Це член сім ї setzen/stellen/legen для вузьких отворів: ключ у замок, лист у скриньку, руки в кишені. Без додатка означає, що предмет уже там і не рухається: der Schlüssel steckt, а Wir stecken im Stau — «ми стоїмо в заторі». Звороти im Stau stecken і stecken bleiben варто вивчити цілими.'

  - de: ziehen
