      ru: 'Правильный глагол: schüttelt, schüttelte, hat geschüttelt. Пример напечатан на пузырьках с лекарством и бутылочках с заправкой. Den Kopf schütteln — устойчивое «покачать головой» в знак отказа или недоверия, jemandem die Hand schütteln — рукопожатие. То, что трясут, всегда в Akkusativ.'
      uk: 'Правильне дієслово: schüttelt, schüttelte, hat geschüttelt. Приклад надрукований на пляшечках з ліками та із заправкою. Den Kopf schütteln — стале «похитати головою» на знак відмови чи недовіри, jemandem die Hand schütteln — потиск руки. Те, що трясуть, завжди в Akkusativ.'

