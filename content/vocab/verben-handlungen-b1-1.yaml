      ru: 'Правильный глагол: klebt, klebte, hat geklebt. Работает в обе стороны: с Akkusativ вы клеите сами, без него предмет сам приклеен (der Zettel klebt an der Tür). Направление вводится через auf или an с Akkusativ, положение — через an с Dativ. Существительное der Klebstoff — сам клей.'
      uk: 'Правильне дієслово: klebt, klebte, hat geklebt. Працює в обидва боки: з Akkusativ ви клеїте самі, без нього предмет уже приклеєний (der Zettel klebt an der Tür). Напрямок вводиться через auf або an з Akkusativ, положення — через an з Dativ. Іменник der Klebstoff — сам клей.'

