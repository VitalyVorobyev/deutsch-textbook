# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the first third of
# the action verbs of data/goethe-b1-wortliste.txt — what hands and bodies do to
# things: lifting and gripping them, pushing and throwing them, moving through space,
# and the ways a thing grows, vanishes or breaks.
id: verben-handlungen-b1-1
title_de: "Handlungen: greifen, bewegen, verändern"
title_en: "Actions: gripping, moving, changing"
title_ru: "Действия: взять, сдвинуть, изменить"
title_uk: "Дії: взяти, зрушити, змінити"
level: B1
entries:
  # --- Was die Hände tun: heben, greifen, halten ---
  - de: heben
    ipa: "ˈheːbn̩"
    pos: verb
    praesens_3sg: hebt
    partizip2: gehoben
    aux: haben
    valence: "+ Akk"
    en: to lift
    ru: поднимать
    uk: піднімати
    example_de: Heben Sie den Karton bitte nicht allein.
    example_en: Please do not lift the box on your own.
    example_ru: Пожалуйста, не поднимайте коробку в одиночку.
    example_uk: Будь ласка, не піднімайте коробку самі.
    note:
      en: 'Strong verb: hebt, hob, hat gehoben. It is the plain physical lift — something leaves the ground because you apply force. The everyday spoken form is usually hochheben, and the separable prefix is where the stress goes. Figurative uses exist (die Stimmung heben, den Lebensstandard heben), but the picture underneath is always the same upward movement.'
      ru: 'Сильный глагол: hebt, hob, hat gehoben. Это чисто физический подъём: предмет отрывается от опоры, потому что вы прикладываете силу. В разговорной речи чаще звучит hochheben, и ударение падает на отделяемую приставку. Переносные значения есть (die Stimmung heben, den Lebensstandard heben), но за ними стоит всё то же движение вверх.'
      uk: 'Сильне дієслово: hebt, hob, hat gehoben. Це суто фізичне піднімання: предмет відривається від опори, бо ви прикладаєте силу. У розмовній мові частіше звучить hochheben, і наголос падає на відокремлюваний префікс. Переносні значення є (die Stimmung heben, den Lebensstandard heben), але за ними стоїть той самий рух угору.'

  - de: aufheben
    ipa: "ˈaʊ̯fˌheːbn̩"
    pos: verb
    praesens_3sg: hebt auf
    partizip2: aufgehoben
    aux: haben
    valence: "+ Akk"
    # Recognition only: the headword carries two jobs one example cannot hold —
    # picking a thing up off the floor, and keeping a thing instead of throwing it
    # away — and each has a different answer in EN and RU. That is the
    # `unheimlich`/`intensiv` ruling from eigenschaften-bewertung-b1.
    cards: recognition
    en: to pick up (off the ground); to keep, to save
    en_compact: to pick up; to keep
    ru: поднимать (с пола); хранить, сохранять
    uk: піднімати (з підлоги); зберігати, тримати
    example_de: Heb den Zettel bitte auf, wir brauchen ihn noch.
    example_en: Please pick the slip of paper up, we still need it.
    example_ru: Подними, пожалуйста, эту бумажку, она нам ещё пригодится.
    example_uk: Підніми, будь ласка, цей папірець, він нам ще знадобиться.
    note:
      en: 'Separable, stress on auf: hebt auf, hat aufgehoben. The two senses split by context — Ich hebe das Handy auf is bending down for it, Ich hebe die Rechnung auf is filing it for later. The second sense is what a shop assistant means with Bewahren Sie den Kassenbon auf. A third, formal sense (ein Gesetz aufheben, to repeal) belongs to the news.'
      ru: 'Отделяемый глагол, ударение на auf: hebt auf, hat aufgehoben. Значения различает контекст: Ich hebe das Handy auf — наклониться и поднять, Ich hebe die Rechnung auf — сохранить на будущее. Второе значение стоит за фразой продавца Bewahren Sie den Kassenbon auf. Третье, официальное (ein Gesetz aufheben, «отменить закон»), встречается в новостях.'
      uk: 'Відокремлюване дієслово, наголос на auf: hebt auf, hat aufgehoben. Значення розрізняє контекст: Ich hebe das Handy auf — нахилитися й підняти, Ich hebe die Rechnung auf — зберегти на майбутнє. Друге значення стоїть за фразою продавця Bewahren Sie den Kassenbon auf. Третє, офіційне (ein Gesetz aufheben, «скасувати закон»), трапляється в новинах.'

  - de: greifen
    ipa: "ˈgʁaɪ̯fn̩"
    pos: verb
    praesens_3sg: greift
    partizip2: gegriffen
    aux: haben
    valence: "nach + Dat"
    en: to reach for, to grab hold of
    ru: хватать, тянуться (рукой)
    uk: хапати, тягнутися (рукою)
    example_de: Das Kind greift nach dem Löffel.
    example_en: The child is reaching for the spoon.
    example_ru: Ребёнок тянется за ложкой.
    example_uk: Дитина тягнеться до ложки.
    note:
      en: 'Strong verb: greift, griff, hat gegriffen. The usual frame is greifen nach + Dativ, which describes the movement of the hand towards the thing; nehmen describes the result. Zu etwas greifen is the idiom for resorting to something (zu Medikamenten greifen). The related noun der Griff is the handle you take hold of.'
      ru: 'Сильный глагол: greift, griff, hat gegriffen. Обычная конструкция — greifen nach + Dativ: она описывает движение руки к предмету, тогда как nehmen описывает результат. Zu etwas greifen — устойчивый оборот «прибегнуть к чему-то» (zu Medikamenten greifen). Родственное существительное der Griff — ручка, за которую берутся.'
      uk: 'Сильне дієслово: greift, griff, hat gegriffen. Звична конструкція — greifen nach + Dativ: вона описує рух руки до предмета, тоді як nehmen описує результат. Zu etwas greifen — сталий зворот «вдатися до чогось» (zu Medikamenten greifen). Споріднений іменник der Griff — ручка, за яку беруться.'

  - de: fassen
    ipa: "ˈfasn̩"
    pos: verb
    praesens_3sg: fasst
    partizip2: gefasst
    aux: haben
    valence: "+ Akk"
    # Recognition only: three unrelated jobs — to take hold of, to hold a capacity,
    # and to grasp mentally (Ich kann es nicht fassen) — and this deck's own
    # `greifen` already answers the first prompt.
    cards: recognition
    en: to take hold of; to hold (a capacity); to grasp (mentally)
    en_compact: to take hold of; to hold; to grasp
    ru: схватить; вмещать; постичь, осознать
    uk: схопити; вміщати; збагнути, усвідомити
    example_de: Der Tank fasst fünfzig Liter.
    example_en: The tank holds fifty litres.
    example_ru: Бак вмещает пятьдесят литров.
    example_uk: Бак вміщає п’ятдесят літрів.
    note:
      en: 'Regular: fasst, fasste, hat gefasst. The physical sense is close to greifen but ends in contact rather than in movement. The capacity sense is what you read on a container or a hall (der Saal fasst 300 Personen). And the mental sense lives almost entirely in the fixed exclamation Das kann ich nicht fassen, said when news is too much to take in. einen Entschluss fassen is the formal way to say you decided.'
      ru: 'Правильный глагол: fasst, fasste, hat gefasst. Физическое значение близко к greifen, но подчёркивает не движение, а сам захват. Значение вместимости встречается на ёмкостях и в описании залов (der Saal fasst 300 Personen). Ментальное значение живёт почти только в восклицании Das kann ich nicht fassen — «не могу поверить». einen Entschluss fassen — официальный способ сказать, что решение принято.'
      uk: 'Правильне дієслово: fasst, fasste, hat gefasst. Фізичне значення близьке до greifen, але підкреслює не рух, а сам захват. Значення місткості трапляється на ємностях і в описі залів (der Saal fasst 300 Personen). Ментальне значення живе майже лише у вигуку Das kann ich nicht fassen — «не можу повірити». einen Entschluss fassen — офіційний спосіб сказати, що рішення ухвалене.'

  - de: festhalten
    ipa: "ˈfɛstˌhaltn̩"
    pos: verb
    praesens_3sg: hält fest
    partizip2: festgehalten
    aux: haben
    valence: "+ Akk / sich an + Dat"
    # Recognition only: it splits into a physical grip and a written record (etwas
    # schriftlich festhalten), and the reflexive sich festhalten is the form the
    # learner actually hears — three prompts, one headword.
    cards: recognition
    en: to hold on tight; to put on record
    ru: крепко держать; фиксировать (письменно)
    uk: міцно тримати; фіксувати (письмово)
    example_de: Bitte festhalten, der Bus fährt gleich los.
    example_en: Please hold on, the bus is about to move off.
    example_ru: Держитесь, пожалуйста, автобус сейчас тронется.
    example_uk: Тримайтеся, будь ласка, автобус зараз рушить.
    note:
      en: 'Separable, stress on fest: hält fest, hat festgehalten. On a bus or a tram the reflexive sich festhalten is what the announcement says, and the thing you hold takes an + Dativ: Halten Sie sich am Griff fest. The written sense turns up in offices and minutes: Wir halten das Ergebnis schriftlich fest. The prefix fest also builds festlegen and feststellen, and all three share the idea of pinning something down.'
      ru: 'Отделяемый глагол, ударение на fest: hält fest, hat festgehalten. В автобусе или трамвае звучит возвратная форма sich festhalten, а опора вводится через an + Dativ: Halten Sie sich am Griff fest. Письменное значение живёт в канцелярии и протоколах: Wir halten das Ergebnis schriftlich fest. Приставка fest даёт также festlegen и feststellen — все три о том, чтобы что-то закрепить.'
      uk: 'Відокремлюване дієслово, наголос на fest: hält fest, hat festgehalten. В автобусі чи трамваї звучить зворотна форма sich festhalten, а опора вводиться через an + Dativ: Halten Sie sich am Griff fest. Писемне значення живе в канцелярії та протоколах: Wir halten das Ergebnis schriftlich fest. Префікс fest дає також festlegen і feststellen — усі три про те, щоб щось закріпити.'

  # --- Kraft auf ein Ding: schieben, stoßen, werfen ---
  - de: schieben
    ipa: "ˈʃiːbn̩"
    pos: verb
    praesens_3sg: schiebt
    partizip2: geschoben
    aux: haben
    valence: "+ Akk"
    en: to shove, to slide (something along)
    en_compact: to shove, to slide along
    ru: двигать, толкать (не отрывая от поверхности)
    uk: сунути, штовхати (не відриваючи від поверхні)
    example_de: Wir haben das Sofa an die Wand geschoben.
    example_en: We slid the sofa over to the wall.
    example_ru: Мы придвинули диван к стене.
    example_uk: Ми присунули диван до стіни.
    note:
      en: 'Strong verb: schiebt, schob, hat geschoben. It keeps contact with the floor or the table — a pram, a bicycle, a chair. A2 drücken is force against a surface (a button, a door), and no ground is covered. The idiom etwas auf jemanden schieben means to blame someone else for it.'
      ru: 'Сильный глагол: schiebt, schob, hat geschoben. Предмет не отрывается от пола или стола — коляска, велосипед, стул. A2-глагол drücken — это давление на поверхность (кнопка, дверь), без перемещения. Оборот etwas auf jemanden schieben значит «свалить вину на другого».'
      uk: 'Сильне дієслово: schiebt, schob, hat geschoben. Предмет не відривається від підлоги чи столу — візок, велосипед, стілець. Дієслово рівня A2 drücken — це тиск на поверхню (кнопка, двері), без переміщення. Зворот etwas auf jemanden schieben означає «звалити провину на іншого».'

  - de: stoßen
    ipa: "ˈʃtoːsn̩"
    pos: verb
    praesens_3sg: stößt
    partizip2: gestoßen
    aux: haben/sein
    valence: "+ Akk / gegen + Akk"
    # Recognition only: A2 `drücken` already ships "to push" as a production card,
    # and this headword additionally splits by auxiliary — hat gestoßen for the
    # shove, ist gestoßen for bumping into something.
    cards: recognition
    en: to bump into, to knock against
    ru: толкнуть; удариться (обо что-то)
    uk: штовхнути; вдаритися (об щось)
    example_de: Ich bin im Dunkeln gegen den Tisch gestoßen.
    example_en: In the dark I bumped into the table.
    example_ru: В темноте я ударился о стол.
    example_uk: У темряві я вдарився об стіл.
    note:
      en: 'Strong verb: stößt, stieß. The auxiliary carries the meaning: hat gestoßen is a deliberate shove with an accusative object, ist gestoßen with gegen + Akk is the accidental collision in the example. auf etwas stoßen is the useful figurative one — to come across a problem, a name, a piece of information.'
      ru: 'Сильный глагол: stößt, stieß. Вспомогательный глагол несёт смысл: hat gestoßen — намеренный толчок с Akkusativ, ist gestoßen с gegen + Akk — случайное столкновение, как в примере. auf etwas stoßen — полезное переносное значение: наткнуться на проблему, имя, сведения.'
      uk: 'Сильне дієслово: stößt, stieß. Допоміжне дієслово несе зміст: hat gestoßen — навмисний поштовх з Akkusativ, ist gestoßen з gegen + Akk — випадкове зіткнення, як у прикладі. auf etwas stoßen — корисне переносне значення: натрапити на проблему, ім’я, відомості.'

  - de: werfen
    ipa: "ˈvɛʁfn̩"
    pos: verb
    praesens_3sg: wirft
    partizip2: geworfen
    aux: haben
    valence: "+ Akk"
    en: to throw
    ru: бросать, кидать
    uk: кидати
    example_de: Wirf mir bitte den Schlüssel herüber.
    example_en: Throw me the key, please.
    example_ru: Брось мне, пожалуйста, ключ.
    example_uk: Кинь мені, будь ласка, ключа.
    note:
      en: 'Strong verb with vowel change in the singular: ich werfe, du wirfst, er wirft; warf, hat geworfen. The compound wegwerfen (to throw away) is the everyday one for rubbish, and einen Blick auf etwas werfen is the standard way to say you took a quick look at something.'
      ru: 'Сильный глагол с чередованием в единственном числе: ich werfe, du wirfst, er wirft; warf, hat geworfen. Составной глагол wegwerfen («выбрасывать») используется о мусоре, а einen Blick auf etwas werfen — обычный способ сказать «бросить взгляд, взглянуть».'
      uk: 'Сильне дієслово з чергуванням в однині: ich werfe, du wirfst, er wirft; warf, hat geworfen. Складене дієслово wegwerfen («викидати») уживають про сміття, а einen Blick auf etwas werfen — звичний спосіб сказати «кинути оком, поглянути».'

  - de: fangen
    ipa: "ˈfaŋən"
    pos: verb
    praesens_3sg: fängt
    partizip2: gefangen
    aux: haben
    valence: "+ Akk"
    # Recognition only: `erreichen` (reisen-verkehr) ships "to catch" as a production
    # card for trains and buses, which is the sense a learner needs first; a typed
    # prompt reading "to catch" is answered two decks over.
    cards: recognition
    en: to catch (something in flight or in a trap)
    ru: ловить, поймать
    uk: ловити, зловити
    example_de: Der Torwart hat den Ball sicher gefangen.
    example_en: The goalkeeper caught the ball safely.
    example_ru: Вратарь уверенно поймал мяч.
    example_uk: Воротар упевнено зловив м’яча.
    note:
      en: 'Strong verb with Umlaut in the singular: fängt, fing, hat gefangen. It is the physical catch — a ball, a fish, an animal. A train or a bus is not caught with this verb but with erreichen or noch schaffen. The separable anfangen (to begin) looks related and is a different word in use.'
      ru: 'Сильный глагол с умлаутом в единственном числе: fängt, fing, hat gefangen. Значение физическое: мяч, рыба, животное. Про поезд или автобус говорят не так, а erreichen или noch schaffen. Отделяемый anfangen («начинать») выглядит родственным, но в речи это другое слово.'
      uk: 'Сильне дієслово з умлаутом в однині: fängt, fing, hat gefangen. Значення фізичне: м яч, риба, тварина. Про потяг чи автобус кажуть інакше — erreichen або noch schaffen. Відокремлюване anfangen («починати») виглядає спорідненим, але в мовленні це інше слово.'

  - de: treten
    ipa: "ˈtʁeːtn̩"
    pos: verb
    praesens_3sg: tritt
    partizip2: getreten
    aux: haben/sein
    valence: "+ Akk / auf + Akk"
    # Recognition only: to kick, to step and to tread are three prompts, and the
    # headword additionally powers a family the learner meets separately
    # (eintreten, auftreten, zurücktreten).
    cards: recognition
    en: to kick; to step, to tread
    ru: пнуть, ударить ногой; ступить, наступить
    uk: копнути, ударити ногою; ступити, наступити
    example_de: Bitte nicht auf den Rasen treten.
    example_en: Please do not step on the grass.
    example_ru: Пожалуйста, не наступайте на газон.
    example_uk: Будь ласка, не ступайте на газон.
    note:
      en: 'Strong verb: tritt, trat. Movement takes sein (ich bin auf den Rasen getreten), a kick takes haben (er hat den Ball getreten). The sign in the example is on every German lawn. The prefixed family is worth recognising as one: eintreten (to enter), auftreten (to appear on stage), zurücktreten (to resign).'
      ru: 'Сильный глагол: tritt, trat. Движение требует sein (ich bin auf den Rasen getreten), удар ногой — haben (er hat den Ball getreten). Табличка из примера стоит на каждом немецком газоне. Приставочную семью полезно узнавать как целое: eintreten («входить»), auftreten («выступать»), zurücktreten («уйти в отставку»).'
      uk: 'Сильне дієслово: tritt, trat. Рух вимагає sein (ich bin auf den Rasen getreten), удар ногою — haben (er hat den Ball getreten). Табличка з прикладу стоїть на кожному німецькому газоні. Префіксальну сім’ю варто впізнавати як ціле: eintreten («входити»), auftreten («виступати»), zurücktreten («піти у відставку»).'

  - de: schlagen
    ipa: "ˈʃlaːgn̩"
    pos: verb
    praesens_3sg: schlägt
    partizip2: geschlagen
    aux: haben
    valence: "+ Akk"
    en: to hit, to strike
    ru: бить, ударять
    uk: бити, ударяти
    example_de: Der Regen schlägt gegen das Fenster.
    example_en: The rain is beating against the window.
    example_ru: Дождь бьёт в окно.
    example_uk: Дощ б’є у вікно.
    note:
      en: 'Strong verb with Umlaut in the singular: schlägt, schlug, hat geschlagen. Beyond hitting, it is the verb for a clock striking and a heart beating (das Herz schlägt). Its most useful derivative is already familiar: vorschlagen, to suggest, is literally to strike something forward.'
      ru: 'Сильный глагол с умлаутом в единственном числе: schlägt, schlug, hat geschlagen. Кроме удара, это глагол о бое часов и биении сердца (das Herz schlägt). Самая полезная производная уже знакома: vorschlagen («предлагать») — буквально «бить вперёд».'
      uk: 'Сильне дієслово з умлаутом в однині: schlägt, schlug, hat geschlagen. Крім удару, це дієслово про бій годинника й биття серця (das Herz schlägt). Найкорисніша похідна вже знайома: vorschlagen («пропонувати») — буквально «бити вперед».'

  - de: klopfen
    ipa: "ˈklɔpfn̩"
    pos: verb
    praesens_3sg: klopft
    partizip2: geklopft
    aux: haben
    valence: "an + Akk"
    en: to knock
    ru: стучать
    uk: стукати
    example_de: Bitte klopfen Sie an die Tür, bevor Sie eintreten.
    example_en: Please knock on the door before you come in.
    example_ru: Пожалуйста, постучите в дверь, прежде чем войти.
    example_uk: Будь ласка, постукайте у двері, перш ніж заходити.
    note:
      en: 'Regular: klopft, klopfte, hat geklopft. The frame is an die Tür klopfen with the accusative, because knocking is movement towards the door; an der Tür with the dative would place you standing beside it. Es klopft is the complete German sentence for there is a knock at the door. Sign version: Bitte anklopfen.'
      ru: 'Правильный глагол: klopft, klopfte, hat geklopft. Конструкция an die Tür klopfen требует Akkusativ, потому что стук — движение к двери; an der Tür с Dativ означало бы «стоя у двери». Es klopft — полноценное немецкое предложение «стучат». Вариант на табличке: Bitte anklopfen.'
      uk: 'Правильне дієслово: klopft, klopfte, hat geklopft. Конструкція an die Tür klopfen вимагає Akkusativ, бо стукіт — це рух до дверей; an der Tür з Dativ означало б «стоячи біля дверей». Es klopft — повноцінне німецьке речення «стукають». Варіант на табличці: Bitte anklopfen.'

