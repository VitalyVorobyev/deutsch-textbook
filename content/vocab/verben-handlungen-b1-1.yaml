      ru: 'Сильный глагол с sein: steigt, stieg, ist gestiegen. Две жизни: человек поднимается (auf den Berg steigen, ins Auto steigen) и число растёт — именно это значение в газете и в письме о повышении аренды. Знакомые einsteigen, aussteigen и umsteigen построены на нём, а противоположность для чисел — sinken.'
      uk: 'Сильне дієслово із sein: steigt, stieg, ist gestiegen. Два життя: людина піднімається (auf den Berg steigen, ins Auto steigen) і число зростає — саме це значення в газеті та в листі про підвищення оренди. Знайомі einsteigen, aussteigen і umsteigen побудовані на ньому, а протилежність для чисел — sinken.'

