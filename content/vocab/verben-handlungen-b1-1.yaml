      uk: 'Правильне дієслово, але із sein: klettert, kletterte, ist geklettert. Задіяні руки — дерево, скеля, скеледром; цим воно відрізняється від steigen, де просто піднімаються (сходи, стежка, ціна). Klettern — також назва виду спорту, а стінка — die Kletterwand.'

