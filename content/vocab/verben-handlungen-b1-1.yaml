      ru: 'Сильный глагол: zieht, zog, hat gezogen. Противоположность drücken; оба слова написаны на дверях магазинов: Ziehen и Drücken. С sein означает «переехать» (wir sind nach Berlin gezogen) — отсюда уже знакомый umziehen. Чай и кофе тоже ziehen — это про заваривание.'
      uk: 'Сильне дієслово: zieht, zog, hat gezogen. Протилежність drücken; обидва слова написані на дверях крамниць: Ziehen і Drücken. З sein означає «переїхати» (wir sind nach Berlin gezogen) — звідси вже знайоме umziehen. Чай і кава теж ziehen — це про заварювання.'

  - de: drehen
