      uk: 'Сильне дієслово із sein: springt, sprang, ist gesprungen — переміщення завжди вимагає sein. Те саме дієслово описує тріщину у склі (das Glas ist gesprungen), і це варто знати до зустрічі з розбитим екраном. Aufspringen — «схопитися», abspringen — «зістрибнути».'

