      en: 'Regular: bewegt, bewegte, hat bewegt. The reflexive sich bewegen is the health-advice word in the example, and die Bewegung is exercise on a doctor leaflet. The transitive sense moves an object; a meeting is not moved with this verb but with verschieben, and a household with umziehen.'
      ru: 'Правильный глагол: bewegt, bewegte, hat bewegt. Возвратное sich bewegen — то самое слово из советов о здоровье, а die Bewegung на листовке у врача значит «физическая активность». Переходное значение сдвигает предмет; встречу переносят не этим глаголом, а verschieben, переезд — umziehen.'
      uk: 'Правильне дієслово: bewegt, bewegte, hat bewegt. Зворотне sich bewegen — те саме слово з порад про здоров’я, а die Bewegung на листівці в лікаря означає «фізична активність». Перехідне значення зсуває предмет; зустріч переносять не цим дієсловом, а verschieben, переїзд — umziehen.'

  - de: treiben
    ipa: "ˈtʁaɪ̯bn̩"
    pos: verb
    praesens_3sg: treibt
    partizip2: getrieben
    aux: haben
    valence: "+ Akk"
    # Recognition only: three unrelated jobs — Sport treiben, Handel treiben, and
    # drifting on water — and the first of them is already said with machen, which
    # ships as an A1 production card.
    cards: recognition
    en: to drive (something on); to do (sport)
    ru: гнать, побуждать; заниматься (спортом)
    uk: гнати, спонукати; займатися (спортом)
    example_de: Sie treibt dreimal die Woche Sport.
    example_en: She does sport three times a week.
    example_ru: Она занимается спортом три раза в неделю.
    example_uk: Вона займається спортом тричі на тиждень.
    note:
      en: 'Strong verb: treibt, trieb, hat getrieben. Sport treiben is the fixed, slightly formal alternative to Sport machen and is the one a health article prints. Handel treiben is to trade. With sein the verb means to drift, which is what a boat without an engine does. The prefixed antreiben (to drive on) and vertreiben (to drive away) belong to the same picture.'
      ru: 'Сильный глагол: treibt, trieb, hat getrieben. Sport treiben — устойчивый и чуть более официальный вариант Sport machen, именно он стоит в статье о здоровье. Handel treiben — «вести торговлю». С sein глагол значит «дрейфовать», как лодка без мотора. Приставочные antreiben («подгонять») и vertreiben («прогонять») из той же картины.'
      uk: 'Сильне дієслово: treibt, trieb, hat getrieben. Sport treiben — сталий і трохи офіційніший варіант Sport machen, саме він стоїть у статті про здоров’я. Handel treiben — «вести торгівлю». Із sein дієслово означає «дрейфувати», як човен без мотора. Префіксальні antreiben («підганяти») і vertreiben («проганяти») з тієї самої картини.'

  # --- Werden, verschwinden, kaputtgehen ---
  - de: wachsen
    ipa: "ˈvaksn̩"
    pos: verb
    praesens_3sg: wächst
    partizip2: gewachsen
    aux: sein
    en: to grow
    ru: расти
    uk: рости
    example_de: Die Stadt wächst jedes Jahr um etwa tausend Einwohner.
    example_en: The town grows by about a thousand inhabitants every year.
    example_ru: Город растёт примерно на тысячу жителей в год.
    example_uk: Місто зростає приблизно на тисячу мешканців на рік.
    note:
      en: 'Strong verb with Umlaut and sein: wächst, wuchs, ist gewachsen. Children, plants, cities and numbers all grow with it; it is never transitive, so you cannot grow a plant this way — for that German uses anbauen or züchten. The familiar aufwachsen means to grow up, and erwachsen is the adjective for adult.'
      ru: 'Сильный глагол с умлаутом и sein: wächst, wuchs, ist gewachsen. Растут дети, растения, города и числа; глагол непереходный, поэтому «выращивать» им сказать нельзя — для этого есть anbauen или züchten. Знакомое aufwachsen — «расти, взрослеть», а erwachsen — прилагательное «взрослый».'
      uk: 'Сильне дієслово з умлаутом і sein: wächst, wuchs, ist gewachsen. Ростуть діти, рослини, міста й числа; дієслово неперехідне, тому «вирощувати» ним сказати не можна — для цього є anbauen або züchten. Знайоме aufwachsen — «рости, дорослішати», а erwachsen — прикметник «дорослий».'

  - de: verschwinden
    ipa: "fɛɐ̯ˈʃvɪndn̩"
    pos: verb
    praesens_3sg: verschwindet
    partizip2: verschwunden
    aux: sein
    en: to disappear
    ru: исчезать, пропадать
    uk: зникати, пропадати
    example_de: Mein Ausweis ist plötzlich verschwunden.
    example_en: My ID card has suddenly disappeared.
    example_ru: Моё удостоверение вдруг пропало.
    example_uk: Моє посвідчення раптом зникло.
    note:
      en: 'Strong verb with sein and no ge- in the participle: verschwindet, verschwand, ist verschwunden. Inseparable ver- prefixes never take ge-. The participle doubles as an adjective on a notice or in a police report: Vermisst und verschwunden. Its opposite is auftauchen.'
      ru: 'Сильный глагол с sein и без ge- в причастии: verschwindet, verschwand, ist verschwunden. Неотделяемая приставка ver- никогда не берёт ge-. Причастие работает и как прилагательное в объявлении или полицейском отчёте: Vermisst und verschwunden. Противоположность — auftauchen.'
      uk: 'Сильне дієслово із sein і без ge- у дієприкметнику: verschwindet, verschwand, ist verschwunden. Невідокремлюваний префікс ver- ніколи не бере ge-. Дієприкметник працює і як прикметник в оголошенні чи поліційному звіті: Vermisst und verschwunden. Протилежність — auftauchen.'

  - de: entfernen
    ipa: "ɛntˈfɛʁnən"
    pos: verb
    praesens_3sg: entfernt
    partizip2: entfernt
    aux: haben
    valence: "+ Akk"
    # Recognition only: notice-and-menu register — Bitte entfernen Sie …, and the
    # Entfernen button on a screen. What the learner says is wegmachen or wegnehmen.
    cards: recognition
    en: to remove, to take away
    ru: удалять, убирать
    uk: видаляти, прибирати
    example_de: Bitte entfernen Sie das Preisschild vor dem Verschenken.
    example_en: Please remove the price tag before giving it as a present.
    example_ru: Пожалуйста, удалите ценник, прежде чем дарить.
    example_uk: Будь ласка, зніміть цінник, перш ніж дарувати.
    note:
      en: 'Regular, inseparable: entfernt, entfernte, hat entfernt. It is the written word — on a sign, in an instruction manual, and as the delete button on a screen. Speech prefers wegmachen or wegnehmen. The related adjective entfernt means distant, and die Entfernung is the distance between two points.'
      ru: 'Правильный глагол, неотделяемый: entfernt, entfernte, hat entfernt. Это письменное слово — на табличке, в инструкции и как кнопка удаления на экране. В речи предпочитают wegmachen или wegnehmen. Родственное прилагательное entfernt значит «отдалённый», а die Entfernung — расстояние между точками.'
      uk: 'Правильне дієслово, невідокремлюване: entfernt, entfernte, hat entfernt. Це писемне слово — на табличці, в інструкції та як кнопка видалення на екрані. У мовленні воліють wegmachen або wegnehmen. Споріднений прикметник entfernt означає «віддалений», а die Entfernung — відстань між точками.'

  - de: verstecken
    ipa: "fɛɐ̯ˈʃtɛkn̩"
    pos: verb
    praesens_3sg: versteckt
    partizip2: versteckt
    aux: haben
    valence: "+ Akk / sich"
    en: to hide
    ru: прятать; прятаться
    uk: ховати; ховатися
    example_de: Wo hast du den Schlüssel versteckt?
    example_en: Where did you hide the key?
    example_ru: Куда ты спрятал ключ?
    example_uk: Куди ти сховав ключа?
    note:
      en: 'Regular, inseparable: versteckt, versteckte, hat versteckt. With an accusative object you hide a thing, with sich you hide yourself (das Kind hat sich hinter dem Sofa versteckt). Note that verstecken hides on purpose while verlieren loses by accident, and the children called their game Versteckspiel.'
      ru: 'Правильный глагол, неотделяемый: versteckt, versteckte, hat versteckt. С Akkusativ прячут предмет, с sich — прячется сам человек (das Kind hat sich hinter dem Sofa versteckt). Важно: verstecken — спрятать намеренно, verlieren — потерять случайно; детская игра называется Versteckspiel.'
      uk: 'Правильне дієслово, невідокремлюване: versteckt, versteckte, hat versteckt. З Akkusativ ховають предмет, із sich — ховається сама людина (das Kind hat sich hinter dem Sofa versteckt). Важливо: verstecken — сховати навмисно, verlieren — загубити випадково; дитяча гра називається Versteckspiel.'

  - de: mischen
    ipa: "ˈmɪʃn̩"
    pos: verb
    praesens_3sg: mischt
    partizip2: gemischt
    aux: haben
    valence: "+ Akk"
    en: to mix
    ru: смешивать
    uk: змішувати
    example_de: Mischen Sie das Mehl mit dem Zucker.
    example_en: Mix the flour with the sugar.
    example_ru: Смешайте муку с сахаром.
    example_uk: Змішайте борошно з цукром.
    note:
      en: 'Regular: mischt, mischte, hat gemischt. The second ingredient takes mit + Dativ, or the two are joined with und. Its participle is everywhere as an adjective: gemischter Salat on a menu, gemischte Gefühle in a conversation. sich einmischen means to interfere in something that is not yours.'
      ru: 'Правильный глагол: mischt, mischte, hat gemischt. Второй компонент вводится через mit + Dativ или соединяется через und. Причастие часто работает прилагательным: gemischter Salat в меню, gemischte Gefühle в разговоре. sich einmischen — «вмешиваться не в своё дело».'
      uk: 'Правильне дієслово: mischt, mischte, hat gemischt. Другий компонент вводиться через mit + Dativ або приєднується через und. Дієприкметник часто працює прикметником: gemischter Salat у меню, gemischte Gefühle в розмові. sich einmischen — «втручатися не у свою справу».'

  - de: trocknen
    ipa: "ˈtʁɔknən"
    pos: verb
    praesens_3sg: trocknet
    partizip2: getrocknet
    aux: haben/sein
    # Recognition only: the adjective `trocken` ships as a production card in
    # natur-tiere-a2, and a typed prompt about drying invites that adjective back —
    # one letter group apart, two different words.
    cards: recognition
    en: to dry (something); to become dry
    ru: сушить; сохнуть
    uk: сушити; сохнути
    example_de: Die Wäsche trocknet auf dem Balkon.
    example_en: The washing is drying on the balcony.
    example_ru: Бельё сохнет на балконе.
    example_uk: Білизна сохне на балконі.
    note:
      en: 'Regular: trocknet, trocknete. With an accusative object it takes haben (ich habe die Haare getrocknet); when a thing dries by itself the perfect is usually ist getrocknet. abtrocknen is what you do to the dishes and to yourself after a shower, and der Trockner is the machine.'
      ru: 'Правильный глагол: trocknet, trocknete. С Akkusativ идёт haben (ich habe die Haare getrocknet); когда предмет сохнет сам, перфект обычно ist getrocknet. abtrocknen — вытирать посуду и вытираться после душа, а der Trockner — сушильная машина.'
      uk: 'Правильне дієслово: trocknet, trocknete. З Akkusativ іде haben (ich habe die Haare getrocknet); коли річ сохне сама, перфект зазвичай ist getrocknet. abtrocknen — витирати посуд і витиратися після душу, а der Trockner — сушильна машина.'

  - de: verbrennen
    ipa: "fɛɐ̯ˈbʁɛnən"
    pos: verb
    praesens_3sg: verbrennt
    partizip2: verbrannt
    aux: haben/sein
    # Recognition only: the headword covers burning something, burning up, and
    # burning yourself, and each takes a different auxiliary or pronoun — one typed
    # prompt cannot say which is wanted.
    cards: recognition
    en: to burn (something); to get burnt
    ru: сжигать; обжечься, сгореть
    uk: спалювати; обпектися, згоріти
    example_de: Ich habe mir an dem Topf die Finger verbrannt.
    example_en: I burnt my fingers on the pot.
    example_ru: Я обжёг пальцы о кастрюлю.
    example_uk: Я обпік пальці об каструлю.
    note:
      en: 'Mixed verb, inseparable: verbrennt, verbrannte. Three patterns worth separating: haben with an object (Müll verbrennen), sein without one (das Haus ist verbrannt), and the dative reflexive of the example, where the burnt body part follows. Plain brennen means to be on fire or to sting.'
      ru: 'Смешанный глагол, неотделяемый: verbrennt, verbrannte. Три схемы стоит различать: haben с дополнением (Müll verbrennen), sein без него (das Haus ist verbrannt) и возвратная с Dativ, как в примере, где дальше называют обожжённую часть тела. Простое brennen значит «гореть» или «жечь, щипать».'
      uk: 'Мішане дієслово, невідокремлюване: verbrennt, verbrannte. Три схеми варто розрізняти: haben з додатком (Müll verbrennen), sein без нього (das Haus ist verbrannt) і зворотна з Dativ, як у прикладі, де далі називають обпечену частину тіла. Просте brennen означає «горіти» або «пекти, щипати».'

  - de: zerstören
    ipa: "tsɛɐ̯ˈʃtøːʁən"
    pos: verb
    praesens_3sg: zerstört
    partizip2: zerstört
    aux: haben
    valence: "+ Akk"
    # Recognition only: news and report register — a storm, a fire or a war destroys
    # something. What a learner says about their own things is kaputtmachen.
    cards: recognition
    en: to destroy
    ru: разрушать, уничтожать
    uk: руйнувати, знищувати
    example_de: Der Sturm hat mehrere Häuser zerstört.
    example_en: The storm destroyed several houses.
    example_ru: Буря разрушила несколько домов.
    example_uk: Буря зруйнувала кілька будинків.
    note:
      en: 'Regular, inseparable: zerstört, zerstörte, hat zerstört. The prefix zer- means to pieces and builds a whole family: zerbrechen, zerreißen, zerschneiden. The scale is large — a building, a town, a friendship — while a phone that stops working is simply kaputt.'
      ru: 'Правильный глагол, неотделяемый: zerstört, zerstörte, hat zerstört. Приставка zer- значит «на куски» и строит целую семью: zerbrechen, zerreißen, zerschneiden. Масштаб крупный — здание, город, дружба; а сломавшийся телефон просто kaputt.'
      uk: 'Правильне дієслово, невідокремлюване: zerstört, zerstörte, hat zerstört. Префікс zer- означає «на шматки» і будує цілу сім’ю: zerbrechen, zerreißen, zerschneiden. Масштаб великий — будівля, місто, дружба; а телефон, що зламався, просто kaputt.'

  - de: brechen
    ipa: "ˈbʁɛçn̩"
    pos: verb
    praesens_3sg: bricht
    partizip2: gebrochen
    aux: haben/sein
    valence: "+ Akk"
    # Recognition only: the headword breaks a bone, a promise and a record, and it
    # switches auxiliary between doing the breaking and coming apart — the everyday
    # answer a learner needs is kaputtmachen or kaputtgehen.
    cards: recognition
    en: to break
    ru: ломать; ломаться
    uk: ламати; ламатися
    example_de: Beim Skifahren hat er sich das Bein gebrochen.
    example_en: He broke his leg while skiing.
    example_ru: Катаясь на лыжах, он сломал ногу.
    example_uk: Катаючись на лижах, він зламав ногу.
    note:
      en: 'Strong verb: bricht, brach. With haben something is broken by someone, with sein it comes apart on its own (der Ast ist gebrochen). Body parts use the dative reflexive of the example, exactly as in sich den Arm brechen. Figuratively you break a promise (ein Versprechen brechen) and a record (einen Rekord brechen).'
      ru: 'Сильный глагол: bricht, brach. С haben предмет ломает кто-то, с sein он ломается сам (der Ast ist gebrochen). О частях тела говорят возвратно с Dativ, как в примере: sich den Arm brechen. В переносном значении нарушают обещание (ein Versprechen brechen) и бьют рекорд (einen Rekord brechen).'
      uk: 'Сильне дієслово: bricht, brach. З haben предмет ламає хтось, із sein він ламається сам (der Ast ist gebrochen). Про частини тіла кажуть зворотно з Dativ, як у прикладі: sich den Arm brechen. У переносному значенні порушують обіцянку (ein Versprechen brechen) і б’ють рекорд (einen Rekord brechen).'
