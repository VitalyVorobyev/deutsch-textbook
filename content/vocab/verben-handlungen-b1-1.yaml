      uk: 'Правильне дієслово: dreht, drehte, hat gedreht. Образ — обертання навколо осі: ручка, ключ, колесо. Es dreht sich um … — дуже частий спосіб сказати, про що йдеться. Фільм німецькою drehen, а не machen, тому зйомки називаються Dreharbeiten.'

  - de: umdrehen
