id: kultur-freizeit
title_de: "Kultur & Freizeit"
title_en: "Culture and leisure"
title_ru: "Культура и досуг"
title_uk: "Культура та дозвілля"
level: B1
# B1.12 is a genre unit: it owns no grammar point, so the deck carries the whole
# weight of what is new here — the words a Veranstaltungsprogramm, a spoken
# agreement about an evening out and a short written Erfahrungsbericht are made
# of.
#
# Three constraints shaped the list.
#
# 1. The frozen contract excludes art-criticism register, sports-reporting jargon
#    and cultural-history content. So no `Werk`, no `Interpretation`, no
#    `Epoche`: every headword is one a person reading a district's culture-week
#    flyer has to read or say — Saal, Vorstellung, Reservierung, Treffpunkt,
#    Stimmung.
# 2. The culture and leisure words the learner already owns are RECYCLED in the
#    article, the reading and the notes below, never re-taught (the validator
#    hard-fails a headword living in two decks): Veranstaltung, Programm,
#    Eintritt, Ausstellung, Kultur, Sendung, Band, Krimi, Lied
#    (kultur-unterhaltung-a2); Konzert, Kino, Film, Musik, Einladung, Fest,
#    feiern, tanzen, spielen, malen, wandern (freizeit-koennen, A1); Theater,
#    Museum, reservieren, Gast (reisen-urlaub); Karte (kommunikation-medien);
#    Kritik (meinung-medien, B1.5); empfehlen (verben-handlungen-a2-1);
#    Vorschlag (nebensaetze-plaene); Ermäßigung, kostenlos (einkaufen-geld-a2);
#    Führung (reisen-orte-a2); Erlebnis, erleben (erfahrungen-erzaehlen, B1.1);
#    Unterhaltung, auswählen (digitales-leben, B1.11). Their slots went to the
#    neighbour this unit genuinely adds — gratis beside kostenlos, aussuchen
#    beside auswählen, Vorstellung beside Veranstaltung, Stimmung beside Laune.
# 3. Every headword is on the Goethe-B1 Wortliste and owned by no other deck,
#    checked with
#    `bun scripts/coverage.ts B1 --check-deck content/vocab/kultur-freizeit.yaml`.
#    No exceptions were needed, so like digitales-leben this deck is fully
#    manifest-clean.
#
# Tiering, decided once and never retrofitted: the 22 entries the unit actively
# teaches ship as `both`; the 16 below the divider are the receptive tail —
# language a programme, a poster and a review say to you, and `cards:
# recognition` from the start because the direction is baked into the card id.
entries:
  # --- Core (cards: both by default) --------------------------------------
  # Reading a programme for the four facts, agreeing on an evening with someone,
  # and writing down afterwards what it was like. These the learner produces.

  - de: "Vorstellung"
    ipa: "ˈfoːɐ̯ˌʃtɛlʊŋ"
    pos: noun
    gender: f
    plural: "die Vorstellungen"
    en: "performance, showing"
    ru: "спектакль, сеанс"
    uk: "вистава, сеанс"
    example_de: "Die zweite Vorstellung am Sonntag ist noch nicht ausverkauft."
    example_en: "The second showing on Sunday is not sold out yet."
    example_ru: "Второй сеанс в воскресенье ещё не распродан."
    example_uk: "Другий сеанс у неділю ще не розпроданий."
    note:
      en: "One evening of a play, a film or a concert: eine Vorstellung besuchen. The whole event across several days is die Veranstaltung. The second sense — a picture in your head — lives in sich etwas vorstellen: Ich hatte mir das anders vorgestellt."
      ru: "Один вечер спектакля, фильма или концерта: eine Vorstellung besuchen. Всё мероприятие целиком, на несколько дней, — die Veranstaltung. Второе значение, «представление в голове», живёт в sich etwas vorstellen: Ich hatte mir das anders vorgestellt."
      uk: "Один вечір вистави, фільму чи концерту: eine Vorstellung besuchen. Увесь захід загалом, на кілька днів, — die Veranstaltung. Друге значення, «уявлення в голові», живе в sich etwas vorstellen: Ich hatte mir das anders vorgestellt."

  - de: "Publikum"
    ipa: "ˈpuːblikʊm"
    pos: noun
    gender: n
    plural: "—"
    en: "audience"
    ru: "публика, зрители"
    uk: "публіка, глядачі"
    example_de: "Das Publikum klatschte nach jedem Stück."
    example_en: "The audience clapped after every piece."
    example_ru: "Публика хлопала после каждого номера."
    example_uk: "Публіка плескала після кожного номера."
    note:
      en: "Grammatically singular even though it names many people: Das Publikum war begeistert. There is no everyday plural. die Zuschauer counts heads; das Publikum is the whole room as one."
      ru: "Грамматически единственное число, хотя людей много: Das Publikum war begeistert. Обиходного множественного у слова нет. die Zuschauer — счёт по головам, das Publikum — весь зал как одно целое."
      uk: "Граматично однина, хоча людей багато: Das Publikum war begeistert. Побутової множини слово не має. die Zuschauer — лік по головах, das Publikum — уся зала як одне ціле."

  - de: "Bühne"
    ipa: "ˈbyːnə"
    pos: noun
    gender: f
    plural: "die Bühnen"
    en: "stage"
    ru: "сцена"
    uk: "сцена"
    example_de: "Nach der Pause standen alle wieder auf der Bühne."
    example_en: "After the interval everybody was back on stage."
    example_ru: "После антракта все снова стояли на сцене."
    example_uk: "Після антракту всі знову стояли на сцені."
    note:
      en: "auf die Bühne gehen for the movement, auf der Bühne stehen for the position — the two-way prepositions from A1. The word also names the theatre world as a whole: ein Stück für die Bühne schreiben."
      ru: "auf die Bühne gehen — движение, auf der Bühne stehen — положение: те самые предлоги двойного управления с A1. Слово называет и театральный мир в целом: ein Stück für die Bühne schreiben."
      uk: "auf die Bühne gehen — рух, auf der Bühne stehen — положення: ті самі прийменники подвійного керування з A1. Слово називає і театральний світ загалом: ein Stück für die Bühne schreiben."

  - de: "Saal"
    ipa: "ˈzaːl"
    pos: noun
    gender: m
    plural: "die Säle"
    en: "hall, auditorium"
    ru: "зал"
    uk: "зала"
    example_de: "Der kleine Saal hat nur hundert Plätze."
    example_en: "The small hall seats only a hundred."
    example_ru: "В малом зале всего сто мест."
    example_uk: "У малій залі лише сто місць."
    note:
      en: "Irregular plural with an umlaut and a single a: die Säle, never Saale. A programme names the house first and the room second: Stadthalle, kleiner Saal. der Raum is any room; this one is big and has an audience in it."
      ru: "Неправильное множественное с умлаутом и одной a: die Säle, но никогда Saale. В программе сначала называют здание, потом помещение: Stadthalle, kleiner Saal. der Raum — любое помещение, а это — большое и со зрителями."
      uk: "Неправильна множина з умлаутом і однією a: die Säle, але ніколи Saale. У програмі спершу називають будівлю, потім приміщення: Stadthalle, kleiner Saal. der Raum — будь-яке приміщення, а це — велике й з глядачами."

  - de: "Reservierung"
    ipa: "ʁezɛɐ̯ˈviːʁʊŋ"
    pos: noun
    gender: f
    plural: "die Reservierungen"
    en: "booking, advance reservation"
    ru: "бронирование, предварительный заказ"
    uk: "бронювання, попереднє замовлення"
    example_de: "Für die Führung am Sonntag ist eine Reservierung nötig."
    example_en: "Booking is required for Sunday's guided tour."
    example_ru: "На воскресную экскурсию нужно бронирование."
    example_uk: "На недільну екскурсію потрібне бронювання."
    note:
      en: "The noun to reservieren: eine Reservierung machen, unter dem Namen Klein. It holds a table, a seat or a place on a tour — the paper you then pay for is die Karte."
      ru: "Существительное к reservieren: eine Reservierung machen, unter dem Namen Klein. Держит столик, место или место в группе, а бумажка, за которую платят, — die Karte."
      uk: "Іменник до reservieren: eine Reservierung machen, unter dem Namen Klein. Тримає столик, місце або місце в групі, а папірець, за який платять, — die Karte."

  - de: "Treffpunkt"
    ipa: "ˈtʁɛfˌpʊŋkt"
    pos: noun
    gender: m
    plural: "die Treffpunkte"
    en: "meeting point"
    ru: "место встречи"
    uk: "місце зустрічі"
    example_de: "Treffpunkt ist um Viertel vor acht vor dem Saal."
    example_en: "The meeting point is outside the hall at a quarter to eight."
    example_ru: "Встречаемся без четверти восемь перед залом."
    example_uk: "Зустрічаємося за чверть восьма перед залою."
    note:
      en: "treffen plus der Punkt. In a plan it stands with no article and no verb: Treffpunkt: Haupteingang, 19.45. der Termin fixes the time, der Treffpunkt the place — a plan needs both."
      ru: "treffen плюс der Punkt. В плане слово стоит без артикля и без глагола: Treffpunkt: Haupteingang, 19.45. der Termin задаёт время, der Treffpunkt — место; в плане нужны оба."
      uk: "treffen плюс der Punkt. У плані слово стоїть без артикля й без дієслова: Treffpunkt: Haupteingang, 19.45. der Termin задає час, der Treffpunkt — місце; у плані потрібні обидва."

  - de: "Stimmung"
    ipa: "ˈʃtɪmʊŋ"
    pos: noun
    gender: f
    plural: "die Stimmungen"
    en: "atmosphere, mood in a room"
    ru: "атмосфера, настроение в зале"
    uk: "атмосфера, настрій у залі"
    example_de: "Im kleinen Saal war die Stimmung besser als in der Halle."
    example_en: "The atmosphere in the small hall was better than in the arena."
    example_ru: "В малом зале атмосфера была лучше, чем в большом ангаре."
    example_uk: "У малій залі атмосфера була краща, ніж у великому ангарі."
    note:
      en: "gute Stimmung, schlechte Stimmung — what a room or an evening feels like, and the first thing a short review names. One person's mood on one day is die Laune instead: Er hat heute schlechte Laune."
      ru: "gute Stimmung, schlechte Stimmung — то, каким ощущается зал или вечер, и первое, что называет короткий отзыв. Настроение одного человека в конкретный день — die Laune: Er hat heute schlechte Laune."
      uk: "gute Stimmung, schlechte Stimmung — те, яким відчувається зал або вечір, і перше, що називає короткий відгук. Настрій однієї людини в конкретний день — die Laune: Er hat heute schlechte Laune."

  - de: "Roman"
    ipa: "ʁoˈmaːn"
    pos: noun
    gender: m
    plural: "die Romane"
    en: "novel"
    ru: "роман"
    uk: "роман"
    example_de: "Ich finde den Film besser als den Roman."
    example_en: "I think the film is better than the novel."
    example_ru: "По-моему, фильм лучше книги."
    example_uk: "Як на мене, фільм кращий за книжку."
    note:
      en: "Stress on the second syllable, and no connection to Rom or to romantisch — a Roman can be a crime story just as well. A short one is die Erzählung; the whole field is die Literatur."
      ru: "Ударение на втором слоге, и никакой связи ни с Rom, ни с romantisch: ein Roman вполне может быть детективом. Короткая вещь — die Erzählung, вся область — die Literatur."
      uk: "Наголос на другому складі, і жодного зв'язку ні з Rom, ні з romantisch: ein Roman цілком може бути детективом. Коротка річ — die Erzählung, уся царина — die Literatur."

  - de: "Figur"
    ipa: "fiˈguːɐ̯"
    pos: noun
    gender: f
    plural: "die Figuren"
    en: "character in a story; figure"
    ru: "персонаж; фигура"
    uk: "персонаж; фігура"
    example_de: "Die Hauptfigur im zweiten Teil war mir zu leise."
    example_en: "The lead character in the second half was too quiet for me."
    example_ru: "Главный персонаж во второй части показался мне слишком тихим."
    example_uk: "Головний персонаж у другій частині здався мені надто тихим."
    note:
      en: "die Hauptfigur is the lead. The same word is a body's shape, eine sportliche Figur, and a piece on a board, die Schachfigur. Stress on the last syllable."
      ru: "die Hauptfigur — главный герой. То же слово — телосложение, eine sportliche Figur, и фишка на доске, die Schachfigur. Ударение на последнем слоге."
      uk: "die Hauptfigur — головний герой. Те саме слово — статура, eine sportliche Figur, і фішка на дошці, die Schachfigur. Наголос на останньому складі."

  - de: "Wanderung"
    ipa: "ˈvandəʁʊŋ"
    pos: noun
    gender: f
    plural: "die Wanderungen"
    en: "hike, walk in the country"
    ru: "поход, прогулка за городом"
    uk: "похід, прогулянка за містом"
    example_de: "Am Sonntag machen wir lieber eine kurze Wanderung."
    example_en: "On Sunday we would rather go on a short hike."
    example_ru: "В воскресенье мы лучше сходим в короткий поход."
    example_uk: "У неділю ми краще підемо в короткий похід."
    note:
      en: "eine Wanderung machen — the noun to wandern, and hours rather than minutes. A stroll around the block is ein Spaziergang. The marked route is der Wanderweg."
      ru: "eine Wanderung machen — существительное к wandern, и речь о часах, а не минутах. Прогулка вокруг дома — ein Spaziergang. Размеченный маршрут — der Wanderweg."
      uk: "eine Wanderung machen — іменник до wandern, і йдеться про години, а не хвилини. Прогулянка навколо будинку — ein Spaziergang. Розмічений маршрут — der Wanderweg."

  - de: "verabreden"
    ipa: "fɛɐ̯ˈʔapʁeːdn̩"
    pos: verb
    praesens_3sg: "verabredet sich"
    partizip2: "sich verabredet"
    aux: haben
    valence: "sich mit + Dat"
    accept: ["sich verabreden"]
    en: "to arrange to meet"
    ru: "договариваться о встрече"
    uk: "домовлятися про зустріч"
    example_de: "Wir haben uns für Samstag vor dem Kino verabredet."
    example_en: "We arranged to meet outside the cinema on Saturday."
    example_ru: "Мы договорились встретиться в субботу у кинотеатра."
    example_uk: "Ми домовилися зустрітися в суботу біля кінотеатру."
    note:
      en: "Reflexive in this sense, and the other person takes mit + Dativ: sich mit jemandem verabreden. Without the pronoun it arranges the thing rather than the meeting: einen Termin verabreden. Ich bin verabredet says the plan already exists."
      ru: "В этом значении глагол возвратный, а собеседник вводится через mit + Dativ: sich mit jemandem verabreden. Без местоимения договариваются о самой вещи, а не о встрече: einen Termin verabreden. Ich bin verabredet значит, что договорённость уже есть."
      uk: "У цьому значенні дієслово зворотне, а співрозмовник уводиться через mit + Dativ: sich mit jemandem verabreden. Без займенника домовляються про саму річ, а не про зустріч: einen Termin verabreden. Ich bin verabredet означає, що домовленість уже є."

  - de: "abmachen"
    ipa: "ˈapˌmaxn̩"
    pos: verb
    praesens_3sg: "macht ab"
    partizip2: "abgemacht"
    aux: haben
    valence: "+ Akk"
    en: "to agree on, to settle between you"
    ru: "договариваться о чём-либо"
    uk: "домовлятися про щось"
    example_de: "Wir haben abgemacht, dass jeder seine Karte selbst kauft."
    example_en: "We agreed that everybody buys their own ticket."
    example_ru: "Мы договорились, что каждый покупает билет себе сам."
    example_uk: "Ми домовилися, що кожен купує квиток собі сам."
    note:
      en: "Separable: macht ab, hat abgemacht. Abgemacht! on its own closes a plan and needs nothing after it. The literal sense is taking a thing off something: ein Schild abmachen."
      ru: "Отделяемая приставка: macht ab, hat abgemacht. Одно Abgemacht! закрывает договорённость, и добавлять к нему нечего. Буквальное значение — снять что-то: ein Schild abmachen."
      uk: "Відокремлюваний префікс: macht ab, hat abgemacht. Одне Abgemacht! закриває домовленість, і додавати до нього нічого. Буквальне значення — зняти щось: ein Schild abmachen."

  - de: "genießen"
    ipa: "gəˈniːsn̩"
    pos: verb
    praesens_3sg: "genießt"
    partizip2: "genossen"
    aux: haben
    valence: "+ Akk"
    en: "to enjoy, to savour"
    ru: "наслаждаться, получать удовольствие"
    uk: "насолоджуватися, діставати задоволення"
    example_de: "Den ruhigen Abend im kleinen Saal habe ich sehr genossen."
    example_en: "I really enjoyed the quiet evening in the small hall."
    example_ru: "Тихим вечером в малом зале я по-настоящему насладился."
    example_uk: "Тихим вечором у малій залі я по-справжньому насолодився."
    note:
      en: "Strong and inseparable: genießt, hat genossen — no ge- in the participle, because ge- is already the prefix. It takes a plain Akkusativ. gefallen turns the sentence round instead: Der Abend hat mir gefallen."
      ru: "Сильный и неотделяемый: genießt, hat genossen — в причастии нет ge-, потому что ge- уже приставка. Управляет прямым Akkusativ. gefallen переворачивает фразу: Der Abend hat mir gefallen."
      uk: "Сильне й невідокремлюване: genießt, hat genossen — у дієприкметнику немає ge-, бо ge- уже префікс. Керує прямим Akkusativ. gefallen перевертає фразу: Der Abend hat mir gefallen."

  - de: "loben"
    ipa: "ˈloːbn̩"
    pos: verb
    praesens_3sg: "lobt"
    partizip2: "gelobt"
    aux: haben
    valence: "+ Akk"
    en: "to praise"
    ru: "хвалить"
    uk: "хвалити"
    example_de: "Die Zeitung lobte vor allem das Orchester."
    example_en: "The paper praised the orchestra above all."
    example_ru: "Газета хвалила прежде всего оркестр."
    example_uk: "Газета хвалила передусім оркестр."
    note:
      en: "Regular: lobt, hat gelobt. Its opposite in a review is kritisieren. The noun das Lob has no everyday plural: viel Lob bekommen."
      ru: "Правильный глагол: lobt, hat gelobt. Противоположность в отзыве — kritisieren. У существительного das Lob обиходного множественного нет: viel Lob bekommen."
      uk: "Правильне дієслово: lobt, hat gelobt. Протилежність у відгуку — kritisieren. Іменник das Lob побутової множини не має: viel Lob bekommen."

  - de: "kritisieren"
    ipa: "kʁitiˈziːʁən"
    pos: verb
    praesens_3sg: "kritisiert"
    partizip2: "kritisiert"
    aux: haben
    valence: "+ Akk"
    en: "to criticize"
    ru: "критиковать"
    uk: "критикувати"
    example_de: "Viele kritisierten nur die Länge des zweiten Teils."
    example_en: "Many people criticized only the length of the second half."
    example_ru: "Многие критиковали лишь длину второй части."
    example_uk: "Багато хто критикував лише довжину другої частини."
    note:
      en: "Verbs in -ieren build the Partizip II without ge-: hat kritisiert. It takes a plain Akkusativ, and the noun is die Kritik. It is not automatically hostile — a good review criticizes one part and praises the rest."
      ru: "Глаголы на -ieren образуют Partizip II без ge-: hat kritisiert. Управляет прямым Akkusativ, существительное — die Kritik. Слово не обязательно враждебное: хороший отзыв ругает одну часть и хвалит остальное."
      uk: "Дієслова на -ieren утворюють Partizip II без ge-: hat kritisiert. Керує прямим Akkusativ, іменник — die Kritik. Слово не конче вороже: гарний відгук ганить одну частину й хвалить решту."

  - de: "aussuchen"
    ipa: "ˈaʊ̯sˌzuːxn̩"
    pos: verb
    praesens_3sg: "sucht aus"
    partizip2: "ausgesucht"
    aux: haben
    valence: "+ Akk"
    en: "to pick out, to choose from what is there"
    ru: "выбирать, подбирать из имеющегося"
    uk: "вибирати, добирати з наявного"
    example_de: "Such dir aus dem Programm zwei Abende aus."
    example_en: "Pick two evenings out of the programme."
    example_ru: "Выбери себе из программы два вечера."
    example_uk: "Вибери собі з програми два вечори."
    note:
