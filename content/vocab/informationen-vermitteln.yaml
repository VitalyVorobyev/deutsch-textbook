id: informationen-vermitteln
title_de: "Informationen vermitteln"
title_en: "Passing information on"
title_ru: "Передача информации"
title_uk: "Передавання інформації"
level: B1
# B1.14 owns three grammar points, so the deck carries the lexis of the task
# around them: the notice on the board, the message somebody leaves, and the
# words a summary is built out of.
#
# Four constraints shaped the list.
#
# 1. The frozen contract excludes journalistic register and minutes/protocol
#    formats. `Presse`, `Reportage`, `Reporter`, `Recherche`, `Magazin` and
#    `Referat` are all free on the Goethe-B1 manifest and all of them were left
#    there. What the deck admits instead is the paper a household and an office
#    actually hand each other: Mitteilung, Änderung, Rückmeldung, Absender,
#    Einzelheit, Briefkasten.
# 2. The mediation field is almost entirely OWNED already, and that is the
#    finding this deck is built around rather than a preference. Recycled in the
#    article, the reading and the notes below, never re-taught (the validator
#    hard-fails a headword living in two decks): Nachricht, Information,
#    informieren, wiederholen (kommunikation-medien); mitteilen, Hinweis,
#    gelten, Hausmeister, Treppenhaus (regeln-verantwortung); zusammenfassen,
#    Aussage, behaupten, Meldung, Quelle (meinung-medien); Bericht, Ereignis
#    (erfahrungen-erzaehlen); Bescheid (redemittel-chunks-a2); Text, Satz,
#    Thema, Notiz (schule-faecher-a2); Wort, nachfragen, notieren, Bedeutung
#    (lernen-verstehen); ausrichten (verben-handlungen-b1-2); aufschreiben
#    (verben-kommunikation-ausdruck-b1); Unterlagen, Kopie (aemter-
#    dienstleistungen); Durchsage (reisen-verkehr); Auskunft (reisen-urlaub);
#    Versammlung, Verwaltung, hinweisen (gesellschaft-zusammenleben);
#    verschieben, absagen (termine-zeit); stattfinden (zeit-termine-a2); planen,
#    Vorschlag (nebensaetze-plaene); ankündigen, Überschrift (kultur-freizeit);
#    Zettel (dinge-sachen-a2); Anzeige (wohnen); Empfänger (einkaufen-geld-a2);
#    schriftlich (eigenschaften-dinge-a2); Schild (verkehr-unterwegs-a2);
#    Gespräch (menschen-beziehungen-a2); fehlen (dativ-verben); erklären
#    (goethe-a1-kernwortschatz). The field's verbs are spent hardest of all —
#    mitteilen, informieren, berichten, melden, zusammenfassen, erklären,
#    wiederholen, ausrichten, ankündigen, behaupten and äußern are every one of
#    them owned — so the five verbs below are what is left, and the deck is
#    noun-heavy for that reason rather than by choice.
# 3. Every headword except two is on the Goethe-B1 Wortliste and owned by no
#    other deck, checked with
#    `bun scripts/coverage.ts B1 --check-deck content/vocab/informationen-vermitteln.yaml`.
#    The two exceptions are `Mitteilung` and `weitergeben`, which the frozen
#    outcome `mitteilung-weitergeben` names in its own can-do statement ("Ich
#    kann den Inhalt einer Mitteilung mit eigenen Worten weitergeben") — the
#    `Einwand`/`Meinungsverschiedenheit` precedent from B1.10. `Aushang` gets
#    the opposite ruling: it is off-manifest AND named by no outcome, so it is
#    taught receptively in the article and the reading and takes no card.
# 4. The tiering was run through the same mechanical collision test as the
#    decks before it — YAML-parse every deck, index the `de`/`en`/`ru`/`uk`/
#    `accept` of every entry whose `cards` is absent or `both`, and check each
#    candidate gloss against it. It flagged five words that were drafted `both`
#    and ship `recognition`: `Neuigkeit` against `Nachricht` (glossed "message;
#    (pl.) the news"), `Sinn` against `Bedeutung` ("meaning | значение, смысл"),
#    `Zeichen` against `Schild` ("sign (road sign, notice) | знак"), `Dokument`
#    against `Unterlagen` and `Papiere` (both glossed "documents"), and
#    `verständlich` against `klar` ("clear, plain | ясный, понятный") — the
#    `eindeutig` ruling from `eigenschaften-bewertung-b1`. `Detail` loses its
#    productive slot inside this deck to `Einzelheit`, which lists it in
#    `accept`: the `dorthin`/`dahin` ruling from `ort-richtung-verweis-b1`.
#    Three flags were overruled deliberately, because nothing is shared but the
#    letters: `Wahrheit` against `Lüge` ("lie, untruth"), `Briefkasten` against
#    `Kiste` ("box; crate | коробка; ящик"), and `Mitteilung` against `Bescheid`
#    ("information, notice") — a Mitteilung is written and goes to everybody,
#    while Bescheid is what one person gives another, and the unit's own
#    outcome is unwritable without the noun.
#
# Tiering, decided once and never retrofitted: the 17 entries the unit actively
# teaches ship as `both`; the 21 below the divider are the receptive tail — what
# a notice, a formal letter and a summary say to you — and `cards: recognition`
# from the start, because the direction is baked into the card id.
entries:
  # --- Core (cards: both by default) --------------------------------------
  # Reading a notice, reporting what somebody said or asked, and cutting a text
  # down to what the next person can act on. These the learner produces.

  - de: "Mitteilung"
    ipa: "ˈmɪtˌtaɪ̯lʊŋ"
    pos: noun
    gender: f
    plural: "die Mitteilungen"
    en: "written announcement to everybody in a building or an office"
    ru: "письменное оповещение для всех, кого оно касается"
    uk: "письмове сповіщення для всіх, кого воно стосується"
    example_de: "Die Mitteilung der Hausverwaltung hängt seit gestern im Flur."
    example_en: "The building management's announcement has been in the hallway since yesterday."
    example_ru: "Оповещение управляющей компании висит в коридоре со вчерашнего дня."
    example_uk: "Сповіщення управлінської компанії висить у коридорі з учора."
    note:
      en: "The verb behind it is mitteilen, separable: die Verwaltung teilt mit. On a board the same paper is ein Aushang; to one person you send eine Nachricht."
      ru: "За ним стоит глагол mitteilen, отделяемый: die Verwaltung teilt mit. На доске та же бумага называется ein Aushang, а одному человеку посылают eine Nachricht."
      uk: "За ним стоїть дієслово mitteilen, відокремлюване: die Verwaltung teilt mit. На дошці той самий папір зветься ein Aushang, а одній людині надсилають eine Nachricht."

  - de: "weitergeben"
    ipa: "ˈvaɪ̯tɐˌgeːbn̩"
    pos: verb
    praesens_3sg: "gibt weiter"
    partizip2: "weitergegeben"
    aux: haben
    valence: "+ Akk"
    en: "to pass something on to the next person"
    ru: "передать дальше, следующему"
    uk: "передати далі, наступному"
    example_de: "Ich gebe die Information gern an die Nachbarn weiter."
    example_en: "I am happy to pass the information on to the neighbours."
    example_ru: "Я охотно передам эту информацию соседям."
    example_uk: "Я охоче передам цю інформацію сусідам."
    note:
      en: "Separable: gibt weiter, hat weitergegeben. The frame is etwas an jemanden weitergeben. Handing an object back to its owner is zurückgeben instead."
      ru: "Отделяемая приставка: gibt weiter, hat weitergegeben. Управление — etwas an jemanden weitergeben. Вернуть вещь владельцу — zurückgeben."
      uk: "Відокремлюваний префікс: gibt weiter, hat weitergegeben. Керування — etwas an jemanden weitergeben. Повернути річ власникові — zurückgeben."

  - de: "Inhalt"
    ipa: "ˈɪnˌhalt"
    pos: noun
    gender: m
    plural: "die Inhalte"
    en: "what a text says or a container holds"
    ru: "то, что сказано в тексте; то, что внутри"
    uk: "те, що сказано в тексті; те, що всередині"
    example_de: "Den Inhalt des Briefes kann ich in zwei Sätzen sagen."
    example_en: "I can give what the letter says in two sentences."
    example_ru: "Написанное в письме я перескажу в двух предложениях."
    example_uk: "Написане в листі я перекажу двома реченнями."
    note:
      en: "From innen halten. A book's list of chapters is das Inhaltsverzeichnis, and the plural is what a course or a programme covers: die Inhalte des Kurses."
      ru: "От innen halten. Оглавление книги — das Inhaltsverzeichnis, а множественное число называет то, что проходят на курсе: die Inhalte des Kurses."
      uk: "Від innen halten. Зміст книжки (перелік розділів) — das Inhaltsverzeichnis, а множина називає те, що проходять на курсі: die Inhalte des Kurses."

  - de: "Änderung"
    ipa: "ˈɛndəʁʊŋ"
    pos: noun
    gender: f
    plural: "die Änderungen"
    en: "alteration to a date or a plan that was already fixed"
    ru: "поправка к уже назначенному сроку или плану"
    uk: "поправка до вже призначеного строку чи плану"
    example_de: "Bitte beachten Sie die Änderung beim Termin."
    example_en: "Please note the altered appointment."
    example_ru: "Обратите внимание: срок сдвинут."
    example_uk: "Зверніть увагу: строк зсунуто."
    note:
      en: "The noun to ändern. A notice ends with Änderungen vorbehalten, and a shop that shortens trousers has an Änderungsschneiderei."
      ru: "Существительное к ändern. Объявление кончается формулой Änderungen vorbehalten, а ателье, подшивающее брюки, — это Änderungsschneiderei."
      uk: "Іменник до ändern. Оголошення закінчується формулою Änderungen vorbehalten, а ательє, що підшиває штани, — це Änderungsschneiderei."

  - de: "Einzelheit"
    ipa: "ˈaɪ̯ntsl̩haɪ̯t"
    pos: noun
    gender: f
    plural: "die Einzelheiten"
    accept: ["das Detail"]
    en: "small point inside a larger whole"
    ru: "мелкая частность внутри целого"
    uk: "дрібна частковість усередині цілого"
    example_de: "In der Zusammenfassung lasse ich die Einzelheiten weg."
    example_en: "In the summary I leave the small points out."
    example_ru: "В пересказе я опускаю частности."
    example_uk: "У переказі я оминаю частковості."
    note:
      en: "Almost always plural: in allen Einzelheiten, bis ins letzte Detail. The international word is accepted on this card, and it is the one spoken German reaches for first."
      ru: "Почти всегда во множественном: in allen Einzelheiten, bis ins letzte Detail. Интернациональное слово карточка принимает, и в живой речи первым берут именно его."
      uk: "Майже завжди в множині: in allen Einzelheiten, bis ins letzte Detail. Інтернаціональне слово картка приймає, і в живому мовленні першим беруть саме його."

  - de: "Tatsache"
    ipa: "ˈtaːtˌzaxə"
    pos: noun
    gender: f
    plural: "die Tatsachen"
    en: "something that is simply the case, not an opinion"
    ru: "то, что есть на деле, в отличие от мнения"
    uk: "те, що є насправді, на відміну від думки"
    example_de: "In der Mitteilung stehen nur Tatsachen, keine Meinungen."
    example_en: "The notice states only what is the case, no opinions."
    example_ru: "В оповещении сказано только то, что есть на деле, — без мнений."
    example_uk: "У сповіщенні сказано лише те, що є насправді, — без думок."
    note:
      en: "The sentence opener is Tatsache ist, dass … The adverb tatsächlich beside it means that something really did turn out that way."
      ru: "Фраза начинается оборотом Tatsache ist, dass … Наречие tatsächlich рядом означает, что так оно и оказалось на самом деле."
      uk: "Фраза починається зворотом Tatsache ist, dass … Прислівник tatsächlich поряд означає, що так воно й виявилося насправді."

  - de: "Wahrheit"
    ipa: "ˈvaːɐ̯haɪ̯t"
    pos: noun
    gender: f
    plural: "die Wahrheiten"
    en: "what is true"
    ru: "правдивое положение дел"
    uk: "правдивий стан речей"
    example_de: "Er hat mir die Wahrheit gesagt."
    example_en: "He told me the truth."
    example_ru: "Он сказал мне, как всё обстоит на самом деле."
    example_uk: "Він сказав мені, як усе є насправді."
    note:
      en: "die Wahrheit sagen is the fixed chunk, and in Wahrheit introduces how things really are against how they look. The adjective is wahr."
      ru: "Устойчивое сочетание — die Wahrheit sagen, а оборот in Wahrheit вводит то, как обстоит дело вопреки видимости. Прилагательное — wahr."
      uk: "Стале сполучення — die Wahrheit sagen, а зворот in Wahrheit вводить те, як стоїть справа всупереч видимості. Прикметник — wahr."

  - de: "Absender"
    ipa: "ˈapˌzɛndɐ"
    pos: noun
    gender: m
    plural: "die Absender"
    en: "person a letter was sent by"
    ru: "тот, кто отправил письмо"
    uk: "той, хто надіслав листа"
    example_de: "Auf dem Umschlag steht kein Absender."
    example_en: "There is nobody named as having sent it on the envelope."
    example_ru: "На конверте не указан тот, кто его отправил."
    example_uk: "На конверті не зазначено того, хто його надіслав."
    note:
      en: "From absenden, and it names both the person and the block of text top left on the envelope. The other end of the letter is der Empfänger; a woman is die Absenderin."
      ru: "От absenden; слово называет и человека, и блок текста в левом верхнем углу конверта. Другой конец письма — der Empfänger, женский вариант — die Absenderin."
      uk: "Від absenden; слово називає і людину, і блок тексту в лівому верхньому куті конверта. Інший кінець листа — der Empfänger, жіночий варіант — die Absenderin."

  - de: "Rückmeldung"
    ipa: "ˈʁʏkˌmɛldʊŋ"
    pos: noun
    gender: f
    plural: "die Rückmeldungen"
    en: "short answer telling somebody you got their message"
    ru: "короткий ответ о том, что сообщение получено"
    uk: "коротка відповідь про те, що повідомлення отримано"
    example_de: "Bitte geben Sie uns bis Freitag eine kurze Rückmeldung."
    example_en: "Please let us know briefly by Friday."
    example_ru: "Просим до пятницы коротко ответить, что получили."
    example_uk: "Просимо до п'ятниці коротко відповісти, що отримали."
    note:
      en: "eine Rückmeldung geben, um Rückmeldung bitten — office and school register. At a university the same word means re-registering for the next semester."
      ru: "eine Rückmeldung geben, um Rückmeldung bitten — регистр конторы и школы. В университете то же слово означает продление записи на следующий семестр."
      uk: "eine Rückmeldung geben, um Rückmeldung bitten — регістр контори та школи. В університеті те саме слово означає продовження запису на наступний семестр."

  - de: "Gegensatz"
    ipa: "ˈgeːgn̩ˌzats"
    pos: noun
    gender: m
    plural: "die Gegensätze"
    en: "contrast — the way two things stand against each other"
    ru: "противопоставление, контраст"
    uk: "протиставлення, контраст"
    example_de: "Im Gegensatz zu gestern ist es heute ruhig im Haus."
    example_en: "In contrast to yesterday, the building is quiet today."
    example_ru: "В противоположность вчерашнему дню сегодня в доме тихо."
    example_uk: "На противагу вчорашньому дню сьогодні в будинку тихо."
    note:
      en: "The chunk is im Gegensatz zu + Dativ, and it is what a summary uses to put two statements side by side. das Gegenteil is the other thing itself, not the relation between them."
      ru: "Устойчивое сочетание — im Gegensatz zu + Dativ; им пересказ ставит два утверждения рядом. das Gegenteil — это сама другая вещь, а не отношение между ними."
      uk: "Стале сполучення — im Gegensatz zu + Dativ; ним переказ ставить два твердження поряд. das Gegenteil — це сама інша річ, а не відношення між ними."

  - de: "Zuhörer"
    ipa: "ˈtsuːˌhøːʁɐ"
    pos: noun
    gender: m
    plural: "die Zuhörer"
    en: "person sitting and listening to somebody speak"
    ru: "тот, кто сидит и слушает говорящего"
    uk: "той, хто сидить і слухає промовця"
    example_de: "Der Vortrag war kurz, und die Zuhörer hatten viele Fragen."
    example_en: "The talk was short and the people listening had many questions."
    example_ru: "Доклад был коротким, и у сидевших в зале было много вопросов."
    example_uk: "Доповідь була короткою, і в тих, хто слухав, було багато питань."
    note:
      en: "From zuhören. A woman is die Zuhörerin, and the whole room together is das Publikum. Somebody at the radio is der Hörer."
      ru: "От zuhören. Женский вариант — die Zuhörerin, а весь зал вместе — das Publikum. У радиоприёмника сидит der Hörer."
      uk: "Від zuhören. Жіночий варіант — die Zuhörerin, а вся зала разом — das Publikum. Біля радіоприймача сидить der Hörer."

  - de: "Kommunikation"
    ipa: "kɔmunikaˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "—"
    en: "the exchange of information between people"
    ru: "коммуникация, обмен сведениями между людьми"
    uk: "комунікація, обмін відомостями між людьми"
    example_de: "Die Kommunikation im Haus läuft über den Aushang."
    example_en: "Information in the building is exchanged via the notice board."
    example_ru: "Сведения в доме передаются через объявление на доске."
    example_uk: "Відомості в будинку передаються через оголошення на дошці."
    note:
      en: "Stress on the last syllable, and no plural in everyday use. The verb is kommunizieren; a single exchange between two people is ein Gespräch."
      ru: "Ударение на последнем слоге, множественного в обиходе нет. Глагол — kommunizieren; отдельный разговор двоих — ein Gespräch."
      uk: "Наголос на останньому складі, множини в побуті немає. Дієслово — kommunizieren; окрема розмова двох — ein Gespräch."

  - de: "Liste"
    ipa: "ˈlɪstə"
    pos: noun
    gender: f
    plural: "die Listen"
    en: "items written one under the other"
    ru: "перечень, записанный столбиком"
    uk: "перелік, записаний стовпчиком"
    example_de: "Auf der Liste stehen alle Namen aus dem Haus."
    example_en: "All the names from the building are on the list."
    example_ru: "В перечне значатся все жильцы дома."
    example_uk: "У переліку значаться всі мешканці будинку."
    note:
      en: "eine Liste machen, auf der Liste stehen, sich in eine Liste eintragen. A shopping one is die Einkaufsliste, and a waiting one die Warteliste."
      ru: "eine Liste machen, auf der Liste stehen, sich in eine Liste eintragen. В магазин ходят с die Einkaufsliste, а в очереди стоят в die Warteliste."
      uk: "eine Liste machen, auf der Liste stehen, sich in eine Liste eintragen. До крамниці ходять із die Einkaufsliste, а в черзі стоять у die Warteliste."

  - de: "Briefkasten"
    ipa: "ˈbʁiːfˌkastn̩"
    pos: noun
    gender: m
    plural: "die Briefkästen"
    en: "box that letters are put into"
    ru: "почтовый ящик"
    uk: "поштова скринька"
    example_de: "Der Zettel lag heute Morgen im Briefkasten."
    example_en: "The slip of paper was in the letterbox this morning."
    example_ru: "Записка лежала утром в почтовом ящике."
    example_uk: "Записка лежала вранці в поштовій скриньці."
    note:
      en: "The same word for the one by your door and the yellow one on the street. The digital one is das Postfach, and so is a numbered box at the post office."
      ru: "Одно слово и для ящика у двери, и для жёлтого на улице. Электронный называется das Postfach — как и абонентский ящик на почте."
      uk: "Одне слово і для скриньки біля дверей, і для жовтої на вулиці. Електронна зветься das Postfach — як і абонентська скринька на пошті."

  - de: "mündlich"
    ipa: "ˈmʏntlɪç"
    pos: adj
    en: "said out loud rather than written down"
    ru: "устный, сказанный вслух, а не написанный"
    uk: "усний, сказаний уголос, а не написаний"
    example_de: "Der Hausmeister hat es mir nur mündlich gesagt."
    example_en: "The caretaker only told me by word of mouth."
    example_ru: "Комендант сказал мне это только на словах."
    example_uk: "Комендант сказав мені це лише на словах."
    note:
      en: "From der Mund. Its pair is schriftlich, and a contract usually insists on the second: eine mündliche Zusage, eine mündliche Prüfung."
      ru: "От der Mund. Пара к нему — schriftlich, и договор обычно требует именно второго: eine mündliche Zusage, eine mündliche Prüfung."
