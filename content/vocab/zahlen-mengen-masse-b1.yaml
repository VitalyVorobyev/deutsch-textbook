      ru: 'Полная форма tausend и одно орфографическое слово. В обычной речи достаточно tausend; ein- подчёркивает ровно одну тысячу или начинает более длинное число, например eintausendzweihundert.'
      uk: 'Повна форма tausend і одне орфографічне слово. У звичайному мовленні досить tausend; ein- підкреслює рівно одну тисячу або починає довше число, наприклад eintausendzweihundert.'
