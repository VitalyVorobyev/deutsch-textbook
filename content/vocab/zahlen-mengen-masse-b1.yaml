    note:
      en: 'Separable, stress on aus: reicht aus, hat ausgereicht. It is the written form of reichen and turns up in instructions and requirements. Its participle is a school grade: ausreichend is a bare pass, and nicht ausreichend is a fail.'
      ru: 'Отделяемый глагол, ударение на aus: reicht aus, hat ausgereicht. Письменная форма reichen; встречается в инструкциях и требованиях. Причастие служит школьной оценкой: ausreichend — «удовлетворительно», nicht ausreichend — неудовлетворительно.'
      uk: 'Відокремлюване дієслово, наголос на aus: reicht aus, hat ausgereicht. Писемна форма reichen; трапляється в інструкціях і вимогах. Дієприкметник служить шкільною оцінкою: ausreichend — «задовільно», nicht ausreichend — незадовільно.'

  - de: genügen
    ipa: "gəˈnyːgn̩"
    pos: verb
    praesens_3sg: genügt
    partizip2: genügt
    aux: haben
    valence: "+ Dat"
    # Recognition only: the third word in this deck for one prompt; `reichen` takes
