      uk: 'Те саме слово з тією самою вимовою, що circa, але через z — особливо в австрійських і швейцарських текстах. Уживані також ungefähr і скорочення ca. Самі використовуйте circa або ungefähr, цю регіональну форму впізнавайте.'

  - de: einhundert
    ipa: "ˈaɪ̯nˌhʊndɐt"
    pos: num
