# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the counting and
# measuring words of data/goethe-b1-wortliste.txt — figures and arithmetic signs, the
# units a package and a road sign use, the nouns for how much and how far, and the
# verbs for a number going up, going down or being enough.
id: zahlen-mengen-masse-b1
title_de: "Zahlen, Mengen und Maße"
title_en: "Numbers, quantities and measures"
title_ru: "Числа, количества и меры"
title_uk: "Числа, кількості та міри"
level: B1
entries:
  # --- Zahlen und Rechenzeichen ---
  - de: "Null"
    ipa: "ˈnʊl"
    pos: noun
    gender: f
    plural: "die Nullen"
    # Recognition only: A1 `null` ships the figure itself as a production card in
    # erste-schritte, and the two differ by a capital letter alone — a typed prompt
    # could not say which of them it wanted.
    cards: recognition
    en: nought, the figure zero
    ru: ноль (как цифра, как знак)
    uk: нуль (як цифра, як знак)
    example_de: Bei der Postleitzahl fehlt eine Null.
    example_en: There is a nought missing from the postcode.
    example_ru: В почтовом индексе не хватает нуля.
    example_uk: У поштовому індексі бракує нуля.
    note:
      en: 'Feminine and countable — die Nullen are the noughts on a page. The lower-case null is the number word you count with, and the two are separated only by capitalisation, which is why they are easy to mix up. Fixed uses: null Ahnung haben and, in football, zwei zu null.'
      ru: 'Женский род и счётное слово: die Nullen — нули на бумаге. Строчное null — числительное, которым считают; различает их только заглавная буква, отсюда и путаница. Устойчивые обороты: null Ahnung haben и в футболе zwei zu null.'
      uk: 'Жіночий рід і злічуване слово: die Nullen — нулі на папері. Мале null — числівник, яким лічать; розрізняє їх лише велика літера, звідси й плутанина. Сталі звороти: null Ahnung haben і у футболі zwei zu null.'

  - de: Milliarde
    ipa: "mɪˈliaʁdə"
    pos: noun
    gender: f
    plural: "die Milliarden"
    # Recognition only: a newspaper figure. A B1 learner reads it in a report on a
    # budget and has no everyday sentence that produces it.
    cards: recognition
    en: a thousand million
    ru: миллиард
    uk: мільярд
    example_de: Das Projekt kostet mehr als eine Milliarde Euro.
    example_en: The project costs more than a thousand million euros.
    example_ru: Проект стоит больше миллиарда евро.
    example_uk: Проєкт коштує понад мільярд євро.
    note:
      en: 'The trap is worth stating: the German word for a thousand million is not the English billion, which German renders as Milliarde, while die Billion is a million million. Newspapers write Mrd. as the abbreviation. Like Million it is a noun and takes a plural -n.'
      ru: 'Ловушку стоит назвать прямо: английское billion — это немецкое Milliarde, а die Billion по-немецки означает триллион. В газетах пишут сокращение Mrd. Как и Million, это существительное с окончанием -n во множественном числе.'
      uk: 'Пастку варто назвати прямо: англійське billion — це німецька Milliarde, а die Billion німецькою означає трильйон. У газетах пишуть скорочення Mrd. Як і Million, це іменник із закінченням -n у множині.'

  - de: Drittel
    ipa: "ˈdʁɪtl̩"
    pos: noun
    gender: n
    plural: "die Drittel"
    # Recognition only: `dritte` (zahlen-daten-geld) ships the ordinal as a production
    # card, and a bare prompt for a third cannot separate the fraction from it.
    cards: recognition
    en: one part in three
    ru: треть
    uk: третина
    example_de: Ein Drittel der Gäste ist schon gegangen.
    example_en: One part in three of the guests has already left.
    example_ru: Треть гостей уже ушла.
    example_uk: Третина гостей уже пішла.
    note:
      en: 'Neuter, and the plural is the same as the singular: zwei Drittel. Fractions are built from the ordinal plus -tel — Viertel, Fünftel, Zehntel — and they stay uninflected before a noun. What follows is either a genitive or von + Dativ.'
      ru: 'Средний род, множественное совпадает с единственным: zwei Drittel. Дроби строятся из порядкового числительного и -tel — Viertel, Fünftel, Zehntel — и перед существительным не изменяются. Дальше идёт либо Genitiv, либо von + Dativ.'
      uk: 'Середній рід, множина збігається з одниною: zwei Drittel. Дроби будуються з порядкового числівника та -tel — Viertel, Fünftel, Zehntel — і перед іменником не змінюються. Далі йде або Genitiv, або von + Dativ.'

  - de: doppelt
    ipa: "ˈdɔpl̩t"
    pos: adj
    en: double, twice as much
    ru: двойной, вдвое больший
    uk: подвійний, удвічі більший
    example_de: Die Miete ist doppelt so hoch wie früher.
    example_en: The rent is twice as high as it used to be.
    example_ru: Аренда вдвое выше, чем раньше.
    example_uk: Оренда вдвічі вища, ніж раніше.
    note:
      en: 'The frame doppelt so … wie is the one to hold whole, and it is how German says twice as. As an attribute it means double in the ordinary sense: eine doppelte Portion, ein doppelter Boden. Doppelt gemoppelt is the everyday way to say something was said twice over.'
      ru: 'Конструкцию doppelt so … wie стоит взять целиком — так по-немецки говорят «вдвое». Как определение значит «двойной»: eine doppelte Portion, ein doppelter Boden. Doppelt gemoppelt — бытовое «масло масляное».'
      uk: 'Конструкцію doppelt so … wie варто взяти цілою — так німецькою кажуть «удвічі». Як означення означає «подвійний»: eine doppelte Portion, ein doppelter Boden. Doppelt gemoppelt — побутове «масло масляне».'

  - de: zweifach
    ipa: "ˈtsvaɪ̯ˌfax"
    pos: adj
    # Recognition only: `zweimal` (zahlen-masse-a2) ships "twice" as a production card,
    # and this deck's own `doppelt` covers the attribute — three words, one prompt.
    cards: recognition
    en: twofold, in two copies
    ru: двукратный, в двух экземплярах
    uk: дворазовий, у двох примірниках
    example_de: Bitte reichen Sie den Antrag zweifach ein.
    example_en: Please submit the application in two copies.
    example_ru: Пожалуйста, подайте заявление в двух экземплярах.
    example_uk: Будь ласка, подайте заяву у двох примірниках.
    note:
      en: 'The -fach ending builds a whole series from the numbers: einfach, zweifach, dreifach, mehrfach, vielfach. In offices it means the number of copies, as in the example. In speech doppelt and zweimal do the work; einfach has drifted away to mean simple.'
      ru: 'Суффикс -fach строит целый ряд от числительных: einfach, zweifach, dreifach, mehrfach, vielfach. В канцелярии он означает число экземпляров, как в примере. В речи работают doppelt и zweimal, а einfach отошло к значению «простой».'
      uk: 'Суфікс -fach будує цілий ряд від числівників: einfach, zweifach, dreifach, mehrfach, vielfach. У канцелярії він означає кількість примірників, як у прикладі. У мовленні працюють doppelt і zweimal, а einfach відійшло до значення «простий».'

  - de: plus
    ipa: "ˈplʊs"
    pos: conj
    en: plus, added to
    ru: плюс
    uk: плюс
    example_de: Drei plus vier ist sieben.
    example_en: Three plus four is seven.
    example_ru: Три плюс четыре — семь.
    example_uk: Три плюс чотири — сім.
    note:
      en: 'In arithmetic it joins two numbers and the verb stays singular: … ist sieben, or … macht sieben. It also marks a temperature above freezing (plus fünf Grad) and, in a job ad, an advantage: Das ist ein Plus. The opposite sign is minus.'
      ru: 'В арифметике соединяет два числа, а глагол остаётся в единственном числе: … ist sieben или … macht sieben. Отмечает также температуру выше нуля (plus fünf Grad), а в объявлении о работе — плюс, преимущество: Das ist ein Plus. Противоположный знак — minus.'
      uk: 'В арифметиці сполучає два числа, а дієслово лишається в однині: … ist sieben або … macht sieben. Позначає також температуру вище нуля (plus fünf Grad), а в оголошенні про роботу — плюс, перевагу: Das ist ein Plus. Протилежний знак — minus.'

  - de: minus
    ipa: "ˈmiːnʊs"
    pos: conj
    en: minus, less
    ru: минус
    uk: мінус
    example_de: Heute Nacht sind es minus drei Grad.
    example_en: Tonight it will be minus three degrees.
    example_ru: Сегодня ночью минус три градуса.
    example_uk: Сьогодні вночі мінус три градуси.
    note:
      en: 'Two homes: subtraction (zehn minus zwei) and temperature below freezing, as in the example, where the weather forecast also says drei Grad unter null. Im Minus sein means to be overdrawn at the bank.'
      ru: 'Две области: вычитание (zehn minus zwei) и температура ниже нуля, как в примере, — прогноз погоды говорит также drei Grad unter null. Im Minus sein — «быть в минусе» на счёте.'
      uk: 'Дві сфери: віднімання (zehn minus zwei) і температура нижче нуля, як у прикладі, — прогноз погоди каже також drei Grad unter null. Im Minus sein — «бути в мінусі» на рахунку.'

  # --- Maße und Gewichte ---
  - de: Zentimeter
    ipa: "tsɛntiˈmeːtɐ"
    pos: noun
    gender: m
    plural: "die Zentimeter"
    # Recognition only: it is `Meter`, already carded in zahlen-masse-a2, plus a prefix
    # the learner can see — the derived-by-a-visible-rule ruling from zeit-b1.
    cards: recognition
    en: one hundredth of a metre
    ru: сантиметр
    uk: сантиметр
    example_de: Der Schrank ist zwei Zentimeter zu breit.
    example_en: The cupboard is two hundredths of a metre too wide.
    example_ru: Шкаф на два сантиметра шире, чем нужно.
    example_uk: Шафа на два сантиметри ширша, ніж треба.
    note:
      en: 'Masculine, and after a number the plural keeps the singular form: zwei Zentimeter. Written short it is cm. The prefixes are the international ones — Zenti-, Milli-, Kilo- — so Meter carries the whole series once you know it. Everyday speech often says Zenti for short.'
      ru: 'Мужской род, после числительного форма не меняется: zwei Zentimeter. Сокращение — cm. Приставки международные — Zenti-, Milli-, Kilo-, — поэтому весь ряд держится на слове Meter. В речи часто сокращают до Zenti.'
      uk: 'Чоловічий рід, після числівника форма не змінюється: zwei Zentimeter. Скорочення — cm. Префікси міжнародні — Zenti-, Milli-, Kilo-, — тому весь ряд тримається на слові Meter. У мовленні часто скорочують до Zenti.'

  - de: Kilometer
    ipa: "kiloˈmeːtɐ"
    pos: noun
    gender: m
    plural: "die Kilometer"
    # Recognition only: the same visible rule as Zentimeter, on the same carded stem.
    cards: recognition
    en: one thousand metres
    ru: километр
    uk: кілометр
    example_de: Bis zur nächsten Tankstelle sind es noch zehn Kilometer.
    example_en: It is another ten thousand metres to the next petrol station.
    example_ru: До ближайшей заправки ещё десять километров.
    example_uk: До найближчої заправки ще десять кілометрів.
    note:
      en: 'Masculine, unchanged in the plural after a number, abbreviated km. Speed is written km/h and read Stundenkilometer or Kilometer pro Stunde. The stress falls on the third syllable, which surprises learners who stress the first.'
      ru: 'Мужской род, после числительного не изменяется, сокращение km. Скорость пишут km/h и читают Stundenkilometer или Kilometer pro Stunde. Ударение падает на третий слог, что удивляет тех, кто ставит его на первый.'
      uk: 'Чоловічий рід, після числівника не змінюється, скорочення km. Швидкість пишуть km/h і читають Stundenkilometer або Kilometer pro Stunde. Наголос падає на третій склад, що дивує тих, хто ставить його на перший.'

  - de: Pfund
    ipa: "ˈpfʊnt"
    pos: noun
    gender: n
    plural: "die Pfund"
    # Recognition only: market and recipe vocabulary — heard at a counter, and a
    # learner ordering says 500 Gramm or ein halbes Kilo.
    cards: recognition
    en: half a kilo (as used at a market)
    en_compact: half a kilo at a market
    ru: фунт (полкило в разговорной речи)
    uk: фунт (пів кіла в розмовній мові)
    example_de: Ein Pfund Hackfleisch, bitte.
    example_en: Half a kilo of mince, please.
    example_ru: Полкило фарша, пожалуйста.
    example_uk: Пів кіла фаршу, будь ласка.
    note:
      en: 'In Germany it means exactly 500 grams, not the British 454, and it lives at market stalls, in recipes and in talk about losing weight. Neuter, and the plural after a number keeps the singular form: drei Pfund. The pound sterling is das Pfund too, which context separates.'
      ru: 'В Германии это ровно 500 граммов, а не британские 454; слово живёт на рынке, в рецептах и в разговорах о похудении. Средний род, после числительного форма не меняется: drei Pfund. Фунт стерлингов тоже das Pfund — различает контекст.'
      uk: 'У Німеччині це рівно 500 грамів, а не британські 454; слово живе на ринку, у рецептах і в розмовах про схуднення. Середній рід, після числівника форма не змінюється: drei Pfund. Фунт стерлінгів теж das Pfund — розрізняє контекст.'

  - de: Franken
    ipa: "ˈfʁaŋkn̩"
    pos: noun
    gender: m
    plural: "die Franken"
    # Recognition only: a Swiss variant. B1 is a trinational list, and the learner has
    # to read a Swiss price without ever quoting one.
    cards: recognition
    en: the Swiss currency unit
    ru: франк (валюта Швейцарии)
    uk: франк (валюта Швейцарії)
    example_de: Das Ticket kostet zwölf Franken.
    example_en: The ticket costs twelve of the Swiss currency units.
    example_ru: Билет стоит двенадцать франков.
    example_uk: Квиток коштує дванадцять франків.
    note:
      en: 'Masculine, unchanged after a number, written CHF or Fr. on a price tag. One hundredth of it is der Rappen. In Switzerland prices are often said as zwölf Franken fünfzig, with the small unit left unnamed.'
      ru: 'Мужской род, после числительного не изменяется, на ценнике пишут CHF или Fr. Сотая часть — der Rappen. В Швейцарии цену часто называют как zwölf Franken fünfzig, не называя мелкую единицу.'
      uk: 'Чоловічий рід, після числівника не змінюється, на ціннику пишуть CHF або Fr. Сота частина — der Rappen. У Швейцарії ціну часто називають як zwölf Franken fünfzig, не називаючи дрібної одиниці.'

  - de: Deka
    ipa: "ˈdeːka"
    pos: noun
    gender: n
    plural: "die Deka"
    # Recognition only: an Austrian variant, heard at a counter in Vienna. The learner
    # needs to understand the order, not to place it this way.
    cards: recognition
    en: ten grams (Austrian counter unit)
    en_compact: ten grams, Austrian
    ru: десять граммов (австрийская мера в магазине)
    uk: десять грамів (австрійська міра в крамниці)
    example_de: Zwanzig Deka Schinken, bitte.
    example_en: Two hundred grams of ham, please.
    example_ru: Двести граммов ветчины, пожалуйста.
    example_uk: Двісті грамів шинки, будь ласка.
    note:
      en: 'Austrian, and the short form of Dekagramm. Twenty of them are two hundred grams, which is how a Viennese deli counts. In Germany the same order is zweihundert Gramm, and the word is simply not used there.'
      ru: 'Австрийское слово, краткая форма от Dekagramm. Двадцать таких единиц — двести граммов; именно так считают в венской гастрономии. В Германии тот же заказ звучит zweihundert Gramm, а это слово там просто не употребляют.'
      uk: 'Австрійське слово, коротка форма від Dekagramm. Двадцять таких одиниць — двісті грамів; саме так лічать у віденській гастрономії. У Німеччині те саме замовлення звучить zweihundert Gramm, а це слово там просто не вживають.'

  - de: Dekagramm
    ipa: "ˈdeːkaˌgʁam"
    pos: noun
    gender: n
    plural: "die Dekagramm"
    # Recognition only: the full form of the Austrian unit above; a label and a recipe
    # write it out, a customer says the short one.
    cards: recognition
    en: ten grams, written in full (Austrian)
    ru: декаграмм, полная форма (Австрия)
    uk: декаграм, повна форма (Австрія)
    example_de: Auf dem Rezept steht zehn Dekagramm Butter.
    example_en: The recipe says one hundred grams of butter.
    example_ru: В рецепте указано сто граммов масла.
    example_uk: У рецепті зазначено сто грамів масла.
    note:
      en: 'Austrian, abbreviated dag or dkg on a label. Ten of them are one hundred grams. Spoken Austrian shortens it to Deka; German recipes and packaging use Gramm throughout and never this word.'
      ru: 'Австрийское слово, на этикетке сокращают как dag или dkg. Десять таких единиц — сто граммов. В устной речи в Австрии сокращают до Deka; немецкие рецепты и упаковка пользуются только Gramm.'
      uk: 'Австрійське слово, на етикетці скорочують як dag або dkg. Десять таких одиниць — сто грамів. В усному мовленні в Австрії скорочують до Deka; німецькі рецепти й пакування користуються лише Gramm.'

  - de: Gewicht
    ipa: "gəˈvɪçt"
    pos: noun
    gender: n
    plural: "die Gewichte"
    en: weight
    ru: вес
    uk: вага
    example_de: Das Paket überschreitet das erlaubte Gewicht.
    example_en: The parcel exceeds the permitted weight.
    example_ru: Посылка превышает допустимый вес.
    example_uk: Посилка перевищує дозволену вагу.
    note:
      en: 'Neuter, from wiegen. It is the word on a parcel form, a lift plate and a luggage rule. The figurative use is worth knowing: auf etwas Gewicht legen means to attach importance to something. Das Übergewicht is excess weight, of a suitcase or a person.'
      ru: 'Средний род, от wiegen. Слово из бланка на посылку, таблички в лифте и правил провоза багажа. Полезно и переносное употребление: auf etwas Gewicht legen — «придавать чему-то значение». Das Übergewicht — перевес чемодана и лишний вес человека.'
      uk: 'Середній рід, від wiegen. Слово з бланка на посилку, таблички в ліфті та правил провезення багажу. Корисне й переносне вживання: auf etwas Gewicht legen — «надавати чомусь значення». Das Übergewicht — перевага ваги валізи й зайва вага людини.'

  - de: wiegen
    ipa: "ˈviːgn̩"
    pos: verb
    praesens_3sg: wiegt
    partizip2: gewogen
    aux: haben
    valence: "+ Akk"
    en: to weigh
    ru: весить; взвешивать
    uk: важити; зважувати
    example_de: Der Koffer wiegt fast zwanzig Kilo.
    example_en: The suitcase weighs almost twenty kilos.
    example_ru: Чемодан весит почти двадцать килограммов.
    example_uk: Валіза важить майже двадцять кілограмів.
    note:
      en: 'Strong verb: wiegt, wog, hat gewogen. It works both ways round with no change of form: a thing weighs so much, and a person weighs a thing. The reflexive sich wiegen is standing on the scales, and die Waage is the scales themselves.'
      ru: 'Сильный глагол: wiegt, wog, hat gewogen. Работает в обе стороны без смены формы: предмет весит столько-то, и человек взвешивает предмет. Возвратное sich wiegen — «взвешиваться», а die Waage — сами весы.'
      uk: 'Сильне дієслово: wiegt, wog, hat gewogen. Працює в обидва боки без зміни форми: предмет важить стільки-то, і людина зважує предмет. Зворотне sich wiegen — «зважуватися», а die Waage — самі ваги.'

  - de: messen
    ipa: "ˈmɛsn̩"
    pos: verb
    praesens_3sg: misst
    partizip2: gemessen
    aux: haben
    valence: "+ Akk"
    en: to measure
    ru: измерять
    uk: вимірювати
    example_de: Der Arzt misst zuerst den Blutdruck.
    example_en: The doctor measures blood pressure first.
