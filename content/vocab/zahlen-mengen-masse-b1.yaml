    cards: recognition
    en: to suffice, to be enough (formal)
    ru: быть достаточным (официально)
    uk: бути достатнім (офіційно)
    example_de: Eine kurze Mitteilung genügt uns.
    example_en: A short note will be enough for us.
    example_ru: Нам достаточно короткого сообщения.
    example_uk: Нам достатньо короткого повідомлення.
    note:
      en: 'Regular, inseparable: genügt, hat genügt. The person it is enough for stands in the plain dative, as in the example. It is the most formal of the three and belongs to letters and rules; das genügt mir is still said in speech. Genügend is another school grade, and ungenügend the lowest.'
      ru: 'Правильный глагол, неотделяемый: genügt, hat genügt. Тот, кому достаточно, стоит в чистом Dativ, как в примере. Самый официальный из трёх, живёт в письмах и правилах; das genügt mir звучит и в речи. Genügend — ещё одна школьная оценка, ungenügend — низшая.'
      uk: 'Правильне дієслово, невідокремлюване: genügt, hat genügt. Той, кому достатньо, стоїть у чистому Dativ, як у прикладі. Найофіційніший із трьох, живе в листах і правилах; das genügt mir звучить і в мовленні. Genügend — ще одна шкільна оцінка, ungenügend — найнижча.'

  - de: zirka
