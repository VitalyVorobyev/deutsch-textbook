    en: to reduce, to cut down
    ru: сокращать, снижать
    uk: скорочувати, знижувати
    example_de: Ich möchte meine Arbeitszeit auf dreißig Stunden reduzieren.
    example_en: I would like to reduce my working hours to thirty.
    example_ru: Я хотел бы сократить рабочее время до тридцати часов.
    example_uk: Я хотів би скоротити робочий час до тридцяти годин.
    note:
      en: 'Regular, stress on the -zieren: reduziert, hat reduziert — no ge-. The new level takes auf + Akkusativ, the size of the cut takes um. In a shop the participle is the word on the label: reduziert means marked down. Its opposite here is erhöhen.'
      ru: 'Правильный глагол, ударение на -zieren: reduziert, hat reduziert — без ge-. Новый уровень вводится через auf + Akkusativ, величина сокращения — через um. В магазине причастие стоит на ценнике: reduziert — «уценённый». Противоположность — erhöhen.'
      uk: 'Правильне дієслово, наголос на -zieren: reduziert, hat reduziert — без ge-. Новий рівень вводиться через auf + Akkusativ, величина скорочення — через um. У крамниці дієприкметник стоїть на ціннику: reduziert — «уцінений». Протилежність — erhöhen.'

  - de: vergrößern
    ipa: "fɛɐ̯ˈgʁøːsɐn"
    pos: verb
    praesens_3sg: vergrößert
    partizip2: vergrößert
    aux: haben
    valence: "+ Akk"
    # Recognition only: derived from carded `groß` by a rule the learner can see, and
    # its everyday home is a screen menu and a photo shop.
    cards: recognition
    en: to enlarge, to make bigger
    ru: увеличивать
    uk: збільшувати
    example_de: Können Sie das Foto etwas vergrößern?
    example_en: Could you make the photo a bit bigger?
    example_ru: Можете немного увеличить фотографию?
    example_uk: Чи можете трохи збільшити світлину?
    note:
      en: 'Regular, inseparable, built from groß by the ver- … -ern pattern that also gives verkleinern, verbessern and verschlechtern. It is transitive; when a thing grows by itself German says wachsen. Die Vergrößerung is an enlargement of a photo.'
      ru: 'Правильный глагол, неотделяемый, образован от groß по модели ver- … -ern, которая даёт также verkleinern, verbessern и verschlechtern. Глагол переходный; когда предмет растёт сам, говорят wachsen. Die Vergrößerung — увеличенный снимок.'
      uk: 'Правильне дієслово, невідокремлюване, утворене від groß за моделлю ver- … -ern, яка дає також verkleinern, verbessern і verschlechtern. Дієслово перехідне; коли річ росте сама, кажуть wachsen. Die Vergrößerung — збільшений знімок.'

  - de: sinken
    ipa: "ˈzɪŋkn̩"
    pos: verb
    praesens_3sg: sinkt
    partizip2: gesunken
    aux: sein
    # Recognition only: A2 `fallen` ships "to fall" as a production card in
    # verben-handlungen-a2-1, and a figure going down is exactly that prompt.
    cards: recognition
    en: to fall, to go down (of a figure)
    en_compact: to fall, to go down
    ru: падать, снижаться (о показателе)
    uk: падати, знижуватися (про показник)
    example_de: Die Zahl der Anmeldungen ist stark gesunken.
    example_en: The number of registrations has fallen sharply.
    example_ru: Число заявок сильно снизилось.
    example_uk: Кількість заявок сильно знизилася.
    note:
      en: 'Strong verb with sein: sinkt, sank, ist gesunken. Its home is figures — prices, temperatures, numbers — and it is the opposite of steigen. A ship also sinks with this verb. Fallen is the everyday word for an object dropping to the floor.'
      ru: 'Сильный глагол с sein: sinkt, sank, ist gesunken. Его область — цифры: цены, температура, количество; противоположность — steigen. Корабль тоже «тонет» этим глаголом. Fallen — бытовое слово о предмете, падающем на пол.'
      uk: 'Сильне дієслово із sein: sinkt, sank, ist gesunken. Його сфера — цифри: ціни, температура, кількість; протилежність — steigen. Корабель теж «тоне» цим дієсловом. Fallen — побутове слово про предмет, що падає на підлогу.'

  - de: gering
    ipa: "gəˈʁɪŋ"
    pos: adj
    # Recognition only: A1 `klein` ships "small" as a production card, and the
    # difference this word adds is one of register, which a typed prompt cannot ask
    # for.
    cards: recognition
    en: slight, low (in amount)
    en_compact: slight, low in amount
    ru: незначительный, малый (по величине)
    uk: незначний, малий (за величиною)
    example_de: Die Chancen auf einen Platz sind leider gering.
    example_en: The chances of getting a place are unfortunately slight.
    example_ru: Шансы получить место, к сожалению, невелики.
    example_uk: Шанси отримати місце, на жаль, невеликі.
    note:
      en: 'It measures an amount, a chance or a difference, never the size of an object — a small cup is klein, a slight difference is this word. It belongs to written German: ein geringer Unterschied, geringe Kosten. The comparative geringer is common in reports.'
      ru: 'Измеряет количество, шанс или разницу, но не размер предмета: маленькая чашка — klein, а незначительная разница — это слово. Принадлежит письменному языку: ein geringer Unterschied, geringe Kosten. Сравнительная форма geringer часто встречается в отчётах.'
      uk: 'Вимірює кількість, шанс або різницю, але не розмір предмета: маленька чашка — klein, а незначна різниця — це слово. Належить писемній мові: ein geringer Unterschied, geringe Kosten. Порівняльна форма geringer часто трапляється у звітах.'

  - de: knapp
    ipa: "ˈknap"
    pos: adj
    en: just under; in short supply
    ru: неполный, чуть меньше; в обрез
    uk: неповний, трохи менше; обмаль
    example_de: Wir haben nur noch knapp zwanzig Minuten Zeit.
    example_en: We have just under twenty minutes left.
    example_ru: У нас осталось неполных двадцать минут.
    example_uk: У нас лишилося неповних двадцять хвилин.
    note:
      en: 'Before a number it means a little less than that number, which is the opposite of gut in the same slot: knapp zwei Stunden is under two hours, gut zwei Stunden is over. Alone it means in short supply — Das Geld ist knapp — and knapp verlieren is to lose narrowly.'
      ru: 'Перед числительным значит «чуть меньше», что противоположно gut в той же позиции: knapp zwei Stunden — меньше двух часов, gut zwei Stunden — больше. Само по себе значит «в обрез»: Das Geld ist knapp, а knapp verlieren — «проиграть с минимальным отрывом».'
      uk: 'Перед числівником означає «трохи менше», що протилежне gut у тій самій позиції: knapp zwei Stunden — менше за дві години, gut zwei Stunden — більше. Само по собі означає «обмаль»: Das Geld ist knapp, а knapp verlieren — «програти з мінімальним відривом».'

  - de: schätzen
    ipa: "ˈʃɛtsn̩"
    pos: verb
    praesens_3sg: schätzt
    partizip2: geschätzt
    aux: haben
    valence: "+ Akk"
    en: to estimate, to reckon
    ru: оценивать приблизительно, прикидывать
    uk: оцінювати приблизно, прикидати
    example_de: Ich schätze, wir brauchen zwei Stunden.
    example_en: I reckon we will need two hours.
    example_ru: Полагаю, нам понадобится два часа.
    example_uk: Гадаю, нам знадобиться дві години.
    note:
      en: 'Regular: schätzt, schätzte, hat geschätzt. The everyday use is the opener in the example, a compact way of giving a figure you are not sure of. On paper it estimates a value: die Kosten schätzen, geschätzte 200 Euro. A second sense, to value a person, survives in the letter formula Sehr geschätzte …'
      ru: 'Правильный глагол: schätzt, schätzte, hat geschätzt. Бытовое употребление — зачин из примера: компактный способ назвать цифру, в которой не уверен. На бумаге оценивают величину: die Kosten schätzen, geschätzte 200 Euro. Второе значение, «ценить человека», живёт в письменной формуле Sehr geschätzte …'
      uk: 'Правильне дієслово: schätzt, schätzte, hat geschätzt. Побутове вживання — зачин із прикладу: компактний спосіб назвати цифру, у якій не впевнений. На папері оцінюють величину: die Kosten schätzen, geschätzte 200 Euro. Друге значення, «цінувати людину», живе в писемній формулі Sehr geschätzte …'

