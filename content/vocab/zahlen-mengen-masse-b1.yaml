      en: 'The explicit form of hundert. In running text German writes it as one word; ein is often omitted in speech and in round figures. From 101 onward the whole number remains one word: einhunderteins.'
      ru: 'Полная форма hundert с ein. В связном тексте пишется одним словом; в речи и круглых числах ein часто опускают. Начиная со 101 всё число остаётся одним словом: einhunderteins.'
      uk: 'Повна форма hundert з ein. У зв’язному тексті пишеться одним словом; у мовленні й круглих числах ein часто опускають. Від 101 усе число лишається одним словом: einhunderteins.'

  - de: eintausend
    ipa: "ˈaɪ̯nˌtaʊ̯zn̩t"
    pos: num
    cards: both
    en: one thousand, written out as one unit
    ru: тысяча, записанная одним словом
    uk: тисяча, записана одним словом
    example_de: Für das Projekt fehlen noch eintausend Euro.
    example_en: The project is still short of one thousand euros.
    example_ru: Для проекта не хватает ещё тысячи евро.
