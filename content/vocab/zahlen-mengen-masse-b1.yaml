  - de: reichen
    ipa: "ˈʁaɪ̯çn̩"
    pos: verb
    praesens_3sg: reicht
    partizip2: gereicht
    aux: haben
    accept:
      - ausreichen
      - genügen
    en: to be enough
    ru: хватать, быть достаточным
    uk: вистачати, бути достатнім
    example_de: Das Geld reicht bis zum Monatsende.
    example_en: The money is enough to last until the end of the month.
    example_ru: Денег хватит до конца месяца.
    example_uk: Грошей вистачить до кінця місяця.
    note:
      en: 'Regular: reicht, reichte, hat gereicht. The one-word sentence Das reicht! is a complete refusal, and Reicht das? asks whether something will do. Its two written twins, ausreichen and genügen, mean the same and are accepted by this card. A second, unrelated sense is to pass something: Reich mir bitte das Salz.'
      ru: 'Правильный глагол: reicht, reichte, hat gereicht. Однословное Das reicht! — законченный отказ, а Reicht das? — вопрос, достаточно ли этого. Два письменных двойника, ausreichen и genügen, значат то же и принимаются этой карточкой. Есть и несвязанное значение «подать»: Reich mir bitte das Salz.'
      uk: 'Правильне дієслово: reicht, reichte, hat gereicht. Однослівне Das reicht! — завершена відмова, а Reicht das? — питання, чи цього досить. Два писемні двійники, ausreichen і genügen, означають те саме й приймаються цією карткою. Є й непов’язане значення «подати»: Reich mir bitte das Salz.'

  - de: ausreichen
    ipa: "ˈaʊ̯sˌʁaɪ̯çn̩"
    pos: verb
    praesens_3sg: reicht aus
    partizip2: ausgereicht
    aux: haben
    # Recognition only: the same prompt as this deck's `reichen`, which lists it in
