# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the computer-and-
# internet field of data/goethe-b1-wortliste.txt: the box on the desk and the parts
# built into it, the places the net is organized into, the anglicism verbs German
# conjugates as if they had always been German, and the words a support page, a
# phone bill and a warning message use.
# A1's `schule-arbeit` owns the machine as a thing in a room (Computer), A1's
# `kommunikation-medien` owns the household net and the telephone (Internet,
# E-Mail, Handy, Telefon, Nachricht), A2's `digital-medien-a2` owns the devices and
# what a learner does on them (PC, Laptop, Tablet, Datei, Drucker, drucken,
# speichern, herunterladen, Passwort, Webseite, Homepage, Link, Mailbox, surfen,
# chatten, Blog, SMS, online), B1's `digitales-leben` owns the interface and its
# verbs (Netz, Taste, Feld, Menü, Symbol, klicken, anklicken, hochladen,
# installieren, nutzen, Software, Technik, digital), and B1's `medien-digital-b1`
# owns broadcast and recorded media. This deck is the layer between them: the German
# of a spec sheet, a browser, a forum and a virus warning, which those five never
# name.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read off a screen, a label and a manual; the learner who has to *say* any of it
# reaches for the A1 or A2 word beside it, and that word already ships as a typed
# card.
id: computer-internet-b1
title_de: "Computer und Internet"
title_en: "The computer and the net"
title_ru: "Компьютер и интернет"
title_uk: "Комп'ютер та інтернет"
level: B1
entries:
  # --- Der Rechner und seine Teile ---
  - de: Rechner
    ipa: "ˈʁɛçnɐ"
    pos: noun
    gender: m
    plural: "die Rechner"
    cards: recognition
    en: the machine a person works at, named with the German word instead of the borrowed one; also a small device or program that does sums
    ru: машина, за которой работают, названная немецким словом, а не заимствованным; а также небольшое устройство или программа для подсчётов
    uk: машина, за якою працюють, названа німецьким словом, а не запозиченим; а також невеликий пристрій або програма для підрахунків
    example_de: Der Rechner braucht heute besonders lange zum Starten.
    example_en: The computer is taking especially long to start up today.
    example_ru: Компьютер сегодня особенно долго запускается.
    example_uk: Комп'ютер сьогодні особливо довго запускається.
    note:
      en: 'Masculine, and singular and plural are spelled alike. A1 der Computer is the everyday word and the one to say out loud; this one is built from rechnen and belongs to written and technical German — a price label, an IT department, a manual, an office rule. Compounds carry it further than the bare word goes: der Taschenrechner is a pocket calculator, der Großrechner a mainframe, das Rechenzentrum a data centre. The ch after e is the soft one, as in ich.'
      ru: 'Мужской род, единственное и множественное пишутся одинаково. der Computer уровня A1 — обиходное слово, его и произносят вслух; это же собрано из rechnen и принадлежит письменному и техническому языку: ценнику, ИТ-отделу, инструкции, служебному распоряжению. Сложные слова уводят его дальше, чем голое слово: der Taschenrechner — калькулятор, der Großrechner — большая вычислительная машина, das Rechenzentrum — центр обработки данных. ch после e здесь мягкое, как в ich.'
      uk: 'Чоловічий рід, однина і множина пишуться однаково. der Computer рівня A1 — побутове слово, саме його вимовляють уголос; це ж складене з rechnen і належить письмовій та технічній мові: цінникові, ІТ-відділу, інструкції, службовому розпорядженню. Складні слова ведуть його далі, ніж голе слово: der Taschenrechner — калькулятор, der Großrechner — велика обчислювальна машина, das Rechenzentrum — центр обробки даних. ch після e тут м''яке, як в ich.'

  - de: Monitor
    ipa: "ˈmoːnitoːɐ̯"
    pos: noun
    gender: m
    plural: "die Monitore"
    cards: recognition
    en: the screen a computer's picture appears on, counted as a separate piece of equipment standing on the desk
    ru: экран, на котором появляется изображение компьютера, взятый как отдельный предмет оборудования на столе
    uk: екран, на якому з'являється зображення комп'ютера, узятий як окремий предмет обладнання на столі
    example_de: Der zweite Monitor macht die Arbeit deutlich leichter.
    example_en: The second monitor makes the work considerably easier.
    example_ru: Второй монитор заметно облегчает работу.
    example_uk: Другий монітор помітно полегшує роботу.
    note:
      en: 'Masculine, plural die Monitore, and older texts also write die Monitoren. B1 der Bildschirm, in the deck `meinung-medien`, is the picture surface of any device at all — a phone, a television, a cash machine — while a Monitor is the separate box you plug in and can buy on its own, which is why a shop lists Monitore and a news item says Bildschirm. A second sense belongs to a hospital: der Herzmonitor watches a patient. Stress on the first syllable, and the final -or is the vocalised r.'
      ru: 'Мужской род, множественное die Monitore; в текстах постарше встречается и die Monitoren. der Bildschirm уровня B1 из колоды `meinung-medien` — экранная поверхность любого устройства: телефона, телевизора, банкомата; а Monitor — отдельный корпус, который подключают и который можно купить сам по себе, потому магазин перечисляет Monitore, а новостная заметка говорит Bildschirm. Второе значение принадлежит больнице: der Herzmonitor следит за больным. Ударение на первом слоге, конечное -or звучит с вокализованным r.'
      uk: 'Чоловічий рід, множина die Monitore; у давніших текстах трапляється й die Monitoren. der Bildschirm рівня B1 з колоди `meinung-medien` — екранна поверхня будь-якого пристрою: телефона, телевізора, банкомата; а Monitor — окремий корпус, який під''єднують і який можна купити сам по собі, тому крамниця перелічує Monitore, а новинна замітка каже Bildschirm. Друге значення належить лікарні: der Herzmonitor стежить за хворим. Наголос на першому складі, кінцеве -or звучить із вокалізованим r.'

  - de: Tastatur
    ipa: "tastaˈtuːɐ̯"
    pos: noun
    gender: f
    plural: "die Tastaturen"
    cards: recognition
    en: the board of keys a person types on, taken as one piece of equipment
    ru: панель с клавишами, на которой печатают, взятая как один предмет оборудования
    uk: панель із клавішами, на якій друкують, узята як один предмет обладнання
    example_de: Auf der neuen Tastatur tippe ich viel schneller.
    example_en: I type much faster on the new keyboard.
    example_ru: На новой клавиатуре я печатаю гораздо быстрее.
    example_uk: На новій клавіатурі я друкую значно швидше.
    note:
      en: 'Built on B1 die Taste, in the deck `digitales-leben`, which is one single key; this is all of them together. Nouns in -ur are feminine without exception, and the plural adds -en. What makes it worth a card is that the German layout is not the international one: ä, ö, ü and ß have their own keys, and y and z have swapped places, so eine deutsche Tastatur is a real setting a learner has to find. The verb is B1 tippen, and the mark over a letter is das Sonderzeichen. Stress on the last syllable.'
      ru: 'Построено на die Taste уровня B1 из колоды `digitales-leben` — на одной-единственной клавише; здесь они все вместе. Существительные на -ur женского рода без исключений, множественное на -en. Карточки слово стоит вот почему: немецкая раскладка — не международная. У ä, ö, ü и ß свои клавиши, а y и z поменялись местами, так что eine deutsche Tastatur — реальная настройка, которую учащемуся придётся искать. Глагол — tippen уровня B1, а знак над буквой — das Sonderzeichen. Ударение на последнем слоге.'
      uk: 'Побудоване на die Taste рівня B1 з колоди `digitales-leben` — на одній-єдиній клавіші; тут вони всі разом. Іменники на -ur жіночого роду без винятків, множина на -en. Картки слово варте ось чому: німецька розкладка — не міжнародна. У ä, ö, ü і ß свої клавіші, а y і z помінялися місцями, тож eine deutsche Tastatur — справжнє налаштування, яке учневі доведеться шукати. Дієслово — tippen рівня B1, а знак над літерою — das Sonderzeichen. Наголос на останньому складі.'

  - de: Festplatte
    ipa: "ˈfɛstˌplatə"
    pos: noun
    gender: f
    plural: "die Festplatten"
    cards: recognition
    en: the disc built into a computer on which everything stays when the machine is switched off
    ru: диск, встроенный в компьютер, на котором всё остаётся, когда машину выключают
    uk: диск, вбудований у комп'ютер, на якому все лишається, коли машину вимикають
    example_de: Auf der Festplatte ist kaum noch Platz frei.
    example_en: There is hardly any space left on the hard disk.
    example_ru: На жёстком диске почти не осталось места.
    example_uk: На жорсткому диску майже не лишилося місця.
    note:
      en: 'fest, meaning fixed, plus die Platte: the disc that does not come out, as against the ones that did. It is where A2 die Datei lives and where A2 speichern, both in the deck `digital-medien-a2`, puts things. Feminine from Platte, plural in -n, primary stress on Fest-. An advert sells the size and nothing else: 512 GB Festplatte. Two words stand beside it — die externe Festplatte, the one on a cable, and die SSD, the faster kind with no moving parts, which shops still list under this word.'
      ru: 'fest — «неподвижный, закреплённый» — плюс die Platte: диск, который не вынимается, в отличие от тех, что вынимались. Именно на нём живёт die Datei уровня A2, и именно туда кладёт вещи speichern уровня A2, оба из колоды `digital-medien-a2`. Женский род от Platte, множественное на -n, главное ударение на Fest-. Объявление называет только объём: 512 GB Festplatte. Рядом стоят два слова: die externe Festplatte — тот, что на проводе, и die SSD — быстрый тип без движущихся частей, который магазины по-прежнему числят под этим же словом.'
      uk: 'fest — «нерухомий, закріплений» — плюс die Platte: диск, який не виймається, на відміну від тих, що виймалися. Саме на ньому живе die Datei рівня A2, і саме туди кладе речі speichern рівня A2, обидва з колоди `digital-medien-a2`. Жіночий рід від Platte, множина на -n, головний наголос на Fest-. Оголошення називає лише обсяг: 512 GB Festplatte. Поряд стоять два слова: die externe Festplatte — той, що на дроті, і die SSD — швидкий тип без рухомих частин, який крамниці й досі числять під цим самим словом.'

  - de: Laufwerk
    ipa: "ˈlaʊ̯fˌvɛʁk"
    pos: noun
    gender: n
    plural: "die Laufwerke"
    cards: recognition
    en: the part of a computer that a disc is put into and read from, and the letter the system gives that part
    ru: часть компьютера, в которую вставляют диск и с которой его читают, и та буква, которую система этой части присваивает
    uk: частина комп'ютера, у яку вставляють диск і з якої його читають, і та літера, яку система цій частині присвоює
    example_de: Legen Sie die CD bitte in das Laufwerk ein.
    example_en: Please put the CD into the drive.
    example_ru: Вставьте, пожалуйста, компакт-диск в дисковод.
    example_uk: Вставте, будь ласка, компакт-диск у дисковод.
    note:
      en: 'laufen plus das Werk, so neuter and plural in -e. Two things share the name and the second one outlived the first: das CD-Laufwerk is the slot a disc goes into, and Laufwerk C is what a Windows file dialog calls the storage behind a letter, whether or not anything spins in it. Hence das Netzlaufwerk, a folder on a company server that looks like a drive. Primary stress on Lauf-. Nothing to do with B1 das Werk in the deck `wirtschaft-handel-b1`, which is a factory.'
      ru: 'laufen плюс das Werk, отсюда средний род и множественное на -e. Имя делят две вещи, и вторая пережила первую: das CD-Laufwerk — щель, куда вставляют диск, а Laufwerk C — то, как окно с файлами в Windows называет хранилище за буквой, независимо от того, крутится ли там что-нибудь. Отсюда и das Netzlaufwerk — папка на служебном сервере, выглядящая как диск. Главное ударение на Lauf-. С das Werk уровня B1 из колоды `wirtschaft-handel-b1`, где это завод, связи нет.'
      uk: 'laufen плюс das Werk, звідси середній рід і множина на -e. Ім''я ділять дві речі, і друга пережила першу: das CD-Laufwerk — щілина, куди вставляють диск, а Laufwerk C — те, як вікно з файлами у Windows називає сховище за літерою, незалежно від того, чи крутиться там щось. Звідси й das Netzlaufwerk — тека на службовому сервері, що має вигляд диска. Головний наголос на Lauf-. Із das Werk рівня B1 з колоди `wirtschaft-handel-b1`, де це завод, зв''язку немає.'

  - de: Chip
    ipa: "ˈtʃɪp"
    pos: noun
    gender: m
    plural: "die Chips"
    cards: recognition
    en: a very small piece of built-in electronics carrying a whole circuit; in the plural also thin fried slices of potato
    ru: очень маленькая встроенная электронная деталь, несущая на себе целую схему; во множественном — ещё и тонкие обжаренные ломтики картофеля
    uk: дуже маленька вбудована електронна деталь, що несе на собі цілу схему; у множині — ще й тонкі смажені скибочки картоплі
    example_de: In der Karte steckt ein kleiner Chip.
    example_en: There is a small chip inside the card.
    example_ru: В карту вставлен маленький чип.
    example_uk: У картку вставлено маленький чип.
    note:
      en: 'Number and context separate the senses: der Chip in the singular is the electronics, die Chips on a supermarket shelf are the snack, and die Kartoffelchips settles it when the sentence would not. A third sense is the counter at a gambling table. B1 die Chipkarte, in the deck `einkaufen-geld-b1`, is the card built around one. The ch here is the tʃ of the language it came from — the same sound as in Chat below, and neither the ʃ of Chance nor the k of Chor.'
      ru: 'Значения разводят число и контекст: der Chip в единственном — электроника, die Chips на полке супермаркета — закуска, а die Kartoffelchips решают дело там, где предложение его не решает. Третье значение — фишка за игорным столом. die Chipkarte уровня B1 из колоды `einkaufen-geld-b1` — карта, построенная вокруг такой детали. ch здесь читается как tʃ, по языку-источнику: тот же звук, что в Chat ниже, и не ʃ, как в Chance, и не k, как в Chor.'
      uk: 'Значення розводять число і контекст: der Chip в однині — електроніка, die Chips на полиці супермаркету — закуска, а die Kartoffelchips вирішують справу там, де речення її не вирішує. Третє значення — фішка за гральним столом. die Chipkarte рівня B1 з колоди `einkaufen-geld-b1` — картка, побудована навколо такої деталі. ch тут читається як tʃ, за мовою-джерелом: той самий звук, що в Chat нижче, і не ʃ, як у Chance, і не k, як у Chor.'

  - de: herunterfahren
    ipa: "hɛˈʁʊntɐˌfaːʁən"
    pos: verb
    praesens_3sg: fährt herunter
    partizip2: heruntergefahren
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to shut a computer down properly, letting it close everything first, rather than cutting the power
    ru: правильно выключать компьютер, дав ему сначала всё закрыть, а не обрывая питание
    uk: правильно вимикати комп'ютер, давши йому спершу все закрити, а не обриваючи живлення
    example_de: Bitte fahren Sie den Rechner vor dem Ausschalten herunter.
    example_en: Please shut the computer down before switching it off.
    example_ru: Пожалуйста, завершите работу компьютера, прежде чем его выключать.
    example_uk: Будь ласка, завершіть роботу комп'ютера, перш ніж його вимикати.
    note:
      en: 'Separable, so the prefix goes to the end of the clause — Ich fahre den Rechner herunter — and -ge- sits inside the participle, heruntergefahren. The auxiliary depends on the sense, and that is worth holding: with an object, as here, it takes haben (Er hat den Laptop heruntergefahren), while the plain motion sense of driving down a slope has no object and takes sein (Wir sind ins Tal heruntergefahren). Speech shortens herunter- to runter- everywhere: runterfahren. The opposite of the computer sense is hochfahren.'
      ru: 'Приставка отделяемая, поэтому она уходит в конец предложения — Ich fahre den Rechner herunter, — а -ge- встаёт внутрь причастия: heruntergefahren. Вспомогательный глагол зависит от значения, и это стоит удержать: с дополнением, как здесь, берётся haben (Er hat den Laptop heruntergefahren), а простое значение движения вниз по склону дополнения не имеет и берёт sein (Wir sind ins Tal heruntergefahren). В речи herunter- везде сокращают до runter-: runterfahren. Противоположность компьютерного значения — hochfahren.'
      uk: 'Префікс відокремлюваний, тому він іде в кінець речення — Ich fahre den Rechner herunter, — а -ge- стає всередину дієприкметника: heruntergefahren. Допоміжне дієслово залежить від значення, і це варто втримати: з додатком, як тут, береться haben (Er hat den Laptop heruntergefahren), а просте значення руху вниз схилом додатка не має і бере sein (Wir sind ins Tal heruntergefahren). У мовленні herunter- усюди скорочують до runter-: runterfahren. Протилежність комп''ютерного значення — hochfahren.'

  # --- Das Netz und seine Orte ---
  - de: Netzwerk
    ipa: "ˈnɛtsˌvɛʁk"
    pos: noun
    gender: n
    plural: "die Netzwerke"
    cards: recognition
    en: a set of computers joined so that each can reach the others; also a set of people who stay in touch and pass work and help along
    ru: набор компьютеров, соединённых так, чтобы каждый мог достучаться до остальных; а также круг людей, которые держат связь и передают друг другу работу и помощь
    uk: набір комп'ютерів, з'єднаних так, щоб кожен міг дістатися до решти; а також коло людей, які тримають зв'язок і передають одне одному роботу та допомогу
    example_de: Im Netzwerk der Firma sind alle Drucker sichtbar.
    example_en: All the printers are visible on the company network.
    example_ru: В сети фирмы видны все принтеры.
    example_uk: У мережі фірми видно всі принтери.
    note:
      en: 'B1 das Netz, in the deck `digitales-leben`, is the net itself and, standing alone, the internet; a Netzwerk is a net somebody built and runs, which is why a company has one and the world does not. Neuter from Werk, plural in -e. The human sense is the one a career text means — ein berufliches Netzwerk aufbauen — and it has given German the verb netzwerken, still felt as new. Das soziale Netzwerk is a site like the ones a media text discusses; das WLAN is the wireless kind in a flat.'
      ru: 'das Netz уровня B1 из колоды `digitales-leben` — сама сеть и, само по себе, интернет; Netzwerk — сеть, которую кто-то построил и держит, потому она есть у фирмы и её нет у мира. Средний род от Werk, множественное на -e. Человеческое значение — то, что имеет в виду текст о карьере: ein berufliches Netzwerk aufbauen; отсюда и глагол netzwerken, который всё ещё ощущается новым. Das soziale Netzwerk — площадка вроде тех, что обсуждает текст о медиа; das WLAN — беспроводная сеть в квартире.'
      uk: 'das Netz рівня B1 з колоди `digitales-leben` — сама мережа і, саме по собі, інтернет; Netzwerk — мережа, яку хтось збудував і тримає, тому вона є у фірми і її немає у світу. Середній рід від Werk, множина на -e. Людське значення — те, що має на увазі текст про кар''єру: ein berufliches Netzwerk aufbauen; звідси й дієслово netzwerken, яке досі відчувається новим. Das soziale Netzwerk — майданчик на кшталт тих, що їх обговорює текст про медіа; das WLAN — бездротова мережа у квартирі.'

  - de: Plattform
    ipa: "ˈplatˌfɔʁm"
    pos: noun
    gender: f
    plural: "die Plattformen"
    cards: recognition
    en: a service on the internet that other people put their own texts, videos, goods or offers on
    ru: сетевая служба, на которую другие люди выкладывают свои тексты, видео, товары или предложения
    uk: мережева служба, на яку інші люди викладають свої тексти, відео, товари чи пропозиції
    example_de: Die Wohnung wird über eine Plattform vermietet.
    example_en: The flat is let through a platform.
    example_ru: Квартиру сдают через платформу.
    example_uk: Квартиру здають через платформу.
    note:
      en: 'The spelling is the trap: two t and then f, with no e anywhere between them. The word came from French plate-forme and German reshaped it to look like platt plus Form, which is exactly the mnemonic that keeps it right. Feminine from Form, plural in -en. The internet sense is the live one and almost always comes with its business attached: die Lernplattform, die Handelsplattform, die Videoplattform, die Onlineplattform. The older, physical sense is a raised flat surface out of doors, as in die Bohrplattform, an oil rig. Primary stress on Platt-.'
      ru: 'Ловушка здесь в написании: два t, затем f и никакого e между ними. Слово пришло из французского plate-forme, а немецкий переиначил его так, чтобы оно выглядело как platt плюс Form, — на этом и держится мнемоника. Женский род от Form, множественное на -en. Живое значение — сетевое, и почти всегда рядом стоит дело: die Lernplattform, die Handelsplattform, die Videoplattform, die Onlineplattform. Более старое, вещественное значение — приподнятая ровная площадка под открытым небом, как в die Bohrplattform, буровая. Главное ударение на Platt-.'
      uk: 'Пастка тут у написанні: два t, потім f і жодного e між ними. Слово прийшло з французького plate-forme, а німецька переінакшила його так, щоб воно мало вигляд platt плюс Form, — на цьому й тримається мнемоніка. Жіночий рід від Form, множина на -en. Живе значення — мережеве, і майже завжди поряд стоїть справа: die Lernplattform, die Handelsplattform, die Videoplattform, die Onlineplattform. Давніше, речовинне значення — піднятий рівний майданчик просто неба, як у die Bohrplattform, бурова. Головний наголос на Platt-.'

  - de: Forum
    ipa: "ˈfoːʁʊm"
    pos: noun
    gender: n
    plural: "die Foren"
    cards: recognition
    en: a place on the internet where people post questions and answers that stay readable long afterwards; also a public meeting called to discuss one subject
    ru: место в сети, где люди выкладывают вопросы и ответы, остающиеся читаемыми и много позже; а также публичная встреча, созванная для обсуждения одного предмета
    uk: місце в мережі, де люди викладають запитання й відповіді, що лишаються читними й багато пізніше; а також публічна зустріч, скликана для обговорення одного предмета
    example_de: Die Lösung stand schon in einem Forum im Netz.
    example_en: The solution was already posted on a forum online.
    example_ru: Решение уже было выложено на форуме в сети.
    example_uk: Розв'язок уже був викладений на форумі в мережі.
    note:
      en: 'A Latin noun in -um, and the whole family drops that ending in the plural: das Forum → die Foren, exactly as das Museum → die Museen and das Datum → die Daten. Neuter. On a forum one writes einen Beitrag, the B1 word from the deck `meinung-medien`, and what separates it from a Chat below is that it is written to be found later, not read at once. The public-meeting sense is alive in event names: das Wirtschaftsforum, das Bürgerforum. Stress on the first syllable.'
      ru: 'Латинское существительное на -um, и всё семейство теряет это окончание во множественном: das Forum → die Foren, ровно как das Museum → die Museen и das Datum → die Daten. Средний род. На форуме пишут einen Beitrag — слово уровня B1 из колоды `meinung-medien`, — а от Chat ниже его отделяет то, что написанное здесь рассчитано на то, чтобы его нашли потом, а не прочли сразу. Значение публичной встречи живо в названиях мероприятий: das Wirtschaftsforum, das Bürgerforum. Ударение на первом слоге.'
      uk: 'Латинський іменник на -um, і вся родина втрачає це закінчення в множині: das Forum → die Foren, точно як das Museum → die Museen і das Datum → die Daten. Середній рід. На форумі пишуть einen Beitrag — слово рівня B1 з колоди `meinung-medien`, — а від Chat нижче його відділяє те, що написане тут розраховане на те, щоб його знайшли потім, а не прочитали одразу. Значення публічної зустрічі живе в назвах заходів: das Wirtschaftsforum, das Bürgerforum. Наголос на першому складі.'

  - de: Chat
    ipa: "ˈtʃɛt"
    pos: noun
    gender: m
    plural: "die Chats"
    cards: recognition
    en: a written conversation typed back and forth in short turns, and the window it runs in
    ru: письменный разговор, который печатают короткими репликами туда-сюда, и окно, в котором он идёт
    uk: письмова розмова, яку друкують короткими репліками туди-сюди, і вікно, у якому вона триває
    example_de: Die Adresse habe ich dir im Chat geschickt.
    example_en: I sent you the address in the chat.
    example_ru: Адрес я отправил тебе в чате.
    example_uk: Адресу я надіслав тобі в чаті.
    note:
      en: 'Masculine, plural in -s. A2 chatten, in the deck `digital-medien-a2`, is the verb the learner already produces; this is the thing it produces. The ch is the tʃ of the language it came from, as in Chip above. Everyday compounds: der Gruppenchat, der Chatverlauf for the history, das Chatfenster on a support page. What separates it from a Forum above is speed and audience — a chat is between named people and is read as it is written.'
      ru: 'Мужской род, множественное на -s. chatten уровня A2 из колоды `digital-medien-a2` — глагол, который учащийся уже производит; здесь — то, что этим глаголом получается. ch читается как tʃ, по языку-источнику, как и в Chip выше. Обиходные сложные слова: der Gruppenchat, der Chatverlauf — история переписки, das Chatfenster на странице поддержки. От Forum выше слово отделяют скорость и адресат: чат идёт между названными людьми и читается по мере написания.'
      uk: 'Чоловічий рід, множина на -s. chatten рівня A2 з колоди `digital-medien-a2` — дієслово, яке учень уже виробляє; тут — те, що цим дієсловом виходить. ch читається як tʃ, за мовою-джерелом, як і в Chip вище. Побутові складні слова: der Gruppenchat, der Chatverlauf — історія листування, das Chatfenster на сторінці підтримки. Від Forum вище слово відділяють швидкість і адресат: чат іде між названими людьми і читається в міру написання.'

  - de: Chatroom
    ipa: "ˈtʃɛtˌʁuːm"
    pos: noun
    gender: m
    plural: "die Chatrooms"
    cards: recognition
    en: an open room on the internet where several people at once talk in writing, and anyone may join
    ru: открытая сетевая комната, в которой сразу несколько человек разговаривают письменно и куда может зайти любой
    uk: відкрита мережева кімната, у якій одразу кілька людей розмовляють письмово і куди може зайти будь-хто
    example_de: In diesem Chatroom waren immer viele Leute online.
    example_en: There were always a lot of people online in that chat room.
    example_ru: В этом чате всегда было много людей онлайн.
    example_uk: У цій кімнаті завжди було багато людей онлайн.
    note:
      en: 'Masculine, plural in -s, written as one word without a hyphen. The word is dated on purpose: it belongs to the internet of the late nineties, and today the same thing is called der Gruppenchat, die Gruppe or der Kanal, so a learner meets it mainly in a text looking back at how the net used to work. Both halves keep their source pronunciation, tʃ at the front and a long u in -room. What made it different from a Chat above is that the people in it were strangers.'
      ru: 'Мужской род, множественное на -s, пишется одним словом без дефиса. Слово намеренно устаревшее: оно принадлежит интернету конца девяностых, а сегодня то же самое называют der Gruppenchat, die Gruppe или der Kanal, — так что учащийся встретит его прежде всего в тексте, оглядывающемся на то, как сеть работала раньше. Обе половины сохраняют исходное произношение: tʃ впереди и долгое u в -room. От Chat выше слово отличалось тем, что люди в нём были чужими друг другу.'
      uk: 'Чоловічий рід, множина на -s, пишеться одним словом без дефіса. Слово навмисне застаріле: воно належить інтернетові кінця дев''яностих, а сьогодні те саме звуть der Gruppenchat, die Gruppe або der Kanal, — тож учень зустріне його передусім у тексті, що озирається на те, як мережа працювала раніше. Обидві половини зберігають вихідну вимову: tʃ спереду і довге u в -room. Від Chat вище слово різнилося тим, що люди в ньому були чужі одне одному.'

  - de: Klick
    ipa: "ˈklɪk"
    pos: noun
    gender: m
    plural: "die Klicks"
    cards: recognition
    en: one press of a mouse button; in the plural also the number of times a page or a video has been opened
    ru: одно нажатие кнопки мыши; во множественном — ещё и число открытий страницы или ролика
    uk: одне натискання кнопки миші; у множині — ще й кількість відкриттів сторінки або ролика
    example_de: Mit einem Klick ist die Datei gespeichert.
    example_en: The file is saved with a single click.
    example_ru: Одним щелчком файл сохранён.
    example_uk: Одним клацанням файл збережено.
    note:
      en: 'The noun to the B1 verbs klicken and anklicken in the deck `digitales-leben`. Masculine, plural in -s, and the two senses are told apart by number: mit einem Klick, ein Klick genügt in the singular, and Klicks sammeln, die Klickzahl in the plural, which is the figure advertising is sold on. Which button is named by a compound — der Doppelklick, der Rechtsklick. The word is also the sound it describes, and there it is written small: es hat klick gemacht means the penny dropped.'
      ru: 'Существительное к глаголам klicken и anklicken уровня B1 из колоды `digitales-leben`. Мужской род, множественное на -s, а значения разводит число: mit einem Klick, ein Klick genügt в единственном и Klicks sammeln, die Klickzahl во множественном — цифра, под которую продают рекламу. Какая кнопка, называет сложное слово: der Doppelklick, der Rechtsklick. Слово заодно и сам звук, и в этой роли пишется со строчной: es hat klick gemacht значит «дошло, осенило».'
      uk: 'Іменник до дієслів klicken і anklicken рівня B1 з колоди `digitales-leben`. Чоловічий рід, множина на -s, а значення розводить число: mit einem Klick, ein Klick genügt в однині та Klicks sammeln, die Klickzahl у множині — цифра, під яку продають рекламу. Яка саме кнопка, називає складне слово: der Doppelklick, der Rechtsklick. Слово водночас і сам звук, і в цій ролі пишеться з малої: es hat klick gemacht означає «дійшло, осяяло».'

  - de: User
    ipa: "ˈjuːzɐ"
    pos: noun
    gender: m
    plural: "die User"
    cards: recognition
    en: a person who uses a computer service, counted as one of the many an operator has
    ru: человек, пользующийся сетевой службой, взятый как один из многих, кто есть у владельца службы
    uk: людина, що користується мережевою службою, узята як один з багатьох, які є у власника служби
    example_de: Die Seite hat inzwischen über eine Million User.
    example_en: The site now has more than a million users.
    example_ru: У сайта теперь больше миллиона пользователей.
    example_uk: Сайт має тепер понад мільйон користувачів.
    note:
      en: 'Masculine, and singular and plural are spelled alike; the feminine die Userin follows directly below. German gives the word its own sounds: the u is the j-glide of Jura and the s is voiced, so it comes out ˈjuːzɐ. Two native words stand beside it and are the better choice in writing — der Nutzer, from B1 nutzen in the deck `digitales-leben`, and der Benutzer, from A2 benutzen. A company report says Nutzerzahlen; a forum post says User.'
      ru: 'Мужской род, единственное и множественное пишутся одинаково; женская пара die Userin идёт прямо ниже. Немецкий даёт слову свои звуки: u — это j-скольжение, как в Jura, а s звонкое, так что выходит ˈjuːzɐ. Рядом стоят два своих слова, и в письменной речи лучше брать их: der Nutzer — от nutzen уровня B1 из колоды `digitales-leben` — и der Benutzer — от benutzen уровня A2. Отчёт фирмы скажет Nutzerzahlen, а сообщение на форуме — User.'
      uk: 'Чоловічий рід, однина і множина пишуться однаково; жіночу пару die Userin утворено моцією, і вона йде просто нижче. Німецька дає слову свої звуки: u — це j-ковзання, як у Jura, а s дзвінке, тож виходить ˈjuːzɐ. Поряд стоять два свої слова, і в письмі краще брати їх: der Nutzer — від nutzen рівня B1 з колоди `digitales-leben` — і der Benutzer — від benutzen рівня A2. Звіт фірми скаже Nutzerzahlen, а допис на форумі — User.'

  - de: Userin
    ipa: "ˈjuːzəʁɪn"
    pos: noun
    gender: f
    plural: "die Userinnen"
    cards: recognition
    en: a woman who uses a computer service
    ru: женщина, пользующаяся сетевой службой
    uk: жінка, що користується мережевою службою
    example_de: Eine Userin hat den Fehler als Erste gemeldet.
    example_en: A user was the first to report the fault.
    example_ru: Об ошибке первой сообщила пользовательница.
    example_uk: Про помилку першою повідомила користувачка.
    note:
      en: 'The feminine of the entry above: -in on the untouched stem, plural in -innen, and the stress stays where it was. Where one figure covers everybody the masculine plural still stands for all of them, eine Million User, which is why the two words are nowhere near equally frequent. Careful German writing prefers die Nutzerin here; this one belongs to a forum, a chat and a start-up''s own marketing.'
      ru: 'Женская пара к записи выше: -in на нетронутой основе, множественное на -innen, ударение остаётся на месте. Там, где одна цифра покрывает всех, за всех по-прежнему отвечает мужское множественное — eine Million User, — потому частотность у слов далеко не одинакова. Аккуратная письменная речь предпочтёт здесь die Nutzerin; это же слово принадлежит форуму, чату и собственной рекламе стартапа.'
      uk: 'Жіноча пара до запису вище, утворена моцією: -in на незайманій основі, множина на -innen, наголос лишається на місці. Там, де одна цифра покриває всіх, за всіх і далі відповідає чоловіча множина — eine Million User, — тому частотність у слів далеко не однакова. Ретельне письмо віддасть перевагу тут die Nutzerin; це ж слово належить форумові, чатові та власній рекламі стартапу.'

  # --- Anglizismen, die deutsche Verben geworden sind ---
  - de: googeln
    ipa: "ˈguːgl̩n"
    pos: verb
    praesens_3sg: googelt
    partizip2: gegoogelt
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to look something up on the internet by typing it into a search engine
    ru: искать что-либо в интернете, вводя это в поисковую систему
    uk: шукати щось в інтернеті, вводячи це в пошукову систему
    example_de: Ich habe das Wort schnell gegoogelt.
    example_en: I quickly looked the word up online.
    example_ru: Я быстро поискал это слово в интернете.
    example_uk: Я швидко пошукав це слово в інтернеті.
    note:
      en: 'A brand name that became an ordinary weak verb and now takes ordinary endings: ich google or ich googele, du googelst, er googelt, hat gegoogelt. The ge- is there because this is not a verb in -ieren; those alone drop it. It takes a direct object or a whole clause after it: Ich habe gegoogelt, wann der Zug fährt. The neutral German is im Internet suchen or nachschlagen, and the machine itself is die Suchmaschine.'
      ru: 'Фирменное имя, ставшее обычным слабым глаголом и берущее обычные окончания: ich google или ich googele, du googelst, er googelt, hat gegoogelt. ge- на месте, потому что это не глагол на -ieren: только они его теряют. Управляет прямым дополнением или целым придаточным: Ich habe gegoogelt, wann der Zug fährt. Нейтральный немецкий скажет im Internet suchen или nachschlagen, а сама машина — die Suchmaschine.'
      uk: 'Фірмове ім''я, що стало звичайним слабким дієсловом і бере звичайні закінчення: ich google або ich googele, du googelst, er googelt, hat gegoogelt. ge- на місці, бо це не дієслово на -ieren: лише вони його втрачають. Керує прямим додатком або цілим підрядним: Ich habe gegoogelt, wann der Zug fährt. Нейтральна німецька скаже im Internet suchen або nachschlagen, а сама машина — die Suchmaschine.'

  - de: bloggen
    ipa: "ˈblɔgn̩"
    pos: verb
    praesens_3sg: bloggt
    partizip2: gebloggt
    aux: haben
    cards: recognition
    en: to write pieces regularly for one's own page on the internet, under one's own name
    ru: регулярно писать материалы для собственной страницы в интернете, под своим именем
    uk: регулярно писати матеріали для власної сторінки в інтернеті, під своїм ім'ям
    example_de: Sie bloggt seit drei Jahren über das Leben auf dem Land.
    example_en: She has been blogging about country life for three years.
    example_ru: Она уже три года ведёт блог о жизни в деревне.
    example_uk: Вона вже три роки веде блог про життя на селі.
    note:
      en: 'A2 der Blog, in the deck `digital-medien-a2`, is the page; this is the doing of it. Weak and regular, with the double g kept before every ending: bloggt, hat gebloggt. The subject it is about takes über plus the accusative. The person is der Blogger or die Bloggerin, one piece is der Blogbeitrag, and the same shape has given German posten, liken and streamen, all of them weak and all of them with ge- in the participle.'
      ru: 'der Blog уровня A2 из колоды `digital-medien-a2` — сама страница; здесь — занятие ею. Глагол слабый и правильный, двойное g держится перед любым окончанием: bloggt, hat gebloggt. Тему вводит über с винительным. Человек — der Blogger или die Bloggerin, отдельный материал — der Blogbeitrag, а по той же схеме немецкий получил posten, liken и streamen: все слабые и все с ge- в причастии.'
      uk: 'der Blog рівня A2 з колоди `digital-medien-a2` — сама сторінка; тут — заняття нею. Дієслово слабке і правильне, подвійне g тримається перед будь-яким закінченням: bloggt, hat gebloggt. Тему вводить über зі знахідним. Людина — der Blogger або die Bloggerin, окремий матеріал — der Blogbeitrag, а за тією самою схемою німецька дістала posten, liken і streamen: усі слабкі й усі з ge- у дієприкметнику.'

  - de: twittern
    ipa: "ˈtvɪtɐn"
    pos: verb
    praesens_3sg: twittert
    partizip2: getwittert
    aux: haben
    cards: recognition
    en: to publish very short public messages on a microblogging service, where anyone following can read them at once
    ru: публиковать очень короткие открытые сообщения в службе микроблогов, где их сразу читает всякий подписавшийся
    uk: публікувати дуже короткі відкриті повідомлення у службі мікроблогів, де їх одразу читає кожен, хто підписався
    example_de: Der Minister hat gestern Abend selbst getwittert.
    example_en: The minister tweeted himself yesterday evening.
    example_ru: Министр вчера вечером сам написал в твиттере.
    example_uk: Міністр учора ввечері сам написав у твітері.
    note:
      en: 'German has no w-sound, so the tw- is spoken tv-, and the whole word rhymes with bittern rather than with anything English. Verbs in -ern lose the e in the ich form: ich twittere or ich twittre, er twittert, hat getwittert. The service was renamed X in 2023, but the verb stayed in the language, so a text written before then uses it without explaining it. One message is der Tweet.'
      ru: 'В немецком нет звука w, поэтому tw- произносится как tv-, и слово рифмуется скорее с bittern, чем с чем-либо английским. Глаголы на -ern теряют e в форме ich: ich twittere или ich twittre, er twittert, hat getwittert. Служба в 2023 году сменила имя на X, но глагол в языке остался, так что текст, написанный раньше, употребляет его без пояснений. Отдельное сообщение — der Tweet.'
      uk: 'У німецькій немає звука w, тому tw- вимовляється як tv-, і слово римується радше з bittern, ніж із чимось англійським. Дієслова на -ern втрачають e у формі ich: ich twittere або ich twittre, er twittert, hat getwittert. Служба 2023 року змінила ім''я на X, але дієслово в мові лишилося, тож текст, написаний раніше, вживає його без пояснень. Окреме повідомлення — der Tweet.'

  - de: mailen
    ipa: "ˈmɛɪ̯lən"
    pos: verb
    praesens_3sg: mailt
    partizip2: gemailt
    aux: haben
    valence: "+ Dat + Akk"
    cards: recognition
    en: to send somebody something by electronic post
    ru: отправить кому-либо что-либо электронной почтой
    uk: надіслати комусь щось електронною поштою
    example_de: Ich maile dir die Adresse gleich morgen früh.
    example_en: I will email you the address first thing tomorrow.
    example_ru: Я пришлю тебе адрес по почте завтра с утра.
    example_uk: Я надішлю тобі адресу поштою завтра зранку.
    note:
      en: 'A1 die E-Mail, in the deck `kommunikation-medien`, is the noun the learner already produces, and A1 schicken is the neutral way to say this — eine E-Mail schicken. This verb is the short, informal one, and it takes two objects: the person in the dative and the thing in the accusative, ich maile dir die Datei. Weak, hat gemailt. Beside it stand zumailen and, in offices, the still shorter Schick mir das mal.'
      ru: 'die E-Mail уровня A1 из колоды `kommunikation-medien` — существительное, которое учащийся уже производит, а нейтральный способ сказать это — schicken уровня A1: eine E-Mail schicken. Этот глагол короткий и неофициальный, и у него два дополнения: человек в дательном, вещь в винительном — ich maile dir die Datei. Слабый, hat gemailt. Рядом стоит zumailen, а в конторах ещё более короткое Schick mir das mal.'
      uk: 'die E-Mail рівня A1 з колоди `kommunikation-medien` — іменник, який учень уже виробляє, а нейтральний спосіб сказати це — schicken рівня A1: eine E-Mail schicken. Це дієслово коротке і неофіційне, і має два додатки: людину в давальному, річ у знахідному — ich maile dir die Datei. Слабке, hat gemailt. Поряд стоїть zumailen, а в конторах ще коротше Schick mir das mal.'

  - de: checken
    ipa: "ˈtʃɛkn̩"
    pos: verb
    praesens_3sg: checkt
    partizip2: gecheckt
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to look at something quickly to see whether it is right or in order
    ru: быстро посмотреть на что-либо, чтобы убедиться, что оно верно или в порядке
    uk: швидко подивитися на щось, щоб пересвідчитися, що воно правильне або в порядку
    example_de: Kannst du bitte noch mal die Zahlen checken?
    example_en: Could you please check the figures once more?
    example_ru: Ты можешь ещё раз проверить цифры?
    example_uk: Ти можеш ще раз перевірити цифри?
    note:
      en: 'Weak and regular, hat gecheckt, with the tʃ of Chat above. It is the fast spoken word; written German reaches for prüfen, kontrollieren or nachsehen, and a formal letter would not use it at all. A second, wholly colloquial sense is to grasp something — Das checke ich nicht, Ich hab''s gecheckt. Two separable relatives belong to travel and are the ones a sign uses: einchecken at an airport or a hotel, auschecken on leaving.'
      ru: 'Слабый и правильный, hat gecheckt, с тем же tʃ, что в Chat выше. Это быстрое разговорное слово; на письме немецкий возьмёт prüfen, kontrollieren или nachsehen, а в официальном письме его не будет вовсе. Второе, целиком разговорное значение — «понять, врубиться»: Das checke ich nicht, Ich hab''s gecheckt. Два отделяемых родственника принадлежат поездкам, и именно их пишет табличка: einchecken в аэропорту или гостинице, auschecken при отъезде.'
      uk: 'Слабке і правильне, hat gecheckt, з тим самим tʃ, що в Chat вище. Це швидке розмовне слово; на письмі німецька візьме prüfen, kontrollieren або nachsehen, а в офіційному листі його не буде зовсім. Друге, цілком розмовне значення — «збагнути, второпати»: Das checke ich nicht, Ich hab''s gecheckt. Два відокремлювані родичі належать подорожам, і саме їх пише табличка: einchecken в аеропорту чи готелі, auschecken при від''їзді.'

  # --- Nachricht, Gerät, Gefahr ---
  - de: Mail
    ipa: "ˈmɛɪ̯l"
    pos: noun
    gender: f
    plural: "die Mails"
    cards: recognition
    en: a message sent from one address to another over the internet, in the short form everyday German uses
    ru: сообщение, отправленное с одного адреса на другой через интернет, в той короткой форме, какой пользуется обиходный немецкий
    uk: повідомлення, надіслане з однієї адреси на іншу через інтернет, у тій короткій формі, якою послуговується побутова німецька
    example_de: Ich habe seit gestern über vierzig Mails bekommen.
    example_en: I have received over forty emails since yesterday.
    example_ru: Со вчерашнего дня мне пришло больше сорока писем.
    example_uk: Від учора мені надійшло понад сорок листів.
    note:
      en: 'The clipped form of A1 die E-Mail in the deck `kommunikation-medien`, and it keeps that word''s feminine gender and its -s plural. Germany says die Mail; Austria and Switzerland often say das Mail, and both are correct in their own place. The vowel is the English one, so the word sounds like the German name of the letter sequence in E-Mail and not like the verb malen. Compounds spell it out again: die Mailadresse, der Mailanhang.'
      ru: 'Усечённая форма die E-Mail уровня A1 из колоды `kommunikation-medien`, и она сохраняет её женский род и множественное на -s. В Германии говорят die Mail; в Австрии и Швейцарии часто das Mail, и каждое верно у себя. Гласный английский, так что слово звучит как вторая часть E-Mail, а не как глагол malen. Сложные слова разворачивают его снова: die Mailadresse, der Mailanhang.'
      uk: 'Усічена форма die E-Mail рівня A1 з колоди `kommunikation-medien`, і вона зберігає її жіночий рід та множину на -s. У Німеччині кажуть die Mail; в Австрії та Швейцарії часто das Mail, і кожне правильне у себе. Голосний англійський, тож слово звучить як друга частина E-Mail, а не як дієслово malen. Складні слова розгортають його знову: die Mailadresse, der Mailanhang.'

  - de: Fax
    ipa: "ˈfaks"
    pos: noun
    gender: n
    plural: "die Faxe"
    cards: recognition
    en: the machine that sends a document down the telephone line and prints one out, and the printed sheet that arrives that way
    ru: аппарат, который отправляет документ по телефонной линии и печатает приходящий, и сам приходящий таким образом лист
    uk: апарат, який надсилає документ телефонною лінією і друкує той, що надходить, і сам аркуш, що надходить у такий спосіб
    example_de: Ihr Fax ist heute Morgen angekommen.
    example_en: Your fax arrived this morning.
    example_ru: Ваш факс пришёл сегодня утром.
    example_uk: Ваш факс надійшов сьогодні вранці.
    note:
      en: 'Neuter, plural die Faxe, and short for das Telefax. One word covers both things and only the sentence divides them: das Fax steht im Flur is the machine, Ich habe Ihr Fax bekommen is the sheet, and das Faxgerät names the machine when it must be unambiguous. The technology has outlived its obituaries in German public life, so an Amt, a doctor''s Praxis and a law office still print Fax: on the letterhead beside Tel. and E-Mail.'
      ru: 'Средний род, множественное die Faxe, сокращение от das Telefax. Одно слово покрывает обе вещи, и разводит их только предложение: das Fax steht im Flur — аппарат, Ich habe Ihr Fax bekommen — лист, а das Faxgerät называет аппарат там, где нужна однозначность. В немецкой публичной жизни техника пережила все некрологи, так что ведомство, врачебная практика и адвокатская контора по-прежнему печатают на бланке Fax: рядом с Tel. и E-Mail.'
      uk: 'Середній рід, множина die Faxe, скорочення від das Telefax. Одне слово покриває обидві речі, і розводить їх лише речення: das Fax steht im Flur — апарат, Ich habe Ihr Fax bekommen — аркуш, а das Faxgerät називає апарат там, де потрібна однозначність. У німецькому публічному житті техніка пережила всі некрологи, тож відомство, лікарська практика й адвокатська контора й досі друкують на бланку Fax: поряд із Tel. і E-Mail.'

  - de: faxen
    ipa: "ˈfaksn̩"
    pos: verb
    praesens_3sg: faxt
    partizip2: gefaxt
    aux: haben
    valence: "+ Dat + Akk"
    cards: recognition
    en: to send a document down the telephone line to a machine that prints it out at the other end
    ru: отправить документ по телефонной линии на аппарат, который распечатает его на другом конце
    uk: надіслати документ телефонною лінією на апарат, який роздрукує його на другому кінці
    example_de: Bitte faxen Sie uns das Formular bis Freitag.
    example_en: Please fax us the form by Friday.
    example_ru: Пришлите нам, пожалуйста, бланк факсом до пятницы.
    example_uk: Надішліть нам, будь ласка, бланк факсом до п'ятниці.
    note:
      en: 'Weak and regular: faxt, hat gefaxt, with the person in the dative and the document in the accusative. Relatives are formed as usual — durchfaxen, zufaxen — and the noun above supplies das Faxgerät and die Faxnummer. One trap worth knowing: die Faxen is a separate word that exists only in the plural and means silly antics, so Mach keine Faxen! tells somebody to stop messing about and has nothing to do with any machine.'
      ru: 'Слабый и правильный: faxt, hat gefaxt, человек в дательном, документ в винительном. Родственники образуются как обычно — durchfaxen, zufaxen, — а существительное выше даёт das Faxgerät и die Faxnummer. Одна ловушка, которую стоит знать: die Faxen — отдельное слово, существующее только во множественном и значащее «выходки, кривлянье», так что Mach keine Faxen! — это «прекрати дурачиться» и к аппаратам отношения не имеет.'
      uk: 'Слабке і правильне: faxt, hat gefaxt, людина в давальному, документ у знахідному. Родичі творяться як звичайно — durchfaxen, zufaxen, — а іменник вище дає das Faxgerät і die Faxnummer. Одна пастка, яку варто знати: die Faxen — окреме слово, що існує лише в множині й означає «витівки, кривляння», тож Mach keine Faxen! — це «припини дуріти» і до апаратів стосунку не має.'

  - de: Mobilbox
    ipa: "moˈbiːlˌbɔks"
    pos: noun
    gender: f
    plural: "die Mobilboxen"
    cards: recognition
    en: the answering service of a mobile phone, which records what a caller says when nobody picks up
    ru: автоответчик мобильной сети, записывающий сказанное звонящим, когда никто не берёт трубку
    uk: автовідповідач мобільної мережі, що записує сказане тим, хто телефонує, коли ніхто не бере слухавку
    example_de: Sprechen Sie mir einfach auf die Mobilbox.
    example_en: Just leave me a message on my voicemail.
    example_ru: Просто наговорите мне сообщение на автоответчик.
    example_uk: Просто наговоріть мені повідомлення на автовідповідач.
    note:
      en: 'Feminine from die Box, plural in -en, primary stress on -bil-. It is the mobile-network sibling of A2 die Mailbox and of A2 der Anrufbeantworter, both in the deck `digital-medien-a2`: the Anrufbeantworter is a device standing in a hallway, this one is a service running in the network. Providers do not agree on the name — Telekom prints Mobilbox, others Mailbox or Sprachbox — so the learner meets all three on a bill. The verbs are auf die Mobilbox sprechen and die Mobilbox abhören.'
      ru: 'Женский род от die Box, множественное на -en, главное ударение на -bil-. Это мобильный родственник die Mailbox уровня A2 и der Anrufbeantworter уровня A2, обоих из колоды `digital-medien-a2`: Anrufbeantworter — прибор, стоящий в прихожей, а это — служба, работающая в сети. Операторы в названии не сходятся: Telekom печатает Mobilbox, другие — Mailbox или Sprachbox, — так что учащийся встретит на счёте все три. Глаголы: auf die Mobilbox sprechen и die Mobilbox abhören.'
      uk: 'Жіночий рід від die Box, множина на -en, головний наголос на -bil-. Це мобільний родич die Mailbox рівня A2 і der Anrufbeantworter рівня A2, обох із колоди `digital-medien-a2`: Anrufbeantworter — прилад, що стоїть у передпокої, а це — служба, яка працює в мережі. Оператори в назві не сходяться: Telekom друкує Mobilbox, інші — Mailbox або Sprachbox, — тож учень зустріне на рахунку всі три. Дієслова: auf die Mobilbox sprechen і die Mobilbox abhören.'

  - de: Smartphone
    ipa: "ˈsmaːɐ̯tˌfoːn"
    pos: noun
    gender: n
    plural: "die Smartphones"
    cards: recognition
    en: a mobile telephone that also runs programs, shows the internet and takes pictures
    ru: мобильный телефон, который вдобавок исполняет программы, показывает интернет и снимает
    uk: мобільний телефон, який на додачу виконує програми, показує інтернет і знімає
    example_de: Fast alle Fotos macht er heute mit dem Smartphone.
    example_en: He takes almost all his photos with his smartphone these days.
    example_ru: Почти все снимки он теперь делает смартфоном.
    example_uk: Майже всі знімки він тепер робить смартфоном.
    note:
      en: 'A1 das Handy, in the deck `kommunikation-medien`, is the everyday German word for the same object in the hand, and it is the one to say; this is the shop''s word, and it specifies what the thing can do. Both are neuter, and this one takes -s in the plural. Worth knowing about the sibling: Handy is not an English word at all, and an English speaker says mobile or cell phone. The initial s here is the sharp one of the source language, as in Software; a German-rooted word before m would begin ʃ.'
      ru: 'das Handy уровня A1 из колоды `kommunikation-medien` — обиходное немецкое слово для того же предмета в руке, и произносить стоит его; это же — слово магазина, и оно уточняет, что предмет умеет. Оба среднего рода, а это берёт во множественном -s. О родственнике стоит знать вот что: Handy — вовсе не английское слово, англичанин скажет mobile или cell phone. Начальное s здесь резкое, по языку-источнику, как в Software; исконно немецкое слово перед m начиналось бы с ʃ.'
      uk: 'das Handy рівня A1 з колоди `kommunikation-medien` — побутове німецьке слово для того самого предмета в руці, і вимовляти варто саме його; це ж — слово крамниці, і воно уточнює, що предмет уміє. Обидва середнього роду, а це бере в множині -s. Про родича варто знати ось що: Handy — зовсім не англійське слово, англієць скаже mobile або cell phone. Початкове s тут різке, за мовою-джерелом, як у Software; питомо німецьке слово перед m починалося б із ʃ.'

  - de: mobil
    ipa: "moˈbiːl"
    pos: adj
    cards: recognition
    en: able to be carried about and used away from any fixed place; of a person, free to travel or to move house for work
    ru: такой, который можно носить с собой и использовать вне привязки к месту; о человеке — готовый ездить или переехать ради работы
    uk: такий, що його можна носити із собою і використовувати поза прив'язкою до місця; про людину — готовий їздити або переїхати заради роботи
    example_de: Ohne mobiles Internet komme ich kaum noch aus.
    example_en: I can hardly manage without mobile internet any more.
    example_ru: Без мобильного интернета я уже почти не обхожусь.
    example_uk: Без мобільного інтернету я вже майже не обходжуся.
    note:
      en: 'An ordinary adjective that takes ordinary endings: das mobile Internet, mobile Daten, and predicatively mobil sein. Stress on the second syllable. The technical family runs A2 das Mobiltelefon, in the deck `digital-medien-a2`, and der Mobilfunk for the network itself. The human sense is the one a job advert means — Sind Sie mobil? asks whether the applicant can travel or relocate, not whether they own a phone. The abstract noun is die Mobilität.'
      ru: 'Обычное прилагательное с обычными окончаниями: das mobile Internet, mobile Daten, а в сказуемом mobil sein. Ударение на втором слоге. Техническое семейство даёт das Mobiltelefon уровня A2 из колоды `digital-medien-a2` и der Mobilfunk — саму сотовую связь. Человеческое значение имеет в виду объявление о работе: Sind Sie mobil? спрашивает, готов ли соискатель ездить или переехать, а не есть ли у него телефон. Отвлечённое существительное — die Mobilität.'
      uk: 'Звичайний прикметник зі звичайними закінченнями: das mobile Internet, mobile Daten, а в присудку mobil sein. Наголос на другому складі. Технічна родина дає das Mobiltelefon рівня A2 з колоди `digital-medien-a2` і der Mobilfunk — сам мобільний зв''язок. Людське значення має на увазі оголошення про роботу: Sind Sie mobil? питає, чи готовий здобувач їздити або переїхати, а не чи має він телефон. Відсторонений іменник — die Mobilität.'

  - de: elektronisch
    ipa: "elɛkˈtʁoːnɪʃ"
    pos: adj
    cards: recognition
    en: working by way of circuits and chips rather than moving parts; of a document, existing as data instead of on paper
    ru: работающий на схемах и микросхемах, а не на движущихся частях; о документе — существующий в виде данных, а не на бумаге
    uk: що працює на схемах і мікросхемах, а не на рухомих частинах; про документ — що існує у вигляді даних, а не на папері
    example_de: Die Rechnung kommt nur noch in elektronischer Form.
    example_en: The invoice now comes in electronic form only.
    example_ru: Счёт приходит теперь только в электронном виде.
    example_uk: Рахунок надходить тепер лише в електронному вигляді.
    note:
      en: 'German official life leans on the second sense: die elektronische Signatur, die elektronische Patientenakte, der elektronische Ausweis, and the abbreviation eAkte that follows from it. Keep it apart from elektrisch, which means running on current and describes a kettle or a bicycle; a Gerät can be elektrisch without being elektronisch. The field and the parts are die Elektronik, and the stress stays on the same syllable across the family: Elektrónik, elektrónisch.'
      ru: 'Немецкая официальная жизнь опирается на второе значение: die elektronische Signatur, die elektronische Patientenakte, der elektronische Ausweis, а из них и сокращение eAkte. Не смешивайте с elektrisch — «работающий от тока»: так говорят о чайнике или велосипеде; прибор может быть elektrisch, не будучи elektronisch. Область и сами детали — die Elektronik, и ударение в семействе держится на одном и том же слоге: Elektrónik, elektrónisch.'
      uk: 'Німецьке офіційне життя спирається на друге значення: die elektronische Signatur, die elektronische Patientenakte, der elektronische Ausweis, а з них і скорочення eAkte. Не змішуйте з elektrisch — «що працює від струму»: так кажуть про чайник або велосипед; прилад може бути elektrisch, не будучи elektronisch. Галузь і самі деталі — die Elektronik, і наголос у родині тримається на тому самому складі: Elektrónik, elektrónisch.'

  - de: virtuell
    ipa: "vɪʁˈtu̯ɛl"
    pos: adj
    cards: recognition
    en: existing as a picture on a screen rather than as a thing in a room, but usable as though it were the real one
    ru: существующий как изображение на экране, а не как вещь в комнате, но пригодный к использованию так, будто он настоящий
    uk: що існує як зображення на екрані, а не як річ у кімнаті, але придатний до використання так, наче він справжній
    example_de: Der Unterricht findet zurzeit virtuell statt.
    example_en: Lessons are currently taking place virtually.
    example_ru: Занятия сейчас проходят виртуально.
    example_uk: Заняття зараз відбуваються віртуально.
    note:
      en: 'Endings as usual: ein virtuelles Treffen, die virtuelle Realität, der virtuelle Rundgang. The -u- and -ell run together into one stressed syllable at the end of the word. Its opposite in a text about meetings and courses is not real but in Präsenz: ein Treffen in Präsenz is one people travel to. B1 die Realität, in the deck `abstrakte-begriffe-b1`, is the noun the phrase virtuelle Realität is built on.'
      ru: 'Окончания обычные: ein virtuelles Treffen, die virtuelle Realität, der virtuelle Rundgang. -u- и -ell сливаются в один ударный слог в конце слова. Противоположность в тексте о встречах и курсах — не real, а in Präsenz: ein Treffen in Präsenz — то, на которое приезжают. die Realität уровня B1 из колоды `abstrakte-begriffe-b1` — существительное, на котором построено сочетание virtuelle Realität.'
      uk: 'Закінчення звичайні: ein virtuelles Treffen, die virtuelle Realität, der virtuelle Rundgang. -u- і -ell зливаються в один наголошений склад у кінці слова. Протилежність у тексті про зустрічі та курси — не real, а in Präsenz: ein Treffen in Präsenz — те, на яке приїжджають. die Realität рівня B1 з колоди `abstrakte-begriffe-b1` — іменник, на якому побудоване сполучення virtuelle Realität.'

  - de: Virus
    ipa: "ˈviːʁʊs"
    pos: noun
    gender: n
    plural: "die Viren"
    cards: recognition
    en: a program written to spread from machine to machine and damage what it finds; also the far smaller thing that makes a person ill
    ru: программа, написанная, чтобы расходиться с машины на машину и портить всё, до чего доберётся; а также то несравнимо меньшее, от чего человек заболевает
    uk: програма, написана, щоб розходитися з машини на машину і псувати все, до чого дістанеться; а також те незрівнянно менше, від чого людина хворіє
    example_de: Ein Virus hat alle Dateien auf dem Rechner gelöscht.
    example_en: A virus deleted every file on the computer.
    example_ru: Вирус удалил все файлы на компьютере.
    example_uk: Вірус видалив усі файли на комп'ютері.
    note:
      en: 'Duden gives das Virus first and der Virus beside it, and the split is not neat: medicine and biology write das Virus, while everyday speech and almost all computer usage say der Virus, so a reader will meet both articles for one word. The plural is die Viren either way. On a screen the family runs der Virenscanner and das Virenschutzprogramm, and the general word for anything harmful is die Schadsoftware. Do not confuse it with das Visum, a visa, which only looks related.'
      ru: 'Duden ставит на первое место das Virus, а рядом даёт der Virus, и деление получается нечётким: медицина и биология пишут das Virus, тогда как обиходная речь и почти всё компьютерное употребление говорят der Virus, — так что читателю попадутся оба артикля при одном слове. Множественное в любом случае die Viren. На экране семейство даёт der Virenscanner и das Virenschutzprogramm, а общее слово для всего вредоносного — die Schadsoftware. Не путайте с das Visum — «виза»: слово лишь похоже.'
      uk: 'Duden ставить на перше місце das Virus, а поряд дає der Virus, і поділ виходить нечіткий: медицина й біологія пишуть das Virus, тоді як побутове мовлення і майже все комп''ютерне вживання кажуть der Virus, — тож читачеві трапляться обидва артиклі при одному слові. Множина в будь-якому разі die Viren. На екрані родина дає der Virenscanner і das Virenschutzprogramm, а загальне слово для всього шкідливого — die Schadsoftware. Не плутайте з das Visum — «віза»: слово лише схоже.'
