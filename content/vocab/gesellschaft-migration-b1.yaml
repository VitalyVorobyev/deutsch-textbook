# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the society-and-
# migration field of data/goethe-b1-wortliste.txt: the words a text uses for where
# somebody comes from, what made them leave, what arriving is called once they are
# here, who the people of a place are taken together, who is paid to help the ones
# in trouble, and what a group hands on to the next generation.
# A1's `reisen-urlaub` owns the border crossing itself (Grenze, Pass, Visum,
# Ausland), A1's `menschen-familie` owns der Mensch and die Leute, A2's
# `menschen-beziehungen-a2` owns die Person and die Gruppe, A2's `biografie-
# erfahrungen` owns die Heimat, A2's `sport-freizeit-a2` owns der Verein, A2's
# `kultur-unterhaltung-a2` owns die Kultur, B1's `gesellschaft-zusammenleben` owns
# the people as a society and its parts (Gesellschaft, Minderheit, Mehrheit,
# Respekt, Versammlung, Diskussion), and B1's `verwaltung-behoerden-b1` owns the
# state's side of arrival (Asyl, Arbeitserlaubnis, Behörde, Bürger). This deck
# is the layer between them: the German of a B1 reading text about who lives here
# and how, which those seven never name.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field
# is read off a newspaper page, a leaflet from an advice centre and an exam text;
# the learner who has to *say* any of it reaches for the A1 or A2 word beside it,
# and that word already ships as a typed card.
id: gesellschaft-migration-b1
title_de: "Gesellschaft und Migration"
title_en: "Society and migration"
title_ru: "Общество и миграция"
title_uk: "Суспільство і міграція"
level: B1
entries:
  # --- Woher jemand kommt ---
  - de: Ausländer
    ipa: "ˈaʊ̯sˌlɛndɐ"
    pos: noun
    gender: m
    plural: "die Ausländer"
    cards: recognition
    en: a man who does not hold the citizenship of the country he is in
    ru: мужчина, не имеющий гражданства той страны, в которой находится
    uk: чоловік, який не має громадянства тієї країни, де перебуває
    example_de: In dieser Stadt leben Ausländer aus vielen Ländern.
    example_en: Foreign nationals from many countries live in this town.
    example_ru: В этом городе живут иностранцы из многих стран.
    example_uk: У цьому місті живуть іноземці з багатьох країн.
    note:
      en: 'A1 das Ausland in the deck `reisen-urlaub` is the place; this is the person, and German law defines it purely by citizenship, so it says nothing about where somebody was born or how long they have lived here. The feminine is die Ausländerin, the next entry: regular Movierung with -in and a doubled n in the plural. Singular and plural of the masculine are spelled alike. The office is die Ausländerbehörde, built on B1 die Behörde in the deck `verwaltung-behoerden-b1`. Careful writing today often prefers ausländische Mitbürger or Menschen ohne deutschen Pass, because the bare word has been used as a label in political argument.'
      ru: 'das Ausland уровня A1 из колоды `reisen-urlaub` — место; это же слово — человек, и немецкий закон определяет его чисто по гражданству, так что о месте рождения и о сроке жизни здесь оно не говорит ничего. Женская пара — die Ausländerin, следующая запись: обычное мовирование на -in, во множественном n удваивается. Единственное и множественное мужской формы пишутся одинаково. Учреждение — die Ausländerbehörde, построенное на die Behörde уровня B1 из колоды `verwaltung-behoerden-b1`. В осторожном письме сегодня часто предпочитают ausländische Mitbürger или Menschen ohne deutschen Pass, потому что голое слово успело поработать ярлыком в политическом споре.'
      uk: 'das Ausland рівня A1 з колоди `reisen-urlaub` — місце; це ж слово — людина, і німецький закон визначає її суто за громадянством, тож про місце народження і про строк життя тут воно не каже нічого. Жіноча пара — die Ausländerin, наступний запис: звичайна моція на -in, у множині n подвоюється. Однина і множина чоловічої форми пишуться однаково. Установа — die Ausländerbehörde, побудована на die Behörde рівня B1 з колоди `verwaltung-behoerden-b1`. В обережному письмі сьогодні часто воліють ausländische Mitbürger або Menschen ohne deutschen Pass, бо голе слово встигло попрацювати ярликом у політичній суперечці.'

  - de: Ausländerin
    ipa: "ˈaʊ̯sˌlɛndəʁɪn"
    pos: noun
    gender: f
    plural: "die Ausländerinnen"
    cards: recognition
    en: a woman who does not hold the citizenship of the country she is in
    ru: женщина, не имеющая гражданства той страны, в которой находится
    uk: жінка, яка не має громадянства тієї країни, де перебуває
    example_de: Als Ausländerin brauchte sie damals ein Visum.
    example_en: As a foreign national she needed a visa at that time.
    example_ru: Тогда ей как иностранке нужна была виза.
    example_uk: Тоді їй як іноземці була потрібна віза.
    note:
      en: 'The stress stays on the first syllable, where the masculine put it, and only the ending is added. Forms, applications and statistics print the pair as Ausländer/-in or Ausländer:innen. Note what the word does not mean: a woman who has taken German citizenship is no longer eine Ausländerin, however recently she arrived, while somebody born here who has not acquired German citizenship still is one. That gap between paper and life is exactly why the next entries — Migrantin, Migration — were needed.'
      ru: 'Ударение остаётся на первом слоге, там же, где в мужской форме, а прибавляется только окончание. Бланки, заявления и статистика печатают пару как Ausländer/-in или Ausländer:innen. Заметьте, чего слово не значит: женщина, принявшая немецкое гражданство, уже не eine Ausländerin, как бы недавно она ни приехала, — а родившийся здесь человек, не получивший немецкого гражданства, ею остаётся. Именно этот зазор между бумагой и жизнью и вызвал к жизни следующие записи — Migrantin, Migration.'
      uk: 'Наголос лишається на першому складі, там само, де в чоловічій формі, а додається лише закінчення. Бланки, заяви і статистика друкують пару як Ausländer/-in або Ausländer:innen. Зауважте, чого слово не означає: жінка, яка прийняла німецьке громадянство, уже не eine Ausländerin, хоч би як недавно вона приїхала, — а народжена тут людина, яка не набула німецького громадянства, нею лишається. Саме цей проміжок між папером і життям і викликав до життя наступні записи — Migrantin, Migration.'

  - de: ausländisch
    ipa: "ˈaʊ̯sˌlɛndɪʃ"
    pos: adj
    cards: recognition
    en: coming from or belonging to another country
    ru: происходящий из другой страны или принадлежащий ей
    uk: що походить з іншої країни або належить їй
    example_de: Sie arbeitet seit drei Jahren bei einer ausländischen Firma.
    example_en: She has been working for a foreign company for three years.
    example_ru: Уже три года она работает в иностранной фирме.
    example_uk: Уже три роки вона працює в іноземній фірмі.
    note:
      en: 'The adjective to das Ausland, and it is used mostly of things and institutions: eine ausländische Firma, ausländische Studierende, ausländische Waren. A2 fremd in the deck `eigenschaften-dinge-a2` is a different judgement — it says unfamiliar or not mine, which is why a language is die Fremdsprache and never an ausländische Sprache. A2 international in the same deck says the opposite thing again: not from one other country, but across many. The opposite here is inländisch, and einheimisch names the people who were there already.'
      ru: 'Прилагательное к das Ausland, и берут его больше о вещах и учреждениях: eine ausländische Firma, ausländische Studierende, ausländische Waren. fremd уровня A2 из колоды `eigenschaften-dinge-a2` — оценка другого рода: «незнакомый», «не мой», — поэтому язык называется die Fremdsprache и никогда не ausländische Sprache. international уровня A2 из той же колоды говорит опять о другом: не «из одной чужой страны», а «через многие». Противоположность здесь — inländisch, а живших там раньше называют einheimisch.'
      uk: 'Прикметник до das Ausland, і беруть його більше про речі та установи: eine ausländische Firma, ausländische Studierende, ausländische Waren. fremd рівня A2 з колоди `eigenschaften-dinge-a2` — оцінка іншого штибу: «незнайомий», «не мій», — тому мова зветься die Fremdsprache і ніколи не ausländische Sprache. international рівня A2 з тієї ж колоди каже знову про інше: не «з однієї чужої країни», а «через багато». Протилежність тут — inländisch, а тих, хто жив там раніше, звуть einheimisch.'

  - de: Migrant
    ipa: "miˈgʁant"
    pos: noun
    gender: m
    plural: "die Migranten"
    cards: recognition
    en: a man who has moved from one country to another in order to live there
    ru: мужчина, переехавший из одной страны в другую, чтобы там жить
    uk: чоловік, який переїхав з однієї країни до іншої, щоб там жити
    example_de: Der Kurs steht allen Migranten offen.
    example_en: The course is open to all migrants.
    example_ru: Курс открыт для всех мигрантов.
    example_uk: Курс відкритий для всіх мігрантів.
    note:
      en: 'A weak masculine, so every case but the nominative singular takes -en: der Migrant, den Migranten, dem Migranten, des Migranten, die Migranten — the same declension as B1 der Fotograf in the deck `medien-digital-b1` and A2 der Polizist in the deck `berufe-a2`. It describes a move, not a passport, so it is not a synonym of der Ausländer above: a naturalised German can be a Migrant and is no Ausländer. The feminine is die Migrantin, the next entry. Stress on the last syllable.'
      ru: 'Слабое существительное мужского рода: во всех падежах, кроме именительного единственного, окончание -en — der Migrant, den Migranten, dem Migranten, des Migranten, die Migranten, — то же склонение, что у der Fotograf уровня B1 из колоды `medien-digital-b1` и der Polizist уровня A2 из колоды `berufe-a2`. Слово описывает переезд, а не паспорт, так что это не синоним der Ausländer выше: принявший немецкое гражданство остаётся Migrant и уже не Ausländer. Женская пара — die Migrantin, следующая запись. Ударение на последнем слоге.'
      uk: 'Слабкий іменник чоловічого роду: в усіх відмінках, крім називного однини, закінчення -en — der Migrant, den Migranten, dem Migranten, des Migranten, die Migranten, — те саме відмінювання, що в der Fotograf рівня B1 з колоди `medien-digital-b1` і der Polizist рівня A2 з колоди `berufe-a2`. Слово описує переїзд, а не паспорт, тож це не синонім der Ausländer вище: той, хто прийняв німецьке громадянство, лишається Migrant і вже не Ausländer. Жіноча пара — die Migrantin, наступний запис. Наголос на останньому складі.'

  - de: Migrantin
    ipa: "miˈgʁantɪn"
    pos: noun
    gender: f
    plural: "die Migrantinnen"
    cards: recognition
    en: a woman who has moved from one country to another in order to live there
    ru: женщина, переехавшая из одной страны в другую, чтобы там жить
    uk: жінка, яка переїхала з однієї країни до іншої, щоб там жити
    example_de: Die Migrantin hat schnell eine Arbeit gefunden.
    example_en: The migrant found work quickly.
    example_ru: Мигрантка быстро нашла работу.
    example_uk: Мігрантка швидко знайшла роботу.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n, and the weak declension of the masculine stops here: this form takes no case endings at all. German writing about origins turns on one more phrase, der Migrationshintergrund, which official statistics define by the parents rather than by the person, so a text may count somebody as a Person mit Migrationshintergrund who was born here and has never lived anywhere else.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается, и слабое склонение мужской формы здесь обрывается: эта форма падежных окончаний не имеет вовсе. Немецкое письмо о происхождении держится ещё на одном обороте — der Migrationshintergrund, который официальная статистика определяет по родителям, а не по самому человеку, так что текст может засчитать как Person mit Migrationshintergrund того, кто здесь родился и нигде больше не жил.'
      uk: 'Звичайна моція на -in, у множині n подвоюється, і слабке відмінювання чоловічої форми тут уривається: ця форма відмінкових закінчень не має зовсім. Німецьке письмо про походження тримається ще на одному звороті — der Migrationshintergrund, який офіційна статистика визначає за батьками, а не за самою людиною, тож текст може зарахувати як Person mit Migrationshintergrund того, хто тут народився і ніде більше не жив.'

  - de: Migration
    ipa: "migʁaˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the movement of people from one country or region to another to settle there, taken as a process
    ru: перемещение людей из одной страны или области в другую ради оседания там, взятое как процесс
    uk: переміщення людей з однієї країни чи області до іншої задля осідання там, узяте як процес
    example_de: Über Migration wird in ganz Europa diskutiert.
    example_en: Migration is being debated across the whole of Europe.
    example_ru: О миграции спорят по всей Европе.
    example_uk: Про міграцію сперечаються по всій Європі.
    note:
      en: 'Feminine, like every noun in -tion, with the stress on that ending; it names a process and stays in the singular. It is the neutral umbrella over two directions German can also name separately: die Einwanderung, coming in, and die Auswanderung, going out. Which of the two a text means shows only from the sentence. The Latin root migrare, to move house, also gives the bird migration, die Vogelmigration, and the technical sense of moving data.'
      ru: 'Женский род, как всякое слово на -tion, с ударением на этом окончании; слово называет процесс и остаётся в единственном числе. Это нейтральный зонт над двумя направлениями, которые немецкий умеет назвать и порознь: die Einwanderung — въезд, die Auswanderung — выезд. Какое из двух имеет в виду текст, видно только из предложения. Латинский корень migrare — «переселяться» — дал и перелёт птиц, die Vogelmigration, и технический перенос данных.'
      uk: 'Жіночий рід, як усяке слово на -tion, з наголосом на цьому закінченні; слово називає процес і лишається в однині. Це нейтральна парасоля над двома напрямками, які німецька вміє назвати й нарізно: die Einwanderung — в’їзд, die Auswanderung — виїзд. Який із двох має на увазі текст, видно лише з речення. Латинський корінь migrare — «переселятися» — дав і переліт птахів, die Vogelmigration, і технічне перенесення даних.'

  - de: fliehen
    ipa: "ˈfliːən"
    pos: verb
    praesens_3sg: flieht
    partizip2: geflohen
    aux: sein
    valence: "vor + Dat"
    cards: recognition
    en: to leave a place quickly because staying there is dangerous
    ru: спешно покинуть место, потому что оставаться там опасно
    uk: спішно покинути місце, бо лишатися там небезпечно
    example_de: Viele Menschen fliehen vor dem Krieg.
    example_en: Many people are fleeing from the war.
    example_ru: Многие люди бегут от войны.
    example_uk: Багато людей тікають від війни.
    note:
      en: 'Strong, and the vowels are the whole difficulty: fliehen, floh, ist geflohen. The auxiliary is sein because the verb is a movement. What is escaped from stands in vor plus the dative, the place left in aus plus the dative, the place reached in nach or in. Watch it against A1 fliegen in the deck `perfekt-a1-verben` — one letter apart, and flog beside floh. The noun is die Flucht, next; the person is der Flüchtling, which the note on B1 das Asyl in the deck `verwaltung-behoerden-b1` already sets beside the legal word, and careful German today often writes der Geflüchtete instead.'
      ru: 'Сильный, и вся трудность в гласных: fliehen, floh, ist geflohen. Вспомогательный sein, потому что глагол описывает движение. То, от чего бегут, стоит при vor с дательным, покинутое место — при aus с дательным, а достигнутое — при nach или in. Следите за ним рядом с fliegen уровня A1 из колоды `perfekt-a1-verben`: разница в одну букву, и flog рядом с floh. Существительное — die Flucht, следующая запись; человек — der Flüchtling, которого примечание к das Asyl уровня B1 из колоды `verwaltung-behoerden-b1` уже ставит рядом с юридическим словом, а осторожный немецкий сегодня чаще пишет der Geflüchtete.'
      uk: 'Сильне, і вся складність у голосних: fliehen, floh, ist geflohen. Допоміжне sein, бо дієслово описує рух. Те, від чого тікають, стоїть при vor з давальним, покинуте місце — при aus з давальним, а досягнуте — при nach або in. Стежте за ним поряд із fliegen рівня A1 з колоди `perfekt-a1-verben`: різниця в одну літеру, і flog поряд із floh. Іменник — die Flucht, наступний запис; людина — der Flüchtling, якого примітка до das Asyl рівня B1 з колоди `verwaltung-behoerden-b1` уже ставить поряд із юридичним словом, а обережна німецька сьогодні частіше пише der Geflüchtete.'

  - de: Flucht
    ipa: "ˈflʊxt"
    pos: noun
    gender: f
    plural: "die Fluchten"
    cards: recognition
    en: the act of getting away from danger, and the journey that follows it
    ru: бегство от опасности и путь, который за ним следует
    uk: втеча від небезпеки і шлях, що за нею настає
    example_de: Auf der Flucht hat die Familie fast alles verloren.
    example_en: The family lost almost everything during their flight.
    example_ru: В бегстве семья потеряла почти всё.
    example_uk: У втечі родина втратила майже все.
    note:
      en: 'The noun to fliehen above; the plural exists but a text almost always uses the singular. Chunks: auf der Flucht sein, die Flucht ergreifen, jemandem zur Flucht verhelfen. One compound is on the wall of every German public building and has nothing to do with war: der Fluchtweg, the escape route marked with a green running figure, beside B1 der Notausgang in the deck `haushalt-notfall-b1`. The ch after u is the back one, as in Buch.'
      ru: 'Существительное к fliehen выше; множественное существует, но текст почти всегда берёт единственное. Обороты: auf der Flucht sein, die Flucht ergreifen, jemandem zur Flucht verhelfen. Одно сложное слово висит на стене каждого немецкого общественного здания и к войне отношения не имеет: der Fluchtweg — путь эвакуации, отмеченный зелёной бегущей фигуркой, рядом с der Notausgang уровня B1 из колоды `haushalt-notfall-b1`. ch после u здесь заднее, как в Buch.'
      uk: 'Іменник до fliehen вище; множина існує, але текст майже завжди бере однину. Звороти: auf der Flucht sein, die Flucht ergreifen, jemandem zur Flucht verhelfen. Одне складне слово висить на стіні кожної німецької громадської будівлі і до війни стосунку не має: der Fluchtweg — шлях евакуації, позначений зеленою фігуркою, що біжить, поряд із der Notausgang рівня B1 з колоди `haushalt-notfall-b1`. ch після u тут заднє, як у Buch.'

  # --- Ankommen und dazugehören ---
  - de: integrieren
    ipa: "ɪnteˈgʁiːʁən"
    pos: verb
    praesens_3sg: integriert
    partizip2: integriert
    aux: haben
    valence: "+ Akk / sich"
    cards: recognition
    en: to make somebody or something a working part of a larger whole; with sich, to become one
    ru: сделать кого-либо или что-либо действующей частью большего целого; с sich — стать такой частью
    uk: зробити когось або щось дієвою частиною більшого цілого; із sich — стати такою частиною
    example_de: Die Schule hilft den neuen Kindern, sich zu integrieren.
    example_en: The school helps the new children to fit in.
    example_ru: Школа помогает новым детям влиться в коллектив.
    example_uk: Школа допомагає новим дітям влитися в колектив.
    note:
      en: 'Weak and inseparable, so there is no ge- in the participle: integriert. It works both ways round, and the difference matters politically: jemanden integrieren puts the work on the society, sich integrieren puts it on the newcomer, and a German debate is usually an argument about which of the two the sentence should be. Where the newcomer joins stands in in plus the accusative. A second, technical sense is everywhere in product language: eine integrierte Kamera is a built-in one. The noun is die Integration, next.'
      ru: 'Слабый и неотделяемый, поэтому в причастии нет ge-: integriert. Глагол работает в обе стороны, и разница здесь политическая: jemanden integrieren кладёт работу на общество, sich integrieren — на приезжего, и немецкий спор обычно и есть спор о том, каким из двух должно быть предложение. Куда включаются, стоит при in с винительным. Второе, техническое значение сплошь и рядом в языке товаров: eine integrierte Kamera — встроенная. Существительное — die Integration, следующая запись.'
      uk: 'Слабке і невідокремлюване, тому в дієприкметнику немає ge-: integriert. Дієслово працює в обидва боки, і різниця тут політична: jemanden integrieren кладе роботу на суспільство, sich integrieren — на приїжджого, і німецька суперечка зазвичай і є суперечкою про те, яким із двох має бути речення. Куди включаються, стоїть при in зі знахідним. Друге, технічне значення суцільно в мові товарів: eine integrierte Kamera — вбудована. Іменник — die Integration, наступний запис.'

  - de: Integration
    ipa: "ɪntegʁaˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the process by which newcomers come to take a full part in the life of the place they have moved to
    ru: процесс, в ходе которого приезжие начинают полноценно участвовать в жизни того места, куда переехали
    uk: процес, у ході якого приїжджі починають повноцінно брати участь у житті того місця, куди переїхали
    example_de: Die Integration braucht Zeit und Arbeit von beiden Seiten.
    example_en: Integration takes time and effort from both sides.
    example_ru: Интеграция требует времени и труда с обеих сторон.
    example_uk: Інтеграція потребує часу і праці з обох боків.
    note:
      en: 'Feminine, stress on the last syllable, and abstract enough that it stays in the singular. In Germany it is also the name of a thing you can enrol in: der Integrationskurs is the state-funded course of German plus an Orientierungskurs on law, history and everyday life, and passing it counts towards naturalisation. Beside it die Assimilation means giving up what was brought along, which is precisely the accusation each side of the debate makes of the other.'
      ru: 'Женский род, ударение на последнем слоге, и слово достаточно отвлечённое, чтобы оставаться в единственном. В Германии это ещё и название того, на что можно записаться: der Integrationskurs — оплачиваемый государством курс немецкого плюс Orientierungskurs о праве, истории и повседневной жизни, и сданный экзамен засчитывается при получении гражданства. Рядом die Assimilation значит отказ от принесённого с собой — ровно то, в чём каждая сторона спора упрекает другую.'
      uk: 'Жіночий рід, наголос на останньому складі, і слово достатньо відсторонене, щоб лишатися в однині. У Німеччині це ще й назва того, на що можна записатися: der Integrationskurs — оплачуваний державою курс німецької плюс Orientierungskurs про право, історію і щоденне життя, і складений іспит зараховується при отриманні громадянства. Поряд die Assimilation означає відмову від принесеного із собою — саме те, у чому кожна сторона суперечки докоряє іншій.'

  - de: interkulturell
    ipa: "ɪntɐkʊltuˈʁɛl"
    pos: adj
    cards: recognition
    en: happening between people of different cultures, or aimed at the meeting between them
    ru: происходящий между людьми разных культур или направленный на их встречу
    uk: що відбувається між людьми різних культур або спрямований на їхню зустріч
    example_de: Der Verein bietet jeden Sommer ein interkulturelles Fest an.
    example_en: The association puts on an intercultural festival every summer.
    example_ru: Каждое лето объединение устраивает межкультурный праздник.
    example_uk: Щоліта об’єднання влаштовує міжкультурне свято.
    note:
      en: 'The Latin prefix inter- means between, as in A2 international in the deck `eigenschaften-dinge-a2`, and the base is A2 die Kultur in the deck `kultur-unterhaltung-a2`. Stress on the last syllable, which is where every adjective in -ell puts it. The chunk a learner will actually meet is interkulturelle Kompetenz, a line in job adverts and course descriptions meaning the ability to work with people whose habits are not yours. Note the spelling: two ls, and no h anywhere.'
      ru: 'Латинская приставка inter- значит «между», как в international уровня A2 из колоды `eigenschaften-dinge-a2`, а основа — die Kultur уровня A2 из колоды `kultur-unterhaltung-a2`. Ударение на последнем слоге — там же, где у всякого прилагательного на -ell. Оборот, который учащемуся действительно попадётся, — interkulturelle Kompetenz: строка в объявлениях о работе и в описаниях курсов, означающая умение работать с людьми, чьи привычки не ваши. Следите за написанием: два l и нигде никакого h.'
      uk: 'Латинський префікс inter- означає «між», як в international рівня A2 з колоди `eigenschaften-dinge-a2`, а основа — die Kultur рівня A2 з колоди `kultur-unterhaltung-a2`. Наголос на останньому складі — там само, де в кожного прикметника на -ell. Зворот, який учневі справді трапиться, — interkulturelle Kompetenz: рядок в оголошеннях про роботу і в описах курсів, що означає вміння працювати з людьми, чиї звички не ваші. Стежте за написанням: дві l і ніде жодного h.'

  - de: gleichberechtigt
    ipa: "ˈglaɪ̯çbəˌʁɛçtɪçt"
    pos: adj
    cards: recognition
    en: holding the same rights as the other side, with neither one above the other
    ru: обладающий теми же правами, что и другая сторона, — ни одна из них не выше
    uk: що має ті самі права, що й інша сторона, — жодна з них не вище
    example_de: Männer und Frauen sind gleichberechtigt.
    example_en: Men and women have equal rights.
    example_ru: Мужчины и женщины равноправны.
    example_uk: Чоловіки і жінки рівноправні.
    note:
      en: 'A2 gleich in the deck `kleine-woerter-a2` plus berechtigt, from B1 das Recht in the deck `recht-kriminalitaet-b1`. The example is not invented: it is the sentence of the Grundgesetz, Article 3, and a German reader hears the quotation. The noun is die Gleichberechtigung; the neighbouring die Gleichstellung names the active work of removing the difference rather than the state of having none. Note the two ch, each pronounced differently — the first after ei is soft, and so is the last, in -igt.'
      ru: 'gleich уровня A2 из колоды `kleine-woerter-a2` плюс berechtigt, от das Recht уровня B1 из колоды `recht-kriminalitaet-b1`. Пример не выдуман: это фраза Основного закона, статья 3, и немецкий читатель слышит в ней цитату. Существительное — die Gleichberechtigung; соседнее die Gleichstellung называет активную работу по устранению разницы, а не состояние, когда её нет. Обратите внимание на два ch — они звучат по-разному: первое, после ei, мягкое, и мягкое же последнее, в -igt.'
      uk: 'gleich рівня A2 з колоди `kleine-woerter-a2` плюс berechtigt, від das Recht рівня B1 з колоди `recht-kriminalitaet-b1`. Приклад не вигаданий: це фраза Основного закону, стаття 3, і німецький читач чує в ній цитату. Іменник — die Gleichberechtigung; сусіднє die Gleichstellung називає активну роботу з усунення різниці, а не стан, коли її немає. Зверніть увагу на два ch — вони звучать по-різному: перше, після ei, м’яке, і м’яке ж останнє, у -igt.'

  - de: Mitglied
    ipa: "ˈmɪtˌgliːt"
    pos: noun
    gender: n
    plural: "die Mitglieder"
    cards: recognition
    en: somebody who belongs to a club, a party or an organisation and is on its list
    ru: тот, кто принадлежит к клубу, партии или организации и числится в её списке
    uk: той, хто належить до клубу, партії чи організації і числиться в її списку
    example_de: Sie ist seit zehn Jahren Mitglied in diesem Verein.
    example_en: She has been a member of this club for ten years.
    example_ru: Она состоит в этом объединении уже десять лет.
    example_uk: Вона перебуває в цьому об’єднанні вже десять років.
    note:
      en: 'Neuter although it names a person, like das Kind and das Mädchen, and that is the whole point of it: a woman is ein Mitglied too, and there is no feminine form — die Mitgliederin does not exist. In a deck full of -in pairs this is the word that needs none. Mitglied in einem Verein sein, Mitglied werden, and the money is der Mitgliedsbeitrag. The plural takes -er with no umlaut, and the final d is devoiced to t.'
      ru: 'Средний род, хотя слово называет человека, — как das Kind и das Mädchen, и в этом вся его суть: женщина тоже ein Mitglied, и женской формы нет вовсе — die Mitgliederin не существует. В колоде, полной пар на -in, это как раз то слово, которому пара не нужна. Mitglied in einem Verein sein, Mitglied werden, а взнос — der Mitgliedsbeitrag. Множественное на -er без умлаута, конечное d оглушается в t.'
      uk: 'Середній рід, хоча слово називає людину, — як das Kind і das Mädchen, і в цьому вся його суть: жінка теж ein Mitglied, і жіночої форми немає зовсім — die Mitgliederin не існує. У колоді, повній пар на -in, це якраз те слово, якому пара не потрібна. Mitglied in einem Verein sein, Mitglied werden, а внесок — der Mitgliedsbeitrag. Множина на -er без умлаута, кінцеве d оглушується в t.'

  - de: eintreten
    ipa: "ˈaɪ̯nˌtʁeːtn̩"
    pos: verb
    praesens_3sg: tritt ein
    partizip2: eingetreten
    aux: sein
    valence: "in + Akk"
    cards: recognition
    en: to become a member of a club, a party or a church
    ru: вступить в объединение, партию или церковь
    uk: вступити до об’єднання, партії чи церкви
    example_de: Nach dem Umzug ist er in einen Sportverein eingetreten.
    example_en: After the move he joined a sports club.
    example_ru: После переезда он вступил в спортивное объединение.
    example_uk: Після переїзду він вступив до спортивного об’єднання.
    note:
      en: 'Separable and strong, like treten: tritt ein, trat ein, ist eingetreten, with sein throughout. Three further senses share the word and are told apart by what follows it. Bare or with in plus the accusative it is the physical one, to step inside — Bitte treten Sie ein! — and A2 der Eintritt in the deck `kultur-unterhaltung-a2` is the price of doing so. With an event as subject it means to happen after all: der Fall ist eingetreten, eine Besserung ist eingetreten. With für plus the accusative it means to stand up for something publicly: für die Rechte der Kinder eintreten.'
      ru: 'Отделяемый и сильный, как treten: tritt ein, trat ein, ist eingetreten, и всюду sein. Ещё три значения делят это же слово, а различает их то, что стоит после. Без дополнения или с in и винительным — физическое: войти, Bitte treten Sie ein!, — а der Eintritt уровня A2 из колоды `kultur-unterhaltung-a2` — плата за вход. С событием в роли подлежащего значит «наступить, всё-таки случиться»: der Fall ist eingetreten, eine Besserung ist eingetreten. С für и винительным — публично выступать за что-либо: für die Rechte der Kinder eintreten.'
      uk: 'Відокремлюване і сильне, як treten: tritt ein, trat ein, ist eingetreten, і всюди sein. Ще три значення ділять це саме слово, а розрізняє їх те, що стоїть після. Без додатка або з in і знахідним — фізичне: увійти, Bitte treten Sie ein!, — а der Eintritt рівня A2 з колоди `kultur-unterhaltung-a2` — плата за вхід. З подією в ролі підмета означає «настати, таки статися»: der Fall ist eingetreten, eine Besserung ist eingetreten. З für і знахідним — публічно виступати за щось: für die Rechte der Kinder eintreten.'

  - de: Organisation
    ipa: "ɔʁganizaˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "die Organisationen"
    cards: recognition
    en: a body of people set up to work for a common purpose; also the work of arranging something
    ru: объединение людей, созданное ради общей цели; а также работа по устройству чего-либо
    uk: об’єднання людей, створене задля спільної мети; а також робота з улаштування чогось
    example_de: Die Organisation hilft Familien ohne Wohnung.
    example_en: The organisation helps families with nowhere to live.
    example_ru: Организация помогает семьям без жилья.
    example_uk: Організація допомагає родинам без житла.
    note:
      en: 'From A2 organisieren in the deck `arbeit-ausbildung-a2`, feminine like every noun in -tion, plural in -en. Which of the two senses is meant shows in the article: die Organisation des Festes war schwierig is the arranging, eine Organisation für Kinderrechte is the body. A2 der Verein in the deck `sport-freizeit-a2` is the small German legal form with members and a Vorstand; this word is the general one, big enough for die Weltgesundheitsorganisation and for eine Hilfsorganisation, and a body outside the state is eine Nichtregierungsorganisation.'
      ru: 'От organisieren уровня A2 из колоды `arbeit-ausbildung-a2`, женского рода, как всякое слово на -tion, множественное на -en. Какое из двух значений имеется в виду, видно по артиклю: die Organisation des Festes war schwierig — устройство, eine Organisation für Kinderrechte — объединение. der Verein уровня A2 из колоды `sport-freizeit-a2` — маленькая немецкая юридическая форма с членами и правлением; это же слово общее, достаточно широкое и для die Weltgesundheitsorganisation, и для eine Hilfsorganisation, а негосударственное объединение — eine Nichtregierungsorganisation.'
      uk: 'Від organisieren рівня A2 з колоди `arbeit-ausbildung-a2`, жіночого роду, як усяке слово на -tion, множина на -en. Яке з двох значень мається на увазі, видно з артикля: die Organisation des Festes war schwierig — влаштування, eine Organisation für Kinderrechte — об’єднання. der Verein рівня A2 з колоди `sport-freizeit-a2` — маленька німецька юридична форма з членами і правлінням; це ж слово загальне, достатньо широке і для die Weltgesundheitsorganisation, і для eine Hilfsorganisation, а недержавне об’єднання — eine Nichtregierungsorganisation.'

  # --- Die Bevölkerung und wer ihr hilft ---
  - de: Bevölkerung
    ipa: "bəˈfœlkəʁʊŋ"
    pos: noun
    gender: f
    plural: "die Bevölkerungen"
    cards: recognition
    en: all the people living in a country or a place, taken together and counted
    ru: все люди, живущие в стране или в местности, взятые вместе и посчитанные
    uk: усі люди, що живуть у країні чи в місцевості, узяті разом і полічені
    example_de: Die Bevölkerung der Stadt wächst jedes Jahr.
    example_en: The town's population grows every year.
    example_ru: Население города растёт с каждым годом.
    example_uk: Населення міста зростає щороку.
    note:
      en: 'Every noun in -ung is feminine and takes -en in the plural, though this one is nearly always singular. It is a counting word and belongs to statistics: die Bevölkerungszahl, die Bevölkerungsdichte, ein Teil der Bevölkerung. Keep it apart from das Volk, which is the same people seen as a nation with a history and is heavy with political use, and from A1 die Leute in the deck `menschen-familie`, which is the everyday plural for people in general. B1 die Mehrheit and die Minderheit in the deck `gesellschaft-zusammenleben` divide it.'
      ru: 'Всякое слово на -ung женского рода и берёт -en во множественном, хотя это почти всегда идёт в единственном. Слово счётное и принадлежит статистике: die Bevölkerungszahl, die Bevölkerungsdichte, ein Teil der Bevölkerung. Не смешивайте с das Volk — те же люди, увиденные как народ с историей, и слово тяжело от политического употребления, — и с die Leute уровня A1 из колоды `menschen-familie`, обиходным множественным для людей вообще. die Mehrheit и die Minderheit уровня B1 из колоды `gesellschaft-zusammenleben` делят её надвое.'
      uk: 'Усяке слово на -ung жіночого роду і бере -en у множині, хоча це майже завжди йде в однині. Слово лічильне і належить статистиці: die Bevölkerungszahl, die Bevölkerungsdichte, ein Teil der Bevölkerung. Не змішуйте з das Volk — ті самі люди, побачені як народ з історією, і слово важке від політичного вжитку, — і з die Leute рівня A1 з колоди `menschen-familie`, побутовою множиною для людей узагалі. die Mehrheit і die Minderheit рівня B1 з колоди `gesellschaft-zusammenleben` ділять її надвоє.'

  - de: sozial
    ipa: "zoˈtsi̯aːl"
    pos: adj
    cards: recognition
    en: to do with how people live together; and, in a second use, to do with helping those in difficulty
    ru: относящийся к тому, как люди живут вместе; а во втором употреблении — к помощи тем, кому трудно
    uk: що стосується того, як люди живуть разом; а в другому вжитку — допомоги тим, кому важко
    example_de: Der Verein kümmert sich um soziale Probleme im Viertel.
    example_en: The association deals with social problems in the neighbourhood.
    example_ru: Объединение занимается социальными проблемами квартала.
    example_uk: Об’єднання опікується соціальними проблемами кварталу.
    note:
      en: 'The two uses stand a long way apart. The descriptive one is neutral — soziale Kontakte, das soziale Netzwerk, soziale Regeln. The other is the German welfare state and is a whole vocabulary in itself: der Sozialstaat, die Sozialversicherung, das Sozialamt, die Sozialwohnung. What the word never means is sociable in the English sense of enjoying company; that is gesellig. Said of a person, ein sozialer Mensch is one who thinks of others.'
      ru: 'Два употребления стоят далеко друг от друга. Описательное нейтрально: soziale Kontakte, das soziale Netzwerk, soziale Regeln. Второе — это немецкое социальное государство и целый словарь при нём: der Sozialstaat, die Sozialversicherung, das Sozialamt, die Sozialwohnung. Чего слово не значит никогда — «общительный»: для этого есть gesellig. О человеке ein sozialer Mensch — тот, кто думает о других.'
      uk: 'Два вжитки стоять далеко один від одного. Описовий нейтральний: soziale Kontakte, das soziale Netzwerk, soziale Regeln. Другий — це німецька соціальна держава і цілий словник при ній: der Sozialstaat, die Sozialversicherung, das Sozialamt, die Sozialwohnung. Чого слово не означає ніколи — «товариський»: для цього є gesellig. Про людину ein sozialer Mensch — той, хто думає про інших.'

  - de: Sozialarbeiter
    ipa: "zoˈtsi̯aːlˌʔaʁbaɪ̯tɐ"
    pos: noun
    gender: m
    plural: "die Sozialarbeiter"
    cards: recognition
    en: a man trained and paid to help people in difficulty, on behalf of an office or an association
    ru: мужчина, обученный и нанятый помогать людям в трудном положении — от имени учреждения или объединения
    uk: чоловік, навчений і найнятий допомагати людям у скрутному становищі — від імені установи чи об’єднання
    example_de: Der Sozialarbeiter besucht die Familie einmal in der Woche.
    example_en: The social worker visits the family once a week.
    example_ru: Социальный работник навещает семью раз в неделю.
    example_uk: Соціальний працівник відвідує родину раз на тиждень.
    note:
      en: 'sozial above plus B1 der Arbeiter in the deck `arbeit-bewerbung`, and the job is a qualified one: Soziale Arbeit is a degree, usually read at a Fachhochschule, and not a volunteer role. The workplaces are das Jugendamt, die Beratungsstelle and the schools. The feminine is die Sozialarbeiterin, the next entry, and singular and plural of the masculine are spelled alike. In the transcription the second stem begins with a glottal stop, ˌʔaʁ-, because a stressed German element never starts on a bare vowel.'
      ru: 'sozial выше плюс der Arbeiter уровня B1 из колоды `arbeit-bewerbung`, и профессия эта дипломированная: Soziale Arbeit — это диплом, который чаще всего получают в Fachhochschule, а не работа на общественных началах. Места работы — das Jugendamt, die Beratungsstelle и школы. Женская пара — die Sozialarbeiterin, следующая запись, а единственное и множественное мужской формы пишутся одинаково. В транскрипции вторая основа начинается с гортанной смычки, ˌʔaʁ-, потому что ударная немецкая часть слова никогда не начинается с голого гласного.'
      uk: 'sozial вище плюс der Arbeiter рівня B1 з колоди `arbeit-bewerbung`, і фах цей дипломований: Soziale Arbeit — це диплом, який найчастіше здобувають у Fachhochschule, а не робота на громадських засадах. Місця роботи — das Jugendamt, die Beratungsstelle і школи. Жіноча пара — die Sozialarbeiterin, наступний запис, а однина і множина чоловічої форми пишуться однаково. У транскрипції друга основа починається з гортанного зімкнення, ˌʔaʁ-, бо наголошена німецька частина слова ніколи не починається з голого голосного.'

  - de: Sozialarbeiterin
    ipa: "zoˈtsi̯aːlˌʔaʁbaɪ̯təʁɪn"
    pos: noun
    gender: f
    plural: "die Sozialarbeiterinnen"
    cards: recognition
    en: a woman trained and paid to help people in difficulty, on behalf of an office or an association
    ru: женщина, обученная и нанятая помогать людям в трудном положении — от имени учреждения или объединения
    uk: жінка, навчена і найнята допомагати людям у скрутному становищі — від імені установи чи об’єднання
    example_de: Eine Sozialarbeiterin berät die Eltern kostenlos.
    example_en: A social worker advises the parents free of charge.
    example_ru: Социальная работница консультирует родителей бесплатно.
    example_uk: Соціальна працівниця консультує батьків безкоштовно.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n, and the stress stays on -zi-, where the masculine put it. The field is worth one distinction: die Sozialarbeiterin works with people who have asked for help or been referred, die Sozialpädagogin does the same training with a stronger emphasis on children and young people, and the two titles are often used for the same post. B1 die Betreuerin in the deck `berufe-b1` looks after somebody day to day; this one arranges what the office owes them.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается, ударение остаётся на -zi-, там же, где в мужской форме. В самой области стоит провести одно различие: die Sozialarbeiterin работает с теми, кто попросил помощи или был направлен, die Sozialpädagogin проходит то же обучение с большим упором на детей и подростков, и оба названия нередко стоят над одной и той же должностью. die Betreuerin уровня B1 из колоды `berufe-b1` присматривает изо дня в день; эта же добивается того, что человеку положено от учреждения.'
      uk: 'Звичайна моція на -in, у множині n подвоюється, наголос лишається на -zi-, там само, де в чоловічій формі. У самій царині варто провести одну різницю: die Sozialarbeiterin працює з тими, хто попросив допомоги або був скерований, die Sozialpädagogin проходить те саме навчання з більшим наголосом на дітях і підлітках, і обидві назви нерідко стоять над однією й тією ж посадою. die Betreuerin рівня B1 з колоди `berufe-b1` наглядає день у день; ця ж домагається того, що людині належить від установи.'

  - de: behindern
    ipa: "bəˈhɪndɐn"
    pos: verb
    praesens_3sg: behindert
    partizip2: behindert
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to get in the way of something so that it goes more slowly or not at all
    ru: мешать чему-либо так, что оно идёт медленнее или не идёт вовсе
    uk: заважати чомусь так, що воно йде повільніше або не йде зовсім
    example_de: Der Unfall behindert den Verkehr auf der Autobahn.
    example_en: The accident is holding up the traffic on the motorway.
    example_ru: Авария затрудняет движение на автобане.
    example_uk: Аварія ускладнює рух на автобані.
    note:
      en: 'Weak, inseparable and always with an accusative object: den Verkehr behindern, die Arbeit behindern, jemanden bei der Arbeit behindern. A2 stören in the deck `verben-handlungen-a2-2` is about the noise and the annoyance, this one about the obstacle in the way. Traffic reports use it constantly, and the noun for that sense is die Behinderung, which also names a person''s disability — the same word doing two very different jobs, which is why the adjective behindert below has to be handled with care.'
      ru: 'Слабый, неотделяемый и всегда с винительным дополнением: den Verkehr behindern, die Arbeit behindern, jemanden bei der Arbeit behindern. stören уровня A2 из колоды `verben-handlungen-a2-2` — про шум и досаду, а этот глагол — про препятствие на пути. Сводки о движении употребляют его без конца, а существительное в этом значении — die Behinderung, которое называет ещё и инвалидность человека: одно слово на две очень разные работы, — потому и с прилагательным behindert ниже надо обращаться осторожно.'
      uk: 'Слабке, невідокремлюване і завжди зі знахідним додатком: den Verkehr behindern, die Arbeit behindern, jemanden bei der Arbeit behindern. stören рівня A2 з колоди `verben-handlungen-a2-2` — про шум і прикрість, а це дієслово — про перешкоду на шляху. Зведення про рух уживають його без кінця, а іменник у цьому значенні — die Behinderung, який називає ще й інвалідність людини: одне слово на дві дуже різні роботи, — тому й із прикметником behindert нижче треба поводитися обережно.'

  - de: behindert
    ipa: "bəˈhɪndɐt"
    pos: adj
    cards: recognition
    en: living with a lasting physical or mental impairment
    ru: живущий с длительным телесным или психическим нарушением
    uk: що живе з тривалим тілесним або психічним порушенням
    example_de: Der Bus hat vorne Plätze für behinderte Menschen.
    example_en: The bus has seats at the front for disabled people.
    example_ru: В передней части автобуса есть места для людей с инвалидностью.
    example_uk: У передній частині автобуса є місця для людей з інвалідністю.
    note:
      en: 'Formally the participle of behindern above, and the metaphor inside it is the reason careful German has moved on: today the preferred wording puts the person first, Menschen mit Behinderung, and self-advocacy organisations use it in their own names. behinderte Menschen is still ordinary in laws, signs and everyday speech and is not an insult, but the bare word used of a person or a thing as a playground slur is, and a learner should never reach for it that way. The plain, positive word on a sign is barrierefrei, step-free and reachable by everyone. The German for a lift with no steps to it is ein barrierefreier Zugang.'
      ru: 'Формально это причастие от behindern выше, и метафора внутри него — причина, по которой осторожный немецкий пошёл дальше: сегодня предпочтительная формулировка ставит человека первым, Menschen mit Behinderung, и организации самих этих людей употребляют её в собственных названиях. behinderte Menschen по-прежнему обычно в законах, на табличках и в живой речи и оскорблением не является, — но голое слово, брошенное о человеке или о вещи как дворовая ругань, оскорбительно, и учащемуся так браться за него не следует. Простое и положительное слово на табличке — barrierefrei: без ступеней и доступно каждому. Вход без препятствий — ein barrierefreier Zugang.'
      uk: 'Формально це дієприкметник від behindern вище, і метафора всередині нього — причина, з якої обережна німецька пішла далі: сьогодні бажане формулювання ставить людину першою, Menschen mit Behinderung, і організації самих цих людей уживають його у власних назвах. behinderte Menschen і далі звичне в законах, на табличках і в живому мовленні та образою не є, — але голе слово, кинуте про людину чи про річ як дворова лайка, образливе, і учневі так братися за нього не варто. Просте і позитивне слово на табличці — barrierefrei: без сходинок і доступно кожному. Вхід без перешкод — ein barrierefreier Zugang.'

  - de: Mobilität
    ipa: "mobiliˈtɛːt"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the ability and the readiness to move, whether from place to place or from one position in life to another
    ru: способность и готовность перемещаться — с места на место или с одной жизненной ступени на другую
    uk: здатність і готовність пересуватися — з місця на місце або з одного життєвого щабля на інший
    example_de: Die neue Stelle verlangt viel Mobilität.
    example_en: The new job demands a lot of mobility.
    example_ru: Новая должность требует большой мобильности.
    example_uk: Нова посада вимагає великої мобільності.
    note:
      en: 'Every noun in -tät is feminine, stressed on that ending and without a plural; the adjective behind it is B1 mobil in the deck `computer-internet-b1`. Three senses share it. A job advert means being willing to move house or to travel. A transport plan means getting about at all: die Elektromobilität, das Mobilitätskonzept einer Stadt. A sociologist means moving between social positions, die soziale Mobilität. Which one is meant is always decided by the text around it.'
      ru: 'Всякое слово на -tät женского рода, ударно на этом окончании и без множественного числа; за ним стоит прилагательное mobil уровня B1 из колоды `computer-internet-b1`. Три значения делят это слово. Объявление о работе имеет в виду готовность переехать или разъезжать. Транспортный план — саму возможность передвигаться: die Elektromobilität, das Mobilitätskonzept einer Stadt. Социолог — переход между общественными положениями: die soziale Mobilität. Какое из трёх, всегда решает окружающий текст.'
      uk: 'Усяке слово на -tät жіночого роду, наголошене на цьому закінченні й без множини; за ним стоїть прикметник mobil рівня B1 з колоди `computer-internet-b1`. Три значення ділять це слово. Оголошення про роботу має на увазі готовність переїхати або роз’їжджати. Транспортний план — саму змогу пересуватися: die Elektromobilität, das Mobilitätskonzept einer Stadt. Соціолог — перехід між суспільними становищами: die soziale Mobilität. Яке з трьох, завжди вирішує навколишній текст.'

  # --- Was eine Gesellschaft weitergibt ---
  - de: Tradition
    ipa: "tʁadiˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "die Traditionen"
    cards: recognition
    en: something a group has done the same way for a long time and hands on to the next generation
    ru: то, что группа долгое время делает одинаково и передаёт следующему поколению
    uk: те, що група тривалий час робить однаково і передає наступному поколінню
    example_de: Das Essen am 24. Dezember ist in dieser Familie eine alte Tradition.
    example_en: The meal on the twenty-fourth of December is an old tradition in this family.
    example_ru: Ужин двадцать четвёртого декабря — старая традиция в этой семье.
    example_uk: Вечеря двадцять четвертого грудня — давня традиція в цій родині.
    note:
      en: 'Feminine, stress on the last syllable, plural in -en. Chunks: eine Tradition haben, eine Tradition pflegen, aus Tradition, and the frame es ist Tradition, dass … Beside it der Brauch is one single custom you can point at, and B1 die Gewohnheit in the deck `gesundheit-wohlbefinden` is a habit of one person rather than of a group. The adjective is traditionell, next.'
      ru: 'Женский род, ударение на последнем слоге, множественное на -en. Обороты: eine Tradition haben, eine Tradition pflegen, aus Tradition, — а также рамка es ist Tradition, dass … Рядом der Brauch — один отдельный обычай, на который можно указать пальцем, а die Gewohnheit уровня B1 из колоды `gesundheit-wohlbefinden` — привычка одного человека, а не группы. Прилагательное — traditionell, следующая запись.'
      uk: 'Жіночий рід, наголос на останньому складі, множина на -en. Звороти: eine Tradition haben, eine Tradition pflegen, aus Tradition, — а також рамка es ist Tradition, dass … Поряд der Brauch — один окремий звичай, на який можна вказати пальцем, а die Gewohnheit рівня B1 з колоди `gesundheit-wohlbefinden` — звичка однієї людини, а не групи. Прикметник — traditionell, наступний запис.'

  - de: traditionell
    ipa: "tʁaditsi̯oˈnɛl"
    pos: adj
    cards: recognition
    en: done the way it has long been done, and for that reason
    ru: делаемый так, как делалось издавна, и именно по этой причине
    uk: що робиться так, як робилося здавна, і саме з цієї причини
    example_de: Am Sonntag gibt es hier traditionell Kuchen.
    example_en: Here there is traditionally cake on Sundays.
    example_ru: По воскресеньям здесь по традиции пекут пирог.
    example_uk: По неділях тут за традицією печуть пиріг.
    note:
      en: 'From die Tradition above, with the stress again at the end, on -nell. It works as an adjective and, unchanged, as an adverb, which is what the example shows: traditionelle Kleidung, ein traditionelles Fest, but traditionell isst man … The word describes and does not judge; the judging word is altmodisch, old-fashioned, and its opposite is A1 modern in the deck `kleidung-farben`. Careful with the spelling: one l in the middle of Tradition, two at the end here.'
      ru: 'От die Tradition выше, ударение снова на конце, на -nell. Слово работает и как прилагательное, и без изменений как наречие — это и показывает пример: traditionelle Kleidung, ein traditionelles Fest, но traditionell isst man … Слово описывает и не оценивает; оценивает altmodisch — «старомодный», а противоположность — modern уровня A1 из колоды `kleidung-farben`. Осторожно с написанием: в середине Tradition одно l, а здесь на конце два.'
      uk: 'Від die Tradition вище, наголос знову в кінці, на -nell. Слово працює і як прикметник, і без змін як прислівник — це й показує приклад: traditionelle Kleidung, ein traditionelles Fest, але traditionell isst man … Слово описує і не оцінює; оцінює altmodisch — «старомодний», а протилежність — modern рівня A1 з колоди `kleidung-farben`. Обережно з написанням: усередині Tradition одне l, а тут у кінці два.'

  - de: Gott
    ipa: "ˈgɔt"
    pos: noun
    gender: m
    plural: "die Götter"
    cards: recognition
    en: the single being the monotheistic religions worship; also, in the plural and with an article, any of the many beings an older religion worshipped
    ru: единое существо, которому поклоняются монотеистические религии; а также, во множественном и с артиклем, любое из многих божеств древней религии
    uk: єдина істота, якій поклоняються монотеїстичні релігії; а також, у множині й з артиклем, будь-яке з багатьох божеств давньої релігії
    example_de: Meine Großmutter glaubt an Gott.
    example_en: My grandmother believes in God.
    example_ru: Моя бабушка верит в Бога.
    example_uk: Моя бабуся вірить у Бога.
    note:
      en: 'Two grammars in one word. Meant as the one God it is a name: capital G, no article at all, as in the example — an Gott glauben, zu Gott beten. Meant as one of many it is an ordinary countable noun with an umlaut in the plural: die Götter der Griechen, ein alter Gott. Two fixed phrases carry no belief with them and are said by everybody: Gott sei Dank for thank goodness, and um Gottes willen for heavens above. In the south and in Austria the greeting is Grüß Gott, which the note on B1 grüßen in the deck `sprechen-lernen-b1` already names. The feminine is die Göttin.'
      ru: 'Две грамматики в одном слове. В значении единого Бога это имя: заглавная буква, никакого артикля — как в примере: an Gott glauben, zu Gott beten. В значении одного из многих это обычное исчисляемое существительное с умлаутом во множественном: die Götter der Griechen, ein alter Gott. Два устойчивых оборота никакой веры за собой не тянут и звучат от всех: Gott sei Dank — «слава богу» и um Gottes willen — «боже упаси». На юге и в Австрии приветствие — Grüß Gott, которое примечание к grüßen уровня B1 из колоды `sprechen-lernen-b1` уже называет. Женская пара — die Göttin.'
      uk: 'Дві граматики в одному слові. У значенні єдиного Бога це ім’я: велика літера, жодного артикля — як у прикладі: an Gott glauben, zu Gott beten. У значенні одного з багатьох це звичайний злічуваний іменник з умлаутом у множині: die Götter der Griechen, ein alter Gott. Два усталені звороти жодної віри за собою не тягнуть і звучать від усіх: Gott sei Dank — «слава богу» і um Gottes willen — «боже борони». На півдні та в Австрії вітання — Grüß Gott, яке примітка до grüßen рівня B1 з колоди `sprechen-lernen-b1` уже називає. Жіноча пара — die Göttin.'
