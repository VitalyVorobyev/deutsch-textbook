      en: 'Impersonal like blitzen and donnern above: es hagelt, es hat gehagelt. The ice itself is der Hagel and one ball of it das Hagelkorn. Figuratively the verb takes a plural of whatever is coming down thick and fast: Es hagelte Kritik, Es hagelte Tore. The -eln ending gives a syllabic l after the g: ˈhaːgl̩n.'
      ru: 'Безличный, как blitzen и donnern выше: es hagelt, es hat gehagelt. Сам лёд — der Hagel, а одна градина — das Hagelkorn. В переносном значении глагол берёт множественное того, что сыплется густо и часто: Es hagelte Kritik, Es hagelte Tore. Окончание -eln даёт слоговое l после g: ˈhaːgl̩n.'
      uk: 'Безособове, як blitzen і donnern вище: es hagelt, es hat gehagelt. Сам лід — der Hagel, а одна градина — das Hagelkorn. У переносному значенні дієслово бере множину того, що сиплеться густо й часто: Es hagelte Kritik, Es hagelte Tore. Закінчення -eln дає складове l після g: ˈhaːgl̩n.'

  - de: Sturm
    ipa: "ˈʃtʊʁm"
    pos: noun
    gender: m
    plural: "die Stürme"
    cards: recognition
    en: wind strong enough to do damage
    ru: ветер такой силы, что причиняет ущерб
    uk: вітер такої сили, що завдає шкоди
    example_de: Bei dem Sturm sind viele Bäume gefallen.
    example_en: A lot of trees came down in the storm.
    example_ru: Во время бури упало много деревьев.
    example_uk: Під час бурі впало багато дерев.
    note:
      en: 'Masculine, plural with an umlaut: der Sturm, die Stürme. A1 der Wind in the deck `wetter-natur` is any moving air; this word is the strength at which it becomes news, and the warning issued for it is die Sturmwarnung. The verb stürmen is impersonal about weather — es stürmt — and takes a subject about people storming a place. In football der Sturm is the attacking line and der Stürmer the forward.'
      ru: 'Мужской род, во множественном умлаут: der Sturm, die Stürme. der Wind уровня A1 из колоды `wetter-natur` — всякий движущийся воздух; это слово — та сила, при которой он попадает в новости, а предупреждение о нём — die Sturmwarnung. Глагол stürmen о погоде безличен — es stürmt, — а о людях, берущих штурмом, имеет подлежащее. В футболе der Sturm — линия нападения, а der Stürmer — нападающий.'
      uk: 'Чоловічий рід, у множині умлаут: der Sturm, die Stürme. der Wind рівня A1 з колоди `wetter-natur` — усяке рухоме повітря; це слово — та сила, за якої воно потрапляє в новини, а попередження про нього — die Sturmwarnung. Дієслово stürmen про погоду безособове — es stürmt, — а про людей, що беруть штурмом, має підмет. У футболі der Sturm — лінія нападу, а der Stürmer — нападник.'

  # --- Wärme, Kälte, Feuchtigkeit ---
  - de: Temperatur
    ipa: "tɛmpəʁaˈtuːɐ̯"
    pos: noun
    gender: f
    plural: "die Temperaturen"
    cards: recognition
    en: how warm or cold something is, stated as a number
    ru: степень тепла или холода, выраженная числом
    uk: ступінь тепла або холоду, виражений числом
    example_de: Die Temperatur fällt heute Nacht unter null.
    example_en: The temperature is falling below zero tonight.
    example_ru: Сегодня ночью температура опустится ниже нуля.
    example_uk: Сьогодні вночі температура опуститься нижче нуля.
    note:
      en: 'A Latin loan, feminine like every noun in -ur, with the stress on the last syllable and the final r vocalized: tɛmpəʁaˈtuːɐ̯. What it is measured in is A1 der Grad in the deck `wetter-natur`, whose own note carries the rule that Grad takes no plural ending after a number. The verbs are steigen and fallen. In medicine erhöhte Temperatur is a raised temperature, and A1 das Fieber in the deck `koerper-gesundheit` is the illness itself.'
      ru: 'Латинское заимствование, женского рода — как всякое существительное на -ur, — с ударением на последнем слоге и вокализованным конечным r: tɛmpəʁaˈtuːɐ̯. Измеряется она в der Grad уровня A1 из колоды `wetter-natur`, чьё примечание уже несёт правило: после числительного Grad не берёт окончания множественного. Глаголы при ней — steigen и fallen. В медицине erhöhte Temperatur — повышенная температура, а das Fieber уровня A1 из колоды `koerper-gesundheit` — уже сама болезненная лихорадка.'
      uk: 'Латинське запозичення, жіночого роду — як усякий іменник на -ur, — з наголосом на останньому складі й вокалізованим кінцевим r: tɛmpəʁaˈtuːɐ̯. Вимірюється вона в der Grad рівня A1 з колоди `wetter-natur`, чия примітка вже несе правило: після числівника Grad не бере закінчення множини. Дієслова при ній — steigen і fallen. У медицині erhöhte Temperatur — підвищена температура, а das Fieber рівня A1 з колоди `koerper-gesundheit` — уже сама хвороблива гарячка.'

  - de: Hitze
    ipa: "ˈhɪtsə"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: an amount of heat that is more than comfortable, the kind that makes a day hard to get through
    ru: жара — тепло в таком избытке, от которого день делается тяжёлым
    uk: спека — тепло в такому надлишку, від якого день стає важким
    example_de: Bei dieser Hitze bleiben wir lieber zu Hause.
    example_en: In this heat we would rather stay at home.
    example_ru: В такую жару мы лучше останемся дома.
    example_uk: У таку спеку ми краще залишимося вдома.
    note:
      en: 'Feminine and uncountable, and it is the noun beside A1 heiß in the deck `wetter-natur`, as die Kälte below is the noun beside A1 kalt. It is always too much of a good thing: German says viel Hitze and never counts it. The official warning is die Hitzewelle. In a kitchen the word is the setting on a hob: bei starker Hitze braten.'
      ru: 'Женский род, неисчисляемое, и это существительное при heiß уровня A1 из колоды `wetter-natur`, как die Kälte ниже — существительное при kalt уровня A1. Это всегда избыток: немец говорит viel Hitze и никогда её не считает. Официальное предупреждение — die Hitzewelle. На кухне слово называет силу огня: bei starker Hitze braten.'
      uk: 'Жіночий рід, незлічуване, і це іменник при heiß рівня A1 з колоди `wetter-natur`, як die Kälte нижче — іменник при kalt рівня A1. Це завжди надлишок: німець каже viel Hitze і ніколи її не рахує. Офіційне попередження — die Hitzewelle. На кухні слово називає силу вогню: bei starker Hitze braten.'

  - de: Wärme
    ipa: "ˈvɛʁmə"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: warmth as a comfortable amount of heat; also warmth of manner
    ru: тепло в приятном количестве; а также душевная теплота
    uk: тепло в приємній кількості; а також душевна теплота
    example_de: Im Winter kommt die Wärme aus der Heizung.
    example_en: In winter the warmth comes from the radiators.
    example_ru: Зимой тепло идёт от батарей.
    example_uk: Узимку тепло йде від батарей.
    note:
      en: 'Feminine and uncountable, formed from A1 warm in the deck `wetter-natur` with an umlaut and the -e that turns an adjective into the quality it names. The scale runs die Kälte, die Wärme, die Hitze, and only the middle one is comfortable. It describes people too: Sie hat ihn mit großer Wärme begrüßt. In a bill or a leaflet it is the physical quantity, and district heating is die Fernwärme.'
      ru: 'Женский род, неисчисляемое, образовано от warm уровня A1 из колоды `wetter-natur` умлаутом и тем -e, которое превращает прилагательное в названное им качество. Шкала идёт die Kälte, die Wärme, die Hitze, и приятна только середина. Слово описывает и людей: Sie hat ihn mit großer Wärme begrüßt. В счёте или в проспекте это физическая величина, а централизованное отопление — die Fernwärme.'
      uk: 'Жіночий рід, незлічуване, утворене від warm рівня A1 з колоди `wetter-natur` умлаутом і тим -e, яке перетворює прикметник на названу ним якість. Шкала йде die Kälte, die Wärme, die Hitze, і приємна тільки середина. Слово описує й людей: Sie hat ihn mit großer Wärme begrüßt. У рахунку чи в проспекті це фізична величина, а централізоване опалення — die Fernwärme.'

  - de: Kälte
    ipa: "ˈkɛltə"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: cold as a condition, strong enough to be felt as a force
    ru: холод как состояние, ощущаемое как сила
    uk: холод як стан, відчутний як сила
    example_de: Bei dieser Kälte will niemand nach draußen.
    example_en: In this cold nobody wants to go outside.
    example_ru: В такой холод никто не хочет на улицу.
    example_uk: У такий холод ніхто не хоче надвір.
    note:
      en: 'Feminine and uncountable, from A1 kalt in the deck `wetter-natur` by the same umlaut-plus-e that made die Wärme above. Of people it names the absence of feeling: jemanden mit Kälte behandeln. A cold spell is die Kältewelle, and the sudden onset of one is der Kälteeinbruch — B1 der Einbruch in the deck `recht-kriminalitaet-b1` supplies the second half, and its own note already gives that compound.'
      ru: 'Женский род, неисчисляемое, от kalt уровня A1 из колоды `wetter-natur` тем же умлаутом с -e, каким образована die Wärme выше. О людях слово называет отсутствие чувства: jemanden mit Kälte behandeln. Полоса холодов — die Kältewelle, а её внезапное наступление — der Kälteeinbruch: вторую половину даёт der Einbruch уровня B1 из колоды `recht-kriminalitaet-b1`, и его собственное примечание это сложное слово уже приводит.'
      uk: 'Жіночий рід, незлічуване, від kalt рівня A1 з колоди `wetter-natur` тим самим умлаутом із -e, яким утворена die Wärme вище. Про людей слово називає відсутність почуття: jemanden mit Kälte behandeln. Смуга холодів — die Kältewelle, а її раптовий прихід — der Kälteeinbruch: другу половину дає der Einbruch рівня B1 з колоди `recht-kriminalitaet-b1`, і його власна примітка це складне слово вже наводить.'

  - de: frieren
    ipa: "ˈfʁiːʁən"
    pos: verb
    praesens_3sg: friert
    partizip2: gefroren
    aux: haben
    cards: recognition
    en: to feel cold; and, of water, to turn into ice
    ru: мёрзнуть; а о воде — превращаться в лёд
    uk: мерзнути; а про воду — перетворюватися на лід
    example_de: Ich habe die ganze Nacht gefroren.
    example_en: I was cold all night.
    example_ru: Я мёрз всю ночь.
    example_uk: Я мерз цілу ніч.
    note:
      en: 'Strong, with three stem vowels: friert, fror, gefroren. In the sense of feeling cold the auxiliary is haben — ich habe gefroren — and the same idea can be put impersonally with the person in the accusative: es friert mich, which is the older and more literary frame. Where water turns to ice the verb takes sein instead: Der See ist gefroren. In everyday speech mir ist kalt is the commoner way to say the first one.'
      ru: 'Сильный, с тремя корневыми гласными: friert, fror, gefroren. В значении «мёрзнуть» вспомогательный глагол haben — ich habe gefroren, — а ту же мысль можно оформить безлично, с человеком в винительном: es friert mich; это оборот более старый и книжный. Там, где вода превращается в лёд, глагол берёт sein: Der See ist gefroren. В обиходе чаще говорят mir ist kalt.'
      uk: 'Сильне, з трьома кореневими голосними: friert, fror, gefroren. У значенні «мерзнути» допоміжне дієслово haben — ich habe gefroren, — а ту саму думку можна оформити безособово, з людиною у знахідному: es friert mich; це зворот давніший і книжніший. Там, де вода перетворюється на лід, дієслово бере sein: Der See ist gefroren. У побуті частіше кажуть mir ist kalt.'

  - de: feucht
    ipa: "ˈfɔʏ̯çt"
    pos: adj
    cards: recognition
    en: slightly wet, with water still in it
    ru: слегка влажный, с оставшейся внутри водой
    uk: злегка вологий, із водою, що лишилася всередині
    example_de: Die Wäsche ist noch feucht.
    example_en: The washing is still damp.
    example_ru: Бельё ещё влажное.
    example_uk: Білизна ще волога.
    note:
      en: 'It sits between A2 nass and A2 trocken in the deck `natur-tiere-a2`: nass is wet through, feucht is damp. Weather is feucht when the air carries water — feuchte Luft, ein feuchtes Klima, with A1 die Luft and A1 das Klima both in the deck `wetter-natur` — and so are walls, cloths and cellars. The noun is die Feuchtigkeit, which is what a forecast gives as a percentage. The eu is spoken ɔʏ̯.'
      ru: 'Слово стоит между nass и trocken уровня A2 из колоды `natur-tiere-a2`: nass — мокрый насквозь, feucht — влажный. Погода feucht, когда в воздухе вода: feuchte Luft, ein feuchtes Klima, — и die Luft, и das Klima уровня A1 стоят в колоде `wetter-natur`; так же говорят о стенах, тряпках и подвалах. Существительное — die Feuchtigkeit, и именно её прогноз даёт в процентах. Сочетание eu звучит как ɔʏ̯.'
      uk: 'Слово стоїть між nass і trocken рівня A2 з колоди `natur-tiere-a2`: nass — мокрий наскрізь, feucht — вологий. Погода feucht, коли в повітрі вода: feuchte Luft, ein feuchtes Klima, — і die Luft, і das Klima рівня A1 стоять у колоді `wetter-natur`; так само кажуть про стіни, ганчірки і підвали. Іменник — die Feuchtigkeit, і саме її прогноз дає у відсотках. Сполука eu звучить як ɔʏ̯.'

  - de: Nebel
    ipa: "ˈneːbl̩"
    pos: noun
    gender: m
    plural: "die Nebel"
    cards: recognition
    en: thick cloud lying on the ground, so that little can be seen
    ru: густое облако, лежащее у земли, из-за которого почти ничего не видно
    uk: густа хмара, що лежить біля землі, через яку майже нічого не видно
    example_de: Am Morgen war der Nebel so stark, dass man nichts sah.
    example_en: The fog was so thick in the morning that nothing could be seen.
    example_ru: Утром туман был таким густым, что ничего не было видно.
    example_uk: Уранці туман був таким густим, що нічого не було видно.
    note:
      en: 'Masculine, and singular and plural are spelled alike. A2 neblig in the deck `natur-tiere-a2` is the adjective, and its own note already names this word and the stem vowel that drops out on the way to it. A driver meets die Nebelbank, a patch of it, and switches on die Nebelscheinwerfer. The -el ending gives a syllabic l: ˈneːbl̩.'
      ru: 'Мужской род, единственное и множественное пишутся одинаково. neblig уровня A2 из колоды `natur-tiere-a2` — прилагательное, и его собственное примечание уже называет это слово и гласный корня, выпадающий по дороге к нему. Водитель встречает die Nebelbank — полосу тумана — и включает die Nebelscheinwerfer. Окончание -el даёт слоговое l: ˈneːbl̩.'
      uk: 'Чоловічий рід, однина і множина пишуться однаково. neblig рівня A2 з колоди `natur-tiere-a2` — прикметник, і його власна примітка вже називає це слово і голосний кореня, що випадає дорогою до нього. Водій зустрічає die Nebelbank — смугу туману — і вмикає die Nebelscheinwerfer. Закінчення -el дає складове l: ˈneːbl̩.'

  - de: Wettervorhersage
    ipa: "ˈvɛtɐˌfoːɐ̯heːɐ̯zaːgə"
    pos: noun
    gender: f
    plural: "die Wettervorhersagen"
    cards: recognition
    en: the statement of what the weather is expected to do over the coming days
    ru: сообщение о том, какой погоды ждать в ближайшие дни
    uk: повідомлення про те, якої погоди чекати найближчими днями
    example_de: Nach der Wettervorhersage soll es morgen regnen.
    example_en: According to the forecast it is going to rain tomorrow.
    example_ru: По прогнозу завтра обещают дождь.
    example_uk: За прогнозом завтра обіцяють дощ.
    note:
      en: 'A1 das Wetter in the deck `wetter-natur` plus die Vorhersage, from vorhersagen, to say in advance; it takes the gender of Vorhersage and a regular -n plural. B1 der Wetterbericht in the deck `meinung-medien` is the media item you watch or read, and its own note already sends the learner to die Vorhersage — this entry is that word, spelt out. Primary stress on Wetter-, and every r in the word is vocalized.'
      ru: 'das Wetter уровня A1 из колоды `wetter-natur` плюс die Vorhersage — от vorhersagen, «предсказывать»; род берётся у Vorhersage, множественное обычное на -n. der Wetterbericht уровня B1 из колоды `meinung-medien` — это медийный выпуск, который смотрят или читают, и его собственное примечание уже отсылает учащегося к die Vorhersage: здесь это слово и стоит целиком. Главное ударение на Wetter-, а все r в слове вокализованы.'
      uk: 'das Wetter рівня A1 з колоди `wetter-natur` плюс die Vorhersage — від vorhersagen, «передбачати»; рід береться у Vorhersage, множина звичайна на -n. der Wetterbericht рівня B1 з колоди `meinung-medien` — це медійний випуск, який дивляться або читають, і його власна примітка вже відсилає учня до die Vorhersage: тут це слово і стоїть цілком. Головний наголос на Wetter-, а всі r у слові вокалізовані.'
