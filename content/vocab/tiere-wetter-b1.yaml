    ru: глухой раскатистый звук, который идёт вслед за вспышкой молнии
    uk: глухий розкотистий звук, що йде услід за спалахом блискавки
    example_de: Nach dem Blitz kam ein lauter Donner.
    example_en: A loud clap of thunder followed the lightning.
    example_ru: После молнии раздался громкий раскат грома.
    example_uk: Після блискавки пролунав гучний розкіт грому.
    note:
      en: 'Masculine, and in practice singular only: Duden records a plural, but a text says viel Donner rather than counting them. The verb is donnern above. The compound das Donnerwetter is a scolding rather than a storm — es gab ein Donnerwetter — and as an exclamation it is a mild oath.'
      ru: 'Мужской род и на практике только единственное: Duden фиксирует множественное, но текст скажет viel Donner, а не станет их считать. Глагол — donnern выше. Сложное слово das Donnerwetter — это разнос, а не гроза: es gab ein Donnerwetter, — а как возглас оно мягкое ругательство.'
      uk: 'Чоловічий рід і на практиці лише однина: Duden фіксує множину, але текст скаже viel Donner, а не рахуватиме їх. Дієслово — donnern вище. Складне слово das Donnerwetter — це прочухан, а не гроза: es gab ein Donnerwetter, — а як вигук воно м’яка лайка.'

  - de: hageln
    ipa: "ˈhaːgl̩n"
    pos: verb
    praesens_3sg: hagelt
    partizip2: gehagelt
    aux: haben
    cards: recognition
