    note:
      en: 'From richten, and singular and plural look alike. B1 der Anwalt in the deck `berufe-b1` already names this word in its own note and sorts the three roles: the Anwalt speaks for one side, der Staatsanwalt brings the charge, and the Richter decides between them. Chunks: vor den Richter kommen, der Richter verkündet das Urteil. Sport borrowed the word whole for der Schiedsrichter, the referee. The feminine is die Richterin, the next entry.'
      ru: 'От richten, единственное и множественное на вид одинаковы. der Anwalt уровня B1 из колоды `berufe-b1` уже называет это слово в своём примечании и разводит три роли: Anwalt говорит за одну сторону, der Staatsanwalt поддерживает обвинение, а Richter решает между ними. Обороты: vor den Richter kommen, der Richter verkündet das Urteil. Спорт взял слово целиком в der Schiedsrichter — судья на поле. Женская пара — die Richterin, следующая запись.'
      uk: 'Від richten, однина і множина на вигляд однакові. der Anwalt рівня B1 з колоди `berufe-b1` уже називає це слово у своїй примітці і розводить три ролі: Anwalt говорить за один бік, der Staatsanwalt підтримує обвинувачення, а Richter вирішує між ними. Звороти: vor den Richter kommen, der Richter verkündet das Urteil. Спорт узяв слово цілком у der Schiedsrichter — суддя на полі. Жіноча пара — die Richterin, наступний запис.'

  - de: Richterin
    ipa: "ˈʁɪçtəʁɪn"
