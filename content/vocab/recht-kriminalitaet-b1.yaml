    example_uk: Свідок точно пам’ятав автівку.
    note:
      en: 'A weak masculine, so -en everywhere except the nominative singular: der Zeuge, den Zeugen, dem Zeugen, des Zeugen, die Zeugen — exactly like A1 der Kollege in the deck `termine-a1` and A2 der Polizist in the deck `berufe-a2`, and the trap is that the bare form is the one shape you rarely need. Chunks: als Zeuge aussagen, Zeuge eines Unfalls sein. The feminine die Zeugin is next and is an ordinary -in noun: the weak declension stops there, as it does with A1 die Kollegin.'
      ru: 'Слабое существительное мужского рода: -en везде, кроме именительного единственного — der Zeuge, den Zeugen, dem Zeugen, des Zeugen, die Zeugen, — ровно как der Kollege уровня A1 из колоды `termine-a1` и der Polizist уровня A2 из колоды `berufe-a2`; ловушка в том, что голая форма нужна реже всех. Обороты: als Zeuge aussagen, Zeuge eines Unfalls sein. Женская пара die Zeugin — следующая запись, и это обычное существительное на -in: слабое склонение на ней обрывается, как и у die Kollegin уровня A1.'
      uk: 'Слабкий іменник чоловічого роду: -en усюди, крім називного однини — der Zeuge, den Zeugen, dem Zeugen, des Zeugen, die Zeugen, — точно як der Kollege рівня A1 з колоди `termine-a1` і der Polizist рівня A2 з колоди `berufe-a2`; пастка в тому, що гола форма потрібна найрідше. Звороти: als Zeuge aussagen, Zeuge eines Unfalls sein. Жіноча пара die Zeugin — наступний запис, і це звичайний іменник на -in: слабке відмінювання на ній уривається, як і в die Kollegin рівня A1.'

  - de: Zeugin
    ipa: "ˈtsɔʏ̯gɪn"
    pos: noun
    gender: f
    plural: "die Zeuginnen"
    cards: recognition
    en: a woman who saw what happened and is asked to say so
    ru: женщина, которая видела происшедшее и которую просят об этом рассказать
    uk: жінка, яка бачила те, що сталося, і яку просять про це розповісти
    example_de: Die Zeugin hat alles vom Fenster aus gesehen.
    example_en: The witness saw everything from the window.
    example_ru: Свидетельница видела всё из окна.
    example_uk: Свідкиня бачила все з вікна.
    note:
      en: 'Movierung with -in on the stem Zeug-, so the e of Zeuge drops out; plural with a doubled n and no case endings at all. A summons is addressed to whichever form fits, and the neutral plural for a mixed group is die Zeugen. What she gives in court is die Aussage, and to give it is aussagen.'
      ru: 'Мовирование на -in по основе Zeug-, поэтому e из Zeuge выпадает; во множественном n удваивается, а падежных окончаний нет вовсе. Повестка адресуется той форме, которая подходит, а нейтральное множественное для смешанной группы — die Zeugen. То, что она даёт в суде, — die Aussage, а давать показания — aussagen.'
      uk: 'Моція на -in за основою Zeug-, тому e з Zeuge випадає; у множині n подвоюється, а відмінкових закінчень немає зовсім. Повістка адресується тій формі, яка підходить, а нейтральна множина для змішаної групи — die Zeugen. Те, що вона дає в суді, — die Aussage, а давати свідчення — aussagen.'

  - de: Urteil
    ipa: "ˈʊʁtaɪ̯l"
    pos: noun
    gender: n
    plural: "die Urteile"
    cards: recognition
    en: the decision a court hands down at the end of a case; outside court, a settled opinion somebody stands behind
    ru: решение, которое суд выносит в конце дела; а вне суда — сложившееся мнение, за которое человек отвечает
    uk: рішення, яке суд ухвалює наприкінці справи; а поза судом — сформована думка, за яку людина відповідає
    example_de: Das Urteil kommt erst am Freitag.
    example_en: The verdict will not come until Friday.
    example_ru: Приговор будет только в пятницу.
    example_uk: Вирок буде лише в п’ятницю.
    note:
      en: 'The u is short. In court: ein Urteil fällen, ein Urteil sprechen, gegen das Urteil Berufung einlegen. Outside it the word is stronger than A2 die Meinung in the deck `nebensaetze-plaene` — a Meinung is what you happen to think and may drop over coffee, while an Urteil has been arrived at and is defended: sich ein Urteil bilden, ein hartes Urteil. Verbs: urteilen and beurteilen for weighing something up, verurteilen below only for the court. And das Vorurteil is a prejudice.'
      ru: 'U краткое. В суде: ein Urteil fällen, ein Urteil sprechen, gegen das Urteil Berufung einlegen. Вне суда слово сильнее, чем die Meinung уровня A2 из колоды `nebensaetze-plaene`: Meinung — то, что человек думает и может оставить за чашкой кофе, а Urteil выношено и отстаивается: sich ein Urteil bilden, ein hartes Urteil. Глаголы: urteilen и beurteilen — «оценивать», verurteilen ниже — только про суд. А das Vorurteil — предрассудок.'
      uk: 'U коротке. У суді: ein Urteil fällen, ein Urteil sprechen, gegen das Urteil Berufung einlegen. Поза судом слово сильніше, ніж die Meinung рівня A2 з колоди `nebensaetze-plaene`: Meinung — те, що людина думає і може лишити за філіжанкою кави, а Urteil виношене й обстоюване: sich ein Urteil bilden, ein hartes Urteil. Дієслова: urteilen і beurteilen — «оцінювати», verurteilen нижче — лише про суд. А das Vorurteil — упередження.'

  - de: verurteilen
    ipa: "fɛɐ̯ˈʔʊʁtaɪ̯lən"
    pos: verb
    praesens_3sg: verurteilt
    partizip2: verurteilt
    aux: haben
    valence: "+ Akk zu + Dat"
    cards: recognition
    en: to find somebody guilty in court and impose a penalty; also to condemn something publicly
    ru: признать человека виновным в суде и назначить наказание; а также публично осудить что-либо
    uk: визнати людину винною в суді і призначити покарання; а також публічно засудити щось
    example_de: Das Gericht hat ihn zu einer Geldstrafe verurteilt.
    example_en: The court sentenced him to a fine.
    example_ru: Суд приговорил его к денежному штрафу.
    example_uk: Суд присудив йому грошовий штраф.
    note:
      en: 'Inseparable and weak, hat verurteilt, built on das Urteil above; there is a glottal stop before the stressed u, because the stem begins with a vowel of its own. The penalty follows zu plus the dative: zu einer Geldstrafe, zu zwei Jahren Haft verurteilt werden, and the passive is how a learner meets it almost every time. The second sense is moral and needs no court: Die Regierung verurteilt den Angriff. What the person then is, is B1 schuldig in the deck `charakter-verhalten-b1`.'
      ru: 'Неотделяемый и слабый, hat verurteilt, построен на das Urteil выше; перед ударным u стоит гортанная смычка, потому что корень начинается с собственного гласного. Наказание вводится через zu с дательным: zu einer Geldstrafe, zu zwei Jahren Haft verurteilt werden, — и почти всегда учащийся встречает глагол в страдательном залоге. Второе значение нравственное и суда не требует: Die Regierung verurteilt den Angriff. А кем человек после этого становится, говорит schuldig уровня B1 из колоды `charakter-verhalten-b1`.'
      uk: 'Невідокремлюване і слабке, hat verurteilt, побудоване на das Urteil вище; перед наголошеним u стоїть гортанна змичка, бо корінь починається з власного голосного. Покарання вводиться через zu з давальним: zu einer Geldstrafe, zu zwei Jahren Haft verurteilt werden, — і майже завжди учень зустрічає дієслово в пасиві. Друге значення моральне і суду не потребує: Die Regierung verurteilt den Angriff. А ким людина після цього стає, каже schuldig рівня B1 з колоди `charakter-verhalten-b1`.'

  - de: Strafe
    ipa: "ˈʃtʁaːfə"
    pos: noun
    gender: f
    plural: "die Strafen"
    cards: recognition
    en: what somebody has to pay or to suffer because of what they did
    ru: то, что человеку приходится заплатить или претерпеть за содеянное
    uk: те, що людині доводиться заплатити або перетерпіти за скоєне
    example_de: Auf diese Tat steht eine hohe Strafe.
    example_en: That offence carries a heavy penalty.
    example_ru: За это деяние полагается суровое наказание.
    example_uk: За це діяння передбачено суворе покарання.
    note:
      en: 'The word covers everything from a parking ticket to a prison term, so German usually says which with a compound: die Geldstrafe, die Freiheitsstrafe, and eine Strafe bekommen or zahlen. Everyday speech calls the ticket der Strafzettel and the official fine das Bußgeld. It also works at home and at school, where zur Strafe means as a punishment. The verb is bestrafen, next; the adjective strafbar is above.'
      ru: 'Слово покрывает всё — от квитанции за парковку до тюремного срока, — поэтому немец обычно уточняет сложным словом: die Geldstrafe, die Freiheitsstrafe, а также eine Strafe bekommen или zahlen. В быту квитанцию зовут der Strafzettel, а официальный штраф — das Bußgeld. Работает слово и дома, и в школе, где zur Strafe значит «в наказание». Глагол — bestrafen, следующая запись; прилагательное strafbar выше.'
      uk: 'Слово покриває все — від квитанції за паркування до тюремного строку, — тому німець зазвичай уточнює складним словом: die Geldstrafe, die Freiheitsstrafe, а також eine Strafe bekommen або zahlen. У побуті квитанцію звуть der Strafzettel, а офіційний штраф — das Bußgeld. Працює слово і вдома, і в школі, де zur Strafe означає «на кару». Дієслово — bestrafen, наступний запис; прикметник strafbar вище.'

  - de: bestrafen
    ipa: "bəˈʃtʁaːfn̩"
    pos: verb
    praesens_3sg: bestraft
    partizip2: bestraft
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to make somebody pay or suffer for what they have done
    ru: заставить человека заплатить или претерпеть за содеянное
    uk: змусити людину заплатити або перетерпіти за скоєне
    example_de: Solche Fehler werden im Sport hart bestraft.
    example_en: Mistakes like that are punished severely in sport.
    example_ru: Такие ошибки в спорте наказываются жёстко.
    example_uk: Такі помилки в спорті караються жорстко.
    note:
      en: 'Weak and inseparable, so no ge- in the participle: hat bestraft. The person is the accusative object and the reason follows für plus the accusative or wegen plus the genitive: Er wurde wegen Betrugs bestraft. The bare verb strafen exists but sounds biblical or literary, and news German prefers the passive, as in the example. The noun for the act of punishing is die Bestrafung; die Strafe above is the thing imposed.'
      ru: 'Слабый и неотделяемый, поэтому в причастии нет ge-: hat bestraft. Человек — прямое дополнение, а основание вводится через für с винительным или wegen с родительным: Er wurde wegen Betrugs bestraft. Голый глагол strafen существует, но звучит библейски или книжно, а газетный немецкий предпочитает страдательный залог, как в примере. Существительное для самого действия — die Bestrafung; die Strafe выше — то, что назначено.'
      uk: 'Слабке і невідокремлюване, тому в дієприкметнику немає ge-: hat bestraft. Людина — прямий додаток, а підстава вводиться через für зі знахідним або wegen з родовим: Er wurde wegen Betrugs bestraft. Голе дієслово strafen існує, але звучить біблійно або книжно, а газетна німецька воліє пасив, як у прикладі. Іменник для самої дії — die Bestrafung; die Strafe вище — те, що призначено.'

  - de: Gefängnis
    ipa: "gəˈfɛŋnɪs"
    pos: noun
    gender: n
    plural: "die Gefängnisse"
    cards: recognition
    en: the building in which people are held after a court has sentenced them
    ru: здание, в котором содержат людей после вынесенного судом приговора
    uk: будівля, у якій утримують людей після винесеного судом вироку
    example_de: Er muss für zwei Jahre ins Gefängnis.
    example_en: He has to go to prison for two years.
    example_ru: Ему предстоит два года тюрьмы.
    example_uk: На нього чекають два роки в’язниці.
    note:
      en: 'Built from fangen, neuter, and the plural doubles the s. The ng is one sound, ŋ, with no g spoken after it. Chunks: ins Gefängnis kommen, im Gefängnis sitzen, zu drei Jahren Gefängnis verurteilt werden. Official German calls the institution die Justizvollzugsanstalt, abbreviated JVA on every sign and in every letter, and die Haft is the state of being held rather than the place.'
      ru: 'Образовано от fangen, средний род, во множественном s удваивается. Сочетание ng — один звук ŋ, никакого g после него не произносят. Обороты: ins Gefängnis kommen, im Gefängnis sitzen, zu drei Jahren Gefängnis verurteilt werden. Официальный немецкий зовёт учреждение die Justizvollzugsanstalt, на каждой табличке и в каждом письме сокращённо JVA, а die Haft — это состояние под стражей, а не место.'
      uk: 'Утворене від fangen, середній рід, у множині s подвоюється. Сполука ng — один звук ŋ, жодного g після нього не вимовляють. Звороти: ins Gefängnis kommen, im Gefängnis sitzen, zu drei Jahren Gefängnis verurteilt werden. Офіційна німецька зве заклад die Justizvollzugsanstalt, на кожній табличці і в кожному листі скорочено JVA, а die Haft — це стан під вартою, а не місце.'

  # --- Wen es getroffen hat ---
  - de: Opfer
    ipa: "ˈɔpfɐ"
    pos: noun
    gender: n
    plural: "die Opfer"
    cards: recognition
    en: the person something bad was done to; also something valuable given up for a purpose
    ru: тот, против кого совершено дурное; а также нечто ценное, отданное ради цели
    uk: той, проти кого скоєно лихе; а також щось цінне, віддане заради мети
    example_de: Das Opfer wurde sofort ins Krankenhaus gebracht.
    example_en: The victim was taken to hospital at once.
    example_ru: Пострадавшего сразу доставили в больницу.
    example_uk: Потерпілого одразу доправили до лікарні.
    note:
      en: 'Neuter whoever it refers to, and singular and plural are spelled alike, so only the article and the verb tell them apart. The second sense is the older one and has nothing criminal about it: ein Opfer bringen is to make a sacrifice, and opfern is to give something up. Chunks: einem Betrug zum Opfer fallen, die Opfer des Unglücks, and the memorial phrase already met at B1 das Denkmal in the deck `wohnen-gebaeude-b1`: ein Denkmal für die Opfer.'
      ru: 'Средний род, о ком бы ни шла речь, а единственное и множественное пишутся одинаково — различают их только артикль и глагол. Второе значение старше и криминального в нём нет: ein Opfer bringen — «принести жертву», opfern — «пожертвовать». Обороты: einem Betrug zum Opfer fallen, die Opfer des Unglücks, а также памятниковая формула, уже встреченная при слове das Denkmal уровня B1 из колоды `wohnen-gebaeude-b1`: ein Denkmal für die Opfer.'
      uk: 'Середній рід, про кого б не йшлося, а однина і множина пишуться однаково — розрізняють їх лише артикль і дієслово. Друге значення давніше, і кримінального в ньому немає: ein Opfer bringen — «принести жертву», opfern — «пожертвувати». Звороти: einem Betrug zum Opfer fallen, die Opfer des Unglücks, а також пам’ятникова формула, уже зустрінута при слові das Denkmal рівня B1 з колоди `wohnen-gebaeude-b1`: ein Denkmal für die Opfer.'

  - de: Tote
    ipa: "ˈtoːtə"
    pos: noun
    gender: f
    plural: "die Toten"
    # An adjectival noun (der Tote / ein Toter / zwei Tote), so it would need an accept
    # list if it were typed — it is not, and the note carries the declension. The card
    # front stands in the feminine, exactly as the shipped `Kranke` entry does
    # (koerper-medizin-b1), and for the same reason: the form the article decides
    # cannot be graded from a meaning prompt.
    cards: recognition
    en: a person who has died, referred to as a person rather than described
    ru: умерший человек, названный как лицо, а не описанный
    uk: померла людина, названа як особа, а не описана
    example_de: Bei dem Unfall gab es zwei Tote.
    example_en: Two people were killed in the accident.
    example_ru: В аварии погибли двое.
    example_uk: В аварії загинули двоє.
    note:
      en: 'An adjectival noun, so the ending follows whatever article stands in front: der Tote, ein Toter, die Tote, eine Tote, die Toten, and after a number simply zwei Tote — exactly like B1 der Kranke in the deck `koerper-medizin-b1` and A2 der Angestellte in the deck `berufe-a2`. News German counts casualties with it, as in the example. Around it stand A2 tot in the deck `eigenschaften-dinge-a2` for the adjective, B1 der Tod in the deck `koerper-medizin-b1` for death itself, and A2 sterben in the deck `verben-handlungen-a2-2` for the verb.'
      ru: 'Субстантивированное прилагательное, поэтому окончание следует за стоящим перед ним артиклем: der Tote, ein Toter, die Tote, eine Tote, die Toten, а после числительного просто zwei Tote — ровно как der Kranke уровня B1 из колоды `koerper-medizin-b1` и der Angestellte уровня A2 из колоды `berufe-a2`. Газетный немецкий считает этим словом погибших, как в примере. Рядом стоят tot уровня A2 из колоды `eigenschaften-dinge-a2` — прилагательное, der Tod уровня B1 из колоды `koerper-medizin-b1` — сама смерть, и sterben уровня A2 из колоды `verben-handlungen-a2-2` — глагол.'
      uk: 'Субстантивований прикметник, тому закінчення йде за артиклем, що стоїть перед ним: der Tote, ein Toter, die Tote, eine Tote, die Toten, а після числівника просто zwei Tote — точно як der Kranke рівня B1 з колоди `koerper-medizin-b1` і der Angestellte рівня A2 з колоди `berufe-a2`. Газетна німецька рахує цим словом загиблих, як у прикладі. Поряд стоять tot рівня A2 з колоди `eigenschaften-dinge-a2` — прикметник, der Tod рівня B1 з колоди `koerper-medizin-b1` — сама смерть, і sterben рівня A2 з колоди `verben-handlungen-a2-2` — дієслово.'
