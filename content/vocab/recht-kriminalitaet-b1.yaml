# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the law-and-crime
# field of data/goethe-b1-wortliste.txt: the rule a state writes down and can
# enforce, the act that breaks it, the words for the person who did it and the
# person it was done to, and everything between the arrest and the sentence. This
# is the German of a police report and of the third page of a newspaper.
# A1's `reisen-urlaub` owns die Polizei, A2's `berufe-a2` owns Polizist and
# Polizistin, B1's `berufe-b1` owns Anwalt and Anwältin and its note already names
# the courtroom neighbours, B1's `regeln-verantwortung` owns the rule as a house
# rule and the quarrel it settles (Vorschrift, Streit, Sicherheit, Notfall), A2's
# `verben-handlungen-a2-1` and `-a2-2` own erlauben, verbieten and lügen, B1's
# `verwaltung-behoerden-b1` owns the authority side of all of it (Behörde, Beamte,
# verboten), B1's `charakter-verhalten-b1` owns schuldig, and B1's
# `verben-handlungen-b1-3` owns beweisen. This deck is what those eight leave
# unnamed: the word for the deed, the word for the person who did it, and every
# word a court file needs between the two.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field
# is read, never written: a learner reporting a theft says Man hat mir mein Fahrrad
# gestohlen out of A1 and A2 words, and everything here is what the form, the reply
# and the newspaper say back at him.
id: recht-kriminalitaet-b1
title_de: "Recht und Kriminalität"
title_en: "Law and crime"
title_ru: "Право и преступность"
title_uk: "Право і злочинність"
level: B1
entries:
  # --- Das Gesetz und das Recht ---
  - de: Gesetz
    ipa: "gəˈzɛts"
    pos: noun
    gender: n
    plural: "die Gesetze"
    cards: recognition
    en: a rule the state has written down and can enforce against everybody alike
    ru: правило, записанное государством и обязательное для всех без исключения
    uk: правило, записане державою й обов’язкове для всіх без винятку
    example_de: Das neue Gesetz gilt ab Januar.
    example_en: The new law comes into force in January.
    example_ru: Новый закон действует с января.
    example_uk: Новий закон діє від січня.
    note:
      en: 'Neuter, plural in -e, and the -tz is the ts sound. Three words sit on one scale and a text picks by how binding the rule is: A2 die Regel in the deck `lernen-verstehen` is what a group agrees on, B1 die Vorschrift in the deck `regeln-verantwortung` is official but stands below a statute, and this one is the statute itself. Chunks: ein Gesetz beschließen, gegen das Gesetz verstoßen, laut Gesetz. The adjective is gesetzlich, and Germany''s constitution is called das Grundgesetz rather than die Verfassung.'
      ru: 'Средний род, множественное на -e, а -tz звучит как ts. Три слова стоят на одной шкале, и текст выбирает по степени обязательности: die Regel уровня A2 из колоды `lernen-verstehen` — то, о чём договорилась группа, die Vorschrift уровня B1 из колоды `regeln-verantwortung` — предписание официальное, но ниже закона, а здесь сам закон. Обороты: ein Gesetz beschließen, gegen das Gesetz verstoßen, laut Gesetz. Прилагательное — gesetzlich, а конституция Германии называется das Grundgesetz, а не die Verfassung.'
      uk: 'Середній рід, множина на -e, а -tz звучить як ts. Три слова стоять на одній шкалі, і текст обирає за мірою обов’язковості: die Regel рівня A2 з колоди `lernen-verstehen` — те, про що домовилася група, die Vorschrift рівня B1 з колоди `regeln-verantwortung` — припис офіційний, але нижчий за закон, а тут сам закон. Звороти: ein Gesetz beschließen, gegen das Gesetz verstoßen, laut Gesetz. Прикметник — gesetzlich, а конституція Німеччини зветься das Grundgesetz, а не die Verfassung.'

  - de: Recht
    ipa: "ˈʁɛçt"
    pos: noun
    gender: n
    plural: "die Rechte"
    cards: recognition
    en: 'the whole body of rules a state lives by, taken as a field; and one single claim a person may make under it'
    ru: 'вся совокупность норм, по которым живёт государство, взятая как область; и отдельное притязание, которое человек вправе по ним заявить'
    uk: 'уся сукупність норм, за якими живе держава, узята як галузь; і окреме домагання, яке людина має право за ними заявити'
    example_de: Jeder hat das Recht auf einen Anwalt.
    example_en: Everybody has the right to a lawyer.
    example_ru: Каждый имеет право на адвоката.
    example_uk: Кожен має право на адвоката.
    note:
      en: 'The capital R divides the labour with B1 recht in the deck `ort-richtung-verweis-b1`, which ships the small-letter degree word and whose note already points here. As a field it takes no plural and no article in Recht studieren; as a single claim it takes both, and what the claim is about follows auf plus the accusative: das Recht auf Bildung, die Rechte der Kinder. One statute is das Gesetz above, and all of them together are das Recht. Two chunks are learned whole: Recht haben, to be right, where Duden now prefers the small r, and im Recht sein.'
      ru: 'Прописная R делит работу с recht уровня B1 из колоды `ort-richtung-verweis-b1`: там степенное слово со строчной, и его примечание уже отсылает сюда. Как область слово не имеет ни множественного, ни артикля в обороте Recht studieren; как отдельное притязание имеет и то и другое, а предмет притязания вводит auf с винительным: das Recht auf Bildung, die Rechte der Kinder. Один закон — das Gesetz выше, а все они вместе — das Recht. Два оборота учат целиком: Recht haben — «быть правым», где Duden теперь предпочитает строчную, и im Recht sein.'
      uk: 'Велика R ділить роботу з recht рівня B1 з колоди `ort-richtung-verweis-b1`: там ступеневе слово з малої, і його примітка вже відсилає сюди. Як галузь слово не має ні множини, ні артикля у звороті Recht studieren; як окреме домагання має і те й те, а предмет домагання вводить auf зі знахідним: das Recht auf Bildung, die Rechte der Kinder. Один закон — das Gesetz вище, а всі вони разом — das Recht. Два звороти вчать цілком: Recht haben — «мати рацію», де Duden тепер віддає перевагу малій літері, та im Recht sein.'

  - de: rechtlich
    ipa: "ˈʁɛçtlɪç"
    pos: adj
    cards: recognition
    en: having to do with the law; seen the way the law sees it
    ru: относящийся к праву; взятый так, как это видит закон
    uk: що стосується права; узятий так, як це бачить закон
    example_de: Rechtlich ist der Fall völlig klar.
    example_en: Legally the case is completely clear.
    example_ru: С правовой точки зрения дело совершенно ясное.
    example_uk: З правового погляду справа цілком зрозуміла.
    note:
      en: 'From das Recht above, and it says which point of view is being taken, not that something is allowed. Beside it gesetzlich means laid down in a particular statute, so gesetzlich vorgeschrieben is stronger and narrower than rechtlich möglich. Chunks: rechtliche Schritte einleiten, rechtliche Folgen, aus rechtlichen Gründen, rechtlich verbindlich. Keep it away from A2 richtig in the deck `bewertung-a2`, which means correct, and from the direction word A1 rechts.'
      ru: 'От das Recht выше, и оно указывает точку зрения, а не разрешение. Рядом gesetzlich значит «прописанный в конкретном законе», так что gesetzlich vorgeschrieben сильнее и уже, чем rechtlich möglich. Обороты: rechtliche Schritte einleiten, rechtliche Folgen, aus rechtlichen Gründen, rechtlich verbindlich. Не смешивайте с richtig уровня A2 из колоды `bewertung-a2` — «правильный», — и с направлением rechts уровня A1.'
      uk: 'Від das Recht вище, і воно вказує на позицію, а не на дозвіл. Поряд gesetzlich означає «прописаний у конкретному законі», тож gesetzlich vorgeschrieben сильніше й вужче, ніж rechtlich möglich. Звороти: rechtliche Schritte einleiten, rechtliche Folgen, aus rechtlichen Gründen, rechtlich verbindlich. Не змішуйте з richtig рівня A2 з колоди `bewertung-a2` — «правильний», — і з напрямком rechts рівня A1.'

  - de: illegal
    ipa: "ˈɪlegaːl"
    pos: adj
    cards: recognition
    en: against the law, and usually done in the knowledge that it is
    ru: противозаконный, и, как правило, совершаемый с пониманием этого
    uk: протизаконний, і, як правило, вчинюваний із розумінням цього
    example_de: Der Handel mit diesen Tieren ist illegal.
    example_en: Trading in these animals is illegal.
    example_ru: Торговля этими животными незаконна.
    example_uk: Торгівля цими тваринами незаконна.
    note:
      en: 'A Latin loan built as in- plus legal, and legal is its opposite. Duden gives the stress on the first syllable, ˈillegal, with the last-syllable illeGAL current beside it. Three words fence off different sizes of wrong: B1 verboten in the deck `verwaltung-behoerden-b1` is what a sign or a house rule forbids, this one is what a law forbids, and strafbar below is narrower still, because it adds that a penalty follows. Chunks: illegale Beschäftigung, illegal einreisen, sich illegal aufhalten.'
      ru: 'Латинское заимствование из in- и legal, а legal — его противоположность. Duden ставит ударение на первый слог, ˈillegal, рядом с ним ходит и illeGAL. Три слова размечают разные размеры нарушения: verboten уровня B1 из колоды `verwaltung-behoerden-b1` — то, что запрещает табличка или домовой порядок, это слово — то, что запрещает закон, а strafbar ниже ещё уже, потому что добавляет наказание. Обороты: illegale Beschäftigung, illegal einreisen, sich illegal aufhalten.'
      uk: 'Латинське запозичення з in- і legal, а legal — його протилежність. Duden ставить наголос на перший склад, ˈillegal, поряд із ним побутує й illeGAL. Три слова розмічають різні розміри порушення: verboten рівня B1 з колоди `verwaltung-behoerden-b1` — те, що забороняє табличка або домовий порядок, це слово — те, що забороняє закон, а strafbar нижче ще вужче, бо додає покарання. Звороти: illegale Beschäftigung, illegal einreisen, sich illegal aufhalten.'

  - de: strafbar
    ipa: "ˈʃtʁaːfbaːɐ̯"
    pos: adj
    cards: recognition
    en: 'punishable: of the kind the criminal law attaches a penalty to'
    ru: 'наказуемый: такой, за который уголовный закон предусматривает наказание'
    uk: 'караний: такий, за який кримінальний закон передбачає покарання'
    example_de: Wer hier ohne Fahrkarte fährt, macht sich strafbar.
    example_en: Anybody travelling here without a ticket is committing an offence.
    example_ru: Кто едет здесь без билета, совершает наказуемое деяние.
    example_uk: Хто їде тут без квитка, чинить каране діяння.
    note:
      en: 'Die Strafe below plus the suffix -bar, which makes an adjective meaning that something can be done to the thing — the same build as B1 haltbar in the deck `essen-lebensmittel-b1` and B1 sichtbar in the deck `eigenschaften-bewertung-b1`. The frame a learner meets it in is reflexive: sich strafbar machen, to make oneself liable to punishment. It is narrower than illegal above, because it says a penalty attaches: eine strafbare Handlung is a criminal offence, and the family runs die Straftat and der Straftäter.'
      ru: 'Die Strafe ниже плюс суффикс -bar, дающий прилагательное со значением «с этим можно так поступить» — тот же тип, что у haltbar уровня B1 из колоды `essen-lebensmittel-b1` и sichtbar уровня B1 из колоды `eigenschaften-bewertung-b1`. Оборот, в котором слово встречают, возвратный: sich strafbar machen — «навлечь на себя наказание». Оно уже, чем illegal выше, потому что утверждает наказание: eine strafbare Handlung — уголовно наказуемое деяние, а семейство даёт die Straftat и der Straftäter.'
      uk: 'Die Strafe нижче плюс суфікс -bar, що дає прикметник зі значенням «із цим можна так вчинити» — той самий тип, що в haltbar рівня B1 з колоди `essen-lebensmittel-b1` і sichtbar рівня B1 з колоди `eigenschaften-bewertung-b1`. Зворот, у якому слово зустрічають, зворотний: sich strafbar machen — «накликати на себе покарання». Воно вужче, ніж illegal вище, бо стверджує покарання: eine strafbare Handlung — кримінально каране діяння, а родина дає die Straftat і der Straftäter.'

  # --- Die Tat und wer sie begangen hat ---
  - de: Tat
    ipa: "ˈtaːt"
    pos: noun
    gender: f
    plural: "die Taten"
    cards: recognition
    en: one single thing somebody did, named by a report or a court as the thing to be judged
    ru: отдельный совершённый поступок, названный протоколом или судом как то, что подлежит оценке
    uk: окремий вчинок, названий протоколом або судом як те, що підлягає оцінці
    example_de: Die Tat geschah am frühen Morgen.
    example_en: The offence took place early in the morning.
    example_ru: Деяние произошло ранним утром.
    example_uk: Діяння сталося раннього ранку.
    note:
      en: 'The noun to A2 tun in the deck `verben-handlungen-a2-2`, and on its own it is neutral or even warm: eine gute Tat, ein Mann der Tat. What makes it a crime word is the company it keeps, because every compound the police use is built on it: die Straftat, der Tatort, die Tatzeit, der Tatverdacht, and der Täter below. The adverb in der Tat means indeed and belongs to an argument, not to a case file.'
      ru: 'Существительное к tun уровня A2 из колоды `verben-handlungen-a2-2`, и само по себе оно нейтрально и даже тепло: eine gute Tat, ein Mann der Tat. Криминальным его делает окружение: все полицейские сложные слова построены на нём — die Straftat, der Tatort, die Tatzeit, der Tatverdacht, и der Täter ниже. Наречный оборот in der Tat значит «в самом деле» и принадлежит рассуждению, а не делу в производстве.'
      uk: 'Іменник до tun рівня A2 з колоди `verben-handlungen-a2-2`, і саме по собі воно нейтральне і навіть тепле: eine gute Tat, ein Mann der Tat. Кримінальним його робить оточення: усі поліційні складні слова побудовані на ньому — die Straftat, der Tatort, die Tatzeit, der Tatverdacht, і der Täter нижче. Прислівниковий зворот in der Tat означає «справді» і належить міркуванню, а не справі в провадженні.'

  - de: Täter
    ipa: "ˈtɛːtɐ"
    pos: noun
    gender: m
    plural: "die Täter"
    cards: recognition
    en: the man who committed an offence, named before any court has decided anything
    ru: 'мужчина, совершивший деяние: так его называют до того, как что-либо решил суд'
    uk: 'чоловік, що вчинив діяння: так його називають до того, як щось вирішив суд'
    example_de: Die Polizei sucht noch den Täter.
    example_en: The police are still looking for the offender.
    example_ru: Полиция всё ещё разыскивает преступника.
    example_uk: Поліція досі розшукує зловмисника.
    note:
      en: 'Die Tat above plus -er, with the long ä. This is the procedural word and it judges nothing: it says only that this person did the deed, which is why a report may use it while the case is still open. Der Verbrecher below judges the person, and once a court has convicted somebody the file says der Verurteilte. Singular and plural are spelled alike. The feminine is die Täterin, the next entry, and the pair runs through the compounds too: der Mittäter, der Wiederholungstäter, die Täterbeschreibung.'
      ru: 'Die Tat выше плюс -er, с долгим ä. Это процессуальное слово, и оно никого не оценивает: сказано лишь, что деяние совершил этот человек, — потому сводка употребляет его, пока дело ещё открыто. Der Verbrecher ниже оценивает человека, а после обвинительного приговора в деле пишут der Verurteilte. Единственное и множественное пишутся одинаково. Женская пара — die Täterin, следующая запись, и пара тянется в сложные слова: der Mittäter, der Wiederholungstäter, die Täterbeschreibung.'
      uk: 'Die Tat вище плюс -er, із довгим ä. Це процесуальне слово, і воно нікого не оцінює: сказано лише, що діяння вчинила ця людина, — тому зведення вживає його, поки справа ще відкрита. Der Verbrecher нижче оцінює людину, а після обвинувального вироку у справі пишуть der Verurteilte. Однина і множина пишуться однаково. Жіноча пара — die Täterin, наступний запис, і пара тягнеться у складні слова: der Mittäter, der Wiederholungstäter, die Täterbeschreibung.'

  - de: Täterin
    ipa: "ˈtɛːtəʁɪn"
    pos: noun
    gender: f
    plural: "die Täterinnen"
    cards: recognition
    en: the woman who committed an offence, named in the same neutral way
    ru: женщина, совершившая деяние, названная так же нейтрально
    uk: жінка, що вчинила діяння, названа так само нейтрально
    example_de: Die Polizei hat ein Foto von der Täterin.
    example_en: The police have a photograph of the offender.
    example_ru: У полиции есть фотография преступницы.
    example_uk: У поліції є світлина зловмисниці.
    note:
      en: 'Regular Movierung with -in and no further change to the stem, since the umlaut is already in Täter; the plural doubles the n. A police appeal writes Täter/-in when the sex is unknown, and the plural die Täter is the neutral form for a mixed group. In a newspaper both are usually replaced by the precise word for the offence, der Dieb or der Einbrecher below, which says what was done as well as who did it.'
      ru: 'Обычное мовирование на -in без дальнейших изменений основы: умлаут уже есть в Täter; во множественном n удваивается. Полицейское обращение к гражданам пишет Täter/-in, когда пол неизвестен, а множественное die Täter — нейтральная форма для смешанной группы. В газете оба слова обычно заменяет точное название деяния — der Dieb или der Einbrecher ниже, — которое говорит и что сделано, и кем.'
      uk: 'Звичайна моція на -in без подальших змін основи: умлаут уже є в Täter; у множині n подвоюється. Поліційне звернення до громадян пише Täter/-in, коли стать невідома, а множина die Täter — нейтральна форма для змішаної групи. У газеті обидва слова зазвичай заступає точна назва діяння — der Dieb або der Einbrecher нижче, — яка каже і що зроблено, і ким.'

  - de: Verbrecher
    ipa: "fɛɐ̯ˈbʁɛçɐ"
    pos: noun
    gender: m
    plural: "die Verbrecher"
    cards: recognition
    en: a man who commits serious crimes, named as a kind of person rather than for a single act
    ru: 'мужчина, совершающий тяжкие преступления: назван как определённый род людей, а не по одному поступку'
    uk: 'чоловік, що чинить тяжкі злочини: названий як певний рід людей, а не за одним учинком'
    example_de: Der Mann ist kein Verbrecher, er hat nur einen Fehler gemacht.
    example_en: The man is not a criminal, he only made a mistake.
    example_ru: Этот человек не преступник, он лишь совершил ошибку.
    example_uk: Ця людина не злочинець, вона лише припустилася помилки.
    note:
      en: 'From das Verbrechen, a serious crime, and the ch after e is the soft one. It carries a judgement that der Täter above deliberately does not, so it belongs to speech, to headlines and to indignation rather than to a case file, where the person is der Beschuldigte before the trial and der Angeklagte during it. Singular and plural look alike; the feminine is die Verbrecherin, the next entry. The adjective is verbrecherisch.'
      ru: 'От das Verbrechen — тяжкое преступление, — а ch после e мягкое. В слове есть оценка, которой у der Täter выше намеренно нет, поэтому оно принадлежит речи, заголовкам и возмущению, а не материалам дела, где человек до суда der Beschuldigte, а на суде der Angeklagte. Единственное и множественное выглядят одинаково; женская пара — die Verbrecherin, следующая запись. Прилагательное — verbrecherisch.'
      uk: 'Від das Verbrechen — тяжкий злочин, — а ch після e м’яке. У слові є оцінка, якої в der Täter вище навмисне немає, тому воно належить мовленню, заголовкам і обуренню, а не матеріалам справи, де людина до суду der Beschuldigte, а на суді der Angeklagte. Однина і множина мають однаковий вигляд; жіноча пара — die Verbrecherin, наступний запис. Прикметник — verbrecherisch.'

  - de: Verbrecherin
    ipa: "fɛɐ̯ˈbʁɛçəʁɪn"
    pos: noun
    gender: f
    plural: "die Verbrecherinnen"
    cards: recognition
    en: a woman who commits serious crimes, named in the same judging way
    ru: женщина, совершающая тяжкие преступления, названная так же оценочно
    uk: жінка, що чинить тяжкі злочини, названа так само оцінково
    example_de: Im Roman wird sie am Ende als Verbrecherin verurteilt.
    example_en: In the novel she is convicted as a criminal in the end.
    example_ru: В романе её в конце осуждают как преступницу.
    example_uk: У романі її наприкінці засуджують як злочинницю.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n. Because the word judges, it is far rarer in print than the masculine and rarer still than die Täterin above: a report that has to name a woman reaches for the neutral form or for the offence itself. Novels and films keep it alive, which is where a B1 reader is most likely to meet it.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается. Поскольку слово оценочно, в печати оно встречается куда реже мужской формы и ещё реже, чем die Täterin выше: сводка, которой надо назвать женщину, берёт нейтральную форму или само название деяния. Слово держат живым романы и фильмы — там читатель уровня B1 его и встретит.'
      uk: 'Звичайна моція на -in, у множині n подвоюється. Оскільки слово оцінкове, у друці воно трапляється куди рідше за чоловічу форму і ще рідше, ніж die Täterin вище: зведення, якому треба назвати жінку, бере нейтральну форму або саму назву діяння. Слово тримають живим романи та фільми — там читач рівня B1 його і зустріне.'

  - de: Gewalt
    ipa: "gəˈvalt"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: physical force used against people or things; and, in the language of the state, the power it holds over them
    ru: физическая сила, применённая к людям или вещам; а в языке государства — власть, которой оно над ними располагает
    uk: фізична сила, застосована до людей або речей; а в мові держави — влада, яку вона над ними має
    example_de: In diesem Land ist Gewalt gegen Kinder verboten.
    example_en: In this country violence against children is forbidden.
    example_ru: В этой стране насилие в отношении детей запрещено.
    example_uk: У цій країні насильство щодо дітей заборонене.
    note:
      en: 'In the violence sense it is uncountable, so German says viel Gewalt and never two of them; the plural die Gewalten exists only in constitutional language, where die drei Gewalten are the three branches of the state. Chunks: Gewalt anwenden, mit Gewalt, häusliche Gewalt, and the adjective gewalttätig. Beside it B1 die Kraft in the deck `koerper-medizin-b1` is strength a body has, with no wrong in it, and höhere Gewalt is the fixed term for an event nobody could prevent.'
      ru: 'В значении насилия слово неисчисляемое, поэтому говорят viel Gewalt и никогда «две»; множественное die Gewalten живёт только в конституционном языке, где die drei Gewalten — три ветви власти. Обороты: Gewalt anwenden, mit Gewalt, häusliche Gewalt, прилагательное gewalttätig. Рядом die Kraft уровня B1 из колоды `koerper-medizin-b1` — сила тела, в которой нет ничего дурного, а höhere Gewalt — устойчивый термин для обстоятельств непреодолимой силы.'
      uk: 'У значенні насильства слово незлічуване, тому кажуть viel Gewalt і ніколи «дві»; множина die Gewalten живе лише в конституційній мові, де die drei Gewalten — три гілки влади. Звороти: Gewalt anwenden, mit Gewalt, häusliche Gewalt, прикметник gewalttätig. Поряд die Kraft рівня B1 з колоди `koerper-medizin-b1` — сила тіла, у якій немає нічого лихого, а höhere Gewalt — усталений термін для обставин непереборної сили.'

  - de: Killer
    ipa: "ˈkɪlɐ"
    pos: noun
    gender: m
    plural: "die Killer"
    cards: recognition
    en: 'a man who kills for money or on somebody else''s order: the word of headlines and crime fiction'
    ru: 'мужчина, который убивает за деньги или по чужому заказу: слово заголовков и криминального жанра'
    uk: 'чоловік, який убиває за гроші або на чуже замовлення: слово заголовків і кримінального жанру'
    example_de: In dem Film sucht die Polizei einen Killer.
    example_en: In the film the police are looking for a hitman.
    example_ru: В фильме полиция ищет наёмного убийцу.
    example_uk: У фільмі поліція шукає найманого вбивцю.
    note:
      en: 'An English loan with a German short i and the ending spoken as ɐ. German''s own word is der Mörder, and that is what a court, a police statement and a serious report use; this one carries the flavour of a thriller, which is exactly why the Wortliste files it with Job, Laptop and Manager rather than with the legal words. Compounds: der Auftragskiller, der Serienkiller, and in advertising das Killerargument for an unanswerable point. The feminine is die Killerin, the next entry.'
      ru: 'Английское заимствование с немецким кратким i и окончанием, звучащим как ɐ. Своё немецкое слово — der Mörder, и именно его берут суд, полицейская сводка и серьёзный репортаж; у этого же привкус триллера, потому Wortliste и держит его рядом с Job, Laptop и Manager, а не среди юридических слов. Сложные слова: der Auftragskiller, der Serienkiller, а в рекламе das Killerargument — довод, на который нечего возразить. Женская пара — die Killerin, следующая запись.'
      uk: 'Англійське запозичення з німецьким коротким i та закінченням, що звучить як ɐ. Своє німецьке слово — der Mörder, і саме його беруть суд, поліційне зведення й серйозний репортаж; у цього ж присмак трилера, тому Wortliste і тримає його поряд із Job, Laptop і Manager, а не серед юридичних слів. Складні слова: der Auftragskiller, der Serienkiller, а в рекламі das Killerargument — доказ, на який нічого заперечити. Жіноча пара — die Killerin, наступний запис.'

  - de: Killerin
    ipa: "ˈkɪləʁɪn"
    pos: noun
    gender: f
    plural: "die Killerinnen"
    cards: recognition
    en: a woman who kills for money or on somebody else's order
    ru: женщина, которая убивает за деньги или по чужому заказу
    uk: жінка, яка вбиває за гроші або на чуже замовлення
    example_de: Die Killerin im Krimi arbeitet allein.
    example_en: The hitwoman in the crime novel works alone.
    example_ru: Наёмная убийца в этом детективе работает одна.
    example_uk: Наймана вбивця в цьому детективі працює сама.
    note:
      en: 'A German -in ending on an English stem, which is what German does with every loaned agent noun: die Managerin, die Jobberin, die Killerin. Plural with a doubled n. It lives almost entirely in fiction and in the summary of a plot; the everyday German for a woman who kills is die Mörderin, and outside a story a report would name the offence instead.'
      ru: 'Немецкое -in на английской основе — так немецкий поступает с любым заимствованным названием деятеля: die Managerin, die Jobberin, die Killerin. Во множественном n удваивается. Слово живёт почти только в художественном тексте и в пересказе сюжета; обиходное немецкое для женщины, совершившей убийство, — die Mörderin, а вне истории сводка назвала бы само деяние.'
      uk: 'Німецьке -in на англійській основі — так німецька чинить із будь-якою запозиченою назвою діяча: die Managerin, die Jobberin, die Killerin. У множині n подвоюється. Слово живе майже тільки в художньому тексті та в переказі сюжету; побутове німецьке для жінки, що скоїла вбивство, — die Mörderin, а поза історією зведення назвало б саме діяння.'

  # --- Diebstahl, Einbruch, Betrug ---
  - de: Dieb
    ipa: "ˈdiːp"
    pos: noun
    gender: m
    plural: "die Diebe"
    cards: recognition
    en: a man who takes what belongs to somebody else, without force and without being seen
    ru: мужчина, который берёт чужое — без применения силы и незаметно
    uk: чоловік, який бере чуже — без застосування сили і непомітно
    example_de: Die Polizei hat den Dieb noch im Zug gefunden.
    example_en: The police found the thief while he was still on the train.
    example_ru: Полиция нашла вора ещё в поезде.
    example_uk: Поліція знайшла злодія ще в потязі.
    note:
      en: 'The final b is devoiced and sounds like p. The method is what separates the neighbours: this one is quiet and unseen, der Räuber uses force in front of you, and der Einbrecher below breaks his way in. The verb is stehlen below, and the offence is der Diebstahl — the word on the police form and in an insurance policy, Diebstahl anzeigen. The feminine die Diebin is regular; the Wortliste lists only the masculine here.'
      ru: 'Конечное b оглушается и звучит как p. Соседей разделяет способ: этот тихий и незаметный, der Räuber применяет силу у вас на глазах, а der Einbrecher ниже вламывается. Глагол — stehlen ниже, а само деяние — der Diebstahl, слово из полицейского бланка и страхового полиса: Diebstahl anzeigen. Женская пара die Diebin образуется обычно; Wortliste даёт здесь только мужскую.'
      uk: 'Кінцеве b оглушується і звучить як p. Сусідів розділяє спосіб: цей тихий і непомітний, der Räuber застосовує силу у вас на очах, а der Einbrecher нижче вдирається. Дієслово — stehlen нижче, а саме діяння — der Diebstahl, слово з поліційного бланка і страхового поліса: Diebstahl anzeigen. Жіноча пара die Diebin твориться звичайно; Wortliste подає тут лише чоловічу.'

  - de: stehlen
    ipa: "ˈʃteːlən"
    pos: verb
    praesens_3sg: stiehlt
    partizip2: gestohlen
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to take something that belongs to somebody else, quietly and for good
    ru: взять чужое — тихо и насовсем
    uk: узяти чуже — тихо і назавжди
    example_de: Man hat mir das Fahrrad gestohlen.
    example_en: My bicycle has been stolen.
    example_ru: У меня украли велосипед.
    example_uk: У мене вкрали велосипед.
    note:
      en: 'A strong verb with three different stem vowels and an e that turns to ie in the present: du stiehlst, er stiehlt, but wir stehlen; stehlen, stahl, hat gestohlen. The frame in the example is the one a learner hears most, with the owner in the dative and no named thief. A1 nehmen in the deck `perfekt-a1-verben` is the neutral act; this verb adds that the thing was not yours. Everyday speech often says klauen instead, which is informal but very common.'
      ru: 'Сильный глагол с тремя разными корневыми гласными и с переходом e в ie в настоящем: du stiehlst, er stiehlt, но wir stehlen; stehlen, stahl, hat gestohlen. Конструкция из примера — та, которую слышишь чаще всего: пострадавший в дательном, вор не назван. nehmen уровня A1 из колоды `perfekt-a1-verben` — нейтральное действие; этот глагол добавляет, что вещь была не ваша. В разговоре часто говорят klauen — фамильярно, но очень употребительно.'
      uk: 'Сильне дієслово з трьома різними кореневими голосними і з переходом e в ie в теперішньому: du stiehlst, er stiehlt, але wir stehlen; stehlen, stahl, hat gestohlen. Конструкція з прикладу — та, яку чуєш найчастіше: потерпілий у давальному, злодія не названо. nehmen рівня A1 з колоди `perfekt-a1-verben` — нейтральна дія; це дієслово додає, що річ була не ваша. У розмові часто кажуть klauen — фамільярно, але дуже вживано.'

  - de: einbrechen
    ipa: "ˈaɪ̯nˌbʁɛçn̩"
    pos: verb
    praesens_3sg: bricht ein
    partizip2: eingebrochen
    aux: sein
    valence: "in + Akk"
    cards: recognition
    en: to force a way into a building in order to steal
    ru: проникнуть в здание, взломав его, чтобы обокрасть
    uk: проникнути до будівлі, зламавши її, щоб обікрасти
    example_de: In der Nacht ist jemand in die Schule eingebrochen.
    example_en: Somebody broke into the school during the night.
    example_ru: Ночью кто-то проник в школу со взломом.
    example_uk: Уночі хтось проник до школи зі зламом.
    note:
      en: 'Separable, and strong like brechen: bricht ein, brach ein, eingebrochen. Duden gives it sein, not haben, and the reason is visible in the sentence: what the verb describes is a movement into somewhere, and the place stands in in plus the accusative, the direction case. The same sein runs through the other senses, where a roof or the ice gives way and where winter sets in. The person is der Einbrecher and the deed der Einbruch, both below.'
      ru: 'Отделяемый и сильный, как brechen: bricht ein, brach ein, eingebrochen. Duden даёт ему sein, а не haben, и причина видна в самом предложении: глагол описывает движение внутрь, и место стоит при in с винительным — падеже направления. То же sein идёт и через другие значения: проваливается крыша или лёд, наступает зима. Человек — der Einbrecher, деяние — der Einbruch, оба ниже.'
      uk: 'Відокремлюване і сильне, як brechen: bricht ein, brach ein, eingebrochen. Duden дає йому sein, а не haben, і причина видна в самому реченні: дієслово описує рух усередину, і місце стоїть при in зі знахідним — відмінку напрямку. Те саме sein іде й крізь інші значення: провалюється дах або лід, настає зима. Людина — der Einbrecher, діяння — der Einbruch, обидва нижче.'

  - de: Einbrecher
    ipa: "ˈaɪ̯nˌbʁɛçɐ"
    pos: noun
    gender: m
    plural: "die Einbrecher"
    cards: recognition
    en: a man who forces his way into buildings to steal from them
    ru: мужчина, который со взломом проникает в здания, чтобы их обокрасть
    uk: чоловік, який зі зламом проникає до будівель, щоб їх обікрасти
    example_de: Die Einbrecher kamen durch das Fenster im Erdgeschoss.
    example_en: The burglars came in through the ground-floor window.
    example_ru: Взломщики проникли через окно первого этажа.
    example_uk: Зловмисники проникли крізь вікно першого поверху.
    note:
      en: 'Einbrechen above plus -er, with the primary stress on Ein- and a secondary one on the stem. Singular and plural are spelled alike. Where der Dieb above says only that something was taken, this word says how it was got at, which is why an insurance policy and a police report both prefer it. The feminine is die Einbrecherin, the next entry, and the trade''s vocabulary is die Einbruchsicherung and der Einbruchschutz.'
      ru: 'Einbrechen выше плюс -er, главное ударение на Ein-, побочное на корне. Единственное и множественное пишутся одинаково. Там, где der Dieb выше говорит только, что вещь унесли, это слово говорит, как до неё добрались, — потому его и предпочитают страховой полис и полицейская сводка. Женская пара — die Einbrecherin, следующая запись, а словарь ремесла — die Einbruchsicherung и der Einbruchschutz.'
      uk: 'Einbrechen вище плюс -er, головний наголос на Ein-, побічний на корені. Однина і множина пишуться однаково. Там, де der Dieb вище каже лише, що річ винесли, це слово каже, як до неї дісталися, — тому його і воліють страховий поліс і поліційне зведення. Жіноча пара — die Einbrecherin, наступний запис, а словник ремесла — die Einbruchsicherung і der Einbruchschutz.'

  - de: Einbrecherin
    ipa: "ˈaɪ̯nˌbʁɛçəʁɪn"
    pos: noun
    gender: f
    plural: "die Einbrecherinnen"
    cards: recognition
    en: a woman who forces her way into buildings to steal from them
    ru: женщина, которая со взломом проникает в здания, чтобы их обокрасть
    uk: жінка, яка зі зламом проникає до будівель, щоб їх обікрасти
    example_de: Die Polizei sucht eine Einbrecherin und zwei Männer.
    example_en: The police are looking for a female burglar and two men.
    example_ru: Полиция разыскивает взломщицу и двоих мужчин.
    example_uk: Поліція розшукує зловмисницю і двох чоловіків.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n; the stress stays where the masculine put it. It surfaces where a report has to distinguish the people involved, as in the example. For a mixed group German uses the masculine plural die Einbrecher, and a headline that wants neither says simply Unbekannte, unknown persons.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается; ударение остаётся там же, где в мужской форме. Слово всплывает там, где сводке нужно различить участников, как в примере. Для смешанной группы немецкий берёт мужское множественное die Einbrecher, а заголовок, которому не нужно ни то ни другое, скажет просто Unbekannte — «неизвестные».'
      uk: 'Звичайна моція на -in, у множині n подвоюється; наголос лишається там само, де в чоловічій формі. Слово зринає там, де зведенню треба розрізнити учасників, як у прикладі. Для змішаної групи німецька бере чоловічу множину die Einbrecher, а заголовок, якому не потрібно ні того ні того, скаже просто Unbekannte — «невідомі».'

  - de: Einbruch
    ipa: "ˈaɪ̯nˌbʁʊx"
    pos: noun
    gender: m
    plural: "die Einbrüche"
    cards: recognition
    en: the offence of forcing a way into a building; also the moment at which something sets in
    ru: 'взлом как деяние: проникновение в здание силой; а также момент, когда что-либо наступает'
    uk: 'злам як діяння: проникнення до будівлі силою; а також мить, коли щось настає'
    example_de: Nach dem Einbruch hat die Familie neue Schlösser gekauft.
    example_en: After the break-in the family bought new locks.
    example_ru: После взлома семья купила новые замки.
    example_uk: Після зламу родина купила нові замки́.
    note:
      en: 'The noun to einbrechen above, with an umlaut in the plural. The insurance term is der Einbruchdiebstahl, which names both halves of what happened. The second sense has nothing criminal about it and is common in weather and time expressions: bei Einbruch der Dunkelheit, bei Einbruch der Nacht, der Kälteeinbruch. A market that falls sharply also suffers ein Einbruch.'
      ru: 'Существительное к einbrechen выше, во множественном умлаут. Страховой термин — der Einbruchdiebstahl, называющий обе половины случившегося. Второе значение не имеет ничего криминального и обычно для погоды и времени: bei Einbruch der Dunkelheit, bei Einbruch der Nacht, der Kälteeinbruch. О резко упавшем рынке тоже говорят ein Einbruch.'
      uk: 'Іменник до einbrechen вище, у множині умлаут. Страховий термін — der Einbruchdiebstahl, що називає обидві половини того, що сталося. Друге значення не має нічого кримінального і звичне для погоди й часу: bei Einbruch der Dunkelheit, bei Einbruch der Nacht, der Kälteeinbruch. Про різко впалий ринок теж кажуть ein Einbruch.'

  - de: betrügen
    ipa: "bəˈtʁyːgn̩"
    pos: verb
    praesens_3sg: betrügt
    partizip2: betrogen
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to get money or an advantage out of somebody by making them believe something untrue
    ru: получить с кого-либо деньги или выгоду, заставив поверить в неправду
    uk: дістати з когось гроші або вигоду, змусивши повірити в неправду
    example_de: Die Firma hat ihre Kunden jahrelang betrogen.
    example_en: The company cheated its customers for years.
    example_ru: Фирма годами обманывала своих клиентов.
    example_uk: Фірма роками ошукувала своїх клієнтів.
    note:
      en: 'Strong and inseparable, so there is no ge- in the participle and all three stems differ: betrügen, betrog, hat betrogen. What the victim is deprived of follows um plus the accusative: jemanden um sein Geld betrügen. A2 lügen in the deck `verben-handlungen-a2-2` is only saying something untrue; this verb is doing damage with it, which is why the second, private sense — betraying a partner — uses the same word. Nouns: der Betrug, der Betrüger.'
      ru: 'Сильный и неотделяемый, поэтому в причастии нет ge-, а все три основы разные: betrügen, betrog, hat betrogen. То, чего лишают, вводится через um с винительным: jemanden um sein Geld betrügen. lügen уровня A2 из колоды `verben-handlungen-a2-2` — только сказать неправду; этот глагол — нанести ею ущерб, потому тем же словом называют и второе, частное значение: измену партнёру. Существительные: der Betrug, der Betrüger.'
      uk: 'Сильне і невідокремлюване, тому в дієприкметнику немає ge-, а всі три основи різні: betrügen, betrog, hat betrogen. Те, чого позбавляють, уводиться через um зі знахідним: jemanden um sein Geld betrügen. lügen рівня A2 з колоди `verben-handlungen-a2-2` — лише сказати неправду; це дієслово — завдати нею шкоди, тому тим самим словом звуть і друге, приватне значення: зраду партнерові. Іменники: der Betrug, der Betrüger.'

  # --- Wer ermittelt, und woran ---
  - de: Kriminalpolizei
