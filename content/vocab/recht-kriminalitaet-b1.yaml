      ru: 'Обычное мовирование на -in, во множественном n удваивается. В зале к ней обращаются Frau Richterin, а письменное решение называет её полностью; отдельного слова для самой должности у немецкого нет — это das Richteramt. Народные заседатели рядом с ней — die Schöffen.'
      uk: 'Звичайна моція на -in, у множині n подвоюється. У залі до неї звертаються Frau Richterin, а письмове рішення називає її повністю; окремого слова для самої посади німецька не має — це das Richteramt. Народні засідателі поряд із нею — die Schöffen.'

