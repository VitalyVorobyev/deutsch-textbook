    ru: то, что показывает истинность утверждения, — в том виде, в каком это примет суд
    uk: те, що показує істинність твердження, — у тому вигляді, у якому це прийме суд
    example_de: Ohne Beweise kann das Gericht niemanden verurteilen.
    example_en: Without evidence the court cannot convict anybody.
