      ru: 'Длинное слово вслух не произносит никто: в речи, в сериале и даже в газете это die Kripo. die Polizei уровня A1 из колоды `reisen-urlaub` — вся полиция целиком, а патрулирующая половина в форме — die Schutzpolizei. Множественного нет: слово называет одну организацию, а стоящее над ней федеральное ведомство — das Bundeskriminalamt, BKA. Главное ударение падает внутри Kriminal-, на -nal-, побочное — на -zei.'
      uk: 'Довге слово вголос не вимовляє ніхто: у мовленні, у серіалі і навіть у газеті це die Kripo. die Polizei рівня A1 з колоди `reisen-urlaub` — уся поліція цілком, а патрульна половина в однострої — die Schutzpolizei. Множини немає: слово називає одну організацію, а федеральне відомство над нею — das Bundeskriminalamt, BKA. Головний наголос падає всередині Kriminal-, на -nal-, побічний — на -zei.'

  - de: Verdacht
    ipa: "fɛɐ̯ˈdaxt"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: the reason there is to think somebody did it, while nothing has yet been proved
    ru: основание думать, что это сделал такой-то, пока ничего не доказано
    uk: підстава думати, що це зробив такий-то, доки нічого не доведено
    example_de: Gegen ihn gibt es nur einen Verdacht, keine Beweise.
    example_en: There is only a suspicion against him, no evidence.
    example_ru: Против него есть только подозрение, а не доказательства.
    example_uk: Проти нього є лише підозра, а не докази.
    note:
      en: 'Masculine, and in practice singular only — Duden records a plural, but a B1 text never needs it. What the suspicion is about follows auf plus the accusative, and a doctor uses exactly the same frame: Verdacht auf Grippe. Chunks: Verdacht haben, unter Verdacht stehen, einen Verdacht äußern, and auf Verdacht for doing something on the off chance. B1 der Zweifel in the deck `lernen-zukunft` doubts a claim; this word suspects a person.'
      ru: 'Мужской род и на практике только единственное: Duden фиксирует множественное, но тексту уровня B1 оно не нужно. Предмет подозрения вводится через auf с винительным, и та же конструкция у врача: Verdacht auf Grippe. Обороты: Verdacht haben, unter Verdacht stehen, einen Verdacht äußern, а auf Verdacht — «на всякий случай, наудачу». der Zweifel уровня B1 из колоды `lernen-zukunft` сомневается в утверждении; это слово подозревает человека.'
      uk: 'Чоловічий рід і на практиці лише однина: Duden фіксує множину, але текстові рівня B1 вона не потрібна. Предмет підозри вводиться через auf зі знахідним, і та сама конструкція в лікаря: Verdacht auf Grippe. Звороти: Verdacht haben, unter Verdacht stehen, einen Verdacht äußern, а auf Verdacht — «про всяк випадок, навмання». der Zweifel рівня B1 з колоди `lernen-zukunft` сумнівається в твердженні; це слово підозрює людину.'

  - de: verdächtig
    ipa: "fɛɐ̯ˈdɛçtɪç"
    pos: adj
    cards: recognition
    en: giving reason to think that somebody or something is behind an offence
    ru: дающий основание думать, что за деянием стоит этот человек или этот предмет
    uk: що дає підставу думати, ніби за діянням стоїть ця людина або цей предмет
    example_de: Das Auto vor dem Haus sieht verdächtig aus.
    example_en: The car in front of the house looks suspicious.
    example_ru: Машина перед домом выглядит подозрительно.
    example_uk: Автівка перед будинком має підозрілий вигляд.
    note:
      en: 'From der Verdacht above, with an umlaut and a soft ch at both ends of the word. It works on people and on things alike: ein verdächtiges Paket, sich verdächtig machen. The person is der Verdächtige, an adjectival noun whose ending follows its article — der Verdächtige, ein Verdächtiger, die Verdächtigen — and the verb verdächtigen takes an accusative object.'
      ru: 'От der Verdacht выше, с умлаутом и мягким ch на обоих концах слова. Работает и о людях, и о вещах: ein verdächtiges Paket, sich verdächtig machen. Человек — der Verdächtige, субстантивированное прилагательное, у которого окончание следует за артиклем: der Verdächtige, ein Verdächtiger, die Verdächtigen, — а глагол verdächtigen управляет винительным.'
      uk: 'Від der Verdacht вище, з умлаутом і м’яким ch на обох кінцях слова. Працює і про людей, і про речі: ein verdächtiges Paket, sich verdächtig machen. Людина — der Verdächtige, субстантивований прикметник, у якого закінчення йде за артиклем: der Verdächtige, ein Verdächtiger, die Verdächtigen, — а дієслово verdächtigen керує знахідним.'

  - de: Beweis
