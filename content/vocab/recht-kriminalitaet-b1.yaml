    example_uk: Без доказів суд не може нікого засудити.
    note:
      en: 'The noun to B1 beweisen in the deck `verben-handlungen-b1-3`, which the learner already produces as a typed card; the final s is voiceless. Chunks: einen Beweis liefern, als Beweis dienen, es gibt keine Beweise. Mathematics uses the same word for a proof. Keep it apart from A2 das Zeugnis in the deck `schule-faecher-a2`, which is a school report: what a witness says in court is die Aussage.'
      ru: 'Существительное к beweisen уровня B1 из колоды `verben-handlungen-b1-3`, которое учащийся уже набирает как ответ; конечное s глухое. Обороты: einen Beweis liefern, als Beweis dienen, es gibt keine Beweise. Математика берёт то же слово для доказательства теоремы. Не смешивайте с das Zeugnis уровня A2 из колоды `schule-faecher-a2` — школьным свидетельством: показания свидетеля в суде — это die Aussage.'
      uk: 'Іменник до beweisen рівня B1 з колоди `verben-handlungen-b1-3`, яке учень уже набирає як відповідь; кінцеве s глухе. Звороти: einen Beweis liefern, als Beweis dienen, es gibt keine Beweise. Математика бере те саме слово для доведення теореми. Не змішуйте з das Zeugnis рівня A2 з колоди `schule-faecher-a2` — шкільним свідоцтвом: свідчення свідка в суді — це die Aussage.'

  - de: festnehmen
    ipa: "ˈfɛstˌneːmən"
    pos: verb
    praesens_3sg: nimmt fest
    partizip2: festgenommen
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to take somebody into custody on the spot, as the police do at the scene
    ru: задержать человека на месте — так это делает полиция
    uk: затримати людину на місці — так це робить поліція
    example_de: Die Polizei hat den Mann noch am selben Abend festgenommen.
    example_en: The police took the man into custody the same evening.
    example_ru: Полиция задержала этого мужчину в тот же вечер.
    example_uk: Поліція затримала цього чоловіка того самого вечора.
    note:
      en: 'Separable, and it inherits everything from A1 nehmen in the deck `perfekt-a1-verben`: nimmt fest, nahm fest, hat festgenommen. It names the physical act at the scene, with no paperwork in hand; verhaften below adds the warrant. The noun is die Festnahme, and a learner meets the verb in the passive far more often than in the active: Der Mann wurde festgenommen.'
      ru: 'Отделяемый, и всё берёт от nehmen уровня A1 из колоды `perfekt-a1-verben`: nimmt fest, nahm fest, hat festgenommen. Слово называет само физическое действие на месте, без бумаги на руках; verhaften ниже добавляет постановление. Существительное — die Festnahme, а глагол учащийся встретит в страдательном залоге куда чаще, чем в действительном: Der Mann wurde festgenommen.'
      uk: 'Відокремлюване, і все бере від nehmen рівня A1 з колоди `perfekt-a1-verben`: nimmt fest, nahm fest, hat festgenommen. Слово називає саму фізичну дію на місці, без папірця на руках; verhaften нижче додає постанову. Іменник — die Festnahme, а дієслово учень зустріне в пасиві куди частіше, ніж в активі: Der Mann wurde festgenommen.'

  - de: verhaften
    ipa: "fɛɐ̯ˈhaftn̩"
    pos: verb
    praesens_3sg: verhaftet
    partizip2: verhaftet
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: to arrest somebody formally, on a warrant issued by a court
    ru: арестовать человека официально, по выданному судом постановлению
    uk: заарештувати людину офіційно, за виданою судом постановою
    example_de: Der Verdächtige wurde am Flughafen verhaftet.
    example_en: The suspect was arrested at the airport.
    example_ru: Подозреваемого арестовали в аэропорту.
    example_uk: Підозрюваного заарештували в аеропорту.
    note:
      en: 'Weak and inseparable, so the participle carries no ge-: hat verhaftet, and it looks exactly like the third person singular. The difference from festnehmen above is a piece of paper: festnehmen is an officer taking hold of somebody, while this verb presupposes der Haftbefehl, an arrest warrant signed by a judge. Newspapers use the two loosely; a legal text does not. Nouns: die Verhaftung, and die Haft for being held, in Haft sitzen.'
      ru: 'Слабый и неотделяемый, поэтому в причастии нет ge-: hat verhaftet, и оно совпадает по виду с формой третьего лица. Отличие от festnehmen выше — в бумаге: festnehmen — это когда сотрудник берёт человека, а этот глагол предполагает der Haftbefehl, постановление об аресте за подписью судьи. Газеты употребляют оба слова вольно; юридический текст — нет. Существительные: die Verhaftung, а также die Haft — содержание под стражей, in Haft sitzen.'
      uk: 'Слабке і невідокремлюване, тому в дієприкметнику немає ge-: hat verhaftet, і воно збігається на вигляд із формою третьої особи. Відмінність від festnehmen вище — у папері: festnehmen — це коли працівник бере людину, а це дієслово передбачає der Haftbefehl, постанову про арешт за підписом судді. Газети вживають обидва слова вільно; юридичний текст — ні. Іменники: die Verhaftung, а також die Haft — тримання під вартою, in Haft sitzen.'

  # --- Vor Gericht ---
  - de: Prozess
    ipa: "pʁoˈtsɛs"
    pos: noun
    gender: m
    plural: "die Prozesse"
    cards: recognition
    en: a case being heard in court from the opening to the verdict; also any course of change that runs in steps
    ru: судебное дело от начала слушаний до приговора; а также всякий ход изменений, идущий по шагам
    uk: судова справа від початку слухань до вироку; а також будь-який перебіг змін, що йде кроками
    example_de: Der Prozess gegen die beiden Männer beginnt im März.
    example_en: The trial of the two men begins in March.
    example_ru: Процесс против этих двоих начинается в марте.
    example_uk: Процес проти цих двох починається в березні.
    note:
      en: 'The double s marks the short e before it, and the plural keeps both. In the legal sense the accused follow gegen plus the accusative, and the chunks are einen Prozess führen, den Prozess gewinnen or verlieren. The second sense has nothing to do with courts and is everywhere in B1 reading: ein langer Prozess, der Lernprozess, der Herstellungsprozess. The room the trial is held in is das Gericht, which ships at A2 in the deck `essen-trinken-a2` as the dish on a menu, with a note naming this second meaning.'
      ru: 'Двойное s помечает краткость предшествующего e, и во множественном оба сохраняются. В судебном значении подсудимых вводит gegen с винительным, а обороты — einen Prozess führen, den Prozess gewinnen или verlieren. Второе значение к суду отношения не имеет и пронизывает чтение уровня B1: ein langer Prozess, der Lernprozess, der Herstellungsprozess. Само место, где идёт разбирательство, — das Gericht, и оно уже есть на уровне A2 в колоде `essen-trinken-a2` как «блюдо», с примечанием, называющим это второе значение.'
      uk: 'Подвійне s позначає стислість попереднього e, і в множині обидва зберігаються. У судовому значенні підсудних уводить gegen зі знахідним, а звороти — einen Prozess führen, den Prozess gewinnen або verlieren. Друге значення до суду стосунку не має і пронизує читання рівня B1: ein langer Prozess, der Lernprozess, der Herstellungsprozess. Саме місце, де точиться розгляд, — das Gericht, і воно вже є на рівні A2 в колоді `essen-trinken-a2` як «страва», з приміткою, що називає це друге значення.'

  - de: Richter
