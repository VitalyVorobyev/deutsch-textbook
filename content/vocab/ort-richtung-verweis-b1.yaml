    example_uk: Вокзал зовсім близько, ходімо пішки.
    note:
      en: 'The full form of A1 nah, and the two are one word: nah is the everyday short form, this one the fuller shape a written text and every inflected form prefer — in naher Zukunft, ein naher Verwandter, die nahe Umgebung. The comparison is irregular: näher, am nächsten. As a preposition with the Dativ it means close to (nahe dem Bahnhof), but everyday German says in der Nähe + Genitiv, or simply bei. Do not confuse it with A1 neben, which is beside, immediately next to. And beinahe, on the B1 list, is a different word meaning almost.'
      ru: 'Полная форма от nah с уровня A1, и это одно слово: nah — обиходная краткая форма, а это — полная, которую предпочитают письменный текст и все склоняемые формы: in naher Zukunft, ein naher Verwandter, die nahe Umgebung. Степени сравнения неправильные: näher, am nächsten. Как предлог с Dativ значит «вблизи» (nahe dem Bahnhof), но в обиходе говорят in der Nähe + Genitiv или просто bei. Не путайте с neben уровня A1: то «рядом, вплотную». А beinahe из списка B1 — другое слово, «чуть не».'
      uk: 'Повна форма від nah рівня A1, і це одне слово: nah — побутова коротка форма, а це — повна, яку віддають перевагу писемний текст і всі відмінювані форми: in naher Zukunft, ein naher Verwandter, die nahe Umgebung. Ступені порівняння неправильні: näher, am nächsten. Як прийменник із Dativ означає «поблизу» (nahe dem Bahnhof), але в побуті кажуть in der Nähe + Genitiv або просто bei. Не плутайте з neben рівня A1: то «поряд, впритул». А beinahe зі списку B1 — інше слово, «ледь не».'
