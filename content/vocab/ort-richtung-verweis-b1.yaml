# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the place, direction
# and reference words of data/goethe-b1-wortliste.txt — where a thing is, which way it
# goes, and the pointing words that tie a sentence back to something already said.
id: ort-richtung-verweis-b1
title_de: "Ort, Richtung und Verweis"
title_en: "Place, direction and pointing words"
title_ru: "Место, направление и отсылка"
title_uk: "Місце, напрямок і відсилання"
level: B1
entries:
  # --- Innen und außen: wo etwas liegt ---
  - de: innen
    ipa: "ˈɪnən"
    pos: adv
    # Recognition only: A2 ships `drinnen` ("inside, indoors") as a production card,
    # so an EN/RU prompt reading "inside" is answered by two cards in two decks,
    # which no `accept` list here can reach.
    cards: recognition
    en: on the inside, on the inner side
    ru: внутри, с внутренней стороны
    uk: усередині, з внутрішнього боку
    example_de: Die Jacke ist innen warm gefüttert.
    example_en: The jacket is warmly lined on the inside.
    example_ru: Куртка изнутри тепло подбита.
    example_uk: Куртка зсередини тепло підбита.
    note:
      en: 'It describes an object from its inner side and lives in the pair innen und außen: innen weiß, außen grün. A2 drinnen answers a different question — that one says a person is indoors rather than out in the open (Wir bleiben heute drinnen), while this one is about the thing itself. It combines freely: nach innen (Die Tür geht nach innen auf), von innen, innen drin. As a first element in compounds it becomes Innen-: die Innenstadt, die Innentür, der Innenhof.'
      ru: 'Описывает предмет с внутренней стороны и живёт в паре innen und außen: innen weiß, außen grün. drinnen с уровня A2 отвечает на другой вопрос — оно говорит, что человек находится в помещении, а не под открытым небом (Wir bleiben heute drinnen), тогда как это слово о самом предмете. Оно свободно сочетается: nach innen (Die Tür geht nach innen auf), von innen, innen drin. Первым элементом сложных слов становится Innen-: die Innenstadt, die Innentür, der Innenhof.'
      uk: 'Описує предмет із внутрішнього боку й живе в парі innen und außen: innen weiß, außen grün. drinnen рівня A2 відповідає на інше питання — воно каже, що людина перебуває в приміщенні, а не просто неба (Wir bleiben heute drinnen), тоді як це слово про сам предмет. Воно вільно сполучається: nach innen (Die Tür geht nach innen auf), von innen, innen drin. Першим елементом складних слів стає Innen-: die Innenstadt, die Innentür, der Innenhof.'

  - de: außen
    ipa: "ˈaʊ̯sn̩"
    pos: adv
    # Recognition only: A2 ships `draußen` ("outside, outdoors") and `außerhalb`
    # ("outside (of)") as production cards; "outside" is a prompt two shipped cards
    # already answer, from two other decks.
    cards: recognition
    en: on the outside, on the outer side
    ru: снаружи, с внешней стороны
    uk: ззовні, із зовнішнього боку
    example_de: Außen sieht das Haus alt aus, innen ist alles neu.
    example_en: On the outside the house looks old, inside everything is new.
    example_ru: Снаружи дом выглядит старым, а внутри всё новое.
    example_uk: Ззовні будинок виглядає старим, а всередині все нове.
    note:
      en: 'The mirror of innen, and the two are almost always used together. Three neighbours are different words: A2 draußen says a person is out in the open (Die Kinder spielen draußen), A2 außerhalb draws a boundary and takes the Genitiv (außerhalb der Stadt), and außerdem is a connector meaning besides. This one describes the outer surface of a thing: von außen, nach außen, außen herum. As a first element it becomes Außen-: die Außentür, der Außenspiegel, die Außentemperatur.'
      ru: 'Зеркальное к innen, и почти всегда они идут вместе. Три соседа — другие слова: draußen с уровня A2 говорит, что человек на улице, под открытым небом (Die Kinder spielen draußen), außerhalb с уровня A2 проводит границу и требует Genitiv (außerhalb der Stadt), а außerdem — союзное слово «кроме того». Это же слово описывает внешнюю поверхность предмета: von außen, nach außen, außen herum. Первым элементом сложных слов становится Außen-: die Außentür, der Außenspiegel, die Außentemperatur.'
      uk: 'Дзеркальне до innen, і майже завжди вони йдуть разом. Три сусіди — інші слова: draußen рівня A2 каже, що людина надворі, просто неба (Die Kinder spielen draußen), außerhalb рівня A2 проводить межу й вимагає Genitiv (außerhalb der Stadt), а außerdem — сполучне слово «крім того». Це ж слово описує зовнішню поверхню предмета: von außen, nach außen, außen herum. Першим елементом складних слів стає Außen-: die Außentür, der Außenspiegel, die Außentemperatur.'

  - de: drin
    ipa: "ˈdʁɪn"
    pos: adv
    # Recognition only: A2 ships `drinnen` as a production card and the written form
    # of this word is `darin`, which the course generates by rule — a typed card would
    # grade which of three shapes the author meant.
    cards: recognition
    en: in there, in it
    ru: внутри, там внутри
    uk: усередині, там усередині
    example_de: Mach die Dose auf, es ist noch etwas Suppe drin.
    example_en: Open the tin, there is still some soup in it.
    example_ru: Открой банку, там ещё осталось немного супа.
    example_uk: Відкрий банку, там ще лишилося трохи супу.
    note:
      en: 'The spoken short form of darin, in it, and in loose speech of drinnen too. It belongs to the family that speech has shortened wholesale: heraus and hinaus both become raus, herein and hinein become rein, herauf and hinauf become rauf, herunter and hinunter become runter — and darin becomes this word. A2 already cards raus and rein. In writing use darin (Was steht darin?) or drinnen for indoors. Two idioms keep it: Da ist noch alles drin, anything is still possible, and Das ist nicht drin, that is out of the question.'
      ru: 'Разговорная краткая форма от darin («в нём, в этом»), а в небрежной речи и от drinnen. Слово принадлежит семье, которую речь сократила целиком: heraus и hinaus дают raus, herein и hinein дают rein, herauf и hinauf дают rauf, herunter и hinunter дают runter, а darin даёт это слово. raus и rein уже есть на уровне A2. На письме берут darin (Was steht darin?) или drinnen для «в помещении». Два оборота держат его: Da ist noch alles drin — «всё ещё возможно», и Das ist nicht drin — «об этом не может быть речи».'
      uk: 'Розмовна коротка форма від darin («у ньому, у цьому»), а в недбалому мовленні і від drinnen. Слово належить до родини, яку мовлення скоротило цілком: heraus і hinaus дають raus, herein і hinein дають rein, herauf і hinauf дають rauf, herunter і hinunter дають runter, а darin дає це слово. raus і rein уже є на рівні A2. На письмі беруть darin (Was steht darin?) або drinnen для «у приміщенні». Два звороти тримають його: Da ist noch alles drin — «усе ще можливо», і Das ist nicht drin — «про це не може бути мови».'

  - de: mitten
    # Recognition, on the same argument as `so viel wie` and `vor allem`: the word never
    # stands alone, and neither English nor Russian has a bare word for it — every gloss
    # of it is a prepositional phrase, so a typed prompt invites `mitten in` and marks it
    # wrong. The note is where the word is taught.
    cards: recognition
    ipa: "ˈmɪtn̩"
    pos: adv
    en: right in the middle of
    ru: прямо посреди, в самой середине
    uk: просто посеред, у самій середині
    example_de: Das Hotel liegt mitten in der Altstadt.
    example_en: The hotel is right in the middle of the old town.
    example_ru: Отель находится прямо посреди старого города.
    example_uk: Готель розташований просто посеред старого міста.
    note:
      en: 'It never stands alone: a preposition always follows it, and that preposition keeps its own case — mitten in der Nacht, mitten auf der Straße, mitten durch den Wald, mitten unter uns, mitten im Sommer. The word itself never changes. It is not a replacement for the noun die Mitte (in der Mitte des Zimmers); what it adds is exactness, saying precisely in the middle rather than merely somewhere inside. Written solid it gives mittendrin, right in the thick of it, and mittendurch. In a Wegbeschreibung it is the natural way to place something: mitten auf dem Marktplatz.'
      ru: 'Само по себе не стоит никогда: за ним всегда идёт предлог, и этот предлог сохраняет свой падеж — mitten in der Nacht, mitten auf der Straße, mitten durch den Wald, mitten unter uns, mitten im Sommer. Само слово не изменяется. Оно не заменяет существительное die Mitte (in der Mitte des Zimmers); оно добавляет точность: «ровно посередине», а не просто «где-то внутри». В слитном написании даёт mittendrin («в самой гуще») и mittendurch. В описании дороги это естественный способ указать место: mitten auf dem Marktplatz.'
      uk: 'Саме по собі не стоїть ніколи: за ним завжди йде прийменник, і цей прийменник зберігає свій відмінок — mitten in der Nacht, mitten auf der Straße, mitten durch den Wald, mitten unter uns, mitten im Sommer. Саме слово не змінюється. Воно не заміняє іменник die Mitte (in der Mitte des Zimmers); воно додає точності: «рівно посередині», а не просто «десь усередині». У злитному написанні дає mittendrin («у самій гущі») і mittendurch. В описі дороги це природний спосіб указати місце: mitten auf dem Marktplatz.'

  - de: innerhalb
    ipa: "ˈɪnɐhalp"
    pos: prep
    valence: "+ Gen; von + Dat"
    en: within, inside the bounds of
    ru: в пределах, в рамках
    uk: у межах, у рамках
    example_de: Bitte antworten Sie innerhalb einer Woche.
    example_en: Please reply within a week.
    example_ru: Пожалуйста, ответьте в пределах недели.
    example_uk: Будь ласка, відповідайте в межах тижня.
    note:
      en: 'Two jobs, one frame. With a stretch of time it sets a deadline — innerhalb einer Woche, innerhalb der nächsten Tage; with a space it stays inside a boundary — innerhalb der Stadt, innerhalb der Familie, innerhalb des Gebäudes. It governs the Genitiv, and where nothing marks that case (a bare plural, a number) German switches to innerhalb von + Dativ: innerhalb von zwei Wochen, innerhalb von Minuten. Its opposite is A2 außerhalb, built the same way and taking the same case. Keep the time sense apart from in einer Woche, which names the point one week from now, not the span before it.'
      ru: 'Две работы, одна рамка. С отрезком времени задаёт срок — innerhalb einer Woche, innerhalb der nächsten Tage; с пространством удерживает внутри границы — innerhalb der Stadt, innerhalb der Familie, innerhalb des Gebäudes. Управляет Genitiv, а там, где падеж ничем не помечен (голое множественное число, число), немецкий переходит на innerhalb von + Dativ: innerhalb von zwei Wochen, innerhalb von Minuten. Противоположность — außerhalb с уровня A2, устроенное так же и с тем же падежом. Временное значение держите отдельно от in einer Woche: то называет момент через неделю, а не отрезок до него.'
      uk: 'Дві роботи, одна рамка. З відрізком часу задає строк — innerhalb einer Woche, innerhalb der nächsten Tage; із простором утримує в межах — innerhalb der Stadt, innerhalb der Familie, innerhalb des Gebäudes. Керує Genitiv, а там, де відмінок нічим не позначено (гола множина, число), німецька переходить на innerhalb von + Dativ: innerhalb von zwei Wochen, innerhalb von Minuten. Протилежність — außerhalb рівня A2, влаштоване так само і з тим самим відмінком. Часове значення тримайте окремо від in einer Woche: те називає момент через тиждень, а не відрізок до нього.'

  - de: nirgendwo
    ipa: "ˈnɪʁgn̩tvoː"
    pos: adv
    # Recognition only: A2 ships `nirgends` ("nowhere, not anywhere") as a production
    # card and the two words are the same word — a typed prompt cannot separate them.
    cards: recognition
    en: nowhere, not in any place
    ru: нигде, ни в одном месте
    uk: ніде, у жодному місці
    example_de: Ich habe meinen Schlüssel gesucht, aber nirgendwo gefunden.
    example_en: I looked for my key but did not find it anywhere.
    example_ru: Я искал ключ, но нигде его не нашёл.
    example_uk: Я шукав ключ, але ніде його не знайшов.
    note:
      en: 'A2 nirgends means exactly this: the longer -wo form is a shade more emphatic and the short one is commoner, and no sentence needs to choose between them. Both are already negations, so nothing else negates beside them — ❌ nirgendwo nicht. The directional form is nirgendwohin, to nowhere (Wir fahren dieses Jahr nirgendwohin). The positive members of the family are irgendwo and überall, and the whole irgend- family is regular: irgendwann, irgendwie, irgendwer.'
      ru: 'nirgends с уровня A2 значит ровно это: длинная форма на -wo чуть выразительнее, короткая встречается чаще, и выбирать между ними ни одному предложению не приходится. Оба слова уже сами по себе отрицания, поэтому рядом ничего не отрицают — ❌ nirgendwo nicht. Форма направления — nirgendwohin («никуда»): Wir fahren dieses Jahr nirgendwohin. Положительные члены семьи — irgendwo и überall, а вся семья irgend- регулярна: irgendwann, irgendwie, irgendwer.'
      uk: 'nirgends рівня A2 означає рівно це: довга форма на -wo трохи виразніша, коротка трапляється частіше, і обирати між ними жодному реченню не доводиться. Обидва слова вже самі по собі заперечення, тому поряд нічого не заперечують — ❌ nirgendwo nicht. Форма напрямку — nirgendwohin («нікуди»): Wir fahren dieses Jahr nirgendwohin. Позитивні члени родини — irgendwo та überall, а вся родина irgend- регулярна: irgendwann, irgendwie, irgendwer.'

  # --- Richtung: wohin es geht ---
  - de: hierher
    ipa: "hiːɐ̯ˈheːɐ̯"
    pos: adv
    en: to here, to this place
    ru: сюда
    uk: сюди
    example_de: Kommen Sie bitte hierher, hier ist noch ein Platz frei.
    example_en: Please come over here, there is still a free seat here.
    example_ru: Подойдите, пожалуйста, сюда, здесь ещё есть свободное место.
    example_uk: Підійдіть, будь ласка, сюди, тут ще є вільне місце.
    note:
      en: 'German splits the English here into two words. A1 hier answers wo? and this one answers wohin?: Wo bist du? Hier. Wohin soll ich das stellen? Hierher. The half -her always points at the speaker, so this is movement towards where the speaker stands, and its mirror image is dorthin, which points away. Beside a separable verb the word usually splits and the short her carries the meaning: Komm mal her! Bring das bitte hierher. Bis hierher means up to this point, in a room and in a text alike, and Wie kommst du denn hierher? is ordinary spoken German.'
      ru: 'Немецкий делит русское «здесь / сюда» на два слова. hier с уровня A1 отвечает на вопрос wo?, а это слово — на wohin?: Wo bist du? Hier. Wohin soll ich das stellen? Hierher. Половинка -her всегда указывает на говорящего, поэтому речь о движении туда, где он стоит, а зеркальное слово — dorthin, указывающее прочь. Рядом с отделяемым глаголом слово обычно распадается, и значение несёт короткое her: Komm mal her! Bring das bitte hierher. Bis hierher значит «до этого места» — и в комнате, и в тексте, а Wie kommst du denn hierher? — обычная разговорная фраза.'
      uk: 'Німецька ділить українське «тут / сюди» на два слова. hier рівня A1 відповідає на питання wo?, а це слово — на wohin?: Wo bist du? Hier. Wohin soll ich das stellen? Hierher. Половинка -her завжди вказує на мовця, тому йдеться про рух туди, де він стоїть, а дзеркальне слово — dorthin, що вказує геть. Поряд із відокремлюваним дієсловом слово зазвичай розпадається, і значення несе коротке her: Komm mal her! Bring das bitte hierher. Bis hierher означає «до цього місця» — і в кімнаті, і в тексті, а Wie kommst du denn hierher? — звичайна розмовна фраза.'

  - de: dorthin
    ipa: "dɔʁtˈhɪn"
    pos: adv
    # `dahin` fills the same slot in the same frame and the note says so, so the
    # production card must not mark it wrong.
    accept: ["dahin"]
    en: to there, to that place
    ru: туда
    uk: туди
    example_de: Das Museum ist neu, wir fahren am Samstag dorthin.
    example_en: The museum is new, we are going there on Saturday.
    example_ru: Музей новый, в субботу мы поедем туда.
    example_uk: Музей новий, у суботу ми поїдемо туди.
    note:
      en: 'The directional partner of A1 dort. dort answers wo? and this word answers wohin?: Wo wohnt sie? Dort. Wohin ziehst du? Dorthin. dahin says exactly the same and is what speech normally reaches for, so this card accepts it too. The half -hin always points away from the speaker and -her back towards him, which is why hierher is the mirror image. Beside a verb the halves come apart and the short hin carries the meaning: Da will ich nicht hin. In time, bis dahin means until then; in space, up to there.'
      ru: 'Направительный напарник для dort с уровня A1. dort отвечает на вопрос wo?, а это слово — на wohin?: Wo wohnt sie? Dort. Wohin ziehst du? Dorthin. dahin значит ровно то же и обычнее в устной речи, поэтому карточка принимает и его. Половинка -hin всегда указывает прочь от говорящего, а -her — обратно к нему, поэтому зеркальное слово — hierher. Рядом с глаголом половинки расходятся, и значение несёт короткое hin: Da will ich nicht hin. Во времени bis dahin значит «до тех пор», в пространстве — «до того места».'
      uk: 'Напрямковий напарник до dort рівня A1. dort відповідає на питання wo?, а це слово — на wohin?: Wo wohnt sie? Dort. Wohin ziehst du? Dorthin. dahin означає рівно те саме й звичніше в усному мовленні, тому картка приймає і його. Половинка -hin завжди вказує геть від мовця, а -her — назад до нього, тому дзеркальне слово — hierher. Поряд із дієсловом половинки розходяться, і значення несе коротке hin: Da will ich nicht hin. У часі bis dahin означає «доти», у просторі — «до того місця».'

  - de: dahin
    ipa: "daˈhɪn"
    pos: adv
    # Recognition only: `dorthin` in this deck owns the typed card for "(to) there"
    # and lists this word in `accept`, so a second production card would let two
    # prompts grade the same rendering correct.
    cards: recognition
    en: over there, that way
    ru: туда, в ту сторону
    uk: туди, у той бік
    example_de: Stell die Tasche bitte dahin, neben die Tür.
    example_en: Please put the bag over there, next to the door.
    example_ru: Поставь сумку, пожалуйста, туда, рядом с дверью.
    example_uk: Постав сумку, будь ласка, туди, біля дверей.
    note:
      en: 'The everyday spoken form of dorthin, and it is what a German says while pointing: Stell es dahin. Both answer wohin? and both point away from the speaker; hierher points back at him. Beside a verb the halves separate and the short hin does the work: Da will ich nicht hin, Wo willst du hin? In time it means until that moment: Bis dahin ist alles fertig. Two further uses are idioms rather than directions — etwas dahingehend ändern, in that respect, and Der Sommer ist dahin, the summer is gone.'
      ru: 'Обиходная устная форма от dorthin, и именно её произносят, показывая рукой: Stell es dahin. Оба слова отвечают на вопрос wohin? и оба указывают прочь от говорящего; hierher указывает обратно на него. Рядом с глаголом половинки расходятся, и работу делает короткое hin: Da will ich nicht hin, Wo willst du hin? Во времени значит «до того момента»: Bis dahin ist alles fertig. Ещё два употребления — уже идиомы, а не направление: etwas dahingehend ändern («в этом отношении») и Der Sommer ist dahin («лето прошло»).'
      uk: 'Побутова усна форма від dorthin, і саме її вимовляють, показуючи рукою: Stell es dahin. Обидва слова відповідають на питання wohin? і обидва вказують геть від мовця; hierher вказує назад на нього. Поряд із дієсловом половинки розходяться, і роботу робить коротке hin: Da will ich nicht hin, Wo willst du hin? У часі означає «до того моменту»: Bis dahin ist alles fertig. Ще два вживання — уже ідіоми, а не напрямок: etwas dahingehend ändern («у цьому відношенні») і Der Sommer ist dahin («літо минуло»).'

  - de: heim
    ipa: "ˈhaɪ̯m"
    pos: adv
    # Recognition only: what a B1 learner must produce for "home(wards)" is the
    # phrase `nach Hause`, not this adverb — free-standing `heim` is southern and
    # dated, so a typed card would train the wrong form.
    cards: recognition
    en: home, to one's own home
    ru: домой
    uk: додому
    example_de: Nach dem Kurs gehen wir zusammen heim.
    example_en: After the course we walk home together.
    example_ru: После курса мы идём домой вместе.
    example_uk: Після курсу ми йдемо додому разом.
    note:
      en: 'The adverb homewards, and it is almost always glued to a verb of motion: heimgehen, heimfahren, heimkommen, heimbringen. Standing free it sounds southern and slightly old-fashioned; the neutral everyday phrase is nach Hause, and zu Hause is the static at home. Do not read it as the noun das Heim, which is an institution — ein Altenheim, ein Kinderheim, ein Studentenheim — and never a private home; that is das Zuhause. B1 Heimweh, homesickness, and A2 Heimat, home country, are built on the same element.'
      ru: 'Наречие «домой», и почти всегда оно приклеено к глаголу движения: heimgehen, heimfahren, heimkommen, heimbringen. Отдельно звучит по-южнонемецки и слегка старомодно; нейтральный обиходный оборот — nach Hause, а zu Hause — статичное «дома». Не читайте его как существительное das Heim: то учреждение — ein Altenheim, ein Kinderheim, ein Studentenheim — и никогда не частный дом; частный дом — das Zuhause. Heimweh («тоска по дому», уровень B1) и Heimat («родина», уровень A2) построены на том же элементе.'
      uk: 'Прислівник «додому», і майже завжди він приклеєний до дієслова руху: heimgehen, heimfahren, heimkommen, heimbringen. Окремо звучить по-південнонімецьки і трохи старомодно; нейтральний побутовий зворот — nach Hause, а zu Hause — статичне «удома». Не читайте його як іменник das Heim: то заклад — ein Altenheim, ein Kinderheim, ein Studentenheim — і ніколи не приватний дім; приватний дім — das Zuhause. Heimweh («туга за домом», рівень B1) і Heimat («батьківщина», рівень A2) побудовані на тому самому елементі.'

  - de: aufwärts
    ipa: "ˈaʊ̯fvɛʁts"
    pos: adv
    # Recognition only: A1 ships `oben` ("up; upstairs; at the top") as a production
    # card and `rauf` on this list says the same at another register — three cards
    # for one EN/RU prompt, in three decks.
    cards: recognition
    en: upwards, uphill
    ru: вверх, в гору
    uk: угору, вгору
    example_de: Von hier an geht der Weg steil aufwärts.
    example_en: From here on the path goes steeply uphill.
    example_ru: Отсюда дорога круто идёт вверх.
    example_uk: Звідси дорога круто йде вгору.
    note:
      en: 'It names a rise: movement from a lower point to a higher one, in space or on a scale. Its exact opposite is abwärts. Figuratively Es geht aufwärts means things are looking up — an economy, a business, a person recovering — and that is where a written text needs it most. After a noun it means further up a line: flussaufwärts, upstream. After a figure it means and above: ab zehn Euro aufwärts. In speech the direction itself is nach oben or rauf, and A1 oben answers wo?, not wohin?.'
      ru: 'Называет подъём: движение от более низкой точки к более высокой, в пространстве или по шкале. Точная противоположность — abwärts. В переносном смысле Es geht aufwärts значит «дела идут на поправку» — об экономике, о фирме, о выздоравливающем, — и именно здесь письменный текст нуждается в слове больше всего. После существительного означает «выше по линии»: flussaufwärts, «вверх по реке». После числа означает «и выше»: ab zehn Euro aufwärts. В речи само направление называют nach oben или rauf, а oben с уровня A1 отвечает на вопрос wo?, а не wohin?.'
      uk: 'Називає підйом: рух від нижчої точки до вищої, у просторі або за шкалою. Точна протилежність — abwärts. У переносному сенсі Es geht aufwärts означає «справи йдуть на краще» — про економіку, про фірму, про того, хто одужує, — і саме тут писемний текст потребує слова найбільше. Після іменника означає «вище по лінії»: flussaufwärts, «вгору за течією». Після числа означає «і вище»: ab zehn Euro aufwärts. У мовленні сам напрямок називають nach oben або rauf, а oben рівня A1 відповідає на питання wo?, а не wohin?.'

  - de: abwärts
    ipa: "ˈapvɛʁts"
    pos: adv
    # Recognition only: A1 ships `unten` ("down; downstairs; at the bottom") as a
