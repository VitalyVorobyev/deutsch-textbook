id: leben-veraendern
title_de: "Leben verändern"
title_en: "Changing your life"
title_ru: "Изменить жизнь"
title_uk: "Змінити життя"
level: B1
entries:
  - de: "Gegend"
    ipa: "ˈgeːgn̩t"
    pos: noun
    gender: f
    plural: "die Gegenden"
    en: "area, part of a town or region"
    ru: "местность, район (в широком смысле)"
    uk: "місцевість, район (у широкому сенсі)"
    example_de: "Wir wohnen jetzt in einer ruhigeren Gegend."
    example_en: "We now live in a quieter area."
    example_ru: "Теперь мы живём в более спокойном районе."
    example_uk: "Тепер ми живемо в спокійнішій місцевості."
    note:
      en: "The vague everyday word for where something is — eine ruhige Gegend, eine schöne Gegend. A named city district is das Viertel."
      ru: "Размытое бытовое слово для «мест вокруг»: eine ruhige Gegend, eine schöne Gegend. Конкретный городской район — das Viertel."
      uk: "Розмите побутове слово для «місць довкола»: eine ruhige Gegend, eine schöne Gegend. Конкретний міський район — das Viertel."

  - de: "Viertel"
    ipa: "ˈfɪʁtl̩"
    pos: noun
    gender: n
    plural: "die Viertel"
    en: "city district, quarter"
    ru: "квартал, район города"
    uk: "квартал, район міста"
    example_de: "In unserem Viertel gibt es viele kleine Läden."
    example_en: "There are many small shops in our district."
    example_ru: "В нашем квартале много маленьких магазинов."
    example_uk: "У нашому кварталі багато маленьких крамниць."

  - de: "Lage"
    ipa: "ˈlaːgə"
    pos: noun
    gender: f
    plural: "die Lagen"
    en: "location, position (of a flat or building)"
    ru: "расположение, местоположение"
    uk: "розташування, місцеположення"
    example_de: "Die Lage der Wohnung ist perfekt: fünf Minuten bis zur U-Bahn."
    example_en: "The location of the flat is perfect: five minutes to the underground."
    example_ru: "Расположение квартиры идеальное: пять минут до метро."
    example_uk: "Розташування квартири ідеальне: п'ять хвилин до метро."

  - de: "Etage"
    ipa: "eˈtaːʒə"
    pos: noun
    gender: f
    plural: "die Etagen"
    en: "floor, storey"
    ru: "этаж"
    uk: "поверх"
    example_de: "Unsere Wohnung liegt in der dritten Etage."
    example_en: "Our flat is on the third floor."
    example_ru: "Наша квартира на третьем этаже."
    example_uk: "Наша квартира на третьому поверсі."
    note:
      en: "Same meaning as der Stock from A2: die dritte Etage = der dritte Stock. Housing ads prefer Etage."
      ru: "То же, что der Stock из A2: die dritte Etage = der dritte Stock. В объявлениях о жилье чаще Etage."
      uk: "Те саме, що der Stock з A2: die dritte Etage = der dritte Stock. В оголошеннях про житло частіше Etage."

  - de: "Vorort"
    ipa: "ˈfoːɐ̯ˌʔɔʁt"
    pos: noun
    gender: m
    plural: "die Vororte"
    en: "suburb"
    ru: "пригород"
    uk: "передмістя"
    example_de: "Der Vorort ist grün und ruhig, aber die Fahrt ins Zentrum dauert lange."
    example_en: "The suburb is green and quiet, but the trip into the centre takes a long time."
    example_ru: "Пригород зелёный и тихий, но дорога в центр занимает много времени."
    example_uk: "Передмістя зелене й тихе, але дорога до центру триває довго."

  - de: "Mieter"
    ipa: "ˈmiːtɐ"
    pos: noun
    gender: m
    plural: "die Mieter"
    en: "tenant"
    ru: "квартиросъёмщик, арендатор"
    uk: "квартиронаймач, орендар"
    example_de: "Die neuen Mieter ziehen am ersten März ein."
    example_en: "The new tenants are moving in on the first of March."
    example_ru: "Новые жильцы въезжают первого марта."
    example_uk: "Нові мешканці в'їжджають першого березня."
    note:
      en: "The other side of the contract is der Vermieter (A2). Die Mieterin for a woman."
      ru: "Другая сторона договора — der Vermieter (A2). О женщине — die Mieterin."
      uk: "Інша сторона договору — der Vermieter (A2). Про жінку — die Mieterin."

  - de: "Vorteil"
    ipa: "ˈfoːɐ̯taɪ̯l"
    pos: noun
    gender: m
    plural: "die Vorteile"
    en: "advantage"
    ru: "преимущество, плюс"
    uk: "перевага, плюс"
    example_de: "Ein großer Vorteil der neuen Wohnung ist der Balkon."
    example_en: "A big advantage of the new flat is the balcony."
    example_ru: "Большой плюс новой квартиры — балкон."
    example_uk: "Велика перевага нової квартири — балкон."

  - de: "Nachteil"
    ipa: "ˈnaːxtaɪ̯l"
    pos: noun
    gender: m
    plural: "die Nachteile"
    en: "disadvantage"
    ru: "недостаток, минус"
    uk: "недолік, мінус"
    example_de: "Der einzige Nachteil ist der lange Weg zur Arbeit."
    example_en: "The only disadvantage is the long way to work."
    example_ru: "Единственный минус — долгая дорога на работу."
    example_uk: "Єдиний недолік — довга дорога на роботу."

  - de: "Vergleich"
    ipa: "fɛɐ̯ˈglaɪ̯ç"
    pos: noun
    gender: m
    plural: "die Vergleiche"
    en: "comparison"
    ru: "сравнение"
    uk: "порівняння"
    example_de: "Im Vergleich zur alten Wohnung ist die neue viel heller."
    example_en: "Compared with the old flat, the new one is much brighter."
    example_ru: "По сравнению со старой квартирой новая намного светлее."
    example_uk: "Порівняно зі старою квартирою нова набагато світліша."
    note:
      en: "The fixed frame is im Vergleich zu + Dat."
      ru: "Устойчивая рамка: im Vergleich zu + Dat."
      uk: "Стала рамка: im Vergleich zu + Dat."

  - de: "Aussicht"
    ipa: "ˈaʊ̯sˌzɪçt"
    pos: noun
    gender: f
    plural: "die Aussichten"
    en: "view (from a window or balcony)"
    ru: "вид (из окна, с балкона)"
    uk: "краєвид (з вікна, з балкона)"
    example_de: "Vom Balkon hat man eine schöne Aussicht auf den Park."
    example_en: "From the balcony you have a beautiful view of the park."
    example_ru: "С балкона открывается красивый вид на парк."
    example_uk: "З балкона відкривається гарний краєвид на парк."
    note:
      en: "What the view shows follows auf + Akk: die Aussicht auf den Park."
      ru: "То, что видно, вводит auf + Akk: die Aussicht auf den Park."
      uk: "Те, що видно, вводить auf + Akk: die Aussicht auf den Park."

  - de: "Heimweh"
    ipa: "ˈhaɪ̯mˌveː"
    pos: noun
    gender: n
    plural: "—"
    en: "homesickness"
    ru: "тоска по дому"
    uk: "туга за домом"
    example_de: "Am Anfang hatte ich oft Heimweh nach meiner Stadt."
    example_en: "At the beginning I was often homesick for my city."
    example_ru: "Поначалу я часто тосковал по своему городу."
    example_uk: "Спочатку я часто тужив за своїм містом."
    note:
      en: "The chunk is Heimweh haben; what you long for follows nach + Dat."
      ru: "Устойчивое сочетание — Heimweh haben; то, по чему тоскуют, вводит nach + Dat."
      uk: "Стале сполучення — Heimweh haben; те, за чим тужать, вводить nach + Dat."

  - de: "verändern"
    ipa: "fɛɐ̯ˈʔɛndɐn"
    pos: verb
    praesens_3sg: "verändert"
    partizip2: "verändert"
    aux: haben
    valence: "+ Akk / sich"
    accept: ["sich verändern"]
    en: "to change, to alter"
    ru: "изменять, менять"
    uk: "змінювати"
    example_de: "Der Umzug hat mein Leben komplett verändert."
    example_en: "The move changed my life completely."
    example_ru: "Переезд полностью изменил мою жизнь."
    example_uk: "Переїзд повністю змінив моє життя."
    note:
      en: "Two readings: etwas verändern (change something) and sich verändern (change, of people and places — Die Stadt hat sich verändert)."
      ru: "Два употребления: etwas verändern (изменить что-то) и sich verändern (измениться — о людях и местах: Die Stadt hat sich verändert)."
      uk: "Два вживання: etwas verändern (змінити щось) і sich verändern (змінитися — про людей і місця: Die Stadt hat sich verändert)."

  - de: "entscheiden"
    ipa: "ɛntˈʃaɪ̯dn̩"
    pos: verb
    praesens_3sg: "entscheidet sich"
    partizip2: "sich entschieden"
    aux: haben
    valence: "sich entscheiden für + Akk"
    accept: ["sich entscheiden"]
    en: "to decide, to make up one's mind"
    ru: "решать, принимать решение"
    uk: "вирішувати, ухвалювати рішення"
    example_de: "Wir haben uns für die kleinere Wohnung entschieden."
    example_en: "We decided on the smaller flat."
    example_ru: "Мы выбрали квартиру поменьше."
    example_uk: "Ми вибрали меншу квартиру."
    note:
      en: "The option you pick follows für + Akk, the one you reject gegen + Akk: Wir haben uns gegen den Vorort entschieden."
      ru: "Выбранный вариант вводит für + Akk, отвергнутый — gegen + Akk: Wir haben uns gegen den Vorort entschieden."
      uk: "Обраний варіант вводить für + Akk, відхилений — gegen + Akk: Wir haben uns gegen den Vorort entschieden."

  - de: "gewöhnen"
    ipa: "gəˈvøːnən"
    pos: verb
    praesens_3sg: "gewöhnt sich"
    partizip2: "sich gewöhnt"
    aux: haben
    valence: "sich gewöhnen an + Akk"
    accept: ["sich gewöhnen"]
    en: "to get used (to)"
    ru: "привыкать (к чему-либо)"
    uk: "звикати (до чогось)"
    example_de: "An den Lärm der Straße konnte ich mich nie gewöhnen."
    example_en: "I could never get used to the noise of the street."
    example_ru: "К шуму улицы я так и не смог привыкнуть."
    example_uk: "До шуму вулиці я так і не зміг звикнути."
    note:
      en: "What you get used to follows an + Akk; point back to it with daran: Ich habe mich daran gewöhnt."
      ru: "То, к чему привыкают, вводит an + Akk; сослаться на это можно словом daran: Ich habe mich daran gewöhnt."
      uk: "Те, до чого звикають, вводить an + Akk; послатися на це можна словом daran: Ich habe mich daran gewöhnt."

  - de: "einrichten"
    ipa: "ˈaɪ̯nˌʁɪçtn̩"
    pos: verb
    praesens_3sg: "richtet ein"
    partizip2: "eingerichtet"
    aux: haben
    valence: "+ Akk"
    en: "to furnish, to set up (a room, a flat)"
    ru: "обставлять, обустраивать"
    uk: "облаштовувати, умебльовувати"
    example_de: "Wir haben das Wohnzimmer ganz neu eingerichtet."
    example_en: "We furnished the living room completely anew."
    example_ru: "Мы заново обставили гостиную."
    example_uk: "Ми заново облаштували вітальню."
    note:
      en: "Separable: the prefix ein- goes to the end — Sie richtet die Küche ein."
      ru: "Отделяемая приставка ein- уходит в конец: Sie richtet die Küche ein."
      uk: "Відокремлюваний префікс ein- іде в кінець: Sie richtet die Küche ein."

  - de: "aufgeben"
    ipa: "ˈaʊ̯fˌgeːbn̩"
    pos: verb
    praesens_3sg: "gibt auf"
    partizip2: "aufgegeben"
    aux: haben
    valence: "+ Akk"
    en: "to give up (a flat, a job, a habit)"
    ru: "отказываться (от чего-либо), бросать"
    uk: "відмовлятися (від чогось), кидати"
    example_de: "Sie hat ihre Wohnung in München aufgegeben und ist nach Berlin gezogen."
    example_en: "She gave up her flat in Munich and moved to Berlin."
    example_ru: "Она отказалась от своей квартиры в Мюнхене и переехала в Берлин."
    example_uk: "Вона відмовилася від своєї квартири в Мюнхені й переїхала до Берліна."

  - de: "vermissen"
    ipa: "fɛɐ̯ˈmɪsn̩"
    pos: verb
    praesens_3sg: "vermisst"
    partizip2: "vermisst"
    aux: haben
    valence: "+ Akk"
    en: "to miss (a person or place)"
    ru: "скучать (по кому-либо, чему-либо)"
    uk: "сумувати (за кимось, чимось)"
    example_de: "Ich vermisse meine alten Nachbarn."
    example_en: "I miss my old neighbours."
    example_ru: "Я скучаю по своим старым соседям."
    example_uk: "Я сумую за своїми старими сусідами."
    note:
      en: "Takes a plain Akkusativ, no preposition: ich vermisse meine Stadt."
      ru: "Требует простого Akkusativ — без предлога, в отличие от русского «скучать по»."
      uk: "Вимагає простого Akkusativ — без прийменника, на відміну від українського «сумувати за»."

  - de: "gemütlich"
    ipa: "gəˈmyːtlɪç"
    pos: adj
    en: "cosy, snug"
    ru: "уютный"
    uk: "затишний"
    example_de: "Das neue Wohnzimmer ist klein, aber gemütlich."
    example_en: "The new living room is small but cosy."
    example_ru: "Новая гостиная маленькая, но уютная."
    example_uk: "Нова вітальня маленька, але затишна."

  - de: "zentral"
    ipa: "tsɛnˈtʁaːl"
    pos: adj
    en: "central, centrally located"
    ru: "центральный; в центре"
    uk: "центральний; у центрі"
    example_de: "Die Wohnung liegt sehr zentral, direkt am Markt."
    example_en: "The flat is very centrally located, right by the market."
    example_ru: "Квартира расположена очень центрально, прямо у рынка."
    example_uk: "Квартира розташована дуже центрально, просто біля ринку."

  - de: "Wohngemeinschaft"
    ipa: "ˈvoːngəˌmaɪ̯nʃaft"
    pos: noun
    gender: f
    plural: "die Wohngemeinschaften"
    cards: recognition
    en: "shared flat, flat share"
    ru: "квартира, которую снимают вместе несколько человек"
    uk: "спільна квартира, яку винаймають разом кілька людей"
    example_de: "Als Studentin wohnte sie in einer Wohngemeinschaft mit drei Freundinnen."
    example_en: "As a student she lived in a flat share with three friends."
    example_ru: "Студенткой она жила в совместной квартире с тремя подругами."
    example_uk: "Студенткою вона жила у спільній квартирі з трьома подругами."
    note:
      en: "In everyday speech almost always die WG — you will read the full word in ads and contracts."
      ru: "В повседневной речи почти всегда die WG; полное слово вы встретите в объявлениях и договорах."
      uk: "У повсякденному мовленні майже завжди die WG; повне слово ви зустрінете в оголошеннях і договорах."

  - de: "Grundstück"
    ipa: "ˈgʁʊntˌʃtʏk"
    pos: noun
    gender: n
    plural: "die Grundstücke"
    cards: recognition
    en: "plot of land"
    ru: "земельный участок"
    uk: "земельна ділянка"
    example_de: "Sie haben ein kleines Grundstück gekauft und bauen dort ein Haus."
    example_en: "They bought a small plot of land and are building a house there."
    example_ru: "Они купили небольшой участок и строят там дом."
    example_uk: "Вони купили невелику ділянку й будують там будинок."

  - de: "Wohnort"
    ipa: "ˈvoːnˌʔɔʁt"
    pos: noun
    gender: m
    plural: "die Wohnorte"
    cards: recognition
    en: "place of residence"
    ru: "место жительства"
    uk: "місце проживання"
    example_de: "Bitte schreiben Sie Ihren Namen und Ihren Wohnort auf das Formular."
    example_en: "Please write your name and your place of residence on the form."
    example_ru: "Пожалуйста, впишите в формуляр ваше имя и место жительства."
    example_uk: "Будь ласка, впишіть у формуляр ваше ім'я та місце проживання."
    note:
      en: "The word official forms use — you read and fill it in, you rarely say it."
      ru: "Слово из официальных формуляров: его читают и вписывают, в речи оно почти не звучит."
      uk: "Слово з офіційних формулярів: його читають і вписують, у мовленні воно майже не звучить."
