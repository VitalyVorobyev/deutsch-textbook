# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the road field of
# data/goethe-b1-wortliste.txt: what moves along a street, who moves beside it, what
# the signs and the markings demand, and what a driver actually does at the wheel.
# A1's `stadt-wege` owns getting about a town (Straße, Weg, Bus, Auto, Fahrrad,
# U-Bahn, Haltestelle), A1's `reisen-urlaub` owns the train and the traffic light
# (Zug, Bahn, Fahrkarte, Ampel), and A2's `verkehr-unterwegs-a2` owns the motorway
# and the workshop (Autobahn, Kreuzung, Baustelle, Unfall, Verkehr, Reifen, Motor,
# Schild, Lkw, parken). This deck is the layer above them — the German of the
# Führerschein leaflet and of a passenger saying where to turn.
# The Austrian and Swiss siblings of several headwords here (Trottoir, Velo,
# parkieren, Führerausweis) are held back for the Varianten deck of wave 4; where one
# exists, this deck's `note` names it and nothing more.
id: verkehr-auto-b1
title_de: "Verkehr und Auto"
title_en: "Traffic and the car"
title_ru: "Транспорт и автомобиль"
title_uk: "Транспорт та автомобіль"
level: B1
entries:
  # --- Was auf der Straße und auf der Schiene fährt ---
  - de: Fahrzeug
    ipa: "ˈfaːɐ̯ˌtsɔʏ̯k"
    pos: noun
    gender: n
    plural: "die Fahrzeuge"
    # Recognition only: the category word a form, a sign and a police report use. A
    # learner naming what is in front of them says A1 `Auto` or the kind itself.
    cards: recognition
    en: anything built to carry people or goods along a road, as a rule or a sign counts it
    ru: всё, что построено для перевозки людей или грузов по дороге, — как это считает правило или знак
    uk: усе, що збудоване для перевезення людей чи вантажів дорогою, — як це рахує правило або знак
    example_de: Auf diesem Weg sind Fahrzeuge aller Art verboten.
    example_en: Vehicles of every kind are prohibited on this path.
    example_ru: На этой дороге запрещены любые транспортные средства.
    example_uk: На цій дорозі заборонені будь-які транспортні засоби.
    note:
      en: 'Neuter, plural in -e, and it is deliberately vague: a car, a lorry, a motorbike and a bicycle are all one word here, which is exactly why a sign and an insurance form reach for it. A1 das Auto is what a person says about the thing in the drive. The -zeug ending means gear or stuff and builds a whole family the same way — das Flugzeug, das Werkzeug, das Spielzeug.'
      ru: 'Средний род, множественное на -e, и расплывчатость здесь намеренная: легковая машина, грузовик, мотоцикл и велосипед — всё это одно слово, и именно поэтому за ним тянутся знак и страховой бланк. das Auto уровня A1 — то, что человек говорит про машину во дворе. Окончание -zeug значит «снаряжение, штука» и строит целое семейство: das Flugzeug, das Werkzeug, das Spielzeug.'
      uk: 'Середній рід, множина на -e, і розпливчастість тут навмисна: легковик, вантажівка, мотоцикл і велосипед — усе це одне слово, і саме тому за ним тягнуться знак і страховий бланк. das Auto рівня A1 — те, що людина каже про машину на подвір’ї. Закінчення -zeug означає «спорядження, штука» і будує цілу родину: das Flugzeug, das Werkzeug, das Spielzeug.'

  - de: Pkw
    ipa: "ˈpeːkaːveː"
    pos: noun
    gender: m
    plural: "die Pkws"
    # Recognition only: A1 ships `Auto` ("car", stadt-wege) as the production card for
    # exactly this prompt — this is the same object one register up.
    cards: recognition
    en: a car, in the abbreviation an official form and a traffic report use
    ru: легковая машина в сокращении, которым пользуются официальный бланк и сводка о движении
    uk: легковик у скороченні, яким послуговуються офіційний бланк і зведення про рух
    example_de: An dem Unfall waren zwei Pkws und ein Bus beteiligt.
    example_en: Two cars and a bus were involved in the accident.
    example_ru: В аварии участвовали две легковые машины и автобус.
    example_uk: У аварії брали участь два легковики й автобус.
    note:
      en: 'Short for Personenkraftwagen and spoken letter by letter, P-K-W, with the stress on the first — ˈpeːkaːveː. Nobody says the long form out loud, and nobody says this one in a conversation either: it belongs to the report, the insurance letter and the radio traffic bulletin, where the everyday word would be A1 das Auto. Masculine, from der Wagen, and A2 der Lkw is its heavy counterpart.'
      ru: 'Сокращение от Personenkraftwagen, читается по буквам P-K-W с ударением на первой — ˈpeːkaːveː. Полную форму вслух не произносит никто, но и это сокращение в разговоре не звучит: оно принадлежит протоколу, письму страховщика и радиосводке о движении, где в быту сказали бы das Auto уровня A1. Мужского рода, от der Wagen, а der Lkw уровня A2 — его грузовая пара.'
      uk: 'Скорочення від Personenkraftwagen, читається по літерах P-K-W з наголосом на першій — ˈpeːkaːveː. Повну форму вголос не вимовляє ніхто, але й це скорочення в розмові не звучить: воно належить протоколу, листу страховика й радіозведенню про рух, де в побуті сказали б das Auto рівня A1. Чоловічого роду, від der Wagen, а der Lkw рівня A2 — його вантажна пара.'

  - de: Kfz
    ipa: "kaːʔɛfˈtsɛt"
    pos: noun
    gender: n
    plural: "die Kfz"
    # Recognition only: pure officialese — it exists on forms, garage signs and
    # insurance policies, and has no spoken life a learner would need to produce.
    cards: recognition
    en: any road vehicle with an engine, in the abbreviation German administration writes
    ru: любое дорожное средство с двигателем — в сокращении, которым пишет немецкая администрация
    uk: будь-який дорожній засіб із двигуном — у скороченні, яким пише німецька адміністрація
    example_de: Die Kfz-Versicherung muss jedes Jahr neu bezahlt werden.
    example_en: The vehicle insurance has to be paid again every year.
    example_ru: Страховку на транспортное средство нужно оплачивать каждый год.
    example_uk: Страховку на транспортний засіб треба сплачувати щороку.
    note:
      en: 'Spoken letter by letter with the stress on the last, kaː-ʔɛf-ˈtsɛt, and neuter because the long form ends in -zeug. It is administrative shorthand and almost never stands alone: what you meet is the compounds — die Kfz-Versicherung, der Kfz-Mechaniker, die Kfz-Zulassungsstelle where a car is registered, and das Kfz-Kennzeichen. Where a person is speaking rather than filing, the word is A1 das Auto.'
      ru: 'Читается по буквам с ударением на последней, kaː-ʔɛf-ˈtsɛt, средний род — потому что полная форма кончается на -zeug. Это канцелярское сокращение, и в одиночку оно почти не стоит: встречаются составные — die Kfz-Versicherung, der Kfz-Mechaniker, die Kfz-Zulassungsstelle, где регистрируют машину, и das Kfz-Kennzeichen. Там, где человек говорит, а не подаёт бумагу, слово — das Auto уровня A1.'
      uk: 'Читається по літерах із наголосом на останній, kaː-ʔɛf-ˈtsɛt, середній рід — бо повна форма закінчується на -zeug. Це канцелярське скорочення, і саме по собі воно майже не стоїть: трапляються складні — die Kfz-Versicherung, der Kfz-Mechaniker, die Kfz-Zulassungsstelle, де реєструють машину, і das Kfz-Kennzeichen. Там, де людина говорить, а не подає папір, слово — das Auto рівня A1.'

  - de: Lastwagen
    ipa: "ˈlastˌvaːgn̩"
    pos: noun
    gender: m
    plural: "die Lastwagen"
    # Recognition only: A2 ships `Lkw` ("lorry, truck", verkehr-unterwegs-a2) as the
    # production card, and this is the same vehicle written out in full.
    cards: recognition
    en: the big goods vehicle of the motorway, written out rather than abbreviated
    ru: большая грузовая машина на автобане, названная полным словом, а не сокращением
    uk: велика вантажна машина на автобані, названа повним словом, а не скороченням
    example_de: Vor der Baustelle stauen sich die Lastwagen.
    example_en: The lorries are backed up in front of the roadworks.
    example_ru: Перед стройплощадкой скопились грузовики.
    example_uk: Перед будівельним майданчиком скупчилися вантажівки.
    note:
      en: 'The full word behind A2 der Lkw, and in speech the abbreviation has almost driven it out — a German says Lkw and writes Lastwagen. Masculine, from der Wagen, and the plural is spelled like the singular. The strict legal form is der Lastkraftwagen, which appears only in a statute. The driver is der Lkw-Fahrer, and the next entry is the short familiar word.'
      ru: 'Полное слово, стоящее за der Lkw уровня A2, и в речи сокращение его почти вытеснило: немец говорит Lkw, а пишет Lastwagen. Мужской род, от der Wagen, множественное пишется как единственное. Строгая юридическая форма — der Lastkraftwagen, и она встречается только в законе. Водитель — der Lkw-Fahrer, а следующая запись — короткое разговорное слово.'
      uk: 'Повне слово, що стоїть за der Lkw рівня A2, і в мовленні скорочення його майже витіснило: німець каже Lkw, а пише Lastwagen. Чоловічий рід, від der Wagen, множина пишеться як однина. Сувора юридична форма — der Lastkraftwagen, і вона трапляється лише в законі. Водій — der Lkw-Fahrer, а наступний запис — коротке розмовне слово.'

  - de: Laster
    ipa: "ˈlastɐ"
    pos: noun
    gender: m
    plural: "die Laster"
    # Recognition only: the same vehicle as the two entries above, in the most informal
    # of the three names — one referent does not take a third production card.
    cards: recognition
    en: that same goods vehicle in the short, familiar word a driver uses
    ru: та же грузовая машина в коротком разговорном слове, каким пользуется водитель
    uk: та сама вантажна машина в короткому розмовному слові, яким послуговується водій
    example_de: Ein alter Laster fuhr langsam den Berg hinauf.
    example_en: An old truck was driving slowly up the hill.
    example_ru: Старый грузовик медленно поднимался в гору.
    example_uk: Старий грузовик повільно піднімався в гору.
    note:
      en: 'Colloquial and warm where Lastwagen is neutral and Lkw official — three words, one vehicle, three registers. Singular and plural are spelled alike. There is a homograph to keep well apart: das Laster with the neuter article is a vice or a bad habit, as in Rauchen ist sein einziges Laster, and it has nothing to do with the road. The article is the only thing that tells them apart.'
      ru: 'Разговорное и тёплое там, где Lastwagen нейтрально, а Lkw официально: три слова, одна машина, три регистра. Единственное и множественное пишутся одинаково. Есть омограф, который надо строго различать: das Laster со средним артиклем — порок, дурная привычка, как в Rauchen ist sein einziges Laster, и к дороге отношения не имеет. Различает их только артикль.'
      uk: 'Розмовне й тепле там, де Lastwagen нейтральне, а Lkw офіційне: три слова, одна машина, три регістри. Однина й множина пишуться однаково. Є омограф, який треба суворо розрізняти: das Laster із середнім артиклем — вада, погана звичка, як у Rauchen ist sein einziges Laster, і до дороги стосунку не має. Розрізняє їх лише артикль.'

  - de: Motorrad
    ipa: "moˈtoːɐ̯ˌʁaːt"
    pos: noun
    gender: n
    plural: "die Motorräder"
    en: the loud two-wheeled vehicle with an engine that a rider sits astride
    ru: громкое двухколёсное средство с двигателем, на котором сидят верхом
    uk: гучний двоколісний засіб із двигуном, на якому сидять верхи
    example_de: Mein Nachbar fährt im Sommer jeden Tag Motorrad.
    example_en: My neighbour rides his motorbike every day in summer.
    example_ru: Летом мой сосед каждый день ездит на мотоцикле.
    example_uk: Улітку мій сусід щодня їздить на мотоциклі.
    note:
      en: 'Neuter, and the plural takes an umlaut: die Motorräder. The verb frame is the same one A1 uses for a bicycle — Motorrad fahren, with no article, and mit dem Motorrad fahren when the vehicle is the means. A2 der Motorroller is the small scooter with a step-through frame, a different machine. The rider is der Motorradfahrer, and the compulsory hat is der Helm.'
      ru: 'Средний род, множественное с умлаутом: die Motorräder. Конструкция та же, что на A1 для велосипеда: Motorrad fahren, без артикля, а mit dem Motorrad fahren — когда машина названа как средство. der Motorroller уровня A2 — маленький скутер с открытой рамой, другая машина. Водитель — der Motorradfahrer, а обязательный головной убор — der Helm.'
      uk: 'Середній рід, множина з умлаутом: die Motorräder. Конструкція та сама, що на A1 для велосипеда: Motorrad fahren, без артикля, а mit dem Motorrad fahren — коли машину названо як засіб. der Motorroller рівня A2 — маленький скутер із відкритою рамою, інша машина. Водій — der Motorradfahrer, а обов’язковий головний убір — der Helm.'

  - de: E-Bike
    ipa: "ˈiːˌbaɪ̯k"
    pos: noun
    gender: n
    plural: "die E-Bikes"
    en: a bicycle with a small motor that pushes along while you pedal
    ru: велосипед с небольшим мотором, который подталкивает, пока крутишь педали
    uk: велосипед із невеликим мотором, що підштовхує, поки крутиш педалі
    example_de: Mit dem E-Bike schaffe ich die Steigung ohne Probleme.
    example_en: I manage the climb without any trouble on the e-bike.
    example_ru: На электровелосипеде я одолеваю подъём без труда.
    example_uk: На електровелосипеді я долаю підйом без труднощів.
    note:
      en: 'A recent loan, neuter because A1 das Fahrrad is, with the plural in -s. The E- is spoken as the German letter name, iː, and the second half stays English: ˈiːˌbaɪ̯k. Germans distinguish it from das Pedelec, which only helps while you pedal and needs no licence; in everyday speech the two have merged. Older relatives will still say das Elektrofahrrad. The charger is das Ladegerät.'
      ru: 'Недавнее заимствование, средний род — потому что таково das Fahrrad уровня A1, — множественное на -s. E- читается как немецкое название буквы, iː, а вторая половина остаётся английской: ˈiːˌbaɪ̯k. Немцы отличают его от das Pedelec, который помогает только при вращении педалей и не требует прав; в быту эти два слова слились. Старшие родственники всё ещё скажут das Elektrofahrrad. Зарядка — das Ladegerät.'
      uk: 'Нещодавнє запозичення, середній рід — бо таким є das Fahrrad рівня A1, — множина на -s. E- читається як німецька назва літери, iː, а друга половина лишається англійською: ˈiːˌbaɪ̯k. Німці відрізняють його від das Pedelec, який допомагає лише при обертанні педалей і не потребує прав; у побуті ці два слова злилися. Старші родичі досі скажуть das Elektrofahrrad. Зарядка — das Ladegerät.'

  - de: S-Bahn
    ipa: "ˈɛsˌbaːn"
    pos: noun
    gender: f
    plural: "die S-Bahnen"
    en: the city railway that runs mostly above ground and out into the suburbs
    ru: городская железная дорога, которая идёт в основном по поверхности и уходит в пригороды
    uk: міська залізниця, що йде переважно поверхнею і виходить у передмістя
    example_de: Vom Flughafen fährt alle zehn Minuten eine S-Bahn in die Stadt.
    example_en: There is a suburban train into town from the airport every ten minutes.
    example_ru: От аэропорта в город каждые десять минут идёт городская электричка.
    example_uk: Від летовища в місто щодесять хвилин іде міська електричка.
    note:
      en: 'Spoken as the letter plus the noun, ˈɛsˌbaːn, and feminine because die Bahn is. The S stands for Schnellbahn or Stadtbahn depending on whom you ask, and it is genuinely a different network from A1 die U-Bahn, which stays underground and inside the city: they share a ticket but not a map. Every German city plan colours the S green and the U blue, and the sentence you need is mit der S-Bahn fahren.'
      ru: 'Читается как буква плюс существительное, ˈɛsˌbaːn, женский род — потому что такова die Bahn. S расшифровывают как Schnellbahn или Stadtbahn, смотря кого спросить, и это действительно другая сеть, чем die U-Bahn уровня A1, которая идёт под землёй и не выходит за город: билет у них общий, а карта разная. На любом немецком плане S зелёная, а U синяя, и нужная фраза — mit der S-Bahn fahren.'
      uk: 'Читається як літера плюс іменник, ˈɛsˌbaːn, жіночий рід — бо такою є die Bahn. S розшифровують як Schnellbahn або Stadtbahn, залежно від того, кого спитати, і це справді інша мережа, ніж die U-Bahn рівня A1, що йде під землею й не виходить за місто: квиток у них спільний, а мапа різна. На будь-якому німецькому плані S зелена, а U синя, і потрібна фраза — mit der S-Bahn fahren.'

  - de: Eisenbahn
    ipa: "ˈaɪ̯zn̩ˌbaːn"
    pos: noun
    gender: f
    plural: "die Eisenbahnen"
    # Recognition only: A2 ships `Bahn` ("train; railway", reisen-urlaub) as the
    # production card, and this is the same idea in the older, fuller word.
    cards: recognition
    en: the railway as a whole system of rails, trains and timetables, in the older word
    ru: железная дорога как целая система рельсов, поездов и расписаний — в более старом слове
    uk: залізниця як ціла система рейок, поїздів і розкладів — у давнішому слові
    example_de: Sein Großvater hat sein ganzes Leben bei der Eisenbahn gearbeitet.
    example_en: His grandfather worked for the railway all his life.
    example_ru: Его дед всю жизнь проработал на железной дороге.
    example_uk: Його дід усе життя пропрацював на залізниці.
    note:
      en: 'Literally the iron road, and modern German has shortened it to A2 die Bahn for almost every purpose — the national operator is die Deutsche Bahn and nobody adds the first half. This longer word survives in two places: talk about the institution as an employer, bei der Eisenbahn arbeiten, and the toy under a Christmas tree, die Modelleisenbahn. The crossing is der Bahnübergang.'
      ru: 'Буквально «железная дорога», и современный немецкий почти везде сократил это до die Bahn уровня A2: национальный перевозчик — die Deutsche Bahn, и первую половину никто не добавляет. Более длинное слово уцелело в двух местах: разговор об учреждении как о работодателе — bei der Eisenbahn arbeiten — и игрушка под ёлкой, die Modelleisenbahn. Переезд — der Bahnübergang.'
      uk: 'Буквально «залізна дорога», і сучасна німецька майже всюди скоротила це до die Bahn рівня A2: національний перевізник — die Deutsche Bahn, і першу половину ніхто не додає. Довше слово вціліло у двох місцях: розмова про установу як про роботодавця — bei der Eisenbahn arbeiten — і іграшка під ялинкою, die Modelleisenbahn. Переїзд — der Bahnübergang.'

  - de: Fähre
    ipa: "ˈfɛːʁə"
    pos: noun
    gender: f
    plural: "die Fähren"
    en: the boat that carries cars and people across water on a fixed short route
    ru: судно, которое возит машины и людей через воду по короткому постоянному маршруту
    uk: судно, що возить машини й людей через воду коротким постійним маршрутом
    example_de: Nach Rügen kann man auch mit der Fähre fahren.
    example_en: You can also get to Rügen by ferry.
    example_ru: На Рюген можно добраться и на пароме.
    example_uk: На Рюген можна дістатися й поромом.
    note:
