    example_uk: Чи можете ви пригадати номер машини?
    note:
      en: 'A German plate is readable: the first letters are the district — M for München, B for Berlin, HH for Hamburg — so the word doubles as a hint about where a car is from. The everyday synonym is das Nummernschild, and the full official term is das Kfz-Kennzeichen. In the second sense it is a mark that tells things apart: ein Kennzeichen guter Arbeit. The verb is kennzeichnen, to mark.'
      ru: 'Немецкий номер читается: первые буквы — округ, M для Мюнхена, B для Берлина, HH для Гамбурга, — так что слово заодно подсказывает, откуда машина. Обиходный синоним — das Nummernschild, а полный официальный термин — das Kfz-Kennzeichen. Во втором значении это признак, по которому вещи различают: ein Kennzeichen guter Arbeit. Глагол — kennzeichnen, «помечать».'
      uk: 'Німецький номер читається: перші літери — округ, M для Мюнхена, B для Берліна, HH для Гамбурга, — тож слово заразом підказує, звідки машина. Побутовий синонім — das Nummernschild, а повний офіційний термін — das Kfz-Kennzeichen. У другому значенні це ознака, за якою речі розрізняють: ein Kennzeichen guter Arbeit. Дієслово — kennzeichnen, «позначати».'

  - de: Strafzettel
    ipa: "ˈʃtʁaːfˌtsɛtl̩"
    pos: noun
    gender: m
    plural: "die Strafzettel"
    en: the slip of paper a driver finds under the wiper after parking where they should not
    ru: бумажка, которую водитель находит под дворником, припарковавшись там, где нельзя
    uk: папірець, який водій знаходить під двірником, припаркувавшись там, де не можна
    example_de: Ich habe schon wieder einen Strafzettel bekommen.
    example_en: I have got another parking ticket.
    example_ru: Я снова получил штрафную квитанцию.
    example_uk: Я знову отримав штрафну квитанцію.
    note:
      en: 'Colloquial and vivid — literally a punishment slip — where the official letter that follows says das Verwarnungsgeld for a small sum and der Bußgeldbescheid for a larger one. The verb is bekommen or kriegen, never haben. Singular and plural are spelled alike. The wardens who issue them are die Politesse or, officially, der Ordnungsdienst.'
      ru: 'Разговорное и наглядное — буквально «штрафной листок», — тогда как приходящее следом официальное письмо назовёт это das Verwarnungsgeld при малой сумме и der Bußgeldbescheid при большей. Глагол — bekommen или kriegen, но не haben. Единственное и множественное пишутся одинаково. Тех, кто их выписывает, зовут die Politesse, а официально — der Ordnungsdienst.'
      uk: 'Розмовне й наочне — буквально «штрафний папірець», — тоді як офіційний лист, що приходить слідом, назве це das Verwarnungsgeld за малої суми і der Bußgeldbescheid за більшої. Дієслово — bekommen або kriegen, але не haben. Однина й множина пишуться однаково. Тих, хто їх виписує, звуть die Politesse, а офіційно — der Ordnungsdienst.'

  - de: Transport
    ipa: "tʁansˈpɔʁt"
    pos: noun
    gender: m
    plural: "die Transporte"
    # Recognition only: the deck sells its typed card in this pair to the verb below,
    # and the noun is freight-and-logistics register a learner reads rather than says.
    cards: recognition
    en: the moving of goods over a distance, as a business or a bill of costs names it
    ru: перевозка грузов на расстояние — так, как это называет фирма или счёт расходов
    uk: перевезення вантажів на відстань — так, як це називає фірма чи рахунок витрат
    example_de: Der Transport der Möbel kostet zweihundert Euro extra.
    example_en: Transporting the furniture costs two hundred euros extra.
    example_ru: Перевозка мебели стоит двести евро сверху.
    example_uk: Перевезення меблів коштує двісті євро згори.
    note:
      en: 'Stress on the last syllable, and the plural counts individual runs: drei Transporte pro Woche. It is the word of a business and an invoice, while what a person moves about in is A2 das Verkehrsmittel and how they get somewhere is mit dem Auto or zu Fuß. Compounds fill a logistics website: das Transportunternehmen, die Transportkosten, der Transporter, which is a small van.'
      ru: 'Ударение на последнем слоге, а множественное считает отдельные рейсы: drei Transporte pro Woche. Это слово фирмы и счёта, тогда как то, на чём человек передвигается, — das Verkehrsmittel уровня A2, а как он добирается — mit dem Auto или zu Fuß. Составные слова наполняют логистический сайт: das Transportunternehmen, die Transportkosten, der Transporter — небольшой фургон.'
      uk: 'Наголос на останньому складі, а множина рахує окремі рейси: drei Transporte pro Woche. Це слово фірми й рахунку, тоді як те, чим людина пересувається, — das Verkehrsmittel рівня A2, а як вона дістається — mit dem Auto або zu Fuß. Складні слова наповнюють логістичний сайт: das Transportunternehmen, die Transportkosten, der Transporter — невеликий фургон.'

  - de: transportieren
    ipa: "tʁanspɔʁˈtiːʁən"
    pos: verb
    praesens_3sg: transportiert
    partizip2: transportiert
    aux: haben
    valence: "+ Akk"
    en: to carry goods or people from one place to another, usually by vehicle
    ru: перевозить грузы или людей из одного места в другое, обычно транспортом
    uk: перевозити вантажі або людей з одного місця в інше, зазвичай транспортом
    example_de: Mit diesem Wagen können wir alles auf einmal transportieren.
    example_en: We can carry everything in one go with this van.
    example_ru: На этой машине мы можем перевезти всё за один раз.
    example_uk: Цією машиною ми можемо перевезти все за один раз.
    note:
      en: 'A verb in -ieren, so the Partizip II has no ge-: hat transportiert. It needs an accusative object and is neutral about the means — a lorry, a lift, a pipe and a person''s two arms all do it. A2 bringen is what you do to one thing for one person; this is the word for a load. Figuratively an idea can be carried too: eine Botschaft transportieren.'
      ru: 'Глагол на -ieren, поэтому в Partizip II нет ge-: hat transportiert. Ему нужно дополнение в Akkusativ, а к средству он безразличен: грузовик, лифт, труба и собственные руки — всё годится. bringen уровня A2 — принести одну вещь одному человеку, а это слово о грузе. В переносном смысле переносят и мысль: eine Botschaft transportieren.'
      uk: 'Дієслово на -ieren, тому в Partizip II немає ge-: hat transportiert. Йому потрібен додаток у Akkusativ, а до засобу воно байдуже: вантажівка, ліфт, труба і власні руки — усе годиться. bringen рівня A2 — принести одну річ одній людині, а це слово про вантаж. У переносному сенсі переносять і думку: eine Botschaft transportieren.'
