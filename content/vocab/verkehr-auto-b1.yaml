      uk: 'der Weg рівня A1 — шлях, яким ідуть, і слово може бути про те, як кудись дістатися; тут же йдеться про сам відрізок, відміряний і названий з обох кінців. Залізниця називає так лінію — die Strecke ist gesperrt, оголошення про закриття, яке ви почуєте, — а бігун так називає дистанцію: eine Strecke von zehn Kilometern. За словом стоїть дієслово strecken, «розтягувати».'

  - de: Einbahnstraße
    ipa: "ˈaɪ̯nbaːnˌʃtʁaːsə"
    pos: noun
    gender: f
    plural: "die Einbahnstraßen"
    # Recognition only: sign register — a learner in the passenger seat says
    # `Da darf man nicht rein` rather than naming the category.
    cards: recognition
    en: a street on which traffic may only move in one direction
    ru: улица, по которой движение разрешено только в одну сторону
    uk: вулиця, якою рух дозволено лише в один бік
    example_de: Das ist eine Einbahnstraße, wir müssen außen herum.
    example_en: That is a one-way street, we have to go round the outside.
    example_ru: Это улица с односторонним движением, придётся объехать.
    example_uk: Це вулиця з одностороннім рухом, доведеться об’їхати.
    note:
      en: 'Two signs mark it and they say opposite things to opposite ends of the same street: a blue rectangle with a white arrow at the entrance, and a round red circle with a white bar at the exit. Built from ein plus die Bahn plus die Straße, so the word is a three-part compound with the primary stress right at the front. Figuratively it is a situation with no way back: eine Einbahnstraße sein.'
      ru: 'Обозначают её два знака, и с разных концов одной улицы они говорят противоположное: синий прямоугольник с белой стрелкой на въезде и круглый красный с белой полосой на выезде. Составлено из ein, die Bahn и die Straße, то есть трёхчастное сложное слово с главным ударением в самом начале. В переносном смысле это положение без пути назад: eine Einbahnstraße sein.'
      uk: 'Позначають її два знаки, і з різних кінців однієї вулиці вони кажуть протилежне: синій прямокутник із білою стрілкою на в’їзді і круглий червоний із білою смугою на виїзді. Складено з ein, die Bahn і die Straße, тобто тричастинне складне слово з головним наголосом на самому початку. У переносному сенсі це становище без шляху назад: eine Einbahnstraße sein.'

  - de: Ausfahrt
    ipa: "ˈaʊ̯sˌfaːɐ̯t"
    pos: noun
    gender: f
    plural: "die Ausfahrten"
    en: the way out for vehicles — the slip road off a motorway, or the gate out of a yard
    en_compact: the way out for vehicles
    ru: выезд для машин — съезд с автобана или ворота со двора
    uk: виїзд для машин — з’їзд з автобана або ворота з подвір’я
    example_de: Nimm bitte die nächste Ausfahrt und dann rechts.
    example_en: Take the next exit please, and then right.
    example_ru: Пожалуйста, съезжай на ближайшем съезде, а потом направо.
    example_uk: Будь ласка, з’їжджай на найближчому з’їзді, а потім праворуч.
    note:
      en: 'A1 der Ausgang is the door people walk out of; this is the one vehicles drive out of, and the two are never swapped. On a motorway the sign counts them down at 300, 200 and 100 metres, and every German learns the joke that Ausfahrt must be the biggest town in the country. On a private gate the word means keep clear, and its opposite is the next entry.'
      ru: 'der Ausgang уровня A1 — дверь, из которой выходят пешком; здесь же выезжают на машине, и эти два слова не путают. На автобане знак отсчитывает 300, 200 и 100 метров, и каждый немец знает шутку, будто Ausfahrt — самый большой город страны. На частных воротах слово значит «не загораживать», а противоположность ему — следующая запись.'
      uk: 'der Ausgang рівня A1 — двері, з яких виходять пішки; тут же виїжджають машиною, і ці два слова не плутають. На автобані знак відлічує 300, 200 і 100 метрів, і кожен німець знає жарт, ніби Ausfahrt — найбільше місто країни. На приватних воротах слово означає «не загороджувати», а протилежність йому — наступний запис.'

  - de: Einfahrt
    ipa: "ˈaɪ̯nˌfaːɐ̯t"
    pos: noun
    gender: f
    plural: "die Einfahrten"
    # Recognition only: it is above all a sign, and the sentence a learner produces
    # about it is the one on the sign itself, `Einfahrt freihalten`, as a chunk.
    cards: recognition
    en: the way in for vehicles, and the sign that orders you to leave it clear
    ru: въезд для машин и табличка, требующая его не загораживать
    uk: в’їзд для машин і табличка, що вимагає його не загороджувати
    example_de: Parken Sie bitte nicht vor der Einfahrt.
    example_en: Please do not park in front of the entrance.
    example_ru: Пожалуйста, не паркуйтесь перед въездом.
    example_uk: Будь ласка, не паркуйтеся перед в’їздом.
    note:
      en: 'The mirror of the entry above, and A1 der Eingang is again the one for people on foot. In a German street the word is above all a yellow sign reading Einfahrt freihalten, and blocking one is the classic way to have a car towed. On a railway it is also a train coming into a station — die Einfahrt des Zuges, announced over the platform loudspeaker.'
      ru: 'Зеркало записи выше, а der Eingang уровня A1 — снова тот, что для пеших. На немецкой улице это прежде всего жёлтая табличка с надписью Einfahrt freihalten, и загородить такой въезд — классический способ лишиться машины, которую увезёт эвакуатор. На железной дороге это ещё и прибытие поезда на станцию — die Einfahrt des Zuges, о чём объявляют по перрону.'
      uk: 'Дзеркало запису вище, а der Eingang рівня A1 — знову той, що для піших. На німецькій вулиці це передусім жовта табличка з написом Einfahrt freihalten, і загородити такий в’їзд — класичний спосіб позбутися машини, яку відвезе евакуатор. На залізниці це ще й прибуття поїзда на станцію — die Einfahrt des Zuges, про що оголошують на пероні.'

  - de: Verkehrszeichen
    ipa: "fɛɐ̯ˈkeːɐ̯sˌtsaɪ̯çn̩"
    pos: noun
    gender: n
    plural: "die Verkehrszeichen"
    # Recognition only: A2 ships `Schild` ("sign (road sign, notice)",
    # verkehr-unterwegs-a2) as the production card for the object at the roadside.
    cards: recognition
    en: one of the metal plates at the roadside that tell a driver what is allowed
    ru: одна из металлических табличек у дороги, которые говорят водителю, что можно
    uk: одна з металевих табличок біля дороги, що кажуть водієві, що можна
    example_de: Dieses Verkehrszeichen bedeutet, dass hier Kinder spielen.
    example_en: This road sign means that children play here.
    example_ru: Этот дорожный знак означает, что здесь играют дети.
    example_uk: Цей дорожній знак означає, що тут граються діти.
    note:
      en: 'The formal term used by the Straßenverkehrsordnung, the German rules of the road; in speech the same object is A2 das Schild, and everybody says Siehst du das Schild? The shapes are systematic and worth reading once: a red triangle warns, a red circle forbids, a blue circle instructs, and a blue rectangle informs. Built from A2 der Verkehr with a linking -s-.'
      ru: 'Официальный термин из Straßenverkehrsordnung, немецких правил дорожного движения; в речи тот же предмет — das Schild уровня A2, и все говорят Siehst du das Schild? Формы устроены системно, и стоит прочесть об этом раз: красный треугольник предупреждает, красный круг запрещает, синий круг предписывает, синий прямоугольник сообщает. Образовано от der Verkehr уровня A2 со связующим -s-.'
      uk: 'Офіційний термін зі Straßenverkehrsordnung, німецьких правил дорожнього руху; у мовленні той самий предмет — das Schild рівня A2, і всі кажуть Siehst du das Schild? Форми влаштовано системно, і варто прочитати про це раз: червоний трикутник попереджає, червоне коло забороняє, синє коло приписує, синій прямокутник повідомляє. Утворене від der Verkehr рівня A2 зі сполучним -s-.'

  - de: Geschwindigkeitsbeschränkung
    ipa: "gəˈʃvɪndɪçkaɪ̯tsbəˌʃʁɛŋkʊŋ"
    pos: noun
    gender: f
    plural: "die Geschwindigkeitsbeschränkungen"
    # Recognition only: officialese of the first order — twenty-seven letters that a
    # driver replaces with `Tempo 50` or the number on the sign.
    cards: recognition
    en: the upper limit on how fast traffic may go along a stretch of road
    ru: верхний предел того, насколько быстро можно ехать на участке дороги
    uk: верхня межа того, наскільки швидко можна їхати на ділянці дороги
    example_de: Auf dieser Strecke gilt eine Geschwindigkeitsbeschränkung von 80.
    example_en: A speed limit of 80 applies on this stretch.
    example_ru: На этом участке действует ограничение скорости 80.
    example_uk: На цій ділянці діє обмеження швидкості 80.
    note:
      en: 'Twenty-seven letters, and a good demonstration of how a German compound is built and read: B1 die Geschwindigkeit plus a linking -s- plus die Beschränkung, from beschränken, to restrict. Nobody says it at the wheel — a driver says Hier ist Tempo 50 or just reads the number. The everyday alternatives are das Tempolimit and die Höchstgeschwindigkeit, both shorter and both common in news.'
      ru: 'Двадцать семь букв и наглядный урок того, как немецкое сложное слово строится и читается: die Geschwindigkeit уровня B1 плюс связующее -s- плюс die Beschränkung, от beschränken, «ограничивать». За рулём так никто не говорит: водитель скажет Hier ist Tempo 50 или просто прочтёт число. Обиходные замены — das Tempolimit и die Höchstgeschwindigkeit, оба короче и оба часты в новостях.'
      uk: 'Двадцять сім літер і наочний урок того, як німецьке складне слово будується і читається: die Geschwindigkeit рівня B1 плюс сполучне -s- плюс die Beschränkung, від beschränken, «обмежувати». За кермом так ніхто не каже: водій скаже Hier ist Tempo 50 або просто прочитає число. Побутові заміни — das Tempolimit і die Höchstgeschwindigkeit, обидві коротші й обидві часті в новинах.'

  - de: Tempo
    ipa: "ˈtɛmpo"
    pos: noun
    gender: n
    plural: "die Tempos"
    # Recognition only: it carries two unrelated senses one prompt cannot name — the
    # rate at which something moves, and, in Germany, a paper handkerchief — the
    # `unheimlich`/`intensiv` ruling from eigenschaften-bewertung-b1.
    cards: recognition
    en: the rate at which something moves or gets done; also, in Germany, a paper tissue
    ru: темп, с которым что-то движется или делается; а в Германии ещё и бумажный платок
    uk: темп, з яким щось рухається або робиться; а в Німеччині ще й паперова хустинка
    example_de: Auf dieser Straße gilt Tempo 30.
    example_en: A thirty limit applies on this street.
    example_ru: На этой улице действует ограничение 30.
    example_uk: На цій вулиці діє обмеження 30.
    note:
      en: 'On a road it is short and practical — Tempo 30, das Tempolimit — where B1 die Geschwindigkeit is the measured quantity a report gives. Outside traffic it is any pace at all: das Tempo der Arbeit, and Tempo! shouted at somebody means hurry up. And then there is the brand: ein Tempo is what a German offers you when you sneeze, whoever made it. The plural for the tissue is Tempos.'
      ru: 'На дороге оно короткое и деловое — Tempo 30, das Tempolimit, — тогда как die Geschwindigkeit уровня B1 — измеренная величина, которую приводит сводка. Вне движения это любой темп: das Tempo der Arbeit, а выкрикнутое Tempo! значит «быстрее». И есть ещё марка: ein Tempo — то, что немец протянет вам, когда вы чихнёте, кто бы его ни выпустил. Множественное для платка — Tempos.'
      uk: 'На дорозі воно коротке й ділове — Tempo 30, das Tempolimit, — тоді як die Geschwindigkeit рівня B1 — виміряна величина, яку наводить зведення. Поза рухом це будь-який темп: das Tempo der Arbeit, а вигукнуте Tempo! означає «швидше». І є ще марка: ein Tempo — те, що німець простягне вам, коли ви чхнете, хто б його не випустив. Множина для хустинки — Tempos.'

  - de: Vorfahrt
    ipa: "ˈfoːɐ̯ˌfaːɐ̯t"
    pos: noun
    gender: f
    plural: "—"
    en: the right to drive on first where two roads meet
    ru: право проехать первым там, где сходятся две дороги
    uk: право проїхати першим там, де сходяться дві дороги
    example_de: An dieser Kreuzung hat der Verkehr von rechts Vorfahrt.
    example_en: Traffic from the right has priority at this junction.
    example_ru: На этом перекрёстке преимущество у транспорта справа.
    example_uk: На цьому перехресті перевага в транспорту праворуч.
    note:
      en: 'No plural, and it lives in three fixed phrases: Vorfahrt haben, Vorfahrt gewähren and jemandem die Vorfahrt nehmen, which is what a driver is accused of after a collision. The default rule in Germany is rechts vor links, unless a sign says otherwise, and the yellow diamond means you have it. Austria and Switzerland say der Vorrang for the same right.'
      ru: 'Множественного нет, и слово живёт в трёх устойчивых оборотах: Vorfahrt haben, Vorfahrt gewähren и jemandem die Vorfahrt nehmen — последнее вменяют водителю после столкновения. По умолчанию в Германии действует rechts vor links, если знак не говорит иного, а жёлтый ромб означает, что преимущество ваше. Австрия и Швейцария называют то же право der Vorrang.'
      uk: 'Множини немає, і слово живе в трьох усталених зворотах: Vorfahrt haben, Vorfahrt gewähren і jemandem die Vorfahrt nehmen — останнє ставлять на карб водієві після зіткнення. За замовчуванням у Німеччині діє rechts vor links, якщо знак не каже інакше, а жовтий ромб означає, що перевага ваша. Австрія та Швейцарія називають те саме право der Vorrang.'

  # --- Was der Fahrer tut ---
  - de: abbiegen
    ipa: "ˈapˌbiːgn̩"
    pos: verb
    praesens_3sg: biegt ab
    partizip2: abgebogen
    aux: sein
    en: to leave the road you are on by turning into another one
    ru: сворачивать с дороги, по которой едешь, на другую
    uk: звертати з дороги, якою їдеш, на іншу
    example_de: An der Ampel müssen Sie links abbiegen.
    example_en: You have to turn left at the traffic light.
    example_ru: На светофоре вам нужно повернуть налево.
    example_uk: На світлофорі вам треба повернути ліворуч.
    note:
      en: 'Separable and strong, with sein in the Perfekt because it is a change of place: Er ist rechts abgebogen. It is the word for directions, and it always comes with links, rechts or in die Straße. Do not use A2 wenden, which is turning the whole vehicle round to go back, or umdrehen, which is turning an object over. The sign warning of a turn is der Abbieger.'
      ru: 'Отделяемый и сильный, в Perfekt с sein, потому что это перемена места: Er ist rechts abgebogen. Это слово объяснений дороги, и при нём всегда стоит links, rechts или in die Straße. Не берите wenden уровня A2 — это развернуть машину и поехать назад, — и не берите umdrehen, «перевернуть предмет». Знак, предупреждающий о повороте, — der Abbieger.'
      uk: 'Відокремлюване й сильне, у Perfekt із sein, бо це зміна місця: Er ist rechts abgebogen. Це слово пояснень дороги, і при ньому завжди стоїть links, rechts або in die Straße. Не беріть wenden рівня A2 — це розвернути машину й поїхати назад, — і не беріть umdrehen, «перевернути предмет». Знак, що попереджає про поворот, — der Abbieger.'

  - de: überholen
    ipa: "yːbɐˈhoːlən"
    pos: verb
    praesens_3sg: überholt
    partizip2: überholt
    aux: haben
    valence: "+ Akk"
    en: to pass a slower vehicle and carry on ahead of it
    ru: обгонять более медленную машину и уходить вперёд
    uk: обганяти повільнішу машину й іти вперед
    example_de: Auf dieser Strecke darf man nicht überholen.
    example_en: Overtaking is not allowed on this stretch.
    example_ru: На этом участке обгон запрещён.
    example_uk: На цій ділянці обгін заборонено.
    note:
      en: 'Inseparable — the stress is on -ho-, the prefix stays put, and the Partizip II has no ge-: hat überholt. That matters, because a handful of German verbs in über- exist in both a separable and an inseparable form with different meanings, and this one is only ever inseparable. The sign forbidding it shows one red car beside one black. A second sense is figurative: eine überholte Idee is an outdated one.'
      ru: 'Неотделяемый: ударение на -ho-, приставка не уходит, а в Partizip II нет ge- — hat überholt. Это важно, потому что у нескольких немецких глаголов на über- есть и отделяемая, и неотделяемая форма с разными значениями, а этот всегда только неотделяемый. Знак, запрещающий обгон, показывает красную машину рядом с чёрной. Второе значение переносное: eine überholte Idee — устаревшая мысль.'
      uk: 'Невідокремлюване: наголос на -ho-, префікс не йде, а в Partizip II немає ge- — hat überholt. Це важливо, бо в кількох німецьких дієслів на über- є і відокремлювана, і невідокремлювана форма з різними значеннями, а це завжди лише невідокремлюване. Знак, що забороняє обгін, показує червону машину поряд із чорною. Друге значення переносне: eine überholte Idee — застаріла думка.'

  - de: überqueren
    ipa: "yːbɐˈkveːʁən"
    pos: verb
    praesens_3sg: überquert
    partizip2: überquert
    aux: haben
    valence: "+ Akk"
    en: to go across a street or a square from one side to the other
    ru: пересекать улицу или площадь с одной стороны на другую
    uk: перетинати вулицю чи площу з одного боку на інший
    example_de: Überqueren Sie die Straße bitte an der Ampel.
    example_en: Please cross the road at the traffic light.
    example_ru: Пожалуйста, переходите улицу на светофоре.
    example_uk: Будь ласка, переходьте вулицю на світлофорі.
    note:
      en: 'Inseparable, no ge- in the Partizip II, and it takes a direct object where English needs across: die Straße überqueren, not über die Straße. It works for anything with two sides — a river, a square, a border, an ocean. In casual speech Germans just say über die Straße gehen; this verb is the one on a sign and in a written instruction. The qu is spoken kv.'
      ru: 'Неотделяемый, в Partizip II нет ge-, и дополнение при нём прямое там, где по-русски нужен предлог: die Straße überqueren. Работает со всем, у чего есть две стороны, — река, площадь, граница, океан. В обиходной речи немцы просто скажут über die Straße gehen; этот глагол — язык таблички и письменной инструкции. Сочетание qu произносится «кв».'
      uk: 'Невідокремлюване, у Partizip II немає ge-, і додаток при ньому прямий там, де українською потрібен прийменник: die Straße überqueren. Працює з усім, що має два боки, — річка, площа, кордон, океан. У побутовому мовленні німці просто скажуть über die Straße gehen; це дієслово — мова таблички і письмової інструкції. Сполука qu вимовляється «кв».'

