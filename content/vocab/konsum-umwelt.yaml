id: konsum-umwelt
title_de: "Konsum & Umwelt"
title_en: "Consumption & the environment"
title_ru: "Потребление и окружающая среда"
title_uk: "Споживання та довкілля"
level: B1
entries:
  - de: "Umwelt"
    ipa: "ˈʊmˌvɛlt"
    pos: noun
    gender: f
    plural: "—"
    en: "environment, the natural world around us"
    ru: "окружающая среда"
    uk: "довкілля, навколишнє середовище"
    example_de: "Weniger Plastik ist gut für die Umwelt."
    example_en: "Less plastic is good for the environment."
    example_ru: "Меньше пластика — лучше для окружающей среды."
    example_uk: "Менше пластику — краще для довкілля."
    note:
      en: "No plural. The adjective is umweltfreundlich — kind to it; compounds like der Umweltschutz build on it."
      ru: "Без множественного числа. Прилагательное — umweltfreundlich «экологичный»; на нём строятся сложные слова вроде der Umweltschutz."
      uk: "Без множини. Прикметник — umweltfreundlich «екологічний»; на ньому будуються складні слова на кшталт der Umweltschutz."

  - de: "Abfall"
    ipa: "ˈapˌfal"
    pos: noun
    gender: m
    plural: "die Abfälle"
    en: "waste, rubbish"
    ru: "отходы, мусор"
    uk: "відходи, сміття"
    example_de: "Bitte werfen Sie den Abfall in die richtige Tonne."
    example_en: "Please put the waste in the right bin."
    example_ru: "Пожалуйста, бросайте отходы в правильный бак."
    example_uk: "Будь ласка, кидайте відходи в правильний бак."
    note:
      en: "The word on signs and in rules; the everyday twin is der Müll. The plural die Abfälle covers kinds of waste."
      ru: "Слово с табличек и из правил; бытовой близнец — der Müll. Множественное die Abfälle — виды отходов."
      uk: "Слово з табличок і з правил; побутовий близнюк — der Müll. Множина die Abfälle — види відходів."

  - de: "Mülltonne"
    ipa: "ˈmʏlˌtɔnə"
    pos: noun
    gender: f
    plural: "die Mülltonnen"
    en: "wheelie bin, big rubbish bin outside"
    ru: "мусорный бак"
    uk: "сміттєвий бак"
    example_de: "Die gelbe Mülltonne ist für Verpackungen."
    example_en: "The yellow bin is for packaging."
    example_ru: "Жёлтый бак — для упаковки."
    example_uk: "Жовтий бак — для упаковки."
    note:
      en: "Usually shortened to die Tonne, and named by colour: die blaue Tonne for paper, die gelbe for packaging."
      ru: "Обычно сокращается до die Tonne и называется по цвету: die blaue Tonne — бумага, die gelbe — упаковка."
      uk: "Зазвичай скорочується до die Tonne і називається за кольором: die blaue Tonne — папір, die gelbe — упаковка."

  - de: "trennen"
    ipa: "ˈtʁɛnən"
    pos: verb
    praesens_3sg: "trennt"
    partizip2: "getrennt"
    aux: haben
    valence: "+ Akk"
    en: "to separate, to sort (waste)"
    ru: "разделять, сортировать (мусор)"
    uk: "розділяти, сортувати (сміття)"
    example_de: "In Deutschland trennt man den Müll sehr genau."
    example_en: "In Germany waste is sorted very carefully."
    example_ru: "В Германии мусор сортируют очень тщательно."
    example_uk: "У Німеччині сміття сортують дуже ретельно."
    note:
      en: "Müll trennen is the fixed pairing of this chapter. With people it is sich trennen von + Dat — to part with someone or something."
      ru: "Müll trennen — устойчивая пара этой главы. О людях — sich trennen von + Dat «расстаться»."
      uk: "Müll trennen — стала пара цього розділу. Про людей — sich trennen von + Dat «розлучитися»."

  - de: "entsorgen"
    ipa: "ɛntˈzɔʁgn̩"
    pos: verb
    praesens_3sg: "entsorgt"
    partizip2: "entsorgt"
    aux: haben
    valence: "+ Akk"
    en: "to dispose of (properly, by the rules)"
    ru: "утилизировать, выбрасывать по правилам"
    uk: "утилізувати, викидати за правилами"
    example_de: "Wo wird das alte Sofa entsorgt?"
    example_en: "Where does the old sofa go for disposal?"
    example_ru: "Куда сдают старый диван?"
    example_uk: "Куди здають старий диван?"
    note:
      en: "The verb of official notices; wegwerfen is the everyday word. The noun die Entsorgung is the cost in this unit's je-desto sentence."
      ru: "Глагол официальных объявлений; бытовое слово — wegwerfen. Существительное die Entsorgung — та самая плата из предложения с je … desto."
      uk: "Дієслово офіційних оголошень; побутове слово — wegwerfen. Іменник die Entsorgung — та сама плата з речення з je … desto."

  - de: "verpacken"
    ipa: "fɛɐ̯ˈpakn̩"
    pos: verb
    praesens_3sg: "verpackt"
    partizip2: "verpackt"
    aux: haben
    valence: "+ Akk"
    en: "to pack, to wrap (goods)"
    ru: "упаковывать"
    uk: "пакувати"
    example_de: "Das Gemüse wird hier nicht in Plastik verpackt."
    example_en: "The vegetables are not wrapped in plastic here."
    example_ru: "Овощи здесь не упаковывают в пластик."
    example_uk: "Овочі тут не пакують у пластик."
    note:
      en: "The noun is die Verpackung — what the yellow bin collects. einpacken is what you do with your own bag at the till."
      ru: "Существительное — die Verpackung, то, что собирает жёлтый бак. einpacken — это про собственную сумку на кассе."
      uk: "Іменник — die Verpackung, те, що збирає жовтий бак. einpacken — це про власну сумку на касі."

  - de: "Hersteller"
    ipa: "ˈheːɐ̯ˌʃtɛlɐ"
    pos: noun
    gender: m
    plural: "die Hersteller"
    en: "manufacturer, maker (the company)"
    ru: "производитель, изготовитель"
    uk: "виробник"
    example_de: "Der Hersteller gibt zwei Jahre Garantie."
    example_en: "The manufacturer gives a two-year guarantee."
    example_ru: "Производитель даёт два года гарантии."
    example_uk: "Виробник дає два роки гарантії."
    note:
      en: "From herstellen — to produce, known since A2. The process is die Herstellung."
      ru: "От herstellen «производить», знакомого с A2. Процесс — die Herstellung."
      uk: "Від herstellen «виробляти», знайомого з A2. Процес — die Herstellung."

  - de: "produzieren"
    ipa: "pʁoduˈtsiːʁən"
    pos: verb
    praesens_3sg: "produziert"
    partizip2: "produziert"
    aux: haben
    valence: "+ Akk"
    en: "to produce, to manufacture"
    ru: "производить"
    uk: "виробляти"
    example_de: "Die Firma produziert seit hundert Jahren Schokolade."
    example_en: "The company has been making chocolate for a hundred years."
    example_ru: "Фирма производит шоколад уже сто лет."
    example_uk: "Фірма виробляє шоколад уже сто років."
    note:
      en: "Near-twin of herstellen; both love the passive: wird produziert, wird hergestellt. The noun is die Produktion."
      ru: "Почти близнец herstellen; оба любят пассив: wird produziert, wird hergestellt. Существительное — die Produktion."
      uk: "Майже близнюк herstellen; обидва люблять пасив: wird produziert, wird hergestellt. Іменник — die Produktion."

  - de: "verbrauchen"
    ipa: "fɛɐ̯ˈbʁaʊ̯xn̩"
    pos: verb
    praesens_3sg: "verbraucht"
    partizip2: "verbraucht"
    aux: haben
    valence: "+ Akk"
    en: "to use up, to consume (water, energy, petrol)"
    en_compact: "to use up, to consume"
    ru: "расходовать, потреблять (воду, энергию, бензин)"
    uk: "витрачати, споживати (воду, енергію, бензин)"
    example_de: "Eine Dusche verbraucht weniger Wasser als ein Bad."
    example_en: "A shower uses less water than a bath."
    example_ru: "Душ расходует меньше воды, чем ванна."
    example_uk: "Душ витрачає менше води, ніж ванна."
    note:
      en: "Using something so that less remains — unlike benutzen, which leaves the thing intact. The noun is der Verbrauch."
      ru: "Использовать так, что остаётся меньше, — в отличие от benutzen, после которого вещь цела. Существительное — der Verbrauch."
      uk: "Використовувати так, що лишається менше, — на відміну від benutzen, після якого річ ціла. Іменник — der Verbrauch."

  - de: "Ware"
    ipa: "ˈvaːʁə"
    pos: noun
    gender: f
    plural: "die Waren"
    en: "goods, merchandise"
    ru: "товар"
    uk: "товар"
    example_de: "Frische Ware kommt jeden Morgen ins Geschäft."
    example_en: "Fresh goods arrive at the shop every morning."
    example_ru: "Свежий товар поступает в магазин каждое утро."
    example_uk: "Свіжий товар надходить у магазин щоранку."
    note:
      en: "Often plural: die Waren. Shop language — das Produkt is the neutral everyday word."
      ru: "Часто во множественном числе: die Waren. Язык торговли — нейтральное бытовое слово это das Produkt."
      uk: "Часто у множині: die Waren. Мова торгівлі — нейтральне побутове слово це das Produkt."

  - de: "Marke"
    ipa: "ˈmaʁkə"
    pos: noun
    gender: f
    plural: "die Marken"
    en: "brand; make"
    ru: "марка, бренд"
    uk: "марка, бренд"
    example_de: "Diese Marke ist teuer, aber die Qualität ist gut."
    example_en: "This brand is expensive, but the quality is good."
    example_ru: "Эта марка дорогая, но качество хорошее."
    example_uk: "Ця марка дорога, але якість хороша."
    note:
      en: "A postage stamp is die Briefmarke — the compound, not this word alone."
      ru: "Почтовая марка — die Briefmarke: сложное слово, а не это слово само по себе."
      uk: "Поштова марка — die Briefmarke: складне слово, а не це слово саме по собі."

  - de: "Sonderangebot"
    ipa: "ˈzɔndɐˌʔangəboːt"
    pos: noun
    gender: n
    plural: "die Sonderangebote"
    en: "special offer"
    ru: "спецпредложение, акция"
    uk: "спеціальна пропозиція, акція"
    example_de: "Der Käse ist diese Woche im Sonderangebot."
    example_en: "The cheese is on special offer this week."
    example_ru: "Сыр на этой неделе по акции."
    example_uk: "Сир цього тижня за акцією."
    note:
      en: "im Sonderangebot sein — to be on special offer. Sonder- carries the special: the plain word for what a shop offers is das Angebot, which you have had since A2."
      ru: "im Sonderangebot sein — «продаваться по акции». «Спец-» несёт именно Sonder-: обычное магазинное предложение — das Angebot, знакомое с A2."
      uk: "im Sonderangebot sein — «продаватися за акцією». «Спец-» несе саме Sonder-: звичайна крамнична пропозиція — das Angebot, знайоме з A2."

  - de: "Rabatt"
    ipa: "ʁaˈbat"
    pos: noun
    gender: m
    plural: "die Rabatte"
    en: "discount"
    ru: "скидка"
    uk: "знижка"
    example_de: "Mit der Karte bekommen Sie zehn Prozent Rabatt."
    example_en: "With the card you get a ten percent discount."
    example_ru: "С картой вы получаете скидку десять процентов."
    example_uk: "З карткою ви отримуєте знижку десять відсотків."
    note:
      en: "Rabatt geben, Rabatt bekommen; the thing discounted follows auf + Akk: Rabatt auf alle Waren."
      ru: "Rabatt geben, Rabatt bekommen; предмет скидки вводит auf + Akk: Rabatt auf alle Waren."
      uk: "Rabatt geben, Rabatt bekommen; предмет знижки вводить auf + Akk: Rabatt auf alle Waren."

  - de: "Umtausch"
    ipa: "ˈʊmˌtaʊ̯ʃ"
    pos: noun
    gender: m
    plural: "—"
    en: "exchange (of a bought item)"
    en_compact: "exchange"
    ru: "обмен (купленного товара)"
    uk: "обмін (купленого товару)"
    example_de: "Der Umtausch ist nur mit Beleg möglich."
    example_en: "An exchange is only possible with the receipt."
    example_ru: "Обмен возможен только при наличии чека."
    example_uk: "Обмін можливий лише за наявності чека."
    note:
      en: "The noun of umtauschen from the A2 complaints chapter. Shop signs say reduzierte Ware ist vom Umtausch ausgeschlossen."
      ru: "Существительное от umtauschen из главы A2 о рекламациях. Табличка в магазине: reduzierte Ware ist vom Umtausch ausgeschlossen."
      uk: "Іменник від umtauschen з розділу A2 про рекламації. Табличка в магазині: reduzierte Ware ist vom Umtausch ausgeschlossen."

  - de: "Beleg"
    ipa: "bəˈleːk"
    pos: noun
    gender: m
    plural: "die Belege"
    en: "receipt, proof of purchase"
    ru: "чек, документ об оплате"
    uk: "чек, документ про оплату"
    example_de: "Ohne Beleg kann ich die Hose leider nicht umtauschen."
    example_en: "Without the receipt I unfortunately cannot exchange the trousers."
    example_ru: "Без чека я, к сожалению, не могу обменять брюки."
    example_uk: "Без чека я, на жаль, не можу обміняти штани."
    note:
      en: "Any paper that proves something — a payment, a purchase. At the till you also hear der Kassenbon and die Quittung."
      ru: "Любая бумага, которая что-то подтверждает: оплату, покупку. На кассе также говорят der Kassenbon и die Quittung."
      uk: "Будь-який папір, що щось підтверджує: оплату, покупку. На касі також кажуть der Kassenbon і die Quittung."

  - de: "schützen"
    ipa: "ˈʃʏtsn̩"
    pos: verb
    praesens_3sg: "schützt"
    partizip2: "geschützt"
    aux: haben
    valence: "+ Akk; vor + Dat"
    en: "to protect"
    ru: "защищать"
    uk: "захищати"
    example_de: "Wer weniger Auto fährt, schützt die Umwelt."
    example_en: "Driving less protects the environment."
    example_ru: "Кто меньше ездит на машине, тот защищает окружающую среду."
    example_uk: "Хто менше їздить автомобілем, той захищає довкілля."
    note:
      en: "What you protect from follows vor + Dat: die Verpackung schützt das Glas vor Schäden. The noun is der Schutz."
      ru: "От чего защищают, вводит vor + Dat: die Verpackung schützt das Glas vor Schäden. Существительное — der Schutz."
      uk: "Від чого захищають, вводить vor + Dat: die Verpackung schützt das Glas vor Schäden. Іменник — der Schutz."

  - de: "sparsam"
    ipa: "ˈʃpaːɐ̯zaːm"
    pos: adj
    en: "economical, careful with money or resources"
    ru: "экономный, бережливый"
    uk: "ощадливий, економний"
    example_de: "Die neue Heizung ist sehr sparsam."
    example_en: "The new heating is very economical."
    example_ru: "Новое отопление очень экономное."
    example_uk: "Нове опалення дуже економне."
    note:
      en: "From sparen. Of machines: using little energy; of people: careful with money — sparsam mit + Dat umgehen."
      ru: "От sparen. О технике — потребляет мало энергии; о людях — бережлив с деньгами: sparsam mit + Dat umgehen."
      uk: "Від sparen. Про техніку — споживає мало енергії; про людей — ощадливий з грошима: sparsam mit + Dat umgehen."

  - de: "regional"
    ipa: "ʁegi̯oˈnaːl"
    pos: adj
    en: "from the surrounding region, locally produced"
    ru: "местный, из своего региона"
    uk: "місцевий, зі свого регіону"
    example_de: "Wir kaufen Obst am liebsten regional."
    example_en: "We prefer to buy fruit from the region."
    example_ru: "Фрукты мы предпочитаем покупать местные."
    example_uk: "Фрукти ми воліємо купувати місцеві."
    note:
      en: "Market German: regionale Produkte, regional einkaufen. Built on die Region from A2."
      ru: "Язык рынка: regionale Produkte, regional einkaufen. Образовано от die Region из A2."
      uk: "Мова ринку: regionale Produkte, regional einkaufen. Утворене від die Region з A2."

  - de: "biologisch"
    ipa: "bioˈloːgɪʃ"
    pos: adj
    en: "organic, organically grown"
    ru: "органический, экологически чистый"
    uk: "органічний, екологічно чистий"
    example_de: "Biologisches Gemüse kostet oft mehr."
    example_en: "Organic vegetables often cost more."
    example_ru: "Органические овощи часто стоят дороже."
    example_uk: "Органічні овочі часто коштують дорожче."
    note:
      en: "Everyday speech shortens it to bio: der Bio-Laden, Bio-Qualität, das ist bio."
      ru: "В быту сокращается до bio: der Bio-Laden, Bio-Qualität, das ist bio."
      uk: "У побуті скорочується до bio: der Bio-Laden, Bio-Qualität, das ist bio."

  - de: "Energie"
    ipa: "enɛʁˈgiː"
    pos: noun
    gender: f
    plural: "die Energien"
    en: "energy, power"
    ru: "энергия"
    uk: "енергія"
    example_de: "Die neue Lampe verbraucht sehr wenig Energie."
    example_en: "The new lamp uses very little energy."
    example_ru: "Новая лампа расходует очень мало энергии."
    example_uk: "Нова лампа витрачає дуже мало енергії."
    note:
      en: "Energie sparen and Energie verbrauchen are the fixed pairings; the plural appears in erneuerbare Energien."
      ru: "Устойчивые пары — Energie sparen и Energie verbrauchen; множественное число живёт в erneuerbare Energien «возобновляемые источники»."
      uk: "Сталі пари — Energie sparen і Energie verbrauchen; множина живе в erneuerbare Energien «відновлювані джерела»."

  - de: "Plastik"
    ipa: "ˈplastɪk"
    pos: noun
    gender: n
    plural: "—"
    en: "plastic"
    ru: "пластик, пластмасса"
    uk: "пластик, пластмаса"
    example_de: "Wir versuchen, weniger Plastik zu kaufen."
    example_en: "We are trying to buy less plastic."
    example_ru: "Мы стараемся покупать меньше пластика."
    example_uk: "Ми намагаємося купувати менше пластику."
    note:
      en: "The everyday word; labels and notices prefer der Kunststoff. Always das in this sense."
      ru: "Бытовое слово; на этикетках и в объявлениях предпочитают der Kunststoff. В этом значении всегда das."
      uk: "Побутове слово; на етикетках і в оголошеннях віддають перевагу der Kunststoff. У цьому значенні завжди das."

  - de: "Konsum"
    ipa: "kɔnˈzuːm"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: "consumption — everything people buy and use"
    ru: "потребление"
    uk: "споживання"
    example_de: "Unser Konsum hat Folgen für die Umwelt."
    example_en: "What we buy and use has consequences for the environment."
    example_ru: "Наше потребление имеет последствия для окружающей среды."
    example_uk: "Наше споживання має наслідки для довкілля."
    note:
      en: "Formal; everyday speech says kaufen and verbrauchen. The verb is konsumieren."
      ru: "Официальное слово; в быту говорят kaufen и verbrauchen. Глагол — konsumieren."
      uk: "Офіційне слово; у побуті кажуть kaufen і verbrauchen. Дієслово — konsumieren."

  - de: "konsumieren"
    ipa: "kɔnzuˈmiːʁən"
    pos: verb
    praesens_3sg: "konsumiert"
    partizip2: "konsumiert"
    aux: haben
    valence: "+ Akk"
    cards: recognition
    en: "to consume, to buy and use"
    ru: "потреблять"
    uk: "споживати"
    example_de: "Wir konsumieren oft mehr, als wir brauchen."
    example_en: "We often consume more than we need."
    example_ru: "Мы часто потребляем больше, чем нам нужно."
    example_uk: "Ми часто споживаємо більше, ніж нам потрібно."
