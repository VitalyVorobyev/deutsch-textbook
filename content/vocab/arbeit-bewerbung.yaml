id: arbeit-bewerbung
title_de: "Arbeit & Bewerbung"
title_en: "Work & job applications"
title_ru: "Работа и трудоустройство"
title_uk: "Робота та працевлаштування"
level: B1
entries:
  - de: "Vorstellungsgespräch"
    ipa: "ˈfoːɐ̯ʃtɛlʊŋsgəˌʃpʁɛːç"
    pos: noun
    gender: n
    plural: "die Vorstellungsgespräche"
    en: "job interview"
    ru: "собеседование (при приёме на работу)"
    uk: "співбесіда (під час прийому на роботу)"
    example_de: "Vor dem Vorstellungsgespräch war Lena ziemlich nervös."
    example_en: "Before the job interview Lena was quite nervous."
    example_ru: "Перед собеседованием Лена изрядно нервничала."
    example_uk: "Перед співбесідою Лена добряче нервувала."
    note:
      en: "Built on sich vorstellen — you introduce yourself. The chunk for holding one is ein Gespräch führen."
      ru: "Слово построено на sich vorstellen — «представиться». Провести собеседование — ein Gespräch führen."
      uk: "Слово побудоване на sich vorstellen — «відрекомендуватися». Провести співбесіду — ein Gespräch führen."

  - de: "Voraussetzung"
    ipa: "foˈʁaʊ̯sˌzɛtsʊŋ"
    pos: noun
    gender: f
    plural: "die Voraussetzungen"
    en: "prerequisite, requirement"
    ru: "предпосылка; требование, условие"
    uk: "передумова; вимога, умова"
    example_de: "Gute Deutschkenntnisse sind eine wichtige Voraussetzung für diese Stelle."
    example_en: "Good German skills are an important requirement for this position."
    example_ru: "Хорошее знание немецкого — важное требование для этой должности."
    example_uk: "Добре знання німецької — важлива вимога для цієї посади."
    note:
      en: "Voraussetzung für + Akk. In job ads it is the heading of the requirements list: Ihre Voraussetzungen."
      ru: "Voraussetzung für + Akk. В объявлениях о работе это заголовок списка требований: Ihre Voraussetzungen."
      uk: "Voraussetzung für + Akk. В оголошеннях про роботу це заголовок списку вимог: Ihre Voraussetzungen."

  - de: "Praktikant"
    ipa: "pʁaktiˈkant"
    pos: noun
    gender: m
    plural: "die Praktikanten"
    en: "intern, trainee"
    ru: "практикант, стажёр"
    uk: "практикант, стажист"
    example_de: "Die Chefin erklärt dem Praktikanten seine erste Aufgabe."
    example_en: "The boss explains his first task to the intern."
    example_ru: "Начальница объясняет практиканту его первое задание."
    example_uk: "Начальниця пояснює практикантові його перше завдання."
    note:
      en: "N-declension, like every masculine person noun in -ant/-ent/-ist. The internship itself is das Praktikum."
      ru: "N-склонение, как у всех существительных-лиц мужского рода на -ant/-ent/-ist. Сама практика — das Praktikum."
      uk: "N-відміна, як в усіх іменників-осіб чоловічого роду на -ant/-ent/-ist. Сама практика — das Praktikum."

  - de: "Eindruck"
    ipa: "ˈaɪ̯nˌdʁʊk"
    pos: noun
    gender: m
    plural: "die Eindrücke"
    en: "impression"
    ru: "впечатление"
    uk: "враження"
    example_de: "Sie hat im Vorstellungsgespräch einen sehr guten Eindruck gemacht."
    example_en: "She made a very good impression at the job interview."
    example_ru: "На собеседовании она произвела очень хорошее впечатление."
    example_uk: "На співбесіді вона справила дуже гарне враження."
    note:
      en: "The chunk is einen Eindruck machen — and English agrees for once: you make an impression too. The verb to keep out is geben, which belongs to Bescheid and eine Antwort. Der erste Eindruck — the first impression."
      ru: "Оборот — einen Eindruck machen: по-русски впечатление производят, по-немецки его «делают». Der erste Eindruck — первое впечатление."
      uk: "Зворот — einen Eindruck machen: українською враження справляють, німецькою його «роблять». Der erste Eindruck — перше враження."

  - de: "Verantwortung"
    ipa: "fɛɐ̯ˈʔantvɔʁtʊŋ"
    pos: noun
    gender: f
    plural: "—"
    en: "responsibility"
    ru: "ответственность"
    uk: "відповідальність"
    example_de: "In ihrer neuen Stelle übernimmt sie viel Verantwortung."
    example_en: "In her new position she takes on a lot of responsibility."
    example_ru: "На новой должности она берёт на себя много ответственности."
    example_uk: "На новій посаді вона бере на себе багато відповідальності."
    note:
      en: "The chunks: Verantwortung übernehmen (take it on) and Verantwortung tragen (carry it), both with für + Akk."
      ru: "Обороты: Verantwortung übernehmen «взять на себя» и Verantwortung tragen «нести», оба с für + Akk."
      uk: "Звороти: Verantwortung übernehmen «взяти на себе» і Verantwortung tragen «нести», обидва з für + Akk."

  - de: "Rolle"
    ipa: "ˈʁɔlə"
    pos: noun
    gender: f
    plural: "die Rollen"
    en: "role, part"
    ru: "роль"
    uk: "роль"
    example_de: "Erfahrung spielt bei dieser Stelle eine große Rolle."
    example_en: "Experience plays a big role for this position."
    example_ru: "Опыт играет большую роль для этой должности."
    example_uk: "Досвід відіграє велику роль для цієї посади."
    note:
      en: "The chunk is eine Rolle spielen — to matter. Das spielt keine Rolle — that makes no difference."
      ru: "Оборот — eine Rolle spielen «играть роль, иметь значение». Das spielt keine Rolle — «это не имеет значения»."
      uk: "Зворот — eine Rolle spielen «відігравати роль, мати значення». Das spielt keine Rolle — «це не має значення»."

  - de: "Mühe"
    ipa: "ˈmyːə"
    pos: noun
    gender: f
    plural: "die Mühen"
    en: "effort, trouble"
    ru: "усилие, старание"
    uk: "зусилля, старання"
    example_de: "Der neue Kollege gibt sich bei jeder Aufgabe viel Mühe."
    example_en: "The new colleague puts a lot of effort into every task."
    example_ru: "Новый коллега очень старается в каждом задании."
    example_uk: "Новий колега дуже старається в кожному завданні."
    note:
      en: "The chunk is sich Mühe geben with a dative sich: ich gebe mir Mühe, du gibst dir Mühe."
      ru: "Оборот — sich Mühe geben, где sich стоит в дативе: ich gebe mir Mühe, du gibst dir Mühe."
      uk: "Зворот — sich Mühe geben, де sich стоїть у давальному: ich gebe mir Mühe, du gibst dir Mühe."

  - de: "Erfolg"
    ipa: "ɛɐ̯ˈfɔlk"
    pos: noun
    gender: m
    plural: "die Erfolge"
    en: "success"
    ru: "успех"
    uk: "успіх"
    example_de: "Viel Erfolg beim Vorstellungsgespräch!"
    example_en: "Good luck with the job interview!"
    example_ru: "Успехов на собеседовании!"
    example_uk: "Успіхів на співбесіді!"
    note:
      en: "The chunk is Erfolg haben — to be successful. The adjective is erfolgreich; the wish is Viel Erfolg!"
      ru: "Оборот — Erfolg haben «иметь успех». Прилагательное — erfolgreich; пожелание — Viel Erfolg!"
      uk: "Зворот — Erfolg haben «мати успіх». Прикметник — erfolgreich; побажання — Viel Erfolg!"

  - de: "einstellen"
    ipa: "ˈaɪ̯nˌʃtɛlən"
    pos: verb
    praesens_3sg: "stellt ein"
    partizip2: "eingestellt"
    aux: haben
    valence: "+ Akk"
    en: "to hire, to take on"
    ru: "принимать на работу, нанимать"
    uk: "брати на роботу, наймати"
    example_de: "Die Firma stellt dieses Jahr drei neue Kollegen ein."
    example_en: "The company is hiring three new colleagues this year."
    example_ru: "Фирма в этом году принимает на работу трёх новых коллег."
    example_uk: "Фірма цього року бере на роботу трьох нових колег."
    note:
      en: "Separable: stellt … ein. The opposite is entlassen. It also means to adjust a device: die Heizung einstellen."
      ru: "Отделяемая приставка: stellt … ein. Антоним — entlassen «уволить». Второе значение — настроить прибор: die Heizung einstellen."
      uk: "Відокремлюваний префікс: stellt … ein. Антонім — entlassen «звільнити». Друге значення — налаштувати прилад: die Heizung einstellen."

  - de: "führen"
    ipa: "ˈfyːʁən"
    pos: verb
    praesens_3sg: "führt"
    partizip2: "geführt"
    aux: haben
    valence: "+ Akk"
    en: "to lead; to conduct"
    ru: "вести; руководить"
    uk: "вести; керувати"
    example_de: "Frau Berger führt heute drei Vorstellungsgespräche."
    example_en: "Ms Berger is conducting three job interviews today."
    example_ru: "Госпожа Бергер проводит сегодня три собеседования."
    example_uk: "Пані Бергер проводить сьогодні три співбесіди."
    note:
      en: "The chunk is ein Gespräch führen — the verb for a formal or scheduled conversation. Ein Gespräch haben is real German too, just looser and more everyday. Eine Firma führen — to run a company."
      ru: "Оборот — ein Gespräch führen: так «ведут» официальный или назначенный разговор. Ein Gespräch haben тоже по-немецки возможно — просто разговорнее и свободнее. Eine Firma führen — «руководить фирмой»."
      uk: "Зворот — ein Gespräch führen: так «ведуть» офіційну або призначену розмову. Ein Gespräch haben німецькою теж можливе — просто розмовніше й вільніше. Eine Firma führen — «керувати фірмою»."

  - de: "Bescheid geben"
    ipa: "bəˈʃaɪ̯t ˈgeːbn̩"
    pos: phrase
    en: "to let (someone) know"
    ru: "сообщить, дать знать"
    uk: "повідомити, дати знати"
    example_de: "Wir geben Ihnen bis Freitag Bescheid."
    example_en: "We will let you know by Friday."
    example_ru: "Мы сообщим вам до пятницы."
    example_uk: "Ми повідомимо вам до п'ятниці."
    note:
      en: "The person takes the dative: jemandem Bescheid geben. Informal sibling: Bescheid sagen. Bescheid wissen — to be in the know."
      ru: "Адресат стоит в дативе: jemandem Bescheid geben. Разговорный вариант — Bescheid sagen. Bescheid wissen — «быть в курсе»."
      uk: "Адресат стоїть у давальному: jemandem Bescheid geben. Розмовний варіант — Bescheid sagen. Bescheid wissen — «бути в курсі»."

  - de: "sich erkundigen"
    ipa: "zɪç ɛɐ̯ˈkʊndɪgn̩"
    pos: verb
    praesens_3sg: "erkundigt sich"
    partizip2: "sich erkundigt"
    aux: haben
    valence: "sich + Akk; nach + Dat"
    en: "to inquire, to ask for information"
    ru: "осведомляться, наводить справки"
    uk: "довідуватися, розпитувати"
    example_de: "Er erkundigt sich am Telefon nach der freien Stelle."
    example_en: "He inquires about the open position on the phone."
    example_ru: "Он по телефону наводит справки о свободной вакансии."
    example_uk: "Він телефоном довідується про вільну вакансію."
    note:
      en: "The formal way to ask: what you ask about follows nach + Dat, the person you ask follows bei + Dat."
      ru: "Официальный способ спросить: то, о чём спрашивают, вводит nach + Dat, того, у кого спрашивают, — bei + Dat."
      uk: "Офіційний спосіб запитати: те, про що питають, вводить nach + Dat, того, в кого питають, — bei + Dat."

  - de: "sich bemühen"
    ipa: "zɪç bəˈmyːən"
    pos: verb
    praesens_3sg: "bemüht sich"
    partizip2: "sich bemüht"
    aux: haben
    valence: "sich + Akk; um + Akk"
    en: "to make an effort, to try hard"
    ru: "стараться, прилагать усилия"
    uk: "старатися, докладати зусиль"
    example_de: "Wir bemühen uns um eine schnelle Antwort auf jede Bewerbung."
    example_en: "We make an effort to reply quickly to every application."
    example_ru: "Мы стараемся быстро отвечать на каждое заявление."
    example_uk: "Ми намагаємося швидко відповідати на кожну заяву."
    note:
      en: "What you strive for follows um + Akk: sich um eine Stelle bemühen. The noun inside it is die Mühe."
      ru: "То, чего добиваются, вводит um + Akk: sich um eine Stelle bemühen. Внутри — существительное die Mühe."
      uk: "Те, чого домагаються, вводить um + Akk: sich um eine Stelle bemühen. Усередині — іменник die Mühe."

  - de: "beschäftigen"
    ipa: "bəˈʃɛftɪgn̩"
    pos: verb
    praesens_3sg: "beschäftigt"
    partizip2: "beschäftigt"
    aux: haben
    valence: "+ Akk / sich beschäftigen mit + Dat"
    en: "to employ; to occupy"
    ru: "давать работу, нанимать; занимать"
    uk: "давати роботу, наймати; займати"
    example_de: "Der Betrieb beschäftigt ungefähr fünfzig Menschen."
    example_en: "The business employs about fifty people."
    example_ru: "Предприятие даёт работу примерно пятидесяти людям."
    example_uk: "Підприємство дає роботу приблизно п'ятдесятьом людям."
    note:
      en: "Being employed is bei einer Firma beschäftigt sein. The reflexive frame sich beschäftigen mit + Dat — to occupy yourself with — you know from the health unit."
      ru: "Работать где-то — bei einer Firma beschäftigt sein. Возвратная рамка sich beschäftigen mit + Dat «заниматься чем-либо» знакома по уроку о здоровье."
      uk: "Працювати десь — bei einer Firma beschäftigt sein. Зворотна рамка sich beschäftigen mit + Dat «займатися чимось» знайома з уроку про здоров'я."

  - de: "beruflich"
    ipa: "bəˈʁuːflɪç"
    pos: adj
    en: "professional; work-related"
    ru: "профессиональный; по работе"
    uk: "професійний; у справах роботи"
    example_de: "Was machen Sie beruflich?"
    example_en: "What do you do for a living?"
    example_ru: "Чем вы занимаетесь по работе?"
    example_uk: "Чим ви займаєтеся по роботі?"
    note:
      en: "The polite small-talk question is Was machen Sie beruflich? Beruflich unterwegs — away on business."
      ru: "Вежливый вопрос при знакомстве: Was machen Sie beruflich? Beruflich unterwegs — «в командировке, по делам работы»."
      uk: "Ввічливе питання при знайомстві: Was machen Sie beruflich? Beruflich unterwegs — «у відрядженні, у справах роботи»."

  - de: "verantwortlich"
    ipa: "fɛɐ̯ˈʔantvɔʁtlɪç"
    pos: adj
    en: "responsible"
    ru: "ответственный"
    uk: "відповідальний"
    example_de: "In der neuen Stelle ist sie für zwei Praktikanten verantwortlich."
    example_en: "In the new position she is responsible for two interns."
    example_ru: "На новой должности она отвечает за двух практикантов."
    example_uk: "На новій посаді вона відповідає за двох практикантів."
    note:
      en: "Verantwortlich für + Akk. The noun is die Verantwortung; job ads write: Sie sind verantwortlich für …"
      ru: "Verantwortlich für + Akk. Существительное — die Verantwortung; в объявлениях пишут: Sie sind verantwortlich für …"
      uk: "Verantwortlich für + Akk. Іменник — die Verantwortung; в оголошеннях пишуть: Sie sind verantwortlich für …"

  - de: "zuverlässig"
    ipa: "ˈtsuːfɛɐ̯ˌlɛsɪç"
    pos: adj
    en: "reliable, dependable"
    ru: "надёжный"
    uk: "надійний"
    example_de: "Wir suchen einen zuverlässigen Kollegen für unser Team."
    example_en: "We are looking for a reliable colleague for our team."
    example_ru: "Мы ищем надёжного коллегу в нашу команду."
    example_uk: "Ми шукаємо надійного колегу в нашу команду."
    note:
      en: "A favourite word of job ads. Built on sich verlassen auf: someone you can rely on."
      ru: "Любимое слово объявлений о работе. Образовано от sich verlassen auf — «полагаться на»."
      uk: "Улюблене слово оголошень про роботу. Утворене від sich verlassen auf — «покладатися на»."

  - de: "selbstständig"
    ipa: "ˈzɛlpstˌʃtɛndɪç"
    pos: adj
    accept: ["selbständig"]
    en: "independent; self-employed"
    ru: "самостоятельный; работающий на себя"
    uk: "самостійний; той, хто працює на себе"
    example_de: "In dieser Stelle müssen Sie selbstständig arbeiten."
    example_en: "In this position you have to work independently."
    example_ru: "На этой должности вам нужно работать самостоятельно."
    example_uk: "На цій посаді вам треба працювати самостійно."
    note:
      en: "Both spellings are correct German: selbstständig and selbständig. Sich selbstständig machen — to start your own business."
      ru: "Верны оба написания: selbstständig и selbständig. Sich selbstständig machen — «открыть своё дело»."
      uk: "Правильні обидва написання: selbstständig і selbständig. Sich selbstständig machen — «відкрити власну справу»."

  - de: "Betrieb"
    ipa: "bəˈtʁiːp"
    pos: noun
    gender: m
    plural: "die Betriebe"
    cards: recognition
    en: "business, company"
    ru: "предприятие"
    uk: "підприємство"
    example_de: "In unserem Betrieb arbeiten ungefähr fünfzig Menschen."
    example_en: "About fifty people work in our business."
    example_ru: "На нашем предприятии работает около пятидесяти человек."
    example_uk: "На нашому підприємстві працює близько п'ятдесяти людей."
    note:
      en: "The workplace as an operation — a workshop, a factory floor, a bakery. Die Firma is the company as a name and address."
      ru: "Рабочее место как производство — мастерская, цех, пекарня. Die Firma — компания как название и адрес."
      uk: "Робоче місце як виробництво — майстерня, цех, пекарня. Die Firma — компанія як назва й адреса."

  - de: "Arbeitsstelle"
    ipa: "ˈaʁbaɪ̯tsˌʃtɛlə"
    pos: noun
    gender: f
    plural: "die Arbeitsstellen"
    cards: recognition
    en: "job, place of work"
    ru: "место работы"
    uk: "місце роботи"
    example_de: "Sie sucht seit zwei Monaten eine neue Arbeitsstelle."
    example_en: "She has been looking for a new job for two months."
    example_ru: "Она уже два месяца ищет новое место работы."
    example_uk: "Вона вже два місяці шукає нове місце роботи."
    note:
      en: "In everyday speech usually just die Stelle."
      ru: "В повседневной речи обычно просто die Stelle."
      uk: "У повсякденному мовленні зазвичай просто die Stelle."

  - de: "Arbeiter"
    ipa: "ˈaʁbaɪ̯tɐ"
    pos: noun
    gender: m
    plural: "die Arbeiter"
    cards: recognition
    en: "worker, labourer"
    ru: "рабочий"
    uk: "робітник"
    example_de: "Die Arbeiter in der Fabrik beginnen um sechs Uhr."
    example_en: "The workers in the factory start at six o'clock."
    example_ru: "Рабочие на фабрике начинают в шесть часов."
    example_uk: "Робітники на фабриці починають о шостій годині."
    note:
      en: "A regular noun — unlike der Angestellte, which is an adjective used as a noun. The female form is die Arbeiterin."
      ru: "Обычное существительное — в отличие от der Angestellte, субстантивированного прилагательного. Женская форма — die Arbeiterin."
      uk: "Звичайний іменник — на відміну від der Angestellte, субстантивованого прикметника. Жіноча форма — die Arbeiterin."

  - de: "Azubi"
    ipa: "aˈtsuːbi"
    pos: noun
    gender: m
