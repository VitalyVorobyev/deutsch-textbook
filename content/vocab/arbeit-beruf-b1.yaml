    note:
      en: 'The money, not the person: A2 der Rentner and die Rentnerin are the people who receive it. Germany says this word, Austria says die Pension, and Switzerland says both plus die AHV for the state scheme. The system is die Rentenversicherung, paid into from every wage, and the age is das Rentenalter. A second meaning survives in finance, where eine Rente is an annuity — a fixed sum paid out at intervals for any reason.'
      ru: 'Это деньги, а не человек: der Rentner и die Rentnerin уровня A2 — те, кто их получает. Германия говорит именно так, Австрия — die Pension, Швейцария — и то и другое плюс die AHV для государственной системы. Сама система — die Rentenversicherung, взносы в неё идут с каждой зарплаты, а возраст — das Rentenalter. Второе значение уцелело в финансах: eine Rente — это аннуитет, фиксированная сумма, выплачиваемая через равные промежутки по любой причине.'
      uk: 'Це гроші, а не людина: der Rentner і die Rentnerin рівня A2 — ті, хто їх отримує. Німеччина каже саме так, Австрія — die Pension, Швейцарія — і те й те плюс die AHV для державної системи. Сама система — die Rentenversicherung, внески до неї йдуть із кожної зарплати, а вік — das Rentenalter. Друге значення вціліло у фінансах: eine Rente — це ануїтет, фіксована сума, яку виплачують через рівні проміжки з будь-якої причини.'

