    en_compact: "to copy, to photocopy"
    ru: делать копию на аппарате или в компьютере
    uk: робити копію на апараті або в комп’ютері
    example_de: Können Sie mir den Vertrag bitte zweimal kopieren?
    example_en: Could you copy the contract for me twice, please?
    example_ru: Скопируйте мне, пожалуйста, договор в двух экземплярах.
    example_uk: Скопіюйте мені, будь ласка, договір у двох примірниках.
    note:
      en: 'An -ieren verb, so the Partizip II has no ge-: hat kopiert. It covers paper and screen alike, and the computer pair is kopieren und einfügen. Beside it, B1 abschreiben is copying by hand from a source or from a neighbour in an exam, and nachmachen is imitating what somebody else does. The noun is A2 die Kopie, and der Kopierer below is the machine.'
      ru: 'Глагол на -ieren, поэтому в Partizip II нет ge-: hat kopiert. Он покрывает и бумагу, и экран, а компьютерная пара — kopieren und einfügen. Рядом: abschreiben уровня B1 — это списывать от руки из источника или у соседа на экзамене, а nachmachen — подражать тому, что делает другой. Существительное — die Kopie уровня A2, а der Kopierer ниже — сам аппарат.'
      uk: 'Дієслово на -ieren, тому в Partizip II немає ge-: hat kopiert. Воно покриває і папір, і екран, а комп’ютерна пара — kopieren und einfügen. Поряд: abschreiben рівня B1 — це списувати від руки з джерела чи в сусіда на іспиті, а nachmachen — наслідувати те, що робить інший. Іменник — die Kopie рівня A2, а der Kopierer нижче — сам апарат.'

  - de: Kopierer
    ipa: "koˈpiːʁɐ"
    pos: noun
    gender: m
    plural: "die Kopierer"
    # Recognition only: read on a sign in the corridor and said as `der Drucker`
    # by half the office — the verb above carries the production prompt.
    cards: recognition
    en: the machine in the corridor that duplicates sheets of paper
    en_compact: "photocopier"
    ru: аппарат в коридоре, который размножает листы бумаги
    uk: апарат у коридорі, що розмножує аркуші паперу
    example_de: Der Kopierer ist schon wieder kaputt.
    example_en: The photocopier has broken down yet again.
    example_ru: Копировальный аппарат опять сломался.
    example_uk: Копіювальний апарат знову зламався.
    note:
      en: 'The -er suffix on a verb makes either the person who does it or the machine that does it, and German lets context decide: der Fahrer is a person, der Rechner is a computer, der Trockner is a dryer. The full word is das Kopiergerät, and a big office device that also prints and scans is now called das Multifunktionsgerät. Careful with der Drucker, which prints from a file rather than duplicating a sheet.'
      ru: 'Суффикс -er на глаголе даёт либо человека, который это делает, либо машину, которая это делает, а различает их контекст: der Fahrer — человек, der Rechner — компьютер, der Trockner — сушилка. Полное слово — das Kopiergerät, а большой офисный аппарат, который ещё печатает и сканирует, сегодня называют das Multifunktionsgerät. Осторожно с der Drucker: он печатает из файла, а не размножает лист.'
      uk: 'Суфікс -er на дієслові дає або людину, яка це робить, або машину, яка це робить, а розрізняє їх контекст: der Fahrer — людина, der Rechner — комп’ютер, der Trockner — сушарка. Повне слово — das Kopiergerät, а великий офісний апарат, що ще й друкує та сканує, сьогодні звуть das Multifunktionsgerät. Обережно з der Drucker: він друкує з файлу, а не розмножує аркуш.'

  - de: Visitenkarte
    ipa: "viˈziːtn̩ˌkaʁtə"
    pos: noun
    gender: f
    plural: "die Visitenkarten"
    en: the small printed card with a person's name, firm and contact details
    en_compact: "business card"
    ru: маленькая печатная карточка с именем, фирмой и контактами человека
    uk: маленька друкована картка з іменем, фірмою та контактами людини
    example_de: Darf ich Ihnen meine Visitenkarte geben?
    example_en: May I give you my business card?
    example_ru: Позвольте дать вам мою визитную карточку.
    example_uk: Дозвольте дати вам мою візитну картку.
    note:
      en: 'From die Visite, a formal call paid on somebody, which survives in German mainly as a doctor''s round in hospital. The card is handed over with both the giving and the reading done unhurriedly, and eine Visitenkarte austauschen is the standard first move at a fair. German uses the word figuratively as well: Der Bahnhof ist die Visitenkarte der Stadt, meaning it is what the town shows of itself first.'
      ru: 'От die Visite — официального визита, который в немецком уцелел в основном как обход врача в больнице. Карточку передают неспешно, так же неспешно её и читают, а eine Visitenkarte austauschen — стандартный первый ход на выставке. Слово живёт и в переносном смысле: Der Bahnhof ist die Visitenkarte der Stadt — то есть первое, что город показывает о себе.'
      uk: 'Від die Visite — офіційного візиту, який у німецькій уцілів здебільшого як обхід лікаря в лікарні. Картку передають неквапно, так само неквапно її й читають, а eine Visitenkarte austauschen — стандартний перший хід на виставці. Слово живе й у переносному сенсі: Der Bahnhof ist die Visitenkarte der Stadt — тобто перше, що місто показує про себе.'
