    example_ru: Мой отец выходит на пенсию в следующем году, а мама уже на пенсии.
    example_uk: Мій батько виходить на пенсію наступного року, а мама вже на пенсії.
    note:
      en: 'Two chunks in one line, and German keeps them apart the way it keeps gehen and sein apart everywhere: the movement verb for the step and the state verb for the situation afterwards. No article: it is in Rente, never in die Rente, and the Perfekt of the first one takes sein (Er ist letztes Jahr in Rente gegangen). Austria says in Pension gehen, Switzerland pensioniert werden. A third, formal wording used in letters is in den Ruhestand treten.'
      ru: 'Два оборота в одной строке, и немецкий различает их так же, как всюду различает gehen и sein: глагол движения — для самого шага, глагол состояния — для положения после. Артикля нет: говорят in Rente, а не in die Rente, и Perfekt первого оборота строится с sein (Er ist letztes Jahr in Rente gegangen). Австрия скажет in Pension gehen, Швейцария — pensioniert werden. Третья, официальная формулировка для писем — in den Ruhestand treten.'
      uk: 'Два звороти в одному рядку, і німецька розрізняє їх так само, як усюди розрізняє gehen і sein: дієслово руху — для самого кроку, дієслово стану — для становища після. Артикля немає: кажуть in Rente, а не in die Rente, і Perfekt першого звороту будується з sein (Er ist letztes Jahr in Rente gegangen). Австрія скаже in Pension gehen, Швейцарія — pensioniert werden. Третє, офіційне формулювання для листів — in den Ruhestand treten.'

