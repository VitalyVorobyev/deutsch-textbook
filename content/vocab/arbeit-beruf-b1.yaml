    en_compact: "flat folder, portfolio"
    ru: плоская папка, в которой носят бумаги, и собрание работ внутри неё
    uk: пласка тека, у якій носять папери, і зібрання робіт усередині неї
    example_de: Er zog die Bewerbung aus einer dünnen schwarzen Mappe.
    example_en: He pulled the application out of a thin black folder.
