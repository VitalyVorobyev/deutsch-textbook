      ru: 'Более старое немецкое слово, ныне официальное в Австрии и Швейцарии, тогда как Германия пишет der Auszubildende, а говорят все der Azubi. Суффикс -ling называет человека по тому, что с ним происходит, и слегка уменьшителен — der Flüchtling, der Säugling, der Frühling, — и отчасти поэтому Германия от него ушла. Собственной женской формы у слова нет: говорят die Auszubildende, а в старом швейцарском обиходе рядом стояло die Lehrtochter.'
      uk: 'Давніше німецьке слово, нині офіційне в Австрії та Швейцарії, тоді як Німеччина пише der Auszubildende, а кажуть усі der Azubi. Суфікс -ling називає людину за тим, що з нею відбувається, і трохи зменшувальний — der Flüchtling, der Säugling, der Frühling, — і почасти тому Німеччина від нього відійшла. Власної жіночої форми слово не має: кажуть die Auszubildende, а в старому швейцарському вжитку поряд стояло die Lehrtochter.'

