      ru: 'Физический труд за плату — это всё значение, и потому die Angestellte ей противостоит: немецкий сохранил старое различие между тем, кто получает der Lohn, и тем, кто получает das Gehalt, и оно до сих пор видно в названиях страховых касс и профсоюзов. За словом тянется политическая история — die Arbeiterklasse, die Arbeiterbewegung, — и звучит оно старомоднее, чем der Mitarbeiter. Осторожно с самим die Arbeit: это любая работа вообще.'
      uk: 'Фізична праця за плату — це все значення, і тому die Angestellte їй протистоїть: німецька зберегла старе розрізнення між тим, хто отримує der Lohn, і тим, хто отримує das Gehalt, і воно досі помітне в назвах страхових кас і профспілок. За словом тягнеться політична історія — die Arbeiterklasse, die Arbeiterbewegung, — і звучить воно старомодніше, ніж der Mitarbeiter. Обережно із самим die Arbeit: це будь-яка робота взагалі.'

