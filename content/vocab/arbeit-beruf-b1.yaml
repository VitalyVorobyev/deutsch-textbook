      ru: 'Образовано от tätig «деятельный, работающий» и называет само делание, а не должность: eine Tätigkeit ausüben, die berufliche Tätigkeit; в резюме под каждым местом работы перечисляют Tätigkeiten. Поле делят три соседа: der Beruf уровня A2 — выученная профессия, die Stelle уровня A2 — конкретная должность в конкретной фирме, а die Beschäftigung выше — сам факт занятости. Вне работы слово значит любую деятельность: körperliche Tätigkeit.'
      uk: 'Утворене від tätig «діяльний, працюючий» і називає саме діяння, а не посаду: eine Tätigkeit ausüben, die berufliche Tätigkeit; у резюме під кожним місцем роботи перелічують Tätigkeiten. Поле ділять три сусіди: der Beruf рівня A2 — вивчена професія, die Stelle рівня A2 — конкретна посада в конкретній фірмі, а die Beschäftigung вище — сам факт зайнятості. Поза роботою слово означає будь-яку діяльність: körperliche Tätigkeit.'

