      ru: 'Традиционное слово для того, что на A2 называется die Ausbildung, и оба живут рядом: eine Lehre machen, in der Lehre sein. Австрия и Швейцария предпочитают именно это, а der Lehrling ниже — тот, кто её проходит. В том же слове живут ещё два смысла: учение как система взглядов (die Lehre Buddhas) и мораль истории — в устойчивом Das soll dir eine Lehre sein. Глагол — lehren «учить, преподавать», он берёт два дополнения в Akkusativ.'
