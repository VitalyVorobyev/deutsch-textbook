      en: 'Unlike the masculine this form is unambiguous: the ladder has no feminine person beside it, so die Leiterin is always a human being. It behaves regularly, plural with a doubled n, and it lives in the same compounds — die Abteilungsleiterin, die Projektleiterin. In job adverts German writes Leiter/-in or, increasingly, Leitung on its own, which avoids naming a gender at all and is why a door plate often reads simply Leitung.'
      ru: 'В отличие от мужской формы эта однозначна: у стремянки нет женского человеческого двойника, так что die Leiterin — всегда человек. Склоняется правильно, во множественном n удваивается, и живёт в тех же составных: die Abteilungsleiterin, die Projektleiterin. В объявлениях о работе пишут Leiter/-in или всё чаще просто Leitung — так пол не называют вовсе, и потому на двери часто стоит одно слово Leitung.'
      uk: 'На відміну від чоловічої форми ця однозначна: у драбини немає жіночого людського двійника, тож die Leiterin — завжди людина. Відмінюється правильно, у множині n подвоюється, і живе в тих самих складних: die Abteilungsleiterin, die Projektleiterin. В оголошеннях про роботу пишуть Leiter/-in або дедалі частіше просто Leitung — так стать не називають зовсім, і тому на дверях часто стоїть одне слово Leitung.'

  - de: Leitung
    ipa: "ˈlaɪ̯tʊŋ"
    pos: noun
    gender: f
    plural: "die Leitungen"
    # Recognition only: three senses in one form — the management, the pipe and the
