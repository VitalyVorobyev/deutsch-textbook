# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the working-life
# field of data/goethe-b1-wortliste.txt: how a job begins and ends, who represents
# whom inside a firm, who is on the payroll in which shape, what stands on the desk
# and where people eat. The profession NAMES are a deck of their own (berufe-b1);
# A2's `arbeit-bewerbung`, `arbeit-ausbildung-a2` and `schule-arbeit` own the basics
# (Stelle, Bewerbung, einstellen, kündigen, Gehalt, Chef, Firma, Vollzeit, Teilzeit).
id: arbeit-beruf-b1
title_de: "Arbeit und Berufsleben"
title_en: "Work and working life"
title_ru: "Работа и трудовая жизнь"
title_uk: "Робота й трудове життя"
level: B1
entries:
  # --- Wie eine Stelle anfängt und aufhört ---
  - de: Beschäftigung
    ipa: "bəˈʃɛftɪgʊŋ"
    pos: noun
    gender: f
    plural: "die Beschäftigungen"
    en: having paid work at all, being on somebody's payroll
    en_compact: "employment"
    ru: "занятость: наличие оплачиваемой работы, состояние в штате"
    uk: "зайнятість: наявність оплачуваної роботи, перебування у штаті"
    example_de: Nach dem Studium fand sie sofort eine feste Beschäftigung.
    example_en: After her degree she found steady employment straight away.
    example_ru: После учёбы она сразу нашла постоянную занятость.
    example_uk: Після навчання вона одразу знайшла постійну зайнятість.
    note:
      en: 'The noun of A2 beschäftigen, and in official German it is the fact of being employed rather than the work itself: eine Beschäftigung suchen, in Beschäftigung stehen, die geringfügige Beschäftigung for a small job below the tax threshold. Beside it, die Tätigkeit below is the work actually done, and A2 die Stelle is the one post at one firm. A second, milder sense is what keeps somebody busy — eine Beschäftigung für die Kinder finden — and sich mit etwas beschäftigen is to occupy oneself with it.'
      ru: 'Существительное от beschäftigen уровня A2, и в официальном немецком это сам факт наличия работы, а не работа: eine Beschäftigung suchen, in Beschäftigung stehen, die geringfügige Beschäftigung — подработка ниже налогового порога. Рядом: die Tätigkeit ниже — это то, что человек фактически делает, а die Stelle уровня A2 — конкретная должность в конкретной фирме. Второй, более мягкий смысл — то, чем занять время: eine Beschäftigung für die Kinder finden, а sich mit etwas beschäftigen значит «заниматься чем-либо».'
      uk: 'Іменник від beschäftigen рівня A2, і в офіційній німецькій це сам факт наявності роботи, а не робота: eine Beschäftigung suchen, in Beschäftigung stehen, die geringfügige Beschäftigung — підробіток нижче податкового порога. Поряд: die Tätigkeit нижче — це те, що людина фактично робить, а die Stelle рівня A2 — конкретна посада в конкретній фірмі. Другий, м’якший сенс — те, чим зайняти час: eine Beschäftigung für die Kinder finden, а sich mit etwas beschäftigen означає «займатися чимось».'

  - de: sich bewerben
    ipa: "zɪç bəˈvɛʁbn̩"
    pos: verb
    praesens_3sg: bewirbt sich
    partizip2: sich beworben
    aux: haben
    valence: "sich + Akk; um + Akk, bei + Dat"
    # Recognition only: A2 ships `bewerben` ("to apply (for a job)",
    # arbeit-ausbildung-a2) as a production card, with `sich bewerben` in its own
    # accept list — the typed prompt is answered one deck over, and this entry
    # exists to key the Wortliste's reflexive headword.
    cards: recognition
    en: to put oneself forward for a job or a place
    ru: подавать заявку на должность или место, претендовать на них
    uk: подавати заявку на посаду чи місце, претендувати на них
    example_de: Er hat sich bei drei Firmen um dieselbe Stelle beworben.
    example_en: He applied to three companies for the same position.
    example_ru: Он подал заявки на одну и ту же должность в три фирмы.
    example_uk: Він подав заявки на ту саму посаду до трьох фірм.
    note:
      en: 'A true reflexive: the pronoun is part of the verb, so there is no version of it without one. Two prepositions divide the sentence and both are needed — um + Akkusativ for what you want, bei + Dativ for where you are asking, as the example shows. The stem vowel changes in the present (du bewirbst dich, er bewirbt sich) and again in the past (bewarb, beworben), which is the strong-verb pattern of werben, to advertise. The noun is die Bewerbung, and das Bewerbungsgespräch is the interview.'
      ru: 'Настоящий возвратный глагол: местоимение здесь часть глагола, и версии без него не существует. Предложение делят два предлога, и нужны оба: um + Akkusativ — на что претендуют, bei + Dativ — куда обращаются, как в примере. В настоящем времени гласная основы меняется (du bewirbst dich, er bewirbt sich), меняется и в прошедшем (bewarb, beworben) — это сильное спряжение глагола werben «рекламировать». Существительное — die Bewerbung, а собеседование — das Bewerbungsgespräch.'
      uk: 'Справжнє зворотне дієслово: займенник тут частина дієслова, і версії без нього не існує. Речення ділять два прийменники, і потрібні обидва: um + Akkusativ — на що претендують, bei + Dativ — куди звертаються, як у прикладі. У теперішньому часі голосна основи змінюється (du bewirbst dich, er bewirbt sich), змінюється й у минулому (bewarb, beworben) — це сильна дієвідміна дієслова werben «рекламувати». Іменник — die Bewerbung, а співбесіда — das Bewerbungsgespräch.'

  - de: anstellen
    ipa: "ˈanˌʃtɛlən"
    pos: verb
    praesens_3sg: stellt an
    partizip2: angestellt
    aux: haben
    valence: "+ Akk / sich"
    # Recognition only: A2 ships `einstellen` ("to hire, to take on",
    # arbeit-bewerbung) as the production card for taking somebody on.
    cards: recognition
    en: to take somebody onto the staff; also to join a queue
    en_compact: "to employ; to queue up"
    ru: брать в штат; также вставать в очередь
    uk: брати до штату; також ставати в чергу
    example_de: Die Firma stellt im Sommer zehn neue Leute an.
    example_en: The company is taking on ten new people in the summer.
    example_ru: Летом фирма берёт в штат десять новых человек.
    example_uk: Улітку фірма бере до штату десять нових людей.
    note:
      en: 'Separable, and it splits three ways. Employing somebody: the result is der Angestellte, an employee, which A2 already cards, and the neighbour einstellen names the act of hiring more sharply. Queueing: sich anstellen, what you do at a counter, and Stell dich hinten an! is the sentence you may hear. Switching on: das Radio anstellen, the same as anmachen. A fourth is idiomatic and always about trouble — Was hast du denn da angestellt?'
      ru: 'Отделяемый, и расходится на три значения. Брать на работу: результат — der Angestellte, «служащий», карточка на A2, а сосед einstellen точнее называет сам акт найма. Вставать в очередь: sich anstellen — то, что делают у окошка, и Stell dich hinten an! вполне можно услышать. Включать: das Radio anstellen, то же, что anmachen. Четвёртое значение идиоматическое и всегда про проделки: Was hast du denn da angestellt?'
      uk: 'Відокремлюваний, і розходиться на три значення. Брати на роботу: результат — der Angestellte, «службовець», картка на A2, а сусід einstellen точніше називає сам акт найму. Ставати в чергу: sich anstellen — те, що роблять біля віконця, і Stell dich hinten an! цілком можна почути. Вмикати: das Radio anstellen, те саме, що anmachen. Четверте значення ідіоматичне й завжди про витівки: Was hast du denn da angestellt?'

  - de: Entlassung
    ipa: "ɛntˈlasʊŋ"
    pos: noun
    gender: f
    plural: "die Entlassungen"
    en: being let go by an employer, on the employer's decision
    ru: увольнение по решению работодателя
    uk: звільнення за рішенням роботодавця
    example_de: Nach der Entlassung suchte er ein halbes Jahr lang eine neue Stelle.
    example_en: After being made redundant he looked for a new job for six months.
    example_ru: После увольнения он полгода искал новое место.
    example_uk: Після звільнення він пів року шукав нове місце.
    note:
      en: 'The noun of B1 entlassen, and the direction matters: this comes from the employer''s side, while A2 kündigen works both ways, so Ich habe gekündigt means you left of your own accord. In a wave of them a newspaper writes Massenentlassungen or Stellenabbau. The same word is used far from work: die Entlassung aus dem Krankenhaus is being discharged, and der Entlassungsbrief follows either one.'
      ru: 'Существительное от entlassen уровня B1, и направление здесь существенно: инициатива исходит от работодателя, тогда как kündigen уровня A2 работает в обе стороны, так что Ich habe gekündigt значит «я уволился сам». О массовом явлении газета напишет Massenentlassungen или Stellenabbau. То же слово живёт далеко от работы: die Entlassung aus dem Krankenhaus — выписка из больницы, а der Entlassungsbrief следует и за тем, и за другим.'
      uk: 'Іменник від entlassen рівня B1, і напрямок тут суттєвий: ініціатива походить від роботодавця, тоді як kündigen рівня A2 працює в обидва боки, тож Ich habe gekündigt означає «я звільнився сам». Про масове явище газета напише Massenentlassungen або Stellenabbau. Те саме слово живе далеко від роботи: die Entlassung aus dem Krankenhaus — виписка з лікарні, а der Entlassungsbrief іде і за тим, і за тим.'

  - de: Arbeitslosigkeit
    ipa: "ˈaʁbaɪ̯tsloːzɪçkaɪ̯t"
    pos: noun
    gender: f
    plural: "—"
    en: being out of work, and the scale of it in a country
    ru: безработица как положение человека и как явление в стране
    uk: безробіття як становище людини і як явище в країні
    example_de: In dieser Region ist die Arbeitslosigkeit seit Jahren hoch.
    example_en: Unemployment has been high in this region for years.
    example_ru: В этом регионе безработица высока уже много лет.
    example_uk: У цьому регіоні безробіття високе вже багато років.
    note:
      en: 'Built in two steps from A2 arbeitslos: -ig makes an adjective into a stem, and -keit makes it a feminine noun, exactly as in Möglichkeit and Schwierigkeit. Effectively without a plural. It carries both readings — one person''s situation and the national figure — and the news uses die Arbeitslosenquote for the percentage. The money is das Arbeitslosengeld, and the office that pays it is die Agentur für Arbeit.'
      ru: 'Построено в два шага от arbeitslos уровня A2: -ig превращает прилагательное в основу, а -keit делает из неё существительное женского рода — ровно как в Möglichkeit и Schwierigkeit. Множественного числа фактически нет. В слове живут оба прочтения — положение отдельного человека и цифра по стране, — а для процента новости берут die Arbeitslosenquote. Деньги называются das Arbeitslosengeld, а платит их die Agentur für Arbeit.'
      uk: 'Побудоване у два кроки від arbeitslos рівня A2: -ig перетворює прикметник на основу, а -keit робить із неї іменник жіночого роду — точно як у Möglichkeit і Schwierigkeit. Множини фактично немає. У слові живуть обидва прочитання — становище окремої людини й цифра по країні, — а для відсотка новини беруть die Arbeitslosenquote. Гроші звуться das Arbeitslosengeld, а платить їх die Agentur für Arbeit.'

  - de: Aushilfe
    ipa: "ˈaʊ̯sˌhɪlfə"
    pos: noun
    gender: f
    plural: "die Aushilfen"
    # Recognition only: read in a job advert and on a payslip. The learner who has
    # to say it produces `Job` or `Teilzeit`, both already carded.
    cards: recognition
    en: somebody taken on for a short time to cover a gap, and the job itself
    en_compact: "temporary help; a stopgap job"
    ru: подсобный работник на время и сама такая временная работа
    uk: підсобний працівник на час і сама така тимчасова робота
    example_de: Im Dezember sucht der Laden immer eine Aushilfe.
    example_en: In December the shop always looks for temporary help.
    example_ru: В декабре магазин всегда ищет временного работника.
    example_uk: У грудні крамниця завжди шукає тимчасового працівника.
    note:
      en: 'One word for the person and for the arrangement, which is why a small ad reads Aushilfe gesucht and a student says Ich arbeite als Aushilfe. It is built from aus and helfen, and the same idea gives aushelfen, to stand in for a while. Two words are close but not it: die Vertretung is standing in for one named colleague, and der Nebenjob is a second job you keep beside your main one. A related German institution is der Minijob, a small post capped by law.'
      ru: 'Одно слово и на человека, и на саму схему: поэтому объявление гласит Aushilfe gesucht, а студент говорит Ich arbeite als Aushilfe. Слово сложено из aus и helfen, а та же идея даёт глагол aushelfen — «выручить на время». Два слова рядом, но не то же: die Vertretung — замещение конкретного коллеги, а der Nebenjob — подработка помимо основного места. Родственный немецкий институт — der Minijob, малая занятость с потолком по закону.'
      uk: 'Одне слово і на людину, і на саму схему: тому оголошення каже Aushilfe gesucht, а студент говорить Ich arbeite als Aushilfe. Слово складене з aus і helfen, а та сама ідея дає дієслово aushelfen — «виручити на час». Два слова поряд, але не те саме: die Vertretung — заміщення конкретного колеги, а der Nebenjob — підробіток поза основним місцем. Споріднений німецький інститут — der Minijob, мала зайнятість із межею за законом.'

  - de: halbtags
    ipa: "ˈhalpˌtaːks"
    pos: adv
    # Recognition only: A2 ships `Teilzeit` and `Vollzeit` (arbeit-bewerbung) as the
    # nouns for the same arrangement, and this word is their adverb.
    cards: recognition
    en: for half a working day, mornings or afternoons only
    ru: полдня, только до обеда или только после
    uk: пів дня, лише до обіду або лише після
    example_de: Seit der Geburt des Kindes arbeitet sie halbtags.
    example_en: Since the birth of the child she has worked half days.
    example_ru: После рождения ребёнка она работает полдня.
    example_uk: Після народження дитини вона працює пів дня.
    note:
      en: 'An adverb, so it never takes an ending and never stands before a noun: sie arbeitet halbtags, but eine Halbtagsstelle when a noun is wanted. Its opposite is ganztags, and the pair belongs beside A2 die Teilzeit and die Vollzeit, which are nouns for the same arrangement (in Teilzeit arbeiten). The -s at the end is the old adverbial genitive that also makes morgens, abends and montags out of nouns.'
      ru: 'Наречие, поэтому окончаний не принимает и перед существительным не стоит: sie arbeitet halbtags, но eine Halbtagsstelle, когда нужно существительное. Противоположность — ganztags, а пара стоит рядом с die Teilzeit и die Vollzeit уровня A2, которые называют ту же схему существительными (in Teilzeit arbeiten). Конечное -s — старый наречный родительный, тот же, что делает из существительных morgens, abends и montags.'
      uk: 'Прислівник, тому закінчень не приймає й перед іменником не стоїть: sie arbeitet halbtags, але eine Halbtagsstelle, коли потрібен іменник. Протилежність — ganztags, а пара стоїть поряд із die Teilzeit і die Vollzeit рівня A2, які називають ту саму схему іменниками (in Teilzeit arbeiten). Кінцеве -s — старий прислівниковий родовий, той самий, що робить із іменників morgens, abends і montags.'

  - de: Überstunde
    ipa: "ˈyːbɐˌʃtʊndə"
    pos: noun
    gender: f
    plural: "die Überstunden"
    # Recognition only: A2 ships the plural `Überstunden` ("overtime (extra hours)",
    # arbeit-beruf) as a production card, and the two answers are one letter apart —
    # this entry keys the Wortliste's singular headword without dealing a second
    # production card for the identical prompt.
    cards: recognition
    en: an hour worked beyond the agreed time
    ru: сверхурочный час работы, отработанный сверх договорённого времени
    uk: понаднормова година роботи, відпрацьована понад домовлений час
    example_de: Diesen Monat habe ich zwanzig Überstunden gemacht.
    example_en: This month I have done twenty hours of overtime.
    example_ru: В этом месяце я отработал двадцать сверхурочных часов.
    example_uk: Цього місяця я відпрацював двадцять понаднормових годин.
    note:
      en: 'The singular is the entry the Wortliste lists, but real sentences almost always use the plural, which A2 already cards: Überstunden machen — with machen, never arbeiten — and Überstunden abbauen when you take them back as time off. German employment law counts them on das Arbeitszeitkonto, and they are either paid or given back as free days, which is why abbauen is the everyday word beside it. One at a time it goes back to the singular: Das war nur eine halbe Stunde mehr, keine ganze.'
      ru: 'Единственное число — это заглавная форма Wortliste, но живая речь почти всегда берёт множественное, которое уже есть карточкой на A2: Überstunden machen — именно с machen, а не с arbeiten, — и Überstunden abbauen, «отгулять их». Немецкое трудовое право считает их на das Arbeitszeitkonto, и их либо оплачивают, либо возвращают свободными днями, отсюда и обиходное abbauen рядом. При счёте по одному возвращается единственное: Das war nur eine halbe Stunde mehr, keine ganze.'
      uk: 'Однина — це заголовна форма Wortliste, але живе мовлення майже завжди бере множину, яка вже є карткою на A2: Überstunden machen — саме з machen, а не з arbeiten, — і Überstunden abbauen, «відгуляти їх». Німецьке трудове право рахує їх на das Arbeitszeitkonto, і їх або оплачують, або повертають вільними днями, звідси й побутове abbauen поряд. При лічбі по одній повертається однина: Das war nur eine halbe Stunde mehr, keine ganze.'

  - de: Einkommen
    ipa: "ˈaɪ̯nˌkɔmən"
    pos: noun
    gender: n
    plural: "die Einkommen"
    en: everything a person earns in a year, from a job or from anything else
    en_compact: "income"
    ru: "доход: всё, что человек зарабатывает за год из любых источников"
    uk: "дохід: усе, що людина заробляє за рік із будь-яких джерел"
    example_de: Das Einkommen der Familie reicht knapp für die Miete.
    example_en: The family's income barely covers the rent.
    example_ru: Дохода семьи едва хватает на аренду.
    example_uk: Доходу родини ледве вистачає на оренду.
    note:
      en: 'The widest of the money words, and the one a tax form uses: it includes wages, rent received, interest and a pension, whereas A2 das Gehalt is the fixed monthly sum an employee is paid and der Lohn is pay counted by the hour or the piece. Plural identical to the singular, as with all -en nouns of this shape. Two compounds are unavoidable: die Einkommensteuer and das Einkommen pro Kopf in a statistic. The verb behind it is einkommen only in the old sense; today one says verdienen.'
      ru: 'Самое широкое из денежных слов и то, которым пользуется налоговая форма: сюда входят и зарплата, и полученная арендная плата, и проценты, и пенсия, тогда как das Gehalt уровня A2 — фиксированная месячная сумма служащего, а der Lohn — оплата по часам или по выработке. Множественное совпадает с единственным, как у всех существительных такого вида на -en. Два составных слова не обойти: die Einkommensteuer и das Einkommen pro Kopf в статистике. Глагол einkommen сохранился лишь в старом значении; сегодня говорят verdienen.'
      uk: 'Найширше з грошових слів і те, яким користується податкова форма: сюди входять і зарплата, і отримана орендна плата, і відсотки, і пенсія, тоді як das Gehalt рівня A2 — фіксована місячна сума службовця, а der Lohn — оплата за годинами або за виробітком. Множина збігається з одниною, як в усіх іменників такого вигляду на -en. Двох складних слів не обійти: die Einkommensteuer і das Einkommen pro Kopf у статистиці. Дієслово einkommen збереглося лише в старому значенні; сьогодні кажуть verdienen.'

  - de: Rente
    ipa: "ˈʁɛntə"
    pos: noun
    gender: f
    plural: "die Renten"
