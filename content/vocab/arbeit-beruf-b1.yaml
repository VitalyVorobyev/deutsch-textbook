      ru: 'Почти всегда речь об организованной услуге, а не о чувстве: die Kinderbetreuung, die Betreuung von Senioren, der Betreuungsschlüssel — сколько детей приходится на одного взрослого. Это то, что обещает муниципалитет и оценивает договор, и потому рядом стоят die Pflege — телесный уход за больным и die Erziehung — воспитание ребёнка. В юридическом немецком есть второй смысл: eine rechtliche Betreuung — назначенная судом опека над взрослым, который не может решать сам.'
