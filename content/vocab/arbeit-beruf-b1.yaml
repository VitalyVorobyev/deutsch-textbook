      ru: 'Образовано от das Gewerk, старого слова для ремесла, и суффикса -schaft, который делает из членов целое — как в die Mannschaft и die Freundschaft. В Германии их немного, и строятся они по отраслям, а не по профессиям; их названия на слуху: ver.di, die IG Metall. Рядом стоят der Tarifvertrag — соглашение, которое они подписывают, der Streik — то, что происходит при срыве переговоров, и der Betriebsrat ниже — представительство внутри одной фирмы.'
