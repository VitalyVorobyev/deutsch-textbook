    cards: recognition
    en: the people in charge of an organisation; also a pipe or a cable
    en_compact: "management; a pipe or cable"
    ru: руководство организации как группа лиц; также труба, провод или линия связи
    uk: керівництво організації як група осіб; також труба, провід чи лінія зв’язку
    example_de: Die Leitung des Hauses entscheidet am Freitag.
    example_en: The management of the institution decides on Friday.
    example_ru: Руководство учреждения примет решение в пятницу.
    example_uk: Керівництво установи ухвалить рішення в п’ятницю.
    note:
      en: 'The noun of leiten, and it inherits both of the verb''s senses. Human: die Leitung übernehmen, unter der Leitung von, and a door plate that reads Leitung. Physical: die Wasserleitung, die Stromleitung, and on the telephone Die Leitung ist besetzt. A third, idiomatic use is affectionate mockery — eine lange Leitung haben, to be slow on the uptake. German keeps them apart by context alone, never by article.'
      ru: 'Существительное от leiten, и оно наследует оба значения глагола. Человеческое: die Leitung übernehmen, unter der Leitung von, а на двери табличка Leitung. Вещественное: die Wasserleitung, die Stromleitung, а по телефону Die Leitung ist besetzt. Третье употребление идиоматическое и добродушно-насмешливое: eine lange Leitung haben — «долго доходит». Немецкий различает их только по контексту, но не по артиклю.'
      uk: 'Іменник від leiten, і він успадковує обидва значення дієслова. Людське: die Leitung übernehmen, unter der Leitung von, а на дверях табличка Leitung. Речовинне: die Wasserleitung, die Stromleitung, а телефоном Die Leitung ist besetzt. Третє вживання ідіоматичне й добродушно-глузливе: eine lange Leitung haben — «довго доходить». Німецька розрізняє їх лише за контекстом, але не за артиклем.'

  # --- Da oder nicht da ---
  - de: anwesend
    ipa: "ˈanveːzn̩t"
    pos: adj
    # Recognition only: A1 `da sein` (funktionswoerter-chunks) is the shipped
    # production card for being there, and this is its formal twin.
    cards: recognition
    en: there in person when a list is read out or a meeting begins
    en_compact: "present, in attendance"
    ru: присутствующий лично при перекличке или в начале собрания
    uk: присутній особисто під час переклички чи на початку зборів
    example_de: Bei der Sitzung waren nur sechs von zwölf Mitgliedern anwesend.
    example_en: Only six of the twelve members were present at the meeting.
    example_ru: На заседании присутствовали лишь шестеро из двенадцати членов.
    example_uk: На засіданні були присутні лише шестеро з дванадцяти членів.
    note:
      en: 'Formal register: a register, a minute or a court report uses it, while speech says da sein or the schoolroom hier. It is built from an plus the old present participle of sein, which is also why the noun is die Anwesenheit and the register itself is die Anwesenheitsliste. Its opposite abwesend is the next entry, and the two make the neat pair a meeting always needs.'
      ru: 'Официальный регистр: так пишут в журнале, в протоколе или в судебном отчёте, тогда как речь скажет da sein, а в классе — hier. Слово сложено из an и старого причастия настоящего времени от sein, отсюда же существительное die Anwesenheit и сам журнал — die Anwesenheitsliste. Противоположность abwesend — следующая запись, и вместе они дают ту аккуратную пару, которая нужна любому собранию.'
      uk: 'Офіційний регістр: так пишуть у журналі, у протоколі чи в судовому звіті, тоді як мовлення скаже da sein, а в класі — hier. Слово складене з an і старого дієприкметника теперішнього часу від sein, звідси ж іменник die Anwesenheit і сам журнал — die Anwesenheitsliste. Протилежність abwesend — наступний запис, і разом вони дають ту акуратну пару, якої потребують будь-які збори.'

  - de: abwesend
    ipa: "ˈapveːzn̩t"
    pos: adj
    # Recognition only: the opposite of the entry above; production for being away
    # goes through A2 `weg sein` and `fehlen`.
    cards: recognition
    en: not there when the others are; also lost in thought
    en_compact: "absent; far away in thought"
    ru: отсутствующий, когда остальные на месте; также погружённый в свои мысли
    uk: відсутній, коли решта на місці; також заглиблений у власні думки
    example_de: Herr Weber ist bis Montag abwesend.
    example_en: Mr Weber is away until Monday.
    example_ru: Господин Вебер отсутствует до понедельника.
    example_uk: Пан Вебер відсутній до понеділка.
    note:
      en: 'The counterweight to the entry above, and the automatic email reply is called die Abwesenheitsnotiz for exactly this reason. The everyday verb for a pupil or a colleague who is not there is fehlen (Zwei Kinder fehlen heute), which is what a teacher actually says. The second sense is about the mind rather than the body: ein abwesender Blick, and Er wirkte abwesend of somebody who was there but not listening.'
      ru: 'Противовес предыдущей записи, и автоответчик в почте называется именно поэтому die Abwesenheitsnotiz. Обиходный глагол про ученика или коллегу, которого нет, — fehlen (Zwei Kinder fehlen heute), и именно так говорит учитель. Второе значение — о мыслях, а не о теле: ein abwesender Blick, а Er wirkte abwesend — о том, кто был здесь, но не слушал.'
      uk: 'Противага до попереднього запису, і автовідповідач у пошті зветься саме тому die Abwesenheitsnotiz. Побутове дієслово про учня чи колегу, якого немає, — fehlen (Zwei Kinder fehlen heute), і саме так каже вчитель. Друге значення — про думки, а не про тіло: ein abwesender Blick, а Er wirkte abwesend — про того, хто був тут, але не слухав.'

  # --- Wo gearbeitet und wo gegessen wird ---
  - de: Fabrik
    ipa: "faˈbʁiːk"
    pos: noun
    gender: f
    plural: "die Fabriken"
    en: a building where goods are made in quantity by machine
    ru: "завод или фабрика: здание, где машины выпускают продукцию в больших количествах"
    uk: "завод або фабрика: будівля, де машини випускають продукцію у великих кількостях"
    example_de: In der Fabrik am Fluss werden Möbel hergestellt.
    example_en: Furniture is made in the factory by the river.
    example_ru: На фабрике у реки производят мебель.
    example_uk: На фабриці біля річки виробляють меблі.
    note:
      en: 'Stress on the second syllable, which catches Russian and English speakers alike. The word names the building and the plant, while der Betrieb is any working operation of any size and das Werk is a large industrial plant belonging to a named firm (das Opel-Werk). The people are die Fabrikarbeiter, and eine Fabrik stilllegen is to close one down. Beware the false friend: die Fabrik makes things, while der Stoff or das Gewebe is cloth.'
      ru: 'Ударение на втором слоге — на этом спотыкаются и русскоязычные, и англоязычные. Слово называет здание и производство, тогда как der Betrieb — любое действующее предприятие любого размера, а das Werk — крупный завод, принадлежащий названной фирме (das Opel-Werk). Люди — die Fabrikarbeiter, а eine Fabrik stilllegen значит «остановить производство». Осторожно с ложным другом: здесь делают вещи, а ткань — это der Stoff или das Gewebe.'
      uk: 'Наголос на другому складі — на цьому спотикаються і російськомовні, і англомовні. Слово називає будівлю й виробництво, тоді як der Betrieb — будь-яке чинне підприємство будь-якого розміру, а das Werk — великий завод, що належить названій фірмі (das Opel-Werk). Люди — die Fabrikarbeiter, а eine Fabrik stilllegen означає «зупинити виробництво». Обережно з фальшивим другом: тут роблять речі, а тканина — це der Stoff або das Gewebe.'

  - de: Kantine
    ipa: "kanˈtiːnə"
    pos: noun
    gender: f
    plural: "die Kantinen"
    en: the dining room inside a firm or an office where the staff eat at midday
    en_compact: "staff canteen"
    ru: столовая внутри фирмы или учреждения, где сотрудники обедают
    uk: їдальня всередині фірми чи установи, де співробітники обідають
    example_de: In der Kantine kostet das Mittagessen nur vier Euro.
    example_en: Lunch costs only four euros in the staff canteen.
    example_ru: В заводской столовой обед стоит всего четыре евро.
    example_uk: У заводській їдальні обід коштує лише чотири євро.
    note:
      en: 'It belongs to a workplace and is open to its own people, which is what separates it from A2 die Cafeteria, a self-service place anyone may walk into, and from die Mensa, which is the same thing at a university. Germany prices it below a restaurant because the employer pays part of the meal, and das Kantinenessen has become a byword for plain food. The word came from French through the army, where a canteen was the sutler''s stall.'
      ru: 'Слово принадлежит месту работы и открыто для своих — этим оно отличается от die Cafeteria уровня A2, куда с самообслуживанием может зайти любой, и от die Mensa, которая делает то же самое при университете. В Германии там дешевле, чем в ресторане, потому что часть обеда оплачивает работодатель, а das Kantinenessen стало нарицательным обозначением незамысловатой еды. Слово пришло из французского через армию, где так называлась лавка маркитанта.'
      uk: 'Слово належить місцю роботи й відкрите для своїх — цим воно відрізняється від die Cafeteria рівня A2, куди із самообслуговуванням може зайти будь-хто, і від die Mensa, яка робить те саме при університеті. У Німеччині там дешевше, ніж у ресторані, бо частину обіду оплачує роботодавець, а das Kantinenessen стало загальною назвою невигадливої їжі. Слово прийшло з французької через армію, де так звалася крамничка маркітанта.'

  # --- Was auf dem Schreibtisch liegt ---
  - de: Ordner
