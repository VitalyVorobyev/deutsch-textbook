      ru: 'Плоская и переносная — в этом вся разница с der Ordner выше. Два обиходных составных слова: die Bewerbungsmappe — папка документов, в которой в Германии до сих пор часто подают заявление, и die Schulmappe, устаревшее слово для школьного ранца. В искусстве и дизайне это само портфолио — seine Mappe zeigen, — так что слово может означать содержимое, а не обложку. Множественное правильное.'
      uk: 'Пласка й переносна — у цьому вся різниця з der Ordner вище. Два побутові складні слова: die Bewerbungsmappe — тека документів, у якій у Німеччині досі часто подають заяву, і die Schulmappe, застаріле слово для шкільного ранця. У мистецтві та дизайні це саме портфоліо — seine Mappe zeigen, — тож слово може означати вміст, а не обкладинку. Множина правильна.'

  - de: Kugelschreiber
    ipa: "ˈkuːgl̩ˌʃʁaɪ̯bɐ"
    pos: noun
    gender: m
    plural: "die Kugelschreiber"
    en: the pen with a small rolling ball at its tip, the blue one on every counter
    en_compact: "ballpoint pen"
    ru: шариковая ручка, та самая синяя, что лежит на каждой стойке
    uk: кулькова ручка, та сама синя, що лежить на кожній стійці
    example_de: Unterschreiben Sie bitte mit einem Kugelschreiber, nicht mit Bleistift.
    example_en: Please sign with a ballpoint pen, not with a pencil.
    example_ru: Подпишите, пожалуйста, шариковой ручкой, а не карандашом.
    example_uk: Підпишіть, будь ласка, кульковою ручкою, а не олівцем.
    note:
      en: 'A transparent compound: die Kugel is the ball, schreiben is to write, and German built the machine into the name. It is the instrument an office insists on, because a form signed in pencil can be erased. A2 der Stift is the wider word for anything you write with, der Bleistift is the pencil and der Filzstift the felt tip. Everybody shortens this one to der Kuli, the next entry.'
      ru: 'Прозрачное сложение: die Kugel — шарик, schreiben — писать, и немецкий вписал устройство прямо в название. Именно этим требует подписывать канцелярия: заполненный карандашом бланк можно стереть. der Stift уровня A2 — более широкое слово для всего, чем пишут, der Bleistift — карандаш, der Filzstift — фломастер. В обиходе слово сокращают до der Kuli — следующая запись.'
      uk: 'Прозоре складання: die Kugel — кулька, schreiben — писати, і німецька вписала пристрій просто в назву. Саме цим вимагає підписувати канцелярія: заповнений олівцем бланк можна стерти. der Stift рівня A2 — ширше слово для всього, чим пишуть, der Bleistift — олівець, der Filzstift — фломастер. У побуті слово скорочують до der Kuli — наступний запис.'

  - de: Kuli
    ipa: "ˈkuːli"
    pos: noun
    gender: m
    plural: "die Kulis"
    # Recognition only: the clipped form of the entry above, which holds the
    # production prompt — a typed card could not say which of the two it wants.
    cards: recognition
    en: the everyday short word for that same pen
    ru: обиходное сокращение для той же самой ручки
    uk: побутове скорочення для тієї самої ручки
    example_de: Hast du mal einen Kuli für mich?
    example_en: Have you got a pen for me?
    example_ru: У тебя не найдётся ручки для меня?
    example_uk: Чи не знайдеться в тебе ручки для мене?
    note:
      en: 'Spoken German clips long compounds mercilessly, and this is one of the standard examples beside das Abi, der Akku and die Uni. It is entirely normal in speech and among colleagues, but a written instruction on a form keeps the long word. The plural takes -s, as clipped and foreign nouns usually do in German. An unrelated homograph borrowed from India once named a badly paid labourer and belongs to history books.'
      ru: 'Разговорный немецкий безжалостно урезает длинные сложные слова, и это один из хрестоматийных примеров рядом с das Abi, der Akku и die Uni. В речи и среди коллег форма совершенно нормальна, но письменная инструкция в бланке сохраняет длинное слово. Множественное на -s, как обычно у усечённых и заимствованных существительных. Никак не связанный с ним омограф, заимствованный из Индии, когда-то называл низкооплачиваемого работника и принадлежит книгам по истории.'
      uk: 'Розмовна німецька безжально вкорочує довгі складні слова, і це один із хрестоматійних прикладів поряд із das Abi, der Akku і die Uni. У мовленні й серед колег форма цілком нормальна, але письмова інструкція в бланку зберігає довге слово. Множина на -s, як зазвичай в усічених і запозичених іменників. Ніяк не пов’язаний із ним омограф, запозичений з Індії, колись називав низькооплачуваного працівника й належить книжкам з історії.'

  - de: kopieren
