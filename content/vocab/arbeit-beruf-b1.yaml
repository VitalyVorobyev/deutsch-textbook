    note:
      en: 'The tall German office object, properly der Aktenordner or the trade name Leitz-Ordner, and the verb behind it is ordnen, to put in order. The computer took the same word for a folder on a screen, so einen Ordner anlegen works in both worlds. Beside it, die Mappe below is flat and carried, and die Akte is the case itself — the papers about one matter, whatever they are kept in.'
      ru: 'Высокий предмет немецкого офиса, полностью der Aktenordner или по торговому названию Leitz-Ordner; за словом стоит глагол ordnen «приводить в порядок». Компьютер взял то же слово для папки на экране, поэтому einen Ordner anlegen работает в обоих мирах. Рядом: die Mappe ниже — плоская и её носят с собой, а die Akte — само дело, бумаги по одному вопросу, в чём бы они ни лежали.'
      uk: 'Високий предмет німецького офісу, повністю der Aktenordner або за торговою назвою Leitz-Ordner; за словом стоїть дієслово ordnen «дати лад». Комп’ютер узяв те саме слово для теки на екрані, тому einen Ordner anlegen працює в обох світах. Поряд: die Mappe нижче — пласка і її носять із собою, а die Akte — сама справа, папери з одного питання, у чому б вони не лежали.'

  - de: Mappe
