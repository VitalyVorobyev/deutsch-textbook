      ru: 'Partizip II от ausbilden, давно ставшее прилагательным; чаще всего стоит перед существительным в объявлениях: eine ausgebildete Köchin, gut ausgebildete Fachleute. Слово утверждает, что подготовка была формальной и завершённой, — этим оно отличается от erfahren «опытный на практике» и от gelernt, которое немецкий ставит ровно в ту же позицию (ein gelernter Bäcker). Существительное — die Ausbildung, а тот, кто обучает, — der Ausbilder.'
      uk: 'Partizip II від ausbilden, давно вже прикметник; найчастіше стоїть перед іменником в оголошеннях: eine ausgebildete Köchin, gut ausgebildete Fachleute. Слово стверджує, що підготовка була формальною і завершеною, — цим воно відрізняється від erfahren «досвідчений на практиці» і від gelernt, яке німецька ставить рівно в ту саму позицію (ein gelernter Bäcker). Іменник — die Ausbildung, а той, хто навчає, — der Ausbilder.'

