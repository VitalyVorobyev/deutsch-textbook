# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the character and
# behaviour words of data/goethe-b1-wortliste.txt — what a person is like towards
# others, how they work, what mood they are in, and the nouns for the qualities a
# reference letter and a conversation about people are built from.
id: charakter-verhalten-b1
title_de: "Charakter und Verhalten"
title_en: "Character and behaviour"
title_ru: "Характер и поведение"
title_uk: "Характер і поведінка"
level: B1
entries:
  # --- Wie jemand mit anderen umgeht ---
  - de: ehrlich
    ipa: "ˈeːɐ̯lɪç"
    pos: adj
    en: honest
    ru: честный, откровенный
    uk: чесний, відвертий
    example_de: Sag mir ehrlich, ob dir die Wohnung gefällt.
    example_en: Tell me honestly whether you like the flat.
    example_ru: Скажи мне честно, нравится ли тебе квартира.
    example_uk: Скажи мені чесно, чи подобається тобі квартира.
    note:
      en: 'It covers both telling the truth and dealing fairly. Two chunks carry most of its everyday use: ehrlich gesagt (to be honest) opens an opinion, and Ehrlich? on its own is the surprised really? Die Ehrlichkeit is the noun, and unehrlich the opposite.'
      ru: 'Покрывает и правдивость, и порядочность в делах. Почти всё бытовое употребление держится на двух оборотах: ehrlich gesagt («честно говоря») открывает мнение, а одиночное Ehrlich? — удивлённое «правда?». Die Ehrlichkeit — существительное, unehrlich — противоположность.'
      uk: 'Покриває і правдивість, і порядність у справах. Майже все побутове вживання тримається на двох зворотах: ehrlich gesagt («чесно кажучи») відкриває думку, а одиничне Ehrlich? — здивоване «справді?». Die Ehrlichkeit — іменник, unehrlich — протилежність.'

  - de: höflich
    ipa: "ˈhøːflɪç"
    pos: adj
    en: polite
    ru: вежливый
    uk: ввічливий
    example_de: Der Verkäufer war sehr höflich, obwohl ich mich beschwert habe.
    example_en: The shop assistant was very polite even though I complained.
    example_ru: Продавец был очень вежлив, хотя я жаловался.
    example_uk: Продавець був дуже ввічливий, хоча я скаржився.
    note:
      en: 'Die Höflichkeit is politeness, unhöflich is rude. In German politeness is carried by grammar as much as by tone: the Konjunktiv II forms könnten Sie and würden Sie, and the Sie form itself, are what make a request sound polite. Freundlich is warm, this word is correct.'
      ru: 'Die Höflichkeit — вежливость, unhöflich — невежливый. В немецком вежливость держится не столько на интонации, сколько на грамматике: формы Konjunktiv II könnten Sie и würden Sie и само обращение на Sie. Freundlich — приветливый, а это слово — корректный.'
      uk: 'Die Höflichkeit — ввічливість, unhöflich — неввічливий. У німецькій ввічливість тримається не так на інтонації, як на граматиці: форми Konjunktiv II könnten Sie і würden Sie та саме звертання на Sie. Freundlich — привітний, а це слово — коректний.'

  - de: frech
    ipa: "ˈfʁɛç"
    pos: adj
    en: cheeky, impertinent
    ru: дерзкий, нахальный
    uk: зухвалий, нахабний
    example_de: Sei nicht so frech zu deiner Schwester.
    example_en: Do not be so cheeky to your sister.
    example_ru: Не дерзи сестре.
    example_uk: Не будь такий зухвалий із сестрою.
    note:
      en: 'The person it is aimed at takes zu + Dativ. Said to a child it is a mild telling-off; said of an adult it means someone crossed a line. Note the second, friendly use: ein frecher Hut is a hat with a bit of cheek in it, and that sense is a compliment.'
      ru: 'Адресат вводится через zu + Dativ. Ребёнку так делают мягкое замечание; о взрослом это значит, что человек перешёл границу. Есть и второе, дружелюбное употребление: ein frecher Hut — «дерзкая» шляпка, и это комплимент.'
      uk: 'Адресат вводиться через zu + Dativ. Дитині так роблять м’яке зауваження; про дорослого це означає, що людина перейшла межу. Є й друге, приязне вживання: ein frecher Hut — «зухвалий» капелюшок, і це комплімент.'

  - de: treu
    ipa: "ˈtʁɔʏ̯"
    pos: adj
    # Recognition only: relationship register at B1 — the word is read in a story and
    # heard about other people; a learner describing a partnership says
    # Wir vertrauen uns.
    cards: recognition
    en: faithful, loyal
    ru: верный, преданный
    uk: вірний, відданий
    example_de: Er ist seit dreißig Jahren derselben Firma treu.
    example_en: He has been loyal to the same company for thirty years.
    example_ru: Он уже тридцать лет верен одной и той же фирме.
    example_uk: Він уже тридцять років вірний тій самій фірмі.
    note:
      en: 'What or whom you are faithful to takes the dative, as in the example. It works for a partner, an employer, a football club and a brand. Die Treue is the noun; untreu is used almost only about a partner.'
      ru: 'То, чему или кому хранят верность, стоит в Dativ, как в примере. Годится и о партнёре, и о работодателе, и о футбольном клубе, и о марке. Die Treue — существительное; untreu говорят почти только о партнёре.'
      uk: 'Те, чому або кому зберігають вірність, стоїть у Dativ, як у прикладі. Годиться і про партнера, і про роботодавця, і про футбольний клуб, і про марку. Die Treue — іменник; untreu кажуть майже лише про партнера.'

  - de: dankbar
    ipa: "ˈdaŋkbaːɐ̯"
    pos: adj
    en: grateful, thankful
    ru: благодарный
    uk: вдячний
    example_de: Ich wäre Ihnen sehr dankbar für eine kurze Antwort.
    example_en: I would be very grateful for a short reply.
    example_ru: Я был бы вам очень благодарен за короткий ответ.
    example_uk: Я був би вам дуже вдячний за коротку відповідь.
    note:
      en: 'Two slots: the person is dative and the reason takes für + Akkusativ. The sentence in the example is the standard polite close of a formal email and is worth learning whole. Die Dankbarkeit is the noun; the plain thank-you is danke.'
      ru: 'Две позиции: человек стоит в Dativ, а причина вводится через für + Akkusativ. Фраза из примера — стандартная вежливая концовка официального письма, её стоит выучить целиком. Die Dankbarkeit — существительное, а простое «спасибо» — danke.'
      uk: 'Дві позиції: людина стоїть у Dativ, а причина вводиться через für + Akkusativ. Фраза з прикладу — стандартна ввічлива кінцівка офіційного листа, її варто вивчити цілою. Die Dankbarkeit — іменник, а просте «дякую» — danke.'

  - de: angenehm
    ipa: "ˈangəneːm"
    pos: adj
    # Recognition only: it lives in service formulas the learner hears rather than
    # builds — Angenehme Reise, eine angenehme Atmosphäre — and A1/A2 already sell
    # schön and nett for the everyday judgement.
    cards: recognition
    en: pleasant, agreeable
    ru: приятный
    uk: приємний
    example_de: Im Wartezimmer war eine angenehme Atmosphäre.
    example_en: There was a pleasant atmosphere in the waiting room.
    example_ru: В приёмной была приятная атмосфера.
    example_uk: У приймальні була приємна атмосфера.
    note:
      en: 'It describes what is comfortable to be in — a temperature, an atmosphere, a voice, a conversation. Angenehm! on its own is a slightly old-fashioned reply when being introduced. The opposite is unangenehm, which also covers an embarrassing situation.'
      ru: 'Описывает то, в чём приятно находиться: температура, атмосфера, голос, разговор. Одиночное Angenehm! — слегка старомодный ответ при знакомстве. Противоположность unangenehm покрывает и неловкую ситуацию.'
      uk: 'Описує те, у чому приємно перебувати: температура, атмосфера, голос, розмова. Одиничне Angenehm! — трохи старомодна відповідь під час знайомства. Протилежність unangenehm покриває й ніякову ситуацію.'

  # --- Mut, Neugier, Energie ---
  - de: mutig
    ipa: "ˈmuːtɪç"
    pos: adj
    en: brave, courageous
    ru: смелый, храбрый
    uk: сміливий, хоробрий
    example_de: Es war mutig von dir, das offen zu sagen.
    example_en: It was brave of you to say that openly.
    example_ru: С твоей стороны было смело сказать это открыто.
    example_uk: З твого боку було сміливо сказати це відверто.
    note:
      en: 'The frame Es war mutig von dir, … zu … is the natural way to praise an act rather than a person. Built on der Mut, and its opposite is ängstlich or feige. Note that a courageous decision at work is often called mutig too, not only a physical risk.'
      ru: 'Конструкция Es war mutig von dir, … zu … — естественный способ похвалить поступок, а не человека. Образовано от der Mut; противоположности — ängstlich или feige. Смелым (mutig) называют и решение на работе, а не только физический риск.'
      uk: 'Конструкція Es war mutig von dir, … zu … — природний спосіб похвалити вчинок, а не людину. Утворене від der Mut; протилежності — ängstlich або feige. Сміливим (mutig) називають і рішення на роботі, а не лише фізичний ризик.'

  - de: Mut
    ipa: "ˈmuːt"
    pos: noun
    gender: m
    plural: "—"
    en: courage
    ru: смелость, мужество
    uk: сміливість, мужність
    example_de: Für diesen Schritt braucht man viel Mut.
    example_en: This step takes a lot of courage.
    example_ru: На такой шаг нужно много смелости.
    example_uk: На такий крок потрібно багато сміливості.
    note:
      en: 'No plural. The verbs it goes with are worth learning as chunks: Mut haben, Mut brauchen, jemandem Mut machen (to encourage someone) and den Mut verlieren. Note the false friend inside German itself — die Wut, one letter away, is rage.'
      ru: 'Множественного числа нет. Глаголы при нём стоит запомнить чанками: Mut haben, Mut brauchen, jemandem Mut machen («подбодрить») и den Mut verlieren. Внутри немецкого есть ловушка: die Wut отличается одной буквой и значит «ярость».'
      uk: 'Множини немає. Дієслова при ньому варто запам’ятати чанками: Mut haben, Mut brauchen, jemandem Mut machen («підбадьорити») і den Mut verlieren. Усередині німецької є пастка: die Wut відрізняється однією літерою й означає «лють».'

  - de: neugierig
    ipa: "ˈnɔʏ̯giːʁɪç"
    pos: adj
    # Recognition only: `gespannt` (kultur-freizeit) ships "curious" as a production
    # card, and "curious" is the standard rendering of both — the Wochentag/Werktag
    # case from zeit-b1, in the other direction.
    cards: recognition
    en: inquisitive, nosy
    ru: любопытный
    uk: допитливий, цікавий до всього
    example_de: Meine Nachbarin ist furchtbar neugierig.
    example_en: My neighbour is terribly nosy.
    example_ru: Моя соседка ужасно любопытна.
    example_uk: Моя сусідка страшенно допитлива.
    note:
      en: 'Literally new-greedy, and the judgement in it depends on the object: about a child it is praise, about a neighbour it is a complaint. What you are curious about takes auf + Akkusativ. Gespannt is the neutral one for waiting to see how something turns out. Die Neugier is the noun.'
      ru: 'Буквально «жадный до нового», и оценка зависит от того, о ком речь: о ребёнке — похвала, о соседке — упрёк. Предмет любопытства вводится через auf + Akkusativ. Gespannt — нейтральное «в нетерпеливом ожидании». Die Neugier — существительное.'
      uk: 'Буквально «жадібний до нового», і оцінка залежить від того, про кого йдеться: про дитину — похвала, про сусідку — докір. Предмет цікавості вводиться через auf + Akkusativ. Gespannt — нейтральне «у нетерплячому очікуванні». Die Neugier — іменник.'

  - de: aufmerksam
    ipa: "ˈaʊ̯fˌmɛʁkzaːm"
    pos: adj
    en: attentive; thoughtful
    ru: внимательный (сосредоточенный); внимательный к другим
    uk: уважний (зосереджений); уважний до інших
    example_de: Danke, das war sehr aufmerksam von dir.
    example_en: Thank you, that was very thoughtful of you.
    example_ru: Спасибо, это было очень внимательно с твоей стороны.
    example_uk: Дякую, це було дуже уважно з твого боку.
    note:
      en: 'Two readings, both alive. Concentrating on something: aufmerksam zuhören. Considerate towards someone: the example. The verb chunk jemanden auf etwas aufmerksam machen means to point something out, and die Aufmerksamkeit is attention as well as a small gift.'
      ru: 'Два живых значения. Сосредоточенность: aufmerksam zuhören. Заботливость к другому: как в примере. Оборот jemanden auf etwas aufmerksam machen значит «обратить чьё-то внимание на что-то», а die Aufmerksamkeit — и внимание, и небольшой знак внимания.'
      uk: 'Два живі значення. Зосередженість: aufmerksam zuhören. Турботливість до іншого: як у прикладі. Зворот jemanden auf etwas aufmerksam machen означає «звернути чиюсь увагу на щось», а die Aufmerksamkeit — і увага, і невеликий знак уваги.'

  - de: interessiert
    ipa: "ɪntəʁɛˈsiːɐ̯t"
    pos: adj
    # Recognition only: the family already ships as production cards —
    # `sich interessieren für` and `Interesse` — and this participle answers the same
    # prompt from a third direction.
    cards: recognition
    en: interested (in something)
    ru: заинтересованный
    uk: зацікавлений
    example_de: Sind Sie an einer Zusammenarbeit interessiert?
    example_en: Are you interested in working together?
    example_ru: Вы заинтересованы в сотрудничестве?
    example_uk: Ви зацікавлені у співпраці?
    note:
      en: 'Note the preposition, because it differs from the verb: interessiert an + Dativ, but sich interessieren für + Akkusativ. The an-form belongs to letters, offers and job ads. As a plain adjective it also describes an attentive listener: ein interessierter Zuhörer.'
      ru: 'Обратите внимание на предлог: он не такой, как у глагола — interessiert an + Dativ, но sich interessieren für + Akkusativ. Форма с an живёт в письмах, предложениях и объявлениях о работе. Как обычное прилагательное описывает и внимательного слушателя: ein interessierter Zuhörer.'
      uk: 'Зверніть увагу на прийменник: він не такий, як у дієслова — interessiert an + Dativ, але sich interessieren für + Akkusativ. Форма з an живе в листах, пропозиціях та оголошеннях про роботу. Як звичайний прикметник описує й уважного слухача: ein interessierter Zuhörer.'

  - de: optimistisch
    ipa: "ɔptiˈmɪstɪʃ"
    pos: adj
    en: optimistic
    ru: оптимистичный
    uk: оптимістичний
    example_de: Ich bin optimistisch, dass wir den Termin schaffen.
    example_en: I am optimistic that we will make the deadline.
    example_ru: "Я настроен оптимистично: думаю, мы уложимся в срок."
    example_uk: "Я налаштований оптимістично: думаю, ми вкладемося у строк."
    note:
      en: 'The useful frame is optimistisch sein, dass … — a compact way of saying you expect a good outcome without claiming to know. Its counterpart is pessimistisch, and the nouns are der Optimismus and der Optimist with die Optimistin.'
      ru: 'Полезная конструкция — optimistisch sein, dass …: компактный способ сказать, что вы ждёте хорошего исхода, не утверждая, что знаете. Пара — pessimistisch, существительные — der Optimismus, der Optimist и die Optimistin.'
      uk: 'Корисна конструкція — optimistisch sein, dass …: компактний спосіб сказати, що ви очікуєте доброго результату, не стверджуючи, що знаєте. Пара — pessimistisch, іменники — der Optimismus, der Optimist і die Optimistin.'

  # --- Arbeitsstil ---
  - de: ordentlich
    ipa: "ˈɔʁdn̩tlɪç"
    pos: adj
    en: tidy, orderly
    ru: аккуратный, опрятный
    uk: охайний, упорядкований
    example_de: Sein Schreibtisch ist immer ordentlich.
    example_en: His desk is always tidy.
    example_ru: Его письменный стол всегда в порядке.
    example_uk: Його письмовий стіл завжди в порядку.
    note:
      en: 'From die Ordnung. It describes both a tidy room and a person who keeps things in order. In speech it has a second, intensifying use: eine ordentliche Portion is a good big helping. Its opposite is unordentlich.'
      ru: 'От die Ordnung. Описывает и убранную комнату, и человека, который держит вещи в порядке. В речи есть второе, усилительное употребление: eine ordentliche Portion — «приличная, изрядная порция». Противоположность — unordentlich.'
      uk: 'Від die Ordnung. Описує і прибрану кімнату, і людину, яка тримає речі в порядку. У мовленні є друге, підсилювальне вживання: eine ordentliche Portion — «пристойна, чимала порція». Протилежність — unordentlich.'

  - de: gründlich
    ipa: "ˈgʁʏntlɪç"
    pos: adj
    en: thorough
    ru: тщательный, основательный
    uk: ретельний, ґрунтовний
    example_de: Die Wohnung wurde vor der Übergabe gründlich geputzt.
    example_en: The flat was cleaned thoroughly before it was handed over.
    example_ru: Перед сдачей квартиру тщательно вымыли.
    example_uk: Перед передаванням квартиру ретельно вимили.
    note:
      en: 'Built on der Grund in its sense of bottom: something is done down to the bottom, leaving nothing out. It works as an adverb far more often than as an attribute — gründlich putzen, gründlich prüfen, sich gründlich vorbereiten. Oberflächlich is the opposite.'
      ru: 'Образовано от der Grund в значении «дно»: дело доводят до самого низа, ничего не пропуская. Как наречие встречается чаще, чем как определение: gründlich putzen, gründlich prüfen, sich gründlich vorbereiten. Противоположность — oberflächlich.'
      uk: 'Утворене від der Grund у значенні «дно»: справу доводять до самого низу, нічого не пропускаючи. Як прислівник трапляється частіше, ніж як означення: gründlich putzen, gründlich prüfen, sich gründlich vorbereiten. Протилежність — oberflächlich.'

  - de: kreativ
    ipa: "kʁeaˈtiːf"
    pos: adj
    # Recognition only: job-ad register — a learner reads it in a Stellenanzeige and
    # in a course description far more often than they say it.
    cards: recognition
    en: creative
    ru: креативный, творческий
    uk: креативний, творчий
    example_de: Gesucht wird eine kreative Person mit eigenen Ideen.
    example_en: We are looking for a creative person with ideas of their own.
    example_ru: Требуется креативный человек со своими идеями.
    example_uk: Потрібна креативна людина з власними ідеями.
    note:
      en: 'Stress on the last syllable. It belongs to job ads, course descriptions and school reports, where it is a standard word of praise. Die Kreativität is the noun. In German it says nothing about art in particular — a creative solution at work counts.'
      ru: 'Ударение на последнем слоге. Слово объявлений о работе, описаний курсов и школьных характеристик, где оно служит стандартной похвалой. Die Kreativität — существительное. В немецком оно не привязано к искусству: креативным считается и решение на работе.'
      uk: 'Наголос на останньому складі. Слово оголошень про роботу, описів курсів і шкільних характеристик, де воно є стандартною похвалою. Die Kreativität — іменник. У німецькій воно не прив’язане до мистецтва: креативним вважають і рішення на роботі.'

  - de: flexibel
    ipa: "flɛkˈsiːbl̩"
    pos: adj
    # Recognition only: another Stellenanzeige word, and it is met almost only in that
    # written formula (zeitlich flexibel).
    cards: recognition
    en: flexible
    ru: гибкий (о графике, человеке)
    uk: гнучкий (про графік, людину)
    example_de: Wir suchen jemanden, der zeitlich flexibel ist.
    example_en: We are looking for someone with flexible hours.
    example_ru: Мы ищем человека с гибким графиком.
    example_uk: Ми шукаємо людину з гнучким графіком.
    note:
