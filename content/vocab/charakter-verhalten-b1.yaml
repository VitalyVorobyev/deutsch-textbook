    cards: recognition
    en: willing, prepared (to do something)
    en_compact: willing, prepared
    ru: готовый (сделать что-то)
    uk: готовий (зробити щось)
    example_de: Sind Sie bereit, mehr Miete zu zahlen?
    example_en: Are you prepared to pay more rent?
    example_ru: Готовы ли вы платить больше за аренду?
