      en: 'Built on die Vernunft, reason. It judges a person or a decision as level-headed; sinnvoll judges whether a thing makes sense at all. In speech it has a second use meaning proper: eine vernünftige Mahlzeit is a decent meal.'
      ru: 'Образовано от die Vernunft — «разум». Оценивает человека или решение как здравые; sinnvoll оценивает, есть ли в чём-то смысл вообще. В речи есть второе значение «нормальный, приличный»: eine vernünftige Mahlzeit — «нормальная еда».'
      uk: 'Утворене від die Vernunft — «розум». Оцінює людину чи рішення як розважливі; sinnvoll оцінює, чи є в чомусь сенс узагалі. У мовленні є друге значення «нормальний, пристойний»: eine vernünftige Mahlzeit — «нормальна їжа».'

  # --- Innere Werte ---
  - de: stolz
    ipa: "ˈʃtɔlts"
    pos: adj
    en: proud
    ru: гордый
    uk: гордий
    example_de: Ich bin stolz auf meine Tochter.
    example_en: I am proud of my daughter.
    example_ru: Я горжусь дочерью.
    example_uk: Я пишаюся донькою.
    note:
      en: 'The preposition is auf + Akkusativ, which is the one thing to get right. German has no verb for it, so the adjective carries the whole sentence — stolz sein auf. Der Stolz is the noun, and it can be a fault as well as a virtue.'
      ru: 'Предлог — auf + Akkusativ, и это главное, что нужно запомнить. Отдельного глагола в немецком нет, поэтому всё предложение держится на прилагательном: stolz sein auf. Der Stolz — существительное, и это может быть как достоинство, так и недостаток.'
      uk: 'Прийменник — auf + Akkusativ, і це головне, що треба запам’ятати. Окремого дієслова в німецькій немає, тому все речення тримається на прикметнику: stolz sein auf. Der Stolz — іменник, і це може бути як чеснота, так і вада.'

  - de: schuldig
    ipa: "ˈʃʊldɪç"
    pos: adj
    # Recognition only: legal register — the word of a court and an insurance letter,
    # and the everyday sentence is Das war mein Fehler.
    cards: recognition
    en: guilty; owing (money)
    ru: виновный; должный (денег)
    uk: винний; винен (грошей)
    example_de: Ich bin dir noch zwanzig Euro schuldig.
    example_en: I still owe you twenty euros.
    example_ru: Я ещё должен тебе двадцать евро.
    example_uk: Я ще винен тобі двадцять євро.
    note:
      en: 'Two senses share the word, and German keeps them apart by what follows: an + Dativ for guilt (an einem Unfall schuldig), a dative person plus an amount for a debt, as in the example. Die Schuld covers guilt in the singular and debts in the plural, die Schulden.'
      ru: 'Два значения в одном слове, и немецкий различает их управлением: an + Dativ для вины (an einem Unfall schuldig), Dativ лица плюс сумма для долга, как в примере. Die Schuld — вина в единственном числе, а долги — во множественном: die Schulden.'
      uk: 'Два значення в одному слові, і німецька розрізняє їх керуванням: an + Dativ для провини (an einem Unfall schuldig), Dativ особи плюс сума для боргу, як у прикладі. Die Schuld — провина в однині, а борги — у множині: die Schulden.'

  - de: Gewissen
    ipa: "gəˈvɪsn̩"
    pos: noun
    gender: n
    plural: "—"
    # Recognition only: an abstract noun a learner meets in a text or a discussion and
    # almost never needs to produce at B1.
    cards: recognition
    en: conscience
    ru: совесть
    uk: сумління, совість
    example_de: Er hat kein schlechtes Gewissen deswegen.
    example_en: He has no bad conscience about it.
    example_ru: Совесть его из-за этого не мучает.
    example_uk: Сумління його через це не мучить.
    note:
      en: 'No plural. The living phrase is ein schlechtes Gewissen haben — German has a bad conscience where English feels guilty. Gewissenhaft means conscientious, and note the unrelated adjective gewiss, which means certain.'
      ru: 'Множественного числа нет. Живой оборот — ein schlechtes Gewissen haben: немец «имеет плохую совесть» там, где по-русски «мучает совесть». Gewissenhaft — «добросовестный», а не связанное с ним прилагательное gewiss значит «определённый».'
      uk: 'Множини немає. Живий зворот — ein schlechtes Gewissen haben: німець «має погане сумління» там, де українською «мучить сумління». Gewissenhaft — «сумлінний», а не пов’язаний із ним прикметник gewiss означає «певний».'

  - de: Vertrauen
    ipa: "fɛɐ̯ˈtʁaʊ̯ən"
    pos: noun
    gender: n
    plural: "—"
    # Recognition only: the abstract noun; what a learner says is the verb
    # (Ich vertraue dir) or the adjective, and the noun belongs to a written text.
    cards: recognition
    en: trust, confidence
    ru: доверие
    uk: довіра
    example_de: Vertrauen ist die Grundlage jeder Zusammenarbeit.
    example_en: Trust is the basis of any cooperation.
    example_ru: Доверие — основа любого сотрудничества.
    example_uk: Довіра — основа будь-якої співпраці.
    note:
      en: 'No plural. The chunks are Vertrauen haben zu jemandem and jemandem vertrauen with the plain dative. Vertraulich means confidential, and der Vertrauensarzt is the doctor an insurer sends you to — the word turns up in official contexts more than you would expect.'
      ru: 'Множественного числа нет. Обороты: Vertrauen haben zu jemandem и jemandem vertrauen с чистым Dativ. Vertraulich — «конфиденциальный», а der Vertrauensarzt — врач, к которому направляет страховая; слово встречается в официальных контекстах чаще, чем кажется.'
      uk: 'Множини немає. Звороти: Vertrauen haben zu jemandem і jemandem vertrauen з чистим Dativ. Vertraulich — «конфіденційний», а der Vertrauensarzt — лікар, до якого скеровує страхова; слово трапляється в офіційних контекстах частіше, ніж здається.'

  - de: Humor
    ipa: "huˈmoːɐ̯"
    pos: noun
    gender: m
    plural: "—"
    en: sense of humour
    ru: чувство юмора
    uk: почуття гумору
    example_de: Zum Glück hat sie viel Humor.
    example_en: Luckily she has a good sense of humour.
    example_ru: К счастью, у неё много юмора.
    example_uk: На щастя, у неї багато гумору.
    note:
      en: 'German says Humor haben where English needs a sense of humour, so the noun alone does the job. The stress is on the second syllable. Humorvoll describes a person, and der Witz is the joke itself.'
      ru: 'По-немецки говорят Humor haben там, где по-русски нужно «чувство юмора»: существительного достаточно. Ударение на втором слоге. Humorvoll описывает человека, а der Witz — сама шутка.'
      uk: 'Німецькою кажуть Humor haben там, де українською потрібне «почуття гумору»: іменника достатньо. Наголос на другому складі. Humorvoll описує людину, а der Witz — сам жарт.'

  - de: Intelligenz
    ipa: "ɪntəlɪˈgɛnts"
    pos: noun
    gender: f
    plural: "—"
    # Recognition only: an abstract noun of articles and tests; the everyday
