      ru: 'Средний род, ударение на втором слоге, область вводится через für + Akkusativ. По-немецки так называют и самого человека: Sie ist ein großes Talent. Talentiert — «талантливый», а более немецкое слово для того же — begabt.'
      uk: 'Середній рід, наголос на другому складі, сфера вводиться через für + Akkusativ. Німецькою так називають і саму людину: Sie ist ein großes Talent. Talentiert — «талановитий», а більш німецьке слово для того самого — begabt.'

  - de: bereit
    ipa: "bəˈʁaɪ̯t"
    pos: adj
    # Recognition only: `fertig sein` (eigenschaften-dinge-a2) ships "to be ready" as
