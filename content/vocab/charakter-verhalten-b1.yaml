      ru: 'Это готовность воли, а не состояния: bereit sein, etwas zu tun. Fertig — «закончивший», слово о еде или о работе. Die Bereitschaft — готовность, а в больнице — дежурная смена.'
      uk: 'Це готовність волі, а не стану: bereit sein, etwas zu tun. Fertig — «той, що закінчив», слово про їжу чи роботу. Die Bereitschaft — готовність, а в лікарні — чергова зміна.'

  - de: gewohnt
    ipa: "gəˈvoːnt"
    pos: adj
    # Recognition only: it is a participle used as an adjective and it sits one letter
