    cards: recognition
    en: accustomed to, used to
    ru: привычный, привыкший
    uk: звичний, звиклий
    example_de: Diese Kälte bin ich nicht gewohnt.
    example_en: I am not used to this cold.
    example_ru: К такому холоду я не привык.
    example_uk: До такого холоду я не звик.
    note:
      en: 'Two neighbours to keep apart. Etwas gewohnt sein takes a plain accusative, as in the example. An etwas gewöhnt sein, with the Umlaut, takes an + Dativ and describes the process of getting used to it, from sich an etwas gewöhnen. Wie gewohnt means as usual.'
      ru: 'Два соседа стоит развести. Etwas gewohnt sein требует прямого Akkusativ, как в примере. An etwas gewöhnt sein, с умлаутом, требует an + Dativ и описывает результат привыкания, от sich an etwas gewöhnen. Wie gewohnt — «как обычно».'
      uk: 'Двох сусідів варто розвести. Etwas gewohnt sein вимагає прямого Akkusativ, як у прикладі. An etwas gewöhnt sein, з умлаутом, вимагає an + Dativ і описує результат звикання, від sich an etwas gewöhnen. Wie gewohnt — «як зазвичай».'
