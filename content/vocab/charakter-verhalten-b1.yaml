    cards: recognition
    en: intelligence
    ru: интеллект, ум
    uk: інтелект, розум
    example_de: Der Test misst nur einen kleinen Teil der Intelligenz.
    example_en: The test measures only a small part of intelligence.
    example_ru: Тест измеряет лишь небольшую часть интеллекта.
    example_uk: Тест вимірює лише невелику частину інтелекту.
    note:
      en: 'Stress on the last syllable. It belongs to articles, tests and discussions rather than to conversation, where klug and intelligent do the work. Künstliche Intelligenz is the compound you will meet most often now.'
      ru: 'Ударение на последнем слоге. Слово статей, тестов и дискуссий, а не разговора, где работают klug и intelligent. Künstliche Intelligenz — сложение, которое сейчас встречается чаще всего.'
      uk: 'Наголос на останньому складі. Слово статей, тестів і дискусій, а не розмови, де працюють klug та intelligent. Künstliche Intelligenz — складне слово, яке зараз трапляється найчастіше.'

  - de: Talent
    ipa: "taˈlɛnt"
    pos: noun
    gender: n
    plural: "die Talente"
    # Recognition only: an international word a learner reads without effort, and its
    # everyday German equivalent is the chunk gut können.
    cards: recognition
    en: talent, gift
    ru: талант, дарование
    uk: талант, обдарування
    example_de: Für Sprachen hat er wirklich Talent.
    example_en: He really has a talent for languages.
    example_ru: К языкам у него действительно есть талант.
    example_uk: До мов у нього справді є талант.
