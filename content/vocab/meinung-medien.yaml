id: meinung-medien
title_de: "Meinung & Medien"
title_en: "Opinion & media"
title_ru: "Мнение и медиа"
title_uk: "Думка та медіа"
level: B1
entries:
  - de: "Medien"
    ipa: "ˈmeːdi̯ən"
    pos: phrase
    en: "media, the press and broadcasting"
    ru: "СМИ, средства массовой информации"
    uk: "ЗМІ, засоби масової інформації"
    example_de: "Über das Stadtfest haben fast alle Medien berichtet."
    example_en: "Almost all the media reported on the town festival."
    example_ru: "О городском празднике сообщили почти все СМИ."
    example_uk: "Про міське свято повідомили майже всі ЗМІ."
    note:
      en: "Always plural in this sense; the singular das Medium exists but is rare outside technical texts. Die sozialen Medien covers the networks."
      ru: "В этом значении всегда во множественном числе; единственное das Medium существует, но вне технических текстов встречается редко. Соцсети — die sozialen Medien."
      uk: "У цьому значенні завжди у множині; однина das Medium існує, але поза технічними текстами трапляється рідко. Соцмережі — die sozialen Medien."

  - de: "Quelle"
    ipa: "ˈkvɛlə"
    pos: noun
    gender: f
    plural: "die Quellen"
    en: "source"
    ru: "источник"
    uk: "джерело"
    example_de: "Eine gute Zeitung nennt immer ihre Quelle."
    example_en: "A good newspaper always names where its information comes from."
    example_ru: "Хорошая газета всегда называет, откуда получены сведения."
    example_uk: "Хороша газета завжди називає, звідки отримано відомості."
    note:
      en: "Also the spring where a river starts; in media language it is the origin of an item of information. Aus sicherer Quelle — from a reliable origin."
      ru: "Также родник, где начинается река; в языке медиа — то, откуда пришли сведения. Aus sicherer Quelle — «из надёжного источника»."
      uk: "Також джерело, де починається річка; у мові медіа — те, звідки прийшли відомості. Aus sicherer Quelle — «з надійного джерела»."

  - de: "Schlagzeile"
    ipa: "ˈʃlaːkˌtsaɪ̯lə"
    pos: noun
    gender: f
    plural: "die Schlagzeilen"
    en: "headline"
    ru: "заголовок в газете, крупный заголовок"
    uk: "заголовок у газеті, великий заголовок"
    example_de: "Viele Leute lesen morgens nur die Schlagzeilen."
    example_en: "Many people read only the headlines in the morning."
    example_ru: "Многие люди утром читают только заголовки."
    example_uk: "Багато людей уранці читають лише заголовки."
    note:
      en: "Schlagzeilen machen means to be all over the news. The heading of an ordinary text is die Überschrift."
      ru: "Schlagzeilen machen — «попасть на первые полосы». Заголовок обычного текста — die Überschrift."
      uk: "Schlagzeilen machen — «потрапити на перші шпальти». Заголовок звичайного тексту — die Überschrift."

  - de: "Beitrag"
    ipa: "ˈbaɪ̯ˌtʁaːk"
    pos: noun
    gender: m
    plural: "die Beiträge"
    en: "piece, segment — one text or item inside a paper, a programme or a website, broader than an Artikel"
    en_compact: "piece, segment"
    ru: "материал, сюжет — отдельный текст или часть внутри газеты, передачи или сайта, шире, чем Artikel"
    uk: "матеріал, сюжет — окремий текст або частина всередині газети, передачі чи сайту, ширше, ніж Artikel"
    example_de: "In der Zeitung stand gestern ein kurzer Beitrag über unseren Verein."
    example_en: "There was a short piece about our club in the paper yesterday."
    example_ru: "Вчера в газете был короткий материал о нашем клубе."
    example_uk: "Учора в газеті був короткий матеріал про наш клуб."
    note:
      en: "One text or one segment inside a paper, a programme or a website. The second meaning is money: der Mitgliedsbeitrag is what you pay a club every year."
      ru: "Один текст или один сюжет внутри газеты, программы или сайта. Второе значение — деньги: der Mitgliedsbeitrag — членский взнос."
      uk: "Один текст або один сюжет усередині газети, програми чи сайту. Друге значення — гроші: der Mitgliedsbeitrag — членський внесок."

  - de: "Werbung"
    ipa: "ˈvɛʁbʊŋ"
    pos: noun
    gender: f
    plural: "—"
    en: "advertising, commercials"
    ru: "реклама"
    uk: "реклама"
    example_de: "Vor der Sendung kommt immer erst die Werbung."
    example_en: "There are always commercials before the programme."
    example_ru: "Перед передачей всегда сначала идёт реклама."
    example_uk: "Перед передачею завжди спочатку йде реклама."
    note:
      en: "Uncountable; one single ad is eine Anzeige in print and ein Werbespot on screen. Werbung machen für + Akk means to promote something."
      ru: "Неисчисляемое; одно объявление в печати — eine Anzeige, ролик на экране — ein Werbespot. Werbung machen für + Akk — «рекламировать что-либо»."
      uk: "Незлічуване; одне оголошення в пресі — eine Anzeige, ролик на екрані — ein Werbespot. Werbung machen für + Akk — «рекламувати щось»."

  - de: "Zuschauer"
    ipa: "ˈtsuːˌʃaʊ̯ɐ"
    pos: noun
    gender: m
    plural: "die Zuschauer"
    en: "viewer, spectator"
    ru: "зритель"
    uk: "глядач"
    example_de: "Die Sendung am Sonntagabend hat viele Zuschauer."
    example_en: "The Sunday evening programme has a large audience."
    example_ru: "У воскресной вечерней передачи большая аудитория."
    example_uk: "У недільної вечірньої передачі велика аудиторія."
    note:
      en: "Someone who watches: television, a match, a play. On the radio it is der Hörer, in a paper der Leser. The female form is die Zuschauerin."
      ru: "Тот, кто смотрит: телевизор, матч, спектакль. На радио — der Hörer, в газете — der Leser. Женская форма — die Zuschauerin."
      uk: "Той, хто дивиться: телевізор, матч, виставу. На радіо — der Hörer, у газеті — der Leser. Жіноча форма — die Zuschauerin."

  - de: "Leser"
    ipa: "ˈleːzɐ"
    pos: noun
    gender: m
    plural: "die Leser"
    en: "reader"
    ru: "читатель"
    uk: "читач"
    example_de: "Die Zeitung hat ihre Leser nach ihrer Meinung gefragt."
    example_en: "The paper asked the people who read it for their opinion."
    example_ru: "Газета спросила мнение тех, кто её читает."
    example_uk: "Газета запитала думку тих, хто її читає."
    note:
      en: "The female form is die Leserin. A letter to the paper is der Leserbrief."
      ru: "Женская форма — die Leserin. Письмо в газету — der Leserbrief."
      uk: "Жіноча форма — die Leserin. Лист до газети — der Leserbrief."

  - de: "Umfrage"
    ipa: "ˈʊmˌfʁaːgə"
    pos: noun
    gender: f
    plural: "die Umfragen"
    en: "survey, poll"
    ru: "опрос"
    uk: "опитування"
    example_de: "Bei der Umfrage haben zweihundert Menschen geantwortet."
    example_en: "Two hundred people answered the poll."
    example_ru: "На опрос ответили двести человек."
    example_uk: "На опитування відповіли двісті людей."
    note:
      en: "Eine Umfrage machen is to run one; the frame for the subject asked about is zu + Dat: eine Umfrage zu diesem Thema."
      ru: "Eine Umfrage machen — «провести опрос»; тему вводит zu + Dat: eine Umfrage zu diesem Thema."
      uk: "Eine Umfrage machen — «провести опитування»; тему вводить zu + Dat: eine Umfrage zu diesem Thema."

  - de: "Argument"
    ipa: "aʁguˈmɛnt"
    pos: noun
    gender: n
    plural: "die Argumente"
    en: "argument, supporting reason"
    ru: "аргумент, довод"
    uk: "аргумент, доказ"
    example_de: "Sein wichtigstes Argument war der hohe Preis."
    example_en: "His most important point was the high price."
    example_ru: "Его главным доводом была высокая цена."
    example_uk: "Його головним доказом була висока ціна."
    note:
      en: "A reason you offer for a position, not a quarrel: a quarrel is der Streit. Ein Argument nennen or ein Argument haben."
      ru: "Довод в пользу позиции, а не ссора: ссора — der Streit. Ein Argument nennen «привести довод», ein Argument haben."
      uk: "Доказ на користь позиції, а не сварка: сварка — der Streit. Ein Argument nennen «навести доказ», ein Argument haben."

  - de: "Aussage"
    ipa: "ˈaʊ̯sˌzaːgə"
    pos: noun
    gender: f
    plural: "die Aussagen"
    en: "statement, what someone says"
    ru: "высказывание, утверждение"
    uk: "висловлювання, твердження"
    example_de: "Diese Aussage steht so nicht in dem Bericht."
    example_en: "The report does not say that."
    example_ru: "В отчёте такого не сказано."
    example_uk: "У звіті такого не сказано."
    note:
      en: "Die Kernaussage is the central point of a text; giving it back in your own words is what a summary does."
      ru: "Die Kernaussage — главная мысль текста; пересказать её своими словами и значит сделать резюме."
      uk: "Die Kernaussage — головна думка тексту; переказати її своїми словами і означає зробити резюме."

  - de: "sich äußern"
    ipa: "zɪç ˈɔʏ̯sɐn"
    pos: verb
    praesens_3sg: "äußert sich"
    partizip2: "sich geäußert"
    aux: haben
    valence: "sich + Akk; zu + Dat"
    en: "to comment, to say what one thinks"
    ru: "высказываться, давать комментарий"
    uk: "висловлюватися, давати коментар"
    example_de: "Zu diesem Thema möchte sich die Chefin nicht äußern."
    example_en: "The boss does not want to comment on this subject."
    example_ru: "По этой теме начальница не хочет высказываться."
    example_uk: "На цю тему начальниця не хоче висловлюватися."
    note:
      en: "The subject commented on takes zu + Dat, and the reflexive pronoun is never left out. Pointing back: Dazu sage ich nichts."
      ru: "Тему вводит zu + Dat, а возвратное местоимение никогда не опускается. Отсылка назад: Dazu sage ich nichts."
      uk: "Тему вводить zu + Dat, а зворотний займенник ніколи не випускають. Відсилання назад: Dazu sage ich nichts."

  - de: "abhängen"
    ipa: "ˈapˌhɛŋən"
    pos: verb
    praesens_3sg: "hängt ab"
    partizip2: "abgehangen"
    aux: haben
    valence: "von + Dat"
    en: "to depend"
    ru: "зависеть"
    uk: "залежати"
    example_de: "Wie lange wir bleiben, hängt vom Wetter ab."
    example_en: "How long we stay depends on the weather."
    example_ru: "Как долго мы останемся, зависит от погоды."
    example_uk: "Як довго ми залишимося, залежить від погоди."
    note:
      en: "Separable: hängt … ab. Von + Dat is fixed, and the everyday tense is the present: Das hängt davon ab. The adjective is abhängig von + Dat."
      ru: "Отделяемая приставка: hängt … ab. Von + Dat закреплён, а в быту звучит настоящее время: Das hängt davon ab. Прилагательное — abhängig von + Dat."
      uk: "Відокремлюваний префікс: hängt … ab. Von + Dat закріплений, а в побуті звучить теперішній час: Das hängt davon ab. Прикметник — abhängig von + Dat."

  - de: "behaupten"
    ipa: "bəˈhaʊ̯ptn̩"
    pos: verb
    praesens_3sg: "behauptet"
    partizip2: "behauptet"
    aux: haben
    valence: "+ Akk; dass …"
    en: "to claim, to assert"
    ru: "утверждать"
    uk: "стверджувати"
    example_de: "Der Beitrag behauptet, dass fast niemand mehr Zeitung liest."
    example_en: "The piece claims that hardly anyone reads a newspaper any more."
    example_ru: "В материале утверждается, что газеты почти никто уже не читает."
    example_uk: "У матеріалі стверджується, що газети майже ніхто вже не читає."
    note:
      en: "Says it without proving it, so it belongs next to a source check. Neutral reporting is sagen or berichten."
      ru: "Говорит, не доказывая, поэтому стоит рядом с проверкой источника. Нейтральная передача — sagen или berichten."
      uk: "Говорить, не доводячи, тому стоїть поруч із перевіркою джерела. Нейтральна передача — sagen або berichten."

  - de: "zustimmen"
    ipa: "ˈtsuːˌʃtɪmən"
    pos: verb
    praesens_3sg: "stimmt zu"
    partizip2: "zugestimmt"
    aux: haben
    valence: "+ Dat"
    en: "to agree with someone — the single verb that takes a Dativ person, not the einverstanden phrase"
    en_compact: "to agree with someone"
    ru: "соглашаться с кем-либо — одиночный глагол с дативом, не оборот с einverstanden"
    uk: "погоджуватися з кимось — одиничне дієслово з давальним, не зворот із einverstanden"
    example_de: "Bei dieser Frage stimme ich dir ganz zu."
    example_en: "On this question I quite agree with you."
    example_ru: "В этом вопросе я с тобой полностью согласен."
    example_uk: "У цьому питанні я з тобою цілком згоден."
    note:
      en: "Separable, and the person goes in the Dativ without a preposition: jemandem zustimmen. The adjective route is einverstanden sein mit + Dat."
      ru: "Отделяемая приставка, а человек стоит в Dativ без предлога: jemandem zustimmen. Через прилагательное — einverstanden sein mit + Dat."
      uk: "Відокремлюваний префікс, а людина стоїть у Dativ без прийменника: jemandem zustimmen. Через прикметник — einverstanden sein mit + Dat."

  - de: "widersprechen"
    ipa: "ˌviːdɐˈʃpʁɛçn̩"
    pos: verb
    praesens_3sg: "widerspricht"
    partizip2: "widersprochen"
    aux: haben
    valence: "+ Dat"
    en: "to contradict, to disagree openly"
    ru: "возражать, противоречить"
    uk: "заперечувати, суперечити"
    example_de: "Hier muss ich Ihnen leider widersprechen."
    example_en: "Here I am afraid I have to disagree with you."
    example_ru: "Тут я, к сожалению, вынужден вам возразить."
    example_uk: "Тут я, на жаль, змушений вам заперечити."
    note:
      en: "Not separable, although wider- looks like a prefix that would split: er widerspricht, er hat widersprochen. The person takes the Dativ."
      ru: "Не отделяется, хотя wider- выглядит как отделяемая приставка: er widerspricht, er hat widersprochen. Человек стоит в Dativ."
      uk: "Не відокремлюється, хоча wider- має вигляд відокремлюваного префікса: er widerspricht, er hat widersprochen. Людина стоїть у Dativ."

  - de: "überzeugen"
    ipa: "ˌyːbɐˈtsɔʏ̯gn̩"
    pos: verb
    praesens_3sg: "überzeugt"
    partizip2: "überzeugt"
    aux: haben
    valence: "+ Akk; von + Dat"
    en: "to convince"
    ru: "убеждать"
    uk: "переконувати"
    example_de: "Mit diesem Argument hat er fast alle überzeugt."
    example_en: "That point convinced almost everyone."
    example_ru: "Этим доводом он убедил почти всех."
    example_uk: "Цим доказом він переконав майже всіх."
    note:
      en: "The person goes in the Akkusativ, the matter follows von + Dat: jemanden von etwas überzeugen. Ich bin davon überzeugt is the state."
      ru: "Человек стоит в Akkusativ, а предмет вводит von + Dat: jemanden von etwas überzeugen. Состояние — ich bin davon überzeugt."
      uk: "Людина стоїть в Akkusativ, а предмет вводить von + Dat: jemanden von etwas überzeugen. Стан — ich bin davon überzeugt."

  - de: "zusammenfassen"
    ipa: "tsuˈzamənˌfasn̩"
    pos: verb
    praesens_3sg: "fasst zusammen"
    partizip2: "zusammengefasst"
    aux: haben
    valence: "+ Akk"
    en: "to summarize"
    ru: "кратко излагать, подводить итог"
    uk: "стисло викладати, підбивати підсумок"
    example_de: "Kannst du den Bericht in drei Sätzen zusammenfassen?"
    example_en: "Can you put the report into three sentences?"
    example_ru: "Можешь изложить отчёт в трёх предложениях?"
    example_uk: "Можеш викласти звіт у трьох реченнях?"
    note:
      en: "Separable: fasst … zusammen. The noun is die Zusammenfassung. Zusammengefasst: … opens a closing sentence."
      ru: "Отделяемая приставка: fasst … zusammen. Существительное — die Zusammenfassung. Zusammengefasst: … начинает итоговую фразу."
      uk: "Відокремлюваний префікс: fasst … zusammen. Іменник — die Zusammenfassung. Zusammengefasst: … починає підсумкову фразу."

  - de: "es geht um"
    ipa: "ɛs ˈgeːt ʊm"
    pos: phrase
    en: "it is about, the point is"
    ru: "речь идёт о, дело в"
    uk: "ідеться про, справа в"
    example_de: "In dem Beitrag geht es um den Verkehr in der Stadt."
    example_en: "The piece is about traffic in the town."
    example_ru: "В материале речь идёт о движении транспорта в городе."
    example_uk: "У матеріалі йдеться про рух транспорту в місті."
    note:
      en: "Um + Akk, and the es never disappears: name the text with in + Dat and leave the subject slot alone. Question: Worum geht es?"
      ru: "Um + Akk, и es никогда не исчезает: текст называют через in + Dat, а место подлежащего не трогают. Вопрос: Worum geht es?"
      uk: "Um + Akk, і es ніколи не зникає: текст називають через in + Dat, а місце підмета не чіпають. Питання: Worum geht es?"

  - de: "Standpunkt"
    ipa: "ˈʃtantˌpʊŋkt"
    pos: noun
    gender: m
    plural: "die Standpunkte"
    cards: recognition
    en: "point of view, position"
    ru: "точка зрения, позиция"
    uk: "точка зору, позиція"
    example_de: "Die beiden Gäste hatten sehr verschiedene Standpunkte."
    example_en: "The two guests held very different positions."
    example_ru: "У двух гостей были очень разные позиции."
    example_uk: "У двох гостей були дуже різні позиції."
    note:
      en: "More formal than die Meinung and used for a position you defend with reasons."
      ru: "Официальнее, чем die Meinung, и обозначает позицию, которую защищают доводами."
      uk: "Офіційніше, ніж die Meinung, і позначає позицію, яку захищають доказами."

  - de: "Öffentlichkeit"
    ipa: "ˈœfn̩tlɪçkaɪ̯t"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: "the public, public attention"
    ru: "общественность, публичность"
    uk: "громадськість, публічність"
    example_de: "Der Verein hat seine Pläne in der Öffentlichkeit vorgestellt."
    example_en: "The club presented its plans in public."
    example_ru: "Клуб представил свои планы публично."
    example_uk: "Клуб представив свої плани публічно."
    note:
      en: "In der Öffentlichkeit means in public view; the adjective is öffentlich, as in öffentliche Verkehrsmittel."
      ru: "In der Öffentlichkeit — «на публике, публично»; прилагательное öffentlich, как в öffentliche Verkehrsmittel."
      uk: "In der Öffentlichkeit — «на публіці, публічно»; прикметник öffentlich, як в öffentliche Verkehrsmittel."

  - de: "Redaktion"
    ipa: "ʁedakˈtsi̯oːn"
    pos: noun
    gender: f
    plural: "die Redaktionen"
    cards: recognition
    en: "editorial team, editorial office"
    ru: "редакция"
    uk: "редакція"
    example_de: "Die Redaktion antwortet auf jeden Leserbrief."
    example_en: "The editorial team answers every letter from a reader."
    example_ru: "Редакция отвечает на каждое письмо читателя."
    example_uk: "Редакція відповідає на кожен лист читача."
