# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the last third of
# the action verbs of data/goethe-b1-wortliste.txt — the ones that happen in the head
# and on paper rather than in the hands: noticing, pinning down, telling apart,
# assuming, proving, and keeping something from happening.
id: verben-handlungen-b1-3
title_de: "Handlungen: merken, prüfen, entscheiden"
title_en: "Actions: noticing, checking, deciding"
title_ru: "Действия: заметить, проверить, решить"
title_uk: "Дії: помітити, перевірити, вирішити"
level: B1
entries:
  # --- Merken und wahrnehmen ---
  - de: achten
    ipa: "ˈaxtn̩"
    pos: verb
    praesens_3sg: achtet
    partizip2: geachtet
    aux: haben
    valence: "auf + Akk"
    # Recognition only: A2 `aufpassen` ships "to pay attention" and
    # regeln-verantwortung `beachten` ships "to observe (a rule)" as production
    # cards — a typed prompt here has two owners already.
    cards: recognition
    en: to pay attention to, to look out for
    ru: обращать внимание на, следить за
    uk: звертати увагу на, стежити за
    example_de: Achten Sie bitte auf die Durchsagen am Bahnsteig.
    example_en: Please pay attention to the announcements on the platform.
    example_ru: Пожалуйста, обращайте внимание на объявления на платформе.
    example_uk: Будь ласка, звертайте увагу на оголошення на платформі.
    note:
      en: 'Regular: achtet, achtete, hat geachtet. Almost always with auf + Akkusativ. Compare the family: aufpassen is watching so that nothing goes wrong, beachten is obeying a rule or a sign, and this one is directing your attention at something. Without the preposition it means to respect a person (jemanden achten).'
      ru: 'Правильный глагол: achtet, achtete, hat geachtet. Почти всегда с auf + Akkusativ. Сравните семью: aufpassen — присматривать, чтобы ничего не случилось; beachten — соблюдать правило или указание; а этот глагол направляет внимание на что-то. Без предлога значит «уважать человека» (jemanden achten).'
      uk: 'Правильне дієслово: achtet, achtete, hat geachtet. Майже завжди з auf + Akkusativ. Порівняйте сім’ю: aufpassen — пильнувати, щоб нічого не сталося; beachten — дотримуватися правила чи вказівки; а це дієслово спрямовує увагу на щось. Без прийменника означає «поважати людину» (jemanden achten).'

  - de: bemerken
    ipa: "bəˈmɛʁkn̩"
    pos: verb
    praesens_3sg: bemerkt
    partizip2: bemerkt
    aux: haben
    valence: "+ Akk"
    en: to notice
    ru: замечать
    uk: помічати
    example_de: Ich habe den Fehler erst zu Hause bemerkt.
    example_en: I only noticed the mistake once I was home.
    example_ru: Ошибку я заметил только дома.
    example_uk: Помилку я помітив лише вдома.
    note:
      en: 'Regular, inseparable: bemerkt, hat bemerkt. Something reaches your attention without you looking for it, which is the opposite of beobachten. A2 merken is the neighbour to keep apart: sich etwas merken is to memorise it, and ich merke, dass … is a growing feeling. Die Bemerkung is a remark.'
      ru: 'Правильный глагол, неотделяемый: bemerkt, hat bemerkt. Что-то само попадает в поле внимания, без специального наблюдения — в этом противоположность beobachten. Рядом стоит A2-глагол merken: sich etwas merken — «запомнить», ich merke, dass … — «я чувствую, что». Die Bemerkung — замечание, реплика.'
      uk: 'Правильне дієслово, невідокремлюване: bemerkt, hat bemerkt. Щось саме потрапляє в поле уваги, без спеціального спостереження — у цьому протилежність beobachten. Поруч стоїть дієслово рівня A2 merken: sich etwas merken — «запам’ятати», ich merke, dass … — «я відчуваю, що». Die Bemerkung — зауваження, репліка.'

  - de: beobachten
    ipa: "bəˈʔoːbaxtn̩"
    pos: verb
    praesens_3sg: beobachtet
    partizip2: beobachtet
    aux: haben
    valence: "+ Akk"
    # Recognition only: `ansehen` and `gucken` ship "to watch" and
    # regeln-verantwortung `beachten` ships "to observe" as production cards, so both
    # natural renderings of this prompt are taken.
    cards: recognition
    en: to observe, to keep an eye on
    ru: наблюдать за, следить за
    uk: спостерігати за, стежити за
    example_de: Der Arzt möchte die Entwicklung noch eine Woche beobachten.
    example_en: The doctor would like to observe how it develops for another week.
    example_ru: Врач хочет ещё неделю понаблюдать за динамикой.
    example_uk: Лікар хоче ще тиждень поспостерігати за динамікою.
    note:
      en: 'Regular, inseparable: beobachtet, hat beobachtet. Watching on purpose and over time — a doctor, a bird-watcher, a neighbour. Ansehen is a single look, bemerken is noticing by accident. Die Beobachtung is an observation, and the weather word for it is die Wetterbeobachtung.'
      ru: 'Правильный глагол, неотделяемый: beobachtet, hat beobachtet. Наблюдение намеренное и растянутое во времени — врач, орнитолог, сосед. Ansehen — один взгляд, bemerken — случайно заметить. Die Beobachtung — наблюдение.'
      uk: 'Правильне дієслово, невідокремлюване: beobachtet, hat beobachtet. Спостереження навмисне й розтягнуте в часі — лікар, орнітолог, сусід. Ansehen — один погляд, bemerken — випадково помітити. Die Beobachtung — спостереження.'

  - de: auffallen
    ipa: "ˈaʊ̯fˌfalən"
    pos: verb
    praesens_3sg: fällt auf
    partizip2: aufgefallen
    aux: sein
    valence: "+ Dat"
    en: to stand out, to be noticeable
    ru: бросаться в глаза, обращать на себя внимание
    uk: впадати в око, привертати увагу
    example_de: Ist dir aufgefallen, dass die Ampel nicht funktioniert?
    example_en: Did you notice that the traffic light is not working?
    example_ru: Ты обратил внимание, что светофор не работает?
    example_uk: Ти звернув увагу, що світлофор не працює?
    note:
      en: 'Separable, with sein: fällt auf, ist aufgefallen. The German sentence turns the English one round: the thing noticed is the subject and the person is dative, so mir ist aufgefallen, dass … is I noticed that … Learn that frame whole — it is one of the most useful openings at B1. The adjective auffällig means conspicuous.'
      ru: 'Отделяемый глагол с sein: fällt auf, ist aufgefallen. Немецкая фраза переворачивает русскую: подлежащее — то, что замечено, а человек стоит в Dativ, поэтому mir ist aufgefallen, dass … значит «я заметил, что». Эту рамку стоит выучить целиком — она одна из самых полезных на уровне B1. Прилагательное auffällig — «броский, заметный».'
      uk: 'Відокремлюване дієслово із sein: fällt auf, ist aufgefallen. Німецька фраза перевертає українську: підметом є те, що помічено, а людина стоїть у Dativ, тому mir ist aufgefallen, dass … означає «я помітив, що». Цю рамку варто вивчити цілою — вона одна з найкорисніших на рівні B1. Прикметник auffällig — «помітний, кричущий».'

  - de: erkennen
    ipa: "ɛɐ̯ˈkɛnən"
    pos: verb
    praesens_3sg: erkennt
    partizip2: erkannt
    aux: haben
    valence: "+ Akk an + Dat"
    en: to recognise (know again); to make out
    ru: опознавать, узнавать в лицо
    uk: упізнавати, розпізнавати
    example_de: Ich habe dich am Mantel sofort erkannt.
    example_en: I recognised you at once by your coat.
    example_ru: Я сразу узнал тебя по пальто.
    example_uk: Я одразу впізнав тебе по пальту.
    note:
      en: 'Mixed verb, inseparable: erkennt, erkannte, hat erkannt. The clue you go by takes an + Dativ, as in the example. Two senses that stay close: knowing someone again, and being able to make something out (Auf dem Foto kann man nichts erkennen). It is not the official recognition of a diploma — that is anerkennen.'
      ru: 'Смешанный глагол, неотделяемый: erkennt, erkannte, hat erkannt. Признак, по которому узнают, вводится через an + Dativ, как в примере. Два близких значения: узнать знакомого и суметь различить (Auf dem Foto kann man nichts erkennen). Официальное признание диплома — не сюда, это anerkennen.'
      uk: 'Мішане дієслово, невідокремлюване: erkennt, erkannte, hat erkannt. Ознака, за якою впізнають, вводиться через an + Dativ, як у прикладі. Два близькі значення: упізнати знайомого та зуміти розрізнити (Auf dem Foto kann man nichts erkennen). Офіційне визнання диплома — не сюди, це anerkennen.'

  - de: feststellen
    ipa: "ˈfɛstˌʃtɛlən"
    pos: verb
    praesens_3sg: stellt fest
    partizip2: festgestellt
    aux: haben
    valence: "+ Akk"
    en: to establish, to ascertain
    ru: устанавливать, констатировать
    uk: установлювати, констатувати
    example_de: Die Werkstatt hat festgestellt, dass die Bremsen defekt sind.
    example_en: The garage established that the brakes are faulty.
    example_ru: Мастерская установила, что тормоза неисправны.
    example_uk: Майстерня встановила, що гальма несправні.
    note:
      en: 'Separable, stress on fest: stellt fest, hat festgestellt. It is the verb for a finding — what a doctor, a mechanic or an office concludes after looking. It is also the polite opening of a complaint: Ich habe festgestellt, dass die Heizung nicht funktioniert. Die Feststellung is the finding itself.'
      ru: 'Отделяемый глагол, ударение на fest: stellt fest, hat festgestellt. Глагол вывода: так формулирует результат врач, автомеханик, ведомство. Он же — вежливое начало жалобы: Ich habe festgestellt, dass die Heizung nicht funktioniert. Die Feststellung — сам вывод, констатация.'
      uk: 'Відокремлюване дієслово, наголос на fest: stellt fest, hat festgestellt. Дієслово висновку: так формулює результат лікар, автомеханік, відомство. Воно ж — увічливий початок скарги: Ich habe festgestellt, dass die Heizung nicht funktioniert. Die Feststellung — сам висновок, констатація.'

  # --- Festlegen und feststehen ---
  - de: festlegen
    ipa: "ˈfɛstˌleːgn̩"
    pos: verb
    praesens_3sg: legt fest
    partizip2: festgelegt
    aux: haben
    valence: "+ Akk"
    en: to set (a date, a rule), to pin down
    en_compact: to set a date or a rule
    ru: определять, фиксировать (дату, правило)
    uk: визначати, фіксувати (дату, правило)
    example_de: Wir sollten endlich einen Termin festlegen.
    example_en: We should finally fix a date.
    example_ru: Нам пора наконец назначить дату.
    example_uk: Нам варто нарешті призначити дату.
    note:
      en: 'Separable, stress on fest: legt fest, hat festgelegt. What gets fixed is something that could still have been changed: a date, a price, a rule, an order. With sich it means to commit yourself (Ich möchte mich noch nicht festlegen), which is the polite way of not deciding yet.'
      ru: 'Отделяемый глагол, ударение на fest: legt fest, hat festgelegt. Закрепляют то, что ещё могло меняться: дату, цену, правило, порядок. С sich значит «связать себя решением» (Ich möchte mich noch nicht festlegen) — вежливый способ пока не решать.'
      uk: 'Відокремлюване дієслово, наголос на fest: legt fest, hat festgelegt. Закріплюють те, що ще могло змінюватися: дату, ціну, правило, порядок. Із sich означає «зв’язати себе рішенням» (Ich möchte mich noch nicht festlegen) — увічливий спосіб поки не вирішувати.'

  - de: festsetzen
    ipa: "ˈfɛstˌzɛtsn̩"
    pos: verb
    praesens_3sg: setzt fest
    partizip2: festgesetzt
    aux: haben
    valence: "+ Akk"
    # Recognition only: administrative twin of this deck's `festlegen` — an authority
    # sets a fee or a deadline. One typed card for the family is enough.
    cards: recognition
    en: to set officially (a fee, a deadline)
    en_compact: to set officially
    ru: устанавливать официально (сбор, срок)
    uk: установлювати офіційно (збір, строк)
    example_de: Die Gebühr wird jedes Jahr neu festgesetzt.
    example_en: The fee is set anew every year.
    example_ru: Сбор устанавливается заново каждый год.
    example_uk: Збір установлюють наново щороку.
    note:
      en: 'Separable, stress on fest: setzt fest, hat festgesetzt. Almost always an authority doing the setting, and almost always in the passive, as in the example. Where festlegen is what two people agree between them, this is what a Behörde decides for everyone.'
      ru: 'Отделяемый глагол, ударение на fest: setzt fest, hat festgesetzt. Устанавливает почти всегда ведомство и почти всегда в пассиве, как в примере. Если festlegen — то, о чём договариваются двое, то это — то, что решает Behörde для всех.'
      uk: 'Відокремлюване дієслово, наголос на fest: setzt fest, hat festgesetzt. Установлює майже завжди відомство і майже завжди в пасиві, як у прикладі. Якщо festlegen — те, про що домовляються двоє, то це — те, що вирішує Behörde для всіх.'

  - de: feststehen
    ipa: "ˈfɛstˌʃteːən"
    pos: verb
    praesens_3sg: steht fest
    partizip2: festgestanden
    aux: haben
    # Recognition only: report register — the line a newspaper or an organiser writes
    # when a fact is settled. A learner says Das ist sicher or Das wissen wir schon.
    cards: recognition
    en: to be settled, to be certain
    ru: быть решённым, не подлежать сомнению
    uk: бути вирішеним, не підлягати сумніву
    example_de: Der Termin steht noch nicht fest.
    example_en: The date has not been settled yet.
    example_ru: Дата ещё не определена.
    example_uk: Дата ще не визначена.
    note:
      en: 'Separable, stress on fest: steht fest, hat festgestanden. It is the passive twin of festlegen — somebody fixed it, and now it stands. The sentence in the example is what an organiser writes and says; its opposite, Es steht fest, dass …, introduces something no longer in doubt.'
      ru: 'Отделяемый глагол, ударение на fest: steht fest, hat festgestanden. Пассивный двойник festlegen: кто-то закрепил — и теперь оно стоит. Фраза из примера звучит от организатора; обратное Es steht fest, dass … вводит то, что уже вне сомнений.'
      uk: 'Відокремлюване дієслово, наголос на fest: steht fest, hat festgestanden. Пасивний двійник festlegen: хтось закріпив — і тепер воно стоїть. Фраза з прикладу лунає від організатора; зворотне Es steht fest, dass … вводить те, що вже поза сумнівом.'

  - de: herausfinden
    ipa: "hɛˈʁaʊ̯sˌfɪndn̩"
    pos: verb
    praesens_3sg: findet heraus
    partizip2: herausgefunden
    aux: haben
    valence: "+ Akk"
    # Recognition only: `erfahren` (reisen-probleme) ships "to find out" as a
    # production card, and no accept list here can reach a card in another deck.
    cards: recognition
    en: to find out (by looking into it)
    ru: выяснить, разузнать
    uk: з’ясувати, дізнатися
    example_de: Kannst du herausfinden, wann der Laden aufmacht?
    example_en: Can you find out when the shop opens?
    example_ru: Можешь выяснить, когда открывается магазин?
    example_uk: Можеш з’ясувати, коли відчиняється крамниця?
    note:
      en: 'Separable, stress on heraus: findet heraus, hat herausgefunden. Effort is built in — you look something up, ask around, check. Erfahren is the neutral one, where the information simply reaches you. In speech the prefix is usually shortened to raus: Kannst du das rausfinden?'
      ru: 'Отделяемый глагол, ударение на heraus: findet heraus, hat herausgefunden. В значении заложено усилие: посмотреть, расспросить, проверить. Erfahren — нейтральное «узнать», когда сведения доходят сами. В речи приставку сокращают до raus: Kannst du das rausfinden?'
      uk: 'Відокремлюване дієслово, наголос на heraus: findet heraus, hat herausgefunden. У значенні закладене зусилля: подивитися, розпитати, перевірити. Erfahren — нейтральне «дізнатися», коли відомості доходять самі. У мовленні префікс скорочують до raus: Kannst du das rausfinden?'

  - de: klären
    ipa: "ˈklɛːʁən"
    pos: verb
    praesens_3sg: klärt
    partizip2: geklärt
    aux: haben
    valence: "+ Akk"
    en: to clear up, to get to the bottom of (a question)
    ru: выяснять, прояснять (вопрос)
    uk: з’ясовувати, прояснювати (питання)
    example_de: Das müssen wir vor der Unterschrift klären.
    example_en: We have to clear that up before we sign.
    example_ru: Это нужно выяснить до подписания.
    example_uk: Це треба з’ясувати до підписання.
    note:
      en: 'Regular: klärt, klärte, hat geklärt. Its object is an open question, a misunderstanding or a disagreement, and the result is that everyone knows where they stand. Aufklären is to inform someone fully, sich klären is what a situation does by itself. The adjective behind it is klar.'
      ru: 'Правильный глагол: klärt, klärte, hat geklärt. Дополнение — открытый вопрос, недоразумение, разногласие; результат в том, что всем всё ясно. Aufklären — «разъяснить кому-то», sich klären — «проясниться само». За глаголом стоит прилагательное klar.'
      uk: 'Правильне дієслово: klärt, klärte, hat geklärt. Додаток — відкрите питання, непорозуміння, розбіжність; результат у тому, що всім усе ясно. Aufklären — «роз’яснити комусь», sich klären — «прояснитися саме». За дієсловом стоїть прикметник klar.'

  # --- Auseinanderhalten und annehmen ---
  - de: unterscheiden
    ipa: "ʊntɐˈʃaɪ̯dn̩"
    pos: verb
    praesens_3sg: unterscheidet
    partizip2: unterschieden
    aux: haben
    valence: "+ Akk von + Dat"
    en: to tell apart, to distinguish
    ru: различать, отличать
    uk: розрізняти, відрізняти
    example_de: Am Telefon kann ich die Zwillinge nicht unterscheiden.
    example_en: On the phone I cannot tell the twins apart.
    example_ru: По телефону я не различаю близнецов.
    example_uk: По телефону я не розрізняю близнюків.
    note:
      en: 'Strong verb, inseparable: unterscheidet, unterschied, hat unterschieden. Two frames: A von B unterscheiden (tell A from B) and sich unterscheiden (differ from each other). Der Unterschied is the difference itself, and unterschiedlich means varying.'
      ru: 'Сильный глагол, неотделяемый: unterscheidet, unterschied, hat unterschieden. Две конструкции: A von B unterscheiden («отличить A от B») и sich unterscheiden («различаться между собой»). Der Unterschied — само различие, unterschiedlich — «разный, неодинаковый».'
      uk: 'Сильне дієслово, невідокремлюване: unterscheidet, unterschied, hat unterschieden. Дві конструкції: A von B unterscheiden («відрізнити A від B») і sich unterscheiden («різнитися між собою»). Der Unterschied — сама різниця, unterschiedlich — «різний, неоднаковий».'

  - de: verwechseln
    ipa: "fɛɐ̯ˈvɛksl̩n"
    pos: verb
    praesens_3sg: verwechselt
    partizip2: verwechselt
    aux: haben
    valence: "+ Akk mit + Dat"
    en: to mix up, to take one for the other
    ru: перепутать (одно с другим)
    uk: переплутати (одне з іншим)
    example_de: Entschuldigung, ich habe Sie mit meinem Nachbarn verwechselt.
    example_en: Sorry, I took you for my neighbour.
    example_ru: Извините, я перепутал вас с соседом.
    example_uk: Вибачте, я переплутав вас із сусідом.
    note:
      en: 'Regular, inseparable: verwechselt, hat verwechselt. The second item takes mit + Dativ. Note the pair with unterscheiden: this is the failure the other one prevents, and it is the honest word for a mistake with two similar things — two words, two people, two dates. Die Verwechslung is the mix-up.'
      ru: 'Правильный глагол, неотделяемый: verwechselt, hat verwechselt. Второй предмет вводится через mit + Dativ. Пара с unterscheiden показательна: здесь та самая неудача, которую тот глагол предотвращает; это честное слово об ошибке с двумя похожими вещами — словами, людьми, датами. Die Verwechslung — путаница.'
      uk: 'Правильне дієслово, невідокремлюване: verwechselt, hat verwechselt. Другий предмет вводиться через mit + Dativ. Пара з unterscheiden показова: тут та сама невдача, якій те дієслово запобігає; це чесне слово про помилку з двома схожими речами — словами, людьми, датами. Die Verwechslung — плутанина.'

  - de: vermuten
    ipa: "fɛɐ̯ˈmuːtn̩"
    pos: verb
    praesens_3sg: vermutet
    partizip2: vermutet
    aux: haben
    valence: "+ Akk"
    en: to suspect, to presume
    ru: предполагать, догадываться
    uk: припускати, здогадуватися
    example_de: Ich vermute, dass der Zug wieder Verspätung hat.
    example_en: I presume the train is late again.
    example_ru: Полагаю, поезд снова опаздывает.
    example_uk: Припускаю, що потяг знову спізнюється.
    note:
      en: 'Regular, inseparable: vermutet, hat vermutet. It marks a conclusion drawn from evidence, one step firmer than glauben and one step softer than wissen. The adverb vermutlich (presumably) belongs to the same family and does the same job inside a sentence. Die Vermutung is the assumption.'
      ru: 'Правильный глагол, неотделяемый: vermutet, hat vermutet. Отмечает вывод из косвенных данных: на шаг твёрже, чем glauben, и на шаг мягче, чем wissen. Наречие vermutlich («по-видимому») из той же семьи и делает ту же работу внутри предложения. Die Vermutung — предположение.'
      uk: 'Правильне дієслово, невідокремлюване: vermutet, hat vermutet. Позначає висновок із непрямих даних: на крок твердіше, ніж glauben, і на крок м’якше, ніж wissen. Прислівник vermutlich («імовірно») з тієї самої сім’ї й робить ту саму роботу всередині речення. Die Vermutung — припущення.'

  - de: überlegen
    ipa: "yːbɐˈleːgn̩"
    pos: verb
    praesens_3sg: überlegt
    partizip2: überlegt
    aux: haben
    valence: "+ Akk / sich + Dat"
    en: to think it over, to consider
    ru: обдумывать, размышлять
    uk: обмірковувати, розмірковувати
    example_de: Ich überlege noch, ob ich mitkomme.
    example_en: I am still thinking about whether to come along.
    example_ru: Я ещё думаю, поеду ли с вами.
    example_uk: Я ще думаю, чи піду з вами.
    note:
      en: 'Regular, inseparable: überlegt, hat überlegt. The sentence in the example is the standard polite way of not answering yet. With a dative reflexive it means to make up your mind about something: Ich habe es mir anders überlegt is I have changed my mind. Nachdenken is thinking as an activity; this one aims at a decision.'
      ru: 'Правильный глагол, неотделяемый: überlegt, hat überlegt. Фраза из примера — стандартный вежливый способ пока не отвечать. С возвратным Dativ означает «прикинуть, решить»: Ich habe es mir anders überlegt — «я передумал». Nachdenken — размышление как процесс, а этот глагол нацелен на решение.'
      uk: 'Правильне дієслово, невідокремлюване: überlegt, hat überlegt. Фраза з прикладу — стандартний увічливий спосіб поки не відповідати. Зі зворотним Dativ означає «прикинути, вирішити»: Ich habe es mir anders überlegt — «я передумав». Nachdenken — роздуми як процес, а це дієслово націлене на рішення.'

  - de: nachdenken
    ipa: "ˈnaːxˌdɛŋkn̩"
    pos: verb
    praesens_3sg: denkt nach
    partizip2: nachgedacht
    aux: haben
    valence: "über + Akk"
    # Recognition only: A1 `denken` ships "to think" as a production card, and this
    # deck's own `überlegen` takes the family's typed card because it is the one a
    # reply is built on.
    cards: recognition
    en: to think (about something) at length
    ru: размышлять, обдумывать (долго)
    uk: розмірковувати, обдумувати (довго)
    example_de: Über deinen Vorschlag muss ich in Ruhe nachdenken.
    example_en: I need to think your suggestion over calmly.
    example_ru: Над твоим предложением мне надо спокойно подумать.
    example_uk: Над твоєю пропозицією мені треба спокійно подумати.
    note:
      en: 'Separable, stress on nach: denkt nach, hat nachgedacht. The topic takes über + Akkusativ. It is thinking as an activity that takes time, which is why it pairs with in Ruhe and lange. Denken alone can also mean to hold an opinion; this one never does. Nachdenklich describes someone lost in thought.'
      ru: 'Отделяемый глагол, ударение на nach: denkt nach, hat nachgedacht. Тема вводится через über + Akkusativ. Это размышление как процесс, требующий времени, поэтому рядом стоят in Ruhe и lange. Denken может значить и «считать, полагать»; этот глагол — никогда. Nachdenklich — «задумчивый».'
      uk: 'Відокремлюване дієслово, наголос на nach: denkt nach, hat nachgedacht. Тема вводиться через über + Akkusativ. Це роздуми як процес, що потребує часу, тому поруч стоять in Ruhe і lange. Denken може означати й «вважати»; це дієслово — ніколи. Nachdenklich — «замислений».'

  - de: annehmen
    ipa: "ˈanˌneːmən"
    pos: verb
    praesens_3sg: nimmt an
    partizip2: angenommen
    aux: haben
    valence: "+ Akk"
    # Recognition only: `akzeptieren` and `zusagen` ship "to accept" as production
    # cards, and the second sense (to assume) is a different prompt again — one
    # headword cannot be asked for by either.
    cards: recognition
    en: to accept (an offer, a parcel); to assume
    en_compact: to accept; to assume
    ru: принимать (предложение, посылку); предполагать
    uk: приймати (пропозицію, посилку); припускати
    example_de: Nehmen wir an, der Zug fällt aus — was machen wir dann?
    example_en: "Let us assume the train is cancelled: what do we do then?"
    example_ru: Допустим, поезд отменят — что тогда?
    example_uk: Припустімо, потяг скасують — що тоді?
    note:
      en: 'Separable, stress on an: nimmt an, hat angenommen. Two lives worth separating. Concretely it accepts what is offered — ein Paket annehmen, eine Einladung annehmen, einen Anruf annehmen. Abstractly it assumes, as in the example, and angenommen, dass … opens a hypothetical. Die Annahme is both the assumption and the parcel counter.'
      ru: 'Отделяемый глагол, ударение на an: nimmt an, hat angenommen. Две жизни стоит развести. Конкретно — принять предложенное: ein Paket annehmen, eine Einladung annehmen, einen Anruf annehmen. Абстрактно — «предположить», как в примере, а angenommen, dass … вводит гипотезу. Die Annahme — и предположение, и пункт приёма посылок.'
      uk: 'Відокремлюване дієслово, наголос на an: nimmt an, hat angenommen. Два життя варто розвести. Конкретно — прийняти запропоноване: ein Paket annehmen, eine Einladung annehmen, einen Anruf annehmen. Абстрактно — «припустити», як у прикладі, а angenommen, dass … вводить гіпотезу. Die Annahme — і припущення, і пункт приймання посилок.'

  - de: anerkennen
    ipa: "ˈanʔɛɐ̯ˌkɛnən"
    pos: verb
    praesens_3sg: erkennt an
    partizip2: anerkannt
    aux: haben
    valence: "+ Akk"
    # Recognition only: it collides with this deck's own `erkennen`, and its home is
    # the letter that says whether a foreign diploma counts.
    cards: recognition
    en: to recognise officially, to acknowledge
    ru: официально признавать
    uk: офіційно визнавати
    example_de: Mein Abschluss wurde in Deutschland anerkannt.
    example_en: My qualification was recognised in Germany.
    example_ru: Мой диплом был признан в Германии.
    example_uk: Мій диплом визнали в Німеччині.
    note:
      en: 'Mixed verb, separable in form but with the participle anerkannt: erkennt an, hat anerkannt. Its subject is an authority, an office or an employer, and its object is a diploma, a document, a right, an achievement. Die Anerkennung is the recognition procedure a migrant office runs, and also plain appreciation.'
      ru: 'Смешанный глагол, формально отделяемый, но с причастием anerkannt: erkennt an, hat anerkannt. Подлежащее — ведомство, учреждение, работодатель; дополнение — диплом, документ, право, заслуга. Die Anerkennung — и процедура признания в ведомстве, и просто признание заслуг.'
      uk: 'Мішане дієслово, формально відокремлюване, але з дієприкметником anerkannt: erkennt an, hat anerkannt. Підмет — відомство, установа, роботодавець; додаток — диплом, документ, право, заслуга. Die Anerkennung — і процедура визнання у відомстві, і просто визнання заслуг.'

  - de: sich entschließen
    ipa: "zɪç ɛntˈʃliːsn̩"
    pos: verb
    praesens_3sg: entschließt sich
    partizip2: sich entschlossen
    aux: haben
    valence: "sich zu + Dat"
    # Recognition only: `sich entscheiden` and `beschließen` both ship "to decide" as
    # production cards, so this headword answers a prompt that has two owners.
    cards: recognition
    en: to make up one's mind
    ru: решиться, принять решение
    uk: наважитися, ухвалити рішення
    example_de: Nach langem Zögern hat er sich zu einem Umzug entschlossen.
    example_en: After hesitating for a long time he made up his mind to move.
    example_ru: После долгих сомнений он решился на переезд.
    example_uk: Після довгих вагань він наважився на переїзд.
    note:
      en: 'Strong verb, always reflexive: entschließt sich, entschloss sich, hat sich entschlossen. What is decided takes zu + Dativ or a zu-infinitive. It carries the weight of an inner struggle, which sich entscheiden (choosing between options) and beschließen (a body deciding formally) do not. The adjective entschlossen means determined.'
      ru: 'Сильный глагол, всегда возвратный: entschließt sich, entschloss sich, hat sich entschlossen. Предмет решения вводится через zu + Dativ или инфинитив с zu. В слове звучит внутренняя борьба, которой нет у sich entscheiden (выбор из вариантов) и beschließen (официальное решение органа). Прилагательное entschlossen — «решительный».'
      uk: 'Сильне дієслово, завжди зворотне: entschließt sich, entschloss sich, hat sich entschlossen. Предмет рішення вводиться через zu + Dativ або інфінітив із zu. У слові звучить внутрішня боротьба, якої немає в sich entscheiden (вибір з варіантів) і beschließen (офіційне рішення органу). Прикметник entschlossen — «рішучий».'

  - de: sich eignen
    ipa: "zɪç ˈaɪ̯gnən"
    pos: verb
    praesens_3sg: eignet sich
    partizip2: sich geeignet
    aux: haben
    valence: "sich für + Akk"
    # Recognition only: job-ad and product-label register — the learner meets the
    # participle geeignet far more often than the verb, and says passt or ist gut für.
    cards: recognition
    en: to be suitable
    ru: подходить, годиться
    uk: підходити, годитися
    example_de: Dieser Kurs eignet sich auch für Anfänger.
    example_en: This course is suitable for beginners as well.
    example_ru: Этот курс подходит и для начинающих.
    example_uk: Цей курс підходить і для початківців.
    note:
      en: 'Regular, always reflexive: eignet sich, hat sich geeignet. The purpose takes für + Akkusativ or als + Nominative. In practice the participle is what you see: geeignet on a course description, nicht geeignet für Kinder unter drei Jahren on a toy. Speech says Das passt gut für …'
      ru: 'Правильный глагол, всегда возвратный: eignet sich, hat sich geeignet. Назначение вводится через für + Akkusativ или als с Nominativ. На практике чаще встречается причастие: geeignet в описании курса, nicht geeignet für Kinder unter drei Jahren на игрушке. Речь скажет Das passt gut für …'
      uk: 'Правильне дієслово, завжди зворотне: eignet sich, hat sich geeignet. Призначення вводиться через für + Akkusativ або als з Nominativ. На практиці частіше трапляється дієприкметник: geeignet в описі курсу, nicht geeignet für Kinder unter drei Jahren на іграшці. Мовлення скаже Das passt gut für …'

  # --- Prüfen und zeigen ---
  - de: beweisen
    ipa: "bəˈvaɪ̯zn̩"
    pos: verb
    praesens_3sg: beweist
    partizip2: bewiesen
    aux: haben
    valence: "+ Akk"
    en: to prove
    ru: доказывать
    uk: доводити
    example_de: Mit dem Kassenbon kann ich beweisen, wann ich es gekauft habe.
    example_en: With the receipt I can prove when I bought it.
    example_ru: По чеку я могу доказать, когда это купил.
    example_uk: За чеком я можу довести, коли це купив.
    note:
      en: 'Strong verb, inseparable: beweist, bewies, hat bewiesen. It is what evidence does, so a receipt, a photo or a document is the usual instrument, introduced with mit. Der Beweis is the proof; nachweisen is its administrative cousin, used when an office wants a qualification documented.'
      ru: 'Сильный глагол, неотделяемый: beweist, bewies, hat bewiesen. Это работа доказательства, поэтому инструментом обычно служит чек, фото или документ — вводится через mit. Der Beweis — доказательство; административный родственник nachweisen нужен, когда ведомство требует подтвердить квалификацию.'
      uk: 'Сильне дієслово, невідокремлюване: beweist, bewies, hat bewiesen. Це робота доказу, тому інструментом зазвичай є чек, світлина чи документ — вводиться через mit. Der Beweis — доказ; адміністративний родич nachweisen потрібен, коли відомство вимагає підтвердити кваліфікацію.'

  - de: testen
    ipa: "ˈtɛstn̩"
    pos: verb
    praesens_3sg: testet
    partizip2: getestet
    aux: haben
    valence: "+ Akk"
    # Recognition only: `prüfen` (arbeit-ausbildung-a2) ships "to test" as a
    # production card, and the two words are interchangeable in most sentences.
    cards: recognition
    en: to test, to try out
    ru: тестировать, испытывать
    uk: тестувати, випробовувати
    example_de: Wir haben die App eine Woche lang getestet.
    example_en: We tested the app for a week.
    example_ru: Мы тестировали приложение неделю.
    example_uk: Ми тестували застосунок тиждень.
    note:
      en: 'Regular: testet, testete, hat getestet. A loanword, and it goes where the English one goes: a product, a program, a hypothesis, a patient. Prüfen is the German twin and is what a school and an office use. Der Test is the noun, and a shop trial is often called a Testphase.'
      ru: 'Правильный глагол: testet, testete, hat getestet. Заимствование, употребляется там же, где английский оригинал: продукт, программа, гипотеза, пациент. Prüfen — немецкий двойник, слово школы и ведомства. Der Test — существительное, а пробный период часто называют Testphase.'
      uk: 'Правильне дієслово: testet, testete, hat getestet. Запозичення, уживається там само, де англійський оригінал: продукт, програма, гіпотеза, пацієнт. Prüfen — німецький двійник, слово школи й відомства. Der Test — іменник, а пробний період часто називають Testphase.'

  - de: analysieren
    ipa: "analyˈziːʁən"
    pos: verb
    praesens_3sg: analysiert
    partizip2: analysiert
    aux: haben
    valence: "+ Akk"
    # Recognition only: academic and report register — read in a course description
    # or an article, and produced by a B1 learner almost never.
    cards: recognition
    en: to analyse
    ru: анализировать
    uk: аналізувати
    example_de: Im Kurs analysieren wir echte Stellenanzeigen.
    example_en: In the course we analyse real job advertisements.
    example_ru: На курсе мы анализируем настоящие объявления о работе.
    example_uk: На курсі ми аналізуємо справжні оголошення про роботу.
    note:
      en: 'Regular, stress on the -sieren: analysiert, hat analysiert — no ge- in the participle, like every -ieren verb. It belongs to a course programme, a report and a newspaper. Die Analyse is the noun; note that the German verb keeps the s of the noun where English writes a z.'
      ru: 'Правильный глагол, ударение на -sieren: analysiert, hat analysiert — без ge- в причастии, как у всех глаголов на -ieren. Слово из программы курса, отчёта и газеты. Die Analyse — существительное.'
      uk: 'Правильне дієслово, наголос на -sieren: analysiert, hat analysiert — без ge- у дієприкметнику, як у всіх дієслів на -ieren. Слово з програми курсу, звіту й газети. Die Analyse — іменник.'

  - de: darstellen
    ipa: "ˈdaːɐ̯ˌʃtɛlən"
    pos: verb
    praesens_3sg: stellt dar
    partizip2: dargestellt
    aux: haben
    valence: "+ Akk"
    # Recognition only: written register — a chart shows, a text depicts, an actor
    # portrays. What a learner says is zeigen or beschreiben.
    cards: recognition
    en: to depict, to portray, to represent
    ru: изображать, представлять (в тексте, на схеме)
    uk: зображати, подавати (у тексті, на схемі)
    example_de: Die Grafik stellt die Entwicklung der Mieten dar.
    example_en: The chart shows how rents have developed.
    example_ru: График изображает динамику арендной платы.
    example_uk: Графік зображає динаміку орендної плати.
    note:
      en: 'Separable, stress on dar: stellt dar, hat dargestellt. Three homes: a chart or a text that presents something, an actor who plays a role, and the formal sense of constituting something (Das stellt ein Problem dar). Die Darstellung is the presentation itself.'
      ru: 'Отделяемый глагол, ударение на dar: stellt dar, hat dargestellt. Три области: график или текст, который что-то представляет; актёр, играющий роль; и официальное «представлять собой» (Das stellt ein Problem dar). Die Darstellung — само изложение, изображение.'
      uk: 'Відокремлюване дієслово, наголос на dar: stellt dar, hat dargestellt. Три сфери: графік чи текст, який щось подає; актор, що грає роль; і офіційне «становити» (Das stellt ein Problem dar). Die Darstellung — сам виклад, зображення.'

  # --- Verhindern, begrenzen, stützen ---
  - de: verhindern
    ipa: "fɛɐ̯ˈhɪndɐn"
    pos: verb
    praesens_3sg: verhindert
    partizip2: verhindert
    aux: haben
    valence: "+ Akk"
    en: to prevent
    ru: предотвращать, не допускать
    uk: запобігати, не допускати
    example_de: Ein zweiter Schlüssel hätte das Problem verhindert.
    example_en: A second key would have prevented the problem.
    example_ru: Второй ключ предотвратил бы эту проблему.
    example_uk: Другий ключ запобіг би цій проблемі.
    note:
      en: 'Regular, inseparable: verhindert, hat verhindert. Something is stopped before it happens; vermeiden is avoiding something you could have chosen. The participle also describes a person who cannot come: Ich bin leider verhindert is the polite formula for cancelling.'
      ru: 'Правильный глагол, неотделяемый: verhindert, hat verhindert. Событие останавливают до того, как оно случилось; vermeiden — избегать того, что зависело от вас. Причастие описывает и человека, который не может прийти: Ich bin leider verhindert — вежливая формула отказа.'
      uk: 'Правильне дієслово, невідокремлюване: verhindert, hat verhindert. Подію зупиняють до того, як вона сталася; vermeiden — уникати того, що залежало від вас. Дієприкметник описує й людину, яка не може прийти: Ich bin leider verhindert — увічлива формула відмови.'

  - de: ausschließen
