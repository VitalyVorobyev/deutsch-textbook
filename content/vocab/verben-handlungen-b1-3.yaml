    pos: verb
    praesens_3sg: schließt aus
    partizip2: ausgeschlossen
    aux: haben
    valence: "+ Akk"
    # Recognition only: contract-and-report register. Its living form for a learner is
    # the one-word reply Ausgeschlossen!, not the verb.
    cards: recognition
    en: to rule out; to exclude
    ru: исключать (возможность, человека)
    uk: виключати (можливість, людину)
    example_de: Einen Fehler in der Rechnung kann ich nicht ausschließen.
    example_en: I cannot rule out a mistake in the invoice.
    example_ru: Ошибку в счёте я исключить не могу.
    example_uk: Помилку в рахунку я виключити не можу.
    note:
      en: 'Strong verb, separable: schließt aus, hat ausgeschlossen. It rules out a possibility, and it also shuts a person out of a group. The participle stands alone as an emphatic no: Ausgeschlossen! In contracts, ausgeschlossen marks what is not covered.'
      ru: 'Сильный глагол, отделяемый: schließt aus, hat ausgeschlossen. Исключает возможность, а также человека из группы. Причастие работает самостоятельным категорическим «нет»: Ausgeschlossen! В договорах ausgeschlossen помечает то, что не покрывается.'
      uk: 'Сильне дієслово, відокремлюване: schließt aus, hat ausgeschlossen. Виключає можливість, а також людину з групи. Дієприкметник працює самостійним категоричним «ні»: Ausgeschlossen! У договорах ausgeschlossen позначає те, що не покривається.'

  - de: beschränken
    ipa: "bəˈʃʁɛŋkn̩"
    pos: verb
    praesens_3sg: beschränkt
    partizip2: beschränkt
    aux: haben
    valence: "+ Akk auf + Akk"
    # Recognition only: notice-and-terms register — the participle beschränkt on a
    # sign or an offer is what the learner actually meets.
    cards: recognition
    en: to limit, to restrict
    ru: ограничивать
    uk: обмежувати
    example_de: Das Angebot ist auf zwei Stück pro Kunde beschränkt.
    example_en: The offer is limited to two items per customer.
    example_ru: Предложение ограничено двумя штуками на покупателя.
    example_uk: Пропозиція обмежена двома штуками на покупця.
    note:
      en: 'Regular, inseparable: beschränkt, hat beschränkt. The limit takes auf + Akkusativ. You meet it as a participle on shop signs and in terms and conditions, and sich beschränken auf means to keep yourself to something. The related adjective begrenzt says the same in one word.'
      ru: 'Правильный глагол, неотделяемый: beschränkt, hat beschränkt. Граница вводится через auf + Akkusativ. Встречается прежде всего как причастие на магазинных табличках и в условиях, а sich beschränken auf значит «ограничиться чем-то». Родственное прилагательное begrenzt говорит то же одним словом.'
      uk: 'Правильне дієслово, невідокремлюване: beschränkt, hat beschränkt. Межа вводиться через auf + Akkusativ. Трапляється передусім як дієприкметник на крамничних табличках і в умовах, а sich beschränken auf означає «обмежитися чимось». Споріднений прикметник begrenzt каже те саме одним словом.'

  - de: aufhalten
    ipa: "ˈaʊ̯fˌhaltn̩"
    pos: verb
    praesens_3sg: hält auf
    partizip2: aufgehalten
    aux: haben
    valence: "+ Akk / sich"
    # Recognition only: to hold someone up and sich aufhalten (to stay somewhere) are
    # two unrelated prompts, and the second one is formal to boot.
    cards: recognition
    en: to hold up, to delay (someone); to stay
    en_compact: to hold up; to stay
    ru: задерживать (кого-то); находиться, пребывать
    uk: затримувати (когось); перебувати
    example_de: Ich will Sie nicht länger aufhalten.
    example_en: I do not want to keep you any longer.
    example_ru: Не буду вас больше задерживать.
    example_uk: Не буду вас більше затримувати.
    note:
      en: 'Strong verb, separable: hält auf, hat aufgehalten. The sentence in the example is the standard way to end a conversation politely. With sich it means to be somewhere for a time — sich in Deutschland aufhalten — and der Aufenthalt is the stay itself, the word on a residence permit.'
      ru: 'Сильный глагол, отделяемый: hält auf, hat aufgehalten. Фраза из примера — стандартный способ вежливо завершить разговор. С sich значит «находиться, пребывать»: sich in Deutschland aufhalten, а der Aufenthalt — само пребывание, слово из вида на жительство.'
      uk: 'Сильне дієслово, відокремлюване: hält auf, hat aufgehalten. Фраза з прикладу — стандартний спосіб увічливо завершити розмову. Із sich означає «перебувати»: sich in Deutschland aufhalten, а der Aufenthalt — саме перебування, слово з посвідки на проживання.'

  - de: zwingen
    ipa: "ˈtsvɪŋən"
    pos: verb
    praesens_3sg: zwingt
    partizip2: gezwungen
    aux: haben
    valence: "+ Akk zu + Dat"
    en: to force, to compel
    ru: заставлять, принуждать
    uk: змушувати, примушувати
    example_de: Niemand kann dich zwingen, den Vertrag zu unterschreiben.
    example_en: Nobody can force you to sign the contract.
    example_ru: Никто не может заставить тебя подписать договор.
    example_uk: Ніхто не може змусити тебе підписати договір.
    note:
      en: 'Strong verb: zwingt, zwang, hat gezwungen. The person forced is accusative and what they are forced into takes zu + Dativ or a zu-infinitive, as in the example. The participle also works as an adjective: Ich war gezwungen, abzusagen. Der Zwang is the compulsion.'
      ru: 'Сильный глагол: zwingt, zwang, hat gezwungen. Тот, кого принуждают, стоит в Akkusativ, а предмет принуждения вводится через zu + Dativ или инфинитив с zu, как в примере. Причастие работает и как прилагательное: Ich war gezwungen, abzusagen. Der Zwang — принуждение.'
      uk: 'Сильне дієслово: zwingt, zwang, hat gezwungen. Той, кого примушують, стоїть у Akkusativ, а предмет примусу вводиться через zu + Dativ або інфінітив із zu, як у прикладі. Дієприкметник працює й як прикметник: Ich war gezwungen, abzusagen. Der Zwang — примус.'

  - de: unterstützen
    ipa: "ʊntɐˈʃtʏtsn̩"
    pos: verb
    praesens_3sg: unterstützt
    partizip2: unterstützt
    aux: haben
    valence: "+ Akk"
    en: to support, to back
    ru: поддерживать (деньгами, участием)
    uk: підтримувати (грошима, участю)
    example_de: Meine Eltern haben mich während des Studiums finanziell unterstützt.
    example_en: My parents supported me financially during my studies.
    example_ru: Родители поддерживали меня во время учёбы деньгами.
    example_uk: Батьки підтримували мене під час навчання грошима.
    note:
      en: 'Regular, inseparable with no ge- and no separation: unterstützt, hat unterstützt. It covers money, help and agreement — a family, a programme, a proposal. Helfen takes the dative and a single act; this one takes the accusative and something ongoing. Die Unterstützung is the support, including state benefits.'
      ru: 'Правильный глагол, неотделяемый, без ge-: unterstützt, hat unterstützt. Покрывает и деньги, и помощь, и согласие: семья, программа, предложение. Helfen требует Dativ и обычно единичного действия; этот глагол требует Akkusativ и чего-то длительного. Die Unterstützung — поддержка, в том числе государственная.'
      uk: 'Правильне дієслово, невідокремлюване, без ge-: unterstützt, hat unterstützt. Покриває і гроші, і допомогу, і згоду: сім’я, програма, пропозиція. Helfen вимагає Dativ і зазвичай одиничної дії; це дієслово вимагає Akkusativ і чогось тривалого. Die Unterstützung — підтримка, зокрема державна.'

  - de: behandeln
    ipa: "bəˈhandl̩n"
    pos: verb
    praesens_3sg: behandelt
    partizip2: behandelt
    aux: haben
    valence: "+ Akk"
    # Recognition only: three unrelated jobs — a doctor treats a patient, a person
    # treats another well or badly, and a text deals with a topic.
    cards: recognition
    en: to treat (a patient, a person); to deal with (a topic)
    en_compact: to treat; to deal with
    ru: лечить; обращаться с кем-то; рассматривать (тему)
    uk: лікувати; поводитися з кимось; розглядати (тему)
    example_de: Der Artikel behandelt die Frage der Mieten in Großstädten.
    example_en: The article deals with the question of rents in big cities.
    example_ru: Статья рассматривает вопрос аренды в больших городах.
    example_uk: Стаття розглядає питання оренди у великих містах.
    note:
      en: 'Regular, inseparable: behandelt, hat behandelt. Three senses, one form. A doctor treats an illness; a person treats another gut or schlecht; a text or a lesson deals with a subject. Die Behandlung is the medical treatment on an invoice, and der Umgang is the word for how people treat each other in general.'
      ru: 'Правильный глагол, неотделяемый: behandelt, hat behandelt. Три значения, одна форма. Врач лечит болезнь; человек обращается с другим gut или schlecht; текст или урок рассматривает тему. Die Behandlung — медицинская процедура в счёте, а der Umgang — слово о том, как люди обращаются друг с другом вообще.'
      uk: 'Правильне дієслово, невідокремлюване: behandelt, hat behandelt. Три значення, одна форма. Лікар лікує хворобу; людина поводиться з іншою gut або schlecht; текст чи урок розглядає тему. Die Behandlung — медична процедура в рахунку, а der Umgang — слово про те, як люди поводяться одне з одним загалом.'

  - de: vertreten
    ipa: "fɛɐ̯ˈtʁeːtn̩"
    pos: verb
    praesens_3sg: vertritt
    partizip2: vertreten
    aux: haben
    valence: "+ Akk"
    # Recognition only: standing in for a colleague, representing an organisation and
    # holding a view are three prompts, and sich den Fuß vertreten is a fourth.
    cards: recognition
    en: to stand in for; to represent
    ru: замещать (коллегу); представлять (организацию)
    uk: заміщати (колегу); представляти (організацію)
    example_de: Frau Weber vertritt mich, solange ich im Urlaub bin.
    example_en: Ms Weber is standing in for me while I am on holiday.
    example_ru: Госпожа Вебер замещает меня, пока я в отпуске.
    example_uk: Пані Вебер заміщає мене, поки я у відпустці.
    note:
      en: 'Strong verb, inseparable: vertritt, vertrat, hat vertreten. At work it is standing in for a colleague, in public life it is representing a company or a country, and eine Meinung vertreten is holding a view. Die Vertretung is the stand-in arrangement, and der Vertreter is both a representative and a sales rep.'
      ru: 'Сильный глагол, неотделяемый: vertritt, vertrat, hat vertreten. На работе — замещать коллегу, в общественной жизни — представлять фирму или страну, eine Meinung vertreten — придерживаться мнения. Die Vertretung — само замещение, а der Vertreter — и представитель, и торговый агент.'
      uk: 'Сильне дієслово, невідокремлюване: vertritt, vertrat, hat vertreten. На роботі — заміщати колегу, у суспільному житті — представляти фірму чи країну, eine Meinung vertreten — обстоювати думку. Die Vertretung — саме заміщення, а der Vertreter — і представник, і торговий агент.'

  # --- Sich ereignen, sich befinden ---
  - de: sich ereignen
    ipa: "zɪç ɛɐ̯ˈʔaɪ̯gnən"
    pos: verb
    praesens_3sg: ereignet sich
    partizip2: sich ereignet
    aux: haben
    # Recognition only: `passieren` and `vorkommen` both ship "to happen" as
    # production cards; this is the same prompt in the register of a news bulletin.
    cards: recognition
    en: to occur, to take place
    ru: происходить, случаться
    uk: відбуватися, ставатися
    example_de: Der Unfall ereignete sich kurz nach acht Uhr.
    example_en: The accident occurred shortly after eight o'clock.
    example_ru: Авария произошла вскоре после восьми.
    example_uk: Аварія сталася невдовзі по восьмій.
    note:
      en: 'Regular, always reflexive: ereignet sich, hat sich ereignet. Written news German, usually in the Präteritum as in the example — it is how a report begins. Speech says passieren. Das Ereignis is the event, and the two words are worth keeping together.'
      ru: 'Правильный глагол, всегда возвратный: ereignet sich, hat sich ereignet. Письменный язык новостей, обычно в Präteritum, как в примере, — так начинается сводка. Речь скажет passieren. Das Ereignis — событие; эти два слова стоит держать вместе.'
      uk: 'Правильне дієслово, завжди зворотне: ereignet sich, hat sich ereignet. Писемна мова новин, зазвичай у Präteritum, як у прикладі, — так починається зведення. Мовлення скаже passieren. Das Ereignis — подія; ці два слова варто тримати разом.'

  - de: sich befinden
    ipa: "zɪç bəˈfɪndn̩"
    pos: verb
    praesens_3sg: befindet sich
    partizip2: sich befunden
    aux: haben
    # Recognition only: signage and description register — the notice tells you where
    # something is. A learner says ist or liegt.
    cards: recognition
    en: to be located, to be situated
    ru: находиться, располагаться
    uk: перебувати, розташовуватися
    example_de: Der Notausgang befindet sich am Ende des Ganges.
    example_en: The emergency exit is at the end of the corridor.
    example_ru: Запасный выход находится в конце коридора.
    example_uk: Запасний вихід розташований у кінці коридору.
    note:
      en: 'Strong verb, always reflexive: befindet sich, befand sich, hat sich befunden. This is the sentence on a notice, in a hotel folder and in an announcement. Everyday German uses ist, liegt or steht. It also describes a state: Das Haus befindet sich in einem guten Zustand.'
      ru: 'Сильный глагол, всегда возвратный: befindet sich, befand sich, hat sich befunden. Это фраза с таблички, из гостиничной папки и из объявления. Обиходный немецкий скажет ist, liegt или steht. Глагол описывает и состояние: Das Haus befindet sich in einem guten Zustand.'
      uk: 'Сильне дієслово, завжди зворотне: befindet sich, befand sich, hat sich befunden. Це фраза з таблички, з готельної теки та з оголошення. Побутова німецька скаже ist, liegt або steht. Дієслово описує й стан: Das Haus befindet sich in einem guten Zustand.'
