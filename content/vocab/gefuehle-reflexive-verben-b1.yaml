      en: 'The phrase that keeps it alive is Kein Wunder, dass …, said whenever a result was obvious from the cause. Plural like the singular, no ending. It is the same stem as sich wundern above: the verb is the small everyday reaction, this noun is the large event. wunderbar and wunderschön use it as an intensifier and mean simply wonderful, while das Wunder itself stays literal — a miracle, a marvel, or the Wirtschaftswunder of the 1950s.'
      ru: 'Живым его держит оборот Kein Wunder, dass … — так говорят, когда следствие очевидно из причины. Множественное совпадает с единственным, без окончания. Корень тот же, что у sich wundern выше: глагол — мелкая обиходная реакция, а это существительное — крупное событие. wunderbar и wunderschön используют его как усилитель и значат просто «чудесный», тогда как само das Wunder остаётся буквальным: чудо, диво или das Wirtschaftswunder пятидесятых.'
      uk: 'Живим його тримає зворот Kein Wunder, dass … — так кажуть, коли наслідок очевидний із причини. Множина збігається з одниною, без закінчення. Корінь той самий, що в sich wundern вище: дієслово — дрібна побутова реакція, а цей іменник — велика подія. wunderbar і wunderschön використовують його як підсилювач і означають просто «чудовий», тоді як саме das Wunder лишається буквальним: диво або das Wirtschaftswunder п’ятдесятих.'

  # --- Schreck, Träne, Blick: was den Gefühlen anzusehen ist ---
  - de: Schreck
    ipa: "ˈʃʁɛk"
    pos: noun
    gender: m
    plural: "—"
    # Recognition only: `erschrecken` ("to get a fright, to be startled",
    # erfahrungen-erzaehlen) is the shipped production card for this moment, and A2
    # `Angst` owns the wider prompt.
    cards: recognition
    en: a sudden fright, a start
    ru: испуг, внезапный страх
    uk: переляк, раптовий страх
    example_de: Vor Schreck ließ sie die Tasse fallen.
    example_en: She dropped the cup in fright.
    example_ru: От испуга она уронила чашку.
    example_uk: З переляку вона впустила чашку.
    note:
      en: 'One short moment, not a state: it is the jolt at the instant something happens. The phrases are vor Schreck (out of fright, as a cause) and einen Schreck bekommen or kriegen. It has no ordinary plural. Angst is the lasting fear that comes before or after; this is only the jump. The verb erschrecken splits in two — intransitive strong (ich erschrecke, erschrak, bin erschrocken) for getting the fright, weak transitive (Du hast mich erschreckt) for giving one.'
      ru: 'Один короткий миг, а не состояние: это толчок в момент, когда что-то произошло. Обороты: vor Schreck («от испуга», как причина) и einen Schreck bekommen / kriegen. Обычного множественного числа нет. Angst — длящийся страх до или после, а это лишь вздрагивание. Глагол erschrecken раздваивается: непереходный сильный (ich erschrecke, erschrak, bin erschrocken) — «испугаться», слабый переходный (Du hast mich erschreckt) — «испугать».'
      uk: 'Одна коротка мить, а не стан: це поштовх у момент, коли щось сталося. Звороти: vor Schreck («з переляку», як причина) і einen Schreck bekommen / kriegen. Звичайної множини немає. Angst — тривалий страх до або після, а це лише здригання. Дієслово erschrecken роздвоюється: неперехідне сильне (ich erschrecke, erschrak, bin erschrocken) — «злякатися», слабке перехідне (Du hast mich erschreckt) — «налякати».'

  - de: Schrecken
    ipa: "ˈʃʁɛkn̩"
    pos: noun
    gender: m
    plural: "die Schrecken"
