    note:
      en: 'Two jobs from one word, and the second has almost swallowed the first. Literally it means insane (der Wahnsinn is madness), but nine times in ten it stands before an adjective or a quantity as a pure intensifier: wahnsinnig teuer, wahnsinnig nett, wahnsinnig viel. In that job it is spoken, emphatic and slightly worn, like English incredibly. Wahnsinn! on its own is an exclamation of amazement. charakter-verhalten-b1 verrückt is the everyday word for the literal sense.'
      ru: 'Две работы у одного слова, и вторая почти поглотила первую. Буквально значит «безумный» (der Wahnsinn — «безумие»), но в девяти случаях из десяти стоит перед прилагательным или количеством как чистый усилитель: wahnsinnig teuer, wahnsinnig nett, wahnsinnig viel. В этой роли оно разговорное, эмфатическое и слегка затёртое. Wahnsinn! само по себе — восклицание изумления. verrückt из колоды charakter-verhalten-b1 — обиходное слово для буквального значения.'
