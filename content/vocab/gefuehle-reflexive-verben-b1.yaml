      ru: 'Слабое существительное (n-Deklination): во всех падежах, кроме именительного единственного, добавляется -n, а в родительном -ns: des Gedankens, dem Gedanken, den Gedanken. Оборот, который стоит выучить рядом с Sorgen, — sich Gedanken machen über etwas, «всерьёз задуматься о чём-либо», спокойный родственник тревоги. Предлог для предмета мысли — an + Akkusativ: der Gedanke an die Prüfung. Gedankenlos — «бездумный, невнимательный», а in Gedanken sein — «быть погружённым в мысли».'
