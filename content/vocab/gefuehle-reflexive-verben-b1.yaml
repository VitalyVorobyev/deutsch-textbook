    # `kein Wunder`, and the noun otherwise belongs to fairy tales and news
    # headlines — comprehension lexis rather than something a B1 learner says.
    cards: recognition
    en: miracle, something no one can explain
    ru: чудо
    uk: диво
    example_de: Kein Wunder, dass er müde ist — er hat die ganze Nacht gearbeitet.
    example_en: No wonder he is tired — he worked all night.
    example_ru: Неудивительно, что он устал — он работал всю ночь.
    example_uk: Не дивно, що він утомився — він працював цілу ніч.
