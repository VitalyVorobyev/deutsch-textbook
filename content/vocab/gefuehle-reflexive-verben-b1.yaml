    gender: f
    plural: "die Freuden"
    en: joy, delight
    ru: радость
    uk: радість
    example_de: Die Kinder machten der Großmutter mit dem Bild eine große Freude.
    example_en: The children gave their grandmother great delight with the picture.
    example_ru: Дети очень порадовали бабушку этим рисунком.
    example_uk: Діти дуже втішили бабусю цим малюнком.
    note:
      en: 'The noun behind sich freuen, and it lives in chunks: jemandem eine Freude machen (to give somebody pleasure), Freude an etwas haben (to enjoy doing something, with an + Dativ), mit Freude and vor Freude. The plural die Freuden is rare and literary. Two neighbours divide the field — A2 Glück is luck as well as happiness and is about a state, Spaß is the fun of an activity, and this one is the warm feeling itself. Viel Freude! is a slightly formal Have fun!, where speech says Viel Spaß!'
