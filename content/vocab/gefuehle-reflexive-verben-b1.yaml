  - de: befreit
    ipa: "bəˈfʁaɪ̯t"
    pos: adj
    # Recognition only: two readings behind one form — the feeling of release and the
    # official exemption — and a one-word prompt cannot say which. What a learner
    # produces for the feeling is `erleichtert` or `froh` (A2).
    cards: recognition
    en: released from a burden; exempt from an obligation
    ru: освобождённый (от груза, от обязанности)
    uk: звільнений (від тягаря, від обов’язку)
    example_de: Nach dem Gespräch fühlte sie sich befreit.
    example_en: After the conversation she felt as if a weight had been lifted.
    example_ru: После разговора у неё словно камень с души упал.
    example_uk: Після розмови їй наче камінь із душі спав.
    note:
      en: 'The participle of befreien, and both of its readings are common. As a feeling it is the moment a weight lifts — sich befreit fühlen — and it sits one step beyond erleichtert. As an official word it means exempt, always with von + Dativ: vom Unterricht befreit, von der Gebühr befreit, and a doctor''s note is what gets you there. The noun die Befreiung covers liberation in history books as well as exemption on a form.'
      ru: 'Причастие от befreien, и оба его чтения обиходны. Как чувство это миг, когда груз спадает, — sich befreit fühlen, — и стоит оно на ступень дальше, чем erleichtert. Как официальное слово значит «освобождённый от», всегда с von + Dativ: vom Unterricht befreit, von der Gebühr befreit, и добывается это справкой от врача. Существительное die Befreiung покрывает и «освобождение» в учебнике истории, и «освобождение от» в анкете.'
      uk: 'Дієприкметник від befreien, і обидва його прочитання побутові. Як почуття це мить, коли тягар спадає, — sich befreit fühlen, — і стоїть воно на щабель далі, ніж erleichtert. Як офіційне слово означає «звільнений від», завжди з von + Dativ: vom Unterricht befreit, von der Gebühr befreit, і здобувається це довідкою від лікаря. Іменник die Befreiung покриває і «визволення» в підручнику історії, і «звільнення від» в анкеті.'

  - de: entschlossen
    ipa: "ɛntˈʃlɔsn̩"
    pos: adj
    # Recognition only: `sicher` (bewertung-a2) and `sich entscheiden` (infinitiv-mit-zu)
    # are the shipped production cards near this prompt, and the everyday rendering is
    # `fest entschieden` — a typed card would grade which of the two participles was
    # wanted.
    cards: recognition
    en: determined, having made up one's mind
    ru: решительный, твёрдо решивший
    uk: рішучий, який твердо вирішив
    example_de: Sie war fest entschlossen, den Kurs zu Ende zu machen.
    example_en: She was firmly determined to finish the course.
    example_ru: Она была твёрдо намерена доучиться до конца курса.
    example_uk: Вона була твердо налаштована доучитися до кінця курсу.
    note:
      en: 'The participle of sich entschließen, and it describes a decision already taken and now visible in how somebody acts. The chunk is fest entschlossen sein, etwas zu tun. Two relatives divide the field and are easy to mix up: sich entscheiden is choosing between options, sich entschließen is resolving to act, and die Entscheidung is the choice while der Entschluss is the resolve. The negative is unentschlossen, undecided, which a text will use about a voter.'
      ru: 'Причастие от sich entschließen, и описывает оно решение уже принятое и видное в поведении. Оборот — fest entschlossen sein, etwas zu tun. Два родственника делят поле, и их легко спутать: sich entscheiden — выбирать между вариантами, sich entschließen — решиться действовать, а die Entscheidung — выбор, тогда как der Entschluss — решимость. Отрицание — unentschlossen, «нерешительный», и текст употребит его про избирателя.'
      uk: 'Дієприкметник від sich entschließen, і описує він рішення вже ухвалене й видне в поведінці. Зворот — fest entschlossen sein, etwas zu tun. Два родичі ділять поле, і їх легко сплутати: sich entscheiden — обирати між варіантами, sich entschließen — зважитися діяти, а die Entscheidung — вибір, тоді як der Entschluss — рішучість. Заперечення — unentschlossen, «нерішучий», і текст ужиє його про виборця.'

  - de: schuld
    ipa: "ˈʃʊlt"
    pos: adj
    # Recognition only: `schuldig` ("guilty; owing (money)") ships as a production card
    # in charakter-verhalten-b1, and the two differ by one suffix and one syntax rule —
    # a typed prompt would grade which of them the author had in mind.
    cards: recognition
    en: to blame, responsible for something bad
    ru: виноватый, виновный (в чём-либо)
    uk: винний, винуватий (у чомусь)
    example_de: Niemand ist schuld an dem Unfall, die Straße war einfach zu glatt.
    example_en: Nobody is to blame for the accident, the road was simply too slippery.
    example_ru: Никто не виноват в аварии — дорога была просто слишком скользкой.
    example_uk: Ніхто не винен в аварії — дорога була просто надто слизька.
    note:
      en: 'Written small and never before a noun: it only ever stands after sein or werden, and the thing you are to blame for takes an + Dativ. Its neighbour schuldig behaves like a normal adjective, takes endings, and covers both a court verdict (schuldig sprechen) and money owed (Ich bin dir zehn Euro schuldig). The noun die Schuld is guilt and, in the plural die Schulden, debts — one word doing both jobs, which is a genuine feature of German rather than a coincidence.'
      ru: 'Пишется со строчной и никогда не стоит перед существительным: только после sein или werden, а то, в чём виноваты, идёт с an + Dativ. Сосед schuldig ведёт себя как обычное прилагательное, получает окончания и покрывает и приговор суда (schuldig sprechen), и денежный долг (Ich bin dir zehn Euro schuldig). Существительное die Schuld — «вина», а во множественном die Schulden — «долги»: одно слово на обе работы, и это настоящая особенность немецкого, а не случайность.'
      uk: 'Пишеться з малої і ніколи не стоїть перед іменником: лише після sein або werden, а те, у чому винні, іде з an + Dativ. Сусід schuldig поводиться як звичайний прикметник, отримує закінчення й покриває і вирок суду (schuldig sprechen), і грошовий борг (Ich bin dir zehn Euro schuldig). Іменник die Schuld — «провина», а в множині die Schulden — «борги»: одне слово на обидві роботи, і це справжня особливість німецької, а не випадковість.'
