      uk: 'Іменник за дієсловом sich freuen, і живе він у зворотах: jemandem eine Freude machen («потішити когось»), Freude an etwas haben («мати втіху з чогось», з an + Dativ), mit Freude і vor Freude. Множина die Freuden рідкісна й книжна. Поле ділять два сусіди: Glück рівня A2 — це і щастя як стан, і удача, Spaß — веселощі від заняття, а це слово — саме тепле почуття. Viel Freude! — трохи офіційніше «приємно провести час», де мовлення скаже Viel Spaß!'

  - de: Sorge
    ipa: "ˈzɔʁgə"
    pos: noun
