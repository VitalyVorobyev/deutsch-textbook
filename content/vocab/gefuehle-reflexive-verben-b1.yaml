      en: 'The -nis suffix builds neuter nouns from adjectives and verbs, and it doubles the s in the plural: Geheimnisse, like Ereignisse and Erlebnisse. The verbs around it are ein Geheimnis haben, bewahren (to keep) and verraten (to give away, in the verben-kommunikation-ausdruck-b1 deck). Two adjectives that look related are not the same: geheim describes a thing that is classified, heimlich describes an action done on the quiet, and only the second one fits Er hat heimlich geraucht.'
      ru: 'Суффикс -nis строит существительные среднего рода от прилагательных и глаголов и удваивает s во множественном числе: Geheimnisse, как Ereignisse и Erlebnisse. Глаголы вокруг: ein Geheimnis haben, bewahren («хранить») и verraten («выдать», в колоде verben-kommunikation-ausdruck-b1). Два похожих прилагательных — не одно и то же: geheim описывает вещь как засекреченную, heimlich — действие, сделанное украдкой, и только второе подходит к Er hat heimlich geraucht.'
      uk: 'Суфікс -nis будує іменники середнього роду від прикметників і дієслів і подвоює s у множині: Geheimnisse, як Ereignisse та Erlebnisse. Дієслова навколо: ein Geheimnis haben, bewahren («берегти») і verraten («виказати», у колоді verben-kommunikation-ausdruck-b1). Два схожі прикметники — не одне й те саме: geheim описує річ як засекречену, heimlich — дію, зроблену потайки, і лише друге пасує до Er hat heimlich geraucht.'

