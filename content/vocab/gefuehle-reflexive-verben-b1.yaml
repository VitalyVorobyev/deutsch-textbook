    cards: recognition
    en: tear
    ru: слеза
    uk: сльоза
    example_de: Sie hatte Tränen in den Augen, als sie die Geschichte erzählte.
    example_en: She had tears in her eyes as she told the story.
    example_ru: У неё были слёзы на глазах, когда она рассказывала эту историю.
    example_uk: У неї були сльози на очах, коли вона розповідала цю історію.
    note:
      en: 'Nearly always plural in the living phrases: Tränen in den Augen haben, in Tränen ausbrechen (to burst into tears), unter Tränen. German cries the verb and shows the noun, so weinen carries the action and this word the picture. Do not confuse it with trennen, to separate, which differs by one letter and one vowel length. The compound das Tränengas is tear gas, and zu Tränen rührend means moving to the point of tears.'
      ru: 'В живых оборотах почти всегда множественное число: Tränen in den Augen haben, in Tränen ausbrechen («расплакаться»), unter Tränen. Немецкий «плачет» глаголом и «показывает» существительным: действие несёт weinen, а картинку — это слово. Не путать с trennen («разделять»): разница в одной букве и в долготе гласного. Составное das Tränengas — «слезоточивый газ», а zu Tränen rührend — «трогательный до слёз».'
      uk: 'У живих зворотах майже завжди множина: Tränen in den Augen haben, in Tränen ausbrechen («розплакатися»), unter Tränen. Німецька «плаче» дієсловом і «показує» іменником: дію несе weinen, а картинку — це слово. Не плутати з trennen («розділяти»): різниця в одній літері й у довготі голосного. Складне das Tränengas — «сльозогінний газ», а zu Tränen rührend — «зворушливий до сліз».'

  - de: Nerv
    ipa: "ˈnɛʁf"
    pos: noun
    gender: m
    plural: "die Nerven"
    # Recognition only: A2 ships `nervös` ("nervous, edgy", gefuehle-reflexive-a2) as a
    # production card, and the only thing a learner needs to produce here is the fixed
    # phrase `auf die Nerven gehen`, which no single-word prompt can ask for.
    cards: recognition
    en: nerve; composure when things get hard
    ru: нерв; выдержка, самообладание
    uk: нерв; витримка, самовладання
    example_de: Der Lärm von der Baustelle geht mir auf die Nerven.
    example_en: The noise from the building site is getting on my nerves.
    example_ru: Шум со стройки действует мне на нервы.
    example_uk: Шум із будівництва діє мені на нерви.
    note:
      en: 'The plural is die Nerven with -en, not -e, and it is the plural that does almost all the work: jemandem auf die Nerven gehen, die Nerven verlieren (to lose one''s composure), Nerven behalten, and the flat complaint Du nervst! from the verb nerven. The singular stays medical, as in der Zahnnerv. Note the pronunciation — the v is spoken f, which is unusual for a word this Latin-looking, and the adjective nervös keeps a v spoken as v.'
      ru: 'Множественное — die Nerven на -en, а не на -e, и именно оно делает почти всю работу: jemandem auf die Nerven gehen, die Nerven verlieren («потерять самообладание»), Nerven behalten и резкое Du nervst! от глагола nerven. Единственное остаётся медицинским, как в der Zahnnerv. Обратите внимание на произношение: v звучит как f, что необычно для слова с такой латинской внешностью, а в прилагательном nervös v остаётся звонким.'
      uk: 'Множина — die Nerven на -en, а не на -e, і саме вона робить майже всю роботу: jemandem auf die Nerven gehen, die Nerven verlieren («втратити самовладання»), Nerven behalten і різке Du nervst! від дієслова nerven. Однина лишається медичною, як у der Zahnnerv. Зверніть увагу на вимову: v звучить як f, що незвично для слова з такою латинською зовнішністю, а в прикметнику nervös v лишається дзвінким.'

  - de: Blick
    ipa: "ˈblɪk"
    pos: noun
    gender: m
    plural: "die Blicke"
    # Recognition only: A1 `sehen` and `schauen` (verben-grundwortschatz) are the
    # shipped production cards for looking, and this noun lives in fixed phrases whose
    # preposition a one-word prompt cannot ask for.
    cards: recognition
    en: a look on somebody's face; a view from a place
    ru: взгляд; вид (из окна, с места)
    uk: погляд; краєвид (з вікна, з місця)
    example_de: Vom Balkon hat man einen schönen Blick auf die Berge.
    example_en: From the balcony you have a lovely view of the mountains.
    example_ru: С балкона открывается красивый вид на горы.
    example_uk: З балкона відкривається гарний краєвид на гори.
    note:
      en: 'Two senses, one word. Of a person it is the expression in the eyes — ein böser Blick, jemandem einen Blick zuwerfen — and of a place it is what you can see from it, always with auf + Akkusativ. The chunks worth learning whole are auf den ersten Blick (at first sight), einen Blick werfen auf (to take a look at) and den Überblick behalten (to keep track). The verb blicken exists but is bookish; speech uses schauen, gucken and sehen.'
      ru: 'Два значения в одном слове. О человеке это выражение глаз — ein böser Blick, jemandem einen Blick zuwerfen, — а о месте это то, что оттуда видно, всегда с auf + Akkusativ. Обороты, которые стоит взять целиком: auf den ersten Blick («на первый взгляд»), einen Blick werfen auf («взглянуть на») и den Überblick behalten («не терять общей картины»). Глагол blicken существует, но книжен; речь берёт schauen, gucken и sehen.'
      uk: 'Два значення в одному слові. Про людину це вираз очей — ein böser Blick, jemandem einen Blick zuwerfen, — а про місце це те, що звідти видно, завжди з auf + Akkusativ. Звороти, які варто взяти цілими: auf den ersten Blick («на перший погляд»), einen Blick werfen auf («глянути на») і den Überblick behalten («не втрачати загальної картини»). Дієслово blicken існує, але книжне; мовлення бере schauen, gucken і sehen.'

  - de: blass
    ipa: "ˈblas"
    pos: adj
    # Recognition only: a describing word for a face in a story or at the doctor's;
    # what a learner produces about their own state is A2 `krank`, `müde` or
    # `schlecht` — all shipped production cards.
    cards: recognition
    en: pale, without colour in the face
    ru: бледный
    uk: блідий
    example_de: Du bist ganz blass, hast du schlecht geschlafen?
    example_en: You look quite pale, did you sleep badly?
    example_ru: Ты совсем бледный, плохо спал?
    example_uk: Ти зовсім блідий, погано спав?
    note:
      en: 'Chiefly about a face — blass werden is what fright or bad news does to somebody, and it is a standard line in a narrative. It also describes a washed-out colour (ein blasses Blau) and, figuratively, something with no character (eine blasse Erinnerung). It takes ordinary adjective endings. Two neighbours from other fields: bleich is the stronger, more literary word, and A2 hell describes light rather than the absence of colour.'
      ru: 'Прежде всего о лице: blass werden — это то, что делает с человеком испуг или дурная новость, и это стандартная строка в повествовании. Описывает и выцветший цвет (ein blasses Blau), и, переносно, нечто невыразительное (eine blasse Erinnerung). Получает обычные окончания прилагательного. Два соседа из других полей: bleich — сильнее и книжнее, а hell уровня A2 описывает свет, а не отсутствие цвета.'
      uk: 'Насамперед про обличчя: blass werden — це те, що робить із людиною переляк чи погана новина, і це стандартний рядок в оповіді. Описує й вицвілий колір (ein blasses Blau) і, переносно, щось невиразне (eine blasse Erinnerung). Отримує звичайні закінчення прикметника. Два сусіди з інших полів: bleich — сильніше й книжніше, а hell рівня A2 описує світло, а не відсутність кольору.'

  - de: winken
    ipa: "ˈvɪŋkn̩"
    pos: verb
    praesens_3sg: winkt
    partizip2: gewinkt
    aux: haben
    # Recognition only: narrative lexis — you read it in a story about somebody
    # leaving. What a B1 learner produces at the same moment is `Tschüs sagen` or
    # A1 `grüßen`.
    cards: recognition
    en: to wave, to greet or signal with the hand
    ru: махать рукой, подавать знак
    uk: махати рукою, подавати знак
    example_de: Die Großeltern winkten, bis der Zug nicht mehr zu sehen war.
    example_en: The grandparents waved until the train was out of sight.
    example_ru: Бабушка с дедушкой махали, пока поезд не скрылся из виду.
    example_uk: Дідусь із бабусею махали, доки потяг не зник з очей.
    note:
      en: 'The person waved at goes in the dative (Er winkte mir), and the standard scenes are a departure at a station and a taxi being flagged down (ein Taxi herbeiwinken). The participle is gewinkt in careful German, although you will hear gewunken in the south and in speech. A second, figurative use turns up in headlines: Dem Sieger winkt ein Preis, a prize awaits the winner. The related noun der Wink is a hint, as in ein Wink mit dem Zaunpfahl for a very unsubtle one.'
      ru: 'Тот, кому машут, стоит в Dativ (Er winkte mir), а типичные сцены — проводы на вокзале и подзываемое такси (ein Taxi herbeiwinken). Причастие в аккуратном немецком — gewinkt, хотя на юге и в речи слышится gewunken. Второе, переносное употребление встречается в заголовках: Dem Sieger winkt ein Preis — «победителя ждёт приз». Родственное существительное der Wink — «намёк», как в ein Wink mit dem Zaunpfahl о намёке весьма прозрачном.'
      uk: 'Той, кому махають, стоїть у Dativ (Er winkte mir), а типові сцени — проводи на вокзалі й таксі, яке підкликають (ein Taxi herbeiwinken). Дієприкметник в акуратній німецькій — gewinkt, хоча на півдні та в мовленні чути gewunken. Друге, переносне вживання трапляється в заголовках: Dem Sieger winkt ein Preis — «переможця чекає приз». Споріднений іменник der Wink — «натяк», як у ein Wink mit dem Zaunpfahl про натяк вельми прозорий.'

  # --- Zustände: von erschöpft bis entschlossen ---
  - de: Erholung
    ipa: "ɛɐ̯ˈhoːlʊŋ"
    pos: noun
    gender: f
    plural: "—"
    # Recognition only: A2 `sich ausruhen` (gesundheit-arzttermin) and `Urlaub` are the
    # shipped production cards for resting — this noun belongs to a doctor's note or a
    # holiday brochure.
    cards: recognition
    en: rest, recovery of strength
    ru: отдых, восстановление сил
    uk: відпочинок, відновлення сил
    example_de: Nach der langen Krankheit braucht sie vor allem Erholung.
    example_en: After the long illness she above all needs rest.
    example_ru: После долгой болезни ей прежде всего нужен отдых.
    example_uk: Після тривалої хвороби їй передусім потрібен відпочинок.
    note:
      en: 'No plural. It is the noun of sich erholen, and it means getting your strength back rather than simply not working — which is why a doctor writes it and a brochure advertises it: Erholung suchen, zur Erholung fahren, das Erholungsgebiet. A2 die Pause is the short break inside a working day, der Urlaub is the leave from work, and die Ruhe is quiet. The adjective erholsam describes a holiday or a night that did the job.'
      ru: 'Множественного числа нет. Это существительное от sich erholen, и значит оно «восстановиться», а не просто «не работать» — потому его и пишет врач, и рекламирует буклет: Erholung suchen, zur Erholung fahren, das Erholungsgebiet. die Pause уровня A2 — короткий перерыв внутри рабочего дня, der Urlaub — отпуск, а die Ruhe — тишина и покой. Прилагательное erholsam описывает отпуск или ночь, которые своё дело сделали.'
      uk: 'Множини немає. Це іменник від sich erholen, і означає він «відновитися», а не просто «не працювати» — тому його й пише лікар, і рекламує буклет: Erholung suchen, zur Erholung fahren, das Erholungsgebiet. die Pause рівня A2 — коротка перерва всередині робочого дня, der Urlaub — відпустка, а die Ruhe — тиша й спокій. Прикметник erholsam описує відпустку або ніч, які своє діло зробили.'

  - de: entspannend
    ipa: "ɛntˈʃpanənt"
    pos: adj
    # Recognition only: it is the present participle of `sich entspannen`, and what a
    # learner produces is either that verb or A1 `ruhig` — a one-word prompt cannot
    # ask for the participle rather than the verb.
    cards: recognition
    en: relaxing, doing you good after effort
    ru: расслабляющий, успокаивающий
    uk: розслабливий, заспокійливий
    example_de: Ein Spaziergang am Abend ist für mich sehr entspannend.
    example_en: A walk in the evening is very relaxing for me.
    example_ru: Вечерняя прогулка для меня очень расслабляет.
    example_uk: Вечірня прогулянка для мене дуже розслаблює.
    note:
      en: 'A present participle used as an adjective — infinitive plus -d — which is a small German pattern worth naming: entspannen gives entspannend, anstrengen gives anstrengend, and the two are opposites. It describes what the activity does to you. Careful with its passive twin: entspannt with -t is how the person feels or acts (Er wirkt entspannt), while this -d form is what causes the feeling. It takes ordinary endings before a noun: ein entspannender Abend.'
      ru: 'Причастие настоящего времени в роли прилагательного — инфинитив плюс -d, — и это маленькая немецкая модель, которую стоит назвать: entspannen даёт entspannend, anstrengen даёт anstrengend, и они противоположны. Описывает то, что занятие делает с вами. Осторожно с его пассивным двойником: entspannt на -t — о том, как человек себя чувствует или держится (Er wirkt entspannt), тогда как форма на -d называет причину чувства. Перед существительным получает обычные окончания: ein entspannender Abend.'
      uk: 'Дієприкметник теперішнього часу в ролі прикметника — інфінітив плюс -d, — і це невелика німецька модель, яку варто назвати: entspannen дає entspannend, anstrengen дає anstrengend, і вони протилежні. Описує те, що заняття робить із вами. Обережно з його пасивним двійником: entspannt на -t — про те, як людина почувається чи тримається (Er wirkt entspannt), тоді як форма на -d називає причину почуття. Перед іменником отримує звичайні закінчення: ein entspannender Abend.'

  - de: erschöpft
    ipa: "ɛɐ̯ˈʃœpft"
    pos: adj
    # Recognition only: A2 ships `müde` ("tired", kernwortschatz-a2) as a production
    # card, and `total müde` is what a B1 learner actually says for this state.
    cards: recognition
    en: exhausted, with no strength left
    ru: изнурённый, обессиленный
    uk: виснажений, знесилений
    example_de: Nach der Prüfung waren alle völlig erschöpft.
    example_en: After the exam everybody was completely exhausted.
    example_ru: После экзамена все были совершенно измотаны.
    example_uk: Після іспиту всі були геть виснажені.
    note:
      en: 'A step beyond müde: tired can be slept off, this cannot, so it goes with völlig, total and ganz rather than with sehr. It is the participle of erschöpfen, to use something up, and the same verb is why a supply can be erschöpft too — die Vorräte sind erschöpft. The noun die Erschöpfung turns up in medical German. A near neighbour with a different tone is kaputt, which speech uses for the same feeling far more casually.'
      ru: 'Ступень за müde: усталость можно отоспать, а это нет, поэтому слово идёт с völlig, total и ganz, а не с sehr. Это причастие от erschöpfen — «исчерпать», и тот же глагол объясняет, почему исчерпаться могут и запасы: die Vorräte sind erschöpft. Существительное die Erschöpfung встречается в медицинском немецком. Близкий сосед с другим тоном — kaputt, которым речь описывает то же состояние куда небрежнее.'
      uk: 'Щабель за müde: утому можна відіспати, а це ні, тому слово йде з völlig, total і ganz, а не з sehr. Це дієприкметник від erschöpfen — «вичерпати», і те саме дієслово пояснює, чому вичерпатися можуть і запаси: die Vorräte sind erschöpft. Іменник die Erschöpfung трапляється в медичній німецькій. Близький сусід з іншим тоном — kaputt, яким мовлення описує той самий стан значно недбаліше.'

  - de: betrunken
    ipa: "bəˈtʁʊŋkn̩"
    pos: adj
    # Recognition only: comprehension lexis — you read it in a report or a news item.
    # A1 `trinken` and the chunk `zu viel getrunken haben` are what a learner says.
    cards: recognition
    en: drunk, having had too much alcohol
    ru: пьяный
    uk: п’яний
    example_de: Wer betrunken ist, darf auf keinen Fall Auto fahren.
    example_en: Anybody who is drunk must on no account drive a car.
    example_ru: Тому, кто пьян, ни в коем случае нельзя садиться за руль.
    example_uk: Тому, хто п’яний, у жодному разі не можна сідати за кермо.
    note:
      en: 'Formally the participle of betrinken, but nobody uses that verb — the adjective stands on its own, and the everyday paraphrase is zu viel getrunken haben. Register matters here: this is the neutral word, blau is the casual one, and alkoholisiert is what a police report says. The opposite in traffic German is nüchtern, sober, which also means an empty stomach before a blood test.'
      ru: 'Формально это причастие от betrinken, но самим глаголом никто не пользуется — прилагательное стоит само по себе, а обиходный пересказ — zu viel getrunken haben. Регистр здесь важен: это нейтральное слово, blau — разговорное, а alkoholisiert пишут в полицейском протоколе. Противоположность в «дорожном» немецком — nüchtern («трезвый»), которое означает ещё и «натощак» перед анализом крови.'
      uk: 'Формально це дієприкметник від betrinken, але самим дієсловом ніхто не користується — прикметник стоїть сам по собі, а побутовий переказ — zu viel getrunken haben. Регістр тут важливий: це нейтральне слово, blau — розмовне, а alkoholisiert пишуть у поліцейському протоколі. Протилежність у «дорожній» німецькій — nüchtern («тверезий»), яке означає ще й «натще» перед аналізом крові.'

  - de: vergnügt
    ipa: "fɛɐ̯ˈgnyːkt"
    pos: adj
    # Recognition only: A2 ships `froh` ("glad, pleased") and `glücklich` ("happy") in
    # gefuehle-reflexive-a2 as production cards — the prompt is owned twice over, and
    # this word is the written register above both.
    cards: recognition
    en: cheerful, in good spirits
    ru: весёлый, в хорошем настроении
    uk: веселий, у доброму гуморі
    example_de: Vergnügt erzählte er vom Wochenende am See.
    example_en: In good spirits he told us about the weekend at the lake.
    example_ru: В прекрасном настроении он рассказывал о выходных на озере.
    example_uk: У чудовому гуморі він розповідав про вихідні на озері.
    note:
      en: 'The participle of the verb higher up in this deck, and it describes visible good humour rather than deep happiness — the sort you can see in somebody at a table. A2 froh is about being glad that something is so, glücklich is the deep and lasting one, and lustig describes what makes others laugh. It takes ordinary endings (ein vergnügter Abend) and works as an adverb without one, as in the example.'
      ru: 'Причастие от глагола выше в этой колоде, и описывает оно видимое хорошее расположение духа, а не глубокое счастье, — такое, какое заметно за столом. froh уровня A2 — о радости, что нечто именно так, glücklich — глубокое и длительное, а lustig описывает того, кто смешит других. Получает обычные окончания (ein vergnügter Abend) и работает как наречие без них, как в примере.'
      uk: 'Дієприкметник від дієслова вище в цій колоді, і описує він видимий добрий гумор, а не глибоке щастя, — такий, який помітно за столом. froh рівня A2 — про радість, що щось саме так, glücklich — глибоке й тривале, а lustig описує того, хто смішить інших. Отримує звичайні закінчення (ein vergnügter Abend) і працює як прислівник без них, як у прикладі.'

  - de: wahnsinnig
    ipa: "ˈvaːnˌzɪnɪç"
    pos: adj
