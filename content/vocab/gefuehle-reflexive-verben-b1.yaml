    example_uk: Не хвилюйся, я зателефоную, щойно приїду.
    note:
      en: 'Usually plural in the living phrases: sich Sorgen machen um jemanden is how German says to worry — with a dative pronoun and the noun in the plural — and Keine Sorge! is the reassurance. The singular turns up in written German for responsibility rather than anxiety: die Sorge für die Kinder, and the verb sorgen für means to see to something (Ich sorge für das Essen). One family, two directions: besorgt is worried, besorgen is to get hold of something, and die Fürsorge is welfare in the official sense.'
      ru: 'В живых оборотах обычно множественное число: sich Sorgen machen um jemanden — так немецкий говорит «волноваться», с местоимением в Dativ и существительным во множественном, — а Keine Sorge! — это «не беспокойтесь». Единственное число встречается в письменном языке и означает скорее ответственность, чем тревогу: die Sorge für die Kinder, а глагол sorgen für — «позаботиться о чём-либо» (Ich sorge für das Essen). Одна семья, два направления: besorgt — «встревоженный», besorgen — «раздобыть», а die Fürsorge — «социальная опека».'
      uk: 'У живих зворотах зазвичай множина: sich Sorgen machen um jemanden — так німецька каже «хвилюватися», із займенником у Dativ та іменником у множині, — а Keine Sorge! — це «не турбуйтеся». Однина трапляється в писемній мові й означає радше відповідальність, ніж тривогу: die Sorge für die Kinder, а дієслово sorgen für — «подбати про щось» (Ich sorge für das Essen). Одна родина, два напрямки: besorgt — «стривожений», besorgen — «роздобути», а die Fürsorge — «соціальна опіка».'

  - de: Gedanke
    ipa: "gəˈdaŋkə"
