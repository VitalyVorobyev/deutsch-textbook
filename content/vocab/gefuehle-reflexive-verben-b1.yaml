    # deck — one prompt cannot ask for both, and neither is a word a B1 learner
    # produces.
    cards: recognition
    en: horror, lasting terror
    ru: ужас, длительный страх
    uk: жах, тривалий страх
    example_de: Die Bilder aus dem Krieg zeigen den Schrecken dieser Jahre.
    example_en: The pictures from the war show the horror of those years.
    example_ru: Снимки с войны показывают ужас тех лет.
    example_uk: Світлини з війни показують жах тих років.
