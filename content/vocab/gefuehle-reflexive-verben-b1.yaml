      ru: 'Два значения, тянущие в разные стороны. Отвлечённо это противоположность Glück, невезение вообще: Unglück haben, im Unglück. Конкретно — крупное происшествие в новостях, больше, чем Unfall: das Zugunglück, das Grubenunglück. Обиходное слово о полосе неудач — Pech (So ein Pech!). Прилагательное unglücklich значит «несчастный, огорчённый», а unglücklicherweise — письменное «к несчастью».'
