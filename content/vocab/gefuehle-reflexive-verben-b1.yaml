      en: 'The long form of Schreck, and the extra syllable buys weight rather than length of time alone: reports and history books use it for horror on a large scale, and it takes a plural (die Schrecken des Krieges). In the fixed phrase mit Schrecken feststellen it is still the sudden kind. Everyday German gets by with Angst and Schreck, so treat this one as reading vocabulary. The adjective schrecklich has worn down completely and now means no more than terrible or awful in ordinary complaints.'
      ru: 'Длинная форма от Schreck, и лишний слог даёт вес, а не только длительность: отчёты и исторические книги употребляют его об ужасе большого масштаба, и множественное число у него есть (die Schrecken des Krieges). В устойчивом mit Schrecken feststellen речь всё ещё о внезапном. Обиходный немецкий обходится словами Angst и Schreck, так что это слово для чтения. Прилагательное schrecklich стёрлось совсем и в обычных жалобах значит не больше, чем «ужасный, кошмарный».'
      uk: 'Довга форма від Schreck, і зайвий склад дає вагу, а не лише тривалість: звіти та історичні книжки вживають його про жах великого масштабу, і множина в нього є (die Schrecken des Krieges). У сталому mit Schrecken feststellen ідеться все ще про раптове. Побутова німецька обходиться словами Angst і Schreck, тож це слово для читання. Прикметник schrecklich стерся зовсім і у звичайних скаргах означає не більше, ніж «жахливий, кошмарний».'

  - de: Träne
    ipa: "ˈtʁɛːnə"
    pos: noun
    gender: f
    plural: "die Tränen"
    # Recognition only: A1/A2 ships `weinen` ("to cry", verben-grundwortschatz) as a
