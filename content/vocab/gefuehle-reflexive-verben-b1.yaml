# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains two neighbouring
# fields of data/goethe-b1-wortliste.txt: the reflexive verbs whose pronoun is part
# of the verb rather than an object, and the words for what a person feels — the
# feeling itself, the state it leaves behind, and the face and body that show it.
id: gefuehle-reflexive-verben-b1
title_de: "Gefühle und reflexive Verben"
title_en: "Feelings and reflexive verbs"
title_ru: "Чувства и возвратные глаголы"
title_uk: "Почуття й зворотні дієслова"
level: B1
entries:
  # --- Echte reflexive Verben: das Pronomen gehört zum Verb ---
  - de: sich beeilen
    ipa: "zɪç bəˈʔaɪ̯lən"
    pos: verb
    praesens_3sg: beeilt sich
    partizip2: sich beeilt
    aux: haben
    valence: "sich + Akk"
    # Recognition only: A2 ships `beeilen` ("to hurry, to hurry up") as a production
    # card in gefuehle-reflexive-a2, with `sich beeilen` in its own accept list — the
    # typed prompt is answered one deck over, and this entry exists to key the
    # Wortliste's `sich beeilen` without dealing the same production card twice.
    cards: recognition
    en: to hurry up, to get a move on
    ru: торопиться, поторопиться
    uk: поспішати, поквапитися
    example_de: Beeil dich, der Bus fährt in fünf Minuten!
    example_en: Hurry up, the bus leaves in five minutes!
    example_ru: Поторопись, автобус отходит через пять минут!
    example_uk: Поквапся, автобус відходить за п’ять хвилин!
    note:
      en: 'A true reflexive: the pronoun is not an object, it is part of the verb, so there is no such thing as *ich beeile ohne mich*. The imperative is what you will hear most — Beeil dich! for one person, Beeilt euch! for several, Beeilen Sie sich! formally — and the pronoun moves with the person, never staying at sich. Two neighbours are not quite it: A2 es eilig haben states the fact (Ich habe es eilig), and schnell machen is the casual spoken order (Mach schnell!). The written twin eilen is in the zeit-b1 deck.'
      ru: 'Настоящий возвратный глагол: местоимение здесь не дополнение, а часть глагола, поэтому «ich beeile ohne mich» невозможно. Чаще всего вы услышите повелительное наклонение — Beeil dich! одному, Beeilt euch! нескольким, Beeilen Sie sich! вежливо, — и местоимение меняется по лицу, а не остаётся в форме sich. Два соседа не совсем то же: обиходное es eilig haben уровня A2 констатирует факт (Ich habe es eilig), а schnell machen — разговорный приказ (Mach schnell!). Письменный двойник eilen лежит в колоде zeit-b1.'
      uk: 'Справжнє зворотне дієслово: займенник тут не додаток, а частина дієслова, тому «ich beeile ohne mich» неможливе. Найчастіше ви почуєте наказовий спосіб — Beeil dich! одному, Beeilt euch! кільком, Beeilen Sie sich! ввічливо, — і займенник змінюється за особою, а не лишається у формі sich. Два сусіди не зовсім те саме: побутове es eilig haben рівня A2 констатує факт (Ich habe es eilig), а schnell machen — розмовний наказ (Mach schnell!). Писемний двійник eilen лежить у колоді zeit-b1.'

  - de: sich irren
    ipa: "zɪç ˈɪʁən"
    pos: verb
    praesens_3sg: irrt sich
    partizip2: sich geirrt
    aux: haben
    valence: "sich + Akk"
    accept: ["irren"]
    en: to be mistaken, to be wrong about something
    ru: ошибаться, заблуждаться
    uk: помилятися, хибити
    example_de: Wenn ich mich nicht irre, wohnt sie jetzt in Leipzig.
    example_en: If I am not mistaken, she lives in Leipzig now.
    example_ru: Если я не ошибаюсь, она теперь живёт в Лейпциге.
    example_uk: Якщо я не помиляюся, вона тепер живе в Лейпцигу.
    note:
      en: 'The polite way to be wrong. Two chunks carry it: Wenn ich mich nicht irre as a hedge before a claim, and Ich habe mich geirrt as a plain admission afterwards. It is about a judgement, not an action — a wrong turning is sich verlaufen, a slip of the hand is a Fehler machen. The written phrase Irren ist menschlich uses the bare infinitive as a noun, which is the one place the pronoun disappears. The noun is der Irrtum.'
      ru: 'Вежливый способ ошибиться. Держится на двух оборотах: Wenn ich mich nicht irre как оговорка перед утверждением и Ich habe mich geirrt как признание после. Речь о суждении, а не о действии: не туда свернуть — это sich verlaufen, промахнуться рукой — einen Fehler machen. В книжной фразе Irren ist menschlich инфинитив стоит как существительное, и это единственное место, где местоимение исчезает. Существительное — der Irrtum.'
      uk: 'Ввічливий спосіб помилитися. Тримається на двох зворотах: Wenn ich mich nicht irre як застереження перед твердженням і Ich habe mich geirrt як визнання після. Ідеться про судження, а не про дію: звернути не туди — це sich verlaufen, схибити рукою — einen Fehler machen. У книжній фразі Irren ist menschlich інфінітив стоїть як іменник, і це єдине місце, де займенник зникає. Іменник — der Irrtum.'

  - de: sich wundern
    ipa: "zɪç ˈvʊndɐn"
    pos: verb
    praesens_3sg: wundert sich
    partizip2: sich gewundert
    aux: haben
    valence: "sich + Akk; über + Akk"
    accept: ["wundern"]
    en: to find something odd, to be taken aback by it
    ru: удивляться, недоумевать
    uk: дивуватися, не розуміти
    example_de: Ich habe mich gewundert, dass er so früh gegangen ist.
    example_en: I found it odd that he left so early.
    example_ru: Меня удивило, что он ушёл так рано.
    example_uk: Мене здивувало, що він пішов так рано.
    note:
      en: 'The preposition is über + Akkusativ (Ich wundere mich über seine Antwort), and a dass-clause takes its place just as often. It is quieter than it looks: the feeling is puzzlement, sometimes with a note of disapproval, not delight. That is what separates it from überraschen, which is what an event does to a person (Die Nachricht hat mich überrascht) and needs no pronoun. Es würde mich wundern, wenn … is the standard way of saying you doubt something. Ich wundere mich über nichts mehr is the everyday shrug.'
      ru: 'Предлог — über + Akkusativ (Ich wundere mich über seine Antwort), и придаточное с dass встречается не реже. Чувство тише, чем кажется: это недоумение, иногда с оттенком неодобрения, а не радость. Этим оно и отличается от überraschen — то делает с человеком событие (Die Nachricht hat mich überrascht), и местоимение там не нужно. Es würde mich wundern, wenn … — стандартный способ выразить сомнение. Ich wundere mich über nichts mehr — обиходное «я уже ничему не удивляюсь».'
      uk: 'Прийменник — über + Akkusativ (Ich wundere mich über seine Antwort), і підрядне з dass трапляється не рідше. Почуття тихіше, ніж здається: це подив із відтінком нерозуміння, іноді й несхвалення, а не радість. Цим воно й відрізняється від überraschen — те робить із людиною подія (Die Nachricht hat mich überrascht), і займенник там не потрібен. Es würde mich wundern, wenn … — типовий спосіб висловити сумнів. Ich wundere mich über nichts mehr — побутове «я вже нічому не дивуюся».'

  - de: sich verlaufen
    ipa: "zɪç fɛɐ̯ˈlaʊ̯fn̩"
    pos: verb
    praesens_3sg: verläuft sich
    partizip2: sich verlaufen
    aux: haben
    valence: "sich + Akk"
    accept: ["verlaufen"]
    en: to lose one's way, to get lost while walking
    en_compact: "to get lost (on foot)"
    ru: заблудиться, сбиться с пути (пешком)
    uk: заблукати, збитися з дороги (пішки)
    example_de: Wir haben uns im Wald verlaufen und sind erst spät zurückgekommen.
    example_en: We got lost in the forest and only came back late.
    example_ru: Мы заблудились в лесу и вернулись только поздно.
    example_uk: Ми заблукали в лісі й повернулися лише пізно.
    note:
      en: 'Strictly on foot. The driver''s word is sich verfahren, and mixing them up is the standard slip — the ver- prefix marks both as going wrong, and laufen versus fahren decides which. Perfekt with haben, not sein, although it describes movement, because the reflexive pronoun is the accusative object: Ich habe mich verlaufen. Do not reach for verlieren here — that takes an object outside you (Ich habe den Schlüssel verloren), so *ich habe mich verloren* says something else entirely. A second, unrelated use is intransitive: Die Straße verläuft am Fluss entlang, the road runs along the river.'
      ru: 'Строго пешком. Слово водителя — sich verfahren, и путаница между ними — типичная ошибка: приставка ver- в обоих означает «сделать не так», а laufen против fahren решает, каким способом. Perfekt с haben, а не с sein, хотя речь о движении, — потому что возвратное местоимение здесь прямое дополнение: Ich habe mich verlaufen. Не берите сюда verlieren: у него дополнение вне вас (Ich habe den Schlüssel verloren), так что «ich habe mich verloren» значит совсем другое. Есть и второе, несвязанное употребление, непереходное: Die Straße verläuft am Fluss entlang — дорога идёт вдоль реки.'
      uk: 'Строго пішки. Слово водія — sich verfahren, і плутанина між ними — типова помилка: префікс ver- в обох означає «зробити не так», а laufen проти fahren вирішує, у який спосіб. Perfekt із haben, а не з sein, хоча йдеться про рух, — бо зворотний займенник тут прямий додаток: Ich habe mich verlaufen. Не беріть сюди verlieren: у нього додаток поза вами (Ich habe den Schlüssel verloren), тож «ich habe mich verloren» означає зовсім інше. Є й друге, непов’язане вживання, неперехідне: Die Straße verläuft am Fluss entlang — дорога йде вздовж річки.'

  - de: sich nähern
    ipa: "zɪç ˈnɛːɐn"
    pos: verb
    praesens_3sg: nähert sich
    partizip2: sich genähert
    aux: haben
    valence: "sich + Akk; + Dat"
    # Recognition only: narrative and report register. What a B1 learner produces for
    # the same movement is A1 `kommen` with a preposition (Er kommt näher, Wir kommen
    # dem Ziel näher) — this verb belongs to the sentence someone else wrote.
    cards: recognition
    en: to draw closer, to come nearer to something
    ru: приближаться, подходить ближе
    uk: наближатися, підходити ближче
    example_de: Das Gewitter nähert sich langsam der Stadt.
    example_en: The storm is slowly drawing closer to the town.
    example_ru: Гроза медленно приближается к городу.
    example_uk: Гроза поволі наближається до міста.
    note:
      en: 'Two objects in one sentence and they take different cases: the pronoun is accusative (mich, dich, sich) and the thing approached is a plain dative with no preposition — sich dem Haus nähern, sich dem Ende nähern. That bare dative is what makes it feel written; speech says näher kommen or einfach kommen. It works for time as well as space (Der Termin nähert sich) and for people meeting halfway (Die beiden Seiten haben sich genähert). The adjective behind it is nah, and the comparative näher is the everyday word.'
      ru: 'Два дополнения в одном предложении, и падежи у них разные: местоимение — Akkusativ (mich, dich, sich), а то, к чему приближаются, — чистый Dativ без предлога: sich dem Haus nähern, sich dem Ende nähern. Этот бесприлоговый Dativ и делает глагол книжным; речь скажет näher kommen или просто kommen. Работает и во времени, не только в пространстве (Der Termin nähert sich), и о людях, идущих навстречу друг другу (Die beiden Seiten haben sich genähert). За ним стоит прилагательное nah, а обиходное слово — сравнительная степень näher.'
      uk: 'Два додатки в одному реченні, і відмінки в них різні: займенник — Akkusativ (mich, dich, sich), а те, до чого наближаються, — чистий Dativ без прийменника: sich dem Haus nähern, sich dem Ende nähern. Цей безприйменниковий Dativ і робить дієслово книжним; мовлення скаже näher kommen або просто kommen. Працює і в часі, не лише в просторі (Der Termin nähert sich), і про людей, що йдуть назустріч одне одному (Die beiden Seiten haben sich genähert). За ним стоїть прикметник nah, а побутове слово — вищий ступінь näher.'

  - de: sich weigern
    ipa: "zɪç ˈvaɪ̯gɐn"
    pos: verb
    praesens_3sg: weigert sich
    partizip2: sich geweigert
    aux: haben
    valence: "sich + Akk; zu + Infinitiv"
    # Recognition only: `ablehnen` ("to turn down, to reject", regeln-verantwortung)
    # is the shipped production card for saying no, and `nicht wollen` covers the rest.
    cards: recognition
    en: to refuse flatly, to say one will not do it
    ru: отказываться, наотрез не соглашаться
    uk: відмовлятися, навідріз не погоджуватися
    example_de: Der Fahrer weigerte sich, ohne Fahrkarte weiterzufahren.
    example_en: The driver refused to drive on without a ticket.
    example_ru: Водитель отказался ехать дальше без билета.
    example_uk: Водій відмовився їхати далі без квитка.
    note:
      en: 'It is stronger than a polite no: the person has been asked and will not do it. The frame is almost always a zu-infinitive — sich weigern, etwas zu tun — and it is one of the few verbs at B1 that hardly ever appears without one. ablehnen takes a noun instead (einen Vorschlag ablehnen, eine Einladung ablehnen) and is the neutral word for turning something down. Newspapers use the noun die Weigerung; the everyday sentence is simply Er will nicht.'
      ru: 'Сильнее вежливого отказа: человека попросили, и он не станет этого делать. Конструкция почти всегда с zu-инфинитивом — sich weigern, etwas zu tun, — и это один из немногих глаголов уровня B1, который почти не встречается без него. У ablehnen дополнение существительное (einen Vorschlag ablehnen, eine Einladung ablehnen), и это нейтральное слово «отклонить». В газете встретится существительное die Weigerung; обиходное предложение — просто Er will nicht.'
      uk: 'Сильніше за ввічливу відмову: людину попросили, і вона цього не робитиме. Конструкція майже завжди з zu-інфінітивом — sich weigern, etwas zu tun, — і це одне з небагатьох дієслів рівня B1, яке майже не трапляється без нього. У ablehnen додаток — іменник (einen Vorschlag ablehnen, eine Einladung ablehnen), і це нейтральне слово «відхилити». У газеті трапиться іменник die Weigerung; побутове речення — просто Er will nicht.'

  - de: sich vergnügen
    ipa: "zɪç fɛɐ̯ˈgnyːgn̩"
    pos: verb
    praesens_3sg: vergnügt sich
    partizip2: sich vergnügt
    aux: haben
    valence: "sich + Akk; mit + Dat"
    # Recognition only: `Vergnügen` ("pleasure, enjoyment", kultur-freizeit) ships as a
    # production card, and A1 `Spaß haben` is what a learner actually says — the verb
    # is a shade old-fashioned even for Germans.
    cards: recognition
    en: to amuse oneself, to spend the time pleasantly
    ru: развлекаться, приятно проводить время
    uk: розважатися, приємно проводити час
    example_de: Die Kinder vergnügten sich stundenlang im Garten.
    example_en: The children amused themselves in the garden for hours.
    example_ru: Дети часами развлекались в саду.
    example_uk: Діти годинами розважалися в саду.
    note:
      en: 'A slightly old-fashioned word that survives mostly in written narrative; what you say is Spaß haben or sich amüsieren. The family around it is very much alive, though: das Vergnügen (Mit Vergnügen! — with pleasure), viel Vergnügen! as a send-off, der Vergnügungspark for a funfair, and the adjective vergnügt below. Where it does take a complement it is mit + Dativ (Er vergnügte sich mit einem Buch).'
      ru: 'Слово слегка старомодное и держится в основном в письменном повествовании; сказать же следует Spaß haben или sich amüsieren. Зато вся семья вокруг него жива: das Vergnügen (Mit Vergnügen! — «с удовольствием»), пожелание viel Vergnügen!, der Vergnügungspark — парк аттракционов, и прилагательное vergnügt ниже. Там, где дополнение всё же есть, это mit + Dativ (Er vergnügte sich mit einem Buch).'
      uk: 'Слово трохи старомодне й тримається переважно в писемній оповіді; казати ж варто Spaß haben або sich amüsieren. Зате вся родина навколо нього жива: das Vergnügen (Mit Vergnügen! — «із задоволенням»), побажання viel Vergnügen!, der Vergnügungspark — парк розваг, і прикметник vergnügt нижче. Там, де додаток усе ж є, це mit + Dativ (Er vergnügte sich mit einem Buch).'

  - de: sich etwas gefallen lassen
    ipa: "zɪç ˈɛtvas gəˈfalən ˈlasn̩"
    pos: phrase
    # Recognition only: a four-part idiom whose parts do not mean what it means, and
    # the production a B1 learner needs is `akzeptieren` (regeln-verantwortung) or the
    # plain negation. A typed card would grade which of the four words was wanted.
    cards: recognition
    en: to put up with something, to let it be done to you
    en_compact: "to put up with something"
    ru: терпеть что-либо, мириться с чем-либо
    uk: терпіти щось, миритися з чимось
    example_de: Das muss ich mir nicht gefallen lassen!
    example_en: I do not have to put up with that!
    example_ru: Я не обязан это терпеть!
    example_uk: Я не мушу цього терпіти!
    note:
      en: 'Almost always negated, and almost always said in anger — it is the German for drawing a line: Das lasse ich mir nicht gefallen. The pronoun is dative here (mir, dir, sich), not accusative, because the thing put up with is the accusative object. Note how far it has travelled from A1 gefallen, which means to please: on its own Das Bild gefällt mir is a compliment, and only the whole frame with lassen turns it into endurance. In the Perfekt lassen keeps its infinitive shape: Das habe ich mir lange gefallen lassen.'
      ru: 'Почти всегда с отрицанием и почти всегда в сердцах — это немецкий способ провести черту: Das lasse ich mir nicht gefallen. Местоимение здесь в Dativ (mir, dir, sich), а не в Akkusativ, потому что прямое дополнение — то, что терпят. Обратите внимание, как далеко оборот ушёл от gefallen уровня A1 со значением «нравиться»: само по себе Das Bild gefällt mir — комплимент, и лишь вся конструкция с lassen делает из этого «терпеть». В Perfekt lassen сохраняет форму инфинитива: Das habe ich mir lange gefallen lassen.'
      uk: 'Майже завжди із запереченням і майже завжди в серцях — це німецький спосіб провести межу: Das lasse ich mir nicht gefallen. Займенник тут у Dativ (mir, dir, sich), а не в Akkusativ, бо прямий додаток — те, що терплять. Зверніть увагу, як далеко зворот відійшов від gefallen рівня A1 зі значенням «подобатися»: саме по собі Das Bild gefällt mir — комплімент, і лише вся конструкція з lassen робить із цього «терпіти». У Perfekt lassen зберігає форму інфінітива: Das habe ich mir lange gefallen lassen.'

  # --- Verben mit und ohne sich: jemanden aufregen, sich aufregen ---
  - de: aufregen
    ipa: "ˈaʊ̯fˌʁeːgn̩"
    pos: verb
    praesens_3sg: regt auf
    partizip2: aufgeregt
    aux: haben
    valence: "+ Akk / sich"
    # Recognition only: A2 ships `ärgern` ("to be annoyed, to get cross (about)") as a
    # production card in gefuehle-reflexive-a2, with `sich ärgern` in its accept list —
    # the same prompt, in another deck, where no accept list here can reach it.
    cards: recognition
    en: to upset somebody; to get worked up
    en_compact: "to upset; to get worked up"
    ru: волновать, выводить из себя; кипятиться
    uk: хвилювати, виводити з рівноваги; сердитися
    example_de: Reg dich nicht auf, wir finden eine Lösung.
    example_en: Do not get worked up, we will find a solution.
    example_ru: Не кипятись, мы найдём решение.
    example_uk: Не сердься, ми знайдемо рішення.
    note:
      en: 'Two readings from one verb. Transitive it is what a thing does to a person — Die Nachricht hat ihn sehr aufgeregt — and reflexive it is what the person then does: sich über etwas aufregen, always with über + Akkusativ. Because both readings are real, the forms are written without sich. A2 sich ärgern is the near neighbour and the word to reach for in production; this one adds agitation to the annoyance, so it fits a raised voice better than a grumble. The participle aufgeregt has become an adjective of its own (Ich bin ganz aufgeregt — I am all excited), and die Aufregung is the noun.'
      ru: 'Два чтения у одного глагола. Переходное — это то, что вещь делает с человеком (Die Nachricht hat ihn sehr aufgeregt), возвратное — то, что человек делает потом: sich über etwas aufregen, всегда с über + Akkusativ. Оба чтения настоящие, поэтому формы пишутся без sich. Ближайший сосед — sich ärgern уровня A2, и в производстве брать следует именно его; здесь к досаде добавлено возбуждение, так что слово скорее для повышенного голоса, чем для ворчания. Причастие aufgeregt стало самостоятельным прилагательным (Ich bin ganz aufgeregt — «я весь на нервах, в волнении»), а существительное — die Aufregung.'
      uk: 'Два прочитання в одного дієслова. Перехідне — це те, що річ робить із людиною (Die Nachricht hat ihn sehr aufgeregt), зворотне — те, що людина робить потім: sich über etwas aufregen, завжди з über + Akkusativ. Обидва прочитання справжні, тому форми пишуться без sich. Найближчий сусід — sich ärgern рівня A2, і в продукуванні брати варто саме його; тут до досади додано збудження, тож слово радше для підвищеного голосу, ніж для бурчання. Дієприкметник aufgeregt став самостійним прикметником (Ich bin ganz aufgeregt — «я геть схвильований»), а іменник — die Aufregung.'

  - de: beruhigen
    ipa: "bəˈʁuːɪgn̩"
    pos: verb
    praesens_3sg: beruhigt
    partizip2: beruhigt
    aux: haben
    valence: "+ Akk / sich"
    en: to calm somebody down; to settle down again
    ru: успокаивать; успокаиваться
    uk: заспокоювати; заспокоюватися
    example_de: Beruhige dich bitte und erzähl mir langsam, was passiert ist.
    example_en: Please calm down and tell me slowly what happened.
    example_ru: Успокойся, пожалуйста, и расскажи мне медленно, что случилось.
    example_uk: Заспокойся, будь ласка, і розкажи мені поволі, що сталося.
    note:
      en: 'The exact counterweight to aufregen, and it works the same way in both directions: transitive with an accusative object (Die Mutter beruhigte das Kind) and reflexive for the person themselves (Beruhig dich!, Die Lage hat sich beruhigt). Because both readings are genuine the forms stay bare. It is built on the adjective ruhig, and the prefix be- is what makes it transitive — the same move as in beantworten from Antwort. Two useful chunks: Das beruhigt mich for relief at news, and beruhigend as an adjective (eine beruhigende Nachricht).'
      ru: 'Точный противовес к aufregen, и работает так же в обе стороны: переходно с дополнением в Akkusativ (Die Mutter beruhigte das Kind) и возвратно о самом человеке (Beruhig dich!, Die Lage hat sich beruhigt). Оба чтения настоящие, поэтому формы остаются без sich. Построен на прилагательном ruhig, а приставка be- как раз и делает глагол переходным — тот же ход, что в beantworten от Antwort. Два полезных оборота: Das beruhigt mich — облегчение от новости, и прилагательное beruhigend (eine beruhigende Nachricht).'
      uk: 'Точна противага до aufregen, і працює так само в обидва боки: перехідно з додатком у Akkusativ (Die Mutter beruhigte das Kind) і зворотно про саму людину (Beruhig dich!, Die Lage hat sich beruhigt). Обидва прочитання справжні, тому форми лишаються без sich. Побудоване на прикметнику ruhig, а префікс be- саме й робить дієслово перехідним — той самий хід, що в beantworten від Antwort. Два корисні звороти: Das beruhigt mich — полегшення від новини, і прикметник beruhigend (eine beruhigende Nachricht).'

  - de: fürchten
    ipa: "ˈfʏʁçtn̩"
    pos: verb
    praesens_3sg: fürchtet
    partizip2: gefürchtet
    aux: haben
    valence: "+ Akk / sich vor + Dat"
    # Recognition only: A2 ships `Angst` (gefuehle-reflexive-a2) and the chunk
    # `Angst haben vor` is the production every learner needs — this verb is the
    # written form of the same thing.
    cards: recognition
    en: to fear something; to be afraid of it
    en_compact: "to fear; to be afraid"
    ru: бояться, опасаться
    uk: боятися, побоюватися
    example_de: Ich fürchte, wir kommen zu spät zum Konzert.
    example_en: I am afraid we will get to the concert too late.
    example_ru: Боюсь, мы опоздаем на концерт.
    example_uk: Боюся, ми запізнимося на концерт.
    note:
      en: 'Three shapes, and only one of them is common in speech. Transitive it takes an accusative object and belongs to writing: Er fürchtet die Prüfung. Reflexive it is sich vor etwas fürchten, mostly in stories about children and the dark. What everybody uses is the third one — Ich fürchte, … as a softener before bad news, exactly like English I am afraid. For all other purposes German says Angst haben vor + Dativ, which is what A2 teaches. The adjective furchtbar has drifted away from the meaning altogether and now simply means awful.'
      ru: 'Три формы, и в речи распространена лишь одна. Переходно берёт Akkusativ и принадлежит письму: Er fürchtet die Prüfung. Возвратно — sich vor etwas fürchten, чаще в рассказах про детей и темноту. Все же пользуются третьим: Ich fürchte, … как смягчение перед плохой новостью, ровно как английское I am afraid. Во всех прочих случаях немецкий говорит Angst haben vor + Dativ, чему и учит A2. Прилагательное furchtbar ушло от значения совсем и теперь значит просто «ужасный».'
      uk: 'Три форми, і в мовленні поширена лише одна. Перехідно бере Akkusativ і належить письму: Er fürchtet die Prüfung. Зворотно — sich vor etwas fürchten, частіше в оповідях про дітей і темряву. Усі ж користуються третьою: Ich fürchte, … як пом’якшення перед поганою новиною, точно як англійське I am afraid. У решті випадків німецька каже Angst haben vor + Dativ, чого й навчає A2. Прикметник furchtbar відійшов від значення зовсім і тепер означає просто «жахливий».'

  - de: erleichtern
    ipa: "ɛɐ̯ˈlaɪ̯çtɐn"
    pos: verb
    praesens_3sg: erleichtert
    partizip2: erleichtert
    aux: haben
    valence: "+ Dat + Akk"
    # Recognition only: the everyday production is `einfacher machen` or `helfen`
    # (A1) — this is the verb of a written report, and its participle `erleichtert`
    # is what the learner actually meets.
    cards: recognition
    en: to make something easier for somebody
    ru: облегчать, упрощать (для кого-либо)
    uk: полегшувати, спрощувати (для когось)
    example_de: Der neue Aufzug erleichtert älteren Leuten den Weg nach oben.
    example_en: The new lift makes the way upstairs easier for older people.
    example_ru: Новый лифт облегчает пожилым людям подъём наверх.
    example_uk: Новий ліфт полегшує літнім людям підйом нагору.
    note:
      en: 'Two objects: the person helped is dative and the thing made easier is accusative — jemandem etwas erleichtern. Built from leicht with er-, the prefix that turns an adjective into a verb of becoming or causing (erweitern from weit, ermöglichen from möglich). Its participle has become an adjective of feeling and is far more frequent than the verb: Ich bin erleichtert — I am relieved, said when a worry has lifted. Die Erleichterung is that same relief as a noun.'
      ru: 'Два дополнения: тот, кому помогают, — в Dativ, а то, что облегчают, — в Akkusativ: jemandem etwas erleichtern. Образовано от leicht с приставкой er-, которая превращает прилагательное в глагол становления или причинения (erweitern от weit, ermöglichen от möglich). Его причастие стало прилагательным чувства и встречается куда чаще самого глагола: Ich bin erleichtert — «у меня отлегло», когда тревога ушла. Die Erleichterung — то же облегчение существительным.'
      uk: 'Два додатки: той, кому допомагають, — у Dativ, а те, що полегшують, — у Akkusativ: jemandem etwas erleichtern. Утворене від leicht із префіксом er-, який перетворює прикметник на дієслово становлення або спричинення (erweitern від weit, ermöglichen від möglich). Його дієприкметник став прикметником почуття і трапляється значно частіше за саме дієслово: Ich bin erleichtert — «мені відлягло», коли тривога минула. Die Erleichterung — те саме полегшення іменником.'

  # --- Starke Gefühle: hassen, leiden, lächeln ---
  - de: hassen
    ipa: "ˈhasn̩"
    pos: verb
    praesens_3sg: hasst
    partizip2: gehasst
    aux: haben
    valence: "+ Akk"
    en: to hate
    ru: ненавидеть
    uk: ненавидіти
    example_de: Ich hasse es, im Regen auf den Bus zu warten.
    example_en: I hate waiting for the bus in the rain.
    example_ru: Ненавижу ждать автобус под дождём.
    example_uk: Ненавиджу чекати на автобус під дощем.
    note:
      en: 'The straight opposite of lieben, and just as strong — German does not use it as loosely as English does about food or weather, so a dish you dislike is one you mag ich nicht. With an activity the frame is es hassen, etwas zu tun, and that es cannot be dropped. The du-form is hasst with one s written before the t (the stem already ends in ss). The noun der Hass has no plural, and hassen und lieben are the two poles a B1 text will set against each other.'
      ru: 'Прямая противоположность lieben и такой же силы — немецкий употребляет его не так свободно, как английский о еде или погоде, так что нелюбимое блюдо — это то, которое mag ich nicht. С действием конструкция такая: es hassen, etwas zu tun, и это es опустить нельзя. Форма 2-го лица — hasst, с одним s перед t (основа и так кончается на ss). У существительного der Hass множественного числа нет, а hassen und lieben — два полюса, которые текст уровня B1 любит противопоставлять.'
      uk: 'Пряма протилежність lieben і такої самої сили — німецька вживає його не так вільно, як англійська про їжу чи погоду, тож нелюбима страва — це та, яку mag ich nicht. З дією конструкція така: es hassen, etwas zu tun, і це es опустити не можна. Форма 2-ї особи — hasst, з одним s перед t (основа й так закінчується на ss). Іменник der Hass множини не має, а hassen und lieben — два полюси, які текст рівня B1 залюбки протиставляє.'

  - de: leiden
    ipa: "ˈlaɪ̯dn̩"
    pos: verb
    praesens_3sg: leidet
    partizip2: gelitten
    aux: haben
    valence: "an / unter + Dat"
    en: to suffer, to be badly affected by something
    ru: страдать, тяжело переносить
    uk: страждати, тяжко переносити
    example_de: Viele Menschen in der Stadt leiden unter dem Lärm.
    example_en: Many people in the town suffer from the noise.
    example_ru: Многие в городе страдают от шума.
    example_uk: Багато людей у місті потерпають від шуму.
    note:
      en: 'Strong verb: leiden – litt – gelitten, and the participle loses the d, which is the part that catches everyone out. Two prepositions divide the work — an + Dativ for an illness one has (Sie leidet an Diabetes), unter + Dativ for a condition one is exposed to (Er leidet unter dem Stress). A third use is negative and idiomatic: Ich kann ihn nicht leiden means I cannot stand him. The noun das Leid is misfortune in the grand sense, and it is the same word inside the phrase leid tun below.'
      ru: 'Сильный глагол: leiden – litt – gelitten, и в причастии выпадает d — на этом спотыкаются все. Работу делят два предлога: an + Dativ о болезни, которая есть у человека (Sie leidet an Diabetes), и unter + Dativ об обстоятельствах, которым он подвергается (Er leidet unter dem Stress). Третье употребление — отрицательное и идиоматичное: Ich kann ihn nicht leiden значит «терпеть его не могу». Существительное das Leid — «горе» в высоком смысле, и это то же слово внутри оборота leid tun ниже.'
      uk: 'Сильне дієслово: leiden – litt – gelitten, і в дієприкметнику випадає d — на цьому спотикаються всі. Роботу ділять два прийменники: an + Dativ про хворобу, яку людина має (Sie leidet an Diabetes), і unter + Dativ про обставини, яким вона піддається (Er leidet unter dem Stress). Третє вживання — заперечне та ідіоматичне: Ich kann ihn nicht leiden означає «терпіти його не можу». Іменник das Leid — «горе» у високому сенсі, і це те саме слово всередині звороту leid tun нижче.'

  - de: leid tun
    ipa: "ˈlaɪ̯t ˈtuːn"
    pos: phrase
    # Recognition only: A2 ships `leidtun` — the same words written solid — as a
    # production card in verben-handlungen-a2-2 ("to be sorry, to feel sorry for").
    # This entry keys the Wortliste's two-word spelling and must not deal a second
    # production card for the identical prompt.
    cards: recognition
    en: to be sorry about something; to feel sorry for somebody
    ru: сожалеть; жалеть кого-либо
    uk: шкодувати; жаліти когось
    example_de: Es tut mir leid, dass ich nicht anrufen konnte.
    example_en: I am sorry that I could not call.
    example_ru: Мне жаль, что я не смог позвонить.
    example_uk: Мені шкода, що я не зміг зателефонувати.
    note:
      en: 'The person who is sorry stands in the dative and the sentence starts with an empty es — Es tut mir leid, Es tut ihm leid. Turn it round and the person becomes the object of pity: Der Hund tut mir leid, I feel sorry for the dog. Both spellings are current German; the Wortliste prints the two words apart, the 2006 reform allows leidtun written solid, and both are correct today. Do not confuse it with the apology Entschuldigung, which asks to be excused, while this one only reports the regret.'
      ru: 'Тот, кому жаль, стоит в Dativ, а предложение начинается с пустого es: Es tut mir leid, Es tut ihm leid. Переверните — и человек становится объектом жалости: Der Hund tut mir leid, «мне жаль собаку». Оба написания — сегодняшний немецкий: Wortliste печатает два слова раздельно, реформа 2006 года разрешает слитное leidtun, и оба верны. Не смешивать с Entschuldigung: то просит извинения, а этот оборот лишь сообщает о сожалении.'
      uk: 'Той, кому шкода, стоїть у Dativ, а речення починається з порожнього es: Es tut mir leid, Es tut ihm leid. Переверніть — і людина стає об’єктом жалю: Der Hund tut mir leid, «мені шкода собаку». Обидва написання — сьогоднішня німецька: Wortliste друкує два слова окремо, реформа 2006 року дозволяє злите leidtun, і обидва правильні. Не змішувати з Entschuldigung: те просить вибачення, а цей зворот лише повідомляє про жаль.'

  - de: lächeln
    ipa: "ˈlɛçl̩n"
    pos: verb
    praesens_3sg: lächelt
    partizip2: gelächelt
    aux: haben
    # Recognition only: A1/A2 ships `lachen` ("to laugh", verben-grundwortschatz) as a
    # production card, and the two are one letter apart — a typed prompt reading
    # "to smile / to laugh" would grade which of them the author had in mind.
    cards: recognition
    en: to smile
    ru: улыбаться
    uk: усміхатися
    example_de: Sie lächelte, als sie das Foto sah.
    example_en: She smiled when she saw the photo.
    example_ru: Она улыбнулась, когда увидела фотографию.
    example_uk: Вона усміхнулася, коли побачила світлину.
    note:
      en: 'The quiet relative of lachen: laughing makes a sound, smiling does not, and the -eln ending is the diminutive that says so — the same suffix in klingeln and streicheln. Watch the present tense: ich lächle drops the e of the stem, while lächelst, lächelt keep it. Two chunks are worth having whole: über etwas lächeln, to smile at something, and jemanden anlächeln, to smile at a person. The noun das Lächeln is simply the infinitive capitalised, and das Lachen beside it works the same way.'
      ru: 'Тихий родственник lachen: смех звучит, улыбка — нет, и суффикс -eln как раз об этом, тот же уменьшительный суффикс, что в klingeln и streicheln. Следите за настоящим временем: ich lächle теряет e основы, а lächelst, lächelt его сохраняют. Два оборота стоит взять целиком: über etwas lächeln — «улыбаться чему-либо» и jemanden anlächeln — «улыбнуться кому-либо». Существительное das Lächeln — это просто инфинитив с прописной буквы, и das Lachen рядом устроено так же.'
      uk: 'Тихий родич lachen: сміх звучить, усмішка — ні, і суфікс -eln саме про це, той самий зменшувальний суфікс, що в klingeln і streicheln. Стежте за теперішнім часом: ich lächle втрачає e основи, а lächelst, lächelt його зберігають. Два звороти варто взяти цілими: über etwas lächeln — «усміхатися чомусь» і jemanden anlächeln — «усміхнутися комусь». Іменник das Lächeln — це просто інфінітив із великої літери, і das Lachen поряд влаштоване так само.'

  - de: spüren
    ipa: "ˈʃpyːʁən"
    pos: verb
    praesens_3sg: spürt
    partizip2: gespürt
    aux: haben
    valence: "+ Akk"
    # Recognition only: `fühlen` ("to feel a certain way, to feel well or unwell",
    # gesundheit-arzttermin) is the shipped production card for feeling, and the two
    # overlap across most of their range.
    cards: recognition
    en: to sense something, to notice it in the body
    ru: чувствовать, ощущать (телом)
    uk: відчувати, чути тілом
    example_de: Nach dem langen Spaziergang spürte er jeden Muskel.
    example_en: After the long walk he could feel every muscle.
    example_ru: После долгой прогулки он чувствовал каждую мышцу.
    example_uk: Після довгої прогулянки він відчував кожен м’яз.
    note:
      en: 'It always has an object — you sense something — while fühlen more often describes how you are (Ich fühle mich gut). Where they overlap, this one leans on the body and on things noticed rather than reasoned: Ich spüre den Wind, Man spürt, dass sie müde ist. The related noun die Spur means a trace or a lane on the motorway, and keine Spur! is a flat denial. The verb is also what a hunting dog does, which is where the trace sense comes from.'
      ru: 'У него всегда есть дополнение — ощущают что-то, — тогда как fühlen чаще описывает состояние (Ich fühle mich gut). Там, где они пересекаются, это слово тяготеет к телу и к тому, что замечено, а не выведено: Ich spüre den Wind, Man spürt, dass sie müde ist. Родственное существительное die Spur — «след», а на автобане «полоса», и keine Spur! — категорическое отрицание. Тем же глаголом описывают работу охотничьей собаки, откуда и значение следа.'
      uk: 'У нього завжди є додаток — відчувають щось, — тоді як fühlen частіше описує стан (Ich fühle mich gut). Там, де вони перетинаються, це слово тяжіє до тіла й до поміченого, а не виведеного: Ich spüre den Wind, Man spürt, dass sie müde ist. Споріднений іменник die Spur — «слід», а на автобані «смуга», і keine Spur! — категоричне заперечення. Тим самим дієсловом описують роботу мисливського собаки, звідки й значення сліду.'

  # --- Die Gefühle als Nomen ---
  - de: Gefühl
    ipa: "gəˈfyːl"
    pos: noun
    gender: n
    plural: "die Gefühle"
    en: feeling, emotion
    ru: чувство, ощущение
    uk: почуття, відчуття
    example_de: Ich hatte das Gefühl, dass etwas nicht stimmt.
    example_en: I had the feeling that something was wrong.
    example_ru: У меня было чувство, что что-то не так.
    example_uk: У мене було відчуття, що щось не так.
    note:
      en: 'One noun for two English words: it covers both an emotion (Gefühle zeigen) and a physical sensation (ein Gefühl in den Fingern). The everyday chunk is das Gefühl haben, dass … — a hunch about something you cannot prove — and it is far commoner than glauben in speech. Compounds worth recognising: das Selbstgefühl, das Mitgefühl (sympathy), and gefühlsmäßig for a decision made on instinct. The adjective is gefühlvoll, and the verb behind it is fühlen.'
      ru: 'Одно существительное на два русских: оно покрывает и эмоцию (Gefühle zeigen), и телесное ощущение (ein Gefühl in den Fingern). Обиходный оборот — das Gefühl haben, dass … — догадка, которую не докажешь, и в речи он куда частотнее, чем glauben. Составные слова, которые стоит узнавать: das Selbstgefühl, das Mitgefühl («сочувствие») и gefühlsmäßig — о решении, принятом по наитию. Прилагательное — gefühlvoll, а глагол за ним — fühlen.'
      uk: 'Один іменник на два українські: він покриває і емоцію (Gefühle zeigen), і тілесне відчуття (ein Gefühl in den Fingern). Побутовий зворот — das Gefühl haben, dass … — здогад, якого не доведеш, і в мовленні він значно частотніший за glauben. Складні слова, які варто впізнавати: das Selbstgefühl, das Mitgefühl («співчуття») і gefühlsmäßig — про рішення, ухвалене за наїттям. Прикметник — gefühlvoll, а дієслово за ним — fühlen.'

  - de: Freude
    ipa: "ˈfʁɔʏ̯də"
