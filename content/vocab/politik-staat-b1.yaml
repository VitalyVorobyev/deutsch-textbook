# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the politics-and-
# state field of data/goethe-b1-wortliste.txt: the layers a federal country is built
# in, the offices at the top of each of them, what an election is and who stands in
# it, the four words a text uses to place a position, and the things politics is
# argued about. This is the German of the first three pages of a newspaper and of
# the news at eight.
# A1's `erste-schritte` owns das Land and A1's `stadt-wege` owns die Stadt, A2's
# `aemter-dienstleistungen` owns das Amt, A2's `laender-nationalitaeten-a2` owns
# Europa and europäisch, A2's `verben-handlungen-a2-2` owns wählen with all three of
# its senses, B1's `verwaltung-behoerden-b1` owns the counter the state is met at
# (Behörde, Beamte, Bürger, Bürgerin, Steuer, öffentlich), B1's
# `gesellschaft-zusammenleben` owns the people as a society (Gesellschaft,
# Versammlung, Diskussion), B1's `verben-kommunikation-ausdruck-b1` owns
# protestieren and die Rede, and B1's `wirtschaft-handel-b1` owns die Wirtschaft.
# This deck is the layer above all of them: the institutions those eight leave
# unnamed, and the words a reader needs before a news item is about anything.
# It is Germany's civic vocabulary. The Austrian and Swiss institution names the
# Wortliste files beside these — Nationalrat, Ständerat, Kanton, Ammann and their
# siblings — are held back for the Varianten deck of wave 4; where one exists, this
# deck's `note` names it and nothing more.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read off a headline, a ballot paper and a news bulletin; the learner who has to
# *say* what he thinks about any of it reaches for the A1 or A2 word beside it, and
# that word already ships as a typed card.
id: politik-staat-b1
title_de: "Politik und Staat"
title_en: "Politics and the state"
title_ru: "Политика и государство"
title_uk: "Політика і держава"
level: B1
entries:
  # --- Der Staat und seine Form ---
  - de: Staat
    ipa: "ˈʃtaːt"
    pos: noun
    gender: m
    plural: "die Staaten"
    cards: recognition
    en: a country taken as the organisation that governs it, with its borders, its laws and its offices
    ru: страна, взятая как организация, которая ею управляет, с её границами, законами и учреждениями
    uk: країна, узята як організація, що нею керує, з її кордонами, законами й установами
    example_de: Der Staat bezahlt die Schulen und die Straßen.
    example_en: The state pays for the schools and the roads.
    example_ru: Государство оплачивает школы и дороги.
    example_uk: Держава оплачує школи й дороги.
    note:
      en: 'The double a is long, and the plural is die Staaten with no umlaut. A1 das Land in the deck `erste-schritte` is the country as a place on a map; this word is the apparatus that runs it, which is why taxes, schools, courts and police all belong to der Staat and not to das Land. Chunks: ein demokratischer Staat, Staat und Kirche, die Staaten der EU. The person on the other side of it is B1 der Bürger in the deck `verwaltung-behoerden-b1`. Compounds: der Bundesstaat, die Staatsangehörigkeit, der Staatsanwalt.'
      ru: 'Двойное a долгое, множественное die Staaten без умлаута. das Land уровня A1 из колоды `erste-schritte` — страна как место на карте; это же слово — аппарат, который ею управляет, поэтому налоги, школы, суды и полиция принадлежат der Staat, а не das Land. Обороты: ein demokratischer Staat, Staat und Kirche, die Staaten der EU. Человек по другую сторону от него — der Bürger уровня B1 из колоды `verwaltung-behoerden-b1`. Сложные слова: der Bundesstaat, die Staatsangehörigkeit, der Staatsanwalt.'
      uk: 'Подвійне a довге, множина die Staaten без умлаута. das Land рівня A1 з колоди `erste-schritte` — країна як місце на карті; це ж слово — апарат, що нею керує, тому податки, школи, суди й поліція належать der Staat, а не das Land. Звороти: ein demokratischer Staat, Staat und Kirche, die Staaten der EU. Людина по інший бік від нього — der Bürger рівня B1 з колоди `verwaltung-behoerden-b1`. Складні слова: der Bundesstaat, die Staatsangehörigkeit, der Staatsanwalt.'

  - de: staatlich
    ipa: "ˈʃtaːtlɪç"
    pos: adj
    cards: recognition
    en: run or paid for by the state rather than by a private owner
    ru: содержащийся или оплачиваемый государством, а не частным владельцем
    uk: утримуваний або оплачуваний державою, а не приватним власником
    example_de: Die Universität ist staatlich und kostet fast nichts.
    example_en: The university is state-run and costs almost nothing.
    example_ru: Университет государственный и стоит почти ничего.
    example_uk: Університет державний і коштує майже нічого.
    note:
      en: 'From der Staat above, and its opposite is A2 privat in the deck `eigenschaften-dinge-a2`. It says who owns or pays, which is a different question from B1 öffentlich in the deck `verwaltung-behoerden-b1`, where the point is that everybody may use the thing. Chunks: staatliche Hilfe, eine staatliche Schule, staatlich geprüft, and staatlich anerkannt on a certificate. The noun for the country as an owner is der Staat; for the running of it, die Verwaltung.'
      ru: 'От der Staat выше, а противоположность — privat уровня A2 из колоды `eigenschaften-dinge-a2`. Слово говорит, кто владеет и платит, а это другой вопрос, чем у öffentlich уровня B1 из колоды `verwaltung-behoerden-b1`, где суть в том, что пользоваться может каждый. Обороты: staatliche Hilfe, eine staatliche Schule, staatlich geprüft, а на дипломе staatlich anerkannt. Существительное для страны как владельца — der Staat, для управления ею — die Verwaltung.'
      uk: 'Від der Staat вище, а протилежність — privat рівня A2 з колоди `eigenschaften-dinge-a2`. Слово каже, хто володіє і платить, а це інше питання, ніж в öffentlich рівня B1 з колоди `verwaltung-behoerden-b1`, де суть у тому, що користуватися може кожен. Звороти: staatliche Hilfe, eine staatliche Schule, staatlich geprüft, а на дипломі staatlich anerkannt. Іменник для країни як власника — der Staat, для керування нею — die Verwaltung.'

  - de: Bund
    ipa: "ˈbʊnt"
    pos: noun
    gender: m
    plural: "die Bünde"
    cards: recognition
    en: the federal level of the German state, the layer above the member states; also any league people or states form together
    ru: федеральный уровень немецкого государства, слой над землями; а также всякий союз, который образуют люди или государства
    uk: федеральний рівень німецької держави, шар над землями; а також будь-яка спілка, яку утворюють люди чи держави
    example_de: Diese Straße bezahlt nicht das Land, sondern der Bund.
    example_en: This road is paid for not by the state but by the federal government.
    example_ru: Эту дорогу оплачивает не земля, а федерация.
    example_uk: Цю дорогу оплачує не земля, а федерація.
    note:
      en: 'The civic sense is the one a news item needs, and it is always the top layer against the layer below: Bund und Länder, der Bund zahlt, die Aufgaben des Bundes. Every Bundes- word in this deck is built on it. Outside politics it is any association — der Deutsche Fußball-Bund, der Bund fürs Leben for a marriage — and in a pair of trousers der Bund is the waistband. The final d is devoiced to t, and the plural takes an umlaut.'
      ru: 'Гражданское значение — то, что нужно новостям, и оно всегда противопоставляет верхний слой нижнему: Bund und Länder, der Bund zahlt, die Aufgaben des Bundes. На нём построено каждое слово на Bundes- в этой колоде. Вне политики это любой союз — der Deutsche Fußball-Bund, der Bund fürs Leben о браке, — а в брюках der Bund — пояс. Конечное d оглушается в t, во множественном умлаут.'
      uk: 'Громадянське значення — те, що потрібне новинам, і воно завжди протиставляє верхній шар нижньому: Bund und Länder, der Bund zahlt, die Aufgaben des Bundes. На ньому побудоване кожне слово на Bundes- у цій колоді. Поза політикою це будь-яка спілка — der Deutsche Fußball-Bund, der Bund fürs Leben про шлюб, — а в штанях der Bund — пояс. Кінцеве d оглушується в t, у множині умлаут.'

  - de: Bundesland
    ipa: "ˈbʊndəsˌlant"
    pos: noun
    gender: n
    plural: "die Bundesländer"
    cards: recognition
    en: one of the member states a federal country is made of, with a parliament and a government of its own
    ru: одна из земель, из которых состоит федеративная страна, со своим парламентом и своим правительством
    uk: одна із земель, з яких складається федеративна країна, зі своїм парламентом і своїм урядом
    example_de: Jedes Bundesland hat eigene Ferien und eigene Schulen.
    example_en: Every federal state has its own holidays and its own schools.
    example_ru: У каждой земли свои каникулы и свои школы.
    example_uk: У кожної землі свої канікули і свої школи.
    note:
      en: 'Germany has sixteen and Austria nine, and both call them by this word; Switzerland is divided into Kantone instead, which is a different word for a different thing. Because school and police are a Land matter and not a Bund matter, term dates and even road signs differ across a border you cannot see. In context the compound is usually shortened back to das Land — das Land Bayern, die Landesregierung — which is why A1 das Land in the deck `erste-schritte` has to be read from its sentence. Plural with an umlaut.'
      ru: 'В Германии их шестнадцать, в Австрии девять, и обе страны называют их этим словом; Швейцария делится на Kantone — другое слово о другом устройстве. Поскольку школа и полиция — дело земли, а не федерации, сроки каникул и даже дорожные знаки различаются за границей, которой не видно. В контексте сложное слово обычно сокращают обратно до das Land — das Land Bayern, die Landesregierung, — поэтому das Land уровня A1 из колоды `erste-schritte` приходится читать по предложению. Во множественном умлаут.'
      uk: 'У Німеччині їх шістнадцять, в Австрії дев’ять, і обидві країни звуть їх цим словом; Швейцарія ділиться на Kantone — інше слово про інший устрій. Оскільки школа й поліція — справа землі, а не федерації, строки канікул і навіть дорожні знаки різняться за кордоном, якого не видно. У контексті складне слово зазвичай скорочують назад до das Land — das Land Bayern, die Landesregierung, — тому das Land рівня A1 з колоди `erste-schritte` доводиться читати за реченням. У множині умлаут.'

  - de: Bundesrepublik
    ipa: "ˈbʊndəsʁepuˌbliːk"
    pos: noun
    gender: f
    plural: "die Bundesrepubliken"
    cards: recognition
    en: a republic made up of member states; in German texts, the official name of the German state
    ru: республика, составленная из земель; в немецких текстах — официальное название немецкого государства
    uk: республіка, складена із земель; у німецьких текстах — офіційна назва німецької держави
    example_de: Die Bundesrepublik hat sechzehn Länder.
    example_en: The Federal Republic has sixteen states.
    example_ru: В Федеративной Республике шестнадцать земель.
    example_uk: У Федеративній Республіці шістнадцять земель.
    note:
      en: 'The full name is die Bundesrepublik Deutschland. The abbreviation BRD belongs to texts written while there were two German states and is avoided in official use today, where the country simply calls itself Deutschland. A plural exists grammatically, but the word names one state, so a text uses the singular. Austria''s official name is die Republik Österreich; Switzerland''s is die Schweizerische Eidgenossenschaft, which is not a republic in name at all.'
      ru: 'Полное название — die Bundesrepublik Deutschland. Сокращение BRD принадлежит текстам той поры, когда немецких государств было два, и в официальном употреблении сегодня его избегают: страна называет себя просто Deutschland. Множественное грамматически существует, но слово называет одно государство, поэтому текст берёт единственное. Официальное название Австрии — die Republik Österreich; швейцарское — die Schweizerische Eidgenossenschaft, где слова «республика» нет вовсе.'
      uk: 'Повна назва — die Bundesrepublik Deutschland. Скорочення BRD належить текстам тієї доби, коли німецьких держав було два, і в офіційному вжитку сьогодні його уникають: країна зве себе просто Deutschland. Множина граматично існує, але слово називає одну державу, тому текст бере однину. Офіційна назва Австрії — die Republik Österreich; швейцарська — die Schweizerische Eidgenossenschaft, де слова «республіка» немає зовсім.'

  - de: Republik
    ipa: "ʁepuˈbliːk"
    pos: noun
    gender: f
    plural: "die Republiken"
    cards: recognition
    en: a state whose head holds the office by election rather than by birth
    ru: государство, глава которого занимает свой пост по избранию, а не по рождению
    uk: держава, голова якої обіймає свою посаду за обранням, а не за народженням
    example_de: Seit 1918 ist Deutschland eine Republik.
    example_en: Germany has been a republic since 1918.
    example_ru: С 1918 года Германия — республика.
    example_uk: Від 1918 року Німеччина — республіка.
    note:
      en: 'Feminine, stress on the last syllable, plural in -en. Its opposite is die Monarchie, and what the word fixes is only how the head of state comes to office, not how much power that office has — Germany''s Bundespräsident below has very little. German history names its periods with it: die Weimarer Republik, and die Bundesrepublik above. The adjective is republikanisch.'
      ru: 'Женский род, ударение на последнем слоге, множественное на -en. Противоположность — die Monarchie, и слово фиксирует только то, как глава государства попадает на пост, а не сколько у поста власти: у немецкого Bundespräsident ниже её очень мало. Немецкая история называет этим словом свои эпохи: die Weimarer Republik, а также die Bundesrepublik выше. Прилагательное — republikanisch.'
      uk: 'Жіночий рід, наголос на останньому складі, множина на -en. Протилежність — die Monarchie, і слово фіксує лише те, як голова держави потрапляє на посаду, а не скільки в посади влади: у німецького Bundespräsident нижче її дуже мало. Німецька історія називає цим словом свої доби: die Weimarer Republik, а також die Bundesrepublik вище. Прикметник — republikanisch.'

  - de: Demokratie
    ipa: "demokʁaˈtiː"
    pos: noun
    gender: f
    plural: "die Demokratien"
    cards: recognition
    en: a form of state in which those who govern are chosen by the people and can be voted out again
    ru: форма государства, при которой правящих выбирает народ и может их сместить голосованием
    uk: форма держави, за якої тих, хто врядує, обирає народ і може змістити їх голосуванням
    example_de: In einer Demokratie entscheidet die Mehrheit.
    example_en: In a democracy the majority decides.
    example_ru: В демократии решает большинство.
    example_uk: У демократії вирішує більшість.
    note:
      en: 'Greek by root, feminine like every noun in -ie, with the stress on that ending; the plural adds -n and the ending is then read as two syllables. What the word requires is not only the vote but the possibility of losing it, which is why abwählen — to vote somebody out — is the test a German text applies. Compounds: die Volksdemokratie, demokratiefeindlich. The adjective is demokratisch, the next entry, and it moves the stress.'
      ru: 'Греческое по корню, женского рода, как все слова на -ie, с ударением на этом окончании; множественное прибавляет -n, и окончание тогда читается двумя слогами. Слово требует не только голосования, но и возможности его проиграть, поэтому немецкий текст проверяет строй глаголом abwählen — «сместить голосованием». Сложные слова: die Volksdemokratie, demokratiefeindlich. Прилагательное — demokratisch, следующая запись, и ударение в нём переезжает.'
      uk: 'Грецьке за коренем, жіночого роду, як усі слова на -ie, з наголосом на цьому закінченні; множина додає -n, і закінчення тоді читається двома складами. Слово вимагає не лише голосування, а й можливості його програти, тому німецький текст перевіряє лад дієсловом abwählen — «змістити голосуванням». Складні слова: die Volksdemokratie, demokratiefeindlich. Прикметник — demokratisch, наступний запис, і наголос у ньому переїжджає.'

  - de: demokratisch
    ipa: "demoˈkʁaːtɪʃ"
    pos: adj
    cards: recognition
    en: built on the will of the many, expressed by a vote everybody may take part in
    ru: построенный на воле большинства, выраженной голосованием, в котором может участвовать каждый
    uk: побудований на волі більшості, висловленій голосуванням, у якому може взяти участь кожен
    example_de: Der Verein trifft alle Entscheidungen demokratisch.
    example_en: The club takes all its decisions democratically.
    example_ru: Все решения объединение принимает демократически.
    example_uk: Усі рішення об’єднання ухвалює демократично.
    note:
      en: 'The stress moves off the ending of die Demokratie above onto -kra-, where the a becomes long. It is not only about states: a club, a school class or a family can take a decision demokratisch, which is the sense a B1 reading text uses most. Chunks: eine demokratische Entscheidung, auf demokratischem Weg, demokratische Rechte. Careful with names — die Demokratische Partei is an American party, not a description.'
      ru: 'Ударение уходит с окончания die Demokratie выше на -kra-, где a становится долгим. Речь не только о государствах: решение может принять демократически объединение, школьный класс или семья, и именно в этом смысле слово чаще всего встречается в тексте уровня B1. Обороты: eine demokratische Entscheidung, auf demokratischem Weg, demokratische Rechte. Осторожно с названиями: die Demokratische Partei — американская партия, а не характеристика.'
      uk: 'Наголос відходить із закінчення die Demokratie вище на -kra-, де a стає довгим. Ідеться не лише про держави: рішення може ухвалити демократично об’єднання, шкільний клас або родина, і саме в цьому сенсі слово найчастіше трапляється в тексті рівня B1. Звороти: eine demokratische Entscheidung, auf demokratischem Weg, demokratische Rechte. Обережно з назвами: die Demokratische Partei — американська партія, а не характеристика.'

  - de: EU
    ipa: "eːˈʔuː"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the union of European states that share one internal market and a body of common rules
    ru: союз европейских государств с общим внутренним рынком и общим сводом правил
    uk: союз європейських держав зі спільним внутрішнім ринком і спільним зводом правил
    example_de: Für eine Reise in der EU brauchst du kein Visum.
    example_en: You do not need a visa to travel inside the EU.
    example_ru: Для поездки внутри ЕС виза не нужна.
    example_uk: Для подорожі всередині ЄС віза не потрібна.
    note:
      en: 'Short for die Europäische Union, and feminine because Union is. Spoken as two letters with the stress on the second, the pattern of A2 das WC and B1 die WG in the deck `wohnen-gebaeude-b1`; no plural. A2 Europa and A2 europäisch in the deck `laender-nationalitaeten-a2` name the continent, and the difference is not pedantic: Switzerland and Norway are in Europe and not in the EU. Compounds: der EU-Bürger, das EU-Ausland, der EU-Beitritt, and separately die Eurozone for the countries using the euro.'
      ru: 'Сокращение от die Europäische Union, женского рода, потому что женского рода Union. Читается по буквам с ударением на второй — по образцу das WC уровня A2 и die WG уровня B1 из колоды `wohnen-gebaeude-b1`; множественного нет. Europa и europäisch уровня A2 из колоды `laender-nationalitaeten-a2` называют континент, и разница не педантическая: Швейцария и Норвегия — в Европе, но не в ЕС. Сложные слова: der EU-Bürger, das EU-Ausland, der EU-Beitritt, и отдельно die Eurozone — страны, где ходит евро.'
      uk: 'Скорочення від die Europäische Union, жіночого роду, бо жіночого роду Union. Читається по літерах із наголосом на другій — за зразком das WC рівня A2 і die WG рівня B1 з колоди `wohnen-gebaeude-b1`; множини немає. Europa і europäisch рівня A2 з колоди `laender-nationalitaeten-a2` називають континент, і різниця не педантична: Швейцарія і Норвегія — у Європі, але не в ЄС. Складні слова: der EU-Bürger, das EU-Ausland, der EU-Beitritt, і окремо die Eurozone — країни, де ходить євро.'

  # --- Wer regiert ---
  - de: Regierung
    ipa: "ʁeˈgiːʁʊŋ"
    pos: noun
    gender: f
    plural: "die Regierungen"
    cards: recognition
    en: the group of ministers that runs a state, and its time in office
    ru: круг министров, который управляет государством, и срок их пребывания у власти
    uk: коло міністрів, що керує державою, і строк їхнього перебування при владі
    example_de: Die neue Regierung will die Steuern nicht erhöhen.
    example_en: The new government does not want to raise taxes.
    example_ru: Новое правительство не хочет повышать налоги.
    example_uk: Новий уряд не хоче підвищувати податки.
    note:
      en: 'From regieren, and every noun in -ung is feminine and takes -en in the plural. Chunks: eine Regierung bilden, an die Regierung kommen, die Bundesregierung, die Landesregierung. Three neighbours are not the same thing and a news item keeps them apart: das Parlament below is elected and checks the government, B1 die Behörde in the deck `verwaltung-behoerden-b1` is the office that carries out what has been decided, and der Staat above is all of it together and outlasts every Regierung.'
      ru: 'От regieren, а всякое существительное на -ung женского рода и берёт -en во множественном. Обороты: eine Regierung bilden, an die Regierung kommen, die Bundesregierung, die Landesregierung. Три соседа — не одно и то же, и новость их различает: das Parlament ниже избирается и контролирует правительство, die Behörde уровня B1 из колоды `verwaltung-behoerden-b1` — учреждение, исполняющее решённое, а der Staat выше — всё это вместе, и он переживает любое Regierung.'
      uk: 'Від regieren, а кожен іменник на -ung жіночого роду і бере -en у множині. Звороти: eine Regierung bilden, an die Regierung kommen, die Bundesregierung, die Landesregierung. Три сусіди — не те саме, і новина їх розрізняє: das Parlament нижче обирається і контролює уряд, die Behörde рівня B1 з колоди `verwaltung-behoerden-b1` — установа, що виконує вирішене, а der Staat вище — усе це разом, і він переживає будь-який Regierung.'

  - de: Bundeskanzler
    ipa: "ˈbʊndəsˌkantslɐ"
    pos: noun
    gender: m
    plural: "die Bundeskanzler"
    cards: recognition
    en: the man who heads the German federal government and decides the lines it works along
    ru: мужчина, который возглавляет федеральное правительство Германии и задаёт направление его работы
    uk: чоловік, який очолює федеральний уряд Німеччини і задає напрям його роботи
    example_de: Der Bundeskanzler wird vom Bundestag gewählt.
    example_en: The federal chancellor is elected by the Bundestag.
    example_ru: Федерального канцлера избирает бундестаг.
    example_uk: Федерального канцлера обирає бундестаг.
    note:
      en: 'Usually shortened to der Kanzler. The point most learners get wrong is in the example: the voters elect the Bundestag, and the Bundestag then elects him, so his name is never on the ballot paper in that role. Singular and plural are spelled alike. The feminine is die Bundeskanzlerin, the next entry. Austria has a Bundeskanzler with the same job; the Swiss one is a senior civil servant who runs the Federal Chancellery and does not govern at all.'
      ru: 'Обычно сокращают до der Kanzler. То, в чём чаще всего ошибаются, видно в примере: избиратели выбирают бундестаг, а канцлера выбирает уже он, так что в этой роли фамилия канцлера в бюллетене не стоит никогда. Единственное и множественное пишутся одинаково. Женская пара — die Bundeskanzlerin, следующая запись. В Австрии Bundeskanzler делает ту же работу; швейцарский же — высокопоставленный чиновник во главе федеральной канцелярии, и он не правит вовсе.'
      uk: 'Зазвичай скорочують до der Kanzler. Те, у чому найчастіше помиляються, видно з прикладу: виборці обирають бундестаг, а канцлера обирає вже він, тож у цій ролі прізвище канцлера в бюлетені не стоїть ніколи. Однина і множина пишуться однаково. Жіноча пара — die Bundeskanzlerin, наступний запис. В Австрії Bundeskanzler виконує ту саму роботу; швейцарський же — високопосадовець на чолі федеральної канцелярії, і він не врядує зовсім.'

  - de: Bundeskanzlerin
    ipa: "ˈbʊndəsˌkantsləʁɪn"
    pos: noun
    gender: f
    plural: "die Bundeskanzlerinnen"
    cards: recognition
    en: the woman who heads the German federal government
    ru: женщина, которая возглавляет федеральное правительство Германии
    uk: жінка, яка очолює федеральний уряд Німеччини
    example_de: Die Bundeskanzlerin sprach am Abend im Fernsehen.
    example_en: The federal chancellor spoke on television in the evening.
    example_ru: Федеральный канцлер выступила вечером по телевидению.
    example_uk: Федеральна канцлерка виступила ввечері по телебаченню.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n. From 2005 to 2021 the office was held by a woman, so for sixteen years this was the ordinary form in every German newspaper and the masculine sounded like history — a rare case where the feminine of an office name is the one a learner met first. In direct address it is Frau Bundeskanzlerin.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается. С 2005 по 2021 год пост занимала женщина, поэтому шестнадцать лет именно эта форма была обычной в любой немецкой газете, а мужская звучала как история, — редкий случай, когда женскую форму названия должности учащийся встречает первой. В обращении — Frau Bundeskanzlerin.'
      uk: 'Звичайна моція на -in, у множині n подвоюється. Від 2005 до 2021 року посаду обіймала жінка, тому шістнадцять років саме ця форма була звичайною в будь-якій німецькій газеті, а чоловіча звучала як історія, — рідкісний випадок, коли жіночу форму назви посади учень зустрічає першою. У звертанні — Frau Bundeskanzlerin.'

  - de: Bundespräsident
    ipa: "ˈbʊndəspʁɛziˌdɛnt"
    pos: noun
    gender: m
    plural: "die Bundespräsidenten"
    cards: recognition
    en: the man who is head of the German state, in an office that represents rather than governs
    ru: мужчина, который является главой немецкого государства, — в должности представительской, а не правящей
    uk: чоловік, який є главою німецької держави, — на посаді представницькій, а не врядувальній
    example_de: Der Bundespräsident unterschreibt die neuen Gesetze.
    example_en: The federal president signs the new laws.
    example_ru: Федеральный президент подписывает новые законы.
    example_uk: Федеральний президент підписує нові закони.
    note:
      en: 'Präsident is a weak masculine and the compound inherits it, so every case but the nominative singular ends in -en: den Bundespräsidenten, dem Bundespräsidenten, des Bundespräsidenten, die Bundespräsidenten — the same declension as B1 der Fotograf in the deck `medien-digital-b1` and A2 der Polizist in the deck `berufe-a2`. He signs and represents; the governing is the Bundeskanzler''s above. He is chosen by die Bundesversammlung, not by the voters, whereas Austria elects its Bundespräsident directly and the Swiss one changes every year.'
      ru: 'Präsident — слабое существительное мужского рода, и сложное слово это наследует: во всех падежах, кроме именительного единственного, окончание -en — den Bundespräsidenten, dem Bundespräsidenten, des Bundespräsidenten, die Bundespräsidenten, — то же склонение, что у der Fotograf уровня B1 из колоды `medien-digital-b1` и der Polizist уровня A2 из колоды `berufe-a2`. Он подписывает и представляет; правит же Bundeskanzler выше. Его избирает die Bundesversammlung, а не избиратели, тогда как Австрия выбирает своего Bundespräsident прямым голосованием, а швейцарский меняется каждый год.'
      uk: 'Präsident — слабкий іменник чоловічого роду, і складне слово це успадковує: в усіх відмінках, крім називного однини, закінчення -en — den Bundespräsidenten, dem Bundespräsidenten, des Bundespräsidenten, die Bundespräsidenten, — те саме відмінювання, що в der Fotograf рівня B1 з колоди `medien-digital-b1` і der Polizist рівня A2 з колоди `berufe-a2`. Він підписує і представляє; врядує ж Bundeskanzler вище. Його обирає die Bundesversammlung, а не виборці, тоді як Австрія обирає свого Bundespräsident прямим голосуванням, а швейцарський змінюється щороку.'

  - de: Bundespräsidentin
    ipa: "ˈbʊndəspʁɛziˌdɛntɪn"
    pos: noun
    gender: f
    plural: "die Bundespräsidentinnen"
    cards: recognition
    en: the woman who is head of the German state, in the same representative office
    ru: женщина, которая является главой немецкого государства, — в той же представительской должности
    uk: жінка, яка є главою німецької держави, — на тій самій представницькій посаді
    example_de: Österreich hatte noch keine Bundespräsidentin.
    example_en: Austria has not yet had a female federal president.
    example_ru: У Австрии пока не было женщины на посту федерального президента.
    example_uk: В Австрії ще не було жінки на посаді федерального президента.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n, and the weak declension of the masculine stops here: this form takes no case endings at all. Germany has not had one either, so the word is met mostly in the conditional and in reporting on other countries, where die Präsidentin without Bundes- covers a head of state anywhere.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается, и слабое склонение мужской формы здесь обрывается: эта форма падежных окончаний не имеет вовсе. В Германии такой должности женщина тоже пока не занимала, поэтому слово встречается больше в сослагательных оборотах и в сообщениях о других странах, где главу государства называют die Präsidentin — без Bundes-.'
      uk: 'Звичайна моція на -in, у множині n подвоюється, і слабке відмінювання чоловічої форми тут уривається: ця форма відмінкових закінчень не має зовсім. У Німеччині цю посаду жінка теж поки не обіймала, тому слово трапляється більше в умовних зворотах і в повідомленнях про інші країни, де главу держави звуть die Präsidentin — без Bundes-.'

  - de: Minister
    ipa: "miˈnɪstɐ"
    pos: noun
    gender: m
    plural: "die Minister"
    cards: recognition
    en: a member of a government who is in charge of one field of it
    ru: член правительства, отвечающий за одну его область
    uk: член уряду, відповідальний за одну його ділянку
    example_de: Der Minister für Verkehr kommt aus Bayern.
    example_en: The minister for transport comes from Bavaria.
    example_ru: Министр транспорта родом из Баварии.
    example_uk: Міністр транспорту родом із Баварії.
    note:
      en: 'The field is named by a compound or by für plus the accusative: der Außenminister, der Innenminister, der Finanzminister, der Gesundheitsminister, and the house he runs is das Ministerium, plural die Ministerien. Singular and plural of the person are spelled alike. The Latin root minister meant a servant, and the German chunk der Ministerpräsident is not a prime minister of the country but the head of a Bundesland''s government. The feminine is die Ministerin, the next entry.'
      ru: 'Область называет либо сложное слово, либо für с винительным: der Außenminister, der Innenminister, der Finanzminister, der Gesundheitsminister, — а ведомство под ним называется das Ministerium, множественное die Ministerien. Единственное и множественное самого лица пишутся одинаково. Латинский корень minister значил «слуга», а немецкое der Ministerpräsident — не глава правительства страны, а глава правительства федеральной земли. Женская пара — die Ministerin, следующая запись.'
      uk: 'Ділянку називає або складне слово, або für зі знахідним: der Außenminister, der Innenminister, der Finanzminister, der Gesundheitsminister, — а відомство під ним зветься das Ministerium, множина die Ministerien. Однина і множина самої особи пишуться однаково. Латинський корінь minister означав «слуга», а німецьке der Ministerpräsident — не голова уряду країни, а голова уряду федеральної землі. Жіноча пара — die Ministerin, наступний запис.'

  - de: Ministerin
    ipa: "miˈnɪstəʁɪn"
    pos: noun
    gender: f
    plural: "die Ministerinnen"
    cards: recognition
    en: a woman in a government who is in charge of one field of it
    ru: женщина в правительстве, отвечающая за одну его область
    uk: жінка в уряді, відповідальна за одну його ділянку
    example_de: Die Ministerin antwortet morgen im Parlament.
    example_en: The minister will answer questions in parliament tomorrow.
    example_ru: Министр ответит завтра в парламенте.
    example_uk: Міністерка відповідатиме завтра в парламенті.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n, and the compounds follow: die Außenministerin, die Bildungsministerin. In direct address a German says Frau Ministerin, without a surname, exactly as with Frau Bundeskanzlerin above; the plural for a mixed cabinet is die Minister.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается, и сложные слова следуют за ним: die Außenministerin, die Bildungsministerin. В обращении говорят Frau Ministerin, без фамилии, ровно как Frau Bundeskanzlerin выше; множественное для смешанного кабинета — die Minister.'
      uk: 'Звичайна моція на -in, у множині n подвоюється, і складні слова йдуть за нею: die Außenministerin, die Bildungsministerin. У звертанні кажуть Frau Ministerin, без прізвища, точно як Frau Bundeskanzlerin вище; множина для змішаного кабінету — die Minister.'

  - de: Parlament
    ipa: "paʁlaˈmɛnt"
    pos: noun
    gender: n
    plural: "die Parlamente"
    cards: recognition
    en: the elected assembly that passes the laws and holds the government to account
    ru: избранное собрание, которое принимает законы и спрашивает с правительства
    uk: обране зібрання, яке ухвалює закони і питає з уряду
    example_de: Das Parlament hat das Gesetz gestern beschlossen.
    example_en: Parliament passed the law yesterday.
    example_ru: Парламент принял закон вчера.
    example_uk: Парламент ухвалив закон учора.
    note:
      en: 'A French loan from parler, to speak, and the stress is on the last syllable. It is the general word, and each country fills it with its own name: Germany''s is der Bundestag below, a Bundesland has a Landtag, and the EU has das Europäische Parlament. Chunks: ins Parlament gewählt werden, im Parlament sitzen, das Parlament auflösen. The adjective is parlamentarisch and a member is der Abgeordnete.'
      ru: 'Французское заимствование от parler — «говорить», ударение на последнем слоге. Это общее слово, и каждая страна заполняет его своим именем: у Германии это der Bundestag ниже, у федеральной земли — der Landtag, у ЕС — das Europäische Parlament. Обороты: ins Parlament gewählt werden, im Parlament sitzen, das Parlament auflösen. Прилагательное — parlamentarisch, а депутат — der Abgeordnete.'
      uk: 'Французьке запозичення від parler — «говорити», наголос на останньому складі. Це загальне слово, і кожна країна заповнює його своїм іменем: у Німеччини це der Bundestag нижче, у федеральної землі — der Landtag, у ЄС — das Europäische Parlament. Звороти: ins Parlament gewählt werden, im Parlament sitzen, das Parlament auflösen. Прикметник — parlamentarisch, а депутат — der Abgeordnete.'

  - de: Bundestag
    ipa: "ˈbʊndəsˌtaːk"
    pos: noun
    gender: m
    plural: "die Bundestage"
    cards: recognition
    en: the elected parliament of the Federal Republic of Germany, sitting in Berlin
    ru: избираемый парламент Федеративной Республики Германия, заседающий в Берлине
    uk: обираний парламент Федеративної Республіки Німеччина, що засідає в Берліні
    example_de: Im Bundestag sitzen mehrere Parteien.
    example_en: Several parties sit in the Bundestag.
    example_ru: В бундестаге представлено несколько партий.
    example_uk: У бундестазі представлено кілька партій.
    note:
      en: 'The -tag here is not the day but an old word for an assembly, the same element as in der Landtag and der Reichstag; the Reichstag today is the name of the building the Bundestag sits in, not of the body inside it. The final g is devoiced to k. It elects the Bundeskanzler above, and its members are die Abgeordneten. The chamber where the Bundesländer have their say is der Bundesrat, a word that means something else again in Switzerland.'
      ru: '-tag здесь не «день», а старое слово для собрания — тот же элемент, что в der Landtag и der Reichstag; Reichstag сегодня — название здания, в котором заседает бундестаг, а не самого органа. Конечное g оглушается в k. Бундестаг избирает Bundeskanzler выше, а его члены — die Abgeordneten. Палата, где высказываются земли, называется der Bundesrat — слово, которое в Швейцарии значит совсем другое.'
      uk: '-tag тут не «день», а давнє слово для зібрання — той самий елемент, що в der Landtag і der Reichstag; Reichstag сьогодні — назва будівлі, у якій засідає бундестаг, а не самого органу. Кінцеве g оглушується в k. Бундестаг обирає Bundeskanzler вище, а його члени — die Abgeordneten. Палата, де висловлюються землі, зветься der Bundesrat — слово, яке у Швейцарії означає зовсім інше.'

  - de: Bürgermeister
    ipa: "ˈbʏʁgɐˌmaɪ̯stɐ"
    pos: noun
    gender: m
    plural: "die Bürgermeister"
    cards: recognition
    en: the man at the head of a town or a village, elected by the people who live in it
    ru: мужчина во главе города или села, избранный теми, кто в нём живёт
    uk: чоловік на чолі міста або села, обраний тими, хто в ньому живе
    example_de: Der Bürgermeister eröffnet das neue Schwimmbad.
    example_en: The mayor is opening the new swimming pool.
    example_ru: Бургомистр открывает новый бассейн.
    example_uk: Бургомістр відкриває новий басейн.
    note:
      en: 'B1 der Bürger in the deck `verwaltung-behoerden-b1` plus der Meister, and that entry''s note already points at this compound as the place where the older sense of Bürger, the townsman, survives. In Germany the office is filled by direct election, which is what makes local campaigns visible in a way national ones are not. A large city has der Oberbürgermeister. Singular and plural are spelled alike. Switzerland says der Stadtpräsident, and some cantons der Ammann.'
      ru: 'der Bürger уровня B1 из колоды `verwaltung-behoerden-b1` плюс der Meister, и примечание к той записи уже указывает на это сложное слово как на место, где уцелело более старое значение Bürger — «горожанин». В Германии на эту должность избирают прямым голосованием, отчего местные кампании заметны так, как не бывают заметны общегосударственные. В большом городе есть der Oberbürgermeister. Единственное и множественное пишутся одинаково. Швейцария говорит der Stadtpräsident, а некоторые кантоны — der Ammann.'
      uk: 'der Bürger рівня B1 з колоди `verwaltung-behoerden-b1` плюс der Meister, і примітка до того запису вже вказує на це складне слово як на місце, де вціліло давніше значення Bürger — «містянин». У Німеччині на цю посаду обирають прямим голосуванням, через що місцеві кампанії помітні так, як не бувають помітні загальнодержавні. У великому місті є der Oberbürgermeister. Однина і множина пишуться однаково. Швейцарія каже der Stadtpräsident, а деякі кантони — der Ammann.'

  - de: Bürgermeisterin
    ipa: "ˈbʏʁgɐˌmaɪ̯stəʁɪn"
    pos: noun
    gender: f
    plural: "die Bürgermeisterinnen"
    cards: recognition
    en: the woman at the head of a town or a village
    ru: женщина во главе города или села
    uk: жінка на чолі міста або села
    example_de: Unsere Bürgermeisterin ist erst dreißig Jahre alt.
    example_en: Our mayor is only thirty years old.
    example_ru: Нашей главе города всего тридцать лет.
    example_uk: Нашій голові міста лише тридцять років.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n, and the stress stays where the masculine put it. Local notices, election posters and the town website use whichever form fits the person, and a call for candidates writes Bürgermeister/-in. The office itself is das Bürgermeisteramt, and the building it sits in is das Rathaus.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается, ударение остаётся там же, где в мужской форме. Местные объявления, предвыборные плакаты и городской сайт берут ту форму, что подходит человеку, а объявление о выборах пишет Bürgermeister/-in. Сама должность — das Bürgermeisteramt, а здание, где она помещается, — das Rathaus.'
      uk: 'Звичайна моція на -in, у множині n подвоюється, наголос лишається там само, де в чоловічій формі. Місцеві оголошення, передвиборчі плакати і міський сайт беруть ту форму, що пасує людині, а оголошення про вибори пише Bürgermeister/-in. Сама посада — das Bürgermeisteramt, а будівля, де вона міститься, — das Rathaus.'

  - de: Gemeinde
    ipa: "gəˈmaɪ̯ndə"
    pos: noun
    gender: f
    plural: "die Gemeinden"
    cards: recognition
    en: the smallest unit of local government, a village or a town with a council of its own; also the congregation of a church
    ru: наименьшая единица местного самоуправления — село или город со своим советом; а также приход церкви
    uk: найменша одиниця місцевого самоврядування — село або місто зі своєю радою; а також парафія церкви
    example_de: Die Gemeinde baut einen neuen Kindergarten.
    example_en: The municipality is building a new nursery school.
    example_ru: Община строит новый детский сад.
    example_uk: Громада будує новий дитячий садок.
    note:
      en: 'Related to gemein and gemeinsam, and both senses come from the same idea of what is held in common. The civic one is the layer under the Bundesland above, and it is the one that owns the school building, the swimming pool and the rubbish collection: der Gemeinderat, die Gemeindeverwaltung, die Gemeindesteuer. Keep it apart from A2 das Amt in the deck `aemter-dienstleistungen`, which is the office you walk into rather than the body that owns it. The church sense stays alive in die evangelische Gemeinde.'
      ru: 'Родственно gemein и gemeinsam, и оба значения идут от одной мысли — о том, что держат сообща. Гражданское значение — слой под Bundesland выше, и именно ему принадлежат школьное здание, бассейн и вывоз мусора: der Gemeinderat, die Gemeindeverwaltung, die Gemeindesteuer. Не смешивайте с das Amt уровня A2 из колоды `aemter-dienstleistungen`: то учреждение, куда приходят, а не орган, которому оно принадлежит. Церковное значение живо в обороте die evangelische Gemeinde.'
      uk: 'Споріднене з gemein і gemeinsam, і обидва значення йдуть від однієї думки — про те, що тримають спільно. Громадянське значення — шар під Bundesland вище, і саме йому належать шкільна будівля, басейн і вивезення сміття: der Gemeinderat, die Gemeindeverwaltung, die Gemeindesteuer. Не змішуйте з das Amt рівня A2 з колоди `aemter-dienstleistungen`: то установа, куди приходять, а не орган, якому вона належить. Церковне значення живе у звороті die evangelische Gemeinde.'

  # --- Wählen, Parteien, Positionen ---
  - de: Wahl
    ipa: "ˈvaːl"
    pos: noun
    gender: f
    plural: "die Wahlen"
    cards: recognition
    en: the choosing of representatives by vote; and, quite generally, the act of taking one thing rather than another
    ru: избрание представителей голосованием; а в общем смысле — сам акт предпочтения одного другому
    uk: обрання представників голосуванням; а в загальному сенсі — сам акт віддання переваги одному перед іншим
    example_de: Die Wahl findet im Herbst statt.
    example_en: The election takes place in the autumn.
    example_ru: Выборы состоятся осенью.
    example_uk: Вибори відбудуться восени.
    note:
      en: 'The noun to A2 wählen in the deck `verben-handlungen-a2-2`, whose card already carries all three jobs of that verb. Which sense is meant shows in the number: the political one lives in the plural as well as the singular — die Wahlen, zur Wahl gehen, die Bundestagswahl — while the everyday one stays singular, die Wahl haben, keine andere Wahl haben, eine gute Wahl. Compounds: das Wahlrecht, der Wahlkampf, das Wahllokal, der Wähler.'
      ru: 'Существительное к wählen уровня A2 из колоды `verben-handlungen-a2-2`, карточка которого уже несёт все три значения этого глагола. Какое значение имеется в виду, видно по числу: политическое живёт и во множественном — die Wahlen, zur Wahl gehen, die Bundestagswahl, — а обиходное остаётся в единственном: die Wahl haben, keine andere Wahl haben, eine gute Wahl. Сложные слова: das Wahlrecht, der Wahlkampf, das Wahllokal, der Wähler.'
      uk: 'Іменник до wählen рівня A2 з колоди `verben-handlungen-a2-2`, картка якого вже несе всі три значення цього дієслова. Яке значення мається на увазі, видно з числа: політичне живе і в множині — die Wahlen, zur Wahl gehen, die Bundestagswahl, — а побутове лишається в однині: die Wahl haben, keine andere Wahl haben, eine gute Wahl. Складні слова: das Wahlrecht, der Wahlkampf, das Wahllokal, der Wähler.'

  - de: Kandidat
    ipa: "kandiˈdaːt"
    pos: noun
    gender: m
    plural: "die Kandidaten"
    cards: recognition
    en: a man who has put himself forward for an office or a place and is waiting to be chosen
    ru: мужчина, выдвинувший себя на должность или на место и ожидающий, что его выберут
    uk: чоловік, який висунув себе на посаду чи на місце й чекає, що його оберуть
    example_de: Für dieses Amt gibt es nur einen Kandidaten.
    example_en: There is only one candidate for this office.
    example_ru: На эту должность есть только один кандидат.
    example_uk: На цю посаду є лише один кандидат.
    note:
      en: 'A weak masculine, so every case but the nominative singular takes -en, as the example shows: den Kandidaten, dem Kandidaten, des Kandidaten, die Kandidaten — the same pattern as A2 der Polizist in the deck `berufe-a2` and B1 der Fotograf in the deck `medien-digital-b1`. From Latin candidatus, dressed in white, after the toga a Roman office-seeker wore. It reaches well beyond politics: a job interview and a television quiz both have Kandidaten. The feminine die Kandidatin is regular.'
      ru: 'Слабое существительное мужского рода: во всех падежах, кроме именительного единственного, окончание -en, что и видно в примере — den Kandidaten, dem Kandidaten, des Kandidaten, die Kandidaten, — тот же образец, что у der Polizist уровня A2 из колоды `berufe-a2` и der Fotograf уровня B1 из колоды `medien-digital-b1`. От латинского candidatus — «одетый в белое», по тоге римского соискателя должности. Слово далеко выходит за политику: Kandidaten есть и на собеседовании, и в телевикторине. Женская пара die Kandidatin образуется обычно.'
      uk: 'Слабкий іменник чоловічого роду: в усіх відмінках, крім називного однини, закінчення -en, що й видно з прикладу — den Kandidaten, dem Kandidaten, des Kandidaten, die Kandidaten, — той самий зразок, що в der Polizist рівня A2 з колоди `berufe-a2` і der Fotograf рівня B1 з колоди `medien-digital-b1`. Від латинського candidatus — «вбраний у біле», за тогою римського здобувача посади. Слово далеко виходить за політику: Kandidaten є і на співбесіді, і в телевікторині. Жіноча пара die Kandidatin твориться звичайно.'

  - de: Partei
    ipa: "paʁˈtaɪ̯"
    pos: noun
    gender: f
    plural: "die Parteien"
    cards: recognition
    en: an organised political group that puts up candidates for election; also either of the two sides to a contract or a dispute
    ru: организованная политическая группа, выдвигающая кандидатов на выборах; а также каждая из двух сторон договора или спора
    uk: організована політична група, що висуває кандидатів на виборах; а також кожна зі сторін договору або суперечки
    example_de: Er ist seit zwanzig Jahren in dieser Partei.
    example_en: He has been in this party for twenty years.
    example_ru: Он состоит в этой партии двадцать лет.
    example_uk: Він перебуває в цій партії двадцять років.
    note:
      en: 'Stress on the last syllable, plural in -en. Political chunks: in eine Partei eintreten, die Partei wechseln, das Parteiprogramm, die Regierungspartei. The legal sense is the older one and is alive in every contract and every courtroom: die Vertragsparteien, beide Parteien, and the idiom Partei ergreifen means to take somebody''s side. Do not use it for a gathering with music — that is die Party, an English loan spelled differently.'
      ru: 'Ударение на последнем слоге, множественное на -en. Политические обороты: in eine Partei eintreten, die Partei wechseln, das Parteiprogramm, die Regierungspartei. Юридическое значение старше и живёт в каждом договоре и в каждом зале суда: die Vertragsparteien, beide Parteien, — а оборот Partei ergreifen значит «встать на чью-либо сторону». Не берите слово для вечеринки с музыкой: это die Party, английское заимствование с другим написанием.'
      uk: 'Наголос на останньому складі, множина на -en. Політичні звороти: in eine Partei eintreten, die Partei wechseln, das Parteiprogramm, die Regierungspartei. Юридичне значення давніше і живе в кожному договорі та в кожній залі суду: die Vertragsparteien, beide Parteien, — а зворот Partei ergreifen означає «стати на чийсь бік». Не беріть слово для вечірки з музикою: це die Party, англійське запозичення з іншим написанням.'

  - de: Politik
    ipa: "poliˈtiːk"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: everything to do with governing a state, taken as one field; also the line an organisation has decided to follow
    ru: всё, что связано с управлением государством, взятое как одна область; а также линия, которой решила держаться организация
    uk: усе, що пов’язане з керуванням державою, узяте як одна галузь; а також лінія, якої вирішила триматися організація
    example_de: Für Politik hat er sich nie interessiert.
    example_en: He has never been interested in politics.
    example_ru: Политикой он никогда не интересовался.
    example_uk: Політикою він ніколи не цікавився.
    note:
      en: 'Feminine, uncountable, stress on the last syllable. The second sense is worth noticing, because English splits it off as a separate word: die Politik der Regierung, die Preispolitik einer Firma, die Informationspolitik einer Schule — a course of action decided on and stuck to. Chunks: in die Politik gehen, Politik machen, die Innenpolitik and die Außenpolitik. The person is der Politiker, next, and the adjective politisch below; both move the stress back.'
      ru: 'Женский род, неисчисляемое, ударение на последнем слоге. Второе значение стоит заметить: die Politik der Regierung, die Preispolitik einer Firma, die Informationspolitik einer Schule — избранный и выдерживаемый курс. Обороты: in die Politik gehen, Politik machen, die Innenpolitik и die Außenpolitik. Человек — der Politiker, следующая запись, прилагательное — politisch ниже; в обоих ударение переезжает назад.'
      uk: 'Жіночий рід, незлічуване, наголос на останньому складі. Друге значення варто помітити: die Politik der Regierung, die Preispolitik einer Firma, die Informationspolitik einer Schule — обраний і витримуваний курс. Звороти: in die Politik gehen, Politik machen, die Innenpolitik і die Außenpolitik. Людина — der Politiker, наступний запис, прикметник — politisch нижче; в обох наголос переїжджає назад.'

  - de: Politiker
    ipa: "poˈliːtikɐ"
    pos: noun
    gender: m
    plural: "die Politiker"
    cards: recognition
    en: a man who does politics as his occupation, whatever office he does or does not hold
    ru: мужчина, для которого политика — занятие, независимо от того, занимает ли он какую-либо должность
    uk: чоловік, для якого політика — заняття, незалежно від того, чи обіймає він якусь посаду
    example_de: Der Politiker antwortete auf keine einzige Frage.
    example_en: The politician did not answer a single question.
    example_ru: Политик не ответил ни на один вопрос.
    example_uk: Політик не відповів на жодне питання.
    note:
      en: 'The stress moves off the ending of die Politik above onto -li-. Singular and plural are spelled alike. The word says nothing about rank: a Minister is a Politiker, so is a member of the Bundestag, and so is somebody who has only ever sat on a Gemeinderat. In German it carries a faint edge of distrust in everyday speech, which is why a person who wants to sound plainer says er ist in der Politik. The feminine is die Politikerin, the next entry.'
      ru: 'Ударение уходит с окончания die Politik выше на -li-. Единственное и множественное пишутся одинаково. О ранге слово не говорит ничего: Politiker — и министр, и депутат бундестага, и тот, кто всю жизнь просидел в Gemeinderat. В обиходной речи у слова есть лёгкий оттенок недоверия, поэтому желающий выразиться нейтральнее скажет er ist in der Politik. Женская пара — die Politikerin, следующая запись.'
      uk: 'Наголос відходить із закінчення die Politik вище на -li-. Однина і множина пишуться однаково. Про ранг слово не каже нічого: Politiker — і міністр, і депутат бундестагу, і той, хто все життя просидів у Gemeinderat. У побутовому мовленні в слова є легкий відтінок недовіри, тому той, хто хоче висловитися нейтральніше, скаже er ist in der Politik. Жіноча пара — die Politikerin, наступний запис.'

  - de: Politikerin
    ipa: "poˈliːtikəʁɪn"
    pos: noun
    gender: f
    plural: "die Politikerinnen"
    cards: recognition
    en: a woman who does politics as her occupation
    ru: женщина, для которой политика — занятие
    uk: жінка, для якої політика — заняття
    example_de: Diese Politikerin kenne ich aus dem Fernsehen.
    example_en: I know this politician from television.
    example_ru: Эту женщину-политика я знаю по телевидению.
    example_uk: Цю політикиню я знаю з телебачення.
    note:
      en: 'Regular Movierung with -in, plural with a doubled n. Public German has settled on naming both where the group is mixed, so a speech opens liebe Politikerinnen und Politiker and a newspaper writes die Politikerinnen und Politiker der Partei; the masculine plural alone still stands where the text is short. The stress is the same as in the masculine.'
      ru: 'Обычное мовирование на -in, во множественном n удваивается. Публичный немецкий утвердил называние обеих форм, когда группа смешанная: речь начинается liebe Politikerinnen und Politiker, а газета пишет die Politikerinnen und Politiker der Partei; одно мужское множественное остаётся там, где текст короток. Ударение то же, что в мужской форме.'
      uk: 'Звичайна моція на -in, у множині n подвоюється. Публічна німецька утвердила називання обох форм, коли група змішана: промова починається liebe Politikerinnen und Politiker, а газета пише die Politikerinnen und Politiker der Partei; сама чоловіча множина лишається там, де текст короткий. Наголос той самий, що в чоловічій формі.'

  - de: politisch
    ipa: "poˈliːtɪʃ"
    pos: adj
    cards: recognition
    en: having to do with the governing of a country and with who gets to decide in it
    ru: относящийся к управлению страной и к тому, кто в ней решает
    uk: що стосується керування країною і того, хто в ній вирішує
    example_de: Über politische Themen reden wir am Tisch nicht.
    example_en: We do not discuss political topics at the table.
    example_ru: О политических темах мы за столом не говорим.
    example_uk: Про політичні теми ми за столом не говоримо.
    note:
      en: 'Same stress as der Politiker above. Chunks: politische Bildung, ein politischer Flüchtling, aus politischen Gründen, sich politisch engagieren. The German word stays close to the state and to public argument, so where English calls an office manoeuvre political, German reaches for taktisch or diplomatisch instead. The negative is unpolitisch, said of a person who keeps out of it.'
      ru: 'Ударение то же, что у der Politiker выше. Обороты: politische Bildung, ein politischer Flüchtling, aus politischen Gründen, sich politisch engagieren. Немецкое слово держится государства и публичного спора, поэтому там, где по-английски «политическим» назовут манёвр в конторе, немец скажет taktisch или diplomatisch. Отрицание — unpolitisch, о человеке, который держится в стороне.'
      uk: 'Наголос той самий, що в der Politiker вище. Звороти: politische Bildung, ein politischer Flüchtling, aus politischen Gründen, sich politisch engagieren. Німецьке слово тримається держави і публічної суперечки, тому там, де англійською «політичним» назвуть маневр у конторі, німець скаже taktisch або diplomatisch. Заперечення — unpolitisch, про людину, яка тримається осторонь.'

  - de: konservativ
    ipa: "kɔnzɛʁvaˈtiːf"
    pos: adj
    cards: recognition
    en: wanting to keep what has proved itself instead of changing it
    ru: желающий сохранить то, что себя оправдало, вместо того чтобы это менять
    uk: що прагне зберегти те, що себе виправдало, замість того щоб це змінювати
    example_de: In dieser Frage denkt er sehr konservativ.
    example_en: On this question he thinks very conservatively.
    example_ru: В этом вопросе он мыслит очень консервативно.
    example_uk: У цьому питанні він мислить дуже консервативно.
    note:
      en: 'Stress on the last syllable, and the v there is spoken as f, as in every adjective ending in -iv. It reaches beyond politics: konservative Kleidung is sober dress, eine konservative Schätzung is a cautious estimate, and in medicine eine konservative Behandlung means treating without an operation. In German politics the label belongs to the CDU and the CSU, and liberal below marks a different position, not the opposite one.'
      ru: 'Ударение на последнем слоге, а v там звучит как f — как во всяком прилагательном на -iv. Слово выходит за политику: konservative Kleidung — сдержанная одежда, eine konservative Schätzung — осторожная оценка, а в медицине eine konservative Behandlung значит «лечение без операции». В немецкой политике ярлык принадлежит CDU и CSU, а liberal ниже обозначает другую позицию, а не противоположную.'
      uk: 'Наголос на останньому складі, а v там звучить як f — як у кожному прикметнику на -iv. Слово виходить за політику: konservative Kleidung — стримане вбрання, eine konservative Schätzung — обережна оцінка, а в медицині eine konservative Behandlung означає «лікування без операції». У німецькій політиці ярлик належить CDU і CSU, а liberal нижче позначає іншу позицію, а не протилежну.'

  - de: liberal
    ipa: "libeˈʁaːl"
    pos: adj
    cards: recognition
    en: for the widest possible freedom of the individual, against rules the state does not have to impose
    ru: стоящий за максимально широкую свободу отдельного человека и против правил, которых государство могло бы не вводить
    uk: що стоїть за якнайширшу свободу окремої людини і проти правил, яких держава могла б не запроваджувати
    example_de: Die Schule hat sehr liberale Regeln.
    example_en: The school has very liberal rules.
    example_ru: В этой школе очень либеральные правила.
    example_uk: У цій школі дуже ліберальні правила.
    note:
      en: 'Stress on the last syllable, with a long a. In German party politics it names the position of the FDP; in ordinary speech it describes an upbringing, a school or a house rule that leaves much open, eine liberale Erziehung. It is not a word about money and does not mean generous — that is großzügig. The noun is der Liberalismus, and die Freiheit below is the value the whole position is built on.'
      ru: 'Ударение на последнем слоге, a долгое. В немецкой партийной политике так обозначают позицию FDP; в обычной речи слово описывает воспитание, школу или домашний порядок, где многое оставлено на усмотрение: eine liberale Erziehung. О деньгах слово не говорит и «щедрый» не значит — это großzügig. Существительное — der Liberalismus, а die Freiheit ниже — ценность, на которой вся позиция и построена.'
      uk: 'Наголос на останньому складі, a довге. У німецькій партійній політиці так позначають позицію FDP; у звичайному мовленні слово описує виховання, школу або домашній лад, де багато що лишено на розсуд: eine liberale Erziehung. Про гроші слово не каже і «щедрий» не означає — це großzügig. Іменник — der Liberalismus, а die Freiheit нижче — цінність, на якій уся позиція і побудована.'

  - de: national
    ipa: "natsi̯oˈnaːl"
    pos: adj
    cards: recognition
    en: belonging to one nation as a whole, as against one region of it or the world outside
    ru: относящийся к нации в целом, в противопоставлении отдельной её области или внешнему миру
    uk: що стосується нації в цілому, на противагу окремій її частині або зовнішньому світові
    example_de: Der dritte Oktober ist ein nationaler Feiertag.
    example_en: The third of October is a national holiday.
    example_ru: Третье октября — национальный праздник.
    example_uk: Третє жовтня — національне свято.
    note:
      en: 'Stress on the last syllable, and -ti- is spoken tsi̯, exactly as in A2 international in the deck `eigenschaften-dinge-a2`, which is this word with a prefix. Chunks: die Nationalmannschaft, die Nationalhymne, der Nationalfeiertag, die nationale Wirtschaft. German history makes the bare word careful company: nationalsozialistisch is a separate and heavy term, and a writer who means only within this country often prefers bundesweit or landesweit.'
      ru: 'Ударение на последнем слоге, а -ti- звучит как tsi̯ — ровно как в international уровня A2 из колоды `eigenschaften-dinge-a2`, то есть в этом же слове с приставкой. Обороты: die Nationalmannschaft, die Nationalhymne, der Nationalfeiertag, die nationale Wirtschaft. Немецкая история делает голое слово осторожным соседом: nationalsozialistisch — отдельный и тяжёлый термин, и тот, кто имеет в виду только «в пределах страны», часто предпочитает bundesweit или landesweit.'
      uk: 'Наголос на останньому складі, а -ti- звучить як tsi̯ — точно як в international рівня A2 з колоди `eigenschaften-dinge-a2`, тобто в цьому ж слові з префіксом. Звороти: die Nationalmannschaft, die Nationalhymne, der Nationalfeiertag, die nationale Wirtschaft. Німецька історія робить голе слово обережним сусідом: nationalsozialistisch — окремий і важкий термін, і той, хто має на увазі лише «у межах країни», часто воліє bundesweit або landesweit.'

  # --- Worum gestritten wird ---
  - de: Freiheit
    ipa: "ˈfʁaɪ̯haɪ̯t"
    pos: noun
    gender: f
    plural: "die Freiheiten"
    cards: recognition
    en: the condition of not being forced or held; and each of the particular liberties a state guarantees
    ru: состояние, в котором человека не принуждают и не держат; а также каждая из отдельных свобод, которые гарантирует государство
    uk: стан, у якому людину не примушують і не тримають; а також кожна з окремих свобод, які гарантує держава
    example_de: Die Freiheit der Presse steht im Grundgesetz.
    example_en: Freedom of the press is written into the constitution.
    example_ru: Свобода печати записана в конституции.
    example_uk: Свобода преси записана в конституції.
    note:
      en: 'A2 frei in the deck `termine-zeit` plus -heit, and every noun in -heit is feminine. The number carries the sense: the singular is the condition — in Freiheit leben, die Freiheit des Einzelnen — and the plural names particular rights, die Grundfreiheiten, or liberties somebody allows themselves, sich Freiheiten nehmen. German usually builds a compound for a named one: die Meinungsfreiheit, die Pressefreiheit, die Reisefreiheit. The chunk sich die Freiheit nehmen, etwas zu tun is fixed.'
      ru: 'frei уровня A2 из колоды `termine-zeit` плюс -heit, а всякое существительное на -heit женского рода. Значение несёт число: единственное — состояние (in Freiheit leben, die Freiheit des Einzelnen), множественное называет отдельные права (die Grundfreiheiten) или вольности, которые кто-то себе позволяет (sich Freiheiten nehmen). Для названной свободы немецкий обычно строит сложное слово: die Meinungsfreiheit, die Pressefreiheit, die Reisefreiheit. Оборот sich die Freiheit nehmen, etwas zu tun устойчив.'
      uk: 'frei рівня A2 з колоди `termine-zeit` плюс -heit, а кожен іменник на -heit жіночого роду. Значення несе число: однина — стан (in Freiheit leben, die Freiheit des Einzelnen), множина називає окремі права (die Grundfreiheiten) або вільності, які хтось собі дозволяє (sich Freiheiten nehmen). Для названої свободи німецька зазвичай будує складне слово: die Meinungsfreiheit, die Pressefreiheit, die Reisefreiheit. Зворот sich die Freiheit nehmen, etwas zu tun усталений.'

  - de: Friede
    ipa: "ˈfʁiːdə"
    pos: noun
    gender: m
    plural: "—"
    cards: recognition
    en: the condition of not being at war, and the quiet that goes with it
    ru: состояние, в котором нет войны, и связанный с ним покой
    uk: стан, у якому немає війни, і пов’язаний із ним спокій
    example_de: Der Friede zwischen den beiden Ländern hielt nur zwei Jahre.
    example_en: The peace between the two countries lasted only two years.
    example_ru: Мир между этими двумя странами продержался всего два года.
    example_uk: Мир між цими двома країнами протримався лише два роки.
    note:
      en: 'Two forms of one word stand side by side and Duden records both: der Friede is the older and shorter one, which is what the Wortliste lists, and der Frieden is the commoner today. The genitive is des Friedens either way, so the -n reappears as soon as the word is declined. Everything fixed is built on the longer form: Frieden schließen, in Frieden leben, der Friedensvertrag, der Friedensnobelpreis. Uncountable, masculine, and the adjective is friedlich. Its opposite is der Krieg, the next entry.'
      ru: 'Две формы одного слова стоят рядом, и Duden фиксирует обе: der Friede — более старая и короткая, именно её даёт Wortliste, а der Frieden сегодня употребительнее. Родительный в обоих случаях des Friedens, так что -n возвращается, едва слово начинает склоняться. Всё устойчивое построено на длинной форме: Frieden schließen, in Frieden leben, der Friedensvertrag, der Friedensnobelpreis. Неисчисляемое, мужского рода, прилагательное — friedlich. Противоположность — der Krieg, следующая запись.'
      uk: 'Дві форми одного слова стоять поряд, і Duden фіксує обидві: der Friede — давніша й коротша, саме її подає Wortliste, а der Frieden сьогодні вживаніший. Родовий в обох випадках des Friedens, тож -n повертається, щойно слово починає відмінюватися. Усе усталене побудоване на довгій формі: Frieden schließen, in Frieden leben, der Friedensvertrag, der Friedensnobelpreis. Незлічуване, чоловічого роду, прикметник — friedlich. Протилежність — der Krieg, наступний запис.'

  - de: Krieg
    ipa: "ˈkʁiːk"
    pos: noun
    gender: m
    plural: "die Kriege"
    cards: recognition
    en: armed fighting between states or between groups inside one, carried on over a stretch of time
    ru: вооружённая борьба между государствами или между группами внутри одного, ведущаяся на протяжении времени
    uk: збройна боротьба між державами або між групами всередині однієї, що триває протягом часу
    example_de: Der Krieg dauerte fast sechs Jahre.
    example_en: The war lasted almost six years.
    example_ru: Война длилась почти шесть лет.
    example_uk: Війна тривала майже шість років.
    note:
      en: 'The ie is one long i, and the final g is devoiced to k. Chunks: Krieg führen, im Krieg sein, der Zweite Weltkrieg, der Bürgerkrieg, die Nachkriegszeit. Its opposite is der Friede above. Around it stand der Soldat, a weak masculine, die Armee for a country''s forces and, for Germany specifically, die Bundeswehr; what a war leaves behind is der Frieden or, where nothing is settled, der Waffenstillstand.'
      ru: 'Ie — одно долгое i, а конечное g оглушается в k. Обороты: Krieg führen, im Krieg sein, der Zweite Weltkrieg, der Bürgerkrieg, die Nachkriegszeit. Противоположность — der Friede выше. Рядом стоят der Soldat — слабое существительное мужского рода, die Armee — вооружённые силы страны и, о Германии, die Bundeswehr; то, чем война кончается, — der Frieden или, когда ничего не решено, der Waffenstillstand.'
      uk: 'Ie — одне довге i, а кінцеве g оглушується в k. Звороти: Krieg führen, im Krieg sein, der Zweite Weltkrieg, der Bürgerkrieg, die Nachkriegszeit. Протилежність — der Friede вище. Поряд стоять der Soldat — слабкий іменник чоловічого роду, die Armee — збройні сили країни і, про Німеччину, die Bundeswehr; те, чим війна кінчається, — der Frieden або, коли нічого не вирішено, der Waffenstillstand.'

  - de: Protest
    ipa: "pʁoˈtɛst"
    pos: noun
    gender: m
    plural: "die Proteste"
    cards: recognition
    en: an open, public statement that something is wrong, usually made by many people at once
    ru: открытое, публичное заявление о том, что нечто неправильно, — обычно от многих людей сразу
    uk: відкрита, публічна заява про те, що щось неправильне, — зазвичай від багатьох людей одразу
    example_de: Gegen die neuen Preise gab es großen Protest.
    example_en: There was a great deal of protest against the new prices.
    example_ru: Против новых цен был большой протест.
    example_uk: Проти нових цін був великий протест.
    note:
      en: 'The noun to B1 protestieren in the deck `verben-kommunikation-ausdruck-b1`, whose note already names it; what the protest is against follows gegen plus the accusative, exactly as with the verb. Chunks: aus Protest, unter Protest, die Protestaktion. The event itself is die Demonstration, shortened to die Demo in speech, while B1 die Versammlung in the deck `gesellschaft-zusammenleben` is a meeting called in order to talk.'
      ru: 'Существительное к protestieren уровня B1 из колоды `verben-kommunikation-ausdruck-b1`, примечание к которому уже его называет; предмет протеста вводится через gegen с винительным — ровно как у глагола. Обороты: aus Protest, unter Protest, die Protestaktion. Само мероприятие — die Demonstration, в речи die Demo, а die Versammlung уровня B1 из колоды `gesellschaft-zusammenleben` — собрание, созванное для разговора.'
      uk: 'Іменник до protestieren рівня B1 з колоди `verben-kommunikation-ausdruck-b1`, примітка до якого вже його називає; предмет протесту вводиться через gegen зі знахідним — точно як у дієслова. Звороти: aus Protest, unter Protest, die Protestaktion. Сам захід — die Demonstration, у мовленні die Demo, а die Versammlung рівня B1 з колоди `gesellschaft-zusammenleben` — зібрання, скликане для розмови.'

  - de: Reform
    ipa: "ʁeˈfɔʁm"
    pos: noun
    gender: f
    plural: "die Reformen"
    cards: recognition
    en: a deliberate change to a system, worked out and carried through from inside it to make it work better
    ru: намеренное изменение системы, продуманное и проведённое изнутри неё, чтобы она работала лучше
    uk: навмисна зміна системи, продумана і проведена зсередини неї, щоб вона працювала краще
    example_de: Die Reform der Schulen beginnt im nächsten Jahr.
    example_en: The reform of the schools begins next year.
    example_ru: Реформа школ начинается в следующем году.
    example_uk: Реформа шкіл починається наступного року.
    note:
      en: 'Feminine, stress on the last syllable, and no -e at the end — die Reform, not die Reforme; the plural is die Reformen. A2 ändern in the deck `verben-handlungen-a2-1` is any change at all, while a Reform is planned, argued over and put through by an institution. Chunks: eine Reform durchführen, die Rentenreform, die Gesundheitsreform, and die Rechtschreibreform of 1996, which is the one every German dictionary still refers to. The verb is reformieren.'
      ru: 'Женский род, ударение на последнем слоге, и никакого -e на конце: die Reform, а не die Reforme; множественное — die Reformen. ändern уровня A2 из колоды `verben-handlungen-a2-1` — любое изменение вообще, а Reform спланирована, обсуждена в спорах и проведена учреждением. Обороты: eine Reform durchführen, die Rentenreform, die Gesundheitsreform, а также die Rechtschreibreform 1996 года, на которую до сих пор ссылается любой немецкий словарь. Глагол — reformieren.'
      uk: 'Жіночий рід, наголос на останньому складі, і жодного -e в кінці: die Reform, а не die Reforme; множина — die Reformen. ändern рівня A2 з колоди `verben-handlungen-a2-1` — будь-яка зміна взагалі, а Reform спланована, обговорена в суперечках і проведена установою. Звороти: eine Reform durchführen, die Rentenreform, die Gesundheitsreform, а також die Rechtschreibreform 1996 року, на яку досі посилається будь-який німецький словник. Дієслово — reformieren.'
