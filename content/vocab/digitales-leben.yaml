id: digitales-leben
title_de: "Digitales Leben"
title_en: "Digital life"
title_ru: "Цифровая жизнь"
title_uk: "Цифрове життя"
level: B1
# B1.11 is a genre unit: it owns no grammar point, so the deck carries the whole
# weight of what is new here — the words an Anleitung, a Hilfetext and an
# Online-Formular are made of, plus what you need to say how much of your day a
# screen gets.
#
# Three constraints shaped the list.
#
# 1. The frozen contract excludes IT-specialist vocabulary, so every headword is
#    a word a library user, not an administrator, has to read: Taste, Feld,
#    Netz, Akku, Kabel. Nothing about protocols, operating systems or hardware
#    beyond the plug at the end of the cable.
# 2. The everyday digital words the learner already owns are RECYCLED in the
#    article and in the notes below, never re-taught (the validator hard-fails a
#    headword living in two decks): Handy, Internet, schicken, senden
#    (kommunikation-medien, A2); Datei, online, speichern (digital-medien-a2);
#    Computer, Formular (schule-arbeit, A2); Gerät, Fehler
#    (einkaufen-reklamation, A2); funktionieren (haushalt-geraete, A1);
#    Bildschirm, Meldung, Medien (meinung-medien, B1.5); Verbindung, reagieren
#    (reisen-probleme, B1.8); anmelden, ausfüllen (aemter-dienstleistungen, A2);
#    benutzen (verben-handlungen-a2-1). Their slots went to the neighbour this
#    unit genuinely adds — nutzen beside benutzen, anklicken beside klicken,
#    ausdrucken beside drucken.
# 3. Every headword is on the Goethe-B1 Wortliste and owned by no other deck,
#    checked with
#    `bun scripts/coverage.ts B1 --check-deck content/vocab/digitales-leben.yaml`.
#    No exceptions were needed, so unlike meinung-medien and
#    gesellschaft-zusammenleben this deck is fully manifest-clean.
#
# Tiering, decided once and never retrofitted: the 22 entries the unit actively
# teaches ship as `both`; the 16 below the divider are the receptive tail —
# language you must understand on a screen but are never asked to produce, and
# `cards: recognition` from the start because the direction is baked into the
# card id.
entries:
  # --- Core (cards: both by default) --------------------------------------
  # Reading a set of instructions, filling in a form, reporting a fault and
  # saying how much you use what. These the learner produces.

  - de: "Anleitung"
    ipa: "ˈanˌlaɪ̯tʊŋ"
    pos: noun
    gender: f
    plural: "die Anleitungen"
    en: "instructions, step-by-step guide"
    ru: "инструкция, руководство"
    uk: "інструкція, посібник"
    example_de: "In der Anleitung stehen alle Schritte in der richtigen Reihenfolge."
    example_en: "The instructions list every step in the right order."
    example_ru: "В инструкции все шаги перечислены в правильном порядке."
    example_uk: "В інструкції всі кроки перелічені в правильному порядку."
    note:
      en: "einer Anleitung folgen — and folgen takes the Dativ. From anleiten, to guide someone through something. On paper in a box it is usually die Bedienungsanleitung; on a screen just die Anleitung."
      ru: "einer Anleitung folgen — и folgen требует Dativ. От anleiten — «провести кого-то через что-то». На бумаге в коробке это обычно die Bedienungsanleitung, на экране — просто die Anleitung."
      uk: "einer Anleitung folgen — і folgen вимагає Dativ. Від anleiten — «провести когось через щось». На папері в коробці це зазвичай die Bedienungsanleitung, на екрані — просто die Anleitung."

  - de: "Schritt"
    ipa: "ˈʃʁɪt"
    pos: noun
    gender: m
    plural: "die Schritte"
    en: "step"
    ru: "шаг"
    uk: "крок"
    example_de: "Beim dritten Schritt ist bei mir nichts passiert."
    example_en: "At the third step nothing happened on my side."
    example_ru: "На третьем шаге у меня ничего не произошло."
    example_uk: "На третьому кроці в мене нічого не сталося."
    note:
      en: "Schritt für Schritt is the fixed phrase every set of instructions uses. The same word is a pace on foot: einen Schritt nach vorn. Der erste Schritt is also the first move in a plan."
      ru: "Schritt für Schritt — устойчивое выражение, на котором держится любая инструкция. То же слово — шаг ногой: einen Schritt nach vorn. Der erste Schritt — ещё и первый ход в плане."
      uk: "Schritt für Schritt — стале словосполучення, на якому тримається будь-яка інструкція. Те саме слово — крок ногою: einen Schritt nach vorn. Der erste Schritt — ще й перший хід у плані."

  - de: "Reihenfolge"
    ipa: "ˈʁaɪ̯ənˌfɔlgə"
    pos: noun
    gender: f
    plural: "die Reihenfolgen"
    en: "order, sequence"
    ru: "последовательность, порядок"
    uk: "послідовність, порядок"
    example_de: "Halten Sie bitte die Reihenfolge ein, sonst funktioniert es nicht."
    example_en: "Please keep to the sequence, otherwise it will not work."
    example_ru: "Пожалуйста, соблюдайте последовательность, иначе ничего не выйдет."
    example_uk: "Будь ласка, дотримуйтеся послідовності, інакше нічого не вийде."
    note:
      en: "die Reihe plus folgen: what follows what. in der richtigen Reihenfolge, in umgekehrter Reihenfolge. die Ordnung is tidiness in a room; this word is only about sequence."
      ru: "die Reihe плюс folgen: что за чем идёт. in der richtigen Reihenfolge, in umgekehrter Reihenfolge. die Ordnung — порядок как чистота в комнате; это слово только о последовательности."
      uk: "die Reihe плюс folgen: що за чим іде. in der richtigen Reihenfolge, in umgekehrter Reihenfolge. die Ordnung — порядок як лад у кімнаті; це слово лише про послідовність."

  - de: "Taste"
    ipa: "ˈtastə"
    pos: noun
    gender: f
    plural: "die Tasten"
    en: "key, button you press"
    ru: "клавиша, кнопка"
    uk: "клавіша, кнопка"
    example_de: "Drücken Sie zwei Sekunden lang die rechte Taste."
    example_en: "Press the right-hand button for two seconds."
    example_ru: "Нажмите правую кнопку и держите две секунды."
    example_uk: "Натисніть праву кнопку й тримайте дві секунди."
    note:
      en: "eine Taste drücken. On a keyboard, a phone or a washing machine panel. der Knopf is a knob you turn or a button on a coat; der Schlüssel only opens a door."
      ru: "eine Taste drücken. На клавиатуре, на телефоне, на панели стиральной машины. der Knopf — ручка, которую крутят, или пуговица на пальто; der Schlüssel открывает только дверь."
      uk: "eine Taste drücken. На клавіатурі, на телефоні, на панелі пральної машини. der Knopf — ручка, яку крутять, або ґудзик на пальті; der Schlüssel відчиняє лише двері."

  - de: "Feld"
    ipa: "ˈfɛlt"
    pos: noun
    gender: n
    plural: "die Felder"
    en: "field, box on a form"
    ru: "поле, графа в формуляре"
    uk: "поле, графа у формулярі"
    example_de: "Das Feld mit dem Stern darf nicht leer bleiben."
    example_en: "The box with the star must not be left empty."
    example_ru: "Графу со звёздочкой нельзя оставлять пустой."
    example_uk: "Графу із зірочкою не можна лишати порожньою."
    note:
      en: "ein Feld ausfüllen; ein Pflichtfeld is one you may not skip. Out of town the same word is a field of wheat, which is where the picture comes from: a fenced-off area."
      ru: "ein Feld ausfüllen; ein Pflichtfeld — обязательное для заполнения. За городом то же слово — поле с пшеницей, откуда и образ: огороженный участок."
      uk: "ein Feld ausfüllen; ein Pflichtfeld — обов'язкове для заповнення. За містом те саме слово — поле з пшеницею, звідки й образ: обгороджена ділянка."

  - de: "Zugang"
    ipa: "ˈtsuːˌgaŋ"
    pos: noun
    gender: m
    plural: "die Zugänge"
    en: "access (to a network, a building or an offer)"
    en_compact: "access"
    ru: "доступ (к сети, зданию или услуге)"
    uk: "доступ (до мережі, будівлі чи послуги)"
    example_de: "Ohne Ausweisnummer bekommen Sie keinen Zugang zur App."
    example_en: "Without a card number you will not get access to the app."
    example_ru: "Без номера билета доступ к приложению вы не получите."
    example_uk: "Без номера квитка доступу до застосунку ви не отримаєте."
    note:
      en: "Zugang zu + Dat. Built from zugehen, to go up to something. A physical entrance uses the same word: der Zugang zum Hof ist gesperrt."
      ru: "Zugang zu + Dat. От zugehen — «подойти к чему-то». О физическом входе то же слово: der Zugang zum Hof ist gesperrt."
      uk: "Zugang zu + Dat. Від zugehen — «підійти до чогось». Про фізичний вхід те саме слово: der Zugang zum Hof ist gesperrt."

  - de: "Akku"
    ipa: "ˈakʊ"
    pos: noun
    gender: m
    plural: "die Akkus"
    en: "rechargeable battery"
    ru: "аккумулятор"
    uk: "акумулятор"
    example_de: "Mein Akku ist schon am Mittag leer."
    example_en: "My battery is empty by midday."
    example_ru: "У меня аккумулятор садится уже к обеду."
    example_uk: "У мене акумулятор сідає вже до обіду."
    note:
      en: "Short for der Akkumulator, and the everyday form. The difference that matters: this one you charge again, die Batterie you throw away. Der Akku ist leer, der Akku lädt nicht."
      ru: "Сокращение от der Akkumulator и обычная форма в речи. Важное отличие: этот заряжают снова, а die Batterie выбрасывают. Der Akku ist leer, der Akku lädt nicht."
      uk: "Скорочення від der Akkumulator і звична форма в мовленні. Важлива відмінність: цей заряджають знову, а die Batterie викидають. Der Akku ist leer, der Akku lädt nicht."

  - de: "Kabel"
    ipa: "ˈkaːbl̩"
    pos: noun
    gender: n
    plural: "die Kabel"
    en: "cable, lead"
    ru: "кабель, провод"
    uk: "кабель, провід"
    example_de: "Am Kabel lädt das Handy noch, ohne Kabel nicht mehr."
    example_en: "On the lead the phone still charges, without it no longer."
    example_ru: "От провода телефон ещё заряжается, без него уже нет."
    example_uk: "Від проводу телефон ще заряджається, без нього вже ні."
    note:
      en: "Neuter, and the plural looks like the singular: die Kabel. das Ladekabel is the one for charging; der Stecker sits on its end."
      ru: "Средний род, множественное число совпадает с единственным: die Kabel. das Ladekabel — зарядный; der Stecker сидит на его конце."
      uk: "Середній рід, множина збігається з одниною: die Kabel. das Ladekabel — зарядний; der Stecker сидить на його кінці."

  - de: "Netz"
    ipa: "ˈnɛts"
    pos: noun
    gender: n
    plural: "die Netze"
    en: "network; mobile reception (the everyday word for WLAN and the internet too)"
    en_compact: "network; reception"
    ru: "сеть; связь (то же слово для вайфая и интернета)"
    uk: "мережа; зв'язок (те саме слово для вайфаю та інтернету)"
    example_de: "Im Keller habe ich kein Netz."
    example_en: "I have no reception in the basement."
    example_ru: "В подвале у меня нет связи."
    example_uk: "У підвалі в мене немає зв'язку."
    note:
      en: "kein Netz haben covers a dead phone signal, a dropped WLAN and no internet at once — German does not separate them in everyday speech. The oldest sense is still there: ein Netz zum Fischen."
      ru: "kein Netz haben покрывает сразу и пропавшую мобильную связь, и отвалившийся вайфай, и отсутствие интернета — в быту немецкий их не разделяет. Древнее значение никуда не делось: ein Netz zum Fischen."
      uk: "kein Netz haben покриває водночас і зниклий мобільний зв'язок, і відпалий вайфай, і відсутність інтернету — у побуті німецька їх не розділяє. Найдавніше значення нікуди не поділося: ein Netz zum Fischen."

  - de: "Technik"
    ipa: "ˈtɛçnɪk"
    pos: noun
    gender: f
    plural: "die Techniken"
    en: "technology, equipment; technique"
    ru: "техника, оборудование; приём"
    uk: "техніка, обладнання; прийом"
    example_de: "Mit der Technik im Büro komme ich gut zurecht."
    example_en: "I get on well with the equipment in the office."
    example_ru: "С техникой в офисе я справляюсь неплохо."
    example_uk: "З технікою в офісі я даю раду непогано."
    note:
      en: "In the sense of technology it stays singular; the plural die Techniken means single methods, eine Technik zum Auswendiglernen. The person who repairs it is der Techniker."
      ru: "В значении «техника вообще» слово остаётся в единственном числе; множественное die Techniken — это отдельные приёмы, eine Technik zum Auswendiglernen. Тот, кто чинит, — der Techniker."
      uk: "У значенні «техніка загалом» слово лишається в однині; множина die Techniken — це окремі прийоми, eine Technik zum Auswendiglernen. Той, хто лагодить, — der Techniker."

  - de: "folgen"
    ipa: "ˈfɔlgn̩"
    pos: verb
    praesens_3sg: "folgt"
    partizip2: "gefolgt"
    aux: sein
    valence: "+ Dat"
    en: "to follow, to go along with step by step"
    ru: "следовать, идти следом"
    uk: "прямувати слідом, дотримуватися"
    example_de: "Ich bin der Anleitung genau gefolgt."
    example_en: "I followed the instructions exactly."
    example_ru: "Я в точности следовал инструкции."
    example_uk: "Я точно дотримувався інструкції."
    note:
      en: "Perfekt with sein: Ich bin der Anleitung gefolgt. What you follow stands in the Dativ, with no preposition. Only in the sense of obeying does it take haben: Das Kind hat nicht gefolgt."
      ru: "Перфект с sein: Ich bin der Anleitung gefolgt. То, чему следуют, стоит в Dativ и без предлога. Только в значении «слушаться» берётся haben: Das Kind hat nicht gefolgt."
      uk: "Перфект із sein: Ich bin der Anleitung gefolgt. Те, чого дотримуються, стоїть у Dativ і без прийменника. Лише у значенні «слухатися» береться haben: Das Kind hat nicht gefolgt."

  - de: "klicken"
    ipa: "ˈklɪkn̩"
    pos: verb
    praesens_3sg: "klickt"
    partizip2: "geklickt"
    aux: haben
    valence: "auf + Akk"
    en: "to click"
    ru: "щёлкать, нажимать"
    uk: "клацати, натискати"
    example_de: "Klicken Sie auf das Symbol oben rechts."
    example_en: "Click the icon at the top right."
    example_ru: "Нажмите на значок в правом верхнем углу."
    example_uk: "Натисніть на значок у правому верхньому куті."
    note:
      en: "auf etwas klicken — with the preposition and the Akkusativ. The prefixed anklicken takes a plain object instead: das Feld anklicken. The noun is der Klick."
      ru: "auf etwas klicken — с предлогом и Akkusativ. Приставочный anklicken берёт прямое дополнение: das Feld anklicken. Существительное — der Klick."
      uk: "auf etwas klicken — із прийменником і Akkusativ. Префіксальний anklicken бере прямий додаток: das Feld anklicken. Іменник — der Klick."

  - de: "angeben"
    ipa: "ˈanˌgeːbn̩"
    pos: verb
    praesens_3sg: "gibt an"
    partizip2: "angegeben"
    aux: haben
    valence: "+ Akk"
    en: "to state, to enter on a form"
    ru: "указывать, вносить в формуляр"
    uk: "зазначати, вносити у формуляр"
    example_de: "Bitte geben Sie Ihre Telefonnummer an."
    example_en: "Please state your telephone number."
    example_ru: "Пожалуйста, укажите свой номер телефона."
    example_uk: "Будь ласка, зазначте свій номер телефону."
    note:
      en: "Separable and strong: gibt an, hat angegeben. geben hands something over; angeben names it in writing. The noun is die Angabe. Colloquially the same verb also means to show off."
      ru: "Отделяемая приставка, сильный глагол: gibt an, hat angegeben. geben — передать в руки, angeben — назвать письменно. Существительное — die Angabe. В разговорной речи этот же глагол значит «хвастаться»."
      uk: "Відокремлюваний префікс, сильне дієслово: gibt an, hat angegeben. geben — передати до рук, angeben — назвати письмово. Іменник — die Angabe. У розмовній мові це саме дієслово означає «хизуватися»."

  - de: "auswählen"
    ipa: "ˈaʊ̯sˌvɛːlən"
    pos: verb
    praesens_3sg: "wählt aus"
    partizip2: "ausgewählt"
    aux: haben
    valence: "+ Akk"
    en: "to select, to pick one from several"
    ru: "выбирать из нескольких"
    uk: "вибирати з кількох"
    example_de: "Wählen Sie bitte Ihr Geburtsjahr aus."
    example_en: "Please select your year of birth."
    example_ru: "Пожалуйста, выберите год рождения."
    example_uk: "Будь ласка, виберіть рік народження."
    note:
      en: "Separable and regular: wählt aus, hat ausgewählt. wählen alone covers voting and dialling a number; auswählen always means taking one out of a set that is already there — a list, a menu, a shelf."
      ru: "Отделяемая приставка, правильный глагол: wählt aus, hat ausgewählt. Один wählen — это и голосовать, и набирать номер; auswählen всегда значит взять одно из уже готового набора: списка, меню, полки."
      uk: "Відокремлюваний префікс, правильне дієслово: wählt aus, hat ausgewählt. Саме wählen — це й голосувати, і набирати номер; auswählen завжди означає взяти одне з уже готового набору: списку, меню, полиці."

  - de: "bedienen"
    ipa: "bəˈdiːnən"
    pos: verb
    praesens_3sg: "bedient"
    partizip2: "bedient"
    aux: haben
    valence: "+ Akk"
    en: "to operate, to work a machine; to serve a customer"
    ru: "управлять прибором; обслуживать посетителя"
    uk: "керувати приладом; обслуговувати відвідувача"
    example_de: "Die neue Kaffeemaschine ist leicht zu bedienen."
    example_en: "The new coffee machine is easy to operate."
    example_ru: "Новой кофемашиной легко управлять."
    example_uk: "Новою кавовою машиною легко керувати."
    note:
      en: "Inseparable, so no ge-: hat bedient. Both senses meet in die Bedienung, which is the waiter in a café and the controls on a device. Hence die Bedienungsanleitung."
      ru: "Неотделяемая приставка, поэтому без ge-: hat bedient. Оба значения сходятся в die Bedienung — это и официант в кафе, и управление прибором. Отсюда die Bedienungsanleitung."
      uk: "Невідокремлюваний префікс, тому без ge-: hat bedient. Обидва значення сходяться в die Bedienung — це й офіціант у кав'ярні, і керування приладом. Звідси die Bedienungsanleitung."

  - de: "einschalten"
    ipa: "ˈaɪ̯nˌʃaltn̩"
    pos: verb
    praesens_3sg: "schaltet ein"
    partizip2: "eingeschaltet"
    aux: haben
    valence: "+ Akk"
    en: "to switch on"
    ru: "включать"
    uk: "вмикати"
    example_de: "Schalten Sie das Gerät erst nach dem Laden wieder ein."
    example_en: "Switch the device back on only after charging."
    example_ru: "Включайте прибор снова только после зарядки."
    example_uk: "Вмикайте пристрій знову лише після заряджання."
    note:
      en: "Separable: schaltet ein, hat eingeschaltet. Its pair is ausschalten. In relaxed speech people say anmachen and ausmachen; an Anleitung keeps to einschalten."
      ru: "Отделяемая приставка: schaltet ein, hat eingeschaltet. Пара — ausschalten. В непринуждённой речи говорят anmachen и ausmachen; инструкция держится за einschalten."
      uk: "Відокремлюваний префікс: schaltet ein, hat eingeschaltet. Пара — ausschalten. У невимушеній мові кажуть anmachen і ausmachen; інструкція тримається einschalten."

  - de: "aufladen"
    ipa: "ˈaʊ̯fˌlaːdn̩"
    pos: verb
    praesens_3sg: "lädt auf"
    partizip2: "aufgeladen"
    aux: haben
    valence: "+ Akk"
    en: "to charge up"
    ru: "заряжать"
    uk: "заряджати"
