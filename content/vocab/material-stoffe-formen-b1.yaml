      uk: 'Слово завжди передбачає порівняння з тим, що мало бути senkrecht або waagerecht вище, — тому в ньому й чути нарікання. Вежа в Пізі німецькою der Schiefe Turm von Pisa. Переносно означає «не склалося»: etwas geht schief, eine schiefe Sache, jemanden schief ansehen — «косо дивитися на когось». Не змішуйте зі steil рівня B1 з колоди `natur-geografie-b1`: там ідеться про крутизну підйому, а не про перекіс.'

