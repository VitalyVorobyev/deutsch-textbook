      ru: 'Мужской род, во множественном умлаут, конечное d звучит как t. Это край плоской вещи, взятый снаружи: der Rand des Tellers, am Rand der Stadt, am Straßenrand. die Ecke уровня A1 из колоды `reisen-urlaub` — угол, где сходятся два края, а die Seite уровня A2 из колоды `dinge-sachen-a2` — целая сторона, а не её кромка. Переносно am Rande значит «мимоходом», randvoll — «до краёв», а etwas ist am Rande des Möglichen — «на пределе возможного».'
      uk: 'Чоловічий рід, у множині умлаут, кінцеве d звучить як t. Це край пласкої речі, узятий іззовні: der Rand des Tellers, am Rand der Stadt, am Straßenrand. die Ecke рівня A1 з колоди `reisen-urlaub` — ріг, де сходяться два краї, а die Seite рівня A2 з колоди `dinge-sachen-a2` — ціла сторона, а не її крайка. Переносно am Rande означає «мимохідь», randvoll — «по вінця», а etwas ist am Rande des Möglichen — «на межі можливого».'

