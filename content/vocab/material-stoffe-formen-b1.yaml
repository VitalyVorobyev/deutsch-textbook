      ru: 'От die Waage — весы, — коромысло которых стоит ровно, только когда они уравновешены; более короткое написание waagrecht столь же верно. Это пара к senkrecht выше, и учат их вместе, потому что кроссворд, бланк и инструкция по сборке называют их вместе. Латинский близнец — horizontal. Flach выше описывает всю поверхность, а это слово — направление одной линии.'
      uk: 'Від die Waage — терези, — коромисло яких стоїть рівно, лише коли вони зрівноважені; коротше написання waagrecht так само правильне. Це пара до senkrecht вище, і вчать їх разом, бо кросворд, бланк і інструкція зі складання називають їх разом. Латинський близнюк — horizontal. Flach вище описує всю поверхню, а це слово — напрямок однієї лінії.'

