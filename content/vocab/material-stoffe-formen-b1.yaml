      en: 'Masculine, and Duden records two plurals: die Bögen with the umlaut, which is the usual one for the curve, and die Bogen without it, which survives beside it and is the normal form for sheets of paper in the printing trade. The paper sense is what an office needs, ein Bogen Papier, and it is why a form to fill in is der Fragebogen: A2 das Blatt in the deck `schule-faecher-a2` is the loose page in a notebook, while a Bogen is the large unfolded sheet. B1 die Kurve in the deck `verkehr-auto-b1` is the same curve seen from a car. The chunk einen Bogen um jemanden machen means to give somebody a wide berth.'
      ru: 'Мужской род, и Duden фиксирует два множественных: die Bögen с умлаутом — обычное для «дуги», — и die Bogen без него, которое живёт рядом и в типографском деле нормально для листов. Значение «лист» нужно канцелярии: ein Bogen Papier, — потому и анкета зовётся der Fragebogen: das Blatt уровня A2 из колоды `schule-faecher-a2` — отдельный листок из тетради, а Bogen — большой неразрезанный лист. die Kurve уровня B1 из колоды `verkehr-auto-b1` — та же дуга, увиденная из машины. Оборот einen Bogen um jemanden machen значит «обходить кого-либо стороной».'
      uk: 'Чоловічий рід, і Duden фіксує дві множини: die Bögen з умлаутом — звичайну для «дуги», — і die Bogen без нього, яка живе поряд і в друкарській справі нормальна для аркушів. Значення «аркуш» потрібне канцелярії: ein Bogen Papier, — тому й анкета зветься der Fragebogen: das Blatt рівня A2 з колоди `schule-faecher-a2` — окремий аркушик із зошита, а Bogen — великий нерозрізаний аркуш. die Kurve рівня B1 з колоди `verkehr-auto-b1` — та сама дуга, побачена з автівки. Зворот einen Bogen um jemanden machen означає «обходити когось стороною».'

