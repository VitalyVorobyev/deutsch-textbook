    note:
      en: 'Feminine, ordinary plural, and as a measure word it does take that plural after a number: zwei Scheiben Brot, drei Scheiben Käse, where a masculine or neuter measure would stay singular in zwei Glas Wasser. The verb behind this sense is A2 schneiden in the deck `verben-handlungen-a2-2`. The glass sense is the everyday one in a car, die Windschutzscheibe and die Scheibe putzen, and it is a whole pane rather than A2 das Glas in the deck `haushalt-geschirr-a2`, which is the substance and the drinking vessel. A third sense is any flat disc, die Bremsscheibe.'
      ru: 'Женский род, множественное обычное, и как мера слово это множественное после числительного сохраняет: zwei Scheiben Brot, drei Scheiben Käse, — тогда как мера мужского или среднего рода осталась бы в единственном: zwei Glas Wasser. Глагол при этом значении — schneiden уровня A2 из колоды `verben-handlungen-a2-2`. Стекольное значение обиходно в разговоре о машине: die Windschutzscheibe, die Scheibe putzen, — и это целое полотно стекла, а не das Glas уровня A2 из колоды `haushalt-geschirr-a2`, где слово означает вещество и сосуд для питья. Третье значение — любой плоский диск: die Bremsscheibe.'
