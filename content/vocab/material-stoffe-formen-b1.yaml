    ru: 'две линии, положенные крест-накрест, как пометка в бланке или как христианский знак; а о теле — поясница'
    uk: 'дві лінії, покладені навхрест, як позначка в бланку або як християнський знак; а про тіло — поперек'
    example_de: Machen Sie bitte ein Kreuz in das erste Feld.
    example_en: Please put a cross in the first box.
    example_ru: Поставьте, пожалуйста, крестик в первом поле.
    example_uk: Поставте, будь ласка, хрестик у першому полі.
    note:
      en: 'Neuter, plural in -e. On a form it does the work an English tick does, and the verb for it is ankreuzen. The body sense is fixed and idiomatic, mir tut das Kreuz weh and die Kreuzschmerzen, and it names the lower back specifically rather than A1 der Rücken in the deck `koerper-gesundheit`, which is the whole of it. Keep it apart from A2 die Kreuzung in the deck `verkehr-unterwegs-a2`, where two roads meet. The aid organisation is das Rote Kreuz.'
      ru: 'Средний род, множественное на -e. В бланке слово делает работу английской галочки, а глагол к нему — ankreuzen. Телесное значение устойчиво и идиоматично: mir tut das Kreuz weh, die Kreuzschmerzen, — и называет именно поясницу, а не всю спину, как der Rücken уровня A1 из колоды `koerper-gesundheit`. Не смешивайте с die Kreuzung уровня A2 из колоды `verkehr-unterwegs-a2` — местом, где сходятся дороги. Организация помощи — das Rote Kreuz.'
      uk: 'Середній рід, множина на -e. У бланку слово робить роботу англійської галочки, а дієслово до нього — ankreuzen. Тілесне значення усталене й ідіоматичне: mir tut das Kreuz weh, die Kreuzschmerzen, — і називає саме поперек, а не всю спину, як der Rücken рівня A1 з колоди `koerper-gesundheit`. Не змішуйте з die Kreuzung рівня A2 з колоди `verkehr-unterwegs-a2` — місцем, де сходяться дороги. Організація допомоги — das Rote Kreuz.'

