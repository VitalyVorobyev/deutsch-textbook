      uk: 'Два сусіди стоять усередині цієї колоди і один поза нею: niedrig вище каже, що предмет близький до землі, flach — що власної висоти в нього майже немає, а steil рівня B1 з колоди `natur-geografie-b1` — саме те, чим рівна дорога не є. Про воду слово означає «мілкий»: flaches Wasser, — і протилежність тут tief рівня A2 з колоди `eigenschaften-dinge-a2`. Звороти: das Flachdach, flache Schuhe, flach atmen. Іменник die Fläche — «площа» — є на рівні B1 у колоді `gesellschaft-zusammenleben`.'

