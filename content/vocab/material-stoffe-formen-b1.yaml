      en: 'A1 die Farbe in the deck `kleidung-farben` plus -ig, with the ending spoken ɪç. It says only that colour is present, while A2 bunt in the deck `eigenschaften-dinge-a2` says several colours are present at once, so ein farbiges Bild may be one shade and ein buntes Bild never is. As a second half it names a shade: einfarbig, mehrfarbig, and the parallel ending -farben does the same work in cremefarben. Of people the word is dated and careful German avoids it today.'
      ru: 'die Farbe уровня A1 из колоды `kleidung-farben` плюс -ig, окончание звучит как ɪç. Слово говорит лишь, что цвет есть, тогда как bunt уровня A2 из колоды `eigenschaften-dinge-a2` говорит, что цветов сразу несколько: ein farbiges Bild может быть одноцветным, ein buntes Bild — никогда. Второй частью слова оно называет оттенок: einfarbig, mehrfarbig, — а параллельное окончание -farben делает ту же работу в cremefarben. О людях слово устарело, и внимательный немецкий его сегодня избегает.'
      uk: 'die Farbe рівня A1 з колоди `kleidung-farben` плюс -ig, закінчення звучить як ɪç. Слово каже лише, що колір є, тоді як bunt рівня A2 з колоди `eigenschaften-dinge-a2` каже, що кольорів одразу кілька: ein farbiges Bild може бути одноколірним, ein buntes Bild — ніколи. Другою частиною слова воно називає відтінок: einfarbig, mehrfarbig, — а паралельне закінчення -farben робить ту саму роботу в cremefarben. Про людей слово застаріло, і уважна німецька його сьогодні уникає.'

  - de: violett
    ipa: "vi̯oˈlɛt"
    pos: adj
    cards: recognition
    en: of the deep colour between blue and red, the one at the far end of the rainbow
    ru: глубокого цвета между синим и красным, того, что стоит с краю радуги
    uk: глибокого кольору між синім і червоним, того, що стоїть скраю райдуги
    example_de: Im Frühling ist die ganze Wiese violett.
    example_en: In spring the whole meadow is purple.
    example_ru: Весной весь луг фиолетовый.
    example_uk: Навесні весь луг фіолетовий.
    note:
      en: 'A French loan stressed on the last syllable, and unlike its neighbour it declines normally: ein violettes Kleid, violette Blumen. A1 lila in the deck `kleidung-farben` covers the same part of the spectrum but takes no endings at all, so German says lila Blumen and violette Blumen. Dictionaries put violett at the deeper, bluer end and lila nearer the light shade of the lilac the word comes from. The Wortliste also lists the sharpening prefixes hell- and dunkel-, which work here as everywhere: hellviolett, dunkelviolett.'
      ru: 'Французское заимствование с ударением на последнем слоге, и в отличие от соседа оно склоняется обычным образом: ein violettes Kleid, violette Blumen. lila уровня A1 из колоды `kleidung-farben` покрывает тот же участок спектра, но окончаний не принимает вовсе, так что немец говорит lila Blumen и violette Blumen. Словари относят violett к более глубокому, синеватому краю, а lila — ближе к светлому тону сирени, от которой слово и пошло. Wortliste перечисляет и уточняющие приставки hell- и dunkel-, работающие здесь как везде: hellviolett, dunkelviolett.'
      uk: 'Французьке запозичення з наголосом на останньому складі, і на відміну від сусіда воно відмінюється звичайно: ein violettes Kleid, violette Blumen. lila рівня A1 з колоди `kleidung-farben` покриває ту саму ділянку спектра, але закінчень не приймає зовсім, тож німець каже lila Blumen і violette Blumen. Словники відносять violett до глибшого, синюватішого краю, а lila — ближче до світлого тону бузку, від якого слово й пішло. Wortliste перелічує й уточнювальні префікси hell- і dunkel-, що працюють тут як усюди: hellviolett, dunkelviolett.'
