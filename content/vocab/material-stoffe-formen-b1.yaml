# Goethe-B1 Wortliste completion deck — unowned by any topic (gates its fresh cards
# on the learner's level, not on a topic being opened). It drains the material-and-shape
# field of data/goethe-b1-wortliste.txt: what a thing is made of, what shape it has,
# where its edge runs, and the adjectives a description needs once groß and klein have
# run out. This is the German of a product page, an assembly instruction, a museum
# label and a form that wants a cross in a box.
# A1's `kleidung-farben` owns die Farbe and the colour words, A2's
# `eigenschaften-dinge-a2` owns hoch, tief, rund and bunt, A2's
# `charakter-eigenschaften-a2` owns dick and dünn, B1's `zahlen-mengen-masse-b1` owns
# die Länge, die Breite and die Höhe as measurements, B1's `konsum-umwelt` owns das
# Plastik and der Kunststoff, B1's `geld-vertraege` owns das Material as the line on a
# written estimate, A2's `dinge-sachen-a2` owns das Ding and die Sache, and B1's
# `haushalt-notfall-b1` owns die Nadel and nähen. This deck is what those eight leave
# unnamed: the substance itself, the shape, the edge, and the angle a line runs at.
# Every entry is `cards: recognition` by the tiering frozen in wave 2c. This field is
# read, never written: the learner describes his own things out of A1 and A2 words, and
# everything here is what a label, a catalogue and a set of instructions say back at him.
id: material-stoffe-formen-b1
title_de: "Material, Stoffe und Formen"
title_en: "Materials, substances and shapes"
title_ru: "Материалы, вещества и формы"
title_uk: "Матеріали, речовини і форми"
level: B1
entries:
  # --- Woraus etwas gemacht ist ---
  - de: Stoff
    ipa: "ˈʃtɔf"
    pos: noun
    gender: m
    plural: "die Stoffe"
    cards: recognition
    en: 'woven cloth that clothes are made of; more widely the substance a thing consists of; and, at school, the material a course covers'
    ru: 'тканое полотно, из которого шьют одежду; шире — вещество, из которого состоит предмет; а в школе то, что проходят по программе'
    uk: 'ткане полотно, з якого шиють одяг; ширше — речовина, з якої складається предмет; а в школі те, що проходять за програмою'
    example_de: Der Stoff für das Kleid kostet zwölf Euro pro Meter.
    example_en: The fabric for the dress costs twelve euros a metre.
    example_ru: Ткань на платье стоит двенадцать евро за метр.
    example_uk: Тканина на сукню коштує дванадцять євро за метр.
    note:
      en: 'Masculine, plural in -e, and the st- is spoken ʃt. All three senses are common and the sentence has to sort them out. Cloth is the shop sense, and it is sewn with B1 die Nadel and B1 nähen in the deck `haushalt-notfall-b1`. The substance sense lives almost entirely in compounds: der Kunststoff, which B1 ships in the deck `konsum-umwelt`, plus der Rohstoff, der Schadstoff and der Sauerstoff. The school sense gives den Stoff wiederholen and Das kam im Stoff nicht vor. Beside it B1 das Material in the deck `geld-vertraege` is what a job is done with, the line on an estimate beside Arbeitszeit.'
      ru: 'Мужской род, множественное на -e, st- звучит как ʃt. Все три значения ходовые, и различает их только предложение. Ткань — магазинное значение, и шьют её с помощью die Nadel и nähen уровня B1 из колоды `haushalt-notfall-b1`. Значение «вещество» живёт почти только в сложных словах: der Kunststoff, который есть на уровне B1 в колоде `konsum-umwelt`, а также der Rohstoff, der Schadstoff и der Sauerstoff. Школьное значение даёт den Stoff wiederholen и Das kam im Stoff nicht vor. Рядом das Material уровня B1 из колоды `geld-vertraege` — то, чем выполняют работу, строка сметы рядом с Arbeitszeit.'
      uk: 'Чоловічий рід, множина на -e, st- звучить як ʃt. Усі три значення ходові, і розрізняє їх лише речення. Тканина — крамничне значення, і шиють її за допомогою die Nadel і nähen рівня B1 з колоди `haushalt-notfall-b1`. Значення «речовина» живе майже тільки у складних словах: der Kunststoff, який є на рівні B1 у колоді `konsum-umwelt`, а також der Rohstoff, der Schadstoff і der Sauerstoff. Шкільне значення дає den Stoff wiederholen і Das kam im Stoff nicht vor. Поряд das Material рівня B1 з колоди `geld-vertraege` — те, чим виконують роботу, рядок кошторису поряд з Arbeitszeit.'

  - de: Holz
    ipa: "ˈhɔlts"
    pos: noun
    gender: n
    plural: "die Hölzer"
    cards: recognition
    en: the hard substance a tree is made of, sawn into boards and worked into furniture
    ru: твёрдое вещество, из которого состоит дерево, распиленное на доски и пущенное на мебель
    uk: тверда речовина, з якої складається дерево, розпиляна на дошки й пущена на меблі
    example_de: Der Tisch ist aus massivem Holz und sehr schwer.
    example_en: The table is made of solid wood and very heavy.
    example_ru: Стол сделан из массива дерева и очень тяжёлый.
    example_uk: Стіл зроблено з масиву дерева, і він дуже важкий.
    note:
      en: 'Neuter, and the -lz is spoken ts. In the ordinary sentence it takes neither article nor plural: etwas ist aus Holz, ein Haus aus Holz. Duden does record die Hölzer, but only for kinds of wood or for single pieces, edle Hölzer, and a B1 text rarely needs it. The same slot after aus is filled by B1 der Stein in the deck `natur-geografie-b1` and B1 der Kunststoff in the deck `konsum-umwelt`. Compounds carry the trade: das Holzhaus, der Holzboden, das Brennholz.'
      ru: 'Средний род, а -lz звучит как ts. В обычном предложении слово идёт без артикля и без множественного: etwas ist aus Holz, ein Haus aus Holz. Duden фиксирует die Hölzer, но только о сортах древесины или об отдельных кусках, edle Hölzer, и тексту уровня B1 это почти не нужно. То же место после aus занимают der Stein уровня B1 из колоды `natur-geografie-b1` и der Kunststoff уровня B1 из колоды `konsum-umwelt`. Ремесло держится на сложных словах: das Holzhaus, der Holzboden, das Brennholz.'
      uk: 'Середній рід, а -lz звучить як ts. У звичайному реченні слово йде без артикля і без множини: etwas ist aus Holz, ein Haus aus Holz. Duden фіксує die Hölzer, але лише про сорти деревини або про окремі шматки, edle Hölzer, і текстові рівня B1 це майже не потрібно. Те саме місце після aus займають der Stein рівня B1 з колоди `natur-geografie-b1` і der Kunststoff рівня B1 з колоди `konsum-umwelt`. Ремесло тримається на складних словах: das Holzhaus, der Holzboden, das Brennholz.'

  - de: Metall
    ipa: "meˈtal"
    pos: noun
    gender: n
    plural: "die Metalle"
    cards: recognition
    en: a hard shiny substance that conducts heat and current, such as iron, copper or silver
    ru: твёрдое блестящее вещество, проводящее тепло и ток, например железо, медь или серебро
    uk: тверда блискуча речовина, що проводить тепло і струм, наприклад залізо, мідь або срібло
    example_de: Die Griffe sind aus Metall, nicht aus Kunststoff.
    example_en: The handles are made of metal, not of plastic.
    example_ru: Ручки металлические, а не пластмассовые.
    example_uk: Ручки металеві, а не пластмасові.
    note:
      en: 'Stress on the second syllable, neuter, and unlike Holz above it takes an ordinary plural: die Metalle, die Schwermetalle. B1 der Kunststoff in the deck `konsum-umwelt` is the word an instruction sets against it, exactly as in the example, and B1 das Gold below is one particular metal of the class. The adjective is metallisch, and scrap for recycling is das Altmetall.'
      ru: 'Ударение на втором слоге, средний род, и в отличие от Holz выше слово имеет обычное множественное: die Metalle, die Schwermetalle. der Kunststoff уровня B1 из колоды `konsum-umwelt` — то, чему инструкция его противопоставляет, ровно как в примере, а das Gold уровня B1 ниже — один из металлов этого класса. Прилагательное — metallisch, а лом на переработку — das Altmetall.'
      uk: 'Наголос на другому складі, середній рід, і на відміну від Holz вище слово має звичайну множину: die Metalle, die Schwermetalle. der Kunststoff рівня B1 з колоди `konsum-umwelt` — те, чому інструкція його протиставляє, точно як у прикладі, а das Gold рівня B1 нижче — один із металів цього класу. Прикметник — metallisch, а брухт на перероблення — das Altmetall.'

  - de: Gold
    ipa: "ˈgɔlt"
    pos: noun
    gender: n
    plural: "—"
    cards: recognition
    en: the soft yellow metal that rings and coins are made of, and the standard value is measured against
    ru: мягкий жёлтый металл, из которого делают кольца и монеты, и мерило, которым меряют ценность
    uk: м’який жовтий метал, з якого роблять каблучки й монети, і мірило, яким міряють цінність
    example_de: Der Ring ist aus Gold und war entsprechend teuer.
    example_en: The ring is made of gold and was expensive accordingly.
    example_ru: Кольцо золотое и стоило соответственно дорого.
    example_uk: Каблучка золота і коштувала відповідно дорого.
    note:
      en: 'Neuter, no plural, and the final d is spoken t. Like Holz above it stands article-free after aus. A2 der Ring in the deck `dinge-sachen-a2` and B1 der Schmuck in the deck `einkaufen-geld-b1` are what it is usually made into. The adjective golden covers both the substance and the colour, eine goldene Uhr, and sport gives die Goldmedaille. Two fixed phrases are worth learning whole: es ist nicht alles Gold, was glänzt, and das ist Gold wert.'
      ru: 'Средний род, множественного нет, конечное d звучит как t. Как и Holz выше, слово стоит после aus без артикля. der Ring уровня A2 из колоды `dinge-sachen-a2` и der Schmuck уровня B1 из колоды `einkaufen-geld-b1` — то, во что его обычно превращают. Прилагательное golden покрывает и вещество, и цвет: eine goldene Uhr, а спорт даёт die Goldmedaille. Два оборота стоит выучить целиком: es ist nicht alles Gold, was glänzt, и das ist Gold wert.'
      uk: 'Середній рід, множини немає, кінцеве d звучить як t. Як і Holz вище, слово стоїть після aus без артикля. der Ring рівня A2 з колоди `dinge-sachen-a2` і der Schmuck рівня B1 з колоди `einkaufen-geld-b1` — те, на що його зазвичай перетворюють. Прикметник golden покриває і речовину, і колір: eine goldene Uhr, а спорт дає die Goldmedaille. Два звороти варто вивчити цілком: es ist nicht alles Gold, was glänzt, і das ist Gold wert.'

  - de: Leder
    ipa: "ˈleːdɐ"
    pos: noun
    gender: n
    plural: "die Leder"
    cards: recognition
    en: animal skin treated so that it lasts, used for shoes, bags and jackets
    ru: обработанная шкура животного, которая долго служит и идёт на обувь, сумки и куртки
    uk: оброблена шкура тварини, що довго служить і йде на взуття, сумки й куртки
    example_de: Die Jacke ist aus Leder und hält schon zehn Jahre.
    example_en: The jacket is made of leather and has already lasted ten years.
    example_ru: Куртка кожаная и служит уже десять лет.
    example_uk: Куртка шкіряна і служить уже десять років.
    note:
      en: 'Neuter, and in the everyday sentence article-free and singular after aus, exactly like Holz and Gold above; Duden''s die Leder names kinds of leather, feine Leder, and nothing else needs it. A1 der Schuh and A1 die Jacke in the deck `kleidung-farben` are what it usually becomes. The adjective is ledern, and echt Leder is what a label prints when the material is not an imitation. Compounds: die Lederjacke, die Ledertasche, der Lederschuh.'
      ru: 'Средний род, а в обиходном предложении после aus стоит без артикля и в единственном, ровно как Holz и Gold выше; die Leder у Duden — это сорта кожи, feine Leder, и больше это ни для чего не нужно. der Schuh уровня A1 и die Jacke уровня A1 из колоды `kleidung-farben` — то, чем она обычно становится. Прилагательное — ledern, а echt Leder печатают на этикетке, когда материал не имитация. Сложные слова: die Lederjacke, die Ledertasche, der Lederschuh.'
      uk: 'Середній рід, а в побутовому реченні після aus стоїть без артикля і в однині, точно як Holz і Gold вище; die Leder у Duden — це сорти шкіри, feine Leder, і більше це ні для чого не потрібно. der Schuh рівня A1 і die Jacke рівня A1 з колоди `kleidung-farben` — те, чим вона зазвичай стає. Прикметник — ledern, а echt Leder друкують на етикетці, коли матеріал не імітація. Складні слова: die Lederjacke, die Ledertasche, der Lederschuh.'

  - de: Wolle
    ipa: "ˈvɔlə"
    pos: noun
    gender: f
    plural: "—"
    cards: recognition
    en: the soft hair of a sheep, spun into thread and knitted into warm clothes
    ru: мягкая шерсть овцы, из которой прядут нить и вяжут тёплые вещи
    uk: м’яка вовна вівці, з якої прядуть нитку і в’яжуть теплі речі
    example_de: Der Pullover ist aus reiner Wolle und kratzt ein bisschen.
    example_en: The jumper is made of pure wool and scratches a little.
    example_ru: Свитер из чистой шерсти и слегка колется.
    example_uk: Светр із чистої вовни й трохи коле.
    note:
      en: 'Feminine and in practice singular; Duden''s die Wollen belongs to the textile trade and no B1 text needs it. The animal is B1 das Schaf in the deck `tiere-wetter-b1`, the adjective wollen means made of it and wollig means merely like it. On a care label it stands beside die Baumwolle, which is cotton from a plant and has nothing to do with sheep despite the shared second half. B1 die Nadel and B1 nähen in the deck `haushalt-notfall-b1` are the tools of the same field.'
      ru: 'Женский род и на практике только единственное; die Wollen у Duden принадлежит текстильному ремеслу, и тексту уровня B1 это не нужно. Животное — das Schaf уровня B1 из колоды `tiere-wetter-b1`, прилагательное wollen значит «шерстяной», а wollig — лишь «похожий на шерсть». На ярлыке по уходу рядом стоит die Baumwolle — хлопок, растительное волокно, не имеющее к овце никакого отношения, несмотря на общую вторую половину. die Nadel и nähen уровня B1 из колоды `haushalt-notfall-b1` — инструменты того же поля.'
      uk: 'Жіночий рід і на практиці лише однина; die Wollen у Duden належить текстильному ремеслу, і текстові рівня B1 це не потрібно. Тварина — das Schaf рівня B1 з колоди `tiere-wetter-b1`, прикметник wollen означає «вовняний», а wollig — лише «схожий на вовну». На етикетці догляду поряд стоїть die Baumwolle — бавовна, рослинне волокно, що не має до вівці жодного стосунку, попри спільну другу половину. die Nadel і nähen рівня B1 з колоди `haushalt-notfall-b1` — інструменти того самого поля.'

  - de: Flüssigkeit
    ipa: "ˈflʏsɪçkaɪ̯t"
    pos: noun
    gender: f
    plural: "die Flüssigkeiten"
    cards: recognition
    en: anything that flows and takes the shape of whatever it is poured into
    ru: всё, что течёт и принимает форму того сосуда, куда налито
    uk: усе, що тече і набирає форми тієї посудини, куди налите
    example_de: Aus der Flasche läuft eine helle Flüssigkeit.
    example_en: A pale liquid is running out of the bottle.
    example_ru: Из бутылки вытекает светлая жидкость.
    example_uk: З пляшки витікає світла рідина.
    note:
      en: 'The adjective flüssig plus -keit, so the -ig keeps its soft ç in front of the ending; feminine, like every -keit noun, with an ordinary plural. It is a sign-and-leaflet word rather than a conversational one: an airport notice, a medicine insert, a chemistry lesson. In a café German names the drink instead, A2 das Getränk in the deck `freunde-feste`. The adjective itself has a second life in money language, where flüssig sein means having cash available.'
      ru: 'Прилагательное flüssig плюс -keit, поэтому -ig перед окончанием сохраняет мягкое ç; женский род, как у всякого слова на -keit, множественное обычное. Это слово таблички и вкладыша, а не разговора: объявление в аэропорту, инструкция к лекарству, урок химии. В кафе немец назовёт сам напиток — das Getränk уровня A2 из колоды `freunde-feste`. У самого прилагательного есть второе, денежное значение: flüssig sein — «располагать наличными».'
      uk: 'Прикметник flüssig плюс -keit, тому -ig перед закінченням зберігає м’яке ç; жіночий рід, як у кожного слова на -keit, множина звичайна. Це слово таблички і вкладки, а не розмови: оголошення в аеропорту, інструкція до ліків, урок хімії. У кав’ярні німець назве сам напій — das Getränk рівня A2 з колоди `freunde-feste`. У самого прикметника є друге, грошове значення: flüssig sein — «мати готівку».'

  # --- Der Gegenstand und seine Form ---
  - de: Gegenstand
    ipa: "ˈgeːgn̩ˌʃtant"
    pos: noun
    gender: m
    plural: "die Gegenstände"
    cards: recognition
    en: 'a thing you can pick up and point at, named without saying what it is; and the topic something is about'
    ru: 'предмет, который можно взять и на который можно указать, названный без уточнения, что это; а также то, о чём идёт речь'
    uk: 'предмет, який можна взяти і на який можна вказати, названий без уточнення, що це; а також те, про що йдеться'
    example_de: Bitte nehmen Sie alle Gegenstände aus Ihren Taschen.
    example_en: Please take all objects out of your pockets.
    example_ru: Пожалуйста, выньте все предметы из карманов.
    example_uk: Будь ласка, вийміть усі предмети з кишень.
    note:
      en: 'Gegen plus stehen, with the primary stress on Gegen- and the final d spoken t. This is the formal word, at home in a notice, a police report and an insurance form; A2 das Ding and A2 die Sache in the deck `dinge-sachen-a2` are what a person says out loud, and Ding is the vaguest of the three. The abstract sense needs a genitive after it: der Gegenstand der Diskussion, der Gegenstand des Vertrags. The adjective gegenständlich belongs to art criticism.'
      ru: 'Gegen плюс stehen, главное ударение на Gegen-, конечное d звучит как t. Это слово официальное — объявления, полицейской сводки, страхового бланка; das Ding и die Sache уровня A2 из колоды `dinge-sachen-a2` — то, что говорят вслух, и Ding из трёх самое расплывчатое. Отвлечённое значение требует после себя родительного: der Gegenstand der Diskussion, der Gegenstand des Vertrags. Прилагательное gegenständlich принадлежит разговору об искусстве.'
      uk: 'Gegen плюс stehen, головний наголос на Gegen-, кінцеве d звучить як t. Це слово офіційне — оголошення, поліційного зведення, страхового бланка; das Ding і die Sache рівня A2 з колоди `dinge-sachen-a2` — те, що кажуть уголос, і Ding із трьох найрозпливчастіше. Відсторонене значення потребує після себе родового: der Gegenstand der Diskussion, der Gegenstand des Vertrags. Прикметник gegenständlich належить розмові про мистецтво.'

  - de: Form
    ipa: "ˈfɔʁm"
    pos: noun
    gender: f
    plural: "die Formen"
    cards: recognition
    en: 'the outline a thing has, the way it is shaped; and, in a kitchen, the dish a cake is baked in'
    ru: 'очертание вещи, то, как она устроена снаружи; а на кухне посудина, в которой пекут пирог'
    uk: 'обрис речі, те, як вона влаштована ззовні; а на кухні посудина, у якій печуть пиріг'
    example_de: Der Kuchen hat die Form eines Herzens.
    example_en: The cake is in the shape of a heart.
    example_ru: Пирог сделан в форме сердца.
    example_uk: Пиріг зроблено у формі серця.
    note:
      en: 'Feminine, ordinary plural. The shape sense is the one a description needs and it takes a genitive or in Form von: in Form eines Kreuzes, in Form von Ringen. The baking sense is a countable object, eine runde Form, die Kuchenform, die Backform, and only the sentence separates the two. A third, abstract sense is condition: in Form sein, gut in Form. The verb formen means to give something a shape, while das Formular, the sheet an office hands you, is a different word with a different job.'
      ru: 'Женский род, множественное обычное. Значение «очертание» нужно описанию и требует родительного или оборота in Form von: in Form eines Kreuzes, in Form von Ringen. Значение «форма для выпечки» — считаемый предмет: eine runde Form, die Kuchenform, die Backform, и различает их только предложение. Третье, отвлечённое значение — состояние: in Form sein, gut in Form. Глагол formen значит «придавать вид», а das Formular — бланк в учреждении — слово другое и с другой работой.'
      uk: 'Жіночий рід, множина звичайна. Значення «обрис» потрібне описові й потребує родового або звороту in Form von: in Form eines Kreuzes, in Form von Ringen. Значення «форма для випікання» — злічуваний предмет: eine runde Form, die Kuchenform, die Backform, і розрізняє їх лише речення. Третє, відсторонене значення — стан: in Form sein, gut in Form. Дієслово formen означає «надавати вигляду», а das Formular — бланк в установі — слово інше і з іншою роботою.'

