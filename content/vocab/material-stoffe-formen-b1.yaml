    example_ru: Дети сидят в кругу на полу.
    example_uk: Діти сидять у колі на підлозі.
    note:
      en: 'Masculine, plural in -e, and the ei is the diphthong aɪ̯. A2 rund in the deck `eigenschaften-dinge-a2` is the adjective for the same shape. The people sense runs right through B1 reading: der Freundeskreis, im Familienkreis, in kleinem Kreis feiern. German administration adds a third sense, a rural district, which is why a car number plate begins with the letters of its Kreis. Chunks: im Kreis gehen, einen Kreis zeichnen.'
      ru: 'Мужской род, множественное на -e, ei — дифтонг aɪ̯. rund уровня A2 из колоды `eigenschaften-dinge-a2` — прилагательное для той же фигуры. Значение «круг людей» пронизывает чтение уровня B1: der Freundeskreis, im Familienkreis, in kleinem Kreis feiern. Немецкое административное деление добавляет третье значение — сельский район, — потому автомобильный номер и начинается с букв своего Kreis. Обороты: im Kreis gehen, einen Kreis zeichnen.'
      uk: 'Чоловічий рід, множина на -e, ei — дифтонг aɪ̯. rund рівня A2 з колоди `eigenschaften-dinge-a2` — прикметник для тієї самої фігури. Значення «коло людей» пронизує читання рівня B1: der Freundeskreis, im Familienkreis, in kleinem Kreis feiern. Німецький адміністративний поділ додає третє значення — сільський район, — тому автомобільний номер і починається з літер свого Kreis. Звороти: im Kreis gehen, einen Kreis zeichnen.'

  - de: Kreuz
