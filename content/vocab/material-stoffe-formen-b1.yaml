      en: 'Two neighbours sit inside this deck and one outside it: niedrig above says a thing is close to the ground, flach says it has hardly any height of its own, and B1 steil in the deck `natur-geografie-b1` is exactly what a flat path is not. Of water it means shallow, flaches Wasser, where A2 tief in the deck `eigenschaften-dinge-a2` is the opposite. Chunks: das Flachdach, flache Schuhe, flach atmen. The noun die Fläche, an area, ships at B1 in the deck `gesellschaft-zusammenleben`.'
