    note:
      en: 'Feminine, stress on the first syllable, ordinary plural. The transport sense is the one a learner needs first, and it keeps its article after mit: mit der Linie 8 fahren, but Linie 8 fährt. The drawn sense gives eine gerade Linie and eine Linie ziehen, and A2 der Punkt in the deck `schule-faecher-a2` is where such a line starts. In printed text a row of type is die Zeile, which is a different word. One chunk is fixed: in erster Linie, meaning above all.'
      ru: 'Женский род, ударение на первом слоге, множественное обычное. Транспортное значение нужно учащемуся первым, и после mit слово сохраняет артикль: mit der Linie 8 fahren, но Linie 8 fährt. Начерченное значение даёт eine gerade Linie и eine Linie ziehen, а der Punkt уровня A2 из колоды `schule-faecher-a2` — то, с чего такая линия начинается. Строка в печатном тексте — die Zeile, слово другое. Один оборот устойчив: in erster Linie — «прежде всего».'
      uk: 'Жіночий рід, наголос на першому складі, множина звичайна. Транспортне значення потрібне учневі першим, і після mit слово зберігає артикль: mit der Linie 8 fahren, але Linie 8 fährt. Накреслене значення дає eine gerade Linie і eine Linie ziehen, а der Punkt рівня A2 з колоди `schule-faecher-a2` — те, з чого така лінія починається. Рядок у друкованому тексті — die Zeile, слово інше. Один зворот усталений: in erster Linie — «передусім».'

