      ru: 'От senken — «опускать», — а nk звучит как ŋ плюс k. Это пара к waagerecht ниже, и кроссворд печатает ровно эти два слова как свои два направления: senkrecht — вниз по сетке, waagerecht — поперёк, — там их чаще всего впервые и встречают. Латинские близнецы vertikal и horizontal значат то же и звучат технически. Всё, что от той или другой линии отклоняется, — schief ниже.'
      uk: 'Від senken — «опускати», — а nk звучить як ŋ плюс k. Це пара до waagerecht нижче, і кросворд друкує саме ці два слова як свої два напрямки: senkrecht — вниз по сітці, waagerecht — упоперек, — там їх найчастіше вперше й зустрічають. Латинські близнюки vertikal і horizontal означають те саме і звучать технічно. Усе, що від тієї чи тієї лінії відхиляється, — schief нижче.'

