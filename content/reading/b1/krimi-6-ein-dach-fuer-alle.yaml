topic: gespraech-steuern
kind: extensive
title_de: "Ein Fall für den Hof (6): Ein Dach für alle"
text:
  - >-
    Am Donnerstag um acht saßen zwei Polizisten in Frau Becks Büro. Pünktlich hielt der weiße Lieferwagen vor der Tür. Der junge Mann kam
    herein, ruhig wie gestern. „Ist mein Rad fertig?“ Da kamen die Polizisten aus dem
    Büro. „Wir haben ein paar Fragen zu diesem Fahrrad.“ Der Mann sah lange
    auf das Rad, dann auf Lena. Er sagte nichts mehr und ging mit den Beamten. Im
    Lieferwagen fanden sie eine Kiste mit Lampen, Schlössern und Klingeln.
  - >-
    Am Samstag stand in der Stadtzeitung eine kurze
    [[Meldung::news item::сообщение, новость::повідомлення, новина]]: „Fahrraddieb in
    Werkstatt [[festgenommen::arrested::задержан::затриманий]]. Seit Anfang des Monats
    wurden in Höfen im Viertel elf Fahrräder gestohlen. Am Donnerstag wurde ein junger
    Mann festgenommen. Er arbeitete für die Firma, die dort neue Fahrraddächer gebaut
    hatte. Er habe sich beim Bau die Nummern der Hoftore aufgeschrieben, sagte die
    Polizei. Die Räder wurden oft neu [[lackiert::painted::покрашены::пофарбовані]] und im
    Internet verkauft. Wichtige
    [[Hinweise::tip-offs::сведения, наводки::відомості, підказки]] kamen von Bewohnern und
    von einer Zeugin, die ihn in der Gartenstraße am Tor gesehen hatte.“
  - >-
    Mira schickte Lena ein Foto von der Meldung. „Die Zeugin bin ich! Und jetzt zahlt die
    Versicherung seines Wagens mein Vorderrad.“
  - >-
    Am Montag durfte Lena ihr Fahrrad bei der Polizei abholen, und Frau Aydin bekam ihr
    Rad mit dem [[Kindersitz::child seat::детское кресло::дитяче сидіння]] zurück. „Er
    wollte Ihr Rad reparieren lassen und dann teurer verkaufen“, sagte die Beamtin. Dann
    legte sie etwas auf den Tisch: eine alte Klingel. „Die war im Lieferwagen. Gehört sie
    Ihnen?“ – „Ja“, sagte Lena leise. Am Abend schrieb sie ihrer Versicherung, dass sie
    nichts mehr zahlen muss.
  - >-
    Am Samstagabend trafen sich die Bewohner unter dem Fahrraddach. Frau Kern hatte auch
    Herrn Hansen eingeladen. Lena fing an: „Ich möchte kurz etwas sagen. Das Tor hat seit
    gestern eine neue Nummer. Die kennen nur wir und die Hausverwaltung, keine Firma mehr.
    Das wäre alles von mir.“
  - >-
    Dann hob Frau Kern die Hand. „Dürfte ich auch etwas sagen? Herr Hansen repariert alte
    Kinderräder für die Grundschule am Park. Unter dem Dach ist Platz.
    Er könnte das doch hier machen. Wie sehen Sie das, Herr Hansen?“ Herr Hansen lachte.
    „Gern. Aber nur, wenn mir jemand bei den Bremsen hilft.“ Alle sahen Lena an. „Das
    mache ich“, sagte sie.
  - >-
    Eine Woche später stand Lenas Rad unter dem Dach, noch schwarz, aber am
    [[Lenker::handlebars::руль::кермо]] hing die alte Klingel aus der Werkstatt ihres
    Vaters. Als die ersten Kinder mit ihren kleinen Rädern kamen, klingelte Lena zweimal.
    Es klang wie früher.
questions:
  - id: q-wie-sehen-sie-das
    outcomes: [wort-nehmen-geben]
    type: mc
    prompt: "Was macht Frau Kern mit der Frage „Wie sehen Sie das, Herr Hansen?“?"
    options:
      - "Sie gibt Herrn Hansen das Wort."
      - "Sie fragt, ob Herr Hansen die neue Nummer kennt."
      - "Sie beendet damit die Versammlung."
    correct: 0
    translation:
      en: "What is Frau Kern doing with the question \"Wie sehen Sie das, Herr Hansen?\"?"
      ru: "Что делает фрау Керн, когда спрашивает: «Wie sehen Sie das, Herr Hansen?»"
      uk: "Що робить фрау Керн, коли питає: «Wie sehen Sie das, Herr Hansen?»"
    explain:
      en: "Frau Kern first asks for the floor herself (\"Dürfte ich auch etwas sagen?\") and makes her proposal. Then she hands the floor to Herr Hansen, because the proposal is about him, and he answers. The new gate number was Lena's point, and the meeting goes on after his answer."
      ru: "Сначала фрау Керн сама просит слова («Dürfte ich auch etwas sagen?») и делает своё предложение. Потом она передаёт слово господину Хансену: предложение касается его, и он отвечает. О новом коде ворот говорила Лена, а собрание после его ответа продолжается."
      uk: "Спершу фрау Керн сама просить слова («Dürfte ich auch etwas sagen?») і вносить свою пропозицію. Потім вона дає слово панові Гансену: пропозиція стосується його, і він відповідає. Про новий код воріт говорила Лена, а збори після його відповіді тривають далі."
      de: "Zuerst bittet Frau Kern selbst um das Wort („Dürfte ich auch etwas sagen?“) und macht ihren Vorschlag. Dann gibt sie Herrn Hansen das Wort, denn in ihrem Vorschlag geht es um ihn, und er antwortet. Von der neuen Nummer hat Lena gesprochen, und nach seiner Antwort geht die Versammlung weiter."
  - id: q-das-waere-alles
    outcomes: [beitrag-rahmen]
    type: mc
    prompt: "Was zeigt Lena mit dem Satz „Das wäre alles von mir.“?"
    options:
      - "Dass ihr Beitrag zu Ende ist."
      - "Dass sie keine Zeit mehr hat."
      - "Dass sie Herrn Hansen nicht helfen möchte."
    correct: 0
    translation:
      en: "What does Lena signal with the sentence \"Das wäre alles von mir.\"?"
      ru: "Что Лена показывает фразой «Das wäre alles von mir.»?"
      uk: "Що Лена показує реченням «Das wäre alles von mir.»?"
    explain:
      en: "Lena opens her turn with \"Ich möchte kurz etwas sagen\", gives the news about the gate and closes with \"Das wäre alles von mir\": the fixed phrase that ends a contribution and lets the next person speak, which Frau Kern then does. It says nothing about time, and Lena is the one who offers to help Herr Hansen."
      ru: "Лена начинает с «Ich möchte kurz etwas sagen», сообщает новость про ворота и заканчивает фразой «Das wäre alles von mir». Это устойчивый оборот: им завершают своё высказывание и дают слово следующему, и следующей говорит фрау Керн. О нехватке времени здесь речи нет, а помочь господину Хансену вызывается как раз Лена."
      uk: "Лена починає з «Ich möchte kurz etwas sagen», повідомляє новину про ворота і закінчує фразою «Das wäre alles von mir». Це сталий зворот: ним завершують свій виступ і дають слово наступному, і наступною говорить фрау Керн. Про брак часу тут не йдеться, а допомогти панові Гансену зголошується якраз Лена."
      de: "Lena fängt mit „Ich möchte kurz etwas sagen“ an, erzählt die Neuigkeit vom Tor und schließt mit „Das wäre alles von mir“. Mit diesem Satz beendet man einen Beitrag, und der Nächste kann sprechen: Danach spricht Frau Kern. Von Zeit ist keine Rede, und gerade Lena will Herrn Hansen helfen."
