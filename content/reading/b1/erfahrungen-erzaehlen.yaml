topic: erfahrungen-erzaehlen
kind: intensive
title_de: "Der falsche Koffer"
text:
  - >-
    Im Februar flog Daniel zum ersten Mal allein nach Wien. Die Reise begann gut:
    Der Flug war [[pünktlich::on time::вовремя::вчасно]], und am
    [[Gepäckband::baggage carousel::лента выдачи багажа::стрічка видачі багажу]] stand
    schon ein schwarzer Koffer, der genau wie seiner aussah. Er nahm ihn und fuhr
    ins Hotel.
  - >-
    Erst am Abend [[bemerkte::noticed::заметил::помітив]] er seinen
    [[Irrtum::mistake, error::ошибка::помилка]]: Im Koffer lagen fremde Kleider und
    ein Tagebuch. Nachdem er den [[Zettel::note, slip of paper::записка::записка]] mit
    einer Telefonnummer gefunden hatte, rief er sofort an. Eine Frau lachte am
    anderen Ende: Sie hatte seinen Koffer — und sie wohnte im selben Hotel.
  - >-
    Während die beiden im Café die Koffer [[tauschten::swapped::менялись::мінялися]],
    erzählte sie von ihrer Stadt. Am nächsten Tag zeigte sie ihm die
    [[Altstadt::old town::старый город::старе місто]]. Seitdem fliegt Daniel nie mehr
    ohne ein rotes Band am Koffer — und nach Wien fährt er jedes Jahr.
questions:
  - id: frage-irrtum
    outcomes: [praeteritum-erzaehlen]
    type: mc
    prompt: "Wann bemerkte Daniel seinen Irrtum?"
    options:
      - "Erst am Abend im Hotel."
      - "Sofort am Gepäckband."
      - "Am nächsten Tag in der Altstadt."
    correct: 0
    translation:
      en: "When did Daniel notice his mistake?"
      ru: "Когда Даниэль заметил свою ошибку?"
      uk: "Коли Даніель помітив свою помилку?"
    explain:
      en: "Erst am Abend bemerkte er seinen Irrtum — erst marks how late it happened. At the carousel the suitcase merely looked like his (aussah, Präteritum), and the old town belongs to the day after the swap."
      ru: "Erst am Abend bemerkte er seinen Irrtum — erst подчёркивает, как поздно это случилось. У ленты чемодан лишь выглядел как его собственный (aussah, Präteritum), а старый город относится ко дню после обмена."
      uk: "Erst am Abend bemerkte er seinen Irrtum — erst підкреслює, як пізно це сталося. Біля стрічки валіза лише виглядала як його власна (aussah, Präteritum), а старе місто належить до дня після обміну."

  - id: frage-reihenfolge
    outcomes: [vorzeitigkeit-ausdruecken]
    type: mc
    prompt: "Was machte Daniel, nachdem er den Zettel gefunden hatte?"
    options:
      - "Er rief sofort an."
      - "Er fuhr ins Hotel."
      - "Er las das Tagebuch."
    correct: 0
    translation:
      en: "What did Daniel do after he had found the note?"
      ru: "Что сделал Даниэль после того, как нашёл записку?"
      uk: "Що зробив Даніель після того, як знайшов записку?"
    explain:
      en: "The staircase decides it: Nachdem er den Zettel gefunden hatte, rief er sofort an — the finding (Plusquamperfekt) comes first, the call (Präteritum) follows. The hotel ride happened before all of this, and the diary is only mentioned as lying in the suitcase."
      ru: "Решает лестница времён: Nachdem er den Zettel gefunden hatte, rief er sofort an — находка (Plusquamperfekt) первая, звонок (Präteritum) следом. Поездка в отель была раньше всего этого, а дневник лишь упомянут лежащим в чемодане."
      uk: "Вирішують сходи часів: Nachdem er den Zettel gefunden hatte, rief er sofort an — знахідка (Plusquamperfekt) перша, дзвінок (Präteritum) слідом. Поїздка до готелю була раніше за все це, а щоденник лише згаданий у валізі."

  - id: frage-seitdem
    outcomes: [praeteritum-erzaehlen]
    type: mc
    prompt: "Was macht Daniel seitdem?"
    options:
      - "Er fliegt nie mehr ohne ein rotes Band am Koffer."
      - "Er fliegt nie mehr nach Wien."
      - "Er nimmt keinen Koffer mehr mit."
    correct: 0
    translation:
      en: "What has Daniel done since then?"
      ru: "Что Даниэль делает с тех пор?"
      uk: "Що Даніель робить відтоді?"
    explain:
      en: "Seitdem fliegt Daniel nie mehr ohne ein rotes Band am Koffer — present tense, because the habit still holds. The Wien option contradicts the very next clause: he goes back every year."
      ru: "Seitdem fliegt Daniel nie mehr ohne ein rotes Band am Koffer — настоящее время, потому что привычка держится до сих пор. Вариант про Вену противоречит следующей же части: он возвращается туда каждый год."
      uk: "Seitdem fliegt Daniel nie mehr ohne ein rotes Band am Koffer — теперішній час, бо звичка тримається досі. Варіант про Відень суперечить наступній же частині: він повертається туди щороку."
