title_de: "Das kalte Herz"

# Klassiker strand, text 10 of 10 (ADR 0006). Adapted from
# sources/klassiker/10-das-kalte-herz.md, which runs 519 words — the
# longest in the corpus and well over the extensive band, so it is trimmed here
# rather than the band being widened: the two forest figures, the three wishes and
# the failure of the glassworks are compressed into background, and the two visits to
# the Holländer-Michel are told in one paragraph each. Both halves of the spine stay
# whole — the sold heart and the trick that wins it back — as does the closing moral.
# The Konjunktiv II the corpus builds the text on (wäre, würden, könne) is untouched:
# it is taught at this topic.

