topic: reisen-verkehr
title_de: "Der Zug fällt aus"
kind: intensive
text:
  - >-
    Felix wohnt in Köln. Heute fährt er nach Hamburg. Dort wartet seine Schwester
    Katrin. Felix ist zuerst mit dem Bus zum [[Hauptbahnhof::main
    station::главный вокзал::головний вокзал]] gefahren. Der Zug nach Hannover
    ist um acht Uhr zwölf von Gleis sieben
    [[abgefahren::departed::отправился::вирушив]]. Felix hat einen
    [[Sitzplatz::seat::сидячее место::сидяче місце]] in Wagen sieben.
  - >-
    In Hannover ist Felix [[umgestiegen::changed trains::сделал
    пересадку::зробив пересадку]]. Dann hat er eine
    [[Durchsage::announcement::объявление::оголошення]] gehört: „Der Zug nach
    Hamburg [[fällt heute aus::is cancelled today::сегодня отменён::сьогодні
    скасовано]].“ Felix ist zum [[Schalter::counter::касса::каса]] gegangen.
    „Mein Zug ist ausgefallen. Können Sie mir helfen?“ Frau Hoffmann sagt:
    „Sie fahren jetzt über Bremen. Dort haben Sie einen
    [[Anschluss::connection::пересадку::пересадку]] nach Hamburg.“
  - >-
    Felix ist um zehn Uhr zwanzig von Gleis vier abgefahren. Am Ende ist er mit
    einer Stunde [[Verspätung::delay::опозданием::запізненням]] in Hamburg
    angekommen. Katrin hat am Bahnhof gewartet. „Die Fahrt hat sechs Stunden
    gedauert“, sagt Felix. „Aber jetzt bin ich da.“
questions:
  - id: frage-ausgefallen
    revision: 2
    outcomes: [verbindung-waehlen]
    type: mc
    prompt: "Wo hat Felix die Durchsage gehört?"
    options:
      - "In Köln."
      - "In Hannover."
      - "In Bremen."
    correct: 1
    translation:
      en: Where did Felix hear the announcement?
      ru: Где Феликс услышал объявление?
      uk: Де Фелікс почув оголошення?
    explain:
      en: "„In Hannover ist Felix umgestiegen. Dann hat er eine Durchsage gehört …“ — Hanover is where he changes trains, and that is where he learns that the onward train is cancelled. Cologne is where the journey started; Bremen is only the new route he is given afterwards."
      ru: "„In Hannover ist Felix umgestiegen. Dann hat er eine Durchsage gehört …“ — в Ганновере он делает пересадку, и именно там узнаёт, что поезда дальше не будет. В Кёльне поездка началась, а Бремен появляется только потом — как новый маршрут."
      uk: "„In Hannover ist Felix umgestiegen. Dann hat er eine Durchsage gehört …“ — у Ганновері він робить пересадку, і саме там дізнається, що потяга далі не буде. У Кельні поїздка почалася, а Бремен з'являється лише потім — як новий маршрут."

  - id: frage-schalter
    revision: 2
    outcomes: [durchsage-verstehen]
    type: mc
    prompt: "Was macht Felix nach der Durchsage?"
    options:
      - "Er geht zum Schalter."
      - "Er fährt nach Köln zurück."
      - "Er wartet auf Gleis sieben."
    correct: 0
    translation:
      en: What does Felix do after the announcement?
      ru: Что Феликс делает после объявления?
      uk: Що Фелікс робить після оголошення?
    explain:
      en: "„Felix ist zum Schalter gegangen“ — the announcement only tells him that the train is gone, so he goes to a person who can give him a new route. Platform seven was the platform in Cologne, at the start of the story, and nobody goes back."
      ru: "„Felix ist zum Schalter gegangen“ — объявление лишь сообщает, что поезда не будет, и Феликс идёт к человеку, который даст ему новый маршрут. Седьмой путь был в Кёльне, в начале истории, и назад никто не едет."
      uk: "„Felix ist zum Schalter gegangen“ — оголошення лише повідомляє, що потяга не буде, і Фелікс йде до людини, яка дасть йому новий маршрут. Сьома колія була в Кельні, на початку історії, і назад ніхто не їде."

  - id: frage-fahrt-dauer
    outcomes: [reise-berichten]
    type: mc
    prompt: "Wie lange hat die Fahrt gedauert?"
    options:
      - "Eine Stunde."
      - "Vier Stunden."
      - "Sechs Stunden."
    correct: 2
    translation:
      en: How long did the journey take?
      ru: Сколько длилась поездка?
      uk: Скільки тривала поїздка?
    explain:
      en: "Felix says it himself at the end: „Die Fahrt hat sechs Stunden gedauert.“ One hour is the delay (mit einer Stunde Verspätung), not the journey — the text gives you both numbers, and they answer different questions."
      ru: "Феликс сам говорит об этом в конце: „Die Fahrt hat sechs Stunden gedauert.“ Один час — это опоздание (mit einer Stunde Verspätung), а не длительность поездки; в тексте есть оба числа, и они отвечают на разные вопросы."
      uk: "Фелікс сам каже про це наприкінці: „Die Fahrt hat sechs Stunden gedauert.“ Одна година — це запізнення (mit einer Stunde Verspätung), а не тривалість поїздки; у тексті є обидва числа, і вони відповідають на різні питання."
