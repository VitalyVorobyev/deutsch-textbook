transcript:
- speaker: Tom
  text: Hallo Anna, hier ist Tom. Vielen Dank für die Einladung! Ich freue mich sehr
    für dich.
- speaker: Tom
  text: Aber leider kann ich am Samstag nicht kommen, weil ich arbeiten muss. Meine
    Schicht endet erst um zweiundzwanzig Uhr.
- speaker: Tom
  text: Ich habe ein Geschenk für dich. Nina bringt dir das Geschenk mit. Es ist eine
    Überraschung!
- speaker: Tom
  text: Am Sonntag habe ich Zeit. Trinken wir zusammen einen Kaffee? Herzlichen Glückwunsch
    zum Geburtstag!
