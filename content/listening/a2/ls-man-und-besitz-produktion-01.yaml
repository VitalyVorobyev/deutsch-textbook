level: A2
title:
  en: The house rules
  ru: Правила дома
  uk: Правила будинку
scenario: Der Hausmeister erklärt einer neuen Mieterin die Hausordnung
duration_seconds: 33
speakers:
- Hausmeister
- Frau Lang
transcript:
- speaker: Hausmeister
  text: Guten Tag, Sie sind neu hier? Dann erkläre ich Ihnen kurz die Hausordnung.
- speaker: Frau Lang
  text: Ja, gern.
- speaker: Hausmeister
  text: Nach zweiundzwanzig Uhr soll man leise sein. Und im Treppenhaus darf man keine
    Fahrräder abstellen.
- speaker: Frau Lang
  text: Und wo kann man das Fahrrad hinstellen?
- speaker: Hausmeister
  text: Im Keller. Der Schlüssel ist beim Briefkasten von Familie Weber, die wohnen
    im Erdgeschoss.
- speaker: Frau Lang
  text: Alles klar. Und der Müll?
- speaker: Hausmeister
  text: Die Tonnen stehen hinten im Hof. Am Sonntag macht man das aber nicht — da
    ist Ruhetag.
