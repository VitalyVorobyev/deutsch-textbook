- Tarek
transcript:
- speaker: Lena
  text: Du hast doch früher in Leipzig gewohnt, oder?
- speaker: Tarek
  text: Ja, als ich studiert habe. Das waren vier gute Jahre.
- speaker: Lena
  text: Und warum bist du weggegangen?
- speaker: Tarek
  text: Ich habe hier eine Stelle bekommen. Deswegen bin ich vor zwei Jahren nach
    Bremen gezogen. Die Wohnung war teuer, aber die Arbeit war gut.
- speaker: Lena
  text: Fährst du noch manchmal hin?
- speaker: Tarek
  text: Selten. Aber immer wenn ich dort bin, treffe ich meine alten Freunde. Das
    ist mir wichtig.
