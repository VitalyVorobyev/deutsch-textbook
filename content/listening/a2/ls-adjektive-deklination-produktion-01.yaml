level: A2
title:
  en: A call about a flat
  ru: Звонок по поводу квартиры
  uk: Дзвінок щодо квартири
scenario: Telefonat mit der Vermieterin über eine kleine Wohnung
duration_seconds: 28
speakers:
- Vermieterin
- Herr Adam
transcript:
- speaker: Vermieterin
  text: Guten Tag, Sie haben wegen der Wohnung angerufen?
- speaker: Herr Adam
  text: Ja, genau. Ich suche eine kleine Wohnung mit einem ruhigen Zimmer zum Arbeiten.
- speaker: Vermieterin
  text: Die Wohnung hat zwei Zimmer. Das größere Zimmer geht zur Straße, das kleinere
    zum Hof. Da ist es sehr ruhig.
- speaker: Herr Adam
  text: Und die Küche? Ist sie neu?
- speaker: Vermieterin
  text: Die Küche ist alt, aber der Herd ist neu. Wir haben letzten Monat einen neuen
    Herd gekauft.
