id: ls-modalverben-01
level: A2
title:
  en: House rules for a new flatmate
  ru: Правила дома для нового соседа
  uk: 'Правила дому для нового сусіда'
scenario: Mitbewohner klären Pflichten, Erlaubnis und Verbot
duration_seconds: 49
speakers:
- Nele
- Timo
transcript:
- speaker: Nele
  text: Timo, wir müssen die Hausordnung noch einmal durchgehen.
- speaker: Timo
  text: Okay. Was darf ich denn nicht?
- speaker: Nele
  text: Im Treppenhaus darfst du nicht rauchen. Das ist verboten.
- speaker: Timo
  text: Verstanden. Und die Waschküche?
- speaker: Nele
  text: Da kannst du jeden Tag waschen, aber nach zweiundzwanzig Uhr darfst du die
    Maschine nicht mehr anstellen.
- speaker: Timo
  text: Muss ich den Müll auch runterbringen?
- speaker: Nele
  text: Nicht jeden Tag. Am Dienstag musst du die gelbe Tonne rausstellen.
- speaker: Timo
  text: Und wenn ich Besuch habe?
- speaker: Nele
  text: Das kannst du machen. Du musst nur nach zehn Uhr leise sein.
- speaker: Timo
  text: Gut, das kann ich mir merken.
