id: ls-pruefung-a2-2-hoeren-06
level: A2
title:
  en: Christmas presents for the family
  ru: Рождественские подарки для всей семьи
  uk: Різдвяні подарунки для всієї родини
scenario: Mutter und Lukas planen die Weihnachtsgeschenke für die Familie
duration_seconds: 58
speakers:
- Mutter
- Lukas
transcript:
- speaker: Mutter
  text: Lukas, wir müssen noch die Geschenke für Weihnachten planen. Was schenken
    wir Oma?
- speaker: Lukas
  text: Oma hört doch so gern Musik. Vielleicht eine CD?
- speaker: Mutter
  text: CDs hat sie genug. Aber sie hat gesagt, dass ihr warmer Pullover kaputt ist.
    Wir schenken ihr einen neuen Pullover.
- speaker: Lukas
  text: Gut. Und Opa?
- speaker: Mutter
  text: Opa wünscht sich einen Kalender mit Fotos von uns allen. Den mache ich selbst.
- speaker: Lukas
  text: Und Tante Eva? Ihr können wir doch Blumen schenken.
- speaker: Mutter
  text: Blumen bekommt sie jedes Jahr. Sie kocht so gern – ein Kochbuch ist besser.
- speaker: Lukas
  text: Und Papa? Er braucht doch eine neue Uhr.
- speaker: Mutter
  text: Die hat er sich schon selbst gekauft. Er wünscht sich eine Tasche für die
    Arbeit.
- speaker: Lukas
  text: Und was bekommt Mia?
- speaker: Mutter
  text: Mia spielt so gern mit uns allen. Wir schenken ihr ein Spiel für die ganze
    Familie.
