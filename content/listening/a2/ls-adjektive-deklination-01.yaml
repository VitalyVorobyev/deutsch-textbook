id: ls-adjektive-deklination-01
level: A2
title:
  en: Comparing two flats
  ru: Сравнивают две квартиры
  uk: 'Порівнюють дві квартири'
scenario: Zwei Wohnungen oder Produkte werden verglichen
duration_seconds: 44
speakers:
- Jana
- Kolja
transcript:
- speaker: Jana
  text: Wir haben jetzt zwei Wohnungen gesehen. Welche findest du besser?
- speaker: Kolja
  text: Die erste hat ein großes Wohnzimmer, aber eine sehr kleine Küche.
- speaker: Jana
  text: Stimmt. Die zweite hat einen schönen Balkon und einen hellen Flur.
- speaker: Kolja
  text: Der Flur ist wirklich hell. Aber die alten Fenster gefallen mir nicht.
- speaker: Jana
  text: In der ersten Wohnung sind die Fenster neu.
- speaker: Kolja
  text: Ja, und die Miete ist niedriger. Vierzig Euro weniger.
- speaker: Jana
  text: Dafür ist der Weg zur Arbeit länger.
- speaker: Kolja
  text: Mit dem neuen Bus nicht mehr. Der fährt seit Januar direkt.
- speaker: Jana
  text: Dann nehmen wir die erste. Ich rufe morgen früh an.
provenance: data/audio-provenance/a2/ls-adjektive-deklination-01.json
