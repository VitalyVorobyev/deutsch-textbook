level: A2
title:
  en: A flat with a lift
  ru: Квартира с лифтом
  uk: Квартира з ліфтом
scenario: 'Beim Makler: eine Wohnung mit Aufzug gesucht'
duration_seconds: 32
speakers:
- Makler
- Frau Kern
transcript:
- speaker: Makler
  text: Guten Tag. Sie suchen also eine Wohnung, die nicht zu teuer ist?
- speaker: Frau Kern
  text: Genau. Und sie soll in einem Haus sein, das einen Aufzug hat. Meine Mutter
    wohnt bei mir.
- speaker: Makler
  text: Ich habe hier eine Wohnung, die im dritten Stock liegt. Aber das Haus, das
    ich meine, hat leider keinen Aufzug.
- speaker: Frau Kern
  text: Dann geht das nicht. Haben Sie etwas im Erdgeschoss?
- speaker: Makler
  text: Ja, eine kleine Wohnung, die ich Ihnen am Freitag zeigen kann. Die Miete ist
    auch günstiger.
