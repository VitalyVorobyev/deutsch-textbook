id: ls-lernen-verstehen-01
level: A2
title:
  en: Instructions for a task in class
  ru: Указания к заданию на занятии
  uk: 'Вказівки до завдання на занятті'
scenario: Kursanweisung mit anschließender Verständnisfrage
duration_seconds: 30
speakers:
- Kursleiterin
- Teilnehmer
transcript:
- speaker: Kursleiterin
  text: Öffnen Sie bitte das Kursbuch auf Seite vierunddreißig. Lesen Sie zuerst die
    Aufgabe zwei. Danach hören Sie den Dialog zweimal und markieren die richtigen
    Sätze.
- speaker: Teilnehmer
  text: Entschuldigung, ich habe den letzten Schritt nicht verstanden. Können Sie
    das bitte noch einmal erklären?
- speaker: Kursleiterin
  text: Natürlich. Nach dem Hören vergleichen Sie Ihre Antworten mit Ihrer Partnerin.
    Erst danach öffnen Sie die Lösung.
- speaker: Teilnehmer
  text: Danke, jetzt verstehe ich die Aufgabe.
