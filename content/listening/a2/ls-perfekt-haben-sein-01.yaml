title:
  en: A weekend in Dresden
  ru: Выходные в Дрездене
  uk: 'Вихідні в Дрездені'
scenario: Freunde erzählen von einer Wochenendreise
duration_seconds: 49
speakers:
- Rafa
- Anja
transcript:
- speaker: Rafa
  text: Und, wie war euer Wochenende in Dresden?
- speaker: Anja
  text: Sehr schön! Wir sind am Freitagabend mit dem Zug gefahren.
- speaker: Rafa
  text: Habt ihr das Hotel schnell gefunden?
- speaker: Anja
  text: Nein, wir sind zuerst falsch gelaufen und haben eine halbe Stunde gesucht.
- speaker: Rafa
  text: Oh je. Und am Samstag?
- speaker: Anja
  text: Am Samstag haben wir die Altstadt angeschaut und sind auf einen Turm gestiegen.
- speaker: Rafa
  text: Habt ihr auch das Museum besucht?
- speaker: Anja
  text: Das wollten wir, aber es war geschlossen. Deshalb sind wir an den Fluss gegangen.
- speaker: Rafa
  text: Und wann seid ihr zurückgekommen?
- speaker: Anja
  text: Am Sonntagabend. Wir haben viel gesehen und wenig geschlafen.
