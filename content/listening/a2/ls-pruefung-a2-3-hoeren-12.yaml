id: ls-pruefung-a2-3-hoeren-12
level: A2
title:
  en: A garden for everyone in Cologne
  ru: Сад для всех в Кёльне
  uk: Сад для всіх у Кельні
scenario: 'Radiointerview: Yusuf Demir über seinen Garten für alle in Köln'
duration_seconds: 75
speakers:
- Moderatorin
- Yusuf Demir
transcript:
- speaker: Moderatorin
  text: Hallo und herzlich willkommen! Bei uns ist heute Yusuf Demir. Herr Demir,
    in Köln gibt es seit drei Jahren Ihren Garten für alle. Was ist das genau?
- speaker: Yusuf Demir
  text: Das ist ein großer Garten mitten in der Stadt, auf einem alten Parkplatz.
    Jeder kann mitmachen. Wir pflanzen zusammen Gemüse, Obst und Blumen.
- speaker: Moderatorin
  text: Wie viele Leute machen mit?
- speaker: Yusuf Demir
  text: Am Anfang waren wir nur fünf. Jetzt sind es über sechzig, aus zwanzig Ländern.
    Viele haben zu Hause keinen Garten, nur eine kleine Wohnung.
- speaker: Moderatorin
  text: Kostet das etwas?
- speaker: Yusuf Demir
  text: Man bezahlt zehn Euro im Jahr. Davon kaufen wir Pflanzen und Werkzeug. Aber
    wer kein Geld hat, kann trotzdem mitmachen.
- speaker: Moderatorin
  text: Und wer bekommt das Gemüse?
- speaker: Yusuf Demir
  text: Alle, die mitarbeiten. Wenn wir zu viel haben, verkaufen wir es samstags auf
    dem Markt. Das Geld ist dann für neue Pflanzen.
- speaker: Moderatorin
  text: Was gefällt Ihnen am meisten?
- speaker: Yusuf Demir
  text: 'Die Menschen. Ich habe hier viele Freunde gefunden. Und ich habe viel gelernt:
    Ich komme aus einer großen Stadt und wusste vorher nichts über Gemüse.'
- speaker: Moderatorin
  text: Herr Demir, vielen Dank für das Gespräch.
