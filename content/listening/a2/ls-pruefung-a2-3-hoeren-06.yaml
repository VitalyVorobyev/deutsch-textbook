id: ls-pruefung-a2-3-hoeren-06
level: A2
title:
  en: Katrin's week in Berlin
  ru: Неделя Катрин в Берлине
  uk: Тиждень Катрін у Берліні
scenario: Katrin erzählt einem Kollegen von ihrer Woche in Berlin
duration_seconds: 65
speakers:
- Kollege
- Katrin
transcript:
- speaker: Kollege
  text: Hallo Katrin! Wie war denn deine Woche in Berlin?
- speaker: Katrin
  text: Super! Am Montag sind wir angekommen, und am Nachmittag haben wir gleich eine
    Fahrt mit dem Bus durch die ganze Stadt gemacht. So sieht man am ersten Tag schon
    viel.
- speaker: Kollege
  text: Gute Idee. Und am Dienstag? Du wolltest doch ins Museum.
- speaker: Katrin
  text: Ja, das wollten wir. Aber am Dienstag hat es den ganzen Tag geregnet, und
    vor dem Museum haben so viele Leute gewartet! Wir sind dann einkaufen gegangen.
- speaker: Kollege
  text: Und das Museum?
- speaker: Katrin
  text: Das haben wir am Mittwoch besucht, ganz früh am Morgen. Da war es leer.
- speaker: Kollege
  text: Und am Donnerstag?
- speaker: Katrin
  text: Am Donnerstag hatte meine Freundin Sabine Geburtstag, sie wohnt ja in Berlin.
    Wir haben sie und ihre Freunde in einem Restaurant getroffen. Danach wollten wir
    noch ins Theater, aber es war schon zu spät.
- speaker: Kollege
  text: Schade. Und der letzte Tag?
- speaker: Katrin
  text: Am Freitag war endlich schönes Wetter. Wir haben Fahrräder gemietet und sind
    den ganzen Tag gefahren.
