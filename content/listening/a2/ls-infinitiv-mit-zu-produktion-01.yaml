transcript:
- speaker: Lena
  text: Was hast du am Wochenende vor?
- speaker: Marek
  text: Am Samstag muss ich leider arbeiten. Aber am Sonntag habe ich vor, mit dem
    Rad an den See zu fahren.
- speaker: Lena
  text: Das klingt gut. Hast du Lust, mich mitzunehmen?
- speaker: Marek
  text: Klar. Ich schlage vor, uns um neun am Bahnhof zu treffen. Dann sind wir früh
    da.
- speaker: Lena
  text: Um neun? Dann muss ich sehr früh aufstehen. Aber gut, es lohnt sich bestimmt.
