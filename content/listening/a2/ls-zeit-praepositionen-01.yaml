id: ls-zeit-praepositionen-01
level: A2
title:
  en: Finding a day to study together
  ru: Когда позаниматься вместе
  uk: Коли позайматися разом
scenario: 'Zwei Bekannte stimmen eine Woche ab: ab wann, bis wann, seit wann schon
  — und wann genau der Kurs beginnt'
duration_seconds: 43
speakers:
- Ali
- Nora
transcript:
- speaker: Ali
  text: Nora, hast du nächste Woche Zeit? Wir können zusammen lernen.
- speaker: Nora
  text: Bis Mittwoch leider nicht. Ich arbeite von Montag bis Mittwoch, immer bis
    sechs Uhr.
- speaker: Ali
  text: Und ab Donnerstag?
- speaker: Nora
  text: Ab Donnerstag habe ich frei. Wann beginnt denn der Kurs genau?
- speaker: Ali
  text: Am ersten März, um halb sieben am Abend.
- speaker: Nora
  text: Schon im März? Ich dachte, im April.
- speaker: Ali
  text: Nein, im März. Ich lerne schon seit zwei Monaten jeden Tag.
- speaker: Nora
  text: Seit zwei Monaten? Toll! Dann treffen wir uns am Donnerstag um vier hier im
    Café.
- speaker: Ali
  text: Gut, bis Donnerstag!
