id: ls-verben-mit-kasus-01
level: A2
title:
  en: A call before the move
  ru: Звонок перед переездом
  uk: Дзвінок перед переїздом
scenario: 'Kurzes Telefonat vor einem Umzug: wer ruft wen an, wer hilft wem, worauf
  wartet man noch'
duration_seconds: 44
speakers:
- Sara
- Daniel
transcript:
- speaker: Sara
  text: Hallo Daniel, hier ist Sara. Störe ich dich gerade?
- speaker: Daniel
  text: Nein, gar nicht. Ist alles fertig für Samstag?
- speaker: Sara
  text: Fast. Ich habe gestern meinen Bruder angerufen. Er hilft mir mit den Möbeln.
- speaker: Daniel
  text: Und wer hilft dir in der Küche?
- speaker: Sara
  text: Meine Nachbarin. Ihr gehören auch die Taschen vor der Tür.
- speaker: Daniel
  text: Soll ich den Vermieter anrufen? Er wartet doch auf deine Antwort.
- speaker: Sara
  text: Danke, das mache ich selbst. Ich warte nur noch auf den Schlüssel für die
    neue Wohnung.
- speaker: Daniel
  text: Dann frag doch Herrn Berg vom Büro. Er antwortet dir sicher schnell.
- speaker: Sara
  text: Gute Idee. Ich rufe ihn gleich an.
