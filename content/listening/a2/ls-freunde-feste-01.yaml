id: ls-freunde-feste-01
level: A2
title:
  en: A birthday invitation
  ru: Приглашение на день рождения
  uk: 'Запрошення на день народження'
scenario: Einladung und Planung eines Festes
duration_seconds: 49
speakers:
- Kata
- Ole
transcript:
- speaker: Kata
  text: Ole, ich lade dich zu meinem Geburtstag ein. Am Samstag in zwei Wochen.
- speaker: Ole
  text: Sehr gern! Wo feierst du denn?
- speaker: Kata
  text: Im Garten meiner Eltern, wenn das Wetter mitspielt.
- speaker: Ole
  text: Und wenn es regnet?
- speaker: Kata
  text: Dann gehen wir in den Partyraum im Keller. Der ist reserviert.
- speaker: Ole
  text: Soll ich etwas mitbringen?
- speaker: Kata
  text: Bring bitte einen Salat mit. Um die Getränke kümmere ich mich.
- speaker: Ole
  text: Mache ich. Kann ich meine Freundin mitbringen?
- speaker: Kata
  text: Klar, je mehr, desto besser. Sag mir nur bis Mittwoch Bescheid.
- speaker: Ole
  text: Alles klar. Und wann fangen wir an?
- speaker: Kata
  text: Um sechs. Aber komm ruhig etwas früher, dann können wir noch reden.
