id: ls-verbindungen-folgen-01
level: A2
title:
  en: A burst pipe and what follows
  ru: Прорвало трубу — и что дальше
  uk: 'Прорвало трубу — і що далі'
scenario: Ein Vorfall und seine Folgen werden erklärt
duration_seconds: 55
speakers:
- Frau Sanz
- Hausmeister
transcript:
- speaker: Frau Sanz
  text: Warum ist das Wasser im Keller abgestellt?
- speaker: Hausmeister
  text: Gestern Nacht ist ein Rohr geplatzt, deshalb mussten wir es abstellen.
- speaker: Frau Sanz
  text: Und wie lange dauert das?
- speaker: Hausmeister
  text: Die Firma kommt heute Nachmittag, also haben wir am Abend wieder Wasser.
- speaker: Frau Sanz
  text: Ist etwas kaputtgegangen?
- speaker: Hausmeister
  text: Der Boden im Keller ist nass, darum können Sie Ihre Kisten dort nicht abstellen.
- speaker: Frau Sanz
  text: Meine Kisten stehen aber schon unten.
- speaker: Hausmeister
  text: Dann holen Sie sie bitte heute noch hoch, sonst wird der Karton weich.
- speaker: Frau Sanz
  text: Gut, ich mache das gleich.
- speaker: Hausmeister
  text: Und schreiben Sie Ihren Namen darauf, damit nichts verwechselt wird.
- speaker: Frau Sanz
  text: Mache ich. Sagen Sie mir Bescheid, wenn der Keller wieder trocken ist.
