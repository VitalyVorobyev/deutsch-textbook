id: ls-verben-mit-praepositionen-01
level: A2
title:
  en: Worries and things to look forward to
  ru: Тревоги и то, чего ждёшь
  uk: 'Тривоги і те, чого чекаєш'
scenario: Freunde sprechen über Sorgen, Interessen und Pläne
duration_seconds: 45
speakers:
- Sami
- Lu
transcript:
- speaker: Sami
  text: Du wirkst müde. Worüber denkst du so viel nach?
- speaker: Lu
  text: Ich denke an meine Prüfung. Ich habe Angst vor dem mündlichen Teil.
- speaker: Sami
  text: Davor hatte ich auch Angst. Sprichst du mit deiner Lehrerin darüber?
- speaker: Lu
  text: Noch nicht. Aber ich freue mich auf die Zeit danach.
- speaker: Sami
  text: Worauf freust du dich am meisten?
- speaker: Lu
  text: Auf den Urlaub. Ich warte seit Monaten darauf.
- speaker: Sami
  text: Und auf wen wartest du am Bahnhof, wenn du fährst?
- speaker: Lu
  text: Auf meine Schwester. Sie kommt aus Wien mit.
- speaker: Sami
  text: Dann kümmere dich jetzt nur um die Prüfung. Um alles andere kümmern wir uns
    später.
