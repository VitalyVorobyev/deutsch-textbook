title:
  en: The weather forecast on the radio
  ru: Прогноз погоды по радио
  uk: Прогноз погоди по радіо
scenario: 'Kurzer Wetterbericht im Radio: heute, morgen und das Wochenende, mit Temperaturen
  und einer Warnung vor einem Gewitter'
duration_seconds: 36
speakers:
- Radio
transcript:
- speaker: Radio
  text: Und jetzt das Wetter für heute, morgen und das Wochenende.
- speaker: Radio
  text: Heute ist es bewölkt, aber trocken, und es ist windig. Wir haben vierzehn
    Grad, am Abend wird es kühl.
- speaker: Radio
  text: Morgen wird es wärmer. Am Vormittag scheint die Sonne, und es werden bis zu
    zwanzig Grad.
- speaker: Radio
  text: Aber am Nachmittag kommt ein Gewitter. Bleiben Sie dann bitte im Haus.
- speaker: Radio
  text: Am Wochenende regnet es oft, und es wird kühler, nur noch zwölf Grad.
- speaker: Radio
  text: Das war das Wetter. Und jetzt hören Sie Musik.
