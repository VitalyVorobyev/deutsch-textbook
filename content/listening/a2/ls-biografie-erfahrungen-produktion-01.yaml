transcript:
- speaker: Reporterin
  text: 'Herr Nowak, erzählen Sie doch mal: Wo sind Sie aufgewachsen?'
- speaker: Herr Nowak
  text: Ich bin in einem Dorf in Polen aufgewachsen. Als Kind war ich fast immer draußen.
- speaker: Reporterin
  text: Und was haben Sie nach der Schule gemacht?
- speaker: Herr Nowak
  text: Zuerst wollte ich Lehrer werden. Aber ich hatte kein Geld für die Universität.
    Deshalb habe ich eine Ausbildung als Koch gemacht.
- speaker: Reporterin
  text: Und seit wann sind Sie in Deutschland?
- speaker: Herr Nowak
  text: Seit sechs Jahren. Vor sechs Jahren bin ich nach Hamburg gekommen, und heute
    habe ich ein kleines Restaurant.
