level: A2
title:
  en: 'Young people at work: Daniel, a trainee cook'
  ru: 'Молодёжь и профессия: Даниэль учится на повара'
  uk: 'Молодь і професія: Даніель учиться на кухаря'
scenario: 'Radiointerview „Junge Leute im Beruf“: Daniel Weber über seine Ausbildung'
duration_seconds: 80
speakers:
- Moderatorin
- Daniel
transcript:
- speaker: Moderatorin
  text: Herzlich willkommen zu „Junge Leute im Beruf“. Heute ist Daniel Weber bei
    uns. Daniel, du bist zwanzig und machst eine Ausbildung. Was lernst du?
- speaker: Daniel
  text: Ich werde Koch. Meine Ausbildung mache ich in einem Hotel in Hamburg, jetzt
    bin ich im zweiten Jahr.
- speaker: Moderatorin
  text: Wolltest du schon immer Koch werden?
- speaker: Daniel
  text: Nein, gar nicht. Nach der Schule wollte ich eigentlich Mechaniker werden.
    Ich habe ein Praktikum in einer Autowerkstatt gemacht, aber das war nichts für
    mich. Zu Hause habe ich aber immer gern gekocht.
- speaker: Moderatorin
  text: Wie sieht dein Arbeitstag aus?
- speaker: Daniel
  text: Ich fange um zehn Uhr an und arbeite oft bis zehn Uhr abends. Am Nachmittag
    habe ich zwei Stunden Pause. Am Wochenende muss ich meistens arbeiten, dafür habe
    ich am Montag und am Dienstag frei.
- speaker: Moderatorin
  text: Und die Berufsschule?
- speaker: Daniel
  text: Die ist einmal pro Woche, immer am Mittwoch. Das finde ich gut. Da lerne ich
    viel über Lebensmittel und Gesundheit.
- speaker: Moderatorin
  text: Was möchtest du nach der Ausbildung machen?
- speaker: Daniel
  text: Ich möchte ein Jahr im Ausland arbeiten, vielleicht in Italien oder in Spanien.
    Und später, wer weiß, vielleicht habe ich einmal ein eigenes Restaurant.
- speaker: Moderatorin
  text: Daniel, vielen Dank und viel Glück!
