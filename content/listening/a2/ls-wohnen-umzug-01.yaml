id: ls-wohnen-umzug-01
level: A2
title:
  en: Arranging a moving day
  ru: Договариваются о дне переезда
  uk: 'Домовляються про день переїзду'
scenario: Telefonat koordiniert einen Umzugstag
duration_seconds: 53
speakers:
- Herr Yilmaz
- Frau Dorn
transcript:
- speaker: Herr Yilmaz
  text: Guten Tag Frau Dorn, ich ziehe am Samstag um. Ich wollte kurz Bescheid sagen.
- speaker: Frau Dorn
  text: Danke, das ist nett. Wann kommt der Wagen?
- speaker: Herr Yilmaz
  text: Gegen acht Uhr morgens. Könnten Sie Ihr Auto vor dem Haus wegfahren?
- speaker: Frau Dorn
  text: Natürlich. Ich stelle es am Freitagabend in die Seitenstraße.
- speaker: Herr Yilmaz
  text: Vielen Dank. Wir brauchen den Platz nur bis Mittag.
- speaker: Frau Dorn
  text: Und der Aufzug? Der ist oft besetzt.
- speaker: Herr Yilmaz
  text: Den habe ich für Samstag reserviert, von acht bis zwölf.
- speaker: Frau Dorn
  text: Sehr gut. Sagen Sie Bescheid, wenn Sie noch Hilfe brauchen.
- speaker: Herr Yilmaz
  text: Das ist lieb. Am Nachmittag wird es sicher ruhiger.
- speaker: Frau Dorn
  text: Ich bin ab zehn zu Hause und kann Ihnen Kaffee kochen.
