title:
  en: 'Starting over: Sandra Klein on the Baltic coast'
  ru: 'Начать заново: Сандра Кляйн на Балтийском море'
  uk: 'Почати заново: Сандра Кляйн на Балтійському морі'
scenario: 'Radiointerview „Neu anfangen“: Sandra Klein über ihr neues Leben'
duration_seconds: 95
speakers:
- Moderator
- Sandra Klein
transcript:
- speaker: Moderator
  text: Guten Tag und herzlich willkommen zu unserer Sendung „Neu anfangen“. Heute
    ist Sandra Klein bei uns. Frau Klein, Sie haben zehn Jahre in Berlin gelebt. Jetzt
    wohnen Sie in einem kleinen Dorf an der Ostsee. Warum?
- speaker: Sandra Klein
  text: 'In Berlin hatte ich eine gute Arbeit in einem Büro. Aber ich hatte nie Zeit,
    und die Wohnungen waren sehr teuer. Vor drei Jahren hat mir meine Großmutter ihr
    altes Haus an der Ostsee geschenkt. Da habe ich gedacht: Jetzt oder nie!'
- speaker: Moderator
  text: Und was machen Sie jetzt beruflich?
- speaker: Sandra Klein
  text: Ich habe im Haus ein kleines Café aufgemacht. Am Anfang wollte ich nur Kaffee
    und Kuchen verkaufen. Jetzt koche ich auch mittags, denn viele Touristen fragen
    nach einem Mittagessen.
- speaker: Moderator
  text: Kommen denn genug Gäste?
- speaker: Sandra Klein
  text: Im Sommer ja, da ist das Café jeden Tag voll. Im Winter kommen nur die Leute
    aus dem Dorf. Deshalb ist das Café von November bis März nur am Wochenende geöffnet.
- speaker: Moderator
  text: Fehlt Ihnen Berlin manchmal?
- speaker: Sandra Klein
  text: Die Kinos und Theater fehlen mir schon ein bisschen. Aber meine Freunde aus
    Berlin besuchen mich oft, besonders im Sommer. Und hier im Dorf habe ich auch
    neue Freunde gefunden.
- speaker: Moderator
  text: Was ist für Sie das Schönste am Leben im Dorf?
- speaker: Sandra Klein
  text: Die Ruhe. Und ich gehe jeden Morgen eine Stunde am Meer spazieren, bevor ich
    das Café aufmache. Das war in Berlin nicht möglich.
- speaker: Moderator
  text: Frau Klein, vielen Dank für das Gespräch.
