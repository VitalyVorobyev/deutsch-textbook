id: ls-infinitiv-mit-zu-01
level: A2
title:
  en: Getting the summer party ready
  ru: Подготовка к летнему празднику
  uk: 'Готуємося до літнього свята'
scenario: Aufgaben und Zwecke für eine Veranstaltung planen
duration_seconds: 50
speakers:
- Pia
- Marek
transcript:
- speaker: Pia
  text: Wir haben noch drei Tage, um alles für das Sommerfest vorzubereiten.
- speaker: Marek
  text: Ich habe vor, morgen die Getränke zu bestellen.
- speaker: Pia
  text: Gut. Vergiss nicht, auch Wasser zu kaufen, um genug für alle zu haben.
- speaker: Marek
  text: Und wer kümmert sich um die Musik?
- speaker: Pia
  text: Nadja hat versprochen, ihre Anlage mitzubringen.
- speaker: Marek
  text: Dann brauchen wir nur noch jemanden, um die Tische aufzustellen.
- speaker: Pia
  text: Ich frage den Hausmeister. Er hat angeboten, früher zu kommen.
- speaker: Marek
  text: Perfekt. Ich versuche, bis Freitag alles fertig zu haben.
- speaker: Pia
  text: Und denk daran, die Nachbarn einzuladen, um Ärger zu vermeiden.
- speaker: Marek
  text: Daran habe ich schon gedacht. Die Zettel liegen im Flur.
