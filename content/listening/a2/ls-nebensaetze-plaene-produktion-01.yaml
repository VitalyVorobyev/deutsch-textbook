transcript:
- speaker: Nina
  text: Am Sonntag fahren wir zum See. Kommst du mit, Yusuf?
- speaker: Yusuf
  text: Ich würde gern mitkommen, aber ich kann nicht, weil ich am Sonntag arbeiten
    muss.
- speaker: Nina
  text: Schade! Und wenn wir am Samstag fahren?
- speaker: Yusuf
  text: Am Samstag habe ich Zeit. Aber ich glaube, dass es am Samstag regnet.
- speaker: Tobias
  text: 'Das Museum ist am Samstag leider geschlossen. Aber ich habe eine Idee: Wenn
    es regnet, gehen wir ins Kino.'
- speaker: Nina
  text: Gute Idee! Und wenn die Sonne scheint, fahren wir zum See.
