transcript:
- speaker: Jonas
  text: Hallo Lena! Hier steht noch eine Kiste. Gehört sie dir?
- speaker: Lena
  text: Nein, mir gehört sie nicht. Meine Tasche ist schon zu Hause.
- speaker: Jonas
  text: Und die Bücher? Die gehören meiner Schwester, oder?
- speaker: Lena
  text: Ja, die Bücher sind von ihr. Aber in der Kiste ist eine Lampe. Die Lampe gehört
    Paul.
