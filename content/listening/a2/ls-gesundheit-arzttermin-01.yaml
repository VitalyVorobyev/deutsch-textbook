transcript:
- speaker: Empfang
  text: Guten Morgen. Sie haben um elf Uhr einen Termin bei Frau Doktor Weber.
- speaker: Herr Nowak
  text: Ja. Muss ich noch etwas vorbereiten?
- speaker: Empfang
  text: Bitte füllen Sie zuerst dieses Formular aus. Trinken Sie vorher nichts außer
    Wasser. Danach warten Sie im zweiten Stock vor Zimmer zwölf.
- speaker: Herr Nowak
  text: Soll ich gleich nach oben gehen?
- speaker: Empfang
  text: Nein, geben Sie mir zuerst das Formular. Dann rufe ich Sie auf.
