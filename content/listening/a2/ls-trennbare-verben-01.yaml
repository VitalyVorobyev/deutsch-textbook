id: ls-trennbare-verben-01
level: A2
title:
  en: A voice message about tomorrow
  ru: Голосовое сообщение о завтрашнем дне
  uk: 'Голосове повідомлення про завтрашній день'
scenario: Sprachnachricht beschreibt Erledigungen und Zeiten
duration_seconds: 33
speakers:
- Jonas
transcript:
- speaker: Jonas
  text: Hallo Papa, hier ist Jonas. Ich rufe kurz an, weil sich mein Tag geändert
    hat.
- speaker: Jonas
  text: Ich stehe morgen schon um sechs Uhr auf und fahre um sieben zur Arbeit ab.
- speaker: Jonas
  text: Mittags kaufe ich für Oma ein und bringe ihr die Sachen vorbei.
- speaker: Jonas
  text: Um vier Uhr hole ich Mia vom Kindergarten ab.
- speaker: Jonas
  text: Danach räume ich die Küche auf und rufe dich noch einmal an.
- speaker: Jonas
  text: Bitte mach das Fenster im Wohnzimmer zu, es soll regnen. Bis morgen!
