level: A2
title:
  en: Anna needs help with her move
  ru: Анне нужна помощь с переездом
  uk: Анні потрібна допомога з переїздом
scenario: Anna sucht für ihren Umzug einen freien Abend; Ben nennt seine Woche
duration_seconds: 60
speakers:
- Anna
- Ben
transcript:
- speaker: Anna
  text: Hallo Ben! Du, ich ziehe nächste Woche um. Hast du an einem Abend Zeit? Ich
    brauche Hilfe.
- speaker: Ben
  text: Hm, nächste Woche ist schwierig. Am Montag gehe ich um sechs zum Zahnarzt.
    Danach habe ich bestimmt keine Lust auf Kisten.
- speaker: Anna
  text: Verstehe. Und am Dienstag?
- speaker: Ben
  text: Dienstags spiele ich immer Fußball. Aber diesen Dienstag gibt es kein Training,
    deshalb gehe ich mit Lisa ins Kino.
- speaker: Anna
  text: Schade. Und am Mittwoch?
- speaker: Ben
  text: Am Mittwoch habe ich normalerweise meinen Deutschkurs. Aber diese Woche ist
    der Kurs am Donnerstag, die Lehrerin kann am Mittwoch nicht. Und am Mittwoch muss
    ich lange arbeiten, bis neun Uhr.
- speaker: Anna
  text: Und am Freitag?
- speaker: Ben
  text: Am Freitag fahre ich zu meinen Eltern. Aber am Samstag habe ich Zeit, dann
    helfe ich dir gern!
- speaker: Anna
  text: Super, Samstag passt auch. Danke!
