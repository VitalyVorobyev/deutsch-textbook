id: ls-freunde-feste-aufgabe-01
level: A2
title:
  en: Who brings what to Mira's party
  ru: Кто что принесёт на праздник Миры
  uk: Хто що принесе на свято Міри
scenario: 'In der Bäckerei, ein paar Tage vor Miras Fest: Mira fragt, ob ihre Karte
  angekommen ist, Lena sagt zu und fragt, was sie mitbringen soll, ein Kollege sagt
  ab und will später vorbeikommen.'
duration_seconds: 80
speakers:
- Lena
- Mira
- Kollege
transcript:
- speaker: Mira
  text: Lena, sag mal – ist meine Karte schon angekommen?
- speaker: Lena
  text: Ja, gestern! Danke. Ich komme natürlich. Das ist am Samstag, oder?
- speaker: Mira
  text: Genau, am Samstag. Um sieben … nein, warte – um sechs. Um sechs steht auf
    der Karte.
- speaker: Lena
  text: Okay, um sechs. Und soll ich dir was mitbringen? Vielleicht einen Salat?
- speaker: Mira
  text: Ach, Salat bringt mir schon meine Schwester. Die macht immer viel zu viel.
- speaker: Lena
  text: Hm … dann backe ich einen Kuchen? Einen Käsekuchen?
- speaker: Mira
  text: Oh, echt? Lieber eine Torte, wenn das geht. Mit Schokolade!
- speaker: Lena
  text: Gut, eine Schokoladentorte. Mach ich.
- speaker: Mira
  text: Und du? Du kommst doch auch, oder?
- speaker: Kollege
  text: Leider nicht. Am Samstag heiratet meine Schwester, und ich helfe ihr den ganzen
    Tag.
- speaker: Mira
  text: Oh! Na ja, eine Hochzeit ist natürlich wichtiger.
- speaker: Kollege
  text: Aber ich komme bei dir vorbei, ja? Am Sonntagvormittag … ach nein, da schläfst
    du sicher noch. Am Nachmittag. Und ich bringe dir ein Geschenk mit.
- speaker: Mira
  text: Super. Dann bis Sonntag!
