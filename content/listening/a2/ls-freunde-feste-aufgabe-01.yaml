id: ls-freunde-feste-aufgabe-01
level: A2
title:
  en: Who brings what to Mira's party
  ru: Кто что принесёт на праздник Миры
  uk: Хто що принесе на свято Міри
scenario: 'In der Bäckerei, ein paar Tage vor Miras Fest: Lena sagt zu, ein Kollege
  sagt höflich ab, und alle sprechen ab, wer was mitbringt'
duration_seconds: 62
speakers:
- Lena
- Mira
- Kollege
transcript:
- speaker: Mira
  text: Lena, ist meine Einladung schon angekommen?
- speaker: Lena
  text: Ja, gestern. Danke! Ich komme sehr gern. Wann soll ich da sein?
- speaker: Mira
  text: Um achtzehn Uhr, im Vereinsheim vom SV Nord.
- speaker: Lena
  text: Und was soll ich dir mitbringen?
- speaker: Mira
  text: Nichts! Niemand muss etwas Großes mitbringen.
- speaker: Lena
  text: Darf ich dir vielleicht eine Torte backen?
- speaker: Mira
  text: Oh, toll! Lena backt mir eine Torte. Und du? Kommst du auch?
- speaker: Kollege
  text: Danke, das ist nett von dir. Aber leider kann ich nicht kommen, weil meine
    Schwester am Samstag heiratet.
- speaker: Mira
  text: Schade! Aber eine Hochzeit ist natürlich wichtiger.
- speaker: Kollege
  text: Ich wünsche dir schon jetzt eine schöne Feier! Und am Sonntag komme ich kurz
    bei dir vorbei und bringe dir ein Geschenk mit.
- speaker: Lena
  text: 'Also: Ich bringe ihr am Samstag die Torte mit, und du kommst am Sonntag.'
- speaker: Mira
  text: Genau! Ich freue mich schon.
