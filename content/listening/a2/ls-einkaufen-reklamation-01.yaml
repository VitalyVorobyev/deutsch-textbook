id: ls-einkaufen-reklamation-01
level: A2
title:
  en: Returning a faulty kettle
  ru: Возврат неисправного чайника
  uk: 'Повернення несправного чайника'
scenario: Kundin reklamiert ein defektes Produkt
duration_seconds: 52
speakers:
- Kundin
- Mitarbeiter
transcript:
- speaker: Kundin
  text: Guten Tag, ich möchte diesen Wasserkocher reklamieren.
- speaker: Mitarbeiter
  text: Was ist denn das Problem?
- speaker: Kundin
  text: Er schaltet sich nicht mehr aus. Ich habe ihn vor zwei Wochen gekauft.
- speaker: Mitarbeiter
  text: Haben Sie den Kassenbon dabei?
- speaker: Kundin
  text: Ja, hier. Ich möchte gern ein neues Gerät, kein Geld zurück.
- speaker: Mitarbeiter
  text: Das geht. Wir haben das gleiche Modell leider nicht mehr.
- speaker: Kundin
  text: Und ein ähnliches?
- speaker: Mitarbeiter
  text: Wir haben eines für fünf Euro mehr. Den Unterschied müssen Sie zahlen.
- speaker: Kundin
  text: Das ist in Ordnung, wenn ich es heute mitnehmen kann.
- speaker: Mitarbeiter
  text: Ja, ich hole es aus dem Lager. Einen Moment bitte.
- speaker: Kundin
  text: Und die Garantie beginnt dann neu, oder?
- speaker: Mitarbeiter
  text: Genau, ab heute wieder zwei Jahre.
