id: ls-probe-gesellschaft-zusammenleben-hoeren-01
level: B1
title:
  en: Piano practice in the evening
  ru: Пианино по вечерам
  uk: Піаніно вечорами
scenario: 'Im Treppenhaus: Ein Nachbar bittet eine Mieterin, abends früher mit dem
  Klavier aufzuhören, und die beiden finden eine Lösung'
duration_seconds: 30
speakers:
- Nachbar
- Mieterin
transcript:
- speaker: Nachbar
  text: Entschuldigung, Sie spielen jeden Abend Klavier, oft bis zehn Uhr. Mein Sohn
    muss aber um acht schlafen.
- speaker: Mieterin
  text: Das tut mir leid. Aber ich arbeite bis sechs, und vorher habe ich keine Zeit
    zum Üben.
- speaker: Nachbar
  text: Das verstehe ich. Könnten Sie dann vielleicht früher aufhören?
- speaker: Mieterin
  text: Wie wäre es, wenn ich nur noch von halb sieben bis halb acht spiele? Am Wochenende
    dann am Nachmittag.
- speaker: Nachbar
  text: Einverstanden, das ist fair.
