id: ls-konsum-umwelt-01
level: B1
title:
  en: What happens to the bottle bank
  ru: Что происходит со стеклотарой
  uk: 'Що відбувається зі склотарою'
scenario: Herstellung oder Recycling erklären und eine Wahl vergleichen
duration_seconds: 67
speakers:
- Rolf
- Ida
transcript:
- speaker: Rolf
  text: Weißt du eigentlich, was mit unserem Altglas passiert, nachdem wir es in den
    Container geworfen haben?
- speaker: Ida
  text: Es wird nach Farben sortiert, gereinigt und dann eingeschmolzen. Aus Altglas
    wird wieder Glas, und das fast beliebig oft.
- speaker: Rolf
  text: Das klingt fast zu gut. Wo ist der Haken?
- speaker: Ida
  text: Das Einschmelzen braucht sehr viel Energie. Trotzdem lohnt es sich, weil neues
    Glas aus Sand noch mehr Energie kostet.
- speaker: Rolf
  text: Und wie ist das bei Plastik?
- speaker: Ida
  text: Da wird das meiste nicht wieder zu Verpackung, sondern verbrannt. Nur ein
    Teil wird zu Bänken oder Rohren.
- speaker: Rolf
  text: Dann wäre eine Mehrwegflasche also besser als eine Plastikflasche zum Wegwerfen?
- speaker: Ida
  text: In der Regel ja, aber nur wenn sie aus der Nähe kommt. Eine Mehrwegflasche,
    die dreihundert Kilometer transportiert wird, verliert ihren Vorteil schnell.
- speaker: Rolf
  text: Das heißt, die Entfernung entscheidet mehr als das Material?
- speaker: Ida
  text: Bei den Getränken oft, ja. Am wenigsten Aufwand macht immer das, was man gar
    nicht erst kauft.
