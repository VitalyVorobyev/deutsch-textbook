id: ls-probe-gesellschaft-zusammenleben-hoeren-03
level: B1
title:
  en: Whose turn is it to clean the stairs
  ru: Чья очередь мыть лестницу
  uk: Чия черга мити сходи
scenario: 'Im Treppenhaus: Eine Mieterin erinnert einen Nachbarn an das Putzen, und
  die beiden tauschen die Wochen'
duration_seconds: 34
speakers:
- Mieterin
- Nachbar
transcript:
- speaker: Mieterin
  text: Das Treppenhaus ist schon wieder schmutzig. Eigentlich müssen Sie diese Woche
    putzen.
- speaker: Nachbar
  text: Ich weiß, aber ich arbeite diese Woche jeden Tag bis spät. Ich habe einfach
    keine Zeit.
- speaker: Mieterin
  text: Und ich soll alles allein machen? Das finde ich nicht fair.
- speaker: Nachbar
  text: Nein, natürlich nicht. Wie wäre es, wenn wir tauschen? Sie putzen diese Woche,
    und ich putze dafür die nächsten zwei Wochen.
- speaker: Mieterin
  text: Zwei Wochen? Gut, einverstanden.
