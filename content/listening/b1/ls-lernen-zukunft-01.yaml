title:
  en: Guidance on the next professional step
  ru: Консультация о следующем шаге в работе
  uk: 'Консультація про наступний крок у роботі'
scenario: Beratung zu Lernzielen und beruflichen nächsten Schritten
duration_seconds: 44
speakers:
- Berater
- Frau Ilić
transcript:
- speaker: Berater
  text: Was ist Ihr wichtigstes berufliches Ziel für das nächste Jahr?
- speaker: Frau Ilić
  text: Ich möchte im Büro mehr Verantwortung übernehmen. Dafür brauche ich besseres
    Deutsch und mehr Erfahrung mit Kunden.
- speaker: Berater
  text: Dann empfehle ich Ihnen einen berufsbegleitenden B2-Kurs. Der Kurs findet
    zweimal pro Woche am Abend statt.
- speaker: Frau Ilić
  text: Das passt, falls ich an den anderen Tagen weiterarbeiten kann. Gibt es auch
    praktische Übungen?
- speaker: Berater
  text: Ja. Sie üben Gespräche und schreiben echte E-Mails, damit Sie das Gelernte
    direkt anwenden können.
- speaker: Frau Ilić
  text: Was wäre mein nächster Schritt?
- speaker: Berater
  text: Melden Sie sich zuerst zur Beratung beim Kursanbieter an. Danach können Sie
    mit Ihrer Chefin über einen freien Kursabend sprechen.
