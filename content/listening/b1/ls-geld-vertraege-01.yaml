id: ls-geld-vertraege-01
level: B1
title:
  en: One wrong line on the bill
  ru: Одна неверная строка в счёте
  uk: Один неправильний рядок у рахунку
scenario: 'Anruf beim Anbieter: eine Zeile der Rechnung stimmt nicht, der Zahltag
  bleibt'
duration_seconds: 66
speakers:
- Herr Schulz
- Frau Rossi
transcript:
- speaker: Herr Schulz
  text: Netzwelt, Kundenservice, mein Name ist Schulz. Was kann ich für Sie tun?
- speaker: Frau Rossi
  text: Guten Tag, ich rufe wegen meiner Rechnung vom März an. Da steht eine Miete
    für das Telefon, vier Euro neunundneunzig im Monat.
- speaker: Herr Schulz
  text: Einen Moment, ich sehe nach. Ja, das steht in Ihrem Vertrag.
- speaker: Frau Rossi
  text: Das Telefon habe ich aber am Anfang vom Vertrag gekauft, nicht gemietet. Die
    Quittung habe ich noch.
- speaker: Herr Schulz
  text: Sie haben recht, das war ein Fehler bei uns. Ich nehme die Miete von der Rechnung,
    und Sie bekommen das Geld für Januar und Februar zurück.
- speaker: Frau Rossi
  text: Muss ich die Rechnung jetzt trotzdem bezahlen?
- speaker: Herr Schulz
  text: Ja, aber nur den Grundpreis von neunundzwanzig Euro. Das Geld nehmen wir wie
    immer am fünfzehnten von Ihrem Konto, daran ändert sich nichts.
- speaker: Frau Rossi
  text: Bekomme ich das schriftlich?
- speaker: Herr Schulz
  text: Natürlich. Sie bekommen heute noch eine E-Mail mit der korrigierten Rechnung.
