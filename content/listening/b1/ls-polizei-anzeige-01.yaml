id: ls-polizei-anzeige-01
level: B1
title:
  en: Reporting a stolen bike
  ru: Заявление о краже велосипеда
  uk: Заява про крадіжку велосипеда
scenario: 'Am Schalter der Polizeiwache: eine Anzeige wegen Fahrraddiebstahl, der
  Beamte fragt nach Zeitraum, Ort und Zeugen und wiederholt die Angaben'
duration_seconds: 61
speakers:
- Beamter
- Frau Lindner
transcript:
- speaker: Beamter
  text: Guten Tag. Was kann ich für Sie tun?
- speaker: Frau Lindner
  text: Ich möchte eine Anzeige machen. Mein Fahrrad ist gestohlen worden.
- speaker: Beamter
  text: Wann und wo haben Sie es zuletzt gesehen?
- speaker: Frau Lindner
  text: Gestern Abend um sieben vor dem Fitnessstudio in der Schillerstraße. Heute
    Morgen um acht war das abgeschlossene Rad weg.
- speaker: Beamter
  text: Also zwischen neunzehn Uhr gestern und acht Uhr heute. Gibt es Zeugen oder
    einen Verdacht?
- speaker: Frau Lindner
  text: Eine Nachbarin hat erzählt, dass sie nachts zwei Männer mit einem kleinen
    Lastwagen gesehen hat. Sie weiß aber nicht, ob die etwas mit dem Fahrrad zu tun
    hatten.
- speaker: Beamter
  text: Wir sprechen mit der Zeugin. Haben Sie einen Beweis, dass es Ihr Rad ist,
    zum Beispiel die Rechnung?
- speaker: Frau Lindner
  text: Die Rechnung mit der Nummer vom Rad habe ich zu Hause.
- speaker: Beamter
  text: Gut. Bringen Sie sie bitte bis Freitag vorbei. Dann bekommen Sie die Bestätigung
    für Ihre Versicherung.
