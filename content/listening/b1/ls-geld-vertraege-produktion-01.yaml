transcript:
- speaker: Kundendienst
  text: Kundendienst der Firma Lindner, guten Tag.
- speaker: Anrufer
  text: Guten Tag, ich habe eine Frage zu meiner Rechnung. Der Gesamtbetrag ist hundertvierzig
    Euro, aber in Zeile drei steht eine Anfahrt für dreißig Euro. Im Kostenvoranschlag
    stand davon nichts.
- speaker: Kundendienst
  text: Einen Moment, ich sehe nach. Sie haben recht, die Anfahrt ist dort nicht angegeben.
    Wir streichen die Zeile und schicken Ihnen morgen eine neue Rechnung über hundertzehn
    Euro.
- speaker: Anrufer
  text: Und bis wann muss ich dann zahlen?
- speaker: Kundendienst
  text: 'Das Datum bleibt, wie es ist: fällig am siebzehnten Mai. Bitte überweisen
    Sie erst, wenn die neue Rechnung da ist.'
