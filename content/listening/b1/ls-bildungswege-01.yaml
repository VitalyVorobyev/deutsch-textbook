id: ls-bildungswege-01
level: B1
title:
  en: A place at the Kita
  ru: Место в детском саду
  uk: Місце в дитсадку
scenario: 'Anmeldung in der Kita: eine Mutter fragt nach einem Platz, nennt Bedingungen
  und begründet, warum sie den Platz braucht'
duration_seconds: 65
speakers:
- Frau Wolff
- Frau Haddad
transcript:
- speaker: Frau Wolff
  text: Guten Tag, kommen Sie herein. Wie kann ich Ihnen helfen?
- speaker: Frau Haddad
  text: Guten Tag. Ich möchte meinen Sohn anmelden. Karim ist zwei Jahre alt. Haben
    Sie noch einen Platz frei?
- speaker: Frau Wolff
  text: Im Moment leider nicht. Aber im September werden Plätze frei, weil dann viele
    Kinder in die Grundschule kommen.
- speaker: Frau Haddad
  text: September wäre gut. Ich fange dann an der Hochschule an und brauche den Platz,
    damit ich vormittags zu meinen Kursen gehen kann.
- speaker: Frau Wolff
  text: Also nur vormittags, bis vierzehn Uhr?
- speaker: Frau Haddad
  text: Erst einmal ja. Falls ich später auch nachmittags Kurse habe, möchte ich gern
    länger buchen. Geht das?
- speaker: Frau Wolff
  text: Falls dann ein Platz frei ist, ja. Versprechen kann ich es Ihnen aber nicht.
- speaker: Frau Haddad
  text: Verstehe. Was muss ich für die Anmeldung mitbringen?
- speaker: Frau Wolff
  text: Dieses Formular, die Geburtsurkunde und eine Bestätigung vom Kinderarzt. Wenn
    Sie alles bis Ende März abgeben, kommt Karim auf die Liste für September.
- speaker: Frau Haddad
  text: Gut, dann komme ich nächste Woche, um alles abzugeben.
