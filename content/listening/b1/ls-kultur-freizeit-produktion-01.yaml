transcript:
- speaker: Kulturbüro
  text: Kulturbüro Nordstadt, guten Tag.
- speaker: Anruferin
  text: Guten Tag, ich möchte am Sonntag mit meiner Tochter zum Kinderprogramm kommen.
    Sie ist neun. Muss ich vorher reservieren?
- speaker: Kulturbüro
  text: Für das Kinderprogramm nicht. Beginn ist um halb elf, Einlass ab zehn. Kinder
    bis zwölf Jahre kommen gratis, Erwachsene zahlen vier Euro.
- speaker: Anruferin
  text: Und die Führung am Nachmittag?
- speaker: Kulturbüro
  text: Da brauchen Sie eine Reservierung, und zwar bis Freitag. Die Plätze sind fast
    weg.
