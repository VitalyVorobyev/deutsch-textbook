id: ls-arbeit-bewerbung-01
level: B1
title:
  en: An excerpt from a job interview
  ru: Отрывок из собеседования
  uk: 'Уривок зі співбесіди'
scenario: Ausschnitt aus einem Vorstellungsgespräch
duration_seconds: 69
speakers:
- Frau Baumann
- Frau Petrova
transcript:
- speaker: Frau Baumann
  text: Frau Petrova, Sie haben zuletzt drei Jahre in einem Logistikunternehmen gearbeitet.
    Warum möchten Sie wechseln?
- speaker: Frau Petrova
  text: Die Arbeit hat mir gefallen, aber ich hatte kaum Kontakt zu Kunden. Genau
    das reizt mich an Ihrer Stelle.
- speaker: Frau Baumann
  text: Unsere Kunden rufen oft an, wenn etwas schiefgegangen ist. Wie gehen Sie mit
    Beschwerden um?
- speaker: Frau Petrova
  text: Ich höre erst zu Ende zu und wiederhole dann, was ich verstanden habe. Meistens
    beruhigt das schon.
- speaker: Frau Baumann
  text: Und wenn Sie die Lösung nicht selbst entscheiden dürfen?
- speaker: Frau Petrova
  text: Dann sage ich das offen und nenne einen Zeitpunkt, bis wann ich zurückrufe.
    Falsche Versprechen ärgern die Kunden mehr als eine Verzögerung.
- speaker: Frau Baumann
  text: Das sehe ich genauso. Wo sehen Sie Ihre größte Schwäche?
- speaker: Frau Petrova
  text: Ich arbeite manchmal zu lange an Details. Ich setze mir inzwischen feste Zeiten,
    damit das nicht passiert.
- speaker: Frau Baumann
  text: 'Eine letzte Frage: Ab wann könnten Sie anfangen?'
- speaker: Frau Petrova
  text: Ich habe vier Wochen Kündigungsfrist, also ab dem ersten Oktober.
- speaker: Frau Baumann
  text: Gut. Wir melden uns bis Ende der Woche bei Ihnen.
