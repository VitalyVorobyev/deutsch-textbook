title:
  en: The washing machine in the cellar
  ru: Стиральная машина в подвале
  uk: Пральна машина в підвалі
scenario: 'Im Keller: Eine Mieterin ärgert sich über nasse Wäsche in der Waschmaschine,
  der Hausmeister und sie finden eine Lösung'
duration_seconds: 35
speakers:
- Mieterin
- Hausmeister
transcript:
- speaker: Mieterin
  text: Schon wieder liegt nasse Wäsche in der Maschine im Keller. Ich warte seit
    einer Stunde.
- speaker: Hausmeister
  text: Ich weiß, viele beschweren sich. Aber ich kann nicht jeden Tag kontrollieren,
    wer wäscht.
- speaker: Mieterin
  text: Wir könnten doch einen Plan an die Tür hängen. Jede Wohnung bekommt einen
    festen Tag.
- speaker: Hausmeister
  text: Ein fester Tag ist zu wenig für Familien. Besser ist eine Liste, wo man seine
    Zeit einträgt.
- speaker: Mieterin
  text: Gut, eine Liste. Dann weiß jeder, wann die Maschine frei ist.
- speaker: Hausmeister
  text: Ich hänge sie morgen an die Tür.
