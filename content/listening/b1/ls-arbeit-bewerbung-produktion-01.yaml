  text: Die Arbeit mache ich gern. Aber ich möchte mehr Verantwortung übernehmen,
    und bei Ihnen könnte ich ein kleines Team führen.
- speaker: Herr Weber
  text: Haben Sie selbst noch eine Frage an uns?
