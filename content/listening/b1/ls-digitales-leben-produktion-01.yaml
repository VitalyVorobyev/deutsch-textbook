transcript:
- speaker: Frau Roth
  text: Stadtbibliothek, guten Tag. Was kann ich für Sie tun?
- speaker: Anruferin
  text: Ich habe die App installiert, aber sie fragt nach einer Nummer, und ich weiß
    nicht, welche.
- speaker: Frau Roth
  text: Das ist die Ausweisnummer, sie steht unten auf Ihrem Ausweis. Geben Sie zuerst
    die Nummer an und wählen Sie danach Ihre Stadt aus.
- speaker: Anruferin
  text: Und wenn das Feld rot wird?
- speaker: Frau Roth
  text: Dann fehlt noch eine Angabe. Gehen Sie einfach zurück und tippen Sie die Nummer
    noch einmal ein.
