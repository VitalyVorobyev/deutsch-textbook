id: ls-regeln-verantwortung-01
level: B1
title:
  en: Negotiating the rehearsal times
  ru: Договариваются о времени репетиций
  uk: 'Домовляються про час репетицій'
scenario: Bewohner handeln unter einer Hausregel eine Lösung aus
duration_seconds: 71
speakers:
- Frau Vogt
- Herr Simon
- Frau Adamu
transcript:
- speaker: Frau Vogt
  text: 'Ich habe Sie beide gebeten zu kommen, weil sich mehrere Nachbarn über die
    Musik am Wochenende beschwert haben. In der Hausordnung steht: nach zweiundzwanzig
    Uhr Zimmerlautstärke.'
- speaker: Herr Simon
  text: Mir ist klar, dass es zu laut war. Aber ich probe nur samstags, weil ich unter
    der Woche bis acht arbeite.
- speaker: Frau Adamu
  text: Das Problem ist nicht der Samstag, sondern die Uhrzeit. Bei uns schlafen zwei
    kleine Kinder ab halb neun.
- speaker: Herr Simon
  text: Wenn ich früher anfange, komme ich kaum auf zwei Stunden.
- speaker: Frau Vogt
  text: Zwei Stunden müssen es ja nicht am Stück sein. Wäre samstags von fünfzehn
    bis siebzehn Uhr denkbar?
- speaker: Herr Simon
  text: Das ginge, wenn ich dafür sonntags noch eine Stunde dazubekomme.
- speaker: Frau Adamu
  text: Sonntagvormittag wäre für uns in Ordnung, da sind wir sowieso draußen.
- speaker: Herr Simon
  text: Dann sagen wir sonntags von elf bis zwölf.
- speaker: Frau Vogt
  text: Gut. Ich halte das schriftlich fest und hänge es aus, damit alle es wissen.
    Wenn es wieder Beschwerden gibt, reden wir noch einmal.
- speaker: Frau Adamu
  text: Und wenn Sie einmal länger proben müssen, klingeln Sie einfach vorher bei
    uns.
- speaker: Herr Simon
  text: Das mache ich. Danke, dass Sie so entgegenkommend sind.
