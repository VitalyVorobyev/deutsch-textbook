id: ls-gespraech-steuern-01
level: B1
title:
  en: Taking the floor back
  ru: Вернуть себе слово
  uk: Повернути собі слово
scenario: 'Kurze Besprechung zu dritt: jemand eröffnet den Beitrag, wird unterbrochen,
  bittet um das Wort zurück, gibt es weiter und schließt ab'
duration_seconds: 68
speakers:
- Frau Engel
- Herr Petersen
- Frau Ilić
transcript:
- speaker: Frau Engel
  text: Gut, fangen wir an. Herr Petersen, Sie wollten kurz etwas zum Urlaubsplan
    sagen.
- speaker: Herr Petersen
  text: 'Ja, danke. Ich habe einen Vorschlag: Wir tragen unseren Urlaub ab jetzt alle
    in einen gemeinsamen Kalender ein. Dann sieht man zum Beispiel …'
- speaker: Frau Ilić
  text: 'Entschuldigung, wenn ich kurz unterbreche: Gilt das auch für den Sommer?
    Ich habe meinen Urlaub schon beantragt.'
- speaker: Herr Petersen
  text: Moment, dazu komme ich gleich. Darf ich den Gedanken noch zu Ende bringen?
- speaker: Frau Ilić
  text: Natürlich, entschuldigen Sie.
- speaker: Herr Petersen
  text: 'Also, im Kalender sieht man dann sofort, wer im August fehlt. Und zu Ihrer
    Frage, Frau Ilić: Was schon beantragt ist, bleibt so. Sie wollten noch etwas sagen?'
- speaker: Frau Ilić
  text: Ja, danke. Übrigens wäre es praktisch, wenn der Kalender auch auf dem Handy
    funktionieren würde.
- speaker: Herr Petersen
  text: Gute Idee, das prüfe ich. Damit bin ich mit meinem Punkt fertig.
- speaker: Frau Engel
  text: 'Danke, Herr Petersen. Dann halten wir fest: Ab nächster Woche tragen alle
    ihren Urlaub in den gemeinsamen Kalender ein.'
