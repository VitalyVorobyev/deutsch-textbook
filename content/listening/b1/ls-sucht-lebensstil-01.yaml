id: ls-sucht-lebensstil-01
level: B1
title:
  en: Trying to quit again
  ru: Снова бросить
  uk: Знову кинути
scenario: 'Zwei Bekannte sprechen über das Aufhören: die eine erzählt, was sie versucht
  hat, die andere rät vorsichtig und ohne Vorwurf'
duration_seconds: 63
speakers:
- Miriam
- Sabine
transcript:
- speaker: Miriam
  text: Du hast ja gar keine Zigarette in der Hand, Sabine. Hast du aufgehört?
- speaker: Sabine
  text: Ich versuche es zum vierten Mal. Einmal mit Pflaster, einmal ganz ohne Hilfe.
    Nach zwei Wochen habe ich immer wieder angefangen.
- speaker: Miriam
  text: Das kenne ich. Ich will dir keine Vorwürfe machen. Aber wenn ich du wäre,
    würde ich mich beraten lassen. Mir hat das sehr geholfen.
- speaker: Sabine
  text: Beraten lassen? So schlimm ist es doch nicht. Das ist ja keine Sucht wie Alkohol.
- speaker: Miriam
  text: Doch, Rauchen ist auch eine Sucht. Das hat nichts damit zu tun, dass jemand
    schwach ist.
- speaker: Sabine
  text: Und was hast du anders gemacht?
- speaker: Miriam
  text: Ich habe eine Zeit lang den Kaffee am Morgen sein lassen. Zum Kaffee habe
    ich nämlich immer geraucht.
- speaker: Sabine
  text: Bei mir sind es die Pausen. Wenn ich nicht jeden Tag mit den Kollegen rauchen
    würde, wäre es viel leichter.
- speaker: Miriam
  text: Dann geh in der Pause doch mit einem Nichtraucher spazieren. Und wenn es diesmal
    nicht klappt, versuchst du es eben noch einmal.
