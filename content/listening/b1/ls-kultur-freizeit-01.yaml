transcript:
- speaker: Frau Simon
  text: Kulturzentrum am Markt, Simon, guten Tag.
- speaker: Herr Okafor
  text: Guten Tag. Ich interessiere mich für Ihr Programm am Wochenende. Was gibt
    es am Freitag?
- speaker: Frau Simon
  text: Am Freitag spielt eine Band im großen Saal. Das Konzert beginnt um acht, aber
    der Saal ist schon ab sieben offen. Karten kosten zwölf Euro, mit Ermäßigung acht.
- speaker: Herr Okafor
  text: Gibt es die Ermäßigung auch für Studierende?
- speaker: Frau Simon
  text: Ja, mit Studentenausweis. Am Samstag liest außerdem eine Autorin aus ihrem
    neuen Buch. Das ist kostenlos, aber Sie müssen sich vorher anmelden, weil der
    Raum klein ist.
- speaker: Herr Okafor
  text: Und bis wann kann ich mich anmelden?
- speaker: Frau Simon
  text: Bis Freitagmittag, telefonisch oder auf unserer Internetseite.
- speaker: Herr Okafor
  text: Dann nehme ich zwei Karten mit Ermäßigung für Freitag und melde mich gleich
    für Samstag an.
