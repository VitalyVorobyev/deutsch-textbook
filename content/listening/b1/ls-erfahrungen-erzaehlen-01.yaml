id: ls-erfahrungen-erzaehlen-01
level: B1
title:
  en: An interview about a difficult time
  ru: Интервью о трудном периоде
  uk: 'Розмова про важкий період'
scenario: Interview über eine schwierige, aber erfolgreiche Erfahrung
duration_seconds: 47
speakers:
- Interviewer
- Dilan
transcript:
- speaker: Interviewer
  text: Welche Erfahrung war für Sie besonders schwierig?
- speaker: Dilan
  text: Vor zwei Jahren bin ich allein nach Deutschland gezogen. Zuerst kannte ich
    niemanden und verstand im Alltag nur wenig. Besonders schwierig war die Wohnungssuche.
- speaker: Interviewer
  text: Was hat Ihnen damals geholfen?
- speaker: Dilan
  text: Ich besuchte einen Sprachkurs und lernte dort eine Nachbarin kennen. Nachdem
    sie meine Unterlagen geprüft hatte, half sie mir bei mehreren Bewerbungen.
- speaker: Interviewer
  text: Wann änderte sich die Situation?
- speaker: Dilan
  text: Der Wendepunkt kam nach drei Monaten. Ich bekam eine kleine Wohnung und fand
    gleichzeitig eine Teilzeitstelle.
- speaker: Interviewer
  text: Wie denken Sie heute über diese Zeit?
- speaker: Dilan
  text: Die ersten Wochen waren anstrengend, aber ich habe es geschafft. Die Erfahrung
    zeigte mir, dass ich früher um Hilfe bitten sollte.
