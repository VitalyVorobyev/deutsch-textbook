id: ls-gesellschaft-zusammenleben-01
level: B1
title:
  en: The house meeting about the courtyard
  ru: Собрание жильцов о дворе
  uk: Збори мешканців щодо двору
scenario: Hausversammlung über die Nutzung des gemeinsamen Hofs — Spielplatz, Parkplätze
  oder Garten
duration_seconds: 72
speakers:
- Frau Hartmann
- Herr Yilmaz
- Frau Brandt
transcript:
- speaker: Frau Hartmann
  text: 'Guten Abend. Danke, dass so viele zur Versammlung gekommen sind. Heute geht
    es um den Hof: Spielplatz, Parkplätze oder Garten.'
- speaker: Herr Yilmaz
  text: Ich bin für Parkplätze. Jeder sucht abends eine halbe Stunde, und die Straße
    ist immer voll.
- speaker: Frau Brandt
  text: Da habe ich einen Einwand. Parkplätze nutzen nur einige von uns, einen Spielplatz
    die ganze Gemeinschaft, auch die Kinder aus dem Nachbarhaus.
- speaker: Herr Yilmaz
  text: Obwohl ich keine Kinder habe, verstehe ich das. Trotzdem brauchen wir eine
    Lösung für die Autos.
- speaker: Frau Hartmann
  text: Was halten Sie von einem Kompromiss? Vorn zwei Parkplätze, hinten, wo jetzt
    die Mülltonnen stehen, ein kleiner Spielplatz.
- speaker: Herr Yilmaz
  text: Zwei Parkplätze sind nicht viel, aber besser als keine. Damit bin ich einverstanden.
- speaker: Frau Brandt
  text: Und der Garten?
- speaker: Frau Hartmann
  text: 'Dafür ist leider kein Platz mehr. Dann stimmen wir ab: Wer ist für den Kompromiss?'
- speaker: Frau Brandt
  text: Schade. Aber für die Kinder ist der Spielplatz wichtiger. Ich bin auch dafür.
- speaker: Frau Hartmann
  text: Das ist die Mehrheit. Alles, was wir heute beschlossen haben, schicke ich
    Ihnen per E-Mail.
