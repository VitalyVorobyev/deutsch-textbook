id: ls-informationen-vermitteln-01
level: B1
title:
  en: A message at the door
  ru: Сообщение у двери
  uk: Повідомлення біля дверей
scenario: 'Nachricht an der Wohnungstür: ein Termin rückt, der Schlüssel bekommt eine
  eigene Frist, die Uhrzeit bleibt'
duration_seconds: 51
speakers:
- Herr Becker
- Frau Nguyen
transcript:
- speaker: Herr Becker
  text: Guten Tag, Frau Nguyen. Entschuldigen Sie die Störung. Wohnt Herr Wolf nicht
    auch bei Ihnen?
- speaker: Frau Nguyen
  text: Ja, Jan ist mein Mitbewohner, aber er ist bis morgen verreist. Kann ich ihm
    etwas ausrichten?
- speaker: Herr Becker
  text: Gern. Der Techniker für die Heizung kommt nicht am zwölften, sondern schon
    am zehnten. Die Hausverwaltung hat das heute früh mitgeteilt.
- speaker: Frau Nguyen
  text: Am zehnten, also zwei Tage früher. Und die Uhrzeit?
- speaker: Herr Becker
  text: 'Die bleibt: zwischen neun und zwölf Uhr. Aber Herr Wolf hat doch den Kellerschlüssel.
    Den muss er bis zum neunten bei Frau Kraus im Erdgeschoss abgeben.'
- speaker: Frau Nguyen
  text: 'Ich wiederhole mal: Der Termin ist am zehnten statt am zwölften, die Zeit
    bleibt, und der Schlüssel muss bis zum neunten zu Frau Kraus.'
- speaker: Herr Becker
  text: Genau so. Vielen Dank!
