id: ls-reisen-probleme-01
level: B1
title:
  en: Claiming after a missed connection
  ru: Компенсация за пропущенную пересадку
  uk: 'Компенсація за пропущену пересадку'
scenario: Kundendienstgespräch nach einer Reiseunterbrechung
duration_seconds: 73
speakers:
- Frau Kraus
- Mitarbeiter
transcript:
- speaker: Frau Kraus
  text: Guten Tag, ich rufe an, weil mein Zug gestern in Fulda eine Stunde stehen
    geblieben ist und ich meinen Anschluss verpasst habe.
- speaker: Mitarbeiter
  text: Das tut mir leid. Haben Sie die Fahrkarte und die Zugnummer zur Hand?
- speaker: Frau Kraus
  text: Ja, ICE sechshundertzwölf, gebucht für den ersten August, achtzehn Uhr vierzig.
- speaker: Mitarbeiter
  text: 'Danke. Ich sehe die Verspätung im System: einundsiebzig Minuten am Ziel.'
- speaker: Frau Kraus
  text: Ich musste dann ein Hotel nehmen, weil um Mitternacht nichts mehr fuhr.
- speaker: Mitarbeiter
  text: Ab sechzig Minuten bekommen Sie fünfundzwanzig Prozent des Fahrpreises zurück.
    Die Hotelkosten werden bis achtzig Euro erstattet, wenn Sie die Rechnung einreichen.
- speaker: Frau Kraus
  text: Die Rechnung war siebenundneunzig Euro.
- speaker: Mitarbeiter
  text: Dann werden achtzig davon übernommen. Bitte laden Sie die Rechnung und die
    Fahrkarte im Formular hoch.
- speaker: Frau Kraus
  text: Und wie lange dauert die Bearbeitung?
- speaker: Mitarbeiter
  text: In der Regel zwei bis drei Wochen. Sie bekommen eine Bestätigung per E-Mail,
    sobald der Antrag eingegangen ist.
- speaker: Frau Kraus
  text: Gut. Muss ich das Original der Rechnung aufheben?
- speaker: Mitarbeiter
  text: Bitte ja, bis das Geld auf Ihrem Konto ist. Danach können Sie sie wegwerfen.
provenance: data/audio-provenance/b1/ls-reisen-probleme-01.json
