transcript:
- speaker: Frau Ritter
  text: Hallo, hier ist Frau Ritter von oben. Ich erreiche Herrn Klein nicht — können
    Sie ihm etwas ausrichten?
- speaker: Nachbar
  text: Natürlich, ich sage es ihm heute Abend.
- speaker: Frau Ritter
  text: Die Handwerker kommen doch nicht am Dienstag, sondern erst am Donnerstag.
    Und er soll den Schlüssel bis Mittwoch im Büro abgeben.
- speaker: Nachbar
  text: Also Donnerstag statt Dienstag, und der Schlüssel bis Mittwoch ins Büro. Habe
    ich das richtig verstanden?
- speaker: Frau Ritter
  text: 'Genau. Die Uhrzeit bleibt, wie sie war: acht Uhr morgens.'
