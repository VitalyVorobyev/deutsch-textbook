id: ls-digitales-leben-01
level: B1
title:
  en: Two steps into the app
  ru: Два шага к приложению
  uk: Два кроки до застосунку
scenario: 'Anruf bei der Bibliothekshilfe: zwei Schritte zur Anmeldung in der Lese-App'
duration_seconds: 57
speakers:
- Herr Lange
- Frau Petrović
transcript:
- speaker: Herr Lange
  text: Stadtbibliothek, Hilfe für die Lese-App, Lange am Apparat.
- speaker: Frau Petrović
  text: Guten Tag. Ich möchte E-Books leihen, aber die Anmeldung in der App funktioniert
    nicht.
- speaker: Herr Lange
  text: Das schaffen wir. Es sind nur zwei Schritte. Zuerst tippen Sie auf „Anmelden“
    und geben Ihre Ausweisnummer und Ihr Passwort ein. Die Nummer steht hinten auf
    Ihrem Bibliotheksausweis.
- speaker: Frau Petrović
  text: Gut, das habe ich gemacht. Und jetzt?
- speaker: Herr Lange
  text: Jetzt bekommen Sie eine E-Mail mit einem Link. Den müssen Sie innerhalb einer
    Stunde anklicken. Erst danach funktioniert die Anmeldung.
- speaker: Frau Petrović
  text: Ich sehe aber keine E-Mail.
- speaker: Herr Lange
  text: Dann schauen Sie bitte im Ordner für Werbung. Wenn sie dort auch nicht ist,
    schicke ich Ihnen den Link noch einmal.
- speaker: Frau Petrović
  text: Ah, da ist sie. Vielen Dank!
- speaker: Herr Lange
  text: Gern geschehen. Viel Spaß beim Lesen!
