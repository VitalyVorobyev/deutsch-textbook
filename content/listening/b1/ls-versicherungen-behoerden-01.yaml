id: ls-versicherungen-behoerden-01
level: B1
title:
  en: Who pays for the glasses?
  ru: Кто заплатит за очки?
  uk: Хто заплатить за окуляри?
scenario: 'Am Schalter der Krankenkasse: eine Kundin weiß nicht, ob ein Schaden versichert
  ist, fragt nach und bittet um eine schriftliche Bestätigung'
duration_seconds: 60
speakers:
- Herr Krüger
- Frau Sommer
transcript:
- speaker: Herr Krüger
  text: Guten Tag. Was kann ich für Sie tun?
- speaker: Frau Sommer
  text: Guten Tag. Meiner Tochter ist beim Schulsport die Brille kaputtgegangen. Ich
    weiß nicht, ob so ein Schaden versichert ist.
- speaker: Herr Krüger
  text: Ist das während der Sportstunde passiert?
- speaker: Frau Sommer
  text: Ja, ein Ball hat sie im Gesicht getroffen. Verletzt ist sie zum Glück nicht.
- speaker: Herr Krüger
  text: Dann sind wir leider nicht zuständig. Bei Unfällen in der Schule zahlt statt
    der Krankenkasse die Unfallkasse.
- speaker: Frau Sommer
  text: Die Unfallkasse? Muss ich dort einen Antrag stellen? Mit Behörden habe ich
    wenig Erfahrung.
- speaker: Herr Krüger
  text: Nein, den Unfall meldet die Schule. Aber sagen Sie heute noch im Sekretariat
    Bescheid. Die Schule hat dafür nur eine kurze Frist.
- speaker: Frau Sommer
  text: Gut. Könnten Sie mir bitte schriftlich geben, dass Sie nicht zahlen? Dann
    habe ich eine Bestätigung für die Schule.
- speaker: Herr Krüger
  text: Natürlich. Ich drucke Ihnen das gleich aus.
