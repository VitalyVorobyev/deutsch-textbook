id: ls-unfall-notruf-01
level: B1
title:
  en: An emergency call
  ru: Звонок в экстренную службу
  uk: Дзвінок до екстреної служби
scenario: 'Notruf 112: die Leitstelle fragt nach Adresse, Hergang und Verletzung,
  die anrufende Person antwortet knapp und bleibt am Telefon'
duration_seconds: 46
speakers:
- Leitstelle
- Anrufer
transcript:
- speaker: Leitstelle
  text: Notruf Feuerwehr und Rettungsdienst. Wo genau ist der Unfall?
- speaker: Anrufer
  text: An der Kreuzung Bahnhofstraße und Lindenweg, vor der Apotheke.
- speaker: Leitstelle
  text: Was ist passiert?
- speaker: Anrufer
  text: Ein Auto hat einen Radfahrer getroffen. Er liegt auf der Straße.
- speaker: Leitstelle
  text: Ist er verletzt? Ist er wach?
- speaker: Anrufer
  text: Ja, er spricht mit mir. Er blutet am Kopf, und sein Bein tut ihm sehr weh.
- speaker: Leitstelle
  text: Gibt es noch weitere Verletzte?
- speaker: Anrufer
  text: Nein. Der Autofahrer ist nicht verletzt.
- speaker: Leitstelle
  text: Gut. Der Krankenwagen ist unterwegs und in wenigen Minuten da. Bewegen Sie
    den Mann nicht und bleiben Sie bitte am Telefon, bis die Kollegen da sind.
- speaker: Anrufer
  text: In Ordnung, ich bleibe am Telefon.
