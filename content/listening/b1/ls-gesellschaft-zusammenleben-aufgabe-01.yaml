id: ls-gesellschaft-zusammenleben-aufgabe-01
level: B1
title:
  en: What goes into the free corner of the courtyard
  ru: Что поставить в свободном углу двора
  uk: Що поставити у вільному куті подвір'я
scenario: 'Versammlung im Hof hinter Lenas Haus: Tisch, Kisten für Blumen oder ein
  Dach für Fahrräder — Frau Kern hat einen Einwand, Lena schlägt einen Kompromiss
  vor'
duration_seconds: 77
speakers:
- Lena
- Frau Kern
- Nachbar
transcript:
- speaker: Lena
  text: 'Guten Abend! Heute geht es um die freie Ecke im Hof. Es gibt drei Ideen:
    einen Tisch mit Bänken, Kisten für Blumen und Gemüse oder ein Dach für Fahrräder.'
- speaker: Nachbar
  text: Ich bin für das Dach. Die Räder stehen jetzt im Treppenhaus. Wir brauchen
    einen Platz, wo sie trocken bleiben.
- speaker: Lena
  text: Und der Tisch? Frau Kern, was meinen Sie?
- speaker: Frau Kern
  text: Ach, Kind, da habe ich einen Einwand. Ein Tisch bedeutet Lärm am Abend, und
    du weißt ja, ich stehe immer früh auf.
- speaker: Lena
  text: Das verstehe ich, Frau Kern. Trotzdem sehe ich das anders, weil viele im Sommer
    gern draußen sitzen.
- speaker: Nachbar
  text: Da hat Frau Kern aber recht. Abends hört man im Hof jedes Wort.
- speaker: Lena
  text: Wie wäre es, wenn wir beides machen? Das Dach kommt in die Ecke, und den Tisch
    könnten wir neben die Bank stellen, weiter weg von Ihrem Fenster. Ab neun Uhr
    ist dann Ruhe.
- speaker: Frau Kern
  text: Ab neun? Also gut. Ruhe am Abend ist alles, was ich brauche.
- speaker: Lena
  text: Ist jemand dagegen? Niemand. Dann machen wir es so. Über die Kisten sprechen
    wir im Frühling.
