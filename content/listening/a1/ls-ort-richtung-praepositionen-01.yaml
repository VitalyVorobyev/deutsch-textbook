id: ls-ort-richtung-praepositionen-01
level: A1
title:
  en: Where are you right now?
  ru: Где ты сейчас?
  uk: Де ти зараз?
scenario: 'Am Telefon: jemand erzählt, wohin er heute noch muss, wo er gerade ist
  und woher er kommt'
duration_seconds: 42
speakers:
- Tom
- Lisa
transcript:
- speaker: Tom
  text: Hallo Lisa! Wo bist du gerade?
- speaker: Lisa
  text: Ich bin im Supermarkt. Ich kaufe Brot und Milch.
- speaker: Tom
  text: Kommst du heute noch zu mir?
- speaker: Lisa
  text: Ja, aber später. Zuerst gehe ich zur Post und dann zum Arzt.
- speaker: Tom
  text: Zum Arzt? Bist du krank?
- speaker: Lisa
  text: Nein, ich habe nur einen Termin. Und woher kommst du gerade?
- speaker: Tom
  text: Ich komme aus dem Park. Ich war dort mit meinem Sohn. Jetzt bin ich an der
    Haltestelle.
- speaker: Lisa
  text: Gut. Ich nehme dann den Bus. Bis sieben bei dir!
- speaker: Tom
  text: Bis dann!
