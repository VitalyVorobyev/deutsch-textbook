transcript:
- speaker: Verkäuferin
  text: Guten Morgen! Was darf es sein?
- speaker: Kunde
  text: Ich möchte ein Kilo Äpfel und zwei Kilo Kartoffeln.
- speaker: Verkäuferin
  text: Gern. Die Äpfel kosten drei Euro, die Kartoffeln zwei Euro fünfzig.
- speaker: Kunde
  text: Haben Sie auch Tomaten?
- speaker: Verkäuferin
  text: Ja, aber nur noch wenige. Ein Pfund kostet zwei Euro.
- speaker: Kunde
  text: Dann nehme ich ein Pfund Tomaten. Das ist alles.
- speaker: Verkäuferin
  text: Zusammen sind das sieben Euro fünfzig.
