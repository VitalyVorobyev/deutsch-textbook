transcript:
- speaker: Maklerin
  text: Hier ist die Wohnung. Sie hat drei Zimmer.
- speaker: Interessent
  text: Wie groß ist die Küche?
- speaker: Maklerin
  text: Die Küche ist klein, aber das Wohnzimmer ist sehr groß.
- speaker: Interessent
  text: Gibt es einen Balkon?
- speaker: Maklerin
  text: Ja, der Balkon ist hinten. Das Bad hat ein Fenster.
- speaker: Interessent
  text: Und was kostet die Wohnung?
- speaker: Maklerin
  text: Sechshundert Euro im Monat, ohne Heizung.
- speaker: Interessent
  text: Das ist nicht teuer. Ich nehme sie.
