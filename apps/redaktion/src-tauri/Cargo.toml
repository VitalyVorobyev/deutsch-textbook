[package]
name = "deutsch-atlas-redaktion"
version = "0.4.0"
description = "Redaktion — local editorial workbench for Deutsch-Atlas"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
