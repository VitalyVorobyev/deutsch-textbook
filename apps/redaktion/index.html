<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redaktion · Deutsch-Atlas</title>
    <script>
      // Pre-paint, like the learner app's Base.astro: a theme that flashes is worse than one
      // that is wrong. Local-only tool, so localStorage is the whole persistence story.
      try {
        const saved = localStorage.getItem('da:redaktion-theme');
        const dark = saved === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body class="bg-surface text-ink">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
