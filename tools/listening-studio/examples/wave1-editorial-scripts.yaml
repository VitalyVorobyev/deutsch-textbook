# AI-assisted editorial drafts for local assessment. These are not human-approved curriculum text.
ls-erste-schritte-01:
  - [Sprecher 1, "Guten Tag. Hier ist das Bürgerbüro. Wie kann ich Ihnen helfen?"]
  - [Sprecher 2, "Guten Tag. Ich brauche einen Termin. Unter welcher Nummer kann ich Sie morgen anrufen?"]
  - [Sprecher 1, "Unsere Telefonnummer ist null drei null, acht vier zwei, sechs eins neun."]
  - [Sprecher 2, "Also: null drei null, acht vier zwei, sechs eins neun?"]
  - [Sprecher 1, "Ja, genau. Wir sind ab neun Uhr erreichbar."]

ls-menschen-familie-01:
  - [Sprecher 1, "Hallo Lea, hier ist Mila. Ich bin heute bei meiner Familie. Neben mir sitzt mein Bruder Jonas. Er ist achtzehn und studiert in Köln. Meine Schwester Anna arbeitet heute. Am Abend kommen auch meine Eltern. Dann essen wir alle zusammen. Bis morgen!"]

ls-alltag-zeit-01:
  - [Sprecher 1, "Hallo Tom, hier ist Sara. Unser Plan für morgen hat sich geändert. Wir treffen uns nicht um acht Uhr, sondern um halb neun am Bahnhof. Zuerst kaufen wir die Fahrkarten. Um neun Uhr fährt der Zug. Bitte ruf mich heute Abend noch einmal an. Bis dann!"]

ls-stadt-wege-01:
  - [Sprecher 1, "Entschuldigung, wie komme ich zum Bahnhof?"]
  - [Sprecher 2, "Gehen Sie diese Straße geradeaus bis zur Ampel. Dort gehen Sie links."]
  - [Sprecher 1, "Und dann?"]
  - [Sprecher 2, "Nach der Apotheke gehen Sie rechts. Der Bahnhof ist gegenüber dem großen Hotel."]
  - [Sprecher 1, "Vielen Dank!"]

ls-freizeit-koennen-01:
  - [Sprecher 1, "Hast du heute Zeit? Wir können schwimmen gehen."]
  - [Sprecher 2, "Heute kann ich nicht schwimmen. Mein Arm tut weh. Aber wir können uns im Park treffen."]
  - [Sprecher 1, "Gute Idee. Kannst du um fünf Uhr kommen?"]
  - [Sprecher 2, "Ja. Wir treffen uns um fünf Uhr am Eingang."]

ls-termine-vereinbaren-01:
  - [Sprecher 1, "Praxis Doktor Klein, guten Tag."]
  - [Sprecher 2, "Guten Tag. Ich möchte einen Termin vereinbaren."]
  - [Sprecher 1, "Am Dienstag um zehn Uhr wäre etwas frei."]
  - [Sprecher 2, "Da muss ich arbeiten. Geht es am Mittwoch am Nachmittag?"]
  - [Sprecher 1, "Ja, um vierzehn Uhr dreißig."]
  - [Sprecher 2, "Das passt. Dann komme ich am Mittwoch um halb drei. Vielen Dank."]

ls-reisen-verkehr-01:
  - [Sprecher 1, "Achtung am Gleis sieben. Der Regionalexpress nach Hamburg fährt heute nicht um sechzehn Uhr zehn, sondern um sechzehn Uhr fünfundzwanzig. Der Zug fährt außerdem abweichend von Gleis neun. Reisende nach Hamburg gehen bitte zu Gleis neun."]

ls-gesundheit-arzttermin-01:
  - [Sprecher 1, "Guten Morgen. Sie haben um elf Uhr einen Termin bei Frau Doktor Weber."]
  - [Sprecher 2, "Ja. Muss ich noch etwas vorbereiten?"]
  - [Sprecher 1, "Bitte füllen Sie zuerst dieses Formular aus. Trinken Sie vorher nichts außer Wasser. Danach warten Sie im zweiten Stock vor Zimmer zwölf."]
  - [Sprecher 2, "Soll ich gleich nach oben gehen?"]
  - [Sprecher 1, "Nein, geben Sie mir zuerst das Formular. Dann rufe ich Sie auf."]

ls-arbeit-beruf-01:
  - [Sprecher 1, "Mira, bitte prüfe heute zuerst die neue Lieferung."]
  - [Sprecher 2, "Soll ich nur die Kartons zählen?"]
  - [Sprecher 1, "Zähle die Kartons und vergleiche die Nummern mit der Liste. Beschädigte Pakete stellst du neben die Tür."]
  - [Sprecher 2, "Wann muss alles fertig sein?"]
  - [Sprecher 1, "Bis zwölf Uhr. Danach schickst du mir ein Foto von der ausgefüllten Liste."]

ls-lernen-verstehen-01:
  - [Sprecher 1, "Öffnen Sie bitte das Kursbuch auf Seite vierunddreißig. Lesen Sie zuerst die Aufgabe zwei. Danach hören Sie den Dialog zweimal und markieren die richtigen Sätze."]
  - [Sprecher 2, "Entschuldigung, ich habe den letzten Schritt nicht verstanden. Können Sie das bitte noch einmal erklären?"]
  - [Sprecher 1, "Natürlich. Nach dem Hören vergleichen Sie Ihre Antworten mit Ihrer Partnerin. Erst danach öffnen Sie die Lösung."]
  - [Sprecher 2, "Danke, jetzt verstehe ich die Aufgabe."]

ls-erfahrungen-erzaehlen-01:
  - [Sprecher 1, "Welche Erfahrung war für Sie besonders schwierig?"]
  - [Sprecher 2, "Vor zwei Jahren bin ich allein nach Deutschland gezogen. Zuerst kannte ich niemanden und verstand im Alltag nur wenig. Besonders schwierig war die Wohnungssuche."]
  - [Sprecher 1, "Was hat Ihnen damals geholfen?"]
  - [Sprecher 2, "Ich besuchte einen Sprachkurs und lernte dort eine Nachbarin kennen. Nachdem sie meine Unterlagen geprüft hatte, half sie mir bei mehreren Bewerbungen."]
  - [Sprecher 1, "Wann änderte sich die Situation?"]
  - [Sprecher 2, "Der Wendepunkt kam nach drei Monaten. Ich bekam eine kleine Wohnung und fand gleichzeitig eine Teilzeitstelle. Danach wurde ich viel sicherer."]
  - [Sprecher 1, "Wie denken Sie heute über diese Zeit?"]
  - [Sprecher 2, "Die ersten Wochen waren anstrengend, aber ich habe es geschafft. Die Erfahrung zeigte mir, dass ich früher um Hilfe bitten sollte."]

ls-lernen-zukunft-01:
  - [Sprecher 1, "Was ist Ihr wichtigstes berufliches Ziel für das nächste Jahr?"]
  - [Sprecher 2, "Ich möchte im Büro mehr Verantwortung übernehmen. Dafür brauche ich besseres Deutsch und mehr Erfahrung mit Kunden."]
  - [Sprecher 1, "Dann empfehle ich Ihnen einen berufsbegleitenden B2-Kurs. Der Kurs findet zweimal pro Woche am Abend statt."]
  - [Sprecher 2, "Das passt, falls ich an den anderen Tagen weiterarbeiten kann. Gibt es auch praktische Übungen?"]
  - [Sprecher 1, "Ja. Sie üben Gespräche und schreiben echte E-Mails, damit Sie das Gelernte direkt anwenden können."]
  - [Sprecher 2, "Was wäre mein nächster Schritt?"]
  - [Sprecher 1, "Melden Sie sich zuerst zur Beratung beim Kursanbieter an. Danach können Sie mit Ihrer Chefin über einen freien Kursabend sprechen."]
  - [Sprecher 2, "Gut. Ich vereinbare heute den Beratungstermin, um nächste Woche alles mit meiner Chefin zu klären."]
