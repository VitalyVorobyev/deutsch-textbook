      - id: ls-ort-richtung-praepositionen-01
        wave: 2
        purpose: model-input
        scenario: "Am Telefon: jemand erzählt, wohin er heute noch muss, wo er gerade ist und woher er kommt"
        outcomes: [weg-verstehen]
        duration_seconds: { min: 40, max: 55 }
        speakers: { min: 2, max: 2 }
