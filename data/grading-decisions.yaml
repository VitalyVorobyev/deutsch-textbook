- item: a2/adjektive-deklination:translate-der-neue-kollege
  given: "Der neue Kollege ist sehr nett."
  decision: accept
  note: "nett and freundlich are interchangeable here; register, person and tense are unchanged, and the graded adjective neue is identical. The accept list gains the rendering (revision 2)."
