    note: "Opened 2026-08-14 by the first run of `bun scripts/structures.ts`: both Goethe inventories list it, at A1 and again at A2, and no row covered it. The confusion is not the meaning — EN `this` and RU «этот» carry it — but that dieser takes the DEFINITE article's endings while a following adjective then takes the weak ones, so it belongs beside `adjektiv-bestimmt` rather than beside `genus-artikel`."

  - id: wortbildung-nomen
    strand: nominalgruppe
    track: nominalgruppe
    level: {reception: A1, production: A1}
    de: "Wortbildung beim Nomen: Komposita (Reisegruppe, Zahnarzt), Nominalisierung auf -er und -ung, feminine Formen auf -in"
    en: "Noun formation: compounds, the -er and -ung nominalisations, and the feminine -in"
    focus: [wortbildung-nomen]
    claims:
      - goethe-a1-sd1:wb-komposita-bestimmungswort
      - goethe-a1-sd1:wb-komposita-grundwort
      - goethe-a1-sd1:wb-nomen-er
      - goethe-a1-sd1:wb-nomen-in
      - goethe-a1-sd1:wb-nomen-partizip
      - goethe-a1-sd1:wb-nomen-ung
      - goethe-a2-fit2:wb-nomen-er
      - goethe-a2-fit2:wb-nomen-in
      - goethe-a2-fit2:wb-nomen-ung
      - goethe-dtz:feminine-formen
      - goethe-dtz:komposita-bestimmungswort
      - goethe-dtz:komposita-grundwort
      - goethe-dtz:nominalisierung
      - goethe-dtz:nachsilbe-chen
      - goethe-dtz:weit-zum
    note: "Wortbildung is one of the eight top-level sections of BOTH Goethe inventories and had no row at any level — the largest single hole the 2026-08-14 anchor pass found. It is not decoration: the gender of a compound comes from its last member (die Reise + der Führer → der Reiseführer), -ung nouns are feminine without exception, and a learner who can decompose reads far more than the Wortliste alone predicts. Goethe also lists the substantivised participle (der Reisende) here; this course teaches that at B1 under `adjektiv-nomen`, so the claim sits on both rows."

  - id: wortbildung-adjektiv
    strand: nominalgruppe
    track: nominalgruppe
    level: {reception: A1, production: A1}
    de: "Wortbildung beim Adjektiv: Vorsilbe un-, Nachsilben -los und -bar, Adjektivkomposita (hellblau)"
    en: "Adjective formation: the un- prefix, the -los and -bar suffixes, adjective compounds"
    focus: [wortbildung-adjektiv]
    claims:
      - goethe-a1-sd1:wb-adj-bar
      - goethe-a1-sd1:wb-adj-komposita
      - goethe-a1-sd1:wb-adj-los
      - goethe-a1-sd1:wb-adj-un
      - goethe-a2-fit2:wb-adj-los
      - goethe-a2-fit2:wb-adj-un
      - goethe-dtz:adj-komposita
      - goethe-dtz:adj-nachsilben
      - goethe-dtz:adj-vorsilbe-un
    note: "Opened with `wortbildung-nomen` and kept separate from it because the confusions differ: a noun compound asks which member carries the gender, an adjective affix asks what it does to the meaning — un- negates, -los says `ohne`, -bar says `kann …werden`. The last is also the first passive-like form a learner meets, years before the passive itself."

