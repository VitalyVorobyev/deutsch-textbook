  # — a ruling was needed before a row was. The DTZ handbook settles it from the outside: §8.4 5.1
  # files `über + Akkusativ` under **temporal**, beside während, zwischen and zu, and illustrates
  # it with a duration. Two independent published standards classify it the same way, so it is a
  # temporal preposition and it gets a row.
  #
  # NOTHING TEACHES IT YET, and this row is how that becomes visible: `bun scripts/grammar-coverage.ts`
  # now reports A2 35/38 rather than 35/37. The alternative — folding `über` into the
  # `zeitangaben-system` description — would have marked it covered by a tag no item carries for
  # this meaning, which is the self-certifying failure the whole instrument exists to prevent.
