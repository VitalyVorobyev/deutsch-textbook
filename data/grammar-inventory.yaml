      - goethe-a2-fit2:pron-reziprok
      - goethe-dtz:reziprokpronomen-sich
      - goethe-dtz:reziprokpronomen-uns
    note: "Listed at A1 and again at A2 by Goethe, with a row nowhere. It shares its FORM with the reflexive (`sich`, `uns`) and none of its meaning, which is exactly why it needs its own tag: `Wir sehen uns` is two people seeing each other, not two people seeing themselves. EN marks the difference lexically (`each other`), RU/UK with «друг друга» — neither hand supplies the German syncretism. Production is set at A2 because the reflexive paradigm it rides on is A2 here; reception is A1 because the phrase is unavoidable from the first week."

