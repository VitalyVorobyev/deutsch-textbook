# The grammar inventory the course measures itself against — the structural
# companion to data/goethe-<level>-wortliste.txt, which measures only lexis.
#
# It exists because "A1 and A2 are content-complete" was an *asserted* claim for
# months while six A2-standard structures (Infinitiv mit zu, Relativsätze,
# als/wenn, Konjunktionaladverbien, Futur I, Reflexiv im Dativ) sat undone —
# several of them scheduled to be taught in B1 units instead. A published figure
# has to be checked against content or it drifts toward flattery, so this file is
# read by `bun scripts/grammar-coverage.ts` and the point is not to be flattering.
#
# HOW A POINT IS COUNTED AS COVERED — the evidence channel is the focus-tag
# taxonomy in CLAUDE.md, exactly as the Wortliste's `~` is paid for in taught
# surface. A point is covered iff **every** tag in its `focus` list is registered
# in `focusIntroducedBy` (scripts/validate.ts) *and* is carried by at least one
# `practice` or `drill` item. Checkpoints, pretests and probes deliberately do
# not count: they test rather than teach.
#
# `reference_only: true` is for points that are real knowledge but name no
# confusion — the clock, ordinal numbers. They are paid for with `taught_in`,
# a topic or reference page that must exist. Use it sparingly: if a point can
# fail in a way worth drilling, it wants a tag, not this escape hatch.
#
# ---------------------------------------------------------------------------
# THE FOUR FIELDS THAT MAKE A ROW TRACEABLE (added 2026-08-14)
# ---------------------------------------------------------------------------
#
# `level: {reception, production}` REPLACES the old single `standard_level`.
# The published standards and this course measure different things, and one
# field could not hold both. The Goethe A1 inventory states outright that it
# governs comprehension — "Für die mündliche und schriftliche Produktion ist
# die Grammatik-Liste dagegen von untergeordneter Bedeutung" (Prüfungsziele
# A1, Seite 100) — while this is a production course. With one number, meeting
# the dative inside fixed chunks at A1 and producing the paradigm at A2 was
# indistinguishable from being a level late; twelve rows now say both. Coverage
# is measured against `production`; `reception` may never be later than it.
#
# `strand` is the grammatical system the point belongs to, one of the ten in
# `GRAMMAR_STRANDS` (packages/content/src/grammar-coverage.ts). One primary strand per row —
# overlaps (wechselpraepositionen is case *and* space) are `deepens:` edges
# across strands, so each strand stays one unambiguous A1→B1 ladder.
#
# `deepens: [point-id]` is the spiral, as data. It used to be prose inside
# `note:` on fifteen rows, and `scripts/grammar-coverage.ts` prints a note only
# when a point is NOT covered — so at 100% every one of those relations was
# unprintable. A target must exist and sit no later than this row.
#
# `claims: [<source-id>:<entry-key>]` cites `data/strukturenlisten/` — the
# external standard, machine-readable. This replaces the file-level "Sources:"
# claim that used to sit here, which named the Goethe Prüfungsziele while that
# document was not in the repo and had never been read: a claim covering every
# row and earning none of them. `bun scripts/structures.ts` now sorts every
# published entry into claimed / unclaimed / beyond. A row with no `claims:` at
# an anchored level is `beyond` the standard — legitimate (this course aims at
# B1 and follows a coursebook progression) but visible rather than assumed.
# B1 has no anchor at all until its Prüfungsziele is bought; see
# data/strukturenlisten/README.md, which names the book and what it costs.
#
# `source: [free text]` is for an authority with no machine-readable list — a
# reference grammar, a purchased handbook's page. Deliberately EMPTY today:
# every citation this repo can actually verify is a `claims:` ref, and a
# free-text source field is precisely where unearned citations accumulate.

tracks:
  - {id: satzklammer, strand: satzklammer, de: "Satzklammer und Verbposition", en: "Clause frame and verb position", order: 10}
  - {id: satzverbindung, strand: satzverbindung, de: "Satzverbindungen", en: "Clause linking", order: 20}
  - {id: kasus, strand: kasus, de: "Kasussystem", en: "Case system", order: 30}
  - {id: nominalgruppe, strand: nominalgruppe, de: "Nominalgruppe", en: "Noun phrase", order: 40}
  - {id: verbformen, strand: verbformen, de: "Verbformen und Tempus", en: "Verb forms and tense", order: 50}
  - {id: verbvalenz, strand: verbvalenz, de: "Verbvalenz", en: "Verb valency", order: 60}
  - {id: zeit, strand: zeit, de: "Zeitangaben", en: "Time expressions", order: 70}
  - {id: raum, strand: raum, de: "Raum und Richtung", en: "Space and direction", order: 80}
  - {id: negation, strand: negation, de: "Negation", en: "Negation", order: 90}
  - {id: register-pragmatik, strand: register-pragmatik, de: "Register und Pragmatik", en: "Register and pragmatics", order: 100}

