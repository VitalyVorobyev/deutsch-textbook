    note: "Beyond every source list, and opened on internal evidence: `haben-wendungen` was a registered tag drilled by A1 and A2 items with no inventory row — one of four such orphans found on 2026-08-14. It is genuinely structural rather than lexical: the noun stands with NO article, and both source languages push the copula in (EN `I am hungry`, RU «мне холодно»/«я голоден»), so the error is systematic and predicts itself across the whole family."

