  - id: koordination
    strand: satzverbindung
    track: satzverbindung
    level: {reception: A1, production: A1}
    de: "Hauptsatz + Hauptsatz mit und, oder, aber, denn — die Konjunktion besetzt keine Satzposition"
    en: "Joining two main clauses with und, oder, aber, denn — the conjunction occupies no sentence position"
    focus: [koordination-position-null]
    claims:
      - goethe-a1-sd1:satzverb-aber
      - goethe-a1-sd1:satzverb-denn
      - goethe-a1-sd1:satzverb-oder
      - goethe-a1-sd1:satzverb-und
      - goethe-a2-fit2:satzverb-aber
      - goethe-a2-fit2:satzverb-denn
      - goethe-a2-fit2:satzverb-oder
      - goethe-a2-fit2:satzverb-und
    note: "The first structural gap the 2026-08-14 anchor pass found, and the one that proves the method: `und`, `oder` and `aber` are ~-marked in data/goethe-a1-wortliste.txt — the manifest claiming the curriculum teaches them AS GRAMMAR — while no inventory row existed at any level, so the lexical and structural instruments disagreed about what A1 contains and nothing could see it. The confusion these four name is that they sit BEFORE position 1 and change nothing (❌ *Ich komme nicht, denn arbeite ich heute*), which is the whole contrast that makes A2's `weil` and `deshalb` learnable. `aber-sondern` (A2) grades a different question — which of the two adversatives a negation licenses."

