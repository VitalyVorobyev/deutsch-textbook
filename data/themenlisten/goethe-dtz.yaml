# Deutsch-Test für Zuwanderer — § 8.1 THEMEN (Prüfungshandbuch, S. 86–88)
#
# WHY THIS FILE EXISTS. `data/strukturenlisten/` measures the grammar the course teaches and
# `data/handlungslisten/` the things it lets the learner *do*. Neither can see the third question a
# language course answers: **what is it about**. A course can teach every structure the standard
# lists, cover every communicative function, and never once mention Versicherungen.
#
# WHAT THE SOURCE IS. § 8.1 prints two columns side by side: the themes of the **CEFR chapter 4.2**
# on the left, each with its sub-topics, and the **Handlungsfelder of the Rahmencurriculum** on the
# right. They are a *Gegenüberstellung* — set beside each other, not aligned row by row: the left
# column's `Arbeit / Beruf` faces both `Arbeit` and `Arbeitssuche` on the right.
#
# Only the LEFT column becomes entries. It is the theme inventory proper, and the sub-topics are the
# level at which a hole is findable — eleven top-level themes against forty-nine topics would read
# 100% and say nothing. The right column is recorded per section as `handlungsfelder:`, because it
# is the source's own pairing and inventing an alignment would be worse than recording none.
#
# MODE IS `unstated`, and deliberately so. § 8.4 says its structures must be mastered "aktiv und
# passiv"; § 8.1 says nothing of the kind — it constrains *task selection* ("kein Fachwissen oder
# ein spezifisches Weltwissen", nothing historical, nothing about politics or economics, but
# "Vertrautheit mit der Lebenswelt in Deutschland" assumed). A theme is not something one produces.
#
# ONE FOOTNOTE IS A FINDING. `Essen / Trinken` carries a superscript 1: *"Die Bedarfsrecherchen
# haben ergeben, dass das Thema im Zusammenhang mit dem Spracherwerb weniger wichtig ist."* The
# standard says food matters less for this audience than a coursebook progression suggests. It is
# transcribed on the section, not acted on.
#
# BOUNDARY (ADR 0009 / ADR 0011): labels only, in the source's own order. No example sentences and
# no Exponenten; the PDF stays local-only and gitignored.
#
# COMPLETENESS: all eleven themes of § 8.1 and all seventy sub-topics, S. 86–88 (PDF 90–92).

