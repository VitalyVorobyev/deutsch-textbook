# Deutsch-Test für Zuwanderer (DTZ) A2–B1 — Prüfungshandbuch §8.4 STRUKTUREN.
#
# WHY THIS FILE MATTERS MORE THAN THE OTHER THREE. Until it landed, B1 had no external anchor at
# all: `bun scripts/structures.ts B1` reported `anchored: false`, because Goethe's B1 Prüfungsziele
# is a book (ISBN 978-3-19-031868-1) and the free A1/A2 inventories stop below it. The DTZ handbook
# is free, is published by Goethe-Institut and telc jointly, and its §8.4 covers exactly the A2–B1
# span this course is walking. It is the anchor that was assumed not to exist.
#
# AND IT IS A PRODUCTION STANDARD. §8.4 opens: "Diese Liste enthält sprachliche Strukturen, die
# Prüfungsteilnehmende aktiv und passiv beherrschen sollen." Compare the A1 Prüfungsziele, which
# says the opposite — "Für die mündliche und schriftliche Produktion ist die Grammatik-Liste
# dagegen von untergeordneter Bedeutung" — and is why `source.mode` exists and is never assumed.
# This list governs what a candidate must PRODUCE, which is what this course trains. So
# `mode: production`, and a row claiming an entry here is claiming production, not recognition.
#
# WHAT IS COPIED, AND WHAT IS NOT. Structure labels only, in the document's own section order and
# numbering. The document's example sentences — the whole right-hand column of every table — are
# NOT reproduced, here or anywhere in this repo. Every German example in `content/` is written for
# this course. That "the exam tests `wegen` with both Dativ and Genitiv" is a fact; the sentence
# telc chose to show it with is not ours to take. Verified mechanically: `bun scripts/anchor-check.ts`
# holds every `de:` below against the extracted source text and reports anything not found in it.
#
# ---------------------------------------------------------------------------
# CUMULATIVE, NOT LEVELLED — the decision that makes this file readable
# ---------------------------------------------------------------------------
# The DTZ is one test scored to A2 *or* B1, so §8.4 assigns no level to its entries: it is the
# repertoire, and the level is decided by how well the candidate uses it. Exactly two entries are
# excepted, by a footnote on Seite 99. That is why `source.cumulative: true`, which means "every
# entry counts for every level this source declares, at or above the entry's own level" — an entry
# marked A2 is measured at A2 *and* at B1, because a structure met at A2 is still required at B1.
# Without it, encoding the list at A2 would leave B1 unanchored again, and encoding it at B1 would
# claim the DTZ says something about A2 that it does not.
#
# THE FOOTNOTE, TRANSCRIBED AS FOUND. Seite 99 carries one footnote, marked ¹, reading: "Die
# Einträge mit Sternchen gelten nur für die Niveaustufe B1." Two entries in the tables carry the
# marker — `bis + Akkusativ` and `seit + Dativ`, both in 5.1 temporal — and the marker they carry
# is a superscript numeral, not the asterisk the footnote names. The footnote is therefore
# self-inconsistent about its own glyph. Both entries are encoded `level: B1` with a `note:`,
# because the intent is unambiguous even where the typography is not, and because a source is not
# improved by being quietly corrected — it is made unverifiable.
#
# OVERVIEW VS DETAIL. The section overview on Seite 97 and the detail tables on Seiten 98–100 do
# not agree, in two ways, and neither is smoothed here:
#   - the overview lists **Modalverben** as the fourth Verb subsection; the tables number 1.3
#     *Verbvalenz* and fold modals into 1.1 Tempus and 1.2 Modus. The tables win, because they are
#     what carries the entries; `sections` follows their numbering.
#   - the overview lists a seventh top-level group **Wortbildung** (Nomen, Adjektive); the tables
#     have no group 7 and put Wortbildung inside sections 1.4, 2.4, 4.5 and 6.4. Again the tables
#     win, and the overview's seventh group has no entries of its own to lose.
#
# TWO HEADINGS THAT DO NOT MEAN WHAT THEY SAY, left as printed: 1.2 *Modus* contains the Passiv,
# which is a voice and not a mood; 6.4 *Wortbildung* contains the Konjunktionaladverbien
# (deshalb, darum, deswegen, daher, trotzdem), which are not word formation.
#
# WRAPPED ROW LABELS. Several Verb rows print a tense on one line and its qualifier on the next
# ("Präteritum" / "passiv: alle Verben, Modalverben"). Line spacing inside a table cell is uniform
# at 9 pt with 18–27 pt between cells, so the cell boundaries are recoverable and were read off the
# glyph positions rather than guessed. Two rows resisted it and say so in their own `note:`.
#
# COMPLETENESS, checked rather than felt. `bun scripts/anchor-check.ts goethe-dtz --unaccounted`
# reads every line printed inside the two label columns and lists the ones no entry accounts for.
# On 2026-08-14 that list was 71 rows and every one of them is a section heading, a bare group
# number, the running title, the Seite-99 footnote, the overview's phantom "Adjektive" group, or one
# half of a label this file transcribes whole ("Komposita – gleiches Bestimmungs-" / "wort";
# "an" / "+ Dativ"). **No printed structure label is missing.** The check is deliberately left
# noisy rather than tuned until it prints nothing: an instrument trained to be quiet is one that
# stops finding the holes it exists for.
#
# Extraction: pdftotext -f 101 -l 104 -layout dtz_pruefungshandbuch.pdf, plus -bbox-layout for the
# cell boundaries. Reference from a grammar-inventory row: `claims: [goethe-dtz:<key>]`.

source:
  id: goethe-dtz
  title: "Deutsch-Test für Zuwanderer A2·B1 — Prüfungshandbuch"
  publisher: "Goethe-Institut e.V. und telc GmbH"
  edition: "2009 (Perlmann-Balme, Plassmann, Zeidler)"
  chapter: "8 Sprachliche Inventare — 8.4 Strukturen"
  pages: "97–100"
  # Which PDF pages hold those printed pages, for `bun scripts/anchor-check.ts` — declared
  # outright, because a linear offset does not survive a two-up scan.
  pdf_pages: "101–104"
  # Where §8.4's tables print their LABEL columns, in PDF points, for `--unaccounted`. Measured
  # from a line-start histogram, not guessed: left labels cluster at x≈63 and their examples at
  # x≈178, right labels at x≈325 (with the case column at x≈371) and theirs at x≈441.
  label_columns: [[44, 70], [305, 380]]
  levels: [A2, B1]
  cumulative: true
  status: current
  audience: "Erwachsene Zugewanderte"
  mode: production
  url: "https://www.goethe.de/resources/files/pdf209/dtz_pruefungshandbuch.pdf"
  local: "docs/GeotheInstitute/dtz_pruefungshandbuch.pdf"
  retrieved: "2026-08-14"

