# Schubert-Verlag · Erkundungen B2, integriertes Kurs- und Arbeitsbuch — the grammar sections of
# its table of contents.
#
# WHAT THIS IS, AND WHAT IT IS NOT. A third B2 syllabus beside the Goethe-Institut's online course
# and Aspekte neu B2: the contents pages a publisher offers as a free download for a coursebook
# that leads to the Goethe-Zertifikat B2. It is one course's choice of what to teach, so
# `source.kind: syllabus`, and `bun scripts/structures.ts B2` reports it in counts, never as a
# percentage (ADR 0024, ADR 0025).
#
# THE TABLE. Page 2 of the PDF is the Inhaltsverzeichnis: eight chapters, each with Teil A (texts
# and themes), Teil B (optional), Teil C (grammar exercises) and Teil D (review). Only the Teil C
# headings are transcribed, in the document's order, one section per chapter. Pages 3 to 5 repeat
# the grammar per chapter in a Kursübersicht beside "Sprachliche Handlungen" and "Wortschatz"
# lines; those are lesson-specific (a Handlung there is "eine Städtetour planen") and anchor
# nothing. Where the Kursübersicht words a structure more fully than Teil C does, Teil C stands:
# it is the list the book's own exercises follow.
#
# THIS SYLLABUS REPEATS B1. The book opens with past tenses, modal verbs and adjective declension,
# and names the n-declension and comparison. An entry here that an A1–B1 inventory row already
# owns is revision in this book and is not a B2 structure of this course.
#
# MODE IS `unstated`.
#
# BOUNDARY (ADR 0009 / ADR 0004): labels only, in the source's own order. No module titles, no
# can-do lines, no example sentences.
#
# Extraction: pdftotext -layout docs/GeotheInstitute/schubert_erkundungen_b2_inhalt.pdf -
# Reference from a grammar-inventory row: `claims: [schubert-erkundungen-b2:<key>]`.
#
