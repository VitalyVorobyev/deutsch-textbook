# Goethe-Zertifikat A2 · Fit in Deutsch 2 — the official GRAMMAR inventory at A2.
#
# The A2 counterpart of goethe-a1-sd1.yaml. Same copying boundary: structure labels only, in the
# document's own section order, no example sentences reproduced.
#
# WHICH A2 DOCUMENT THIS IS, AND WHY IT MATTERS. Goethe publishes two A2 exams — *Fit in Deutsch
# 2* for Jugendliche and *Goethe-Zertifikat A2* for Erwachsene. This is the Jugendliche one,
# because its Prüfungsziele is the A2 grammar inventory that is freely downloadable. The adult
# A2 Prüfungsziele is not free and is NOT among the local materials, so no row here may be read
# as "the adult A2 exam requires this". The two exams certify the same CEFR level and the
# structural inventory is expected to be near-identical; the *domains* differ (school and family
# rather than work and Ämter), which affects lexis far more than structure. Where an inventory
# row in data/grammar-inventory.yaml rests on this source alone, that is worth knowing, and the
# `source:` field records it per row rather than in a blanket claim.
#
# THE OLDER *START DEUTSCH 2* LIST is a third, retired source with a wider structure set (Passiv,
# während + Genitiv, the full Wechselpräposition series, Präteritum of the modals). It is
# encoded separately in goethe-start-deutsch-1-2.yaml, because a retired exam's list is evidence
# of a level's shape but not a current requirement, and mixing the two would make a row's
# authority unreadable — which is exactly the defect this whole directory exists to end.
#
# READING MODE. Unlike the A1 booklet, this document states no reception-first caveat for its
# inventory, so `source.mode: unstated` rather than an assumption in either direction.
#
# TWO ERRORS IN THE SOURCE, transcribed as printed and flagged in `note:` rather than silently
# corrected: `zu + Akkusativ` under lokale Präpositionen (zu governs the dative — the document's
# own example is dative), and `irrogativ` for `interrogativ`. A source is not improved by being
# quietly fixed; it is made unverifiable.
#
# Extraction: pdftotext -layout docs/GeotheInstitute/Pruefungsziele_Testbeschreibung_A2_Fit2.pdf -
# Reference from a grammar-inventory row: `claims: [goethe-a2-fit2:<key>]`.

