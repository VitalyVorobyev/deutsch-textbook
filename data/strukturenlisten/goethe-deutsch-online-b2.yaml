# Goethe-Institut · Deutsch Online B2, Inhalt Kapitel 1 bis 12 — the grammar column.
#
# WHAT THIS IS, AND WHAT IT IS NOT. No free, formal B2 grammar inventory exists. The
# Goethe-Zertifikat B2 Prüfungsziele (§ 4.4) delegates grammar and vocabulary to *Profile deutsch*,
# a purchased book this course does not hold and will not buy; the telc Deutsch B2
# Lernzielbeschreibung (2019, § 4) declines to list either; and the BAMF Lernzielkatalog for the
# Berufssprachkurse states that its goals give no grammatical or lexical progression. This file is
# therefore the nearest thing the exam's own issuer publishes free: the table of contents of the
# Goethe-Institut's B2 online course, whose fourth column names the grammar of each lesson.
#
# IT IS A SYLLABUS, so `source.kind: syllabus`. A syllabus is one course's choice of what to teach,
# not a statement of what an exam requires, and `bun scripts/structures.ts B2` reports it as
# counts, never as a percentage (ADR 0024). An entry here is evidence that the Goethe-Institut
# teaches the structure at B2. Its absence here is evidence of nothing: the reference-grammar
# scope of B2 is wider, and docs/curriculum/b1-b2.md names what this course adds beyond it.
#
# THE TABLE. Seven pages; pages 2–7 hold one table per two chapters with the columns
# Sprachhandlungen, Themen und Texte, Wortschatz, Grammatik and a narrow Aussprache column. Only
# the Grammatik column is transcribed, in the document's order, one section per chapter. Twelve
# chapters of three lessons; a lesson with an empty Grammatik cell contributes no entry, which is
# why the sections hold two or three entries each. The other columns are lesson-specific
# (a Sprachhandlung there is "understand statements about chatbots") and anchor nothing.
#
# ONE LABEL IS CUT OFF IN THE SOURCE. The cell on page 7 prints "Wiederholung: Fragewörter wo(r)
# und Präpositionalpronomen d" and the table's edge ends it there. `de` completes it to da(r),
# the only reading the grammar allows, and `printed` records what the page says.
#
# MODE IS `unstated`. The course trains all four skills and the column says nothing about whether
# a structure is to be understood or produced.
#
# BOUNDARY (ADR 0009 / ADR 0004): labels only, in the source's own order. No lesson texts, no
# example sentences, no wording from the other columns.
#
# Extraction: pdftotext -layout docs/GeotheInstitute/DT_online_B2_Inhalt_1-12_de.pdf -
# Reference from a grammar-inventory row: `claims: [goethe-deutsch-online-b2:<key>]`.

