# Ernst Klett Sprachen · Aspekte neu B2, Lehrbuch — the grammar labels of its table of contents.
#
# WHAT THIS IS, AND WHAT IT IS NOT. A second B2 syllabus beside the Goethe-Institut's online
# course (goethe-deutsch-online-b2.yaml): the contents pages a publisher offers as a free download
# for a coursebook that prepares for the Goethe-Zertifikat B2, telc Deutsch B2 and ÖSD B2. It is
# one course's choice of what to teach, so `source.kind: syllabus`, and `bun scripts/structures.ts
# B2` reports it in counts, never as a percentage (ADR 0024, ADR 0025). Two syllabi that name the
# same structure show common teaching practice at the level. Neither says what an exam requires.
#
# THE TABLE. Five pages, two chapters to a page, ten chapters. Each chapter has four modules; a
# module's line may end in "Grammatik: …" or "Strategie: …". Only the Grammatik labels are
# transcribed, in the document's order, one section per chapter: modules 1 and 3 carry one each,
# which is why every section holds two entries. Module titles, the can-do lines under them and the
# Strategie labels are lesson-specific and anchor nothing.
#
# THREE LABELS BREAK ACROSS A LINE in the narrow column: "Nomen-Verb-/Verbindungen",
# "Indefinit-/pronomen" and "Textzusammen-/hang". `de` joins them. The check reaches across a
# line-break hyphen by itself; `printed` records the one compound whose own hyphen ends the line.
#
# MODE IS `unstated`. The column does not say whether a structure is to be understood or produced.
#
# BOUNDARY (ADR 0009 / ADR 0004): labels only, in the source's own order. No module titles, no
# can-do lines, no example sentences.
#
# Extraction: pdftotext -layout docs/GeotheInstitute/klett_aspekte_neu_b2_inhalt.pdf -
# Reference from a grammar-inventory row: `claims: [klett-aspekte-neu-b2:<key>]`.
#
