# Goethe-Zertifikat A1 · Start Deutsch 1 — the official GRAMMAR inventory.
#
# The structural counterpart of data/goethe-a1-wortliste.txt, and the thing this repo did not
# have until 2026-08-14. The 2026-08-12 level-completeness audit recorded that "the SD1 grammar
# inventory proper (Prüfungsziele / Testbeschreibung) is not among the local materials" and
# stopped there; it is a free download from goethe.de and always was. Until then
# data/grammar-inventory.yaml was measured against nothing but itself, which is how a level
# reports 100% while its denominator is missing rows.
#
# WHAT IS COPIED HERE, AND WHAT IS NOT. Structure labels only, in the document's own section
# order — the same boundary the Wortliste manifests keep ("the official glosses and examples are
# copyrighted; all translations and examples in content/vocab/ are original"). The document's
# example sentences are NOT reproduced: every German example in this repo is original. A label
# such as "Präsens aller Verben der Wortliste" is a fact about what the exam tests.
#
# HOW THE DOCUMENT DESCRIBES ITS OWN LIST — this governs how a row may be read:
#   "Die Inventarisierung der Grammatik bezieht sich dementsprechend in erster Linie auf die
#    Aufgabenstellung im Bereich der rezeptiven Fertigkeiten […] Für die mündliche und
#    schriftliche Produktion ist die Grammatik-Liste dagegen von untergeordneter Bedeutung."
#    (Seite 100)
# An entry here is therefore a COMPREHENSION requirement at A1, not a production one. That is
# why `source.mode: reception`, and why grammar-inventory rows carry level.reception separately
# from level.production: a structure this list puts at A1 and the course produces at A2 is a
# deliberate sequencing decision, not a gap.
#
# THE ASTERISK. Two entries carry `*` in this booklet with no legend anywhere in it — a leftover
# from the older combined *Start Deutsch 1 und 2* handbook, where the legend reads "Für Start
# Deutsch 2 gelten darüber hinaus auch die mit Sternchen * gekennzeichneten Strukturen". Both are
# encoded as A2 with `note:` saying so, rather than silently resolved either way.
#
# OVERVIEW VS DETAIL. The section overview (Seite 101) lists five Adjektiv subtopics; the detail
# tables (Seite 103) specify two. The three with no detail row carry `specified: overview-only`,
# because a discrepancy inside the source is a fact about the source and must not be smoothed.
#
# Extraction: pdftotext -layout docs/GeotheInstitute/Pruefungsziele_Testbeschreibung_A1_SD1.pdf -
# Reference from a grammar-inventory row: `claims: [goethe-a1-sd1:<key>]`.

