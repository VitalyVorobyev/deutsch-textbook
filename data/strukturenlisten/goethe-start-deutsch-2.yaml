# Start Deutsch 2 (retired A2 exam) — the A2 DELTA of the combined Start-Deutsch-1-und-2
# grammar inventory.
#
# WHY A RETIRED EXAM IS IN HERE. Start Deutsch 2 was replaced by the Goethe-Zertifikat A2, and no
# row here is a current requirement — `status: retired` says so, and any grammar-inventory row
# whose only authority is this file is a row resting on a superseded standard. It is encoded
# anyway because its structure set is materially WIDER than the current free A2 list
# (goethe-a2-fit2.yaml) at exactly the points where this course has been guessing: it carries
# Passiv, `während + Genitiv`, the complete Wechselpräposition series, the Präteritum of the
# modals and the attributive adjective in the dative — five structures the course teaches, or
# defers, with no external evidence either way. A retired standard is weak evidence; no evidence
# is weaker.
#
# ONLY THE A2 DELTA IS HERE. The combined handbook's unstarred entries are the A1 list and are
# already encoded in goethe-a1-sd1.yaml, from the newer standalone A1 booklet; duplicating them
# would create two answers to "what does A1 require". The handbook's own legend defines the
# split: "Für Start Deutsch 2 gelten darüber hinaus auch die mit Sternchen * gekennzeichneten
# Strukturen" (Seite 192). Every entry below carries that asterisk in the source.
#
# Same copying boundary as its siblings: structure labels only, no example sentences.
#
# Extraction: pdftotext -layout docs/GeotheInstitute/Pruefungsziele_Testbeschreibung_A2_SD2.pdf -
# Reference from a grammar-inventory row: `claims: [goethe-start-deutsch-2:<key>]`.

