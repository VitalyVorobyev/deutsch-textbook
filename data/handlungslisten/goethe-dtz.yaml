  chapter: "8 Sprachliche Inventare — 8.2 Sprachhandlungen, 8.3 Sprachhandlungsstrategien"
  pages: "89, 95"
  pdf_pages: "93, 99"
  levels: [A2, B1]
  cumulative: true
  status: current
  audience: "Erwachsene Zugewanderte"
  mode: production
