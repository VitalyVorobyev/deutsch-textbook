# Deutsch-Test für Zuwanderer (DTZ) A2–B1 — Prüfungshandbuch §8.2 SPRACHHANDLUNGEN
# and §8.3 SPRACHHANDLUNGSSTRATEGIEN.
#
# WHAT THIS ANCHORS, AND WHY IT IS A DIFFERENT DIMENSION FROM `strukturenlisten/`. Every topic in
# `content/atlas.yaml` declares 2–5 learner-facing `outcomes` — 179 of them, each a can-do
# statement in four languages, each measured by at least one practice item. What no outcome has
# ever had is an *outside*: nothing said whether the set of can-dos this course teaches is the set
# a published standard expects, and a self-authored list of communicative goals drifts exactly the
# way a self-authored grammar list drifted. §8.2 is that outside. It is Goethe's and telc's
# enumeration of the language functions an adult migrant must be able to perform, drawn from the
# Rahmencurriculum and cross-checked there against Start Deutsch, Zertifikat Deutsch and Profile
# Deutsch — the same lineage as the CEFR's own "language functions".
#
# A grammar row and an outcome are not the same kind of thing and must not share a denominator: a
# course can teach every structure on the list and still never ask the learner to refuse an offer.
# Hence a second directory rather than more rows in the first.
#
# MODE. §8.2 opens: "Diese Liste enthält sprachliche Mittel, die es Teilnehmenden ermöglichen, in
# der schriftlichen und mündlichen Kommunikation ihre kommunikativen Ziele und Intentionen
# **produktiv** zu realisieren." So `mode: production`, like §8.4 and unlike the A1 Prüfungsziele.
#
# CUMULATIVE. §8.3 states its scope outright — "ausgewählte Beispiele, die auf beiden Niveaustufen
# – A2 und B1 – sowohl im formellen (Sie-Form) als auch im informellen Register (Du-Form) zum
# Einsatz kommen können" — and §8.2 assigns no level either. Same reading as §8.4: the whole list
# is the repertoire, measured at every declared level.
#
# ---------------------------------------------------------------------------
# THE TRANSCRIPTION DEPTH, AND WHY IT STOPS WHERE IT DOES
# ---------------------------------------------------------------------------
# Each chapter prints its inventory twice: an **overview** enumerating Bereich → Sprachhandlung
# (Seite 89 and Seite 95), then **detail pages** giving each Sprachhandlung a third level of
# sub-functions, each followed by its *Exponenten* — the ready-made phrases a candidate would
# actually say.
#
# Only the overview level is transcribed. Two reasons, and the second is the load-bearing one:
#   - the Exponenten are the booklet's authored wording, and ADR 0011's boundary is labels only;
#   - on the detail pages the third-level labels are typographically interleaved with those
#     Exponenten in a three-column layout, both in mixed-case German, with no mechanical way to
#     tell one from the other. Transcribing them would mean deciding by eye which German phrase is
#     a heading — and a denominator assembled by eye is the thing this whole layer replaced.
# The overview is the source's own complete enumeration, so nothing is lost but depth, and the
# depth that is lost is recorded here rather than silently absent.
#
# FOUR DISCREPANCIES BETWEEN OVERVIEW AND DETAIL, left as found:
#   - §8.2 overview heads the second Bereich "Realisierung von Gefühlen, Haltungen und Meinungen";
#     the detail page heads it "REALISIEREN VON GEFÜHLEN, HALTUNGEN UND MEINUNGEN".
#   - §8.3 overview lists "gemeinsames Wissen **andeuten**"; the detail block is headed
#     "Gemeinsames Wissen **ausdrücken**".
#   - §8.3 overview lists "**Vermeidung**"; the detail page has no such block and instead heads one
#     "**Ausrede**". The chapter's own introduction speaks of "Kompensations- bzw.
#     Vermeidungsstrategien", so the two are plainly the same slot, but the source never says so.
#   - §8.3 overview lists "**etwas hervorheben**" and the detail pages carry no block for it at all
#     — marked `specified: overview-only`, the same treatment the A1 Adjektiv rows get.
#
# ONE OMISSION THE SOURCE EXPLAINS ITSELF: §8.1's Handlungsfeld column includes "Umgang mit dem
# eigenen Sprachenlernen", and §8.2 leaves it out on purpose — "der eher auf die Situation im
# Unterricht bezogen ist und in dieser Form in der Prüfung nicht vorkommen wird". Two Bereiche run
# the other way and are here because the exam needs them: "Handlungsregulierung" and
# "Informationsaustausch" come from the Referenzrahmen and Threshold 1990 rather than from the
# Rahmencurriculum.
#
# Extraction: pdftotext -f 93 -l 99 -layout dtz_pruefungshandbuch.pdf.
# Reference from an atlas outcome: `claims: [goethe-dtz-handlungen:<key>]`.

source:
