  - topic: digitales-leben
    humanEditor: Vitaly Vorobyev
    legacy: false
    approvedBrief:
      curriculumSection: "B1.11"
      approvedBy: Vitaly Vorobyev
      approvedAt: "2026-08-04"
      creativeChoices:
        - "Stage the whole unit inside one continuous afternoon — setting up a city library's reading app on a new phone, hitting a fault, writing to the help desk about it, and then saying how much of the evening the phone now gets — so that the three text types the frozen contract names (Anleitung, Hilfetext, Online-Formular) are three moments of one task rather than three unrelated genre samples. PROPOSED BY THE DRAFT, NOT YET SELECTED: the contract fixes the mission, the outcomes, the genre range and the exclusions, but not this setting; a public-transport ticket app and a Bürgeramt online appointment form were the alternatives offered, and the library was chosen because it is the one setting in which the media-use outcome (reading, and how reading changed) arises from the same task as the instructions and the fault report instead of being appended to them."
        - "Treat the recycled grammar as genre evidence rather than revision. The passive appears only as the answer to why an Anleitung avoids naming a person — the step stays true whoever performs it — and sodass appears only as the clause that tells a help desk what the learner can no longer do. Neither form is re-derived; both are cross-referenced to the unit that owns them (B1.6, B1.7), which is what a genre unit that closes no grammar point is for."
        - "Name the four Erklärung subsections after tasks, not structures: reading an Anleitung step by step, filling in an Online-Formular, describing a fault and asking for help, reporting on one's own media use. Each maps to one frozen outcome or one named genre, so a learner scanning the headings sees what they will be able to do rather than what will be explained at them."
        - "Hold the IT-specialist exclusion at the level of the deck, not just the prose: every one of the 38 headwords is a word a library user rather than an administrator has to read (Taste, Feld, Netz, Akku, Kabel), and the split between the 22 productive and the 16 receptive entries falls exactly where the learner stops needing to write the word and only needs to recognise it on a screen."
        - "Make the quotable Fehlermeldung the article's one memorable teaching move: a message copied word for word can be looked up by the person reading the request, and a learner's summary of it cannot. It is the concrete reason the unit's writing outcome asks for precision rather than politeness."
    aiAssistance:
      tools:
        - "Claude Code (Claude Opus 5) — drafted the topic article, the intensive reading and the vocabulary deck"
        - "espeak-ng via `bun run gen:ipa` — generated the IPA skeleton for the 38 vocabulary entries; 19 of them were corrected by hand afterwards (compound and separable-verb secondary stress, the Software loan, vowel length in Kabel, Akku, Textnachricht and Reihenfolge)"
      role: drafting
