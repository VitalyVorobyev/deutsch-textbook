  - topic: regeln-verantwortung
    humanEditor: Vitaly Vorobyev
    legacy: false
    approvedBrief:
      curriculumSection: "B1.7"
      approvedBy: Vitaly Vorobyev
      approvedAt: "2026-07-29"
      creativeChoices:
        - "Stage every rule in everyday regulated situations — a Hausordnung, a shared building, an Amt appointment, road works — never in legal text."
        - "Teach the modal passive as the composition of two owned pieces, the A2 active modal plus B1.6's passive infinitive (Der Müll muss bis Freitag rausgebracht werden), and read the muss nicht / darf nicht split as the meaning of a regulation."
        - "Give sodass its own subsection contrasting it with A2's deshalb: adverb versus conjunction, with verb position as the entire difference."
        - "Exclude legal-obligation register, the so … dass split-position variant and the Zustandspassiv, and deepen rather than re-teach B1.6's plain passive."
