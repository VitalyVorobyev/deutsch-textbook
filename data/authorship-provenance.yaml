      creativeChoices:
        - "Build the unit as one everyday consumption mission: compare purchase choices and understand how things are made, sold and regulated, keeping abstract policy debate out."
        - "Teach the produced werden-passive through the man-alternative the learner already owns, then stage its past as a written wurde against a spoken ist … worden with the worden/geworden split named."
        - "Give je + Komparativ … desto + Komparativ its own subsection with both word orders pinned, anchored in the contract's disposal-cost example."
