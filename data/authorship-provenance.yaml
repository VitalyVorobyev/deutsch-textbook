  - topic: gesellschaft-zusammenleben
    humanEditor: Vitaly Vorobyev
    legacy: false
    approvedBrief:
      curriculumSection: "B1.10"
      approvedBy: Vitaly Vorobyev
      approvedAt: "2026-08-03"
      creativeChoices:
        - "Stage the whole unit inside one continuous situation — a Hausversammlung about what to do with an apartment building's shared Hof, where some residents want a playground, some want parking and some want a garden — so the concession, the quantifiers and the relative words all describe the same disagreement rather than disconnected example sentences. PROPOSED BY THE DRAFT, NOT YET SELECTED: the frozen contract fixes the mission (join a familiar community discussion and resolve a disagreement) and the exclusions, but not this setting; a Stadtteilfest planning meeting and a shared-garden association were the alternatives offered, and the courtyard was chosen because it is the one setting where all three grammar points arise from the situation itself rather than being imported into it."
        - "Teach obwohl against A2's trotzdem as one concession with two word orders rather than as new vocabulary: the conjunction sends the verb to the clause end, the adverb fills position 1 and pulls the verb behind it, and trotz the preposition is named as a third member that belongs to another unit's tag. This makes the unit's new point a re-reading of something the learner already produces."
        - "Teach the extended indefinites as the set that declines, in explicit contrast to A2's invariant man/jemand/niemand/etwas/nichts — with jeder's grammatical singular as the point where a plural verb slips in, because the residents of a building are exactly the context where alle, einige, manche and jeder all describe the same people from different angles."
        - "Keep the whole unit action-oriented and local. The frozen contract excludes political institutions, migration-policy content and formal debate structure; the draft holds to one building, one courtyard and one afternoon, and the compromise the learner proposes is about square metres and hours, never about principles."
    aiAssistance:
      tools:
        - "Claude Code (Claude Opus 5) — drafted the topic article, the intensive reading and the vocabulary deck"
        - "Claude Code (Claude Opus 5) — drafted the exercise sets, the three probe families, the atlas node and the focus-tag registrations"
      role: drafting
    humanReview:
      status: pending
      substantiveContributions: []
      reviewedAt: null
