  - topic: reisen-probleme
    humanEditor: Vitaly Vorobyev
    legacy: false
    approvedBrief:
      curriculumSection: "B1.8"
      approvedBy: Vitaly Vorobyev
      approvedAt: "2026-07-30"
      creativeChoices:
        - "Stage the whole unit inside one continuous disruption arc — a delayed train, a missed connection, a hotel room that is not what was booked — so the report, the complaint and the unreal wish all reference the same trip, never disconnected example sentences."
        - "Teach the Konjunktiv II paradigm as the completion of B1.3's advice chunks: haette/waere/wuerde plus the core modals as the only real forms at this level, wuerde + Infinitiv as the default for every full verb, and the unreal condition read as both halves in Konjunktiv II against A2's real wenn-condition."
        - "Teach wegen, trotz and waehrend as the genitive's everyday niche — announcements, notices, written complaints — and contrast trotz with A2's trotzdem: preposition versus adverb, one names the obstacle inside the sentence, the other defies it from the front of a new one."
        - "Exclude Konjunktiv II of full verbs beyond the core set, compensation law and formal legal register — the Beschwerde stays a personal letter with a concrete request."
    aiAssistance:
      tools:
