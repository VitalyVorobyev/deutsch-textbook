  - topic: lernen-zukunft
    humanEditor: Vitaly Vorobyev
    legacy: false
    approvedBrief:
      curriculumSection: "B1.9"
      approvedBy: Vitaly Vorobyev
      approvedAt: "2026-07-30"
      creativeChoices:
        - "Stage the whole unit inside one continuous arc — a course-counselling appointment about the learner's next German course: preparing questions for it, hearing the adviser's recommendations, and turning them into a written plan — so the purpose clauses, the falls-conditions and the ohne/statt-alternatives all reference the same decision, never disconnected example sentences."
        - "Teach damit and um … zu as one system with a single test — count the subjects: one shared subject lets the compact um … zu stand in, two different subjects force damit — and read ohne … zu and statt … zu as the same infinitive family under the same shared-subject constraint, so three of the unit's structures hang on one rule."
        - "Teach falls against A2's wenn as expectancy rather than new grammar: wenn covers the expected case and keeps its temporal reading, falls flags a genuine eventuality the plan must survive — the register of plans, applications and appointments."
        - "Exclude formal study-counselling vocabulary, Futur II and career-planning jargon — the future stays present-tense plans plus A2's werden + Infinitiv, and the Beratung stays one concrete conversation about one learner's next course."
    aiAssistance:
      tools:
